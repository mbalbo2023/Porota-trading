name: Preserve bounded G5A original frame parts
description: Upload only Source-owned post-FIN parts; no gate or contract acceptance
inputs:
  parts_root:
    description: Exact Source-generated own parts directory
    required: true
  parts_count:
    description: Source-verified finite part count, at most160
    required: true
  parts_start:
    description: Source-generated first global index in this category
    required: true
  source_sha:
    description: Exact candidate SHA
    required: true
  category:
    description: Source-fixed frames or runtime category
    required: true
runs:
  using: composite
  steps:
    - name: Preserve original frame part 000
      if: always() && fromJSON(inputs.parts_start) <= 0 && fromJSON(inputs.parts_count) > 0
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rc6-g5a-${{ inputs.category }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-000
        path: ${{ inputs.parts_root }}/part-000/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Preserve original frame part 001
      if: always() && fromJSON(inputs.parts_start) <= 1 && fromJSON(inputs.parts_count) > 1
