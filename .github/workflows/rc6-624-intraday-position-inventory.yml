name: RC6 624 continuity host read-only inventory
on:
  push:
    branches:
      - diagnostic/rc6-624-continuity-inventory-20261020
    paths:
      - .github/workflows/rc6-624-intraday-position-inventory.yml
permissions:
  contents: read
concurrency:
  group: rc6-624-readonly-ledger-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read bounded PAPER ledger and container identity
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_readonly"
          chmod 600 "$HOME/.ssh/rc6_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          timeout 40 ssh -i "$HOME/.ssh/rc6_readonly" -o BatchMode=yes             -o ConnectTimeout=10 -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             "$DO_USER@$DO_HOST" "sudo -n timeout 25 python3 -" <<'PY'
          import hashlib,json,sqlite3,time,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          db=Path('/opt/porota-trading/data/paper_v17/observer_v17.db')
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=.5)
          c.row_factory=sqlite3.Row
          c.execute('PRAGMA query_only=ON')
          c.execute('PRAGMA busy_timeout=300')
          end=time.monotonic()+12
          c.set_progress_handler(lambda:int(time.monotonic()>end),1000)
          tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'paper_%'")}
          result={'schema':'RC6_INTRADAY_PAPER_RO_V1','at':datetime.now(timezone.utc).isoformat(),
                  'observer_state':dict(c.execute("SELECT mode,real_orders_sent,process_state,session_state,heartbeat_at FROM observer_state WHERE id=1").fetchone()),
                  'tables':{}}
          for name,status in [('paper_positions','OPEN'),('paper_cauciones','OPEN'),('paper_future_positions','ACTIVE')]:
              if name not in tables: raise RuntimeError('REQUIRED_PAPER_TABLE_MISSING:'+name)
              cols=[r[1] for r in c.execute('PRAGMA table_info('+name+')')]
              rows=c.execute('SELECT * FROM '+name+' WHERE status=? LIMIT 129',(status,)).fetchall()
              if len(rows)>128: raise RuntimeError('OPEN_POSITION_BOUND:'+name)
              digest=hashlib.sha256(json.dumps([dict(r) for r in rows],sort_keys=True,default=str).encode()).hexdigest()
              result['tables'][name]={'columns':cols,'open_count':len(rows),'open_rows_sha256':digest}
          result['open_spot_fill_sides']=[dict(r) for r in c.execute("SELECT f.side,COUNT(*) AS count FROM paper_fills f JOIN paper_positions p ON p.paper_id=f.paper_id WHERE p.status='OPEN' GROUP BY f.side ORDER BY f.side")]
          result['open_spots_without_fills']=c.execute("SELECT COUNT(*) FROM paper_positions p WHERE p.status='OPEN' AND NOT EXISTS(SELECT 1 FROM paper_fills f WHERE f.paper_id=p.paper_id)").fetchone()[0]
          for name in sorted(tables & {'paper_exit_intents','paper_fills','paper_orders','paper_admin_cancellations'}):
              result['tables'][name]={'columns':[r[1] for r in c.execute('PRAGMA table_info('+name+')')]}
          c.close()
          result['owned_containers']={name:subprocess.check_output(['docker','inspect','-f','{{.State.Status}}|{{.State.Restarting}}|{{.RestartCount}}',name],text=True,timeout=3).strip() for name in ('porota_production_observer','porota_production_dashboard')}
          print(json.dumps(result,sort_keys=True))
          PY
          timeout 45 ssh -i "$HOME/.ssh/rc6_readonly" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "sudo -n timeout 30 python3 -" <<'PY'
          import json,subprocess,os,re
          from pathlib import Path
          def run(argv,timeout=4):
              try: return subprocess.check_output(argv,text=True,stderr=subprocess.DEVNULL,timeout=timeout).strip()
              except Exception as e: return 'UNVERIFIED:'+type(e).__name__
          mem={}
          for line in Path('/proc/meminfo').read_text().splitlines():
              m=re.match(r'^(MemTotal|MemAvailable|SwapTotal|SwapFree):\s+(\d+) kB',line)
              if m: mem[m[1]]=int(m[2])*1024
          disk={}
          for mount in ('/','/opt/porota-trading'):
              s=os.statvfs(mount)
              disk[mount]={'available_bytes':s.f_bavail*s.f_frsize,'free_inodes':s.f_favail}
          units=run(['systemctl','list-unit-files','--no-legend','--no-pager'],8)
          related=[line.split()[0] for line in units.splitlines() if re.search(r'ppi.*watch|watch.*ppi',line,re.I)][:30]
          ppi_units={u:{'active':run(['systemctl','is-active',u]),'enabled':run(['systemctl','is-enabled',u])} for u in related}
          timers=run(['systemctl','list-unit-files','--type=timer','--no-legend','--no-pager'],8)
          rc6_timers=[line.split()[0] for line in timers.splitlines() if re.search(r'rc6|porota',line,re.I)][:80]
          timer_states={u:{'active':run(['systemctl','is-active',u]),'enabled':run(['systemctl','is-enabled',u])} for u in rc6_timers}
          docker=run(['docker','ps','-a','--format','{{.Names}}|{{.ID}}|{{.Status}}'],8).splitlines()[:50]
          comm=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  name=(p/'comm').read_text().strip()
                  if re.search(r'ppi|watch',name,re.I): comm.append({'pid':int(p.name),'comm':name})
              except (OSError,PermissionError): pass
          root=Path('/opt/porota-trading/data/deploy')
          receipts={}
          for name in ('CURRENT_STATE_V2.json','quiescence-d96cb68d177199317ee23239553517e04ee0a255.json','rc6-resize-timer-guard-20261020.json'):
              p=root/name
              if p.is_file() and not p.is_symlink() and p.stat().st_size<65536:
                  obj=json.loads(p.read_text())
                  receipts[name]={k:obj.get(k) for k in ('candidate_sha','deploy_sha','image_id','validation_status','mode','real_orders_sent','real_order_routes','status','installation_started','market_open_suspended','open_paper_carryover','recorded_at') if k in obj}
              else: receipts[name]='UNVERIFIED_OR_ABSENT'
          print(json.dumps({'schema':'RC6_624_CONTINUITY_RO_V1','mem':mem,'disk':disk,'ppi_units':ppi_units,'ppi_process_comm':comm[:30],'rc6_timer_states':timer_states,'docker_names_id_status':docker,'receipts':receipts},sort_keys=True))
          PY
          rm -f "$HOME/.ssh/rc6_readonly"
