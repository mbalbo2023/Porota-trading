name: RC6 IOL History 365d Canary V2 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-iol-history-365d-canary-v2-20260909.yml']
permissions:
  contents: read
jobs:
  iol-canary-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/iolcanaryv2"
          chmod 600 "$HOME/.ssh/iolcanaryv2"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Run isolated official-token IOL canary
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/iolcanaryv2" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          cd "$REPO"
          RUNTIME_HEAD_PRE=$(git rev-parse HEAD)
          echo "RUNTIME_HEAD_PRE=$RUNTIME_HEAD_PRE"
          OBS_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}|{{.Config.Image}}' porota_production_observer)
          DASH_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)
          IMAGE=$(sudo -n docker inspect -f '{{.Config.Image}}' porota_production_observer)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          git fetch --no-tags origin deploy-prep/rc6-wave12-currentbase-20260909
          git cat-file -e "$TARGET_SHA^{commit}"
          TMP=$(mktemp -d "$HOME/iolcanaryv2.XXXXXX")
          cleanup(){ sudo -n docker rm -f porota_iol_canary_v2 >/dev/null 2>&1 || true; git -C "$REPO" worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"; }
          trap cleanup EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n install -d -o 1000 -g 1000 -m 0750 "$REPO/data/historical"
          ENVFILE="$TMP/iol.env"
          python3 - "$ENVFILE" <<'PY'
          from pathlib import Path
          import sys,os
          vals={}
          for raw in Path('/opt/porota-trading/.env').read_text(encoding='utf-8',errors='replace').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              k,v=line.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          user=vals.get('IOL_USERNAME','').strip(); pwd=vals.get('IOL_PASSWORD','').strip()
          print('IOL_USERNAME_PRESENT='+('YES' if bool(user) else 'NO'))
          print('IOL_PASSWORD_PRESENT='+('YES' if bool(pwd) else 'NO'))
          if not user or not pwd: raise SystemExit('IOL_DROPLET_CREDENTIALS_MISSING')
          Path(sys.argv[1]).write_text('IOL_USERNAME='+user+'\nIOL_PASSWORD='+pwd+'\n',encoding='utf-8')
          os.chmod(sys.argv[1],0o600)
          PY
          sudo -n docker run --rm -i --name porota_iol_canary_v2 --pull never \
            --user botuser --cap-drop ALL --security-opt no-new-privileges:true \
            --env-file "$ENVFILE" -e IOL_ENABLED=true -e IOL_RATE_LIMIT_SLEEP=0.50 \
            -e HIST_DB_PATH=/app/data/historical/iol_rc6_canary_365d_v2.db -e PYTHONPATH=/src \
            -v "$TMP/source:/src:ro" -v "$REPO/data:/app/data" \
            --entrypoint python "$IMAGE" - <<'PY'
          import json,sqlite3
          from rc6_iol_client_v2 import IOLClient
          import al_historical_ingest as hi
          client=IOLClient()
          if not client.enabled: raise SystemExit('IOL_CLIENT_NOT_ENABLED')
          hi.init_db()
          samples=[('GGAL','ACCIONES','bcba'),('AL30','BONOS','bcba'),('AAPL','CEDEARS','bcba'),('GFGC7200OC','OPCIONES','bcba')]
          result=[]
          for symbol,family,market in samples:
              raw=client.get_serie_historica(symbol,mercado=market,dias=365,ajustada=(family in {'ACCIONES','CEDEARS'}))
              keys=sorted(raw[0].keys()) if raw and isinstance(raw[0],dict) else []
              velas=[v for v in (hi._normalizar_fila_iol(x) for x in raw) if v]
              written=hi.guardar_velas(symbol,family,velas,'IOL',adjusted=(family in {'ACCIONES','CEDEARS'}))
              result.append({'symbol':symbol,'family':family,'raw':len(raw),'normalized':len(velas),'written':written,'keys':keys})
              if len(raw)<=0 or len(velas)<=0 or written<=0: raise SystemExit('IOL_CANARY_EMPTY_OR_UNNORMALIZED:'+symbol)
          with sqlite3.connect('/app/data/historical/iol_rc6_canary_365d_v2.db') as c:
              quick=c.execute('pragma quick_check').fetchone()[0]
              total=c.execute('select count(*) from market_historical_ohlcv').fetchone()[0]
              byfam=c.execute('select asset_class,count(distinct symbol),count(*) from market_historical_ohlcv group by asset_class order by asset_class').fetchall()
          print('IOL_CANARY_V2='+json.dumps(result,ensure_ascii=False,separators=(',',':')))
          print('IOL_HISTORY_DB_QUICK_CHECK='+quick)
          print('IOL_HISTORY_ROWS='+str(total))
          print('IOL_HISTORY_BY_FAMILY='+json.dumps(byfam,separators=(',',':')))
          assert quick=='ok' and total>0
          PY
          sudo -n chmod 0640 "$REPO/data/historical/iol_rc6_canary_365d_v2.db"
          OBS_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}|{{.Config.Image}}' porota_production_observer)
          DASH_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)
          test "$OBS_POST" = "$OBS_PRE"; test "$DASH_POST" = "$DASH_PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          RUNTIME_HEAD_POST=$(git rev-parse HEAD)
          echo "RUNTIME_HEAD_POST=$RUNTIME_HEAD_POST"
          test "$RUNTIME_HEAD_POST" = "$RUNTIME_HEAD_PRE"
          echo 'IOL_EXECUTION_CAPABILITY=NOT_USED'
          echo 'PPI_ORDER_ROUTES=NOT_CALLED'
          echo 'RUNTIME_CHANGED=NO'
          echo 'IOL_365D_CANARY_V2=GREEN'
          REMOTE
