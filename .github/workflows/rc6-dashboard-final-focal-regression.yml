name: RC6 Dashboard Final Focal Regression 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-dashboard-20261001
    paths:
      - '.github/workflows/rc6-dashboard-final-focal-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile bg_paper_dashboard.py rc6_annual_instrument_analysis.py bh_universe_dashboard_hf6.py
      - run: python -m pytest -q tests/test_rc6_dashboard_perf_guards.py tests/test_rc6_dashboard_scalping_identity_semantics.py tests/test_ws_dash_04_full_dashboard_truth.py
