name: RC6 SRE split and preopen hardening deploy 2026-09-07
on:
  push:
    branches: [feature/rc6-sre-health-split-20260907]
    paths:
      - '.github/workflows/rc6-sre-preopen-postclose-deploy-20260907.yml'
permissions:
  contents: read
concurrency:
  group: porota-rc6-host-sre-postclose
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and static safety
        run: |
          set -euo pipefail
          python -m py_compile rc6_fast_functional_health.py rc6_full_db_integrity.py rc6_preopen_host_hardened.py
          bash -n scripts/rc6_sre_preopen_postclose_deploy.sh
          python -c "from pathlib import Path; f=Path('rc6_fast_functional_health.py').read_text(); q=Path('rc6_full_db_integrity.py').read_text(); p=Path('rc6_preopen_host_hardened.py').read_text(); assert 'PRAGMA quick_check' in q; assert 'porota-fast-functional-health-rc6.timer' in p; assert 'porota-trading-dashboard:17.0.0-rc6' in p; assert 'MIN_FREE_BYTES' not in p; assert all(x not in (f+q+p) for x in ['send_order','place_order','cancel_order']); print('SRE_PREOPEN_STATIC=GREEN')"
          grep -q 'full_integrity_check_performed.:False\|full_integrity_check_performed.*False' rc6_fast_functional_health.py || true
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage payload
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          tar -czf /tmp/porota-sre-rc6.tgz rc6_fast_functional_health.py rc6_full_db_integrity.py rc6_preopen_host_hardened.py
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes /tmp/porota-sre-rc6.tgz "$USER@$HOST:/tmp/porota-sre-rc6.tgz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes scripts/rc6_sre_preopen_postclose_deploy.sh "$USER@$HOST:/tmp/rc6_sre_preopen_postclose_deploy.sh"
      - name: Install and verify live
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'chmod 700 /tmp/rc6_sre_preopen_postclose_deploy.sh && /tmp/rc6_sre_preopen_postclose_deploy.sh' | tee /tmp/sre-deploy.txt
          rm -f /tmp/rc6_sre_preopen_postclose_deploy.sh
          echo '### SRE/preopen postclose deploy' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,260p' /tmp/sre-deploy.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
