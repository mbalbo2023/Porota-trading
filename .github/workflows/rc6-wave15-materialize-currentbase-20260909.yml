name: RC6 Wave15 Materialize Currentbase 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave15-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave15-materialize-currentbase-20260909.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize selected learning components
        run: |
          set -euo pipefail
          git fetch --no-tags origin feature/rc6-forward-lab-v2-20260907 feature/rc6-mfe-mae-provenance-20260907
          for spec in "feature/rc6-forward-lab-v2-20260907:fh_forward_lab_v2_rc6.py" "feature/rc6-forward-lab-v2-20260907:tests/test_forward_lab_v2_rc6.py" "feature/rc6-mfe-mae-provenance-20260907:fc_mfe_mae_provenance_rc6.py" "feature/rc6-mfe-mae-provenance-20260907:tests/test_mfe_mae_provenance_rc6.py"; do ref=${spec%%:*}; p=${spec#*:}; mkdir -p "$(dirname "$p")"; git show "origin/$ref:$p" > "$p"; done
          python -m pip install -q pytest
          python -m py_compile fh_forward_lab_v2_rc6.py fc_mfe_mae_provenance_rc6.py
          python -m pytest -q tests/test_forward_lab_v2_rc6.py tests/test_mfe_mae_provenance_rc6.py
          grep -RniE 'send_order|place_order|cancel_order|/Operar/|budget_order' fh_forward_lab_v2_rc6.py fc_mfe_mae_provenance_rc6.py && exit 1 || true
          echo WAVE15_LEARNING=CODE_READY_CANDIDATE
          echo ORDER_ROUTES=NOT_CALLED
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fh_forward_lab_v2_rc6.py fc_mfe_mae_provenance_rc6.py tests/test_forward_lab_v2_rc6.py tests/test_mfe_mae_provenance_rc6.py
          git diff --cached --quiet || git commit -m 'feat(rc6 wave15): materialize tested forward lab and MFE-MAE'
          git push origin HEAD:deploy-prep/rc6-wave15-currentbase-20260909
