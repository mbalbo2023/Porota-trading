name: RC6 PPI Argentina delta postseed 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-argentina-delta-postseed-20260912.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read current API history delta
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = 'eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a' || exit 31
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('pragma query_only=on')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone();assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          total=attempted=usable=hard=0
          for fam,api in c.execute('select instrument_type,count(*) from ppi_argentina_api_shadow group by instrument_type order by instrument_type'):
              a=c.execute('select count(*) from production_history_attempts where instrument_type=?',(fam,)).fetchone()[0]
              u=c.execute("select count(*) from production_history_attempts where instrument_type=? and state in ('VALID_PAYLOAD','PARTIAL')",(fam,)).fetchone()[0]
              h=c.execute("select count(*) from production_history_attempts where instrument_type=? and state in ('EMPTY_OR_INVALID','ERROR')",(fam,)).fetchone()[0]
              out={'family':fam,'api':api,'attempted':a,'usable':u,'hard':h,'pending':max(0,api-a)}
              print('POSTSEED_DELTA='+json.dumps(out,sort_keys=True));total+=api;attempted+=a;usable+=u;hard+=h
          print('POSTSEED_TOTAL='+json.dumps({'api':total,'attempted':attempted,'usable':usable,'hard':hard,'pending':max(0,total-attempted)},sort_keys=True))
          print('SCRAPE_RULE=ONLY_RESIDUAL_AFTER_API_RCA')
          print('ORDER_ROUTES=NOT_CALLED')
          c.close()
          PY
          HOST
