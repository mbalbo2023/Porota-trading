name: RC6 Phase A Gate0 read-only 2026-09-08

on:
  push:
    branches:
      - checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
    paths:
      - '.github/workflows/rc6-phase-a-gate0-readonly-20260908.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc6-phase-a-gate0-readonly-20260908
  cancel-in-progress: false

jobs:
  gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
          fetch-depth: 0

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DO_HOST"; test -n "$DO_USER"; test -n "$SSH_KEY"; test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_gate0"
          chmod 600 "$HOME/.ssh/porota_gate0"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Capture live Gate0 evidence from Droplet read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          REPORT='POROTA_RC6_PHASE_A_GATE0_LIVE_2026-09-08.txt'
          ssh -i "$HOME/.ssh/porota_gate0" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' > "$REPORT" <<'REMOTE'
          set -u
          REPO=/opt/porota-trading
          DB="$REPO/data/paper_v17/observer_v17.db"
          HIST="$REPO/data/market_history.db"
          OBS=porota_production_observer
          DASH=porota_production_dashboard
          sep(){ printf '\n======================================================================\n%s\n======================================================================\n' "$1"; }
          safe(){ "$@" 2>&1 || true; }

          echo 'POROTA RC6 — PHASE A GATE 0 LIVE READ-ONLY EVIDENCE'
          echo 'MUTATIONS=NONE'
          echo 'DELETE=NONE'
          echo 'PRUNE=NONE'
          echo 'VACUUM=NONE'
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "AR=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HOST=$(hostname)"

          sep '01. FILESYSTEM HEADROOM'
          safe df -hT /
          safe df -ih /
          printf 'ROOT_USED_BYTES='; safe df -B1 --output=used / | tail -1 | tr -d ' '
          printf 'ROOT_AVAIL_BYTES='; safe df -B1 --output=avail / | tail -1 | tr -d ' '

          sep '02. LIVE REPOSITORY IDENTITY — NOT AUTHORITATIVE FOR CONTAINER SHA'
          if [ -d "$REPO/.git" ]; then
            printf 'REPO_BRANCH='; git -C "$REPO" branch --show-current 2>/dev/null || true
            printf 'REPO_HEAD='; git -C "$REPO" rev-parse HEAD 2>/dev/null || true
            printf 'REPO_UNTRACKED='; git -C "$REPO" status --porcelain 2>/dev/null | awk '$1=="??"{n++} END{print n+0}'
            printf 'REPO_MODIFIED_OR_STAGED='; git -C "$REPO" status --porcelain 2>/dev/null | awk '$1!="??"{n++} END{print n+0}'
          else
            echo 'REPO_GIT=NOT_FOUND'
          fi

          sep '03. RUNNING CONTAINERS / IMAGE LABEL TRUTH'
          for name in "$OBS" "$DASH"; do
            echo "-- $name --"
            safe sudo -n docker inspect -f 'NAME={{.Name}} ID={{.Id}} IMAGE={{.Config.Image}} IMAGE_ID={{.Image}} STATUS={{.State.Status}} RUNNING={{.State.Running}} RESTARTS={{.RestartCount}} HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}} STARTED={{.State.StartedAt}}' "$name"
            printf 'POROTA_COMMIT='; sudo -n docker inspect -f '{{index .Config.Labels "porota.commit"}}' "$name" 2>/dev/null || true
            printf 'POROTA_VERSION='; sudo -n docker inspect -f '{{index .Config.Labels "porota.version"}}' "$name" 2>/dev/null || true
          done
          echo '-- docker ps --'
          safe sudo -n docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

          sep '04. SQLITE SAFETY / OBSERVER STATE'
          sudo -n python3 - "$DB" "$HIST" <<'PY'
          import os, sqlite3, sys
          db,hist=sys.argv[1:3]
          def open_ro(path):
              c=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=30)
              c.row_factory=sqlite3.Row
              c.execute('PRAGMA query_only=ON')
              return c
          for label,path in [('OBSERVER',db),('HISTORY',hist)]:
              print(f'{label}_PATH={path}')
              print(f'{label}_FILE_BYTES={os.path.getsize(path) if os.path.exists(path) else -1}')
              try:
                  c=open_ro(path)
                  print(f'{label}_QUICK_CHECK={c.execute("PRAGMA quick_check").fetchone()[0]}')
                  print(f'{label}_JOURNAL_MODE={c.execute("PRAGMA journal_mode").fetchone()[0]}')
                  c.close()
              except Exception as e:
                  print(f'{label}_ERROR={type(e).__name__}:{str(e)[:200]}')
          try:
              c=open_ro(db)
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if 'observer_state' in tables:
                  cols=[r[1] for r in c.execute('PRAGMA table_info(observer_state)')]
                  wanted=[x for x in ('id','process_state','session_state','ppi_auth','heartbeat_at','real_orders_sent','mode','detail') if x in cols]
                  if wanted:
                      row=c.execute('SELECT '+','.join(wanted)+' FROM observer_state ORDER BY rowid DESC LIMIT 1').fetchone()
                      for key in wanted:
                          value=row[key] if row is not None else None
                          if key=='detail' and value is not None: value=str(value)[:240]
                          print(f'OBSERVER_STATE_{key.upper()}={value}')
              else:
                  print('OBSERVER_STATE_TABLE=MISSING')
              if 'historical_raw_archive' in tables:
                  print('RAW_ARCHIVE_ROWS='+str(c.execute('SELECT COUNT(*) FROM historical_raw_archive').fetchone()[0]))
                  try:
                      b=c.execute("SELECT SUM(pgsize) FROM dbstat WHERE name='historical_raw_archive'").fetchone()[0]
                      print('RAW_ARCHIVE_DBSTAT_BYTES='+str(b or 0))
                  except Exception as e:
                      print('RAW_ARCHIVE_DBSTAT_ERROR='+type(e).__name__)
                  cols=[r[1] for r in c.execute('PRAGMA table_info(historical_raw_archive)')]
                  for timecol in ('attempted_at','downloaded_at','created_at'):
                      if timecol in cols:
                          x=c.execute(f'SELECT MIN({timecol}),MAX({timecol}) FROM historical_raw_archive').fetchone()
                          print(f'RAW_ARCHIVE_{timecol.upper()}_MIN={x[0]}')
                          print(f'RAW_ARCHIVE_{timecol.upper()}_MAX={x[1]}')
                          break
              else:
                  print('RAW_ARCHIVE_TABLE=MISSING')
              c.close()
          except Exception as e:
              print('OBSERVER_STATE_ERROR='+type(e).__name__+':'+str(e)[:200])
          PY

          sep '05. CURRENT DISK HOTSPOTS'
          echo '-- /opt/porota-trading/data --'
          safe sudo -n du -x -h -d 2 "$REPO/data"
          echo '-- key backup roots --'
          for p in "$REPO/data/paper_v17/artifacts/observer_v17.db/backups" "$REPO/data/backups" /opt/porota-backups; do
            if [ -e "$p" ]; then safe sudo -n du -sh "$p"; fi
          done
          echo '-- /var --'
          safe sudo -n du -x -h -d 1 /var
          echo '-- docker system df --'
          safe sudo -n docker system df
          echo '-- builder cache --'
          safe sudo -n docker builder du
          echo '-- journal --'
          safe sudo -n journalctl --disk-usage

          sep '06. DEPLOY / MUTATION CONCURRENCY SNAPSHOT'
          echo '-- active porota deploy-like systemd units --'
          safe sudo -n systemctl list-units --type=service --state=activating,running --no-pager --no-legend 'porota*deploy*' 'porota*install*' 'porota*activate*'
          echo '-- active timers related to porota --'
          safe sudo -n systemctl list-timers --all --no-pager --no-legend 'porota*'
          echo '-- deployment-like processes (sanitized command names only) --'
          sudo -n python3 - <<'PY'
          import os
          needles=('deploy','activate','rollback','docker build','compose up')
          for pid in os.listdir('/proc'):
              if not pid.isdigit(): continue
              try:
                  raw=open(f'/proc/{pid}/cmdline','rb').read().replace(b'\0',b' ').decode('utf-8','replace')
              except Exception: continue
              lo=raw.lower()
              if any(n in lo for n in needles) and 'phase-a-gate0' not in lo:
                  exe=raw.split(' ',1)[0]
                  print(f'PID={pid} EXE={exe}')
          PY

          sep '07. GATE0 SNAPSHOT COMPLETION'
          echo 'GATE0_CAPTURE=COMPLETE_READ_ONLY'
          echo 'PHASE_A_IMPLEMENTATION=NOT_STARTED_BY_THIS_WORKFLOW'
          echo 'HOST_MUTATION=NONE'
          REMOTE
          test -s "$REPORT"
          echo "REPORT=$REPORT"

      - name: Commit Gate0 evidence to checkpoint branch
        shell: bash
        run: |
          set -euo pipefail
          REPORT='POROTA_RC6_PHASE_A_GATE0_LIVE_2026-09-08.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'audit(rc6): capture Phase A Gate0 live read-only evidence'
          git push origin HEAD:checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
