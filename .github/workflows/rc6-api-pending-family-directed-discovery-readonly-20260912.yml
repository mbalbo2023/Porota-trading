name: RC6 PPI API Pending Family Directed Discovery Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-api-pending-family-directed-discovery-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Directed production API discovery - read only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo HOST_SHA="$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo

          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import json, sqlite3, time
          from bf_production_paper_observer import _secret
          from bd_ppi_readonly_guard import ProductionMarketReader

          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('PRE_SAFETY='+'|'.join(map(str,(q,*st))))

          probes=[
            ('ACCIONES-USA','AAPL','AAPL','NASDAQ'),('ACCIONES-USA','AAPL','AAPL','NYSE'),
            ('ACCIONES-USA','MSFT','MSFT','NASDAQ'),('ACCIONES-USA','NVDA','NVDA','NASDAQ'),
            ('ACCIONES-USA','TSLA','TSLA','NASDAQ'),
            ('ETF','SPY','SPY','NYSE'),('ETF','SPY','SPY','NASDAQ'),('ETF','QQQ','QQQ','NASDAQ'),
            ('ETF','DIA','DIA','NYSE'),('ETF','IWM','IWM','NYSE'),
            ('LICITACIONES','TECPE10','TECPE10','BYMA'),
            ('LEBAC','LEBAC','LEBAC','BYMA'),('NOBAC','NOBAC','NOBAC','BYMA'),
            ('FCI','FONDO','FONDO','BYMA'),('FCI','FONDO','FONDO','OTC'),('FCI','FCI','FCI','BYMA'),
            ('FCI-EXTERIOR','FONDO','FONDO','OTC'),('FCI-EXTERIOR','FONDO','FONDO','BYMA'),
            ('FCI-EXTERIOR','FCI','FCI','OTC'),
          ]
          calls=[]
          def audit(method,path,result): calls.append((method,path,result))
          reader=ProductionMarketReader(*_secret(), audit=audit)
          safe_keys={'ticker','description','currency','type','market','settlement','id','instrumentId','instrumentID'}
          results=[]
          try:
              reader.login_once()
              cfg=reader.market_configuration()
              api_types={str(x).upper() for x in cfg['instrument_types']}
              api_markets={str(x).upper() for x in cfg['markets']}
              for fam,ticker,name,market in probes:
                  if fam not in api_types or market not in api_markets:
                      results.append({'family':fam,'query':ticker,'name':name,'market':market,'status':'SKIPPED_NOT_ENUMERATED','count':0,'rows':[]})
                      continue
                  try:
                      payload=reader.search_instruments(ticker,fam,name=name,market=market)
                      rows=[]
                      for raw in payload[:30]:
                          rows.append({k:raw.get(k) for k in safe_keys if k in raw})
                      results.append({'family':fam,'query':ticker,'name':name,'market':market,'status':'OK','count':len(payload),'rows':rows})
                  except Exception as exc:
                      results.append({'family':fam,'query':ticker,'name':name,'market':market,'status':'ERROR','error':type(exc).__name__+':'+str(exc)[:180],'count':0,'rows':[]})
                  time.sleep(0.12)
              print('PPI_API_TYPES='+json.dumps(sorted(api_types),ensure_ascii=False))
              for item in results:
                  print('DISCOVERY='+json.dumps(item,ensure_ascii=False,sort_keys=True,default=str))
              print('HTTP_BLOCKED='+str(reader.metrics['http_blocked']))
              assert reader.metrics['http_blocked']==0
          finally:
              reader.close()

          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('FINAL_SAFETY='+'|'.join(map(str,(q,*st))))
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
