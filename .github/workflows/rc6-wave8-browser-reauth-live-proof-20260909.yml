name: RC6 Wave8 Browser Geometry + Trusted Scraping Reauth Live Proof

on:
  push:
    branches: [proof/rc6-wave8-browser-reauth-live-20260909]
    paths: ['.github/workflows/rc6-wave8-browser-reauth-live-proof-20260909.yml']

permissions:
  contents: read

concurrency:
  group: porota-rc6-runtime-deploy
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recover proven trusted reauth helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin hotfix/rc6-contract-evidence-auto-reauth-20260907
          git show origin/hotfix/rc6-contract-evidence-auto-reauth-20260907:rc6_ppi_web_reauth.py > /tmp/rc6_ppi_web_reauth.py
          python -m py_compile /tmp/rc6_ppi_web_reauth.py
          ! grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order|/Operar/' /tmp/rc6_ppi_web_reauth.py
      - name: Prepare SSH and stage helper
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/rc6_ppi_web_reauth.py "$DO_USER@$DO_HOST:/tmp/rc6_ppi_web_reauth.py"
      - name: Live browser proof and reauth after hidden-row RCA
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          VENV=/opt/porota-contract-evidence-venv
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          SECRET=/etc/porota/contract-evidence-web.env
          CHROME=/usr/bin/google-chrome-stable
          cd "$ROOT"
          HEAD=$(git rev-parse HEAD); echo "HEAD=$HEAD"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          PRE=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0];m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone();raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0];c.close()
          print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "PRE_DB=$PRE"; test "$PRE" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          test -x "$VENV/bin/python"; test -x "$CHROME"
          "$VENV/bin/python" -c 'import playwright'
          TOKEN=$(sudo -n docker exec porota_production_dashboard printenv DASHBOARD_ACCESS_TOKEN || true)
          sudo -n -u porotaadmin env HOME=/home/porotaadmin TOKEN="$TOKEN" CHROME="$CHROME" "$VENV/bin/python" - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          token=os.getenv('TOKEN',''); chrome=os.environ['CHROME']
          paths=['/','/en-vivo','/trading','/scalping','/validacion','/instrumentos','/riesgo','/historicos','/aprendizaje','/reportes','/sistema']
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
              page=b.new_page(viewport={'width':1536,'height':920})
              for path in paths:
                  url='http://127.0.0.1:8000'+path+('?token='+token if token else '')
                  resp=page.goto(url,wait_until='networkidle',timeout=30000)
                  assert resp and resp.status==200,(path,resp.status if resp else None)
                  cells=page.locator('table.paper-table td,table.paper-table th')
                  ms=cells.evaluate_all("""els => els.slice(0,800).map(e => { const s=getComputedStyle(e), r=e.getBoundingClientRect(); const visible=!!(e.offsetWidth || e.offsetHeight || e.getClientRects().length); return {visible,w:r.width,h:r.height,ow:s.overflowWrap,wb:s.wordBreak,hy:s.hyphens,txt:(e.innerText||'').trim()}; })""")
                  bad=[]; visible_count=0
                  for m in ms:
                      if not m['visible']:
                          continue
                      visible_count += 1
                      if m['w'] < 90: bad.append(('width',m))
                      if m['ow'] not in ('normal','initial'): bad.append(('overflowWrap',m))
                      if m['wb'] not in ('normal','initial'): bad.append(('wordBreak',m))
                      txt=''.join(m['txt'].split())
                      if len(txt)>=4 and m['h'] > 5*m['w']: bad.append(('vertical-crush',m))
                  assert not bad,(path,bad[:3])
                  print(f'BROWSER_1536x920|{path}|tables={page.locator("table.paper-table").count()}|visible_cells={visible_count}|GREEN')
              page.goto('http://127.0.0.1:8000/'+('?token='+token if token else ''),wait_until='networkidle')
              page.screenshot(path='/tmp/wave8_live_1536x920.png',full_page=True)
              b.close()
          print('WAVE8_BROWSER_GEOMETRY=GREEN')
          PY
          test -d "$PROFILE"; test -f "$SECRET"; test "$(stat -c '%U:%a' "$SECRET")" = 'porotaadmin:600'
          sudo -n install -o root -g root -m 0755 /tmp/rc6_ppi_web_reauth.py /usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py
          sudo -n rm -f /tmp/rc6_ppi_web_reauth.py
          set +e
          OUT=$(sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin POROTA_CHROME_EXECUTABLE="$CHROME" PYTHONPATH=/usr/local/lib/porota-contract-evidence-rc6:$ROOT "$VENV/bin/python" /usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py --profile "$PROFILE" --secret "$SECRET" --chrome "$CHROME" 2>&1); RC=$?
          set -e
          printf '%s\n' "$OUT"
          STATE=$(REAUTH_OUT="$OUT" python3 - <<'PY'
          import json,os
          try: print(json.loads(os.environ['REAUTH_OUT']).get('status','UNKNOWN'))
          except Exception: print('INVALID_REAUTH_OUTPUT')
          PY
          )
          echo "REAUTH_RC=$RC|REAUTH_STATE=$STATE"
          test "$RC" -eq 0; test "$STATE" = AUTHENTICATED_TRUSTED_DEVICE
          BEFORE=$(find "$ROOT/data/contract_evidence/rc4_trusted" -maxdepth 1 -type f -name 'contract_*.json'|wc -l); START=$(date +%s)
          sudo -n systemctl reset-failed porota-contract-evidence-rc4.service || true
          sudo -n systemctl start porota-contract-evidence-rc4.service
          sleep 5
          test "$(sudo -n systemctl is-enabled porota-contract-evidence-rc4.timer)" = enabled
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc4.timer)" = active
          AFTER=$(find "$ROOT/data/contract_evidence/rc4_trusted" -maxdepth 1 -type f -name 'contract_*.json'|wc -l)
          echo "EVIDENCE_FILES=$BEFORE->$AFTER"; test "$AFTER" -gt "$BEFORE"
          LATEST=$(find "$ROOT/data/contract_evidence/rc4_trusted" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@|%p\n'|sort -nr|sed -n '1p'); MT=${LATEST%%.*}; FILE=${LATEST#*|}; test "$MT" -ge "$START"
          python3 - "$FILE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); print('LATEST_EVIDENCE_STATE='+str(d.get('state'))); print('LATEST_EVIDENCE_REAL_ORDERS='+str(d.get('real_orders_sent'))); assert d.get('state')=='AUTHENTICATED_TRUSTED_DEVICE'; assert int(d.get('real_orders_sent',0))==0
          PY
          ! grep -REni '/Operar/|/Orden|budget_order|confirm_order|cancel_order|masscancel|send_order|place_order' rc4_trusted_browser_contract_collector.py scripts/porota_contract_evidence_trusted_rc4.sh
          POST=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('pragma query_only=on');q=c.execute('pragma quick_check').fetchone()[0];m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone();raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0];c.close();print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "POST_DB=$POST"; test "$POST" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          echo WAVE8_BROWSER_GEOMETRY=GREEN
          echo SCRAPING_AUTH=AUTHENTICATED_TRUSTED_DEVICE
          echo SCRAPING_TIMER=ENABLED_ACTIVE
          echo SCRAPING_ROUTE_POLICY=COTIZACIONES_ONLY
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          HOST
