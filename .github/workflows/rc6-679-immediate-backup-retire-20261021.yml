name: RC6 679 backup retirement postreceipt read-only verification
on:
  push:
    branches:
      - diagnostic/rc6-679-readonly-baseline-20261021
    paths:
      - .github/workflows/rc6-679-immediate-backup-retire-20261021.yml
      - scripts/rc6_679_immediate_backup_retire.py
      - tests/test_rc6_679_immediate_backup_retire.py
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact source and local guard regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD bc661130968f2b85b8b2146f76923ddd26eb7837)" = bc661130968f2b85b8b2146f76923ddd26eb7837
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          python -m py_compile scripts/rc6_679_immediate_backup_retire.py
          python -m unittest -q tests/test_rc6_679_immediate_backup_retire.py
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_679_retire"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_679_retire" "$HOME/.ssh/known_hosts"
      - name: Read-only exact backup unit activity
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          timeout 50 ssh -i "$HOME/.ssh/porota_rc6_679_retire" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n systemctl show porota-host-general-backup-rc6.service -p ActiveState -p SubState -p MainPID -p ControlPID -p ExecMainStatus -p ActiveEnterTimestamp; sudo -n systemctl show porota-host-general-backup-rc6.timer -p ActiveState -p SubState -p Unit -p FragmentPath -p UnitFileState"
      - name: Verify retirement receipt and installed timer content read-only
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          EXPECTED_TIMER_SHA="$(sha256sum systemd/porota-host-general-backup-rc6.timer | cut -d' ' -f1)"
          timeout 90 ssh -i "$HOME/.ssh/porota_rc6_679_retire" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n python3 -B - '$EXPECTED_TIMER_SHA'" <<'REMOTE'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path('/opt/porota-trading')
          receipt=json.loads((root/'data/deploy/backup-retire-immediate-20261021.json').read_text())
          assert receipt['status']=='DONE' and receipt['count']==31
          timer=pathlib.Path('/etc/systemd/system/porota-host-general-backup-rc6.timer')
          assert timer.is_file() and not timer.is_symlink()
          sha=hashlib.sha256(timer.read_bytes()).hexdigest()
          assert sha==sys.argv[1], 'INSTALLED_TIMER_DIFFERS_FROM_VERSIONED_SOURCE'
          def state(cmd):
              return subprocess.run(['systemctl',cmd,'porota-host-general-backup-rc6.timer'],
                                    check=False,text=True,capture_output=True).stdout.strip()
          assert (state('is-enabled'),state('is-active'))==('disabled','inactive')
          for folder in ('/opt/porota-backups',
                         '/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/backups',
                         '/opt/porota-trading/data/backups'):
              assert sum(len(names) for _,_,names in os.walk(folder))==0
          print('RC6_679_POSTRECEIPT_READONLY=GREEN|count=31|timer_sha256='+sha+'|timer=disabled/inactive')
          REMOTE
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/porota_rc6_679_retire"
