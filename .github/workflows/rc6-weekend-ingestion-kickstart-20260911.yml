name: RC6 Weekend Ingestion Kickstart 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-weekend-ingestion-kickstart-20260911.yml

permissions:
  contents: read

concurrency:
  group: rc6-weekend-ingestion-kickstart
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_weekend_ingest"
          chmod 600 "$HOME/.ssh/porota_weekend_ingest"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resume coordinated read-only ingestion batch
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_weekend_ingest" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          export TZ=America/Argentina/Buenos_Aires
          ROOT=/opt/porota-trading
          TARGET_SHA=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          OBS=porota_production_observer
          ISSUES=0
          exec 9>/tmp/porota-weekend-ingestion-rc6.lock
          flock -n 9 || { echo 'BATCH_ABORT=ANOTHER_BATCH_ACTIVE'; exit 75; }

          echo '=== RESUME / SAFETY ==='
          echo "ART_START=$(date --iso-8601=seconds)"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          SAFETY="$(sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('|'.join(map(str,(q,*r))))
          PY
          )"
          echo "SAFETY=$SAFETY"
          IFS='|' read -r QC MODE SESSION REAL <<< "$SAFETY"
          test "$QC" = ok; test "$MODE" = PRODUCTION_PAPER; test "$REAL" = 0; test "$SESSION" != MARKET_OPEN
          echo 'CONTRACT_EVIDENCE_RUN1=SAFE_YELLOW|AUTHENTICATED_TRUSTED_DEVICE|blocked_nonread=0|routes=5|materializable_tables=0|real_orders_sent=0'
          echo 'CONTRACT_EVIDENCE_ACTION=NO_RETRY_NOW_TO_AVOID_DUPLICATE_BROWSER_LOAD'

          snapshot(){
            local label="$1"
            sudo -n docker exec -i "$OBS" python - "$label" <<'PY'
          import sqlite3,sys,json
          out={'label':sys.argv[1]}
          for path,key in [('/app/data/paper_v17/observer_v17.db','observer'),('/app/data/market_history.db','history')]:
              try:
                  c=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=20); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
                  tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
                  d={'quick_check':c.execute('pragma quick_check').fetchone()[0]}
                  for t in ('production_history_attempts','a3_history_ingest_state_rc6','contract_evidence_v2_runs','history_versions_v2','history_canonical_v2'):
                      if t in tabs: d[t]=c.execute(f'select count(*) from {t}').fetchone()[0]
                  if 'history_canonical_v2' in tabs:
                      d['families']=c.execute('select count(distinct instrument_type) from history_canonical_v2').fetchone()[0]
                      d['symbols']=c.execute('select count(distinct symbol) from history_canonical_v2').fetchone()[0]
                      d['first']=c.execute('select min(date) from history_canonical_v2').fetchone()[0]
                      d['last']=c.execute('select max(date) from history_canonical_v2').fetchone()[0]
                  out[key]=d; c.close()
              except Exception as exc: out[key]={'error':type(exc).__name__+':'+str(exc)[:120]}
          print('SNAPSHOT='+json.dumps(out,sort_keys=True,default=str))
          PY
          }

          wait_idle(){
            local svc="$1" max_wait="$2" waited=0
            while :; do
              s="$(sudo -n systemctl is-active "$svc" 2>/dev/null || true)"
              [[ "$s" != active && "$s" != activating ]] && return 0
              echo "WAIT_BUSY=$svc|state=$s|waited=${waited}s"
              sleep 10; waited=$((waited+10))
              (( waited < max_wait )) || return 1
            done
          }

          run_stage(){
            local label="$1" svc="$2" max_wait="$3"
            echo "=== $label ==="
            pre="$(sudo -n systemctl is-active "$svc" 2>/dev/null || true)"
            if [[ "$pre" = active || "$pre" = activating ]]; then
              echo "COLLISION_AVOIDED=$svc|WAIT_EXISTING"
              if ! wait_idle "$svc" "$max_wait"; then echo "STAGE_ISSUE=$svc|WAIT_TIMEOUT"; ISSUES=$((ISSUES+1)); return 0; fi
              echo "EXISTING_FINISHED=$svc|result=$(sudo -n systemctl show "$svc" -p Result --value 2>/dev/null || true)|exec_rc=$(sudo -n systemctl show "$svc" -p ExecMainStatus --value 2>/dev/null || true)"
              return 0
            fi
            ts=$(date +%s)
            set +e
            sudo -n systemctl start "$svc"
            rc=$?
            set -e
            result="$(sudo -n systemctl show "$svc" -p Result --value 2>/dev/null || true)"
            erc="$(sudo -n systemctl show "$svc" -p ExecMainStatus --value 2>/dev/null || true)"
            echo "SERVICE_RUN=$svc|start_rc=$rc|result=$result|exec_rc=$erc"
            sudo -n journalctl -u "$svc" --since "@${ts}" --no-pager -l 2>/dev/null | tail -n 100 || true
            if [[ "$rc" != 0 ]]; then echo "STAGE_ISSUE=$svc|start_rc=$rc|exec_rc=$erc"; ISSUES=$((ISSUES+1)); fi
          }

          snapshot RESUME_BASELINE

          run_stage 'STAGE 2 / PPI POST-CLOSE HISTORY' porota-history-postclose-rc6.service 1800
          snapshot AFTER_PPI_POSTCLOSE

          echo '=== STAGE 3 / A3 DAILY INCREMENTAL ==='
          last_daily="$(sudo -n systemctl show porota-a3-history-daily-rc6.timer -p LastTriggerUSec --value 2>/dev/null || true)"
          daily_result="$(sudo -n systemctl show porota-a3-history-rc6@DAILY_INCREMENTAL.service -p Result --value 2>/dev/null || true)"
          last_epoch="$(date -d "$last_daily" +%s 2>/dev/null || echo 0)"; now_epoch="$(date +%s)"
          if (( last_epoch > 0 && now_epoch-last_epoch < 21600 )) && [[ "$daily_result" = success ]]; then
            echo "A3_DAILY=SKIP_ALREADY_COMPLETED_RECENTLY|last=$last_daily|result=$daily_result"
            sudo -n journalctl -u porota-a3-history-rc6@DAILY_INCREMENTAL.service --since '-6 hours' --no-pager -l 2>/dev/null | tail -n 100 || true
          else
            run_stage 'STAGE 3 / A3 DAILY INCREMENTAL' porota-a3-history-rc6@DAILY_INCREMENTAL.service 3900
          fi
          snapshot AFTER_A3_DAILY

          run_stage 'STAGE 4 / A3 RECONCILE 10D' porota-a3-history-rc6@RECONCILE.service 3900
          snapshot AFTER_A3_RECONCILE

          run_stage 'STAGE 5 / A3 WEEKEND DEEP' porota-a3-history-rc6@WEEKEND_DEEP.service 3900
          snapshot AFTER_A3_WEEKEND_DEEP

          run_stage 'STAGE 6 / CANDLE INTEGRITY' porota-candle-integrity-rc6.service 300
          snapshot FINAL_DATA

          echo '=== FINAL TIMERS + SAFETY ==='
          for t in porota-contract-evidence-rc6.timer porota-history-postclose-rc6.timer porota-candle-integrity-rc6.timer porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer porota-a3-history-weekend-rc6.timer; do
            echo "TIMER_POST=$t|active=$(sudo -n systemctl is-active "$t" 2>/dev/null || true)|enabled=$(sudo -n systemctl is-enabled "$t" 2>/dev/null || true)|last=$(sudo -n systemctl show "$t" -p LastTriggerUSec --value 2>/dev/null || true)|next=$(sudo -n systemctl show "$t" -p NextElapseUSecRealtime --value 2>/dev/null || true)"
          done
          FINAL="$(sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('|'.join(map(str,(q,*r))))
          PY
          )"
          echo "FINAL_SAFETY=$FINAL"
          IFS='|' read -r FQC FMODE FSESSION FREAL <<< "$FINAL"
          test "$FQC" = ok; test "$FMODE" = PRODUCTION_PAPER; test "$FREAL" = 0
          echo "ISSUES=$ISSUES"
          echo "ART_END=$(date --iso-8601=seconds)"
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDERS_SENT=0'
          if (( ISSUES == 0 )); then echo 'WEEKEND_INGESTION_KICKSTART=GREEN'; else echo 'WEEKEND_INGESTION_KICKSTART=YELLOW_DATA_GAPS'; fi
          HOST
