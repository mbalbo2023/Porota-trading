name: RC6 unified Paper deploy 2026-09-15

on:
  push:
    branches:
      - deploy/rc6-pr69-isolated-20260915
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate RC6 Paper invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile _version.py bf_production_paper_observer.py bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_gdelt_shadow.py ba_data912_history.py al_historical_ingest.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py
          python - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_PAPER_POLICY=GREEN')
          PY

      - name: Install focused test runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9"

      - name: Run focused release tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_rc6_legacy_history_scope.py

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy" "$HOME/.ssh/known_hosts"

      - name: Package exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/porota-rc6-candidate.tgz bf_production_paper_observer.py bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py
      - name: Deploy exact candidate to Droplet and verify
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/porota-rc6-candidate.tgz "$DO_USER@$DO_HOST:/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          cd "$REPO"
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          PRE_SHA="$(sudo -n git -C "$REPO" rev-parse HEAD)"
          PRE_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "PRE_SHA=$PRE_SHA"
          echo "PRE_STATE=$PRE_STATE"
          test "$PRE_STATE" = 'ok|PRODUCTION_PAPER|0'
          REMOTE_TGZ="/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          test -f "$REMOTE_TGZ"
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n rm -rf "$STAGE"
          sudo -n mkdir -p "$STAGE"
          sudo -n tar -xzf "$REMOTE_TGZ" -C "$STAGE"
          BACKUP="/tmp/porota-rc6-backup-$TARGET_SHA"
          sudo -n rm -rf "$BACKUP"
          sudo -n mkdir -p "$BACKUP"
          for f in bf_production_paper_observer.py bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py; do
            if sudo -n test -f "$REPO/$f"; then sudo -n cp "$REPO/$f" "$BACKUP/$f"; fi
            sudo -n cp "$STAGE/$f" "$REPO/$f"
          done
          PREV_IMAGE_TAG="porota-trading-bot:17.0.0-rc6-rollback-$TARGET_SHA"
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$TARGET_SHA"
          sudo -n docker tag "$TARGET_IMAGE" "$PREV_IMAGE_TAG"
          if ! sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label "porota.version=17.0.0-rc6" -t "$CANDIDATE_IMAGE" "$REPO"; then
            for f in bf_production_paper_observer.py bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py; do if sudo -n test -f "$BACKUP/$f"; then sudo -n cp "$BACKUP/$f" "$REPO/$f"; fi; done
            exit 1
          fi
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          # A remote wrapper can return 124 after the manager completed.
          # Continue only after its explicit success marker; all health and safety
          # checks below remain mandatory.
          set +e
          MODE_OUTPUT="$(sudo -n env POROTA_COPY_OUTPUT=0 python3 "$REPO/porota_mode_manager.py" simulation 2>&1)"
          MODE_RC=$?
          set -e
          echo "$MODE_OUTPUT"
          grep -Fqx "POROTA_MODE=OK" <<< "$MODE_OUTPUT"
          if [ "$MODE_RC" -ne 0 ] && [ "$MODE_RC" -ne 124 ]; then
            echo "MODE_MANAGER_EXIT=$MODE_RC"
            exit "$MODE_RC"
          fi
          if [ "$MODE_RC" -eq 124 ]; then
            echo "MODE_MANAGER_WRAPPER_EXIT=124_CONFIRMED_BY_MARKER"
          fi
          OK=NO
          for _ in $(seq 1 8); do
            H="$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null || true)"
            if python3 - "$H" <<'PY'
          import json,sys
          try:
              x=json.loads(sys.argv[1]); assert x.get('status')=='ok' and x.get('version')=='17.0.0-rc6'
          except Exception: raise SystemExit(1)
          PY
            then OK=YES; break; fi
            sleep 2
          done
          test "$OK" = YES
          echo "RC6_DEPLOY_STAGE_ONE=GREEN"
          exit 0
          # The compact projection evaluates only live safety and a previously
          # verified snapshot. It never scans the JSONL ledger during deploy.
          VALIDATION_PROJECTION="$(sudo -n docker exec porota_production_dashboard timeout 30 python az_maintenance_job.py validation_projection 2>&1)"
          echo "$VALIDATION_PROJECTION"
          grep -q "Tarea validation_projection completada" <<< "$VALIDATION_PROJECTION"
          echo "VALIDATION_PROJECTION_BOOTSTRAP=GREEN"
          # Publica la auditoría compacta ahora para que Reportes no espere
          # hasta la próxima cadencia diaria. Sólo lee SQLite y escribe un JSON.
          ACTION4_AUDIT="$(sudo -n docker exec porota_production_dashboard timeout 30 python az_maintenance_job.py action4_audit 2>&1)"
          echo "$ACTION4_AUDIT"
          grep -q "Tarea action4_audit completada" <<< "$ACTION4_AUDIT"
          echo "ACTION4_AUDIT_BOOTSTRAP=GREEN"
          ROUTE_FAILURES=0
          for PATH_CHECK in /trading /motor-trading /validacion /reportes; do
            CODE="$(curl -sS -o /tmp/porota-dashboard-check -w '%{http_code}' --max-time 10 "http://127.0.0.1:8000$PATH_CHECK" || true)"
            case "$CODE" in 200|401) ;; *) echo "DASHBOARD_ROUTE_FAILED=$PATH_CHECK HTTP=$CODE"; sed -n "1,120p" /tmp/porota-dashboard-check; ROUTE_FAILURES=1 ;; esac
          done
          echo "DASHBOARD_ROUTE_FAILURES=$ROUTE_FAILURES"
          RENDER_FAILURES=0
          BG_RENDER="$(sudo -n docker exec porota_production_dashboard timeout 30 python -c "import bg_paper_dashboard as bg; bg.validation_page(); print('BG_VALIDATION_RENDER=GREEN')" 2>&1 || true)"
          echo "$BG_RENDER"
          if ! grep -q "BG_VALIDATION_RENDER=GREEN" <<< "$BG_RENDER"; then RENDER_FAILURES=1; fi
          PROJECT_RENDER="$(sudo -n docker exec porota_production_dashboard timeout 30 python -c "import en_validation_project_dashboard_rc6 as p; p.page(); print('PROJECT_VALIDATION_RENDER=GREEN')" 2>&1 || true)"
          echo "$PROJECT_RENDER"
          if ! grep -q "PROJECT_VALIDATION_RENDER=GREEN" <<< "$PROJECT_RENDER"; then RENDER_FAILURES=1; fi
          echo "DASHBOARD_RENDER_FAILURES=$RENDER_FAILURES"
          test "$ROUTE_FAILURES" = 0
          test "$RENDER_FAILURES" = 0
          POST_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = 'ok|PRODUCTION_PAPER|0'
          echo "DEPLOYED_SHA=$TARGET_SHA"
          echo 'REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'RC6_UNIFIED_PAPER_DEPLOY=GREEN'
          sudo -n docker compose ps
          REMOTE

      - name: Verify deployed candidate and Paper safety
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "bash -s" <<'VERIFY'
          set -Eeuo pipefail
          H="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          python3 - "$H" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get("status") == "ok" and x.get("version") == "17.0.0-rc6"
          PY
          # Bootstrap compacto una sola vez tras un deploy correcto. La cadencia
          # ordinaria sigue siendo diaria; esto evita dejar Validación y Reportes
          # vacíos hasta el día siguiente sin recorrer el ledger en HTTP.
          for job in validation_projection action4_audit; do
            JOB_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 30 python az_maintenance_job.py "$job" 2>&1)"
            echo "$JOB_OUTPUT"
            grep -Fq "Tarea $job completada." <<< "$JOB_OUTPUT"
            echo "BOOTSTRAP_$(tr '[:lower:]' '[:upper:]' <<< "$job")=GREEN"
          done
          # Prueba que el proceso en ejecución contiene el observer del candidato
          # recién desplegado. Evita repetir una omisión de copia en el workflow.
          STAGED_OBSERVER="/tmp/porota-rc6-candidate-$TARGET_SHA/bf_production_paper_observer.py"
          test -f "$STAGED_OBSERVER"
          EXPECTED_OBSERVER_SHA="$(sha256sum "$STAGED_OBSERVER" | awk '{print $1}')"
          RUNNING_OBSERVER_SHA="$(sudo -n docker exec porota_production_observer sha256sum /app/bf_production_paper_observer.py | awk '{print $1}')"
          test "$RUNNING_OBSERVER_SHA" = "$EXPECTED_OBSERVER_SHA"
          echo "OBSERVER_CANDIDATE_SHA=GREEN"
          for p in /trading /motor-trading /validacion /reportes; do
            c="$(curl -sS -o /tmp/porota-dashboard-check -w '%{http_code}' --max-time 5 "http://127.0.0.1:8000$p")"
            case "$c" in 200|401) ;; *) echo "DASHBOARD_ROUTE_FAILED=$p HTTP=$c"; exit 1 ;; esac
          done
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import bg_paper_dashboard as bg; bg.validation_page(); print('BG_VALIDATION_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import en_validation_project_dashboard_rc6 as p; p.page(); print('PROJECT_VALIDATION_RENDER=GREEN')"
          POST_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = "ok|PRODUCTION_PAPER|0"
          SCOPE_CHECK="$(sudo -n docker exec porota_production_observer python - <<'PY'
          import bf_production_paper_observer as observer
          permitted = {"ACCIONES", "CEDEARS"}
          assert set(observer.OPERATIONAL_FAMILIES) == permitted
          assert set(observer.SAFE_PAPER_TYPES) == permitted
          assert all(kind in permitted for _, kind, _ in observer.CORE_SYMBOLS)
          assert set(observer.DISCOVERY_SEEDS).issubset(permitted)
          assert all(kind in permitted for _, kind, _, _, _ in observer._candidate_universe())
          print("OPERATIONAL_SCOPE=ACCIONES_CEDEARS_ONLY")
          PY
          )"
          echo "$SCOPE_CHECK"
          # El observador se recrea en el deploy. Esperamos su primer pulso
          # real de PPI en lugar de reprobar el estado STARTING transitorio.
          RUNTIME_CHECK="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import time
          from datetime import datetime, timezone

          deadline = time.monotonic() + 75
          last = None
          while time.monotonic() < deadline:
              try:
                  c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=3)
                  c.execute('PRAGMA query_only=ON')
                  last = c.execute(
                      'SELECT mode,real_orders_sent,ppi_auth,process_state,session_state,'
                      'last_market_data_at,heartbeat_at FROM observer_state WHERE id=1'
                  ).fetchone()
                  c.close()
              except sqlite3.Error as exc:
                  last = ('DB_ERROR', 0, type(exc).__name__, '', '', '', '')
              def fresh(value, seconds):
                  try:
                      observed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                      if observed.tzinfo is None:
                          return False
                      age = (datetime.now(timezone.utc) - observed.astimezone(timezone.utc)).total_seconds()
                      return 0 <= age <= seconds
                  except (TypeError, ValueError):
                      return False
              paper_safe = last and last[0] == 'PRODUCTION_PAPER' and int(last[1] or 0) == 0 and last[2] == 'OK'
              heartbeat_fresh = paper_safe and fresh(last[6], 120)
              market_data_required = last and last[4] == 'MARKET_OPEN'
              market_data_fresh = (not market_data_required) or fresh(last[5], 180)
              if paper_safe and heartbeat_fresh and market_data_fresh:
                  print(f'GO_CHECK=GREEN|{"|".join(map(str,last))}|MARKET_DATA_REQUIRED={market_data_required}')
                  break
              time.sleep(5)
          else:
              print(f'GO_CHECK_FAILED_AFTER_STARTUP={last}')
          PY
          )"
          echo "$RUNTIME_CHECK"
          if ! grep -q '^GO_CHECK=GREEN' <<< "$RUNTIME_CHECK"; then
            echo "OBSERVER_PROCESS_DIAGNOSTIC:"
            sudo -n docker top porota_production_observer -eo pid,ppid,stat,wchan:32,etime,cmd || true
            for pid in $(sudo -n docker top porota_production_observer -eo pid= 2>/dev/null || true); do
              echo "OBSERVER_KERNEL_STACK_PID=$pid"
              sudo -n cat "/proc/$pid/wchan" || true
              sudo -n cat "/proc/$pid/stack" || true
            done
            echo "OBSERVER_LOG_TAIL:"
            sudo -n docker logs --tail 160 porota_production_observer || true
            exit 1
          fi
          echo "REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED"
          echo "RC6_UNIFIED_PAPER_DEPLOY=GREEN"
          VERIFY
