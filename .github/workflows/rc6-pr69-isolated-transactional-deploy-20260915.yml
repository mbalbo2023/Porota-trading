          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'LIVE'
          set +e
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          echo "RC6_DIAGNOSTIC_REMOTE=START"
          sudo -n id
          echo "RC6_DIAGNOSTIC_STAGE=$STAGE"
          sudo -n ls -l "$STAGE/scripts/rc6_iol_mcp_inventory.py" "$STAGE/scripts/rc6_telegram_diagnostic.py"
          sudo -n env PYTHONPATH="$STAGE" python3 "$STAGE/scripts/rc6_iol_mcp_inventory.py" > /tmp/rc6-iol-mcp-inventory.out 2>&1
          IOL_RC=$?
          echo "IOL_MCP_INVENTORY_EXIT=$IOL_RC"
          sudo -n sed -n '1,120p' /tmp/rc6-iol-mcp-inventory.out
          if sudo -n test -s /opt/porota-trading/data/market/iol_mcp_tools_latest.json; then
            echo "IOL_MCP_INVENTORY_FILE=GREEN"
            sudo -n python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/opt/porota-trading/data/market/iol_mcp_tools_latest.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          print("IOL_MCP_INVENTORY_STATUS=" + str(x.get("status")))
          print("IOL_MCP_TOOL_COUNT=" + str(x.get("tool_count", 0)))
          print("IOL_MCP_TOOL_NAMES=" + ",".join(str(item.get("name")) for item in x.get("tools", []) if isinstance(item, dict)))
          PY
          else
            echo "IOL_MCP_INVENTORY_FILE=MISSING"
          fi
          sudo -n env PYTHONPATH="$STAGE" python3 "$STAGE/scripts/rc6_telegram_diagnostic.py"
          TELEGRAM_RC=$?
          echo "RC6_TELEGRAM_DIAGNOSTIC_EXIT=$TELEGRAM_RC"
          echo "RC6_IOL_MCP_INVENTORY=CAPTURED"
          echo "RC6_TELEGRAM_DIAGNOSTIC=CAPTURED"
          exit 0
          LIVE

      - name: Verify deployed candidate and Paper safety
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'VERIFY'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          H="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          python3 - "$H" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get("status") == "ok" and x.get("version") == "17.0.0-rc6"
          PY
          # Bootstrap compacto una sola vez tras un deploy correcto. Cada tarea es diaria y acotada; 60 s cubren el arranque de Python sin autorizar un recorrido de ledger. La cadencia
          # ordinaria sigue siendo diaria; esto evita dejar Validación y Reportes
          # vacíos hasta el día siguiente sin recorrer el ledger en HTTP.
          for job in validation_projection action4_audit; do
            JOB_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 60 python az_maintenance_job.py "$job" 2>&1)"
            echo "$JOB_OUTPUT"
            grep -Fq "Tarea $job completada." <<< "$JOB_OUTPUT"
            echo "BOOTSTRAP_$(tr '[:lower:]' '[:upper:]' <<< "$job")=GREEN"
          done
          # Post-close full contract reconciliation. The runner is PPI
          # read-only and fails closed unless mode is PRODUCTION_PAPER,
          # session is MARKET_CLOSED and real_orders_sent is zero.
          # The transactional stage already built and labelled this exact
          # immutable candidate from $STAGE. Never rebuild this tag from the
          # host checkout: it may contain stale files and would overwrite the
          # candidate immediately before provenance verification.
          # The retention trap at the end of the transactional SSH session
          # intentionally removes the candidate tag after promoting the exact
          # image to the stable RC6 tag. Reuse that retained immutable tag in
          # this later SSH session; never depend on the removed candidate tag.
          TARGET_IMAGE="porota-trading-bot:17.0.0-rc6"
          VERIFY_IMAGE="$TARGET_IMAGE"
          sudo -n docker image inspect "$VERIFY_IMAGE" >/dev/null
          VERIFY_IMAGE_ID="$(sudo -n docker image inspect -f '{{.Id}}' "$VERIFY_IMAGE")"
          VERIFY_IMAGE_COMMIT="$(sudo -n docker image inspect -f '{{index .Config.Labels "porota.commit"}}' "$VERIFY_IMAGE" 2>/dev/null || true)"
          echo "RC6_VERIFY_IMAGE_ID=$VERIFY_IMAGE_ID"
          echo "RC6_VERIFY_IMAGE_COMMIT=$VERIFY_IMAGE_COMMIT"
          echo "RC6_CONTRACT_RUNNER_IMAGE=$VERIFY_IMAGE"
          sudo -n docker run --rm --pull never --entrypoint test "$VERIFY_IMAGE" -f /app/rc6_official_source_adapters.py
          echo "RC6_CONTRACT_RUNNER_MODULE=GREEN"
          set +e
          # Run from the exact candidate image.  The live observer may still
          # be on its previous immutable image at this point, so docker exec
          # would make the evidence result depend on stale source provenance.
          # This one-shot container shares only the PAPER data and read-only
          # PPI secret, has no order capability, and exits after reconciliation.
          CONTRACT_OUTPUT="$(sudo -n timeout 1200 sudo -n docker run --rm --pull never \
            --user botuser --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            -e PPI_PRODUCTION_SECRET_FILE=/run/secrets/ppi_production.json \
            -e PAPER_V17_DB_PATH=/app/data/paper_v17/observer_v17.db \
            -e DATA_DIR=/app/data \
            -e SERVER_TIMEZONE=America/Argentina/Buenos_Aires \
            --env-file /opt/porota-trading/data/diagnosticos/observer_runtime_v17.env \
            -v /opt/porota-trading/data:/app/data \
            -v /opt/porota-trading/.secrets/ppi_production.json:/run/secrets/ppi_production.json:ro \
            --entrypoint python "$VERIFY_IMAGE" ck_contract_evidence_runner_hf6.py 2>&1)"
          CONTRACT_RC=$?
          set -e
          # The runner does not print credentials. Preserve its bounded,
          # read-only diagnosis before failing the deploy check.
          echo "RC6_FULL_CONTRACT_RECONCILIATION_EXIT=$CONTRACT_RC"
          echo "$CONTRACT_OUTPUT"
          # La conciliación completa es una prueba post-cierre. Fuera de esa
          # ventana el runner responde con un skip explícito y exitoso; no se
          # degrada el deploy ni se omite ninguna verificación de PAPER.
          if grep -Fq "STATUS=SKIPPED_MARKET_NOT_CLOSED" <<< "$CONTRACT_OUTPUT"; then
            test "$CONTRACT_RC" -eq 0
            echo "RC6_FULL_CONTRACT_RECONCILIATION=SKIPPED_MARKET_OPEN"
          else
            test "$CONTRACT_RC" -eq 0
            grep -Fq "STATUS=OK" <<< "$CONTRACT_OUTPUT"
            grep -Fq "QUICK_CHECK=ok" <<< "$CONTRACT_OUTPUT"
            echo "RC6_FULL_CONTRACT_RECONCILIATION=GREEN"
          fi
          # The candidate image is the only runtime source of truth.  Do not
          # docker-cp into a running/read-only container and do not restart a
          # dashboard solely to copy sources: both caused stale-provenance
          # incidents.  Verify the deployed image/source hashes below.
          CANDIDATE_ROOT="/tmp/porota-rc6-candidate-$TARGET_SHA"
          test -f "$CANDIDATE_ROOT/bf_production_paper_observer.py"
          echo "RC6_DASHBOARD_CANDIDATE_SOURCES=IMAGE_ONLY"
          # Recreate the observer explicitly in this verification step. The
          # previous failed attempt left a stopped container under the same name;
          # do not allow that stale container to satisfy any later check.
          echo "RC6_VERIFY_IMAGE_REUSED=$VERIFY_IMAGE"
          # Prove every dashboard module in the candidate image against the immutable
          # staging tree before stopping or recreating any live container.
          for f in bg_paper_dashboard.py zz_wave8_dashboard_live_rc6.py da_dashboard_ux_hf6.py rc6_annual_instrument_analysis.py rc6_on_validation.py bd_ppi_readonly_guard.py c_ppi_client.py cr_pending_settlement_diagnostics_hf6.py eq_dashboard_table_layout_rc6.py rc6_dashboard_responsive_ux.py rc6_family_readiness.py o_dashboard.py; do
            EXPECTED_CANDIDATE_SHA="$(sha256sum "$CANDIDATE_ROOT/$f" | awk '{print $1}')"
            IMAGE_CANDIDATE_SHA="$(sudo -n docker run --rm --pull never --entrypoint sha256sum "$VERIFY_IMAGE" "/app/$f" | awk '{print $1}')"
            if [ "$IMAGE_CANDIDATE_SHA" != "$EXPECTED_CANDIDATE_SHA" ]; then
              echo "RC6_IMAGE_SOURCE_SHA_MISMATCH=dashboard|$f|expected=$EXPECTED_CANDIDATE_SHA|image=$IMAGE_CANDIDATE_SHA"
              exit 1
            fi
            echo "RC6_IMAGE_SOURCE_SHA=GREEN|dashboard|$f"
          done
          # El dashboard debe provenir del mismo candidato inmutable que se
          # verifica; no se delega su promoción al gestor de modo.
          EXPECTED_DASHBOARD_SHA="$(sha256sum "$CANDIDATE_ROOT/bg_paper_dashboard.py" | awk '{print $1}')"
          VERIFY_DASHBOARD_SHA="$(sudo -n docker run --rm --pull never --entrypoint sha256sum "$VERIFY_IMAGE" /app/bg_paper_dashboard.py | awk '{print $1}')"
          test "$VERIFY_DASHBOARD_SHA" = "$EXPECTED_DASHBOARD_SHA"
          echo "RC6_VERIFY_DASHBOARD_SOURCE_SHA=GREEN|$VERIFY_DASHBOARD_SHA"
          DASHBOARD_ENV="$REPO/data/diagnosticos/dashboard_mode_v17.env"
          test -f "$DASHBOARD_ENV"
          sudo -n docker rm -f porota_production_dashboard >/dev/null 2>&1 || true
          sudo -n docker run -d --name porota_production_dashboard \
            --pull never --restart unless-stopped --user botuser --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            -p 127.0.0.1:8000:8000 --env-file "$DASHBOARD_ENV" \
            -v "$REPO/data:/app/data" --entrypoint python "$VERIFY_IMAGE" o_dashboard.py
          DASHBOARD_READY=NO
          for _ in $(seq 1 15); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health >/dev/null 2>&1; then
              DASHBOARD_READY=YES
              break
            fi
            sleep 2
          done
          test "$DASHBOARD_READY" = YES
          EXPECTED_DASHBOARD_IMAGE_ID="$(sudo -n docker image inspect -f '{{.Id}}' "$VERIFY_IMAGE")"
          RUNNING_DASHBOARD_IMAGE_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_production_dashboard)"
          test "$RUNNING_DASHBOARD_IMAGE_ID" = "$EXPECTED_DASHBOARD_IMAGE_ID"
          echo "RC6_VERIFY_DASHBOARD_IMAGE=GREEN|$RUNNING_DASHBOARD_IMAGE_ID"
          VERIFY_SCALPING_SHA="$(sudo -n docker run --rm --pull never --entrypoint sha256sum "$VERIFY_IMAGE" /app/cf_intraday_scalping.py | awk '{print $1}')"
          EXPECTED_VERIFY_SCALPING_SHA="$(sha256sum "$CANDIDATE_ROOT/cf_intraday_scalping.py" | awk '{print $1}')"
          test "$VERIFY_SCALPING_SHA" = "$EXPECTED_VERIFY_SCALPING_SHA"
          echo "RC6_VERIFY_IMAGE_SCALPING_SHA=GREEN|$VERIFY_SCALPING_SHA"
          sudo -n docker rm -f porota_production_observer >/dev/null 2>&1 || true
          sudo -n docker run -d --name porota_production_observer \
            --pull never --restart unless-stopped --no-healthcheck \
            --user botuser --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            -e PPI_PRODUCTION_SECRET_FILE=/run/secrets/ppi_production.json \
            -e PAPER_V17_DB_PATH=/app/data/paper_v17/observer_v17.db \
            -e MARKET_OPEN_HOUR=10 -e MARKET_OPEN_MINUTE=30 \
            -e MARKET_CLOSE_HOUR=17 -e MARKET_CLOSE_MINUTE=0 \
            -e PAPER_PREOPEN_MINUTES=15 -e PPI_LOGIN_COOLDOWN_SECONDS=900 \
            -e PPI_HISTORY_BATCH_LIMIT=40 -e DATA_DIR=/app/data \
            -e SERVER_TIMEZONE=America/Argentina/Buenos_Aires \
            --env-file /opt/porota-trading/data/diagnosticos/observer_runtime_v17.env \
            -e PAPER_SCALPING_MODE=ACTIVE_OBSERVE \
            -v /opt/porota-trading/data:/app/data \
            -v /opt/porota-trading/.secrets/ppi_production.json:/run/secrets/ppi_production.json:ro \
            --entrypoint python "$VERIFY_IMAGE" bv_paper_runtime.py
          sleep 3
          OBSERVER_STATE="$(sudo -n docker inspect porota_production_observer --format '{{.State.Status}}|{{.Id}}')"
          echo "RC6_VERIFY_OBSERVER_STATE=$OBSERVER_STATE"
          if [[ "$OBSERVER_STATE" != running\|* ]]; then
            sudo -n docker logs --tail 120 porota_production_observer || true
            exit 1
          fi
          EXPECTED_OBSERVER_SHA="$(sha256sum "$CANDIDATE_ROOT/bf_production_paper_observer.py" | awk '{print $1}')"
          RUNNING_OBSERVER_SHA="$(sudo -n docker exec porota_production_observer sha256sum /app/bf_production_paper_observer.py | awk '{print $1}')"
          test "$RUNNING_OBSERVER_SHA" = "$EXPECTED_OBSERVER_SHA"
          echo "OBSERVER_CANDIDATE_SHA=GREEN"
          # The observer is launched from the exact image, but synchronize this
          # child module explicitly as a second provenance guard before restart.
          # El stage de deploy ya recreó el observer desde la imagen candidata;
          # aquí sólo se observa su proceso y su estado persistido.
          sleep 3
          # Capture both provenance checks without set -e hiding whether the
          # candidate file or the live observer is the failing side.
          set +e
          EXPECTED_SCALPING_SHA="$(sha256sum "$CANDIDATE_ROOT/cf_intraday_scalping.py" | awk '{print $1}')"
          EXPECTED_SCALPING_RC=$?
          RUNNING_SCALPING_RAW="$(sudo -n timeout 15 docker exec porota_production_observer sha256sum /app/cf_intraday_scalping.py 2>&1)"
          RUNNING_SCALPING_RC=$?
          EXPECTED_SESSION_SHA="$(sha256sum "$CANDIDATE_ROOT/co_market_sessions_hf6.py" | awk '{print $1}')"
          EXPECTED_SESSION_RC=$?
          RUNNING_SESSION_RAW="$(sudo -n timeout 15 docker exec porota_production_observer sha256sum /app/co_market_sessions_hf6.py 2>&1)"
          RUNNING_SESSION_RC=$?
          echo "SCALPING_EXPECTED_RC=$EXPECTED_SCALPING_RC|value=$EXPECTED_SCALPING_SHA"
          echo "SCALPING_RUNNING_RC=$RUNNING_SCALPING_RC|value=$RUNNING_SCALPING_RAW"
          echo "SESSION_EXPECTED_RC=$EXPECTED_SESSION_RC|value=$EXPECTED_SESSION_SHA"
          echo "SESSION_RUNNING_RC=$RUNNING_SESSION_RC|value=$RUNNING_SESSION_RAW"
          echo "SCALPING_CONTAINER_STATE_BEFORE_ENV:"
          sudo -n docker inspect porota_production_observer --format 'STATE={{.State.Status}} EXIT={{.State.ExitCode}} ERROR={{.State.Error}} STARTED={{.State.StartedAt}} FINISHED={{.State.FinishedAt}}' || true
          sudo -n docker ps -a --filter name=porota_production_observer --no-trunc || true
          echo "OBSERVER_LOG_TAIL_BEFORE_ENV:"
          sudo -n docker logs --tail 160 porota_production_observer || true
          set -e
          test "$EXPECTED_SCALPING_RC" -eq 0
          test "$RUNNING_SCALPING_RC" -eq 0
          test "$RUNNING_SCALPING_RAW" = "$EXPECTED_SCALPING_SHA  /app/cf_intraday_scalping.py"
          test "$EXPECTED_SESSION_RC" -eq 0
          test "$RUNNING_SESSION_RC" -eq 0
          test "$RUNNING_SESSION_RAW" = "$EXPECTED_SESSION_SHA  /app/co_market_sessions_hf6.py"
          echo "SCALPING_WORKER_SOURCE_SHA=GREEN"
          echo "SCALPING_SESSION_SOURCE_SHA=GREEN"
          # Diagnose the child launch without letting a transient observer restart
          # hide the actual container state or traceback. The final assertions
          # remain fail-closed after all evidence is printed.
          set +e
          SCALPING_ENV_RC=0
          SCALPING_ENV_CHECK="$(sudo -n timeout 15 docker exec porota_production_observer python -c 'import os; print("SCALPING_MODE=" + str(os.getenv("PAPER_SCALPING_MODE"))); print("SCALPING_SCAN_SECONDS=" + str(os.getenv("PAPER_INTRADAY_SCAN_SECONDS")))' 2>&1)"
          SCALPING_ENV_RC=$?
          echo "SCALPING_ENV_RC=$SCALPING_ENV_RC"
          echo "SCALPING_ENV_CHECK=$SCALPING_ENV_CHECK"
          sudo -n docker inspect porota_production_observer --format 'SCALPING_CONTAINER_STATE={{.State.Status}} EXIT={{.State.ExitCode}} ERROR={{.State.Error}} STARTED={{.State.StartedAt}} FINISHED={{.State.FinishedAt}}'
          sudo -n docker ps -a --filter name=porota_production_observer --no-trunc
          echo "OBSERVER_LOG_TAIL:"
          sudo -n docker logs --tail 160 porota_production_observer
          echo "OBSERVER_IMPORT_CHECK:"
          sudo -n timeout 15 docker exec porota_production_observer python -c 'import cf_intraday_scalping; print("SCALPING_IMPORT=GREEN")'
          SCALPING_IMPORT_RC=$?
          echo "SCALPING_IMPORT_RC=$SCALPING_IMPORT_RC"
          set -e
          test "$SCALPING_ENV_RC" -eq 0
          test "$SCALPING_IMPORT_RC" -eq 0
          SCALPING_RUNTIME="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          db = "file:/app/data/paper_v17/observer_v17.db?mode=ro"
          deadline = time.monotonic() + 90
          row = None
          mode = orders = None
          while time.monotonic() < deadline:
              try:
                  with sqlite3.connect(db, uri=True, timeout=20) as c:
                      c.execute("PRAGMA query_only=ON")
                      row = c.execute(
                          "SELECT heartbeat_at,state,cursor,selected,successful,failed,points_inserted,"
                          "confirmed_identities,candidates,real_orders_sent,detail "
                          "FROM intraday_scalping_worker_state WHERE id=1"
                      ).fetchone()
                      mode, orders = c.execute(
                          "SELECT mode,real_orders_sent FROM observer_state WHERE id=1"
                      ).fetchone()
                  if row is not None:
                      break
              except sqlite3.Error:
                  pass
              time.sleep(5)
          assert row is not None, "SCALPING_WORKER_STATE_MISSING_AFTER_STARTUP_GRACE"
          heartbeat = datetime.fromisoformat(str(row[0]).replace("Z", "+00:00"))
          if heartbeat.tzinfo is None:
              heartbeat = heartbeat.replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - heartbeat.astimezone(timezone.utc)).total_seconds()
          assert 0 <= age <= 600, f"SCALPING_WORKER_HEARTBEAT_STALE:{age:.1f}"
          assert mode == "PRODUCTION_PAPER" and int(orders or 0) == 0
          assert int(row[9] or 0) == 0
          local = datetime.now(ZoneInfo("America/Argentina/Buenos_Aires"))
          in_session = local.weekday() < 5 and (local.hour, local.minute) >= (10, 30) and (local.hour, local.minute) < (17, 0)
          if in_session:
              assert row[1] != "STOPPED", f"SCALPING_WORKER_STOPPED:{row[1]}"
          print("SCALPING_WORKER_RUNTIME=GREEN|state=%s|heartbeat_age_seconds=%.1f|selected=%s|successful=%s|failed=%s|points=%s|confirmed=%s|candidates=%s|detail=%s" % (
              row[1], age, row[3], row[4], row[5], row[6], row[7], row[8], row[10]))
          PY
          )"
          echo "$SCALPING_RUNTIME"
          grep -Fq "SCALPING_WORKER_RUNTIME=GREEN" <<< "$SCALPING_RUNTIME"
          EXPECTED_HISTORY_REPAIR_SHA="$(sha256sum "$CANDIDATE_ROOT/scripts/rc6_history_cutoff_repair_once.py" | awk '{print $1}')"
          RUNNING_HISTORY_REPAIR_SHA="$(sudo -n docker exec porota_production_observer sha256sum /app/scripts/rc6_history_cutoff_repair_once.py | awk '{print $1}')"
          test "$RUNNING_HISTORY_REPAIR_SHA" = "$EXPECTED_HISTORY_REPAIR_SHA"
          echo "HISTORY_REPAIR_CANDIDATE_SHA=GREEN"
          # Prove the exact modules corrected by PR #125 reached each live container.
          for f in be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py rc6_source_consolidation.py rc6_multisource_discovery.py rc6_iol_family_reference.py bu_instrument_catalog.py POROTA_SECTOR_MAP_V1.csv; do
            EXPECTED_SOURCE_SHA="$(sha256sum "$CANDIDATE_ROOT/$f" | awk '{print $1}')"
            RUNNING_SOURCE_SHA="$(sudo -n docker exec porota_production_observer sha256sum "/app/$f" | awk '{print $1}')"
            test "$RUNNING_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
            echo "RUNNING_SOURCE_SHA=GREEN|observer|$f"
          done
          SECTOR_MAP_CHECK="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import hashlib
          from pathlib import Path
          import es_policy_context_rc6 as p
          path=Path("/app/POROTA_SECTOR_MAP_V1.csv")
          assert path.is_file()
          mapping=p._explicit_sector_map()
          assert mapping, "SECTOR_MAP_EMPTY"
          print("SECTOR_MAP_RUNTIME=GREEN|rows=%d|sha256=%s" % (
              len(mapping), hashlib.sha256(path.read_bytes()).hexdigest()))
          PY
          )"
          echo "$SECTOR_MAP_CHECK"
          grep -Fq "SECTOR_MAP_RUNTIME=GREEN" <<< "$SECTOR_MAP_CHECK"
          for f in bg_paper_dashboard.py zz_wave8_dashboard_live_rc6.py da_dashboard_ux_hf6.py rc6_annual_instrument_analysis.py rc6_on_validation.py bd_ppi_readonly_guard.py c_ppi_client.py cr_pending_settlement_diagnostics_hf6.py eq_dashboard_table_layout_rc6.py rc6_dashboard_responsive_ux.py rc6_family_readiness.py o_dashboard.py; do
            EXPECTED_SOURCE_SHA="$(sha256sum "$CANDIDATE_ROOT/$f" | awk '{print $1}')"
            if ! RUNNING_SOURCE_SHA="$(sudo -n docker exec porota_production_dashboard sha256sum "/app/$f" | awk '{print $1}')"; then
              echo "RUNNING_SOURCE_SHA_ERROR=dashboard|$f"
              sudo -n docker inspect porota_production_dashboard --format 'IMAGE={{.Image}} NAME={{.Name}}' || true
              sudo -n docker exec porota_production_dashboard sh -c 'ls -l /app/rc6_annual_instrument_analysis.py /app/rc6_family_readiness.py 2>&1 || true' || true
              exit 1
            fi
            if [ "$RUNNING_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
              echo "RUNNING_SOURCE_SHA_MISMATCH=dashboard|$f|expected=$EXPECTED_SOURCE_SHA|running=$RUNNING_SOURCE_SHA"
              sudo -n docker inspect porota_production_dashboard --format 'IMAGE={{.Image}} NAME={{.Name}}' || true
              exit 1
            fi
            echo "RUNNING_SOURCE_SHA=GREEN|dashboard|$f"
          done
          if ! SCHEDULER_HISTORY_GUARD="$(sudo -n docker exec -i porota_production_observer python - <<'PY' 2>&1
          from pathlib import Path

          source = Path("/app/az_maintenance_scheduler.py").read_text(encoding="utf-8")
          checks = {
              "guard_before_launch": (
                  "if job_name in INTERNAL_HISTORICAL_WRITE_JOBS:" in source
                  and source.index("if job_name in INTERNAL_HISTORICAL_WRITE_JOBS:")
                  < source.index("result = subprocess.run(")
              ),
              "catchup_absent": 'id="maintenance_historical_catchup"' not in source,
              "refresh_absent": 'id="maintenance_historical_refresh"' not in source,
              "startup_absent": 'id="maintenance_historical_startup_catchup"' not in source,
              "news_present": 'id="maintenance_news_scan"' in source,
              "gdelt_present": 'id="maintenance_gdelt_shadow"' in source,
              "audit_present": 'id="maintenance_action4_audit"' in source,
              "projection_present": 'id="maintenance_validation_projection"' in source,
          }
          print(f"SCHEDULER_GUARD_DETAILS={checks}")
          if not all(checks.values()):
              raise SystemExit(1)
          print("INTERNAL_HISTORY_WRITES=DISABLED")
          PY
          )"; then
            echo "$SCHEDULER_HISTORY_GUARD"
            exit 1
          fi
          echo "$SCHEDULER_HISTORY_GUARD"
          grep -Fqx "INTERNAL_HISTORY_WRITES=DISABLED" <<< "$SCHEDULER_HISTORY_GUARD"
          for p in /trading /motor-trading /validacion /reportes /postcierre /analisis /en-vivo; do
            c="$(curl -sS -o /tmp/porota-dashboard-check -w '%{http_code}' --max-time 5 "http://127.0.0.1:8000$p")"
            echo "DASHBOARD_ROUTE_STATUS=$p HTTP=$c"
            case "$c" in 200|401) ;; *) echo "DASHBOARD_ROUTE_FAILED=$p HTTP=$c"; exit 1 ;; esac
          done
          DASHBOARD_HEADERS_FILE="/tmp/porota-dashboard-headers"
          DASHBOARD_HTTP_CODE="$(curl -sS -D "$DASHBOARD_HEADERS_FILE" -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/health)"
          echo "DASHBOARD_HEALTH_HTTP=$DASHBOARD_HTTP_CODE"
          sed -n '1,40p' "$DASHBOARD_HEADERS_FILE"
          test "$DASHBOARD_HTTP_CODE" = "200"
          sudo -n docker exec porota_production_dashboard timeout 20 python -c "import bg_paper_dashboard as bg; html=bg.live_page(offset=0,limit=20); assert isinstance(html,str) and html; print('EN_VIVO_RENDER=GREEN')"
          grep -Eiq '^cache-control:[[:space:]]*.*no-store' "$DASHBOARD_HEADERS_FILE"
          echo "DASHBOARD_NO_STORE_HEADERS=GREEN"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import bg_paper_dashboard as bg; bg.validation_page(); print('BG_VALIDATION_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import rc6_annual_instrument_analysis as a; page=a.render_page(); assert isinstance(page,str) and page; print('RC6_ANNUAL_ANALYSIS_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import en_validation_project_dashboard_rc6 as p; p.page(); print('PROJECT_VALIDATION_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import rc6_postclose_review_dashboard as p; p.page(); print('POSTCLOSE_REVIEW_RENDER=GREEN')"
          # NOT_DUE exits 2 outside the post-close window. Capture it with an
          # explicit OR-list so bash -e cannot terminate before verification.
          SNAPSHOT_RC=0
          SNAPSHOT_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 30 python /app/rc6_snapshot.py --phase postclose 2>&1)" || SNAPSHOT_RC=$?
          echo "$SNAPSHOT_OUTPUT"
          case "$SNAPSHOT_RC" in 0|2) ;; *) echo "SNAPSHOT_UNEXPECTED_EXIT=$SNAPSHOT_RC"; exit "$SNAPSHOT_RC";; esac
          # Fuera de la ventana postcierre, NOT_DUE prueba que el guard de horario
          # está activo. No se fuerza ni inventa un snapshot postcierre.
          grep -Eq '"status": "(VERIFIED|INSUFFICIENT_EVIDENCE|NOT_DUE)"' <<< "$SNAPSHOT_OUTPUT"
          REVIEW_RC=0
          REVIEW_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 15 python /app/rc6_postclose_review.py 2>&1)" || REVIEW_RC=$?
          echo "$REVIEW_OUTPUT"
          case "$REVIEW_RC" in 0|2) ;; *) echo "REVIEW_UNEXPECTED_EXIT=$REVIEW_RC"; exit "$REVIEW_RC";; esac
          grep -Eq '"status": "(VERIFIED|INSUFFICIENT_EVIDENCE|NOT_DUE)"' <<< "$REVIEW_OUTPUT"
          for unit in porota-snapshot-preopen-rc6.timer porota-snapshot-postclose-rc6.timer; do
            test "$(systemctl is-enabled "$unit")" = enabled
            test "$(systemctl is-active "$unit")" = active
          done
          echo "RC6_SNAPSHOT_TIMERS=GREEN"
          IOL_TIMER=porota-iol-shadow-collector-rc6.timer
          IOL_SERVICE=porota-iol-shadow-collector-rc6.service
          test "$(systemctl is-enabled "$IOL_TIMER")" = enabled
          test "$(systemctl is-active "$IOL_TIMER")" = active
          sudo -n test -r /root/.config/porota/iol_mcp_oauth_bootstrap.json
          echo "IOL_TIMER_AUDIT=enabled|active|oauth_bootstrap=present"
          systemctl show "$IOL_TIMER" --property=NextElapseUSecRealtime --property=LastTriggerUSec --no-pager
          systemctl show "$IOL_SERVICE" --property=Result --property=ExecMainStatus --property=ActiveState --no-pager
          sudo -n journalctl -u "$IOL_SERVICE" --since today --no-pager -n 80
          for unit in porota-introspection-rc6.timer porota-introspection-publish-rc6.timer porota-scheduler-export-rc6.timer; do
            test "$(systemctl is-enabled "$unit")" = enabled
            test "$(systemctl is-active "$unit")" = active
          done
          for legacy_unit in porota-introspeccion-hf5.timer porota-introspection-publish.timer porota-scheduler-export-hf6.timer; do
            if systemctl list-unit-files --type=timer --no-legend | awk -v unit="$legacy_unit" '$1 == unit { found=1 } END { exit !found }'; then
              ! systemctl is-active --quiet "$legacy_unit"
              ! systemctl is-enabled --quiet "$legacy_unit"
            fi
          done
          SCHEDULER_SNAPSHOT="/opt/porota-trading/data/scheduler/systemd_timers.json"
          SCHEDULER_EXPORT_READY=NO
          for _ in $(seq 1 40); do
            if sudo -n test -f "$SCHEDULER_SNAPSHOT" && sudo -n python3 - "$SCHEDULER_SNAPSHOT" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(p["recorded_at"].replace("Z","+00:00")).astimezone(timezone.utc)).total_seconds()
          timers={x.get("unit"):x for x in p.get("timers",[])}
          required=("porota-introspection-rc6.timer","porota-introspection-publish-rc6.timer","porota-scheduler-export-rc6.timer")
          assert p.get("state")=="OK" and 0 <= age <= 180
          for unit in required:
              assert timers[unit].get("enabled_state")=="enabled"
              assert timers[unit].get("active_state")=="active"
          print("RC6_SCHEDULER_DASHBOARD_INVENTORY=GREEN")
          PY
            then SCHEDULER_EXPORT_READY=YES; break; fi
            sleep 5
          done
          test "$SCHEDULER_EXPORT_READY" = YES
          echo "RC6_INTROSPECTION_TIMERS=GREEN"
          ! systemctl is-active --quiet porota-public-snapshot-rc6.service
          ! test -e /etc/systemd/system/porota-public-snapshot-rc6.service
          ! test -e "$REPO/rc6_public_snapshot_server.py"
          echo "RC6_PUBLIC_SNAPSHOT=DISABLED"
          POST_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q='ok' if c.execute('SELECT 1').fetchone()[0] == 1 else 'error'
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = "ok|PRODUCTION_PAPER|0"
          CATALOG_RECONCILIATION="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import bf_production_paper_observer as observer
          from be_paper_engine import PaperStore
          db='/app/data/paper_v17/observer_v17.db'
          store=PaperStore(db)
          promoted=observer._reconcile_complementary_catalog(store)
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          ghost=c.execute("""SELECT COUNT(*) FROM candidate_universe u
            WHERE u.can_simulate=1 AND NOT EXISTS (
              SELECT 1 FROM financial_instrument_catalog f
              WHERE f.ticker=u.ticker AND upper(f.instrument_type)=upper(u.instrument_type)
                AND upper(f.market)=upper(u.market) AND f.settlement=u.settlement
                AND f.status='AVAILABLE' AND f.capability LIKE 'READY_PAPER_%')""").fetchone()[0]
          ready=c.execute("""SELECT COUNT(*) FROM financial_instrument_catalog
            WHERE status='AVAILABLE' AND capability LIKE 'READY_PAPER_%'""").fetchone()[0]
          candidates=c.execute("SELECT COUNT(*) FROM candidate_universe WHERE can_simulate=1 AND status='AVAILABLE'").fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close()
          assert mode=='PRODUCTION_PAPER' and int(orders or 0)==0
          assert ghost==0
          print(f'CATALOG_CANDIDATE_RECONCILIATION=GREEN|promoted={promoted}|catalog_ready={ready}|candidate_ready={candidates}|ghosts={ghost}')
          PY
          )"
          echo "$CATALOG_RECONCILIATION"
          grep -Fq "CATALOG_CANDIDATE_RECONCILIATION=GREEN" <<< "$CATALOG_RECONCILIATION"
          SCOPE_CHECK="$(sudo -n docker exec porota_production_observer python - <<'PY'
          import bf_production_paper_observer as observer
          permitted = {
              "ACCIONES", "CEDEARS", "ETFS", "BONOS", "LETRAS",
              "OBLIGACIONES", "OPCIONES", "FUTUROS", "CAUCIONES", "FCI",
          }
          assert set(observer.OPERATIONAL_FAMILIES) == permitted
          assert set(observer.SAFE_PAPER_TYPES) == permitted
          assert all(kind in permitted for _, kind, _ in observer.CORE_SYMBOLS)
          assert observer.DISCOVERY_SEEDS == {}
          plan=observer._candidate_universe()
          assert plan and all(kind in permitted for _, _, _, _, _, kind in plan)
          source=open("/app/bf_production_paper_observer.py",encoding="utf-8").read()
          assert "WATCHLIST_PATH.read_text" not in source
          print("OPERATIONAL_SCOPE=ALL_PAPER_SHADOW_FAMILIES|DISCOVERY=DYNAMIC_MULTISOURCE")
          PY
          )"
          echo "$SCOPE_CHECK"
          # El observador se recrea en el deploy. Esperamos su primer pulso
          # real de PPI en lugar de reprobar el estado STARTING transitorio.
          RUNTIME_CHECK="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import time
          from datetime import datetime, timezone

          deadline = time.monotonic() + 75
          last = None
          while time.monotonic() < deadline:
              try:
                  c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=3)
                  c.execute('PRAGMA query_only=ON')
                  last = c.execute(
                      'SELECT mode,real_orders_sent,ppi_auth,process_state,session_state,'
                      'last_market_data_at,heartbeat_at FROM observer_state WHERE id=1'
                  ).fetchone()
                  c.close()
              except sqlite3.Error as exc:
                  last = ('DB_ERROR', 0, type(exc).__name__, '', '', '', '')
              def fresh(value, seconds):
                  try:
                      observed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                      if observed.tzinfo is None:
                          return False
                      age = (datetime.now(timezone.utc) - observed.astimezone(timezone.utc)).total_seconds()
                      return 0 <= age <= seconds
                  except (TypeError, ValueError):
                      return False
              paper_safe = last and last[0] == 'PRODUCTION_PAPER' and int(last[1] or 0) == 0 and last[2] == 'OK'
              heartbeat_fresh = paper_safe and fresh(last[6], 120)
              market_data_required = last and last[4] == 'MARKET_OPEN'
              # PPI puede tardar más que un ciclo durante una lectura de catálogo.
              # Se conserva la barrera PAPER/0 órdenes y se amplía sólo la ventana
              # de evidencia de mercado para no reprobar un heartbeat sano por latencia.
              market_data_fresh = (not market_data_required) or fresh(last[5], 300)
              if paper_safe and heartbeat_fresh and market_data_fresh:
                  print(f'GO_CHECK=GREEN|{"|".join(map(str,last))}|MARKET_DATA_REQUIRED={market_data_required}')
                  break
              time.sleep(5)
          else:
              print(f'GO_CHECK_FAILED_AFTER_STARTUP={last}')
          PY
          )"
          echo "$RUNTIME_CHECK"
          if ! grep -q '^GO_CHECK=GREEN' <<< "$RUNTIME_CHECK"; then
            echo "OBSERVER_PROCESS_DIAGNOSTIC:"
            sudo -n docker top porota_production_observer -eo pid,ppid,stat,wchan:32,etime,cmd || true
            for pid in $(sudo -n docker top porota_production_observer -eo pid= 2>/dev/null || true); do
              echo "OBSERVER_KERNEL_STACK_PID=$pid"
              sudo -n cat "/proc/$pid/wchan" || true
              sudo -n cat "/proc/$pid/stack" || true
            done
            echo "OBSERVER_LOG_TAIL:"
            sudo -n docker logs --tail 160 porota_production_observer || true
            exit 1
          fi
          echo "REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED"
          # Limpieza final: elimina sólo cache de builder y capas dangling,
          # luego de todas las verificaciones. Nunca toca contenedores,
          # volúmenes, datos, bases, backups ni imágenes referenciadas.
          echo "RC6_POSTDEPLOY_STORAGE_CLEANUP=START"
          sudo -n docker image prune -f
          sudo -n docker builder prune -af
          if sudo -n docker buildx version >/dev/null 2>&1; then sudo -n docker buildx prune -af; fi
          sudo -n docker system df
          FINAL_AVAILABLE_BYTES="$(df -PB1 / | awk 'NR==2 {print $4}')"
          echo "RC6_POSTDEPLOY_AVAILABLE_BYTES=$FINAL_AVAILABLE_BYTES"
          test "$FINAL_AVAILABLE_BYTES" -ge 1073741824
          echo "RC6_POSTDEPLOY_STORAGE_CLEANUP=GREEN"
          echo "RC6_UNIFIED_PAPER_DEPLOY=GREEN"
          VERIFY

      - name: Probe technical API contract with concrete instrument (read-only)
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'PROBE'
          set -Eeuo pipefail
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n env RC6_STAGE="$STAGE" python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.environ["RC6_STAGE"])
          import rc6_official_source_adapters as adapters
          result = adapters.probe_technical_endpoint(
              "A3_MAE",
              "https://marketdata.mae.com.ar/swagger/api-documentacion.html",
              "AL30",
              ("last", "bid", "ask", "timestamp"),
          )
          print("TECHNICAL_API_PROBE=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result["http_status"] is not None
          assert result["status"] == "HTTP_200_NON_DATA_DOCUMENT"
          assert result["usable"] is False
          print("TECHNICAL_API_PROBE_CONTRACT=GREEN|HTTP_200_IS_NOT_FUNCTIONAL_DATA")
          PY
          PROBE

      - name: Execute live official-source evidence adapters (read-only)
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'LIVE'
          set -Eeuo pipefail
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n env "RC6_STAGE=$STAGE" python3 - <<'PY'
          import json
          import os
          import sqlite3
          import sys
          sys.path.insert(0, os.environ["RC6_STAGE"])
          import rc6_official_source_adapters as official_sources

          class Store:
              def connect(self):
                  c = sqlite3.connect("/opt/porota-trading/data/paper_v17/observer_v17.db", timeout=20)
                  c.row_factory = sqlite3.Row
                  return c

          with Store().connect() as c:
              mode, orders = c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          assert mode == "PRODUCTION_PAPER" and int(orders or 0) == 0
          official_sources.assert_read_only_invariants()
          result = official_sources.collect(Store())
          print("OFFICIAL_SOURCE_LIVE_RESULT=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          with Store().connect() as c:
              assert c.execute("SELECT 1").fetchone()[0] == 1
          print("OFFICIAL_SOURCE_LIVE_PERSISTENCE=GREEN")
          PY
          LIVE

