name: RC6 unified Paper deploy 2026-09-15

on:
  push:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Defensive: checkpoints/notes must never recreate the observer.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs(')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate RC6 Paper invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile _version.py bf_production_paper_observer.py bg_paper_dashboard.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py ba_data912_history.py al_historical_ingest.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py rc6_snapshot.py rc6_snapshot_dashboard.py
          python - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_PAPER_POLICY=GREEN')
          PY

      - name: Install focused test runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" requests fastapi

      - name: Run focused release tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_fk_gdelt_shadow_feed_rc6.py tests/test_rc6_gdelt_event_risk_job.py tests/test_rc6_risk_gdelt_dashboard.py tests/test_rc6_legacy_history_scope.py tests/test_rc6_deploy_readiness_contract.py tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_history_operational_scope.py tests/test_rc6_introspection_scope.py tests/test_rc6_scheduler_operational_scope.py tests/test_rc6_internal_history_scheduler_guard.py tests/test_rc6_take_profit_regression.py tests/test_rc6_cedear_underlying_calendar.py tests/test_iol_shadow_observation_rc6.py tests/test_iol_shadow_collector_rc6.py tests/test_rc6_iol_shadow_runtime.py tests/test_iol_shadow_validation_view_rc6.py tests/test_rc6_counterfactual_learning.py tests/test_rc6_validation_truth.py tests/test_rc6_candle_inmarket_evidence.py tests/test_rc6_postclose_history_quarantine.py tests/test_rc6_snapshot.py
          python -m pytest -q tests/test_exit_supervision_v17.py -k "max_hold_sin_datos_persiste_y_se_ejecuta_despues_de_reiniciar or 1655_sigue_dentro_de_rueda_y_un_stop_puede_cerrar or eod_no_aplica_a_cauciones_o_derivados_y_frena_entradas"

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy" "$HOME/.ssh/known_hosts"

      - name: Package exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/porota-rc6-candidate.tgz bf_production_paper_observer.py bg_paper_dashboard.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_snapshot.py rc6_snapshot_dashboard.py
      - name: Deploy exact candidate to Droplet and verify
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/porota-rc6-candidate.tgz "$DO_USER@$DO_HOST:/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          cd "$REPO"
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          PRE_SHA="$(sudo -n git -C "$REPO" rev-parse HEAD)"
          PRE_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "PRE_SHA=$PRE_SHA"
          echo "PRE_STATE=$PRE_STATE"
          test "$PRE_STATE" = 'ok|PRODUCTION_PAPER|0'
          REMOTE_TGZ="/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          test -f "$REMOTE_TGZ"
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n rm -rf "$STAGE"
          sudo -n mkdir -p "$STAGE"
          sudo -n tar -xzf "$REMOTE_TGZ" -C "$STAGE"
          BACKUP="/tmp/porota-rc6-backup-$TARGET_SHA"
          sudo -n rm -rf "$BACKUP"
          sudo -n mkdir -p "$BACKUP"
          for f in bf_production_paper_observer.py bg_paper_dashboard.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_snapshot.py rc6_snapshot_dashboard.py; do
            sudo -n mkdir -p "$BACKUP/$(dirname "$f")" "$REPO/$(dirname "$f")"
            if sudo -n test -f "$REPO/$f"; then sudo -n cp "$REPO/$f" "$BACKUP/$f"; fi
            sudo -n cp "$STAGE/$f" "$REPO/$f"
          done
          # Only bounded observation evidence is installed. PPI Watch and PPI history units are untouched.
          sudo -n install -m 755 "$REPO/ops/porota-rc6-candle-inmarket-verify" /usr/local/sbin/porota-rc6-candle-inmarket-verify
          sudo -n install -m 644 "$REPO/ops/systemd/porota-rc6-candle-inmarket-verify.service" /etc/systemd/system/porota-rc6-candle-inmarket-verify.service
          sudo -n install -m 644 "$REPO/ops/systemd/porota-rc6-candle-inmarket-verify.timer" /etc/systemd/system/porota-rc6-candle-inmarket-verify.timer
          sudo -n install -m 644 "$REPO/systemd/porota-iol-shadow-collector-rc6.service" /etc/systemd/system/porota-iol-shadow-collector-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-iol-shadow-collector-rc6.timer" /etc/systemd/system/porota-iol-shadow-collector-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-preopen-rc6.service" /etc/systemd/system/porota-snapshot-preopen-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-preopen-rc6.timer" /etc/systemd/system/porota-snapshot-preopen-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-postclose-rc6.service" /etc/systemd/system/porota-snapshot-postclose-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-postclose-rc6.timer" /etc/systemd/system/porota-snapshot-postclose-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-public-snapshot-rc6.service" /etc/systemd/system/porota-public-snapshot-rc6.service
          sudo -n install -d -m 755 /var/lib/porota
          printf "%s\n" "118740" | sudo -n tee /var/lib/porota/rc6-candle-inmarket-baseline-20260917 >/dev/null
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now porota-rc6-candle-inmarket-verify.timer porota-iol-shadow-collector-rc6.timer porota-snapshot-preopen-rc6.timer porota-snapshot-postclose-rc6.timer
          # Option C was cancelled: remove every public snapshot listener.
          sudo -n systemctl disable --now porota-public-snapshot-rc6.service || true
          sudo -n rm -f /etc/systemd/system/porota-public-snapshot-rc6.service "$REPO/rc6_public_snapshot_server.py"
          sudo -n systemctl daemon-reload
          PREV_IMAGE_TAG="porota-trading-bot:17.0.0-rc6-rollback-$TARGET_SHA"
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$TARGET_SHA"
          sudo -n docker tag "$TARGET_IMAGE" "$PREV_IMAGE_TAG"
          if ! sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label "porota.version=17.0.0-rc6" -t "$CANDIDATE_IMAGE" "$REPO"; then
            for f in bf_production_paper_observer.py bg_paper_dashboard.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_snapshot.py rc6_snapshot_dashboard.py; do if sudo -n test -f "$BACKUP/$f"; then sudo -n mkdir -p "$REPO/$(dirname "$f")"; sudo -n cp "$BACKUP/$f" "$REPO/$f"; fi; done
            exit 1
          fi
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          # A remote wrapper can return 124 after the manager completed.
          # Continue only after its explicit success marker; all health and safety
          # checks below remain mandatory.
          set +e
          MODE_OUTPUT="$(sudo -n env POROTA_COPY_OUTPUT=0 python3 "$REPO/porota_mode_manager.py" simulation 2>&1)"
          MODE_RC=$?
          set -e
          echo "$MODE_OUTPUT"
          grep -Fqx "POROTA_MODE=OK" <<< "$MODE_OUTPUT"
          if [ "$MODE_RC" -ne 0 ] && [ "$MODE_RC" -ne 124 ]; then
            echo "MODE_MANAGER_EXIT=$MODE_RC"
            exit "$MODE_RC"
          fi
          if [ "$MODE_RC" -eq 124 ]; then
            echo "MODE_MANAGER_WRAPPER_EXIT=124_CONFIRMED_BY_MARKER"
          fi
          OK=NO
          for _ in $(seq 1 8); do
            H="$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null || true)"
            if python3 - "$H" <<'PY'
          import json,sys
          try:
              x=json.loads(sys.argv[1]); assert x.get('status')=='ok' and x.get('version')=='17.0.0-rc6'
          except Exception: raise SystemExit(1)
          PY
            then OK=YES; break; fi
            sleep 2
          done
          test "$OK" = YES
          echo "RC6_DEPLOY_STAGE_ONE=GREEN"
          REMOTE

      - name: Verify deployed candidate and Paper safety
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'VERIFY'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          H="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          python3 - "$H" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get("status") == "ok" and x.get("version") == "17.0.0-rc6"
          PY
          # Bootstrap compacto una sola vez tras un deploy correcto. Cada tarea es diaria y acotada; 60 s cubren el arranque de Python sin autorizar un recorrido de ledger. La cadencia
          # ordinaria sigue siendo diaria; esto evita dejar Validación y Reportes
          # vacíos hasta el día siguiente sin recorrer el ledger en HTTP.
          for job in validation_projection action4_audit; do
            JOB_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 60 python az_maintenance_job.py "$job" 2>&1)"
            echo "$JOB_OUTPUT"
            grep -Fq "Tarea $job completada." <<< "$JOB_OUTPUT"
            echo "BOOTSTRAP_$(tr '[:lower:]' '[:upper:]' <<< "$job")=GREEN"
          done
          # Prueba que el proceso en ejecución contiene el observer del candidato
          # recién desplegado. Evita repetir una omisión de copia en el workflow.
          STAGED_OBSERVER="/tmp/porota-rc6-candidate-$TARGET_SHA/bf_production_paper_observer.py"
          test -f "$STAGED_OBSERVER"
          EXPECTED_OBSERVER_SHA="$(sha256sum "$STAGED_OBSERVER" | awk '{print $1}')"
          RUNNING_OBSERVER_SHA="$(sudo -n docker exec porota_production_observer sha256sum /app/bf_production_paper_observer.py | awk '{print $1}')"
          test "$RUNNING_OBSERVER_SHA" = "$EXPECTED_OBSERVER_SHA"
          echo "OBSERVER_CANDIDATE_SHA=GREEN"
          if ! SCHEDULER_HISTORY_GUARD="$(sudo -n docker exec -i porota_production_observer python - <<'PY' 2>&1
          from pathlib import Path

          source = Path("/app/az_maintenance_scheduler.py").read_text(encoding="utf-8")
          checks = {
              "guard_before_launch": (
                  "if job_name in INTERNAL_HISTORICAL_WRITE_JOBS:" in source
                  and source.index("if job_name in INTERNAL_HISTORICAL_WRITE_JOBS:")
                  < source.index("result = subprocess.run(")
              ),
              "catchup_absent": 'id="maintenance_historical_catchup"' not in source,
              "refresh_absent": 'id="maintenance_historical_refresh"' not in source,
              "startup_absent": 'id="maintenance_historical_startup_catchup"' not in source,
              "news_present": 'id="maintenance_news_scan"' in source,
              "gdelt_present": 'id="maintenance_gdelt_shadow"' in source,
              "audit_present": 'id="maintenance_action4_audit"' in source,
              "projection_present": 'id="maintenance_validation_projection"' in source,
          }
          print(f"SCHEDULER_GUARD_DETAILS={checks}")
          if not all(checks.values()):
              raise SystemExit(1)
          print("INTERNAL_HISTORY_WRITES=DISABLED")
          PY
          )"; then
            echo "$SCHEDULER_HISTORY_GUARD"
            exit 1
          fi
          echo "$SCHEDULER_HISTORY_GUARD"
          grep -Fqx "INTERNAL_HISTORY_WRITES=DISABLED" <<< "$SCHEDULER_HISTORY_GUARD"
          for p in /trading /motor-trading /validacion /reportes; do
            c="$(curl -sS -o /tmp/porota-dashboard-check -w '%{http_code}' --max-time 5 "http://127.0.0.1:8000$p")"
            case "$c" in 200|401) ;; *) echo "DASHBOARD_ROUTE_FAILED=$p HTTP=$c"; exit 1 ;; esac
          done
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import bg_paper_dashboard as bg; bg.validation_page(); print('BG_VALIDATION_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import en_validation_project_dashboard_rc6 as p; p.page(); print('PROJECT_VALIDATION_RENDER=GREEN')"
          set +e
          SNAPSHOT_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 30 python /app/rc6_snapshot.py --phase postclose 2>&1)"
          SNAPSHOT_RC=$?
          set -e
          echo "$SNAPSHOT_OUTPUT"
          test "$SNAPSHOT_RC" -eq 0 -o "$SNAPSHOT_RC" -eq 2
          grep -Eq '"status": "(VERIFIED|INSUFFICIENT_EVIDENCE)"' <<< "$SNAPSHOT_OUTPUT"
          for unit in porota-snapshot-preopen-rc6.timer porota-snapshot-postclose-rc6.timer; do
            test "$(systemctl is-enabled "$unit")" = enabled
            test "$(systemctl is-active "$unit")" = active
          done
          echo "RC6_SNAPSHOT_TIMERS=GREEN"
          ! systemctl is-active --quiet porota-public-snapshot-rc6.service
          ! test -e /etc/systemd/system/porota-public-snapshot-rc6.service
          ! test -e "$REPO/rc6_public_snapshot_server.py"
          echo "RC6_PUBLIC_SNAPSHOT=DISABLED"
          POST_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = "ok|PRODUCTION_PAPER|0"
          SCOPE_CHECK="$(sudo -n docker exec porota_production_observer python - <<'PY'
          import bf_production_paper_observer as observer
          permitted = {"ACCIONES", "CEDEARS"}
          assert set(observer.OPERATIONAL_FAMILIES) == permitted
          assert set(observer.SAFE_PAPER_TYPES) == permitted
          assert all(kind in permitted for _, kind, _ in observer.CORE_SYMBOLS)
          assert set(observer.DISCOVERY_SEEDS).issubset(permitted)
          assert all(kind in permitted for _, kind, _, _, _ in observer._candidate_universe())
          print("OPERATIONAL_SCOPE=ACCIONES_CEDEARS_ONLY")
          PY
          )"
          echo "$SCOPE_CHECK"
          # El observador se recrea en el deploy. Esperamos su primer pulso
          # real de PPI en lugar de reprobar el estado STARTING transitorio.
          RUNTIME_CHECK="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import time
          from datetime import datetime, timezone

          deadline = time.monotonic() + 75
          last = None
          while time.monotonic() < deadline:
              try:
                  c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=3)
                  c.execute('PRAGMA query_only=ON')
                  last = c.execute(
                      'SELECT mode,real_orders_sent,ppi_auth,process_state,session_state,'
                      'last_market_data_at,heartbeat_at FROM observer_state WHERE id=1'
                  ).fetchone()
                  c.close()
              except sqlite3.Error as exc:
                  last = ('DB_ERROR', 0, type(exc).__name__, '', '', '', '')
              def fresh(value, seconds):
                  try:
                      observed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                      if observed.tzinfo is None:
                          return False
                      age = (datetime.now(timezone.utc) - observed.astimezone(timezone.utc)).total_seconds()
                      return 0 <= age <= seconds
                  except (TypeError, ValueError):
                      return False
              paper_safe = last and last[0] == 'PRODUCTION_PAPER' and int(last[1] or 0) == 0 and last[2] == 'OK'
              heartbeat_fresh = paper_safe and fresh(last[6], 120)
              market_data_required = last and last[4] == 'MARKET_OPEN'
              market_data_fresh = (not market_data_required) or fresh(last[5], 180)
              if paper_safe and heartbeat_fresh and market_data_fresh:
                  print(f'GO_CHECK=GREEN|{"|".join(map(str,last))}|MARKET_DATA_REQUIRED={market_data_required}')
                  break
              time.sleep(5)
          else:
              print(f'GO_CHECK_FAILED_AFTER_STARTUP={last}')
          PY
          )"
          echo "$RUNTIME_CHECK"
          if ! grep -q '^GO_CHECK=GREEN' <<< "$RUNTIME_CHECK"; then
            echo "OBSERVER_PROCESS_DIAGNOSTIC:"
            sudo -n docker top porota_production_observer -eo pid,ppid,stat,wchan:32,etime,cmd || true
            for pid in $(sudo -n docker top porota_production_observer -eo pid= 2>/dev/null || true); do
              echo "OBSERVER_KERNEL_STACK_PID=$pid"
              sudo -n cat "/proc/$pid/wchan" || true
              sudo -n cat "/proc/$pid/stack" || true
            done
            echo "OBSERVER_LOG_TAIL:"
            sudo -n docker logs --tail 160 porota_production_observer || true
            exit 1
          fi
          echo "REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED"
          echo "RC6_UNIFIED_PAPER_DEPLOY=GREEN"
          VERIFY

      - name: Audit deployed storage footprint (read-only)
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "bash -s" <<'AUDIT'
          set -Eeuo pipefail
          echo 'STORAGE_AUDIT=READ_ONLY'
          df -h / /opt /var/lib/docker 2>/dev/null || df -h /
          sudo -n docker system df
          sudo -n du -sh /opt/porota-trading/data /opt/porota-trading 2>/dev/null || true
          echo 'STORAGE_CLEANUP=NOT_EXECUTED'
          AUDIT
