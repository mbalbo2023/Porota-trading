name: RC6 unified Paper deploy 2026-09-15

on:
  push:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Defensive: checkpoints/notes must never recreate the observer.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs(')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate RC6 Paper invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RC6_CANONICAL_WORKFLOW_TRIGGER=ACTIVE"
          python -m py_compile scripts/rc6_iol_mcp_inventory.py scripts/rc6_telegram_diagnostic.py rc6_dashboard_responsive_ux.py rc6_ppi_iol_reconciliation_rc6.py rc6_cauciones_shadow_evidence.py rc6_family_readiness.py scripts/rc6_iol_mcp_inventory.py scripts/rc6_telegram_diagnostic.py eq_dashboard_table_layout_rc6.py er_dashboard_table_semantics_rc6.py ak_byma_calendar.py df_daily_operation_summary_hf6.py _version.py cg_paper_workspace.py ops_introspection_rc6.py ops_publish_introspection_rc6.py bf_production_paper_observer.py bg_paper_dashboard.py rc6_annual_instrument_analysis.py rc6_on_validation.py bd_ppi_readonly_guard.py c_ppi_client.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py rc6_official_source_adapters.py rc6_source_consolidation.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py cf_intraday_scalping.py co_market_sessions_hf6.py porota_mode_manager.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py ba_data912_history.py al_historical_ingest.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_full_universe_evidence.py scripts/rc6_candle_inmarket_evidence.py scripts/rc6_history_cutoff_repair_once.py rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py ci_ppi_bond_estimate_patch_hf6.py ch_contract_evidence_hf6.py cm_special_family_discovery_hf6.py cn_ppi_authenticated_family_scraper_hf6.py bs_instrument_contracts.py cq_family_contract_rules_hf6.py cq_contract_readiness_hf6.py rc6_ppi_contract_normalizer.py rc6_contract_dom_collector.py fe_fixed_income_nominal_contract_rc6.py fg_intraday_contract_policy_rc6.py rc6_official_source_adapters.py
          python -m py_compile rc6_source_consolidation.py scripts/rc6_public_source_capture.py scripts/rc6_iol_mcp_inventory.py scripts/rc6_telegram_diagnostic.py
          python - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_PAPER_POLICY=GREEN')
          PY

      - name: Install focused test runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" requests fastapi

      - name: Run focused release tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_iol_mcp_inventory.py tests/test_rc6_official_source_adapters.py tests/test_rc6_source_consolidation.py tests/test_rc6_complementary_catalog_merge.py tests/test_rc6_deploy_runtime_completeness.py tests/test_rc6_ppi_iol_reconciliation_rc6.py tests/test_rc6_cauciones_shadow_evidence.py tests/test_rc6_family_readiness.py tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_fk_gdelt_shadow_feed_rc6.py tests/test_rc6_gdelt_event_risk_job.py tests/test_rc6_risk_gdelt_dashboard.py tests/test_rc6_legacy_history_scope.py tests/test_rc6_deploy_readiness_contract.py tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_history_operational_scope.py tests/test_rc6_introspection_scope.py tests/test_rc6_scheduler_operational_scope.py tests/test_rc6_internal_history_scheduler_guard.py tests/test_rc6_take_profit_regression.py tests/test_rc6_cedear_underlying_calendar.py tests/test_iol_shadow_observation_rc6.py tests/test_iol_shadow_collector_rc6.py tests/test_rc6_iol_shadow_runtime.py tests/test_iol_shadow_validation_view_rc6.py tests/test_rc6_counterfactual_learning.py tests/test_rc6_validation_truth.py tests/test_rc6_candle_inmarket_evidence.py tests/test_rc6_postclose_history_quarantine.py tests/test_rc6_postclose_review.py tests/test_rc6_postclose_review_dashboard.py tests/test_rc6_snapshot.py tests/test_decision_evidence_snapshots_rc6.py tests/test_iol_shadow_decision_input_rc6.py tests/test_rc6_decision_evidence_report.py tests/test_rc6_decision_evidence_view.py tests/test_rc6_shadow_profiles.py
          python -m pytest -q tests/test_exit_supervision_v17.py -k "max_hold_sin_datos_persiste_y_se_ejecuta_despues_de_reiniciar or 1655_sigue_dentro_de_rueda_y_un_stop_puede_cerrar or eod_no_aplica_a_cauciones_o_derivados_y_frena_entradas"
          python -m pytest -q tests/test_rc6_t1_settlement_hotfix.py tests/test_daily_risk_outbox_v17.py tests/test_dynamic_risk_and_caucion_sweep_hf6.py tests/test_dashboard_live_integration_rc5.py

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy" "$HOME/.ssh/known_hosts"

      - name: Package exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          # The archive is the immutable deployment candidate. Include the dependency
          # manifest because the image is built from this staging tree, never from a
          # potentially stale host checkout.
          tar -czf /tmp/porota-rc6-candidate.tgz $(git ls-files '*.py') .dockerignore requirements.txt docker-compose.yml Dockerfile _version.py cg_paper_workspace.py cg_paper_workspace.py ak_byma_calendar.py df_daily_operation_summary_hf6.py bf_production_paper_observer.py bg_paper_dashboard.py zz_wave8_dashboard_live_rc6.py rc6_annual_instrument_analysis.py rc6_on_validation.py bd_ppi_readonly_guard.py c_ppi_client.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ci_ppi_bond_estimate_patch_hf6.py ch_contract_evidence_hf6.py cm_special_family_discovery_hf6.py cn_ppi_authenticated_family_scraper_hf6.py bs_instrument_contracts.py cq_family_contract_rules_hf6.py cq_contract_readiness_hf6.py rc6_ppi_contract_normalizer.py rc6_contract_dom_collector.py fe_fixed_income_nominal_contract_rc6.py fg_intraday_contract_policy_rc6.py ck_contract_evidence_runner_hf6.py rc6_official_source_adapters.py rc6_source_consolidation.py scripts/rc6_public_source_capture.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py cf_intraday_scalping.py co_market_sessions_hf6.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_full_universe_evidence.py scripts/rc6_candle_inmarket_evidence.py scripts/rc6_history_cutoff_repair_once.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py rc6_dashboard_responsive_ux.py rc6_ppi_iol_reconciliation_rc6.py rc6_cauciones_shadow_evidence.py rc6_family_readiness.py scripts/rc6_iol_mcp_inventory.py scripts/rc6_telegram_diagnostic.py eq_dashboard_table_layout_rc6.py er_dashboard_table_semantics_rc6.py ops_introspection_rc6.py ops_publish_introspection_rc6.py scripts/porota_introspection_rc6_host.sh scripts/porota_publish_introspection_github_rc6.sh scripts/porota_export_scheduler_state_rc6.sh systemd/porota-introspection-rc6.service systemd/porota-introspection-rc6.timer systemd/porota-introspection-publish-rc6.service systemd/porota-introspection-publish-rc6.timer systemd/porota-scheduler-export-rc6.service systemd/porota-scheduler-export-rc6.timer POROTA_SECTOR_MAP_V1.csv
      - name: Deploy exact candidate to Droplet and verify
        id: deploy_stage
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/porota-rc6-candidate.tgz "$DO_USER@$DO_HOST:/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          cd "$REPO"
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$TARGET_SHA"
          # Keep the live stable tag and the exact candidate for this SHA. Remove
          # only RC6 candidate/rollback tags with full-SHA suffixes, and only
          # when no running or stopped container references the image ID.
          # No global prune, build-cache, volume, database, container, or other
          # repository/image cleanup is allowed here.
          cleanup_rc6_image_tags() {
            # Reusable cleanup: never terminates the caller. The EXIT trap below
            # owns process termination; pre-build cleanup must return to the build.
            set +e
            local cleanup_failed=0 inventory_ok=1
            local container_ids container_image_ids image_refs ref image_id
            echo "RC6_IMAGE_RETENTION_CLEANUP=START"
            sudo -n docker system df || cleanup_failed=1
            container_ids="$(sudo -n docker ps -aq 2>/dev/null)"
            if [ $? -ne 0 ]; then
              echo "RC6_IMAGE_RETENTION_INVENTORY=FAILED_CONTAINER_LIST"
              inventory_ok=0
              cleanup_failed=1
            fi
            container_image_ids=""
            if [ "$inventory_ok" -eq 1 ] && [ -n "$container_ids" ]; then
              container_image_ids="$(sudo -n docker inspect --format '{{.Image}}' $container_ids 2>/dev/null)"
              if [ $? -ne 0 ]; then
                echo "RC6_IMAGE_RETENTION_INVENTORY=FAILED_CONTAINER_IMAGES"
                inventory_ok=0
                cleanup_failed=1
              fi
            fi
            image_refs=""
            if [ "$inventory_ok" -eq 1 ]; then
              image_refs="$(sudo -n docker image ls --no-trunc --format '{{.Repository}}:{{.Tag}} {{.ID}}' 2>/dev/null)"
              if [ $? -ne 0 ]; then
                echo "RC6_IMAGE_RETENTION_INVENTORY=FAILED_IMAGE_LIST"
                inventory_ok=0
                cleanup_failed=1
              fi
            fi
            if [ "$inventory_ok" -eq 1 ]; then
              while IFS=' ' read -r ref image_id; do
                [ -n "$ref" ] || continue
                if [[ "$ref" =~ ^porota-trading-bot:17\.0\.0-rc6-(candidate|rollback)-[0-9a-f]{40}$ ]]; then
                  :
                elif [[ "$ref" =~ ^porota-trading-bot:17\.0\.0-rc6-(pr69|strategy|eod-only|p0-eod|f01|eod-ui)-[0-9a-f]{12}$ ]] || \
                     [[ "$ref" =~ ^porota-trading-bot:17\.0\.0-rc6-scalping-[0-9a-f]{7}$ ]] || \
                     [ "$ref" = "porota-trading-bot:17.0.0-rc6-candidate-e47eeffc" ] || \
                     [ "$ref" = "porota-trading-bot:17.0.0-rc4-test-ready1" ]; then
                  :
                else
                  continue
                fi
                if [ "$ref" = "$CANDIDATE_IMAGE" ]; then
                  # The current candidate remains available for the subsequent
                  # verify steps in this same workflow. Older candidate/rollback
                  # tags continue through the allowlisted cleanup below.
                  echo "RC6_IMAGE_TAG_KEPT=$ref|CURRENT_CANDIDATE_UNTIL_FINAL_VERIFY"
                  continue
                fi
                if grep -Fxq "$image_id" <<< "$container_image_ids"; then
                  echo "RC6_IMAGE_TAG_KEPT=$ref|CONTAINER_REFERENCED"
                  continue
                fi
                if sudo -n docker image rm "$ref" >/dev/null; then
                  echo "RC6_IMAGE_TAG_REMOVED=$ref"
                else
                  echo "RC6_IMAGE_TAG_REMOVE_FAILED=$ref"
                  cleanup_failed=1
                fi
              done <<< "$image_refs"
            fi
            echo "RC6_IMAGE_RETENTION_CLEANUP=END"
            sudo -n docker system df || cleanup_failed=1
            if [ "$cleanup_failed" -ne 0 ]; then
              return 1
            fi
            return 0
          }
          # Compatibility marker retained for the deploy-readiness contract:
          # trap cleanup_rc6_image_tags EXIT
          trap 'deploy_rc=$?; cleanup_rc6_image_tags || [ "$deploy_rc" -ne 0 ]; exit "$deploy_rc"' EXIT
          PRE_SHA="$(sudo -n git -C "$REPO" rev-parse HEAD)"
          PRE_STATE="NO_RUNNING_OBSERVER"
          if [ "$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer 2>/dev/null || true)" = "running" ]; then
            PRE_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          c.execute('SELECT 1').fetchone()
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,('ok',mode,orders))))
          PY
            )"
          fi
          echo "PRE_SHA=$PRE_SHA"
          echo "PRE_STATE=$PRE_STATE"
          if [ "$PRE_STATE" != "NO_RUNNING_OBSERVER" ]; then
            test "$PRE_STATE" = 'ok|PRODUCTION_PAPER|0'
          fi
          REMOTE_TGZ="/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          test -f "$REMOTE_TGZ"
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n rm -rf "$STAGE"
          sudo -n mkdir -p "$STAGE"
          sudo -n tar -xzf "$REMOTE_TGZ" -C "$STAGE"
          test -f "$STAGE/rc6_source_consolidation.py"
          test -f "$STAGE/rc6_multisource_discovery.py"
          test -f "$STAGE/rc6_iol_family_reference.py"
          test -f "$STAGE/POROTA_SECTOR_MAP_V1.csv"
          test -f "$STAGE/scripts/rc6_full_universe_evidence.py"
          sudo -n install -m 0644 "$STAGE/docker-compose.yml" "$REPO/docker-compose.yml"
          ! grep -Eq 'rc4-test-ready1|candidate-e47eeffc' "$REPO/docker-compose.yml"
          echo 'LEGACY_COMPOSE_IMAGE_DEFAULT=RC6_STABLE'
          BACKUP="/tmp/porota-rc6-backup-$TARGET_SHA"
          sudo -n rm -rf "$BACKUP"
          sudo -n mkdir -p "$BACKUP"
          for f in Dockerfile _version.py cg_paper_workspace.py bf_production_paper_observer.py bg_paper_dashboard.py rc6_annual_instrument_analysis.py rc6_on_validation.py bd_ppi_readonly_guard.py c_ppi_client.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py rc6_official_source_adapters.py rc6_source_consolidation.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py cf_intraday_scalping.py co_market_sessions_hf6.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_full_universe_evidence.py scripts/rc6_candle_inmarket_evidence.py scripts/rc6_history_cutoff_repair_once.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py rc6_dashboard_responsive_ux.py rc6_ppi_iol_reconciliation_rc6.py rc6_cauciones_shadow_evidence.py rc6_family_readiness.py rc6_multisource_discovery.py rc6_iol_family_reference.py POROTA_SECTOR_MAP_V1.csv eq_dashboard_table_layout_rc6.py er_dashboard_table_semantics_rc6.py ops_introspection_rc6.py ops_publish_introspection_rc6.py scripts/porota_introspection_rc6_host.sh scripts/porota_publish_introspection_github_rc6.sh scripts/porota_export_scheduler_state_rc6.sh systemd/porota-introspection-rc6.service systemd/porota-introspection-rc6.timer systemd/porota-introspection-publish-rc6.service systemd/porota-introspection-publish-rc6.timer systemd/porota-scheduler-export-rc6.service systemd/porota-scheduler-export-rc6.timer; do
            sudo -n mkdir -p "$BACKUP/$(dirname "$f")" "$REPO/$(dirname "$f")"
            if sudo -n test -f "$REPO/$f"; then sudo -n cp "$REPO/$f" "$BACKUP/$f"; fi
            sudo -n cp "$STAGE/$f" "$REPO/$f"
          done
          test -f "$REPO/rc6_source_consolidation.py"
          test -f "$REPO/rc6_iol_family_reference.py"
          sudo -n python3 -c "import sys; sys.path.insert(0, '/opt/porota-trading'); import rc6_source_consolidation,rc6_multisource_discovery,rc6_iol_family_reference; from scripts import rc6_full_universe_evidence; print('RC6_DEPLOY_IMPORT=GREEN|rc6_source_consolidation|rc6_multisource_discovery|rc6_iol_family_reference|scripts.rc6_full_universe_evidence')"
          # Only bounded observation evidence is installed. PPI Watch and PPI history units are untouched.
          sudo -n install -m 755 "$REPO/ops/porota-rc6-candle-inmarket-verify" /usr/local/sbin/porota-rc6-candle-inmarket-verify
          sudo -n install -m 644 "$REPO/ops/systemd/porota-rc6-candle-inmarket-verify.service" /etc/systemd/system/porota-rc6-candle-inmarket-verify.service
          sudo -n install -m 644 "$REPO/ops/systemd/porota-rc6-candle-inmarket-verify.timer" /etc/systemd/system/porota-rc6-candle-inmarket-verify.timer
          sudo -n install -m 644 "$REPO/systemd/porota-iol-shadow-collector-rc6.service" /etc/systemd/system/porota-iol-shadow-collector-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-iol-shadow-collector-rc6.timer" /etc/systemd/system/porota-iol-shadow-collector-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-preopen-rc6.service" /etc/systemd/system/porota-snapshot-preopen-rc6.service
