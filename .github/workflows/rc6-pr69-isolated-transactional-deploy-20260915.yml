name: RC6 unified Paper deploy 2026-09-15

on:
  push:
    branches:
      - deploy/rc6-pr69-isolated-20260915
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate RC6 Paper invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile _version.py bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py
          python - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_PAPER_POLICY=GREEN')
          PY

      - name: Run focused release tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy" "$HOME/.ssh/known_hosts"

      - name: Package exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/porota-rc6-candidate.tgz bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py
      - name: Deploy exact candidate to Droplet and verify
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/porota-rc6-candidate.tgz "$DO_USER@$DO_HOST:/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          cd "$REPO"
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          PRE_SHA="$(sudo -n git -C "$REPO" rev-parse HEAD)"
          PRE_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "PRE_SHA=$PRE_SHA"
          echo "PRE_STATE=$PRE_STATE"
          test "$PRE_STATE" = 'ok|PRODUCTION_PAPER|0'
          REMOTE_TGZ="/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          test -f "$REMOTE_TGZ"
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n rm -rf "$STAGE"
          sudo -n mkdir -p "$STAGE"
          sudo -n tar -xzf "$REMOTE_TGZ" -C "$STAGE"
          BACKUP="/tmp/porota-rc6-backup-$TARGET_SHA"
          sudo -n rm -rf "$BACKUP"
          sudo -n mkdir -p "$BACKUP"
          for f in bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py; do
            if sudo -n test -f "$REPO/$f"; then sudo -n cp "$REPO/$f" "$BACKUP/$f"; fi
            sudo -n cp "$STAGE/$f" "$REPO/$f"
          done
          PREV_IMAGE_TAG="porota-trading-bot:17.0.0-rc6-rollback-$TARGET_SHA"
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$TARGET_SHA"
          sudo -n docker tag "$TARGET_IMAGE" "$PREV_IMAGE_TAG"
          if ! sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label "porota.version=17.0.0-rc6" -t "$CANDIDATE_IMAGE" "$REPO"; then
            for f in bg_paper_dashboard.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py; do if sudo -n test -f "$BACKUP/$f"; then sudo -n cp "$BACKUP/$f" "$REPO/$f"; fi; done
            exit 1
          fi
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation
          OK=NO
          for _ in $(seq 1 45); do
            H="$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null || true)"
            if python3 - "$H" <<'PY'
          import json,sys
          try:
              x=json.loads(sys.argv[1]); assert x.get('status')=='ok' and x.get('version')=='17.0.0-rc6'
          except Exception: raise SystemExit(1)
          PY
            then OK=YES; break; fi
            sleep 2
          done
          if [ "$OK" != YES ]; then
            for f in bg_paper_dashboard.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py; do sudo -n cp "$BACKUP/$f" "$REPO/$f"; done
            sudo -n docker tag "$PREV_IMAGE_TAG" "$TARGET_IMAGE"
            sudo -n python3 "$REPO/porota_mode_manager.py" simulation
            exit 1
          fi
          # Validation projection is deliberately decoupled from deploy. It runs once
          # per day as a bounded background task; a deploy only verifies rendering.
          # This prevents an archive scan from holding SSH or blocking a safe release.
          echo "VALIDATION_PROJECTION_BOOTSTRAP=DEFERRED_DAILY_JOB"
          # Publica la auditoría compacta ahora para que Reportes no espere
          # hasta la próxima cadencia diaria. Sólo lee SQLite y escribe un JSON.
          ACTION4_AUDIT="$(sudo -n docker exec porota_production_dashboard timeout 30 python az_maintenance_job.py action4_audit 2>&1)"
          echo "$ACTION4_AUDIT"
          grep -q "Tarea action4_audit completada" <<< "$ACTION4_AUDIT"
          echo "ACTION4_AUDIT_BOOTSTRAP=GREEN"
          ROUTE_FAILURES=0
          for PATH_CHECK in /trading /motor-trading /validacion /reportes; do
            CODE="$(curl -sS -o /tmp/porota-dashboard-check -w '%{http_code}' --max-time 10 "http://127.0.0.1:8000$PATH_CHECK" || true)"
            case "$CODE" in 200|401) ;; *) echo "DASHBOARD_ROUTE_FAILED=$PATH_CHECK HTTP=$CODE"; sed -n "1,120p" /tmp/porota-dashboard-check; ROUTE_FAILURES=1 ;; esac
          done
          echo "DASHBOARD_ROUTE_FAILURES=$ROUTE_FAILURES"
          RENDER_FAILURES=0
          BG_RENDER="$(sudo -n docker exec porota_production_dashboard timeout 30 python -c "import bg_paper_dashboard as bg; bg.validation_page(); print('BG_VALIDATION_RENDER=GREEN')" 2>&1 || true)"
          echo "$BG_RENDER"
          if ! grep -q "BG_VALIDATION_RENDER=GREEN" <<< "$BG_RENDER"; then RENDER_FAILURES=1; fi
          PROJECT_RENDER="$(sudo -n docker exec porota_production_dashboard timeout 30 python -c "import en_validation_project_dashboard_rc6 as p; p.page(); print('PROJECT_VALIDATION_RENDER=GREEN')" 2>&1 || true)"
          echo "$PROJECT_RENDER"
          if ! grep -q "PROJECT_VALIDATION_RENDER=GREEN" <<< "$PROJECT_RENDER"; then RENDER_FAILURES=1; fi
          echo "DASHBOARD_RENDER_FAILURES=$RENDER_FAILURES"
          test "$ROUTE_FAILURES" = 0
          test "$RENDER_FAILURES" = 0
          POST_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = 'ok|PRODUCTION_PAPER|0'
          echo "DEPLOYED_SHA=$TARGET_SHA"
          echo 'REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'RC6_UNIFIED_PAPER_DEPLOY=GREEN'
          sudo -n docker compose ps
          REMOTE
