name: RC6 unified Paper deploy 2026-09-15

on:
  push:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Defensive: checkpoints/notes must never recreate the observer.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs(')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate RC6 Paper invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile ak_byma_calendar.py df_daily_operation_summary_hf6.py _version.py ops_introspection_rc6.py ops_publish_introspection_rc6.py bf_production_paper_observer.py bg_paper_dashboard.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py ba_data912_history.py al_historical_ingest.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py
          python - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_PAPER_POLICY=GREEN')
          PY

      - name: Install focused test runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" requests fastapi

      - name: Run focused release tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_fk_gdelt_shadow_feed_rc6.py tests/test_rc6_gdelt_event_risk_job.py tests/test_rc6_risk_gdelt_dashboard.py tests/test_rc6_legacy_history_scope.py tests/test_rc6_deploy_readiness_contract.py tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_history_operational_scope.py tests/test_rc6_introspection_scope.py tests/test_rc6_scheduler_operational_scope.py tests/test_rc6_internal_history_scheduler_guard.py tests/test_rc6_take_profit_regression.py tests/test_rc6_cedear_underlying_calendar.py tests/test_iol_shadow_observation_rc6.py tests/test_iol_shadow_collector_rc6.py tests/test_rc6_iol_shadow_runtime.py tests/test_iol_shadow_validation_view_rc6.py tests/test_rc6_counterfactual_learning.py tests/test_rc6_validation_truth.py tests/test_rc6_candle_inmarket_evidence.py tests/test_rc6_postclose_history_quarantine.py tests/test_rc6_postclose_review.py tests/test_rc6_postclose_review_dashboard.py tests/test_rc6_snapshot.py tests/test_decision_evidence_snapshots_rc6.py tests/test_iol_shadow_decision_input_rc6.py tests/test_rc6_decision_evidence_report.py tests/test_rc6_decision_evidence_view.py tests/test_rc6_shadow_profiles.py
          python -m pytest -q tests/test_exit_supervision_v17.py -k "max_hold_sin_datos_persiste_y_se_ejecuta_despues_de_reiniciar or 1655_sigue_dentro_de_rueda_y_un_stop_puede_cerrar or eod_no_aplica_a_cauciones_o_derivados_y_frena_entradas"
          python -m pytest -q tests/test_rc6_t1_settlement_hotfix.py tests/test_daily_risk_outbox_v17.py tests/test_dynamic_risk_and_caucion_sweep_hf6.py tests/test_dashboard_live_integration_rc5.py

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy" "$HOME/.ssh/known_hosts"

      - name: Package exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/porota-rc6-candidate.tgz docker-compose.yml ak_byma_calendar.py df_daily_operation_summary_hf6.py bf_production_paper_observer.py bg_paper_dashboard.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py ops_introspection_rc6.py ops_publish_introspection_rc6.py scripts/porota_introspection_rc6_host.sh scripts/porota_publish_introspection_github_rc6.sh scripts/porota_export_scheduler_state_rc6.sh systemd/porota-introspection-rc6.service systemd/porota-introspection-rc6.timer systemd/porota-introspection-publish-rc6.service systemd/porota-introspection-publish-rc6.timer systemd/porota-scheduler-export-rc6.service systemd/porota-scheduler-export-rc6.timer
      - name: Deploy exact candidate to Droplet and verify
        id: deploy_stage
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/porota-rc6-candidate.tgz "$DO_USER@$DO_HOST:/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          cd "$REPO"
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$TARGET_SHA"
          # Keep the live stable tag and the exact candidate for this SHA. Remove
          # only RC6 candidate/rollback tags with full-SHA suffixes, and only
          # when no running or stopped container references the image ID.
          # No global prune, build-cache, volume, database, container, or other
          # repository/image cleanup is allowed here.
          cleanup_rc6_image_tags() {
            local deploy_rc=$?
            trap - EXIT
            set +e
            local cleanup_failed=0 inventory_ok=1
            local container_ids container_image_ids image_refs ref image_id
            echo "RC6_IMAGE_RETENTION_CLEANUP=START"
            sudo -n docker system df || cleanup_failed=1
            container_ids="$(sudo -n docker ps -aq 2>/dev/null)"
            if [ $? -ne 0 ]; then
              echo "RC6_IMAGE_RETENTION_INVENTORY=FAILED_CONTAINER_LIST"
              inventory_ok=0
              cleanup_failed=1
            fi
            container_image_ids=""
            if [ "$inventory_ok" -eq 1 ] && [ -n "$container_ids" ]; then
              container_image_ids="$(sudo -n docker inspect --format '{{.Image}}' $container_ids 2>/dev/null)"
              if [ $? -ne 0 ]; then
                echo "RC6_IMAGE_RETENTION_INVENTORY=FAILED_CONTAINER_IMAGES"
                inventory_ok=0
                cleanup_failed=1
              fi
            fi
            image_refs=""
            if [ "$inventory_ok" -eq 1 ]; then
              image_refs="$(sudo -n docker image ls --no-trunc --format '{{.Repository}}:{{.Tag}} {{.ID}}' 2>/dev/null)"
              if [ $? -ne 0 ]; then
                echo "RC6_IMAGE_RETENTION_INVENTORY=FAILED_IMAGE_LIST"
                inventory_ok=0
                cleanup_failed=1
              fi
            fi
            if [ "$inventory_ok" -eq 1 ]; then
              while IFS=' ' read -r ref image_id; do
                [ -n "$ref" ] || continue
                if [[ "$ref" =~ ^porota-trading-bot:17\.0\.0-rc6-(candidate|rollback)-[0-9a-f]{40}$ ]]; then
                  :
                elif [[ "$ref" =~ ^porota-trading-bot:17\.0\.0-rc6-(pr69|strategy|eod-only|p0-eod|f01|eod-ui)-[0-9a-f]{12}$ ]] || \
                     [[ "$ref" =~ ^porota-trading-bot:17\.0\.0-rc6-scalping-[0-9a-f]{7}$ ]] || \
                     [ "$ref" = "porota-trading-bot:17.0.0-rc6-candidate-e47eeffc" ] || \
                     [ "$ref" = "porota-trading-bot:17.0.0-rc4-test-ready1" ]; then
                  :
                else
                  continue
                fi
                if [ "$ref" = "$CANDIDATE_IMAGE" ]; then
                  stable_image_id="$(sudo -n docker image inspect --format '{{.Id}}' "$TARGET_IMAGE" 2>/dev/null)"
                  if [ "$stable_image_id" = "$image_id" ]; then
                    if sudo -n docker image rm "$ref" >/dev/null; then
                      echo "RC6_IMAGE_TAG_REMOVED=$ref|STABLE_DIGEST_VERIFIED"
                    else
                      echo "RC6_IMAGE_TAG_REMOVE_FAILED=$ref"
                      cleanup_failed=1
                    fi
                  elif ! grep -Fxq "$image_id" <<< "$container_image_ids"; then
                    if sudo -n docker image rm "$ref" >/dev/null; then
                      echo "RC6_IMAGE_TAG_REMOVED=$ref|UNREFERENCED_CANDIDATE"
                    else
                      echo "RC6_IMAGE_TAG_REMOVE_FAILED=$ref"
                      cleanup_failed=1
                    fi
                  else
                    echo "RC6_IMAGE_TAG_KEPT=$ref|ACTIVE_IMAGE_WITHOUT_STABLE_ALIAS"
                  fi
                  continue
                fi
                if grep -Fxq "$image_id" <<< "$container_image_ids"; then
                  echo "RC6_IMAGE_TAG_KEPT=$ref|CONTAINER_REFERENCED"
                  continue
                fi
                if sudo -n docker image rm "$ref" >/dev/null; then
                  echo "RC6_IMAGE_TAG_REMOVED=$ref"
                else
                  echo "RC6_IMAGE_TAG_REMOVE_FAILED=$ref"
                  cleanup_failed=1
                fi
              done <<< "$image_refs"
            fi
            echo "RC6_IMAGE_RETENTION_CLEANUP=END"
            sudo -n docker system df || cleanup_failed=1
            if [ "$deploy_rc" -eq 0 ] && [ "$cleanup_failed" -ne 0 ]; then
              exit 1
            fi
            exit "$deploy_rc"
          }
          trap cleanup_rc6_image_tags EXIT
          PRE_SHA="$(sudo -n git -C "$REPO" rev-parse HEAD)"
          PRE_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "PRE_SHA=$PRE_SHA"
          echo "PRE_STATE=$PRE_STATE"
          test "$PRE_STATE" = 'ok|PRODUCTION_PAPER|0'
          REMOTE_TGZ="/tmp/porota-rc6-candidate-$TARGET_SHA.tgz"
          test -f "$REMOTE_TGZ"
          STAGE="/tmp/porota-rc6-candidate-$TARGET_SHA"
          sudo -n rm -rf "$STAGE"
          sudo -n mkdir -p "$STAGE"
          sudo -n tar -xzf "$REMOTE_TGZ" -C "$STAGE"
          sudo -n install -m 0644 "$STAGE/docker-compose.yml" "$REPO/docker-compose.yml"
          ! grep -Eq 'rc4-test-ready1|candidate-e47eeffc' "$REPO/docker-compose.yml"
          echo 'LEGACY_COMPOSE_IMAGE_DEFAULT=RC6_STABLE'
          BACKUP="/tmp/porota-rc6-backup-$TARGET_SHA"
          sudo -n rm -rf "$BACKUP"
          sudo -n mkdir -p "$BACKUP"
          for f in bf_production_paper_observer.py bg_paper_dashboard.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py ops_introspection_rc6.py ops_publish_introspection_rc6.py scripts/porota_introspection_rc6_host.sh scripts/porota_publish_introspection_github_rc6.sh scripts/porota_export_scheduler_state_rc6.sh systemd/porota-introspection-rc6.service systemd/porota-introspection-rc6.timer systemd/porota-introspection-publish-rc6.service systemd/porota-introspection-publish-rc6.timer systemd/porota-scheduler-export-rc6.service systemd/porota-scheduler-export-rc6.timer; do
            sudo -n mkdir -p "$BACKUP/$(dirname "$f")" "$REPO/$(dirname "$f")"
            if sudo -n test -f "$REPO/$f"; then sudo -n cp "$REPO/$f" "$BACKUP/$f"; fi
            sudo -n cp "$STAGE/$f" "$REPO/$f"
          done
          # Only bounded observation evidence is installed. PPI Watch and PPI history units are untouched.
          sudo -n install -m 755 "$REPO/ops/porota-rc6-candle-inmarket-verify" /usr/local/sbin/porota-rc6-candle-inmarket-verify
          sudo -n install -m 644 "$REPO/ops/systemd/porota-rc6-candle-inmarket-verify.service" /etc/systemd/system/porota-rc6-candle-inmarket-verify.service
          sudo -n install -m 644 "$REPO/ops/systemd/porota-rc6-candle-inmarket-verify.timer" /etc/systemd/system/porota-rc6-candle-inmarket-verify.timer
          sudo -n install -m 644 "$REPO/systemd/porota-iol-shadow-collector-rc6.service" /etc/systemd/system/porota-iol-shadow-collector-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-iol-shadow-collector-rc6.timer" /etc/systemd/system/porota-iol-shadow-collector-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-preopen-rc6.service" /etc/systemd/system/porota-snapshot-preopen-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-preopen-rc6.timer" /etc/systemd/system/porota-snapshot-preopen-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-postclose-rc6.service" /etc/systemd/system/porota-snapshot-postclose-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-snapshot-postclose-rc6.timer" /etc/systemd/system/porota-snapshot-postclose-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-public-snapshot-rc6.service" /etc/systemd/system/porota-public-snapshot-rc6.service
          sudo -n install -d -m 755 /var/lib/porota
          printf "%s\n" "118740" | sudo -n tee /var/lib/porota/rc6-candle-inmarket-baseline-20260917 >/dev/null
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now porota-rc6-candle-inmarket-verify.timer porota-iol-shadow-collector-rc6.timer porota-snapshot-preopen-rc6.timer porota-snapshot-postclose-rc6.timer
          # Option C was cancelled: remove every public snapshot listener.
          sudo -n systemctl disable --now porota-public-snapshot-rc6.service || true
          sudo -n rm -f /etc/systemd/system/porota-public-snapshot-rc6.service "$REPO/rc6_public_snapshot_server.py"
          sudo -n systemctl daemon-reload
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$TARGET_SHA"
          if ! sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label "porota.version=17.0.0-rc6" -t "$CANDIDATE_IMAGE" "$REPO"; then
            for f in bf_production_paper_observer.py bg_paper_dashboard.py cr_pending_settlement_diagnostics_hf6.py o_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py historical_candle_shadow_rc6.py al_historical_ingest.py ba_data912_history.py rc6_cost_settlement_takeprofit_shadow.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py rc6_gdelt_event_risk_job.py rc6_risk_gdelt_dashboard.py rc6_gdelt_shadow.py rc6_validation_dynamic.py rc6_validation_operational_daily.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py ez_iol_shadow_validation_view_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py ops/porota-rc6-candle-inmarket-verify ops/systemd/porota-rc6-candle-inmarket-verify.service ops/systemd/porota-rc6-candle-inmarket-verify.timer systemd/porota-iol-shadow-collector-rc6.service systemd/porota-iol-shadow-collector-rc6.timer systemd/porota-snapshot-preopen-rc6.service systemd/porota-snapshot-preopen-rc6.timer systemd/porota-snapshot-postclose-rc6.service systemd/porota-snapshot-postclose-rc6.timer rc6_postclose_review.py rc6_postclose_review_dashboard.py rc6_snapshot.py rc6_snapshot_dashboard.py rc6_decision_evidence_report.py rc6_decision_evidence_view.py rc6_shadow_profiles.py iol_shadow_decision_input_rc6.py ops_introspection_rc6.py ops_publish_introspection_rc6.py scripts/porota_introspection_rc6_host.sh scripts/porota_publish_introspection_github_rc6.sh scripts/porota_export_scheduler_state_rc6.sh systemd/porota-introspection-rc6.service systemd/porota-introspection-rc6.timer systemd/porota-introspection-publish-rc6.service systemd/porota-introspection-publish-rc6.timer systemd/porota-scheduler-export-rc6.service systemd/porota-scheduler-export-rc6.timer; do if sudo -n test -f "$BACKUP/$f"; then sudo -n mkdir -p "$REPO/$(dirname "$f")"; sudo -n cp "$BACKUP/$f" "$REPO/$f"; fi; done
          if [ ! -f "$BACKUP/ops_introspection_rc6.py" ]; then sudo -n rm -f "$REPO/ops_introspection_rc6.py"; fi
          if [ ! -f "$BACKUP/ops_publish_introspection_rc6.py" ]; then sudo -n rm -f "$REPO/ops_publish_introspection_rc6.py"; fi
          if [ ! -f "$BACKUP/scripts/porota_introspection_rc6_host.sh" ]; then sudo -n rm -f "$REPO/scripts/porota_introspection_rc6_host.sh"; fi
          if [ ! -f "$BACKUP/scripts/porota_publish_introspection_github_rc6.sh" ]; then sudo -n rm -f "$REPO/scripts/porota_publish_introspection_github_rc6.sh"; fi
          if [ ! -f "$BACKUP/scripts/porota_export_scheduler_state_rc6.sh" ]; then sudo -n rm -f "$REPO/scripts/porota_export_scheduler_state_rc6.sh"; fi
          if [ ! -f "$BACKUP/systemd/porota-introspection-rc6.service" ]; then sudo -n rm -f "$REPO/systemd/porota-introspection-rc6.service"; fi
          if [ ! -f "$BACKUP/systemd/porota-introspection-rc6.timer" ]; then sudo -n rm -f "$REPO/systemd/porota-introspection-rc6.timer"; fi
          if [ ! -f "$BACKUP/systemd/porota-introspection-publish-rc6.service" ]; then sudo -n rm -f "$REPO/systemd/porota-introspection-publish-rc6.service"; fi
          if [ ! -f "$BACKUP/systemd/porota-introspection-publish-rc6.timer" ]; then sudo -n rm -f "$REPO/systemd/porota-introspection-publish-rc6.timer"; fi
          if [ ! -f "$BACKUP/systemd/porota-scheduler-export-rc6.service" ]; then sudo -n rm -f "$REPO/systemd/porota-scheduler-export-rc6.service"; fi
          if [ ! -f "$BACKUP/systemd/porota-scheduler-export-rc6.timer" ]; then sudo -n rm -f "$REPO/systemd/porota-scheduler-export-rc6.timer"; fi
            exit 1
          fi
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          # Recreate the isolated approval gateway only when the stable RC6 tag
          # now resolves to a different immutable image. Its database and
          # credentials remain bind-mounted; the health probe is issues-only.
          COMPOSE_IMAGES="$(sudo -n env POROTA_IMAGE="$TARGET_IMAGE" docker compose -f "$REPO/docker-compose.yml" config --images)"
          printf '%s\n' "$COMPOSE_IMAGES"
          test "$(grep -Fxc "$TARGET_IMAGE" <<< "$COMPOSE_IMAGES")" -eq 2
          ! grep -Fq 'rc4-test-ready1' <<< "$COMPOSE_IMAGES"
          if sudo -n systemctl is-active --quiet porota-critical-approval-rc6.service; then
            UNIT_EXEC_START="$(sudo -n systemctl show porota-critical-approval-rc6.service --property=ExecStart --value)"
            [[ "$UNIT_EXEC_START" == *"$TARGET_IMAGE"* ]]
            TARGET_IMAGE_ID="$(sudo -n docker image inspect -f '{{.Id}}' "$TARGET_IMAGE")"
            TARGET_IMAGE_COMMIT="$(sudo -n docker image inspect -f '{{index .Config.Labels "porota.commit"}}' "$TARGET_IMAGE")"
            test "$TARGET_IMAGE_COMMIT" = "$TARGET_SHA"
            CURRENT_GATEWAY_IMAGE_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_critical_approval_rc6)"
            if [ "$CURRENT_GATEWAY_IMAGE_ID" != "$TARGET_IMAGE_ID" ]; then
              echo 'RC6_APPROVAL_IMAGE_RECONCILE=START'
              sudo -n systemctl restart porota-critical-approval-rc6.service
              GATEWAY_READY=NO
              for _ in $(seq 1 30); do
                if sudo -n systemctl is-active --quiet porota-critical-approval-rc6.service; then
                  CURRENT_GATEWAY_IMAGE_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_critical_approval_rc6 2>/dev/null || true)"
                  GATEWAY_HEALTH="$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' porota_critical_approval_rc6 2>/dev/null || true)"
                  if [ "$CURRENT_GATEWAY_IMAGE_ID" = "$TARGET_IMAGE_ID" ] && [ "$GATEWAY_HEALTH" = healthy ]; then
                    GATEWAY_READY=YES
                    break
                  fi
                fi
                sleep 2
              done
              test "$GATEWAY_READY" = YES
              sudo -n docker exec porota_critical_approval_rc6 python -c 'from fm_critical_approval_unix_runtime_rc6 import UnixGithubIssuesClient; h=UnixGithubIssuesClient().health(); assert h.get("status")=="ok" and h.get("capability")=="issues_only"; print("RC6_APPROVAL_ISSUES_ONLY=GREEN")'
              sudo -n docker inspect porota_critical_approval_rc6 | python3 -c 'import json,sys; o=json.load(sys.stdin)[0]; e=dict(x.split("=",1) for x in o["Config"].get("Env",[])); assert e.get("POROTA_RUNTIME_MODE")=="PRODUCTION_PAPER"; forbidden={"PPI_API_KEY","PPI_API_SECRET","PPI_API_KEY_PROD","PPI_API_SECRET_PROD","PPI_ACCOUNT_NUMBER","GITHUB_TOKEN","GH_TOKEN","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID"}; assert not (forbidden & set(e)); print("RC6_APPROVAL_PAPER_SECRET_GUARD=GREEN")'
              echo "RC6_APPROVAL_IMAGE_RECONCILE=GREEN|$TARGET_IMAGE_ID|$TARGET_SHA"
            else
              echo "RC6_APPROVAL_IMAGE_RECONCILE=ALREADY_CURRENT|$TARGET_IMAGE_ID|$TARGET_SHA"
            fi
          else
            echo 'RC6_APPROVAL_IMAGE_RECONCILE=SKIPPED_SERVICE_NOT_ACTIVE'
          fi
          # A remote wrapper can return 124 after the manager completed.
          # Continue only after its explicit success marker; all health and safety
          # checks below remain mandatory.
          set +e
          MODE_OUTPUT="$(sudo -n env POROTA_COPY_OUTPUT=0 python3 "$REPO/porota_mode_manager.py" simulation 2>&1)"
          MODE_RC=$?
          set -e
          echo "$MODE_OUTPUT"
          grep -Fqx "POROTA_MODE=OK" <<< "$MODE_OUTPUT"
          if [ "$MODE_RC" -ne 0 ] && [ "$MODE_RC" -ne 124 ]; then
            echo "MODE_MANAGER_EXIT=$MODE_RC"
            exit "$MODE_RC"
          fi
          if [ "$MODE_RC" -eq 124 ]; then
            echo "MODE_MANAGER_WRAPPER_EXIT=124_CONFIRMED_BY_MARKER"
          fi
          OK=NO
          for _ in $(seq 1 8); do
            H="$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null || true)"
            if python3 - "$H" <<'PY'
          import json,sys
          try:
              x=json.loads(sys.argv[1]); assert x.get('status')=='ok' and x.get('version')=='17.0.0-rc6'
          except Exception: raise SystemExit(1)
          PY
            then OK=YES; break; fi
            sleep 2
          done
          test "$OK" = YES
          # Disable only superseded timer names to avoid parallel legacy and RC6 schedules.
          for legacy_unit in porota-introspeccion-hf5.timer porota-introspection-publish.timer porota-scheduler-export-hf6.timer; do
            if systemctl list-unit-files --type=timer --no-legend | awk -v unit="$legacy_unit" '$1 == unit { found=1 } END { exit !found }'; then
              sudo -n systemctl disable --now "$legacy_unit"
            fi
          done
          sudo -n install -m 755 "$REPO/scripts/porota_introspection_rc6_host.sh" /usr/local/sbin/porota-introspection-rc6.sh
          sudo -n install -m 644 "$REPO/systemd/porota-introspection-rc6.service" /etc/systemd/system/porota-introspection-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-introspection-rc6.timer" /etc/systemd/system/porota-introspection-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-introspection-publish-rc6.service" /etc/systemd/system/porota-introspection-publish-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-introspection-publish-rc6.timer" /etc/systemd/system/porota-introspection-publish-rc6.timer
          sudo -n install -m 644 "$REPO/systemd/porota-scheduler-export-rc6.service" /etc/systemd/system/porota-scheduler-export-rc6.service
          sudo -n install -m 644 "$REPO/systemd/porota-scheduler-export-rc6.timer" /etc/systemd/system/porota-scheduler-export-rc6.timer
          sudo -n install -d -o porotaadmin -g porotaadmin -m 0750 /opt/porota-trading/data/scheduler
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now porota-introspection-rc6.timer porota-introspection-publish-rc6.timer porota-scheduler-export-rc6.timer
          echo "RC6_INTROSPECTION_TIMERS=ENABLED"
          echo "RC6_DEPLOY_STAGE_ONE=GREEN"
          REMOTE

      - name: Verify deployed candidate and Paper safety
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'VERIFY'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          H="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          python3 - "$H" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get("status") == "ok" and x.get("version") == "17.0.0-rc6"
          PY
          # Bootstrap compacto una sola vez tras un deploy correcto. Cada tarea es diaria y acotada; 60 s cubren el arranque de Python sin autorizar un recorrido de ledger. La cadencia
          # ordinaria sigue siendo diaria; esto evita dejar Validación y Reportes
          # vacíos hasta el día siguiente sin recorrer el ledger en HTTP.
          for job in validation_projection action4_audit; do
            JOB_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 60 python az_maintenance_job.py "$job" 2>&1)"
            echo "$JOB_OUTPUT"
            grep -Fq "Tarea $job completada." <<< "$JOB_OUTPUT"
            echo "BOOTSTRAP_$(tr '[:lower:]' '[:upper:]' <<< "$job")=GREEN"
          done
          # Prueba que el proceso en ejecución contiene el observer del candidato
          # recién desplegado. Evita repetir una omisión de copia en el workflow.
          STAGED_OBSERVER="/tmp/porota-rc6-candidate-$TARGET_SHA/bf_production_paper_observer.py"
          test -f "$STAGED_OBSERVER"
          EXPECTED_OBSERVER_SHA="$(sha256sum "$STAGED_OBSERVER" | awk '{print $1}')"
          RUNNING_OBSERVER_SHA="$(sudo -n docker exec porota_production_observer sha256sum /app/bf_production_paper_observer.py | awk '{print $1}')"
          test "$RUNNING_OBSERVER_SHA" = "$EXPECTED_OBSERVER_SHA"
          echo "OBSERVER_CANDIDATE_SHA=GREEN"
          # Prove the exact modules corrected by PR #125 reached each live container.
          for f in be_paper_engine.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py; do
            EXPECTED_SOURCE_SHA="$(sha256sum "$STAGED_OBSERVER/$f" | awk '{print $1}')"
            RUNNING_SOURCE_SHA="$(sudo -n docker exec porota_production_observer sha256sum "/app/$f" | awk '{print $1}')"
            test "$RUNNING_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
            echo "RUNNING_SOURCE_SHA=GREEN|observer|$f"
          done
          for f in bg_paper_dashboard.py cr_pending_settlement_diagnostics_hf6.py; do
            EXPECTED_SOURCE_SHA="$(sha256sum "$STAGED_OBSERVER/$f" | awk '{print $1}')"
            RUNNING_SOURCE_SHA="$(sudo -n docker exec porota_production_dashboard sha256sum "/app/$f" | awk '{print $1}')"
            test "$RUNNING_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
            echo "RUNNING_SOURCE_SHA=GREEN|dashboard|$f"
          done
          if ! SCHEDULER_HISTORY_GUARD="$(sudo -n docker exec -i porota_production_observer python - <<'PY' 2>&1
          from pathlib import Path

          source = Path("/app/az_maintenance_scheduler.py").read_text(encoding="utf-8")
          checks = {
              "guard_before_launch": (
                  "if job_name in INTERNAL_HISTORICAL_WRITE_JOBS:" in source
                  and source.index("if job_name in INTERNAL_HISTORICAL_WRITE_JOBS:")
                  < source.index("result = subprocess.run(")
              ),
              "catchup_absent": 'id="maintenance_historical_catchup"' not in source,
              "refresh_absent": 'id="maintenance_historical_refresh"' not in source,
              "startup_absent": 'id="maintenance_historical_startup_catchup"' not in source,
              "news_present": 'id="maintenance_news_scan"' in source,
              "gdelt_present": 'id="maintenance_gdelt_shadow"' in source,
              "audit_present": 'id="maintenance_action4_audit"' in source,
              "projection_present": 'id="maintenance_validation_projection"' in source,
          }
          print(f"SCHEDULER_GUARD_DETAILS={checks}")
          if not all(checks.values()):
              raise SystemExit(1)
          print("INTERNAL_HISTORY_WRITES=DISABLED")
          PY
          )"; then
            echo "$SCHEDULER_HISTORY_GUARD"
            exit 1
          fi
          echo "$SCHEDULER_HISTORY_GUARD"
          grep -Fqx "INTERNAL_HISTORY_WRITES=DISABLED" <<< "$SCHEDULER_HISTORY_GUARD"
          for p in /trading /motor-trading /validacion /reportes /postcierre; do
            c="$(curl -sS -o /tmp/porota-dashboard-check -w '%{http_code}' --max-time 5 "http://127.0.0.1:8000$p")"
            case "$c" in 200|401) ;; *) echo "DASHBOARD_ROUTE_FAILED=$p HTTP=$c"; exit 1 ;; esac
          done
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import bg_paper_dashboard as bg; bg.validation_page(); print('BG_VALIDATION_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import en_validation_project_dashboard_rc6 as p; p.page(); print('PROJECT_VALIDATION_RENDER=GREEN')"
          sudo -n docker exec porota_production_dashboard timeout 15 python -c "import rc6_postclose_review_dashboard as p; p.page(); print('POSTCLOSE_REVIEW_RENDER=GREEN')"
          # NOT_DUE exits 2 outside the post-close window. Capture it with an
          # explicit OR-list so bash -e cannot terminate before verification.
          SNAPSHOT_RC=0
          SNAPSHOT_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 30 python /app/rc6_snapshot.py --phase postclose 2>&1)" || SNAPSHOT_RC=$?
          echo "$SNAPSHOT_OUTPUT"
          case "$SNAPSHOT_RC" in 0|2) ;; *) echo "SNAPSHOT_UNEXPECTED_EXIT=$SNAPSHOT_RC"; exit "$SNAPSHOT_RC";; esac
          # Fuera de la ventana postcierre, NOT_DUE prueba que el guard de horario
          # está activo. No se fuerza ni inventa un snapshot postcierre.
          grep -Eq '"status": "(VERIFIED|INSUFFICIENT_EVIDENCE|NOT_DUE)"' <<< "$SNAPSHOT_OUTPUT"
          REVIEW_RC=0
          REVIEW_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 15 python /app/rc6_postclose_review.py 2>&1)" || REVIEW_RC=$?
          echo "$REVIEW_OUTPUT"
          case "$REVIEW_RC" in 0|2) ;; *) echo "REVIEW_UNEXPECTED_EXIT=$REVIEW_RC"; exit "$REVIEW_RC";; esac
          grep -Eq '"status": "(VERIFIED|INSUFFICIENT_EVIDENCE|NOT_DUE)"' <<< "$REVIEW_OUTPUT"
          for unit in porota-snapshot-preopen-rc6.timer porota-snapshot-postclose-rc6.timer; do
            test "$(systemctl is-enabled "$unit")" = enabled
            test "$(systemctl is-active "$unit")" = active
          done
          echo "RC6_SNAPSHOT_TIMERS=GREEN"
          for unit in porota-introspection-rc6.timer porota-introspection-publish-rc6.timer porota-scheduler-export-rc6.timer; do
            test "$(systemctl is-enabled "$unit")" = enabled
            test "$(systemctl is-active "$unit")" = active
          done
          for legacy_unit in porota-introspeccion-hf5.timer porota-introspection-publish.timer porota-scheduler-export-hf6.timer; do
            if systemctl list-unit-files --type=timer --no-legend | awk -v unit="$legacy_unit" '$1 == unit { found=1 } END { exit !found }'; then
              ! systemctl is-active --quiet "$legacy_unit"
              ! systemctl is-enabled --quiet "$legacy_unit"
            fi
          done
          SCHEDULER_SNAPSHOT="/opt/porota-trading/data/scheduler/systemd_timers.json"
          SCHEDULER_EXPORT_READY=NO
          for _ in $(seq 1 40); do
            if sudo -n test -f "$SCHEDULER_SNAPSHOT" && sudo -n python3 - "$SCHEDULER_SNAPSHOT" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(p["recorded_at"].replace("Z","+00:00")).astimezone(timezone.utc)).total_seconds()
          timers={x.get("unit"):x for x in p.get("timers",[])}
          required=("porota-introspection-rc6.timer","porota-introspection-publish-rc6.timer","porota-scheduler-export-rc6.timer")
          assert p.get("state")=="OK" and 0 <= age <= 180
          for unit in required:
              assert timers[unit].get("enabled_state")=="enabled"
              assert timers[unit].get("active_state")=="active"
          print("RC6_SCHEDULER_DASHBOARD_INVENTORY=GREEN")
          PY
            then SCHEDULER_EXPORT_READY=YES; break; fi
            sleep 5
          done
          test "$SCHEDULER_EXPORT_READY" = YES
          echo "RC6_INTROSPECTION_TIMERS=GREEN"
          ! systemctl is-active --quiet porota-public-snapshot-rc6.service
          ! test -e /etc/systemd/system/porota-public-snapshot-rc6.service
          ! test -e "$REPO/rc6_public_snapshot_server.py"
          echo "RC6_PUBLIC_SNAPSHOT=DISABLED"
          POST_STATE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = "ok|PRODUCTION_PAPER|0"
          SCOPE_CHECK="$(sudo -n docker exec porota_production_observer python - <<'PY'
          import bf_production_paper_observer as observer
          permitted = {"ACCIONES", "CEDEARS"}
          assert set(observer.OPERATIONAL_FAMILIES) == permitted
          assert set(observer.SAFE_PAPER_TYPES) == permitted
          assert all(kind in permitted for _, kind, _ in observer.CORE_SYMBOLS)
          assert set(observer.DISCOVERY_SEEDS).issubset(permitted)
          assert all(kind in permitted for _, kind, _, _, _ in observer._candidate_universe())
          print("OPERATIONAL_SCOPE=ACCIONES_CEDEARS_ONLY")
          PY
          )"
          echo "$SCOPE_CHECK"
          # El observador se recrea en el deploy. Esperamos su primer pulso
          # real de PPI en lugar de reprobar el estado STARTING transitorio.
          RUNTIME_CHECK="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import time
          from datetime import datetime, timezone

          deadline = time.monotonic() + 75
          last = None
          while time.monotonic() < deadline:
              try:
                  c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=3)
                  c.execute('PRAGMA query_only=ON')
                  last = c.execute(
                      'SELECT mode,real_orders_sent,ppi_auth,process_state,session_state,'
                      'last_market_data_at,heartbeat_at FROM observer_state WHERE id=1'
                  ).fetchone()
                  c.close()
              except sqlite3.Error as exc:
                  last = ('DB_ERROR', 0, type(exc).__name__, '', '', '', '')
              def fresh(value, seconds):
                  try:
                      observed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
                      if observed.tzinfo is None:
                          return False
                      age = (datetime.now(timezone.utc) - observed.astimezone(timezone.utc)).total_seconds()
                      return 0 <= age <= seconds
                  except (TypeError, ValueError):
                      return False
              paper_safe = last and last[0] == 'PRODUCTION_PAPER' and int(last[1] or 0) == 0 and last[2] == 'OK'
              heartbeat_fresh = paper_safe and fresh(last[6], 120)
              market_data_required = last and last[4] == 'MARKET_OPEN'
              market_data_fresh = (not market_data_required) or fresh(last[5], 180)
              if paper_safe and heartbeat_fresh and market_data_fresh:
                  print(f'GO_CHECK=GREEN|{"|".join(map(str,last))}|MARKET_DATA_REQUIRED={market_data_required}')
                  break
              time.sleep(5)
          else:
              print(f'GO_CHECK_FAILED_AFTER_STARTUP={last}')
          PY
          )"
          echo "$RUNTIME_CHECK"
          if ! grep -q '^GO_CHECK=GREEN' <<< "$RUNTIME_CHECK"; then
            echo "OBSERVER_PROCESS_DIAGNOSTIC:"
            sudo -n docker top porota_production_observer -eo pid,ppid,stat,wchan:32,etime,cmd || true
            for pid in $(sudo -n docker top porota_production_observer -eo pid= 2>/dev/null || true); do
              echo "OBSERVER_KERNEL_STACK_PID=$pid"
              sudo -n cat "/proc/$pid/wchan" || true
              sudo -n cat "/proc/$pid/stack" || true
            done
            echo "OBSERVER_LOG_TAIL:"
            sudo -n docker logs --tail 160 porota_production_observer || true
            exit 1
          fi
          echo "REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED"
          echo "RC6_UNIFIED_PAPER_DEPLOY=GREEN"
          VERIFY

      - name: Audit deployed storage footprint (read-only)
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "bash -s" <<'AUDIT'
          set -Eeuo pipefail
          echo 'STORAGE_AUDIT=READ_ONLY'
          df -h / /opt /var/lib/docker 2>/dev/null || df -h /
          df -PB1 /
          sudo -n docker system df
          sudo -n du -sh /opt/porota-trading/data /opt/porota-trading 2>/dev/null || true
          echo 'STORAGE_CLEANUP=ALLOWLISTED_RC6_CANDIDATE_ROLLBACK_AND_UNUSED_RC4_TEST_TAGS_ONLY'
          echo 'STORAGE_CLEANUP_SCOPE=FULL_SHA_TAGS_PLUS_EXPLICIT_RC4_TEST_TAG; CONTAINER_REFERENCED_IMAGE_IDS_PROTECTED'
          AUDIT
