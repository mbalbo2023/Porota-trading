name: RC6 EOD UI deploy guard patch v2

on:
  push:
    branches: [deploy/rc6-eod-ui-paper-20260912]
    paths:
      - 'tools/patch_eod_deploy_guard.py'
      - '.github/workflows/rc6-eod-ui-deploy-guard-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/rc6-eod-ui-paper-20260912
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_eod_deploy_guard.py
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rc6-eod-ui-paper-deploy.yml
          git commit -m 'fix: preserve untracked host artifacts during EOD UI deploy'
          git push origin HEAD:deploy/rc6-eod-ui-paper-20260912
