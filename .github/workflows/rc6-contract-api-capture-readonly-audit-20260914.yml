name: RC6 read-only audit of API-supported capture 2026-09-14

on:
  push:
    branches:
      - ops/rc6-contract-api-capture-readonly-audit-20260914
    paths-ignore:
      - POROTA_TRADING_CONTRACT_API_CAPTURE_READONLY_AUDIT_RESULT_2026-09-14.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-existing-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"
          chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read existing capture and strict target identities (read-only)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          RESULT=POROTA_TRADING_CONTRACT_API_CAPTURE_READONLY_AUDIT_RESULT_2026-09-14.txt
          CAPTURE=/opt/porota-trading/data/contract_evidence/rc6_trusted/contract_point1_20260914T023138Z.json
          ssh "${SSH_OPTS[@]}" "$DO_USER@$DO_HOST" "sudo -n python3 - '$CAPTURE'" > "$RESULT" <<'PY'
          import collections,json,re,subprocess,sys,textwrap
          from urllib.parse import urlsplit
          path=sys.argv[1]
          try:
              with open(path,encoding='utf-8') as f:
                  data=json.load(f)
          except Exception as exc:
              print('EXISTING_CAPTURE_READ=ERROR_'+type(exc).__name__)
              raise SystemExit(0)
          dbcode = """import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=30)
          c.row_factory=sqlite3.Row
          c.execute('pragma query_only=on')
          rows=c.execute('select distinct family,ticker,market,settlement from contract_evidence_v2_current').fetchall()
          print(json.dumps([dict(r) for r in rows],ensure_ascii=False))
          c.close()
          """
          dbcode=textwrap.dedent(dbcode)
          p=subprocess.run(['/usr/bin/docker','exec','-i','porota_production_observer','python','-c',dbcode],capture_output=True,text=True)
          targets=[]
          if p.returncode==0:
              try:
                  targets=json.loads(p.stdout)
              except Exception:
                  pass
          aliases={'CEDEAR':'CEDEARS','OBLIGACIONES_NEGOCIABLES':'ON','OBLIGACIONES NEGOCIABLES':'ON'}
          def family(value):
              x=str(value or '').upper().strip()
              return aliases.get(x,x)
          targets=[{'family':family(x.get('family')),'ticker':str(x.get('ticker') or '').upper(),
                    'market':str(x.get('market') or '').upper(),'settlement':str(x.get('settlement') or '').upper()}
                   for x in targets if isinstance(x,dict)]
          excluded={'FCI','FCI_LOCAL','FCI_EXTERIOR','FCI EXTERIOR','OPCIONES'}
          targets=[x for x in targets if x['family'] not in excluded]
          target_counts=collections.Counter(x['family'] for x in targets)
          endpoints=data.get('endpoints') or {}
          kinds=collections.Counter()
          row_counts=collections.Counter()
          target_tickers=collections.defaultdict(set)
          for item in endpoints.values():
              if not isinstance(item,dict):
                  continue
              kind=str(item.get('kind') or 'UNKNOWN')
              kinds[kind]+=1
              rows=item.get('rows')
              if not isinstance(rows,list):
                  rows=[]
              row_counts[kind]+=len(rows)
              if kind!='InstrumentosOperables':
                  continue
              route=str(item.get('observed_route') or '')
              routed_families={'/Operar/Bonos':{'BONOS','LETRAS'},'/Operar/Ons':{'ON'}}
              allowed=routed_families.get(route,set())
              for row in rows:
                  if isinstance(row,dict) and row.get('ticker') and allowed:
                      target_tickers[route].add(str(row['ticker']).upper())
          api_report={}
          for route, fams in {'/Operar/Bonos':{'BONOS','LETRAS'},'/Operar/Ons':{'ON'}}.items():
              ids=[x for x in targets if x['family'] in fams]
              tickers=target_tickers.get(route,set())
              matched=[x for x in ids if x['ticker'] in tickers]
              api_report[route]={
                  'target_identities':len(ids),
                  'target_tickers_matched':len(matched),
                  'target_tickers_unmatched':len(ids)-len(matched),
                  'distinct_target_tickers':len({x['ticker'] for x in ids}),
                  'matched_distinct_tickers':len({x['ticker'] for x in matched}),
                  'exact_identity_join_possible':False,
                  'reason':'Captured InstrumentosOperables fields do not include market or settlement.',
              }
          print('EXISTING_CAPTURE_READ=OK')
          print('TARGET_QUERY='+('OK' if p.returncode==0 and targets else 'UNAVAILABLE'))
          print('TARGET_IDENTITY_COUNT='+str(len(targets)))
          print('TARGET_BY_FAMILY='+json.dumps(target_counts,sort_keys=True,separators=(',',':')))
          print('CAPTURE_SCHEMA='+str(data.get('schema')))
          print('AUTH_STATUS='+str(data.get('auth_status')))
          print('REAL_ORDERS_SENT='+str(data.get('real_orders_sent')))
          print('ROUTES_COUNT='+str(len(data.get('routes') or [])))
          print('ENDPOINT_COUNT='+str(len(endpoints)))
          print('ENDPOINT_KIND_COUNTS='+json.dumps(kinds,sort_keys=True,separators=(',',':')))
          print('ROW_COUNTS_BY_KIND='+json.dumps(row_counts,sort_keys=True,separators=(',',':')))
          print('TARGET_TICKER_MATCH_COUNTS='+json.dumps(api_report,sort_keys=True,separators=(',',':')))
          for item in data.get('routes') or []:
              if isinstance(item,dict):
                  safe={k:item.get(k) for k in ('job','requested','reached','api_catalog_action') if k in item}
                  print('ROUTE_ACTION='+json.dumps(safe,sort_keys=True,separators=(',',':')))
          blocked=data.get('blocked_nonread') or []
          blocked_counts=collections.Counter()
          for item in blocked:
              if not isinstance(item,dict):
                  continue
              u=urlsplit(str(item.get('url') or ''))
              clean=re.sub(r'/[0-9a-f-]{16,}(?=/|$)','/:id',u.path,flags=re.I)
              clean=re.sub(r'/[0-9]{3,}(?=/|$)','/:n',clean)
              blocked_counts[(str(item.get('method') or ''),u.netloc,clean)]+=1
          print('BLOCKED_NONREAD_COUNT='+str(len(blocked)))
          for (method,host,route),count in sorted(blocked_counts.items()):
              print('BLOCKED_NONREAD_CLASS='+json.dumps({'method':method,'host':host,'route':route,'count':count},sort_keys=True,separators=(',',':')))
          print('AMOUNT_FILLED='+str(bool(data.get('amount_filled'))))
          print('PRICE_FILLED='+str(bool(data.get('price_filled'))))
          print('DB_IMPORT_EXECUTED=NO')
          print('SERVICE_RESTARTED=NO')
          PY
          cat "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git diff --cached --quiet && exit 0
          git commit -m 'audit(contract): compare existing API capture to target identities [skip ci]'
          git push origin HEAD:ops/rc6-contract-api-capture-readonly-audit-20260914
