name: RC6 CP4 A3 DLR Runtime Discovery 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-cp4-a3-dlr-runtime-discovery-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  cp4_a3_dlr_runtime_discovery:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Discover A3 DLR historical wiring read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo MUTATIONS=NONE
          echo REAL_ORDER_ROUTES=NOT_CALLED
          echo CP4_DISCOVERY_MODE=READ_ONLY
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/opt/porota-trading')
          patterns=[re.compile(x,re.I) for x in (r'\bDLR\b',r'A3',r'identity',r'future',r'histor',r'backfill')]
          hits=[]
          for p in root.rglob('*.py'):
              s=str(p)
              if any(x in s for x in ('/.git/','/.venv/','/__pycache__/')):
                  continue
              try:
                  lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              except Exception:
                  continue
              matched=[]
              for i,line in enumerate(lines,1):
                  if any(rx.search(line) for rx in patterns):
                      matched.append((i,line.strip()[:240]))
              if matched:
                  hits.append((p,matched))
          hits.sort(key=lambda x:(-len(x[1]),str(x[0])))
          print('MATCHED_FILES='+str(len(hits)))
          print('CP4_RUNTIME_SOURCE_HITS_BEGIN')
          for p,rows in hits[:80]:
              print('FILE='+str(p.relative_to(root))+' MATCHES='+str(len(rows)))
              for i,line in rows[:20]:
                  print(f'  L{i}: {line}')
          print('CP4_RUNTIME_SOURCE_HITS_END')
          if not hits:
              raise SystemExit('CP4_NO_A3_DLR_HISTORY_SOURCE_HITS')
          print('CP4_A3_DLR_DISCOVERY_COMPLETE=YES')
          PY
          HOST
