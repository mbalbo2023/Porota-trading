name: RC6 host fix HF6 export permissions

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-host-fix-hf6-export-permissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Repair only the two proven non-executable exporters
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/result.txt
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          LOG="$ROOT/scripts/porota_export_runtime_logs_hf6.sh"
          SCHED="$ROOT/scripts/porota_export_scheduler_state_hf6.sh"
          EXPECTED_BRANCH=release/v17.0.0-rc5
          EXPECTED_HEAD=852b812d610860b57b579212978443f7450e8855
          EXPECTED_LOG_BLOB=458116779ac1e068ad35e9ffa0a3a7341bf27dbd
          EXPECTED_SCHED_BLOB=c6af79fad6a74772e8f10dac999459dddfe49492

          echo 'POROTA_HF6_EXPORT_PERMISSION_REPAIR=START'
          cd "$ROOT"
          branch="$(git branch --show-current)"
          head="$(git rev-parse HEAD)"
          echo "BRANCH=$branch"
          echo "HEAD=$head"
          test "$branch" = "$EXPECTED_BRANCH"
          test "$head" = "$EXPECTED_HEAD"
          for c in porota_production_observer porota_production_dashboard; do
            sudo -n docker inspect -f '{{.Name}}|running={{.State.Running}}|restarts={{.RestartCount}}|image={{.Config.Image}}|readonly={{.HostConfig.ReadonlyRootfs}}' "$c"
          done
          test "$(git hash-object "$LOG")" = "$EXPECTED_LOG_BLOB"
          test "$(git hash-object "$SCHED")" = "$EXPECTED_SCHED_BLOB"
          echo "LOG_MODE_BEFORE=$(stat -c '%a' "$LOG")"
          echo "SCHED_MODE_BEFORE=$(stat -c '%a' "$SCHED")"
          test ! -x "$LOG"
          test ! -x "$SCHED"

          sudo -n chmod 0755 "$LOG" "$SCHED"
          test -x "$LOG"
          test -x "$SCHED"
          echo "LOG_MODE_AFTER=$(stat -c '%a' "$LOG")"
          echo "SCHED_MODE_AFTER=$(stat -c '%a' "$SCHED")"

          sudo -n systemctl reset-failed porota-log-export-hf6.service porota-scheduler-export-hf6.service || true
          sudo -n systemctl start porota-log-export-hf6.service
          sudo -n systemctl start porota-scheduler-export-hf6.service
          echo "LOG_SERVICE=$(sudo -n systemctl show porota-log-export-hf6.service -p Result --value)|status=$(sudo -n systemctl show porota-log-export-hf6.service -p ExecMainStatus --value)"
          echo "SCHED_SERVICE=$(sudo -n systemctl show porota-scheduler-export-hf6.service -p Result --value)|status=$(sudo -n systemctl show porota-scheduler-export-hf6.service -p ExecMainStatus --value)"
          test "$(sudo -n systemctl show porota-log-export-hf6.service -p Result --value)" = success
          test "$(sudo -n systemctl show porota-scheduler-export-hf6.service -p Result --value)" = success
          test -s "$ROOT/data/logs/runtime_log_export_status.json"
          test -s "$ROOT/data/scheduler/systemd_timers.json"
          echo "LOG_STATUS_BYTES=$(stat -c '%s' "$ROOT/data/logs/runtime_log_export_status.json")"
          echo "SCHED_STATUS_BYTES=$(stat -c '%s' "$ROOT/data/scheduler/systemd_timers.json")"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for c in porota_production_observer porota_production_dashboard; do
            sudo -n docker inspect -f '{{.Name}}|POST|running={{.State.Running}}|restarts={{.RestartCount}}|image={{.Config.Image}}|readonly={{.HostConfig.ReadonlyRootfs}}' "$c"
          done
          echo 'STATUS=GREEN'
          echo 'SCOPE=CHMOD_TWO_EXPORTERS_AND_RUN_ONESHOTS_ONLY'
          echo 'POROTA_HF6_EXPORT_PERMISSION_REPAIR=END'
          REMOTE
          {
            echo '### HF6 exporter permission repair'
            echo '```text'
            cat /tmp/result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
