name: RC6 Caucion Marketdata Readonly 2026-10-02
on:
  push:
    branches: [audit/rc6-caucion-binding-20261002]
    paths: ['.github/workflows/rc6-caucion-marketdata-readonly-20261002.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Search persisted market data
        shell: bash
        run: |
          timeout 60s ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'python3 -' <<'PY'
          import sqlite3,json
          db="/opt/porota-trading/data/paper_v17/observer_v17.db"
          c=sqlite3.connect(f"file:{db}?mode=ro",uri=True,timeout=5);c.row_factory=sqlite3.Row;c.execute("pragma query_only=on")
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          tickers=("PESOS1","PESOS2","PESOS7","PESOS30","PESOS120","DOLAR1","DOLAR2","DOLAR7","DOLAR30","DOLAR120")
          out={}
          for t in sorted(tables):
              cols=[r[1] for r in c.execute(f'pragma table_info("{t}")')]
              sym=next((x for x in ("ticker","symbol","instrument","instrument_id") if x in cols),None)
              if not sym: continue
              if not any(k in cols for k in ("price","last","bid","ask","rate","tna","annual_rate_fraction","payload_json","raw_json")):
                  continue
              qs=",".join("?" for _ in tickers)
              try:
                  rows=[dict(r) for r in c.execute(f'select * from "{t}" where upper("{sym}") in ({qs}) order by rowid desc limit 100',tickers)]
              except Exception: continue
              if rows: out[t]={"columns":cols,"rows":rows}
          print(json.dumps(out,ensure_ascii=False,sort_keys=True,default=str))
          c.close()
          PY
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
