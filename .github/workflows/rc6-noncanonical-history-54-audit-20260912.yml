name: RC6 noncanonical history 54 audit 2026-09-12
on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-noncanonical-history-54-audit-20260912.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"; printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Classify noncanonical active production_history read only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'; ACTUAL="$(git rev-parse HEAD)"; echo HOST_SHA=$ACTUAL; test "$ACTUAL" = "$EXPECT" || exit 31
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock; flock -w 600 9 || exit 33
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json
          from collections import Counter
          import bf_production_paper_observer as m
          c=m.runtime_store().connect()
          try:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); print(f'SAFETY={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              canonical={(r[0],r[1],r[2]) for r in c.execute("select ticker,instrument_type,settlement from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')")}
              active={(r[0],r[1],r[2]) for r in c.execute('select symbol,instrument_type,settlement from production_history')}
              extra=sorted(active-canonical)
              print('NONCANONICAL_ACTIVE_KEYS='+str(len(extra))); assert len(extra)==54
              tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              qhist=set()
              if 'production_history_quarantine_rc6' in tabs:
                  qhist={(r[0],r[1],r[2]) for r in c.execute('select symbol,instrument_type,settlement from production_history_quarantine_rc6')}
              qshadow=set()
              if 'ppi_argentina_api_shadow_quarantine_rc6' in tabs:
                  qshadow={(r[0],r[1],r[2]) for r in c.execute('select ticker,instrument_type,settlement from ppi_argentina_api_shadow_quarantine_rc6')}
              legacy_catalog={(r[0],r[1],r[2]) for r in c.execute('select ticker,instrument_type,settlement from financial_instrument_catalog')}
              print('NONCANONICAL_IN_HISTORY_QUARANTINE='+str(len(set(extra)&qhist)))
              print('NONCANONICAL_IN_SHADOW_QUARANTINE='+str(len(set(extra)&qshadow)))
              print('NONCANONICAL_IN_FINANCIAL_CATALOG='+str(len(set(extra)&legacy_catalog)))
              fam=Counter(x[1] for x in extra); print('NONCANONICAL_BY_FAMILY='+json.dumps(dict(sorted(fam.items())),sort_keys=True))
              for x in extra:
                  print('NONCANONICAL_KEY='+json.dumps({'symbol':x[0],'family':x[1],'settlement':x[2],'in_history_quarantine':x in qhist,'in_shadow_quarantine':x in qshadow,'in_financial_catalog':x in legacy_catalog},sort_keys=True))
              attempts={(r[0],r[1],r[2]) for r in c.execute('select symbol,instrument_type,settlement from production_history_attempts')}
              print('NONCANONICAL_WITH_ACTIVE_ATTEMPT='+str(len(set(extra)&attempts)))
          finally:
              c.close()
          print('AUDIT_STATUS=SUCCESS_READ_ONLY'); print('HOST_MUTATION=NONE'); print('ORDER_ROUTES=NOT_CALLED'); print('REAL_ORDERS_SENT=0')
          PY
          HOST
