name: wave-a-offline-tests

on:
  pull_request:
    branches:
      - integration/rc6-wave-a-core-20260914
    paths:
      - canonical_identity_resolver.py
      - tests/test_canonical_identity_resolver.py
      - .github/workflows/wave-a-offline-tests.yml

permissions:
  contents: read

jobs:
  canonical-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile focused files
        run: python -m compileall -q canonical_identity_resolver.py tests/test_canonical_identity_resolver.py
      - name: Run focused offline tests
        run: python -m unittest discover -s tests -p "test_canonical_identity_resolver.py" -v
