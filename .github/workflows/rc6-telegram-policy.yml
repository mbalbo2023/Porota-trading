name: RC6 Telegram weekend severity policy

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - 'eu_telegram_policy_rc6.py'
      - 'tests/test_telegram_policy_rc6.py'
      - 'tests/test_telegram_outbox_policy_rc6.py'
      - 'scripts/rc6_wire_telegram_policy.py'
      - '.github/workflows/rc6-telegram-policy.yml'

permissions:
  contents: write

concurrency:
  group: rc6-telegram-policy
  cancel-in-progress: false

jobs:
  prove-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - run: python scripts/rc6_wire_telegram_policy.py
      - run: python -m py_compile eu_telegram_policy_rc6.py bn_telegram_bus.py
      - name: Focused tests
        run: pytest -q tests/test_telegram_policy_rc6.py tests/test_telegram_outbox_policy_rc6.py
      - name: Static unsuppressible proof
        shell: bash
        run: |
          grep -q 'priority <= CRITICAL_PRIORITY_MAX' eu_telegram_policy_rc6.py
          grep -q "CRITICAL_UNSUPPRESSIBLE" eu_telegram_policy_rc6.py
          grep -q 'SUPPRESSED_ROUTINE' bn_telegram_bus.py
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bn_telegram_bus.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bn_telegram_bus.py
          git commit -m 'RC6: suppress routine weekend Telegram, preserve critical [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
