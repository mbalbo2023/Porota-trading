name: RC6 IOL MCP Connectivity Probe

on:
  push:
    branches:
      - test/iol-mcp-connectivity-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public MCP endpoint and OAuth discovery
        shell: bash
        run: |
          set -uo pipefail

          MCP_URL="https://mcp.invertironline.com"
          echo "POROTA_IOL_MCP_PROBE=START"
          echo "MCP_URL=${MCP_URL}"
          echo "AUTH_CREDENTIALS=NONE"
          echo "MUTATIONS=NONE"

          echo "--- TLS/HTTP reachability ---"
          ROOT_CODE=$(curl -sS -L --connect-timeout 10 --max-time 20 \
            -o /tmp/iol_root.body -w '%{http_code}' "${MCP_URL}/" || true)
          echo "ROOT_HTTP_STATUS=${ROOT_CODE}"

          echo "--- MCP initialize without authentication ---"
          cat >/tmp/initialize.json <<'JSON'
          {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "initialize",
            "params": {
              "protocolVersion": "2025-06-18",
              "capabilities": {},
              "clientInfo": {
                "name": "porota-rc6-actions-probe",
                "version": "0.1.0"
              }
            }
          }
          JSON

          INIT_CODE=$(curl -sS --connect-timeout 10 --max-time 20 \
            -D /tmp/init.headers -o /tmp/init.body \
            -w '%{http_code}' \
            -X POST "${MCP_URL}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data-binary @/tmp/initialize.json || true)
          echo "INITIALIZE_HTTP_STATUS=${INIT_CODE}"
          echo "INITIALIZE_CONTENT_TYPE=$(grep -i '^content-type:' /tmp/init.headers | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
          echo "WWW_AUTHENTICATE_PRESENT=$(grep -qi '^www-authenticate:' /tmp/init.headers && echo YES || echo NO)"

          echo "--- OAuth protected-resource metadata discovery ---"
          META_CODE=$(curl -sS --connect-timeout 10 --max-time 20 \
            -D /tmp/meta.headers -o /tmp/meta.body \
            -w '%{http_code}' \
            "${MCP_URL}/.well-known/oauth-protected-resource" || true)
          echo "OAUTH_RESOURCE_METADATA_HTTP_STATUS=${META_CODE}"

          if [ "${META_CODE}" = "200" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/meta.body')
          try:
              data = json.loads(p.read_text())
          except Exception as exc:
              print(f'OAUTH_METADATA_JSON=INVALID:{type(exc).__name__}')
          else:
              print('OAUTH_METADATA_JSON=VALID')
              print('RESOURCE=' + str(data.get('resource', '')))
              auth = data.get('authorization_servers') or []
              print('AUTHORIZATION_SERVERS_COUNT=' + str(len(auth)))
              for i, value in enumerate(auth[:5], 1):
                  print(f'AUTHORIZATION_SERVER_{i}={value}')
              scopes = data.get('scopes_supported') or []
              print('SCOPES_SUPPORTED_COUNT=' + str(len(scopes)))
          PY
          fi

          echo "--- Probe verdict ---"
          if [ "${ROOT_CODE}" -ge 200 ] 2>/dev/null && [ "${ROOT_CODE}" -lt 500 ] 2>/dev/null; then
            echo "NETWORK_REACHABLE=YES"
          else
            echo "NETWORK_REACHABLE=NO"
            exit 1
          fi

          case "${INIT_CODE}" in
            200|202)
              echo "MCP_PROTOCOL_REACHED=YES"
              echo "AUTH_REQUIRED=NO_OR_PREAUTHORIZED"
              ;;
            401|403)
              echo "MCP_PROTOCOL_REACHED=YES"
              echo "AUTH_REQUIRED=YES"
              ;;
            *)
              echo "MCP_PROTOCOL_REACHED=UNCONFIRMED"
              echo "AUTH_REQUIRED=UNKNOWN"
              ;;
          esac

          echo "POROTA_IOL_MCP_PROBE=END"
