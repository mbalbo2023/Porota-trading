name: RC6 Wave2 PPI 1.3.0 Runtime Validate 2026-09-08

on:
  push:
    branches: [integration/rc6-wave2-ppi130-runtime-20260908]
    paths:
      - 'requirements.txt'
      - '.github/workflows/rc6-wave2-ppi130-runtime-validate-20260908.yml'

permissions:
  contents: read

concurrency:
  group: rc6-wave2-ppi130-runtime-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact deployed Wave1B ancestry and diff gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=860b26ca22a73679217e8953207041da2b8afffd
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          got=set(Path('/tmp/changed.txt').read_text().splitlines())
          allowed={'requirements.txt','.github/workflows/rc6-wave2-ppi130-runtime-validate-20260908.yml'}
          assert got <= allowed, sorted(got-allowed)
          assert 'requirements.txt' in got
          print('WAVE2_PPI130_DIFF_SCOPE=GREEN')
          PY
      - name: Resolve canonical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import importlib.metadata as m
          assert m.version('ppi-client') == '1.3.0'
          print('PPI_CLIENT_VERSION=1.3.0')
          PY
      - name: Compile critical broker-readonly modules
        run: |
          python -m py_compile bd_ppi_readonly_guard.py bv_paper_runtime.py m_instrument_universe.py bf_production_paper_observer.py
      - name: Login contract static no-network proof
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          from ppi_client.ppi import PPI
          p=PPI(sandbox=False)
          src=inspect.getsource(p.account.login_api)
          normalized=''.join(src.lower().split())
          assert 'loginapi' in normalized, 'LOGIN_API_ENDPOINT_NOT_FOUND_IN_SOURCE'
          assert 'apikey' in normalized and 'apisecret' in normalized, 'LOGIN_API_HEADERS_NOT_FOUND_IN_SOURCE'
          print('PPI130_LOGIN_CONTRACT_STATIC=GREEN')
          print('NETWORK_LOGIN_TEST=NOT_PERFORMED')
          PY
      - name: Focused safety regression
        run: |
          python -m pytest -q tests/test_rc6_no_budget_permission_probe.py tests/test_rc6_operational_alerts.py tests/test_rc6_wave1b_sla_scraping.py
      - name: No order-route expansion invariant
        shell: bash
        run: |
          set -euo pipefail
          BASE=860b26ca22a73679217e8953207041da2b8afffd
          ! git diff "$BASE" HEAD -- . ':!requirements.txt' ':!.github/workflows/rc6-wave2-ppi130-runtime-validate-20260908.yml' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          echo 'ORDER_ROUTE_EXPANSION=NO'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ROLLBACK_AUTOMATICO=NO'
          echo 'WAVE2_PPI130_VALIDATE=GREEN'
