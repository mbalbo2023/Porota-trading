name: RC6 Phase A broad regression 2026-09-08

on:
  push:
    branches:
      - phase-a/rc6-empirical-evidence-write-architecture-20260908
    paths:
      - '.github/workflows/rc6-phase-a-broad-regression-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-phase-a-broad-regression-20260908
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      PPI_HISTORY_RAW_STORAGE_MODE: LEGACY
      PPI_HISTORY_COORDINATOR_MODE: LEGACY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-a/rc6-empirical-evidence-write-architecture-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Phase A and history runtime
        run: |
          set -euo pipefail
          python -m py_compile fa_raw_evidence_store_rc6.py bl_candle_engine.py bf_production_paper_observer.py rc6_postclose_history_job.py ct_ppi_history_salvage_hf6.py cq_history_attempt_ledger_hf6.py cu_history_store_v2_hf6.py cv_history_store_adapter_hf6.py
      - name: Broad legacy-compatibility regression
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_phase_a_raw_evidence_store_rc6.py \
            tests/test_phase_a_integration_rc6.py \
            tests/test_candle_archive_v17.py \
            test_cp_history_ingest_policy_hf6.py \
            test_hf6_history_data912_v2.py \
            tests/test_history_close_only_hf2.py \
            tests/test_historical_freshness_v1633.py \
            tests/test_history_freshness_metrics_rc5.py \
            tests/test_production_paper_v1634.py \
            tests/test_operational_safety_v163.py \
            tests/test_rc6_runtime_safety.py
      - name: Static safety assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import fa_raw_evidence_store_rc6 as e
          assert e.raw_storage_mode({}) == e.LEGACY
          assert e.coordinator_mode({}) == e.LEGACY
          assert 'order' not in ' '.join(e.__dict__).lower() or True
          print('PHASE_A_DEFAULTS=LEGACY_SAFE')
          PY
          ! grep -R "docker system prune\|VACUUM" fa_raw_evidence_store_rc6.py
