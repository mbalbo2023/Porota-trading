name: RC6 R305 Root manifest witness

# OFFHOST ONLY: digest/provenance witness, never root permission or HOST GO.
# Input contains only proposed non-secret manifest SHA hashes, not source bytes
# or credentials. R305 still requires independent review and fresh owner GO.
on:
  workflow_dispatch:
    inputs:
      manifest_b64:
        description: Canonical RC6_ROOT_INSTALL_MANIFEST_V1 bytes encoded as base64
        type: string
        required: true
      manifest_sha256:
        description: Expected SHA256 of canonical ROOT_INSTALL manifest bytes
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rc6-r305-root-manifest-witness
  cancel-in-progress: false

jobs:
  independent_digest:
    name: RC6 R305 Root manifest witness
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'mbalbo2023/Porota-trading' && github.ref == 'refs/heads/main' && github.actor == 'mbalbo2023' && github.triggering_actor == 'mbalbo2023' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact trusted-main event SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Independently validate root manifest digest and GitHub candidate tree
        shell: bash
        timeout-minutes: 2
        env:
          RC6_ROOT_INSTALL_MANIFEST_B64: ${{ inputs.manifest_b64 }}
          RC6_ROOT_INSTALL_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 -I - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.rc6_r305_manifest_witness_offhost import main
          raise SystemExit(main())
          PY

      - name: Upload one non-secret digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-r305-root-manifest-digest-witness
          path: rc6-r305-root-manifest-digest-witness.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
