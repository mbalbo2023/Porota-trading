name: RC6 W12 Post Path and Runtime Orphan Proof 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-postpath-and-orphan-proof-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static references without ripgrep dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          for m in fa_raw_evidence_store_rc6 fm_critical_approval_unix_runtime_rc6 rc5_release_preflight rc6_trusted_browser_contract_collector; do
            echo "=== MODULE=$m ==="
            git grep -n -E "$m" -- ':!tests/**' ':!*.md' ':!POROTA_TRADING_CHECKPOINT*' || true
          done
          echo ORDER_ROUTES=NOT_CALLED

  host-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Pinpoint safe W12 failure evidence
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo '=== WRAPPER_EFFECTIVE_DEFAULTS ==='
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh')
          lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
          secretish=re.compile(r'(?i)(password|passwd|secret|token|cookie|otp|authorization)')
          for i in range(1,min(36,len(lines))+1):
              s=lines[i-1]
              if secretish.search(s): print(f'L{i}=<REDACTED_SECRET_RELATED_SOURCE_LINE>')
              elif any(k in s for k in ('PROFILE','BROWSER_USER','BROWSER_HOME','CE_PYTHON','ROOT=','LIB=','OUTDIR=','CONTAINER=')):
                  print(f'L{i}={s[:420]}')
          PY
          echo '=== EFFECTIVE_DEFAULT_PROFILE_STAT ==='
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh')
          text=p.read_text(encoding='utf-8',errors='replace')
          m=re.search(r'^PROFILE="\$\{POROTA_CHROME_PROFILE:-([^}]+)\}"',text,re.M)
          if not m: print('PROFILE_DEFAULT_PARSE=FAILED'); raise SystemExit
          q=Path(m.group(1))
          print('PROFILE_DEFAULT='+str(q))
          print('PROFILE_DEFAULT_EXISTS='+('YES' if q.is_dir() else 'NO'))
          if q.exists():
              st=q.stat(); print(f'PROFILE_UID={st.st_uid}|PROFILE_GID={st.st_gid}|PROFILE_MODE={oct(st.st_mode & 0o777)}|PROFILE_MTIME_NS={st.st_mtime_ns}')
          for rel in ('Default','Default/Preferences','Default/Secure Preferences','Local State'):
              z=q/rel; print('PROFILE_KEY='+rel+'|EXISTS='+('YES' if z.exists() else 'NO'))
          PY
          echo '=== REAUTH_REQUEST_GUARD_SOURCE_SANITIZED ==='
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py')
          lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
          secretish=re.compile(r'(?i)(password|passwd|secret|token|cookie|otp|authorization)')
          for i in range(205,270):
              if i > len(lines): break
              s=lines[i-1]
              if secretish.search(s): print(f'L{i}=<REDACTED_SECRET_RELATED_SOURCE_LINE>')
              else: print(f'L{i}={s[:420]}')
          PY
          echo '=== RECENT_W12_JOURNAL_SAFE ==='
          sudo -n journalctl -u porota-contract-evidence-rc6.service --since '2026-09-10 16:30:00 UTC' --no-pager -o cat 2>/dev/null \
            | grep -E 'REAUTH_DIAG|STATUS=|AUTH_STATUS=|BLOCKED|PROFILE|IMPORT_RC|REAL_ORDERS_SENT|ORDER_ROUTES' \
            | sed -E 's/((PASSWORD|PASSWD|SECRET|TOKEN|COOKIE|OTP|AUTHORIZATION)[^= ]*=)[^ ]+/\1<REDACTED>/Ig' \
            | tail -n 120 || true
          echo '=== HOST_RUNTIME_FILENAME_REFS ==='
          sudo -n grep -R -n -E 'rc6_trusted_browser_contract_collector|fm_critical_approval_unix_runtime_rc6|fa_raw_evidence_store_rc6|rc5_release_preflight' \
            /etc/systemd/system /usr/local/sbin /usr/local/lib /opt/porota-trading/scripts 2>/dev/null | head -n 160 || true
          echo MUTATIONS=NONE
          echo COLLECTOR_EXECUTED=NO
          echo SECRETS_VALUES_PRINTED=NO
          echo ORDER_ROUTES=NOT_CALLED
          HOST
