name: RC6 WS-INTEG-03 IOL Runtime Read-Only RCA 2026-09-30

on:
  push:
    branches:
      - fix/ws-integ-03-iol-runtime-state-20260930
    paths:
      - '.github/workflows/rc6-ws-integ-03-iol-runtime-rca-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly_iol_rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Inspect IOL cache and scheduler without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ.get("POROTA_IOL_SHADOW_ROOT", "/app/data/market"))
          path = root / "iol_family_reference_latest.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          states = payload.get("section_states") or {}
          cauciones = payload.get("cauciones") or {}
          evidence = {
              "path": str(path),
              "schema": payload.get("schema"),
              "keys": sorted(payload),
              "cache_state": payload.get("cache_state"),
              "continuation_state": payload.get("continuation_state"),
              "fallback_order": payload.get("fallback_order"),
              "refreshed_at": payload.get("refreshed_at"),
              "last_known_good_at": payload.get("last_known_good_at"),
              "section_states": states,
              "live_sections": payload.get("live_sections") or [],
              "caucion_ars_records": len(cauciones.get("ARS") or []),
              "errors": payload.get("errors") or [],
              "real_money_authorized": payload.get("real_money_authorized"),
          }
          print("IOL_RUNTIME_REFERENCE=" + json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY
          echo "IOL_TIMER=$(systemctl is-enabled porota-iol-shadow-collector-rc6.timer 2>/dev/null || true)|$(systemctl is-active porota-iol-shadow-collector-rc6.timer 2>/dev/null || true)"
          echo "IOL_SERVICE=$(systemctl is-active porota-iol-shadow-collector-rc6.service 2>/dev/null || true)"
          systemctl show porota-iol-shadow-collector-rc6.timer \
            -p LastTriggerUSec -p NextElapseUSecRealtime --no-pager 2>/dev/null || true
          sudo -n timeout 10 python3 - /opt/porota-trading/data/paper_v17/observer_v17.db <<'PY'
          import sqlite3
          import sys
          connection = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=3)
          connection.execute("PRAGMA query_only=ON")
          mode, orders = connection.execute(
              "SELECT mode,real_orders_sent FROM observer_state WHERE id=1"
          ).fetchone()
          connection.close()
          print(f"RUNTIME_SAFETY={mode}|real_orders_sent={orders}")
          assert mode == "PRODUCTION_PAPER" and int(orders or 0) == 0
          PY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
