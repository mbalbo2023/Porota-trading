name: RC6 679 bounded read-only resource inventory
# Bounded final COLD queue maturity recheck after Deploy V2 #39831414654: exact runtime 52843ee81d5c0f72bfcf7b15188b82d0a4185640, 2026-10-22 19:02 UTC.
on:
  push:
    branches:
      - diagnostic/rc6-679-readonly-baseline-20261021
    paths:
      - .github/workflows/rc6-679-readonly-resource-inventory-20261021.yml
      - scripts/rc6_679_resource_inventory_readonly.py
      - scripts/rc6_679_storage_metadata_readonly.py
      - scripts/rc6_679_dashboard_backup_readonly.py
      - scripts/rc6_685_live_browser_readonly.py
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source and verify no deploy drift
        id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD bc661130968f2b85b8b2146f76923ddd26eb7837)" = bc661130968f2b85b8b2146f76923ddd26eb7837
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          python -m py_compile scripts/rc6_679_dashboard_backup_readonly.py scripts/rc6_679_resource_inventory_readonly.py
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_679_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_679_readonly" "$HOME/.ssh/known_hosts"
      - name: Bounded authenticated dashboard route census
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          timeout 45 ssh -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n docker exec -i porota_production_dashboard nice -n 19 python3 -" < scripts/rc6_679_dashboard_backup_readonly.py
      - name: Bounded backup manifest and host reads only
        # This phase has its own SHA, PAPER and container guards. Preserve its
        # independent evidence if the dashboard HTTP/API gate failed, while
        # keeping the overall job RED and the host strictly read-only.
        if: ${{ always() && steps.pin.outcome == 'success' }}
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          POLICY_B64="$(git show f0c393ca2b5c1560bf57cf776f1e9fcfcbca582f:ops/policy/host-control-plane-reconciliation-v2.json | base64 -w0)"
          timeout 100 ssh -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n python3 - '$POLICY_B64'" < scripts/rc6_679_resource_inventory_readonly.py
      - name: Authenticated real browser inspection via local SSH tunnel
        if: ${{ always() && steps.pin.outcome == 'success' }}
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          command -v google-chrome >/dev/null
          TOKEN="$(timeout 15 ssh -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            'sudo -n docker exec porota_production_dashboard printenv DASHBOARD_ACCESS_TOKEN')"
          test "${#TOKEN}" -ge 24
          echo "::add-mask::$TOKEN"
          ssh -N -L 127.0.0.1:18085:127.0.0.1:8000 \
            -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes -o ConnectTimeout=10 \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" &
          TUNNEL_PID=$!
          trap 'kill "$TUNNEL_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if DASHBOARD_ACCESS_TOKEN="$TOKEN" python -c 'import os,urllib.request; u="http://127.0.0.1:18085/api/dashboard/truth"; r=urllib.request.urlopen(urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["DASHBOARD_ACCESS_TOKEN"]}),timeout=2); assert r.status==200'; then break; fi
            sleep 1
          done
          DASHBOARD_ACCESS_TOKEN="$TOKEN" python scripts/rc6_685_live_browser_readonly.py --output visual-evidence
          unset TOKEN
      - name: Preserve sanitized visual evidence
        if: ${{ always() && steps.pin.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc6-685-sanitized-browser-evidence
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/rc6_679_readonly"
