name: RC6 Forward Lab v2 validation
on:
  push:
    branches: [feature/rc6-forward-lab-v2-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_forward_lab_v2_rc6.py
      - run: python -m py_compile fh_forward_lab_v2_rc6.py
      - run: python -c "import fh_forward_lab_v2_rc6 as m; m.assert_offline_only(); print('FORWARD_LAB_V2=GREEN_OFFLINE')"
