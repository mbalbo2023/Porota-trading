name: RC6 WS-DISK-07B pretransfer smoke

on:
  push:
    branches:
      - fix/ws-disk-07-pretransfer-metrics-20261001
    paths:
      - '.github/workflows/rc6-ws-disk-07b-pretransfer-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_smoke"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_smoke" "$HOME/.ssh/known_hosts"
      - name: Read-only pretransfer metric smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE_TAR_BYTES=410000000
          BUNDLE_BYTES=2000000
          REQUIRED_LINE="$(python scripts/rc6_disk_space_guard.py \
            --policy ops/policy/rc6-disk-housekeeping-v1.json \
            --image-tar-bytes "$IMAGE_TAR_BYTES" \
            --bundle-bytes "$BUNDLE_BYTES")"
          REQUIRED_PRETRANSFER_FREE="${REQUIRED_LINE#RC6_DISK_REQUIRED_PRETRANSFER_FREE=}"
          echo "$REQUIRED_LINE"

          REMOTE_METRICS="$(ssh -i "$HOME/.ssh/porota_rc6_smoke" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE_DISK'
df -PB1 / | awk 'NR==2 {print $4}'
df -Pi / | awk 'NR==2 {printf "%.6f\\n", (100.0*$4/$2)}'
REMOTE_DISK
          )"
          mapfile -t METRICS <<< "$REMOTE_METRICS"
          test "${#METRICS[@]}" -eq 2
          AVAILABLE_BYTES="${METRICS[0]}"
          INODE_FREE_PERCENT="${METRICS[1]}"
          python scripts/rc6_disk_space_guard.py \
            --policy ops/policy/rc6-disk-housekeeping-v1.json \
            --image-tar-bytes "$IMAGE_TAR_BYTES" \
            --bundle-bytes "$BUNDLE_BYTES" \
            --available-bytes "$AVAILABLE_BYTES" \
            --inode-free-percent "$INODE_FREE_PERCENT" \
            --json
          echo "RC6_DISK_PRETRANSFER_SMOKE=GREEN|available=$AVAILABLE_BYTES|required=$REQUIRED_PRETRANSFER_FREE|inode=$INODE_FREE_PERCENT"
      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/porota_rc6_smoke"
