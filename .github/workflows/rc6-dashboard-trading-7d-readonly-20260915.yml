name: RC6 Action4 weekly PAPER report publisher

# Staged manual control only. A scheduled copy belongs on default main AFTER
# this product API/client is deployed and proven by an authenticated runtime
# GET/POST/GET receipt. Do not schedule this branch's uninstalled code.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-action4-weekly-paper
  cancel-in-progress: false

jobs:
  weekly-report:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      ACTION_RUN_ID: ${{ github.run_id }}
      ACTION_RUN_NUMBER: ${{ github.run_number }}
      ACTION_WORKFLOW_COMMIT: ${{ github.sha }}
    steps:
      - name: Verify bounded PAPER report origin
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ACTION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ACTION_RUN_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$ACTION_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"

      - name: Prepare pinned SSH connection
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_action4_weekly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_action4_weekly" "$HOME/.ssh/known_hosts"

      - name: Consume bounded dashboard API and publish verified PAPER artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=5s 180s ssh \
            -i "$HOME/.ssh/rc6_action4_weekly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" bash -s -- \
            "$ACTION_RUN_ID" "$ACTION_RUN_NUMBER" "$ACTION_WORKFLOW_COMMIT" <<'REMOTE'
          set -Eeuo pipefail
          run_id="$1"
          run_number="$2"
          workflow_commit="$3"
          container_id="$(sudo -n docker inspect --format '{{ .Id }}' porota_production_dashboard)"
          image_id="$(sudo -n docker inspect --format '{{ .Image }}' "$container_id")"
          image_label_commit="$(sudo -n docker inspect --format '{{ index .Config.Labels "porota.commit" }}' "$container_id")"
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$image_label_commit" =~ ^[0-9a-f]{40}$ ]]
          sudo -n docker exec -i -e ACTION_RUN_ID="$run_id" \
            -e ACTION_RUN_NUMBER="$run_number" \
            -e ACTION_WORKFLOW_COMMIT="$workflow_commit" \
            -e ACTION_IMAGE_LABEL_COMMIT="$image_label_commit" \
            -e ACTION_CONTAINER_ID="$container_id" \
            -e ACTION_IMAGE_ID="$image_id" \
            "$container_id" python -m scripts.rc6_action4_weekly_consumer
          REMOTE

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f "$HOME/.ssh/rc6_action4_weekly" ]; then
            shred -u "$HOME/.ssh/rc6_action4_weekly"
          fi
