name: RC6 Final Shadow Test Alignment 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-final-shadow-test-alignment-20260910.yml

permissions:
  contents: write

jobs:
  align-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-w10-sector-map-binding-20260910
          fetch-depth: 0

      - name: Align only obsolete economics authority assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lifecycle=Path('tests/test_production_paper_v1634.py')
          s=lifecycle.read_text(encoding='utf-8')
          old_assert='assert broker.economics_mode == "BINDING"'
          if s.count(old_assert) != 3:
              raise SystemExit(f'EXPECTED_3_BINDING_ASSERTIONS_GOT_{s.count(old_assert)}')
          s=s.replace(
              '# economía BINDING + cierre intradiario + target congelado 5%. No usa SHADOW.',
              '# economía SHADOW + cierre intradiario + target congelado 5%; el ciclo sigue siendo PAPER.'
          )
          s=s.replace(
              '# Esta prueba necesita una apertura; usa la composición RC6 BINDING real.',
              '# Esta prueba necesita una apertura; economics permanece SHADOW durante la campaña RC6.'
          )
          s=s.replace(old_assert, 'assert broker.economics_mode == "SHADOW"')
          lifecycle.write_text(s, encoding='utf-8')
          assert s.count('assert broker.economics_mode == "SHADOW"') >= 3

          dashboard_test=Path('tests/test_hotfix_rc3_hf2.py')
          d=dashboard_test.read_text(encoding='utf-8')
          old_dashboard='assert "Economía matemática BINDING" in page'
          if d.count(old_dashboard) != 1:
              raise SystemExit(f'EXPECTED_1_DASHBOARD_BINDING_ASSERTION_GOT_{d.count(old_dashboard)}')
          d=d.replace(old_dashboard, 'assert "Economía matemática SHADOW" in page')
          dashboard_test.write_text(d, encoding='utf-8')
          assert 'assert "Economía matemática SHADOW" in page' in d

          print('SHADOW_TEST_ALIGNMENT=GREEN')
          PY
          git diff --check
          git diff -- tests/test_production_paper_v1634.py tests/test_hotfix_rc3_hf2.py

      - name: Build exact focused proof image
        run: docker build --pull=false -t porota-rc6-shadow-proof:${GITHUB_SHA} .

      - name: Run previously failing tests offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-shadow-proof:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              tests/test_production_paper_v1634.py::test_ciclo_compra_y_venta_es_solo_paper \
              tests/test_production_paper_v1634.py::test_no_duplica_decision_ni_posicion_en_mismo_ciclo \
              tests/test_production_paper_v1634.py::test_patrimonio_paper_limita_posicion_y_exposicion \
              tests/test_hotfix_rc3_hf2.py::test_dashboard_expone_binding_y_guardas_hf3'

      - name: Preserve safety authority explicitly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import _version
          from pathlib import Path
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          m=Path('porota_mode_manager.py').read_text(encoding='utf-8')
          assert '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"' in m
          assert '"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"' in m
          assert '"PAPER_MAX_POSITIONS_PER_SECTOR": "2"' in m
          print('RC6_AUTHORITY_UNCHANGED=GREEN')
          PY

      - name: Commit test alignment only after proof is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add tests/test_production_paper_v1634.py tests/test_hotfix_rc3_hf2.py
          git diff --cached --check
          git commit -m 'test(rc6): align PAPER economics assertions with shadow policy'
          git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
