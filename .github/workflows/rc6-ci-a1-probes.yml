name: RC6 A1 isolated HTTP and native probes

# Development evidence only. This workflow has no material admission, release,
# deploy, broker, Horizon, or owner renewal path.
on:
  push:
    branches: [work/rc6-ci-a1-probes-20261013]
    paths: [.github/workflows/rc6-ci-a1-probes.yml]

permissions:
  contents: read

concurrency:
  group: rc6-ci-a1-probes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-probes:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.ref == 'refs/heads/work/rc6-ci-a1-probes-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RC6_PROBE_MODE: PRODUCTION_PAPER / SIMULATION
      RC6_MATERIAL_GATE_CREDIT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Identity and Linux supervisor precondition
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p a1-receipts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY' | tee a1-receipts/runner-proc.json
          import json, os, pathlib, subprocess, threading
          path=pathlib.Path(f'/proc/{os.getpid()}/task/{threading.get_native_id()}/status')
          data={'schema':'rc6.a1.runner-proc.v1','run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'source_sha':os.environ['GITHUB_SHA'],
              'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'own_task_status_readable':path.is_file(),
              'scope':'DEVELOPMENT_ONLY_NOT_G0_G8', 'real_orders_sent':0}
          print(json.dumps(data,sort_keys=True))
          if not data['own_task_status_readable']: raise SystemExit(86)
          PY
      - name: Install test-only Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1 cryptography==50.0.1
          python -m pip freeze > a1-receipts/test-dependencies.txt
      - name: Offline A/B baseline and modeled transport
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m scripts.rc6_a1_http_ab | tee a1-receipts/http-ab-offline.json
          python -m pytest -q tests/test_rc6_a1_http_ab.py tests/test_rc6_delegated_renewal.py --junitxml=a1-receipts/http-ab-tests.xml
      - name: Four native pytest cases in separate Python processes
        shell: bash
        run: |
          set -Eeuo pipefail
          cases=(
            test_native_callback_failure_keeps_original_term_reap_echild_and_restoration
            test_authenticated_adapter_forwards_callback_and_preserves_original_fin_authority
            test_carrier_lease_red_preserves_original_fin_and_owned_raw_without_green
            test_diagnostic_api_stop_uses_original_tiny_native_fin_and_releases_no_unknown_custody
          )
          failed=0
          for index in "${!cases[@]}"; do
            label="native-${index}"
            if timeout 95s python -m pytest -q "tests/test_rc6_owned_gate_lease.py::${cases[$index]}" \
              --junitxml="a1-receipts/${label}.xml" > "a1-receipts/${label}.log" 2>&1; then
              echo "${label}=PASS"
            else
              code=$?
              echo "${label}=FAIL exit=${code}"
              failed=1
            fi
          done
          python - <<'PY' | tee a1-receipts/native-summary.json
          import json,os,pathlib,xml.etree.ElementTree as ET
          rows=[]
          for path in sorted(pathlib.Path('a1-receipts').glob('native-*.xml')):
              root=ET.parse(path).getroot()
              suite=root if root.tag=='testsuite' else root.find('testsuite')
              rows.append({'file':path.name,'tests':int(suite.attrib['tests']),
                  'failures':int(suite.attrib['failures']),
                  'errors':int(suite.attrib['errors']),
                  'skipped':int(suite.attrib['skipped'])})
          complete=len(rows)==4 and all(row['tests']==1 for row in rows)
          print(json.dumps({'schema':'rc6.a1.native-probe.v1','run_id':os.environ['GITHUB_RUN_ID'],
              'source_sha':os.environ['GITHUB_SHA'], 'cases':rows,
              'all_four_receipts_present':complete,
              'G0_G8_qualification':False,'real_orders_sent':0},sort_keys=True))
          if not complete: raise SystemExit(88)
          PY
          exit "$failed"
      - name: Preserve isolated diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-a1-nonmaterial-${{ github.run_id }}-${{ github.run_attempt }}
          path: a1-receipts/
          if-no-files-found: warn
          retention-days: 1
