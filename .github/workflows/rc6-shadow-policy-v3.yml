name: RC6 SHADOW policy v3

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - 'scripts/rc6_apply_shadow_policy_v3.py'
      - '.github/workflows/rc6-shadow-policy-v3.yml'

permissions:
  contents: write

concurrency:
  group: rc6-shadow-v3
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - name: Apply v3
        run: python scripts/rc6_apply_shadow_policy_v3.py
      - name: Compile
        run: |
          python -m py_compile es_shadow_binding_contract_rc6.py es_policy_context_rc6.py \
            be_paper_engine.py bf_production_paper_observer.py bg_paper_dashboard.py \
            ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py \
            ck_policy_gate_hf6.py porota_mode_manager.py
      - name: Dependency-light proofs
        shell: bash
        run: |
          python scripts/rc6_shadow_selftest.py
          python - <<'PY'
          import os
          import ck_policy_gate_hf6 as g
          os.environ['PAPER_EXPECTANCY_POLICY']='SHADOW'
          os.environ['PAPER_MARKET_REGIME_POLICY']='SHADOW'
          os.environ['PAPER_SECTOR_CONCENTRATION_POLICY']='SHADOW'
          r=g.evaluate(expectancy_samples=[{'sample_state':'OBSERVATIONAL','empirical_expectancy':'-1','currency':'ARS'}],breadth={'state':'BEARISH_BREADTH'},sectors={'groups':[{'sector':'BANKS','open_positions':9}]},candidate_sector='BANKS',sector_limit=1)
          assert r['would_block'] is True and r['execute_block'] is False
          print('RC6_SHADOW_COUNTERFACTUAL=GREEN')
          PY
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          FILES='porota_mode_manager.py bg_paper_dashboard.py bf_production_paper_observer.py be_paper_engine.py ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py ck_policy_gate_hf6.py POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md'
          if git diff --quiet -- $FILES; then
            echo RC6_SHADOW_V3_COMMIT=NOT_NEEDED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'RC6: restore SHADOW-first learning policy [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
