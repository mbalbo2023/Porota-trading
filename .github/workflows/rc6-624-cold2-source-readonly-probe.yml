name: RC6 624 COLD2 source metadata read only

on:
  push:
    branches: [diagnostic/rc6-624-cold2-source-20261020]
    paths: [.github/workflows/rc6-624-cold2-source-readonly-probe.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bounded PAPER admission and cold source names
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_cold2_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_cold2_diag" "$HOME/.ssh/known_hosts"
          timeout 75 ssh -i "$HOME/.ssh/porota_rc6_cold2_diag" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import json, os, pathlib, sqlite3, stat
          root=pathlib.Path('/opt/porota-trading')
          db=root/'data/paper_v17/observer_v17.db'
          with sqlite3.connect('file:'+str(db)+'?mode=ro',uri=True,timeout=1) as c:
              c.execute('PRAGMA query_only=ON')
              c.execute('PRAGMA busy_timeout=200')
              paper=c.execute('SELECT mode,process_state,session_state,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          if not paper or paper[0]!='PRODUCTION_PAPER' or type(paper[3]) is not int or paper[3]!=0:
              raise SystemExit('COLD2_DIAG_PAPER_ADMISSION_RED')
          mem=int(next(line.split()[1] for line in open('/proc/meminfo') if line.startswith('MemAvailable:')))*1024
          v=os.statvfs('/')
          free=v.f_bavail*v.f_frsize
          if mem<128*1024*1024 or free<2*1024**3:
              raise SystemExit('COLD2_DIAG_RESOURCE_ADMISSION_RED')
          source=root/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow/cold-audit'
          mode=source.lstat().st_mode
          if not stat.S_ISDIR(mode) or source.is_symlink():
              raise SystemExit('COLD2_DIAG_SOURCE_UNSAFE')
          names=sorted(p.name for p in source.iterdir())
          if len(names)>128 or any(len(n)>160 or n in ('.','..') for n in names):
              raise SystemExit('COLD2_DIAG_BOUND_RED')
          ident='7dc99ccd8f7c47849ca3705ae1cb2c49'
          allowed={ident+'.pack','manifest-'+ident+'.json','receipt-'+ident+'.json','queue.json'}
          for old in ('87f18ab0f25749c0bf3f0b3ad73a164b','b024ef43497d4108af829947f8855701'):
              allowed.update(('manifest-'+old+'.json','receipt-'+old+'.json'))
          entries=[]
          for name in names:
              st=(source/name).lstat()
              kind='regular' if stat.S_ISREG(st.st_mode) else 'directory' if stat.S_ISDIR(st.st_mode) else 'other'
              entries.append({'name':name,'kind':kind,'bytes':st.st_size,'allowed_original':name in allowed})
          print('COLD2_SOURCE_READONLY='+json.dumps({'schema':'rc6-624-cold2-source-metadata-v1',
              'paper':paper,'mem_available':mem,'root_free':free,'entries':entries,
              'unexpected':[e['name'] for e in entries if not e['allowed_original']]},sort_keys=True))
          def summary(path):
              st=path.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_size>65536 or st.st_nlink!=1 or path.is_symlink():
                  return {'file':path.name,'status':'UNSAFE'}
              outer=json.loads(path.read_bytes())
              payload=outer.get('payload',{})
              import hashlib
              canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),default=str,ensure_ascii=True,allow_nan=False).encode('ascii')
              key='sha256' if path.name.startswith(('manifest-','receipt-','queue.')) else 'digest'
              valid=hashlib.sha256(canonical).hexdigest()==outer.get(key)
              fields=('snapshot_id','state','manifest_sha256','pack_sha256','pack_bytes','pack','failed_at','error_class','error_code','error_phase','wall_seconds','cpu_seconds','sealed_at','deadline_at','generation_id','file','status','real_orders_sent')
              return {'file':path.name,'hash_valid':valid,'fields':{k:payload.get(k) for k in fields if k in payload}}
          selected=[source/n for n in names if n=='queue.json' or n.startswith(('manifest-','receipt-'))]
          shadow=source.parent
          selected += [shadow/'CURRENT.json',shadow/'status.json']
          archive=root/'data/deploy/rc6-failed-cold-7dc99ccd8f7c47849ca3705ae1cb2c49'
          archived=sorted(p.name for p in archive.iterdir()) if archive.is_dir() and not archive.is_symlink() else []
          import gzip
          current=json.loads((shadow/'CURRENT.json').read_bytes())['payload']
          cut_path=shadow/current['file']
          if cut_path.lstat().st_size>4*1024**2 or cut_path.is_symlink():
              raise SystemExit('COLD2_CUT_BOUND_RED')
          with gzip.open(cut_path,'rb') as stream:
              raw=stream.read(4*1024**2+1)
          if len(raw)>4*1024**2:
              raise SystemExit('COLD2_CUT_DECOMPRESSED_BOUND_RED')
          cut=json.loads(raw)['payload']
          print('COLD2_CURRENT_REFERENCE='+json.dumps({'generation_id':current['generation_id'],
              'computed_report':cut.get('report',{}).get('computed_report'),
              'real_orders_sent':cut.get('status',{}).get('real_orders_sent'),
              'real_routes':cut.get('status',{}).get('real_routes')},sort_keys=True))
          print('COLD2_SOURCE_PROVENANCE='+json.dumps({'envelopes':[summary(p) for p in selected],
              'original_archive_names':archived},sort_keys=True))
          PY
      - name: Runner key cleanup
        if: always()
        run: rm -f "$HOME/.ssh/porota_rc6_cold2_diag"
