name: RC6 A341 independent external sensor Ed25519 contract tests

# No market data, order, host, deployment, scheduled job or artifact access.
# Test keys are generated in ephemeral memory; no production trust registry.
on:
  pull_request:
    paths:
      - scripts/rc6_a341_external_sensor_verify.py
      - tests/test_rc6_a341_external_sensor_verify.py
      - .github/workflows/rc6-a341-external-sensor-tests.yml

permissions:
  contents: read

concurrency:
  group: rc6-a341-ed25519-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synthetic-public-key-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic public-key-only verification dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile verifier and enforce fail-closed ten-family tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/rc6_a341_external_sensor_verify.py
          python -m unittest discover -s tests -p 'test_rc6_a341_external_sensor_verify.py' -v
          echo 'A341_ED25519_CRYPTO_CONTRACTS=GREEN'
          echo 'SOURCE_PIT_VERIFIED=0 PAPER_SIM_VERIFIED=0 REAL_ORDERS_SENT=0'
