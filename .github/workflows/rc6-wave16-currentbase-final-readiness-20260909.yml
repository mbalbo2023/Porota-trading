name: RC6 Wave16 Currentbase Final Readiness 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave16-currentbase-20260909]
    paths: [.github/workflows/rc6-wave16-currentbase-final-readiness-20260909.yml]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify housekeeping is data-safe
        run: |
          set -Eeuo pipefail
          test -f ops/rc6_safe_build_cache_housekeeping.sh
          grep -Eq 'docker[[:space:]]+builder[[:space:]]+prune' ops/rc6_safe_build_cache_housekeeping.sh
          ! grep -REn 'docker[[:space:]]+(image|container|volume|system)[[:space:]]+prune|rm -rf .*data|docker rm|docker rmi' ops/rc6_safe_build_cache_housekeeping.sh
          echo 'W16_DATA_DESTRUCTIVE_OPS=NONE'
          echo 'W16_CODE_READY=GREEN'
