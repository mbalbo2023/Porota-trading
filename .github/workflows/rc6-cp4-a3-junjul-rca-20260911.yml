name: RC6 CP4 A3 JUN JUL RCA 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-cp4-a3-junjul-rca-20260911.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  rca:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only CP4 failure RCA
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          CONTAINER=porota_production_observer
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo HOST_HEAD="$TARGET"
          echo MUTATIONS=NONE
          echo REAL_ORDER_ROUTES=NOT_CALLED
          sudo -n docker exec -i "$CONTAINER" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          runtime=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          rows=[dict(x) for x in c.execute("select symbol,status,last_complete_day,last_attempt_at,last_success_at,last_error,rows_last,attempts from a3_history_ingest_state_rc6 where instrument_type='FUTUROS' and symbol in ('DLR/JUN27','DLR/JUL27') order by symbol")]
          c.close()
          print(json.dumps({'runtime':dict(runtime) if runtime else None,'rows':rows},ensure_ascii=False,default=str))
          assert runtime and runtime['mode']=='PRODUCTION_PAPER' and int(runtime['real_orders_sent'] or 0)==0
          assert len(rows)==2
          print('CP4_JUNJUL_DB_RCA=COMPLETE')
          PY
          echo '--- DIRECT READ-ONLY SOURCE RCA ---'
          sudo -n docker exec -i -w /tmp -e PYTHONPATH=/app/data/rc6_a3_overlay:/app "$CONTAINER" python - <<'PY'
          import traceback
          from cz_a3_cem_public_history_hf6 import A3CEMPublicReadOnlyClient
          from fd_a3_identity_mapper_rc6 import porota_to_a3_dlr
          c=A3CEMPublicReadOnlyClient()
          for target in ('DLR/JUN27','DLR/JUL27'):
              source=porota_to_a3_dlr(target)
              print('TARGET',target,'SOURCE',source)
              try:
                  p=c.closing_prices(symbol=source,date_from='2026-09-04',date_to='2026-09-11',page=1,page_size=500)
                  rows=p.get('data',[]) if isinstance(p,dict) else (p if isinstance(p,list) else [])
                  print('SOURCE_OK',target,'ROWS',len(rows))
              except Exception as e:
                  print('SOURCE_ERROR',target,type(e).__name__,str(e)[:600])
                  traceback.print_exc(limit=4)
          print('CP4_JUNJUL_DIRECT_RCA=COMPLETE')
          PY
          echo REAL_ORDERS_SENT=0
          HOST
