name: RC6 Waves1-8 Full Wiring Proof 2026-09-09

on:
  push:
    branches: [audit/rc6-waves1-8-full-wiring-proof-20260909]
    paths:
      - '.github/workflows/rc6-waves1-8-full-wiring-proof-20260909.yml'

permissions:
  contents: read

jobs:
  live-wiring-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_wiring"
          chmod 600 "$HOME/.ssh/porota_wiring"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Prove live wiring Waves 1 through 8
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_wiring" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/porota-trading
          echo '=== POROTA RC6 WAVES 1-8 FULL LIVE WIRING PROOF ==='
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HEAD=$(git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard

          sudo -n docker exec -i porota_production_observer python -u - <<'PY'
          import importlib, importlib.metadata, sqlite3, os, inspect
          failures=[]
          def ck(name, cond, detail=''):
              print(f'{name}={"PASS" if cond else "FAIL"}'+(f'|{detail}' if detail else ''))
              if not cond: failures.append(name)
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]
          c.close()
          ck('SAFETY_DB_QUICK_CHECK', q=='ok', str(q))
          ck('SAFETY_MODE_PRODUCTION_PAPER', mode=='PRODUCTION_PAPER', str(mode))
          ck('SAFETY_REAL_ORDERS_ZERO', int(real)==0, str(real))
          ck('WAVE4_LEGACY_RAW_ZERO', int(raw)==0, str(raw))
          ck('WAVE4_EXTERNAL_EXACT_V1', os.getenv('PPI_HISTORY_RAW_STORAGE_MODE')=='EXTERNAL_EXACT_V1', str(os.getenv('PPI_HISTORY_RAW_STORAGE_MODE')))

          required={
            'WAVE1A':['bf_production_paper_observer','m_instrument_universe','rc6_operational_alerts'],
            'WAVE1B':['feature_rc6_canonical_data_sla_policy' if False else 'de_scheduler_catalog_hf6'],
            'WAVE4':['fb_raw_evidence_exact_v1'],
            'WAVE6':['cp_history_ingest_policy_hf6','cq_history_attempt_ledger_hf6','cr_data912_reconcile_hf6','cs_postclose_history_scheduler_hf6'],
            'WAVE7':['fi_event_risk_shadow_rc6','fk_gdelt_shadow_feed_rc6','es_shadow_binding_contract_rc6'],
            'WAVE8':['ch_empirical_learning','s_learning_engine','ec_forward_lab_metrics_hf2','et_shadow_learning_rc6'],
          }
          for wave,mods in required.items():
              for m in mods:
                  try:
                      importlib.import_module(m); ck(f'{wave}_IMPORT_{m}',True)
                  except Exception as e:
                      ck(f'{wave}_IMPORT_{m}',False,type(e).__name__)
          try:
              v=importlib.metadata.version('ppi-client')
          except Exception:
              v='UNKNOWN'
          ck('WAVE2_PPI_CLIENT_1_3_0',v=='1.3.0',v)

          # Observer source-level wiring: modules must be referenced by the live entrypoint/call graph, not merely importable.
          try:
              import bf_production_paper_observer as obs
              src=inspect.getsource(obs)
          except Exception:
              src=''
          ck('WAVE1A_OBSERVER_ENTRYPOINT_PRESENT',bool(src))
          for token,label in [
              ('operational','WAVE1_ALERTING_ENTRYPOINT_REFERENCE'),
              ('history','WAVE6_HISTORY_ENTRYPOINT_REFERENCE'),
              ('risk','WAVE7_RISK_ENTRYPOINT_REFERENCE'),
              ('learning','WAVE8_LEARNING_ENTRYPOINT_REFERENCE')]:
              ck(label,token in src.lower())
          print('OBSERVER_FAILURES='+','.join(failures))
          if failures:
              raise SystemExit(21)
          PY

          sudo -n docker exec -i porota_production_dashboard python -u - <<'PY'
          import importlib, inspect, re, os
          failures=[]
          def ck(name,cond,detail=''):
              print(f'{name}={"PASS" if cond else "FAIL"}'+(f'|{detail}' if detail else ''))
              if not cond: failures.append(name)

          import da_dashboard_ux_hf6 as nav
          import bg_paper_dashboard as bg
          labels=[x.label for x in nav.TOP_NAV]; hrefs=[x.href for x in nav.TOP_NAV]
          print('TOP_NAV='+'|'.join(f'{a}:{b}' for a,b in zip(labels,hrefs)))
          ck('WAVE5_CONTRACT_EVIDENCE_MODULE_IMPORT', _try:=True)
          try:
              import cl_contract_evidence_dashboard_hf6
          except Exception as e:
              ck('WAVE5_CONTRACT_EVIDENCE_MODULE_IMPORT',False,type(e).__name__)
          ck('WAVE7_RISK_TOP_NAV', any('riesg' in x.lower() for x in labels) or any('/riesg' in x.lower() or '/risk' in x.lower() for x in hrefs))
          ck('WAVE8_CLASSIC_ROWS_COLUMNS_NAV_BASE', '/aprendizaje' in hrefs and '/en-vivo' in hrefs)

          src=inspect.getsource(bg)
          ck('WAVE8_TABLE_LAYOUT_MODULE_WIRED', 'eq_dashboard_table_layout_rc6' in src or 'classic_responsive' in src.lower())
          ck('WAVE8_TABLE_SEMANTICS_WIRED', 'er_dashboard_table_semantics_rc6' in src or 'classic_responsive' in src.lower())
          ck('WAVE8_TABLE_RESPONSIVE_RUNTIME_CSS', 'porota-rc6-force-compact-tables' in bg.TABLE_A11Y_CSS or 'classic-responsive' in bg.TABLE_A11Y_CSS.lower())
          # User requirement: primary tabular data remains rows/columns, not card-converted records.
          card_conversion=('tr.porota-record-row{display:block' in bg.TABLE_A11Y_CSS or "data-porota-force-compact='1'" in bg.TABLE_A11Y_CSS)
          ck('WAVE8_TABLES_PRIMARY_CLASSIC_ROWS_COLUMNS', not card_conversion)

          # Discover live dashboard entrypoint modules from process command and local source references.
          try:
              cmd=open('/proc/1/cmdline','rb').read().replace(b'\0',b' ').decode(errors='replace')
          except Exception: cmd=''
          print('DASHBOARD_PID1='+cmd[:500])
          print('DASHBOARD_FAILURES='+','.join(failures))
          if failures:
              raise SystemExit(31)
          PY

          echo '--- LIVE HTTP RENDER PROOF ---'
          sudo -n docker exec -i porota_production_dashboard python -u - <<'PY'
          import os, urllib.request, urllib.error
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          paths=['/','/en-vivo','/trading','/instrumentos','/historicos','/aprendizaje','/sistema','/riesgo']
          failures=[]
          for p in paths:
              url='http://127.0.0.1:8000'+p
              req=urllib.request.Request(url)
              if token:
                  req.add_header('Authorization','Bearer '+token)
                  req.add_header('X-Dashboard-Token',token)
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      body=r.read().decode('utf-8','replace'); code=r.status
              except urllib.error.HTTPError as e:
                  code=e.code; body=e.read().decode('utf-8','replace')
              except Exception as e:
                  code=0; body=''; print(f'HTTP_ERROR|{p}|{type(e).__name__}')
              print(f'HTTP|{p}|{code}|bytes={len(body)}')
              if p=='/riesgo':
                  if code!=200 or ('riesgo' not in body.lower() and 'risk' not in body.lower()): failures.append('RISK_ROUTE_RENDER')
              elif code not in (200,302,307): failures.append('HTTP_'+p)
              if p=='/':
                  if 'Riesgo' not in body and 'riesgo' not in body.lower(): failures.append('ROOT_RISK_MENU_RENDER')
                  if '<table' not in body.lower(): failures.append('ROOT_TABLE_RENDER')
          print('HTTP_RENDER_FAILURES='+','.join(failures))
          if failures: raise SystemExit(41)
          PY

          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'MUTATIONS=NONE'
          echo 'WAVES_1_TO_8_FULL_WIRING_PROOF=PASS'
          REMOTE
