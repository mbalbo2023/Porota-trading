name: RC6 Macro BCRA Readonly 2026-10-02
on:
  push:
    branches: [audit/rc6-macro-bcra-20261002]
    paths: ['.github/workflows/rc6-macro-bcra-readonly-20261002.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          mkdir -p evidence
      - name: Macro cache/runtime inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'python3 -' > evidence/macro_runtime.json <<'PY'
          import os,sqlite3,json,datetime,subprocess
          roots=[
            "/opt/porota-trading/data/trading_system.db",
            "/opt/porota-trading/trading_system.db",
            "/opt/porota-trading/data/paper_v17/observer_v17.db",
          ]
          files=[]
          for p in roots:
              item={"path":p,"exists":os.path.isfile(p)}
              if item["exists"]:
                  st=os.stat(p);item.update(size=st.st_size,mtime=datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat())
                  try:
                      c=sqlite3.connect(f"file:{p}?mode=ro",uri=True,timeout=3);c.row_factory=sqlite3.Row;c.execute("pragma query_only=on")
                      tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
                      item["tables_macro"]=[x for x in sorted(tabs) if "macro" in x.lower()]
                      if "macro_series" in tabs:
                          item["macro_count"]=c.execute("select count(*) from macro_series").fetchone()[0]
                          item["series"]=[list(r) for r in c.execute("""select serie,count(*) n,min(fecha),max(fecha),max(actualizado_en)
                              from macro_series group by serie order by serie""")]
                      if "macro_fetch_log" in tabs:
                          item["fetch_log"]=[dict(r) for r in c.execute("select * from macro_fetch_log order by serie")]
                      c.close()
                  except Exception as e:item["error"]=type(e).__name__+":"+str(e)
              files.append(item)
          # Only non-secret environment names/values relevant to file selection and macro cadence.
          env={}
          try:
              raw=subprocess.check_output(["sudo","-n","docker","exec","porota_production_dashboard","env"],text=True,timeout=8)
              for line in raw.splitlines():
                  if line.startswith(("DB_PATH=","MACRO_HISTORY_ENABLED=","MACRO_REFRESH_HOURS=","SERVER_TIMEZONE=")):
                      k,v=line.split("=",1);env[k]=v
          except Exception as e: env["error"]=type(e).__name__
          print(json.dumps({"files":files,"dashboard_env":env},ensure_ascii=False,sort_keys=True,default=str))
          PY
          python3 - <<'PY' | tee evidence/macro_summary.txt
          import json
          x=json.load(open("evidence/macro_runtime.json"))
          print("DASHBOARD_ENV="+json.dumps(x["dashboard_env"],sort_keys=True))
          for f in x["files"]:
              print("FILE="+json.dumps(f,ensure_ascii=False,sort_keys=True))
          print("MACRO_CACHE_READONLY=GREEN")
          PY
      - name: Scheduler/process inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' > evidence/macro_scheduler.txt <<'REMOTE'
          set -u
          echo "PROCESSES"
          sudo -n docker exec porota_production_observer sh -lc "ps -ef | grep -E 'az_maintenance|j_main|macro_refresh' | grep -v grep || true"
          echo "SYSTEMD"
          sudo -n systemctl list-timers --all --no-pager | grep -Ei 'macro|maintenance' || true
          sudo -n systemctl list-units --all --no-pager | grep -Ei 'macro|maintenance' || true
          echo "FILES"
          find /opt/porota-trading/data -maxdepth 2 -type f -name '*trading_system*.db' -o -name '*macro*.db' 2>/dev/null | sort || true
          REMOTE
          cat evidence/macro_scheduler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-macro-bcra-readonly-20261002
          path: evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
