name: Porota RC6 temporary read-only continuity audit
on:
  push:
    branches:
      - audit/rc6-iol-decision-demand-20260921
    paths:
      - 'audit-rerun-trigger-20260921.txt'
permissions:
  contents: read
jobs:
  readonly-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read runtime through droplet
        env:
          DO_HOST: \${{ secrets.DO_HOST }}
          DO_USER: \${{ secrets.DO_USER }}
          DO_SSH_KEY: \${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: \${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo 'AUDIT=runtime_readonly'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, sqlite3, os, pathlib, datetime
          print("SAFETY=observer_container_readonly")
          p=pathlib.Path("/app/data/market/iol_shadow_latest.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("IOL_CACHE_FILE_MTIME="+datetime.datetime.fromtimestamp(p.stat().st_mtime,datetime.timezone.utc).isoformat())
              print("IOL_CACHE_REFRESHED_AT="+str(d.get("refreshed_at","unknown")))
              print("IOL_CACHE_PROGRESS="+json.dumps(d.get("progress",{}),sort_keys=True))
              print("IOL_CACHE_TELEMETRY="+json.dumps(d.get("telemetry",{}),sort_keys=True))
          else: print("IOL_CACHE=missing")
          try:
              import importlib.metadata as md, inspect
              print("PPI_SDK_VERSION="+md.version("ppi-client"))
              from ppi_client.ppi import PPI
              print("PPI_CONSTRUCTOR_SIGNATURE="+str(inspect.signature(PPI)))
              try:
                  from ppi_client.models.estimate_bonds import EstimateBonds
                  print("ESTIMATE_BONDS_SIGNATURE="+str(inspect.signature(EstimateBonds)))
              except Exception as e: print("ESTIMATE_BONDS_INSPECTION="+type(e).__name__)
          except Exception as e: print("PPI_SDK_INSPECTION="+type(e).__name__)
          PY
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os, sqlite3, pathlib, json, datetime, urllib.request, re, html
          db=pathlib.Path(os.getenv("HIST_DB_PATH","data/market_history.db")).expanduser()
          if not db.is_absolute(): db=pathlib.Path.cwd()/db
          if db.exists():
              c=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True); c.execute("PRAGMA query_only=ON")
              ok=c.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='history_canonical_v2'").fetchone()
              if ok:
                  n,s,lo,hi=c.execute("SELECT COUNT(*),COUNT(DISTINCT symbol),MIN(date),MAX(date) FROM history_canonical_v2").fetchone()
                  print("HISTORY_ROWS=%s SYMBOLS=%s MIN=%s MAX=%s"%(n,s,lo,hi))
              else: print("HISTORY_TABLE=missing")
          else: print("HISTORY_DB=missing")
          try:
              req=urllib.request.Request("http://127.0.0.1:8000/aprendizaje",headers={"Authorization":"Bearer "+os.environ["DASHBOARD_ACCESS_TOKEN"]})
              with urllib.request.urlopen(req,timeout=10) as r:
                  body=html.unescape(re.sub(r"<[^>]+>"," ",r.read().decode("utf-8","replace")))
                  body=" ".join(body.split())
                  print("LEARNING_HTTP="+str(r.status))
                  for label in ["Contrafácticos verificables","Confirmaría","Advertiría / rechazaría","No evaluables"]:
                      m=re.search(re.escape(label)+r"\s*[:\-]?\s*(\d+)",body,re.I)
                      print("LEARNING_"+re.sub(r"\W+","_",label.upper())+"="+(m.group(1) if m else "not_parsed"))
          except Exception as e: print("LEARNING_HTTP_ERROR="+type(e).__name__)
          PY
          HOST
