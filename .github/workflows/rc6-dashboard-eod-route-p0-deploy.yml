name: RC6 Dashboard Estrategias EOD-only exact-base deploy

on:
  push:
    branches:
      - "hotfix/rc6-dashboard-estrategias-eod-only-20260912"
    paths:
      - ".github/workflows/rc6-dashboard-eod-route-p0-deploy.yml"
      - ".github/dashboard-estrategias-eod-only-deploy-request.txt"
      - "fp_dashboard_eod_route_fix_rc6.py"
      - "tests/test_rc6_dashboard_eod_route_p0.py"

permissions:
  contents: read

concurrency:
  group: porota-rc6-dashboard-estrategias-eod-only
  cancel-in-progress: false

env:
  BASE_SHA: d0fef09c1b511e9e9e609ca771a6fb4c0292229c

jobs:
  validate:
    name: Validate EOD-only Estrategias route
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact-base scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "hotfix/rc6-dashboard-estrategias-eod-only-20260912"
          test "$(git merge-base "$BASE_SHA" "$GITHUB_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
          EXPECTED="$(printf '%s\n' \
            .github/workflows/rc6-dashboard-eod-route-p0-deploy.yml \
            fp_dashboard_eod_route_fix_rc6.py \
            tests/test_rc6_dashboard_eod_route_p0.py | sort)"
          if [ -f .github/dashboard-estrategias-eod-only-deploy-request.txt ]; then
            EXPECTED="$(printf '%s\n' \
              .github/workflows/rc6-dashboard-eod-route-p0-deploy.yml \
              .github/dashboard-estrategias-eod-only-deploy-request.txt \
              fp_dashboard_eod_route_fix_rc6.py \
              tests/test_rc6_dashboard_eod_route_p0.py | sort)"
          fi
          ACTUAL="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Identity compile and route safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('P0_EOD_ONLY_SOURCE_IDENTITY=GREEN')
          PY
          python -m py_compile fp_dashboard_eod_route_fix_rc6.py

      - name: Install narrow test dependencies
        run: python -m pip install -q pytest fastapi python-multipart python-dotenv requests

      - name: Focused route regression
        run: python -m pytest -q tests/test_rc6_dashboard_eod_route_p0.py tests/test_eod_overnight_dashboard_rc6.py

      - name: Static EOD-only route guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('fp_dashboard_eod_route_fix_rc6.py').read_text(encoding='utf-8')
          assert 'return _strategies_eod_page()' in p
          assert 'old_trading(section)' in p
          assert 'Acciones y CEDEAR' in p  # explanatory docstring only
          for token in ('requests.post(', 'requests.put(', 'requests.delete(', 'send_order(', 'place_order('):
              assert token not in p.lower()
          e=Path('fo_eod_overnight_dashboard_rc6.py').read_text(encoding='utf-8')
          assert 'CURRENT_EOD' in e and 'ACTIVE_PAPER' in e
          assert 'mode=ro' in e and 'PRAGMA query_only=ON' in e
          print('EOD_ONLY_STATIC_GUARD=GREEN')
          PY

  deploy:
    name: Deploy EOD-only Estrategias route and postflight
    needs: validate
    if: contains(github.event.head_commit.message, '[DEPLOY_ESTRATEGIAS_EOD_ONLY_RC6]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_eod_only"
          chmod 600 "$HOME/.ssh/porota_eod_only"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Exact-base forward-only deployment and user-route postflight
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_eod_only" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "BASE_SHA='$BASE_SHA' TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          SHORT_SHA="$(printf '%s' "$TARGET_SHA" | cut -c1-12)"
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-eod-only-$SHORT_SHA"
          WORKTREE="/tmp/porota-rc6-eod-only-$SHORT_SHA-$$"
          cleanup(){ set +e; [ ! -d "$WORKTREE" ] || git -C "$REPO" worktree remove --force "$WORKTREE" >/dev/null 2>&1; git -C "$REPO" worktree prune >/dev/null 2>&1; }
          trap cleanup EXIT

          echo 'AUTO_ROLLBACK=DISABLED'
          test "$(git -C "$REPO" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$REPO" status --porcelain=v1 --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')" = 0
          git -C "$REPO" status --porcelain=v1 --untracked-files=normal | grep '^?? ' | sort > /tmp/eod-only-untracked-before.txt || true

          PRE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "PRE_SAFETY=$PRE"
          test "$PRE" = 'ok|PRODUCTION_PAPER|0'

          git -C "$REPO" fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git -C "$REPO" rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          EXPECTED="$(printf '%s\n' \
            .github/workflows/rc6-dashboard-eod-route-p0-deploy.yml \
            .github/dashboard-estrategias-eod-only-deploy-request.txt \
            fp_dashboard_eod_route_fix_rc6.py \
            tests/test_rc6_dashboard_eod_route_p0.py | sort)"
          ACTUAL="$(git -C "$REPO" diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            p="${entry#?? }"
            if git -C "$REPO" cat-file -e "$TARGET_SHA:$p" 2>/dev/null; then echo "UNTRACKED_COLLISION=$p"; exit 1; fi
          done < /tmp/eod-only-untracked-before.txt

          git -C "$REPO" worktree add --detach "$WORKTREE" "$TARGET_SHA" >/dev/null
          grep -qx 'AUTHORIZED_BY_USER' "$WORKTREE/.github/dashboard-estrategias-eod-only-deploy-request.txt"
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label "porota.version=17.0.0-rc6" -t "$CANDIDATE_IMAGE" "$WORKTREE"
          sudo -n docker run --rm --pull never --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX -e DB_PATH=/tmp/eod-only.db \
            -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false --entrypoint bash "$CANDIDATE_IMAGE" -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short tests/test_rc6_dashboard_eod_route_p0.py tests/test_eod_overnight_dashboard_rc6.py'

          git -C "$REPO" checkout --detach "$TARGET_SHA"
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation

          HEALTH_OK=NO
          for _ in $(seq 1 45); do
            if H="$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null)"; then
              if python3 - "$H" <<'PY' >/dev/null 2>&1
          import json,sys
          x=json.loads(sys.argv[1]); assert x.get('status')=='ok' and x.get('version')=='17.0.0-rc6'
          PY
              then HEALTH_OK=YES; break; fi
            fi
            sleep 2
          done
          test "$HEALTH_OK" = YES

          POST="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close(); print('|'.join(map(str,(q,mode,orders))))
          PY
          )"
          echo "POST_SAFETY=$POST"
          test "$POST" = 'ok|PRODUCTION_PAPER|0'

          # Validate the exact final function used by /trading/{section}, after all
          # import-time wrappers are installed. This explicitly rejects the family
          # cards visible in the operator screenshot.
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import o_dashboard
          import bg_paper_dashboard as bg
          page=bg.trading_page('estrategias')
          assert page.count('EOD / Overnight') == 1
          assert 'CURRENT_EOD' in page
          assert 'Auto-promoción' in page and '>OFF<' in page
          assert 'ACTIVE_PAPER' in page
          assert 'Scalping permanece exclusivamente en su menú principal' in page
          forbidden=(
              'Acciones y CEDEAR','Renta fija','Actividad real de análisis por familia',
              'Contratos y readiness de opciones','Fondos locales y exterior','Licitaciones y canjes',
          )
          for text in forbidden:
              assert text not in page, text
          print('TRADING_ESTRATEGIAS_EOD_ONLY=GREEN')
          print('EOD_POLICY_ACTIVE=CURRENT_EOD')
          print('EOD_AUTO_PROMOTION=false')
          PY

          OBS="$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Image}}' porota_production_observer)"
          DASH="$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Image}}' porota_production_dashboard)"
          test "$(printf '%s' "$OBS" | cut -d'|' -f1-2)" = 'true|0'
          test "$(printf '%s' "$DASH" | cut -d'|' -f1-2)" = 'true|0'
          OBS_IMG="$(printf '%s' "$OBS" | cut -d'|' -f3)"; DASH_IMG="$(printf '%s' "$DASH" | cut -d'|' -f3)"
          test "$OBS_IMG" = "$DASH_IMG"
          test "$(sudo -n docker image inspect "$OBS_IMG" -f '{{ index .Config.Labels "porota.commit" }}')" = "$TARGET_SHA"
          sleep 10
          test "$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_observer)" = 0
          test "$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_dashboard)" = 0
          test "$(git -C "$REPO" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$REPO" status --porcelain=v1 --untracked-files=no | sed '/^$/d' | wc -l | tr -d ' ')" = 0
          git -C "$REPO" status --porcelain=v1 --untracked-files=normal | grep '^?? ' | sort > /tmp/eod-only-untracked-after.txt || true
          diff -u /tmp/eod-only-untracked-before.txt /tmp/eod-only-untracked-after.txt
          echo "HOST_SHA_FINAL=$TARGET_SHA"
          echo 'REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'RC6_DASHBOARD_ESTRATEGIAS_EOD_ONLY_POSTFLIGHT=GREEN'
          REMOTE
