name: RC6 Wave12 Quote Pagination Diagnostic V9 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave12-pagination-diagnostic-v9-20260909.yml']
permissions:
  contents: read
jobs:
  pagination-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w12paginationv9"
          chmod 600 "$HOME/.ssh/w12paginationv9"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect quote pagination read-only in proven browser venv
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/w12paginationv9" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE=$(git rev-parse HEAD)
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          if ! pgrep -af 'chrome.*porota-browser-lab/chrome-profile|google-chrome.*porota-browser-lab/chrome-profile' >/dev/null 2>&1; then
            rm -f "$PROFILE/SingletonLock" "$PROFILE/SingletonSocket" "$PROFILE/SingletonCookie" 2>/dev/null || true
          fi
          sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin /opt/porota-contract-evidence-venv/bin/python - "$PROFILE" <<'PY'
          import json,re,sys
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          profile=sys.argv[1]; BASE='https://trading.portfoliopersonal.com'; SAFE={'GET','HEAD','OPTIONS'}
          routes=['/Cotizaciones/Acciones','/Cotizaciones/Cedears','/Cotizaciones/Ons','/Cotizaciones/Opciones']
          def safe_url(u):
              p=urlsplit(u)
              return p.scheme=='https' and p.netloc=='trading.portfoliopersonal.com' and p.path.startswith('/Cotizaciones') and '/Operar' not in p.path
          def rows(page): return page.locator('table tbody tr').count()
          def first(page):
              try: return re.sub(r'\s+',' ',page.locator('table tbody tr').first.locator('td').first.inner_text()).strip()[:90]
              except Exception: return ''
          with sync_playwright() as pw:
              ctx=pw.chromium.launch_persistent_context(user_data_dir=profile,executable_path='/usr/bin/google-chrome-stable',headless=True,locale='es-AR',timezone_id='America/Argentina/Buenos_Aires',viewport={'width':1440,'height':1000},args=['--no-sandbox','--disable-dev-shm-usage'])
              blocked=[]
              def guard(route,req):
                  if req.method.upper() not in SAFE:
                      blocked.append({'method':req.method.upper(),'path':urlsplit(req.url).path}); return route.abort()
                  return route.continue_()
              ctx.route('**/*',guard)
              page=ctx.pages[0] if ctx.pages else ctx.new_page()
              for route in routes:
                  page.goto(BASE+route,wait_until='domcontentloaded',timeout=45000); page.wait_for_timeout(1800)
                  assert safe_url(page.url), 'UNSAFE_OR_AUTH:'+route
                  before=rows(page); first_before=first(page)
                  controls=page.evaluate("""() => [...document.querySelectorAll('button,a,select,[role=button],[aria-label]')].filter(e=>/sig|next|ant|prev|p[aá]g|page|pagination|rows|filas|50|100/i.test(((e.innerText||e.textContent||'')+' '+(e.getAttribute('aria-label')||'')+' '+String(e.className||'')))).slice(0,100).map(e=>({tag:e.tagName,text:(e.innerText||e.textContent||'').trim().slice(0,100),aria:(e.getAttribute('aria-label')||'').slice(0,100),title:(e.getAttribute('title')||'').slice(0,100),cls:String(e.className||'').slice(0,160),disabled:!!e.disabled,href:(e.getAttribute('href')||'').slice(0,160),value:(e.value||'').slice(0,60)}))""")
                  print('PAGINATION_CONTROLS='+json.dumps({'route':route,'rows_before':before,'first_before':first_before,'controls':controls},ensure_ascii=False,separators=(',',':')))
                  candidates=['button[aria-label*="Next" i]','button[aria-label*="Siguiente" i]','a[aria-label*="Next" i]','a[aria-label*="Siguiente" i]','.pagination .next:not(.disabled) a','.pagination-next:not(.disabled)','li.next:not(.disabled) a']
                  result={'route':route,'result':'NO_SAFE_NEXT_CONTROL_MATCH'}
                  for sel in candidates:
                      loc=page.locator(sel)
                      if loc.count()<1: continue
                      el=loc.first
                      try:
                          if not el.is_visible() or el.is_disabled(): continue
                      except Exception: pass
                      try:
                          el.click(timeout=3000); page.wait_for_timeout(1500)
                          assert safe_url(page.url), 'UNSAFE_AFTER_PAGINATION'
                          result={'route':route,'selector':sel,'rows_after':rows(page),'first_after':first(page),'changed':first(page)!=first_before,'safe_path':urlsplit(page.url).path}; break
                      except Exception as e:
                          result={'route':route,'selector':sel,'error':type(e).__name__}
                  print('PAGINATION_EXERCISE='+json.dumps(result,ensure_ascii=False,separators=(',',':')))
              print('BLOCKED_NONREAD_COUNT='+str(len(blocked)))
              print('W12_PAGINATION_DIAGNOSTIC_V9=GREEN'); ctx.close()
          PY
          test "$(git rev-parse HEAD)" = "$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RUNTIME_CHANGED=NO'
          REMOTE