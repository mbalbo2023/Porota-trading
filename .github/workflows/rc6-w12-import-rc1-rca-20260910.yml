name: RC6 W12 Import RC1 RCA 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-import-rc1-rca-20260910.yml

permissions:
  contents: read

jobs:
  isolate-import-rc1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assert immutable RC6 PAPER safety
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only isolate post-capture importer rc1
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          RUNTIME=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          redact() { sed -E 's/([Pp]assword|[Tt]oken|[Ss]ecret|[Cc]ookie|[Aa]uthorization|[Aa]pi[_-]?[Kk]ey)([=: ]+)[^ ]+/\1\2<REDACTED>/g'; }

          echo '=== IMPORT_RCA_RUNTIME_MARKERS ==='
          sudo -n grep -n -E -C 8 'IMPORT|import|runtime_state|collector|evidence|sqlite|python' "$RUNTIME" 2>/dev/null | redact | head -260 || true

          echo '=== UNIT_SAFE ==='
          sudo -n systemctl cat porota-contract-evidence-rc6.service --no-pager 2>/dev/null | redact | head -180 || true

          echo '=== LAST_IMPORT_FAILURE_CONTEXT ==='
          sudo -n journalctl -u porota-contract-evidence-rc6.service --since '2026-09-10 18:00:00 UTC' --no-pager -o short-iso 2>/dev/null \
            | tail -420 | redact || true

          echo '=== LIKELY_IMPORTER_FILES ==='
          sudo -n find "$ROOT" -maxdepth 3 -type f \( -iname '*import*contract*' -o -iname '*contract*import*' -o -iname '*evidence*import*' \) \
            -printf '%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort | head -120 || true

          echo '=== DATABASE_CANDIDATES ==='
          sudo -n find "$ROOT/data" -maxdepth 4 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) \
            -printf '%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort | head -160 || true

          echo '=== RECENT_CONTRACT_ARTIFACTS ==='
          sudo -n find "$ROOT/data/contract_evidence" -maxdepth 3 -type f \
            -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r | head -80 || true

          echo '=== SERVICE_EXIT_STATE ==='
          sudo -n systemctl show porota-contract-evidence-rc6.service -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager

          echo '=== PAPER_SAFETY_DB ==='
          sudo -n python3 - "$ROOT/data/paper_v17/observer_v17.db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          c.execute('pragma query_only=on')
          row=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print('MODE='+str(row[0] if row else None))
          print('REAL_ORDERS_SENT='+str(row[1] if row else None))
          PY
          echo 'MUTATIONS=NONE'
          echo 'COLLECTOR_EXECUTED=NO'
          echo 'IMPORTER_EXECUTED=NO'
          echo 'ORDER_ROUTES=NOT_CALLED'
          HOST
