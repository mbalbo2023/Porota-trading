name: RC6 Post-Wave8 Disk Capacity Audit 2026-09-09

on:
  push:
    branches: [audit/rc6-post-wave8-disk-capacity-20260909]
    paths:
      - '.github/workflows/rc6-post-wave8-disk-capacity-audit-20260909.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_disk_audit"
          chmod 600 "$HOME/.ssh/porota_disk_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only disk capacity and reclaim inventory
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_disk_audit" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/porota-trading
          topn(){ sed -n "1,${1}p"; }
          echo '=== POROTA RC6 POST-WAVE8 DISK CAPACITY AUDIT V2 ==='
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo '--- FILESYSTEM ---'
          df -PB1 /opt/porota-trading
          df -h /opt/porota-trading
          echo '--- TOP LEVEL /opt ---'
          sudo -n du -x -B1 -d1 /opt 2>/dev/null | sort -nr | topn 30
          echo '--- TOP LEVEL /opt/porota-trading ---'
          sudo -n du -x -B1 -d1 /opt/porota-trading 2>/dev/null | sort -nr | topn 50
          echo '--- DATA LEVEL 2 ---'
          sudo -n du -x -B1 -d2 /opt/porota-trading/data 2>/dev/null | sort -nr | topn 120
          echo '--- LARGEST FILES POROTA ---'
          sudo -n find /opt/porota-trading -xdev -type f -printf '%s|%p\n' 2>/dev/null | sort -t'|' -k1,1nr | topn 120
          echo '--- DOCKER SYSTEM DF ---'
          sudo -n docker system df -v || true
          echo '--- DOCKER IMAGES ---'
          sudo -n docker images --no-trunc --format '{{.Repository}}|{{.Tag}}|{{.ID}}|{{.Size}}|{{.CreatedSince}}' | topn 120 || true
          echo '--- DOCKER CONTAINERS ---'
          sudo -n docker ps -a --size --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Size}}' | topn 120 || true
          echo '--- DOCKER VOLUMES ---'
          sudo -n docker volume ls -q | while read -r v; do [ -n "$v" ] || continue; mp=$(sudo -n docker volume inspect -f '{{.Mountpoint}}' "$v" 2>/dev/null || true); sz=0; [ -n "$mp" ] && sz=$(sudo -n du -sx -B1 "$mp" 2>/dev/null | awk '{print $1}' || echo 0); echo "$sz|$v|$mp"; done | sort -t'|' -k1,1nr | topn 120 || true
          echo '--- JOURNAL ---'
          sudo -n journalctl --disk-usage || true
          echo '--- /var TOP ---'
          sudo -n du -x -B1 -d1 /var 2>/dev/null | sort -nr | topn 50
          echo '--- /var/lib TOP ---'
          sudo -n du -x -B1 -d1 /var/lib 2>/dev/null | sort -nr | topn 80
          echo '--- /var/log TOP ---'
          sudo -n du -x -B1 -d2 /var/log 2>/dev/null | sort -nr | topn 100
          echo '--- CACHE/TMP/CORE ---'
          sudo -n du -sx -B1 /var/cache/apt /tmp /var/tmp /var/lib/systemd/coredump /var/crash 2>/dev/null || true
          echo '--- SAFETY RUNTIME ---'
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3, os
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]
          print(f'RUNTIME_DB={q}|{mode}|{real}|LEGACY_RAW_ROWS={raw}')
          print('RAW_STORAGE_MODE='+str(os.getenv('PPI_HISTORY_RAW_STORAGE_MODE')))
          c.close()
          PY
          echo 'MUTATIONS=NONE'
          echo 'DELETE=NOT_RUN'
          echo 'VACUUM=NOT_RUN'
          echo 'DOCKER_PRUNE=NOT_RUN'
          echo 'AUDIT_COMPLETE=YES'
          REMOTE
