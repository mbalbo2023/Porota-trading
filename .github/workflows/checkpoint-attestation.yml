name: Checkpoint attestation
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  checkpoint-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Require continuity and safety references in PR body
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          require_line() {
            local pattern="$1"
            local label="$2"
            if ! grep -Eq "$pattern" <<< "$BODY"; then
              echo "::error::PR body is missing: $label"
              exit 1
            fi
          }
          require_line '^Checkpoint ID: [^[:space:]]+' 'Checkpoint ID'
          require_line '^Continuity checkpoint path: .+\.md$' 'continuity checkpoint path'
          require_line '^Checkpoint commit SHA: [0-9a-fA-F]{40}$' 'checkpoint commit SHA'
          require_line '^RC6 baseline SHA: [0-9a-fA-F]{40}$' 'RC6 baseline SHA'
          require_line '^Safety invariants: .*PRODUCTION_PAPER.*REAL_ORDERS_SENT=0.*CASH_SWEEP_ORDER_ROUTING_ALLOWED=False.*fail-closed' 'safety invariants'
          echo "Attestation fields found; checkpoint completeness and runtime state still require human verification."
