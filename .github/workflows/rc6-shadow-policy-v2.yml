name: RC6 SHADOW runtime semantics v2

on:
  push:
    branches:
      - candidate/v17.0.0-rc6-weekend-20260905
    paths:
      - 'scripts/rc6_apply_shadow_policy_v2.py'
      - 'scripts/rc6_shadow_selftest.py'
      - '.github/workflows/rc6-shadow-policy-v2.yml'

permissions:
  contents: write

concurrency:
  group: rc6-shadow-v2
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - name: Verify RC5 ancestry
        run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - name: Apply SHADOW runtime semantics
        run: PYTHONPATH=scripts:. python scripts/rc6_apply_shadow_policy_v2.py
      - name: Compile
        run: |
          python -m py_compile es_shadow_binding_contract_rc6.py be_paper_engine.py \
            bf_production_paper_observer.py bg_paper_dashboard.py \
            ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py \
            ck_policy_gate_hf6.py
      - name: Dependency-light proof
        run: python scripts/rc6_shadow_selftest.py
      - name: Policy gate SHADOW proof
        shell: bash
        run: |
          python - <<'PY'
          import os
          import ck_policy_gate_hf6 as g
          os.environ['PAPER_EXPECTANCY_POLICY']='SHADOW'
          os.environ['PAPER_MARKET_REGIME_POLICY']='SHADOW'
          os.environ['PAPER_SECTOR_CONCENTRATION_POLICY']='SHADOW'
          r=g.evaluate(
            expectancy_samples=[{'sample_state':'OBSERVATIONAL','empirical_expectancy':'-1','currency':'ARS'}],
            breadth={'state':'BEARISH_BREADTH'},
            sectors={'groups':[{'sector':'BANKS','open_positions':9}]},
            candidate_sector='BANKS', sector_limit=1)
          assert r['would_block'] is True
          assert r['execute_block'] is False
          assert all(not row['execute_block'] for row in r['gates'].values())
          print('RC6_POLICY_GATES_SHADOW_COUNTERFACTUAL=GREEN')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          FILES='porota_mode_manager.py bg_paper_dashboard.py ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py bf_production_paper_observer.py be_paper_engine.py ck_policy_gate_hf6.py POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md'
          if git diff --quiet -- $FILES; then
            echo RC6_SHADOW_V2_COMMIT=NOT_NEEDED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'RC6: enforce SHADOW learning semantics [skip ci]'
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
