name: RC6 exact failed-attempt temp cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/ops-runtime-evidence-fix-forward-20260928.yml'

permissions:
  contents: read

jobs:
  exact-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Remove only failed-attempt temp directory
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_cleanup"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_cleanup" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/porota_rc6_cleanup" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TARGET=/tmp/porota-runtime-evidence-fix-36374546512
          test "$TARGET" = /tmp/porota-runtime-evidence-fix-36374546512
          rm -rf -- "$TARGET"
          test ! -e "$TARGET"
          echo "EXACT_FAILED_ATTEMPT_CLEANUP=GREEN|target=$TARGET"
          REMOTE

      - name: Runner cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/porota_rc6_cleanup"
