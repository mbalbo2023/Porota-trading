name: RC6 unified integration builder 20261002
on:
  push:
    branches: [audit/rc6-unified-review-20261002]
    paths:
      - .github/workflows/rc6-unified-source-review-20261002.yml
      - scripts/rc6_unified_integration_builder_20261002.py
      - scripts/rc6_unified_integration_fixes_20261002.py
      - scripts/rc6_unified_regression_fixture_20261002.py
permissions:
  contents: write
concurrency:
  group: rc6-unified-source-review-20261002
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated integration tools and locked test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/rc6-integration-tools /tmp/rc6-integration-evidence
          cp scripts/rc6_unified_integration_builder_20261002.py /tmp/rc6-integration-tools/
          cp scripts/rc6_unified_integration_fixes_20261002.py /tmp/rc6-integration-tools/
          cp scripts/rc6_unified_regression_fixture_20261002.py /tmp/rc6-integration-tools/
          python -m pip install --disable-pip-version-check --requirement requirements.lock.txt
      - name: Reconcile exact source heads and validate cross-workstream regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python /tmp/rc6-integration-tools/rc6_unified_integration_builder_20261002.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-unified-integration-evidence-${{ github.run_id }}
          path: /tmp/rc6-integration-evidence/
          retention-days: 14
          if-no-files-found: warn
