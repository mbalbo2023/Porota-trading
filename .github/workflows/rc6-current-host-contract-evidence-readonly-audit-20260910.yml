name: RC6 Current Host Contract Evidence Readonly Audit 2026-09-10

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed candidate/controller SHA; never a deployment
        required: true
        type: string
      source_tree:
        description: Exact Git tree of source_sha
        required: true
        type: string
      owner_session:
        description: Audit ownership/session identifier, bound into evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rc6-host-capacity-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1338680554' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RC6_SOURCE_SHA: ${{ inputs.source_sha }}
      RC6_SOURCE_TREE: ${{ inputs.source_tree }}
      RC6_OWNER_SESSION: ${{ inputs.owner_session }}
      RC6_CONTROLLER_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the exact read-only controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact Source and repository PAPER invariants
        id: identity
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$RC6_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RC6_SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RC6_OWNER_SESSION" =~ ^[A-Za-z0-9_.:-]{1,96}$ ]]
          test "$RC6_CONTROLLER_SHA" = "$RC6_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$RC6_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RC6_SOURCE_TREE"
          python3 -I -B - <<'PY'
          import ast
          from pathlib import Path
          values={}
          for node in ast.parse(Path('_version.py').read_text()).body:
              if isinstance(node,ast.Assign) and isinstance(node.value,ast.Constant):
                  for target in node.targets:
                      if isinstance(target,ast.Name): values[target.id]=node.value.value
          assert values['MODE']=='PRODUCTION_PAPER'
          assert values['REAL_ORDER_CAPABILITY']=='BLOCKED'
          PY
          rc6_collector_hash=$(sha256sum scripts/rc6_host_capacity_readonly.py | cut -d ' ' -f 1)
          test "$rc6_collector_hash" = "$(git show HEAD:scripts/rc6_host_capacity_readonly.py | sha256sum | cut -d ' ' -f 1)"
          printf 'collector_sha256=%s\n' "$rc6_collector_hash" >> "$GITHUB_OUTPUT"
          install -m 700 -d "$RUNNER_TEMP/rc6-host-audit-private" "$RUNNER_TEMP/rc6-host-audit-public"
      - name: Prepare strict host authentication on the ephemeral runner
        id: ssh_auth
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d "$RUNNER_TEMP/rc6-host-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rc6-host-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/rc6-host-ssh/known_hosts"
          test -s "$RUNNER_TEMP/rc6-host-ssh/key"
          test -s "$RUNNER_TEMP/rc6-host-ssh/known_hosts"
      - name: Observe the configured host without runtime execution or mutations
        id: capture
        if: always() && steps.identity.outcome == 'success'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          RC6_COLLECTOR_SHA256: ${{ steps.identity.outputs.collector_sha256 }}
          RC6_SSH_PREPARED: ${{ steps.ssh_auth.outcome }}
        run: |
          set -Eeuo pipefail
          umask 077
          rc6_capture_error() {
            python3 -I -B scripts/rc6_host_capacity_readonly.py \
              --source-sha "$RC6_SOURCE_SHA" --source-tree "$RC6_SOURCE_TREE" \
              --collector-sha256 "$RC6_COLLECTOR_SHA256" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --owner-session "$RC6_OWNER_SESSION" \
              --transport-stderr "$RUNNER_TEMP/rc6-host-audit-private/transport.stderr" \
              --transport-status "$1" --output "$RUNNER_TEMP/rc6-host-audit-public/error.json"
          }
          if [[ "$RC6_SSH_PREPARED" != success || ! "$DO_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ || ! "$DO_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]{0,252}$ ]]; then
            printf 'DO_BINDING_MISSING\n' > "$RUNNER_TEMP/rc6-host-audit-private/transport.stderr"
            rc6_capture_error 125
            exit 1
          fi
          # Stream exact code and validated identities over pinned SSH.
          # No remote files, Docker exec, SQL scans, or host cleanup.
          rc6_remote_command="sudo -n timeout 90 python3 -I -B - --source-sha $RC6_SOURCE_SHA --source-tree $RC6_SOURCE_TREE --collector-sha256 $RC6_COLLECTOR_SHA256 --run-id $GITHUB_RUN_ID --run-attempt $GITHUB_RUN_ATTEMPT --owner-session $RC6_OWNER_SESSION"
          set +e
          timeout 100 ssh -i "$RUNNER_TEMP/rc6-host-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6-host-ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "$rc6_remote_command" \
            < scripts/rc6_host_capacity_readonly.py \
            > "$RUNNER_TEMP/rc6-host-audit-private/receipt.json" \
            2> "$RUNNER_TEMP/rc6-host-audit-private/transport.stderr"
          rc6_transport_status=$?
          set -e
          if [ "$rc6_transport_status" -ne 0 ]; then
            rc6_capture_error "$rc6_transport_status"
            exit 1
          fi
          if ! python3 -I -B scripts/rc6_host_capacity_readonly.py \
            --source-sha "$RC6_SOURCE_SHA" --source-tree "$RC6_SOURCE_TREE" \
            --collector-sha256 "$RC6_COLLECTOR_SHA256" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --owner-session "$RC6_OWNER_SESSION" \
            --sanitize-evidence "$RUNNER_TEMP/rc6-host-audit-private/receipt.json" \
            --output "$RUNNER_TEMP/rc6-host-audit-public/evidence.json"; then
            printf '{"schema":"porota.rc6.host-audit-transport-error.v1","error_code":"READONLY_RECEIPT_PUBLIC_VALIDATION_FAILED","host_release_admission":"NO_VERIFICADO","host_margin_green":false}\n' > "$RUNNER_TEMP/rc6-host-audit-public/error.json"
            exit 1
          fi
          echo 'RC6_HOST_AUDIT=READ_ONLY_EVIDENCE_CAPTURED|release_admission=NO_VERIFICADO'
      - name: Preserve only sanitized read-only observations and digest manifest
        if: always() && steps.identity.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-host-capacity-readonly-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-host-audit-public/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Retire runner-owned SSH credentials
        if: always()
        run: |
          set -Eeuo pipefail
          rm -f "$RUNNER_TEMP/rc6-host-ssh/key" "$RUNNER_TEMP/rc6-host-ssh/known_hosts"
