name: RC6 Current Host Contract Evidence Readonly Audit 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-current-host-contract-evidence-readonly-audit-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert repository PAPER safety identity
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only host audit
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -u
          ROOT=/opt/porota-trading
          CE="$ROOT/data/contract_evidence/rc6_trusted"
          PROFILE=/home/porotaadmin/.local/share/porota-contract-browser-profile
          echo '=== HOST_IDENTITY ==='
          cd "$ROOT" && printf 'HOST_HEAD=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          echo '=== CONTAINERS ==='
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer 2>/dev/null || true
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard 2>/dev/null || true
          echo '=== PAPER_DB_CONTRACT_FRESHNESS ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          print('DB='+str(c.execute('pragma quick_check').fetchone()[0]))
          mode,orders=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print('MODE='+str(mode)); print('REAL_ORDERS='+str(orders))
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' and lower(name) like '%contract%' order by name")]
          wanted={'run_at','observed_at','generated_at','imported_at','started_at','finished_at','timestamp','created_at','updated_at','captured_at','collected_at'}
          for table in tables:
              count=c.execute('select count(*) from "'+table+'"').fetchone()[0]
              cols=[r[1] for r in c.execute('pragma table_info("'+table+'")')]
              print('COUNT_'+table+'='+str(count))
              for col in cols:
                  if col.lower() in wanted:
                      try:
                          value=c.execute('select max("'+col+'") from "'+table+'"').fetchone()[0]
                          print('MAX_'+table+'.'+col+'='+str(value))
                      except Exception:
                          pass
          c.close()
          PY
          echo '=== CONTRACT_UNITS ==='
          sudo -n systemctl is-enabled porota-contract-evidence-rc6.timer 2>/dev/null || true
          sudo -n systemctl is-active porota-contract-evidence-rc6.timer 2>/dev/null || true
          sudo -n systemctl show porota-contract-evidence-rc6.timer -p LastTriggerUSec -p NextElapseUSecRealtime --no-pager 2>/dev/null || true
          sudo -n systemctl show porota-contract-evidence-rc6.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager 2>/dev/null || true
          echo '=== PROFILE_METADATA_ONLY ==='
          if [ -d "$PROFILE" ]; then
            stat -c 'PROFILE_OWNER_UID=%u|GID=%g|MTIME=%y' "$PROFILE" || true
            for p in "$PROFILE/Default/Cookies" "$PROFILE/Default/Web Data"; do
              [ -e "$p" ] && stat -c 'PROFILE_DB=%n|SIZE=%s|MTIME=%y|UID=%u|GID=%g' "$p" || true
            done
          else
            echo PROFILE=MISSING
          fi
          echo '=== SANITIZED_RC6_CAPTURE_METADATA ==='
          python3 - "$CE" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          def emit(path,label):
              if not path or not path.is_file():
                  print(label+'=MISSING'); return
              st=path.stat()
              print(f'{label}_FILE={path.name}|SIZE={st.st_size}|MTIME_NS={st.st_mtime_ns}')
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  print(label+'_JSON=ERROR_'+type(exc).__name__); return
              for key in ('schema','state','status','auth_status','generated_at','updated_at','real_orders_sent'):
                  value=data.get(key) if isinstance(data,dict) else None
                  if isinstance(value,(str,int,float,bool)) or value is None:
                      print(f'{label}_{key.upper()}={str(value)[:160]}')
              if isinstance(data,dict):
                  for key in ('routes','endpoints','jobs','blocked_nonread'):
                      value=data.get(key)
                      if isinstance(value,(list,dict)):
                          print(f'{label}_{key.upper()}_COUNT={len(value)}')
          state=root/'runtime_state.json'
          captures=sorted((p for p in root.glob('*.json') if p.name!='runtime_state.json'), key=lambda p:p.stat().st_mtime_ns, reverse=True)
          deep=sorted(root.glob('w12_full_contract_deep_v3_*.json'), key=lambda p:p.stat().st_mtime_ns, reverse=True)
          emit(state,'RUNTIME_STATE')
          emit(captures[0] if captures else None,'LATEST_CAPTURE')
          emit(deep[0] if deep else None,'LATEST_W12_DEEP')
          PY
          echo 'MUTATIONS=NONE'
          echo 'SECRETS_READ=NO'
          echo 'COLLECTOR_EXECUTED=NO'
          echo 'ORDER_ROUTES=NOT_CALLED'
          HOST
