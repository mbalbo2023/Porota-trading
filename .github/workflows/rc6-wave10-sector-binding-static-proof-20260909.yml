name: RC6 Wave10 Sector Binding Static Proof 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/rc6-wave10-sector-binding-static-proof-20260909.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate sector and concentration policy consumers
        run: |
          set -euo pipefail
          echo '=== SECTOR_CONCENTRATION_REFERENCES ==='
          grep -RniE 'sector|sectorial|concentrat|concentraci[oó]n' --include='*.py' --include='*.sh' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=venv | head -300 || true
          echo '=== RISK_BINDING_REFERENCES ==='
          grep -RniE 'BINDING|OBSERVATION_ONLY|risk_gate|portfolio_capacity|sector' --include='*.py' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=venv | head -300 || true
          echo 'RUNTIME_MUTATION=NO'
          echo 'ORDER_ROUTES=NOT_CALLED'
