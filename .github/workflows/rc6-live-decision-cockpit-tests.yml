name: RC6 live Decision Cockpit tests

on:
  push:
    branches:
      - "feat/rc6-live-decision-cockpit-20260919"
    paths:
      - "rc6_live_decision_cockpit.py"
      - "rc6_private_site_8766.py"
      - "systemd/porota-live-decision-cockpit-rc6.service"
      - "systemd/porota-live-decision-cockpit-rc6.timer"
      - "tests/test_rc6_live_decision_cockpit.py"
      - ".github/workflows/rc6-live-decision-cockpit-tests.yml"
  pull_request:
    paths:
      - "rc6_live_decision_cockpit.py"
      - "rc6_private_site_8766.py"
      - "systemd/porota-live-decision-cockpit-rc6.service"
      - "systemd/porota-live-decision-cockpit-rc6.timer"
      - "tests/test_rc6_live_decision_cockpit.py"
      - ".github/workflows/rc6-live-decision-cockpit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9"
      - run: python -m py_compile rc6_live_decision_cockpit.py rc6_private_site_8766.py
      - run: python -m pytest -q tests/test_rc6_live_decision_cockpit.py
      - name: Safety assertions
        run: |
          set -Eeuo pipefail
          grep -Fq 'HOST = "127.0.0.1"' rc6_private_site_8766.py
          grep -Fq '"decision_authority": "OBSERVE_ONLY"' rc6_live_decision_cockpit.py
          grep -Fq '"real_orders_authorized": False' rc6_live_decision_cockpit.py
          ! grep -Eqi 'place_order|send_order|submit_order|cancel_order|budget' rc6_live_decision_cockpit.py
