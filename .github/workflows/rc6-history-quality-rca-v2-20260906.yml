name: RC6 history quality RCA v2 2026-09-06

on:
  push:
    branches:
      - audit/rc6-history-quality-rca-v2-20260906

permissions:
  contents: read

jobs:
  rca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rca"
          chmod 600 "$HOME/.ssh/porota_rca"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Offline DB RCA
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_rca" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/rc6-history-rca-v2.txt
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          LIVE_BRANCH='hotfix/rc6-cedear-us-labor-day-20260906'
          LIVE_SHA='db26c76723bb988c956589c572b87cbcb4191731'
          LIVE_IMAGE='porota-trading-bot:17.0.0-rc6'
          test "$(git -C "$REPO" branch --show-current)" = "$LIVE_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$LIVE_SHA"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = "true|$LIVE_IMAGE|0|true"
          test "$(sudo -n docker image inspect "$LIVE_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$LIVE_SHA"
          echo '=== RC6 HISTORY QUALITY RCA V2 READ ONLY ==='
          echo "UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, sqlite3
          from bf_production_paper_observer import _historical_targets
          from cg_paper_workspace import runtime_store

          DBS={'observer':'/app/data/paper_v17/observer_v17.db','history':'/app/data/market_history.db'}
          def open_ro(path):
              c=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=30)
              c.row_factory=sqlite3.Row
              c.execute('PRAGMA query_only=ON')
              return c
          def tables(c): return {r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          def columns(c,t): return [r[1] for r in c.execute(f'PRAGMA table_info("{t}")')]
          def rows(c,sql,args=()): return [dict(r) for r in c.execute(sql,args).fetchall()]
          def select_existing(c,t,wanted):
              have=set(columns(c,t)); use=[x for x in wanted if x in have]
              return use

          out={'schema':'POROTA_RC6_HISTORY_QUALITY_RCA_V2','network_calls':0,'mutations':0}
          c=open_ro(DBS['observer'])
          ots=tables(c)
          out['observer_quick_check']=c.execute('PRAGMA quick_check').fetchone()[0]
          state_cols=select_existing(c,'observer_state',['mode','process_state','session_state','ppi_auth','real_orders_sent','heartbeat_at','detail'])
          st=c.execute('SELECT '+','.join(state_cols)+' FROM observer_state WHERE id=1').fetchone()
          out['observer_state']=dict(st) if st else None
          assert out['observer_state'] and int(out['observer_state'].get('real_orders_sent') or 0)==0

          out['candidate_by_family']=rows(c,"""SELECT instrument_type,COUNT(*) identities,
            SUM(CASE WHEN can_simulate=1 THEN 1 ELSE 0 END) can_simulate
            FROM candidate_universe WHERE status='AVAILABLE'
            GROUP BY instrument_type ORDER BY instrument_type""")
          out['coverage_by_family']=rows(c,"""SELECT u.instrument_type,COUNT(*) eligible,
            SUM(CASE WHEN h.row_count>0 THEN 1 ELSE 0 END) covered,
            SUM(CASE WHEN h.row_count IS NULL OR h.row_count<=0 THEN 1 ELSE 0 END) uncovered
            FROM candidate_universe u
            LEFT JOIN production_history h ON h.symbol=u.ticker AND h.instrument_type=u.instrument_type AND h.settlement=u.settlement
            WHERE u.status='AVAILABLE' AND (u.can_simulate=1 OR u.instrument_type='INDICES')
            GROUP BY u.instrument_type ORDER BY u.instrument_type""")
          out['attempt_state_total']=rows(c,"SELECT state,COUNT(*) identities,SUM(valid_rows) valid_rows FROM production_history_attempts GROUP BY state ORDER BY state")
          out['attempt_state_by_family']=rows(c,"SELECT instrument_type,state,COUNT(*) identities,SUM(valid_rows) valid_rows FROM production_history_attempts GROUP BY instrument_type,state ORDER BY instrument_type,state")
          out['nonvalid_recent']=rows(c,"""SELECT symbol,instrument_type,settlement,state,valid_rows,detail,attempted_at
            FROM production_history_attempts WHERE state!='VALID_PAYLOAD'
            ORDER BY julianday(attempted_at) DESC LIMIT 120""")
          out['uncovered_first120']=rows(c,"""SELECT u.ticker symbol,u.instrument_type,u.settlement,u.market,
            a.state,a.valid_rows,a.detail,a.attempted_at
            FROM candidate_universe u
            LEFT JOIN production_history h ON h.symbol=u.ticker AND h.instrument_type=u.instrument_type AND h.settlement=u.settlement
            LEFT JOIN production_history_attempts a ON a.symbol=u.ticker AND a.instrument_type=u.instrument_type AND a.settlement=u.settlement
            WHERE u.status='AVAILABLE' AND (u.can_simulate=1 OR u.instrument_type='INDICES')
              AND (h.row_count IS NULL OR h.row_count<=0)
            ORDER BY a.attempted_at IS NOT NULL,a.attempted_at,u.instrument_type,u.ticker LIMIT 120""")

          order=[]
          for rank,(symbol,kind,settle) in enumerate(_historical_targets(runtime_store())[:100],1):
              h=c.execute('SELECT row_count,downloaded_at FROM production_history WHERE symbol=? AND instrument_type=? AND settlement=?',(symbol,kind,settle)).fetchone()
              a=c.execute('SELECT state,valid_rows,detail,attempted_at FROM production_history_attempts WHERE symbol=? AND instrument_type=? AND settlement=?',(symbol,kind,settle)).fetchone()
              order.append({'rank':rank,'symbol':symbol,'family':kind,'settlement':settle,'covered':bool(h and int(h['row_count'] or 0)>0),'rows':int(h['row_count'] or 0) if h else 0,'last_attempt':dict(a) if a else None})
          out['target_order_first100']=order
          out['target_order_summary']={'first40_uncovered':sum(not x['covered'] for x in order[:40]),'first40_covered':sum(x['covered'] for x in order[:40]),'first100_uncovered':sum(not x['covered'] for x in order),'first100_covered':sum(x['covered'] for x in order)}
          c.close()

          # Search both DBs for canonical/version/rejection/raw tables, schema-first.
          inventory={}
          for dbname,path in DBS.items():
              db=open_ro(path); ts=tables(db); di={}
              for t in sorted(ts):
                  low=t.lower()
                  if not any(k in low for k in ('history','reject','raw','archive','version')): continue
                  cs=columns(db,t)
                  rec={'columns':cs,'rows':int(db.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0])}
                  reason=next((x for x in ('reason','reject_reason','rejection_reason','code','quality') if x in cs),None)
                  symbol=next((x for x in ('symbol','ticker') if x in cs),None)
                  family=next((x for x in ('instrument_type','asset_class','family') if x in cs),None)
                  source=next((x for x in ('source','origin') if x in cs),None)
                  quality=next((x for x in ('quality','state','status') if x in cs),None)
                  if reason:
                      rec['reason_counts']=rows(db,f'SELECT "{reason}" reason,COUNT(*) rows FROM "{t}" GROUP BY "{reason}" ORDER BY rows DESC LIMIT 50')
                      if symbol: rec['top_symbols']=rows(db,f'SELECT "{symbol}" symbol,COUNT(*) rows FROM "{t}" GROUP BY "{symbol}" ORDER BY rows DESC LIMIT 50')
                      if family: rec['family_reason']=rows(db,f'SELECT "{family}" family,"{reason}" reason,COUNT(*) rows FROM "{t}" GROUP BY "{family}","{reason}" ORDER BY rows DESC LIMIT 100')
                      if source: rec['source_reason']=rows(db,f'SELECT "{source}" source,"{reason}" reason,COUNT(*) rows FROM "{t}" GROUP BY "{source}","{reason}" ORDER BY rows DESC LIMIT 100')
                  elif quality:
                      rec['quality_counts']=rows(db,f'SELECT "{quality}" quality,COUNT(*) rows FROM "{t}" GROUP BY "{quality}" ORDER BY rows DESC LIMIT 50')
                  if source and not reason:
                      rec['source_counts']=rows(db,f'SELECT "{source}" source,COUNT(*) rows FROM "{t}" GROUP BY "{source}" ORDER BY rows DESC LIMIT 50')
                  di[t]=rec
              inventory[dbname]=di
              if dbname=='history': out['history_quick_check']=db.execute('PRAGMA quick_check').fetchone()[0]
              db.close()
          out['db_inventory']=inventory
          assert out['observer_quick_check']=='ok' and out['history_quick_check']=='ok'
          print(json.dumps(out,ensure_ascii=False,sort_keys=True,default=str))
          PY
          curl -fsS http://127.0.0.1:8000/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status')=='ok'; print('HEALTH=OK')"
          echo 'NETWORK_PPI_CALLS=0'
          echo 'DATA_MUTATION=0'
          echo 'RC6_HISTORY_QUALITY_RCA_V2=COMPLETE'
          HOST

          {
            echo '### RC6 history quality RCA v2'
            echo '```text'
            sed -n '1,1800p' /tmp/rc6-history-rca-v2.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
