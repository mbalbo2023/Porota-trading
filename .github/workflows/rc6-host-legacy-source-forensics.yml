name: RC6 host legacy scheduler source forensics

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-host-legacy-source-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read exact legacy scheduler sources without writes
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/legacy-sources.txt
          set -euo pipefail
          cd /opt/porota-trading
          echo 'POROTA_LEGACY_SOURCE_FORENSICS=START'
          echo "BRANCH=$(git branch --show-current)"
          echo "HEAD=$(git rev-parse HEAD)"
          files=(
            /usr/local/sbin/porota-a3-cem-catalog-audit-rc4.sh
            /usr/local/sbin/porota-candle-integrity-rc4.sh
            /usr/local/sbin/porota-early-warning-rc4.sh
            /usr/local/sbin/porota-ingest-effectiveness-metrics-rc4.sh
            /usr/local/sbin/porota-ppi-consumption-metrics-rc4.sh
            /usr/local/sbin/porota-weekend-history-smart-policy-rc4.sh
            /usr/local/sbin/porota-preopen-check
            /usr/local/sbin/porota-rc4-auto-check
            /opt/porota-trading/rc4_host_general_backup_job.py
          )
          for p in "${files[@]}"; do
            echo "===== SOURCE=$p ====="
            if [ ! -f "$p" ]; then echo 'MISSING'; continue; fi
            sha256sum "$p" || true
            stat -Lc 'mode=%a|owner=%U:%G|bytes=%s|mtime=%y' "$p" || true
            # These are executable/source files only. Never inspect .env, tokens or credentials.
            sed -n '1,420p' "$p"
          done
          echo '===== PREOPEN_UNITS ====='
          sudo -n systemctl cat porota-preopen.timer porota-preopen.service --no-pager 2>/dev/null || true
          echo 'POROTA_LEGACY_SOURCE_FORENSICS=END'
          REMOTE
          {
            echo '### Legacy scheduler source forensics — read only'
            echo '```text'
            sed -n '1,2600p' /tmp/legacy-sources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
