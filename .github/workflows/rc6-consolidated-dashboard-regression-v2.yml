name: RC6 Consolidated Dashboard Regression V2 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-dashboard-20261001
    paths:
      - '.github/workflows/rc6-consolidated-dashboard-regression-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install project runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile changed dashboard sources
        run: python -m py_compile rc6_annual_instrument_analysis.py bh_universe_dashboard_hf6.py
      - name: Run dashboard performance guards
        run: python -m pytest -q tests/test_rc6_dashboard_perf_guards.py
      - name: Run canonical dashboard truth regression
        run: python -m pytest -q tests/test_ws_dash_04_full_dashboard_truth.py
