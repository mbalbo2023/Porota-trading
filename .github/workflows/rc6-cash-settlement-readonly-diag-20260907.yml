name: RC6 cash settlement readonly diag 2026-09-07

on:
  push:
    branches:
      - diag/rc6-cash-settlement-20260907

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_diag"
          chmod 600 "$HOME/.ssh/porota_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only paper cash and settlement forensics
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_diag" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/cash-diag.txt
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          OBS_SHA=db26c76723bb988c956589c572b87cbcb4191731
          OBS_BRANCH=hotfix/rc6-cedear-us-labor-day-20260906
          OBS_IMAGE=porota-trading-bot:17.0.0-rc6

          echo '=== POROTA RC6 CASH/SETTLEMENT READONLY DIAG ==='
          test "$(git -C "$REPO" branch --show-current)" = "$OBS_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$OBS_SHA"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = "true|$OBS_IMAGE|0|true"

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3, json
          from decimal import Decimal
          from datetime import datetime, timezone

          DB='/app/data/paper_v17/observer_v17.db'
          C=sqlite3.connect(f'file:{DB}?mode=ro', uri=True, timeout=30)
          C.row_factory=sqlite3.Row
          C.execute('PRAGMA query_only=ON')
          print('QUICK_CHECK='+str(C.execute('PRAGMA quick_check').fetchone()[0]))
          obs=C.execute('SELECT mode,process_state,session_state,ppi_auth,heartbeat_at,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          print('OBSERVER='+json.dumps(dict(obs),ensure_ascii=False,default=str))

          def exists(name):
              return C.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",(name,)).fetchone() is not None
          def D(v): return Decimal(str(v or '0'))
          def parse(v):
              if not v: return None
              return datetime.fromisoformat(str(v).replace('Z','+00:00'))
          def now_utc(): return datetime.now(timezone.utc)

          if not exists('paper_equity_by_currency'):
              raise SystemExit('MISSING paper_equity_by_currency')
          latest=C.execute('''SELECT e.* FROM paper_equity_by_currency e JOIN
             (SELECT currency,MAX(id) id FROM paper_equity_by_currency GROUP BY currency) x ON x.id=e.id
             ORDER BY e.currency''').fetchall()
          print('--- LATEST EQUITY BY CURRENCY ---')
          for r in latest:
              print(json.dumps(dict(r),ensure_ascii=False,default=str))

          now=now_utc()
          print('NOW_UTC='+now.isoformat())

          # Exact source rows that can constitute pending sale proceeds.
          print('--- ARS RECEIVABLES / SPOT SALES ---')
          spot_positions=set()
          if exists('paper_spot_sales'):
              rows=C.execute('''SELECT p.paper_id,p.symbol,p.strategy_version,p.currency_source,p.settlement,
                  p.opened_at,p.closed_at,p.status,s.fill_id,s.net_proceeds,s.available_at,s.basis,
                  f.filled_at,f.quantity,f.price,f.costs
                FROM paper_spot_sales s JOIN paper_positions p ON p.paper_id=s.paper_id
                JOIN paper_fills f ON f.id=s.fill_id
                WHERE p.currency='ARS' ORDER BY julianday(f.filled_at),s.fill_id''').fetchall()
              for r in rows:
                  spot_positions.add(r['paper_id'])
                  d=dict(r); a=parse(r['available_at'])
                  d['pending_now']=bool(D(r['net_proceeds'])>0 and (a is None or a>now))
                  print('SPOT_SALE '+json.dumps(d,ensure_ascii=False,default=str))
          if exists('paper_sale_receivables'):
              rows=C.execute('''SELECT p.paper_id,p.symbol,p.strategy_version,p.currency_source,p.settlement,
                  p.opened_at,p.closed_at,p.status,r.net_proceeds,r.available_at,r.basis
                FROM paper_sale_receivables r JOIN paper_positions p ON p.paper_id=r.paper_id
                WHERE r.currency='ARS' ORDER BY julianday(p.closed_at),p.paper_id''').fetchall()
              for r in rows:
                  d=dict(r); a=parse(r['available_at'])
                  d['shadowed_by_spot_sales']=r['paper_id'] in spot_positions
                  d['pending_now']=bool(r['paper_id'] not in spot_positions and D(r['net_proceeds'])>0 and (a is None or a>now))
                  print('RECEIVABLE '+json.dumps(d,ensure_ascii=False,default=str))

          # Recalculate stored pending amount without writing or importing runtime producers.
          def pending_for(currency):
              total=Decimal('0'); detail=[]; with_spot=set()
              if exists('paper_spot_sales'):
                  for r in C.execute('''SELECT p.paper_id,p.symbol,p.settlement,s.net_proceeds,s.available_at,s.basis,f.filled_at
                     FROM paper_spot_sales s JOIN paper_positions p ON p.paper_id=s.paper_id
                     JOIN paper_fills f ON f.id=s.fill_id WHERE p.currency=?''',(currency,)):
                      with_spot.add(r['paper_id']); a=parse(r['available_at']); amount=D(r['net_proceeds'])
                      if amount>0 and (a is None or a>now):
                          total+=amount; detail.append(('SPOT',r['paper_id'],r['symbol'],str(amount),r['available_at'],r['settlement']))
              if exists('paper_sale_receivables'):
                  for r in C.execute('''SELECT p.paper_id,p.symbol,p.settlement,r.net_proceeds,r.available_at,r.basis
                     FROM paper_sale_receivables r JOIN paper_positions p ON p.paper_id=r.paper_id WHERE r.currency=?''',(currency,)):
                      if r['paper_id'] in with_spot: continue
                      a=parse(r['available_at']); amount=D(r['net_proceeds'])
                      if amount>0 and (a is None or a>now):
                          total+=amount; detail.append(('RECEIPT',r['paper_id'],r['symbol'],str(amount),r['available_at'],r['settlement']))
              return total,detail

          for currency in ('ARS','USD_MEP'):
              total,detail=pending_for(currency)
              row=next((r for r in latest if r['currency']==currency),None)
              print(f'PENDING_RECALC_{currency}={total}')
              if row:
                  print(f'PENDING_STORED_{currency}={row["pending_proceeds"]}')
                  print(f'PENDING_MATCH_{currency}={D(row["pending_proceeds"])==total}')
                  cash=D(row['cash']); pending=D(row['pending_proceeds']); equity=D(row['equity'])
                  print(f'EQUATION_{currency}: cash({cash})+pending({pending})+exposure({row["exposure"]})+caucion_principal({row["caucion_principal"]})+caucion_accrued({row["caucion_accrued"]}) ; equity={equity}; realized={row["realized_pnl"]}; unrealized={row["unrealized_pnl"]}')
              for x in detail:
                  print('PENDING_COMPONENT_'+currency+'='+json.dumps(x,ensure_ascii=False,default=str))

          # Current open positions and recent fills, to explain whether negative cash is current exposure or carry.
          print('--- CURRENT OPEN POSITIONS ---')
          for r in C.execute("SELECT paper_id,symbol,asset_class,settlement,currency,market,quantity,entry_price,entry_cost,opened_at,strategy_version,currency_source FROM paper_positions WHERE status='OPEN' ORDER BY opened_at"):
              print(json.dumps(dict(r),ensure_ascii=False,default=str))

          print('--- RECENT ARS POSITIONS / FILLS ---')
          positions=C.execute('''SELECT paper_id,symbol,asset_class,settlement,currency,market,status,quantity,
                 entry_price,entry_cost,opened_at,closed_at,exit_price,exit_cost,net_pnl,strategy_version,currency_source,features_json
              FROM paper_positions WHERE currency='ARS' ORDER BY julianday(opened_at),paper_id''').fetchall()
          for p in positions[-40:]:
              d=dict(p); d.pop('features_json',None)
              try:
                  feat=json.loads(p['features_json'] or '{}')
                  d['cash_multiplier']=feat.get('contract_cash_multiplier','1')
              except Exception:
                  d['cash_multiplier']='?'
              print('POSITION '+json.dumps(d,ensure_ascii=False,default=str))
              for f in C.execute("SELECT id,side,filled_at,quantity,price,costs FROM paper_fills WHERE paper_id=? ORDER BY julianday(filled_at),id",(p['paper_id'],)):
                  print('  FILL '+json.dumps(dict(f),ensure_ascii=False,default=str))

          # Cash-flow replay is only asserted when current ARS book has no open spot/caucion exposure,
          # matching the dashboard condition seen at preopen. It detects any historical BUY that spent
          # more SETTLED cash than was available at that timestamp.
          ars=next((r for r in latest if r['currency']=='ARS'),None)
          open_ars=C.execute("SELECT COUNT(*) FROM paper_positions WHERE currency='ARS' AND status='OPEN'").fetchone()[0]
          open_cauc=C.execute("SELECT COUNT(*) FROM paper_cauciones WHERE currency='ARS' AND status='OPEN'").fetchone()[0] if exists('paper_cauciones') else 0
          if ars and open_ars==0 and open_cauc==0 and D(ars['exposure'])==0 and D(ars['caucion_principal'])==0:
              implied_initial=D(ars['equity'])-D(ars['realized_pnl'])-D(ars['unrealized_pnl'])-D(ars['caucion_accrued'])
              print('IMPLIED_INITIAL_ARS='+str(implied_initial))
              events=[]
              pos={r['paper_id']:r for r in C.execute("SELECT paper_id,features_json FROM paper_positions WHERE currency='ARS'")}
              for f in C.execute('''SELECT f.*,p.symbol,p.features_json FROM paper_fills f JOIN paper_positions p USING(paper_id)
                                    WHERE p.currency='ARS' AND f.side='BUY_SIMULATED' ORDER BY julianday(f.filled_at),f.id'''):
                  try: factor=D(json.loads(f['features_json'] or '{}').get('contract_cash_multiplier','1'))
                  except Exception: factor=Decimal('1')
                  out=D(f['price'])*D(f['quantity'])*factor+D(f['costs'])
                  events.append((parse(f['filled_at']),0,'BUY',f['paper_id'],f['symbol'],-out,None))
              # Settlement credits: spot sales first; simple receivables only if no spot sales for that position.
              with_spot=set()
              if exists('paper_spot_sales'):
                  for r in C.execute('''SELECT s.*,f.filled_at,p.symbol,p.currency FROM paper_spot_sales s
                                        JOIN paper_fills f ON f.id=s.fill_id JOIN paper_positions p ON p.paper_id=s.paper_id
                                        WHERE p.currency='ARS' '''):
                      with_spot.add(r['paper_id'])
                      if r['available_at']:
                          events.append((parse(r['available_at']),1,'SETTLE',r['paper_id'],r['symbol'],D(r['net_proceeds']),r['filled_at']))
              if exists('paper_sale_receivables'):
                  for r in C.execute('''SELECT r.*,p.symbol,p.closed_at FROM paper_sale_receivables r
                                        JOIN paper_positions p ON p.paper_id=r.paper_id WHERE r.currency='ARS' '''):
                      if r['paper_id'] in with_spot or not r['available_at']: continue
                      events.append((parse(r['available_at']),1,'SETTLE',r['paper_id'],r['symbol'],D(r['net_proceeds']),r['closed_at']))
              events=[e for e in events if e[0] is not None]
              events.sort(key=lambda e:(e[0],e[1],e[3]))
              cash=implied_initial; breaches=[]
              for when,_,kind,pid,symbol,amount,origin in events:
                  before=cash
                  if kind=='BUY' and before+amount < 0:
                      breaches.append((when.isoformat(),pid,symbol,str(before),str(-amount),str(before+amount)))
                  cash+=amount
                  print('CASH_EVENT='+json.dumps({'at':when.isoformat(),'kind':kind,'paper_id':pid,'symbol':symbol,'amount':str(amount),'cash_before':str(before),'cash_after':str(cash),'sale_origin':origin},ensure_ascii=False))
              print('CASH_REPLAY_FINAL_ARS='+str(cash))
              print('CASH_STORED_ARS='+str(ars['cash']))
              print('CASH_REPLAY_MATCH='+str(cash==D(ars['cash'])))
              print('SETTLED_CASH_BREACH_COUNT='+str(len(breaches)))
              for b in breaches:
                  print('SETTLED_CASH_BREACH='+json.dumps(b,ensure_ascii=False))
          else:
              print(f'CASH_REPLAY_SKIPPED=open_ars:{open_ars}|open_cauc:{open_cauc}')

          C.close()
          print('READONLY_DIAG=GREEN')
          PY

          echo 'OBSERVER_SHA_UNCHANGED='"$OBS_SHA"
          echo 'OBSERVER_RESTARTED=NO'
          echo 'RUNTIME_MUTATION=NO'
          HOST

          {
            echo '### RC6 cash/settlement read-only diagnostic'
            echo '```text'
            sed -n '1,1200p' /tmp/cash-diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
