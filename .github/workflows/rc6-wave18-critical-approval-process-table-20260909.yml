name: RC6 Wave18 Critical Approval Process Table 2026-09-09

on:
  push:
    branches:
      - deploy-prep/rc6-wave18-currentbase-20260909
    paths:
      - .github/workflows/rc6-wave18-critical-approval-process-table-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-process-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect process states without container exec
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE=$(git rev-parse HEAD)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo '=== PROCESS SUMMARY ==='
          sudo -n docker top porota_critical_approval_rc6 -eo pid,ppid,stat,comm,args | head -120
          echo '=== STATE COUNTS ==='
          sudo -n docker top porota_critical_approval_rc6 -eo stat | tail -n +2 | awk '{s=substr($1,1,1); c[s]++} END {for (s in c) print s"="c[s]}' | sort
          echo '=== ZOMBIE COUNT ==='
          Z=$(sudo -n docker top porota_critical_approval_rc6 -eo stat | tail -n +2 | awk 'substr($1,1,1)=="Z"{n++} END{print n+0}')
          echo "ZOMBIES=$Z"
          test "$(git rev-parse HEAD)" = "$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'HOST_MUTATION=NO'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RC6_W18_PROCESS_TABLE=GREEN'
          REMOTE
