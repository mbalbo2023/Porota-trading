name: RC6 Contract Evidence exact PPI auth endpoint 2026-09-07

on:
  push:
    branches: [hotfix/rc6-contract-evidence-auth-endpoint-20260907]
    paths:
      - 'rc6_ppi_web_reauth.py'
      - '.github/workflows/rc6-contract-evidence-auth-endpoint-probe-20260907.yml'

permissions:
  contents: read

concurrency:
  group: porota-rc6-contract-evidence-auth-endpoint
  cancel-in-progress: false

jobs:
  auth-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate helper safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile rc6_ppi_web_reauth.py
          grep -q '/api/Seguridad/Auth/Login' rc6_ppi_web_reauth.py
          grep -q 'real_orders_sent' rc6_ppi_web_reauth.py
          grep -q 'credentials_exposed' rc6_ppi_web_reauth.py
          ! grep -Eq 'send_order|place_order|cancel_order|order_budget' rc6_ppi_web_reauth.py
          echo 'AUTH_HELPER_STATIC_SAFETY=GREEN'

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_ce_auth"
          chmod 600 "$HOME/.ssh/porota_ce_auth"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage exact helper and run sanitized auth classifier
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/porota_ce_auth" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            rc6_ppi_web_reauth.py "$DO_USER@$DO_HOST:/tmp/rc6_ppi_web_reauth_exact.py"

          ssh -i "$HOME/.ssh/porota_ce_auth" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          SECRET=/etc/porota/contract-evidence-web.env
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          VENV=/opt/porota-contract-evidence-venv
          LIB=/usr/local/lib/porota-contract-evidence-rc6
          HELPER="$LIB/rc6_ppi_web_reauth.py"
          RUNTIME=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh

          test -f "$SECRET"
          test "$(stat -c '%U' "$SECRET")" = porotaadmin
          test "$(stat -c '%a' "$SECRET")" = 600
          sudo -n -u porotaadmin awk -F= '/^PPI_WEB_USERNAME=/{u=length($2)>0} /^PPI_WEB_PASSWORD=/{p=length($2)>0} END{exit (u&&p)?0:1}' "$SECRET"
          echo 'PPI_WEB_USERNAME=PRESENT_RESTRICTED'
          echo 'PPI_WEB_PASSWORD=PRESENT_RESTRICTED'
          echo 'PPI_WEB_SECRET_VALUES_PRINTED=NO'

          sudo -n install -d -o root -g root -m 0755 "$LIB"
          sudo -n install -o root -g root -m 0755 /tmp/rc6_ppi_web_reauth_exact.py "$HELPER"
          sudo -n rm -f /tmp/rc6_ppi_web_reauth_exact.py

          PRE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=30); c.execute('pragma query_only=on')
          qc=c.execute('pragma quick_check').fetchone()[0]
          mode,orders=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'{qc}|{mode}|{orders}'); c.close()
          PY
          )"
          printf 'OBSERVER_DB_BEFORE=%s\n' "$PRE"
          test "$PRE" = 'ok|PRODUCTION_PAPER|0'

          set +e
          OUT="$(sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin PYTHONPATH="$LIB:/opt/porota-trading" \
            "$VENV/bin/python" "$HELPER" --profile "$PROFILE" --secret "$SECRET" 2>&1)"
          RC=$?
          set -e
          printf 'REAUTH_RC=%s\n' "$RC"
          printf '%s\n' "$OUT"
          STATE="$(OUT="$OUT" python3 - <<'PY'
          import json,os
          try: print(json.loads(os.environ['OUT']).get('status','UNKNOWN'))
          except Exception: print('INVALID_REAUTH_OUTPUT')
          PY
          )"
          printf 'REAUTH_STATE=%s\n' "$STATE"

          if [ "$STATE" = AUTHENTICATED_TRUSTED_DEVICE ]; then
            echo 'CONTRACT_EVIDENCE_REAUTH=GREEN'
            if [ -x "$RUNTIME" ]; then
              set +e
              CE_OUT="$(sudo -n "$RUNTIME" 2>&1)"
              CE_RC=$?
              set -e
              printf '%s\n' "$CE_OUT"
              printf 'CONTRACT_EVIDENCE_RUNTIME_RC=%s\n' "$CE_RC"
            else
              echo 'CONTRACT_EVIDENCE_RUNTIME=MISSING'
            fi
          else
            echo 'CONTRACT_EVIDENCE_REAUTH=YELLOW'
          fi

          POST="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=30); c.execute('pragma query_only=on')
          qc=c.execute('pragma quick_check').fetchone()[0]
          mode,orders=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'{qc}|{mode}|{orders}'); c.close()
          PY
          )"
          printf 'OBSERVER_DB_AFTER=%s\n' "$POST"
          test "$POST" = 'ok|PRODUCTION_PAPER|0'
          echo 'REAL_ORDERS_SENT=0'
          echo 'AUTH_ENDPOINT_PROBE=COMPLETE'
          HOST
