name: RC6 Contract capture runtime proof 2026-09-14

on:
  workflow_dispatch:
  push:
    branches: [ops/rc6-ppi-web-residual-ready-20260913]
    paths:
      - '.github/workflows/rc6-contract-capture-runtime-proof-20260914.yml'

permissions:
  contents: write

jobs:
  locate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rc6-ppi-web-residual-ready-20260913

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only capture runtime locator
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          RESULT='POROTA_TRADING_CONTRACT_CAPTURE_RUNTIME_RESULT_2026-09-14.txt'
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee "$RESULT"
          set -euo pipefail
          echo 'RUNTIME_LOCATOR=V1'
          echo 'SERVER_HEAD='"$(git -c safe.directory=/opt/porota-trading -C /opt/porota-trading rev-parse HEAD 2>/dev/null || true)"

          echo 'COLLECTOR_REFERENCE_FILES_BEGIN'
          for root in /opt/porota-trading /opt/porota-ingest /etc/systemd/system /usr/local/bin /usr/local/sbin; do
            [ -e "$root" ] || continue
            grep -RIl --exclude='*.json' --exclude='*.db' --exclude='*.sqlite*' --exclude-dir=.git --exclude-dir=data 'rc6_trusted_browser_contract_collector.py' "$root" 2>/dev/null || true
          done | sort -u | sed -n '1,80p'
          echo 'COLLECTOR_REFERENCE_FILES_END'

          echo 'PROFILE_CANDIDATES_BEGIN'
          python3 - <<'PY'
          import os, pathlib, datetime
          bases=[pathlib.Path('/root/.config'),pathlib.Path('/home'),pathlib.Path('/opt/porota-ingest'),pathlib.Path('/opt/porota-trading')]
          seen=set()
          for base in bases:
              if not base.exists(): continue
              for root,dirs,files in os.walk(base):
                  p=pathlib.Path(root)
                  if len(p.parts)-len(base.parts)>7:
                      dirs[:]=[]; continue
                  if any(x in p.parts for x in ('.git','node_modules','chroma','chromadb')):
                      dirs[:]=[]; continue
                  # Chrome/Chromium profile root heuristic: Local State plus Default/Profile directory.
                  if 'Local State' in files and any(d=='Default' or d.startswith('Profile ') for d in dirs):
                      s=str(p)
                      if s not in seen:
                          seen.add(s)
                          try: mt=datetime.datetime.fromtimestamp(p.stat().st_mtime,datetime.timezone.utc).isoformat()
                          except Exception: mt='UNKNOWN'
                          print('PROFILE|'+s+'|mtime='+mt+'|readable='+('YES' if os.access(p,os.R_OK) else 'NO'))
          PY
          echo 'PROFILE_CANDIDATES_END'

          echo 'HOST_PLAYWRIGHT_PYTHONS_BEGIN'
          python3 - <<'PY'
          import os, pathlib, subprocess
          roots=[pathlib.Path('/opt/porota-ingest'),pathlib.Path('/opt/porota-trading')]
          seen=set()
          for root in roots:
              if not root.exists(): continue
              for base,dirs,files in os.walk(root):
                  p=pathlib.Path(base)
                  if len(p.parts)-len(root.parts)>7:
                      dirs[:]=[]; continue
                  if any(x in p.parts for x in ('.git','node_modules','data','chroma','chromadb')):
                      dirs[:]=[]; continue
                  for fn in ('python','python3'):
                      exe=p/fn
                      if exe.exists() and os.access(exe,os.X_OK) and str(exe) not in seen:
                          seen.add(str(exe))
                          try:
                              r=subprocess.run([str(exe),'-c','import importlib.util; print("YES" if importlib.util.find_spec("playwright") else "NO")'],capture_output=True,text=True,timeout=3)
                              if r.stdout.strip()=='YES': print('PLAYWRIGHT_PYTHON|'+str(exe))
                          except Exception: pass
          PY
          echo 'HOST_PLAYWRIGHT_PYTHONS_END'

          echo 'DOCKER_PLAYWRIGHT_BEGIN'
          if sudo -n docker ps --format '{{.Names}}' >/tmp/porota_capture_containers.$$ 2>/dev/null; then
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              if sudo -n docker exec "$c" python -c 'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("playwright") else 1)' >/dev/null 2>&1; then
                echo "PLAYWRIGHT_CONTAINER|$c|python"
              elif sudo -n docker exec "$c" python3 -c 'import importlib.util; raise SystemExit(0 if importlib.util.find_spec("playwright") else 1)' >/dev/null 2>&1; then
                echo "PLAYWRIGHT_CONTAINER|$c|python3"
              fi
            done </tmp/porota_capture_containers.$$
            rm -f /tmp/porota_capture_containers.$$
          else
            echo 'DOCKER_PS_UNAVAILABLE'
          fi
          echo 'DOCKER_PLAYWRIGHT_END'

          echo 'SYSTEMD_REFERENCES_BEGIN'
          grep -RIl 'trusted_browser_contract\|contract_collector\|contract_evidence' /etc/systemd/system 2>/dev/null | sort -u | sed -n '1,80p' || true
          echo 'SYSTEMD_REFERENCES_END'

          echo 'RECENT_CAPTURE_METADATA_BEGIN'
          find /opt/porota-trading/data/contract_evidence /opt/porota-ingest -maxdepth 7 -type f -name '*.json' -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ|%s|%p\n' 2>/dev/null | sort -r | sed -n '1,25p' || true
          echo 'RECENT_CAPTURE_METADATA_END'
          HOST

      - name: Persist sanitized runtime audit result
        run: |
          set -euo pipefail
          RESULT='POROTA_TRADING_CONTRACT_CAPTURE_RUNTIME_RESULT_2026-09-14.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git diff --cached --quiet && exit 0
          git commit -m 'audit(contract): persist capture runtime result [skip ci]'
          git push origin HEAD:ops/rc6-ppi-web-residual-ready-20260913
