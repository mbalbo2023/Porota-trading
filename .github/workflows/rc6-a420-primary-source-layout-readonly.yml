name: RC6 A420 primary source cycle layout READ_ONLY

# Diagnostic-only: distinguish optional primary JSON cache absence from source
# producer scheduling/output problems without reading SQLite or market quotes.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-a420-primary-source-layout-readonly.yml'
      - 'scripts/rc6_a420_primary_source_layout_ro.py'
      - 'tests/test_rc6_a420_primary_source_layout_ro.py'
      - 'scripts/rc6_a504_systemd_cadence_ro.py'
      - 'tests/test_rc6_a504_systemd_cadence_ro.py'
      - 'scripts/rc6_a532_source_stage_journal_ro.py'
      - 'tests/test_rc6_a532_source_stage_journal_ro.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc6-a420-primary-source-layout-readonly.yml'
      - 'scripts/rc6_a420_primary_source_layout_ro.py'
      - 'tests/test_rc6_a420_primary_source_layout_ro.py'
      - 'scripts/rc6_a504_systemd_cadence_ro.py'
      - 'tests/test_rc6_a504_systemd_cadence_ro.py'
      - 'scripts/rc6_a532_source_stage_journal_ro.py'
      - 'tests/test_rc6_a532_source_stage_journal_ro.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-a420-primary-source-layout-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run negative read-only and output-sanitization regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_a420_primary_source_layout_ro.py tests/test_rc6_a420_primary_source_layout_ro.py
          python3 -m unittest discover -s tests -p test_rc6_a420_primary_source_layout_ro.py -v
          python3 -m py_compile scripts/rc6_a504_systemd_cadence_ro.py tests/test_rc6_a504_systemd_cadence_ro.py
          python3 -m unittest discover -s tests -p test_rc6_a504_systemd_cadence_ro.py -v
          python3 -m py_compile scripts/rc6_a532_source_stage_journal_ro.py tests/test_rc6_a532_source_stage_journal_ro.py
          python3 -m unittest discover -s tests -p test_rc6_a532_source_stage_journal_ro.py -v
          git diff --check

  host_metadata:
    needs: contracts
    if: github.repository == 'mbalbo2023/Porota-trading' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare strict runner-only SSH for fixed metadata roles
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a420_source_layout"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a420_source_layout" "$HOME/.ssh/known_hosts"
          mkdir -p evidence
      - name: Read only bounded source-cycle file metadata and systemd state
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_a420_source_layout" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=8 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            'sudo -n timeout 22 python3 -B - host-probe' \
            < scripts/rc6_a420_primary_source_layout_ro.py > evidence/.raw.json 2>/dev/null
          remote_rc=$?
          set -e
          REMOTE_RC="$remote_rc" python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected_roles=['PRIMARY_MARKET_CACHE','PRIMARY_APP_CACHE','SOURCE_CYCLE_STATE',
                          'FULL_UNIVERSE_EXPORT','SOURCE_CYCLE_SCRIPT','FULL_UNIVERSE_SCRIPT',
                          'PPI_SCANNER_PRIVATE_RECEIPT']
          expected_units=['CYCLE_TIMER','CYCLE_SERVICE']
          allowed_status={'PRESENT_REGULAR','MISSING','UNSAFE_PATH','UNSAFE_FILE',
                          'SIZE_LIMIT','UNAVAILABLE_OR_ALIAS','CHANGED_DURING_READ',
                          'UNSAFE_MODE','OWNER_MISMATCH','NO_VERIFICADO'}
          allowed_age={'UNKNOWN','FUTURE_CLOCK','WITHIN_5M','WITHIN_30M',
                       'WITHIN_2H','WITHIN_DAY','OLDER_THAN_DAY'}
          allowed_load={'UNKNOWN','loaded','not-found','masked','error'}
          allowed_active={'UNKNOWN','active','inactive','failed',
                          'activating','deactivating','reloading'}
          allowed_result={'UNKNOWN','success','exit-code','timeout','signal',
                          'core-dump','watchdog','start-limit-hit','protocol','resources','dependency'}
          allowed_user={'ROOT','UID1000','OTHER','DYNAMIC','UNKNOWN','NOT_APPLICABLE'}
          allowed_boolean={'YES','NO','UNKNOWN','NOT_APPLICABLE'}
          allowed_dropins={'PRESENT','NONE','UNKNOWN','NOT_APPLICABLE'}
          allowed_private={'PRIVATE_0600','OTHER','UNKNOWN'}
          allowed_owner={'UID1000','OTHER','UNKNOWN'}
          allowed_access={'ACCESS_OK','READ_FAILED','NO_VERIFICADO'}
          data={'schema':'rc6.a420.primary-source-layout-readonly.v2',
                'read_only':True,'host_metadata_only':True,'database_opened':False,
                'provider_calls':0,'order_routes_called':False,'ppi_watch_touched':False,
                'paper_ready':False,'diagnostic_only':True,'files':[],
                'units':[],'probe_status':'NO_VERIFICADO'}
          try:
              path=Path('evidence/.raw.json')
              if os.environ['REMOTE_RC']!='0' or path.stat().st_size > 10_000:
                  raise ValueError('remote error or size cap')
              raw=json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(raw,dict) or set(raw)!=set(data)-{'probe_status'}:
                  raise ValueError('wrong root keys')
              if any(raw.get(key)!=value or type(raw.get(key)) is not type(value)
                     for key,value in data.items() if key not in ('files','units','probe_status')):
                  raise ValueError('untrusted invariant')
              files=raw.get('files')
              units=raw.get('units')
              if not isinstance(files,list) or len(files)!=7 or not isinstance(units,list) or len(units)!=2:
                  raise ValueError('wrong denominators')
              for role,record in zip(expected_roles,files):
                  if (not isinstance(record,dict) or record.get('role')!=role or
                      record.get('status') not in allowed_status or
                      record.get('mtime_age_bucket') not in allowed_age):
                      raise ValueError('invalid file')
                  if role=='PPI_SCANNER_PRIVATE_RECEIPT':
                      fields={'role','status','mtime_age_bucket','private_mode','owner_class',
                              'consumer_access','access_scope'}
                      if (set(record)!=fields or record['private_mode'] not in allowed_private or
                          record['owner_class'] not in allowed_owner or
                          record['consumer_access'] not in allowed_access or
                          record['access_scope']!='HOST_DAC_ONLY'):
                          raise ValueError('invalid private sidecar metadata')
                      if (record['consumer_access']=='ACCESS_OK' and
                          (record['status']!='PRESENT_REGULAR' or
                           record['private_mode']!='PRIVATE_0600' or
                           record['owner_class']!='UID1000')):
                          raise ValueError('false positive sidecar access')
                  elif role=='SOURCE_CYCLE_STATE' and record.get('status')=='PRESENT_REGULAR':
                      fields={'role','status','mtime_age_bucket','state_schema','session',
                              'public_last_success','evidence_last_success'}
                      if (set(record)!=fields or record['state_schema'] not in {'MATCHED','NO_VERIFICADO'} or
                          record['session'] not in {'TODAY','OTHER_DAY_OR_MISSING','NO_VERIFICADO'} or
                          record['public_last_success'] not in allowed_age or
                          record['evidence_last_success'] not in allowed_age):
                          raise ValueError('invalid producer state')
                  elif set(record)!={'role','status','mtime_age_bucket'}:
                      raise ValueError('unexpected file field')
              for role,record in zip(expected_units,units):
                  if (not isinstance(record,dict) or
                      set(record)!={'unit','query','load','active','result','main_exit',
                                    'effective_user','dynamic_user','dropins'} or
                      record['unit']!=role or record['query'] not in {'READ_ONLY','UNAVAILABLE'} or
                      record['load'] not in allowed_load or record['active'] not in allowed_active or
                      record['result'] not in allowed_result or
                      record['main_exit'] not in {'UNKNOWN','ZERO','NONZERO'} or
                      record['effective_user'] not in allowed_user or
                      record['dynamic_user'] not in allowed_boolean or
                      record['dropins'] not in allowed_dropins):
                      raise ValueError('invalid systemd state')
                  if role=='CYCLE_TIMER' and any(record[k]!='NOT_APPLICABLE'
                                                  for k in ('effective_user','dynamic_user','dropins')) and record['query']=='READ_ONLY':
                      raise ValueError('unexpected timer identity')
              if files[-1]['consumer_access']=='ACCESS_OK':
                  # A473-EXT: a positive DAC receipt must be tied to a
                  # specifically verified fixed consumer identity. Do not
                  # accept a forged ACCESS_OK with unknown/dynamic/other user.
                  service=units[1]
                  if not (service['unit']=='CYCLE_SERVICE' and
                          service['query']=='READ_ONLY' and service['load']=='loaded' and
                          service['effective_user'] in {'ROOT','UID1000'} and
                          service['dynamic_user']=='NO'):
                      raise ValueError('unbound positive DAC reader identity')
              data['files']=files
              data['units']=units
              data['probe_status']='METADATA_ONLY'
          except (OSError,UnicodeError,ValueError,TypeError,KeyError):
              pass
          Path('evidence/source_cycle_layout.json').write_text(
              json.dumps(data,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print('A420_SOURCE_CYCLE_PROBE='+data['probe_status'])
          print('A420_MARKET_READY=NO_VERIFICADO')
          for record in data['files']:
              print('A420_ROLE='+record['role']+' status='+record['status']+
                    ' age='+record['mtime_age_bucket'])
              if record['role']=='PPI_SCANNER_PRIVATE_RECEIPT':
                  print('A466_PRIVATE_SIDECAR mode='+record['private_mode']+
                        ' owner='+record['owner_class']+' access='+record['consumer_access']+
                        ' scope='+record['access_scope'])
          for record in data['units']:
              print('A420_UNIT='+record['unit']+' load='+record['load']+
                    ' active='+record['active']+' result='+record['result'])
              if record['unit']=='CYCLE_SERVICE':
                  print('A466_SERVICE_IDENTITY user='+record['effective_user']+
                        ' dynamic='+record['dynamic_user']+' dropins='+record['dropins'])
          PY
          rm -f evidence/.raw.json
      - name: Preserve only validated sanitized receipt, including negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a420-primary-source-layout-${{ github.run_id }}
          path: evidence/source_cycle_layout.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed on missing diagnostic not on missing source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('evidence/source_cycle_layout.json')
          if not path.is_file():
              raise SystemExit('::error::A420 sanitized receipt unavailable')
          result=json.loads(path.read_text(encoding='utf-8'))
          if result.get('probe_status')!='METADATA_ONLY':
              raise SystemExit('::error::A420 metadata validation NO_VERIFICADO')
          if result.get('paper_ready') is not False or result.get('database_opened') is not False:
              raise SystemExit('::error::A420 false readiness')
          print('A420_HOST_METADATA=VALID_ONLY|source_readiness=NO_VERIFICADO')
          PY
      - name: A504 bounded systemd cadence metadata (no journal messages)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Sanitizer failure and command errors must not leave untrusted
          # host stdout after shell exit. Scope to this A504 raw file only.
          trap 'rm -f -- evidence/.a504-raw.json' EXIT
          set +e
          ssh -i "$HOME/.ssh/rc6_a420_source_layout" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=8 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            'sudo -n timeout 35 python3 -B - host-probe' \
            < scripts/rc6_a504_systemd_cadence_ro.py > evidence/.a504-raw.json 2>/dev/null
          remote_rc=$?
          set -e
          python3 scripts/rc6_a504_systemd_cadence_ro.py sanitize
          if [ "$remote_rc" -ne 0 ]; then
            echo '::warning::A504 bounded metadata SSH unavailable; receipt fails closed.'
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('evidence/a504-cadence.json').read_text(encoding='utf-8'))
          for role in result['roles']:
              print('A504_ROLE='+role['role']+' class='+role['classification']+
                    ' nominal_mature='+str(role['nominal_mature_slots'])+
                    ' observed='+str(role['observed_distinct_slots']))
          if result['probe_status']!='METADATA_ONLY':
              raise SystemExit('::error::A504 metadata receipt NO_VERIFICADO')
          print('A504_FULL_DAY_CADENCE_CERTIFIED=false')
          PY
      - name: A504 publish only sanitized bounded cadence classifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a504-systemd-cadence-${{ github.run_id }}
          path: evidence/a504-cadence.json
          if-no-files-found: warn
          retention-days: 14
      - name: A532 host-only bounded stage marker (raw journal never leaves host)
        shell: bash
        run: |
          set -Eeuo pipefail
          # The SSH transcript is fixed-enum JSON, never a journal MESSAGE;
          # remove it even when the validator or SSH command fails.
          trap 'rm -f -- evidence/.a532-untrusted.json' EXIT
          set +e
          ssh -i "$HOME/.ssh/rc6_a420_source_layout" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=8 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            'sudo -n timeout 10 python3 -B - host-probe' \
            < scripts/rc6_a532_source_stage_journal_ro.py \
            > evidence/.a532-untrusted.json 2>/dev/null
          remote_rc=$?
          set -e
          python3 scripts/rc6_a532_source_stage_journal_ro.py sanitize
          if [ "$remote_rc" -ne 0 ]; then
            echo '::warning::A532 stage marker unavailable; no runtime state certified.'
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('evidence/a532-source-stages.json').read_text(encoding='utf-8'))
          if result['paper_ready'] is not False or result['raw_journal_exported'] is not False:
              raise SystemExit('::error::A532 unsafe positive output')
          print('A532_JOURNAL_MARKER='+result['marker']+
                '|stage_public='+result['stage_public']+
                '|stage_evidence='+result['stage_evidence']+
                '|cadence_verified=NO')
          PY
      - name: A532 publish only validated source-stage enums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a532-source-stage-journal-${{ github.run_id }}
          path: evidence/a532-source-stages.json
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy only runner SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/rc6_a420_source_layout"
