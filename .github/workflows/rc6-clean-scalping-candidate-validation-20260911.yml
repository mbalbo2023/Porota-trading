name: RC6 Clean Scalping Candidate Validation 2026-09-11
on:
  push:
    branches: [test/rc6-scalping-active-paper-eod-20260911]
    paths:
      - '.github/workflows/rc6-clean-scalping-candidate-validation-20260911.yml'
permissions:
  contents: read
jobs:
  validate-clean-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-scalping-paper-economics-20260911
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert exact clean candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a"
          test "$(git rev-parse HEAD^)" = "f8adec8a02b2f9f0ef2dffbee75458c958bf711e"
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'cf_intraday_scalping.py\nfh_scalping_economics_rc6.py\ntests/test_rc6_scalping_active_paper_learning.py\ntests/test_rc6_scalping_intraday_fee_bonus.py'
      - name: Install focused dependencies
        run: python -m pip install -q pytest fastapi requests
      - name: Compile changed runtime path
        run: python -m py_compile cf_intraday_scalping.py fh_scalping_economics_rc6.py
      - name: Validate fee economics and learning lifecycle
        run: python -m pytest -q tests/test_rc6_scalping_intraday_fee_bonus.py tests/test_rc6_scalping_active_paper_learning.py
      - name: Preserve scalping contract regressions
        run: python -m pytest -q tests/test_intraday_scalping_rc6_integration.py tests/test_intraday_contract_policy_rc6.py
      - name: Preserve runtime safety
        run: python -m pytest -q tests/test_rc6_runtime_safety.py
      - name: Static PAPER-only assertions
        run: |
          python - <<'PY'
          import _version
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          src=open('cf_intraday_scalping.py').read().lower()
          assert 'opened_simulated' in src
          assert 'send_order' not in src
          print('CLEAN_SCALPING_CANDIDATE=GREEN')
          PY
