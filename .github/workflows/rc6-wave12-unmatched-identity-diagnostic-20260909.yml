name: RC6 Wave12 Unmatched Identity Diagnostic 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave12-unmatched-identity-diagnostic-20260909.yml']
permissions:
  contents: read
jobs:
  unmatched-identity:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w12id"
          chmod 600 "$HOME/.ssh/w12id"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Compare sanitized identities read-only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w12id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          PY=/opt/porota-contract-evidence-venv/bin/python
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "9197aedf35fe1739b594c742902e80df069c47c9"
          echo '=== CANDIDATE_UNIVERSE SAMPLES ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          cols={x[1] for x in c.execute('pragma table_info(candidate_universe)')}
          fields=[x for x in ('ticker','instrument_type','market','settlement','status') if x in cols]
          rows=[dict(zip(fields,row)) for row in c.execute('select '+','.join(fields)+' from candidate_universe'+(" where status='AVAILABLE'" if 'status' in cols else ''))]
          families=['ON','ONS','OBLIGACIONES_NEGOCIABLES','OPCIONES','OPCION','ETF','ETFS','FCI','FCIS','FCI_EXTERIOR','ACCIONES_USA']
          def norm(x): return str(x or '').upper().replace(' ','_').replace('-','_')
          for fam in families:
              vals=[x for x in rows if norm(x.get('instrument_type'))==norm(fam)]
              if vals:
                  print(f'CANDIDATES_{fam}='+json.dumps(vals[:30],ensure_ascii=False,separators=(',',':')))
          print('CANDIDATE_TOTAL='+str(len(rows)))
          c.close()
          PY
          echo '=== PPI DOM SAMPLES ==='
          sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin "$PY" - "$PROFILE" <<'PY'
          import json,re,sys
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          BASE='https://trading.portfoliopersonal.com'
          routes=['/Cotizaciones/FCIs','/Cotizaciones/FCIsExterior','/Cotizaciones/AccionesUSA','/Cotizaciones/ETFs','/Cotizaciones/Ons','/Cotizaciones/Opciones']
          profile=sys.argv[1]; blocked=[]; out={}
          def clean(x): return re.sub(r'\s+',' ',str(x or '')).strip()[:120]
          def safe_landing(url):
              u=urlsplit(url); p=u.path.rstrip('/').lower()
              return u.scheme=='https' and u.netloc=='trading.portfoliopersonal.com' and p and 'login' not in p and not any('/'+x in p for x in ('operar','orden','trade','confirm','cancel'))
          with sync_playwright() as pw:
              ctx=pw.chromium.launch_persistent_context(user_data_dir=profile,executable_path='/usr/bin/google-chrome-stable',headless=True,locale='es-AR',timezone_id='America/Argentina/Buenos_Aires',viewport={'width':1440,'height':1000},args=['--no-sandbox','--disable-dev-shm-usage'])
              def guard(route,request):
                  if request.method.upper() not in {'GET','HEAD','OPTIONS'}:
                      blocked.append((request.method,urlsplit(request.url).netloc,urlsplit(request.url).path[:80])); return route.abort()
                  return route.continue_()
              ctx.route('**/*',guard)
              page=ctx.pages[0] if ctx.pages else ctx.new_page()
              page.goto(BASE+'/Cotizaciones/Acciones',wait_until='domcontentloaded',timeout=45000); page.wait_for_timeout(1200)
              assert safe_landing(page.url), page.url
              for rt in routes:
                  page.goto(BASE+rt,wait_until='domcontentloaded',timeout=45000); page.wait_for_timeout(1200)
                  assert safe_landing(page.url), page.url
                  data=page.evaluate("""() => [...document.querySelectorAll('table')].slice(0,5).map(t=>({headers:[...t.querySelectorAll('th')].map(x=>x.innerText),rows:[...t.querySelectorAll('tbody tr')].slice(0,15).map(r=>[...r.querySelectorAll('td')].map(x=>x.innerText))}))""")
                  out[rt]=[{'headers':[clean(x) for x in d.get('headers',[])],'rows':[[clean(v) for v in row] for row in d.get('rows',[])]} for d in data]
              ctx.close()
          print('DOM_IDENTITY_SAMPLES='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('BLOCKED_NONREAD='+str(len(blocked)))
          print('REAL_ORDERS_SENT=0')
          PY
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}')
          PY
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'RUNTIME_CHANGED=NO'
          echo 'W12_UNMATCHED_IDENTITY_DIAG=GREEN'
          REMOTE
