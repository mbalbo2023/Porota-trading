name: RC6 fixed-income nominal contract validation 2026-09-07
on:
  push:
    branches: [feature/rc6-fixed-income-nominal-units-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_fixed_income_nominal_contract_rc6.py
      - run: python -m py_compile fe_fixed_income_nominal_contract_rc6.py
      - run: python -c "import fe_fixed_income_nominal_contract_rc6 as m; m.assert_shadow_only(); print('NOMINAL_CONTRACT_SHADOW=GREEN')"
