name: RC6 PPI shadow discovery completeness audit 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-shadow-discovery-completeness-audit-20260912.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for shadow evidence then audit saturation
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = 'eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a' || { echo 'ABORT=HOST_SHA_MISMATCH'; exit 31; }

          ready=0
          for _ in $(seq 1 150); do
            count="$(sudo -n docker exec porota_production_observer python -c "import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);x=c.execute(\"select count(*) from sqlite_master where type='table' and name='ppi_full_discovery_queries'\").fetchone()[0];print(c.execute('select count(*) from ppi_full_discovery_queries').fetchone()[0] if x else 0);c.close()" 2>/dev/null || echo 0)"
            if [ "$count" -gt 0 ] 2>/dev/null; then
              echo "QUERY_EVIDENCE_READY=$count"
              ready=1
              break
            fi
            sleep 20
          done
          test "$ready" = 1 || { echo 'ABORT=DISCOVERY_EVIDENCE_NOT_READY'; exit 32; }

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json,sqlite3
          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'SAFETY={s[0]}|{s[1]}')
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          run=c.execute('select run_id,max(observed_at) at from ppi_full_discovery_queries group by run_id order by at desc limit 1').fetchone()['run_id']
          print('AUDIT_RUN_ID='+run)
          print('=== QUERY_DISTRIBUTION_BY_REQUESTED_TYPE ===')
          for r in c.execute('''select requested_type,count(*) queries,
              sum(case when status='OK' then 1 else 0 end) ok,
              sum(case when status='EMPTY' then 1 else 0 end) empty,
              sum(case when status='ERROR' then 1 else 0 end) errors,
              sum(normalized_records) records,max(normalized_records) max_query,
              avg(case when normalized_records>0 then normalized_records end) avg_nonempty
            from ppi_full_discovery_queries where run_id=? group by requested_type order by requested_type''',(run,)):
              print(json.dumps(dict(r),sort_keys=True))
          print('=== TOP_QUERY_COUNTS ===')
          for r in c.execute('''select requested_type,ticker_query,name_query,market_query,status,normalized_records,detail
            from ppi_full_discovery_queries where run_id=? order by normalized_records desc limit 40''',(run,)):
              print(json.dumps(dict(r),sort_keys=True))
          print('=== SHADOW_BY_RETURNED_TYPE ===')
          for r in c.execute('''select instrument_type,count(*) identities,count(distinct ticker) tickers,
            group_concat(distinct market) markets from ppi_full_discovery_shadow group by instrument_type order by instrument_type'''):
              print(json.dumps(dict(r),sort_keys=True))
          c.close()
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          PY
          HOST
