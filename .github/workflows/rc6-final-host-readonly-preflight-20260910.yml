name: RC6 Final Host Readonly Preflight 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-final-host-readonly-preflight-20260910.yml

permissions:
  contents: read

jobs:
  host-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_preflight"
          chmod 600 "$HOME/.ssh/porota_preflight"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only host runtime and W12 final gate
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_preflight" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          CANDIDATE_SHA=e47eeffcb94a9468ac7e7f610beee0869353a77e
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          echo '=== RC6 FINAL READONLY HOST PREFLIGHT V3 ==='
          echo "FUNCTIONAL_CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HOST_BRANCH=$(git -C "$REPO" branch --show-current)"
          echo "HOST_SHA=$(git -C "$REPO" rev-parse HEAD)"
          echo "HOST_TRACKED_DIRTY=$(git -C "$REPO" diff --name-only | wc -l | tr -d ' ')"
          echo "HOST_STAGED_DIRTY=$(git -C "$REPO" diff --cached --name-only | wc -l | tr -d ' ')"
          echo "HOST_DIRTY_COUNT=$(git -C "$REPO" status --porcelain | wc -l | tr -d ' ')"
          echo 'HOST_DIRTY_TOP_BEGIN'
          git -C "$REPO" status --porcelain | head -30 || true
          echo 'HOST_DIRTY_TOP_END'

          DISK_FREE="$(df -PB1 "$REPO" | awk 'NR==2{print $4}')"
          echo "DISK_FREE_BYTES=$DISK_FREE"
          test "$DISK_FREE" -ge 8589934592

          OBS="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)"
          DASH="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)"
          echo "CONTAINER_porota_production_observer=$OBS"
          echo "CONTAINER_porota_production_dashboard=$DASH"
          test "$OBS" = "true|$TARGET_IMAGE|0|true"
          test "$DASH" = "true|$TARGET_IMAGE|0"

          HEALTH="$(curl -fsS http://127.0.0.1:8000/health)"
          echo "HEALTH=$HEALTH"
          python3 - "$HEALTH" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x.get('status')=='ok',x
          assert x.get('version')=='17.0.0-rc6',x
          PY

          echo 'OBSERVER_MOUNTS_BEGIN'
          sudo -n docker inspect porota_production_observer --format '{{range .Mounts}}{{println .Source "=>" .Destination "RW=" .RW}}{{end}}'
          echo 'OBSERVER_MOUNTS_END'
          sudo -n docker inspect porota_production_observer --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/ppi_production.json"}}{{println .RW}}{{end}}{{end}}' | grep -qx 'false'

          SAFETY="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          vals=[]
          row=None
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=10)
              c.execute('PRAGMA query_only=ON')
              vals.append(c.execute('PRAGMA quick_check').fetchone()[0])
              if p.endswith('observer_v17.db'):
                  row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              c.close()
          print('|'.join(map(str,(*vals,*row))))
          PY
          )"
          echo "DB_AND_SAFETY=$SAFETY"
          test "$SAFETY" = 'ok|ok|PRODUCTION_PAPER|0'

          required_timers=(
            porota-contract-evidence-rc6-runtime.timer
            porota-functional-health-rc6.timer
            porota-history-postclose-rc6.timer
            porota-host-general-backup-rc6.timer
            porota-preopen-rc6.timer
            porota-candle-integrity-rc6.timer
            porota-a3-history-daily-rc6.timer
            porota-a3-history-reconcile-rc6.timer
            porota-a3-history-weekend-rc6.timer
          )
          for unit in "${required_timers[@]}"; do
            active="$(sudo -n systemctl is-active "$unit" 2>/dev/null || true)"
            enabled="$(sudo -n systemctl is-enabled "$unit" 2>/dev/null || true)"
            printf 'UNIT=%s|ACTIVE=%s|ENABLED=%s\n' "$unit" "$active" "$enabled"
            test "$active" = active
            test "$enabled" = enabled
          done

          echo "FH_SERVICE_RESULT=$(sudo -n systemctl show porota-functional-health-rc6.service -p Result --value)"
          test "$(sudo -n systemctl show porota-functional-health-rc6.service -p Result --value)" = success

          echo "W12_SCRIPT_EXISTS=$([ -f /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh ] && echo YES || echo NO)"
          test -f /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          test -d /opt/porota-contract-evidence-rc6-runtime

          HOST_CAPTURE="$(find "$REPO/data/contract_evidence/rc6_trusted" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
          test -n "$HOST_CAPTURE"
          echo "LATEST_HOST_CAPTURE=$HOST_CAPTURE"
          stat -c 'LATEST_HOST_CAPTURE_STAT=%a|%u|%g|%s|%y' "$HOST_CAPTURE"
          MODE="$(stat -c '%a' "$HOST_CAPTURE")"
          GID="$(stat -c '%g' "$HOST_CAPTURE")"
          test "$MODE" = 640
          OBS_GID="$(sudo -n docker exec porota_production_observer id -g)"
          test "$GID" = "$OBS_GID"
          REL="${HOST_CAPTURE#"$REPO/data/"}"
          sudo -n docker exec porota_production_observer test -r "/app/data/$REL"
          echo 'W12_CAPTURE_READABLE=YES'

          echo 'MUTATIONS=NONE'
          echo 'RC6_FINAL_HOST_PREFLIGHT=GREEN'
          HOST
