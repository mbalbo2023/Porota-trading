name: RC6 Wave7 Runtime Readiness Audit 2026-09-08
on:
  push:
    branches: [audit/rc6-wave7-runtime-readiness-20260908]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and focused tests
        run: |
          set -euo pipefail
          python -m pip install -q pytest requests
          python -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py es_shadow_binding_contract_rc6.py et_shadow_learning_rc6.py bw_daily_risk.py p_risk_guardian.py
          PYTHONPATH=. python -m pytest -q tests/test_shadow_binding_contract_rc6.py tests/test_shadow_learning_rc6.py tests/test_daily_risk_outbox_v17.py
      - name: Binding persistence inventory
        run: |
          set -euo pipefail
          echo '=== EVENT RISK BINDING INVENTORY ==='
          grep -RniE 'persist|dedup|corrobor|fresh|novel|exposure|binding|shadow|scheduler|disabled' fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py es_shadow_binding_contract_rc6.py et_shadow_learning_rc6.py bw_daily_risk.py p_risk_guardian.py | head -n 350 || true
      - name: Safety gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import fi_event_risk_shadow_rc6 as e, fk_gdelt_shadow_feed_rc6 as g
          e.assert_shadow_only(); g.assert_shadow_only(); print('EVENT_RISK_SHADOW_ONLY=GREEN')
          PY
          ! grep -RniE 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order' fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py es_shadow_binding_contract_rc6.py et_shadow_learning_rc6.py
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo WAVE7_RUNTIME_READINESS_AUDIT=GREEN
