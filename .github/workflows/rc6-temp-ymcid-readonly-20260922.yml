name: TEMP RC6 YMCID PPI readonly

on:
  push:
    branches:
      - audit/rc6-iol-decision-demand-20260921
    paths:
      - .github/workflows/rc6-temp-ymcid-readonly-20260922.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Strict SSH setup
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota" "$HOME/.ssh/known_hosts"

      - name: PPI market reads via Droplet only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "sudo -n docker exec -i porota_production_observer python -" <<'PY'
          import json
          from datetime import date
          import bf_production_paper_observer as observer
          from bd_ppi_readonly_guard import ProductionMarketReader, classify_read_error

          def data(x):
              if isinstance(x, dict): return x
              for n in ("model_dump", "dict", "to_dict"):
                  f=getattr(x,n,None)
                  if callable(f):
                      try:
                          y=f()
                          if isinstance(y,dict): return y
                      except Exception: pass
              return vars(x) if hasattr(x,"__dict__") else {}

          def pick(x, names):
              d={str(k).lower():v for k,v in data(x).items()}
              return {n:d[n.lower()] for n in names if d.get(n.lower()) not in (None,"")}

          reader=None
          try:
              key,secret=observer._secret()
              reader=ProductionMarketReader(key,secret)
              reader.login_once()
              cfg=reader.market_configuration()
              kinds=[str(x) for x in cfg.get("instrument_types",[]) if any(k in str(x).upper() for k in ("BON","OBLIG","NEGOC"))]
              print("PPI_BOND_TYPES="+json.dumps(kinds,ensure_ascii=False))
              if not kinds:
                  print("YMCID=BLOCKED_NO_PPI_BOND_TYPE")
                  raise SystemExit(0)
              kind=next((x for x in kinds if "OBLIG" in x.upper() or "NEGOC" in x.upper()),kinds[0])
              fields=("ticker","type","instrument_type","market","currency","settlement","term","isin","description","nominal_value","unit")
              match=None
              for query_ticker,query_name in (("YMCID","YMCID"),("YMCID","YPF"),("YMCID","YPF Clase XVII"),("YMCID","Obligaciones Negociables"),("YMCI","YPF")):
                  try:
                      result=reader.search_instruments(query_ticker,kind,name=query_name,market="BYMA")
                      found=result if isinstance(result,list) else [result]
                      exact=[x for x in found if str(pick(x,("ticker",)).get("ticker","")).upper()=="YMCID"]
                      print("PPI_SEARCH_VARIANT="+json.dumps({"ticker_query":query_ticker,"name_query":query_name,"rows":len(found),"exact_matches":[pick(x,fields) for x in exact[:2]]},ensure_ascii=False,default=str))
                      if exact:
                          match=exact[0]
                          break
                  except Exception as e:
                      print("PPI_SEARCH_VARIANT_ERROR="+json.dumps({"ticker_query":query_ticker,"name_query":query_name,"error":classify_read_error(e)},ensure_ascii=False))
              if match is None:
                  print("YMCID=BLOCKED_SEARCH_NOT_FOUND")
                  settles=[str(x) for x in cfg.get("settlements",[]) if any(t in str(x).upper() for t in ("24","CI","CONTADO"))][:4]
                  print("PPI_SETTLEMENT_ENUMS="+json.dumps(settles,ensure_ascii=False))
                  for term in settles:
                      for label,fn in (("CURRENT",lambda:reader.current("YMCID",kind,term)),
                                       ("BOOK",lambda:reader.book("YMCID",kind,term))):
                          try:
                              value=fn()
                              print("PPI_"+label+"_BY_ENUM="+json.dumps({"settlement":term,"data":pick(value,("ticker","symbol","type","market","currency","settlement","date","timestamp","price","last","bid","ask","bids","offers","asks","quantity","size","volume"))},ensure_ascii=False,default=str))
                          except Exception as e:
                              print("PPI_"+label+"_BY_ENUM_ERROR="+json.dumps({"settlement":term,"error":classify_read_error(e)},ensure_ascii=False))
                  print("YMCID=BLOCKED_SEARCH_IDENTITY_UNRESOLVED")
                  raise SystemExit(0)
              identity=pick(match,fields)
              settlement=identity.get("settlement") or identity.get("term")
              if not settlement:
                  print("YMCID=BLOCKED_SEARCH_MISSING_SETTLEMENT")
                  raise SystemExit(0)
              print("PPI_IDENTITY="+json.dumps(identity,ensure_ascii=False,default=str))
              for label,fn in (("CURRENT",lambda:reader.current("YMCID",kind,str(settlement))),
                               ("BOOK",lambda:reader.book("YMCID",kind,str(settlement)))):
                  try:
                      x=fn()
                      print("PPI_"+label+"="+json.dumps(pick(x,("ticker","symbol","type","market","currency","settlement","date","timestamp","price","last","bid","ask","bids","offers","asks","quantity","size","volume")),ensure_ascii=False,default=str))
                  except Exception as e: print("PPI_"+label+"_ERROR="+classify_read_error(e))
              try:
                  x=reader.history("YMCID",kind,str(settlement),date(2025,9,22),date(2026,9,21))
                  rows=x if isinstance(x,list) else []
                  last=rows[-1] if rows else {}
                  print("PPI_HISTORY="+json.dumps({"rows":len(rows),"last_date":pick(last,("date","timestamp")),"last_bar":pick(last,("openingprice","open","max","high","min","low","price","close","volume"))},ensure_ascii=False,default=str))
              except Exception as e: print("PPI_HISTORY_ERROR="+classify_read_error(e))
              print("PPI_BOND_ESTIMATE=BLOCKED_MISSING_VERIFIED_RATE_INPUTS")
          finally:
              if reader is not None: reader.close()
          PY
