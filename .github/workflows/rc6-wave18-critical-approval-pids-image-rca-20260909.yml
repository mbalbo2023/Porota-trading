name: RC6 Wave18 Critical Approval PIDs Image RCA 2026-09-09

on:
  push:
    branches:
      - deploy-prep/rc6-wave18-currentbase-20260909
    paths:
      - .github/workflows/rc6-wave18-critical-approval-pids-image-rca-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect pids and image identity
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          C=porota_critical_approval_rc6
          cd /opt/porota-trading
          PRE=$(git rev-parse HEAD)
          echo "RUNTIME_HEAD=$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          CID=$(sudo -n docker inspect -f '{{.Id}}' "$C")
          CIMG=$(sudo -n docker inspect -f '{{.Image}}' "$C")
          TAGIMG=$(sudo -n docker image inspect -f '{{.Id}}' porota-trading-bot:17.0.0-rc6)
          echo "CONTAINER_ID=${CID:0:12}"
          echo "CONTAINER_IMAGE_ID=$CIMG"
          echo "CURRENT_TAG_IMAGE_ID=$TAGIMG"
          [ "$CIMG" = "$TAGIMG" ] && echo 'IMAGE_IDENTITY=CURRENT' || echo 'IMAGE_IDENTITY=STALE'
          sudo -n docker inspect -f 'PIDS_LIMIT={{.HostConfig.PidsLimit}}|MEMORY={{.HostConfig.Memory}}|HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$C"
          sudo -n docker stats --no-stream --format 'STATS={{.Name}}|PIDS={{.PIDs}}|MEM={{.MemUsage}}|CPU={{.CPUPerc}}' "$C" || true
          PID=$(sudo -n docker inspect -f '{{.State.Pid}}' "$C")
          echo "HOST_PID=$PID"
          if [ -r "/proc/$PID/status" ]; then
            awk '/^Threads:/{print "PROCESS_THREADS=" $2}' "/proc/$PID/status"
          fi
          echo '=== UNIT PARAMETERS ==='
          systemctl cat porota-critical-approval-rc6.service --no-pager | grep -E -- '^(ExecStart=|Restart=|RestartSec=|MemoryMax=|TasksMax=)' | sed -E 's#(/run/secrets/)[^ ]+#\1[REDACTED]#g' || true
          echo '=== SIMPLE EXEC CANARY ==='
          set +e
          sudo -n docker exec "$C" /bin/true
          RC=$?
          set -e
          echo "SIMPLE_EXEC_RC=$RC"
          echo '=== CURRENT RELEASE ==='
          readlink -f /opt/porota-control-plane-rc6/current || true
          test "$(git rev-parse HEAD)" = "$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'HOST_MUTATION=NO'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RC6_W18_PIDS_IMAGE_RCA=GREEN'
          REMOTE
