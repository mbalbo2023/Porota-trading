name: RC6 Wave11 Controlled Shadow Deploy 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave11-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave11-controlled-shadow-deploy-20260909.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CERTIFIED_SHA: 20192099cc2b9be93f46fcce8d7a4fd4e226c32d
      EXPECTED_LIVE_SHA: 9197aedf35fe1739b594c742902e80df069c47c9
    steps:
      - uses: actions/checkout@v4
      - name: Revalidate certified Wave11 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$CERTIFIED_SHA"
          git checkout --detach "$CERTIFIED_SHA"
          python -m pip install -q pytest requests
          python -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
          PYTHONPATH=. pytest -q tests/test_event_risk_shadow_rc6.py tests/test_fk_gdelt_shadow_feed_rc6.py
          PYTHONPATH=. python - <<'PY'
          import fi_event_risk_shadow_rc6 as e
          e.assert_shadow_only()
          print('EVENT_RISK=SHADOW_ONLY_PROVEN')
          PY
          ! grep -REn 'send_order|place_order|cancel_order|api/Orders|/Operar/|Budget|Confirm|Cancel' fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
          echo "VALIDATION=GREEN"
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w11deploy"
          chmod 600 "$HOME/.ssh/w11deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Strict preflight and controlled shadow deploy
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w11deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "CERTIFIED_SHA='$CERTIFIED_SHA' EXPECTED_LIVE_SHA='$EXPECTED_LIVE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = "$EXPECTED_LIVE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          OBS_BEFORE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH_BEFORE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          echo "OBSERVER_PRE=$OBS_BEFORE"
          echo "DASHBOARD_PRE=$DASH_BEFORE"
          case "$OBS_BEFORE" in *'|true|0') ;; *) echo 'OBSERVER_PRE=RED'; exit 31;; esac
          case "$DASH_BEFORE" in *'|true|0') ;; *) echo 'DASHBOARD_PRE=RED'; exit 32;; esac
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PREFLIGHT_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          git fetch --no-tags origin "$CERTIFIED_SHA"
          test "$(git cat-file -t "$CERTIFIED_SHA")" = commit
          git checkout --detach "$CERTIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          python3 -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
          echo 'DEPLOY=SHADOW_SOURCE_ACTIVATED'
          echo 'RUNTIME_RESTART=NOT_REQUIRED_SHADOW_ONLY'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'AUTO_ROLLBACK=NO'
          REMOTE
      - name: Strict postflight
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w11deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "CERTIFIED_SHA='$CERTIFIED_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          OBS=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          echo "OBSERVER_POST=$OBS"
          echo "DASHBOARD_POST=$DASH"
          case "$OBS" in *'|true|0') ;; *) exit 41;; esac
          case "$DASH" in *'|true|0') ;; *) exit 42;; esac
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POSTFLIGHT_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'W11_DEPLOY=GREEN'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'AUTO_ROLLBACK=NO'
          REMOTE