name: RC6 W12 Fresh Import Green Proof 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-fresh-import-green-proof-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert immutable RC6 safety
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Prove current W12 capture and DB freshness without execution
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OUT="$ROOT/data/contract_evidence/rc6_trusted"
          DB="$ROOT/data/paper_v17/observer_v17.db"
          echo '=== SERVICE ==='
          sudo -n systemctl show porota-contract-evidence-rc6.service -p ExecMainStatus -p Result -p ActiveState -p InactiveExitTimestamp --no-pager
          echo '=== TIMER ==='
          sudo -n systemctl show porota-contract-evidence-rc6.timer -p ActiveState -p SubState -p NextElapseUSecRealtime --no-pager
          echo '=== LATEST_CAPTURE ==='
          LATEST="$(sudo -n find "$OUT" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)"
          sudo -n python3 - "$LATEST" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          print('CAPTURE_FILE='+p.name)
          print('CAPTURE_MTIME_NS='+str(p.stat().st_mtime_ns))
          for k in ('schema','auth_status','generated_at','real_orders_sent'):
              print('CAPTURE_'+k.upper()+'='+str(d.get(k)))
          for k in ('routes','endpoints','jobs','blocked_nonread'):
              v=d.get(k); print('CAPTURE_'+k.upper()+'_COUNT='+str(len(v) if isinstance(v,(list,dict)) else -1))
          PY
          echo '=== DB_FRESHNESS ==='
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          db=sys.argv[1]
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          c.execute('PRAGMA query_only=ON')
          tables=['contract_evidence_v2','contract_snapshots','contract_evidence_v2_runs','intraday_contract_state']
          for t in tables:
              try:
                  n=c.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                  cols=[r[1] for r in c.execute(f'PRAGMA table_info({t})')]
                  print(f'TABLE={t}|COUNT={n}|COLS='+','.join(cols))
                  for col in ('updated_at','generated_at','created_at','captured_at','as_of','timestamp','ts','run_at'):
                      if col in cols:
                          mx=c.execute(f'SELECT MAX({col}) FROM {t}').fetchone()[0]
                          print(f'TABLE={t}|MAX_{col.upper()}={mx}')
              except Exception as e:
                  print(f'TABLE={t}|ERROR={type(e).__name__}')
          try:
              r=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              print('OBSERVER_MODE='+str(r[0] if r else None))
              print('REAL_ORDERS_SENT='+str(r[1] if r else None))
          except Exception as e: print('OBSERVER_STATE_ERROR='+type(e).__name__)
          c.close()
          PY
          echo '=== CURRENT_RUNTIME_STATE ==='
          sudo -n python3 - "$OUT/runtime_state.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.is_file(): print('RUNTIME_STATE=MISSING'); raise SystemExit
          d=json.loads(p.read_text(encoding='utf-8'))
          for k in ('state','status','blocked_at','retry_after_seconds','auth_status','real_orders_sent','updated_at','generated_at'):
              if k in d: print(k.upper()+'='+str(d.get(k)))
          PY
          echo MUTATIONS=NONE
          echo COLLECTOR_EXECUTED_BY_THIS_PROOF=NO
          echo ORDER_ROUTES=NOT_CALLED_BY_THIS_PROOF
          HOST