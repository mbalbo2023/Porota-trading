name: RC6 Wave12 Materialize Reauth Fix 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/rc6-wave12-materialize-reauth-fix-20260909.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize selected W12 sources
        run: |
          set -euo pipefail
          git fetch --no-tags origin feature/rc6-dom-expected-universe-reconciler-20260908 hotfix/rc6-contract-evidence-auto-reauth-20260907
          for f in rc6_contract_capture_importer.py rc6_contract_due_job.py rc6_contract_schedule.py rc6_ppi_contract_normalizer.py rc6_trusted_browser_contract_collector.py requirements-contract-evidence.txt scripts/porota_contract_evidence_rc6_runtime.sh systemd/porota-contract-evidence-rc6.service systemd/porota-contract-evidence-rc6.timer tests/test_contract_evidence_rc6_native.py tests/test_contract_evidence_reauth_wiring_rc6.py; do
            mkdir -p "$(dirname "$f")"
            git show origin/feature/rc6-dom-expected-universe-reconciler-20260908:"$f" > "$f"
          done
          git show origin/hotfix/rc6-contract-evidence-auto-reauth-20260907:rc6_ppi_web_reauth.py > rc6_ppi_web_reauth.py
          git show origin/hotfix/rc6-contract-evidence-auto-reauth-20260907:tests/test_ppi_web_reauth_rc6.py > tests/test_ppi_web_reauth_rc6.py
      - name: Rebuild latest-safe helper policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rc6_ppi_web_reauth.py')
          s=p.read_text()
          old='APPROVED_AUTH_POSTS = {("cuenta.portfoliopersonal.com", "/login")}\n'
          assert old in s
          new='APPROVED_AUTH_POSTS = {("cuenta.portfoliopersonal.com", "/login"), ("api.portfoliopersonal.com", "/api/Seguridad/Auth/Login")}\nIGNORED_BLOCKED_POST_HOSTS = {"px.ads.linkedin.com", "metrics.hotjar.io", "l.clarity.ms"}\n'
          s=s.replace(old,new,1)
          old2='''                if method == "POST" and key in APPROVED_AUTH_POSTS:\n                    return route.continue_()\n                blocked_post_path = clean_host_path(request.url)\n                return route.abort()\n'''
          assert old2 in s
          new2='''                if method == "POST" and key in APPROVED_AUTH_POSTS:\n                    return route.continue_()\n                if method == "POST" and u.netloc in IGNORED_BLOCKED_POST_HOSTS:\n                    return route.abort()\n                blocked_post_path = clean_host_path(request.url)\n                return route.abort()\n'''
          p.write_text(s.replace(old2,new2,1))
          PY
          python3 -m py_compile rc6_ppi_web_reauth.py
          sha256sum rc6_ppi_web_reauth.py
      - name: Fix latent errexit bug in collect_once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/porota_contract_evidence_rc6_runtime.sh')
          s=p.read_text()
          old='''  local rc=$?\n  set -e\n  [[ -f "$STAGE_CAPTURE" ]] || fail_closed COLLECTOR_CAPTURE_MISSING\n  return "$rc"\n'''
          new='''  local rc=$?\n  if [[ ! -f "$STAGE_CAPTURE" ]]; then\n    set -e\n    fail_closed COLLECTOR_CAPTURE_MISSING\n  fi\n  # Keep errexit disabled until the caller captures rc. Re-enabling it here\n  # makes return 4 terminate the service before safe reauth can run.\n  return "$rc"\n'''
          assert old in s, 'expected collect_once block not found'
          p.write_text(s.replace(old,new,1))
          PY
          bash -n scripts/porota_contract_evidence_rc6_runtime.sh
      - name: Test W12
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 -m py_compile rc6_contract_capture_importer.py rc6_contract_due_job.py rc6_contract_schedule.py rc6_ppi_contract_normalizer.py rc6_trusted_browser_contract_collector.py rc6_ppi_web_reauth.py
          python3 -m pytest -q tests/test_contract_evidence_rc6_native.py tests/test_contract_evidence_reauth_wiring_rc6.py tests/test_ppi_web_reauth_rc6.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/porota_contract_evidence_rc6_runtime.sh').read_text()
          block=s[s.index('collect_once() {'):s.index('set +e\ncollect_once')]
          assert 'set -e\n  [[ -f "$STAGE_CAPTURE" ]]' not in block
          assert 'return "$rc"' in block
          assert 'BLOCKED_AUTH_SESSION_EXPIRED' in s
          assert 'rc6_ppi_web_reauth.py' in s
          h=Path('rc6_ppi_web_reauth.py').read_text()
          assert 'api.portfoliopersonal.com' in h and 'l.clarity.ms' in h
          print('W12_REAUTH_RC4_HANDOFF=GREEN')
          print('ORDER_ROUTES=NOT_CALLED')
          PY
      - name: Commit materialized code only after tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rc6_contract_capture_importer.py rc6_contract_due_job.py rc6_contract_schedule.py rc6_ppi_contract_normalizer.py rc6_trusted_browser_contract_collector.py rc6_ppi_web_reauth.py requirements-contract-evidence.txt scripts/porota_contract_evidence_rc6_runtime.sh systemd/porota-contract-evidence-rc6.service systemd/porota-contract-evidence-rc6.timer tests/test_contract_evidence_rc6_native.py tests/test_contract_evidence_reauth_wiring_rc6.py tests/test_ppi_web_reauth_rc6.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rc6 wave12): preserve collector rc for safe reauth handoff'
          git push origin HEAD:deploy-prep/rc6-wave12-currentbase-20260909
