name: RC6 historical raw ingest trigger audit

on:
  push:
    branches:
      - audit/rc6-historical-raw-architecture-20260907
    paths:
      - '.github/workflows/rc6-historical-raw-trigger-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rc6-historical-raw-architecture-20260907
          fetch-depth: 0
      - name: Prepare SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Trace triggers
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          REPORT='POROTA_RC6_HISTORICAL_RAW_TRIGGER_AUDIT_2026-09-07.txt'
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' > "$REPORT" <<'REMOTE'
          set -u
          REPO=/opt/porota-trading
          DB="$REPO/data/paper_v17/observer_v17.db"
          C=porota_production_observer
          sep(){ printf '\n======================================================================\n%s\n======================================================================\n' "$1"; }
          echo 'POROTA RC6 HISTORICAL RAW TRIGGER AUDIT — READ ONLY'
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sep '01 EFFECTIVE NONSECRET CONTAINER CONFIG'
          sudo -n docker inspect "$C" | python3 - <<'PY'
          import json,sys
          o=json.load(sys.stdin)[0]
          env={x.split('=',1)[0]:x.split('=',1)[1] if '=' in x else '' for x in o.get('Config',{}).get('Env',[])}
          keys=['PPI_BACKGROUND_INGEST_SECONDS','PPI_HISTORY_BATCH_LIMIT','SERVER_TIMEZONE','MARKET_OPEN_HOUR','MARKET_OPEN_MINUTE','MARKET_CLOSE_HOUR','MARKET_CLOSE_MINUTE','PAPER_COMMAND_POLL_SECONDS']
          for k in keys: print(f'{k}={env.get(k,"<unset>")}')
          PY
          sep '02 CODE TRIGGER MAP'
          git -C "$REPO" grep -n -I -E 'LOGIN_AND_SYNC|_download_histories\(|_background_ingest\(|PPI_BACKGROUND_INGEST_SECONDS|PPI_HISTORY_BATCH_LIMIT' -- '*.py' '*.sh' '*.yml' '*.yaml' 2>/dev/null || true
          sep '03 RECENT RAW WRITES BY UTC HOUR'
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True,timeout=15); c.execute('PRAGMA query_only=ON'); c.execute('PRAGMA temp_store=MEMORY')
          rows=c.execute("SELECT substr(recorded_at,1,13) hour,count(*) FROM historical_raw_archive WHERE recorded_at>='2026-09-05' GROUP BY hour ORDER BY hour").fetchall()
          for h,n in rows: print(f'HOUR hour={h} rows={n}')
          print('HOURS_WITH_WRITES='+str(len(rows)))
          if rows: print(f'ROWS_PER_ACTIVE_HOUR_MIN={min(n for _,n in rows)} MAX={max(n for _,n in rows)} AVG={sum(n for _,n in rows)/len(rows):.2f}')
          # Identify command/event tables without assuming schema.
          for name,sql in c.execute("SELECT name,sql FROM sqlite_master WHERE type='table' AND (name LIKE '%command%' OR name LIKE '%event%') ORDER BY name"):
              print(f'TABLE_SCHEMA name={name} sql={str(sql).replace(chr(10)," ")}')
          c.close()
          PY
          sep '04 SYSTEMD/CRON REFERENCES TO SYNC COMMAND'
          sudo -n grep -R -n -E 'LOGIN_AND_SYNC|background.*ingest|history.*ingest|PPI_PRODUCTION_HISTORY' /etc/systemd/system /etc/cron.d /etc/crontab /home/porotaadmin/.config/systemd 2>/dev/null || true
          sep '05 SAFETY'
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True,timeout=15); c.execute('PRAGMA query_only=ON')
          r=c.execute('SELECT mode,session_state,real_orders_sent FROM observer_state WHERE id=1').fetchone(); c.close(); print('OBSERVER_STATE='+('|'.join(map(str,r)) if r else 'MISSING'))
          PY
          echo 'MUTATIONS=NONE'
          echo 'AUDIT_STATUS=COMPLETE_READ_ONLY'
          REMOTE
          test -s "$REPORT"
      - name: Publish evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT='POROTA_RC6_HISTORICAL_RAW_TRIGGER_AUDIT_2026-09-07.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'audit(rc6): record historical raw trigger evidence'
          git push origin HEAD:audit/rc6-historical-raw-architecture-20260907
