name: RC6 Observer Exit139 RCA Read-Only 2026-09-30
on:
  push:
    branches: [audit/ws-deploy-rca-post-immediate-readonly-20260930]
    paths: ['.github/workflows/rc6-observer-exit139-rca-readonly-20260930.yml']
permissions:
  contents: read
jobs:
  rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Correlate exit139 with process tree and kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DB=/opt/porota-trading/data/paper_v17/observer_v17.db
          echo "RCA139_CONTAINER=$(sudo -n docker inspect -f 'status={{.State.Status}}|started={{.State.StartedAt}}|restarts={{.RestartCount}}|oom={{.State.OOMKilled}}|exit={{.State.ExitCode}}|pid={{.State.Pid}}' porota_production_observer)"
          echo "RCA139_TOP_BEGIN"
          sudo -n docker top porota_production_observer -eo pid,ppid,lstart,etime,stat,cmd || true
          echo "RCA139_TOP_END"
          echo "RCA139_KERNEL_BEGIN"
          sudo -n journalctl -k --since '2026-09-30 14:38:00 UTC' --until '2026-09-30 14:46:30 UTC' --no-pager 2>/dev/null | grep -Ei 'segfault|oom|killed process|python|docker|memory' || true
          echo "RCA139_KERNEL_END"
          echo "RCA139_DOCKER_EVENTS_BEGIN"
          sudo -n journalctl -u docker.service --since '2026-09-30 14:38:00 UTC' --until '2026-09-30 14:46:30 UTC' --no-pager 2>/dev/null | grep -Ei 'd66c184|exitCode|restart|kill|die|oom' || true
          echo "RCA139_DOCKER_EVENTS_END"
          echo "RCA139_LOG_CONTEXT_BEGIN"
          sudo -n docker logs --since '2026-09-30T14:39:50Z' --until '2026-09-30T14:45:10Z' --timestamps porota_production_observer 2>&1 | tail -n 1000 || true
          echo "RCA139_LOG_CONTEXT_END"
          SAFETY="$(sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=3); c.execute("PRAGMA query_only=ON")
          r=c.execute("select mode,real_orders_sent from observer_state where id=1").fetchone(); c.close()
          print(f"{r[0]}|{int(r[1] or 0)}")
          PY
          )"
          echo "RCA139_SAFETY=$SAFETY"; test "$SAFETY" = 'PRODUCTION_PAPER|0'
          echo "RCA139_READ_ONLY=GREEN"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
