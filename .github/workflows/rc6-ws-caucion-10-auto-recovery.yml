name: RC6 WS CAUCION 10 Auto Recovery

on:
  push:
    branches:
      - work/ws-caucion-10-auto-recovery-20261001
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_HOST: ${{ secrets.DO_HOST }}
  DO_USER: ${{ secrets.DO_USER }}
  SSH_KEY: ${{ secrets.DO_SSH_KEY }}
  KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: PAPER guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          python - <<'PY'
          import di_caucion_cash_sweep_runtime_hf6 as m
          assert m.CASH_SWEEP_ORDER_ROUTING_ALLOWED is False
          print("CAUCION_REAL_ROUTING=BLOCKED")
          PY
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run caucion regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          files="$(find tests -maxdepth 1 -type f -iname '*caucion*.py' -print)"
          test -n "$files"
          PYTHONPATH=. pytest -q $files tests/test_ws_caucion_10_auto_recovery.py
          echo WS_CAUCION_10_REGRESSION=GREEN

  runtime-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Read-only caucion snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' > evidence/caucion-runtime.txt <<'REMOTE'
          set -Eeuo pipefail
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, sqlite3
          from cg_paper_workspace import database_path
          db=database_path()
          c=sqlite3.connect(f"file:{db}?mode=ro",uri=True,timeout=5)
          c.row_factory=sqlite3.Row
          c.execute("PRAGMA query_only=ON")
          tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          out={}
          out["observer"]=dict(c.execute("SELECT mode,real_orders_sent,process_state,session_state,heartbeat_at FROM observer_state WHERE id=1").fetchone())
          if "paper_caucion_cash_sweep_state" in tables:
              row=c.execute("SELECT * FROM paper_caucion_cash_sweep_state WHERE id=1").fetchone()
              out["worker"]=dict(row) if row else None
          out["catalog"]=[dict(r) for r in c.execute("""SELECT status,COUNT(*) n,MAX(last_seen_at) as_of
              FROM financial_instrument_catalog WHERE upper(instrument_type)='CAUCIONES'
              GROUP BY status ORDER BY status""")] if "financial_instrument_catalog" in tables else []
          out["candidates"]=[dict(r) for r in c.execute("""SELECT status,can_simulate,COUNT(*) n,MAX(last_checked_at) as_of
              FROM candidate_identity_v2 WHERE upper(instrument_type)='CAUCIONES'
              GROUP BY status,can_simulate ORDER BY status,can_simulate""")] if "candidate_identity_v2" in tables else []
          out["evidence"]=[dict(r) for r in c.execute("""SELECT source_class,COUNT(*) n,MIN(observed_at) oldest,MAX(observed_at) newest
              FROM contract_evidence_v2_current WHERE upper(family)='CAUCIONES'
              GROUP BY source_class ORDER BY source_class""")] if "contract_evidence_v2_current" in tables else []
          out["allocations"]=c.execute("SELECT COUNT(*) FROM paper_caucion_allocations").fetchone()[0] if "paper_caucion_allocations" in tables else 0
          out["positions"]=c.execute("SELECT COUNT(*) FROM paper_cauciones").fetchone()[0] if "paper_cauciones" in tables else 0
          print("CAUCION_RUNTIME="+json.dumps(out,ensure_ascii=False,sort_keys=True,separators=(",",":"),default=str))
          assert out["observer"]["mode"]=="PRODUCTION_PAPER"
          assert int(out["observer"]["real_orders_sent"] or 0)==0
          if out.get("worker"):
              assert out["worker"].get("routes_json") in ("[]", None)
              assert int(out["worker"].get("real_orders_sent") or 0)==0
          c.close()
          PY
          echo "REAL_ORDERS_SENT=0|REAL_ROUTES=NOT_CALLED"
          echo "PPI_WATCH_UNTOUCHED=GREEN"
          REMOTE
          cat evidence/caucion-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws-caucion-10-runtime
          path: evidence/caucion-runtime.txt
          if-no-files-found: error
      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/key"
