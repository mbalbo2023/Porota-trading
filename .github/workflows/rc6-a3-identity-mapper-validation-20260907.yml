name: RC6 A3 identity mapper validation 2026-09-07
on:
  push:
    branches: [feature/rc6-a3-identity-mapper-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_a3_identity_mapper_rc6.py
      - run: python -m py_compile fd_a3_identity_mapper_rc6.py
      - name: Prove offline module contract
        run: python -c "import fd_a3_identity_mapper_rc6 as m; m.assert_shadow_only(); print('A3_MAPPER_OFFLINE=GREEN')"
