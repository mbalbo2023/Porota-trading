name: RC6 candle intramarket evidence tests

on:
  push:
    paths:
      - "scripts/rc6_candle_inmarket_evidence.py"
      - "tests/test_rc6_candle_inmarket_evidence.py"
      - "ops/porota-rc6-candle-inmarket-verify"
      - "ops/systemd/porota-rc6-candle-inmarket-verify.*"
      - ".github/workflows/rc6-candle-inmarket-evidence-tests.yml"
  pull_request:
    paths:
      - "scripts/rc6_candle_inmarket_evidence.py"
      - "tests/test_rc6_candle_inmarket_evidence.py"
      - "ops/porota-rc6-candle-inmarket-verify"
      - "ops/systemd/porota-rc6-candle-inmarket-verify.*"
      - ".github/workflows/rc6-candle-inmarket-evidence-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only evidence contract
        run: python -m unittest tests/test_rc6_candle_inmarket_evidence.py
      - name: Verify host wrapper has no PPI or order route
        run: |
          set -Eeuo pipefail
          test -s ops/porota-rc6-candle-inmarket-verify
          ! grep -Eqi 'ppi|order|history|postclose|curl|wget' ops/porota-rc6-candle-inmarket-verify
