name: RC6 Event Risk GDELT Shadow Feed Validate 2026-09-08

on:
  push:
    branches:
      - feature/rc6-event-risk-gdelt-shadow-feed-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile modules
        run: python -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_fi_event_risk_shadow_rc6.py tests/test_fk_gdelt_shadow_feed_rc6.py
      - name: Enforce SHADOW isolation
        run: |
          ! grep -nEi 'ppi_client|budget_order|confirm_order|cancel_order|send_order|telegram|sqlite3|docker|subprocess' fk_gdelt_shadow_feed_rc6.py
          grep -q 'allow_redirects=False' fk_gdelt_shadow_feed_rc6.py
          grep -q 'TIER_C_SINGLE_SOURCE' fk_gdelt_shadow_feed_rc6.py
          echo 'EVENT_RISK_GDELT_SHADOW_SAFETY=GREEN'
