name: RC6 Scraping Ingestion Live Proof V3 2026-09-09

on:
  push:
    branches: [diag/rc6-scraping-ingestion-live-20260909]
    paths: ['.github/workflows/rc6-scraping-ingestion-live-proof-v3-20260909.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read only host proof
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OUT="$ROOT/data/contract_evidence/rc6_trusted"
          echo "NOW_UTC=$(date -u +%FT%TZ)"
          echo "HOST_HEAD=$(git -C "$ROOT" rev-parse HEAD)"
          echo "TIMER_ACTIVE=$(systemctl is-active porota-contract-evidence-rc6.timer 2>/dev/null || true)"
          echo "TIMER_ENABLED=$(systemctl is-enabled porota-contract-evidence-rc6.timer 2>/dev/null || true)"
          echo "SERVICE_ACTIVE=$(systemctl is-active porota-contract-evidence-rc6.service 2>/dev/null || true)"
          systemctl show porota-contract-evidence-rc6.timer --no-pager -p ActiveState -p SubState -p LastTriggerUSec -p NextElapseUSecRealtime 2>/dev/null | sed 's/^/TIMER_SHOW=/' || true
          systemctl show porota-contract-evidence-rc6.service --no-pager -p ActiveState -p SubState -p Result -p ExecMainStatus 2>/dev/null | sed 's/^/SERVICE_SHOW=/' || true
          echo "OUTDIR=$([[ -d "$OUT" ]] && echo YES || echo NO)"
          if [[ -d "$OUT" ]]; then
            echo "CAPTURE_COUNT=$(find "$OUT" -maxdepth 1 -type f -name 'contract_*.json' | wc -l)"
            latest=$(find "$OUT" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2- || true)
            if [[ -n "$latest" ]]; then
              echo "LATEST_CAPTURE_BASENAME=$(basename "$latest")"
              echo "LATEST_CAPTURE_MTIME=$(date -u -d @$(stat -c %Y "$latest") +%FT%TZ)"
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); routes=d.get("routes") or []; eps=d.get("endpoints") or {}; kinds={}; [kinds.__setitem__(str(v.get("kind") or "UNKNOWN"),kinds.get(str(v.get("kind") or "UNKNOWN"),0)+1) for v in eps.values() if isinstance(v,dict)]; print("LATEST_AUTH="+str(d.get("auth_status"))); print("LATEST_GENERATED_AT="+str(d.get("generated_at"))); print("LATEST_JOBS="+",".join(map(str,d.get("jobs") or []))); print("LATEST_ROUTES="+str(len(routes))+"|REACHED="+str(sum(1 for x in routes if isinstance(x,dict) and x.get("reached")))); print("LATEST_ENDPOINTS="+str(len(eps))+"|KINDS="+( ",".join(k+":"+str(v) for k,v in sorted(kinds.items())) if kinds else "NONE")); print("LATEST_BLOCKED_NONREAD="+str(len(d.get("blocked_nonread") or []))); print("LATEST_REAL_ORDERS_SENT="+str(d.get("real_orders_sent")))' "$latest"
            else
              echo LATEST_CAPTURE=NONE
            fi
            if [[ -s "$OUT/runtime_state.json" ]]; then
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print("RUNTIME_STATE="+str(d.get("state"))+"|BLOCKED_AT="+str(d.get("blocked_at"))+"|RETRY="+str(d.get("retry_after_seconds")))' "$OUT/runtime_state.json"
            else
              echo RUNTIME_STATE=NONE
            fi
          fi
          sudo -n docker exec -i porota_production_observer python -c 'import sqlite3,os; c=sqlite3.connect("file:/app/data/paper_v17/observer_v17.db?mode=ro",uri=True,timeout=20); c.execute("pragma query_only=on"); print("DB_QUICK_CHECK="+str(c.execute("pragma quick_check").fetchone()[0])); r=c.execute("select mode,process_state,session_state,ppi_auth,real_orders_sent,last_market_data_at from observer_state where id=1").fetchone(); print("RUNTIME="+"|".join(map(str,r))); tables=[x[0] for x in c.execute("select name from sqlite_master where type=\"table\" and (lower(name) like \"%contract%\" or lower(name) like \"%evidence%\") order by name")]; print("CONTRACT_TABLES="+( ",".join(tables) if tables else "NONE")); [print("TABLE="+t+"|ROWS="+str(c.execute("select count(*) from \""+t.replace("\"","\"\"")+"\"").fetchone()[0])) for t in tables]; print("RAW_STORAGE_MODE="+str(os.getenv("PPI_HISTORY_RAW_STORAGE_MODE"))); c.close()'
          echo RUNTIME_MUTATION=NO
          echo ORDER_ROUTES=NOT_CALLED
          echo REAL_ORDER_TEST=NOT_PERFORMED
          REMOTE
