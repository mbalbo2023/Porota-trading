name: RC6 Wave18 Materialize Safe Control Plane V2 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave18-currentbase-20260909]
    paths: [.github/workflows/rc6-wave18-materialize-safe-control-plane-v2-20260909.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize selected control-plane components
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin closure/rc6-critical-control-plane-20260907 control-plane/rc6-critical-approval-canonical-20260907 hotfix/rc6-control-plane-broker-permissions-issue-41
          for f in fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py tests/test_critical_approval_gateway_rc6.py tests/test_critical_github_proxy_rc6.py; do
            if git cat-file -e "origin/hotfix/rc6-control-plane-broker-permissions-issue-41:$f" 2>/dev/null; then
              git show "origin/hotfix/rc6-control-plane-broker-permissions-issue-41:$f" > "$f"
            elif git cat-file -e "origin/control-plane/rc6-critical-approval-canonical-20260907:$f" 2>/dev/null; then
              git show "origin/control-plane/rc6-critical-approval-canonical-20260907:$f" > "$f"
            elif git cat-file -e "origin/closure/rc6-critical-control-plane-20260907:$f" 2>/dev/null; then
              git show "origin/closure/rc6-critical-control-plane-20260907:$f" > "$f"
            fi
          done
          mkdir -p ops
          git show origin/closure/rc6-critical-control-plane-20260907:ops/rc6_deploy_critical_control_plane.sh > ops/rc6_deploy_critical_control_plane.sh
          chmod +x ops/rc6_deploy_critical_control_plane.sh
      - name: Safety and regression gate
        run: |
          set -Eeuo pipefail
          python -m pip install -q pytest
          python -m py_compile fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py
          PYTHONPATH=. pytest -q tests/test_critical_approval_gateway_rc6.py tests/test_critical_github_proxy_rc6.py
          ! grep -REn '(/Operar|api/Orders|send_order|place_order|new_order|REAL_ORDER)' fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py
          # Current RC6 policy: no automatic rollback. A deploy script containing
          # an error trap that mutates/removes runtime is not deploy-ready.
          if grep -En 'CONTROL_PLANE_ROLLBACK|trap[[:space:]]+cleanup[[:space:]]+EXIT|rm -f .*UNIT|docker rm -f' ops/rc6_deploy_critical_control_plane.sh; then
            echo 'AUTO_ROLLBACK_PRESENT=YES'
            exit 31
          fi
          echo 'ORDER_CAPABILITY_GUARD=GREEN'
          echo 'AUTO_ROLLBACK_PRESENT=NO'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
      - name: Commit materialized files
        run: |
          set -Eeuo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py tests/test_critical_approval_gateway_rc6.py tests/test_critical_github_proxy_rc6.py ops/rc6_deploy_critical_control_plane.sh
          if ! git diff --cached --quiet; then
            git commit -m 'feat(rc6 wave18): materialize safe control-plane package'
            git push origin HEAD:deploy-prep/rc6-wave18-currentbase-20260909
          fi
