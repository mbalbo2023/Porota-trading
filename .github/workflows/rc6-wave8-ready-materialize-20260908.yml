name: RC6 Wave8 READY materialize 2026-09-08
on:
  push:
    branches: [deploy-prep/rc6-wave8-ready-20260908]
    paths: ['.github/workflows/rc6-wave8-ready-materialize-20260908.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Overlay Wave8 on deployed Wave4 baseline and validate
        run: |
          set -euo pipefail
          git fetch origin integration/rc6-wave8-learning-ux-20260908
          OLD=860b26ca22a73679217e8953207041da2b8afffd
          SRC=origin/integration/rc6-wave8-learning-ux-20260908
          git diff --name-only --diff-filter=ACMRT "$OLD..$SRC" > /tmp/files
          while IFS= read -r f; do [ -z "$f" ] || git checkout "$SRC" -- "$f"; done < /tmp/files
          git diff --name-only --diff-filter=D "$OLD..$SRC" > /tmp/deleted
          while IFS= read -r f; do [ -z "$f" ] || rm -f -- "$f"; done < /tmp/deleted
          grep -q 'ppi-client==1.3.0' requirements.txt
          test -f rc6_trusted_browser_contract_collector.py
          test -f fa_raw_evidence_store_rc6.py
          python -m pip install -q pytest
          python -m py_compile ch_empirical_learning.py s_learning_engine.py et_shadow_learning_rc6.py ec_forward_lab_metrics_hf2.py ei_dashboard_table_accessibility_rc5.py eq_dashboard_table_layout_rc6.py er_dashboard_table_semantics_rc6.py da_dashboard_ux_hf6.py
          PYTHONPATH=. python -m pytest -q tests/test_shadow_learning_rc6.py tests/test_forward_lab_metrics_hf2.py tests/test_dashboard_global_a11y_rc5.py tests/test_dashboard_table_layout_rc6.py
          ! git diff HEAD -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          echo AUTO_REAL_MONEY_PROMOTION=NO
          echo WAVE8_READY_FOR_DEPLOY=GREEN
      - name: Commit materialized candidate
        run: |
          set -euo pipefail
          git config user.name 'porota-ci'
          git config user.email 'porota-ci@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'candidate(rc6): materialize Wave8 on deployed Wave4 baseline'
          git push origin HEAD:deploy-prep/rc6-wave8-ready-20260908
