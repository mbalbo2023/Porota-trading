name: RC6 Contract Evidence reauth host preflight 2026-09-07
on:
  push:
    branches: [diag/rc6-postclose-live-20260907]
    paths: ['.github/workflows/rc6-ce-reauth-preflight-20260907.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Check prerequisites without exposing secrets
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SECRET=/etc/porota/contract-evidence-web.env
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          PY=/opt/porota-contract-evidence-venv/bin/python
          echo CE_REAUTH_PREFLIGHT=START
          if sudo -n test -f "$SECRET"; then
            echo PPI_WEB_SECRET_FILE_PRESENT=YES
            sudo -n grep -Eq '^PPI_WEB_USERNAME=.+$' "$SECRET" && echo PPI_WEB_USERNAME_PRESENT=YES || echo PPI_WEB_USERNAME_PRESENT=NO
            sudo -n grep -Eq '^PPI_WEB_PASSWORD=.+$' "$SECRET" && echo PPI_WEB_PASSWORD_PRESENT=YES || echo PPI_WEB_PASSWORD_PRESENT=NO
            sudo -n stat -c 'PPI_WEB_SECRET_OWNER_MODE=%U|%G|%a' "$SECRET"
          else
            echo PPI_WEB_SECRET_FILE_PRESENT=NO
            echo PPI_WEB_USERNAME_PRESENT=NO
            echo PPI_WEB_PASSWORD_PRESENT=NO
          fi
          if [ -d "$PROFILE" ]; then echo PROFILE_PRESENT=YES; stat -c 'PROFILE_OWNER=%U|%G' "$PROFILE"; else echo PROFILE_PRESENT=NO; fi
          if [ -x "$PY" ]; then echo PLAYWRIGHT_VENV=YES; "$PY" -c 'import playwright; print("PLAYWRIGHT_IMPORT=YES")' 2>/dev/null || echo PLAYWRIGHT_IMPORT=NO; else echo PLAYWRIGHT_VENV=NO; fi
          command -v google-chrome-stable >/dev/null 2>&1 && echo CHROME_PRESENT=YES || echo CHROME_PRESENT=NO
          test -f /usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py && echo REAUTH_HELPER_LIVE=YES || echo REAUTH_HELPER_LIVE=NO
          test -f /opt/porota-trading/data/contract_evidence/rc6_trusted/runtime_state.json && echo BACKOFF_STATE_PRESENT=YES || echo BACKOFF_STATE_PRESENT=NO
          echo CE_REAUTH_PREFLIGHT=END
          REMOTE
