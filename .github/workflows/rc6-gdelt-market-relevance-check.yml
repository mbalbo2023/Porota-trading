name: RC6 GDELT market relevance checks
on:
  push:
    branches:
      - fix/rc6-gdelt-market-relevance-20260920
    paths:
      - .github/workflows/rc6-gdelt-market-relevance-check.yml
      - fk_gdelt_shadow_feed_rc6.py
      - tests/test_fk_gdelt_shadow_feed_rc6.py
      - rc6_gdelt_event_risk_job.py
      - rc6_risk_gdelt_dashboard.py
      - fi_event_risk_shadow_rc6.py
      - tests/test_rc6_gdelt_event_risk_job.py
      - tests/test_rc6_risk_gdelt_dashboard.py
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8.3,<9' requests fastapi
      - name: Compile GDELT feed
        run: python -m py_compile fk_gdelt_shadow_feed_rc6.py
      - name: Run focused GDELT tests
        run: python -m pytest -q tests/test_fk_gdelt_shadow_feed_rc6.py tests/test_rc6_gdelt_event_risk_job.py tests/test_rc6_gdelt_shadow.py tests/test_rc6_risk_gdelt_dashboard.py