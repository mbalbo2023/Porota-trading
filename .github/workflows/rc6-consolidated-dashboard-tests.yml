name: RC6 Consolidated Dashboard Performance Tests 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-dashboard-20261001
    paths:
      - 'rc6_annual_instrument_analysis.py'
      - 'bh_universe_dashboard_hf6.py'
      - 'tests/test_rc6_dashboard_perf_guards.py'
      - 'tests/test_ws_dash_04_full_dashboard_truth.py'
      - '.github/workflows/rc6-consolidated-dashboard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install focal dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest fastapi starlette httpx requests
      - name: Compile
        run: python -m py_compile rc6_annual_instrument_analysis.py bh_universe_dashboard_hf6.py
      - name: Run performance guards
        run: python -m pytest -q tests/test_rc6_dashboard_perf_guards.py
      - name: Run canonical dashboard truth regression
        run: python -m pytest -q tests/test_ws_dash_04_full_dashboard_truth.py
