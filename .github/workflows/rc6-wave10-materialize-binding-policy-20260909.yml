name: RC6 Wave10 Materialize Sector Binding Policy 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave10-currentbase-20260909]
    paths: [.github/workflows/rc6-wave10-materialize-binding-policy-20260909.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote sector concentration to BINDING fail-closed
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('porota_mode_manager.py')
          s=p.read_text(encoding='utf-8')
          old='"PAPER_SECTOR_CONCENTRATION_POLICY": "OBSERVATION_ONLY"'
          n=s.count(old)
          assert n==2, f'expected two frozen/default sector policies, got {n}'
          s=s.replace(old,'"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"')
          s=s.replace('Decisiones explícitas del operador para HF6. Registran contexto y\n    # alertas sin convertirse en portones ni reducir la operatoria.',
                      'Decisiones explícitas del operador para RC6. Expectancy y régimen conservan\n    # su autoridad observacional; concentración sectorial es BINDING para nuevas entradas.')
          p.write_text(s,encoding='utf-8')

          q=Path('ck_policy_gate_hf6.py')
          t=q.read_text(encoding='utf-8')
          old_eval='_mode(SECTOR_ENV, "OBSERVATION_ONLY")'
          assert t.count(old_eval)==2, t.count(old_eval)
          t=t.replace(old_eval,'_mode(SECTOR_ENV, "BINDING")')
          q.write_text(t,encoding='utf-8')
          PY
          python -m py_compile porota_mode_manager.py ck_policy_gate_hf6.py
          python - <<'PY'
          import os
          import ck_policy_gate_hf6 as g
          os.environ.pop('PAPER_SECTOR_CONCENTRATION_POLICY',None)
          a=g.evaluate(sectors={'groups':[{'sector':'ENERGIA','open_positions':1}]},candidate_sector='ENERGIA',sector_limit=2)
          assert a['gates']['sector']['authority']=='BINDING' and not a['execute_block'], a
          b=g.evaluate(sectors={'groups':[{'sector':'ENERGIA','open_positions':2}]},candidate_sector='ENERGIA',sector_limit=2)
          assert b['gates']['sector']['execute_block'] and b['verdict']=='SECTOR_CONCENTRATION_LIMIT_ENERGIA', b
          c=g.evaluate(sectors={'groups':[]},candidate_sector='',sector_limit=2)
          assert c['execute_block'] and c['gates']['sector']['evidence_block'], c
          assert g.active_policies()['sector_concentration']=='BINDING'
          print('SECTOR_DEFAULT=BINDING')
          print('BELOW_LIMIT=PASS')
          print('AT_LIMIT=BLOCK')
          print('MISSING_MAPPING=FAIL_CLOSED')
          PY
          python - <<'PY'
          from porota_mode_manager import PAPER_DEFAULTS,HF3_FROZEN_PAPER_SETTINGS,paper_settings
          assert PAPER_DEFAULTS['PAPER_SECTOR_CONCENTRATION_POLICY']=='BINDING'
          assert HF3_FROZEN_PAPER_SETTINGS['PAPER_SECTOR_CONCENTRATION_POLICY']=='BINDING'
          assert paper_settings({})['PAPER_SECTOR_CONCENTRATION_POLICY']=='BINDING'
          print('MODE_MANAGER_BINDING=GREEN')
          PY
          ! grep -REn 'api/Orders|/Operar|send_order|place_order|new_order' ck_policy_gate_hf6.py be_paper_engine.py porota_mode_manager.py
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'W10_CODE_READY=GREEN'
      - name: Commit binding policy
        run: |
          set -Eeuo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add porota_mode_manager.py ck_policy_gate_hf6.py
          git commit -m 'fix(rc6 wave10): make sector concentration binding by default'
          git push origin HEAD:deploy-prep/rc6-wave10-currentbase-20260909
