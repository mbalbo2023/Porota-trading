name: RC6 finalize SHADOW migration v4

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths: ['.github/workflows/rc6-shadow-policy-v4.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - name: Apply and self-verify migration
        run: python scripts/rc6_apply_shadow_policy_v3.py
      - name: Compile affected source
        run: |
          python -m py_compile porota_mode_manager.py bg_paper_dashboard.py \
            bf_production_paper_observer.py be_paper_engine.py \
            ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py \
            ck_policy_gate_hf6.py es_shadow_binding_contract_rc6.py
      - name: Independent Python assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          mode=Path('porota_mode_manager.py').read_text()
          dash=Path('bg_paper_dashboard.py').read_text()
          obs=Path('bf_production_paper_observer.py').read_text()
          eng=Path('be_paper_engine.py').read_text()
          cp=Path('POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md').read_text()
          assert mode.count('"PAPER_ECONOMIC_GATE_MODE": "SHADOW"') >= 2
          assert '"PAPER_ECONOMIC_GATE_MODE": "BINDING"' not in mode
          assert 'os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING")' not in dash
          assert 'os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING")' not in obs
          assert 'features["economics_mode"] = self.economics_mode' in eng
          assert 'economic_violation = (economics_mode == "BINDING"' in eng
          assert 'P0-APRENDIZAJE — SHADOW' in cp
          print('RC6_SHADOW_STATIC=GREEN')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          FILES='porota_mode_manager.py bg_paper_dashboard.py bf_production_paper_observer.py be_paper_engine.py ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py ck_policy_gate_hf6.py POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md'
          if git diff --quiet -- $FILES; then
            echo RC6_SHADOW_MIGRATION=ALREADY_PRESENT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'RC6: restore SHADOW-first PAPER learning [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
