name: RC6 733 bounded host sudo FD probe

on:
  push:
    branches:
      - diagnostic/rc6-733-host-fd-passive-20261024
    paths:
      - .github/workflows/rc6-733-host-fd-passive.yml
      - scripts/rc6_733_host_fd_passive.py
      - scripts/rc6_624_s2_host_probe.py
      - scripts/rc6_deploy_host_mutex.py

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      PRODUCT_SHA: ae1e299d3f39a21cf5e6320b42bc0461636ab710
      S2_SOURCE_SHA: 21305f01d96dec41ef52b7ce03b3f421e33a1ce5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pinned branch and syntax offhost
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$PRODUCT_SHA")" = "$PRODUCT_SHA"
          python3 -m py_compile scripts/rc6_733_host_fd_passive.py
          python3 -m py_compile scripts/rc6_624_s2_host_probe.py scripts/rc6_deploy_host_mutex.py
          test "$(git hash-object scripts/rc6_deploy_host_mutex.py)" = 6328f92f5e658687a32733063fe48a0a5fa33e42
          test "$S2_SOURCE_SHA" = 21305f01d96dec41ef52b7ce03b3f421e33a1ce5
          echo 'RC6_733_FD_BRANCH_PIN=GREEN'
      - name: Bounded temporary-inode FD inheritance on host
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_733_fd_probe"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_733_fd_probe" "$HOME/.ssh/known_hosts"
          PROBE_B64="$(base64 -w0 scripts/rc6_733_host_fd_passive.py)"
          timeout 35 ssh -i "$HOME/.ssh/rc6_733_fd_probe" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 25 python3 -c 'import base64;exec(base64.b64decode(\"$PROBE_B64\"))' '$DO_USER' '$PRODUCT_SHA'"
      - name: Isolated candidate mutex smoke on host
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          HELPER_BLOB_SHA="$(git hash-object scripts/rc6_deploy_host_mutex.py)"
          HELPER_B64="$(base64 -w0 scripts/rc6_deploy_host_mutex.py)"
          S2_PROBE_B64="$(base64 -w0 scripts/rc6_624_s2_host_probe.py)"
          timeout 70 ssh -i "$HOME/.ssh/rc6_733_fd_probe" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 60 python3 -c 'import base64;exec(base64.b64decode(\"$S2_PROBE_B64\"))' '$DO_USER' '$S2_SOURCE_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' '$HELPER_B64' '$HELPER_BLOB_SHA'"
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/rc6_733_fd_probe"
