name: RC6 CP3 Runtime Layout Inspect 2026-09-11
on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-cp3-runtime-layout-inspect-20260911.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect non-secret runtime layout
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo HOST_HEAD="$TARGET"; echo MUTATIONS=NONE; echo REAL_ORDER_ROUTES=NOT_CALLED
          F=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          test -r "$F"
          echo '--- SAFE VARIABLE/EXECUTION LAYOUT ---'
          sudo -n awk '
            /^(ROOT|LIB|STATE|OUT|CAPTURE|PROFILE|BROWSER|CONTAINER|CE_PYTHON|DOCKER_BIN|JOBS|REL|STAGE|CAPTURE_DIR|PROFILE_DIR)=/ ||
            /rc6_trusted_browser_contract_collector.py/ ||
            /rc6_contract_capture_importer.py/ ||
            /--profile|--jobs|--output/ ||
            /STAGE_CAPTURE|CAPTURE_DIR|POROTA_CE_/ {print NR ":" $0}
          ' "$F" | sed -E 's/(PASSWORD|PASSWD|TOKEN|SECRET|COOKIE|AUTHORIZATION)=[^ ]*/\1=<redacted>/Ig'
          echo '--- DIRECTORY EXISTENCE ONLY ---'
          for d in /opt/porota-contract-evidence-venv /usr/local/lib/porota-contract-evidence-rc6 /home/porotaadmin/porota-browser-lab/chrome-profile /opt/porota-trading/data; do
            if sudo -n test -e "$d"; then echo EXISTS="$d"; else echo MISSING="$d"; fi
          done
          echo CP3_RUNTIME_LAYOUT_INSPECT=GREEN
          HOST