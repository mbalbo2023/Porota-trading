name: RC6 624 exact unreferenced failed image reclamation
on:
  push:
    branches:
      - diagnostic/rc6-624-postfail-image-reclaim-20261020
    paths:
      - .github/workflows/rc6-624-postfail-image-reclaim-20261020.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  reclaim:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Verify exact failed deployment and prepare SSH
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/deploy/rc6-pr69-isolated-20260915" --jq .commit.sha)" = 9c00e99fa5a2b56209e9c95c69091fbe7b8d9e5b
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39514335011" --jq '[.head_sha,.status,.conclusion] | join("|")' | \
            grep -Fx '9c00e99fa5a2b56209e9c95c69091fbe7b8d9e5b|completed|failure'
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_reclaim"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_reclaim" "$HOME/.ssh/known_hosts"
      - name: Reconcile stable tag to referenced runtime and remove only failed image tags
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          timeout 180 ssh -i "$HOME/.ssh/rc6_reclaim" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import fcntl,hashlib,json,os,re,sqlite3,stat,subprocess,time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          if not __debug__:raise RuntimeError('ASSERTIONS_REQUIRED')
          now=datetime.now(ZoneInfo('America/Argentina/Buenos_Aires'))
          assert now.date().isoformat()=='2026-10-20' and 17<=now.hour<23
          root=Path('/opt/porota-trading');folder=root/'data/deploy'
          old='sha256:a73cb5886e846bedc1ad231e287096efa825eb37ccc4695ff89d036b1cf19e10'
          failed='sha256:9775142bfa23ac64f413ad62648494802c22381bb61484393dfae5e773f947f7'
          sha='44239fbecb2c88a132e8ab9c034adc44891f86c0'
          stable='porota-trading-bot:17.0.0-rc6'
          tags={stable,'porota-predeploy-v2:'+sha,'porota-trading-bot:17.0.0-rc6-candidate-'+sha}
          owned={'porota_production_observer':'72989d6428695b4a7a8e63e5eedd6abc36db8a2772f6811b68bd2a5a76aaac7e',
                 'porota_production_dashboard':'e86f90de5be25f8189cdbd6ae67c9780637dd0be1294f4ab986b8ae008284aa9',
                 'porota_critical_approval_rc6':'122801c4fb640c63f389b56c284ab49f5e15f4cb8b9c1cf3b2fd9f68f078ad7d'}
          def cmd(*args,ok=True):
              p=subprocess.run(args,capture_output=True,text=True,timeout=18)
              if ok and p.returncode:raise RuntimeError('COMMAND_FAILED:'+args[0]+':'+args[1])
              assert len(p.stdout)<1024*1024
              return p.returncode,p.stdout.strip()
          def docker(*args,ok=True):return cmd('docker',*args,ok=ok)
          def inspect(name):
              rc,out=docker('inspect',name)
              rows=json.loads(out);assert len(rows)==1
              return rows[0]
          def image(name):
              rc,out=docker('image','inspect',name)
              rows=json.loads(out);assert len(rows)==1
              return rows[0]
          def load(p):
              assert p.is_file() and not p.is_symlink() and p.stat().st_size<65536
              return json.loads(p.read_bytes())
          def state(n,a):return cmd('systemctl',a,n,ok=False)[1]
          def ppi():
              rc,out=cmd('systemctl','list-unit-files','--no-legend','--no-pager')
              names=sorted(line.split()[0] for line in out.splitlines() if line.split() and {'ppi','watch'}<=set(re.split(r'[-_.@]',line.split()[0].lower())))
              return [(n,state(n,'is-enabled'),state(n,'is-active')) for n in names]
          def admission():
              current=load(folder/'CURRENT_STATE_V2.json')
              q=load(folder/('quiescence-'+sha+'.json'))
              assert current['candidate_sha']=='68e6681a9248f312e9e0c052fb3c4e5e032800b5'
              assert current['validation_status']=='VALIDATED_RUNTIME' and current['image_id']==old
              assert current['mode']=='PRODUCTION_PAPER' and type(current['real_orders_sent']) is int and current['real_orders_sent']==0 and current['real_order_routes']=='NOT_CALLED'
              assert q['status']=='FIX_FORWARD_VALIDATION_REQUIRED' and q['candidate_sha']==sha and q['installation_started'] is True and q['paused_postclose'] is True
              for n,ident in owned.items():
                  row=inspect(n);assert row['Id']==ident and row['Image']==old and row['RestartCount']==0 and row['State']['OOMKilled'] is False
                  assert row['State']['Status']==('running' if 'critical' in n else 'exited')
                  if 'critical' in n: assert row['State']['Health']['Status']=='healthy'
                  else:assert row['State']['ExitCode']==0
              db=root/'data/paper_v17/observer_v17.db'
              with sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=.2) as c:
                  c.row_factory=sqlite3.Row;c.execute('PRAGMA query_only=ON');c.execute('PRAGMA busy_timeout=200')
                  deadline=time.monotonic()+2;c.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
                  mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
                  assert mode=='PRODUCTION_PAPER' and type(orders) is int and orders==0
                  spots=c.execute("SELECT * FROM paper_positions WHERE status='OPEN' ORDER BY paper_id LIMIT 17").fetchall();assert len(spots)==2
                  payload=[]
                  for row in spots:
                      fills=c.execute('SELECT * FROM paper_fills WHERE paper_id=? ORDER BY id LIMIT 65',(row['paper_id'],)).fetchall()
                      intents=c.execute('SELECT * FROM paper_exit_intents WHERE paper_id=? LIMIT 2',(row['paper_id'],)).fetchall()
                      assert len(fills)<=64 and len(intents)<=1 and not any(f['side']=='SELL_SIMULATED' for f in fills)
                      payload.append({'position':dict(row),'fills':[dict(f) for f in fills],'intents':[dict(i) for i in intents]})
                  assert len(payload)==2
                  caucion=c.execute("SELECT * FROM paper_cauciones WHERE status='OPEN' ORDER BY paper_id LIMIT 2").fetchall();assert len(caucion)==1
                  assert caucion[0]['status']=='OPEN'
                  assert not c.execute("SELECT 1 FROM paper_future_positions WHERE status='ACTIVE' LIMIT 1").fetchone()
              import sys
              sys.path.insert(0,str(root))
              from scripts import rc6_deploy_quiescence as drain
              assert drain.spot_carryover_snapshot()==q['spot_carryover']
              assert drain.pending_caucion_snapshot()==q['caucion_carryover']
              policy=json.loads((root/'ops/policy/host-control-plane-reconciliation-v2.json').read_bytes())
              names=sorted(Path(n).name for n,v in policy['units'].items() if v['role']=='ACTIVE_TIMER' and v['active'] is True)
              assert len(names)==20 and all(state(n,'is-enabled')=='enabled' and state(n,'is-active')=='active' for n in names)
              refs=docker('ps','-aq','--no-trunc')[1].splitlines()
              assert len(refs)<=128
              referenced={inspect(n)['Image'] for n in refs}
              assert failed not in referenced and old in referenced
              return ppi()
          lock=folder/'.deploy-quiescence.lock'
          assert lock.is_file() and not lock.is_symlink() and stat.S_ISREG(lock.lstat().st_mode)
          with lock.open('rb') as f:
              fcntl.flock(f.fileno(),fcntl.LOCK_EX|fcntl.LOCK_NB)
              before=admission()
              target=image(failed)
              assert target['Id']==failed and set(target.get('RepoTags') or [])==tags
              assert set(target.get('RepoDigests') or [])=={'porota-predeploy-v2@'+failed,'porota-trading-bot@'+failed}
              assert image(stable)['Id']==failed and image(old)['Id']==old
              free_before=os.statvfs('/').f_bavail*os.statvfs('/').f_frsize
              assert admission()==before
              docker('tag',old,stable)
              assert image(stable)['Id']==old and admission()==before
              removed=[]
              for tag in sorted(tags-{stable}):
                  assert tag in (image(failed).get('RepoTags') or []) and admission()==before
                  docker('image','rm',tag)
                  removed.append(tag)
              assert docker('image','inspect',failed,ok=False)[0]!=0
              assert image(stable)['Id']==old and admission()==before
              free_after=os.statvfs('/').f_bavail*os.statvfs('/').f_frsize
              print('RC6_624_EXACT_IMAGE_RECLAIM='+json.dumps({'status':'GREEN' if free_after>=4035354216 else 'INSUFFICIENT_DYNAMIC_FLOOR',
                  'failed_image':failed,'stable_image':old,'removed_tags':removed,'disk_before':free_before,
                  'disk_after':free_after,'required_prior_candidate':4035354216,'real_orders_sent':0,'ppi_watch_changed':False},sort_keys=True))
              if free_after<4035354216:raise RuntimeError('DISK_DYNAMIC_FLOOR_NOT_RECOVERED')
          PY
      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/rc6_reclaim"
