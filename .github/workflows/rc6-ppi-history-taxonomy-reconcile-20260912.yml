name: RC6 PPI history taxonomy reconcile 2026-09-12
on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-taxonomy-reconcile-20260912.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only historical taxonomy reconciliation
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 60 9 || { echo ABORT=HISTORY_LOCK_BUSY; exit 32; }
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, sqlite3
          from collections import Counter, defaultdict
          import bf_production_paper_observer as m
          from cv_history_store_adapter_hf6 import default_history_store

          store=m.runtime_store()
          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              shadow=[tuple(r) for r in c.execute("""select ticker,instrument_type,market,currency,settlement
                from ppi_argentina_api_shadow
                where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')""")]
              current={(t,f,m,s) for t,f,m,cur,s in shadow}
              tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              qshadow=set()
              if 'ppi_argentina_api_shadow_quarantine_rc6' in tabs:
                  qshadow={(r[0],r[1],r[2],r[3]) for r in c.execute('select ticker,instrument_type,market,settlement from ppi_argentina_api_shadow_quarantine_rc6')}
              catalog=set()
              if 'financial_instrument_catalog' in tabs:
                  cols={r[1] for r in c.execute('pragma table_info(financial_instrument_catalog)')}
                  if {'ticker','instrument_type','market','settlement'} <= cols:
                      catalog={(r[0],r[1],r[2],r[3]) for r in c.execute('select ticker,instrument_type,market,settlement from financial_instrument_catalog')}
                  elif {'ticker','instrument_type','settlement'} <= cols:
                      catalog={(r[0],r[1],None,r[2]) for r in c.execute('select ticker,instrument_type,settlement from financial_instrument_catalog')}

          hpath=default_history_store().path
          h=sqlite3.connect(f'file:{hpath}?mode=ro',uri=True); h.row_factory=sqlite3.Row
          assert h.execute('pragma quick_check').fetchone()[0]=='ok'
          hist={(r['symbol'],r['instrument_type'],r['market'],r['settlement']) for r in h.execute('select distinct symbol,instrument_type,market,settlement from history_canonical_v2')}
          missing=current-hist
          extra=hist-current
          print('MISSING='+str(len(missing))+' EXTRA='+str(len(extra)))

          hist_by3=defaultdict(set)
          cur_by3=defaultdict(set)
          for t,f,m,s in hist: hist_by3[(t,f,m)].add(s)
          for t,f,m,s in current: cur_by3[(t,f,m)].add(s)
          miss_settle=[]
          for t,f,m,s in sorted(missing):
              other=sorted(hist_by3.get((t,f,m),set())-{s})
              if other: miss_settle.append((t,f,m,s,other))
          extra_settle=[]
          for t,f,m,s in sorted(extra):
              other=sorted(cur_by3.get((t,f,m),set())-{s})
              if other: extra_settle.append((t,f,m,s,other))
          print('MISSING_WITH_OTHER_SETTLEMENT='+str(len(miss_settle)))
          print('EXTRA_WITH_CURRENT_OTHER_SETTLEMENT='+str(len(extra_settle)))
          print('MISSING_SETTLEMENT_BY_FAMILY='+json.dumps(dict(Counter(x[1] for x in miss_settle)),sort_keys=True))
          print('EXTRA_SETTLEMENT_BY_FAMILY='+json.dumps(dict(Counter(x[1] for x in extra_settle)),sort_keys=True))
          print('MISSING_SETTLEMENT_SAMPLES='+json.dumps(miss_settle[:80],default=str))
          print('EXTRA_SETTLEMENT_SAMPLES='+json.dumps(extra_settle[:80],default=str))

          q_exact=sum(1 for x in extra if x in qshadow)
          q_same3=sum(1 for t,f,m,s in extra if any(qt==t and qf==f and qm==m for qt,qf,qm,qs in qshadow))
          if catalog:
              cat_exact=sum(1 for x in extra if x in catalog or (x[0],x[1],None,x[3]) in catalog)
              cat_same3=sum(1 for t,f,m,s in extra if any(ct==t and cf==f and (cm==m or cm is None) for ct,cf,cm,cs in catalog))
          else:
              cat_exact=cat_same3=0
          print('EXTRA_IN_QUARANTINED_DISCOVERY_EXACT='+str(q_exact))
          print('EXTRA_IN_QUARANTINED_DISCOVERY_SAME_SYMBOL_FAMILY_MARKET='+str(q_same3))
          print('EXTRA_IN_CATALOG_EXACT='+str(cat_exact))
          print('EXTRA_IN_CATALOG_SAME_SYMBOL_FAMILY_MARKET='+str(cat_same3))

          prof=[]
          for t,f,m,s in sorted(extra,key=lambda x:(x[1],x[0],x[2],x[3])):
              r=h.execute("""select count(*) n,min(date) first_date,max(date) last_date,group_concat(distinct source) src
                from history_canonical_v2 where symbol=? and instrument_type=? and market=? and settlement=?""",(t,f,m,s)).fetchone()
              prof.append((t,f,m,s,int(r['n'] or 0),r['first_date'],r['last_date'],r['src']))
          source_counts=Counter(f'{p[1]}|{p[7]}' for p in prof)
          print('EXTRA_SOURCE_COUNTS='+json.dumps(dict(source_counts),sort_keys=True))
          recent_cut='2026-09-01'
          recent=[p for p in prof if (p[6] or '')>=recent_cut]
          old=[p for p in prof if (p[6] or '')<recent_cut]
          print('EXTRA_RECENT_LAST_DATE_GE_2026_09_01='+str(len(recent)))
          print('EXTRA_OLDER_LAST_DATE_LT_2026_09_01='+str(len(old)))
          print('EXTRA_RECENT_BY_FAMILY='+json.dumps(dict(Counter(p[1] for p in recent)),sort_keys=True))
          print('EXTRA_OLDER_BY_FAMILY='+json.dumps(dict(Counter(p[1] for p in old)),sort_keys=True))

          for fam in ('ON','OPCIONES'):
              print(f'CURRENT_SETTLEMENTS_{fam}='+json.dumps(dict(Counter(s for t,f,m,s in current if f==fam)),sort_keys=True))
              print(f'HISTORY_SETTLEMENTS_{fam}='+json.dumps(dict(Counter(s for t,f,m,s in hist if f==fam)),sort_keys=True))
              print(f'MISSING_SETTLEMENTS_{fam}='+json.dumps(dict(Counter(s for t,f,m,s in missing if f==fam)),sort_keys=True))
              print(f'EXTRA_SETTLEMENTS_{fam}='+json.dumps(dict(Counter(s for t,f,m,s in extra if f==fam)),sort_keys=True))

          dup=h.execute("""select count(*) from (select symbol,instrument_type,market,settlement,date,count(*) n
            from history_canonical_v2 group by symbol,instrument_type,market,settlement,date having count(*)>1)""").fetchone()[0]
          print('CANONICAL_DUPLICATE_GROUPS='+str(dup)); assert dup==0
          h.close()
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
