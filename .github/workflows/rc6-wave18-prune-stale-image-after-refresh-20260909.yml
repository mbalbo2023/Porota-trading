name: RC6 Wave18 Prune Stale Image After Refresh 2026-09-09

on:
  push:
    branches:
      - deploy-prep/rc6-wave18-currentbase-20260909
    paths:
      - .github/workflows/rc6-wave18-prune-stale-image-after-refresh-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-wave18-control-plane-maintenance
  cancel-in-progress: false

jobs:
  prune-stale-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Delete only proven unreferenced stale image
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_SHA=$(git rev-parse HEAD)
          C=porota_critical_approval_rc6
          STALE_TAG=porota-trading-bot:rc6-scalping-rollback-5076b6dff8c6
          OLD_IMAGE_ID=sha256:b67c12a8d5ed7bf7ac5679a72d11a174cf9039702f62c09764c31d85f357eff1
          CURRENT_IMAGE_ID=$(sudo -n docker image inspect -f '{{.Id}}' porota-trading-bot:17.0.0-rc6)

          db_state() {
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          }

          echo '=== PRECHECK ==='
          echo "RUNTIME_HEAD=$PRE_SHA"
          db_state
          test "$(sudo -n systemctl is-active porota-critical-approval-rc6.service)" = active
          test "$(sudo -n systemctl is-active porota-critical-github-proxy-rc6.service)" = active
          test "$(sudo -n docker inspect -f '{{.Image}}' "$C")" = "$CURRENT_IMAGE_ID"
          test "$(sudo -n docker inspect -f '{{.State.Running}}' "$C")" = true
          test "$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$C")" = healthy
          P=$(sudo -n docker stats --no-stream --format '{{.PIDs}}' "$C")
          echo "CURRENT_GATEWAY_PIDS=$P"
          test "$P" -lt 32

          echo '=== REFERENCE PROOF ==='
          USES=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            img=$(sudo -n docker inspect -f '{{.Image}}' "$id" 2>/dev/null || true)
            if [ "$img" = "$OLD_IMAGE_ID" ]; then
              name=$(sudo -n docker inspect -f '{{.Name}}' "$id" 2>/dev/null | sed 's#^/##')
              echo "STALE_IMAGE_STILL_REFERENCED_BY=$name"
              USES=$((USES+1))
            fi
          done < <(sudo -n docker ps -aq)
          echo "STALE_IMAGE_CONTAINER_REFERENCES=$USES"
          test "$USES" -eq 0

          echo '=== PRUNE EXACT STALE IMAGE ONLY ==='
          df -h /opt/porota-trading
          if sudo -n docker image inspect "$STALE_TAG" >/dev/null 2>&1; then
            TAG_ID=$(sudo -n docker image inspect -f '{{.Id}}' "$STALE_TAG")
            test "$TAG_ID" = "$OLD_IMAGE_ID"
            sudo -n docker image rm "$STALE_TAG"
          else
            echo 'STALE_TAG_ALREADY_ABSENT=YES'
          fi
          if sudo -n docker image inspect "$OLD_IMAGE_ID" >/dev/null 2>&1; then
            sudo -n docker image rm "$OLD_IMAGE_ID"
          fi
          ! sudo -n docker image inspect "$OLD_IMAGE_ID" >/dev/null 2>&1
          echo 'STALE_IMAGE_REMOVE=GREEN'

          echo '=== POSTCHECK ==='
          test "$(sudo -n docker inspect -f '{{.Image}}' "$C")" = "$CURRENT_IMAGE_ID"
          test "$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$C")" = healthy
          test "$(git rev-parse HEAD)" = "$PRE_SHA"
          db_state
          df -h /opt/porota-trading
          sudo -n docker system df || true
          sudo -n docker images --format '{{.Repository}}:{{.Tag}}|{{.Size}}|{{.ID}}'
          echo 'CONTAINERS_RESTARTED=NO'
          echo 'CONTAINERS_REMOVED=NO'
          echo 'VOLUMES_REMOVED=NO'
          echo 'NETWORKS_REMOVED=NO'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'REAL_ORDERS_SENT=0'
          echo 'RC6_W18_STALE_IMAGE_PRUNE=GREEN'
          REMOTE
