name: RC6 IOL REST unit cutover preflight only
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8c62155aa6cc21a8a2c71229b0e86da4f83332f1
          persist-credentials: false
      - name: Verify the exact candidate preflight without writing to the Droplet
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.porota_actions_host import connection, decode_receipt, ssh_run
          with connection(os.environ) as (ssh, _, _):
              result = ssh_run(ssh, ['/usr/bin/sudo','-n','--','/usr/bin/python3','-I','-B','-','preflight'],
                               data=Path('scripts/rc6_iol_rest_units.py').read_bytes(), timeout=120)
          receipt = decode_receipt(result.stdout) if result.stdout else {'state':'NO_VERIFICADO','reason':'NO_TYPED_HOST_RECEIPT'}
          receipt.update(candidate_sha='8c62155aa6cc21a8a2c71229b0e86da4f83332f1', host_writes=0, order_endpoints_called=0)
          print(json.dumps(receipt,sort_keys=True))
          Path(os.environ['RUNNER_TEMP'],'iol-rest-unit-preflight.json').write_text(json.dumps(receipt, sort_keys=True))
          assert result.returncode == 0 and receipt['state'] == 'PREFLIGHT_OK'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-iol-rest-unit-preflight
          path: ${{ runner.temp }}/iol-rest-unit-preflight.json
          if-no-files-found: error
          retention-days: 14
