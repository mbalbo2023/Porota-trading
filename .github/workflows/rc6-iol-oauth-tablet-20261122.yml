name: RC6 verify existing IOL consent with one guarded refresh
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths:
      - .github/workflows/rc6-iol-oauth-tablet-20261122.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Reuse the existing OAuth grant and independently check its read-only tool list
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          source="import hashlib,json,os,re,sys,types\nfrom pathlib import Path\n\ncallback_ns={\"SESSION\":\"rc6-existing-consent-refresh\",\"__name__\":\"rc6_oauth_verifier\"}\nexec(\"\\\"\\\"\\\"One-time IOL consent using the existing loopback redirect and token store.\\\"\\\"\\\"\\n\\nimport base64\\nimport fcntl\\nimport hashlib\\nimport hmac\\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport secrets\\nimport socket\\nimport sys\\nimport tempfile\\nimport time\\nfrom urllib.error import HTTPError\\nfrom urllib.parse import parse_qs, urlencode, urlsplit\\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\\n\\n\\nISSUER = \\\"https://mcp.invertironline.com\\\"\\nUSER_AGENT = \\\"Porota-Trading-RC6/1.0 (IOL MCP read-only)\\\"\\nPORT = 8765\\nREDIRECT = f\\\"http://127.0.0.1:{PORT}/callback\\\"\\nSTORE = Path(\\\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\\\")\\nPENDING = STORE.with_name(\\\"iol_mcp_oauth_tablet_pending_\\\" + SESSION + \\\".json\\\")\\nLIFETIME = 1200\\nREAD = frozenset({\\n    \\\"get_access_mode\\\", \\\"get_activities\\\", \\\"get_asset_info\\\", \\\"get_asset_quote\\\", \\\"get_aum_evolution\\\",\\n    \\\"get_balance\\\", \\\"get_caucion_guarantee_assets\\\", \\\"get_caucion_rate\\\", \\\"get_caucion_rates\\\", \\\"get_ddjj\\\",\\n    \\\"get_fci_funds\\\", \\\"get_fixed_income_analytics\\\", \\\"get_intraday_prices\\\", \\\"get_next_corporate_events\\\",\\n    \\\"get_options_chain\\\", \\\"get_order_status\\\", \\\"get_portfolio\\\", \\\"get_price_history\\\",\\n    \\\"get_return_evolution\\\", \\\"get_stop_loss_and_take_profit\\\", \\\"show_aum_evolution\\\",\\n    \\\"show_portfolio_treemap\\\", \\\"show_return_evolution\\\", \\\"simulate_fixed_income_by_amount\\\",\\n    \\\"simulate_fixed_income_by_nominals\\\",\\n})\\n\\n\\nclass NoRedirect(HTTPRedirectHandler):\\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\\n        return None\\n\\n\\nclass ProviderHTTPError(Exception):\\n    def __init__(self, stage, response):\\n        self.stage, self.status = stage, response.code\\n        kind = response.headers.get_content_type()\\n        self.format = \\\"json\\\" if kind.endswith(\\\"json\\\") else \\\"html\\\" if kind==\\\"text/html\\\" else \\\"other\\\"\\n        trace = response.headers.get(\\\"CF-Ray\\\", \\\"\\\")\\n        self.trace = trace if re.fullmatch(r\\\"[a-fA-F0-9]{8,32}-[A-Z0-9]{2,8}\\\", trace) else None\\n        self.provider_error = None\\n        self.edge_code = None\\n        try:\\n            body = json.loads(response.read(8193)) if self.format==\\\"json\\\" else {}\\n        except (OSError, ValueError):\\n            body = {}\\n        if isinstance(body,dict):\\n            known = (\\\"invalid_request\\\", \\\"invalid_grant\\\", \\\"invalid_client\\\", \\\"unauthorized_client\\\", \\\"invalid_scope\\\",\\n                     \\\"invalid_target\\\", \\\"access_denied\\\", \\\"forbidden\\\", \\\"insufficient_scope\\\", \\\"country_block\\\",\\n                     \\\"country_challenge\\\", \\\"waf_block\\\", \\\"ip_block\\\", \\\"unsupported_grant_type\\\", \\\"rate_limited\\\")\\n            for key in (\\\"error\\\", \\\"error_name\\\", \\\"error_type\\\", \\\"error_code\\\", \\\"code\\\"):\\n                item = body.get(key)\\n                if isinstance(item,str) and item.lower() in known:\\n                    self.provider_error = item.lower()\\n                if self.trace and (type(item) is int or (isinstance(item,str) and re.fullmatch(r\\\"1\\\\d{3}\\\",item))) and 1000<=int(item)<=1200:\\n                    self.edge_code = int(item)\\n        super().__init__(stage)\\n\\n    def receipt(self):\\n        return {\\\"stage\\\":self.stage,\\\"http\\\":self.status,\\\"format\\\":self.format,\\n                \\\"provider_error\\\":self.provider_error,\\\"edge_code\\\":self.edge_code,\\\"trace_id\\\":self.trace}\\n\\n\\ndef exchange(path, data, headers, *, stage):\\n    assert path in (\\\"/token\\\", \\\"\\\")\\n    req = Request(ISSUER + path, data=data,\\n                  headers={**headers, \\\"User-Agent\\\":USER_AGENT}, method=\\\"POST\\\")\\n    try:\\n        with build_opener(NoRedirect).open(req, timeout=15) as response:\\n            body = response.read(512_001)\\n            if len(body) > 512_000:\\n                raise ValueError(\\\"IOL_PROVIDER_RESPONSE_LIMIT\\\")\\n            return body, response.headers\\n    except HTTPError as error:\\n        with error:\\n            raise ProviderHTTPError(stage,error) from None\\n\\n\\ndef rpc_json(body):\\n    decoded = body.decode(\\\"utf-8\\\")\\n    if decoded.lstrip().startswith(\\\"{\\\"):\\n        return json.loads(decoded)\\n    for line in decoded.splitlines():\\n        if line.startswith(\\\"data:\\\") and line[5:].lstrip().startswith(\\\"{\\\"):\\n            payload = json.loads(line[5:])\\n            if \\\"result\\\" in payload or \\\"error\\\" in payload:\\n                return payload\\n    raise ValueError(\\\"MCP_REPLY_UNVERIFIED\\\")\\n\\n\\ndef confirm_read_only(token):\\n    headers = {\\n        \\\"Authorization\\\":\\\"Bearer \\\"+token,\\\"Content-Type\\\":\\\"application/json\\\",\\n        \\\"Accept\\\":\\\"application/json, text/event-stream\\\",\\n        \\\"MCP-Protocol-Version\\\":\\\"2025-06-18\\\",\\n    }\\n    def rpc(method, params, seq):\\n        envelope = {\\\"jsonrpc\\\":\\\"2.0\\\",\\\"method\\\":method,\\\"params\\\":params}\\n        if seq is not None:\\n            envelope[\\\"id\\\"] = seq\\n        return exchange(\\\"\\\",json.dumps(envelope).encode(),headers,stage=\\\"MCP_\\\"+method.upper().replace(\\\"/\\\",\\\"_\\\"))\\n    response, info = rpc(\\\"initialize\\\",{\\\"protocolVersion\\\":\\\"2025-06-18\\\",\\\"capabilities\\\":{},\\n                                        \\\"clientInfo\\\":{\\\"name\\\":\\\"Porota RC6\\\",\\\"version\\\":\\\"22\\\"}},1)\\n    init = rpc_json(response).get(\\\"result\\\")\\n    if not isinstance(init,dict) or not isinstance(init.get(\\\"protocolVersion\\\"),str):\\n        raise ValueError(\\\"MCP_INIT_UNVERIFIED\\\")\\n    headers[\\\"MCP-Protocol-Version\\\"] = init[\\\"protocolVersion\\\"]\\n    if info.get(\\\"Mcp-Session-Id\\\"):\\n        headers[\\\"Mcp-Session-Id\\\"] = info[\\\"Mcp-Session-Id\\\"]\\n    rpc(\\\"notifications/initialized\\\",{},None)\\n    payload, _ = rpc(\\\"tools/list\\\",{},2)\\n    listed = rpc_json(payload).get(\\\"result\\\",{})\\n    names = {item[\\\"name\\\"] for item in listed.get(\\\"tools\\\",[])}\\n    if listed.get(\\\"nextCursor\\\") or not {\\\"get_asset_quote\\\",\\\"get_price_history\\\"} <= names or not names <= READ:\\n        raise ValueError(\\\"IOL_READ_ONLY_MODE_UNVERIFIED\\\")\\n    return len(names)\\n\\n\\ndef write_private(path, data):\\n    fd, file = tempfile.mkstemp(prefix=\\\"iol-consent-\\\", dir=path.parent)\\n    try:\\n        with os.fdopen(fd,\\\"w\\\",encoding=\\\"utf-8\\\") as f:\\n            json.dump(data,f,sort_keys=True)\\n            f.flush()\\n            os.fsync(f.fileno())\\n        os.replace(file,path)\\n    finally:\\n        if os.path.exists(file):\\n            os.unlink(file)\\n\\n\\ndef current_digest():\\n    if not STORE.is_file() or STORE.is_symlink() or STORE.stat().st_size > 128_000:\\n        raise ValueError(\\\"IOL_STORE_UNVERIFIED\\\")\\n    return hashlib.sha256(STORE.read_bytes()).hexdigest()\\n\\n\\ndef require_paper():\\n    marker=Path(\\\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\\\")\\n    state=json.loads(marker.read_text())\\n    if state.get(\\\"mode\\\") != \\\"PRODUCTION_PAPER\\\" or state.get(\\\"real_orders_sent\\\") != 0:\\n        raise ValueError(\\\"IOL_PAPER_RUNTIME_UNVERIFIED\\\")\\n\\n\\ndef prepare():\\n    require_paper()\\n    with socket.socket() as sock:\\n        sock.bind((\\\"127.0.0.1\\\",PORT))\\n    before=current_digest()\\n    prior=json.loads(STORE.read_bytes())\\n    if prior.get(\\\"issuer\\\") != ISSUER or prior.get(\\\"redirect_uri\\\") != REDIRECT:\\n        raise ValueError(\\\"IOL_EXISTING_REGISTRATION_REDIRECT_UNVERIFIED\\\")\\n    client=prior.get(\\\"client_registration\\\",{})\\n    client_id=client.get(\\\"client_id\\\")\\n    if not isinstance(client_id,str) or not 0<len(client_id)<256:\\n        raise ValueError(\\\"IOL_REGISTRATION_UNVERIFIED\\\")\\n    if client.get(\\\"redirect_uris\\\") is not None and REDIRECT not in client[\\\"redirect_uris\\\"]:\\n        raise ValueError(\\\"IOL_REDIRECT_UNVERIFIED\\\")\\n    verifier=secrets.token_urlsafe(64)\\n    challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b\\\"=\\\").decode()\\n    state=secrets.token_urlsafe(32)\\n    write_private(PENDING,{\\\"state\\\":state,\\\"verifier\\\":verifier,\\\"client_id\\\":client_id,\\n                           \\\"expires\\\":time.time()+LIFETIME,\\\"store_digest\\\":before})\\n    q={\\\"response_type\\\":\\\"code\\\",\\\"client_id\\\":client_id,\\\"redirect_uri\\\":REDIRECT,\\\"code_challenge\\\":challenge,\\n       \\\"code_challenge_method\\\":\\\"S256\\\",\\\"state\\\":state,\\\"resource\\\":ISSUER}\\n    print(json.dumps({\\\"url\\\":ISSUER+\\\"/authorize?\\\"+urlencode(q),\\\"expires\\\":int(time.time()+LIFETIME)}))\\n\\n\\ndef apply(code,pending):\\n    require_paper()\\n    if current_digest()!=pending[\\\"store_digest\\\"]:\\n        raise ValueError(\\\"IOL_STORE_CHANGED\\\")\\n    client=json.loads(STORE.read_bytes())[\\\"client_registration\\\"]\\n    fields={\\\"grant_type\\\":\\\"authorization_code\\\",\\\"code\\\":code,\\\"redirect_uri\\\":REDIRECT,\\n            \\\"client_id\\\":pending[\\\"client_id\\\"],\\\"code_verifier\\\":pending[\\\"verifier\\\"],\\\"resource\\\":ISSUER}\\n    headers={\\\"Content-Type\\\":\\\"application/x-www-form-urlencoded\\\",\\\"Accept\\\":\\\"application/json\\\"}\\n    secret=client.get(\\\"client_secret\\\")\\n    if secret:\\n        if client.get(\\\"token_endpoint_auth_method\\\")==\\\"client_secret_basic\\\":\\n            encoded=base64.b64encode((fields.pop(\\\"client_id\\\")+\\\":\\\"+secret).encode()).decode()\\n            headers[\\\"Authorization\\\"]=\\\"Basic \\\"+encoded\\n        elif client.get(\\\"token_endpoint_auth_method\\\")==\\\"client_secret_post\\\":\\n            fields[\\\"client_secret\\\"]=secret\\n        else:\\n            raise ValueError(\\\"IOL_REGISTRATION_AUTH_UNVERIFIED\\\")\\n    raw, _ = exchange(\\\"/token\\\",urlencode(fields).encode(),headers,stage=\\\"OAUTH_TOKEN_EXCHANGE\\\")\\n    tokens=json.loads(raw)\\n    if any(not isinstance(tokens.get(k),str) or not tokens[k] for k in (\\\"access_token\\\",\\\"refresh_token\\\")):\\n        raise ValueError(\\\"IOL_TOKEN_RESPONSE_UNVERIFIED\\\")\\n    count=confirm_read_only(tokens[\\\"access_token\\\"])\\n    lock=STORE.with_suffix(STORE.suffix+\\\".refresh.lock\\\")\\n    fd=os.open(lock,os.O_CREAT|os.O_RDWR|os.O_NOFOLLOW,0o600)\\n    try:\\n        fcntl.flock(fd,fcntl.LOCK_EX)\\n        if current_digest()!=pending[\\\"store_digest\\\"]:\\n            raise ValueError(\\\"IOL_STORE_CHANGED\\\")\\n        require_paper()\\n        write_private(STORE,{\\\"issuer\\\":ISSUER,\\\"resource\\\":ISSUER,\\\"redirect_uri\\\":REDIRECT,\\n            \\\"token_endpoint\\\":ISSUER+\\\"/token\\\",\\n            \\\"client_registration\\\":client,\\n            \\\"tokens\\\":tokens,\\\"token_obtained_at_epoch\\\":time.time()})\\n    finally:\\n        os.close(fd)\\n    return count\\n\\n\\ndef receive():\\n    pending=json.loads(PENDING.read_text())\\n    result={\\\"state\\\":\\\"CONSENT_EXPIRED\\\",\\\"session\\\":SESSION}\\n    class Callback(BaseHTTPRequestHandler):\\n        timeout = 5\\n\\n        def log_message(self,*args):\\n            pass\\n\\n        def reply(self, status, title):\\n            self.send_response(status)\\n            self.send_header(\\\"Content-Type\\\",\\\"text/plain; charset=utf-8\\\")\\n            self.send_header(\\\"Cache-Control\\\",\\\"no-store\\\")\\n            self.send_header(\\\"Referrer-Policy\\\",\\\"no-referrer\\\")\\n            self.end_headers()\\n            self.wfile.write(title.encode(\\\"utf-8\\\"))\\n\\n        def do_GET(self):\\n            parsed=urlsplit(self.path)\\n            params=parse_qs(parsed.query,max_num_fields=12)\\n            states=params.get(\\\"state\\\", [])\\n            codes=params.get(\\\"code\\\",[])\\n            if (parsed.path!=\\\"/callback\\\" or len(states)!=1\\n                    or not hmac.compare_digest(states[0],pending[\\\"state\\\"])):\\n                self.send_error(400,\\\"Callback invalido\\\")\\n                return\\n            if len(codes)!=1 or not 0<len(codes[0])<=2048:\\n                result[\\\"state\\\"]=\\\"CONSENT_NO_CODE\\\"\\n                self.send_error(400,\\\"IOL no devolvio autorizacion\\\")\\n                return\\n            try:\\n                result.update(state=\\\"AUTHENTICATED_READ_ONLY\\\",tools=apply(codes[0],pending))\\n            except ProviderHTTPError as error:\\n                result.update(state=\\\"IOL_UPSTREAM_REJECTED\\\",**error.receipt())\\n                step = \\\"el canje del código OAuth\\\" if error.stage==\\\"OAUTH_TOKEN_EXCHANGE\\\" else \\\"la verificación de permisos MCP\\\"\\n                self.reply(502,f\\\"IOL rechazó {step} (HTTP {error.status}). Podés cerrar esta página.\\\")\\n            except Exception as error:\\n                result[\\\"state\\\"]=\\\"OAUTH_CALLBACK_UNVERIFIED\\\"\\n                result[\\\"class\\\"]=type(error).__name__\\n                if isinstance(error,ValueError) and str(error).startswith((\\\"MCP_\\\",\\\"IOL_\\\")):\\n                    result[\\\"reason\\\"]=str(error)\\n                self.reply(500,\\\"Porota no pudo verificar el acceso Solo lectura. Podés cerrar esta página.\\\")\\n            else:\\n                self.reply(200,\\\"IOL autorizado en Solo lectura para Porota. Podés cerrar esta página.\\\")\\n    try:\\n        with HTTPServer((\\\"127.0.0.1\\\",PORT),Callback) as server:\\n            server.timeout=2\\n            while time.time()<pending[\\\"expires\\\"] and result[\\\"state\\\"]==\\\"CONSENT_EXPIRED\\\":\\n                server.handle_request()\\n    finally:\\n        PENDING.unlink(missing_ok=True)\\n    print(json.dumps(result,sort_keys=True))\\n\\n\\ndef probe_token_endpoint():\\n    \\\"\\\"\\\"Distinguish a provider denial from a reachable token endpoint without a consent code.\\\"\\\"\\\"\\n    require_paper()\\n    entry=json.loads(STORE.read_bytes())\\n    if entry.get(\\\"issuer\\\")!=ISSUER or entry.get(\\\"token_endpoint\\\")!=ISSUER+\\\"/token\\\":\\n        raise ValueError(\\\"IOL_PROVIDER_ENDPOINT_UNVERIFIED\\\")\\n    registration=entry.get(\\\"client_registration\\\",{})\\n    client_id=registration.get(\\\"client_id\\\")\\n    if not isinstance(client_id,str) or registration.get(\\\"token_endpoint_auth_method\\\")!=\\\"none\\\":\\n        raise ValueError(\\\"IOL_PROBE_PUBLIC_CLIENT_REQUIRED\\\")\\n    headers={\\\"Content-Type\\\":\\\"application/x-www-form-urlencoded\\\",\\\"Accept\\\":\\\"application/json\\\"}\\n    data=urlencode({\\\"grant_type\\\":\\\"authorization_code\\\",\\\"client_id\\\":client_id}).encode()\\n    try:\\n        exchange(\\\"/token\\\",data,headers,stage=\\\"OAUTH_TOKEN_ENDPOINT_PROBE\\\")\\n    except ProviderHTTPError as error:\\n        print(json.dumps({\\\"state\\\":\\\"IOL_TOKEN_ENDPOINT_PROBE\\\",\\\"session\\\":SESSION,**error.receipt()},sort_keys=True))\\n        return\\n    print(json.dumps({\\\"state\\\":\\\"IOL_TOKEN_ENDPOINT_UNEXPECTED_SUCCESS\\\",\\\"session\\\":SESSION},sort_keys=True))\\n\\n\\nif __name__==\\\"__main__\\\":\\n    try:\\n        {\\\"prepare\\\":prepare,\\\"receive\\\":receive,\\\"probe\\\":probe_token_endpoint}[STAGE]()\\n    except (ValueError, OSError, HTTPError) as error:\\n        reason = str(error) if type(error) is ValueError and str(error).startswith(\\\"IOL_\\\") else type(error).__name__\\n        print(json.dumps({\\\"state\\\":\\\"IOL_CALLBACK_SETUP_FAILED\\\",\\\"reason\\\":reason,\\n                          \\\"http\\\":error.code if isinstance(error,HTTPError) else None}))\\n        sys.exit(1)\\n\",callback_ns)\ncallback_ns[\"require_paper\"]()\nmodule=types.ModuleType(\"rc6_verified_iol_adapter\")\nsys.modules[module.__name__]=module\nexec(\"\\\"\\\"\\\"Authenticated read-only JSON-RPC adapter for the IOL MCP.\\n\\nThe adapter permits only market-data tools.  It may refresh the existing OAuth\\nsession after a 401 using the bootstrap's refresh token; it never logs\\ncredentials and never invokes an execution tool.\\n\\\"\\\"\\\"\\nfrom __future__ import annotations\\n\\nimport base64\\nimport fcntl\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport tempfile\\nimport time\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\nfrom typing import Any\\n\\n# These tools are market-data/reference reads only. They cannot access account state\\n# or execute, validate, cancel, or schedule any transaction.\\n# These are the only MCP capabilities that can enrich instrument evidence\\n# without reading account state or invoking an order/validation route.  The\\n# remaining discovered tools stay inventoried but are deliberately denied.\\nREAD_ONLY_MARKET_TOOLS = frozenset({\\n    \\\"get_asset_info\\\",\\n    \\\"get_asset_quote\\\",\\n    \\\"get_price_history\\\",\\n    \\\"get_intraday_prices\\\",\\n    \\\"get_fixed_income_analytics\\\",\\n    \\\"simulate_fixed_income_by_amount\\\",\\n    \\\"simulate_fixed_income_by_nominals\\\",\\n    \\\"get_options_chain\\\",\\n    \\\"get_caucion_rates\\\",\\n    \\\"get_caucion_rate\\\",\\n    \\\"get_caucion_guarantee_assets\\\",\\n    \\\"get_fci_funds\\\",\\n    \\\"get_next_corporate_events\\\",\\n})\\nFORBIDDEN_ACCOUNT_OR_EXECUTION_TOOLS = frozenset({\\n    \\\"get_portfolio\\\", \\\"get_balance\\\", \\\"get_ddjj\\\", \\\"get_order_status\\\",\\n    \\\"get_activities\\\", \\\"validate_order\\\", \\\"place_order\\\", \\\"cancel_order\\\",\\n    \\\"buy_ggal_at_50_cents\\\", \\\"get_stop_loss_and_take_profit\\\",\\n    \\\"create_stop_loss_or_take_profit\\\", \\\"delete_stop_loss_or_take_profit\\\",\\n    \\\"validate_caucion\\\", \\\"place_caucion\\\",\\n    \\\"validate_fci_subscription\\\", \\\"subscribe_fci\\\",\\n    \\\"validate_fci_redemption\\\", \\\"redeem_fci\\\",\\n})\\nALLOWED_TOOLS = READ_ONLY_MARKET_TOOLS\\nDEFAULT_STORE = Path(\\\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\\\")\\nIOL_CLIENT_USER_AGENT = \\\"Porota-Trading-RC6/1.0 (IOL MCP read-only)\\\"\\nDEFAULT_REFRESH_SKEW_SECONDS = max(60, int(os.environ.get(\\\"POROTA_IOL_OAUTH_REFRESH_SKEW_SECONDS\\\", \\\"60\\\")))\\n\\n\\nclass IOLMCPError(RuntimeError):\\n    def __init__(\\n        self, message: str, *, status_code: int | None = None,\\n        retry_after: float | None = None, response_headers: dict[str, str] | None = None,\\n        failure_class: str | None = None,\\n    ) -> None:\\n        super().__init__(message)\\n        self.status_code = status_code\\n        self.retry_after = retry_after\\n        self.response_headers = response_headers or {}\\n        self.failure_class = failure_class\\n\\n\\ndef _retry_after(headers: dict[str, str]) -> float | None:\\n    try:\\n        value = headers.get(\\\"Retry-After\\\") or headers.get(\\\"retry-after\\\")\\n        return float(value) if value else None\\n    except (TypeError, ValueError):\\n        return None\\n\\n\\ndef _json_from_mcp_body(body: str) -> dict[str, Any]:\\n    # Streamable HTTP MCP may return a JSON object or an SSE data frame.\\n    candidates = [body.strip()]\\n    candidates.extend(line[5:].strip() for line in body.splitlines() if line.startswith(\\\"data:\\\"))\\n    for candidate in reversed(candidates):\\n        try:\\n            value = json.loads(candidate)\\n        except json.JSONDecodeError:\\n            continue\\n        if isinstance(value, dict):\\n            if isinstance(value.get(\\\"error\\\"), dict):\\n                raise IOLMCPError(\\\"IOL_MCP_RPC_ERROR:\\\" + str(value[\\\"error\\\"].get(\\\"code\\\", \\\"unknown\\\")))\\n            result = value.get(\\\"result\\\", value)\\n            if isinstance(result, dict):\\n                # MCP servers may expose typed tool output through\\n                # `structuredContent` instead of duplicating JSON in a text block.\\n                # Returning the outer tool-result envelope made perfectly valid\\n                # read-only calls (notably FCI and cauciones) look empty to the\\n                # family collector. Prefer the typed payload when present.\\n                if result.get(\\\"isError\\\") is True:\\n                    raise IOLMCPError(\\\"IOL_MCP_TOOL_ERROR\\\")\\n                structured = result.get(\\\"structuredContent\\\")\\n                if isinstance(structured, dict):\\n                    return structured\\n                for item in result.get(\\\"content\\\") or []:\\n                    if isinstance(item, dict) and isinstance(item.get(\\\"text\\\"), str):\\n                        try:\\n                            decoded = json.loads(item[\\\"text\\\"])\\n                        except json.JSONDecodeError:\\n                            continue\\n                        if isinstance(decoded, dict):\\n                            return decoded\\n                        if isinstance(decoded, list):\\n                            return {\\\"result\\\": decoded}\\n                return result\\n            if isinstance(result, list):\\n                return {\\\"result\\\": result}\\n            return {\\\"content\\\": result}\\n    raise IOLMCPError(\\\"IOL_MCP_INVALID_RESPONSE\\\")\\n\\n\\ndef _https_url(value: object) -> str | None:\\n    if not isinstance(value, str):\\n        return None\\n    parsed = urllib.parse.urlparse(value)\\n    return value if parsed.scheme == \\\"https\\\" and parsed.netloc else None\\n\\n\\ndef _resource_metadata_url(headers: dict[str, str]) -> str | None:\\n    challenge = headers.get(\\\"WWW-Authenticate\\\") or headers.get(\\\"www-authenticate\\\") or \\\"\\\"\\n    marker = 'resource_metadata=\\\"'\\n    start = challenge.find(marker)\\n    if start < 0:\\n        return None\\n    value = challenge[start + len(marker):].split('\\\"', 1)[0]\\n    return _https_url(value)\\n\\n\\nclass OAuthStoreReadOnlyMCP:\\n    \\\"\\\"\\\"Small session client. It refreshes a stored read-only OAuth session only after 401.\\\"\\\"\\\"\\n\\n    def __init__(self, store: Path | str = DEFAULT_STORE, *, timeout_seconds: int = 20) -> None:\\n        self.store, self.timeout_seconds = Path(store), timeout_seconds\\n        self._request_id = 0\\n        self._headers: dict[str, str] | None = None\\n\\n    def _load_store(self) -> dict[str, Any]:\\n        try:\\n            value = json.loads(self.store.read_text(encoding=\\\"utf-8\\\"))\\n        except (OSError, json.JSONDecodeError) as exc:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_STORE_UNAVAILABLE\\\") from exc\\n        if not isinstance(value, dict):\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_NOT_READY\\\")\\n        return value\\n\\n    def _load_headers(self) -> dict[str, str]:\\n        data = self._load_store()\\n        token = (data.get(\\\"tokens\\\") or {}).get(\\\"access_token\\\")\\n        issuer = data.get(\\\"issuer\\\")\\n        if not isinstance(token, str) or not token or not isinstance(issuer, str) or not _https_url(issuer):\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_NOT_READY\\\")\\n        return {\\n            \\\"Authorization\\\": \\\"Bearer \\\" + token, \\\"Content-Type\\\": \\\"application/json\\\",\\n            \\\"Accept\\\": \\\"application/json, text/event-stream\\\", \\\"User-Agent\\\": IOL_CLIENT_USER_AGENT,\\n            \\\"_issuer\\\": issuer,\\n        }\\n\\n    def _read_json(self, url: str) -> dict[str, Any]:\\n        try:\\n            with urllib.request.urlopen(\\n                urllib.request.Request(url, headers={\\\"Accept\\\": \\\"application/json\\\", \\\"User-Agent\\\": IOL_CLIENT_USER_AGENT}),\\n                timeout=self.timeout_seconds,\\n            ) as response:\\n                value = json.loads(response.read().decode(errors=\\\"replace\\\"))\\n        except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_DISCOVERY_FAILED\\\") from exc\\n        if not isinstance(value, dict):\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_DISCOVERY_FAILED\\\")\\n        return value\\n\\n    def _token_endpoint(self, headers: dict[str, str]) -> str:\\n        resource_url = _resource_metadata_url(headers)\\n        if not resource_url:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_UNAVAILABLE\\\")\\n        resource = self._read_json(resource_url)\\n        direct = _https_url(resource.get(\\\"token_endpoint\\\"))\\n        if direct:\\n            return direct\\n        servers = resource.get(\\\"authorization_servers\\\")\\n        if not isinstance(servers, list):\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_UNAVAILABLE\\\")\\n        for server in servers:\\n            authority = _https_url(server)\\n            if not authority:\\n                continue\\n            metadata = self._read_json(authority.rstrip(\\\"/\\\") + \\\"/.well-known/oauth-authorization-server\\\")\\n            endpoint = _https_url(metadata.get(\\\"token_endpoint\\\"))\\n            if endpoint:\\n                return endpoint\\n        raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_UNAVAILABLE\\\")\\n\\n    def _write_store(self, data: dict[str, Any]) -> None:\\n        try:\\n            mode = self.store.stat().st_mode & 0o777\\n            fd, temporary = tempfile.mkstemp(prefix=self.store.name + \\\".\\\", dir=str(self.store.parent))\\n            with os.fdopen(fd, \\\"w\\\", encoding=\\\"utf-8\\\") as handle:\\n                json.dump(data, handle, sort_keys=True)\\n                handle.flush()\\n                os.fsync(handle.fileno())\\n            os.chmod(temporary, mode)\\n            os.replace(temporary, self.store)\\n        except OSError as exc:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_STORE_WRITE_FAILED\\\") from exc\\n\\n    def _token_expiry_epoch(self, data: dict[str, Any]) -> float | None:\\n        tokens = data.get(\\\"tokens\\\")\\n        if not isinstance(tokens, dict):\\n            return None\\n        try:\\n            expires_in = float(tokens.get(\\\"expires_in\\\"))\\n        except (TypeError, ValueError):\\n            return None\\n        if expires_in <= 0:\\n            return None\\n        try:\\n            obtained = float(data.get(\\\"token_obtained_at_epoch\\\"))\\n        except (TypeError, ValueError):\\n            try:\\n                obtained = float(self.store.stat().st_mtime)\\n            except OSError:\\n                return None\\n        return obtained + expires_in\\n\\n    def _refresh_due(self, data: dict[str, Any]) -> bool:\\n        expiry = self._token_expiry_epoch(data)\\n        return expiry is not None and time.time() >= expiry - DEFAULT_REFRESH_SKEW_SECONDS\\n\\n    def _stored_token_endpoint(self, data: dict[str, Any]) -> str | None:\\n        return _https_url(data.get(\\\"token_endpoint\\\"))\\n\\n    def _refresh_if_due(self) -> None:\\n        data = self._load_store()\\n        if not self._refresh_due(data):\\n            return\\n        tokens = data.get(\\\"tokens\\\")\\n        expected = (tokens or {}).get(\\\"access_token\\\") if isinstance(tokens, dict) else None\\n        lock_path = self.store.with_suffix(self.store.suffix + \\\".refresh.lock\\\")\\n        lock_path.parent.mkdir(parents=True, exist_ok=True)\\n        lock_fd = os.open(lock_path, os.O_CREAT | os.O_RDWR, 0o600)\\n        try:\\n            fcntl.flock(lock_fd, fcntl.LOCK_EX)\\n            current_data = self._load_store()\\n            current_tokens = current_data.get(\\\"tokens\\\")\\n            current = (current_tokens or {}).get(\\\"access_token\\\") if isinstance(current_tokens, dict) else None\\n            if expected and current and current != expected:\\n                self._headers = None\\n                return\\n            if self._refresh_due(current_data):\\n                self._refresh_locked({}, current_data)\\n        finally:\\n            fcntl.flock(lock_fd, fcntl.LOCK_UN)\\n            os.close(lock_fd)\\n\\n    def _refresh_after_401(self, headers: dict[str, str]) -> None:\\n        lock_path = self.store.with_suffix(self.store.suffix + \\\".refresh.lock\\\")\\n        lock_path.parent.mkdir(parents=True, exist_ok=True)\\n        lock_fd = os.open(lock_path, os.O_CREAT | os.O_RDWR, 0o600)\\n        try:\\n            fcntl.flock(lock_fd, fcntl.LOCK_EX)\\n            data = self._load_store()\\n            current = (data.get(\\\"tokens\\\") or {}).get(\\\"access_token\\\")\\n            used = str((self._headers or {}).get(\\\"Authorization\\\") or \\\"\\\").removeprefix(\\\"Bearer \\\")\\n            # Another collector process already rotated the refresh token and\\n            # stored a new access token. Reuse it instead of replaying the old\\n            # one (which produces OAuth invalid_grant).\\n            if isinstance(current, str) and current and used and current != used:\\n                self._headers = None\\n                return\\n            self._refresh_locked(headers, data)\\n        finally:\\n            fcntl.flock(lock_fd, fcntl.LOCK_UN)\\n            os.close(lock_fd)\\n\\n    def _refresh_locked(self, headers: dict[str, str], data: dict[str, Any]) -> None:\\n        tokens = data.get(\\\"tokens\\\")\\n        registration = data.get(\\\"client_registration\\\")\\n        if not isinstance(tokens, dict) or not isinstance(registration, dict):\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_UNAVAILABLE\\\")\\n        refresh_token, client_id = tokens.get(\\\"refresh_token\\\"), registration.get(\\\"client_id\\\")\\n        if not isinstance(refresh_token, str) or not refresh_token or not isinstance(client_id, str) or not client_id:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_UNAVAILABLE\\\")\\n        fields: dict[str, str] = {\\n            \\\"grant_type\\\": \\\"refresh_token\\\", \\\"refresh_token\\\": refresh_token, \\\"client_id\\\": client_id,\\n        }\\n        secret = registration.get(\\\"client_secret\\\")\\n        auth_method = registration.get(\\\"token_endpoint_auth_method\\\")\\n        request_headers = {\\n            \\\"Content-Type\\\": \\\"application/x-www-form-urlencoded\\\", \\\"Accept\\\": \\\"application/json\\\",\\n            \\\"User-Agent\\\": IOL_CLIENT_USER_AGENT,\\n        }\\n        if isinstance(secret, str) and secret:\\n            if auth_method == \\\"client_secret_basic\\\":\\n                encoded = base64.b64encode((client_id + \\\":\\\" + secret).encode()).decode()\\n                request_headers[\\\"Authorization\\\"] = \\\"Basic \\\" + encoded\\n                fields.pop(\\\"client_id\\\")\\n            else:\\n                fields[\\\"client_secret\\\"] = secret\\n        endpoint = self._stored_token_endpoint(data)\\n        if not endpoint:\\n            try:\\n                endpoint = self._token_endpoint(headers)\\n            except IOLMCPError:\\n                issuer = _https_url(data.get(\\\"issuer\\\"))\\n                if not issuer:\\n                    raise\\n                # The verified IOL authorization-code flow exchanges at\\n                # <issuer>/token. This fallback is needed for proactive refresh,\\n                # which runs before there is a 401 challenge to inspect.\\n                endpoint = issuer.rstrip(\\\"/\\\") + \\\"/token\\\"\\n        request = urllib.request.Request(\\n            endpoint, data=urllib.parse.urlencode(fields).encode(),\\n            headers=request_headers, method=\\\"POST\\\",\\n        )\\n        try:\\n            with urllib.request.urlopen(request, timeout=self.timeout_seconds) as response:\\n                refreshed = json.loads(response.read().decode(errors=\\\"replace\\\"))\\n        except urllib.error.HTTPError as exc:\\n            exc.close()  # Never propagate or log the provider response body.\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_FAILED\\\", status_code=exc.code,\\n                              retry_after=_retry_after(dict(exc.headers or {})),\\n                              failure_class=\\\"HTTP\\\") from None\\n        except (urllib.error.URLError, TimeoutError):\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_FAILED\\\",\\n                              failure_class=\\\"TRANSPORT\\\") from None\\n        except json.JSONDecodeError:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_FAILED\\\",\\n                              failure_class=\\\"INVALID_JSON\\\") from None\\n        access_token = refreshed.get(\\\"access_token\\\") if isinstance(refreshed, dict) else None\\n        if not isinstance(access_token, str) or not access_token:\\n            raise IOLMCPError(\\\"IOL_MCP_OAUTH_REFRESH_FAILED\\\")\\n        updated_tokens = dict(tokens)\\n        for key in (\\\"access_token\\\", \\\"refresh_token\\\", \\\"expires_in\\\", \\\"scope\\\", \\\"token_type\\\"):\\n            if key in refreshed and refreshed[key] is not None:\\n                updated_tokens[key] = refreshed[key]\\n        now = time.time()\\n        data[\\\"tokens\\\"] = updated_tokens\\n        data[\\\"token_endpoint\\\"] = endpoint\\n        data[\\\"token_obtained_at_epoch\\\"] = now\\n        try:\\n            expires_in = float(updated_tokens.get(\\\"expires_in\\\"))\\n        except (TypeError, ValueError):\\n            expires_in = None\\n        if expires_in is not None and expires_in > 0:\\n            data[\\\"token_expires_at_epoch\\\"] = now + expires_in\\n        self._write_store(data)\\n        self._headers = None\\n\\n    def _rpc(self, method: str, params: dict[str, Any]) -> tuple[dict[str, Any], dict[str, str]]:\\n        headers = self._headers or self._load_headers()\\n        self._headers = headers\\n        self._request_id += 1\\n        outgoing = {key: value for key, value in headers.items() if key != \\\"_issuer\\\"}\\n        request = urllib.request.Request(\\n            headers[\\\"_issuer\\\"],\\n            data=json.dumps({\\\"jsonrpc\\\": \\\"2.0\\\", \\\"id\\\": self._request_id, \\\"method\\\": method, \\\"params\\\": params}).encode(),\\n            headers=outgoing, method=\\\"POST\\\",\\n        )\\n        try:\\n            with urllib.request.urlopen(request, timeout=self.timeout_seconds) as response:\\n                return _json_from_mcp_body(response.read().decode(errors=\\\"replace\\\")), dict(response.headers)\\n        except urllib.error.HTTPError as exc:\\n            exc.read()  # Consume the response without ever propagating its body.\\n            response_headers = dict(exc.headers)\\n            raise IOLMCPError(\\n                \\\"IOL_MCP_HTTP_\\\" + str(exc.code), status_code=exc.code,\\n                retry_after=_retry_after(response_headers), response_headers=response_headers,\\n            ) from None\\n        except (urllib.error.URLError, TimeoutError) as exc:\\n            raise IOLMCPError(\\\"IOL_MCP_TRANSPORT_UNAVAILABLE\\\") from exc\\n\\n    def _initialize(self) -> None:\\n        _, headers = self._rpc(\\\"initialize\\\", {\\n            \\\"protocolVersion\\\": \\\"2025-06-18\\\", \\\"capabilities\\\": {},\\n            \\\"clientInfo\\\": {\\\"name\\\": \\\"porota-rc6-iol-shadow\\\", \\\"version\\\": \\\"1.0\\\"},\\n        })\\n        session_id = headers.get(\\\"Mcp-Session-Id\\\") or headers.get(\\\"mcp-session-id\\\")\\n        if session_id:\\n            assert self._headers is not None\\n            self._headers[\\\"Mcp-Session-Id\\\"] = session_id\\n\\n    def list_tools(self) -> dict[str, Any]:\\n        \\\"\\\"\\\"Discover server capabilities without invoking any tool.\\\"\\\"\\\"\\n        for attempt in range(2):\\n            try:\\n                self._refresh_if_due()\\n                if self._headers is None:\\n                    self._initialize()\\n                result, _ = self._rpc(\\\"tools/list\\\", {})\\n                return result if isinstance(result, dict) else {}\\n            except IOLMCPError as exc:\\n                if attempt == 0 and exc.status_code == 401:\\n                    self._refresh_after_401(exc.response_headers)\\n                    continue\\n                raise\\n        raise AssertionError(\\\"unreachable\\\")\\n\\n    def call(self, tool_name: str, arguments: dict[str, Any]) -> dict[str, Any]:\\n        if tool_name not in ALLOWED_TOOLS:\\n            raise PermissionError(\\\"IOL_SHADOW_TOOL_DENIED:\\\" + tool_name)\\n        for attempt in range(2):\\n            try:\\n                self._refresh_if_due()\\n                if self._headers is None:\\n                    self._initialize()\\n                result, _ = self._rpc(\\\"tools/call\\\", {\\\"name\\\": tool_name, \\\"arguments\\\": dict(arguments)})\\n                return result\\n            except IOLMCPError as exc:\\n                if attempt == 0 and exc.status_code == 401:\\n                    self._refresh_after_401(exc.response_headers)\\n                    continue\\n                raise\\n        raise AssertionError(\\\"unreachable\\\")\\n\",module.__dict__)\n\nstore=module.DEFAULT_STORE\nassert store==callback_ns[\"STORE\"] and not store.is_symlink()\nbefore=hashlib.sha256(store.read_bytes()).hexdigest()\nproof={}\nclass ControlledRefresh(module.OAuthStoreReadOnlyMCP):\n    def _write_store(self,data):\n        proof[\"listed_read_only_tools\"]=callback_ns[\"confirm_read_only\"](data[\"tokens\"][\"access_token\"])\n        super()._write_store(data)\n\nclient=ControlledRefresh(store,timeout_seconds=12)\ntry:\n    client._refresh_if_due()\n    if not proof:\n        data=client._load_store()\n        proof[\"listed_read_only_tools\"]=callback_ns[\"confirm_read_only\"](data[\"tokens\"][\"access_token\"])\n    report={\"state\":\"AUTHENTICATED_READ_ONLY\",**proof}\nexcept callback_ns[\"ProviderHTTPError\"] as error:\n    report={\"state\":\"REAUTH_REQUIRED\",\"reason\":\"MCP_SCOPE_OR_TRANSPORT_VERIFICATION_FAILED\",**error.receipt()}\nexcept module.IOLMCPError as error:\n    report={\"state\":\"REAUTH_REQUIRED\",\"reason\":str(error) if re.fullmatch(r\"IOL_MCP_[A-Z0-9_]{1,60}\",str(error)) else \"IOL_MCP_ERROR\",\n            \"http\":error.status_code,\"stage\":\"OAUTH_REFRESH\"}\nexcept ValueError as error:\n    report={\"state\":\"REAUTH_REQUIRED\",\"reason\":str(error) if re.fullmatch(r\"(?:IOL|MCP)_[A-Z0-9_]{1,60}\",str(error)) else \"IOL_VERIFICATION_ERROR\"}\nreport[\"store_changed\"]=before!=hashlib.sha256(store.read_bytes()).hexdigest()\nreport[\"real_orders_sent\"]=0\nprint(json.dumps(report,sort_keys=True))\n"
          with connection(os.environ) as (ssh,_,_):
              result=ssh_run(ssh,['sudo','-n','/usr/bin/python3','-B','-'],data=source.encode(),timeout=65)
          if result.returncode:
