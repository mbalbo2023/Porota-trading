name: RC6 investigate OAuth code exchange and inspect physical PAPER sale
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08cfa083b0a060b6e503894c793a150bb948693c
          persist-credentials: false
      - name: Verify safe OAuth response and deployed observer read-only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import os
          from pathlib import Path
          from scripts.porota_actions_host import connection, decode_receipt, ssh_run

          oauth_probe = "import ast\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nfrom urllib.error import HTTPError, URLError\nfrom urllib.parse import urlencode, urlsplit\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\n\nSITE = \"https://mcp.invertironline.com\"\nUA = \"Porota-Trading-RC6/1.0 (IOL MCP read-only)\"\nEXPECTED_SOURCE = \"08cfa083b0a060b6e503894c793a150bb948693c\"\nEXPECTED_DEPLOY = \"3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1\"\nEXPECTED_HASH = \"7446edfa73383a2feeb5672a50a63a335f4b7d912d19c88424924e1fb3777ea0\"\nAUTH = {\"none\", \"client_secret_post\", \"client_secret_basic\", \"private_key_jwt\"}\nGRANTS = {\"authorization_code\", \"refresh_token\", \"client_credentials\"}\nERRORS = {\"invalid_request\", \"invalid_grant\", \"invalid_client\", \"unauthorized_client\",\n          \"unsupported_grant_type\", \"invalid_target\", \"access_denied\", \"forbidden\",\n          \"country_block\", \"ip_block\", \"waf_block\", \"invalid_scope\", \"rate_limited\"}\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\ndef own_endpoint(value):\n    if not isinstance(value, str):\n        return None\n    parsed = urlsplit(value)\n    if (parsed.scheme == \"https\" and parsed.netloc == \"mcp.invertironline.com\"\n        and not parsed.query and not parsed.fragment\n        and re.fullmatch(r\"/[a-zA-Z0-9./_-]{0,100}\", parsed.path or \"/\")):\n        return SITE + parsed.path\n    return None\n\ndef response(path, *, data=None):\n    headers = {\"Accept\": \"application/json\", \"User-Agent\": UA}\n    if data is not None:\n        headers[\"Content-Type\"] = \"application/x-www-form-urlencoded\"\n    try:\n        received = build_opener(NoRedirect).open(Request(SITE + path, data=data, headers=headers), timeout=8)\n    except HTTPError as error:\n        received = error\n    except (URLError, TimeoutError, OSError) as error:\n        return {\"transport\": type(error).__name__}, {}\n    with received:\n        result = {\"http\": received.code, \"format\": received.headers.get_content_type()}\n        trace = received.headers.get(\"CF-Ray\", \"\")\n        if re.fullmatch(r\"[a-fA-F0-9]{8,32}-[A-Z0-9]{2,8}\", trace):\n            result[\"trace_id\"] = trace\n        mitigated = received.headers.get(\"cf-mitigated\", \"\")\n        if mitigated.lower() == \"challenge\":\n            result[\"edge_challenge\"] = True\n        raw = received.read(16_385)\n        if len(raw) > 16_384:\n            return {**result, \"body_limit\": True}, {}\n        if result[\"format\"].endswith(\"json\"):\n            try:\n                payload = json.loads(raw)\n            except (UnicodeError, ValueError):\n                payload = None\n            if isinstance(payload, dict):\n                err = payload.get(\"error\")\n                if isinstance(err, str) and err in ERRORS:\n                    result[\"oauth_error\"] = err\n                return result, payload\n        if result[\"format\"] == \"text/html\":\n            html = raw.decode(\"utf-8\", errors=\"replace\").lower()\n            signatures = {\n                \"CLOUDFLARE_CHALLENGE\": (\"cdn-cgi/challenge-platform\", \"just a moment\"),\n                \"CLOUDFLARE_ACCESS_DENIED\": (\"cloudflare ray id\", \"attention required\"),\n                \"COUNTRY_RESTRICTION_TEXT\": (\"not available in your country\", \"not available in your region\",\n                    \"no está disponible en tu país\", \"no disponible en tu región\"),\n                \"ORIGIN_GENERIC_FORBIDDEN\": (\"<title>403 forbidden</title>\",),\n            }\n            result[\"html_markers\"] = [key for key, phrases in signatures.items()\n                                      if any(phrase in html for phrase in phrases)]\n            ids = re.findall(r\"(?:error code|error)\\s*[:#]?\\s*(10[0-9]{2}|11[0-9]{2})\\b\", html)\n            if ids and \"trace_id\" in result:\n                result[\"edge_error_code\"] = int(ids[0])\n        return result, {}\n\ndef allowed_list(payload, key, allowed):\n    values = payload.get(key)\n    return sorted({i for i in values if isinstance(i, str) and i in allowed}) if isinstance(values, list) else []\n\ndef metadata():\n    rs, resource = response(\"/.well-known/oauth-protected-resource\")\n    as_status, server = response(\"/.well-known/oauth-authorization-server\")\n    endpoints = {key: own_endpoint(server.get(key)) for key in (\"issuer\", \"authorization_endpoint\",\n                    \"token_endpoint\", \"registration_endpoint\")}\n    auth_servers = resource.get(\"authorization_servers\")\n    check = {\n        \"resource_metadata\": rs, \"authorization_metadata\": as_status,\n        \"public_resource_matches\": isinstance(auth_servers, list) and SITE in auth_servers,\n        \"endpoints\": endpoints,\n        \"pkce_s256\": \"S256\" in allowed_list(server, \"code_challenge_methods_supported\", {\"S256\"}),\n        \"token_auth_methods\": allowed_list(server, \"token_endpoint_auth_methods_supported\", AUTH),\n        \"grant_types\": allowed_list(server, \"grant_types_supported\", GRANTS),\n    }\n    endpoint = endpoints[\"token_endpoint\"]\n    # One deliberately incomplete, credential-free OAuth request. No valid code or account is used.\n    token, _ = response(urlsplit(endpoint).path if endpoint else \"/token\",\n                        data=urlencode({\"grant_type\": \"authorization_code\"}).encode())\n    return {**check, \"public_token_probe\": token}\n\ndef key_state(path):\n    observed = path.lstat()\n    assert path.resolve() == path and stat.S_ISREG(observed.st_mode) and observed.st_uid == 0\n    assert stat.S_IMODE(observed.st_mode) == 0o600 and observed.st_nlink == 1 and observed.st_size < 128_000\n    return json.loads(path.read_bytes())\n\ndef droplet():\n    marker = json.loads(Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\").read_bytes())\n    assert marker.get(\"candidate_sha\") == EXPECTED_SOURCE and marker.get(\"deployment_sha\") == EXPECTED_DEPLOY\n    assert marker.get(\"mode\") == \"PRODUCTION_PAPER\" and marker.get(\"real_order_capability\") == \"BLOCKED\"\n    assert type(marker.get(\"real_orders_sent\")) is int and marker[\"real_orders_sent\"] == 0\n    adapter = Path(\"/var/lib/porota-rc6-iol\") / EXPECTED_SOURCE / \"iol_mcp_readonly_adapter_rc6.py\"\n    observed = adapter.lstat()\n    assert adapter.resolve() == adapter and stat.S_ISREG(observed.st_mode) and observed.st_uid == 0\n    assert not observed.st_mode & 0o022 and observed.st_nlink == 1 and observed.st_size < 128_000\n    archive = adapter.read_bytes()\n    digest = hashlib.sha256(archive).hexdigest()\n    assert digest == EXPECTED_HASH\n    declared = next(n.value.value for n in ast.parse(archive).body\n                    if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name)\n                    and t.id == \"MCP_PROTOCOL_VERSION\" for t in n.targets)\n                    and isinstance(n.value, ast.Constant))\n    profile = key_state(Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\"))\n    registration = profile.get(\"client_registration\") or {}\n    method = registration.get(\"token_endpoint_auth_method\")\n    endpoint = own_endpoint(profile.get(\"token_endpoint\"))\n    redirect = profile.get(\"redirect_uri\") == \"http://127.0.0.1:8765/callback\"\n    return {\"source_sha\": EXPECTED_SOURCE, \"deployment_sha\": EXPECTED_DEPLOY,\n            \"adapter_sha256\": digest, \"mcp_initialize_protocol\": declared,\n            \"registration_auth_method\": method if isinstance(method, str) and method in AUTH else\n                        \"absent\" if method is None else \"unsupported\",\n            \"has_client_secret\": bool(registration.get(\"client_secret\")),\n            \"callback_loopback_matches\": redirect, \"stored_token_endpoint\": endpoint,\n            \"mode\": marker[\"mode\"], \"real_orders_sent\": marker[\"real_orders_sent\"]}\n\n\nimport secrets\n\nSTORE = Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\")\nclient = droplet()\nregistration = key_state(STORE)[\"client_registration\"]\nassert client[\"registration_auth_method\"] == \"none\"\nclient_id = registration[\"client_id\"]\nassert isinstance(client_id, str) and 1 <= len(client_id) <= 256\nverifier = secrets.token_urlsafe(64)\nfake_code = \"porota-invalid-diagnostic-\" + secrets.token_urlsafe(36)\nform = {\"grant_type\": \"authorization_code\", \"code\": fake_code,\n    \"client_id\": client_id, \"redirect_uri\": \"http://127.0.0.1:8765/callback\", \"code_verifier\": verifier,\n    \"resource\": SITE}\nprobe_status, _ = response(\"/token\", data=urlencode(form).encode())\nprint(json.dumps({\"state\":\"CREDENTIAL_FREE_OAUTH_PROBE\",\"tested_from\":\"DROPLET\",\n    \"form\":\"authorization_code + PKCE + resource; fictional code; no token or secret\",\n    \"result\":probe_status, \"real_orders_sent\":client[\"real_orders_sent\"],\n    \"source_sha\":client[\"source_sha\"], \"utc\":datetime.now(timezone.utc).isoformat()},sort_keys=True))\n"
          fi_probe = "import json,os,re,subprocess\nfrom pathlib import Path\nuid=os.getuid()\nassert uid>0 and uid==os.geteuid()\nmarker=json.loads(Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\").read_text())\nassert marker[\"deployment_sha\"]==\"3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1\" and marker[\"real_orders_sent\"]==0 and marker[\"mode\"]==\"PRODUCTION_PAPER\"\nsocket=Path(f\"/run/user/{uid}/porota-rc6-docker.sock\")\nassert socket.is_socket() and not socket.is_symlink()\ncommand=[\"/usr/bin/docker\",\"--host\",f\"unix://{socket}\"]\nobserver=subprocess.run(command+[\"ps\",\"--no-trunc\",\"--filter\",\"label=io.porota.project=rc6\",\"--filter\",\n                                     \"label=io.porota.role=observer\",\"--format\",\"{{.ID}}\"],\n                        check=True,capture_output=True,text=True,timeout=8).stdout.splitlines()\nassert len(observer)==1 and re.fullmatch(r\"[0-9a-f]{64}\",observer[0])\noutput=subprocess.run(command+[\"exec\",\"-i\",observer[0],\"python\",\"-B\",\"-\"],\n                      input=\"import ast,datetime,hashlib,json,os\\nfrom pathlib import Path\\nimport re,sqlite3\\nassert os.getenv(\\\"POROTA_BUILD_SHA\\\")==\\\"08cfa083b0a060b6e503894c793a150bb948693c\\\"\\nassert os.getenv(\\\"DASHBOARD_OPERATION_MODE\\\")==\\\"PRODUCTION_PAPER\\\"\\nassert os.getenv(\\\"REAL_ORDER_CAPABILITY\\\")==\\\"BLOCKED\\\" and os.getenv(\\\"EXECUTION_MODE\\\")==\\\"SIMULATION\\\"\\ndb=Path(\\\"/app/data/paper_v17/observer_v17.db\\\")\\nassert os.getenv(\\\"PAPER_V17_DB_PATH\\\")==str(db)\\nguard=ast.parse(Path(\\\"/app/rc6_paper_causal_decision_receipt.py\\\").read_text())\\nwanted={\\\"PINNED_DECISION_SIGNER_KEY_SHA256\\\",\\\"PINNED_RELEASE_SHA256\\\"}\\npins={}\\nfor node in guard.body:\\n    if isinstance(node,ast.AnnAssign) and isinstance(node.target,ast.Name) and node.target.id in wanted:\\n        pins[node.target.id]=isinstance(node.value,ast.Constant) and isinstance(node.value.value,str)\\nassert set(pins)==wanted\\nruntime=ast.parse(Path(\\\"/app/bv_paper_runtime.py\\\").read_text())\\nprovider=any(isinstance(node,ast.keyword) and node.arg==\\\"market_sale_witness\\\" for node in ast.walk(runtime))\\npolicy_path=Path(os.getenv(\\\"POROTA_FI_EVIDENCE_DIRECTORY\\\",str(db.parent/\\\"fixed-income-evidence\\\")))/\\\"market-sale-policy.json\\\"\\npin=os.getenv(\\\"POROTA_FI_MARKET_SALE_POLICY_SHA256\\\",\\\"\\\")\\npresent=policy_path.is_file() and not policy_path.is_symlink()\\nrelease_claim=bool(re.fullmatch(r\\\"[0-9a-f]{64}\\\",os.getenv(\\\"POROTA_RC6_RELEASE_SHA256\\\",\\\"\\\")))\\ndigest_ok=False\\nif present and policy_path.stat().st_size<=131072 and re.fullmatch(r\\\"[a-f0-9]{64}\\\",pin):\\n    digest_ok=hashlib.sha256(policy_path.read_bytes()).hexdigest()==pin\\nwith sqlite3.connect(db.as_uri()+\\\"?mode=ro\\\",uri=True,timeout=.5) as sql:\\n    sql.execute(\\\"PRAGMA query_only=ON\\\")\\n    sql.set_progress_handler(lambda: int(__import__(\\\"time\\\").monotonic()>limit),1000)\\n    limit=__import__(\\\"time\\\").monotonic()+2\\n    assert sql.execute(\\\"SELECT real_orders_sent FROM observer_state\\\").fetchone()==(0,)\\n    intent=sql.execute(\\\"SELECT count(*) FROM (SELECT 1 FROM paper_causal_decision_freezes WHERE decision_key LIKE 'FI_SELL:%' LIMIT 1001)\\\").fetchone()[0]\\n    receipt=sql.execute(\\\"SELECT count(*) FROM (SELECT 1 FROM paper_causal_decision_receipts WHERE decision_key LIKE 'FI_SELL:%' LIMIT 1001)\\\").fetchone()[0]\\nprint(json.dumps({\\\"source_sha\\\":os.getenv(\\\"POROTA_BUILD_SHA\\\"),\\\"mode\\\":\\\"PRODUCTION_PAPER\\\",\\n    \\\"real_orders_sent\\\":0,\\\"provider_requests\\\":0,\\\"writes\\\":0,\\\"pins\\\":pins,\\\"broker_witness_injected\\\":provider,\\n    \\\"release_claim_in_observer\\\":release_claim,\\\"sale_policy_present\\\":present,\\\"sale_policy_pin_present\\\":bool(re.fullmatch(r\\\"[a-f0-9]{64}\\\",pin)),\\n    \\\"sale_policy_digest_valid\\\":digest_ok,\\\"bounded_fi_sell_intents\\\":intent,\\\"bounded_fi_sell_receipts\\\":receipt,\\n    \\\"observed_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat()},sort_keys=True))\\n\",check=True,capture_output=True,text=True,timeout=12)\nreport=json.loads(output.stdout)\nreport[\"deployment_sha\"]=marker[\"deployment_sha\"]\nprint(json.dumps(report,sort_keys=True))\n"
          with connection(os.environ) as (ssh, _, _), ThreadPoolExecutor(2) as pool:
              oauth_task = pool.submit(ssh_run, ssh, ['sudo', '-n', '/usr/bin/python3', '-B', '-'],
                                       data=oauth_probe.encode(), timeout=28)
              fi_task = pool.submit(ssh_run, ssh, ['/usr/bin/python3', '-B', '-'],
                                    data=fi_probe.encode(), timeout=34)
              results = {name: task.result() for name, task in
                         [('iol-code-form', oauth_task), ('fi-sale-authority', fi_task)]}
          for name, result in results.items():
              output = decode_receipt(result.stdout) if result.returncode == 0 else {'state': 'NO_VERIFICADO', 'exit': result.returncode}
              print(json.dumps({name: output}, sort_keys=True))
              Path(os.environ['RUNNER_TEMP'], name + '.json').write_text(json.dumps(output, indent=2))
          if any(result.returncode for result in results.values()):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-iol-request-and-fi-physical
          path: |
            ${{ runner.temp }}/iol-code-form.json
            ${{ runner.temp }}/fi-sale-authority.json
          retention-days: 14
          if-no-files-found: error
