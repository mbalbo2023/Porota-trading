name: RC6 IOL one-time automatic consent diagnostic
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  consent:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08cfa083b0a060b6e503894c793a150bb948693c
          persist-credentials: false
      - name: Prepare private OAuth consent URL for requested Automatic mode
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          import base64, json, os, subprocess, tempfile
          from pathlib import Path
          from scripts.porota_actions_host import connection, ssh_run
          code = "STAGE=\"prepare\"\nSESSION=\"rc6-deploy200-20261123-automatic-twehxxti\"\n\"\"\"One-time IOL consent diagnostic. Token stays in memory and is discarded.\"\"\"\n\nimport base64\nimport hashlib\nimport hmac\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport socket\nimport stat\nimport sys\nimport tempfile\nimport time\nfrom urllib.error import HTTPError\nfrom urllib.parse import parse_qs, urlencode, urlsplit\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\n\n\nISSUER = \"https://mcp.invertironline.com\"\nUSER_AGENT = \"Porota-Trading-RC6/1.0 (IOL MCP read-only)\"\nPORT = 8765\nREDIRECT = f\"http://127.0.0.1:{PORT}/callback\"\nSTORE = Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\")\nPENDING = STORE.with_name(\"iol_mcp_automatic_pending_\" + SESSION + \".json\")\nLIFETIME = 1200\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\n\nclass ProviderHTTPError(Exception):\n    def __init__(self, stage, response):\n        self.stage, self.status = stage, response.code\n        kind = response.headers.get_content_type()\n        self.format = \"json\" if kind.endswith(\"json\") else \"html\" if kind==\"text/html\" else \"other\"\n        trace = response.headers.get(\"CF-Ray\", \"\")\n        self.trace = trace if re.fullmatch(r\"[a-fA-F0-9]{8,32}-[A-Z0-9]{2,8}\", trace) else None\n        self.provider_error = None\n        self.edge_code = None\n        self.edge_challenge = response.headers.get(\"cf-mitigated\", \"\").lower() == \"challenge\"\n        try:\n            raw = response.read(8193)\n            if self.format == \"html\":\n                text = raw.decode(\"utf-8\", errors=\"replace\").lower()\n                self.edge_challenge = self.edge_challenge or \"cdn-cgi/challenge-platform\" in text\n            body = json.loads(raw) if self.format == \"json\" else {}\n        except (OSError, ValueError):\n            body = {}\n        if isinstance(body,dict):\n            known = (\"invalid_request\", \"invalid_grant\", \"invalid_client\", \"unauthorized_client\", \"invalid_scope\",\n                     \"invalid_target\", \"access_denied\", \"forbidden\", \"insufficient_scope\", \"country_block\",\n                     \"country_challenge\", \"waf_block\", \"ip_block\", \"unsupported_grant_type\", \"rate_limited\")\n            for key in (\"error\", \"error_name\", \"error_type\", \"error_code\", \"code\"):\n                item = body.get(key)\n                if isinstance(item,str) and item.lower() in known:\n                    self.provider_error = item.lower()\n                if self.trace and (type(item) is int or (isinstance(item,str) and re.fullmatch(r\"1\\d{3}\",item))) and 1000<=int(item)<=1200:\n                    self.edge_code = int(item)\n        super().__init__(stage)\n\n    def receipt(self):\n        return {\"stage\":self.stage,\"http\":self.status,\"format\":self.format,\n                \"provider_error\":self.provider_error,\"edge_code\":self.edge_code,\"trace_id\":self.trace,\n                \"edge_challenge\":self.edge_challenge}\n\n\ndef exchange(path, data, headers, *, stage):\n    assert path in (\"/token\", \"\")\n    req = Request(ISSUER + path, data=data,\n                  headers={**headers, \"User-Agent\":USER_AGENT}, method=\"POST\")\n    try:\n        with build_opener(NoRedirect).open(req, timeout=15) as response:\n            body = response.read(512_001)\n            if len(body) > 512_000:\n                raise ValueError(\"IOL_PROVIDER_RESPONSE_LIMIT\")\n            return body, response.headers\n    except HTTPError as error:\n        with error:\n            raise ProviderHTTPError(stage,error) from None\n\n\ndef inspect_token(token):\n    # Approved requests are hard coded. An MCP answer cannot select a method.\n    source = Path(\"/var/lib/porota-rc6-iol/08cfa083b0a060b6e503894c793a150bb948693c\")\n    adapter = source / \"iol_mcp_readonly_adapter_rc6.py\"\n    meta = adapter.lstat()\n    if (adapter.resolve() != adapter or not stat.S_ISREG(meta.st_mode) or meta.st_uid != 0\n            or meta.st_nlink != 1 or meta.st_mode & 0o022 or meta.st_size > 128000\n            or hashlib.sha256(adapter.read_bytes()).hexdigest()\n                != \"7446edfa73383a2feeb5672a50a63a335f4b7d912d19c88424924e1fb3777ea0\"):\n        raise ValueError(\"IOL_EFFECTIVE_ADAPTER_UNVERIFIED\")\n    sys.path.insert(0, str(source))\n    from iol_mcp_readonly_adapter_rc6 import _json_from_mcp_body\n\n    headers = {\"Authorization\": \"Bearer \" + token, \"Content-Type\": \"application/json\",\n               \"Accept\": \"application/json, text/event-stream\"}\n    init = {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"initialize\",\n            \"params\": {\"protocolVersion\": \"2025-06-18\", \"capabilities\": {},\n                       \"clientInfo\": {\"name\": \"porota-iol-consent-diagnostic\", \"version\": \"1.0\"}}}\n    body, response_headers = exchange(\"\", json.dumps(init).encode(), headers, stage=\"MCP_INITIALIZE\")\n    protocol = _json_from_mcp_body(body.decode(\"utf-8\")).get(\"protocolVersion\")\n    if protocol not in {\"2025-03-26\", \"2025-06-18\", \"2025-11-25\"}:\n        raise ValueError(\"IOL_MCP_PROTOCOL_VERSION_UNVERIFIED\")\n    headers[\"MCP-Protocol-Version\"] = protocol\n    session = response_headers.get(\"Mcp-Session-Id\")\n    if session:\n        if not re.fullmatch(r\"[!-~]{1,512}\", session):\n            raise ValueError(\"IOL_MCP_SESSION_ID_UNVERIFIED\")\n        headers[\"Mcp-Session-Id\"] = session\n    notification = {\"jsonrpc\": \"2.0\", \"method\": \"notifications/initialized\"}\n    exchange(\"\", json.dumps(notification).encode(), headers, stage=\"MCP_INIT_NOTIFICATION\")\n    access_mode = {\"jsonrpc\": \"2.0\", \"id\": 2, \"method\": \"tools/call\",\n                   \"params\": {\"name\": \"get_access_mode\", \"arguments\": {}}}\n    body, _ = exchange(\"\", json.dumps(access_mode).encode(), headers, stage=\"MCP_ACCESS_MODE\")\n    mode = _json_from_mcp_body(body.decode(\"utf-8\")).get(\"mode\")\n    if mode in (\"automatic\", \"auto\", \"automático\", \"automatico\", \"full\"):\n        return \"AUTOMATIC\"\n    if mode in (\"read_only\", \"confirm\", \"confirm_operations\", \"confirmation_required\"):\n        return \"OTHER_MODE\"\n    return \"MODE_UNVERIFIED\"\n\n\ndef write_private(path, data):\n    fd, file = tempfile.mkstemp(prefix=\"iol-consent-\", dir=path.parent)\n    try:\n        with os.fdopen(fd,\"w\",encoding=\"utf-8\") as f:\n            json.dump(data,f,sort_keys=True)\n            f.flush()\n            os.fsync(f.fileno())\n        os.replace(file,path)\n    finally:\n        if os.path.exists(file):\n            os.unlink(file)\n\n\ndef current_digest():\n    meta = STORE.lstat()\n    if (STORE.resolve() != STORE or not stat.S_ISREG(meta.st_mode) or meta.st_uid != 0\n            or stat.S_IMODE(meta.st_mode) != 0o600 or meta.st_nlink != 1 or meta.st_size > 128_000):\n        raise ValueError(\"IOL_STORE_UNVERIFIED\")\n    return hashlib.sha256(STORE.read_bytes()).hexdigest()\n\n\ndef require_paper():\n    marker=Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\")\n    state=json.loads(marker.read_text())\n    if (state.get(\"mode\") != \"PRODUCTION_PAPER\" or type(state.get(\"real_orders_sent\")) is not int\n            or state[\"real_orders_sent\"] != 0 or state.get(\"validation_status\") != \"VALIDATED_RUNTIME\"\n            or state.get(\"real_order_capability\") != \"BLOCKED\"\n            or state.get(\"candidate_sha\") != \"08cfa083b0a060b6e503894c793a150bb948693c\"\n            or state.get(\"deployment_sha\") != \"3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1\"):\n        raise ValueError(\"IOL_PAPER_RUNTIME_UNVERIFIED\")\n\n\ndef prepare():\n    require_paper()\n    with socket.socket() as sock:\n        sock.bind((\"127.0.0.1\",PORT))\n    before=current_digest()\n    prior=json.loads(STORE.read_bytes())\n    if prior.get(\"issuer\") != ISSUER or prior.get(\"redirect_uri\") != REDIRECT:\n        raise ValueError(\"IOL_EXISTING_REGISTRATION_REDIRECT_UNVERIFIED\")\n    client=prior.get(\"client_registration\",{})\n    client_id=client.get(\"client_id\")\n    if not isinstance(client_id,str) or not 0<len(client_id)<256:\n        raise ValueError(\"IOL_REGISTRATION_UNVERIFIED\")\n    if client.get(\"redirect_uris\") is not None and REDIRECT not in client[\"redirect_uris\"]:\n        raise ValueError(\"IOL_REDIRECT_UNVERIFIED\")\n    verifier=secrets.token_urlsafe(64)\n    challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b\"=\").decode()\n    state=secrets.token_urlsafe(32)\n    write_private(PENDING,{\"state\":state,\"verifier\":verifier,\"client_id\":client_id,\n                           \"expires\":time.time()+LIFETIME,\"store_digest\":before})\n    q={\"response_type\":\"code\",\"client_id\":client_id,\"redirect_uri\":REDIRECT,\"code_challenge\":challenge,\n       \"code_challenge_method\":\"S256\",\"state\":state,\"resource\":ISSUER}\n    print(json.dumps({\"url\":ISSUER+\"/authorize?\"+urlencode(q),\"expires\":int(time.time()+LIFETIME)}))\n\n\ndef apply(code,pending):\n    require_paper()\n    if current_digest()!=pending[\"store_digest\"]:\n        raise ValueError(\"IOL_STORE_CHANGED\")\n    client=json.loads(STORE.read_bytes())[\"client_registration\"]\n    fields={\"grant_type\":\"authorization_code\",\"code\":code,\"redirect_uri\":REDIRECT,\n            \"client_id\":pending[\"client_id\"],\"code_verifier\":pending[\"verifier\"],\"resource\":ISSUER}\n    headers={\"Content-Type\":\"application/x-www-form-urlencoded\",\"Accept\":\"application/json\"}\n    secret=client.get(\"client_secret\")\n    if secret:\n        if client.get(\"token_endpoint_auth_method\")==\"client_secret_basic\":\n            encoded=base64.b64encode((fields.pop(\"client_id\")+\":\"+secret).encode()).decode()\n            headers[\"Authorization\"]=\"Basic \"+encoded\n        elif client.get(\"token_endpoint_auth_method\")==\"client_secret_post\":\n            fields[\"client_secret\"]=secret\n        else:\n            raise ValueError(\"IOL_REGISTRATION_AUTH_UNVERIFIED\")\n    raw, _ = exchange(\"/token\",urlencode(fields).encode(),headers,stage=\"OAUTH_TOKEN_EXCHANGE\")\n    tokens = json.loads(raw)\n    token = tokens.get(\"access_token\") if isinstance(tokens, dict) else None\n    if not isinstance(token, str) or not re.fullmatch(r\"[!-~]{1,16384}\", token):\n        return {\"state\": \"TOKEN_RESPONSE_UNVERIFIED\", \"token_exchange_verified\": False}\n    # Call only the read-only access-mode check. Discard both credentials on return.\n    try:\n        mode = inspect_token(token)\n        return {\"state\": \"AUTOMATIC_VERIFIED\" if mode == \"AUTOMATIC\" else \"OAUTH_EXCHANGED_\" + mode,\n                \"token_exchange_verified\": True, \"mode\": mode}\n    except ProviderHTTPError as exc:\n        return {\"state\": \"OAUTH_EXCHANGED_MCP_STATUS_UNVERIFIED\", \"token_exchange_verified\": True,\n                **exc.receipt()}\n    except Exception:\n        return {\"state\": \"OAUTH_EXCHANGED_MCP_STATUS_UNVERIFIED\", \"token_exchange_verified\": True}\n\n\ndef receive():\n    meta = PENDING.lstat()\n    if (PENDING.resolve() != PENDING or not stat.S_ISREG(meta.st_mode) or meta.st_uid != 0\n            or stat.S_IMODE(meta.st_mode) != 0o600 or meta.st_nlink != 1 or meta.st_size > 8192):\n        raise ValueError(\"IOL_PENDING_CUSTODY_UNVERIFIED\")\n    pending=json.loads(PENDING.read_text())\n    result={\"state\":\"CONSENT_EXPIRED\",\"session\":SESSION,\"store_updated_by_test\":False}\n    class Callback(BaseHTTPRequestHandler):\n        timeout = 5\n\n        def log_message(self,*args):\n            pass\n\n        def reply(self, status, title):\n            self.send_response(status)\n            self.send_header(\"Content-Type\",\"text/plain; charset=utf-8\")\n            self.send_header(\"Cache-Control\",\"no-store\")\n            self.send_header(\"Referrer-Policy\",\"no-referrer\")\n            self.end_headers()\n            self.wfile.write(title.encode(\"utf-8\"))\n\n        def do_GET(self):\n            parsed=urlsplit(self.path)\n            params=parse_qs(parsed.query,max_num_fields=12)\n            states=params.get(\"state\", [])\n            codes=params.get(\"code\",[])\n            if (parsed.path!=\"/callback\" or len(states)!=1\n                    or not hmac.compare_digest(states[0],pending[\"state\"])):\n                self.send_error(400,\"Callback invalido\")\n                return\n            if len(codes)!=1 or not 0<len(codes[0])<=2048:\n                result[\"state\"]=\"CONSENT_NO_CODE\"\n                self.send_error(400,\"IOL no devolvio autorizacion\")\n                return\n            try:\n                result.update(apply(codes[0],pending))\n            except ProviderHTTPError as error:\n                result.update(state=\"IOL_UPSTREAM_REJECTED\",**error.receipt())\n                self.reply(502,f\"IOL rechazó el canje OAuth (HTTP {error.status}). Podés cerrar esta página.\")\n            except Exception as error:\n                result[\"state\"]=\"OAUTH_CALLBACK_UNVERIFIED\"\n                result[\"class\"]=type(error).__name__\n                if isinstance(error,ValueError) and str(error).startswith((\"MCP_\",\"IOL_\")):\n                    result[\"reason\"]=str(error)\n                self.reply(500,\"Porota no pudo verificar el acceso Solo lectura. Podés cerrar esta página.\")\n            else:\n                if result[\"state\"] == \"AUTOMATIC_VERIFIED\":\n                    self.reply(200,\"IOL confirmó el modo Automático de esta prueba. Podés cerrar esta página.\")\n                elif result.get(\"token_exchange_verified\"):\n                    self.reply(200,\"IOL completó el canje. El modo Automático no quedó confirmado. Podés cerrar esta página.\")\n                else:\n                    self.reply(502,\"El canje de IOL no quedó verificado. Podés cerrar esta página.\")\n    try:\n        with HTTPServer((\"127.0.0.1\",PORT),Callback) as server:\n            server.timeout=2\n            while time.time()<pending[\"expires\"] and result[\"state\"]==\"CONSENT_EXPIRED\":\n                server.handle_request()\n    finally:\n        PENDING.unlink(missing_ok=True)\n    print(json.dumps(result,sort_keys=True))\n\n\nif __name__==\"__main__\":\n    try:\n        {\"prepare\":prepare,\"receive\":receive}[STAGE]()\n    except (ValueError, OSError, HTTPError) as error:\n        reason = str(error) if type(error) is ValueError and str(error).startswith(\"IOL_\") else type(error).__name__\n        print(json.dumps({\"state\":\"IOL_CALLBACK_SETUP_FAILED\",\"reason\":reason,\n                          \"http\":error.code if isinstance(error,HTTPError) else None}))\n        sys.exit(1)\n"
          with connection(os.environ) as (ssh, _, _):
              response = ssh_run(ssh, ['sudo', '-n', '/usr/bin/python3', '-B', '-'],
                                 data=code.encode(), timeout=35)
          if response.returncode:
              try:
                  result = json.loads(response.stdout)
                  assert result.get('state') == 'IOL_CALLBACK_SETUP_FAILED'
              except (ValueError, AssertionError):
                  result = {'state': 'IOL_CALLBACK_PREPARE_UNVERIFIED'}
              print(json.dumps(result))
              raise SystemExit(1)
          payload = json.loads(response.stdout)
          assert payload['url'].startswith('https://mcp.invertironline.com/authorize?')
          with tempfile.NamedTemporaryFile(mode='w') as file:
              file.write("-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAxthcty2d9KkKeuWwsPzd\n2+0YBRzjUyqL0mA1MKs2Qbr+MmVUBy2KXDhdYEPcmupOw30uIRd4hF/+VEV1JXxJ\n0HIFSZiOlnYIKNvuJ3jjTFGyxIi6hugdbrzjPr1tG5mvfXSQSFRytV+0z2ShMicB\nWLFcHyUp64s3khsQKH8ZyliLaUxk83JzmZ3b9+idQ6KVDMedOvVSMPhd26lTcyPt\no65snmnVS1ob4xStwEl8BSqZNPOkxle/MJpGaUp/fluz9CCaGc3hXotpA8sEYpAo\nYLr0ZJTGf/Y1fXPHKHrGsNirtvDdigW1M4cm3GCocDiEDWAj/jGpbD3uY9OxGji4\nc5vn40lO7yHi5AJzrViv0aleAlFNig5cyPFYHRfk0cJaWUYUsHR/0JWJSajZJFJh\nEt3pQ1jIF61ORnkwbv1NPC8uB1LDOoXkmSc+mu1SRrO31z+Dcwv/B2KBG40jIfYt\nxSOL07whl/UI+NFcJFTfZETo+NQ8aBcK8kQ6D3J9PeTGc4f4T7aAWCdp0HC/oM57\n0MjznrvDQeR9k3m1HKIHvhHihezUTV3px/ENxbJshk9W1E6haPG2icZDwdLY+nP5\nFziWkUUqT+XeyTIoDQzoX9thVy8gpWfJ0RwV1xPa+exTmNNNLLrTnhGDJ1fLeT8P\ncJkrgEC8D2jkhC5KmlMxMcECAwEAAQ==\n-----END PUBLIC KEY-----\n")
              file.flush()
              encrypted = []
              for start in range(0, len(response.stdout), 300):
                  result = subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey',file.name,
                      '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],
                      input=response.stdout[start:start+300],capture_output=True,check=True)
                  encrypted.append(base64.b64encode(result.stdout).decode())
          Path(os.environ['RUNNER_TEMP'], 'iol-consent.json').write_text(
              json.dumps({'blocks': encrypted, 'expires': payload['expires']}))
          print('IOL_CONSENT_ENCRYPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iol-consent-encrypted
          path: ${{ runner.temp }}/iol-consent.json
          if-no-files-found: error
          retention-days: 1
      - name: Receive one callback and report access mode without storing tokens
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.porota_actions_host import connection, ssh_run
          code = "STAGE=\"receive\"\nSESSION=\"rc6-deploy200-20261123-automatic-twehxxti\"\n\"\"\"One-time IOL consent diagnostic. Token stays in memory and is discarded.\"\"\"\n\nimport base64\nimport hashlib\nimport hmac\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport socket\nimport stat\nimport sys\nimport tempfile\nimport time\nfrom urllib.error import HTTPError\nfrom urllib.parse import parse_qs, urlencode, urlsplit\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\n\n\nISSUER = \"https://mcp.invertironline.com\"\nUSER_AGENT = \"Porota-Trading-RC6/1.0 (IOL MCP read-only)\"\nPORT = 8765\nREDIRECT = f\"http://127.0.0.1:{PORT}/callback\"\nSTORE = Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\")\nPENDING = STORE.with_name(\"iol_mcp_automatic_pending_\" + SESSION + \".json\")\nLIFETIME = 1200\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\n\nclass ProviderHTTPError(Exception):\n    def __init__(self, stage, response):\n        self.stage, self.status = stage, response.code\n        kind = response.headers.get_content_type()\n        self.format = \"json\" if kind.endswith(\"json\") else \"html\" if kind==\"text/html\" else \"other\"\n        trace = response.headers.get(\"CF-Ray\", \"\")\n        self.trace = trace if re.fullmatch(r\"[a-fA-F0-9]{8,32}-[A-Z0-9]{2,8}\", trace) else None\n        self.provider_error = None\n        self.edge_code = None\n        self.edge_challenge = response.headers.get(\"cf-mitigated\", \"\").lower() == \"challenge\"\n        try:\n            raw = response.read(8193)\n            if self.format == \"html\":\n                text = raw.decode(\"utf-8\", errors=\"replace\").lower()\n                self.edge_challenge = self.edge_challenge or \"cdn-cgi/challenge-platform\" in text\n            body = json.loads(raw) if self.format == \"json\" else {}\n        except (OSError, ValueError):\n            body = {}\n        if isinstance(body,dict):\n            known = (\"invalid_request\", \"invalid_grant\", \"invalid_client\", \"unauthorized_client\", \"invalid_scope\",\n                     \"invalid_target\", \"access_denied\", \"forbidden\", \"insufficient_scope\", \"country_block\",\n                     \"country_challenge\", \"waf_block\", \"ip_block\", \"unsupported_grant_type\", \"rate_limited\")\n            for key in (\"error\", \"error_name\", \"error_type\", \"error_code\", \"code\"):\n                item = body.get(key)\n                if isinstance(item,str) and item.lower() in known:\n                    self.provider_error = item.lower()\n                if self.trace and (type(item) is int or (isinstance(item,str) and re.fullmatch(r\"1\\d{3}\",item))) and 1000<=int(item)<=1200:\n                    self.edge_code = int(item)\n        super().__init__(stage)\n\n    def receipt(self):\n        return {\"stage\":self.stage,\"http\":self.status,\"format\":self.format,\n                \"provider_error\":self.provider_error,\"edge_code\":self.edge_code,\"trace_id\":self.trace,\n                \"edge_challenge\":self.edge_challenge}\n\n\ndef exchange(path, data, headers, *, stage):\n    assert path in (\"/token\", \"\")\n    req = Request(ISSUER + path, data=data,\n                  headers={**headers, \"User-Agent\":USER_AGENT}, method=\"POST\")\n    try:\n        with build_opener(NoRedirect).open(req, timeout=15) as response:\n            body = response.read(512_001)\n            if len(body) > 512_000:\n                raise ValueError(\"IOL_PROVIDER_RESPONSE_LIMIT\")\n            return body, response.headers\n    except HTTPError as error:\n        with error:\n            raise ProviderHTTPError(stage,error) from None\n\n\ndef inspect_token(token):\n    # Approved requests are hard coded. An MCP answer cannot select a method.\n    source = Path(\"/var/lib/porota-rc6-iol/08cfa083b0a060b6e503894c793a150bb948693c\")\n    adapter = source / \"iol_mcp_readonly_adapter_rc6.py\"\n    meta = adapter.lstat()\n    if (adapter.resolve() != adapter or not stat.S_ISREG(meta.st_mode) or meta.st_uid != 0\n            or meta.st_nlink != 1 or meta.st_mode & 0o022 or meta.st_size > 128000\n            or hashlib.sha256(adapter.read_bytes()).hexdigest()\n                != \"7446edfa73383a2feeb5672a50a63a335f4b7d912d19c88424924e1fb3777ea0\"):\n        raise ValueError(\"IOL_EFFECTIVE_ADAPTER_UNVERIFIED\")\n    sys.path.insert(0, str(source))\n    from iol_mcp_readonly_adapter_rc6 import _json_from_mcp_body\n\n    headers = {\"Authorization\": \"Bearer \" + token, \"Content-Type\": \"application/json\",\n               \"Accept\": \"application/json, text/event-stream\"}\n    init = {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"initialize\",\n            \"params\": {\"protocolVersion\": \"2025-06-18\", \"capabilities\": {},\n                       \"clientInfo\": {\"name\": \"porota-iol-consent-diagnostic\", \"version\": \"1.0\"}}}\n    body, response_headers = exchange(\"\", json.dumps(init).encode(), headers, stage=\"MCP_INITIALIZE\")\n    protocol = _json_from_mcp_body(body.decode(\"utf-8\")).get(\"protocolVersion\")\n    if protocol not in {\"2025-03-26\", \"2025-06-18\", \"2025-11-25\"}:\n        raise ValueError(\"IOL_MCP_PROTOCOL_VERSION_UNVERIFIED\")\n    headers[\"MCP-Protocol-Version\"] = protocol\n    session = response_headers.get(\"Mcp-Session-Id\")\n    if session:\n        if not re.fullmatch(r\"[!-~]{1,512}\", session):\n            raise ValueError(\"IOL_MCP_SESSION_ID_UNVERIFIED\")\n        headers[\"Mcp-Session-Id\"] = session\n    notification = {\"jsonrpc\": \"2.0\", \"method\": \"notifications/initialized\"}\n    exchange(\"\", json.dumps(notification).encode(), headers, stage=\"MCP_INIT_NOTIFICATION\")\n    access_mode = {\"jsonrpc\": \"2.0\", \"id\": 2, \"method\": \"tools/call\",\n                   \"params\": {\"name\": \"get_access_mode\", \"arguments\": {}}}\n    body, _ = exchange(\"\", json.dumps(access_mode).encode(), headers, stage=\"MCP_ACCESS_MODE\")\n    mode = _json_from_mcp_body(body.decode(\"utf-8\")).get(\"mode\")\n    if mode in (\"automatic\", \"auto\", \"automático\", \"automatico\", \"full\"):\n        return \"AUTOMATIC\"\n    if mode in (\"read_only\", \"confirm\", \"confirm_operations\", \"confirmation_required\"):\n        return \"OTHER_MODE\"\n    return \"MODE_UNVERIFIED\"\n\n\ndef write_private(path, data):\n    fd, file = tempfile.mkstemp(prefix=\"iol-consent-\", dir=path.parent)\n    try:\n        with os.fdopen(fd,\"w\",encoding=\"utf-8\") as f:\n            json.dump(data,f,sort_keys=True)\n            f.flush()\n            os.fsync(f.fileno())\n        os.replace(file,path)\n    finally:\n        if os.path.exists(file):\n            os.unlink(file)\n\n\ndef current_digest():\n    meta = STORE.lstat()\n    if (STORE.resolve() != STORE or not stat.S_ISREG(meta.st_mode) or meta.st_uid != 0\n            or stat.S_IMODE(meta.st_mode) != 0o600 or meta.st_nlink != 1 or meta.st_size > 128_000):\n        raise ValueError(\"IOL_STORE_UNVERIFIED\")\n    return hashlib.sha256(STORE.read_bytes()).hexdigest()\n\n\ndef require_paper():\n    marker=Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\")\n    state=json.loads(marker.read_text())\n    if (state.get(\"mode\") != \"PRODUCTION_PAPER\" or type(state.get(\"real_orders_sent\")) is not int\n            or state[\"real_orders_sent\"] != 0 or state.get(\"validation_status\") != \"VALIDATED_RUNTIME\"\n            or state.get(\"real_order_capability\") != \"BLOCKED\"\n            or state.get(\"candidate_sha\") != \"08cfa083b0a060b6e503894c793a150bb948693c\"\n            or state.get(\"deployment_sha\") != \"3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1\"):\n        raise ValueError(\"IOL_PAPER_RUNTIME_UNVERIFIED\")\n\n\ndef prepare():\n    require_paper()\n    with socket.socket() as sock:\n        sock.bind((\"127.0.0.1\",PORT))\n    before=current_digest()\n    prior=json.loads(STORE.read_bytes())\n    if prior.get(\"issuer\") != ISSUER or prior.get(\"redirect_uri\") != REDIRECT:\n        raise ValueError(\"IOL_EXISTING_REGISTRATION_REDIRECT_UNVERIFIED\")\n    client=prior.get(\"client_registration\",{})\n    client_id=client.get(\"client_id\")\n    if not isinstance(client_id,str) or not 0<len(client_id)<256:\n        raise ValueError(\"IOL_REGISTRATION_UNVERIFIED\")\n    if client.get(\"redirect_uris\") is not None and REDIRECT not in client[\"redirect_uris\"]:\n        raise ValueError(\"IOL_REDIRECT_UNVERIFIED\")\n    verifier=secrets.token_urlsafe(64)\n    challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b\"=\").decode()\n    state=secrets.token_urlsafe(32)\n    write_private(PENDING,{\"state\":state,\"verifier\":verifier,\"client_id\":client_id,\n                           \"expires\":time.time()+LIFETIME,\"store_digest\":before})\n    q={\"response_type\":\"code\",\"client_id\":client_id,\"redirect_uri\":REDIRECT,\"code_challenge\":challenge,\n       \"code_challenge_method\":\"S256\",\"state\":state,\"resource\":ISSUER}\n    print(json.dumps({\"url\":ISSUER+\"/authorize?\"+urlencode(q),\"expires\":int(time.time()+LIFETIME)}))\n\n\ndef apply(code,pending):\n    require_paper()\n    if current_digest()!=pending[\"store_digest\"]:\n        raise ValueError(\"IOL_STORE_CHANGED\")\n    client=json.loads(STORE.read_bytes())[\"client_registration\"]\n    fields={\"grant_type\":\"authorization_code\",\"code\":code,\"redirect_uri\":REDIRECT,\n            \"client_id\":pending[\"client_id\"],\"code_verifier\":pending[\"verifier\"],\"resource\":ISSUER}\n    headers={\"Content-Type\":\"application/x-www-form-urlencoded\",\"Accept\":\"application/json\"}\n    secret=client.get(\"client_secret\")\n    if secret:\n        if client.get(\"token_endpoint_auth_method\")==\"client_secret_basic\":\n            encoded=base64.b64encode((fields.pop(\"client_id\")+\":\"+secret).encode()).decode()\n            headers[\"Authorization\"]=\"Basic \"+encoded\n        elif client.get(\"token_endpoint_auth_method\")==\"client_secret_post\":\n            fields[\"client_secret\"]=secret\n        else:\n            raise ValueError(\"IOL_REGISTRATION_AUTH_UNVERIFIED\")\n    raw, _ = exchange(\"/token\",urlencode(fields).encode(),headers,stage=\"OAUTH_TOKEN_EXCHANGE\")\n    tokens = json.loads(raw)\n    token = tokens.get(\"access_token\") if isinstance(tokens, dict) else None\n    if not isinstance(token, str) or not re.fullmatch(r\"[!-~]{1,16384}\", token):\n        return {\"state\": \"TOKEN_RESPONSE_UNVERIFIED\", \"token_exchange_verified\": False}\n    # Call only the read-only access-mode check. Discard both credentials on return.\n    try:\n        mode = inspect_token(token)\n        return {\"state\": \"AUTOMATIC_VERIFIED\" if mode == \"AUTOMATIC\" else \"OAUTH_EXCHANGED_\" + mode,\n                \"token_exchange_verified\": True, \"mode\": mode}\n    except ProviderHTTPError as exc:\n        return {\"state\": \"OAUTH_EXCHANGED_MCP_STATUS_UNVERIFIED\", \"token_exchange_verified\": True,\n                **exc.receipt()}\n    except Exception:\n        return {\"state\": \"OAUTH_EXCHANGED_MCP_STATUS_UNVERIFIED\", \"token_exchange_verified\": True}\n\n\ndef receive():\n    meta = PENDING.lstat()\n    if (PENDING.resolve() != PENDING or not stat.S_ISREG(meta.st_mode) or meta.st_uid != 0\n            or stat.S_IMODE(meta.st_mode) != 0o600 or meta.st_nlink != 1 or meta.st_size > 8192):\n        raise ValueError(\"IOL_PENDING_CUSTODY_UNVERIFIED\")\n    pending=json.loads(PENDING.read_text())\n    result={\"state\":\"CONSENT_EXPIRED\",\"session\":SESSION,\"store_updated_by_test\":False}\n    class Callback(BaseHTTPRequestHandler):\n        timeout = 5\n\n        def log_message(self,*args):\n            pass\n\n        def reply(self, status, title):\n            self.send_response(status)\n            self.send_header(\"Content-Type\",\"text/plain; charset=utf-8\")\n            self.send_header(\"Cache-Control\",\"no-store\")\n            self.send_header(\"Referrer-Policy\",\"no-referrer\")\n            self.end_headers()\n            self.wfile.write(title.encode(\"utf-8\"))\n\n        def do_GET(self):\n            parsed=urlsplit(self.path)\n            params=parse_qs(parsed.query,max_num_fields=12)\n            states=params.get(\"state\", [])\n            codes=params.get(\"code\",[])\n            if (parsed.path!=\"/callback\" or len(states)!=1\n                    or not hmac.compare_digest(states[0],pending[\"state\"])):\n                self.send_error(400,\"Callback invalido\")\n                return\n            if len(codes)!=1 or not 0<len(codes[0])<=2048:\n                result[\"state\"]=\"CONSENT_NO_CODE\"\n                self.send_error(400,\"IOL no devolvio autorizacion\")\n                return\n            try:\n                result.update(apply(codes[0],pending))\n            except ProviderHTTPError as error:\n                result.update(state=\"IOL_UPSTREAM_REJECTED\",**error.receipt())\n                self.reply(502,f\"IOL rechazó el canje OAuth (HTTP {error.status}). Podés cerrar esta página.\")\n            except Exception as error:\n                result[\"state\"]=\"OAUTH_CALLBACK_UNVERIFIED\"\n                result[\"class\"]=type(error).__name__\n                if isinstance(error,ValueError) and str(error).startswith((\"MCP_\",\"IOL_\")):\n                    result[\"reason\"]=str(error)\n                self.reply(500,\"Porota no pudo verificar el acceso Solo lectura. Podés cerrar esta página.\")\n            else:\n                if result[\"state\"] == \"AUTOMATIC_VERIFIED\":\n                    self.reply(200,\"IOL confirmó el modo Automático de esta prueba. Podés cerrar esta página.\")\n                elif result.get(\"token_exchange_verified\"):\n                    self.reply(200,\"IOL completó el canje. El modo Automático no quedó confirmado. Podés cerrar esta página.\")\n                else:\n                    self.reply(502,\"El canje de IOL no quedó verificado. Podés cerrar esta página.\")\n    try:\n        with HTTPServer((\"127.0.0.1\",PORT),Callback) as server:\n            server.timeout=2\n            while time.time()<pending[\"expires\"] and result[\"state\"]==\"CONSENT_EXPIRED\":\n                server.handle_request()\n    finally:\n        PENDING.unlink(missing_ok=True)\n    print(json.dumps(result,sort_keys=True))\n\n\nif __name__==\"__main__\":\n    try:\n        {\"prepare\":prepare,\"receive\":receive}[STAGE]()\n    except (ValueError, OSError, HTTPError) as error:\n        reason = str(error) if type(error) is ValueError and str(error).startswith(\"IOL_\") else type(error).__name__\n        print(json.dumps({\"state\":\"IOL_CALLBACK_SETUP_FAILED\",\"reason\":reason,\n                          \"http\":error.code if isinstance(error,HTTPError) else None}))\n        sys.exit(1)\n"
          with connection(os.environ) as (ssh, _, _):
