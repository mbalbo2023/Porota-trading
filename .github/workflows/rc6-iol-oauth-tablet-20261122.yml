name: RC6 release replay of PAPER fixed-income exit and preopen
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
jobs:
  replay:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08cfa083b0a060b6e503894c793a150bb948693c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare only the locked test and transport dependencies
        run: |
          set -euo pipefail
          sed -n -E '/^(certifi|cffi|charset-normalizer|cryptography|idna|iniconfig|packaging|pluggy|pycparser|pygments|pytest|requests|urllib3)==/Ip' requirements.lock.txt > "$RUNNER_TEMP/rc6-replay-deps.txt"
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/rc6-replay-deps.txt"
      - name: Run the exact release code using temporary databases and a network namespace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 08cfa083b0a060b6e503894c793a150bb948693c
          test "$(git rev-parse 'HEAD^{tree}')" = e65f48c089aa22c91747eed114cd6ea74367724c
          TEMP_REPLAY="$(mktemp -d /tmp/rc6.XXXXXX)"
          trap 'rm -rf -- "$TEMP_REPLAY"' EXIT
          cat > "$TEMP_REPLAY/test_release_replay.py" <<'PY_REPLAY'
          """Run the deployed-source BONOS/ON and preopen paths with temporary fixtures."""
          from contextlib import redirect_stdout
          from datetime import datetime, timedelta
          from decimal import Decimal
          import hashlib
          import io
          import json
          import multiprocessing
          import os
          from pathlib import Path
          import socket
          import threading
          from types import SimpleNamespace

          import pytest

          from be_paper_engine import PaperBroker
          from bm_exit_supervisor import PositionExitSupervisor
          from bq_exit_policy import PaperSessionPolicy
          from bv_paper_runtime import broker_from_environment
          import rc6_fixed_income_sale_authority as authority
          import rc6_paper_causal_decision_receipt as causal
          import rc6_preopen as preopen
          from rc6_ppi_gateway_reader_adapter import gateway_socket_path
          from rc6_ppi_shared_feed import ReadOnlyUnixFeedClient, ReadOnlyUnixFeedServer
          import test_porota_preopen_rootless as preopen_fixtures
          import test_rc6_fi_market_sale_authority as sale_fixtures

          ARCHIVE = Path("docs/evidence/ws_motor_11_before_after.json")
          POLICY = Path("ops/policy/rc6-byma-reviewed-authority-v1.json")
          DAY = (2026, 11, 24)


          def signer_process(pipe, db_path, key, decision):
              """Sign after reading the supervisor's committed freeze from another process."""
              with pipe:
                  assert pipe.recv() == "sign"
                  ack = causal.attest_after_commit(db_path, decision_key=decision,
                      signing_key_path=key, expected_release_sha256=sale_fixtures.RELEASE)
                  assert ack["signature_created"], ack
                  pipe.send(authority.attest_market_sale_book2(db_path, decision_key=decision,
                      signing_key_path=key, release=sale_fixtures.RELEASE))


          def can_open_unix_socket():
              try:
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM):
                      return True
              except PermissionError:
                  if os.getenv("RC6_EXPECT_UNIX_SOCKET") == "yes":
                      raise
                  return False


          @pytest.mark.parametrize(("ticker", "family"), [("GD30", "BONOS"), ("YMCJO", "OBLIGACIONES")])
          def test_active_position_end_to_end(tmp_path, monkeypatch, ticker, family):
              native_reader = authority._read_first_book2
              # Reuse the release's lot, signed policy and feed fixtures. This run
              # records its decision and ACK through the supervisor instead of pre-seeding.
              with monkeypatch.context() as fixture_scope:
                  fixture_scope.setattr(authority, "prepare_market_sale", lambda *_: None)
                  fixture_scope.setattr(causal, "attest_after_commit", lambda *_, **__: {"signature_created": True})
                  store, paper_id, key, _, book, cache, _ = sale_fixtures.setup(
                      tmp_path, monkeypatch, ticker=ticker, family=family)

              source = ARCHIVE.read_bytes()
              history = {row["field"]: row for row in json.loads(source)["field_matrix"]
                         if row["ticker"] == ticker and row["settlement"] == "A-24HS"}
              for field, expected in {"currency": "ARS", "settlement": "A-24HS"}.items():
                  assert history[field]["primary_source"] == "PPI_STRUCTURED_API"
                  assert history[field]["value"] == expected
              policy_path = tmp_path / "market-sale-policy.json"
              policy = json.loads(policy_path.read_bytes())
              economics = policy["instruments"][0]
              for archived, policy_key in (("cash_multiplier", "cash_multiplier"),
                    ("quantity_min", "minimum_quantity"), ("quantity_step", "quantity_step")):
                  row = history[archived]
                  if row["status_after"] == "EVIDENCED":
                      economics[policy_key] = str(row["value"])
                  elif ticker == "YMCJO":
                      assert row["status_after"] == "UNRESOLVED" and economics[policy_key] == "1"
                  else:
                      pytest.fail(f"Missing historic field {ticker}/{archived}")
              economics["ppi_economics_source_sha256"] = hashlib.sha256(source).hexdigest()
              economics["known_at"] = history["currency"]["capture_timestamp"]
              raw = json.dumps(policy, sort_keys=True).encode()
              policy_path.write_bytes(raw)
              monkeypatch.setenv(authority.POLICY_PIN, hashlib.sha256(raw).hexdigest())

              at = sale_fixtures.AT
              ms = sale_fixtures.MILLISECOND
              decision_at = (at + 10 * ms).isoformat()
              applied_at = at + 50 * ms
              # Frozen process time during the decision, distinct read time in the signer.
              monkeypatch.setattr(causal, "_now", lambda: (at + 9 * ms).isoformat())
              default = broker_from_environment(store, clock_fn=lambda: applied_at.isoformat())
              supervisor = PositionExitSupervisor(default, clock_fn=default.clock_fn,
                  session_policy=default.session_policy, max_hold_minutes=360)
              monkeypatch.setenv("PAPER_T1_FULL_DATE_RELEASE", "false")
              position, = store.open_positions()
              quote = store.latest_quote(position)
              assert position["status"] == "OPEN" and position["quantity"] == "100"

              no_witness = supervisor.supervise(position, quote, decision_at)
              assert (no_witness.state, no_witness.reason) == (
                  "EXIT_PENDING_FI_NATIVE_EVIDENCE", "FI_NATIVE_SIGNED_BOOK2_PENDING")
              assert store.open_positions()[0]["quantity"] == "100"

              with store.connect() as db:
                  decision, = db.execute("SELECT decision_key FROM paper_decisions WHERE action='SELL'").fetchone()
                  assert db.execute("SELECT COUNT(*) FROM paper_causal_decision_receipts").fetchone()[0] == 0
              assert decision.startswith("FI_SELL:")
              # A pre-ACK book, the first eligible bid and a later more favorable bid.
              book(20, 101)
              chosen = book(30, 100)
              book(40, 130)

              real_unix = can_open_unix_socket()
              server = None
              if real_unix:
                  monkeypatch.setattr(authority, "_read_first_book2", native_reader)
                  path = gateway_socket_path(store.path)
                  path.parent.mkdir(parents=True, mode=0o700)
                  server = ReadOnlyUnixFeedServer(cache.feed, socket_path=path, native_receipts=cache,
                      supervisor_pid=os.getpid(), owner_status=lambda: {"state": "OPEN",
                          "owner_pid": os.getpid(), "session_generation": sale_fixtures.SESSION,
                          "login_invocations_by_owner": 1})
                  server.start()
                  serve = threading.Thread(target=server.serve_forever, daemon=True)
                  serve.start()

              monkeypatch.setattr(causal, "_now", lambda: (at + 20 * ms).isoformat())
              context = multiprocessing.get_context("fork")
              broker_end, signer_end = context.Pipe()
              # Gate on enrollment before either version of the replay reads the cache.
              process = context.Process(target=signer_process, args=(signer_end, store.path, key, decision))
              with broker_end, signer_end:
                  process.start()
                  try:
                      if server:
                          client = ReadOnlyUnixFeedClient(socket_path=server.socket_path, timeout_seconds=2)
                          client.owner_status()
                          client.register_client("exit_reader", pid=process.pid,
                                                 proc_starttime=server.process_starttime(process.pid))
                      broker_end.send("sign")
                      assert broker_end.poll(8), "independent signer did not produce a witness"
                      witness = broker_end.recv()
                      assert witness["payload"]["book2"] == chosen
                      broker = PaperBroker(store, clock_fn=lambda: applied_at.isoformat(),
                          session_policy=PaperSessionPolicy(), market_sale_witness=lambda key: witness if key == decision else None)
                      with_witness = PositionExitSupervisor(broker, clock_fn=broker.clock_fn,
                                                            session_policy=broker.session_policy)
                      result = with_witness.supervise(position, quote, applied_at.isoformat())
                      assert result.state == "CLOSED", result
                  finally:
                      process.join(3)
                      if process.is_alive():
                          process.terminate()
                          process.join(3)
                      if server is not None:
                          server.shutdown()
                          serve.join(3)
                          server.close()
              assert process.exitcode == 0
              assert store.open_positions() == []
              with store.connect() as db:
                  fills = db.execute("SELECT quantity FROM paper_fills WHERE side='SELL_SIMULATED'").fetchall()
                  assert len(fills) == 1 and fills[0][0] == "100"
                  sale, = db.execute("SELECT price,net_proceeds,available_at,settlement_basis FROM paper_fi_native_sales").fetchall()
                  assert Decimal(sale[0]) < 100 and Decimal(sale[1]) > 0
                  assert (sale[2], sale[3]) == (None, "PENDING_CONFIRMATION")
                  count, = db.execute("SELECT real_orders_sent FROM observer_state").fetchone()
                  assert count == 0
              print(json.dumps({"scenario": ticker, "family": family, "clock": applied_at.isoformat(),
                  "without_witness": no_witness.reason, "with_witness": result.state,
                  "book_transport": "AF_UNIX_WITH_PID_ENROLLMENT" if real_unix else "IN_PROCESS_FIXTURE_TRANSPORT",
                  "book_at_ms": 30, "book_bid": 100, "fill_nominal": fills[0][0], "fill_price": sale[0],
                  "net_ars": sale[1], "settlement": sale[3], "available_at": sale[2], "real_orders_sent": count,
                  "historic_minimum_and_step": ticker == "GD30"}, sort_keys=True))


          @pytest.mark.parametrize(("date_at", "watch_case", "phase", "status", "go"), [
              ((2026, 11, 23, 10, 20), "missing", None, "NOT_DUE", False),
              ((*DAY, 9, 45), "unchanged", "T_MINUS_45", "GREEN", False),
              ((*DAY, 10, 20), "reviewed_calendar", "T_MINUS_10", "GREEN", True),
              ((*DAY, 10, 20), "stale", "T_MINUS_10", "RED", False),
              ((*DAY, 10, 20), "invalid_calendar", "T_MINUS_10", "RED", False),
              ((*DAY, 10, 30), "unchanged", "MANUAL_OR_OUTSIDE_SCHEDULE", "GREEN", False),
          ])
          def test_preopen_with_release_calendar(request, monkeypatch, tmp_path, date_at, watch_case, phase, status, go):
              request.getfixturevalue("operator")
              now = datetime(*date_at, tzinfo=preopen.TZ)

              class ReplayClock(datetime):
                  @classmethod
                  def now(cls, tz=None):
                      return now.astimezone(tz) if tz else now

              monkeypatch.setattr(preopen, "datetime", ReplayClock)
              monkeypatch.setattr(preopen.shutil, "disk_usage", lambda _: SimpleNamespace(free=preopen.TARGET_FREE_BYTES))
              # A fixture substitutes offhost OS/DB health reads, preserving PAPER gate policy.
              for check in ("observer_db", "required_timers", "blocked_history_timers", "iol_reference_state"):
                  monkeypatch.setattr(preopen, check, lambda *args, **kwargs: {"state": "GREEN"})
              monkeypatch.setattr(preopen, "DB", tmp_path / "isolated-preopen.db")
              path = tmp_path / "byma-watch.json"
              monkeypatch.setattr(preopen, "BYMA_MORNING_WATCH", path)
              if watch_case != "missing":
                  watch_state = "NO_CHANGE"
                  observed = datetime(*DAY, 8, 31, 38, tzinfo=preopen.TZ)
                  if watch_case == "stale":
                      observed = datetime(2026, 11, 20, 8, 31, 38, tzinfo=preopen.TZ)
                  watch = {"observed_at": observed.isoformat(), "state": watch_state}
                  if watch_case in {"reviewed_calendar", "invalid_calendar"}:
                      pages = json.loads(POLICY.read_bytes())["pages"]
                      digest = pages["CALENDAR"]["sha256"] if watch_case == "reviewed_calendar" else "9" * 64
                      watch.update(state="CHANGED_REVIEW_REQUIRED", changed_components=["CALENDAR"],
                          pages={"CALENDAR": {"url": pages["CALENDAR"]["url"], "sha256": digest,
                              "scope": "h1-to-footer-v2", "status": "OK"}})
                  path.write_text(json.dumps(watch), encoding="utf-8")

              output = io.StringIO()
              with redirect_stdout(output):
                  code = preopen.main(publish_paper_gate=True)
              result = json.loads(output.getvalue())
              operator = request.getfixturevalue("operator")
              receipt = json.loads((operator["identity"].operator / "paper-preopen-v2.json").read_bytes())
              assert (result["status"], result.get("phase"), code) == (status, phase, 2 if status == "RED" else 0), result
              assert (receipt["status"] == "GO_PAPER_SCALPING") is go, receipt
              assert result["network_order_test_performed"] is False
              expected_reason = {"missing": "BYMA_NON_OPERATIONAL_DAY", "stale": "BYMA_WATCH_NOT_TODAY",
                  "invalid_calendar": "BYMA_AUTHORITY_CHANGE_REVIEW_REQUIRED",
                  "reviewed_calendar": "BYMA_CRITICAL_REVIEWED_EXACT", "unchanged": "NO_CHANGE"}
              reason = result.get("reason") or result["checks"]["byma_morning_watch"]["reason"]
              assert reason == expected_reason[watch_case]
              print(json.dumps({"scenario": watch_case, "clock": result["generated_at_ar"], "phase": phase,
                  "checks": status, "byma_reason": reason, "paper_gate": receipt["status"], "exit": code}, sort_keys=True))


          pytest_plugins = ("test_porota_preopen_rootless",)
          PY_REPLAY
          sha256sum "$TEMP_REPLAY/test_release_replay.py" > "$RUNNER_TEMP/replay-script-sha256.txt"
          PYTHON_BIN="$(command -v python)"
          sudo -n unshare --net --setgid "$(id -g)" --setuid "$(id -u)" env \
            PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests" RC6_EXPECT_UNIX_SOCKET=yes \
            "$PYTHON_BIN" -m pytest -o addopts= -q -s --tb=short --basetemp="$TEMP_REPLAY/t" \
            "$TEMP_REPLAY/test_release_replay.py" 2>&1 | tee "$RUNNER_TEMP/replay-output.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-paper-release-replay
          path: |
            ${{ runner.temp }}/replay-output.txt
            ${{ runner.temp }}/replay-script-sha256.txt
          retention-days: 14
          if-no-files-found: error
