name: RC6 bind IOL guard to deploy 200 and observe natural ticks
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      RELEASE_SHA: 08cfa083b0a060b6e503894c793a150bb948693c
      PRODUCT_SHA: 3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1
    steps:
      - name: Verify canonical promotion completed for this exact tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api repos/mbalbo2023/Porota-trading/actions/runs/45099879439 |
            jq -e --arg ref "$PRODUCT_SHA" '(.head_sha == $ref) and (.event == "workflow_dispatch") and (.path == ".github/workflows/porota-deploy-v2-promote.yml") and (.status == "completed") and (.conclusion == "success")' >/dev/null
          test "$(gh api repos/mbalbo2023/Porota-trading/git/ref/heads/deploy/rc6-pr69-isolated-20260915 --jq '.object.sha')" = "$PRODUCT_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08cfa083b0a060b6e503894c793a150bb948693c
          persist-credentials: false
      - name: Install the three release files for the existing IOL guard and verify the existing OAuth grant
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 -B - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from scripts.porota_actions_host import connection, ssh_run
          source = "import base64\nimport fcntl\nimport hashlib\nimport json\nimport os\nimport re\nimport stat\nimport subprocess\nimport sys\nimport tempfile\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nROOT = Path(\"/opt/porota-trading\")\nDEST = Path(\"/var/lib/porota-rc6-iol\")\nUNIT = \"porota-iol-oauth-health-rc6.service\"\nFRAGMENT = Path(\"/etc/systemd/system\") / UNIT\nDROPIN = FRAGMENT.with_name(UNIT + \".d\") / \"90-porota-iol-release.conf\"\nSTORE = Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\")\nSOURCES = (\"ak_byma_calendar.py\", \"iol_mcp_readonly_adapter_rc6.py\", \"scripts/rc6_iol_oauth_health.py\")\nBASE_UNIT_SHA256 = \"870e22e90231213b7c6e3fa9ab58b89c70f26809f18bf008816153d60ca7bdc7\"\nSOURCE_SHA = \"08cfa083b0a060b6e503894c793a150bb948693c\"\nSOURCE_TREE = \"e65f48c089aa22c91747eed114cd6ea74367724c\"\n\n\ndef require(ok, reason):\n    if not ok:\n        raise ValueError(reason)\n\n\ndef sha(raw):\n    return hashlib.sha256(raw).hexdigest()\n\n\ndef regular(path, limit, *, root_owned=False):\n    require(path.resolve() == path, \"FILE_ALIAS\")\n    with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), \"rb\") as stream:\n        info = os.fstat(stream.fileno())\n        require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and 0 < info.st_size <= limit, \"FILE_CUSTODY\")\n        if root_owned:\n            require(info.st_uid == 0 and not info.st_mode & 0o022, \"ROOT_FILE_CUSTODY\")\n        data = stream.read(limit + 1)\n    require(len(data) <= limit, \"FILE_BOUND\")\n    return data\n\n\ndef marker(product):\n    state = json.loads(regular(ROOT / \"data/deploy/CURRENT_STATE_V2.json\", 65536))\n    require(state.get(\"candidate_sha\") == SOURCE_SHA\n            and state.get(\"candidate_tree_sha\") == SOURCE_TREE\n            and state.get(\"deployment_sha\") == product\n            and state.get(\"validation_status\") == \"VALIDATED_RUNTIME\"\n            and state.get(\"mode\") == \"PRODUCTION_PAPER\"\n            and state.get(\"real_order_capability\") == \"BLOCKED\"\n            and type(state.get(\"real_orders_sent\")) is int\n            and state[\"real_orders_sent\"] == 0, \"PAPER_RELEASE_UNVERIFIED\")\n    return state\n\n\ndef root_dir(directory, *, create=False):\n    if not directory.exists() and create:\n        directory.mkdir(mode=0o700)\n    info = directory.lstat()\n    require(directory.resolve() == directory and stat.S_ISDIR(info.st_mode)\n            and info.st_uid == 0 and not info.st_mode & 0o022, \"ROOT_DIRECTORY_CUSTODY\")\n\n\ndef atomic(path, content, *, mode):\n    fd, name = tempfile.mkstemp(prefix=\"porota-iol.\", dir=path.parent)\n    temporary = Path(name)\n    try:\n        with os.fdopen(fd, \"wb\") as handle:\n            handle.write(content)\n            handle.flush()\n            os.fsync(handle.fileno())\n            os.fchmod(handle.fileno(), mode)\n        os.replace(temporary, path)\n    finally:\n        temporary.unlink(missing_ok=True)\n\n\ndef systemctl(*args):\n    result = subprocess.run([\"/usr/bin/systemctl\", *args], capture_output=True, text=True,\n                            timeout=25, check=False)\n    require(result.returncode == 0, \"IOL_SYSTEMD_COMMAND_FAILED\")\n    return result.stdout\n\n\ndef unit_properties():\n    raw = systemctl(\"show\", \"--no-pager\", \"-p\", \"LoadState\", \"-p\", \"User\", \"-p\", \"ExecStart\",\n                    \"-p\", \"WorkingDirectory\", \"-p\", \"FragmentPath\", \"-p\", \"DropInPaths\", \"-p\", \"Environment\", UNIT)\n    return dict(line.split(\"=\", 1) for line in raw.splitlines() if \"=\" in line)\n\n\ndef read_store():\n    raw = regular(STORE, 128000, root_owned=True)\n    require(stat.S_IMODE(STORE.stat().st_mode) == 0o600, \"IOL_STORE_MODE_UNVERIFIED\")\n    value = json.loads(raw)\n    require(value.get(\"issuer\") == \"https://mcp.invertironline.com\"\n            and value.get(\"token_endpoint\") == \"https://mcp.invertironline.com/token\"\n            and value.get(\"client_registration\", {}).get(\"token_endpoint_auth_method\") == \"none\",\n            \"IOL_PUBLIC_REGISTRATION_UNVERIFIED\")\n    return value\n\n\ndef verify_sources(blobs):\n    require(set(blobs) == set(SOURCES), \"IOL_RELEASE_SOURCE_SCOPE\")\n    manifest = json.loads(regular(ROOT / \"data/deploy/porota-deploy-bundle-v2-manifest.json\", 4 * 1024 * 1024))\n    files = {row[\"path\"]: row for row in manifest[\"files\"]}\n    for relative, body in blobs.items():\n        row = files.get(relative, {})\n        require(sha(body) == row.get(\"sha256\") and len(body) == row.get(\"bytes\"), \"IOL_RELEASE_SOURCE_HASH\")\n        compile(body, relative, \"exec\")\n\n\ndef install(product, blobs, receipt):\n    marker(product)\n    read_store()\n    verify_sources(blobs)\n    props = unit_properties()\n    fragment = Path(props.get(\"FragmentPath\", \"\")).resolve()\n    require(props.get(\"LoadState\") == \"loaded\" and props.get(\"User\") in (\"\", \"0\", \"root\")\n            and fragment in (FRAGMENT, Path(\"/usr/lib/systemd/system\") / UNIT)\n            and sha(regular(fragment, 64 * 1024, root_owned=True)) == BASE_UNIT_SHA256\n            and props.get(\"DropInPaths\") in (\"\", str(DROPIN)), \"IOL_UNIT_IDENTITY\")\n    entry = \"scripts/rc6_iol_oauth_health.py\"\n    old_entry = ROOT / entry\n    version_dir = DEST / SOURCE_SHA\n    new_entry = version_dir / entry\n    if not DROPIN.exists():\n        require(props.get(\"WorkingDirectory\") == str(ROOT)\n                and str(old_entry) in props.get(\"ExecStart\", \"\")\n                and props.get(\"DropInPaths\") == \"\", \"IOL_EFFECTIVE_EXEC_START_UNVERIFIED\")\n    for directory in (Path(\"/var\"), Path(\"/var/lib\"), DEST, version_dir, version_dir / \"scripts\"):\n        root_dir(directory, create=directory in (DEST, version_dir, version_dir / \"scripts\"))\n    for relative, body in blobs.items():\n        path = version_dir / relative\n        if path.exists():\n            require(regular(path, 1024 * 1024, root_owned=True) == body, \"IOL_PRIOR_RELEASE_FILE_DRIFT\")\n        else:\n            atomic(path, body, mode=0o600)\n        require(sha(regular(path, 1024 * 1024, root_owned=True)) == sha(body), \"IOL_INSTALLED_FILE_DRIFT\")\n    service = (f\"[Service]\\nWorkingDirectory={version_dir}\\nEnvironment=PYTHONPATH={version_dir}\\n\"\n               f\"ExecStart=\\nExecStart=/usr/bin/python3 -B -s {new_entry}\\n\")\n    root_dir(FRAGMENT.parent)\n    root_dir(DROPIN.parent, create=True)\n    marker(product)\n    if DROPIN.exists():\n        require(regular(DROPIN, 4096, root_owned=True) == service.encode(), \"IOL_PRIOR_DROPIN_UNVERIFIED\")\n    else:\n        atomic(DROPIN, service.encode(), mode=0o644)\n        receipt[\"installed_dropin\"] = True\n    # Reload definitions. The existing timer invokes the guardian normally.\n    systemctl(\"daemon-reload\")\n    runtime = unit_properties()\n    require(runtime.get(\"DropInPaths\") == str(DROPIN)\n            and runtime.get(\"WorkingDirectory\") == str(version_dir)\n            and str(new_entry) in runtime.get(\"ExecStart\", \"\")\n            and re.findall(r\"(?:^|\\s)PYTHONPATH=([^\\s]+)\", runtime.get(\"Environment\", \"\")) == [str(version_dir)],\n            \"IOL_EFFECTIVE_EXEC_START_UNVERIFIED\")\n    receipt[\"guardian_adapter_sha256\"] = sha(blobs[\"iol_mcp_readonly_adapter_rc6.py\"])\n    receipt[\"guardian_source\"] = \"RELEASE_BOUND_ROOT_CUSTODY\"\n    return version_dir\n\n\ndef recover(product, version_dir, receipt):\n    from importlib.machinery import PathFinder\n\n    module_name = \"iol_mcp_readonly_adapter_rc6\"\n    spec = PathFinder.find_spec(module_name, [str(version_dir)])\n    require(spec is not None and spec.origin == str(version_dir / (module_name + \".py\")), \"IOL_IMPORT_UNVERIFIED\")\n    sys.path.insert(0, str(version_dir))\n    from iol_mcp_readonly_adapter_rc6 import IOLMCPError, OAuthStoreReadOnlyMCP, verify_read_only_token\n    marker(product)\n    read_store()\n    proof = {}\n\n    class VerifiedRefresh(OAuthStoreReadOnlyMCP):\n        def _write_store(self, content):\n            access = content[\"tokens\"][\"access_token\"]\n            proof.update(verify_read_only_token(access))\n            marker(product)\n            read_store()\n            super()._write_store(content)\n            receipt[\"store_updated\"] = True\n\n    client = VerifiedRefresh(STORE, timeout_seconds=8)\n    try:\n        current = read_store()\n        if client._refresh_due(current):\n            client._refresh_locked({}, current)\n        else:\n            proof.update(verify_read_only_token(current[\"tokens\"][\"access_token\"]))\n    except IOLMCPError as error:\n        code = str(error)\n        receipt[\"state\"] = \"IOL_OAUTH_BLOQUEADO\"\n        receipt[\"reason\"] = code if re.fullmatch(r\"IOL_MCP_[A-Z0-9_]{1,70}\", code) else \"IOL_MCP_APPLICATION_FAILURE\"\n        receipt[\"http_status\"] = error.status_code if type(error.status_code) is int else None\n        trace = next((v for k, v in error.response_headers.items() if k.lower() == \"cf-ray\"), \"\")\n        if re.fullmatch(r\"[a-f0-9]{8,32}-[A-Z0-9]{2,8}\", trace, re.I):\n            receipt[\"provider_trace\"] = trace\n        return\n    receipt.update(proof)\n    receipt[\"state\"] = \"AUTHENTICATED_READ_ONLY\"\n    # A small retained daily sample demonstrates data delivery outside the wheel.\n    try:\n        client._initialize()\n        reply, _ = client._rpc(\"tools/call\", {\"name\": \"get_price_history\", \"arguments\": {\n            \"market\": \"BCBA\", \"symbol\": \"AL30\", \"from_date\": \"2026-11-19\", \"to_date\": \"2026-11-20\",\n        }})\n        bars = reply.get(\"bars\")\n        receipt[\"market_read_count\"] = len(bars) if isinstance(bars, list) else None\n    except IOLMCPError:\n        receipt[\"market_read_count\"] = None\n\n\ndef main(source_payload, product):\n    receipt = {\"state\": \"BLOQUEADO\", \"observed_at\": datetime.now(timezone.utc).isoformat(),\n               \"source_sha\": SOURCE_SHA, \"source_tree\": SOURCE_TREE, \"deployment_sha\": product,\n               \"installed_dropin\": False, \"store_updated\": False}\n    try:\n        require(os.geteuid() == 0 and re.fullmatch(r\"[0-9a-f]{40}\", product), \"IOL_HOST_OPERATOR_UNVERIFIED\")\n        marker(product)\n        receipt.update(mode=\"PRODUCTION_PAPER\", real_orders_sent=0)\n        blobs = {path: base64.b64decode(data, validate=True) for path, data in source_payload.items()}\n        read_store()\n        lock = STORE.with_suffix(STORE.suffix + \".refresh.lock\")\n        fd = os.open(lock, os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)\n        try:\n            meta = os.fstat(fd)\n            require(meta.st_uid == 0 and stat.S_ISREG(meta.st_mode) and meta.st_nlink == 1\n                    and not meta.st_mode & 0o077, \"IOL_REFRESH_LOCK_UNVERIFIED\")\n            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)\n            version_dir = install(product, blobs, receipt)\n            recover(product, version_dir, receipt)\n        finally:\n            os.close(fd)\n    except (KeyError, TypeError, ValueError, OSError, subprocess.SubprocessError) as error:\n        code = str(error)\n        receipt[\"reason\"] = code if re.fullmatch(r\"[A-Z][A-Z_0-9]{3,80}\", code) else type(error).__name__\n    print(json.dumps(receipt, sort_keys=True))\n"
          files = ('ak_byma_calendar.py', 'iol_mcp_readonly_adapter_rc6.py', 'scripts/rc6_iol_oauth_health.py')
          payload = {name: base64.b64encode(Path(name).read_bytes()).decode() for name in files}
          source += '\nmain(' + repr(payload) + ', ' + repr(os.environ['PRODUCT_SHA']) + ')\n'
          with connection(os.environ) as (ssh, _, _):
              result = ssh_run(ssh, ['sudo', '-n', '/usr/bin/python3', '-B', '-'], data=source.encode(), timeout=160)
          if result.returncode:
              raise SystemExit('IOL_PRIVILEGED_HOST_OPERATION_UNVERIFIED')
          proof = json.loads(result.stdout)
          assert proof['deployment_sha'] == os.environ['PRODUCT_SHA'] and proof['source_sha'] == os.environ['RELEASE_SHA']
          data = json.dumps(proof, sort_keys=True)
          print(data)
          Path(os.environ['RUNNER_TEMP'], 'iol-guard-release.json').write_text(data + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iol-guard-release-200
          path: ${{ runner.temp }}/iol-guard-release.json
          if-no-files-found: warn
          retention-days: 30
      - name: Observe a normal export and the next IOL guardian tick
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from scripts.porota_actions_host import connection, ssh_run
          source = "import hashlib,json,re,subprocess,sys,time\nfrom collections import Counter\nfrom datetime import datetime,timezone\nfrom pathlib import Path\nroot=Path(\"/opt/porota-trading\")\ndef read(path):\n    if path.is_symlink() or not path.is_file() or path.stat().st_size>1048576:\n        return {}\n    return json.loads(path.read_text())\ndef clock(value):\n    try:return datetime.fromisoformat(value)\n    except (ValueError,TypeError): return None\nmarker=read(root/\"data/deploy/CURRENT_STATE_V2.json\")\nassert marker[\"deployment_sha\"]==sys.argv[1]\nassert marker[\"candidate_sha\"]==\"08cfa083b0a060b6e503894c793a150bb948693c\"\nassert marker[\"candidate_tree_sha\"]==\"e65f48c089aa22c91747eed114cd6ea74367724c\"\nassert marker[\"validation_status\"]==\"VALIDATED_RUNTIME\" and marker[\"real_orders_sent\"]==0\nthreshold=clock(marker[\"recorded_at\"])\nassert threshold\nscript=root/\"scripts/porota_export_scheduler_state_rc6.sh\"\ndigest=hashlib.sha256(script.read_bytes()).hexdigest()\nassert digest==sys.argv[2]\nmodule = root / \"rc6_scheduler_snapshot.py\"\nassert hashlib.sha256(module.read_bytes()).hexdigest() == sys.argv[3]\nguard_changed_after = clock(sys.argv[4]) if len(sys.argv) > 4 and sys.argv[4] else None\nunit=subprocess.run([\"systemctl\",\"show\",\"porota-scheduler-export-rc6.timer\",\"--no-pager\",\"-p\",\n                     \"ActiveState\",\"-p\",\"UnitFileState\",\"-p\",\"Triggers\"],text=True,capture_output=True,timeout=5,check=True)\nvalues=dict(line.split(\"=\",1) for line in unit.stdout.splitlines() if \"=\" in line)\ndeadline=time.monotonic()+650\nreceipt = {}\nwhile True:\n    snapshot=read(root/\"data/scheduler/systemd_timers.json\")\n    stamp=clock(snapshot.get(\"recorded_at\"))\n    guardian=read(root/\"data/market/iol_oauth_guardian_state.json\")\n    iol_stamp=clock(guardian.get(\"checked_at\"))\n    observed_rows = snapshot.get(\"timers\", [])\n    exports = [row for row in observed_rows if row.get(\"unit\") == \"porota-scheduler-export-rc6.timer\"]\n    export = exports[0] if len(exports) == 1 else {}\n    fresh = stamp is not None and stamp >= threshold and snapshot.get(\"state\") == \"OK\" and all(\n        row.get(\"execution_state\") in {\"COMPLETED\", \"RUNNING\", \"NO_EXECUTION_OBSERVED\", \"UNIT_UNAVAILABLE\", \"UNKNOWN\"}\n        for row in observed_rows)\n    guard_fresh = guard_changed_after is None or iol_stamp is not None and iol_stamp >= guard_changed_after\n    if not receipt and fresh and export.get(\"execution_state\") == \"RUNNING\" and export.get(\"last_result\") == \"unknown\":\n        completed = subprocess.run([\"systemctl\", \"show\", \"porota-scheduler-export-rc6.service\", \"--no-pager\",\n            \"-p\", \"Result\", \"-p\", \"ExecMainCode\", \"-p\", \"ExecMainStatus\", \"-p\", \"ExecMainStartTimestamp\",\n            \"-p\", \"ExecMainExitTimestamp\"], capture_output=True, text=True, timeout=5, check=True,\n            env={\"PATH\":\"/usr/bin:/bin\", \"TZ\":\"UTC\", \"LC_ALL\":\"C\"})\n        props = dict(row.split(\"=\", 1) for row in completed.stdout.splitlines() if \"=\" in row)\n        if (props.get(\"ExecMainStartTimestamp\") == export.get(\"service_started_at\")\n                and props.get(\"ExecMainCode\") == \"1\" and props.get(\"ExecMainStatus\") == \"0\"\n                and props.get(\"Result\") == \"success\" and props.get(\"ExecMainExitTimestamp\")):\n            receipt = {key: props[key] for key in (\"ExecMainStartTimestamp\", \"ExecMainExitTimestamp\", \"ExecMainStatus\")}\n    if receipt and guard_fresh or time.monotonic()>=deadline:\n        break\n    time.sleep(15)\nrows=snapshot.get(\"timers\",[])\nassert isinstance(rows,list)\nselection=[]\nfor row in rows:\n    if row.get(\"unit\") in {\n        \"porota-scheduler-export-rc6.timer\",\"porota-iol-oauth-health-rc6.timer\",\n        \"porota-preopen-rc6.timer\",\"porota-1016-github-verify.timer\"}:\n        selection.append({key:row.get(key) for key in\n            (\"unit\",\"service\",\"execution_state\",\"active_state\",\"enabled_state\",\"last_result\",\"last_trigger\",\"service_started_at\",\"next_elapse_monotonic_at\")})\nstatus=guardian.get(\"state\")\nreason=guardian.get(\"reason\")\nprint(json.dumps({\n    \"observed_at\":datetime.now(timezone.utc).isoformat(),\"deployment_sha\":marker[\"deployment_sha\"],\n    \"exporter_file_sha256\":digest,\"systemd_timer\":values,\"snapshot_state\":snapshot.get(\"state\"),\n    \"snapshot_recorded_at\":snapshot.get(\"recorded_at\"),\"snapshot_after_deploy\":fresh,\n    \"natural_export_completion\":receipt,\"snapshot_execution_states\":dict(Counter(row.get(\"execution_state\") or \"LEGACY\" for row in rows)),\n    \"rows\":len(rows),\"enabled_states\":dict(Counter(row.get(\"enabled_state\",\"unknown\") for row in rows)),\n    \"unknown_results\":sum(row.get(\"last_result\")==\"unknown\" for row in rows),\n    \"monotonic_targets\":sum(bool(row.get(\"next_elapse_monotonic_at\")) for row in rows),\n    \"selection\":selection,\n    \"iol\":{\"state\":status if isinstance(status,str) and re.fullmatch(r\"[A-Z_]{1,55}\",status) else None,\n           \"reason\":reason if isinstance(reason,str) and re.fullmatch(r\"[A-Z_0-9]{1,75}\",reason) else None,\n           \"checked_at\":iol_stamp.isoformat() if iol_stamp else None,\n           \"after_guard_install\": guard_changed_after is not None and guard_fresh, \"after_deploy\":iol_stamp is not None and iol_stamp>=threshold,\"http\":guardian.get(\"http_status\")},\n    \"writes\":0,\"provider_requests\":0,\"real_orders_sent\":0},sort_keys=True))\n"
          temp = Path(os.environ['RUNNER_TEMP'])
          prior = json.loads((temp / 'iol-guard-release.json').read_text())
          since = prior['observed_at'] if prior.get('guardian_source') == 'RELEASE_BOUND_ROOT_CUSTODY' else ''
          hashes = [hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in
                    ('scripts/porota_export_scheduler_state_rc6.sh', 'rc6_scheduler_snapshot.py')]
          argv = ['/usr/bin/python3', '-B', '-', os.environ['PRODUCT_SHA'], *hashes, since]
          with connection(os.environ) as (ssh, _, _):
              answer = ssh_run(ssh, argv, data=source.encode(), timeout=685)
          if answer.returncode:
              raise SystemExit('RC6_NATURAL_POSTFLIGHT_UNVERIFIED')
          proof = json.loads(answer.stdout)
          assert proof['deployment_sha'] == os.environ['PRODUCT_SHA']
          assert proof['real_orders_sent'] == proof['writes'] == proof['provider_requests'] == 0
          data = json.dumps(proof, sort_keys=True)
          print(data)
          (temp / 'scheduler-natural-postflight.json').write_text(data + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-natural-postflight-200
          path: ${{ runner.temp }}/scheduler-natural-postflight.json
          if-no-files-found: warn
          retention-days: 30
