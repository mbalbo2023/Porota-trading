name: RC6 IOL tablet consent with upstream diagnosis

on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths:
      - .github/workflows/rc6-iol-oauth-tablet-20261122.yml

permissions:
  contents: read

jobs:
  consent:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Verify the provider OAuth token endpoint without credentials
        id: iol-upstream
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          code="STAGE=\"probe\"\nSESSION=\"rc6-20261123t0007\"\n\"\"\"One-time IOL consent using the existing loopback redirect and token store.\"\"\"\n\nimport base64\nimport fcntl\nimport hashlib\nimport hmac\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport socket\nimport sys\nimport tempfile\nimport time\nfrom urllib.error import HTTPError\nfrom urllib.parse import parse_qs, urlencode, urlsplit\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\n\n\nISSUER = \"https://mcp.invertironline.com\"\nUSER_AGENT = \"Porota-Trading-RC6/1.0 (IOL MCP read-only)\"\nPORT = 8765\nREDIRECT = f\"http://127.0.0.1:{PORT}/callback\"\nSTORE = Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\")\nPENDING = STORE.with_name(\"iol_mcp_oauth_tablet_pending_\" + SESSION + \".json\")\nLIFETIME = 1200\nREAD = frozenset({\n    \"get_access_mode\", \"get_activities\", \"get_asset_info\", \"get_asset_quote\", \"get_aum_evolution\",\n    \"get_balance\", \"get_caucion_guarantee_assets\", \"get_caucion_rate\", \"get_caucion_rates\", \"get_ddjj\",\n    \"get_fci_funds\", \"get_fixed_income_analytics\", \"get_intraday_prices\", \"get_next_corporate_events\",\n    \"get_options_chain\", \"get_order_status\", \"get_portfolio\", \"get_price_history\",\n    \"get_return_evolution\", \"get_stop_loss_and_take_profit\", \"show_aum_evolution\",\n    \"show_portfolio_treemap\", \"show_return_evolution\", \"simulate_fixed_income_by_amount\",\n    \"simulate_fixed_income_by_nominals\",\n})\n\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\n\nclass ProviderHTTPError(Exception):\n    def __init__(self, stage, response):\n        self.stage, self.status = stage, response.code\n        kind = response.headers.get_content_type()\n        self.format = \"json\" if kind.endswith(\"json\") else \"html\" if kind==\"text/html\" else \"other\"\n        trace = response.headers.get(\"CF-Ray\", \"\")\n        self.trace = trace if re.fullmatch(r\"[a-fA-F0-9]{8,32}-[A-Z0-9]{2,8}\", trace) else None\n        self.provider_error = None\n        self.edge_code = None\n        try:\n            body = json.loads(response.read(8193)) if self.format==\"json\" else {}\n        except (OSError, ValueError):\n            body = {}\n        if isinstance(body,dict):\n            known = (\"invalid_request\", \"invalid_grant\", \"invalid_client\", \"unauthorized_client\", \"invalid_scope\",\n                     \"invalid_target\", \"access_denied\", \"forbidden\", \"insufficient_scope\", \"country_block\",\n                     \"country_challenge\", \"waf_block\", \"ip_block\", \"unsupported_grant_type\", \"rate_limited\")\n            for key in (\"error\", \"error_name\", \"error_type\", \"error_code\", \"code\"):\n                item = body.get(key)\n                if isinstance(item,str) and item.lower() in known:\n                    self.provider_error = item.lower()\n                if self.trace and (type(item) is int or (isinstance(item,str) and re.fullmatch(r\"1\\d{3}\",item))) and 1000<=int(item)<=1200:\n                    self.edge_code = int(item)\n        super().__init__(stage)\n\n    def receipt(self):\n        return {\"stage\":self.stage,\"http\":self.status,\"format\":self.format,\n                \"provider_error\":self.provider_error,\"edge_code\":self.edge_code,\"trace_id\":self.trace}\n\n\ndef exchange(path, data, headers, *, stage):\n    assert path in (\"/token\", \"\")\n    req = Request(ISSUER + path, data=data,\n                  headers={**headers, \"User-Agent\":USER_AGENT}, method=\"POST\")\n    try:\n        with build_opener(NoRedirect).open(req, timeout=15) as response:\n            body = response.read(512_001)\n            if len(body) > 512_000:\n                raise ValueError(\"IOL_PROVIDER_RESPONSE_LIMIT\")\n            return body, response.headers\n    except HTTPError as error:\n        with error:\n            raise ProviderHTTPError(stage,error) from None\n\n\ndef rpc_json(body):\n    decoded = body.decode(\"utf-8\")\n    if decoded.lstrip().startswith(\"{\"):\n        return json.loads(decoded)\n    for line in decoded.splitlines():\n        if line.startswith(\"data:\") and line[5:].lstrip().startswith(\"{\"):\n            payload = json.loads(line[5:])\n            if \"result\" in payload or \"error\" in payload:\n                return payload\n    raise ValueError(\"MCP_REPLY_UNVERIFIED\")\n\n\ndef confirm_read_only(token):\n    headers = {\n        \"Authorization\":\"Bearer \"+token,\"Content-Type\":\"application/json\",\n        \"Accept\":\"application/json, text/event-stream\",\n        \"MCP-Protocol-Version\":\"2025-06-18\",\n    }\n    def rpc(method, params, seq):\n        envelope = {\"jsonrpc\":\"2.0\",\"method\":method,\"params\":params}\n        if seq is not None:\n            envelope[\"id\"] = seq\n        return exchange(\"\",json.dumps(envelope).encode(),headers,stage=\"MCP_\"+method.upper().replace(\"/\",\"_\"))\n    response, info = rpc(\"initialize\",{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\n                                        \"clientInfo\":{\"name\":\"Porota RC6\",\"version\":\"22\"}},1)\n    init = rpc_json(response).get(\"result\")\n    if not isinstance(init,dict) or not isinstance(init.get(\"protocolVersion\"),str):\n        raise ValueError(\"MCP_INIT_UNVERIFIED\")\n    headers[\"MCP-Protocol-Version\"] = init[\"protocolVersion\"]\n    if info.get(\"Mcp-Session-Id\"):\n        headers[\"Mcp-Session-Id\"] = info[\"Mcp-Session-Id\"]\n    rpc(\"notifications/initialized\",{},None)\n    payload, _ = rpc(\"tools/list\",{},2)\n    listed = rpc_json(payload).get(\"result\",{})\n    names = {item[\"name\"] for item in listed.get(\"tools\",[])}\n    if listed.get(\"nextCursor\") or not {\"get_asset_quote\",\"get_price_history\"} <= names or not names <= READ:\n        raise ValueError(\"IOL_READ_ONLY_MODE_UNVERIFIED\")\n    return len(names)\n\n\ndef write_private(path, data):\n    fd, file = tempfile.mkstemp(prefix=\"iol-consent-\", dir=path.parent)\n    try:\n        with os.fdopen(fd,\"w\",encoding=\"utf-8\") as f:\n            json.dump(data,f,sort_keys=True)\n            f.flush()\n            os.fsync(f.fileno())\n        os.replace(file,path)\n    finally:\n        if os.path.exists(file):\n            os.unlink(file)\n\n\ndef current_digest():\n    if not STORE.is_file() or STORE.is_symlink() or STORE.stat().st_size > 128_000:\n        raise ValueError(\"IOL_STORE_UNVERIFIED\")\n    return hashlib.sha256(STORE.read_bytes()).hexdigest()\n\n\ndef require_paper():\n    marker=Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\")\n    state=json.loads(marker.read_text())\n    if state.get(\"mode\") != \"PRODUCTION_PAPER\" or state.get(\"real_orders_sent\") != 0:\n        raise ValueError(\"IOL_PAPER_RUNTIME_UNVERIFIED\")\n\n\ndef prepare():\n    require_paper()\n    with socket.socket() as sock:\n        sock.bind((\"127.0.0.1\",PORT))\n    before=current_digest()\n    prior=json.loads(STORE.read_bytes())\n    if prior.get(\"issuer\") != ISSUER or prior.get(\"redirect_uri\") != REDIRECT:\n        raise ValueError(\"IOL_EXISTING_REGISTRATION_REDIRECT_UNVERIFIED\")\n    client=prior.get(\"client_registration\",{})\n    client_id=client.get(\"client_id\")\n    if not isinstance(client_id,str) or not 0<len(client_id)<256:\n        raise ValueError(\"IOL_REGISTRATION_UNVERIFIED\")\n    if client.get(\"redirect_uris\") is not None and REDIRECT not in client[\"redirect_uris\"]:\n        raise ValueError(\"IOL_REDIRECT_UNVERIFIED\")\n    verifier=secrets.token_urlsafe(64)\n    challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b\"=\").decode()\n    state=secrets.token_urlsafe(32)\n    write_private(PENDING,{\"state\":state,\"verifier\":verifier,\"client_id\":client_id,\n                           \"expires\":time.time()+LIFETIME,\"store_digest\":before})\n    q={\"response_type\":\"code\",\"client_id\":client_id,\"redirect_uri\":REDIRECT,\"code_challenge\":challenge,\n       \"code_challenge_method\":\"S256\",\"state\":state,\"resource\":ISSUER}\n    print(json.dumps({\"url\":ISSUER+\"/authorize?\"+urlencode(q),\"expires\":int(time.time()+LIFETIME)}))\n\n\ndef apply(code,pending):\n    require_paper()\n    if current_digest()!=pending[\"store_digest\"]:\n        raise ValueError(\"IOL_STORE_CHANGED\")\n    client=json.loads(STORE.read_bytes())[\"client_registration\"]\n    fields={\"grant_type\":\"authorization_code\",\"code\":code,\"redirect_uri\":REDIRECT,\n            \"client_id\":pending[\"client_id\"],\"code_verifier\":pending[\"verifier\"],\"resource\":ISSUER}\n    headers={\"Content-Type\":\"application/x-www-form-urlencoded\",\"Accept\":\"application/json\"}\n    secret=client.get(\"client_secret\")\n    if secret:\n        if client.get(\"token_endpoint_auth_method\")==\"client_secret_basic\":\n            encoded=base64.b64encode((fields.pop(\"client_id\")+\":\"+secret).encode()).decode()\n            headers[\"Authorization\"]=\"Basic \"+encoded\n        elif client.get(\"token_endpoint_auth_method\")==\"client_secret_post\":\n            fields[\"client_secret\"]=secret\n        else:\n            raise ValueError(\"IOL_REGISTRATION_AUTH_UNVERIFIED\")\n    raw, _ = exchange(\"/token\",urlencode(fields).encode(),headers,stage=\"OAUTH_TOKEN_EXCHANGE\")\n    tokens=json.loads(raw)\n    if any(not isinstance(tokens.get(k),str) or not tokens[k] for k in (\"access_token\",\"refresh_token\")):\n        raise ValueError(\"IOL_TOKEN_RESPONSE_UNVERIFIED\")\n    count=confirm_read_only(tokens[\"access_token\"])\n    lock=STORE.with_suffix(STORE.suffix+\".refresh.lock\")\n    fd=os.open(lock,os.O_CREAT|os.O_RDWR|os.O_NOFOLLOW,0o600)\n    try:\n        fcntl.flock(fd,fcntl.LOCK_EX)\n        if current_digest()!=pending[\"store_digest\"]:\n            raise ValueError(\"IOL_STORE_CHANGED\")\n        require_paper()\n        write_private(STORE,{\"issuer\":ISSUER,\"resource\":ISSUER,\"redirect_uri\":REDIRECT,\n            \"token_endpoint\":ISSUER+\"/token\",\n            \"client_registration\":client,\n            \"tokens\":tokens,\"token_obtained_at_epoch\":time.time()})\n    finally:\n        os.close(fd)\n    return count\n\n\ndef receive():\n    pending=json.loads(PENDING.read_text())\n    result={\"state\":\"CONSENT_EXPIRED\",\"session\":SESSION}\n    class Callback(BaseHTTPRequestHandler):\n        timeout = 5\n\n        def log_message(self,*args):\n            pass\n\n        def reply(self, status, title):\n            self.send_response(status)\n            self.send_header(\"Content-Type\",\"text/plain; charset=utf-8\")\n            self.send_header(\"Cache-Control\",\"no-store\")\n            self.send_header(\"Referrer-Policy\",\"no-referrer\")\n            self.end_headers()\n            self.wfile.write(title.encode(\"utf-8\"))\n\n        def do_GET(self):\n            parsed=urlsplit(self.path)\n            params=parse_qs(parsed.query,max_num_fields=12)\n            states=params.get(\"state\", [])\n            codes=params.get(\"code\",[])\n            if (parsed.path!=\"/callback\" or len(states)!=1\n                    or not hmac.compare_digest(states[0],pending[\"state\"])):\n                self.send_error(400,\"Callback invalido\")\n                return\n            if len(codes)!=1 or not 0<len(codes[0])<=2048:\n                result[\"state\"]=\"CONSENT_NO_CODE\"\n                self.send_error(400,\"IOL no devolvio autorizacion\")\n                return\n            try:\n                result.update(state=\"AUTHENTICATED_READ_ONLY\",tools=apply(codes[0],pending))\n            except ProviderHTTPError as error:\n                result.update(state=\"IOL_UPSTREAM_REJECTED\",**error.receipt())\n                step = \"el canje del código OAuth\" if error.stage==\"OAUTH_TOKEN_EXCHANGE\" else \"la verificación de permisos MCP\"\n                self.reply(502,f\"IOL rechazó {step} (HTTP {error.status}). Podés cerrar esta página.\")\n            except Exception as error:\n                result[\"state\"]=\"OAUTH_CALLBACK_UNVERIFIED\"\n                result[\"class\"]=type(error).__name__\n                if isinstance(error,ValueError) and str(error).startswith((\"MCP_\",\"IOL_\")):\n                    result[\"reason\"]=str(error)\n                self.reply(500,\"Porota no pudo verificar el acceso Solo lectura. Podés cerrar esta página.\")\n            else:\n                self.reply(200,\"IOL autorizado en Solo lectura para Porota. Podés cerrar esta página.\")\n    try:\n        with HTTPServer((\"127.0.0.1\",PORT),Callback) as server:\n            server.timeout=2\n            while time.time()<pending[\"expires\"] and result[\"state\"]==\"CONSENT_EXPIRED\":\n                server.handle_request()\n    finally:\n        PENDING.unlink(missing_ok=True)\n    print(json.dumps(result,sort_keys=True))\n\n\ndef probe_token_endpoint():\n    \"\"\"Distinguish a provider denial from a reachable token endpoint without a consent code.\"\"\"\n    require_paper()\n    entry=json.loads(STORE.read_bytes())\n    if entry.get(\"issuer\")!=ISSUER or entry.get(\"token_endpoint\")!=ISSUER+\"/token\":\n        raise ValueError(\"IOL_PROVIDER_ENDPOINT_UNVERIFIED\")\n    registration=entry.get(\"client_registration\",{})\n    client_id=registration.get(\"client_id\")\n    if not isinstance(client_id,str) or registration.get(\"token_endpoint_auth_method\")!=\"none\":\n        raise ValueError(\"IOL_PROBE_PUBLIC_CLIENT_REQUIRED\")\n    headers={\"Content-Type\":\"application/x-www-form-urlencoded\",\"Accept\":\"application/json\"}\n    data=urlencode({\"grant_type\":\"authorization_code\",\"client_id\":client_id}).encode()\n    try:\n        exchange(\"/token\",data,headers,stage=\"OAUTH_TOKEN_ENDPOINT_PROBE\")\n    except ProviderHTTPError as error:\n        print(json.dumps({\"state\":\"IOL_TOKEN_ENDPOINT_PROBE\",\"session\":SESSION,**error.receipt()},sort_keys=True))\n        return\n    print(json.dumps({\"state\":\"IOL_TOKEN_ENDPOINT_UNEXPECTED_SUCCESS\",\"session\":SESSION},sort_keys=True))\n\n\nif __name__==\"__main__\":\n    try:\n        {\"prepare\":prepare,\"receive\":receive,\"probe\":probe_token_endpoint}[STAGE]()\n    except (ValueError, OSError, HTTPError) as error:\n        reason = str(error) if type(error) is ValueError and str(error).startswith(\"IOL_\") else type(error).__name__\n        print(json.dumps({\"state\":\"IOL_CALLBACK_SETUP_FAILED\",\"reason\":reason,\n                          \"http\":error.code if isinstance(error,HTTPError) else None}))\n        sys.exit(1)\n"
          with connection(os.environ) as (ssh,_,_):
              output=ssh_run(ssh,['sudo','-n','/usr/bin/python3','-B','-'],data=code.encode(),timeout=30)
          if output.returncode:
              raise SystemExit("IOL_TOKEN_ENDPOINT_CHECK_FAILED")
          receipt=json.loads(output.stdout)
          if receipt.get("session")!="rc6-20261123t0007" or receipt.get("state")!="IOL_TOKEN_ENDPOINT_PROBE":
              raise SystemExit("IOL_TOKEN_ENDPOINT_RECEIPT_UNVERIFIED")
          print(json.dumps(receipt,sort_keys=True))
          Path(os.environ["RUNNER_TEMP"],"iol-token-probe.json").write_text(json.dumps(receipt,sort_keys=True))
          reachable=receipt.get("http")==400 and receipt.get("format")=="json"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handoff:
              handoff.write("reachable="+("yes" if reachable else "no")+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iol-token-endpoint-precheck
          path: ${{ runner.temp }}/iol-token-probe.json
          if-no-files-found: error
