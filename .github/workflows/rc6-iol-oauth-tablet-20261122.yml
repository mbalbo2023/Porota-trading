name: RC6 IOL private egress evidence for provider support
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08cfa083b0a060b6e503894c793a150bb948693c
          persist-credentials: false
      - name: Verify PAPER deployment and encrypt the egress detected by IOL
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          import base64
          import ipaddress
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          from scripts.porota_actions_host import connection, decode_receipt, ssh_run

          host_probe = "import datetime\nimport ipaddress\nimport json\nfrom pathlib import Path\nimport re\nfrom urllib.error import HTTPError\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\n\nmarker = json.loads(Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\").read_bytes())\nassert marker.get(\"deployment_sha\") == \"3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1\"\nassert marker.get(\"mode\") == \"PRODUCTION_PAPER\" and marker.get(\"real_order_capability\") == \"BLOCKED\"\nassert type(marker.get(\"real_orders_sent\")) is int and marker[\"real_orders_sent\"] == 0\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\nurl = \"https://mcp.invertironline.com/cdn-cgi/trace\"\nrequest = Request(url, headers={\"Accept\":\"text/plain\",\"User-Agent\":\"Porota-Trading-RC6/1.0 (IOL MCP read-only)\"})\ntry:\n    with build_opener(NoRedirect).open(request, timeout=9) as response:\n        raw = response.read(8193)\n        assert len(raw) <= 8192 and response.headers.get_content_type() == \"text/plain\"\n        fields = dict(item.split(\"=\", 1) for item in raw.decode(\"ascii\").splitlines() if \"=\" in item)\n        assert fields.get(\"h\") == \"mcp.invertironline.com\"\n        ip = ipaddress.ip_address(fields[\"ip\"])\n        mapped = getattr(ip, \"ipv4_mapped\", None)\n        ip = mapped or ip\n        assert ip.is_global and not ip.is_multicast\n        colo = fields.get(\"colo\")\n        ray = response.headers.get(\"CF-Ray\", \"\")\n        assert not colo or re.fullmatch(r\"[A-Z0-9]{2,8}\", colo)\n        if not re.fullmatch(r\"[0-9a-fA-F]{8,32}-[A-Z0-9]{2,8}\", ray):\n            ray = None\n        evidence = {\"ip\":str(ip), \"source\":\"IOL_CLOUDFLARE_TRACE\", \"colo\":colo, \"ray_id\":ray}\nexcept HTTPError as exc:\n    print(json.dumps({\"state\":\"TRACE_UNAVAILABLE\",\"status\":exc.code}))\n    raise SystemExit(2)\nevidence[\"utc\"] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec=\"seconds\")\nprint(json.dumps(evidence,sort_keys=True))\n"
          with connection(os.environ) as (ssh, _, _):
              result = ssh_run(ssh, ['sudo', '-n', '/usr/bin/python3', '-B', '-'],
                               data=host_probe.encode(), timeout=24)
          if result.returncode:
              try:
                  error = decode_receipt(result.stdout)
                  status = error.get('status')
                  if error.get('state') == 'TRACE_UNAVAILABLE' and type(status) is int and 400 <= status <= 599:
                      print('TRACE_HTTP_' + str(status))
              except Exception:
                  pass
              raise SystemExit('IOL_EGRESS_UNVERIFIED')
          try:
              receipt = decode_receipt(result.stdout)
              ip = ipaddress.ip_address(receipt.get('ip'))
              assert ip.is_global and not ip.is_multicast and receipt.get('source') == 'IOL_CLOUDFLARE_TRACE'
              try:
                  configured = ipaddress.ip_address(os.environ['DO_HOST'])
              except ValueError:
                  configured = None
              receipt['same_as_configured_host_ipv4_or_ipv6'] = (configured == ip) if configured else None
              content = json.dumps(receipt, separators=(',',':')).encode()
              if len(content) > 300:
                  raise ValueError('oversize')
              with tempfile.NamedTemporaryFile(mode='w') as public_file:
                  public_file.write("-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAmrnYTKb6p8hM8Uzwobjf\n3H3iQD0tWIwyKFSi4sN9QyK3Ih56HfqTXoqT9PGq6WZgSBX1xphWqZpbQQmThorT\nNisl5+bUmk7DFzuHIJSkEMnd8eNyRpqegXdGzCPea7Tl1MEYqGJLWIlkn0GaKKuy\n8HnSEzG8/IuaAgdqJ0CUC91X+vHTX0aidSBpBZu8Xb1fXCUhnnMuhx8NHFJNTnH9\nujzeo3mRhutr17ClOoKf3j5HCmSlsiVjV+jSCgLaCdZCRSyfVL0JrT7r+ek+eniW\n6nKiBkWByXdH6Uzi4r5avqcnDgFs65dyUqL1b1LX56YzM4k60pSL6ziz3d+QuqFX\nlOL91LlRSjqgRCB80hWQPXqZKwpJbOm7FOXl84ouA/iZTjcSQoTUYc81X2hvD5m4\nqMIGVYammoIXx/HUE5XDBBXGBeEQPqhQZG+oX8fL1WO+9OA9rSx0VrjB13SE5DiM\n+5v6ZpIpUXXdDrmeBp9nxmOk5d5M5w5Fxx0XnHeH0jw48xwobKUHaYq7UXar1sal\nb71bKxI3ussWYf3HaRHUJQlgPx2qdaLsxQRTrrOXcJLY8VQ/e+TDD7eRjgAO+gPd\nKmZA5KLqEcyjp3KDbhBcn5sJH/kNC/uoLTh+4SsBOZkbhz75DphxfLnMSoWp6vCe\nF2CSGBgRWiiRXBWuizwDK50CAwEAAQ==\n-----END PUBLIC KEY-----\n")
                  public_file.flush()
                  sealed = subprocess.run(['openssl','pkeyutl','-encrypt','-pubin',
                      '-inkey',public_file.name,'-pkeyopt','rsa_padding_mode:oaep',
                      '-pkeyopt','rsa_oaep_md:sha256'],input=content,capture_output=True,check=True)
              Path(os.environ['RUNNER_TEMP'], 'egress.json').write_text(
                  json.dumps({'encrypted':base64.b64encode(sealed.stdout).decode()}))
          except Exception:
              raise SystemExit('IOL_EGRESS_RECEIPT_UNVERIFIED') from None
          print('IOL_EGRESS_ENCRYPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iol-egress-encrypted
          path: ${{ runner.temp }}/egress.json
          if-no-files-found: error
          retention-days: 1
