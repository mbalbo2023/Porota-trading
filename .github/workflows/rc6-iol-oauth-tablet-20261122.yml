name: RC6 IOL OAuth provider and effective client read-only probe
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths: [.github/workflows/rc6-iol-oauth-tablet-20261122.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  metadata:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08cfa083b0a060b6e503894c793a150bb948693c
          persist-credentials: false
      - name: Compare provider metadata and incomplete token request from both networks
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          python3 -B - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import os
          from pathlib import Path
          import subprocess
          from scripts.porota_actions_host import connection, decode_receipt, ssh_run
          probe = "import ast\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nfrom urllib.error import HTTPError, URLError\nfrom urllib.parse import urlencode, urlsplit\nfrom urllib.request import HTTPRedirectHandler, Request, build_opener\n\nSITE = \"https://mcp.invertironline.com\"\nUA = \"Porota-Trading-RC6/1.0 (IOL MCP read-only)\"\nEXPECTED_SOURCE = \"08cfa083b0a060b6e503894c793a150bb948693c\"\nEXPECTED_DEPLOY = \"3f2fdd1bc2ebf697f799d4c715cadbe7a67fcef1\"\nEXPECTED_HASH = \"7446edfa73383a2feeb5672a50a63a335f4b7d912d19c88424924e1fb3777ea0\"\nAUTH = {\"none\", \"client_secret_post\", \"client_secret_basic\", \"private_key_jwt\"}\nGRANTS = {\"authorization_code\", \"refresh_token\", \"client_credentials\"}\nERRORS = {\"invalid_request\", \"invalid_grant\", \"invalid_client\", \"unauthorized_client\",\n          \"unsupported_grant_type\", \"invalid_target\", \"access_denied\", \"forbidden\",\n          \"country_block\", \"ip_block\", \"waf_block\", \"invalid_scope\", \"rate_limited\"}\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\ndef own_endpoint(value):\n    if not isinstance(value, str):\n        return None\n    parsed = urlsplit(value)\n    if (parsed.scheme == \"https\" and parsed.netloc == \"mcp.invertironline.com\"\n        and not parsed.query and not parsed.fragment\n        and re.fullmatch(r\"/[a-zA-Z0-9./_-]{0,100}\", parsed.path or \"/\")):\n        return SITE + parsed.path\n    return None\n\ndef response(path, *, data=None):\n    headers = {\"Accept\": \"application/json\", \"User-Agent\": UA}\n    if data is not None:\n        headers[\"Content-Type\"] = \"application/x-www-form-urlencoded\"\n    try:\n        received = build_opener(NoRedirect).open(Request(SITE + path, data=data, headers=headers), timeout=8)\n    except HTTPError as error:\n        received = error\n    except (URLError, TimeoutError, OSError) as error:\n        return {\"transport\": type(error).__name__}, {}\n    with received:\n        result = {\"http\": received.code, \"format\": received.headers.get_content_type()}\n        trace = received.headers.get(\"CF-Ray\", \"\")\n        if re.fullmatch(r\"[a-fA-F0-9]{8,32}-[A-Z0-9]{2,8}\", trace):\n            result[\"trace_id\"] = trace\n        mitigated = received.headers.get(\"cf-mitigated\", \"\")\n        if mitigated.lower() == \"challenge\":\n            result[\"edge_challenge\"] = True\n        raw = received.read(16_385)\n        if len(raw) > 16_384:\n            return {**result, \"body_limit\": True}, {}\n        if result[\"format\"].endswith(\"json\"):\n            try:\n                payload = json.loads(raw)\n            except (UnicodeError, ValueError):\n                payload = None\n            if isinstance(payload, dict):\n                err = payload.get(\"error\")\n                if isinstance(err, str) and err in ERRORS:\n                    result[\"oauth_error\"] = err\n                return result, payload\n        if result[\"format\"] == \"text/html\":\n            html = raw.decode(\"utf-8\", errors=\"replace\").lower()\n            signatures = {\n                \"CLOUDFLARE_CHALLENGE\": (\"cdn-cgi/challenge-platform\", \"just a moment\"),\n                \"CLOUDFLARE_ACCESS_DENIED\": (\"cloudflare ray id\", \"attention required\"),\n                \"COUNTRY_RESTRICTION_TEXT\": (\"not available in your country\", \"not available in your region\",\n                    \"no está disponible en tu país\", \"no disponible en tu región\"),\n                \"ORIGIN_GENERIC_FORBIDDEN\": (\"<title>403 forbidden</title>\",),\n            }\n            result[\"html_markers\"] = [key for key, phrases in signatures.items()\n                                      if any(phrase in html for phrase in phrases)]\n            ids = re.findall(r\"(?:error code|error)\\s*[:#]?\\s*(10[0-9]{2}|11[0-9]{2})\\b\", html)\n            if ids and \"trace_id\" in result:\n                result[\"edge_error_code\"] = int(ids[0])\n        return result, {}\n\ndef allowed_list(payload, key, allowed):\n    values = payload.get(key)\n    return sorted({i for i in values if isinstance(i, str) and i in allowed}) if isinstance(values, list) else []\n\ndef metadata():\n    rs, resource = response(\"/.well-known/oauth-protected-resource\")\n    as_status, server = response(\"/.well-known/oauth-authorization-server\")\n    endpoints = {key: own_endpoint(server.get(key)) for key in (\"issuer\", \"authorization_endpoint\",\n                    \"token_endpoint\", \"registration_endpoint\")}\n    auth_servers = resource.get(\"authorization_servers\")\n    check = {\n        \"resource_metadata\": rs, \"authorization_metadata\": as_status,\n        \"public_resource_matches\": isinstance(auth_servers, list) and SITE in auth_servers,\n        \"endpoints\": endpoints,\n        \"pkce_s256\": \"S256\" in allowed_list(server, \"code_challenge_methods_supported\", {\"S256\"}),\n        \"token_auth_methods\": allowed_list(server, \"token_endpoint_auth_methods_supported\", AUTH),\n        \"grant_types\": allowed_list(server, \"grant_types_supported\", GRANTS),\n    }\n    endpoint = endpoints[\"token_endpoint\"]\n    # One deliberately incomplete, credential-free OAuth request. No valid code or account is used.\n    token, _ = response(urlsplit(endpoint).path if endpoint else \"/token\",\n                        data=urlencode({\"grant_type\": \"authorization_code\"}).encode())\n    return {**check, \"public_token_probe\": token}\n\ndef key_state(path):\n    observed = path.lstat()\n    assert path.resolve() == path and stat.S_ISREG(observed.st_mode) and observed.st_uid == 0\n    assert stat.S_IMODE(observed.st_mode) == 0o600 and observed.st_nlink == 1 and observed.st_size < 128_000\n    return json.loads(path.read_bytes())\n\ndef droplet():\n    marker = json.loads(Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\").read_bytes())\n    assert marker.get(\"candidate_sha\") == EXPECTED_SOURCE and marker.get(\"deployment_sha\") == EXPECTED_DEPLOY\n    assert marker.get(\"mode\") == \"PRODUCTION_PAPER\" and marker.get(\"real_order_capability\") == \"BLOCKED\"\n    assert type(marker.get(\"real_orders_sent\")) is int and marker[\"real_orders_sent\"] == 0\n    adapter = Path(\"/var/lib/porota-rc6-iol\") / EXPECTED_SOURCE / \"iol_mcp_readonly_adapter_rc6.py\"\n    observed = adapter.lstat()\n    assert adapter.resolve() == adapter and stat.S_ISREG(observed.st_mode) and observed.st_uid == 0\n    assert not observed.st_mode & 0o022 and observed.st_nlink == 1 and observed.st_size < 128_000\n    archive = adapter.read_bytes()\n    digest = hashlib.sha256(archive).hexdigest()\n    assert digest == EXPECTED_HASH\n    declared = next(n.value.value for n in ast.parse(archive).body\n                    if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name)\n                    and t.id == \"MCP_PROTOCOL_VERSION\" for t in n.targets)\n                    and isinstance(n.value, ast.Constant))\n    profile = key_state(Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\"))\n    registration = profile.get(\"client_registration\") or {}\n    method = registration.get(\"token_endpoint_auth_method\")\n    endpoint = own_endpoint(profile.get(\"token_endpoint\"))\n    redirect = profile.get(\"redirect_uri\") == \"http://127.0.0.1:8765/callback\"\n    return {\"source_sha\": EXPECTED_SOURCE, \"deployment_sha\": EXPECTED_DEPLOY,\n            \"adapter_sha256\": digest, \"mcp_initialize_protocol\": declared,\n            \"registration_auth_method\": method if isinstance(method, str) and method in AUTH else\n                        \"absent\" if method is None else \"unsupported\",\n            \"has_client_secret\": bool(registration.get(\"client_secret\")),\n            \"callback_loopback_matches\": redirect, \"stored_token_endpoint\": endpoint,\n            \"mode\": marker[\"mode\"], \"real_orders_sent\": marker[\"real_orders_sent\"]}\n\nwhere = \"DROPLET\" if os.geteuid() == 0 else \"GITHUB_RUNNER\"\npayload = {\"schema\": \"RC6_IOL_OAUTH_METADATA_V1\", \"domain\": where, \"utc\": datetime.now(timezone.utc).isoformat()}\nif where == \"DROPLET\":\n    payload[\"effective_client\"] = droplet()\npayload.update(metadata())\nprint(json.dumps(payload, sort_keys=True))\n"
          with connection(os.environ) as (ssh, _, _), ThreadPoolExecutor(2) as workers:
              remote = workers.submit(ssh_run, ssh, ['sudo', '-n', '/usr/bin/python3', '-B', '-'], data=probe.encode(), timeout=38)
              local = workers.submit(subprocess.run, ['python3', '-B', '-'], input=probe.encode(), capture_output=True, timeout=36)
              results = [remote.result(), local.result()]
          evidence = [decode_receipt(r.stdout) if r.returncode == 0 else
                      {'domain': domain, 'probe_state': 'FAILED', 'exit': r.returncode}
                      for r, domain in zip(results, ('DROPLET', 'GITHUB_RUNNER'))]
          print(json.dumps(evidence, indent=2, sort_keys=True))
          Path(os.environ['RUNNER_TEMP'], 'iol-provider-probe.json').write_text(json.dumps(evidence, indent=2))
          if any(p.get('probe_state') == 'FAILED' for p in evidence):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iol-provider-probe
          path: ${{ runner.temp }}/iol-provider-probe.json
          retention-days: 14
          if-no-files-found: error
