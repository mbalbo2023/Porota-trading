name: RC6 IOL OAuth upstream metadata read-only
on:
  push:
    branches: [diagnostic/rc6-iol-oauth-tablet-20261122]
    paths:
      - .github/workflows/rc6-iol-oauth-tablet-20261122.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Read OAuth metadata and one authenticated MCP handshake without refreshing
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          
          source="import datetime,json,os,re\nfrom pathlib import Path\nfrom urllib.error import HTTPError,URLError\nfrom urllib.request import Request,HTTPRedirectHandler,build_opener\n\nISSUER=\"https://mcp.invertironline.com\"\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self,req,fp,code,msg,headers,newurl):\n        return None\n\ndef read_response(path,label,headers=None,data=None):\n    req=Request(ISSUER+path,headers=headers or {\"Accept\":\"application/json\"},data=data,\n                method=\"POST\" if data else \"GET\")\n    try:\n        response=build_opener(NoRedirect).open(req,timeout=10)\n    except HTTPError as error:\n        response=error\n    except (OSError,URLError,TimeoutError) as error:\n        return {\"stage\":label,\"transport\":type(error).__name__}\n    with response:\n        raw=response.read(24001)\n        typ=response.headers.get_content_type()\n        entry={\"stage\":label,\"http\":response.code,\n               \"format\":\"json\" if typ.endswith(\"json\") else \"html\" if typ==\"text/html\" else \"other\",\n               \"edge_reported\":bool(response.headers.get(\"CF-Ray\"))}\n        challenge=re.search(r'error=\"(invalid_token|invalid_scope|insufficient_scope|invalid_request)\"',\n                            response.headers.get(\"WWW-Authenticate\",\"\"))\n        if challenge:\n            entry[\"challenge\"]=challenge[1]\n        try:\n            value=json.loads(raw) if len(raw)<24001 else None\n        except (ValueError,UnicodeDecodeError):\n            value=None\n        if isinstance(value,dict):\n            error=value.get(\"error\")\n            if isinstance(error,str) and error in {\"invalid_request\",\"invalid_grant\",\"invalid_client\",\n                     \"invalid_token\",\"invalid_scope\",\"insufficient_scope\",\"access_denied\",\"invalid_target\",\n                     \"unauthorized_client\",\"unsupported_grant_type\",\"forbidden\",\"server_error\"}:\n                entry[\"provider_error\"]=error\n            if label==\"auth_metadata\":\n                entry.update(token_matches=value.get(\"token_endpoint\")==ISSUER+\"/token\",\n                             authorize_matches=value.get(\"authorization_endpoint\")==ISSUER+\"/authorize\",\n                             methods=[m for m in (value.get(\"token_endpoint_auth_methods_supported\") or [])\n                                      if m in (\"none\",\"client_secret_basic\",\"client_secret_post\")],\n                             s256=\"S256\" in (value.get(\"code_challenge_methods_supported\") or []))\n            if label==\"resource_metadata\":\n                entry[\"resource_matches\"]=value.get(\"resource\",\"\").rstrip(\"/\")==ISSUER\n                entry[\"authority_matches\"]=ISSUER in (value.get(\"authorization_servers\") or [])\n            if label==\"mcp_initialize\":\n                entry[\"handshake\"]=isinstance(value.get(\"result\"),dict)\n        return entry\n\ndef probe(location):\n    evidence=[read_response(\"/.well-known/oauth-authorization-server\",\"auth_metadata\"),\n              read_response(\"/.well-known/oauth-protected-resource\",\"resource_metadata\")]\n    if location==\"droplet\":\n        marker=json.loads(Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\").read_text())\n        assert marker.get(\"mode\")==\"PRODUCTION_PAPER\" and marker.get(\"real_orders_sent\")==0\n        store=json.loads(Path(\"/root/.config/porota/iol_mcp_oauth_bootstrap.json\").read_text())\n        assert store.get(\"issuer\")==ISSUER\n        registration=store.get(\"client_registration\",{})\n        mode=registration.get(\"token_endpoint_auth_method\") or \"none\"\n        evidence.append({\"stage\":\"registration\",\"auth_method\":mode if mode in (\"none\",\"client_secret_basic\",\"client_secret_post\") else \"other\",\n                         \"token_endpoint_matches\":store.get(\"token_endpoint\")==ISSUER+\"/token\",\n                         \"token_endpoint_configured\":bool(store.get(\"token_endpoint\")),\n                         \"redirect_matches\":store.get(\"redirect_uri\")==\"http://127.0.0.1:8765/callback\"})\n        if any(row.get(\"http\",0)==200 for row in evidence):\n            token=store.get(\"tokens\",{}).get(\"access_token\")\n            if isinstance(token,str) and token:\n                request={\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\n                         \"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\n                         \"clientInfo\":{\"name\":\"porota-rc6-iol-shadow\",\"version\":\"1.0\"}}}\n                evidence.append(read_response(\"\",\"mcp_initialize\",{\"Authorization\":\"Bearer \"+token,\n                      \"Accept\":\"application/json, text/event-stream\",\"Content-Type\":\"application/json\"},\n                      json.dumps(request).encode()))\n    return {\"location\":location,\"observed_at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\n            \"results\":evidence,\"store_writes\":0,\"real_orders_sent\":0}\n"
          module={}
          exec(source,module)
          runner=module["probe"]("runner")
          with connection(os.environ) as (ssh,_,_):
              result=ssh_run(ssh,['sudo','-n','/usr/bin/python3','-B','-'],
                             data=(source+'\nprint(json.dumps(probe("droplet"),sort_keys=True))\n').encode(),timeout=45)
          if result.returncode:
              raise SystemExit("IOL_READ_ONLY_METADATA_PROBE_HOST_FAILED")
          report={"runner":runner,"droplet":json.loads(result.stdout)}
          print(json.dumps(report,sort_keys=True))
          Path(os.environ["RUNNER_TEMP"],"iol-upstream-probe.json").write_text(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iol-upstream-probe
          path: ${{ runner.temp }}/iol-upstream-probe.json
          if-no-files-found: error
          retention-days: 14
