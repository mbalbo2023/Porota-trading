name: RC6 targeted contractual GET response capture 2026-09-14

on:
  push:
    branches:
      - ops/rc6-contract-open-session-immediate-20260914
    paths:
      - .github/workflows/rc6-contract-open-session-immediate-20260914.yml
      - ops/rc6_ppi_contract_targeted_capture_20260914.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-contract-open-session-immediate-20260914
  cancel-in-progress: false

jobs:
  targeted-contractual-capture-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enforce approved date
        run: test "$(TZ=America/Argentina/Buenos_Aires date +%F)" = "2026-09-14"

      - name: Checkout targeted probe
        uses: actions/checkout@v4

      - name: Configure audited SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Stage targeted capture
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          REMOTE_SCRIPT="/tmp/porota-ppi-contract-targeted-${GITHUB_RUN_ID}.py"
          scp -q -o BatchMode=yes -o ConnectTimeout=20 \
            ops/rc6_ppi_contract_targeted_capture_20260914.py \
            "$DO_USER@$DO_HOST:$REMOTE_SCRIPT"
          echo "REMOTE_SCRIPT=$REMOTE_SCRIPT" >> "$GITHUB_ENV"

      - name: Run targeted GET-only capture
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DO_USER@$DO_HOST" \
            "sudo -n bash -s -- '$REMOTE_SCRIPT'" <<'REMOTE' 2>&1 | tee targeted.log
          set -Eeuo pipefail
          umask 077
          SCRIPT="$1"
          ROOT=/opt/porota-trading
          LIB=/usr/local/lib/porota-contract-evidence-rc6
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          CE_PYTHON=/opt/porota-contract-evidence-venv/bin/python
          CONTAINER=porota_production_observer
          OUTDIR="$ROOT/data/contract_evidence/rc6_targeted"
          trap 'rm -f "$SCRIPT"' EXIT

          echo POROTA_TARGETED_CONTRACT_CAPTURE
          echo MUTATIONS=CAPTURE_FILE_ONLY
          echo HTTP_METHODS_ALLOWED=GET_HEAD_OPTIONS
          echo QUERY_STRINGS_LOGGED=NO
          echo REQUEST_HEADERS_LOGGED=NO
          echo RAW_RESPONSE_BODIES_LOGGED=NO
          echo DB_IMPORT_EXECUTED=NO
          echo SERVICE_RESTARTED=NO
          echo REAL_ORDERS_SENT=0

          exec 9>/run/lock/porota-ppi-web-browser.lock
          flock -w 20 9 || { echo STATE=SKIPPED_GLOBAL_PPI_BROWSER_LOCK_BUSY; exit 5; }
          echo GLOBAL_PPI_BROWSER_LOCK=ACQUIRED
          ! systemctl is-active --quiet porota-ppi-web-residual-rc6.service || { echo STATE=BLOCKED_RESIDUAL_WRITER_ACTIVE; exit 5; }

          test -r "$SCRIPT" || { echo STATE=BLOCKED_TARGETED_SCRIPT_MISSING; exit 5; }
          grep -F 'SAFE_METHODS = {"GET", "HEAD", "OPTIONS"}' "$SCRIPT" >/dev/null || { echo STATE=BLOCKED_METHOD_GUARD; exit 5; }
          grep -F 'return route.abort()' "$SCRIPT" >/dev/null || { echo STATE=BLOCKED_ABORT_GUARD; exit 5; }
          echo TARGETED_SAFETY=PASS

          SAFETY="$(docker exec "$CONTAINER" python -c "import sqlite3,json; c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on'); r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close(); print(json.dumps({'mode':r[0] if r else None,'real_orders_sent':r[1] if r else None},sort_keys=True))")"
          echo "OBSERVER_PREFLIGHT=$SAFETY"
          SAFETY="$SAFETY" python3 -c "import os,json,sys; d=json.loads(os.environ['SAFETY']); sys.exit(0 if d.get('mode')=='PRODUCTION_PAPER' and int(d.get('real_orders_sent') or 0)==0 else 1)" || { echo STATE=BLOCKED_OBSERVER_SAFETY; exit 5; }

          BROWSER_USER="$(stat -c '%U' "$PROFILE")"
          BROWSER_HOME="$(getent passwd "$BROWSER_USER" | cut -d: -f6)"
          BROWSER_GROUP="$(id -gn "$BROWSER_USER")"
          STAGE_DIR="$BROWSER_HOME/porota-browser-lab/rc6-open-session"
          install -d -o "$BROWSER_USER" -g "$BROWSER_GROUP" -m 0700 "$STAGE_DIR"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          STAGE="$STAGE_DIR/contract_targeted_${stamp}.json"
          CAPTURE="$OUTDIR/contract_targeted_${stamp}.json"

          set +e
          runuser -u "$BROWSER_USER" -- env HOME="$BROWSER_HOME" PYTHONPATH="$LIB:$ROOT" \
            "$CE_PYTHON" "$SCRIPT" --profile "$PROFILE" --output "$STAGE"
          TARGET_RC=$?
          set -e
          echo "TARGET_RC=$TARGET_RC"
          test -r "$STAGE" || { echo STATE=BLOCKED_CAPTURE_MISSING; exit 6; }

          install -d -m 0750 "$OUTDIR"
          install -o root -g root -m 0600 "$STAGE" "$CAPTURE"
          rm -f "$STAGE"

          python3 - "$CAPTURE" "$TARGET_RC" <<'PY'
          import json,os,sys
          path=sys.argv[1]; rc=int(sys.argv[2])
          d=json.load(open(path,encoding='utf-8'))
          caps=d.get('captures') or []
          kinds=sorted(set(str(x.get('kind')) for x in caps if isinstance(x,dict)))
          al30=[]; cauc=[]
          for x in caps:
              if not isinstance(x,dict): continue
              if x.get('kind')=='InstrumentosOperables': al30.extend(x.get('al30_rows') or [])
              if x.get('kind')=='CaucionesOperables': cauc.extend(x.get('rows') or [])
          print('CAPTURE_FILE='+os.path.basename(path))
          print('CAPTURE_BYTES='+str(os.path.getsize(path)))
          print('AUTH_STATUS='+str(d.get('auth_status')))
          print('ROUTES_REACHED='+str(sum(1 for x in d.get('routes',[]) if isinstance(x,dict) and x.get('reached')))+'/'+str(len(d.get('routes',[]))))
          print('CAPTURE_KINDS='+','.join(kinds))
          print('CAPTURE_RECORDS='+str(len(caps)))
          print('AL30_EXPLICIT='+('YES' if al30 else 'NO'))
          print('AL30_ROWS='+str(len(al30)))
          print('AL30_FIELDSETS='+json.dumps([sorted(map(str,r.keys())) for r in al30 if isinstance(r,dict)][:10],ensure_ascii=False))
          print('CAUCIONES_ROWS='+str(len(cauc)))
          print('CAUCIONES_FIELDSETS='+json.dumps([sorted(map(str,r.keys())) for r in cauc if isinstance(r,dict)][:20],ensure_ascii=False))
          print('BLOCKED_NONREAD_COUNT='+str(d.get('blocked_nonread',0)))
          print('DB_IMPORT_EXECUTED='+str(bool(d.get('db_import_executed'))).upper())
          print('SERVICE_RESTARTED='+str(bool(d.get('service_restarted'))).upper())
          print('REAL_ORDERS_SENT='+str(d.get('real_orders_sent',0)))
          if rc != 0 or d.get('auth_status')!='AUTHENTICATED_TRUSTED_DEVICE':
              print('STATE=BLOCKED_TARGETED_CAPTURE')
              raise SystemExit(6)
          print('STATE=TARGETED_CAPTURE_COMPLETE')
          PY
          REMOTE
          rc=${PIPESTATUS[0]}
          echo "REMOTE_RC=$rc" | tee -a targeted.log
          exit "$rc"

      - name: Publish sanitized targeted result
        if: always()
        run: |
          test -f targeted.log || exit 0
          tail -n 120 targeted.log >> "$GITHUB_STEP_SUMMARY"
