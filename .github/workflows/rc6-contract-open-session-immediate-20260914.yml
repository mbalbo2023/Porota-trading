name: RC6 audit deployed reauth helper 2026-09-14

on:
  push:
    branches:
      - ops/rc6-contract-open-session-immediate-20260914
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-contract-open-session-immediate-20260914
  cancel-in-progress: false

jobs:
  audit-reauth-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure audited SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Audit deployed reauth helper without execution
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DO_USER@$DO_HOST" 'sudo -n bash -s' <<'REMOTE' 2>&1 | tee audit.log
          set -euo pipefail
          REAUTH=/usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py
          COLLECTOR=/usr/local/lib/porota-contract-evidence-rc6/rc6_trusted_browser_contract_collector.py
          echo "POROTA_REAUTH_SOURCE_AUDIT"
          echo "MUTATIONS=NONE"
          echo "DB_IMPORT_EXECUTED=NO"
          echo "REAL_ORDERS_SENT=0"
          test -r "$REAUTH" || { echo "STATE=REAUTH_MISSING"; exit 4; }
          stat -c 'REAUTH mode=%a owner=%U:%G bytes=%s modified=%y' "$REAUTH"
          sha256sum "$REAUTH" | sed 's#  .*#  [DEPLOYED_REAUTH]#'
          echo "=== REAUTH_SOURCE ==="
          sed -n '1,420p' "$REAUTH" | sed -E 's/(password|token|cookie|authorization|secret)([[:space:]_=:]+).*/\1\2[REDACTED]/Ig'
          echo "=== REAUTH_ROUTE_GUARDS ==="
          grep -Ein 'POST|GET|HEAD|OPTIONS|route\.abort|route\.continue|operar|orden|order|trade|cancel|otp|2fa|login|sso' "$REAUTH" | head -240 || true
          echo "=== COLLECTOR_HASH ==="
          sha256sum "$COLLECTOR" | sed 's#  .*#  [DEPLOYED_COLLECTOR]#'
          echo "STATE=REAUTH_SOURCE_AUDIT_COMPLETE_NO_EXECUTION"
          REMOTE
          rc=${PIPESTATUS[0]}
          tail -c 30000 audit.log >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
