name: RC6 inspect sanitized AL30 input metadata 2026-09-14

on:
  push:
    branches:
      - ops/rc6-contract-open-session-immediate-20260914
    paths:
      - .github/workflows/rc6-contract-open-session-immediate-20260914.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-al30-input-metadata-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce approved date
        run: test "$(TZ=America/Argentina/Buenos_Aires date +%F)" = "2026-09-14"

      - name: Configure audited SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Read latest sanitized candidate metadata
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DO_USER@$DO_HOST" 'sudo -n bash -s' <<'REMOTE' | tee inspect.log
          set -Eeuo pipefail
          D=/opt/porota-trading/data/contract_evidence/rc6_al30_technical
          F="$(find "$D" -maxdepth 1 -type f -name 'al30_technical_*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$F" -a -r "$F" || { echo STATE=BLOCKED_CAPTURE_NOT_FOUND; exit 4; }
          python3 - "$F" <<'PY'
          import json,os,sys
          p=sys.argv[1]
          d=json.load(open(p,encoding='utf-8'))
          print('POROTA_AL30_INPUT_METADATA_INSPECTION')
          print('MUTATIONS=NONE')
          print('CAPTURE_FILE='+os.path.basename(p))
          print('AUTH_STATUS='+str(d.get('auth_status')))
          print('INPUT_CANDIDATES='+json.dumps(d.get('input_candidates') or [],ensure_ascii=False,sort_keys=True))
          print('SELECTED_INPUT='+json.dumps(d.get('selected_input'),ensure_ascii=False,sort_keys=True))
          print('TECHNICAL_HOST_PATHS='+json.dumps([x.get('host_path') for x in (d.get('technical_responses') or []) if isinstance(x,dict)],ensure_ascii=False))
          print('REAL_ORDERS_SENT='+str(d.get('real_orders_sent',0)))
          print('DB_IMPORT_EXECUTED='+str(bool(d.get('db_import_executed'))).upper())
          print('SERVICE_RESTARTED='+str(bool(d.get('service_restarted'))).upper())
          print('STATE=INPUT_METADATA_INSPECTION_COMPLETE')
          PY
          REMOTE

      - name: Publish sanitized inspection
        if: always()
        run: |
          test -f inspect.log || exit 0
          tail -n 80 inspect.log >> "$GITHUB_STEP_SUMMARY"
