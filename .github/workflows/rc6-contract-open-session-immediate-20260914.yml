name: RC6 audit installed contract collector source 2026-09-14

on:
  push:
    branches:
      - ops/rc6-contract-open-session-immediate-20260914
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-contract-open-session-immediate-20260914
  cancel-in-progress: false

jobs:
  audit-collector-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure audited SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Audit deployed wrapper without execution
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DO_USER@$DO_HOST" 'sudo -n bash -s' <<'REMOTE' 2>&1 | tee audit.log
          set -euo pipefail
          echo "POROTA_CONTRACT_COLLECTOR_SOURCE_AUDIT"
          echo "MUTATIONS=NONE"
          for p in             /etc/systemd/system/porota-contract-evidence-rc6.service             /usr/local/sbin/porota-contract-evidence-rc6-tradingday.sh             /usr/local/sbin/porota-contract-evidence-rc6-calendar-guard.sh             /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh             /usr/local/sbin/porota-contract-evidence-rc6-with-dom.sh; do
            echo "=== FILE $p ==="
            if test -r "$p"; then
              stat -c 'mode=%a owner=%U:%G bytes=%s modified=%y' "$p"
              sed -n '1,360p' "$p" | sed -E 's/(token|password|secret|cookie|authorization)([[:space:]_=:]+).*/\1\2[REDACTED]/Ig'
            else
              echo "MISSING"
            fi
          done
          echo "=== DANGEROUS_ROUTE_SCAN ==="
          grep -Ein 'place.?order|send.?order|cancel.?order|crear.?orden|comprar|vender|/orders?|http.*post|requests\.post|curl.*(-X|--request).*POST'             /usr/local/sbin/porota-contract-evidence-rc6-tradingday.sh             /usr/local/sbin/porota-contract-evidence-rc6-calendar-guard.sh             /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh             /usr/local/sbin/porota-contract-evidence-rc6-with-dom.sh 2>/dev/null || true
          echo "STATE=SOURCE_AUDIT_COMPLETE_NO_EXECUTION"
          REMOTE
          rc=${PIPESTATUS[0]}
          tail -c 30000 audit.log >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
