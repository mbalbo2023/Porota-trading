name: RC6 Wave5 Contract Evidence Dashboard Validate 2026-09-08
on:
  push:
    branches: [integration/rc6-wave5-contract-evidence-dashboard-20260908]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baseline and compile
        run: |
          set -euo pipefail
          BASE=860b26ca22a73679217e8953207041da2b8afffd
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          python -m py_compile ch_contract_evidence_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bg_paper_dashboard.py rc6_data_sla_policy.py rc6_dom_coverage_reconciler.py rc6_scraping_semaphore.py
      - name: Focused tests
        run: |
          python -m pip install -q pytest fastapi
          PYTHONPATH=. python -m pytest -q tests/test_contract_evidence_hf6.py tests/test_rc6_wave1b_sla_scraping.py
      - name: Safety surface
        run: |
          set -euo pipefail
          ! git diff 860b26ca22a73679217e8953207041da2b8afffd HEAD -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo WAVE5_VALIDATE=GREEN
