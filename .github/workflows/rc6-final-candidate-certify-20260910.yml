name: RC6 Final Candidate Certification 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-final-candidate-certify-20260910.yml

permissions:
  contents: read

concurrency:
  group: rc6-final-candidate-certification-20260910
  cancel-in-progress: false

env:
  TARGET_SHA: f8ae3e310b914a2c55e7c430eeea34dcaa4edd8a

jobs:
  full-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Exact candidate identity and lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
          test -z "$(git status --porcelain)"
          git diff --check
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RELEASE_SAFETY_IDENTITY=GREEN')
          PY

      - name: Compile complete source tree
        run: python -m compileall -q .

      - name: Build exact candidate image
        run: docker build --pull=false -t porota-rc6-final:${TARGET_SHA} .

      - name: Run one active RC6 suite offline and read-only
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-final:${TARGET_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              --ignore=tests/test_hotfix_rc3_hf2.py \
              --ignore=tests/test_hotfix_rc3_hf4.py \
              --ignore=tests/test_hotfix_rc3_hf6.py \
              --ignore=tests/test_intraday_scalping_hf3.py \
              --ignore=tests/test_rc4_acceptance.py \
              --ignore=tests/test_rc4_hf1_last_mile.py \
              --ignore=tests/test_rc4_hf2_consolidation.py'

      - name: Enforce final RC6 authority and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --entrypoint python porota-rc6-final:${TARGET_SHA} - <<'PY'
          from pathlib import Path
          import _version
          import ck_policy_gate_hf6 as policy

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'

          manager = text('porota_mode_manager.py')
          runtime = text('bv_paper_runtime.py')
          dashboard = text('bg_paper_dashboard.py')
          assert '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"' in manager
          assert '"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"' in manager
          assert '"PAPER_MAX_POSITIONS_PER_SECTOR": "2"' in manager
          assert 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in runtime
          assert 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in dashboard

          modes = policy.active_policies()
          assert modes['expectancy'] == 'OBSERVATION_ONLY'
          assert modes['regime'] == 'ALERT_ONLY'
          assert modes['sector_concentration'] == 'BINDING'
          assert modes['sector_limit'] == 2
          print('RC6_FINAL_AUTHORITY_SAFETY=GREEN')
          PY

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC6 final candidate certification'
            echo "- Functional SHA: ${TARGET_SHA}"
            echo '- Exact functional SHA checked out; workflow/documentation commits excluded.'
            echo '- Active RC6 suite ran once with network disabled and root filesystem read-only.'
            echo '- Economics SHADOW; sector concentration BINDING with explicit cap 2.'
            echo '- PRODUCTION_PAPER / SIMULATED / REAL_ORDER_CAPABILITY=BLOCKED enforced.'
            echo '- This workflow performs NO Droplet deployment.'
          } >> "$GITHUB_STEP_SUMMARY"

  immutable-archive:
    needs: full-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact tested candidate before publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          PY

      - name: Login GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish exact tested SHA
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
        run: |
          set -euo pipefail
          REF="$IMAGE:rc6-candidate-${TARGET_SHA}"
          docker build --pull=false \
            --label "porota.commit=${TARGET_SHA}" \
            --label "porota.version=17.0.0-rc6" \
            -t "$REF" .
          docker push "$REF" 2>&1 | tee /tmp/rc6-final-push.log
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/rc6-final-push.log | tail -n 1)"
          if [ -z "$DIGEST" ]; then
            DIGEST="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          case "$DIGEST" in sha256:*) ;; *) echo INVALID_DIGEST; exit 1;; esac
          TREE_SHA="$(git rev-parse "${TARGET_SHA}^{tree}")"
          printf 'version=17.0.0-rc6\ncommit=%s\ntree=%s\nimage=%s\ndigest=%s\nmode=PRODUCTION_PAPER\nexecution=SIMULATED\nreal_order_capability=BLOCKED\n' \
            "$TARGET_SHA" "$TREE_SHA" "$IMAGE" "$DIGEST" > /tmp/rc6-final-manifest.txt
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Re-pull immutable digest and verify identity
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm "${{ steps.publish.outputs.ref }}"
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "porota.version"}}')" = '17.0.0-rc6'
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --entrypoint python "$IMAGE@$DIGEST" - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('GHCR_REPULL_SAFETY=GREEN')
          PY

      - name: Upload immutable manifest
        uses: actions/upload-artifact@v4
        with:
          name: rc6-final-manifest-f8ae3e310b914a2c55e7c430eeea34dcaa4edd8a
          path: /tmp/rc6-final-manifest.txt
          if-no-files-found: error
          retention-days: 30
