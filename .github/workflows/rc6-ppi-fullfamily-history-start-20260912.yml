name: RC6 PPI full-family history start 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-fullfamily-history-start-20260912.yml']

permissions:
  contents: read

jobs:
  audit-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Live analysis and one bounded PPI API batch
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          EXPECTED_SHA='eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a'
          HOST_SHA="$(git rev-parse HEAD)"
          echo "HOST_SHA=$HOST_SHA"
          test "$HOST_SHA" = "$EXPECTED_SHA" || { echo "ABORT=HOST_SHA_MISMATCH"; exit 31; }
          git diff --quiet && git diff --cached --quiet || { echo "ABORT=TRACKED_WORKTREE_DIRTY"; exit 32; }

          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          sudo -n flock -n 9 || { echo "ABORT=INGEST_LOCK_BUSY"; exit 33; }

          for c in porota_production_observer porota_dashboard; do
            running="$(sudo -n docker inspect -f '{{.State.Running}}' "$c")"
            restarts="$(sudo -n docker inspect -f '{{.RestartCount}}' "$c")"
            image="$(sudo -n docker inspect -f '{{.Config.Image}}' "$c")"
            rev="$(sudo -n docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$c" 2>/dev/null || true)"
            echo "CONTAINER=$c|running=$running|restarts=$restarts|image=$image|revision=$rev"
            test "$running" = true || { echo "ABORT=CONTAINER_NOT_RUNNING:$c"; exit 34; }
          done

          for u in porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            state="$(systemctl is-active "$u" 2>/dev/null || true)"
            echo "SERVICE=$u|state=$state"
            test "$state" != active && test "$state" != activating || { echo "ABORT=CONCURRENT_HISTORY_SERVICE:$u"; exit 35; }
          done

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from bf_production_paper_observer import _market_phase
          db=Path('/app/data/paper_v17/observer_v17.db')
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f"SAFETY_BEFORE={s['mode']}|{s['real_orders_sent']}")
          assert s['mode']=='PRODUCTION_PAPER' and int(s['real_orders_sent'] or 0)==0
          phase=_market_phase(); print('MARKET_PHASE='+phase); assert phase=='CLOSED'
          total=c.execute("select count(*) from financial_instrument_catalog where status='AVAILABLE'").fetchone()[0]
          target_ids=c.execute("select count(*) from (select distinct ticker,instrument_type,settlement from financial_instrument_catalog where status='AVAILABLE')").fetchone()[0]
          print(f'CATALOG_AVAILABLE_ROWS={total}')
          print(f'PPI_HISTORY_TARGET_IDENTITIES={target_ids}')
          print('=== CATALOG_BY_FAMILY ===')
          for r in c.execute("select instrument_type,count(*) n,count(distinct ticker) tickers from financial_instrument_catalog where status='AVAILABLE' group by instrument_type order by instrument_type"):
              print(json.dumps(dict(r),sort_keys=True))
          print('=== COMPLETE_PPI_HISTORY_BY_FAMILY ===')
          for r in c.execute("select instrument_type,count(*) identities,sum(row_count) rows,min(date_from) min_from,max(date_to) max_to,max(downloaded_at) last_download from production_history where row_count>0 group by instrument_type order by instrument_type"):
              print(json.dumps(dict(r),sort_keys=True))
          print('=== PPI_ATTEMPTS_BY_FAMILY_STATE ===')
          for r in c.execute("select instrument_type,state,count(*) identities,sum(valid_rows) valid_rows,max(attempted_at) last_attempt from production_history_attempts group by instrument_type,state order by instrument_type,state"):
              print(json.dumps(dict(r),sort_keys=True))
          print('=== API_GAPS_BY_FAMILY ===')
          for r in c.execute("""select f.instrument_type,count(*) gaps from (
                select distinct ticker,instrument_type,settlement from financial_instrument_catalog where status='AVAILABLE'
              ) f left join production_history h on h.symbol=f.ticker and h.instrument_type=f.instrument_type and h.settlement=f.settlement and h.row_count>0
              where h.symbol is null group by f.instrument_type order by f.instrument_type"""):
              print(json.dumps(dict(r),sort_keys=True))
          c.close()
          hdb=Path('/app/data/market_history.db')
          h=sqlite3.connect(f'file:{hdb}?mode=ro',uri=True); h.row_factory=sqlite3.Row; h.execute('pragma query_only=on')
          assert h.execute('pragma quick_check').fetchone()[0]=='ok'
          tabs={r[0] for r in h.execute("select name from sqlite_master where type='table'")}
          print('=== CANONICAL_V2_BY_SOURCE_FAMILY ===')
          if 'history_canonical_v2' in tabs:
              for r in h.execute("select source,instrument_type,count(distinct symbol) symbols,count(*) rows,min(date) first_date,max(date) last_date from history_canonical_v2 group by source,instrument_type order by source,instrument_type"):
                  print(json.dumps(dict(r),sort_keys=True))
          h.close()
          PY

          echo 'INGEST_PHASE=PPI_API_PRIMARY_ONE_BOUNDED_BATCH'
          sudo -n timeout 1200 docker exec -i porota_production_observer python - <<'PY'
          import json
          import bf_production_paper_observer as m
          store=m.runtime_store()

          def all_available_targets(store):
              with store.connect() as c:
                  rows=c.execute("""SELECT f.ticker,f.instrument_type,f.settlement,
                    COALESCE(a.attempted_at,h.downloaded_at) last_try
                    FROM (SELECT DISTINCT ticker,instrument_type,settlement
                          FROM financial_instrument_catalog WHERE status='AVAILABLE') f
                    LEFT JOIN production_history h ON h.symbol=f.ticker
                      AND h.instrument_type=f.instrument_type AND h.settlement=f.settlement
                    LEFT JOIN production_history_attempts a ON a.symbol=f.ticker
                      AND a.instrument_type=f.instrument_type AND a.settlement=f.settlement
                    ORDER BY last_try IS NOT NULL,last_try,f.instrument_type,f.ticker""").fetchall()
              return [(r[0],r[1],r[2]) for r in rows]

          m._historical_targets=all_available_targets
          targets=all_available_targets(store)
          batch=targets[:m.HISTORY_BATCH_LIMIT]
          print('FULL_FAMILY_TARGET_COUNT='+str(len(targets)))
          print('HISTORY_BATCH_LIMIT='+str(m.HISTORY_BATCH_LIMIT))
          fam={}
          for _,kind,_ in batch: fam[kind]=fam.get(kind,0)+1
          print('BATCH_FAMILIES='+json.dumps(fam,sort_keys=True))
          print('BATCH_IDENTITIES='+json.dumps(batch,ensure_ascii=False))
          key,secret=m._secret()
          reader=m.ProductionMarketReader(key,secret,audit=store.audit_http)
          try:
              reader.login_once()
              rows=m._background_ingest(reader,store,force=True)
              print('PPI_API_BATCH_VALID_ROWS='+str(rows))
          finally:
              reader.close()
          PY

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json,sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f"SAFETY_AFTER={s['mode']}|{s['real_orders_sent']}")
          assert s['mode']=='PRODUCTION_PAPER' and int(s['real_orders_sent'] or 0)==0
          src=c.execute("select status,items,detail,last_attempt_at,last_success_at from source_sync where source='PPI_PRODUCTION_HISTORY'").fetchone()
          print('PPI_SOURCE_AFTER='+json.dumps(dict(src) if src else {},sort_keys=True))
          print('=== API_GAPS_AFTER_BY_FAMILY ===')
          for r in c.execute("""select f.instrument_type,count(*) gaps from (
                select distinct ticker,instrument_type,settlement from financial_instrument_catalog where status='AVAILABLE'
              ) f left join production_history h on h.symbol=f.ticker and h.instrument_type=f.instrument_type and h.settlement=f.settlement and h.row_count>0
              where h.symbol is null group by f.instrument_type order by f.instrument_type"""):
              print(json.dumps(dict(r),sort_keys=True))
          c.close()
          print('HOST_MUTATION=HISTORY_DATA_ONLY')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
