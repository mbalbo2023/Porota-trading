name: RC6 Cauciones canonical adapter proof 2026-09-13

on:
  workflow_dispatch:
  push:
    branches: [ops/rc6-ppi-web-residual-ready-20260913]
    paths:
      - 'rc6_caucion_offer_adapter.py'
      - 'tests/test_rc6_caucion_offer_adapter.py'
      - 'rc6_cauciones_contract.py'
      - 'tests/test_rc6_cauciones_contract.py'
      - '.github/workflows/rc6-cauciones-adapter-proof-20260913.yml'

permissions:
  contents: read

jobs:
  adapter-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run canonical adapter fail-closed tests
        run: python -m pytest -q tests/test_rc6_caucion_offer_adapter.py
      - name: Prove adapter has no network/order/database surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('rc6_caucion_offer_adapter.py')
          tree=ast.parse(path.read_text(encoding='utf-8'))
          imports=[]
          calls=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): imports += [a.name for a in node.names]
              elif isinstance(node,ast.ImportFrom): imports.append(node.module or '')
              elif isinstance(node,ast.Call):
                  f=node.func
                  if isinstance(f,ast.Name): calls.append(f.id)
                  elif isinstance(f,ast.Attribute): calls.append(f.attr)
          forbidden_import_fragments=('requests','httpx','urllib','socket','sqlite','ppi_client')
          forbidden_calls={'post','put','patch','delete','send_order','place_order','cancel_order','connect'}
          bad_imports=[x for x in imports if any(t in x.lower() for t in forbidden_import_fragments)]
          bad_calls=sorted(set(calls).intersection(forbidden_calls))
          print('ADAPTER_IMPORTS='+repr(imports))
          print('ADAPTER_FORBIDDEN_IMPORTS='+repr(bad_imports))
          print('ADAPTER_FORBIDDEN_CALLS='+repr(bad_calls))
          assert not bad_imports and not bad_calls
          PY
      - name: Inventory raw book semantic helper call sites
        run: |
          set -euo pipefail
          echo SEMANTIC_HELPER_CALLS_BEGIN
          grep -RIn --include='*.py' 'quote_from_book_level' . | sed -n '1,80p' || true
          echo SEMANTIC_HELPER_CALLS_END
