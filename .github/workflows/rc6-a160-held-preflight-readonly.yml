name: RC6 A160 held host preflight READ ONLY

on:
  push:
    branches: [diagnostic/rc6-a160-held-preflight-ro-20261028]
    paths:
      - .github/workflows/rc6-a160-held-preflight-readonly.yml
      - scripts/rc6_a160_held_preflight_ro.py
      - scripts/rc6_a160_preflight_runner.py
      - tests/test_rc6_a160_held_preflight_ro.py

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  bounded-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Exact candidate/Predeploy run; artifact ID remains blocked until this
      # run finishes GREEN and its digest is inspected before publication.
      RC6_CANDIDATE_SHA: 'b778c8063e96574ddf859907abb99fae6f4e3484'
      RC6_CANDIDATE_TREE: '48ddaa1a55a267f6f0044eb111d88234e103a384'
      RC6_PREDEPLOY_RUN_ID: '40751608804'
      RC6_PREDEPLOY_ARTIFACT_ID: '12844723709'
      RC6_INTERIM_NONPROMOTABLE: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact diagnostic commit and local safety regression
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_rc6_a160_held_preflight_ro.py -q
          test "$RC6_CANDIDATE_SHA" != 0000000000000000000000000000000000000000
          test "$RC6_CANDIDATE_TREE" != 0000000000000000000000000000000000000000
          test "$RC6_PREDEPLOY_RUN_ID" != 0
          test "$RC6_PREDEPLOY_ARTIFACT_ID" != 0
          [[ "$RC6_INTERIM_NONPROMOTABLE" = true || "$RC6_INTERIM_NONPROMOTABLE" = false ]]
          if [ "$RC6_INTERIM_NONPROMOTABLE" = true ]; then
            echo 'RC6_A160_SCOPE=DIAGNOSTIC_NONPROMOTABLE|A165_FIX_PENDING|NO_APPROVAL_NO_DEPLOY'
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC6_CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Bind source and exact frozen Predeploy evidence on runner
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$RC6_CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$RC6_CANDIDATE_TREE"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/rc6_a160_preflight_runner.py \
            "$RC6_CANDIDATE_SHA" "$RC6_CANDIDATE_TREE" \
            "$RC6_PREDEPLOY_RUN_ID" "$RC6_PREDEPLOY_ARTIFACT_ID" \
            "$GITHUB_REPOSITORY" candidate .
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a160_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a160_readonly" "$HOME/.ssh/known_hosts"
      - name: One bounded source-staged preflight on exact Droplet
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          mkdir -p evidence
          timeout --signal=TERM --kill-after=5s 90s \
            ssh -T -i "$HOME/.ssh/rc6_a160_readonly" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 "$DO_USER@$DO_HOST" \
              "sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 - '$RC6_CANDIDATE_SHA' '$RC6_CANDIDATE_TREE' '$RC6_A160_POLICY_B64' '$RC6_A160_DISK_POLICY_B64' '$RC6_A160_REQUIRED_BYTES'" \
              < "$RUNNER_TEMP/rc6-a160/host-stdin.py" | tee evidence/rc6-a160-preflight.jsonl
          test "$(wc -c < evidence/rc6-a160-preflight.jsonl)" -lt 32768
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json,os
          from pathlib import Path
          lines=Path('evidence/rc6-a160-preflight.jsonl').read_text().splitlines()
          assert len(lines)==1 and lines[0].startswith('RC6_A160_HELD_PREFLIGHT_RO=')
          value=json.loads(lines[0].split('=',1)[1])
          assert value['schema']=='rc6.a160.held-preflight-ro.v1'
          assert value['status']=='GREEN' and value['host_mutations']==0
          assert value['droplet']=={'id':'594077619','region':'nyc1'}
          assert value['admission']['flat_three_books'] is True
          assert value['admission']['critical_issues_only_healthy'] is True
          assert value['timers']['a138_a143_chain_exact'] is True
          assert value['timers']['owned_count']==16
          assert value['disk']['bytes_gate'] and value['disk']['inodes_gate']
          scope=('DIAGNOSTIC_NONPROMOTABLE' if
                 os.environ['RC6_INTERIM_NONPROMOTABLE']=='true' else
                 'FINAL_CANDIDATE_PREFLIGHT')
          print('RC6_A160_HOST_PREFLIGHT=GREEN|NO_GO_PAPER_UNCHANGED|'+scope)
          PY
      - name: Publish exact sanitized host receipt to tracking issue
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          path=Path('evidence/rc6-a160-preflight.jsonl')
          receipt='NO_HOST_RECEIPT'
          if path.is_file():
              lines=path.read_text().splitlines()
              if len(lines)==1 and lines[0].startswith('RC6_A160_HELD_PREFLIGHT_RO=') and len(lines[0])<32768:
                  value=json.loads(lines[0].split('=',1)[1])
                  if (value.get('schema')=='rc6.a160.held-preflight-ro.v1' and
                          value.get('candidate_sha')==os.environ['RC6_CANDIDATE_SHA']):
                      receipt=json.dumps(value,sort_keys=True,separators=(',',':'))
          body=(f'RC6 A160 exact read-only preflight for candidate `{os.environ["RC6_CANDIDATE_SHA"]}` '
                f'and Predeploy artifact `{os.environ["RC6_PREDEPLOY_ARTIFACT_ID"]}`.\n\n'
                f'- Run: {os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n'
                f'- Diagnostic SHA: `{os.environ["GITHUB_SHA"]}`\n'
                '- Host receipt (sanitized):\n\n```json\n'+receipt+'\n```')
          request=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/732/comments',
              data=json.dumps({'body':body}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=15) as response:
              assert response.status==201
          print('RC6_A160_RECEIPT_PUBLISHED=YES')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-a160-held-preflight-ro-${{ github.sha }}
          path: evidence/rc6-a160-preflight.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$HOME/.ssh/rc6_a160_readonly"
