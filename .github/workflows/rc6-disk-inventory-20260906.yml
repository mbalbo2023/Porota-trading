name: RC6 disk inventory 2026-09-06

on:
  push:
    branches: [ops/rc6-disk-inventory-20260906]
    paths:
      - '.github/workflows/rc6-disk-inventory-20260906.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_ops"
          chmod 600 "$HOME/.ssh/porota_ops"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only disk inventory
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_ops" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/disk_inventory.txt
          set -euo pipefail
          REPO=/opt/porota-trading
          echo '=== POROTA RC6 DISK INVENTORY READ ONLY ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo "BRANCH=$(git -C "$REPO" branch --show-current)"
          echo "HEAD=$(git -C "$REPO" rev-parse HEAD)"
          echo '--- FILESYSTEM ---'
          df -hT /
          echo '--- INODES ---'
          df -ih /
          echo '--- TOP /opt ---'
          sudo -n du -x -h -d 2 /opt 2>/dev/null | sort -h | tail -n 40 || true
          echo '--- TOP /var ---'
          sudo -n du -x -h -d 2 /var 2>/dev/null | sort -h | tail -n 50 || true
          echo '--- TOP /home ---'
          sudo -n du -x -h -d 2 /home 2>/dev/null | sort -h | tail -n 40 || true
          echo '--- POROTA REPO ---'
          sudo -n du -x -h -d 2 "$REPO" 2>/dev/null | sort -h | tail -n 60 || true
          echo '--- POROTA DATA ---'
          sudo -n du -x -h -d 3 "$REPO/data" 2>/dev/null | sort -h | tail -n 80 || true
          echo '--- GIT UNTRACKED ---'
          git -C "$REPO" ls-files --others --exclude-standard | sed -n '1,200p' || true
          echo '--- DOCKER SYSTEM DF ---'
          sudo -n docker system df -v || true
          echo '--- DOCKER IMAGES ---'
          sudo -n docker images --digests --no-trunc || true
          echo '--- DOCKER CONTAINERS ALL ---'
          sudo -n docker ps -a --no-trunc || true
          echo '--- DOCKER VOLUMES ---'
          sudo -n docker volume ls || true
          echo '--- JOURNAL ---'
          sudo -n journalctl --disk-usage || true
          echo '--- /var/log largest ---'
          sudo -n find /var/log -xdev -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 60 || true
          echo '--- /tmp largest ---'
          sudo -n find /tmp -xdev -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 60 || true
          echo '--- POROTA backup-like files ---'
          sudo -n find /opt /home -xdev \( -iname '*.tar' -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.zip' -o -iname '*.bak' -o -iname '*.old' \) -type f -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -n 120 || true
          echo '--- ACTIVE RUNTIME ---'
          for c in porota_production_observer porota_production_dashboard; do
            sudo -n docker inspect -f "$c={{.State.Running}}|{{.Config.Image}}|{{.Image}}|{{.RestartCount}}" "$c" || true
          done
          echo '--- HEALTH ---'
          curl -fsS http://127.0.0.1:8000/health || true
          echo
          echo '--- DB QUICK CHECK ---'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=20)
              c.execute('PRAGMA query_only=ON')
              print(p, c.execute('PRAGMA quick_check').fetchone()[0])
              c.close()
          PY
          echo '=== END INVENTORY ==='
          HOST
          {
            echo '### RC6 disk inventory — read only'
            echo '```text'
            sed -n '1,1400p' /tmp/disk_inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
