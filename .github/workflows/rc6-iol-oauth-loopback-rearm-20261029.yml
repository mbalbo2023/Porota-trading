name: RC6 IOL OAuth one-time loopback consent (NO DEPLOY)

on:
  push:
    branches:
      - ops/rc6-iol-oauth-consent-loopback-20261029
    paths:
      - .github/workflows/rc6-iol-oauth-loopback-rearm-20261029.yml
      - scripts/rc6_iol_oauth_loopback_rearm.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-iol-oauth-rearm-only
  cancel-in-progress: false

jobs:
  prepare-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate one-shot scope and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'ops/rc6-iol-oauth-consent-loopback-20261029'
          python3 -m py_compile scripts/rc6_iol_oauth_loopback_rearm.py
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          echo 'OAUTH_ONLY=YES|DOCKER_DEPLOY=NO|REAL_ROUTES=NOT_CALLED'

      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_iol_rearm"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_iol_rearm" "$HOME/.ssh/known_hosts"

      - name: Stage root-owned one-time helper (no container changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/rc6_iol_rearm" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            scripts/rc6_iol_oauth_loopback_rearm.py \
            "$DO_USER@$DO_HOST:/tmp/rc6-iol-rearm-${GITHUB_RUN_ID}.py"
          timeout --signal=TERM --kill-after=10s 130s ssh \
            -i "$HOME/.ssh/rc6_iol_rearm" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n install -o root -g root -m 0700 /tmp/rc6-iol-rearm-${GITHUB_RUN_ID}.py /usr/local/sbin/rc6-iol-rearm-${GITHUB_RUN_ID}.py && sudo -n python3 /usr/local/sbin/rc6-iol-rearm-${GITHUB_RUN_ID}.py prepare"

      - name: Cleanup one-time transfer and runner SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f "$HOME/.ssh/rc6_iol_rearm"; then
            ssh -i "$HOME/.ssh/rc6_iol_rearm" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 "$DO_USER@$DO_HOST" \
              "rm -f /tmp/rc6-iol-rearm-${GITHUB_RUN_ID}.py" || true
          fi
          rm -f "$HOME/.ssh/rc6_iol_rearm" "$HOME/.ssh/known_hosts"
