name: RC6 W12 Permission Boundary Hotfix + Fresh Import Proof 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-permission-boundary-hotfix-proof-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w12-hotfix-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assert immutable RC6 PAPER safety identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo RC6_PAPER_SAFETY=GREEN

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Repair secure capture boundary and prove one fresh GET-only import
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          RUNTIME=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          SERVICE=porota-contract-evidence-rc6.service
          CONTAINER=porota_production_observer
          DB="$ROOT/data/paper_v17/observer_v17.db"
          OUTDIR="$ROOT/data/contract_evidence/rc6_trusted"

          echo '=== PRECONDITIONS ==='
          test -f "$RUNTIME"
          sudo -n docker inspect "$CONTAINER" >/dev/null
          ACTIVE="$(sudo -n systemctl is-active "$SERVICE" 2>/dev/null || true)"
          [[ "$ACTIVE" != "activating" && "$ACTIVE" != "active" ]] || { echo W12_ABORT=SERVICE_BUSY; exit 40; }
          OBSERVER_GID="$(sudo -n docker exec "$CONTAINER" id -g)"
          [[ "$OBSERVER_GID" =~ ^[0-9]+$ ]] || { echo W12_ABORT=OBSERVER_GID_INVALID; exit 41; }
          echo OBSERVER_GID="$OBSERVER_GID"

          BASE_COUNT="$(sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True)
          c.execute('pragma query_only=on')
          n=c.execute("select count(*) from contract_evidence_v2_runs").fetchone()[0]
          print(n)
          c.close()
          PY
          )"
          BEFORE="$(sudo -n find "$OUTDIR" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '1p' | cut -d' ' -f2-)"
          echo BASE_RUNS="$BASE_COUNT"
          echo BEFORE_CAPTURE="${BEFORE##*/}"

          echo '=== ATOMIC_BOUNDARY_HOTFIX ==='
          sudo -n python3 - "$RUNTIME" <<'PY'
          import os,sys,tempfile
          from pathlib import Path
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          old='install -o root -g root -m 0600 "$STAGE_CAPTURE" "$CAPTURE"'
          marker='install -o root -g "$OBSERVER_GID" -m 0640 "$STAGE_CAPTURE" "$CAPTURE"'
          if marker in text:
              print('PATCH_STATE=ALREADY_APPLIED')
              raise SystemExit(0)
          if text.count(old) != 1:
              print('PATCH_STATE=UNEXPECTED_SOURCE')
              raise SystemExit(42)
          new='''OBSERVER_GID="$($DOCKER_BIN exec "$CONTAINER" id -g)" || fail_closed OBSERVER_GID_UNAVAILABLE
          [[ "$OBSERVER_GID" =~ ^[0-9]+$ ]] || fail_closed OBSERVER_GID_INVALID
          chown root:"$OBSERVER_GID" "$OUTDIR"
          chmod 0750 "$OUTDIR"
          install -o root -g "$OBSERVER_GID" -m 0640 "$STAGE_CAPTURE" "$CAPTURE"'''
          updated=text.replace(old,new,1)
          fd,tmp=tempfile.mkstemp(prefix=p.name+'.',dir=str(p.parent))
          try:
              with os.fdopen(fd,'w',encoding='utf-8') as f:
                  f.write(updated); f.flush(); os.fsync(f.fileno())
              os.chmod(tmp,0o755)
              os.chown(tmp,0,0)
              os.replace(tmp,p)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print('PATCH_STATE=APPLIED')
          PY
          sudo -n bash -n "$RUNTIME"
          MATCHES="$(sudo -n grep -Fc 'install -o root -g "$OBSERVER_GID" -m 0640 "$STAGE_CAPTURE" "$CAPTURE"' "$RUNTIME")"
          [[ "$MATCHES" == 1 ]] || { echo W12_ABORT=PATCH_ASSERTION_FAILED; exit 43; }
          sudo -n chown root:"$OBSERVER_GID" "$OUTDIR"
          sudo -n chmod 0750 "$OUTDIR"
          echo RUNTIME_PATCH=GREEN
          echo OUTDIR_MODE="$(sudo -n stat -c '%a' "$OUTDIR")"
          echo OUTDIR_GID="$(sudo -n stat -c '%g' "$OUTDIR")"

          echo '=== ONE_SERVICE_RUN ==='
          set +e
          sudo -n systemctl start "$SERVICE"
          START_RC=$?
          set -e
          echo SERVICE_START_RC="$START_RC"
          sudo -n systemctl show "$SERVICE" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          [[ "$START_RC" -eq 0 ]] || { sudo -n journalctl -u "$SERVICE" -n 100 --no-pager; exit "$START_RC"; }

          AFTER="$(sudo -n find "$OUTDIR" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '1p' | cut -d' ' -f2-)"
          [[ -n "$AFTER" && "$AFTER" != "$BEFORE" ]] || { echo W12_PROOF=NO_FRESH_CAPTURE; exit 44; }
          FILE_MODE="$(sudo -n stat -c '%a' "$AFTER")"
          FILE_GID="$(sudo -n stat -c '%g' "$AFTER")"
          echo AFTER_CAPTURE="${AFTER##*/}"
          echo AFTER_MODE="$FILE_MODE"
          echo AFTER_GID="$FILE_GID"
          [[ "$FILE_MODE" == 640 && "$FILE_GID" == "$OBSERVER_GID" ]] || { echo W12_PROOF=BAD_CAPTURE_BOUNDARY; exit 45; }
          [[ "$(sudo -n stat -c '%a' "$OUTDIR")" == 750 && "$(sudo -n stat -c '%g' "$OUTDIR")" == "$OBSERVER_GID" ]] || { echo W12_PROOF=BAD_DIRECTORY_BOUNDARY; exit 46; }

          REL="${AFTER#$ROOT/data/}"
          CONTAINER_PATH="/app/data/$REL"
          sudo -n docker exec "$CONTAINER" python -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); b=p.read_bytes(); print("IMPORTER_USER_READ=YES"); print("CAPTURE_BYTES="+str(len(b)))' "$CONTAINER_PATH"

          echo '=== CAPTURE_SAFETY ==='
          sudo -n python3 - "$AFTER" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('schema')=='POROTA_RC6_PPI_TRUSTED_CONTRACT_V1', d.get('schema')
          assert d.get('auth_status')=='AUTHENTICATED_TRUSTED_DEVICE', d.get('auth_status')
          assert int(d.get('real_orders_sent') or 0)==0
          routes=d.get('routes') or []
          jobs=d.get('jobs') or []
          assert len(routes)>0 and len(jobs)>0
          print('CAPTURE_SCHEMA=GREEN')
          print('AUTH_STATUS=AUTHENTICATED_TRUSTED_DEVICE')
          print('ROUTES_COUNT='+str(len(routes)))
          print('JOBS_COUNT='+str(len(jobs)))
          print('REAL_ORDERS_SENT=0')
          PY

          echo '=== POST_IMPORT_DB_PROOF ==='
          sudo -n python3 - "$DB" "$BASE_COUNT" <<'PY'
          import sqlite3,sys
          db,baseline=sys.argv[1],int(sys.argv[2])
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True)
          c.execute('pragma query_only=on')
          qc=c.execute('pragma quick_check').fetchone()[0]
          count=c.execute('select count(*) from contract_evidence_v2_runs').fetchone()[0]
          cols=[r[1] for r in c.execute('pragma table_info(contract_evidence_v2_runs)')]
          running=0
          for col in ('status','state'):
              if col in cols:
                  running=c.execute(f"select count(*) from contract_evidence_v2_runs where upper(coalesce({col},''))='RUNNING'").fetchone()[0]
                  break
          row=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print('DB_QUICK_CHECK='+str(qc))
          print('POST_RUNS='+str(count))
          print('RUN_DELTA='+str(count-baseline))
          print('RUNNING_ROWS='+str(running))
          print('MODE='+str(row[0] if row else None))
          print('REAL_ORDERS_SENT='+str(row[1] if row else None))
          assert qc=='ok'
          assert count>baseline, (baseline,count)
          assert running==0
          assert row and row[0]=='PRODUCTION_PAPER'
          assert int(row[1] or 0)==0
          PY

          echo W12_PERMISSION_BOUNDARY=GREEN
          echo W12_FRESH_CAPTURE=GREEN
          echo W12_IMPORT=GREEN
          echo ORDER_ROUTES=NOT_CALLED
          HOST
