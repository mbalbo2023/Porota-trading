name: RC6 A670 manual-only BYMA PPI Current Book bounded READ_ONLY

# Explicit manual-only workflow. Four historical scheduled triggers were removed
# by operator decision; A669 filename is retained to reuse the audited guard,
# without creating another workflow or background provider traffic. Every ART
# slot/calendar/engine gate runs BEFORE SSH, PPI SDK or shared budget access.
# Local two-GET pilot never asserts a signed PPI provider quota.
on:
  workflow_dispatch:
    inputs:
      issuer_mode:
        description: 'Only command to ALREADY logged-in PAPER scanner; OPEN batch or POSTCLOSE, no second PPI client'
        type: choice
        required: true
        default: observer_postclose_command
        options: [observer_postclose_command, observer_open_ten_family_command]
      art_date:
        description: 'Observer command only: same-day YYYY-MM-DD in ART; OPEN 10:30-17:00 or POSTCLOSE 17:00-23:00'
        type: string
        required: false
      family:
        description: 'Observer command only: one PPI-primary contract family'
        type: choice
        required: true
        default: BONOS
        options: [ACCIONES, CEDEARS, ETFS, BONOS, LETRAS, OBLIGACIONES, OPCIONES, FUTUROS, CAUCIONES, FCI, ALL]
      slot:
        description: 'Manual same-day audited BYMA ART slot (within 60 min)'
        type: choice
        required: true
        options: ['1045', '1120', '1430', '1630']
      pilot_mode:
        description: 'OFF by default. ONCE permits at most 1 Current + 1 Book with zero PAPER positions; evidence only.'
        type: choice
        required: true
        default: 'off'
        options: ['off', 'once']
      postclose_mode:
        description: 'OFF by default. ONCE only with pilot once: stale native clocks are diagnostic, NEVER PAPER readiness.'
        type: choice
        required: true
        default: 'off'
        options: ['off', 'once']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-a669-ppi-current-book-20261105.yml'
      - 'scripts/rc6_a630_host_ppi_current_book.py'
      - 'scripts/rc6_a669_ppi_day_slot_guard.py'
      - 'tests/test_rc6_a630_host_ppi_current_book.py'
      - 'tests/test_rc6_a669_ppi_day_slot_guard.py'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable product 2026 BYMA holiday/spot calendar for OFFHOST regressions
        uses: actions/checkout@v4
        with:
          ref: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
          path: _audited_product_calendar
          sparse-checkout: |
            ak_byma_calendar.py
            co_market_sessions_hf6.py
          persist-credentials: false
      - name: Checkout immutable candidate scanner OPEN handler for cross-SHA wire contract
        uses: actions/checkout@v4
        with:
          ref: 7ae679e3c6bc958de3513e7a818c8c9063c10c5a
          path: _audited_open_product_handler
          sparse-checkout: |
            bf_production_paper_observer.py
          persist-credentials: false
      - name: Verify product OPEN V1 reporter keys against issuer without executing scanner
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import ast,hashlib
          from pathlib import Path
          from scripts.rc6_a630_host_ppi_current_book import OPEN_FAMILIES,_open_summary
          source=Path('_audited_open_product_handler/bf_production_paper_observer.py')
          raw=source.read_bytes()
          git_blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert git_blob=='607d889c22f8fd501a2117460a9d00700bfb858e'
          module=ast.parse(raw)
          routine=next(n for n in module.body if isinstance(n,ast.FunctionDef)
                       and n.name=='_run_ppi_open_command')
          report=next(n.value for n in ast.walk(routine) if isinstance(n,ast.Assign)
                      and any(isinstance(t,ast.Name) and t.id=='report' for t in n.targets))
          assert isinstance(report,ast.Dict)
          keys={k.value for k in report.keys if isinstance(k,ast.Constant)}
          assert keys=={'schema','day','paper_ready','order_authority',
                        'readiness_reason','unattempted_reason','statuses',
                        'coverage','unverified','catalog_scope','outside_ppi_scope'}
          literals={k.value:v.value for k,v in zip(report.keys,report.values)
                    if isinstance(k,ast.Constant) and isinstance(v,ast.Constant)}
          assert literals['schema']=='RC6_PPI_OPEN_TEN_FAMILY_V1'
          assert literals['readiness_reason']=='FULL_READINESS_NOT_EVIDENCED'
          assert literals['unattempted_reason']=='BOUNDED'
          assert literals['paper_ready'] is False and literals['order_authority'] is False
          assert b'PPI_DIRECT_REST_NATIVE_WIRE_WITNESS' in raw and b'identity5=' in raw
          sample={'schema':'RC6_PPI_OPEN_TEN_FAMILY_V1','day':'2026-11-19',
                  'paper_ready':False,'order_authority':False,
                  'readiness_reason':'FULL_READINESS_NOT_EVIDENCED',
                  'unattempted_reason':'BOUNDED','catalog_scope':'PPI_CLAIMED_ONLY',
                  'outside_ppi_scope':12,
                  'statuses':{f:'CATALOG_IDENTITY_UNAVAILABLE' for f in OPEN_FAMILIES},
                  'coverage':{f:dict(enumerated_exact=0,attempted=0,
                                     native_pair_qa_pass=0,ready=0,hold=0,unattempted=0)
                              for f in OPEN_FAMILIES},
                  'unverified':{f:0 for f in OPEN_FAMILIES}}
          import json
          assert _open_summary(json.dumps(sample,separators=(',',':')),
                               '2026-11-19')==sample
          print('RC6_OPEN_CROSS_SHA_SCHEMA=PASS|PRODUCT_SHA=7ae679e3|BLOB=607d889c|NO_PPI_ACTOR')
          PY
      - name: Pure OFFHOST evergreen session, day-slot and audited-engine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_a669_ppi_day_slot_guard.py \
            scripts/rc6_a630_host_ppi_current_book.py \
            tests/test_rc6_a669_ppi_day_slot_guard.py
          python3 -m unittest discover -s tests -p test_rc6_a669_ppi_day_slot_guard.py -v
          python3 -m unittest discover -s tests -p test_rc6_a630_host_ppi_current_book.py -v
          python3 -B - <<'PY'
          from datetime import datetime,timezone
          from scripts.rc6_a669_ppi_day_slot_guard import (
              PRODUCT_CALENDAR_ROOT,_verified_product_checkout,_official_session_check)
          assert _verified_product_checkout(PRODUCT_CALENDAR_ROOT)
          for day,expected in ((5,True),(6,True),(9,False),(10,False),(11,True)):
              at=datetime(2026,11,day,13,45,tzinfo=timezone.utc)
              open_,reason=_official_session_check(at,PRODUCT_CALENDAR_ROOT)
              assert open_ is expected,(day,reason)
              if day==6: assert reason=='BYMA_LIMITED_TRADING_NO_SETTLEMENT_OBSERVE_ONLY'
              if day in (9,10): assert reason=='BYMA_NO_NEGOTIATION_OR_SPECIAL_SESSION_HOLD'
          print('A670_PINNED_CALENDAR=PASS|NOV5_REGULAR|NOV6_LIMITED_NO_SETTLEMENT_EVIDENCE_ONLY|NOV9_10_NO_NEGOTIATION')
          PY
          git diff --check

  sample_main_only:
    needs: contracts
    # Historical artifact/regression evidence retained, but this mode would
    # create a SECOND ProductionMarketReader/login; never start it by Actions.
    # A reviewed future redesign is required before changing this hard HOLD.
    if: false
    # A diagnostic must never race the single governed Deploy V2.
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      RC6_A669_MANUAL_SLOT: ${{ inputs.slot }}
      RC6_A630_PILOT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_mode == 'once' && 'ONCE' || 'OFF' }}
      RC6_A630_POSTCLOSE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.postclose_mode == 'once' && 'ONCE' || 'OFF' }}
      # Exact active deployed candidate; independent of the audited calendar.
      RC6_EXPECTED_CANDIDATE_SHA: b3cbe57a5b4b82016a65a0e253b251abbb84a04c
      RC6_EXPECTED_TREE_SHA: 7370fea6c9c6daa802fcdd8ce6fc20c5cf8e31b0
      RC6_EXPECTED_IMAGE_ID: sha256:62c649ac94c586f488c516f53a030b75529edd7529425254ff33b2a70bc4008d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout product-pinned OFFHOST audited BYMA calendar; never moving ref
        uses: actions/checkout@v4
        with:
          ref: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
          path: _audited_product_calendar
          sparse-checkout: |
            ak_byma_calendar.py
            co_market_sessions_hf6.py
          persist-credentials: false

      - name: Evergreen ART weekday, BYMA audited holiday, source and engine pins BEFORE SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/rc6_a669_ppi_day_slot_guard.py
          echo 'A670_PROVIDER_GETS_BY_CALENDAR_GATE=0'

      - name: Private RO host preflight; PPI native five-key request selection; ZERO GET
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a669_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a669_readonly" "$HOME/.ssh/known_hosts"
          remote="sudo -n timeout 20 unshare --mount --propagation private -- /bin/sh -eu -c 'mount --bind /opt/porota-trading/data /opt/porota-trading/data && mount -o remount,bind,ro /opt/porota-trading/data && exec python3 -B - host-preflight $RC6_A669_SLOT'"
          mkdir -p evidence
          set +e
          timeout 40 ssh -i "$HOME/.ssh/rc6_a669_readonly" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=9 \
            "$DO_USER@$DO_HOST" "$remote" \
            < scripts/rc6_a630_host_ppi_current_book.py \
            > "$RUNNER_TEMP/rc6-a669-host.private" 2>/dev/null
          rc=$?
          set -e
          export RC6_A669_HOST_RC="$rc"
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          from scripts.rc6_a630_host_ppi_current_book import SCHEMA,REASONS,target_for_slot
          rawfile=Path(os.environ['RUNNER_TEMP'])/'rc6-a669-host.private'
          raw=rawfile.read_bytes() if rawfile.is_file() and rawfile.stat().st_size<=8192 else b''
          safe={'schema':'rc6.a669.host-preflight.sanitized.v1',
                'engine_schema':SCHEMA,'state':'NO_VERIFICADO',
                'reason':'HOST_PREFLIGHT_OR_RUNTIME_HOLD','ppi_gets':0,
                'provider_raw_five_key_attested':False,'source_pit_verified':False,
                'runtime_sha_verified':False,'paper_db_identity_verified':False}
          doc={}
          try:
              doc=json.loads(raw)
              target=target_for_slot(os.environ['RC6_A669_SLOT'])
              assert os.environ['RC6_A669_HOST_RC']=='0'
              assert isinstance(doc,dict) and set(doc)=={'schema','phase','state','reason',
                  'ppi_gets','target','db_opened','sqlite_ro_mount_protected',
                  'paper_db_identity_verified','ppi_primary_5key_unique',
                  'orders_sent','source_pit_verified'}
              assert doc['schema']==SCHEMA and doc['phase']=='HOST_PREFLIGHT'
              assert doc['state']=='IDENTITY_ONLY_NO_GET'
              assert doc['reason']=='PPI_PRIMARY_FIVE_KEY_UNIQUE'
              assert doc['target']==list(target) and doc['ppi_gets']==doc['orders_sent']==0
              assert doc['db_opened'] is doc['sqlite_ro_mount_protected'] is True
              assert doc['paper_db_identity_verified'] is doc['ppi_primary_5key_unique'] is True
              assert doc['source_pit_verified'] is False
          except (ValueError,AssertionError,TypeError,KeyError):
              if isinstance(doc,dict) and doc.get('schema')==SCHEMA and doc.get('reason') in REASONS:
                  safe['reason']=doc['reason']
              Path('evidence/a669_host_preflight.json').write_text(
                  json.dumps(safe,sort_keys=True)+'\n',encoding='utf-8')
              raise SystemExit('A669_HOST_READONLY_PREFLIGHT_HOLD_ZERO_GET')
          safe.update(state='IDENTITY_ONLY_NO_GET',reason='PPI_PRIMARY_FIVE_KEY_UNIQUE',
                      paper_db_identity_verified=True)
          Path('evidence/a669_host_preflight.json').write_text(
              json.dumps(safe,sort_keys=True)+'\n',encoding='utf-8')
          target_b64=base64.b64encode(json.dumps(list(target),separators=(',',':')).encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write('RC6_A630_TARGET_B64='+target_b64+'\n')
          print('A669_HOST_RO_IDENTITY=UNIQUE_REQUEST|NATIVE_5KEY_ATTESTED=NO|GETS=0')
          PY

      - name: At most one Current then one Book via exact rootless CID and shared budget
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          # Source was blob-pinned by A669 BEFORE SSH. Keep the SAME source in
          # memory on host; it attests the private rootless release/daemon/CID
          # and streams bytes through docker exec -i. No remote file, rootful
          # daemon, sudo docker, alias lookup or raw Docker JSON in artifacts.
          pilot_arg=""
          if [[ "$RC6_A630_PILOT_MODE" == "ONCE" ]]; then
            # Literal allowlisted suffix only; all invocations are manual.
            # RC6_A630_LOCAL_PILOT is scoped to this one docker-exec child.
            [[ "$RC6_A669_SLOT" =~ ^(1045|1120|1430|1630)$ ]]
            [[ "$RC6_A670_ART_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            pilot_arg=" 'ONCE' '$RC6_A669_SLOT' '$RC6_A670_ART_DATE'"
          fi
          if [[ "$RC6_A630_POSTCLOSE_MODE" == "ONCE" ]]; then
            # Calendar, exact engine blob and manual/PAPER pilot were already
            # attested before SSH. No scheduled postclose mode is available.
            [[ "$RC6_A630_PILOT_MODE" == "ONCE" ]]
            [[ "$RC6_A670_POSTCLOSE" == "ONCE" ]]
            [[ "$RC6_A670_MARKET_SESSION" == "BYMA_CLOSED_POSTCLOSE_DIAGNOSTIC_ONLY" ]]
            pilot_arg="$pilot_arg 'POSTCLOSE'"
          fi
          remote="python3 -B -c 'import sys; src=sys.stdin.buffer.read(1000001); assert 0<len(src)<=1000000; scope={\"__name__\":\"__main__\",\"__RC6_SOURCE_BYTES__\":src}; exec(compile(src,\"A630_STDIN\",\"exec\"),scope)' rootless-capture '$RC6_A630_TARGET_B64' '$RC6_EXPECTED_CANDIDATE_SHA' '$RC6_EXPECTED_TREE_SHA' '$RC6_EXPECTED_IMAGE_ID'$pilot_arg"
          set +e
          timeout --signal=TERM --kill-after=5s 100 ssh \
            -i "$HOME/.ssh/rc6_a669_readonly" -o BatchMode=yes \
            -o ConnectTimeout=8 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "$remote" \
            < scripts/rc6_a630_host_ppi_current_book.py \
            > "$RUNNER_TEMP/rc6-a669-capture.private" 2>/dev/null
          rc=$?
          set -e
          export RC6_A669_PROVIDER_RC="$rc"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.rc6_a385_ten_family_snapshot_readonly import FAMILIES
          from scripts.rc6_a630_host_ppi_current_book import (
              SCHEMA,decode_target,verify_receipt,verified_rootless_wrapper,
              unverified_transport_receipt)
          rawfile=Path(os.environ['RUNNER_TEMP'])/'rc6-a669-capture.private'
          raw=rawfile.read_bytes() if rawfile.is_file() and rawfile.stat().st_size<=65536 else b''
          try:
              target=decode_target(os.environ['RC6_A630_TARGET_B64'])
              wrapper=verified_rootless_wrapper(raw,target) or {}
              payload=wrapper.get('receipt',unverified_transport_receipt())
              if wrapper.get('state')=='EVIDENCE_ONLY_NO_GO':
                  assert verify_receipt(payload,target)
          except (AssertionError,KeyError,TypeError,ValueError):
              payload=unverified_transport_receipt()
              wrapper={}
          public={'schema':'rc6.a669.action.sanitized.v1',
                  'engine_schema':SCHEMA,'run_id':os.environ['GITHUB_RUN_ID'],
                  'control_plane_sha':os.environ['GITHUB_SHA'],
                  'engine_git_blob':os.environ['RC6_A669_ENGINE_BLOB'],
                  'candidate_sha':os.environ['RC6_EXPECTED_CANDIDATE_SHA'],
                  'candidate_tree':os.environ['RC6_EXPECTED_TREE_SHA'],
                  'image_id':os.environ['RC6_EXPECTED_IMAGE_ID'],
                  'art_date':os.environ['RC6_A670_ART_DATE'],'slot':os.environ['RC6_A669_SLOT'],
                  'market_calendar_gate':os.environ['RC6_A670_MARKET_SESSION'],
                  'provider_get_lease_gate':('A630_LOCAL_PILOT_UNCERTIFIED' if
                      os.environ.get('RC6_A630_PILOT_MODE')=='ONCE'
                      else 'A630_EXISTING_RUNTIME_BUDGET'),
                  'settlement_verified':False,'paper_entry_allowed':False,
                  'receipt':payload,'ppi_watch_mutations_by_action':0,
                  'real_orders_sent_by_action':0,'predeploy_dispatches':0,
                  'deploy_dispatches':0,'provider_payload_uploaded':False,
                  'provider_signature_verified':False,'source_pit_verified':False,
                  'paper_admission_certified':False,
                  'runtime_sha_verified':wrapper.get('runtime_pin_verified') is True,
                  'runtime_backend':'ROOTLESS_SPLIT',
                  'rootless_or_ppi_hold_reason':wrapper.get('reason','NO_VERIFICADO'),
                  'shared_budget_lease_writes_possible':True,
                  'budget_sidecar_bootstrap_writes_possible':os.environ.get('RC6_A630_PILOT_MODE')=='ONCE'}
          # Exactly one selected five-key was independently host-proved. The
          # other nine canonical families are NOT silently simulated as native
          # PPI receipts: local one-shot authorizes only 2 GET total (not a
          # global provider quota claim). FCI Book is not an attested NAV path.
          # PPI_NATIVE_STALE_POSTCLOSE_DIAGNOSTIC_NO_GO is never READY.
          selected=payload.get('target') if isinstance(payload,dict) else None
          family=selected[1] if isinstance(selected,list) and len(selected)==5 else ''
          public['sample_families']=[{
              'family':name,
              'state':payload['state'] if name==family else 'BLOQUEADO',
              'reason':payload['reason'] if name==family else (
                  'FCI_NAV_BOOK_APPLICABILITY_NOT_ATTESTED' if name=='FCI'
                  else 'FIVE_KEY_NOT_SELECTED_OR_NO_BOUNDED_LEASE'),
              'current_gets':payload.get('current_gets') if name==family else 0,
              'book_gets':payload.get('book_gets') if name==family else 0,
              'source_pit_verified':False,'instrument_ready':False,
          } for name in FAMILIES]
          Path('evidence/a669_ppi_current_book.json').write_text(
              json.dumps(public,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print('A669_CURRENT_BOOK='+payload['state']+
                '|current='+str(payload.get('current_gets'))+
                '|book='+str(payload.get('book_gets'))+
                '|PIT=NO_VERIFICADO|real_orders=0')
          if payload['state']!='EVIDENCE_ONLY_NO_GO' or os.environ['RC6_A669_PROVIDER_RC']!='0':
              raise SystemExit(2)
          PY

      - name: Always retain bounded unverified receipt on a skipped/failed capture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          if ! test -s evidence/a669_ppi_current_book.json; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.rc6_a385_ten_family_snapshot_readonly import FAMILIES
          from scripts.rc6_a630_host_ppi_current_book import SCHEMA,unverified_transport_receipt
          doc={'schema':'rc6.a669.action.sanitized.v1',
               'engine_schema':SCHEMA,'run_id':os.environ['GITHUB_RUN_ID'],
               'control_plane_sha':os.environ['GITHUB_SHA'],
               'art_date':os.environ.get('RC6_A670_ART_DATE',''),
               'slot':os.environ.get('RC6_A669_SLOT',''),
               'market_calendar_gate':os.environ.get('RC6_A670_HOLD_REASON','NO_VERIFICADO'),
               'provider_get_lease_gate':('A630_LOCAL_PILOT_UNCERTIFIED' if
                   os.environ.get('RC6_A630_PILOT_MODE')=='ONCE'
                   else 'A630_EXISTING_RUNTIME_BUDGET'),
               'settlement_verified':False,'paper_entry_allowed':False,
               'receipt':unverified_transport_receipt(
                   'SLOT_OR_DAY_HOLD' if not os.environ.get('RC6_A669_SLOT')
                   else 'HOST_PREFLIGHT_OR_RUNTIME_HOLD'),
               'provider_payload_uploaded':False,'provider_signature_verified':False,
               'source_pit_verified':False,'paper_admission_certified':False,
               'runtime_sha_verified':False,'ppi_watch_mutations_by_action':0,
               'real_orders_sent_by_action':0,'predeploy_dispatches':0,
               'deploy_dispatches':0}
          doc['sample_families']=[{
              'family':name,'state':'BLOQUEADO',
              'reason':'FCI_NAV_BOOK_APPLICABILITY_NOT_ATTESTED' if name=='FCI'
                       else 'NO_HOST_OR_CALENDAR_GATE',
              'current_gets':0,'book_gets':0,
              'source_pit_verified':False,'instrument_ready':False,
          } for name in FAMILIES]
          Path('evidence/a669_ppi_current_book.json').write_text(
              json.dumps(doc,sort_keys=True)+'\n',encoding='utf-8')
          PY
          fi

      - name: Upload sanitized per-run result; no raw quote, token, or account content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a669-ppi-current-book-${{ github.run_id }}
          path: |
            evidence/a669_ppi_current_book.json
            evidence/a669_host_preflight.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove only runner temporary SSH credentials and raw stdio
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/rc6_a669_readonly" \
            "$RUNNER_TEMP/rc6-a669-host.private" \
            "$RUNNER_TEMP/rc6-a669-capture.private"

  queue_observer_main_only:
    needs: contracts
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.issuer_mode == 'observer_postclose_command' ||
       inputs.issuer_mode == 'observer_open_ten_family_command') &&
      github.actor == 'mbalbo2023' &&
      github.triggering_actor == 'mbalbo2023'
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      RC6_A670_ISSUER_MODE: ${{ inputs.issuer_mode }}
      RC6_A670_OBSERVER_ART_DATE: ${{ inputs.art_date }}
      RC6_A670_OBSERVER_FAMILY: ${{ inputs.family }}
      RC6_A630_PILOT_MODE: ${{ inputs.pilot_mode == 'once' && 'ONCE' || 'OFF' }}
      RC6_A630_POSTCLOSE_MODE: ${{ inputs.postclose_mode == 'once' && 'ONCE' || 'OFF' }}
      # P0 single-session observer command MUST remain NO_GO until the one
      # approved tested artifact is promoted and its coordinates are pinned.
      # Historical A670 96c626dc image never contains the new command handler.
      RC6_P0_EXPECTED_CANDIDATE_SHA: b3cbe57a5b4b82016a65a0e253b251abbb84a04c
      RC6_P0_EXPECTED_TREE_SHA: 7370fea6c9c6daa802fcdd8ce6fc20c5cf8e31b0
      RC6_P0_EXPECTED_IMAGE_ID: sha256:62c649ac94c586f488c516f53a030b75529edd7529425254ff33b2a70bc4008d
      RC6_P0_EXPECTED_RELEASE_MANIFEST_SHA256: 991eebea372810b7d6ea0fbb9c9295c7504d187d840e30af4c5e70f99845e792
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact audited BYMA postclose calendar
        uses: actions/checkout@v4
        with:
          ref: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
          path: _audited_product_calendar
          sparse-checkout: |
            ak_byma_calendar.py
            co_market_sessions_hf6.py
          persist-credentials: false
      - name: OFFHOST same-day ART, family, calendar, source and release pins before SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/rc6_a669_ppi_day_slot_guard.py
          echo 'RC6_P0_QUEUE_PROVIDER_CLIENT_OR_LOGIN_BY_ACTION=0'
      - name: Strict private rootless SSH, command-only child and bounded receipt
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          case "$RC6_A670_ISSUER_MODE" in
            observer_postclose_command)
              [[ "$RC6_A670_OBSERVER_COMMAND" == "PPI_DIRECT_REST_POSTCLOSE_ONCE:$RC6_A670_ART_DATE:$RC6_A670_FAMILY" ]]
              command_mode=rootless-enqueue ;;
            observer_open_ten_family_command)
              [[ "$RC6_A670_OBSERVER_COMMAND" == "PPI_DIRECT_REST_OPEN_ONCE:$RC6_A670_ART_DATE:ALL" ]]
              [[ "$RC6_A670_FAMILY" == ALL ]]
              [[ "$RC6_A670_MARKET_SESSION" == BYMA_AUDITED_OPEN ]]
              command_mode=rootless-enqueue-open ;;
            *) exit 2 ;;
          esac
          [[ "$RC6_A670_ART_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$RC6_A670_FAMILY" =~ ^[A-Z]{2,16}$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_p0_queue"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_p0_queue" "$HOME/.ssh/known_hosts"
          # The old rootless-capture/SDK path is NEVER selected by this job.
          # Exact UID-private release/daemon/CID/manifest is attested both sides
          # of one docker exec; child imports sqlite3, not a PPI client.
          remote="python3 -B -c 'import sys; src=sys.stdin.buffer.read(1000001); assert 0<len(src)<=1000000; scope={\"__name__\":\"__main__\",\"__RC6_SOURCE_BYTES__\":src}; exec(compile(src,\"A630_STDIN\",\"exec\"),scope)' '$command_mode' '$RC6_A670_ART_DATE' '$RC6_A670_FAMILY' '$RC6_P0_EXPECTED_CANDIDATE_SHA' '$RC6_P0_EXPECTED_TREE_SHA' '$RC6_P0_EXPECTED_IMAGE_ID' '$RC6_P0_EXPECTED_RELEASE_MANIFEST_SHA256'"
          set +e
          timeout --signal=TERM --kill-after=5s 135 ssh \
            -i "$HOME/.ssh/rc6_p0_queue" -o BatchMode=yes \
            -o ConnectTimeout=8 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "$remote" < scripts/rc6_a630_host_ppi_current_book.py \
            > "$RUNNER_TEMP/rc6-p0-command.private" 2>/dev/null
          rc=$?
          set -e
          export RC6_P0_COMMAND_SSH_RC="$rc"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.rc6_a630_host_ppi_current_book import verified_command_wrapper
          day=os.environ['RC6_A670_ART_DATE']
          family=os.environ['RC6_A670_FAMILY']
          source=Path(os.environ['RUNNER_TEMP'])/'rc6-p0-command.private'
          raw=source.read_bytes() if source.is_file() and source.stat().st_size<=8192 else b''
          open_mode=os.environ['RC6_A670_ISSUER_MODE']=='observer_open_ten_family_command'
          wrapper=verified_command_wrapper(raw,day,family,open_batch=open_mode)
          public={'schema':'rc6.p0.action.sanitized.v1',
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'control_sha':os.environ['GITHUB_SHA'],
                  'candidate_sha':os.environ['RC6_P0_EXPECTED_CANDIDATE_SHA'],
                  'candidate_tree':os.environ['RC6_P0_EXPECTED_TREE_SHA'],
                  'image_id':os.environ['RC6_P0_EXPECTED_IMAGE_ID'],
                  'release_manifest_sha256':os.environ['RC6_P0_EXPECTED_RELEASE_MANIFEST_SHA256'],
                  'art_date':day,'family':family,
                  'issuer_mode':os.environ['RC6_A670_ISSUER_MODE'],
                  'state':wrapper['state'] if wrapper else 'NO_VERIFICADO',
                  'reason':wrapper['reason'] if wrapper else 'ROOTLESS_EXEC_RECEIPT_HOLD',
                  'runtime_pin_verified':wrapper['runtime_pin_verified'] if wrapper else False,
                  'command_id':wrapper['receipt']['command_id'] if wrapper else None,
                  'observer_command_status':wrapper['receipt']['command_status'] if wrapper else None,
                  'provider_status':wrapper['receipt']['provider_status'] if wrapper else None,
                  'db_rows_inserted':wrapper['receipt']['db_rows_inserted'] if wrapper else None,
                  'ppi_client_or_login_by_action':False,
                  'global_ppi_single_session_verified':False,
                  'real_orders_sent_by_action':0,
                  'paper_ready':False,'order_authority':False,
                  'ten_family_qa':(wrapper['receipt'].get('summary')
                                   if wrapper and open_mode else None),
                  'ppi_watch_mutations_by_action':0,
                  'provider_payload_uploaded':False}
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/p0_observer_command.json').write_text(
              json.dumps(public,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print('RC6_P0_COMMAND='+public['state']+'|REASON='+public['reason']+
                '|PAPER_READY=NO|SECOND_CLIENT=NO')
          if not wrapper or wrapper['state']!='EVIDENCE' or os.environ['RC6_P0_COMMAND_SSH_RC']!='0':
              raise SystemExit(2)
          PY
      - name: Always retain sanitized NO_VERIFICADO on hold or transport loss
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          if ! test -s evidence/p0_observer_command.json; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc={'schema':'rc6.p0.action.sanitized.v1',
               'run_id':os.environ['GITHUB_RUN_ID'],'control_sha':os.environ['GITHUB_SHA'],
               'candidate_sha':os.environ.get('RC6_P0_EXPECTED_CANDIDATE_SHA'),
               'candidate_tree':os.environ.get('RC6_P0_EXPECTED_TREE_SHA'),
               'image_id':os.environ.get('RC6_P0_EXPECTED_IMAGE_ID'),
               'release_manifest_sha256':os.environ.get('RC6_P0_EXPECTED_RELEASE_MANIFEST_SHA256'),
               'art_date':'','family':'',
               'state':'NO_VERIFICADO',
               'reason':os.environ.get('RC6_A670_HOLD_REASON','OFFHOST_OR_RUNTIME_HOLD'),
               'runtime_pin_verified':False,'command_id':None,
               'observer_command_status':None,'provider_status':None,
               'db_rows_inserted':None,'ppi_client_or_login_by_action':False,
               'global_ppi_single_session_verified':False,
               'real_orders_sent_by_action':0,'paper_ready':False,'order_authority':False,
               'ppi_watch_mutations_by_action':0,'provider_payload_uploaded':False}
          Path('evidence/p0_observer_command.json').write_text(
              json.dumps(doc,sort_keys=True)+'\n',encoding='utf-8')
          PY
          fi
      - name: Upload bounded P0 command receipt; no raw provider or SQLite result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-p0-observer-command-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/p0_observer_command.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove only runner SSH key and private transport stdout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/rc6_p0_queue" "$RUNNER_TEMP/rc6-p0-command.private"
