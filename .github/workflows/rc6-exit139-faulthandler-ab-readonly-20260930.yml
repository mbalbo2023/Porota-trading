name: RC6 Exit139 Faulthandler AB Read-Only 2026-09-30
on:
  push:
    branches: [audit/ws-deploy-rca-post-immediate-readonly-20260930]
    paths: ['.github/workflows/rc6-exit139-faulthandler-ab-readonly-20260930.yml']
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Copy candidate observer only
        run: |
          set -Eeuo pipefail
          git fetch --depth=1 origin fix/ws-runtime-sqlite-contention-20260930
          git show FETCH_HEAD:bf_production_paper_observer.py > /tmp/bf_candidate_no_repeat.py
          grep -Fq 'faulthandler.dump_traceback_later(45, repeat=False)' /tmp/bf_candidate_no_repeat.py
          ! grep -Fq 'dump_traceback_later(45, repeat=True)' /tmp/bf_candidate_no_repeat.py
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/bf_candidate_no_repeat.py "$DO_USER@$DO_HOST:/tmp/bf_candidate_no_repeat.py"
      - name: Compare baseline import watchdog with candidate overlay
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          IMAGE=porota-trading-bot:17.0.0-rc6
          DATA=/opt/porota-trading/data
          run_probe() {
            label="$1"; mount_arg="$2"
            echo "RCA_AB_${label}_BEGIN"
            set +e
            OUT="$(sudo -n timeout 170 docker run --rm --pull never --network none --read-only \
              --user botuser --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,size=32m \
              -e DATA_DIR=/app/data -e PAPER_V17_DB_PATH=/app/data/paper_v17/observer_v17.db \
              -v "$DATA:/app/data:ro" $mount_arg \
              --entrypoint python "$IMAGE" - 2>&1 <<'PY'
          import json, os, subprocess, sys, time
          code = r'''
          import json,time
          import bf_production_paper_observer
          payload=json.dumps({"rows":[{"ticker":"CEPU","v":i} for i in range(2500)]})
          end=time.monotonic()+135
          loops=0
          while time.monotonic()<end:
              json.loads(payload)
              loops+=1
              time.sleep(.02)
          print("CHILD_DONE",loops,flush=True)
          '''
          children=[subprocess.Popen([sys.executable,"-c",code]) for _ in range(3)]
          results=[p.wait() for p in children]
          print("RCA_AB_CHILD_CODES="+json.dumps(results),flush=True)
          raise SystemExit(0 if results==[0,0,0] else 70)
          PY
          )"
            RC=$?
            set -e
            echo "$OUT" | tail -n 240
            echo "RCA_AB_${label}_RC=$RC"
            echo "RCA_AB_${label}_TIMEOUT_DUMPS=$(grep -c 'Timeout (0:00:45)!' <<< "$OUT" || true)"
            echo "RCA_AB_${label}_CHILD_CODES=$(grep 'RCA_AB_CHILD_CODES=' <<< "$OUT" | tail -n1 || true)"
            echo "RCA_AB_${label}_END"
          }
          run_probe BASELINE ""
          run_probe CANDIDATE "-v /tmp/bf_candidate_no_repeat.py:/app/bf_production_paper_observer.py:ro"
          rm -f /tmp/bf_candidate_no_repeat.py
          DB=/opt/porota-trading/data/paper_v17/observer_v17.db
          SAFETY="$(sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=3); c.execute("pragma query_only=on")
          r=c.execute("select mode,real_orders_sent from observer_state where id=1").fetchone(); print(f"{r[0]}|{int(r[1] or 0)}"); c.close()
          PY
          )"
          echo "RCA_AB_SAFETY=$SAFETY"; test "$SAFETY" = PRODUCTION_PAPER\|0
          echo RCA_AB_READ_ONLY=GREEN
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
