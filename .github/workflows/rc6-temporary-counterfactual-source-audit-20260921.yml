name: Porota RC6 temporary read-only counterfactual source audit
on:
  push:
    branches:
      - audit/rc6-iol-decision-demand-20260921
    paths:
      - 'counterfactual-audit-trigger-20260921.txt'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read published projections through droplet
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/audit_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/audit_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/audit_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo 'AUDIT=counterfactual_projection_readonly'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, pathlib, collections, datetime
          report=pathlib.Path("/app/data/paper_v17/reports/decision_evidence_latest.json")
          cf=pathlib.Path("/app/data/validation/counterfactual_learning_rc6.json")
          print("REPORT_EXISTS="+str(report.exists()))
          if report.exists():
              d=json.loads(report.read_text())
              print("REPORT_MTIME="+datetime.datetime.fromtimestamp(report.stat().st_mtime,datetime.timezone.utc).isoformat())
              print("REPORT_GENERATED_AT="+str(d.get("generated_at")))
              decisions=d.get("decisions",[])
              print("REPORT_DECISIONS="+str(len(decisions)))
              state=collections.Counter(str(x.get("state")) for x in decisions if isinstance(x,dict))
              profiles=collections.Counter()
              reasons=collections.Counter()
              fallback=[]
              for item in decisions:
                  if not isinstance(item,dict) or item.get("state")!="VERIFIED" or not item.get("decision_key"): continue
                  factual=str(item.get("factual_decision") or "UNKNOWN").upper()
                  for p in item.get("profiles",[]):
                      if not isinstance(p,dict) or p.get("name")=="BASELINE_CONSERVATIVE_V1": continue
                      ps=str(p.get("state") or "").upper(); action=str(p.get("action") or "").upper()
                      if ps=="INSUFFICIENT_EVIDENCE": outcome="INSUFFICIENT_EVIDENCE"; reason="SHADOW: "+str(p.get("reason") or "Falta evidencia contemporánea")
                      elif ps=="HARD_SAFETY_BLOCKED" or action=="HOLD": outcome="WOULD_WARN" if factual in {"BUY","OPEN","OPENED_SIMULATED","ENTER"} else "WOULD_REJECT"; reason="SHADOW: "+str(p.get("reason") or "Perfil habría mantenido HOLD")
                      elif ps=="EVALUATED" and action in {"CANDIDATE_OPEN","BUY","OPEN"}: outcome="WOULD_CONFIRM"; reason="SHADOW: perfil habría habilitado el criterio de entrada"
                      else: outcome="INSUFFICIENT_EVIDENCE"; reason="SHADOW: resultado de perfil no verificable"
                      profiles[ps+"|"+action]+=1
                      for code in p.get("reason_codes",[]) or []: reasons[str(code)]+=1
                      fallback.append((outcome,reason))
              counts=collections.Counter(x[0] for x in fallback[:100])
              why=collections.Counter(r for o,r in fallback[:100] if o=="INSUFFICIENT_EVIDENCE")
              print("REPORT_EVIDENCE_STATES="+json.dumps(dict(state),sort_keys=True))
              print("REPORT_PROFILE_STATE_ACTION="+json.dumps(dict(profiles),sort_keys=True))
              print("REPORT_PROFILE_REASON_CODES="+json.dumps(dict(reasons),sort_keys=True))
              print("FALLBACK_FIRST100_OUTCOMES="+json.dumps(dict(counts),sort_keys=True))
              print("FALLBACK_FIRST100_INSUFFICIENT_REASONS="+json.dumps(dict(why),sort_keys=True))
          else: print("REPORT=missing")
          print("CF_FEED_EXISTS="+str(cf.exists()))
          if cf.exists():
              d=json.loads(cf.read_text()); rows=d.get("entries",[])
              outcomes=collections.Counter(str(x.get("outcome")) for x in rows if isinstance(x,dict))
              print("CF_FEED_MTIME="+datetime.datetime.fromtimestamp(cf.stat().st_mtime,datetime.timezone.utc).isoformat())
              print("CF_FEED_GENERATED_AT="+str(d.get("generated_at")))
              print("CF_FEED_ROWS="+str(len(rows))+" OUTCOMES="+json.dumps(dict(outcomes),sort_keys=True))
          PY
          HOST
