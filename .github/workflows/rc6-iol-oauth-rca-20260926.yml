name: RC6 IOL oauth RCA 2026-09-26

on:
  push:
    branches: [diag/rc6-contract-resolution-20260926]
    paths:
      - '.github/workflows/rc6-iol-oauth-rca-20260926.yml'

permissions:
  contents: read

jobs:
  oauth-rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_oauth"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_oauth" "$HOME/.ssh/known_hosts"
      - name: Diagnose refresh endpoint without exposing secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          SSH=(ssh -i "$HOME/.ssh/porota_rc6_oauth" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SSH[@]}" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          sudo -n python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          import iol_mcp_readonly_adapter_rc6 as a
          store=json.loads(Path("/root/.config/porota/iol_mcp_oauth_bootstrap.json").read_text())
          client=a.OAuthStoreReadOnlyMCP()
          headers=client._load_headers()
          try:
            endpoint=client._token_endpoint({
              "WWW-Authenticate": 'Bearer resource_metadata="'+store.get("resource_metadata_url","")+'"'
            }) if store.get("resource_metadata_url") else None
          except Exception:
            endpoint=None
          if not endpoint:
            # Obtain a real 401 challenge safely.
            req=urllib.request.Request(headers["_issuer"],data=b'{}',
              headers={"Authorization":headers["Authorization"],"Content-Type":"application/json"},method="POST")
            try:
              urllib.request.urlopen(req,timeout=20)
            except urllib.error.HTTPError as exc:
              challenge=dict(exc.headers)
              try:
                endpoint=client._token_endpoint(challenge)
              except Exception as inner:
                print("OAUTH_RCA="+json.dumps({"stage":"discovery","error":type(inner).__name__+":"+str(inner)},sort_keys=True))
                raise SystemExit(0)
          tokens=store.get("tokens") or {}
          reg=store.get("client_registration") or {}
          fields={"grant_type":"refresh_token","refresh_token":tokens.get("refresh_token",""),"client_id":reg.get("client_id","")}
          request=urllib.request.Request(endpoint,data=urllib.parse.urlencode(fields).encode(),
            headers={"Content-Type":"application/x-www-form-urlencoded","Accept":"application/json"},method="POST")
          try:
            with urllib.request.urlopen(request,timeout=20) as response:
              payload=json.loads(response.read().decode(errors="replace"))
              print("OAUTH_RCA="+json.dumps({"stage":"refresh","http":getattr(response,"status",200),
                "access_token_present":bool(payload.get("access_token")),"refresh_token_rotated":bool(payload.get("refresh_token"))},sort_keys=True))
          except urllib.error.HTTPError as exc:
            raw=exc.read().decode(errors="replace")
            try:
              payload=json.loads(raw)
            except Exception:
              payload={}
            print("OAUTH_RCA="+json.dumps({"stage":"refresh","http":exc.code,
              "oauth_error":payload.get("error"),"oauth_error_description":str(payload.get("error_description") or "")[:240],
              "retry_after":exc.headers.get("Retry-After")},sort_keys=True))
          except Exception as exc:
            print("OAUTH_RCA="+json.dumps({"stage":"refresh","transport_error":type(exc).__name__},sort_keys=True))
          PY
          REMOTE
