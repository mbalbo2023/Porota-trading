name: RC6 FCI Name Directed API Discovery Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-fci-name-directed-api-discovery-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Validate web-observed names through PPI production SearchInstrument
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo HOST_SHA="$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import json,sqlite3,time
          from bf_production_paper_observer import _secret
          from bd_ppi_readonly_guard import ProductionMarketReader

          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20);c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone();c.close()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('PRE_SAFETY='+'|'.join(map(str,(q,*st))))

          names=[
            ('FCI','Adcap Acciones Clase A','BYMA'),
            ('FCI','Adcap Ahorro Dinamico Clase A','BYMA'),
            ('FCI-EXTERIOR','All Metrics Fund Of Funds Clase USD Acc','OTC'),
            ('FCI-EXTERIOR','Franklin Technology Fund Clase A (Acc) USD','OTC'),
          ]
          safe_keys=('ticker','description','currency','type','market','settlement','id','instrumentId','instrumentID')
          calls=[]
          def audit(method,path,result): calls.append((method,path,result))
          reader=ProductionMarketReader(*_secret(),audit=audit)
          try:
              reader.login_once()
              cfg=reader.market_configuration()
              api_types={str(x).upper() for x in cfg['instrument_types']}
              api_markets={str(x).upper() for x in cfg['markets']}
              for fam,name,market in names:
                  if fam not in api_types or market not in api_markets: continue
                  ticker_forms=[]
                  for candidate in (name, name.split()[0]):
                      candidate=str(candidate).strip()
                      if candidate and candidate not in ticker_forms: ticker_forms.append(candidate)
                  for tq in ticker_forms:
                      try:
                          payload=reader.search_instruments(tq,fam,name=name,market=market)
                          rows=[{k:raw.get(k) for k in safe_keys if k in raw} for raw in payload[:30]]
                          print('FCI_API='+json.dumps({'family':fam,'web_name':name,'ticker_query':tq,'market':market,'count':len(payload),'rows':rows},ensure_ascii=False,sort_keys=True,default=str))
                      except Exception as exc:
                          print('FCI_API='+json.dumps({'family':fam,'web_name':name,'ticker_query':tq,'market':market,'count':0,'error':type(exc).__name__+':'+str(exc)[:180]},ensure_ascii=False,sort_keys=True))
                      time.sleep(0.15)
              print('HTTP_BLOCKED='+str(reader.metrics['http_blocked']))
              assert reader.metrics['http_blocked']==0
          finally:
              reader.close()

          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20);c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone();c.close()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('FINAL_SAFETY='+'|'.join(map(str,(q,*st))))
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
