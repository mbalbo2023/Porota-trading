name: RC6 PPI auth local metadata 2026-09-07
on:
  push:
    branches: [diag/rc6-ppi-login-api-base-20260907]
    paths:
      - 'rc6_ppi_auth_local_metadata.py'
      - '.github/workflows/rc6-ppi-auth-local-metadata-20260907.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Static safety
        run: |
          set -euo pipefail
          python3 -m py_compile rc6_ppi_auth_local_metadata.py
          grep -q 'network_used' rc6_ppi_auth_local_metadata.py
          ! grep -Eiq 'requests\.|httpx|urllib.request|playwright|PPI_WEB_USERNAME|PPI_WEB_PASSWORD|send_order|place_order' rc6_ppi_auth_local_metadata.py
          echo 'AUTH_METADATA_STATIC_SAFETY=GREEN'
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Local-only metadata
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" rc6_ppi_auth_local_metadata.py "$DO_USER@$DO_HOST:/tmp/rc6_ppi_auth_local_metadata.py"
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin python3 /tmp/rc6_ppi_auth_local_metadata.py --profile /home/porotaadmin/porota-browser-lab/chrome-profile --secret /etc/porota/contract-evidence-web.env
          sudo -n rm -f /tmp/rc6_ppi_auth_local_metadata.py
          echo 'PPI_AUTH_LOCAL_METADATA=GREEN_LOCAL_ONLY'
          HOST
