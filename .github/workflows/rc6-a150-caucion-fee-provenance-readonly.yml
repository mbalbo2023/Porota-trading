name: RC6 A150 PAPER caucion fee provenance RO

on:
  push:
    branches:
      - audit/rc6-a150-caucion-fee-ro

permissions:
  contents: read

concurrency:
  group: rc6-a150-caucion-fee-ro
  cancel-in-progress: false

jobs:
  paper-fee-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded local fee forensic tool
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q --disable-pip-version-check pytest==8.4.2
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            tests/test_rc6_a150_caucion_ro_provenance.py
          test -f scripts/rc6_caucion_fee_ro_provenance.py
          echo 'RC6_A150_RO_TEST=GREEN'
      - name: Prepare strict ephemeral SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a150_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a150_key" "$HOME/.ssh/known_hosts"
      - name: Host ledger READ_ONLY provenance; no orders or account calls
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          RO_PROBE_B64="$(base64 -w0 scripts/rc6_caucion_fee_ro_provenance.py)"
          timeout 45 ssh -i "$HOME/.ssh/rc6_a150_key" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n env PYTHONDONTWRITEBYTECODE=1 timeout 20 python3 - '$RO_PROBE_B64'" \
            > evidence/rc6-a150-fee-provenance.json <<'PY'
          import base64, json, sys, types
          source = base64.b64decode(sys.argv[1], validate=True)
          if not 1000 < len(source) < 30000:
              raise SystemExit('RC6_A150_READ_ONLY_SOURCE_INVALID')
          module = types.ModuleType('rc6_a150_readonly')
          exec(compile(source, 'rc6_a150_readonly.py', 'exec'), module.__dict__)
          result = module.historical_public_fee_provenance(
              '/opt/porota-trading/data/paper_v17/observer_v17.db')
          print(json.dumps(result, sort_keys=True))
          if result['status'] != 'GREEN' or result['legacy_rows'] != 6:
              raise SystemExit('RC6_A150_HISTORICAL_FEE_EVIDENCE_RED')
          PY
          python3 -m json.tool evidence/rc6-a150-fee-provenance.json
          echo 'RC6_A150_HISTORICAL_REPLAY=GREEN_NOT_ACCOUNTING_RECONCILIATION'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-a150-caucion-fee-readonly-${{ github.sha }}
          path: evidence/rc6-a150-fee-provenance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove ephemeral key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/rc6_a150_key"
