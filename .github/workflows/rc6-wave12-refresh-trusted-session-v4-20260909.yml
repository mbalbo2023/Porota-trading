name: RC6 Wave12 Refresh Trusted Session V4 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave12-refresh-trusted-session-v4-20260909.yml']
permissions:
  contents: read
jobs:
  refresh-trusted-session-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile rc6_ppi_web_reauth.py
          grep -q 'AUTHENTICATED_TRUSTED_DEVICE' rc6_ppi_web_reauth.py
          grep -q 'APPROVED_AUTH_POSTS' rc6_ppi_web_reauth.py
          ! grep -REn 'send_order|place_order|cancel_order|/Operar|/Orden|api/Orders' rc6_ppi_web_reauth.py
          echo 'W12_REFRESH_V4_STATIC=GREEN'
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w12refreshv4"
          chmod 600 "$HOME/.ssh/w12refreshv4"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Refresh trusted profile without stale git baseline coupling
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/w12refreshv4" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          SECRET=/etc/porota/contract-evidence-web.env
          PY=/opt/porota-contract-evidence-venv/bin/python
          CHROME=/usr/bin/google-chrome-stable

          # Git HEAD is mutable bookkeeping during serial wave CI. Safety is
          # the identity/state of the live containers + DB + unchanged worktree.
          PRE=$(git rev-parse HEAD)
          echo "W12_V4_WORKTREE_HEAD_PRE=$PRE"
          OBS_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}|{{.Config.Image}}' porota_production_observer)
          DASH_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)
          echo 'W12_V4_RUNTIME_IDENTITY_CAPTURED=YES'

          ACTIVE=$(sudo -n systemctl is-active porota-contract-evidence-rc6.service 2>/dev/null || true)
          echo "W12_V4_CE_SERVICE=$ACTIVE"
          [ "$ACTIVE" != active ]
          [ -x "$PY" ] && echo 'W12_V4_VENV=GREEN'
          [ -x "$CHROME" ] && echo 'W12_V4_CHROME=GREEN'
          [ -d "$PROFILE" ] && echo 'W12_V4_PROFILE=GREEN'
          [ -f "$SECRET" ] && echo 'W12_V4_SECRET_FILE=GREEN'

          SMODE=$(sudo -n stat -c '%a' "$SECRET")
          SOWNER=$(sudo -n stat -c '%U' "$SECRET")
          POWNER=$(sudo -n stat -c '%U' "$PROFILE")
          echo "W12_V4_SECRET_MODE=$SMODE"
          echo "W12_V4_SECRET_OWNER_OK=$([ "$SOWNER" = porotaadmin ] && echo YES || echo NO)"
          echo "W12_V4_PROFILE_OWNER_OK=$([ "$POWNER" = porotaadmin ] && echo YES || echo NO)"
          [ "$SMODE" = 600 ]
          [ "$SOWNER" = porotaadmin ]
          [ "$POWNER" = porotaadmin ]

          sudo -n python3 - "$SECRET" <<'PY'
          from pathlib import Path
          import sys
          vals={}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace').splitlines():
              s=raw.strip()
              if s and not s.startswith('#') and '=' in s:
                  k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          print('W12_V4_LOCAL_USERNAME_PRESENT='+('YES' if bool(vals.get('PPI_WEB_USERNAME','').strip()) else 'NO'))
          print('W12_V4_LOCAL_PASSWORD_PRESENT='+('YES' if bool(vals.get('PPI_WEB_PASSWORD','').strip()) else 'NO'))
          if not vals.get('PPI_WEB_USERNAME','').strip() or not vals.get('PPI_WEB_PASSWORD','').strip():
              raise SystemExit('PPI_WEB_LOCAL_CREDENTIALS_MISSING')
          PY

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'W12_V4_PRE_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY

          git fetch --no-tags origin deploy-prep/rc6-wave12-currentbase-20260909
          git cat-file -e "$TARGET_SHA^{commit}"
          TMP=$(mktemp -d "$HOME/w12refreshv4.XXXXXX")
          cleanup(){ rm -rf "$TMP"; }
          trap cleanup EXIT
          git show "$TARGET_SHA:rc6_ppi_web_reauth.py" > "$TMP/rc6_ppi_web_reauth.py"
          sudo -n chown porotaadmin:porotaadmin "$TMP" "$TMP/rc6_ppi_web_reauth.py"
          sudo -n chmod 700 "$TMP"
          sudo -n chmod 600 "$TMP/rc6_ppi_web_reauth.py"

          set +e
          sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin PYTHONPATH="$TMP" "$PY" "$TMP/rc6_ppi_web_reauth.py" --profile "$PROFILE" --secret "$SECRET" >"$TMP/result.txt" 2>&1
          RC=$?
          set -e

          SAFE=$(sudo -n python3 - "$TMP/result.txt" <<'PY'
          import json,sys
          lines=open(sys.argv[1],encoding='utf-8',errors='replace').read().splitlines()
          d=None
          for line in reversed(lines):
              try:
                  x=json.loads(line)
                  if isinstance(x,dict) and 'status' in x:
                      d=x; break
              except Exception:
                  pass
          if d is None: d={'status':'INVALID_SANITIZED_OUTPUT'}
          keys=('status','attempts','stage','page_url','blocked_post_path','credentials_exposed','orders_visited','real_orders_sent')
          print(json.dumps({k:d.get(k) for k in keys if k in d},sort_keys=True))
          PY
          )
          echo "W12_V4_REAUTH_RC=$RC"
          echo "W12_V4_REAUTH_RESULT=$SAFE"
          SAFE_STATUS=$(printf '%s' "$SAFE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          SAFE_CREDS=$(printf '%s' "$SAFE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("credentials_exposed"))')
          SAFE_ORDERS=$(printf '%s' "$SAFE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("orders_visited"))')
          SAFE_REAL=$(printf '%s' "$SAFE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("real_orders_sent",-1))')
          [ "$SAFE_CREDS" = False ]
          [ "$SAFE_ORDERS" = False ]
          [ "$SAFE_REAL" = 0 ]
          [ "$RC" -eq 0 ]
          [ "$SAFE_STATUS" = AUTHENTICATED_TRUSTED_DEVICE ]

          OBS_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}|{{.Config.Image}}' porota_production_observer)
          DASH_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)
          [ "$OBS_POST" = "$OBS_PRE" ]
          [ "$DASH_POST" = "$DASH_PRE" ]
          [ "$(git rev-parse HEAD)" = "$PRE" ]

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'W12_V4_POST_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'RUNTIME_CHANGED=NO'
          echo 'W12_TRUSTED_SESSION_REFRESH_V4=GREEN'
          REMOTE
