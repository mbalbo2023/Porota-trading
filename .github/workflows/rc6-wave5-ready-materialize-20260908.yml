name: RC6 Wave5 READY materialize 2026-09-08
on:
  push:
    branches: [deploy-prep/rc6-wave5-ready-20260908]
    paths: ['.github/workflows/rc6-wave5-ready-materialize-20260908.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Overlay Wave5 on deployed Wave4 baseline and validate
        run: |
          set -euo pipefail
          git fetch origin integration/rc6-wave5-contract-evidence-dashboard-20260908
          OLD=860b26ca22a73679217e8953207041da2b8afffd
          SRC=origin/integration/rc6-wave5-contract-evidence-dashboard-20260908
          git diff --name-only --diff-filter=ACMRT "$OLD..$SRC" > /tmp/files
          while IFS= read -r f; do [ -z "$f" ] || git checkout "$SRC" -- "$f"; done < /tmp/files
          git diff --name-only --diff-filter=D "$OLD..$SRC" > /tmp/deleted
          while IFS= read -r f; do [ -z "$f" ] || rm -f -- "$f"; done < /tmp/deleted
          grep -q 'ppi-client==1.3.0' requirements.txt
          test -f rc6_trusted_browser_contract_collector.py
          test -f fa_raw_evidence_store_rc6.py
          python -m pip install -q pytest fastapi requests
          python -m py_compile ch_contract_evidence_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bg_paper_dashboard.py rc6_data_sla_policy.py rc6_dom_coverage_reconciler.py rc6_scraping_semaphore.py
          PYTHONPATH=. python -m pytest -q tests/test_contract_evidence_hf6.py tests/test_rc6_wave1b_sla_scraping.py
          ! git diff HEAD -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          echo WAVE5_READY_FOR_DEPLOY=GREEN
      - name: Commit materialized candidate
        run: |
          set -euo pipefail
          git config user.name 'porota-ci'
          git config user.email 'porota-ci@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'candidate(rc6): materialize Wave5 on deployed Wave4 baseline'
          git push origin HEAD:deploy-prep/rc6-wave5-ready-20260908
