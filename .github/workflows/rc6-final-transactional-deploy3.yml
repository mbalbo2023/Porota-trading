name: RC6 final transactional deploy3

on:
  push:
    branches: [release-candidate/v17.0.0-rc6-deploy3-20260906]

permissions:
  contents: read

concurrency:
  group: porota-rc6-final-deploy3
  cancel-in-progress: false

jobs:
  validate:
    name: Exact SHA acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Lineage and safety identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
          test -z "$(git status --porcelain)"
          git diff --check
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_RELEASE_IDENTITY=GREEN')
          PY
      - name: Compile source tree
        run: python -m compileall -q .
      - name: Build exact candidate
        run: docker build --pull=false --label "porota.commit=$GITHUB_SHA" --label "porota.version=17.0.0-rc6" -t porota-rc6-release3:${GITHUB_SHA} .
      - name: Active pytest suite offline
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-release3:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              --ignore=tests/test_hotfix_rc3_hf2.py \
              --ignore=tests/test_hotfix_rc3_hf4.py \
              --ignore=tests/test_hotfix_rc3_hf6.py \
              --ignore=tests/test_intraday_scalping_hf3.py \
              --ignore=tests/test_rc4_acceptance.py \
              --ignore=tests/test_rc4_hf1_last_mile.py \
              --ignore=tests/test_rc4_hf2_consolidation.py' > rc6-release3-pytest.log 2>&1
          rc=$?
          set -e
          tail -n 260 rc6-release3-pytest.log || true
          exit "$rc"
      - name: RC6 release invariants offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0770 \
            --entrypoint python porota-rc6-release3:${GITHUB_SHA} - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import _version
          import bu_instrument_catalog as catalog
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          assert _version.EXECUTION == 'SIMULATED'
          pre=Path('rc6_preopen.py').read_text(encoding='utf-8').lower()
          assert 'rc4' not in pre
          host=Path('scripts/rc6_transactional_host_deploy_v3.sh').read_text(encoding='utf-8')
          assert 'docker system prune' not in host
          assert '--pull never' in host
          assert 'NETWORK_ORDER_TEST=NOT_PERFORMED' in host
          at=datetime(2026,9,7,10,15,tzinfo=ZoneInfo('America/Argentina/Buenos_Aires'))
          for symbol in ('AAPL','AAPLD','AAPLC'):
              assert catalog.rc6_underlying_opening_block(symbol,'CEDEARS',at)=='UNDERLYING_MARKET_CLOSED: US_LABOR_DAY'
          assert catalog.rc6_underlying_opening_block('GGAL','ACCIONES',at)==''
          print('RC6_RELEASE_INVARIANTS=GREEN')
          PY

  archive:
    name: Immutable GHCR archive proof
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Login GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish exact SHA and capture immutable digest
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
        run: |
          set -euo pipefail
          REF="$IMAGE:rc6-release3-${GITHUB_SHA}"
          docker build --pull=false --label "porota.commit=${GITHUB_SHA}" --label "porota.version=17.0.0-rc6" -t "$REF" .
          docker push "$REF" 2>&1 | tee /tmp/push.log
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/push.log | tail -n1)"
          if [ -z "$DIGEST" ]; then DIGEST="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"; fi
          case "$DIGEST" in sha256:*) ;; *) echo INVALID_DIGEST; exit 1;; esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'version=17.0.0-rc6\ncommit=%s\ntree=%s\nimage=%s\ndigest=%s\n' \
            "$GITHUB_SHA" "$(git rev-parse "${GITHUB_SHA}^{tree}")" "$IMAGE" "$DIGEST" > /tmp/manifest.txt
      - name: Delete local tag and prove re-pull by digest
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm "$IMAGE:rc6-release3-${GITHUB_SHA}"
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "porota.commit"}}')" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --entrypoint python "$IMAGE@$DIGEST" -c "import _version; assert _version.VERSION=='17.0.0-rc6'; assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'; print('GHCR_REPULL=GREEN')"
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-release3-manifest-${{ github.sha }}
          path: /tmp/manifest.txt
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Transactional Droplet deploy and offline rollback rehearsal
    needs: [validate, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_deploy"
          chmod 600 "$HOME/.ssh/porota_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact RC6 SHA transactionally
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          ARCHIVE_DIGEST: ${{ needs.archive.outputs.digest }}
          TARGET_BRANCH: release-candidate/v17.0.0-rc6-deploy3-20260906
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          ssh -i "$HOME/.ssh/porota_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "TARGET_SHA='$TARGET_SHA' ARCHIVE_DIGEST='$ARCHIVE_DIGEST' TARGET_BRANCH='$TARGET_BRANCH' bash -s" \
            < scripts/rc6_transactional_host_deploy_v3.sh
      - name: Deployment summary
        if: success()
        run: |
          {
            echo '### POROTA RC6 deployment GREEN'
            echo "- Exact SHA: $GITHUB_SHA"
            echo "- Immutable GHCR digest: ${{ needs.archive.outputs.digest }}"
            echo '- Runtime: PRODUCTION_PAPER / SIMULATED / REAL_ORDER_CAPABILITY=BLOCKED.'
            echo '- RC5 image remained local; actual RC6→RC5→RC6 rollback rehearsal used --pull never.'
            echo '- Pre-existing SQLite schema objects were unchanged; additive-only compatibility gate passed.'
            echo '- RC4 timers/services are inactive under RC6; inert legacy unit files remain only for rollback evidence.'
            echo '- Contract Evidence remains fail-closed pending RC6-native wiring.'
            echo '- No network order test was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
