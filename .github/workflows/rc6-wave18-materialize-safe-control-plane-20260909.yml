name: RC6 Wave18 Materialize Safe Control Plane 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/rc6-wave18-materialize-safe-control-plane-20260909.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize selected safe control-plane files
        run: |
          set -euo pipefail
          git fetch --no-tags origin hotfix/rc6-control-plane-broker-permissions-issue-41 closure/rc6-critical-control-plane-20260907
          for f in fg_critical_approval_gateway_rc6.py fi_critical_approval_entrypoint_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py tests/test_critical_approval_gateway_rc6.py tests/test_critical_approval_unix_runtime_rc6.py tests/test_critical_github_proxy_rc6.py tests/test_rc6_control_plane_deploy_permissions.py; do
            mkdir -p "$(dirname "$f")"
            git show origin/hotfix/rc6-control-plane-broker-permissions-issue-41:"$f" > "$f"
          done
          git show origin/closure/rc6-critical-control-plane-20260907:fo_critical_approval_health_rc6.py > fo_critical_approval_health_rc6.py
          git show origin/closure/rc6-critical-control-plane-20260907:tests/test_critical_approval_healthcheck_rc6.py > tests/test_critical_approval_healthcheck_rc6.py
      - name: Safety static gate
        run: |
          set -euo pipefail
          python3 -m py_compile fg_critical_approval_gateway_rc6.py fi_critical_approval_entrypoint_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py fo_critical_approval_health_rc6.py
          if grep -RniE '(/Operar|api/Orders|send_order|place_order|new_order|comprar\(|vender\()' fg_critical_approval_gateway_rc6.py fi_critical_approval_entrypoint_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py fo_critical_approval_health_rc6.py; then
            echo 'UNSAFE_BROKER_ROUTE_REFERENCE=FOUND'
            exit 41
          fi
          echo 'REAL_ORDER_CAPABILITY=NOT_ADDED'
          echo 'ORDER_ROUTES=NOT_CALLED'
      - name: Test safe control plane
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_critical_approval_gateway_rc6.py tests/test_critical_approval_unix_runtime_rc6.py tests/test_critical_github_proxy_rc6.py tests/test_critical_approval_healthcheck_rc6.py tests/test_rc6_control_plane_deploy_permissions.py
      - name: Commit only after gates pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fg_critical_approval_gateway_rc6.py fi_critical_approval_entrypoint_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py fo_critical_approval_health_rc6.py tests/test_critical_approval_gateway_rc6.py tests/test_critical_approval_unix_runtime_rc6.py tests/test_critical_github_proxy_rc6.py tests/test_critical_approval_healthcheck_rc6.py tests/test_rc6_control_plane_deploy_permissions.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat(rc6 wave18): materialize safe control plane on current base'
          git push origin HEAD:deploy-prep/rc6-wave18-currentbase-20260909
