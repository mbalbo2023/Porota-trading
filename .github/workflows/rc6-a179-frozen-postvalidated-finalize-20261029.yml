name: RC6 A179 exact frozen A178 postvalidation completion

on:
  push:
    branches:
      - repair/rc6-a179-finalize-frozen-20261029

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  exact-frozen-postvalidation-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
      RC6_A179_NATIVE_RUN: "40916351644"
      RC6_A179_RECOVERY_RUN: "40919271822"
      RC6_CANDIDATE: "7d62d2f4ed353231da8566a360a1179e99bcc7eb"
    steps:
      - name: Checkout isolated closure source
        uses: actions/checkout@v4
      - name: Checkout the exact already-installed immutable product
        uses: actions/checkout@v4
        with:
          ref: d961d19e55d78c68d902a14b41480344365cde1e
          path: certified-product
      - name: Verify immutable A178 product and all closure safety regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C certified-product rev-parse HEAD)" = d961d19e55d78c68d902a14b41480344365cde1e
          test "$(git -C certified-product rev-parse HEAD^{tree})" = 31ced11ce047bfa092f5398c13aeb37b74afd629
          test "$(sha256sum certified-product/scripts/rc6_deploy_quiescence.py | cut -d' ' -f1)" = 0f016652f884cd27bba0e29e3128da615266d09b8bf7a0a1f9a063d1386f0fc6
          test "$(sha256sum certified-product/scripts/rc6_deploy_host_mutex.py | cut -d' ' -f1)" = "$(sha256sum scripts/rc6_deploy_host_mutex.py | cut -d' ' -f1)"
          python3 -m unittest tests.test_rc6_a179_resume_validate -v
          python3 -m py_compile scripts/rc6_a179_resume_validate.py
          echo "RC6_A179_CLOSURE_SOURCE_AND_NEGATIVE_TESTS=GREEN"
      - name: Distinguish exact cancelled runner from independent certified native proof
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 40 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RC6_A179_NATIVE_RUN" \
            > a179-accepted-native-run.json
          jq -e '
            .status == "completed" and
            .conclusion == "cancelled" and
            .run_attempt == 1 and
            .head_sha == "911e5a5a2add86957765db7af50d3a2dd38fcf6c" and
            .head_branch == "repair/rc6-a179-resume-frozen-20261029" and
            .event == "push"
          ' a179-accepted-native-run.json >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 40 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RC6_A179_RECOVERY_RUN" \
            > a179-certified-native-recovery-run.json
          jq -e '
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 1 and
            .head_sha == "b7e3cffab7a3359bc2a138d6e1e9f2d9ac4e035f" and
            .head_branch == "diagnostic/rc6-a179-cancelled-native-ro-20261029" and
            .event == "push"
          ' a179-certified-native-recovery-run.json >/dev/null
          echo "RC6_A179_ORIGINAL_ACTIONS=CANCELLED_JOB_TIMEOUT"
          echo "RC6_A179_INDEPENDENT_NATIVE_CERTIFICATION=SUCCESS_EXACT_RUN_AND_SHA"
      - name: Configure exact known-host SSH for Actions-only host control
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_a179_closure"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_a179_closure" "$HOME/.ssh/known_hosts"
      - name: Read only exact native proof and old clean IDLE mutex attempt
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 200 ssh -i "$HOME/.ssh/porota_rc6_a179_closure" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n env RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' PYTHONDONTWRITEBYTECODE=1 python3 - --mode closure-preflight" \
            < scripts/rc6_a179_resume_validate.py | tee a179-closure-preflight.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines=Path('a179-closure-preflight.jsonl').read_text().splitlines()
          assert len(lines)==1 and lines[0].startswith('RC6_A179_RESUME_CLOSURE-PREFLIGHT=')
          row=json.loads(lines[0].split('=',1)[1])
          assert row['status']=='GREEN_READ_ONLY' and row['prior_barrier']=='IDLE_EXACT_ATTEMPT_1'
          assert row['native_run_id']=='40916351644' and row['real_orders_sent']==0
          assert row['host_mutations']==0 and row['ppi_watch_mutations']==0
          print('RC6_A179_EXACT_NATIVE_TO_FINALIZE_PREFLIGHT=GREEN_READ_ONLY')
          PY
      - name: Release exactly the completed prior native mutex attempt
        id: release_old_attempt
        shell: bash
        run: |
          set -Eeuo pipefail
          MUTEX_B64="$(base64 -w0 certified-product/scripts/rc6_deploy_host_mutex.py)"
          timeout 190 ssh -i "$HOME/.ssh/porota_rc6_a179_closure" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$MUTEX_B64\"))' '$DO_USER' root --attempt '$RC6_CANDIDATE' '$RC6_A179_NATIVE_RUN' '1' --phase cleanup_final env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode release-native-attempt" \
            < scripts/rc6_a179_resume_validate.py | tee a179-prior-native-barrier-release.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines=Path('a179-prior-native-barrier-release.jsonl').read_text().splitlines()
          assert len(lines)==1 and lines[0].startswith('RC6_A179_RESUME_RELEASE-NATIVE-ATTEMPT=')
          row=json.loads(lines[0].split('=',1)[1])
          assert row['status']=='GREEN_NATIVE_ATTEMPT_RELEASED'
          assert row['native_run_id']=='40916351644' and row['real_orders_sent']==0
          print('RC6_A179_PRIOR_EXACT_MUTEX_RETIRED=GREEN')
          PY
      - name: Complete original frozen Deploy V2 gates under one exclusive host mutex
        id: finish_postfailure
        timeout-minutes: 18
        shell: bash
        run: |
          set -Eeuo pipefail
          MUTEX_B64="$(base64 -w0 certified-product/scripts/rc6_deploy_host_mutex.py)"
          timeout --signal=TERM --kill-after=10s 1000 ssh \
            -i "$HOME/.ssh/porota_rc6_a179_closure" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$MUTEX_B64\"))' '$DO_USER' root --attempt '$RC6_CANDIDATE' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' --phase finalize env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode finish-postfailure" \
            < scripts/rc6_a179_resume_validate.py | tee a179-finalize.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=Path('a179-finalize.jsonl').read_text().splitlines()
          expected={'RC6_A179_PHASE_CRITICAL=GREEN',
                    'RC6_A179_PHASE_SCHEDULERS=GREEN',
                    'RC6_A179_PHASE_SCHEDULER_VERIFY=GREEN',
                    'RC6_A179_PHASE_EMPTY_BACKUP=GREEN',
                    'RC6_A179_PHASE_FINAL_MARKER=VALIDATED_RUNTIME'}
          assert len(rows)==6 and all(any(row.startswith(v) for row in rows) for v in expected)
          assert rows[-1].startswith('RC6_A179_RESUME_FINISH-POSTFAILURE=')
          row=json.loads(rows[-1].split('=',1)[1])
          assert row['status']=='VALIDATED_RUNTIME' and row['reused_frozen_artifact'] is True
          assert row['host_rebuilds']==row['real_orders_sent']==row['backup_deleted_files']==0
          assert row['native_run_id']=='40916351644' and row['operator_no_go']=='HELD'
          assert row['ppi_watch_mutations']==0
          print('RC6_A179_FINISHED_FROZEN_ARTIFACT=VALIDATED_RUNTIME|NO_GO|PAPER=0')
          PY
      - name: On a clean failed attempt release only its safe IDLE mutex
        if: failure() && steps.finish_postfailure.outcome == 'failure'
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          MUTEX_B64="$(base64 -w0 certified-product/scripts/rc6_deploy_host_mutex.py)"
          timeout 220 ssh -i "$HOME/.ssh/porota_rc6_a179_closure" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$MUTEX_B64\"))' '$DO_USER' root --attempt '$RC6_CANDIDATE' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' --phase cleanup_final env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode cleanup-forward-attempt" \
            < scripts/rc6_a179_resume_validate.py | tee a179-safe-failure-release.jsonl
      - name: Independent postfinal direct runtime and native unstaged NO_GO check
        id: independently_validated
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 220 ssh -i "$HOME/.ssh/porota_rc6_a179_closure" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode postfinal" \
            < scripts/rc6_a179_resume_validate.py | tee a179-independent-postfinal.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=Path('a179-independent-postfinal.jsonl').read_text().splitlines()
          assert len(rows)==1 and rows[0].startswith('RC6_A179_RESUME_POSTFINAL=')
          row=json.loads(rows[0].split('=',1)[1])
          assert row['status']=='VALIDATED_RUNTIME' and row['native_run_id']=='40916351644'
          assert row['preopen_phases']=='BOTH_NATIVE_PAUSED_NO_GO_GREEN'
          assert row['operator_no_go']=='HELD' and row['real_orders_sent']==0
          assert row['host_mutations']==row['ppi_watch_mutations']==0
          print('RC6_A179_INDEPENDENT_POSTFINAL=VALIDATED_RUNTIME|PAPER=0|NO_GO')
          PY
      - name: Keep exact completion and failure receipts in immutable Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a179-exact-frozen-postvalidation-completion
          path: |
            a179-closure-preflight.jsonl
            a179-prior-native-barrier-release.jsonl
            a179-finalize.jsonl
            a179-safe-failure-release.jsonl
            a179-independent-postfinal.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Erase runner-only SSH key
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/porota_rc6_a179_closure"
