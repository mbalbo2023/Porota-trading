name: RC6 A93 OPEN admission diagnostic read only

on:
  push:
    branches: [audit/rc6-a93-open-no-trades-20261026]
    paths: ['.github/workflows/rc6-a93-open-no-trades-readonly.yml']

permissions:
  contents: read
  issues: write

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Read bounded PAPER admission and native ledger aggregates
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for unit in porota-preopen-rc6.timer porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer porota-a3-history-weekend-rc6.timer porota-history-postclose-rc6.timer; do
            printf 'TIMER=%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          systemctl show porota-preopen-rc6.timer --property=LastTriggerUSec --property=NextElapseUSecRealtime --no-pager | sed 's/^/PREOPEN_TIMER_/'
          sudo -n python3 - <<'PYHOST'
          import json, os, subprocess, sys, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          def command(args):
              try:
                  result = subprocess.run(args, check=False, text=True,
                                          capture_output=True, timeout=5)
              except (OSError, subprocess.SubprocessError):
                  return None
              return result.stdout if result.returncode == 0 else None

          raw = command(['systemctl', 'list-unit-files', '--type=timer',
                         '--all', '--no-legend', '--no-pager'])
          if raw is None:
              raise SystemExit('RC6_TIMER_ENUMERATION_UNAVAILABLE')
          names = sorted({line.split()[0] for line in raw.splitlines()
                          if line.split() and line.split()[0].startswith('porota-')
                          and 'watch' not in line.split()[0].lower()})[:48]
          properties = ('Id', 'LoadState', 'ActiveState', 'UnitFileState',
                        'LastTriggerUSec', 'NextElapseUSecRealtime')
          service_properties = ('Id', 'LoadState', 'ActiveState', 'Result',
                                'ExecMainStatus', 'ExecMainStartTimestamp',
                                'ExecMainExitTimestamp')

          def show(unit, fields):
              raw = command(['systemctl', 'show', unit, '--no-pager',
                             '--property=' + ','.join(fields)])
              if raw is None:
                  return {'state': 'NO_VERIFICADO'}
              values = dict(line.split('=', 1) for line in raw.splitlines()
                            if '=' in line)
              return {field: values.get(field) or 'NO_VERIFICADO'
                      for field in fields}

          roles = ('--dynamic-shadow-worker', '--performance-worker',
                   '--exit-reader', '--notification-worker', '--candle-worker',
                   '--intraday-scalping-worker', '--caucion-cash-sweep-worker')
          top = command(['docker', 'top', 'porota_production_observer',
                         '-eo', 'pid,args'])
          observed = {}
          if top is not None:
              for line in top.splitlines()[1:80]:
                  parts = line.strip().split(None, 1)
                  if len(parts) != 2 or not parts[0].isdecimal():
                      continue
                  argv = parts[1]
                  if 'bf_production_paper_observer.py' in argv:
                      role = 'scanner'
                  elif 'bv_paper_runtime.py' in argv:
                      role = next((flag[2:] for flag in roles if flag in argv),
                                  'paper_runtime')
                  else:
                      continue
                  observed[int(parts[0])] = role

          def counters(pid):
              try:
                  proc = '/proc/' + str(pid)
                  stat = open(proc + '/stat', encoding='ascii').read().rsplit(')', 1)[1].split()
                  io = dict(line.split(':', 1) for line in
                            open(proc + '/io', encoding='ascii').read().splitlines()
                            if ':' in line)
                  return (int(stat[11]) + int(stat[12]),
                          int(io.get('read_bytes', '0')),
                          int(io.get('write_bytes', '0')),
                          int(stat[21]) * os.sysconf('SC_PAGE_SIZE') // 1024)
              except (OSError, ValueError, IndexError):
                  return None

          before = {pid: counters(pid) for pid in observed}
          start = time.monotonic()
          time.sleep(2)
          elapsed = round(time.monotonic() - start, 3)
          process_sample = []
          for pid, role in sorted(observed.items(), key=lambda item: (item[1], item[0])):
              first, last = before[pid], counters(pid)
              if first is None or last is None:
                  process_sample.append({'role': role, 'state': 'SAMPLE_UNAVAILABLE'})
                  continue
              deltas = [last[i] - first[i] for i in range(3)]
              process_sample.append({'role': role,
                  'state': 'OK' if all(value >= 0 for value in deltas) else 'COUNTER_RESET',
                  'cpu_ticks_delta': max(0, deltas[0]),
                  'read_bytes_delta': max(0, deltas[1]),
                  'write_bytes_delta': max(0, deltas[2]),
                  'rss_kib': last[3]})

          now = datetime.now(timezone.utc)
          journal = command(['journalctl', '-u',
                             'porota-local-eod-history-rc6.service',
                             '--lines=120', '--no-pager', '--output=cat'])
          eod = {'state': 'NO_VERIFICADO'}
          if journal is not None:
              for line in reversed(journal.splitlines()):
                  try:
                      item = json.loads(line)
                  except (ValueError, TypeError):
                      continue
                  if isinstance(item, dict) and item.get('schema') == 'rc6.local-eod.v1':
                      fields = ('as_of', 'state', 'reason', 'imported',
                                'rejected', 'daily_groups', 'cursor',
                                'scope', 'real_orders_sent')
                      eod = {field: item.get(field) for field in fields}
                      break

          sys.path.insert(0, '/opt/porota-trading')
          try:
              from rc6_preopen import iol_reference_state
              iol = iol_reference_state(now.astimezone(
                  ZoneInfo('America/Argentina/Buenos_Aires')).date())
              fields = ('state', 'reason', 'cache_state',
                        'effective_cache_state', 'age_seconds',
                        'last_good_age_seconds', 'caucion_ars_state',
                        'caucion_ars_records', 'never_zero_fill')
              iol = {field: iol.get(field) for field in fields}
          except Exception as exc:
              iol = {'state': 'NO_VERIFICADO',
                     'error_type': type(exc).__name__}
          result = {'schema': 'rc6-postclose-host-units-readonly-v1',
                    'at_utc': now.isoformat(),
                    'at_ar': now.astimezone(
                        ZoneInfo('America/Argentina/Buenos_Aires')).isoformat(),
                    'timer_enumeration': 'OK', 'timer_count': len(names),
                    'timer_limit_hit': len(names) == 48,
                    'process_enumeration': 'OK' if top is not None else 'NO_VERIFICADO',
                    'process_sample_seconds': elapsed,
                    'processes': process_sample,
                    'units': [{'timer': show(name, properties),
                               'service': show(name[:-6] + '.service',
                                               service_properties)}
                              for name in names],
                    'local_eod_latest_report': eod,
                    'iol_reference_current_contract': iol,
                    'ppi_watch_accessed': False, 'mutation_attempted': False}
          print('RC6_POSTCLOSE_HOST=' + json.dumps(result, sort_keys=True))
          PYHOST
          sudo -n python3 - <<'PYWATCH'
          import collections,json,os,re,subprocess
          from pathlib import Path

          def read(command):
              try:
                  result=subprocess.run(command,check=False,text=True,capture_output=True,timeout=8)
                  return result.stdout if result.returncode==0 else None
              except (OSError,subprocess.SubprocessError):
                  return None
          def matches(value):
              lowered=value.lower()
              return 'ppi' in lowered or 'watch' in lowered

          report={'schema':'rc6-a96-ppi-watch-host-inventory-v1',
                  'mode':'METADATA_ONLY','mutation_attempted':False,
                  'systemd':{},'docker':{},'process_names':{},'directories':{},'crontab':{},
                  'release_state':{},'preopen_journal':{}}
          for scope,command in (
              ('installed',['systemctl','list-unit-files','--all','--no-legend','--no-pager']),
              ('loaded',['systemctl','list-units','--all','--plain','--no-legend','--no-pager'])):
              raw=read(command)
              names=sorted({line.split()[0] for line in (raw or '').splitlines()
                            if line.split() and matches(line.split()[0])})[:60]
              report['systemd'][scope]={'enumeration':'OK' if raw is not None else 'UNAVAILABLE',
                                         'names':names}
          # A differently named unit may describe the independent Watch.
          # Inspect local unit text for keywords but publish file names only.
          for unit_root in ('/etc/systemd/system','/lib/systemd/system'):
              found=[]
              try:
                  for unit in Path(unit_root).glob('*.service'):
                      if unit.is_symlink() or unit.stat().st_size>65536:continue
                      if matches(unit.name) or matches(unit.read_text(errors='replace')):
                          found.append(unit.name)
                  report['systemd'][unit_root]={'enumeration':'OK','matches':sorted(found)[:80]}
              except OSError:
                  report['systemd'][unit_root]={'enumeration':'UNAVAILABLE'}
          containers=read(['docker','ps','-a','--format','{{.Names}}|{{.Image}}|{{.Status}}'])
          report['docker']['enumeration']='OK' if containers is not None else 'UNAVAILABLE'
          report['docker']['matches']=[dict(zip(('name','image','status'),line.split('|',2)))
              for line in (containers or '').splitlines() if matches(line.split('|',1)[0])][:30]
          volumes=read(['docker','volume','ls','--format','{{.Name}}'])
          report['docker']['volume_enumeration']='OK' if volumes is not None else 'UNAVAILABLE'
          report['docker']['matching_volume_names']=[name for name in (volumes or '').splitlines()
              if matches(name)][:30]
          processes=read(['ps','-e','-o','comm='])
          report['process_names']={'enumeration':'OK' if processes is not None else 'UNAVAILABLE',
              'counts':dict(collections.Counter(name.strip() for name in
                  (processes or '').splitlines() if matches(name)).most_common(30))}
          # Argv and environment may carry secrets; scan in memory and emit
          # only PID, executable basename and cgroup basename for matches.
          matches_by_pid=[]
          for proc in Path('/proc').iterdir():
              if not proc.name.isdecimal():continue
              try:
                  cmd=proc.joinpath('cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  if not matches(cmd):continue
                  name=proc.joinpath('comm').read_text().strip()
                  group=proc.joinpath('cgroup').read_text().splitlines()
                  matches_by_pid.append({'pid':int(proc.name),'comm':name[:45],
                      'cgroup_leaf':os.path.basename(group[0].split(':')[-1])[:75] if group else ''})
              except (OSError,UnicodeError):continue
          report['process_names']['cmdline_keyword_metadata']=matches_by_pid[:35]
          for root in ('/opt','/srv','/home'):
              try:
                  report['directories'][root]=[entry.name for entry in Path(root).iterdir()
                       if matches(entry.name)][:30]
              except OSError:
                  report['directories'][root]='UNAVAILABLE'
          for owner,command in (('root',['crontab','-l']),('ssh_user',['sudo','-n','-u',
                  os.environ.get('SUDO_USER','nobody'),'crontab','-l'])):
              raw=read(command)
              matched=[line for line in (raw or '').splitlines()
                       if line.strip() and not line.lstrip().startswith('#') and matches(line)]
              report['crontab'][owner]={'enumeration':'OK' if raw is not None else 'UNAVAILABLE',
                  'matching_entries':len(matched)}
          state=Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
          try:
              if state.is_symlink() or state.stat().st_size>65536:raise ValueError('UNSAFE_STATE')
              release=json.loads(state.read_text())
              keep=('candidate_sha','deploy_sha','validation_status','mode','real_orders_sent','status')
              report['release_state']={'read':'OK',**{key:release.get(key) for key in keep}}
          except (OSError,ValueError,TypeError):report['release_state']={'read':'UNAVAILABLE'}
          inspected=read(['docker','inspect','porota_production_observer','--format','{{json .Config.Env}}'])
          try:
              sha=next((value.split('=',1)[1] for value in json.loads(inspected or '[]')
                  if value.startswith('POROTA_BUILD_SHA=')),'')
              report['release_state']['observer_build_sha']=sha if re.fullmatch('[0-9a-f]{40}',sha) else 'NO_VERIFICADO'
          except (ValueError,TypeError):report['release_state']['observer_build_sha']='NO_VERIFICADO'
          journal=read(['journalctl','-u','porota-preopen-rc6.service','--since',
              '2026-10-26 13:00:00 UTC','--until','2026-10-26 14:00:00 UTC',
              '--no-pager','--output=cat'])
          report['preopen_journal']['enumeration']='OK' if journal is not None else 'UNAVAILABLE'
          if journal:
              selected=[]
              decoder=json.JSONDecoder()
              offset=0
              while offset<len(journal) and len(selected)<12:
                  pos=journal.find('{',offset)
                  if pos<0:break
                  try: entry,end=decoder.raw_decode(journal[pos:])
                  except ValueError:offset=pos+1;continue
                  offset=pos+end
                  if isinstance(entry,dict) and entry.get('schema')=='POROTA_RC6_PREOPEN_V3':
                      selected.append({key:entry.get(key) for key in
                          ('generated_at_ar','phase','status','red_checks','paper_admission_receipt')}
                          |{'release_identity':entry.get('checks',{}).get('release_identity'),
                            'iol_reference_fallback':entry.get('checks',{}).get('iol_reference_fallback'),
                            'paper_focus_contracts':entry.get('checks',{}).get('paper_focus_contracts')})
              report['preopen_journal']['reports']=selected
          print('RC6_PPI_WATCH_INVENTORY='+json.dumps(report,sort_keys=True))
          PYWATCH
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import collections,gzip,hashlib,json,os,re,sqlite3,time
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from rc6_paper_admission_gate import FOCUS,admission_status,focus_contracts
          from decimal import Decimal,InvalidOperation
          from fb_raw_evidence_exact_v1 import manifest_path as exact_history_manifest,object_path as exact_object
          from bu_instrument_catalog import (
              PAPER_PPI_IDENTITY_LKG_SECONDS,
              _candidate_has_ppi_primary,
              _candidate_timestamp_is_fresh,
          )

          now=datetime.now(timezone.utc)
          tz=ZoneInfo('America/Argentina/Buenos_Aires')
          day=now.astimezone(tz).date().isoformat()
          path=Path('/app/data/paper_v17/observer_v17.db')
          db=sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=.3)
          db.row_factory=sqlite3.Row
          db.execute('PRAGMA query_only=ON')
          db.execute('PRAGMA busy_timeout=300')
          deadline=time.monotonic()+25
          db.set_progress_handler(lambda:int(time.monotonic()>deadline),10000)
          db.execute('BEGIN')
          tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          def candidate_reconciliation():
              if not {'financial_instrument_catalog','candidate_identity_v2'}<=tables:
                  return {'state':'EXACT_LEDGER_NOT_PRESENT'}
              refresh='UNKNOWN'
              if 'candidate_refresh_state' in tables:
                  item=db.execute('SELECT state FROM candidate_refresh_state WHERE id=1').fetchone()
                  refresh=str(item[0]) if item else 'MISSING'
              counts=collections.Counter()
              query='''SELECT c.last_seen_at,c.status,c.capability,c.settlement_source,
                        c.metadata_json,l.can_simulate,l.status,l.checked_at
                        FROM financial_instrument_catalog c LEFT JOIN candidate_identity_v2 l
                        ON c.ticker=l.ticker AND c.instrument_type=l.instrument_type
                        AND c.market=l.market AND c.currency=l.currency
                        AND c.settlement=l.settlement'''
              for seen,catalog_status,capability,source,metadata,ready,status,checked in db.execute(query):
                  counts['catalog_rows']+=1
                  if ready is None:
                      counts['exact_missing']+=1
                      continue
                  if not ready:
                      counts['exact_blocked']+=1
                      continue
                  counts['exact_ready']+=1
                  if status!='AVAILABLE':counts['ready_status_mismatch']+=1
                  if catalog_status!='AVAILABLE' or not str(capability).startswith('READY_PAPER_'):
                      counts['ready_contract_mismatch']+=1
                  if not _candidate_has_ppi_primary(source,metadata):
                      counts['ready_nonprimary']+=1
                  if not _candidate_timestamp_is_fresh(seen,checked,PAPER_PPI_IDENTITY_LKG_SECONDS):
                      counts['ready_invalid_at_writer_clock']+=1
                  if _candidate_timestamp_is_fresh(seen,now.isoformat(),86400):
                      counts['ready_fresh_24h']+=1
                  elif _candidate_timestamp_is_fresh(seen,now.isoformat(),PAPER_PPI_IDENTITY_LKG_SECONDS):
                      counts['ready_document_stale_writer_lkg_valid']+=1
                  else:
                      counts['ready_identity_expired_or_invalid_now']+=1
              counts['orphan_exact_rows']=db.execute('''SELECT COUNT(*) FROM candidate_identity_v2 l
                  WHERE NOT EXISTS(SELECT 1 FROM financial_instrument_catalog c
                    WHERE c.ticker=l.ticker AND c.instrument_type=l.instrument_type
                    AND c.market=l.market AND c.currency=l.currency
                    AND c.settlement=l.settlement)''').fetchone()[0]
              return {'state':'SNAPSHOT' if refresh in {'COMPLETE','UNKNOWN'} else 'REFRESH_IN_PROGRESS',
                      'refresh_state':refresh,'counts':dict(sorted(counts.items())),
                      'writer_lkg_seconds':PAPER_PPI_IDENTITY_LKG_SECONDS,
                      'document_freshness_seconds':86400,'exact_keys_only':True}
          def today(raw):
              try:
                  d=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
                  return d.tzinfo is not None and d.astimezone(tz).date().isoformat()==day
              except (ValueError,TypeError):return False
          def volume_patterns():
              if not {'ppi_intraday_points','candidate_identity_v2'}<=tables:
                  return {'state':'TABLE_MISSING'}
              grouped=collections.defaultdict(collections.Counter)
              for symbol,family,settlement in FOCUS:
                  identities=db.execute('''SELECT market,currency FROM candidate_identity_v2
                      WHERE ticker=? AND instrument_type=? AND settlement=?
                        AND can_simulate=1 AND status='AVAILABLE' LIMIT 2''',
                      (symbol,family,settlement)).fetchall()
                  if len(identities)!=1:
                      grouped[family]['nonunique_or_blocked_focus']+=1
                      continue
                  market,currency=identities[0]
                  points=db.execute('''SELECT event_at,volume FROM ppi_intraday_points
                      WHERE symbol=? AND asset_class=? AND market=? AND currency=?
                        AND settlement=? ORDER BY event_at DESC LIMIT 120''',
                      (symbol,family,market,currency,settlement)).fetchall()
                  values=[]
                  for event,raw in reversed(points):
                      if today(event):
                          try:values.append(Decimal(str(raw)))
                          except (InvalidOperation,ValueError):grouped[family]['invalid_volume']+=1
                  grouped[family]['identities']+=1
                  grouped[family]['points_today_in_last_120']+=len(values)
                  grouped[family]['truncated_at_120']+=int(len(points)==120)
                  for before,after in zip(values,values[1:]):
                      grouped[family]['increases' if after>before else
                                      'decreases' if after<before else 'unchanged']+=1
              return {'state':'OBSERVED_PATTERNS_ONLY','per_family':{
                  family:dict(sorted(counts.items())) for family,counts in sorted(grouped.items())},
                  'unit':'NO_VERIFICADO','accumulation':'NO_VERIFICADO',
                  'contract_verification':'NOT_GRANTED','provider_requests':0}
          def code(raw):
              s=str(raw or '')
              m=re.match(r'^[A-Z][A-Z0-9_]{2,69}(?=$|[: ;])',s)
              return m.group(0) if m else 'NATURAL_LANGUAGE_OR_OTHER'
          def aggregate(table,fields,at,limit=4000):
              if table not in tables:return {'state':'TABLE_MISSING'}
              rows=[dict(r) for r in db.execute('SELECT '+fields+' FROM '+table+' ORDER BY rowid DESC LIMIT ?',(limit,))]
              selected=[r for r in rows if today(r[at])]
              return {'state':'BOUNDED','sampled':len(rows),'today_in_sample':len(selected),
                      'today_may_be_truncated':len(rows)==limit and today(rows[-1][at]),
                      'latest_at':rows[0][at] if rows else None,'rows':selected}
          def compact(result,group_fields,reason_field=None):
              rows=result.pop('rows',[])
              counts=collections.Counter(tuple(str(r.get(k) or 'UNKNOWN') for k in group_fields) for r in rows)
              result['counts']=[{'group':list(k),'n':v} for k,v in counts.most_common(30)]
              if reason_field:
                  reasons=collections.Counter(code(r.get(reason_field)) for r in rows)
                  result['reason_codes']=[{'code':k,'n':v} for k,v in reasons.most_common(20)]
              return result
          state=db.execute('SELECT mode,session_state,ppi_auth,real_orders_sent,heartbeat_at,last_market_data_at,process_state FROM observer_state WHERE id=1').fetchone()
          assert state and state['mode']=='PRODUCTION_PAPER' and state['real_orders_sent']==0
          worker=None
          if 'intraday_scalping_worker_state' in tables:
              row=db.execute('SELECT heartbeat_at,state,cursor,selected,successful,failed,points_inserted,confirmed_identities,candidates,real_orders_sent FROM intraday_scalping_worker_state WHERE id=1').fetchone()
              worker=dict(row) if row else None
          intraday=[]
          if 'ppi_intraday_contract_state' in tables:
              intraday=[{'state':r[0],'n':r[1],'last_checked_at':r[2]} for r in db.execute(
                  'SELECT state,COUNT(*),MAX(checked_at) FROM ppi_intraday_contract_state GROUP BY state ORDER BY COUNT(*) DESC LIMIT 30')]
          focus=focus_contracts(path)
          candidate_ledger=candidate_reconciliation()
          families=[{'family':r[0],'market':r[1],'status':r[2],
                     'can_simulate':int(r[3]),'n':r[4]}
              for r in db.execute('''SELECT instrument_type,market,status,can_simulate,COUNT(*)
                  FROM candidate_identity_v2 GROUP BY instrument_type,market,status,can_simulate
                  ORDER BY instrument_type,market,status,can_simulate''')]
          archive={'state':'NOT_PRESENT'}
          manifest=exact_history_manifest()
          if manifest.is_file() and not manifest.is_symlink() and manifest.stat().st_size<1024**3:
              try:
                  wal=Path(str(manifest)+'-wal')
                  wal_bytes=wal.stat().st_size if wal.is_file() else 0
                  with sqlite3.connect(manifest.as_uri()+'?mode=ro&immutable=1',uri=True,timeout=.3) as evidence:
                      evidence.execute('PRAGMA query_only=ON')
                      evidence.set_progress_handler(lambda:int(time.monotonic()>deadline),10000)
                      has=evidence.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='exact_attempts_v1'").fetchone()
                      if has:
                          archive={'state':'WAL_NOT_INCLUDED' if wal_bytes else 'COUNTED',
                                   'manifest_bytes':manifest.stat().st_size,'wal_bytes':wal_bytes,
                                   'attempts':[{'origin':r[0],'quality':r[1],'n':r[2]}
                                      for r in evidence.execute('''SELECT origin,quality,COUNT(*)
                                          FROM exact_attempts_v1 GROUP BY origin,quality''')],
                                   'external_objects_verified':'NO_VERIFICADO',
                                   'legacy_version_row_links':'NO_VERIFICADO'}
                          if not wal_bytes:
                              headers=collections.Counter()
                              oldest=newest=None
                              for legacy_id,wrapper,recorded in evidence.execute('''SELECT legacy_id,wrapper_json,recorded_at
                                  FROM exact_attempts_v1 WHERE origin='PPI_HISTORY' AND quality='VALID_PAYLOAD' '''):
                                  if time.monotonic()>deadline:raise sqlite3.OperationalError('bounded census timeout')
                                  headers['valid_attempts']+=1
                                  headers['legacy_id_present']+=int(legacy_id is not None)
                                  try:
                                      body=json.loads(wrapper)
                                      metadata=body.get('metadata') or {}
                                      money=body.get('currency') or (metadata.get('currency') if isinstance(metadata,dict) else None)
                                      headers['explicit_currency']+=int(money in ('ARS','USD','USD_MEP','USD_CCL'))
                                      headers['request_date_range']+=int(bool(body.get('date_from') and body.get('date_to')))
                                  except (ValueError,TypeError,AttributeError):headers['invalid_wrapper']+=1
                                  oldest=recorded if oldest is None or recorded<oldest else oldest
                                  newest=recorded if newest is None or recorded>newest else newest
                              archive['valid_headers']=dict(headers)
                              archive['recorded_at_min_max']=[oldest,newest]
                              samples=[]
                              for wrapper,digest in evidence.execute('''SELECT wrapper_json,inner_sha256
                                  FROM exact_attempts_v1 WHERE origin='PPI_HISTORY' AND quality='VALID_PAYLOAD'
                                  ORDER BY rowid DESC LIMIT 3'''):
                                  if time.monotonic()>deadline:break
                                  obj=exact_object(digest)
                                  if obj.is_symlink() or not obj.is_file() or obj.stat().st_size>1024**2:
                                      samples.append({'state':'OBJECT_UNAVAILABLE_OR_OVERSIZE'});continue
                                  try:
                                      with gzip.open(obj,'rb') as stream:raw=stream.read(512*1024+1)
                                      if len(raw)>512*1024:raise ValueError('DECOMPRESSED_SIZE_CAP')
                                      if hashlib.sha256(raw).hexdigest()!=digest:raise ValueError('HASH_MISMATCH')
                                      payload=json.loads(raw)
                                      head=payload[0] if isinstance(payload,list) and payload else payload
                                      samples.append({'state':'SHA256_VERIFIED',
                                          'wrapper_keys':sorted(json.loads(wrapper))[:35],
                                          'payload_kind':type(payload).__name__,
                                          'row_keys':sorted(head)[:35] if isinstance(head,dict) else []})
                                  except (OSError,ValueError,TypeError):samples.append({'state':'OBJECT_INVALID'})
                              archive['bounded_object_samples']=samples
                      else:archive={'state':'SCHEMA_MISSING'}
              except (OSError,sqlite3.Error):archive={'state':'NO_VERIFICADO'}
          volume=volume_patterns()
          decisions=compact(aggregate('paper_decisions','decided_at,action,reason','decided_at'),['action'],'reason')
          gates=compact(aggregate('trade_gate_evaluations','evaluated_at,final_result,reason','evaluated_at'),['final_result'],'reason')
          scalping=compact(aggregate('scalping_candidates','evaluated_at,asset_class,action,reason','evaluated_at'),['asset_class','action'],'reason')
          fills=compact(aggregate('paper_fills','filled_at,side','filled_at',1000),['side'])
          positions=compact(aggregate('paper_positions','opened_at,asset_class,status','opened_at',1000),['asset_class','status']) if 'paper_positions' in tables else {'state':'TABLE_MISSING'}
          cauciones=compact(aggregate('paper_cauciones','opened_at,status','opened_at',1000),['status'])
          lifecycle=compact(aggregate('paper_family_lifecycle_events','occurred_at,family,to_state','occurred_at',1000),['family','to_state'])
          snapshots=compact(aggregate('market_snapshots','observed_at,source,asset_class','observed_at',500),['source','asset_class'])
          db.close()
          receipt_path=Path('/app/data/deploy/paper_scalping_preopen_gate_v1.json')
          try:
              raw=json.loads(receipt_path.read_text(encoding='utf-8'))
              receipt={k:raw.get(k) for k in ('status','candidate_sha','trade_day_ar','issued_at_ar','phase','reason')}
          except (OSError,ValueError,TypeError):receipt={'status':'NO_VERIFICADO'}
          allowed,reason=admission_status(now=now.astimezone(tz))
          result={'schema':'rc6-a93-open-paper-admission-readonly-v1','at_utc':now.isoformat(),
                  'at_ar':now.astimezone(tz).isoformat(),'day_ar':day,'observer':dict(state),
                  'build_sha':os.getenv('POROTA_BUILD_SHA','NO_VERIFICADO'),
                  'admission':{'allowed':allowed,'reason':reason,'receipt':receipt},
                  'focus_contracts':focus,'intraday_contract_states':intraday,
                  'candidate_ledger':candidate_ledger,'family_matrix':families,
                  'external_history_archive':archive,
                  'volume_patterns':volume,
                  'scalping_worker':worker,'decisions':decisions,'gates':gates,'scalping':scalping,
                  'fills':fills,'positions':positions,'cauciones':cauciones,'lifecycle':lifecycle,
                  'market_snapshots':snapshots,'read_only':True,'provider_requests':0,
                  'ppi_watch_accessed':True,'ppi_watch_access_scope':'HOST_METADATA_ONLY',
                  'ppi_watch_mutated':False,'real_routes':'NOT_CALLED'}
          print('RC6_OPEN_ADMISSION='+json.dumps(result,sort_keys=True,ensure_ascii=False,default=str))
          PY
          REMOTE

      - name: Link diagnostic run from the canonical issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          outcome = os.environ['PROBE_OUTCOME']
          if outcome not in {'success', 'failure', 'skipped', 'cancelled'}:
              raise SystemExit('INVALID_PROBE_OUTCOME')
          run_id = os.environ['RUN_ID']
          sha = os.environ['COMMIT_SHA']
          if not run_id.isdecimal() or len(sha) != 40:
              raise SystemExit('INVALID_RUN_IDENTITY')
          body = ('A109 diagnóstico POSTCLOSE/PREOPEN de sólo lectura en el '
                  'droplet (sin promoción ni mutación del host). '
                  'probe=' + outcome + '; SHA diagnóstico=' + sha + '. '
                  'Log y recibos: https://github.com/mbalbo2023/Porota-trading/actions/runs/' + run_id +
                  '. El SHA candidato de #747 no cambia. Interpretar los códigos '
                  'RC6_POSTCLOSE_HOST y RC6_OPEN_ADMISSION antes de decidir el gate.')
          data = json.dumps({'body': body}).encode()
          url = ('https://api.github.com/repos/mbalbo2023/Porota-trading/'
                 'issues/732/comments')
          request = urllib.request.Request(url, data=data, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 201:
                  raise SystemExit('DIAGNOSTIC_LINK_NOT_CREATED')
          PY

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
