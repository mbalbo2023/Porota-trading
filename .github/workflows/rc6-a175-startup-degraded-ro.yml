name: RC6 A175 startup DEGRADED RCA READ ONLY

on:
  push:
    branches: [diagnostic/rc6-a175-startup-degraded-ro-20261028]
    paths: [.github/workflows/rc6-a175-startup-degraded-ro.yml]

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict SSH identity and bounded read-only host diagnosis
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a175_ro"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a175_ro" "$HOME/.ssh/known_hosts"
          timeout --signal=TERM --kill-after=5s 110s ssh -T \
            -i "$HOME/.ssh/rc6_a175_ro" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "$DO_USER@$DO_HOST" \
            'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -B -' <<'PY'
          import fcntl,hashlib,json,os,re,sqlite3,stat,subprocess,sys,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/opt/porota-trading')
          def meta(name):
              with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(
                  'http://169.254.169.254/metadata/v1/'+name,timeout=2) as r:
                  return r.read(64).decode().strip()
          assert meta('id')=='594077619' and meta('region')=='nyc1','DROPLET_IDENTITY_RED'
          lock=Path('/run/lock/porota-rc6-deploy-v2.lock')
          fd=os.open(lock,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
          info=os.fstat(fd)
          assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600
          fcntl.flock(fd,fcntl.LOCK_EX|fcntl.LOCK_NB)
          candidate='b6e6ce75f29fe117aaa42b0bfcd9386ea93a0aa0'
          db=root/'data/paper_v17/observer_v17.db'
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=2)
          c.row_factory=sqlite3.Row
          c.execute('PRAGMA query_only=ON')
          c.execute('PRAGMA busy_timeout=1000')
          c.execute('BEGIN')
          start=__import__('time').monotonic()
          c.set_progress_handler(lambda:int(__import__('time').monotonic()-start>15),1000)
          state=dict(c.execute('SELECT mode,process_state,session_state,ppi_auth,heartbeat_at,real_orders_sent,detail FROM observer_state WHERE id=1').fetchone())
          assert state['mode']=='PRODUCTION_PAPER' and state['real_orders_sent']==0,'PAPER_SAFETY_RED'
          detail=state.pop('detail')
          state['detail_code']='CAUCION_LEDGER_INVALID' if detail.startswith('CAUCION_LEDGER_INVALID:') else 'OTHER'
          state['detail_sha256']=hashlib.sha256(detail.encode()).hexdigest()
          positions=c.execute('SELECT * FROM paper_cauciones').fetchall()
          ledger={'positions':len(positions),'statuses':dict(c.execute('SELECT status,count(*) FROM paper_cauciones GROUP BY status').fetchall())}
          try:
              sys.path.insert(0,str(root))
              from bt_caucion_paper import paper_caucion_economic_projection
              projected=paper_caucion_economic_projection(c,positions)
              ledger['projection']='GREEN'
              ledger['scope_counts']={s:sum(p.get('fee_evidence_scope')==s for p in projected)
                                      for s in sorted({p.get('fee_evidence_scope') for p in projected})}
          except Exception as exc:
              value=str(exc).split(':',2)
              ledger['projection']='RED'
              ledger['exception']=type(exc).__name__
              ledger['reason_code']=re.sub('[^A-Z0-9_]+','_',value[-1].strip().upper())[:100]
              ledger['message_sha256']=hashlib.sha256(str(exc).encode()).hexdigest()
          finally:
              c.close()
          def inspect(name):
              p=subprocess.run(['docker','inspect','--format','{{json .State}}',name],
                               capture_output=True,text=True,timeout=7)
              if p.returncode or len(p.stdout)>8192: return {'inspect':'RED'}
              v=json.loads(p.stdout)
              return {'status':v.get('Status'),'oom':v.get('OOMKilled'),
                      'exit_code':v.get('ExitCode'),'restarts':v.get('Restarting')}
          rows={'schema':'rc6.a175.startup-degraded-ro.v1','candidate_sha':candidate,
                'at_utc':datetime.now(timezone.utc).isoformat(),
                'droplet':{'id':'594077619','region':'nyc1'},
                'state':state,'caucion_ledger':ledger,
                'containers':{n:inspect(n) for n in
                    ('porota_critical_approval_rc6','porota_production_dashboard')},
                'barrier_present':Path('/run/lock/porota-rc6-deploy-v2-attempt.json').exists(),
                'disk_free_bytes':__import__('shutil').disk_usage('/').free,
                'host_mutations':0,'ppi_watch':'UNTOUCHED','real_orders_sent':0,
                'operational_go':False}
          print('RC6_A175_DIAG_RO='+json.dumps(rows,sort_keys=True,separators=(',',':')))
          PY
          rm -f "$HOME/.ssh/rc6_a175_ro"
