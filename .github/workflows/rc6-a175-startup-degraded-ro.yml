name: RC6 A175 startup DEGRADED RCA READ ONLY

on:
  push:
    branches: [diagnostic/rc6-a175-startup-degraded-ro-20261028]
    paths: [.github/workflows/rc6-a175-startup-degraded-ro.yml]

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict SSH identity and bounded read-only host diagnosis
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a175_ro"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a175_ro" "$HOME/.ssh/known_hosts"
          timeout --signal=TERM --kill-after=5s 110s ssh -T \
            -i "$HOME/.ssh/rc6_a175_ro" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "$DO_USER@$DO_HOST" \
            'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -B -' <<'PY'
          import fcntl,hashlib,json,os,re,sqlite3,stat,subprocess,sys,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/opt/porota-trading')
          def meta(name):
              with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(
                  'http://169.254.169.254/metadata/v1/'+name,timeout=2) as r:
                  return r.read(64).decode().strip()
          assert meta('id')=='594077619' and meta('region')=='nyc1','DROPLET_IDENTITY_RED'
          lock=Path('/run/lock/porota-rc6-deploy-v2.lock')
          fd=os.open(lock,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
          info=os.fstat(fd)
          assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600
          fcntl.flock(fd,fcntl.LOCK_EX|fcntl.LOCK_NB)
          candidate='b6e6ce75f29fe117aaa42b0bfcd9386ea93a0aa0'
          db=root/'data/paper_v17/observer_v17.db'
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=2)
          c.row_factory=sqlite3.Row
          c.execute('PRAGMA query_only=ON')
          c.execute('PRAGMA busy_timeout=1000')
          c.execute('BEGIN')
          start=__import__('time').monotonic()
          c.set_progress_handler(lambda:int(__import__('time').monotonic()-start>15),1000)
          state=dict(c.execute('SELECT mode,process_state,session_state,ppi_auth,heartbeat_at,real_orders_sent,detail FROM observer_state WHERE id=1').fetchone())
          assert state['mode']=='PRODUCTION_PAPER' and state['real_orders_sent']==0,'PAPER_SAFETY_RED'
          detail=state.pop('detail')
          state['detail_code']='CAUCION_LEDGER_INVALID' if detail.startswith('CAUCION_LEDGER_INVALID:') else 'OTHER'
          state['detail_sha256']=hashlib.sha256(detail.encode()).hexdigest()
          recent_events=[dict(r) for r in c.execute(
              "SELECT event_at,event_type FROM paper_events WHERE event_at >= ? "
              "ORDER BY id DESC LIMIT 80",('2026-10-28T23:12:00+00:00',)).fetchall()]
          recent_health=[dict(r) for r in c.execute(
              "SELECT component,state,checked_at,last_success_at FROM api_health "
              "ORDER BY checked_at DESC LIMIT 40").fetchall()]
          positions=c.execute('SELECT * FROM paper_cauciones').fetchall()
          ledger={'positions':len(positions),'statuses':dict(c.execute('SELECT status,count(*) FROM paper_cauciones GROUP BY status').fetchall())}
          try:
              sys.path.insert(0,str(root))
              from bt_caucion_paper import paper_caucion_economic_projection
              projected=paper_caucion_economic_projection(c,positions)
              ledger['projection']='GREEN'
              ledger['scope_counts']={s:sum(p.get('fee_evidence_scope')==s for p in projected)
                                      for s in sorted({p.get('fee_evidence_scope') for p in projected})}
          except Exception as exc:
              value=str(exc).split(':',2)
              ledger['projection']='RED'
              ledger['exception']=type(exc).__name__
              ledger['reason_code']=re.sub('[^A-Z0-9_]+','_',value[-1].strip().upper())[:100]
              ledger['message_sha256']=hashlib.sha256(str(exc).encode()).hexdigest()
          finally:
              c.close()
          def inspect(name):
              p=subprocess.run(['docker','inspect','--format','{{json .State}}',name],
                               capture_output=True,text=True,timeout=7)
              if p.returncode or len(p.stdout)>8192: return {'inspect':'RED'}
              v=json.loads(p.stdout)
              return {'status':v.get('Status'),'oom':v.get('OOMKilled'),
                      'exit_code':v.get('ExitCode'),'restarts':v.get('Restarting')}
          logs=subprocess.run(['docker','logs','--since','2026-10-28T23:12:00Z',
                               '--until','2026-10-28T23:30:00Z','--tail','800',
                               'porota_critical_approval_rc6'],capture_output=True,text=True,
                              timeout=10)
          assert len(logs.stdout)+len(logs.stderr)<262144,'LOG_BOUND_RED'
          log_patterns={pattern:len(re.findall(pattern,logs.stdout+'\n'+logs.stderr)) for pattern in
              ('CAUCION_LEDGER_INVALID','ReadOnlyPolicyViolation','HTTP_BLOCKED',
               'PPI_LOGIN_INTERLOCK','Traceback','TimeoutError','OperationalError',
               'MemoryError','DATA_ERROR','AUTH','error')}
          def sealed(path):
              assert not path.is_symlink() and path.is_file() and path.stat().st_size<65536
              data=path.read_bytes()
              return json.loads(data),hashlib.sha256(data).hexdigest()
          q,qsha=sealed(root/'data/deploy'/('quiescence-'+candidate+'.json'))
          scheduler,ssha=sealed(root/'data/deploy'/('scheduler-suspend-'+candidate+'.json'))
          marker,msha=sealed(root/'data/deploy/CURRENT_STATE_V2.json')
          frozen,fsha=sealed(root/'data/deploy/porota-frozen-candidate.json')
          runtime=q.get('candidate_runtime_after_failure') or {}
          flat=runtime.get('flat_book') or {}
          marker_fields={k:marker.get(k) for k in ('candidate_sha','deploy_sha','image_id',
                         'validation_status','mode','real_orders_sent','ppi_watch_untouched')}
          qfields={k:q.get(k) for k in ('candidate_sha','status','installation_started',
                   'a171_pending_adopted','a171_origin_candidate','a171_origin_sha256',
                   'inflight','runtime_health','market_open_suspended','real_orders_sent',
                   'ppi_watch_accessed')}
          qfields['candidate_image_intent']={k:(q.get('candidate_image_intent') or {}).get(k)
              for k in ('image_id','candidate_tree_sha','manifest_sha256')}
          qfields['candidate_runtime_after_failure']={'status':runtime.get('status'),
              'flat_book':{k:flat.get(k) for k in ('source_sha','process_state',
                 'session_state','real_orders_sent')},
              'critical_capability':(runtime.get('critical_admission') or {}).get('capability'),
              'containers':{n:{k:v.get(k) for k in ('id','image','lifecycle')}
                 for n,v in (runtime.get('containers') or {}).items()}}
          sched_fields={k:scheduler.get(k) for k in ('candidate_sha','status','paused_from',
              'prior_receipt_sha256','a171_running_origin','a171_origin_sha256',
              'rescue_failure_disposition')}
          sched_fields['timer_count']=len(scheduler.get('timers') or [])
          def docker_identity(name):
              p=subprocess.run(['docker','inspect','--format',
                  '{{.Id}} {{.Image}} {{.State.Status}}',name],capture_output=True,
                  text=True,timeout=7)
              return p.stdout.strip().split() if p.returncode==0 else ['RED']
          rows={'schema':'rc6.a175.startup-degraded-ro.v1','candidate_sha':candidate,
                'at_utc':datetime.now(timezone.utc).isoformat(),
                'droplet':{'id':'594077619','region':'nyc1'},
                'state':state,'caucion_ledger':ledger,
                'recent_events':recent_events,'recent_health':recent_health,
                'bounded_log_patterns':log_patterns,
                'provenance':{'quiescence_sha256':qsha,'quiescence':qfields,
                    'scheduler_sha256':ssha,'scheduler':sched_fields,
                    'marker_sha256':msha,'marker':marker_fields,
                    'frozen_sha256':fsha,'frozen':{k:frozen.get(k) for k in
                        ('candidate_sha','candidate_tree_sha','image_id')},
                    'installed_quiescence_sha256':hashlib.sha256((root/'scripts/rc6_deploy_quiescence.py').read_bytes()).hexdigest(),
                    'docker':{n:docker_identity(n) for n in ('porota_production_observer',
                                               'porota_production_dashboard')}},
                'containers':{n:inspect(n) for n in
                    ('porota_critical_approval_rc6','porota_production_dashboard')},
                'barrier_present':Path('/run/lock/porota-rc6-deploy-v2-attempt.json').exists(),
                'disk_free_bytes':__import__('shutil').disk_usage('/').free,
                'host_mutations':0,'ppi_watch':'UNTOUCHED','real_orders_sent':0,
                'operational_go':False}
          print('RC6_A175_DIAG_RO='+json.dumps(rows,sort_keys=True,separators=(',',':')))
          PY
          rm -f "$HOME/.ssh/rc6_a175_ro"
