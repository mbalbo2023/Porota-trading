# ============================================================================
# promote-to-production.yml - Porota Trading v16.2
# ============================================================================
# Promocion = mover codigo de testing a main. NO despliega: eso lo hace
# deploy.yml, a mano y con su propia confirmacion. Separar los dos actos es
# deliberado y es el control que se habia perdido.
name: Promover a produccion

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribi PROMOVER para confirmar'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promover:
    name: testing -> main
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.confirmacion == 'PROMOVER'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testing

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: La suite tiene que pasar ANTES de promover
        env:
          ENVIRONMENT: SANDBOX
          DB_PATH: /tmp/promote.db
          TELEGRAM_CHAT_ID: "0"
        run: pytest -q

      - name: Etiquetar y mergear
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(python -c 'from _version import VERSION; print(VERSION)')
          ETIQUETA="v${VERSION}-$(date +%Y%m%d-%H%M%S)"
          git tag -a "$ETIQUETA" -m "Promocion a produccion por ${{ github.actor }}"
          git push origin "$ETIQUETA"
          git checkout main
          git merge --no-ff testing -m "Promocion $ETIQUETA"
          git push origin main
          echo "ETIQUETA=$ETIQUETA" >> $GITHUB_ENV

      - name: Resumen
        if: always()
        run: |
          echo "### Promocion" >> $GITHUB_STEP_SUMMARY
          echo "- Etiqueta: ${ETIQUETA:-no generada}" >> $GITHUB_STEP_SUMMARY
          echo "- Promovido por: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El codigo esta en main. El despliegue NO se disparo solo:" >> $GITHUB_STEP_SUMMARY
          echo "corre el workflow 'Desplegar al Droplet' escribiendo DESPLEGAR." >> $GITHUB_STEP_SUMMARY
