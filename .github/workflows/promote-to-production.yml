name: Promover a producción

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: Escribí PROMOVER para confirmar
        required: true
        type: string
      rama_origen:
        description: Rama validada que se promueve
        required: true
        default: testing
        type: choice
        options: [testing, develop]
      motivo:
        description: Motivo/evidencia de la promoción
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  verify:
    name: Verificar condiciones de promoción
    runs-on: ubuntu-latest
    steps:
      - name: Confirmación humana
        run: test "${{ inputs.confirmacion }}" = "PROMOVER"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama_origen }}
          fetch-depth: 0

      - name: Verificar CI del commit que se promueve
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          runs="$(gh run list --workflow ci.yml --branch "${{ inputs.rama_origen }}" --limit 20 --json headSha,conclusion --jq '.[] | select(.headSha == env.SHA) | .conclusion')"
          echo "$runs"
          test -n "$runs"
          ! echo "$runs" | grep -qv '^success$'

      - name: Auditoría de promoción
        run: |
          {
            echo "### Promoción solicitada"
            echo "- Rama: ${{ inputs.rama_origen }}"
            echo "- Motivo: ${{ inputs.motivo }}"
            echo "- Solicitante: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Fusionar rama validada en main
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Merge y tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main "${{ inputs.rama_origen }}"
          git checkout main
          git merge --no-ff "origin/${{ inputs.rama_origen }}" -m "Promoción a producción: ${{ inputs.motivo }}"
          git push origin main
          TAG="prod-$(date +%Y%m%d-%H%M%S)"
          git tag -a "$TAG" -m "${{ inputs.motivo }}"
          git push origin "$TAG"
