name: RC6 A155 exact orphan candidate image reclaim

# REVIEW ONLY. A scoped push trigger is added after root checks every guard.
on:
  push:
    branches:
      - audit/rc6-a155-exact-image-reclaim-20261028
    paths:
      - '.github/workflows/rc6-a155-exact-image-reclaim-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  reclaim:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact cleanup code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Hermetic adversarial preflight regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p test_rc6_a155_exact_image_reclaim.py -v

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Remove only two proven orphan candidate images without force
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          timeout --signal=TERM --kill-after=5s 110s \
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 "$DO_USER@$DO_HOST" \
              'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -' \
              < scripts/rc6_a155_exact_image_reclaim.py

      - name: Erase SSH material on ephemeral runner
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
