name: RC6 PPI history runner canonical lock open fix 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-runner-lock-open-fix-20260912.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-open-fix-start-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ingestion branch
        uses: actions/checkout@v4

      - name: Validate corrected wrapper and unit
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/ppi_history_runner_wrapper_rc6.sh
          grep -q 'exec 9<>"$LOCK"' ops/ppi_history_runner_wrapper_rc6.sh
          grep -q '^User=root$' ops/porota-ppi-fullfamily-history-rc6.service

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy corrected wrapper and unit
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            ops/ppi_history_runner_wrapper_rc6.sh "$DO_USER@$DO_HOST:/tmp/ppi_history_runner_wrapper_rc6.sh"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            ops/porota-ppi-fullfamily-history-rc6.service "$DO_USER@$DO_HOST:/tmp/porota-ppi-fullfamily-history-rc6.service"

      - name: Repair lock ownership safely, start, prove first batch and resume
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          SVC=porota-ppi-fullfamily-history-rc6.service
          LOCK=/run/lock/porota-ppi-fullfamily-history.lock
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"
          echo "HOST_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECT" || { echo 'ABORT=HOST_SHA_CHANGED'; exit 31; }

          sudo -n systemctl stop "$SVC" 2>/dev/null || true
          sudo -n systemctl reset-failed "$SVC" 2>/dev/null || true

          # Existing inode only; no O_CREAT. Hold the lock while ownership is
          # normalized so no second writer can race the repair.
          test -e "$LOCK" || { echo 'ABORT=LOCK_FILE_MISSING'; exit 32; }
          exec 9<>"$LOCK"
          flock -w 0 9 || { echo 'ABORT=CANONICAL_HISTORY_LOCK_BUSY'; exit 33; }
          echo "LOCK_BEFORE=$(stat -c '%U:%G:%a:%i' "$LOCK")"
          sudo -n chown root:root "$LOCK"
          sudo -n chmod 0666 "$LOCK"
          echo "LOCK_AFTER=$(stat -c '%U:%G:%a:%i' "$LOCK")"
          flock -u 9

          sudo -n install -m 0755 /tmp/ppi_history_runner_wrapper_rc6.sh /usr/local/sbin/porota-ppi-history-runner-rc6
          sudo -n install -m 0644 /tmp/porota-ppi-fullfamily-history-rc6.service /etc/systemd/system/porota-ppi-fullfamily-history-rc6.service
          rm -f /tmp/ppi_history_runner_wrapper_rc6.sh /tmp/porota-ppi-fullfamily-history-rc6.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl reset-failed "$SVC" || true
          sudo -n systemctl enable "$SVC" >/dev/null

          # Prove that the effective service user can open the exact existing lock inode.
          sudo -n bash -c 'exec 8<>/run/lock/porota-ppi-fullfamily-history.lock; flock -w 0 8; echo ROOT_LOCK_OPEN=PASS; flock -u 8'

          snapshot() {
            sudo -n docker exec -i porota_production_observer python -u - status < /opt/porota-ingest/ppi_history_control_rc6.py 2>/dev/null || true
          }
          integrity() {
            sudo -n docker exec -i porota_production_observer python -u - integrity < /opt/porota-ingest/ppi_history_control_rc6.py
          }

          integrity
          sudo -n systemctl start "$SVC"
          echo 'SYSTEMD_START_REQUESTED=YES'

          FIRST=''
          for _ in $(seq 1 300); do
            ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
            SNAP="$(snapshot)"
            STATUS="$(printf '%s\n' "$SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
            BATCH="$(printf '%s\n' "$SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
            PID="$(printf '%s\n' "$SNAP" | sed -n 's/^PID=//p' | tail -1)"
            echo "CANARY_ACTIVE=$ACTIVE STATUS=${STATUS:-NONE} BATCH=${BATCH:-0} PID=${PID:-0}"
            case "$STATUS" in BLOCKED_*) echo "$SNAP"; sudo -n journalctl -u "$SVC" -n 180 --no-pager; exit 41;; esac
            if [[ "${BATCH:-0}" =~ ^[0-9]+$ ]] && [ "${BATCH:-0}" -ge 1 ] && [[ "${PID:-0}" =~ ^[1-9][0-9]*$ ]]; then FIRST="$SNAP"; break; fi
            if [ "$ACTIVE" = failed ]; then sudo -n journalctl -u "$SVC" -n 180 --no-pager; exit 42; fi
            sleep 2
          done
          test -n "$FIRST" || { echo 'ABORT=NO_FIRST_BATCH'; sudo -n journalctl -u "$SVC" -n 220 --no-pager; exit 43; }
          echo "$FIRST"
          BEFORE_BATCH="$(printf '%s\n' "$FIRST" | sed -n 's/^BATCH=//p' | tail -1)"
          BEFORE_HEARTBEAT="$(printf '%s\n' "$FIRST" | sed -n 's/^HEARTBEAT=//p' | tail -1)"
          echo 'FIRST_COMMITTED_BATCH=YES'
          integrity

          sudo -n systemctl stop "$SVC"
          STOPPED="$(snapshot)"
          echo "$STOPPED"
          STOP_PID="$(printf '%s\n' "$STOPPED" | sed -n 's/^PID=//p' | tail -1)"
          test "${STOP_PID:-0}" = 0 || { echo 'ABORT=PID_SURVIVED_STOP'; exit 51; }
          sudo -n bash -c 'exec 8<>/run/lock/porota-ppi-fullfamily-history.lock; flock -w 0 8; echo LOCK_RELEASE_AFTER_STOP=PASS; flock -u 8'
          integrity
          echo 'CONTROLLED_STOP_INTEGRITY=PASS'

          sudo -n systemctl reset-failed "$SVC" || true
          sudo -n systemctl start "$SVC"
          FINAL=''
          for _ in $(seq 1 300); do
            ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
            SNAP="$(snapshot)"
            STATUS="$(printf '%s\n' "$SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
            BATCH="$(printf '%s\n' "$SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
            HEARTBEAT="$(printf '%s\n' "$SNAP" | sed -n 's/^HEARTBEAT=//p' | tail -1)"
            PID="$(printf '%s\n' "$SNAP" | sed -n 's/^PID=//p' | tail -1)"
            echo "RESUME_ACTIVE=$ACTIVE STATUS=${STATUS:-NONE} BATCH=${BATCH:-0} PID=${PID:-0}"
            case "$STATUS" in BLOCKED_*) echo "$SNAP"; sudo -n journalctl -u "$SVC" -n 180 --no-pager; exit 61;; esac
            if [[ "${BATCH:-0}" =~ ^[0-9]+$ ]] && [ "${BATCH:-0}" -gt "$BEFORE_BATCH" ] && [ "$HEARTBEAT" != "$BEFORE_HEARTBEAT" ] && [[ "${PID:-0}" =~ ^[1-9][0-9]*$ ]]; then FINAL="$SNAP"; break; fi
            case "$STATUS" in API_PASS_COMPLETE|API_PASS_COMPLETE_WITH_ERRORS) FINAL="$SNAP"; break;; esac
            if [ "$ACTIVE" = failed ]; then sudo -n journalctl -u "$SVC" -n 180 --no-pager; exit 62; fi
            sleep 2
          done
          test -n "$FINAL" || { echo 'ABORT=NO_PROGRESS_AFTER_RESTART'; sudo -n journalctl -u "$SVC" -n 220 --no-pager; exit 63; }
          echo "$FINAL"
          integrity
          ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
          STATUS="$(printf '%s\n' "$FINAL" | sed -n 's/^STATUS=//p' | tail -1)"
          echo "SYSTEMD_FINAL_ACTIVE=$ACTIVE"
          if [ "$ACTIVE" = active ]; then
            echo 'RUNNER_LEFT_RUNNING=YES'
          else
            case "$STATUS" in API_PASS_COMPLETE|API_PASS_COMPLETE_WITH_ERRORS) echo 'RUNNER_FINISHED_DURING_CANARY=YES';; *) echo 'ABORT=SERVICE_NOT_ACTIVE_AND_NOT_COMPLETE'; exit 64;; esac
          fi
          echo 'LOCK_OPEN_FIX_CANARY_RESUME=PASS'
          HOST
