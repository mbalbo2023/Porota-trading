name: RC6 IOL source freshness and MCP health read-only

on:
  push:
    branches: [diagnostic/rc6-iol-source-health-ro-20261028]
    paths:
      - .github/workflows/rc6-iol-source-health-readonly-20261028.yml
      - scripts/rc6_iol_source_health_readonly_20261028.py

permissions:
  contents: read
  issues: write

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  source-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_iol_source_health_readonly_20261028.py
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_iol_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_iol_readonly" "$HOME/.ssh/known_hosts"
      - name: Verify exact Droplet and inspect IOL source without host writes
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          timeout --signal=TERM --kill-after=5s 90s \
            ssh -T -i "$HOME/.ssh/rc6_iol_readonly" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 "$DO_USER@$DO_HOST" \
              'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -B -' \
              < scripts/rc6_iol_source_health_readonly_20261028.py \
              | tee "$RUNNER_TEMP/rc6-iol-source-health.jsonl"
          python3 - "$RUNNER_TEMP/rc6-iol-source-health.jsonl" <<'PY'
          import json,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text().splitlines()
          assert len(lines)==1 and lines[0].startswith('RC6_IOL_READONLY=')
          data=json.loads(lines[0].split('=',1)[1])
          assert data['schema']=='RC6_IOL_SOURCE_HEALTH_READONLY_V1'
          assert data['droplet_identity']=={'id':'594077619','region':'nyc1'}
          assert data['paper_safety']=={'mode':'PRODUCTION_PAPER','real_orders_sent':0}
          assert data['mutations']=='NONE' and data['real_routes']=='NOT_CALLED'
          assert data['source_health'] in ('GREEN','AMBER')
          print('RC6_IOL_READONLY_DIAGNOSIS='+data['source_health'])
          PY
      - name: Publish bounded diagnostic receipt on RC6 tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RUNNER_TEMP/rc6-iol-source-health.jsonl" <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          path=Path(sys.argv[1])
          evidence='NO_HOST_RECEIPT'
          if path.is_file():
              lines=path.read_text().splitlines()
              if len(lines)==1 and lines[0].startswith('RC6_IOL_READONLY=') and len(lines[0])<=16000:
                  payload=json.loads(lines[0].split('=',1)[1])
                  if payload.get('schema')=='RC6_IOL_SOURCE_HEALTH_READONLY_V1':
                      evidence=json.dumps(payload,sort_keys=True,separators=(',',':'))
          body=('RC6 IOL read-only source health diagnostic (Action evidence)\n\n'
                f'- Run: {os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n'
                f'- Diagnostic SHA: `{os.environ["GITHUB_SHA"]}`\n'
                '- Host operations: read-only; no OAuth refresh, collector start or execution route.\n'
                '- Host receipt (sanitized):\n\n```json\n'+evidence+'\n```')
          request=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/732/comments',
              data=json.dumps({'body':body}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json',
                       'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=15) as response:
              assert response.status==201
          print('RC6_IOL_DIAGNOSTIC_RECEIPT_PUBLISHED=YES')
          PY
      - name: Clean runner secrets and diagnostic file
        if: always()
        run: rm -f "$HOME/.ssh/rc6_iol_readonly" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/rc6-iol-source-health.jsonl"
