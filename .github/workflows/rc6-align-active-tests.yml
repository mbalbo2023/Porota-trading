name: RC6 align active tests

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-align-active-tests.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
      - name: Align RC6-active tests to intentional semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          # Dashboard tests follow the current canonical, more explicit labels.
          replace('tests/test_dashboard_paper_v1634.py','Operaciones cerradas recientes','Operaciones cerradas hoy')
          replace('tests/test_dashboard_session.py','3. Decisiones — por qué aceptó o rechazó','3. Decisiones en vivo — BUY / HOLD / abstenciones')
          replace('tests/test_dashboard_session.py','2. Operaciones cerradas recientes','2. Operaciones cerradas hoy')

          # Fixtures that isolate ledger/currency/sizing behavior explicitly widen DailyRisk;
          # production keeps the canonical 2.5% hard guard.
          replace('tests/test_open_entry_terms_v17.py',"initial_cash='10000',daily_loss_pct=None)","initial_cash='10000',daily_loss_pct='100')")
          replace('tests/test_partial_allocation_integrity_v17.py',"partial_spot('INMEDIATA', currency)","partial_spot('INMEDIATA', currency, daily_loss_pct='100')")
          replace('tests/test_partial_allocation_integrity_v17.py',"    b.daily_risk = None\n","")

          p='tests/test_production_paper_v1634.py'
          replace(p,
              'from bt_caucion_paper import CaucionOffer, modeled_sale_settlement, pending_proceeds\n',
              'from bt_caucion_paper import CaucionOffer, modeled_sale_settlement, pending_proceeds\nfrom cf_sale_settlement import modeled_sale_settlement_date\n')
          replace(p,
              "    assert restarted._cash(as_of='2026-09-01T00:00:00+00:00',currency=currency)==10000+D(final['net_pnl'])\n",
              "    expected_later=10000+D(final['net_pnl']) if settlement=='INMEDIATA' else before\n    assert restarted._cash(as_of='2026-09-01T00:00:00+00:00',currency=currency)==expected_later\n")
          replace(p,
              "    assert rows[0]['available_at']!=rows[1]['available_at']\n    assert b._cash(as_of=second.observed_at)==before+D(rows[0]['net_proceeds'])\n    assert pending_proceeds(b.store,second.observed_at)==D(rows[1]['net_proceeds'])\n    assert b._cash(as_of='2026-09-01T00:00:00+00:00')==before+sum(D(r['net_proceeds']) for r in rows)\n",
              "    assert rows[0]['available_at'] is None and rows[1]['available_at'] is None\n    assert b._cash(as_of=second.observed_at)==before\n    assert pending_proceeds(b.store,second.observed_at)==sum(D(r['net_proceeds']) for r in rows)\n    assert b._cash(as_of='2026-09-01T00:00:00+00:00')==before\n")

          old='''def test_cotizacion_mep_del_catalogo_no_gasta_ars_ni_usd_generico(tmp_path, real_catalog):
    store = PaperStore(str(tmp_path / "paper.db"))
    raw = next(r for r in real_catalog if r["ticker"] == "AAPLD")
    metadata = catalog.normalize_record(raw, "INMEDIATA", "2026-08-27T13:45:03Z", "test")
    source_at = observer.now_iso()
    q = observer.normalize_quote("AAPLD", "CEDEARS", "INMEDIATA", {"price": 100, "date": source_at},
                                 {"bid": 99, "ask": 100, "bidsize": 10000, "asksize": 10000, "date": source_at}, metadata=metadata)
    broker = PaperBroker(store, initial_cash="1000000", initial_cash_usd="10000")
    assert q.currency == "USD_MEP" and q.contract.currency == "USD_MEP"
    assert broker._open(q, D("0.8"), {})[0] is False
    assert broker._cash(currency="USD") == 10000
    funded = PaperBroker(store, initial_cash_by_currency={"USD_MEP": "10000"})
    assert funded._open(q, D("0.8"), {})[0]
    p = store.open_positions()[0]
    assert p["currency"] == "USD_MEP"
    assert funded._cash() == 1000000
    assert funded._cash(currency="USD_MEP") < 10000
    ccl = replace(q, currency="USD_CCL", contract=replace(q.contract, currency="USD_CCL"))
    assert not funded._close(p, ccl, "TEST")
    closing_at = (datetime.fromisoformat(q.observed_at)+timedelta(minutes=1)).isoformat()
    closing = replace(q, bid=D("110"), ask=D("111"), observed_at=closing_at, book_at=closing_at)
    assert funded._close(p, closing, "TEST")
    closed = store.recent_closed()[0]
    assert funded._cash(currency="USD_MEP", as_of=closing.observed_at) == 10000 + D(closed["net_pnl"])
    assert funded._cash() == 1000000
'''
          new='''def test_cotizacion_mep_del_catalogo_no_gasta_ars_ni_usd_generico(tmp_path, real_catalog):
    store = PaperStore(str(tmp_path / "paper.db"))
    raw = next(r for r in real_catalog if r["ticker"] == "AAPLD")
    metadata = catalog.normalize_record(raw, "INMEDIATA", "2026-08-27T13:45:03Z", "test")
    source_at = observer.now_iso()
    q = observer.normalize_quote("AAPLD", "CEDEARS", "INMEDIATA", {"price": 100, "date": source_at},
                                 {"bid": 99, "ask": 100, "bidsize": 10000, "asksize": 10000, "date": source_at}, metadata=metadata)
    broker = PaperBroker(store, initial_cash="1000000", initial_cash_usd="10000")
    assert q.currency == "USD_MEP" and q.contract.currency == "USD_MEP"
    assert broker._open(q, D("0.8"), {})[0] is False
    assert broker._cash(currency="USD") == 10000
    # No mutar el capital persistido de una moneda en la misma DB: un cambio
    # intradía debe seguir siendo fail-closed. El caso financiado usa otra cuenta PAPER.
    funded_store = PaperStore(str(tmp_path / "funded-mep.db"))
    funded = PaperBroker(funded_store, initial_cash_by_currency={"USD_MEP": "10000"}, daily_loss_pct="100")
    assert funded._open(q, D("0.8"), {})[0]
    p = funded_store.open_positions()[0]
    assert p["currency"] == "USD_MEP"
    assert funded._cash() == 1000000
    assert funded._cash(currency="USD_MEP") < 10000
    ccl = replace(q, currency="USD_CCL", contract=replace(q.contract, currency="USD_CCL"))
    assert not funded._close(p, ccl, "TEST")
    closing_at = (datetime.fromisoformat(q.observed_at)+timedelta(minutes=1)).isoformat()
    closing = replace(q, bid=D("110"), ask=D("111"), observed_at=closing_at, book_at=closing_at)
    assert funded._close(p, closing, "TEST")
    closed = funded_store.recent_closed()[0]
    assert funded._cash(currency="USD_MEP", as_of=closing.observed_at) == 10000 + D(closed["net_pnl"])
    assert funded._cash() == 1000000
'''
          replace(p,old,new)

          replace(p,
              "    broker=PaperBroker(PaperStore(str(tmp_path/'no-risk.db')))\n",
              "    broker=PaperBroker(PaperStore(str(tmp_path/'no-risk.db')),daily_loss_pct=None)\n")
          replace(p,
              '    assert broker._cash(as_of="2026-09-01T00:00:00-03:00") == 10000 + D(broker.store.recent_closed()[0]["net_pnl"])\n',
              '    assert broker._cash(as_of="2026-09-01T00:00:00-03:00") == before\n')
          replace(p,
              '''    # Viernes 6/11 no liquida: jueves T+1 pasa al lunes 9.\n    assert modeled_sale_settlement("A-24HS", "2026-11-05T11:00:00-03:00").startswith("2026-11-09")\n    assert modeled_sale_settlement("A-24HS", "2026-12-30T11:00:00-03:00") is None\n    assert modeled_sale_settlement("PLAZO-DESCONOCIDO", "2026-08-28T11:00:00-03:00") is None\n''',
              '''    # La fecha hábil esperada es diagnóstica; T+1 nunca inventa una hora de acreditación.\n    assert modeled_sale_settlement_date("A-24HS", "2026-11-05T11:00:00-03:00") == "2026-11-09"\n    assert modeled_sale_settlement("A-24HS", "2026-11-05T11:00:00-03:00") is None\n    assert modeled_sale_settlement_date("A-24HS", "2026-12-30T11:00:00-03:00") is None\n    assert modeled_sale_settlement("PLAZO-DESCONOCIDO", "2026-08-28T11:00:00-03:00") is None\n''')
          replace(p,
              '    broker = PaperBroker(PaperStore(path), initial_cash="10000", risk_pct="1",\n                         max_position_pct="1", max_total_exposure_pct="1", slippage_bps="0")\n',
              '    broker = PaperBroker(PaperStore(path), initial_cash="10000", risk_pct="1", daily_loss_pct="100",\n                         max_position_pct="1", max_total_exposure_pct="1", slippage_bps="0")\n')
          replace(p,
              '    broker = PaperBroker(store, initial_cash="1000", risk_pct="1",\n                         max_position_pct="1", max_total_exposure_pct="1",\n                         slippage_bps="0")\n',
              '    broker = PaperBroker(store, initial_cash="1000", risk_pct="1", daily_loss_pct="100",\n                         max_position_pct="1", max_total_exposure_pct="1",\n                         slippage_bps="0")\n')
          replace(p,
              '    broker = PaperBroker(store, max_positions=5)\n',
              '    broker = PaperBroker(store, max_positions=5, daily_loss_pct="100")\n')
          replace(p,
              '    preopen = datetime(2026, 8, 26, 10, 50, tzinfo=observer.TZ)\n    opened = datetime(2026, 8, 26, 11, 5, tzinfo=observer.TZ)\n',
              '    preopen = datetime(2026, 8, 26, 10, 20, tzinfo=observer.TZ)\n    opened = datetime(2026, 8, 26, 10, 35, tzinfo=observer.TZ)\n')

          p='tests/test_single_close_ledger_v17.py'
          replace(p,
              "    assert b._cash(LATER,currency)==10000+D(p['net_pnl'])\n",
              "    later_expected=10000+D(p['net_pnl']) if settlement=='INMEDIATA' else before\n    assert b._cash(LATER,currency)==later_expected\n",
              expected=2)
          PY
          git diff --check
          git diff --stat
      - name: Commit aligned tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Porota RC6 CI'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add tests/
          test -n "$(git status --porcelain)"
          git commit -m 'RC6 tests: align active semantics with fail-closed runtime'
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
