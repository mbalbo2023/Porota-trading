name: RC6 dashboard-only go-live UX deploy 2026-09-06

on:
  push:
    branches:
      - ux/rc6-dashboard-go-live-20260906

permissions:
  contents: read

jobs:
  validate:
    name: Validate dashboard UX candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --label "porota.commit=${GITHUB_SHA}" --label 'porota.scope=DASHBOARD_ONLY_GO_LIVE_UX' -t porota-dashboard-ux:test .
      - name: Compile and run targeted dashboard tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            --entrypoint python porota-dashboard-ux:test -m compileall -q \
              es_dashboard_go_live_ux_rc6.py eq_dashboard_table_layout_rc6.py o_dashboard.py bg_paper_dashboard.py
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            --entrypoint python porota-dashboard-ux:test -m pytest -q -p no:cacheprovider \
              tests/test_dashboard_go_live_ux_rc6.py \
              tests/test_dashboard_truth_layer_rc6.py \
              tests/test_dashboard_table_layout_rc6.py \
              tests/test_dashboard_global_a11y_rc5.py \
              tests/test_dashboard_daily_responsive_hf6.py \
              tests/test_dashboard_ux_logs_cem_hf6.py \
              tests/test_scheduler_dashboard_hf6.py

  deploy-dashboard-only:
    name: Deploy only dashboard container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_dashboard_deploy"
          chmod 600 "$HOME/.ssh/porota_dashboard_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build, preview and activate dashboard candidate only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_dashboard_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'HOST' | tee /tmp/rc6-dashboard-ux-deploy.txt
          set -Eeuo pipefail
          umask 077
          REPO=/opt/porota-trading
          DATA="$REPO/data"
          LIVE_BRANCH='hotfix/rc6-cedear-us-labor-day-20260906'
          LIVE_SHA='db26c76723bb988c956589c572b87cbcb4191731'
          LIVE_IMAGE='porota-trading-bot:17.0.0-rc6'
          CANDIDATE_IMAGE='porota-trading-dashboard:17.0.0-rc6-go-live-ux1'
          ENV_FILE="$DATA/diagnosticos/dashboard_mode_v17.env"
          PREVIEW='porota_dashboard_go_live_ux_preview'
          TMP=''; WT=''; ACTIVATED=0

          start_dashboard() {
            local image="$1"
            sudo -n docker run -d --name porota_production_dashboard \
              --pull never --restart unless-stopped --user botuser --cap-drop ALL \
              --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 \
              --env-file "$ENV_FILE" -v "$DATA:/app/data" \
              --entrypoint python "$image" o_dashboard.py >/dev/null
          }

          verify_data_runtime() {
            local state
            state="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          out=[]
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=30)
              c.execute('PRAGMA query_only=ON'); out.append(c.execute('PRAGMA quick_check').fetchone()[0])
              if p.endswith('observer_v17.db'):
                  row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              c.close()
          print('|'.join(map(str,(*out,*row))))
          PY
          )"
            echo "VERIFY_DB=$state"
            test "$state" = 'ok|ok|PRODUCTION_PAPER|0'
          }

          verify_pages_in_container() {
            local container="$1"
            sudo -n docker exec -i "$container" python - <<'PY'
          import os,re,urllib.request,urllib.parse,json
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          assert token
          def get(path):
              req=urllib.request.Request('http://127.0.0.1:8000'+path,headers={'Authorization':'Bearer '+token,'User-Agent':'PorotaGoLiveUXProof/RC6'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200
                  return r.read(3_000_000).decode('utf-8','replace')
          home=get('/')
          vivo=get('/vivo')
          hist=get('/historicos')
          rep=get('/reportes')
          conf=get('/config')
          sys=get('/sistema?section=introspeccion')
          health=get('/salud')
          assert 'Últimas 5 operaciones PAPER válidas' in home
          assert '5. Motores / workers' not in vivo
          assert 'Base objetiva' not in hist
          assert 'Cobertura' not in hist and 'coverage' not in hist.lower()
          assert 'Fuentes del store canónico' in hist and '<table' in hist
          assert 'BCRA / INDEC / macro y performance vs inflación' in rep
          assert 'Inflación vs performance del bot' in rep
          assert 'IA intradía' in conf and '>OFF<' in conf
          assert 'PAPER_AI_GATE_MODE' not in conf
          assert re.search(r'class=["\'][^"\']*system-nav',sys,re.I)
          assert '<table' in health
          print(json.dumps({'home':len(home),'vivo':len(vivo),'historicos':len(hist),'reportes':len(rep),'config':len(conf),'sistema':len(sys),'salud':len(health)},sort_keys=True))
          print('DASHBOARD_GO_LIVE_UX_PAGE_PROOF=GREEN')
          PY
          }

          rollback_dashboard() {
            echo 'DASHBOARD_UX_ROLLBACK=START'
            sudo -n docker rm -f porota_production_dashboard >/dev/null 2>&1 || true
            start_dashboard "$LIVE_IMAGE"
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)" = "true|$LIVE_IMAGE|0"
            curl -fsS http://127.0.0.1:8000/health >/dev/null
            echo 'DASHBOARD_UX_ROLLBACK=GREEN'
          }

          cleanup() {
            sudo -n docker rm -f "$PREVIEW" >/dev/null 2>&1 || true
            if [ -n "$WT" ] && [ -d "$WT" ]; then git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; fi
            [ -z "$TMP" ] || rmdir "$TMP" >/dev/null 2>&1 || true
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$ACTIVATED" -eq 1 ]; then rollback_dashboard || true; fi
            cleanup
            exit "$rc"
          }
          trap on_exit EXIT

          echo '=== RC6 DASHBOARD-ONLY GO-LIVE UX DEPLOY ==='
          echo "UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "HOST_BRANCH=$(git -C "$REPO" branch --show-current)"
          echo "HOST_SHA=$(git -C "$REPO" rev-parse HEAD)"
          echo "TARGET_BRANCH=$TARGET_BRANCH"
          echo "TARGET_SHA=$TARGET_SHA"
          test "$(git -C "$REPO" branch --show-current)" = "$LIVE_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$LIVE_SHA"
          git -C "$REPO" diff --quiet
          git -C "$REPO" diff --cached --quiet
          test -s "$ENV_FILE"
          test "$(df -P / | awk 'NR==2{gsub("%","",$5); print $5}')" -lt 70
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = "true|$LIVE_IMAGE|0|true"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)" = "true|$LIVE_IMAGE|0"
          test "$(sudo -n docker image inspect "$LIVE_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$LIVE_SHA"
          verify_data_runtime
          test -z "$(sudo -n systemctl list-units --type=service --state=active --no-legend 'porota-a3-history-rc6@*.service' 2>/dev/null | awk '{print $1}' || true)"
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc6.service 2>/dev/null || true)" != active

          git -C "$REPO" fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git -C "$REPO" rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git -C "$REPO" merge-base --is-ancestor "$LIVE_SHA" "$TARGET_SHA"
          TMP="$(mktemp -d "$HOME/porota-dashboard-ux.XXXXXX")"
          WT="$TMP/source"
          git -C "$REPO" worktree add --detach "$WT" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label 'porota.scope=DASHBOARD_ONLY_GO_LIVE_UX' -t "$CANDIDATE_IMAGE" "$WT"
          test "$(sudo -n docker image inspect "$CANDIDATE_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"

          sudo -n docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            --entrypoint python "$CANDIDATE_IMAGE" -m pytest -q -p no:cacheprovider tests/test_dashboard_go_live_ux_rc6.py

          echo '--- PREVIEW ---'
          sudo -n docker run -d --name "$PREVIEW" --pull never --user botuser --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:18000:8000 \
            --env-file "$ENV_FILE" -v "$DATA:/app/data:ro" \
            --entrypoint python "$CANDIDATE_IMAGE" o_dashboard.py >/dev/null
          for _ in $(seq 1 40); do
            if sudo -n docker exec "$PREVIEW" python -c "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)); assert d['status']=='ok'" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          verify_pages_in_container "$PREVIEW"
          sudo -n docker rm -f "$PREVIEW" >/dev/null

          echo '--- ACTIVATE DASHBOARD ONLY ---'
          ACTIVATED=1
          sudo -n docker rm -f porota_production_dashboard >/dev/null
          start_dashboard "$CANDIDATE_IMAGE"
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)" = "true|$CANDIDATE_IMAGE|0"
          test "$(sudo -n docker image inspect "$CANDIDATE_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = "true|$LIVE_IMAGE|0|true"
          verify_pages_in_container porota_production_dashboard
          verify_data_runtime
          curl -fsS http://127.0.0.1:8000/health
          echo
          echo "OBSERVER_SHA_UNCHANGED=$LIVE_SHA"
          echo "DASHBOARD_SHA=$TARGET_SHA"
          echo 'OBSERVER_RESTARTED=NO'
          echo 'STRATEGY_CHANGED=NO'
          echo 'REAL_ORDER_CAPABILITY=BLOCKED'
          echo 'DASHBOARD_ONLY_UX_DEPLOY=GREEN'
          HOST

          {
            echo '### RC6 dashboard-only go-live UX deploy'
            echo '```text'
            sed -n '1,1800p' /tmp/rc6-dashboard-ux-deploy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
