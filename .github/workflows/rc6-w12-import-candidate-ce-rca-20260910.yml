name: RC6 W12 Candidate CE RCA 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-import-candidate-ce-rca-20260910.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert RC6 PAPER safety
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect candidate schema and CE module without writes
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          DB="$ROOT/data/paper_v17/observer_v17.db"
          CONTAINER=porota_production_observer

          echo '=== CANDIDATE_UNIVERSE_SCHEMA ==='
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True); c.execute('pragma query_only=on')
          print('EXISTS='+str(bool(c.execute("select 1 from sqlite_master where type='table' and name='candidate_universe'").fetchone())))
          for r in c.execute('pragma table_info(candidate_universe)'): print('COL='+repr(tuple(r)))
          try:
              rows=c.execute("SELECT ticker,instrument_type,market,settlement,status FROM candidate_universe WHERE status='AVAILABLE' LIMIT 3").fetchall()
              print('IMPORTER_CANDIDATE_QUERY=OK rows='+str(len(rows)))
          except Exception as e:
              print('IMPORTER_CANDIDATE_QUERY=FAIL '+type(e).__name__+':'+str(e))
          c.close()
          PY

          echo '=== CE_MODULE_PATH_AND_RELEVANT_SOURCE ==='
          sudo -n docker exec -i "$CONTAINER" python - <<'PY'
          import inspect,cp_contract_evidence_v2_hf6 as ce
          print('MODULE='+str(inspect.getsourcefile(ce)))
          for name in ('start_run','finish_run','record_snapshot','normalize_family'):
              fn=getattr(ce,name,None)
              print('--- '+name+' ---')
              print(inspect.getsource(fn) if fn else 'MISSING')
          PY

          echo '=== DB_WRITABILITY_CONTEXT_ONLY ==='
          sudo -n stat -c '%A %U:%G %a %n' "$DB"
          sudo -n docker inspect --format='ReadonlyRootfs={{.HostConfig.ReadonlyRootfs}} Image={{.Config.Image}}' "$CONTAINER"

          echo '=== SAFETY ==='
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True); c.execute('pragma query_only=on')
          r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('MODE='+str(r[0] if r else None)); print('REAL_ORDERS_SENT='+str(r[1] if r else None))
          PY
          echo 'MUTATIONS=NONE'
          echo 'IMPORTER_EXECUTED=NO'
          echo 'ORDER_ROUTES=NOT_CALLED'
          HOST
