name: RC6 WS TESTS 12 A875 OFFHOST bounded diagnostic RED only
run-name: A875 NO_GO bounded QA @ ${{ github.sha }}

# The copy on this isolated evidence branch diagnoses the 2026-11-07 WS-12
# timeout. It is NOT a replacement for governed FULL, Predeploy V2, or Deploy.
# The triggering push is confined to one known owner branch and workflow path.
on:
  push:
    branches:
      - work/rc6-a872-offhost-qa-20261107
    paths:
      - .github/workflows/rc6-ws-tests-12-current-contract.yml

permissions:
  contents: read

concurrency:
  group: rc6-a875-bounded-offhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  red-only-offhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Attest exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "mbalbo2023/Porota-trading"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "TREE_SHA=$TREE_SHA" >> "$GITHUB_ENV"
          echo "A875_SOURCE_SHA=$GITHUB_SHA|TREE_SHA=$TREE_SHA|AUTOMATIC_GO=NO"

      - name: Install locked dependencies for offhost tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Run isolated bounded hash-only diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/rc6-a875-sanitized"
          # `unshare` has no network, so neither collection nor test bodies
          # can contact PPI or any other market-data source. On Ubuntu 24.04,
          # AppArmor may forbid unprivileged namespaces. The fallback has
          # privilege only to create a network namespace on this ephemeral
          # GitHub-hosted VM, then DROPS back to the runner user before Python.
          if unshare --user --map-current-user --net -- true >/dev/null 2>&1; then
            namespace=(unshare --user --map-current-user --net --)
          elif sudo -n unshare --net -- true >/dev/null 2>&1; then
            namespace=(sudo -n unshare --net -- runuser --preserve-environment -u "$(id -un)" --)
          else
            echo 'NETWORK_ISOLATION=RED|reason=NAMESPACE_UNAVAILABLE'
            exit 79
          fi

          # The real negative socket probe and ALL pytest work execute in
          # the SAME newly created namespace and as the same non-root UID.
          # sudo's env_reset may discard GitHub variables. Pass ONLY these
          # public identities and local paths as argv after uid drop; never
          # rely on implicit inherited broker/GitHub credentials.
          "${namespace[@]}" env -i \
            "PATH=$PATH" "HOME=$HOME" \
            "GITHUB_SHA=$GITHUB_SHA" "TREE_SHA=$TREE_SHA" \
            "RUNNER_TEMP=$RUNNER_TEMP" "LANG=C.UTF-8" \
            "PYTHONDONTWRITEBYTECODE=1" "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1" \
            bash -Eeuo pipefail <<'ISOLATED_QA'
          if [ "$(id -u)" -eq 0 ]; then
            echo 'NETWORK_ISOLATION=RED|reason=EUID_ZERO'
            exit 79
          fi
          python - <<'PY'
          import errno, socket
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=1)
          except OSError as exc:
              if exc.errno not in {errno.ENETUNREACH, errno.ENETDOWN,
                                   errno.EHOSTUNREACH}:
                  print("NETWORK_ISOLATION=RED|reason=UNEXPECTED_SOCKET_RESULT")
                  raise SystemExit(79)
              print("NETWORK_ISOLATION=GREEN|external_socket=NO_ROUTE")
          else:
              print("NETWORK_ISOLATION=RED|external_socket=OPEN")
              raise SystemExit(79)
          PY
          set +e
          python -m scripts.rc6_ci_parallel_runner \
            --source-sha "$GITHUB_SHA" \
            --source-tree-sha "$TREE_SHA" \
            --repo . --shards 2 --bounded-shard-index 1 \
            --batch-offset 0 --batch-limit 8 --timeout-seconds 90 \
            --diagnostics-dir "$RUNNER_TEMP/rc6-a875-sanitized/diagnostic"
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo 'A875_DIAGNOSTIC=RED|reason=UNEXPECTED_RUNNER_EXIT'
            exit 79
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "rc6-a875-sanitized" / "diagnostic"
          receipt = json.loads((root / "receipt.json").read_text(encoding="utf-8"))
          assert receipt["source_sha"] == os.environ["GITHUB_SHA"]
          assert receipt["source_tree_sha"] == os.environ["TREE_SHA"]
          assert receipt["automatic_go"] is False
          assert receipt["runtime_authority"] is False
          assert receipt["release_gate_activated"] is False
          assert receipt["host_written"] is False
          assert receipt["phase"] in {"FINISHED", "INCOMPLETE"}
          allowed = {"receipt.json", "junit-sanitized.xml"}
          for path in root.rglob("*"):
              if path.is_file():
                  assert (path.name in allowed or path.name.startswith("progress-")
                          and path.name.endswith(".jsonl"))
          print("A875_PROOF=RED|AUTOMATIC_GO=NO|network_off=YES")
          PY
          ISOLATED_QA

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-a875-sanitized-red-${{ github.sha }}
          path: ${{ runner.temp }}/rc6-a875-sanitized/
          retention-days: 7
          if-no-files-found: error

      - name: Deliberate NO_GO even if all selected tests passed
        if: always()
        shell: bash
        run: |
          echo 'A875_DIAGNOSTIC=RED|AUTOMATIC_GO=NO|NOT_FULL_CERTIFICATION'
          exit 1
