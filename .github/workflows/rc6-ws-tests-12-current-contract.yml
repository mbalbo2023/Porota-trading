name: RC6 WS TESTS 12 Current Contract Reconciliation

on:
  push:
    branches:
      - work/ws-tests-12-reconcile-current-contract-20261001
      - integration/rc6-a757-expanded-20261107
  workflow_dispatch:

permissions:
  contents: read

# QA-only: replace obsolete runs for this same ref. This group must never
# overlap the globally serialized Deploy V2 mutex rc6-unified-paper-deploy.
concurrency:
  group: rc6-ws-tests-12-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact candidate checkout and tree (runner-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "mbalbo2023/Porota-trading"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "RC6_PREARTIFACT_QA_SOURCE=GREEN|sha=$GITHUB_SHA|tree=$TREE_SHA|host_written=NO|artifact=NONE"
      - name: PAPER guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          git diff --check
      - name: Setup Python and cache exact locked dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install exact locked dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.lock.txt
      - name: Reconciled legacy assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q             tests/test_candle_archive_v17.py::test_panel_no_presenta_muestras_como_cobertura_validada             tests/test_rc6_operational_scope.py             tests/test_rc6_table_headers_visible_sticky.py
          echo WS_TESTS_12_FOCAL=GREEN

  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact candidate checkout and tree (runner-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "mbalbo2023/Porota-trading"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "RC6_PREARTIFACT_QA_SOURCE=GREEN|sha=$GITHUB_SHA|tree=$TREE_SHA|host_written=NO|artifact=NONE"
      - name: Setup Python and cache exact locked dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install exact locked dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.lock.txt
      - name: Full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q
          echo WS_TESTS_12_FULL_SUITE=GREEN
