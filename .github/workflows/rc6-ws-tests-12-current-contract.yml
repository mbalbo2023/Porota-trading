name: RC6 WS TESTS 12 Current Contract Reconciliation

on:
  push:
    branches:
      - work/ws-tests-12-reconcile-current-contract-20261001
      - integration/rc6-a757-expanded-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A979: pip hooks, collection and tests are arbitrary code. Publication
      # HOLD alone cannot protect runner credentials or public Actions logs.
      # Keep this before checkout and all candidate execution until separately
      # constrained test UID/sandbox custody has been proved in real Actions.
      - name: BLOCKED QA execution without independent custody
        id: execution_custody
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RC6_QA_EXECUTION=BLOQUEADO|reason=INDEPENDENT_CUSTODY_UNVERIFIED|automatic_go=false'
          exit 79
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact candidate checkout and tree (runner-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "mbalbo2023/Porota-trading"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "RC6_PREARTIFACT_QA_SOURCE=GREEN|sha=$GITHUB_SHA|tree=$TREE_SHA|host_written=NO|artifact=NONE"
      - name: PAPER guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Reconciled legacy assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q             tests/test_candle_archive_v17.py::test_panel_no_presenta_muestras_como_cobertura_validada             tests/test_rc6_operational_scope.py             tests/test_rc6_table_headers_visible_sticky.py
          echo WS_TESTS_12_FOCAL=GREEN

  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Same entry HOLD as focal: never execute untrusted dependency hooks,
      # collection, pytest or the repository sanitizer under the runner UID.
      # An environment flag or a candidate-written receipt is not custody.
      - name: BLOCKED QA execution without independent custody
        id: execution_custody
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RC6_QA_EXECUTION=BLOQUEADO|reason=INDEPENDENT_CUSTODY_UNVERIFIED|automatic_go=false'
          exit 79
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact candidate checkout and tree (runner-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "mbalbo2023/Porota-trading"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "RC6_PREARTIFACT_QA_SOURCE=GREEN|sha=$GITHUB_SHA|tree=$TREE_SHA|host_written=NO|artifact=NONE"
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Collect exact FULL nodeids privately
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/rc6-a963-private" "$RUNNER_TEMP/rc6-a963-sanitized"
          export RC6_CI_IDENTITY_PROOF=1
          export RC6_CI_SOURCE_SHA="$GITHUB_SHA"
          export RC6_CI_SOURCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          export RC6_CI_MANIFEST_PATH="$RUNNER_TEMP/rc6-a963-private/collected.json"
          # Node IDs may encode fixture inputs; never print/upload raw inventory.
          PYTHONPATH=. pytest -q --collect-only -p scripts.rc6_ci_pytest_identity >/dev/null 2>&1
          test -s "$RC6_CI_MANIFEST_PATH"
          echo 'RC6_FULLSUITE_COLLECTION=CAPTURED_PRIVATE'
      - name: Full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          export RC6_CI_IDENTITY_PROOF=1
          export RC6_CI_SOURCE_SHA="$GITHUB_SHA"
          export RC6_CI_SOURCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          export RC6_CI_MANIFEST_PATH="$RUNNER_TEMP/rc6-a963-private/executed.json"
          set +e
          PYTHONPATH=. pytest -q -p scripts.rc6_ci_pytest_identity -o xfail_strict=true \
            --junitxml="$RUNNER_TEMP/rc6-a963-private/junit.xml"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/rc6-a963-private/pytest.rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo WS_TESTS_12_FULL_SUITE=GREEN
      - name: Sanitize FULL evidence
        if: ${{ always() && steps.execution_custody.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$RUNNER_TEMP/rc6-a963-sanitized"
          PYTHONPATH=. python -m scripts.rc6_ci_fullsuite_evidence \
            --collected "$RUNNER_TEMP/rc6-a963-private/collected.json" \
            --executed "$RUNNER_TEMP/rc6-a963-private/executed.json" \
            --junit "$RUNNER_TEMP/rc6-a963-private/junit.xml" \
            --pytest-rc "$RUNNER_TEMP/rc6-a963-private/pytest.rc" \
            --source-sha "$GITHUB_SHA" \
            --source-tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --out "$RUNNER_TEMP/rc6-a963-sanitized"
      # A976: pytest shares this runner UID and can inject files/symlinks or
      # leave descendants. A sanitized directory name is not custody.
      # No artifact action is permitted until ARC/SEC approve independently
      # constrained test UID + trusted publisher + fixed attestation allowlist.
      # Do not restore recursive upload or trust an environment "verified" flag.
      - name: BLOCKED evidence publication without independent custody
        id: publication_custody
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RC6_EVIDENCE_PUBLICATION=BLOQUEADO|reason=INDEPENDENT_CUSTODY_UNVERIFIED|automatic_go=false'
          exit 79
