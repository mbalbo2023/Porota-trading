name: RC6 WS TESTS 12 Current Contract Reconciliation

on:
  push:
    branches:
      - work/ws-tests-12-reconcile-current-contract-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PAPER guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Reconciled legacy assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q             tests/test_candle_archive_v17.py::test_panel_no_presenta_muestras_como_cobertura_validada             tests/test_rc6_operational_scope.py             tests/test_rc6_table_headers_visible_sticky.py
          echo WS_TESTS_12_FOCAL=GREEN

  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q
          echo WS_TESTS_12_FULL_SUITE=GREEN
