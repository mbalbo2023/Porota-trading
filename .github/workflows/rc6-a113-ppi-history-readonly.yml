name: RC6 A113 PPI history read-only evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-a113-ppi-history-readonly
  cancel-in-progress: false

jobs:
  history:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Pin isolated diagnostic source before credentials
        run: |
          python - <<'PY'
          import os, subprocess
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if (head != os.environ['GITHUB_SHA'] or
                  parent != '55e66d6c72e3cdbda0d6c8a4da561607158f1e8b'):
              raise SystemExit('PPI_HISTORY_AUDIT_SHA_RED')
          print('PPI_HISTORY_AUDIT_SOURCE=ISOLATED')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only market client
        run: python -m pip install --disable-pip-version-check ppi-client==1.3.0 requests==2.34.2
      - name: Capture two exact 365-day requests into disposable evidence
        env:
          PPI_API_KEY: ${{ secrets.PPI_CAPACITY_READONLY_API_KEY }}
          PPI_API_SECRET: ${{ secrets.PPI_CAPACITY_READONLY_API_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          import tempfile
          from pathlib import Path

          from scripts.rc6_history_fresh_probe import main
          from scripts.rc6_history_fresh_verify import verify

          summary_path = Path(os.environ['RUNNER_TEMP']) / 'rc6-ppi-history-a113-summary.json'
          summary = {'state': 'NO_VERIFICADO', 'reason': 'READ_OR_AUTH_FAILED',
                     'source': 'PPI', 'history_v2_writes': 0,
                     'ready_paper_implication': 'NONE', 'execution_allowed': False}
          try:
              with tempfile.TemporaryDirectory(prefix='ppi-history-a113-',
                                               dir=os.environ['RUNNER_TEMP']) as private:
                  root = Path(private)
                  targets = root / 'targets.json'
                  targets.write_text(json.dumps([
                      ['GGAL', 'ACCIONES', 'BYMA', 'ARS', 'A-24HS'],
                      ['GGALD', 'ACCIONES', 'BYMA', 'USD', 'A-24HS'],
                  ]), encoding='utf-8')
                  targets.chmod(0o600)
                  sidecar, receipt = root / 'sidecar.sqlite', root / 'receipt.json'
                  main(['--source', 'PPI', '--targets', str(targets),
                        '--sidecar', str(sidecar), '--receipt', str(receipt)])
                  captured = json.loads(receipt.read_text(encoding='utf-8'))
                  if captured['state'] == 'NO_VERIFICADO':
                      summary.update(reason=captured['reason'], provider_requests=0)
                  else:
                      checked = verify(sidecar)
                      if (checked['state'] != 'EVIDENCE_ONLY_NO_GO' or
                              captured['provider_requests'] != 2 or
                              checked['history_v2_writes'] != 0):
                          raise ValueError('PPI_HISTORY_VERIFY_RED')
                      fields = {'date', 'price', 'volume', 'openingPrice', 'max', 'min',
                                'currency', 'quoteCurrency', 'moneda', 'market',
                                'settlement', 'settlementTerm', 'priceBasis',
                                'adjustmentBasis', 'adjusted', 'publishedAt',
                                'providerAt', 'versionKnownAt'}
                      with sqlite3.connect(sidecar.as_uri() + '?mode=ro&immutable=1',
                                           uri=True) as connection:
                          connection.row_factory = sqlite3.Row
                          captures = connection.execute('''SELECT id, symbol, retained_rows_json,
                              first_known_at, provider_currency_status, price_basis_status,
                              canonical_payload_sha256, status, reason
                              FROM fresh_captures_rc6 ORDER BY symbol''').fetchall()
                          if [item['symbol'] for item in captures] != ['GGAL', 'GGALD']:
                              raise ValueError('PPI_HISTORY_IDENTITY_RED')
                          results = []
                          for item in captures:
                              rows = json.loads(item['retained_rows_json'])
                              known_keys = set().union(*(set(row) for row in rows)) if rows else set()
                              days = connection.execute('''SELECT MIN(economic_day),
                                  MAX(economic_day), COUNT(DISTINCT economic_day)
                                  FROM fresh_row_revisions_rc6 WHERE capture_id=?''',
                                  (item['id'],)).fetchone()
                              results.append({
                                  'symbol': item['symbol'], 'rows': len(rows),
                                  'unique_days': days[2], 'first_day': days[0],
                                  'last_day': days[1], 'known_from_capture_at': item['first_known_at'],
                                  'observed_fields_allowlist': sorted(known_keys & fields),
                                  'unlisted_field_count': len(known_keys - fields),
                                  'row_currency_fields': sum(any(k in row for k in
                                      ('currency', 'quoteCurrency', 'moneda')) for row in rows),
                                  'row_basis_fields': sum(any(k in row for k in
                                      ('priceBasis', 'adjustmentBasis', 'adjusted')) for row in rows),
                                  'row_settlement_fields': sum(any(k in row for k in
                                      ('settlement', 'settlementTerm')) for row in rows),
                                  'row_publication_fields': sum(any(k in row for k in
                                      ('publishedAt', 'providerAt', 'versionKnownAt')) for row in rows),
                                  'currency_status': item['provider_currency_status'],
                                  'basis_status': item['price_basis_status'],
                                  'status': item['status'], 'reason': item['reason'],
                                  'canonical_json_sha256': item['canonical_payload_sha256'],
                              })
                      summary = {'state': 'EVIDENCE_ONLY_NO_GO', 'source': 'PPI',
                                 'provider_requests': 2, 'results': results,
                                 'sidecar_integrity': checked['state'],
                                 'transport_raw_hash_verified': False,
                                 'history_v2_writes': 0, 'ready_paper_implication': 'NONE',
                                 'execution_allowed': False}
          except Exception:
              # Do not print provider errors, URLs, credentials or raw rows.
              print('PPI_HISTORY_AUDIT=NO_VERIFICADO|reason=READ_OR_VERIFY_FAILED')
          summary_path.write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n',
                                  encoding='utf-8')
          summary_path.chmod(0o600)
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a113-ppi-history-readonly-${{ github.sha }}
          path: ${{ runner.temp }}/rc6-ppi-history-a113-summary.json
          if-no-files-found: warn
          retention-days: 7
