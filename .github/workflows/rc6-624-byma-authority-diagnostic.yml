name: RC6 624 BYMA authority one-shot read only

on:
  push:
    branches: [diagnostic/rc6-624-byma-authority-20261020]
    paths:
      - '.github/workflows/rc6-624-byma-authority-diagnostic.yml'
      - 'scripts/rc6_byma_morning_watch.py'

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public decision text on runner
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from html.parser import HTMLParser
          from scripts.rc6_byma_morning_watch import URLS,KEYWORDS,_default_fetch,_visible_text,_stable_page_signature
          for name,url in URLS.items():
              body=_default_fetch(url)
              raw=body.decode('utf-8','replace')
              print('PAGE_STRUCTURE',name,'main_tags',len(re.findall(r'<main(?:\s|>)',raw,re.I)),'article_tags',len(re.findall(r'<article(?:\s|>)',raw,re.I)))
              for m in list(re.finditer(r'<main(?:\s|>)',raw,re.I))[:2]: print('MAIN_TAG',name,raw[m.start():m.start()+220])
              for tag in ('h1','footer'):
                  print('TAG_COUNT',name,tag,len(re.findall(fr'<{tag}(?:\s|>)',raw,re.I)))
              title={'HOURS':'Horarios de negociación, liquidación y Mesa de Entradas','CALENDAR':'Calendario bursátil','COMMUNICATIONS':'Circulares y Comunicados','OPTIONS':'Contratos que otorgan derecho'}[name]
              for m in list(re.finditer(re.escape(title),raw,re.I))[-2:]: print('TITLE_CONTEXT',name,raw[max(0,m.start()-300):m.start()+300].replace('\n',' ')[:600])
              text=' '.join(_visible_text(body).split())
              sentences=re.split(r'(?<=[.!?])\s+|\s{2,}',text)
              relevant=sorted(set(item.strip()[:500] for item in sentences if item.strip() and any(word in item.lower() for word in KEYWORDS)))
              print('PUBLIC_PAGE',name,'bytes',len(body),'text_length',len(text),'signature',_stable_page_signature(body))
              for item in relevant[:24]: print('RELEVANT',name,repr(item[:500]))
          PY
      - name: Strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read bounded watch history and host resource truth
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          timeout 50 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('/opt/porota-trading/data/market')
          latest=root/'byma_morning_watch_latest.json'
          history=root/'byma_morning_watch_history.jsonl'
          print('LATEST_EXISTS',latest.exists(),'HISTORY_EXISTS',history.exists())
          if latest.exists():
              p=json.loads(latest.read_text())
              print('LATEST',json.dumps({k:p.get(k) for k in ('observed_at','state','changed_components','signature','errors','authority_errors','complementary_errors')},sort_keys=True))
              print('PAGES',json.dumps(p.get('pages'),sort_keys=True))
              print('STRUCTURED',json.dumps({k:v for k,v in p.get('structured_byma',{}).items() if k in ('status','identity_count','identity_sha256','record_count','errors')},sort_keys=True))
          if history.exists():
              from collections import deque
              with history.open() as f: rows=list(deque(f,maxlen=12))
              print('HISTORY_TAIL',*[row.strip() for row in rows],sep='\n')
          for name in ('MemTotal','MemAvailable','MemFree','Cached','SReclaimable','SwapTotal','SwapFree'):
              line=next((l for l in Path('/proc/meminfo').read_text().splitlines() if l.startswith(name+':')),None)
              print('MEM',line)
          for name in ('porota_production_observer','porota_production_dashboard'):
              p=subprocess.run(['sudo','-n','docker','inspect','-f','{{.State.Running}}|{{.State.OOMKilled}}|{{.State.RestartCount}}|{{.Id}}',name],capture_output=True,text=True,timeout=5)
              print('CONTAINER',name,p.stdout.strip() if p.returncode==0 else 'UNAVAILABLE:'+p.stderr.strip()[:160])
          for name in ('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6'):
              p=subprocess.run(['sudo','-n','docker','inspect','-f','{{.Id}}|{{.Image}}|{{.State.Status}}|{{.RestartCount}}',name],capture_output=True,text=True,timeout=5)
              print('RUNTIME_IMAGE',name,p.stdout.strip() if p.returncode==0 else p.stderr.strip()[:160])
          p=subprocess.run(['sudo','-n','docker','image','ls','--no-trunc','--format','{{.ID}}|{{.Repository}}:{{.Tag}}|{{.Size}}'],capture_output=True,text=True,timeout=8)
          print('IMAGE_INVENTORY',p.stdout.strip() if p.returncode==0 else p.stderr.strip()[:160])
          import shutil
          print('DISK_FREE',shutil.disk_usage('/').free)
          state=Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
          if state.exists():
              try:
                  s=json.loads(state.read_text())
                  print('DEPLOY_STATE',json.dumps({k:s.get(k) for k in ('candidate_sha','validation_status','image_id','mode','real_orders_sent')},sort_keys=True))
              except (OSError,ValueError): print('DEPLOY_STATE_INVALID')
          p=subprocess.run(['sudo','-n','docker','stats','--no-stream','--format','{{.Name}}|{{.MemUsage}}|{{.CPUPerc}}','porota_production_observer','porota_production_dashboard'],capture_output=True,text=True,timeout=12)
          print('DOCKER_STATS',p.stdout.strip() if p.returncode==0 else p.stderr.strip()[:160])
          p=subprocess.run(['ps','-eo','pid,ppid,rss,%cpu,comm','--sort=-rss'],capture_output=True,text=True,timeout=5)
          print('PROCESS_RSS_TOP',*p.stdout.splitlines()[:18],sep='\n')
          PY
          REMOTE
      - name: Read contract timeout progress without mutating ledger
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          timeout 35 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'sudo -n python3 -' <<'PY'
          import json, sqlite3, time, subprocess
          from pathlib import Path
          path=Path('/opt/porota-trading/data/paper_v17/observer_v17.db')
          c=sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=.2)
          c.execute('PRAGMA query_only=ON')
          c.execute('PRAGMA busy_timeout=200')
          def query(label,sql,args=()):
              deadline=time.monotonic()+4
              c.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
              try: print(label,json.dumps([list(x) for x in c.execute(sql,args).fetchall()],default=str))
              except sqlite3.Error as exc: print(label+'_ERROR',type(exc).__name__,str(exc)[:100])
              finally: c.set_progress_handler(None,0)
          query('OBSERVER','SELECT mode,process_state,session_state,real_orders_sent FROM observer_state WHERE id=1')
          query('AVAILABLE_BY_FAMILY',"SELECT instrument_type,count(*) FROM financial_instrument_catalog WHERE status='AVAILABLE' GROUP BY instrument_type ORDER BY instrument_type")
          query('V1_PROGRESS_SINCE_0656',"SELECT instrument_type,count(*),min(checked_at),max(checked_at) FROM contract_evidence WHERE checked_at >= '2026-10-20T06:56:00' GROUP BY instrument_type ORDER BY instrument_type")
          query('V1_LAST_RUNS','SELECT started_at,finished_at,total,verified,blocked_porota,blocked_provider FROM contract_evidence_runs ORDER BY finished_at DESC LIMIT 3')
          query('V2_LAST_RUNS','SELECT job_key,state,records,changed,finished_at FROM contract_evidence_v2_runs ORDER BY finished_at DESC LIMIT 3')
          c.close()
          p=subprocess.run(['journalctl','-k','--since','2026-10-20 06:55:00 UTC','--until','2026-10-20 07:53:00 UTC','--no-pager','-o','cat'],capture_output=True,text=True,timeout=6)
          lines=[x[:200] for x in p.stdout.splitlines() if 'oom' in x.lower() or 'out of memory' in x.lower()]
          print('KERNEL_OOM_LINES',json.dumps(lines[-12:]))
          PY
