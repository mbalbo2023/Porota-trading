name: Legacy deployment disabled for RC6

on:
  workflow_dispatch:

permissions:
  contents: read

# Keep this visible for operators, but fail before accessing host credentials.
# The only RC6 host mutation path is porota-deploy-v2-promote.yml on the
# protected deploy/rc6-pr69-isolated-20260915 branch.
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  legacy-deploy-blocked:
    name: Legacy remote build is prohibited
    runs-on: ubuntu-24.04
    steps:
      - name: Require immutable Deploy V2 path
        run: |
          echo "::error::This legacy workflow cannot deploy RC6. Use the exact-artifact Deploy V2 promotion path."
          exit 1
