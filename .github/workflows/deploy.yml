name: Despliegue de producción

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: Escribí DESPLEGAR para confirmar
        required: true
        type: string
      version:
        description: Tag o rama exacta a desplegar
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Compose en DigitalOcean
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirmación humana
        run: test "${{ inputs.confirmacion }}" = "DESPLEGAR"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Validate production package
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f requirements.txt
          test -f entrypoint.py
          python3 -m compileall -q .

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="/home/tradingbot/app"
            cd "$APP_DIR"
            test -f .env
            grep -q '^ENVIRONMENT=PRODUCTION' .env
            mkdir -p data/backups
            if [ -f data/trading_system.db ]; then
              cp data/trading_system.db "data/backups/pre_deploy_$(date +%Y%m%d-%H%M%S).db"
            fi
            git fetch --tags origin
            git checkout "${{ inputs.version }}"
            docker compose config >/dev/null
            docker compose build
            docker compose up -d
            sleep 10
            docker compose ps
            curl -fsS http://localhost:8000/health >/dev/null
