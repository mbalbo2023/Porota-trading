name: RC6 recover fixed-income reference gaps

on:
  push:
    branches: [diagnostic/rc6-history-ppi-pilot-20261123]
    paths: [scripts/history_ppi_pilot/fixed-income-reference.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.actor == 'mbalbo2023' && github.triggering_actor == 'mbalbo2023' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: operation
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf496483e739c5a2be61d28aba6ad5fdd486c0e1
          path: product
          persist-credentials: false
      - name: Validate the preceding physical deployment and its receipt custody
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: product
        run: |
          set -Eeuo pipefail
          control="../operation/scripts/history_ppi_pilot/fixed-income-reference.json"
          [[ "$(jq -er '.deployment_sha' "$control")" == "$(git rev-parse HEAD)" ]]
          [[ "$(jq -er '.previous_run' "$control")" == "45303731515" ]]
          gh api repos/mbalbo2023/Porota-trading/actions/runs/45303731515 |
            jq -e '.conclusion == "success" and
                   .head_sha == "2968fe4e8151aff0ea6623878f65a823967b873b"'
          mkdir -p "$RUNNER_TEMP/porota" "$RUNNER_TEMP/history-proof"
          gh run download 45303731515 --repo mbalbo2023/Porota-trading \
            --name rc6-history-v2-runtime-45303731515 --dir "$RUNNER_TEMP/history-proof"
          cp "$RUNNER_TEMP/history-proof/runtime.json" "$RUNNER_TEMP/history-proof/download.json" "$RUNNER_TEMP/porota/"
      - name: Apply the checked IOL reference capture without replaying the PPI archive
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        working-directory: product
        run: PYTHONPATH="$PWD" python3 -B ../operation/scripts/history_ppi_pilot/deploy_archive.py --reference-gaps
      - name: Publish the additional fixed-income receipt and full coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-history-fixed-income-reference-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/porota/history-import.json
            ${{ runner.temp }}/porota/history-coverage.jsonl
          if-no-files-found: warn
          retention-days: 30
