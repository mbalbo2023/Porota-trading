name: RC6 IOL host preflight 2026-09-07

on:
  push:
    branches:
      - feature/rc6-iol-history-readonly-20260907

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_iol_preflight"
          chmod 600 "$HOME/.ssh/porota_iol_preflight"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only host readiness check
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_iol_preflight" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/iol-preflight.txt
          set -euo pipefail
          REPO=/opt/porota-trading
          OBS_SHA=5076b6dff8c644ed73160b4148eb7a1cf9ca7e43
          OBS_BRANCH=hotfix/rc6-paper-t1-settlement-20260907
          test "$(git -C "$REPO" branch --show-current)" = "$OBS_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$OBS_SHA"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = 'true|0|true'
          test "$(sudo -n docker image inspect porota-trading-bot:17.0.0-rc6 --format '{{index .Config.Labels "porota.commit"}}')" = "$OBS_SHA"
          state="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import os,sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True)
          c.execute('PRAGMA query_only=ON')
          row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close()
          print('|'.join(map(str,(*row,os.getenv('PAPER_T1_FULL_DATE_RELEASE','')))))
          PY
          )"
          test "$state" = 'PRODUCTION_PAPER|0|true'
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/opt/porota-trading/.env')
          vals={}
          if path.exists():
              for raw in path.read_text(encoding='utf-8',errors='replace').splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key,value=line.split('=',1)
                  vals[key.strip()]=value.strip().strip('"').strip("'")
          print('IOL_USERNAME_PRESENT=' + ('YES' if vals.get('IOL_USERNAME') else 'NO'))
          print('IOL_PASSWORD_PRESENT=' + ('YES' if vals.get('IOL_PASSWORD') else 'NO'))
          print('IOL_CONFIG_KEY_PRESENT=' + ('YES' if 'IOL_ENABLED' in vals else 'NO'))
          PY
          echo OBSERVER_SHA_UNCHANGED="$OBS_SHA"
          echo REAL_ORDERS_SENT=0
          echo HOST_MUTATION=NO
          HOST
          {
            echo '### RC6 IOL host preflight'
            echo '```text'
            cat /tmp/iol-preflight.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
