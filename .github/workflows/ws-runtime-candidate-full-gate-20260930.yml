name: WS Runtime Candidate Full Gate 2026-09-30
on:
  push:
    branches: [fix/ws-runtime-sqlite-contention-20260930]
permissions:
  contents: read
concurrency:
  group: ws-runtime-candidate-full-gate-20260930
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install canonical dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.lock.txt
      - name: Compile candidate
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv|docs)/' .
      - name: Governed tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -Eeuo pipefail
          python -m pytest -q --disable-warnings
