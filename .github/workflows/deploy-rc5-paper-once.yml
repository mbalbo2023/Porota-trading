name: Desplegar POROTA RC5 PAPER autorizado

on:
  push:
    branches:
      - release/v17.0.0-rc5

permissions:
  contents: read

concurrency:
  group: porota-production-paper
  cancel-in-progress: false

jobs:
  validar:
    if: contains(github.event.head_commit.message, '[DEPLOY_RC5_PAPER]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Identidad exacta
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --check
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc5'
          assert _version.IMAGE == 'porota-trading-bot:17.0.0-rc5'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RELEASE_IDENTITY=GREEN')
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y preflight exactos
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -t porota-rc5-deploy:${GITHUB_SHA} .
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            porota-rc5-deploy:${GITHUB_SHA} python rc5_release_preflight.py

      - name: Tests focales sin red
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint bash porota-rc5-deploy:${GITHUB_SHA} -lc '
              python -m pytest -q -p no:cacheprovider \
                test_hf6_history_data912_v2.py \
                tests/test_historical_freshness_v1633.py \
                tests/test_history_close_only_hf2.py \
                tests/test_dashboard_live_policy_hf2.py \
                tests/test_dashboard_live_integration_rc5.py \
                tests/test_forward_lab_metrics_hf2.py \
                tests/test_contract_evidence_hf6.py \
                tests/test_contract_evidence_rc5_runtime.py \
                tests/test_byma_schedule_rc5.py
            '

  desplegar:
    name: Deploy transaccional al Droplet
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preparar SSH estricto
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DO_HOST"
          test -n "$DO_USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_deploy"
          chmod 600 "$HOME/.ssh/porota_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup, activación, Contract Evidence y postflight
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ needs.validar.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          REPO=/opt/porota-trading
          TARGET_SHA="${TARGET_SHA:?}"
          TARGET_BRANCH='release/v17.0.0-rc5'
          TARGET_VERSION='17.0.0-rc5'
          TARGET_IMAGE="porota-trading-bot:${TARGET_VERSION}"
          CURRENT_BRANCH="$(git -C "$REPO" branch --show-current)"
          CURRENT_SHA="$(git -C "$REPO" rev-parse HEAD)"
          CURRENT_IMAGE="$(sudo -n docker inspect -f '{{.Config.Image}}' porota_production_observer)"
          TMP=''
          WT=''
          ACTIVATED=0
          CE_INSTALLED=0

          cleanup() {
            if [ -n "$WT" ] && [ -d "$WT" ]; then
              git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
            fi
            [ -z "$TMP" ] || rmdir "$TMP" >/dev/null 2>&1 || true
          }

          rollback() {
            echo 'ROLLBACK=START'
            sudo -n systemctl disable --now porota-contract-evidence-rc5.timer >/dev/null 2>&1 || true
            git -C "$REPO" checkout -B "$CURRENT_BRANCH" "$CURRENT_SHA"
            git -C "$REPO" branch --set-upstream-to="origin/$CURRENT_BRANCH" "$CURRENT_BRANCH" >/dev/null 2>&1 || true
            sudo -n python3 "$REPO/porota_mode_manager.py" simulation
            echo 'ROLLBACK=DONE'
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              sudo -n systemctl disable --now porota-contract-evidence-rc5.timer >/dev/null 2>&1 || true
              if [ "$ACTIVATED" -eq 1 ]; then rollback || true; fi
            fi
            cleanup
            exit "$rc"
          }
          trap on_exit EXIT

          echo '=== POROTA RC5 PREDEPLOY ==='
          echo "CURRENT_BRANCH=$CURRENT_BRANCH"
          echo "CURRENT_SHA=$CURRENT_SHA"
          echo "CURRENT_IMAGE=$CURRENT_IMAGE"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "TARGET_IMAGE=$TARGET_IMAGE"

          test "$CURRENT_BRANCH" = 'release/v17.0.0-rc4-hf2'
          test "$CURRENT_IMAGE" = 'porota-trading-bot:17.0.0-rc4-hf2'
          test "$TARGET_SHA" != "$CURRENT_SHA"
          git -C "$REPO" diff --quiet
          git -C "$REPO" diff --cached --quiet

          AVAIL_KB="$(df -Pk "$REPO" | awk 'NR==2{print $4}')"
          echo "DISK_AVAIL_KB=$AVAIL_KB"
          test "$AVAIL_KB" -ge 8388608

          OBS_PRE="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)"
          DASH_PRE="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)"
          echo "OBSERVER_PRE=$OBS_PRE"
          echo "DASHBOARD_PRE=$DASH_PRE"
          test "$OBS_PRE" = "true|$CURRENT_IMAGE|0|true"
          test "$DASH_PRE" = "true|$CURRENT_IMAGE|0"

          STATE_PRE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          out=[]
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=20)
              c.execute('PRAGMA query_only=ON')
              out.append(c.execute('PRAGMA quick_check').fetchone()[0])
              if p.endswith('observer_v17.db'):
                  state=c.execute('SELECT mode,ppi_auth,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              c.close()
          print('|'.join(map(str,(*out,*state))))
          PY
          )"
          echo "STATE_PRE=$STATE_PRE"
          printf '%s\n' "$STATE_PRE" | grep -Eq '^ok\|ok\|PRODUCTION_PAPER\|OK\|0$'

          sudo -n systemctl disable --now porota-contract-evidence-hf6.timer >/dev/null 2>&1 || true
          sudo -n systemctl disable --now porota-contract-evidence-rc5.timer >/dev/null 2>&1 || true

          echo 'FETCH_RELEASE=START'
          git -C "$REPO" fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git -C "$REPO" rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git -C "$REPO" cat-file -e "${TARGET_SHA}^{commit}"

          TMP="$(mktemp -d "$HOME/porota-rc5-deploy.XXXXXX")"
          WT="$TMP/source"
          git -C "$REPO" worktree add --detach "$WT" "$TARGET_SHA" >/dev/null
          test "$(git -C "$WT" rev-parse HEAD)" = "$TARGET_SHA"
          python3 - "$WT" <<'PY'
          import sys
          sys.path.insert(0,sys.argv[1])
          import _version
          assert _version.VERSION=='17.0.0-rc5'
          assert _version.IMAGE=='porota-trading-bot:17.0.0-rc5'
          assert _version.MODE=='PRODUCTION_PAPER'
          assert _version.EXECUTION=='SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'
          PY

          echo 'BUILD=START'
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" -t "$TARGET_IMAGE" "$WT"

          echo 'HOST_OFFLINE_TESTS=START'
          sudo -n docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            "$TARGET_IMAGE" python rc5_release_preflight.py
          sudo -n docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint bash "$TARGET_IMAGE" -lc '
              python -m pytest -q -p no:cacheprovider \
                tests/test_history_close_only_hf2.py \
                tests/test_dashboard_live_policy_hf2.py \
                tests/test_dashboard_live_integration_rc5.py \
                tests/test_contract_evidence_hf6.py \
                tests/test_contract_evidence_rc5_runtime.py \
                tests/test_byma_schedule_rc5.py
            '

          echo 'BACKUP_SQLITE=START'
          BACKUP_ID="rc5-predeploy-$(date -u +%Y%m%dT%H%M%SZ)-${CURRENT_SHA:0:12}"
          BACKUP_DIR="/app/data/backups/$BACKUP_ID"
          sudo -n docker exec -i porota_production_observer python - "$BACKUP_DIR" <<'PY'
          import json,sqlite3,sys
          from pathlib import Path
          dest=Path(sys.argv[1]); dest.mkdir(parents=True,exist_ok=False)
          sources={'observer_v17.db':'/app/data/paper_v17/observer_v17.db','market_history.db':'/app/data/market_history.db'}
          result={}
          for name,src in sources.items():
              s=sqlite3.connect(src,timeout=30); d=sqlite3.connect(str(dest/name)); s.backup(d); d.close(); s.close()
              c=sqlite3.connect(f'file:{dest/name}?mode=ro',uri=True); qc=c.execute('PRAGMA quick_check').fetchone()[0]; c.close()
              if qc!='ok': raise RuntimeError(f'BACKUP_QUICK_CHECK_FAILED:{name}:{qc}')
              result[name]={'bytes':(dest/name).stat().st_size,'quick_check':qc}
          (dest/'manifest.json').write_text(json.dumps(result,sort_keys=True,indent=2),encoding='utf-8')
          print('BACKUP_SQLITE=GREEN')
          print('BACKUP_DIR='+str(dest))
          PY

          echo 'ACTIVATION=START'
          git -C "$REPO" checkout -B "$TARGET_BRANCH" "$TARGET_SHA"
          git -C "$REPO" branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH"
          ACTIVATED=1
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation

          HEALTH=0
          for _ in $(seq 1 24); do
            STATUS="$(curl -fsS http://127.0.0.1:8000/health 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)"
            if [ "$STATUS" = 'ok' ]; then HEALTH=1; break; fi
            sleep 5
          done
          test "$HEALTH" -eq 1

          OBS_POST="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)"
          DASH_POST="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)"
          echo "OBSERVER_POST=$OBS_POST"
          echo "DASHBOARD_POST=$DASH_POST"
          test "$OBS_POST" = "true|$TARGET_IMAGE|0|true"
          test "$DASH_POST" = "true|$TARGET_IMAGE|0"

          STATE_POST="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          out=[]
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=20); c.execute('PRAGMA query_only=ON')
              out.append(c.execute('PRAGMA quick_check').fetchone()[0])
              if p.endswith('observer_v17.db'):
                  state=c.execute('SELECT mode,ppi_auth,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              c.close()
          print('|'.join(map(str,(*out,*state))))
          PY
          )"
          echo "STATE_POST=$STATE_POST"
          IFS='|' read -r QC_OBS_POST QC_HIST_POST MODE_POST PPI_AUTH_POST REAL_ORDERS_POST <<<"$STATE_POST"
          test "$QC_OBS_POST" = 'ok'
          test "$QC_HIST_POST" = 'ok'
          test "$MODE_POST" = 'PRODUCTION_PAPER'
          test "$REAL_ORDERS_POST" = '0'
          PHASE_POST="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import co_market_sessions_hf6 as m
          print(m.byma_paper_spot_phase())
          PY
          )"
          echo "MARKET_PHASE_POST=$PHASE_POST"
          if [ "$PHASE_POST" = 'CLOSED' ]; then
            case "$PPI_AUTH_POST" in
              OK|NOT_ATTEMPTED) ;;
              *) echo "PPI_AUTH_POST_INVALID_OFF_MARKET=$PPI_AUTH_POST"; exit 1 ;;
            esac
          else
            test "$PPI_AUTH_POST" = 'OK'
          fi

          ENV_POST="$(sudo -n docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' porota_production_observer | grep -E '^MARKET_(OPEN|CLOSE)_(HOUR|MINUTE)=' | sort | tr '\n' '|')"
          echo "MARKET_ENV_POST=$ENV_POST"
          printf '%s' "$ENV_POST" | grep -Fq 'MARKET_OPEN_HOUR=10|'
          printf '%s' "$ENV_POST" | grep -Fq 'MARKET_OPEN_MINUTE=30|'
          printf '%s' "$ENV_POST" | grep -Fq 'MARKET_CLOSE_HOUR=17|'
          printf '%s' "$ENV_POST" | grep -Fq 'MARKET_CLOSE_MINUTE=0|'

          SCHEDULE_POST="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json
          import co_market_sessions_hf6 as m
          x=m.byma_schedule_status(); x['phase_now']=m.byma_paper_spot_phase()
          print(json.dumps(x,sort_keys=True))
          PY
          )"
          echo "SCHEDULE_POST=$SCHEDULE_POST"
          SCHEDULE_POST="$SCHEDULE_POST" python3 - <<'PY'
          import json,os
          x=json.loads(os.environ['SCHEDULE_POST'])
          assert x['communication']=='19016'
          assert x['interval']=='[10:30,17:00)'
          assert x['unverified_special_sessions']=='FAIL_CLOSED'
          assert x['phase_now']=='CLOSED'
          PY

          echo 'CONTRACT_EVIDENCE_HOST_INSTALL=START'
          sudo -n install -m 0755 "$REPO/scripts/porota_contract_evidence_rc5_runtime.sh" /usr/local/sbin/porota-contract-evidence-rc5-runtime.sh
          sudo -n install -m 0644 "$REPO/deploy/systemd/porota-contract-evidence-rc5.service" /etc/systemd/system/porota-contract-evidence-rc5.service
          sudo -n install -m 0644 "$REPO/deploy/systemd/porota-contract-evidence-rc5.timer" /etc/systemd/system/porota-contract-evidence-rc5.timer
          sudo -n install -d -m 0700 /etc/porota
          printf 'POROTA_CONTRACT_EVIDENCE_EXPECTED_IMAGE=%s\n' "$TARGET_IMAGE" | sudo -n tee /etc/porota/contract-evidence-rc5.env >/dev/null
          sudo -n chmod 0600 /etc/porota/contract-evidence-rc5.env
          sudo -n systemctl daemon-reload
          sudo -n systemctl disable --now porota-contract-evidence-hf6.timer >/dev/null 2>&1 || true
          sudo -n systemctl disable --now porota-contract-evidence-rc5.timer >/dev/null 2>&1 || true
          sudo -n systemctl reset-failed porota-contract-evidence-rc5.service >/dev/null 2>&1 || true
          CE_SINCE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          sudo -n systemctl start porota-contract-evidence-rc5.service
          CE_RESULT="$(sudo -n systemctl show porota-contract-evidence-rc5.service -p Result --value)"
          CE_STATUS="$(sudo -n systemctl show porota-contract-evidence-rc5.service -p ExecMainStatus --value)"
          CE_LOG="$(sudo -n journalctl -u porota-contract-evidence-rc5.service --since "$CE_SINCE" --no-pager -n 80)"
          echo "CE_RESULT=$CE_RESULT"
          echo "CE_EXEC_STATUS=$CE_STATUS"
          printf '%s\n' "$CE_LOG" | grep -E 'STATUS=|DUE_JOBS=|AUTH_BROWSER_STARTED=|PPI_CALLS=|REAL_ORDERS_SENT=' || true
          test "$CE_RESULT" = 'success'
          test "$CE_STATUS" = '0'
          printf '%s\n' "$CE_LOG" | grep -Fq 'STATUS=GREEN_NOT_DUE'
          printf '%s\n' "$CE_LOG" | grep -Fq 'AUTH_BROWSER_STARTED=NO'
          printf '%s\n' "$CE_LOG" | grep -Fq 'PPI_CALLS=0'
          printf '%s\n' "$CE_LOG" | grep -Fq 'REAL_ORDERS_SENT=0'
          CE_INSTALLED=1

          sudo -n systemctl enable --now porota-contract-evidence-rc5.timer >/dev/null
          test "$(sudo -n systemctl is-enabled porota-contract-evidence-rc5.timer)" = 'enabled'
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc5.timer)" = 'active'
          test "$(sudo -n systemctl is-enabled porota-contract-evidence-hf6.timer 2>/dev/null || true)" != 'enabled'

          test "$(git -C "$REPO" branch --show-current)" = "$TARGET_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(sudo -n docker exec -i porota_production_observer python -c 'import _version;print(_version.VERSION)')" = "$TARGET_VERSION"

          echo '=== POROTA RC5 POSTDEPLOY ==='
          echo 'DEPLOY_STATUS=GREEN'
          echo "DEPLOYED_BRANCH=$TARGET_BRANCH"
          echo "DEPLOYED_SHA=$TARGET_SHA"
          echo "DEPLOYED_IMAGE=$TARGET_IMAGE"
          echo "PREVIOUS_SHA=$CURRENT_SHA"
          echo "PREVIOUS_IMAGE=$CURRENT_IMAGE"
          echo "BACKUP_ID=$BACKUP_ID"
          echo 'MODE=PRODUCTION_PAPER'
          echo 'EXECUTION=SIMULATED'
          echo 'REAL_ORDER_CAPABILITY=BLOCKED'
          echo 'REAL_ORDERS_SENT=0'
          echo 'BYMA_PAPER_WINDOW=10:30-17:00'
          echo 'BYMA_SPECIAL_SESSIONS=FAIL_CLOSED'
          echo 'CONTRACT_EVIDENCE=GREEN_NOT_DUE'
          echo 'CONTRACT_EVIDENCE_TIMER=ACTIVE_ENABLED'
          echo 'LEGACY_CE_TIMER=DISABLED'

          ACTIVATED=0
          trap - EXIT
          cleanup
          REMOTE

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo '### POROTA RC5 PAPER — deploy autorizado'
            echo '- SHA: `${{ needs.validar.outputs.sha }}`'
            echo '- Modo: **PRODUCTION_PAPER / SIMULATED**'
            echo '- Órdenes reales: **BLOCKED**'
            echo '- Resultado: **${{ job.status }}**'
          } >> "$GITHUB_STEP_SUMMARY"
