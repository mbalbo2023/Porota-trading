name: RC6 Critical Disk Housekeeping 2026-10-16
on:
  push:
    branches: [ops/rc6-critical-disk-housekeeping-20261016]
    paths: ['.github/workflows/rc6-critical-disk-housekeeping-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Run policy governed cleanup and print summary
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "UTC=$(date -u +%FT%TZ)"
          echo "DISK_BEFORE=$(df -PB1 / | awk 'NR==2{print $4}')"
          echo "LARGE_FILES_BEGIN"
          sudo -n find /opt/porota-trading/data /tmp -xdev -type f -size +100M -printf '%s %p\n' 2>/dev/null | sort -nr | head -25 || true
          echo "LARGE_FILES_END"
          set +e
          sudo -n python3 /opt/porota-trading/scripts/rc6_disk_housekeeping.py --policy /opt/porota-trading/ops/policy/rc6-disk-housekeeping-v1.json --mode cleanup --json-out /tmp/rc6-critical-disk-housekeeping-20261016.json
          RC=$?
          set -e
          echo "HOUSEKEEPING_EXIT=$RC"
          echo "DISK_AFTER=$(df -PB1 / | awk 'NR==2{print $4}')"
          sudo -n python3 - <<'PY'
          import json
          p='/tmp/rc6-critical-disk-housekeeping-20261016.json'
          with open(p) as f:
              data=json.load(f)
          print('HOUSEKEEPING_SUMMARY='+json.dumps(data,sort_keys=True,separators=(',',':')))
          PY
          for name in porota_production_observer porota_production_dashboard; do
            sudo -n docker inspect -f "$name|{{.State.Status}}|OOM={{.State.OOMKilled}}|RESTARTS={{.RestartCount}}" "$name"
          done
          test "$RC" -eq 0
          HOST
      - name: Inspect restore test ownership read only
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          FILE=/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/backups/paper/.restore_test_7.db
          echo "UTC=$(date -u +%FT%TZ)"
          sudo -n stat -c 'RESTORE_TEST=%n|size=%s|mtime=%y|inode=%i' "$FILE" || true
          echo "OPEN_FDS_BEGIN"
          sudo -n python3 - <<'PY'
          import os
          target='/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/backups/paper/.restore_test_7.db'
          try: inode=os.stat(target).st_ino
          except FileNotFoundError: inode=None
          for pid in filter(str.isdigit,os.listdir('/proc')):
              path='/proc/'+pid+'/fd'
              try: fds=os.listdir(path)
              except (PermissionError,FileNotFoundError): continue
              for fd in fds:
                  try:
                      st=os.stat(path+'/'+fd)
                      if st.st_ino!=inode or inode is None: continue
                      comm=open('/proc/'+pid+'/comm').read().strip()
                      print('OPEN_FD='+pid+'/'+fd+'|comm='+comm)
                  except (PermissionError,FileNotFoundError,ProcessLookupError): continue
          PY
          echo "OPEN_FDS_END"
          echo "BACKUP_PROCESSES_BEGIN"
          ps -eo pid,ppid,etime,%cpu,%mem,stat,args --no-headers | awk '/[p]orota|[q]uick_check|[b]ackup/ {print $1,$2,$3,$4,$5,$6,substr($0,index($0,$7))}' | head -20
          echo "BACKUP_PROCESSES_END"
          sudo -n docker top porota_production_observer -eo pid,ppid,etime,%cpu,%mem,stat,comm | head -15
          echo "DISK_FREE=$(df -PB1 / | awk 'NR==2{print $4}')"
          HOST
      - name: Inspect Docker image ownership read only
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "UTC=$(date -u +%FT%TZ)"
          sudo -n docker image ls --no-trunc --format '{{.Repository}}:{{.Tag}}|{{.ID}}|{{.Size}}'
          sudo -n docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}'
          for name in porota_production_observer porota_production_dashboard porota_critical_approval_rc6; do
            sudo -n docker inspect -f "$name|{{.Image}}|{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}" "$name"
          done
          echo "DB_TEMP_BEGIN"
          sudo -n find /opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/backups -type f -name '*.db' -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' | head -20
          echo "DB_TEMP_END"
          echo "DISK_FREE=$(df -PB1 / | awk 'NR==2{print $4}')"
          HOST
      - name: Reclaim verified unused predeploy image only
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          IMAGE=porota-predeploy-v2:5077e22b09b710a4bf0fd81fba52107aa4dfe3ac
          EXPECTED=sha256:41ddee18f0270c4523f138b86be50adc9c16eef07ff6e8998893bfd35419e3ea
          FREE_BEFORE="$(df -PB1 / | awk 'NR==2{print $4}')"
          echo "FREE_BEFORE_IMAGE_CLEANUP=$FREE_BEFORE"
          test "$(sudo -n docker image inspect -f '{{.Id}}' "$IMAGE")" = "$EXPECTED"
          for name in porota_production_observer porota_production_dashboard porota_critical_approval_rc6; do
            test "$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}' "$name")" = "running|false|0"
          done
          STATE="$(sudo -n timeout 12 python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/opt/porota-trading/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=3)
          c.execute('PRAGMA query_only=ON')
          print('|'.join(map(str,c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone())))
          c.close()
          PY
          )"
          test "$STATE" = "PRODUCTION_PAPER|0"
          PPI_BEFORE="$(for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"; done)"
          for cid in $(sudo -n docker ps -aq); do
            test "$(sudo -n docker inspect -f '{{.Image}}' "$cid")" != "$EXPECTED"
          done
          echo "UNUSED_IMAGE_PROOF=GREEN|image=$EXPECTED|containers=0"
          sudo -n docker image rm "$IMAGE"
          sudo -n docker image prune -f
          for name in porota_production_observer porota_production_dashboard porota_critical_approval_rc6; do
            test "$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}' "$name")" = "running|false|0"
          done
          PPI_AFTER="$(for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"; done)"
          test "$PPI_AFTER" = "$PPI_BEFORE"
          FREE_AFTER="$(df -PB1 / | awk 'NR==2{print $4}')"
          echo "FREE_AFTER_IMAGE_CLEANUP=$FREE_AFTER"
          test "$FREE_AFTER" -ge 2147483648
          echo "RC6_CRITICAL_DISK_RECOVERY=GREEN"
          HOST
      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/key"
