name: RC6 Critical Disk Housekeeping 2026-10-16
on:
  push:
    branches: [ops/rc6-critical-disk-housekeeping-20261016]
    paths: ['.github/workflows/rc6-critical-disk-housekeeping-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Run policy governed cleanup and print summary
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "UTC=$(date -u +%FT%TZ)"
          echo "DISK_BEFORE=$(df -PB1 / | awk 'NR==2{print $4}')"
          echo "LARGE_FILES_BEGIN"
          sudo -n find /opt/porota-trading/data /tmp -xdev -type f -size +100M -printf '%s %p\n' 2>/dev/null | sort -nr | head -25 || true
          echo "LARGE_FILES_END"
          set +e
          sudo -n python3 /opt/porota-trading/scripts/rc6_disk_housekeeping.py --policy /opt/porota-trading/ops/policy/rc6-disk-housekeeping-v1.json --mode cleanup --json-out /tmp/rc6-critical-disk-housekeeping-20261016.json
          RC=$?
          set -e
          echo "HOUSEKEEPING_EXIT=$RC"
          echo "DISK_AFTER=$(df -PB1 / | awk 'NR==2{print $4}')"
          sudo -n python3 - <<'PY'
          import json
          p='/tmp/rc6-critical-disk-housekeeping-20261016.json'
          with open(p) as f:
              data=json.load(f)
          print('HOUSEKEEPING_SUMMARY='+json.dumps(data,sort_keys=True,separators=(',',':')))
          PY
          for name in porota_production_observer porota_production_dashboard; do
            sudo -n docker inspect -f "$name|{{.State.Status}}|OOM={{.State.OOMKilled}}|RESTARTS={{.RestartCount}}" "$name"
          done
          test "$RC" -eq 0
          HOST
      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/key"
