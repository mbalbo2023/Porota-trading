name: RC6 Critical control-plane permanent deploy

on:
  push:
    branches: [feature/rc6-critical-telegram-approval-20260907]
    paths:
      - 'POROTA_TRADING_RC6_CONTROL_PLANE_DEPLOY_ARMED_2026-09-07.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: porota-rc6-critical-control-plane-permanent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate one-shot authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          arm='POROTA_TRADING_RC6_CONTROL_PLANE_DEPLOY_ARMED_2026-09-07.md'
          test -f "$arm"
          grep -q '^`CONTROL_PLANE_PROD_DEPLOY=AUTHORIZED_USER`$' "$arm"
          grep -q '^`CANONICAL_TELEGRAM_SINGLE_CONSUMER=AUTHORIZED_USER`$' "$arm"
          source_sha="$(sed -n 's/^SOURCE_SHA=\([0-9a-f]\{40\}\)$/\1/p' "$arm")"
          test -n "$source_sha"
          test "$source_sha" = '${{ github.event.before }}'
          test "$(git diff --name-only "$source_sha" "$GITHUB_SHA")" = "$arm"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_AUTHORIZATION=GREEN"

      - name: Require focused CI GREEN
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.auth.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&per_page=50" > "$RUNNER_TEMP/runs.json"
          python - "$RUNNER_TEMP/runs.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding='utf-8')).get('workflow_runs',[])
          assert any(r.get('name')=='RC6 Critical Telegram approval safety' and r.get('status')=='completed' and r.get('conclusion')=='success' for r in rows)
          print('FOCUSED_CI=GREEN')
          PY

      - name: Deploy isolated control plane over strict SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SOURCE_SHA: ${{ steps.auth.outputs.source_sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: SOURCE_SHA
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/porota-trading
            git fetch origin 'feature/rc6-critical-telegram-approval-20260907' --quiet
            git cat-file -e "${SOURCE_SHA}^{commit}"
            stage="/tmp/porota-critical-control-${SOURCE_SHA}"
            health_probe="/tmp/porota-critical-health-probe-${SOURCE_SHA}.py"
            health_apply="/tmp/porota-critical-health-apply-${SOURCE_SHA}.sh"
            rm -rf "$stage"
            rm -f "$health_probe" "$health_apply"
            umask 077
            mkdir -p "$stage"
            for f in fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py; do
              git show "${SOURCE_SHA}:$f" > "$stage/$f"
            done
            git show "${SOURCE_SHA}:fo_critical_approval_health_rc6.py" > "$health_probe"
            git show "${SOURCE_SHA}:ops/rc6_apply_critical_control_plane_healthcheck.sh" > "$health_apply"
            git show "${SOURCE_SHA}:ops/rc6_deploy_critical_control_plane.sh" > "$stage/rc6_deploy_critical_control_plane.sh"
            chmod 700 "$stage/rc6_deploy_critical_control_plane.sh" "$health_apply"
            SOURCE_SHA="$SOURCE_SHA" REMOTE_STAGE="$stage" LIVE_IMAGE='porota-trading-bot:17.0.0-rc6' GATEWAY_CONTAINER='porota_critical_approval_rc6' "$stage/rc6_deploy_critical_control_plane.sh"
            SOURCE_SHA="$SOURCE_SHA" HEALTH_PROBE_PATH="$health_probe" GATEWAY_CONTAINER='porota_critical_approval_rc6' "$health_apply"
            rm -f "$health_apply"
