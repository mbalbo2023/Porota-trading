name: RC6 history lock holder probe 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-history-lock-holder-probe-20260912.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only lock holder probe
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -u
          echo "AT=$(date -u +%FT%TZ)"
          echo "HOST_SHA=$(git -C /opt/porota-trading rev-parse HEAD)"
          echo '=== DISK ==='
          df -B1 / | tail -1 | awk '{print "ROOT_TOTAL_BYTES="$2" ROOT_USED_BYTES="$3" ROOT_FREE_BYTES="$4" ROOT_USED_PCT="$5}'
          df -h /
          sudo -n du -sb /opt/porota-trading/data 2>/dev/null | awk '{print "DATA_TREE_BYTES="$1}' || true
          echo '=== LOCKS ==='
          sudo -n lslocks 2>/dev/null | grep -E 'porota-ppi-fullfamily-history|porota-trading-history|COMMAND|flock' || true
          echo '=== HOST PROCESS TREE ==='
          ps -eo pid,ppid,pcpu,pmem,stat,wchan:30,etimes,user,args | grep -E 'flock|porota_production_observer.*python|porota-ppi|history-postclose|a3-history|bash -s' | grep -v grep || true
          echo '=== DOCKER TOP ==='
          sudo -n docker top porota_production_observer -eo pid,ppid,pcpu,pmem,stat,etimes,args 2>/dev/null | grep -E 'python|PID' || true
          echo '=== DB FILE STATS ==='
          sudo -n find /opt/porota-trading/data -maxdepth 5 -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -30 || true
          echo '=== HOST DOCKER EXEC IO ==='
          for p in $(pgrep -f '/usr/bin/docker exec -i porota_production_observer python -' 2>/dev/null || true); do
            echo "PID=$p"; sudo -n cat "/proc/$p/io" 2>/dev/null || true
          done
          echo '=== HISTORY SERVICES ==='
          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do systemctl show "$u" -p Id -p ActiveState -p SubState -p Result -p MainPID --no-pager 2>/dev/null || true; done
          echo 'HOST_MUTATION=NONE'
          HOST
