name: RC6 Contract Evidence Immediate Live Repair 2026-09-09

on:
  push:
    branches: [ops/rc6-contract-evidence-immediate-20260909]
    paths:
      - '.github/workflows/rc6-contract-evidence-immediate-live-repair-20260909.yml'

permissions:
  contents: read

jobs:
  repair-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_ce"
          chmod 600 "$HOME/.ssh/porota_ce"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify safety, enable timer, run due collector and prove persistence
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_ce" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "7531cbbb625d124657fb9fbbf38c311740caa486"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'PRE_DB={q}|{mode}|{real}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY

          echo '--- STATIC READ-ONLY SAFETY ---'
          test -f scripts/porota_contract_evidence_trusted_rc4.sh
          test -f rc4_trusted_browser_contract_collector.py
          if grep -REni '/Operar|/Orden|budget_order|confirm_order|cancel_order|masscancel|send_order|place_order' scripts/porota_contract_evidence_trusted_rc4.sh rc4_trusted_browser_contract_collector.py; then
            echo 'CONTRACT_EVIDENCE_SAFETY=RED_FORBIDDEN_ROUTE_OR_ORDER_SYMBOL'
            exit 31
          fi
          echo 'CONTRACT_EVIDENCE_SAFETY=GREEN_READ_ONLY_STATIC'

          echo '--- TIMER BEFORE ---'
          sudo -n systemctl is-enabled porota-contract-evidence-rc4.timer || true
          sudo -n systemctl is-active porota-contract-evidence-rc4.timer || true
          sudo -n systemctl list-timers porota-contract-evidence-rc4.timer --all --no-pager || true
          sudo -n systemctl cat porota-contract-evidence-rc4.timer
          sudo -n systemctl cat porota-contract-evidence-rc4.service

          BEFORE_COUNT=$(sudo -n find /opt/porota-trading/data/contract_evidence/rc4_trusted -maxdepth 1 -type f -name 'contract_*.json' 2>/dev/null | wc -l || true)
          BEFORE_LATEST=$(sudo -n find /opt/porota-trading/data/contract_evidence/rc4_trusted -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@|%p\n' 2>/dev/null | sort -nr | head -1 || true)
          echo "EVIDENCE_BEFORE_COUNT=$BEFORE_COUNT"
          echo "EVIDENCE_BEFORE_LATEST=$BEFORE_LATEST"

          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now porota-contract-evidence-rc4.timer
          sudo -n systemctl reset-failed porota-contract-evidence-rc4.service || true
          sudo -n systemctl start porota-contract-evidence-rc4.service
          sleep 5

          echo '--- SERVICE RESULT ---'
          sudo -n systemctl --no-pager --full status porota-contract-evidence-rc4.service || true
          sudo -n journalctl -u porota-contract-evidence-rc4.service -n 120 --no-pager || true
          echo '--- TIMER AFTER ---'
          test "$(sudo -n systemctl is-enabled porota-contract-evidence-rc4.timer)" = enabled
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc4.timer)" = active
          sudo -n systemctl list-timers porota-contract-evidence-rc4.timer --all --no-pager

          AFTER_COUNT=$(sudo -n find /opt/porota-trading/data/contract_evidence/rc4_trusted -maxdepth 1 -type f -name 'contract_*.json' 2>/dev/null | wc -l || true)
          AFTER_LATEST=$(sudo -n find /opt/porota-trading/data/contract_evidence/rc4_trusted -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@|%p\n' 2>/dev/null | sort -nr | head -1 || true)
          echo "EVIDENCE_AFTER_COUNT=$AFTER_COUNT"
          echo "EVIDENCE_AFTER_LATEST=$AFTER_LATEST"

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          print(f'POST_DB={q}|{mode}|{real}')
          print('CONTRACT_TABLES='+','.join(sorted(t for t in tables if 'contract' in t.lower())))
          for t in sorted(t for t in tables if 'contract' in t.lower()):
              try:
                  n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
                  print(f'CONTRACT_ROWS|{t}|{n}')
              except Exception as e:
                  print(f'CONTRACT_ROWS|{t}|ERROR={type(e).__name__}')
          c.close()
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'SCRAPING_TIMER=ENABLED_ACTIVE'
          echo 'CONTRACT_EVIDENCE_IMMEDIATE_RUN=COMPLETED'
          REMOTE
