name: RC5 - aplicar horario BYMA 19016

on:
  push:
    branches:
      - candidate/rc5-byma-schedule-19016-20260905

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[BYMA-SCHEDULE-APPLIED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/rc5-byma-schedule-19016-20260905
          fetch-depth: 0

      - name: Aplicar reemplazos exactos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace_exact('bf_production_paper_observer.py',
              'MARKET_OPEN_HOUR = int(os.getenv("MARKET_OPEN_HOUR", "11"))',
              'MARKET_OPEN_HOUR = int(os.getenv("MARKET_OPEN_HOUR", "10"))')
          replace_exact('bf_production_paper_observer.py',
              'MARKET_OPEN_MINUTE = int(os.getenv("MARKET_OPEN_MINUTE", "0"))',
              'MARKET_OPEN_MINUTE = int(os.getenv("MARKET_OPEN_MINUTE", "30"))')

          replace_exact('porota_mode_manager.py',
              '"-e", "MARKET_OPEN_HOUR=11",',
              '"-e", "MARKET_OPEN_HOUR=10",')
          replace_exact('porota_mode_manager.py',
              '"-e", "MARKET_OPEN_MINUTE=0",',
              '"-e", "MARKET_OPEN_MINUTE=30",')

          replace_exact('cf_intraday_scalping.py',
              'from bs_instrument_contracts import aware_datetime, family_name\n',
              'from bs_instrument_contracts import aware_datetime, family_name\nfrom co_market_sessions_hf6 import byma_paper_spot_open\n')
          old='''def _market_open(at):\n    local = aware_datetime(at).astimezone(TZ)\n    try:\n        import ak_byma_calendar as calendar\n        if not calendar.es_dia_habil_operativo(local.date()):\n            return False\n    except Exception:\n        if local.weekday() >= 5:\n            return False\n    # El contrato observado comienza a las 10:30. El último punto aceptado es 17:00.\n    return wall_time(10, 30) <= local.time().replace(tzinfo=None) <= wall_time(17, 0)\n'''
          new='''def _market_open(at):\n    # Fuente única RC5: intervalo regular BYMA PAPER [10:30,17:00).\n    return byma_paper_spot_open(aware_datetime(at))\n'''
          replace_exact('cf_intraday_scalping.py', old, new)

          # Ya no se usa wall_time luego de centralizar la sesión.
          replace_exact('cf_intraday_scalping.py',
              'from datetime import datetime, time as wall_time, timedelta, timezone',
              'from datetime import datetime, timedelta, timezone')

          # El gate RC5 debe ejecutar también la prueba del horario centralizado.
          p=Path('.github/workflows/validate-rc5-candidate.yml')
          text=p.read_text(encoding='utf-8')
          needle='''                tests/test_contract_evidence_rc5_runtime.py\n'''
          replacement='''                tests/test_contract_evidence_rc5_runtime.py \\\n                tests/test_byma_schedule_rc5.py\n'''
          if 'tests/test_byma_schedule_rc5.py' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('validate-rc5-candidate.yml: focal insertion point mismatch')
              p.write_text(text.replace(needle,replacement),encoding='utf-8')
          PY

          git diff --check
          python -m py_compile \
            co_market_sessions_hf6.py bq_exit_policy.py rc4_contract_schedule.py \
            bf_production_paper_observer.py porota_mode_manager.py cf_intraday_scalping.py \
            tests/test_byma_schedule_rc5.py

      - name: Ejecutar pruebas focales sin red externa
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q -p no:cacheprovider \
            tests/test_byma_schedule_rc5.py \
            tests/test_intraday_scalping_hf3.py \
            tests/test_contract_evidence_hf6.py \
            tests/test_contract_evidence_rc5_runtime.py \
            tests/test_exit_supervision_v17.py \
            tests/test_production_paper_v1634.py

      - name: Commit de la candidata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bf_production_paper_observer.py porota_mode_manager.py cf_intraday_scalping.py \
            .github/workflows/validate-rc5-candidate.yml
          git diff --cached --check
          git commit -m 'rc5: align runtime clocks to BYMA 10:30-17:00 [BYMA-SCHEDULE-APPLIED]'
          git push origin HEAD:candidate/rc5-byma-schedule-19016-20260905
