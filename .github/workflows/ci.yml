name: CI — Porota Trading

on:
  push:
    branches:
      - main
      - develop
      - testing
  pull_request:
    branches:
      - main
      - develop
      - testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    name: Infrastructure preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository safety
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking tracked secret-bearing files..."
          if git ls-files -z | grep -zE '(^|/)\.env($|\.)|(^|/)(credentials|secrets)[^/]*\.(json|ya?ml|txt)$' >/dev/null; then
            echo "::error::Potential secret-bearing file is tracked."
            exit 1
          fi

          echo "Checking credential-like strings in tracked source/config..."
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|eyJ[A-Za-z0-9_-]{20,}\.' \
             --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' .; then
            echo "::error::Credential-like material detected in tracked source/config."
            exit 1
          fi

          echo "Infrastructure preflight: OK"

      - name: Validate Docker Compose syntax
        run: docker compose config

  application:
    name: Application CI
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect application package
        id: detect
        shell: bash
        run: |
          if [ -f requirements.txt ] && [ -f entrypoint.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Application package not installed yet
        if: steps.detect.outputs.present == 'false'
        run: |
          echo "Application package is not present yet."
          echo "Infrastructure-only validation completed successfully."
          echo "Application tests will activate automatically when the final package is uploaded."

      - name: Setup Python 3.11
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application dependencies
        if: steps.detect.outputs.present == 'true'
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        if: steps.detect.outputs.present == 'true'
        run: python -m compileall -q .

      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        run: pytest -q

      - name: Prepare isolated SANDBOX environment
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          cp .env.example .env
          sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=SANDBOX/' .env
          mkdir -p data sre_vector_db

      - name: Build application image
        if: steps.detect.outputs.present == 'true'
        run: docker compose build

      - name: Start application stack
        if: steps.detect.outputs.present == 'true'
        run: docker compose up -d

      - name: Wait for application health
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Application health: OK"
              exit 0
            fi
            sleep 3
          done
          docker compose logs --tail=150
          exit 1

      - name: Verify no restart loop
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          sleep 10
          test "$(docker inspect porota_trading_bot --format '{{.RestartCount}}')" -eq 0

      - name: Verify SQLite WAL when database module is available
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          docker compose exec -T bot python -c '
          import ac_db
          info = ac_db.healthcheck()
          assert info["ok"]
          assert str(info["journal_mode"]).lower() == "wal"
          print(info)
          '

      - name: Shutdown application stack
        if: always() && steps.detect.outputs.present == 'true'
        run: docker compose down -v
