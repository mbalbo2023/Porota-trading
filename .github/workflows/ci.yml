name: CI — Porota Trading

on:
  push:
    branches: [main, develop, testing]
  pull_request:
    branches: [main, develop, testing]
  workflow_dispatch:

permissions:
  contents: read

# Only a first PR attempt shares a group with the next update to that PR.
# Manual reruns, pushes and dispatches use a group keyed by run ID.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name == 'pull_request' &&
    github.run_attempt == '1' && github.event.number > 0 &&
    format('pr-{0}', github.event.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.number > 0 }}

# Preserve established required check contexts while keeping main control-only.
jobs:
  infrastructure:
    name: Infrastructure preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate repository safety
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking tracked secret-bearing files..."
          if git ls-files -z | grep -zEv '(^|/)\.env\.(example|sample)$' | grep -zE '(^|/)\.env($|\.)|(^|/)(credentials|secrets)[^/]*\.(json|ya?ml|txt)$' >/dev/null; then
            echo "::error::Potential secret-bearing file is tracked."
            exit 1
          fi

          echo "Checking credential-like strings in tracked source/config..."
          scan_status=0
          git grep -qIE 'AIza[0-9A-Za-z_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|eyJ[A-Za-z0-9_-]{20,}\.' \
             -- '*.py' '*.yml' '*.yaml' '*.json' '.env*' '**/.env*' || scan_status=$?
          case "$scan_status" in
            0) echo "::error::Credential-like material detected in tracked source/config."; exit 1 ;;
            1) ;;
            *) echo "::error::Credential scan could not complete."; exit 1 ;;
          esac

          echo "Infrastructure preflight: OK"

  application:
    name: Repository tests / application when present
    runs-on: ubuntu-latest
    needs: infrastructure
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup control-plane Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-control-ci.txt

      - name: Validate pinned control-plane dependencies
        run: python -m scripts.rc6_main_ci_scope validate-control-deps

      - name: Install pinned control-plane test dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements-control-ci.txt

      - name: Compile control-plane code
        run: python -m compileall -q scripts

      - name: Run discovered control-plane tests
        run: python -m scripts.rc6_main_ci_scope test-control

      - name: Record scope of this result
        run: |
          echo 'CONTROL_PLANE_TESTS=EXECUTED|application_build=NOT_APPLICABLE|runtime=NO_VERIFICADO' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release images are built and tested by Predeploy on the application candidate.' >> "$GITHUB_STEP_SUMMARY"
