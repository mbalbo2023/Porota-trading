name: CI — Porota Trading

on:
  push:
    branches:
      - main
      - develop
      - testing
  pull_request:
    branches:
      - main
      - develop
      - testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    name: Infrastructure preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository safety
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking tracked secret-bearing files..."
          if git ls-files -z | grep -zE '(^|/)\.env($|\.)|(^|/)(credentials|secrets)[^/]*\.(json|ya?ml|txt)$' >/dev/null; then
            echo "::error::Potential secret-bearing file is tracked."
            exit 1
          fi

          echo "Checking credential-like strings in tracked source/config..."
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|eyJ[A-Za-z0-9_-]{20,}\.' \
             --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' .; then
            echo "::error::Credential-like material detected in tracked source/config."
            exit 1
          fi

          echo "Infrastructure preflight: OK"

      - name: Validate Docker Compose syntax
        run: docker compose config

  application:
    name: Repository tests / application when present
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The PR merge and both parents, or the push and previous commit.
          # Older/missing base objects simply select FULL_REQUIRED.
          fetch-depth: 2

      - name: Classify authenticated changed paths (advisory, fail closed)
        id: delta
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          plan="FULL_REQUIRED"
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Execute ONLY the comparator shipped by the trusted first parent,
            # never a comparator supplied by the PR head being evaluated.
            trusted_base="$(git rev-parse HEAD^1 2>/dev/null || true)"
            if [[ -n "$trusted_base" ]] && git cat-file -e "$trusted_base:scripts/rc6_main_ci_scope.py" 2>/dev/null; then
              if git show "$trusted_base:scripts/rc6_main_ci_scope.py" > "$RUNNER_TEMP/rc6-trusted-ci.py"; then
                if candidate="$(python3 "$RUNNER_TEMP/rc6-trusted-ci.py" classify-diff 2>/dev/null)"; then
                  case "$candidate" in
                    DOCS_ONLY|DASHBOARD_ONLY|FULL_REQUIRED) plan="$candidate" ;;
                  esac
                fi
              fi
            fi
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "CI_PLAN=$plan"
          echo "CI_DIFF_PLAN=$plan|source=TRUSTED_PARENT|release_attestation=NOT_APPLICABLE" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify repository scope (fail on partial package)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          scope="$(python3 -m scripts.rc6_main_ci_scope classify)"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "CI_SCOPE=$scope"

      - name: Validate pinned control-plane dependencies
        if: steps.detect.outputs.scope == 'CONTROL_PLANE_ONLY'
        run: python -m scripts.rc6_main_ci_scope validate-control-deps

      - name: Setup control-plane Python 3.11
        if: steps.detect.outputs.scope == 'CONTROL_PLANE_ONLY'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-control-ci.txt

      - name: Install pinned control-plane test dependencies
        if: steps.detect.outputs.scope == 'CONTROL_PLANE_ONLY'
        # A341 public-key verifier tests are mandatory in CONTROL_PLANE_ONLY.
        # Keep this pin aligned with its isolated signature-contract workflow.
        run: python -m pip install --disable-pip-version-check -r .github/requirements-control-ci.txt

      - name: Run mandatory control-plane tests
        if: steps.detect.outputs.scope == 'CONTROL_PLANE_ONLY'
        run: python -m scripts.rc6_main_ci_scope test-control

      - name: Record why application-only checks do not apply
        if: steps.detect.outputs.scope == 'CONTROL_PLANE_ONLY'
        run: |
          echo 'APPLICATION_CHECKS=NOT_APPLICABLE|reason=CONTROL_PLANE_ONLY'
          echo 'Application install/build/start/WAL checks do not apply to this control-plane tree; control-plane tests completed successfully.' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python 3.11
        if: steps.detect.outputs.scope == 'APPLICATION'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application dependencies
        if: steps.detect.outputs.scope == 'APPLICATION'
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        if: steps.detect.outputs.scope == 'APPLICATION'
        run: python -m compileall -q .

      - name: Run application tests
        if: steps.detect.outputs.scope == 'APPLICATION'
        run: pytest -q

      - name: Prepare isolated SANDBOX environment
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          cp .env.example .env
          sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=SANDBOX/' .env
          mkdir -p data sre_vector_db

      - name: Build application image
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        run: docker compose build

      - name: Start application stack
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        run: docker compose up -d

      - name: Wait for application health
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Application health: OK"
              exit 0
            fi
            sleep 3
          done
          docker compose logs --tail=150
          exit 1

      - name: Verify no restart loop
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        shell: bash
        run: |
          sleep 10
          test "$(docker inspect porota_trading_bot --format '{{.RestartCount}}')" -eq 0

      - name: Verify SQLite WAL when database module is available
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        shell: bash
        run: |
          docker compose exec -T bot python -c '
          import ac_db
          info = ac_db.healthcheck()
          assert info["ok"]
          assert str(info["journal_mode"]).lower() == "wal"
          print(info)
          '

      - name: Shutdown application stack
        if: always() && steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan != 'DOCS_ONLY'
        run: docker compose down -v

      - name: Record documentation-only application image exemption
        if: steps.detect.outputs.scope == 'APPLICATION' && steps.delta.outputs.plan == 'DOCS_ONLY'
        run: |
          echo 'APPLICATION_IMAGE_CHECKS=NOT_APPLICABLE|reason=AUTHENTICATED_DOCS_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'Documentation-only change: mandatory safety and full Python tests ran; no image, runtime or deployment was certified by this job.' >> "$GITHUB_STEP_SUMMARY"
