name: RC6 A626 Financial Contract Host Aggregates READ_ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rc6-a626-financial-contract-host-readonly.yml
      - scripts/rc6_a626_host_contract_aggregates.py
      - tests/test_rc6_a626_host_contract_aggregates.py
      - tests/test_rc6_a626_consolidated_readonly.py
  workflow_dispatch:
    inputs:
      permit_readonly_host_probe:
        description: 'Confirma una sola consulta host PAPER en namespace de montaje privado RO'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rc6-a626-financial-contract-host-readonly
  cancel-in-progress: false

jobs:
  offhost-focused-ci:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict no-host synthetic regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          python -m pip install --disable-pip-version-check pytest==9.2.0
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -o addopts='' \
            tests/test_rc6_a626_host_contract_aggregates.py \
            tests/test_rc6_a626_consolidated_readonly.py \
            tests/test_rc6_a516_host_budget_metadata_ro.py
          echo 'A626_HOST_PROBE_CI=GREEN|host_access=0|real_orders_sent=0'

  aggregate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'mbalbo2023/Porota-trading' && github.ref_name == 'main' && inputs.permit_readonly_host_probe == true }}
    # Never contact the PAPER host until all A626/A516 offhost contracts pass.
    needs: offhost-focused-ci
    # Serialize image/observer inspection against Deploy V2. The workflow-level
    # A626 mutex also keeps two censuses from executing simultaneously.
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RC6_EXPECTED_PRODUCT_SHA: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
      RC6_EXPECTED_IMAGE_ID: sha256:4a8f7306188979fe6976f400209151bd529bf0d9f46f068b50bbc54fc96fd70b
    steps:
      - uses: actions/checkout@v4
        id: a626_checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable workflow checkout and source safety
        id: a626_source_guard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s scripts/rc6_a626_host_contract_aggregates.py
          test -s scripts/rc6_a516_host_budget_metadata_ro.py
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          src = Path('scripts/rc6_a626_host_contract_aggregates.py').read_text()
          ast.parse(src)
          assert 'sqlite3.connect' in src
          assert 'mode=ro' in src
          assert 'immutable=1' not in src
          assert 'private_ro_mount_verified' in src
          print('A626_RO_CODE_STATIC_GATE=GREEN')
          PY
      - name: Prepare strict ephemeral SSH credentials on runner only
        id: a626_prepare_ssh
        shell: bash
        env:
          RC6_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          RC6_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$RC6_SSH_KEY"
          test -n "$RC6_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/a626-ssh"
          printf '%s\n' "$RC6_SSH_KEY" > "$RUNNER_TEMP/a626-ssh/key"
          printf '%s\n' "$RC6_KNOWN_HOSTS" > "$RUNNER_TEMP/a626-ssh/known_hosts"
      - name: Remote private mount namespace RO bounded SQL aggregates
        id: a626_sql
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST"
          test -n "$DO_USER"
          set +e
          ssh -i "$RUNNER_TEMP/a626-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/a626-ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 25 unshare --mount --propagation private -- /bin/sh -eu -c 'mount --bind /opt/porota-trading/data /opt/porota-trading/data && mount -o remount,bind,ro /opt/porota-trading/data && exec python3 -B -'" \
            < scripts/rc6_a626_host_contract_aggregates.py \
            > "$RUNNER_TEMP/a626-contract-aggregate.json" 2>/dev/null
          remote_rc=$?
          set -e
          RC6_A626_REMOTE_RC="$remote_rc" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          report_file = Path(os.environ['RUNNER_TEMP']) / 'a626-contract-aggregate.json'
          sanitized_file = Path(os.environ['RUNNER_TEMP']) / 'a626-sanitized-only.json'
          try:
              assert report_file.stat().st_size <= 32768
              obj = json.loads(report_file.read_text(encoding='utf-8'))
          except (OSError, ValueError):
              obj = {'schema': 'rc6.a626.host-contract-aggregates-ro.v1',
                     'status': 'NO_VERIFICADO',
                     'reason': 'REMOTE_RO_NAMESPACE_OR_READ_UNAVAILABLE'}
          schema = 'rc6.a626.host-contract-aggregates-ro.v1'
          if os.environ['RC6_A626_REMOTE_RC'] != '0':
              reason = (obj.get('reason') if isinstance(obj, dict) else None)
              if not isinstance(reason, str) or not re.fullmatch(
                      r'(?:HOST|REMOTE)_[A-Z0-9_]{1,76}', reason):
                  reason = 'REMOTE_RO_NAMESPACE_OR_READ_UNAVAILABLE'
              fail = {'schema': schema, 'status': 'NO_VERIFICADO', 'reason': reason}
              sanitized_file.write_text(json.dumps(fail, sort_keys=True) + '\n')
              print(json.dumps(fail, sort_keys=True))
              raise SystemExit(3)
          assert isinstance(obj, dict) and obj.get('schema') == schema, 'A626_WRONG_SCHEMA'
          status = obj.get('status')
          assert status in {'DIAGNOSTIC_ONLY', 'DIAGNOSTIC_PARTIAL_NO_GO'}, 'A626_NOT_DIAGNOSTIC'
          assert obj.get('private_ro_mount_verified') is True
          assert obj.get('paper_workspace_identity_verified') is True
          assert obj.get('paper_auto_enabled') is False
          assert obj.get('ppi_identity_authority_verified') is False
          assert obj.get('source_contract_terms_fresh_verified') is False
          assert obj.get('causal_pit_verified') is False
          assert obj.get('v2_payload_hash_checked') is False
          assert obj.get('runtime_path') == 'PAPER_V17_CANONICAL_RO'
          assert type(obj.get('historical_819_gap_match')) is bool
          assert all(type(obj.get(k)) is bool for k in
                     ('wal_present','shm_present','journal_present'))
          from datetime import datetime, timezone
          observed = datetime.fromisoformat(obj.get('measured_at_utc', ''))
          assert observed.tzinfo is not None and observed.utcoffset().total_seconds() == 0
          assert type(obj.get('host_db_writes')) is int and obj['host_db_writes'] == 0
          assert type(obj.get('provider_gets')) is int and obj['provider_gets'] == 0
          assert type(obj.get('real_orders_sent_by_probe')) is int and obj['real_orders_sent_by_probe'] == 0
          assert obj.get('host_runtime_order_count') == 'NO_VERIFICADO'
          expected = {'BONOS','OBLIGACIONES','OPCIONES','FUTUROS','CAUCIONES','FCI'}
          families = obj.get('families')
          assert isinstance(families, list) and len(families) == 6
          assert {row['family'] for row in families} == expected
          assert sum(row['capability_gaps'] for row in families) == obj['capability_gaps_measured']
          allowed = {'schema','status','runtime_path','private_ro_mount_verified',
                     'paper_workspace_identity_verified','ppi_identity_authority_verified',
                     'source_contract_terms_fresh_verified','causal_pit_verified',
                     'v2_payload_hash_checked','host_db_writes','provider_gets',
                     'real_orders_sent_by_probe','paper_auto_enabled','host_runtime_order_count',
                     'catalog_rows','v2_current_rows','v2_history_ppi_rows_scanned',
                     'v2_current_valid_rows','v2_current_invalid_reason_counts',
                     'v2_current_integrity_verified',
                     'v2_history_identity_bytes_scanned','historical_819_gap_match',
                     'capability_gaps_measured','families','wal_present','shm_present',
                     'journal_present','db_bytes','measured_at_utc'}
          total, valid = obj.get('v2_current_rows'), obj.get('v2_current_valid_rows')
          assert type(total) is int and total >= 0
          new_fields = {'v2_current_integrity_verified', 'v2_current_valid_rows',
                        'v2_current_invalid_reason_counts'}
          present = set(obj) & new_fields
          # A626 v1 on the already-deployed main lacks all three new fields.
          # Preserve that legitimate FULL receipt without inventing new evidence;
          # any mixed version, or a PARTIAL without quarantine counts, is RED.
          assert present in (set(), new_fields), 'A626_MIXED_INTEGRITY_SCHEMA'
          legacy_full = not present
          assert not legacy_full or status == 'DIAGNOSTIC_ONLY', 'A626_LEGACY_PARTIAL_DENIED'
          assert set(obj) == (allowed-new_fields if legacy_full else allowed), 'A626_EXACT_SCHEMA_REQUIRED'
          reasons = obj.get('v2_current_invalid_reason_counts')
          reason_codes = {
              'HOST_V2_SNAPSHOT_REFERENCE_MISSING',
              'HOST_V2_SNAPSHOT_FIVE_KEY_MISMATCH',
              'HOST_V2_SNAPSHOT_SOURCE_CLASS_MISMATCH',
              'HOST_V2_SNAPSHOT_EVIDENCE_HASH_MISMATCH',
              'HOST_V2_SNAPSHOT_OBSERVED_AT_INVALID',
              'HOST_V2_SNAPSHOT_OBSERVED_AT_REVERSED',
          }
          if not legacy_full:
              assert obj['v2_current_integrity_verified'] is (status == 'DIAGNOSTIC_ONLY')
              assert type(valid) is int and 0 <= valid <= total
              assert isinstance(reasons, dict) and set(reasons) <= reason_codes
              assert all(type(n) is int and n > 0 for n in reasons.values())
              assert valid + sum(reasons.values()) == total
              assert (not reasons) == (status == 'DIAGNOSTIC_ONLY')
          assert all(type(obj[k]) is int and obj[k] >= 0 for k in (
              'catalog_rows','v2_history_ppi_rows_scanned',
              'v2_history_identity_bytes_scanned','capability_gaps_measured','db_bytes'))
          safe_family = {'family','catalog_active','catalog_prelim_ready',
                         'capability_gaps','gap_ppi_catalog_claimed',
                         'gap_complement_catalog_only','gap_ticker_ambiguous',
                         'gap_incomplete_five_key','exact_current_v2_ppi',
                         'exact_current_v2_complement_only','ticker_only_v2_mismatch',
                         'v2_current_absent','historic_ppi_exact_without_current',
                         'catalog_financial_contract_v17_declared',
                         'catalog_fund_terms_v1_declared','catalog_caucion_terms_v1_declared',
                         'catalog_contract_conflicts_declared','capability_codes'}
          for row in families:
              assert set(row) == safe_family, 'A626_UNEXPECTED_FAMILY_FIELDS'
              assert all(type(v) is int and v >= 0 for k,v in row.items()
                         if k not in {'family','capability_codes'})
              assert isinstance(row['capability_codes'], dict)
              assert all(isinstance(k,str) and re.fullmatch(r'[A-Z_]{2,65}',k)
                         and type(v) is int and v>=0
                         for k,v in row['capability_codes'].items())
              assert sum(row['capability_codes'].values()) == row['capability_gaps']
          # DB-origin capability keys are not a safe public vocabulary; their
          # per-family counts are included above, but never publish raw keys.
          sanitized = dict(obj)
          sanitized['families'] = [
              {**row, 'capability_codes': {
                  'REDACTED_COUNT': sum(row['capability_codes'].values())}}
              for row in families]
          sanitized_file.write_text(json.dumps(sanitized,sort_keys=True,separators=(',',':'))+'\n')
          print('A626_HOST_READONLY_AGGREGATES=' + status +
                '|provider_gets=0|host_db_writes=0|real_orders_by_probe=0' +
                '|catalog_rows=' + str(obj['catalog_rows']) +
                '|current_integrity=' + ('NO_VERIFICADO_LEGACY_FIELDS_ABSENT' if legacy_full
                                        else 'PARTIAL_NO_GO' if reasons else 'EXPLICIT_VALID') +
                '|current_rows=' + str(total))
          if status == 'DIAGNOSTIC_PARTIAL_NO_GO':
              raise SystemExit(4)
          PY
      - name: Existing A516 v3 budget/PID1 metadata from pinned PAPER observer
        id: a516_metadata
        if: ${{ always() && steps.a626_checkout.outcome == 'success' && steps.a626_source_guard.outcome == 'success' && steps.a626_prepare_ssh.outcome == 'success' }}
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -s "$RUNNER_TEMP/a626-ssh/key"
          test -s "$RUNNER_TEMP/a626-ssh/known_hosts"
          # This docker exec does NOT inherit A626's separate private host RO
          # mount namespace. A516 attests bounded metadata only, not host RO.
          set +e
          timeout --signal=TERM --kill-after=5s 65s ssh \
            -i "$RUNNER_TEMP/a626-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/a626-ssh/known_hosts" \
            -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "set -Eeuo pipefail; cid=\$(sudo -n docker inspect -f '{{.Id}}' porota_production_observer); image=\$(sudo -n docker inspect -f '{{.Image}}' \"\$cid\"); test \"\$image\" = '$RC6_EXPECTED_IMAGE_ID'; printf 'RUNTIME_IMAGE_ID=%s\n' \"\$image\"; sudo -n timeout 30 docker exec -i -e RC6_A516_EXPECTED_PRODUCT_SHA=$RC6_EXPECTED_PRODUCT_SHA -e PYTHONDONTWRITEBYTECODE=1 \"\$cid\" python -B -; test \"\$(sudo -n docker inspect -f '{{.Id}}' porota_production_observer)\" = \"\$cid\"" \
            < scripts/rc6_a516_host_budget_metadata_ro.py \
            > "$RUNNER_TEMP/a516-budget-stdout.private" 2>/dev/null
          remote_rc=$?
          set -e
          RC6_A516_REMOTE_RC="$remote_rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.rc6_a516_host_budget_metadata_ro import SCHEMA, PRODUCT_SHA, verify_receipt
          root = Path(os.environ['RUNNER_TEMP'])
          source = root / 'a516-budget-stdout.private'
          destination = root / 'a516-sanitized-only.json'
          try:
              assert source.stat().st_size <= 8192
              lines = source.read_text(encoding='utf-8').splitlines()
              assert len(lines) == 2
              assert lines[0] == 'RUNTIME_IMAGE_ID=' + os.environ['RC6_EXPECTED_IMAGE_ID']
              result = json.loads(lines[1])
              valid = (os.environ['RC6_A516_REMOTE_RC'] == '0'
                       and result.get('expected_product_sha') == PRODUCT_SHA
                       and verify_receipt(result))
          except (OSError, ValueError, TypeError, AttributeError, AssertionError):
              valid = False
          if not valid:
              result = {'schema': SCHEMA, 'state': 'NO_VERIFICADO',
                        'diagnosis': 'HOST_PROBE_FAILED',
                        'expected_product_sha': PRODUCT_SHA,
                        'trading_database_opened': False,
                        'budget_sidecar_written': False,
                        'budget_lease_acquired': False,
                        'provider_calls': 0, 'real_orders_sent': 0,
                        'ppi_watch_touched': False, 'book_replay_verified': False,
                        'paper_ready': False}
          destination.write_text(json.dumps(result, sort_keys=True, separators=(',',':'))+'\n')
          print('A516_BUDGET_METADATA='+result['state']+'|diagnosis='+result['diagnosis']+
                '|provider_gets=0|budget_leases=0|current_book=NO_GO')
          if not valid:
              raise SystemExit(2)
          PY
      - name: Build single sanitized SQL plus budget evidence receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          a626_schema = 'rc6.a626.host-contract-aggregates-ro.v1'
          a516_schema = 'rc6.a516.ppi.budget.metadata-only.v3'
          def read_sanitized(name, expected, fallback):
              path = root / name
              try:
                  assert 0 < path.stat().st_size <= 32768
                  value = json.loads(path.read_text(encoding='utf-8'))
                  assert isinstance(value, dict) and value.get('schema') == expected
                  return value
              except (OSError, ValueError, TypeError, AssertionError):
                  return fallback
          sql = read_sanitized('a626-sanitized-only.json', a626_schema,
              {'schema':a626_schema,'status':'NO_VERIFICADO',
               'reason':'REMOTE_RO_NAMESPACE_OR_READ_UNAVAILABLE'})
          budget = read_sanitized('a516-sanitized-only.json', a516_schema,
              {'schema':a516_schema,'state':'NO_VERIFICADO',
               'diagnosis':'HOST_PROBE_FAILED'})
          budget_blocked = (budget.get('state') == 'EVIDENCE_ONLY_NO_GO' and
                            budget.get('sidecar_kind') == 'ABSENT' and
                            budget.get('snapshot_status') == 'ABSENT')
          complete = (sql.get('status') == 'DIAGNOSTIC_ONLY' and
                      budget.get('state') == 'EVIDENCE_ONLY_NO_GO')
          sql_new_fields = {'v2_current_integrity_verified', 'v2_current_valid_rows',
                            'v2_current_invalid_reason_counts'}
          sql_integrity = (
              'NO_VERIFICADO_LEGACY_FIELDS_ABSENT' if sql.get('status') == 'DIAGNOSTIC_ONLY'
              and not (set(sql) & sql_new_fields) else
              'EXPLICIT_VALID' if sql.get('status') == 'DIAGNOSTIC_ONLY'
              and sql.get('v2_current_integrity_verified') is True else
              'PARTIAL_NO_GO' if sql.get('status') == 'DIAGNOSTIC_PARTIAL_NO_GO'
              else 'NO_VERIFICADO')
          result = {
              'schema':'rc6.a626.sql-budget-pid1.consolidated-sanitized.v1',
              'workflow_sha':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'expected_product_sha':os.environ['RC6_EXPECTED_PRODUCT_SHA'],
              'expected_runtime_image_id':os.environ['RC6_EXPECTED_IMAGE_ID'],
              'data_collection_status':'COMPLETE' if complete else 'INCOMPLETE_NO_GO',
              'a626_current_integrity_evidence':sql_integrity,
              'sql_host_mount_scope':'A626_PRIVATE_RO_MOUNT_ONLY',
              'budget_probe_mount_scope':'A516_DOCKER_EXEC_SEPARATE_NAMESPACE_NOT_ATTESTED_RO',
              'ppi_current_book_authority':'BLOQUEADO' if budget_blocked else 'NO_VERIFICADO',
              'ppi_current_book_provider_gets':0,
              'ppi_budget_leases_acquired':0,
              'host_db_writes_by_diagnostics':0,
              'real_orders_sent_by_diagnostics':0,
              'runtime_real_orders_sent':'NO_VERIFICADO',
              'paper_instrument_ready':False,
              'predeploy_or_deploy_dispatched':False,
              'a626_sql':sql,
              'a516_budget_metadata':budget,
          }
          out = root / 'a626-consolidated-sanitized.json'
          out.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('A626_CONSOLIDATED_RECEIPT='+result['data_collection_status']+
                '|a626='+sql['status']+'|a516='+budget['state']+
                '|current_book_authority='+result['ppi_current_book_authority']+
                '|provider_gets=0|budget_leases=0|host_db_writes=0|paper_ready=NO_GO')
          PY
      - name: Preserve only sanitized dual receipt on success or fail-closed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a626-sql-budget-consolidated-${{ github.run_id }}
          path: ${{ runner.temp }}/a626-consolidated-sanitized.json
          if-no-files-found: error
          retention-days: 7
      - name: Destroy runner-only credentials and private probe stdout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in "$RUNNER_TEMP/a626-ssh/key" \
              "$RUNNER_TEMP/a626-ssh/known_hosts" \
              "$RUNNER_TEMP/a626-contract-aggregate.json" \
              "$RUNNER_TEMP/a516-budget-stdout.private"; do
            if test -f "$path"; then shred -u "$path"; fi
          done
