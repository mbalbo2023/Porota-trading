name: RC6 CP4 A3 Overlay Forward Fix V2 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-cp4-a3-overlay-forwardfix-v2-20260911.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  cp4_a3_overlay_forwardfix_v2:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Static source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile ex_a3_history_job_rc6.py ew_a3_history_rc6.py fd_a3_identity_mapper_rc6.py
          python - <<'PY'
          import fd_a3_identity_mapper_rc6 as m
          assert m.porota_to_a3_dlr('DLR/SEP26') == 'DLR092026'
          for s in ('DLR/SEP26/OCT26','DLR/SEP26M'):
              try: m.porota_to_a3_dlr(s)
              except m.A3IdentityError: pass
              else: raise SystemExit('FAIL_OPEN:'+s)
          print('CP4_STATIC_GATE=GREEN')
          PY
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stage audited overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -cf /tmp/rc6_cp4_a3_overlay.tar ex_a3_history_job_rc6.py ew_a3_history_rc6.py fd_a3_identity_mapper_rc6.py
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/rc6_cp4_a3_overlay.tar "$DO_USER@$DO_HOST:/tmp/rc6_cp4_a3_overlay.tar"
      - name: Install isolated overlay and prove runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OVL="$ROOT/data/rc6_a3_overlay"
          DROP=/etc/systemd/system/porota-a3-history-rc6@.service.d/20-rc6-cp4-overlay.conf
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo HOST_HEAD="$TARGET"
          PRE="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(json.dumps({'mode':r[0] if r else None,'session':r[1] if r else None,'orders':r[2] if r else None}))
          PY
          )"
          echo SAFETY_PRE="$PRE"
          PRE="$PRE" python3 - <<'PY'
          import os,json,sys
          d=json.loads(os.environ['PRE'])
          if d.get('mode')!='PRODUCTION_PAPER' or int(d.get('orders') or 0)!=0: sys.exit(1)
          PY
          sudo -n install -d -m 0755 "$OVL"
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP" /tmp/rc6_cp4_a3_overlay.tar' EXIT
          tar -xf /tmp/rc6_cp4_a3_overlay.tar -C "$TMP"
          for f in ex_a3_history_job_rc6.py ew_a3_history_rc6.py fd_a3_identity_mapper_rc6.py; do sudo -n install -m 0644 "$TMP/$f" "$OVL/$f"; done
          sudo -n install -d -m 0755 "$(dirname "$DROP")"
          cat > "$TMP/override.conf" <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/usr/bin/docker exec -e PYTHONPATH=/app/data/rc6_a3_overlay:/app -e A3_HISTORY_MODE=%i porota_production_observer python /app/data/rc6_a3_overlay/ex_a3_history_job_rc6.py %i
          EOF
          sudo -n install -m 0644 "$TMP/override.conf" "$DROP"
          sudo -n systemctl daemon-reload
          echo '--- EFFECTIVE UNIT ---'
          sudo -n systemctl cat porota-a3-history-rc6@.service --no-pager
          echo '--- OVERLAY HASHES ---'
          sudo -n sha256sum "$OVL"/*.py
          echo '--- IMPORT WIRING ---'
          sudo -n docker exec -i -e PYTHONPATH=/app/data/rc6_a3_overlay:/app porota_production_observer python - <<'PY'
          import ew_a3_history_rc6 as h,fd_a3_identity_mapper_rc6 as m
          print('EW_FILE='+h.__file__); print('FD_FILE='+m.__file__)
          assert '/app/data/rc6_a3_overlay/' in h.__file__
          assert '/app/data/rc6_a3_overlay/' in m.__file__
          print('DLR/SEP26='+m.porota_to_a3_dlr('DLR/SEP26'))
          for s in ('DLR/SEP26/OCT26','DLR/SEP26M'):
              try: m.porota_to_a3_dlr(s)
              except Exception as e: print(s+'=FAIL_CLOSED:'+type(e).__name__)
              else: raise SystemExit('FAIL_OPEN:'+s)
          PY
          echo CP4_RUNTIME_WIRING_GATE=GREEN
          set +e
          sudo -n systemctl start porota-a3-history-rc6@DAILY_INCREMENTAL.service
          RC=$?
          set -e
          echo A3_SERVICE_START_RC="$RC"
          sudo -n journalctl -u porota-a3-history-rc6@DAILY_INCREMENTAL.service -n 100 --no-pager | tail -n 100
          POST="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); rows=[]
          if c.execute("select 1 from sqlite_master where type='table' and name='a3_history_ingest_state_rc6'").fetchone():
              rows=[dict(x) for x in c.execute("select symbol,instrument_type,status,last_complete_day,last_success_at,rows_last from a3_history_ingest_state_rc6 where instrument_type='FUTUROS' order by coalesce(last_success_at,'') desc,symbol limit 40")]
          c.close(); print(json.dumps({'mode':r['mode'] if r else None,'session':r['session_state'] if r else None,'orders':r['real_orders_sent'] if r else None,'futures':rows},default=str))
          PY
          )"
          echo POST="$POST"
          POST="$POST" python3 - <<'PY'
          import os,json,sys
          d=json.loads(os.environ['POST'])
          if d.get('mode')!='PRODUCTION_PAPER' or int(d.get('orders') or 0)!=0: sys.exit(1)
          complete=[r for r in (d.get('futures') or []) if str(r.get('status')).upper()=='COMPLETE']
          print('CP4_PERSISTENCE_GATE='+('GREEN' if complete else 'YELLOW_POSTCLOSE_REQUIRED'))
          print('CP4_COMPLETE_FUTURES='+str(len(complete)))
          print('REAL_ORDERS_SENT=0')
          PY
          test "$RC" -eq 0
          echo CP4_OVERLAY_FORWARD_FIX=GREEN
          HOST
