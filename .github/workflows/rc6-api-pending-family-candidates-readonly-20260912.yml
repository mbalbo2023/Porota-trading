name: RC6 API Pending Family Candidates Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-api-pending-family-candidates-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only pending-family evidence inventory
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          TARGET=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import sqlite3, json
          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20)
          c.row_factory=sqlite3.Row
          c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          state=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and state and state[0]=='PRODUCTION_PAPER' and int(state[2] or 0)==0
          print('SAFETY='+'|'.join(map(str,(q,*state))))

          aliases={'ACCIONES-USA':['ACCIONES-USA','ACCIONES_USA'],'FCI-EXTERIOR':['FCI-EXTERIOR','FCI_EXTERIOR'],'ETF':['ETF','ETFS'],'FCI':['FCI','FCI_LOCAL'],'LICITACIONES':['LICITACIONES'],'LEBAC':['LEBAC'],'NOBAC':['NOBAC']}
          for api_family, names in aliases.items():
              ph=','.join('?' for _ in names)
              rows=c.execute(f'''select family,ticker,market,settlement,source_class,observed_at,evidence_json
                                 from contract_evidence_v2_current
                                 where upper(family) in ({ph})
                                 order by case when ticker in ('*','UNKNOWN','') then 1 else 0 end, ticker, source_class''',
                             tuple(x.upper() for x in names)).fetchall()
              out=[]
              for r in rows[:40]:
                  try: ev=json.loads(r['evidence_json'] or '{}')
                  except Exception: ev={}
                  safe={k:ev[k] for k in sorted(ev) if k in {'instrument_id','ticker','description','name','market','currency','settlement','isin','fund_id','auction_id','instrument','exchange','jurisdiction'}}
                  out.append({'family':r['family'],'ticker':r['ticker'],'market':r['market'],'settlement':r['settlement'],'source_class':r['source_class'],'observed_at':r['observed_at'],'safe_evidence':safe})
              print('PENDING_FAMILY='+json.dumps({'api_family':api_family,'rows':len(rows),'sample':out},ensure_ascii=False,sort_keys=True))
          c.close()
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
