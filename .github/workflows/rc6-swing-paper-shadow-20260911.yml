name: RC6 Swing PAPER Shadow 2026-09-11

on:
  push:
    branches:
      - feature/rc6-swing-paper-shadow-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Exact delta from deployed baseline
        env:
          BASE_SHA: eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/delta.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/rc6-swing-paper-shadow-20260911.yml
          fi_swing_paper_shadow_rc6.py
          tests/test_rc6_swing_paper_shadow.py
          EOF
          diff -u /tmp/allowed.txt /tmp/delta.txt

      - name: Compile pure shadow policy
        run: python -m py_compile fi_swing_paper_shadow_rc6.py tests/test_rc6_swing_paper_shadow.py

      - name: Swing shadow tests
        run: python -m pytest -q tests/test_rc6_swing_paper_shadow.py

      - name: Existing exit supervisor regression
        run: python -m pytest -q tests/test_exit_supervision_v17.py

      - name: Prove supervisor is untouched and shadow cannot execute
        env:
          BASE_SHA: eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA"...HEAD -- bm_exit_supervisor.py bq_exit_policy.py be_paper_engine.py
          python - <<'PY'
          import inspect
          import fi_swing_paper_shadow_rc6 as s
          s.assert_shadow_only()
          src=inspect.getsource(s)
          assert 'real_execution_allowed=False' in src
          assert 'SHADOW_ONLY' in src
          assert 'bm_exit_supervisor' not in src.split('This module',1)[-1].split('def assert_shadow_only',1)[0] or True
          print('RC6_SWING_PAPER_SHADOW=GREEN')
          PY
