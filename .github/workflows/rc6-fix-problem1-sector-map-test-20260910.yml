name: RC6 Fix Problem 1 Sector Map Acceptance 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-fix-problem1-sector-map-test-20260910.yml

permissions:
  contents: write

jobs:
  fix-stale-sector-map-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable RC6 PAPER safety identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py

      - name: Replace stale empty-map assertion with reviewed-map invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_rc4_acceptance.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_rc4_default_sector_map_is_empty_until_reviewed():
              import rc4_policy_context as ctx
              rows=ctx._explicit_sector_map()
              assert rows == {}
          '''
          new = '''def test_rc6_default_sector_map_contains_only_reviewed_sourced_rows():
              import rc4_policy_context as ctx
              rows = ctx._explicit_sector_map()
              assert rows
              assert len(rows) == 11
              for key, evidence in rows.items():
                  assert len(key) == 5 and all(key)
                  assert evidence['sector']
                  assert evidence['source']
                  assert evidence['author'] == 'RC6_W10_REVIEW'
                  assert evidence['effective_at']
          '''
          if old not in s:
              raise SystemExit('STALE_SECTOR_MAP_TEST_NOT_FOUND_FAIL_CLOSED')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('SECTOR_MAP_TEST_PATCH=APPLIED')
          PY

      - name: Prove targeted sector-map acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          PYTHONPATH=. pytest -q tests/test_rc4_acceptance.py -k 'sector_map'
          PYTHONPATH=. python scripts/rc6_w10_sector_map_preflight.py
          echo 'SECTOR_MAP_TARGETED=GREEN'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'

      - name: Commit targeted test repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_rc4_acceptance.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'tests/test_rc4_acceptance.py'
          git commit -m 'test(rc6): align default sector-map acceptance with reviewed binding evidence'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run complete pytest gate and expose next blocker if any
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -q > /tmp/pytest-full.txt 2>&1
          rc=$?
          tail -n 180 /tmp/pytest-full.txt
          echo "PYTEST_FULL_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            echo 'PROBLEM1_FULL_PYTEST=GREEN'
          else
            echo 'PROBLEM1_CURRENT_ASSERTION=FIXED_NEXT_BLOCKER_REMAINS'
          fi
          exit "$rc"
