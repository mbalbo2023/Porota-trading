name: RC6 full candidate gate

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-full-candidate
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0

      - name: Exact lineage and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
          test -z "$(git status --porcelain)"
          git diff --check
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RELEASE_SAFETY_IDENTITY=GREEN')
          PY

      - name: Compile complete source tree
        run: python -m compileall -q .

      - name: Build candidate image
        run: docker build --pull=false -t porota-rc6-candidate:${GITHUB_SHA} .

      - name: Classification probes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-candidate:${GITHUB_SHA} -lc '
              set +e
              for spec in \
                tests/test_daily_risk_outbox_v17.py \
                tests/test_partial_receipts_v17.py \
                tests/test_open_entry_terms_v17.py \
                tests/test_ledger_copy_preflight_v17.py \
                tests/test_production_paper_v1634.py
              do
                echo "===== PROBE ${spec} ====="
                python -m pytest -q -p no:cacheprovider --tb=short -x "$spec"
                echo "PROBE_RC=$?"
              done
              exit 0
            '

      - name: Active pytest suite without network
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-candidate:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              --ignore=tests/test_hotfix_rc3_hf2.py \
              --ignore=tests/test_hotfix_rc3_hf4.py \
              --ignore=tests/test_hotfix_rc3_hf6.py \
              --ignore=tests/test_intraday_scalping_hf3.py \
              --ignore=tests/test_rc4_acceptance.py \
              --ignore=tests/test_rc4_hf1_last_mile.py \
              --ignore=tests/test_rc4_hf2_consolidation.py' \
            > rc6-pytest.log 2>&1
          rc=$?
          set -e
          echo '===== PYTEST COMPACT TAIL ====='
          tail -n 260 rc6-pytest.log || true
          {
            echo '### Active pytest compact result'
            echo "- exit_code: ${rc}"
            echo '- RC3/RC4 release-pinned archive suites are excluded from the RC6 gate; their version-specific assertions are superseded by RC6 safety/semantics suites.'
            echo '```text'
            grep -E '^(FAILED|ERROR) ' rc6-pytest.log | tail -n 180 || true
            grep -E '^[0-9]+ failed|^[0-9]+ passed|^[0-9]+ error|^=+ .* in [0-9]' rc6-pytest.log | tail -n 5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: RC6 safety and semantics invariants
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python porota-rc6-candidate:${GITHUB_SHA} - <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          mode_manager = text('porota_mode_manager.py')
          dashboard = text('bg_paper_dashboard.py')
          validation = text('en_validation_project_dashboard_rc6.py')
          telegram = text('bn_telegram_bus.py')
          a3_core = text('ew_a3_history_rc6.py')
          a3_job = text('ex_a3_history_job_rc6.py')
          version = text('_version.py')

          assert '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"' in mode_manager
          assert 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in dashboard
          assert 'shadow_view.render()' in validation
          assert 'telegram_delivery_decision(row, at)' in telegram
          assert re.search(r'execution_allowed.*False', a3_core)
          forbidden = re.compile(r'send_order|new_order|replace_order|cancel_order')
          assert not forbidden.search(a3_core + '\n' + a3_job)
          assert 'REAL_ORDER_CAPABILITY = "BLOCKED"' in version
          assert 'VERSION = "17.0.0-rc6"' in version
          print('RC6_SAFETY_SEMANTICS_INVARIANTS=GREEN')
          PY

      - name: Candidate summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RC6 full candidate gate'
            echo "- SHA: ${GITHUB_SHA}"
            echo '- Base RC5 exact lineage checked.'
            echo '- Active RC6 pytest suite executed inside candidate image with network disabled.'
            echo '- Release-pinned RC3/RC4 archive suites are classification history, not RC6 acceptance authority.'
            echo '- Root filesystem stays read-only; only /tmp and /app/data are ephemeral tmpfs for tests.'
            echo '- Real-money capability remains BLOCKED.'
          } >> "$GITHUB_STEP_SUMMARY"

  immutable-archive:
    name: Immutable GHCR archive proof
    needs: full-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact tested release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          PY

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish exact tested SHA
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
        run: |
          set -euo pipefail
          REF="$IMAGE:rc6-candidate-${GITHUB_SHA}"
          docker build --pull=false \
            --label "porota.commit=${GITHUB_SHA}" \
            --label "porota.version=17.0.0-rc6" \
            -t "$REF" .
          docker push "$REF" 2>&1 | tee /tmp/rc6-ghcr-push.log
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/rc6-ghcr-push.log | tail -n 1)"
          if [ -z "$DIGEST" ]; then
            DIGEST="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          case "$DIGEST" in sha256:*) ;; *) echo 'INVALID_DIGEST'; exit 1;; esac
          TREE_SHA="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          printf 'version=17.0.0-rc6\ncommit=%s\ntree=%s\nimage=%s\ndigest=%s\n' \
            "$GITHUB_SHA" "$TREE_SHA" "$IMAGE" "$DIGEST" > /tmp/rc6-ghcr-manifest.txt
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Remove local tag and re-pull exact digest
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm "${{ steps.publish.outputs.ref }}"
          docker pull "$IMAGE@$DIGEST"
          LABEL_COMMIT="$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "porota.commit"}}')"
          LABEL_VERSION="$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "porota.version"}}')"
          test "$LABEL_COMMIT" = "$GITHUB_SHA"
          test "$LABEL_VERSION" = '17.0.0-rc6'
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --entrypoint python "$IMAGE@$DIGEST" - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('GHCR_REPULL_SAFETY=GREEN')
          PY

      - name: Upload immutable manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc6-ghcr-manifest-${{ github.sha }}
          path: /tmp/rc6-ghcr-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Archive evidence summary
        shell: bash
        run: |
          {
            echo '### RC6 immutable archive proof'
            echo "- Exact tested commit: $GITHUB_SHA"
            echo "- Image ref: ${{ steps.publish.outputs.ref }}"
            echo "- Immutable digest: ${{ steps.publish.outputs.digest }}"
            echo '- Local tag was removed before re-pull by digest.'
            echo '- Re-pulled image preserved commit, RC6 version and PAPER safety identity.'
          } >> "$GITHUB_STEP_SUMMARY"
