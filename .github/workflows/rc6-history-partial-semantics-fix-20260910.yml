name: RC6 History Partial Semantics Fix Focused Proof 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-history-partial-semantics-fix-20260910.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  history-semantics-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rc6-w10-sector-map-binding-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert immutable RC6 PAPER identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Materialize canonical history batch semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          def dec(value):
              return base64.b64decode(value).decode('utf-8')
          helper=dec('')
          old_init=dec('ZGVmIF9kb3dubG9hZF9oaXN0b3JpZXMocmVhZGVyLCBzdG9yZSk6CiAgICBlbmQgPSBkYXRldGltZS5ub3coVFopLmRhdGUoKQogICAgc3RhcnQgPSBlbmQgLSB0aW1lZGVsdGEoZGF5cz0zNjUpCiAgICB0b3RhbCA9IHN1Y2Nlc3NlcyA9IGZhaWx1cmVzID0gMAo=')
          new_init=dec('ZGVmIF9kb3dubG9hZF9oaXN0b3JpZXMocmVhZGVyLCBzdG9yZSk6CiAgICBlbmQgPSBkYXRldGltZS5ub3coVFopLmRhdGUoKQogICAgc3RhcnQgPSBlbmQgLSB0aW1lZGVsdGEoZGF5cz0zNjUpCiAgICB0b3RhbCA9IDAKICAgIGJhdGNoX3N0YXR1c2VzID0gW10K')
          old_count=dec('ICAgICAgICAgICAgdG90YWwgKz0gY291bnQKICAgICAgICAgICAgaWYgc3RhdHVzPT0nVkFMSURfUEFZTE9BRCc6CiAgICAgICAgICAgICAgICBzdWNjZXNzZXMgKz0gMQogICAgICAgICAgICBlbHNlOgogICAgICAgICAgICAgICAgZmFpbHVyZXMgKz0gMQogICAgICAgIGV4Y2VwdCBFeGNlcHRpb24gYXMgZXhjOgogICAgICAgICAgICBmYWlsdXJlcyArPSAxCg==')
          new_count=dec('ICAgICAgICAgICAgdG90YWwgKz0gY291bnQKICAgICAgICAgICAgYmF0Y2hfc3RhdHVzZXMuYXBwZW5kKHN0YXR1cykKICAgICAgICBleGNlcHQgRXhjZXB0aW9uIGFzIGV4YzoKICAgICAgICAgICAgYmF0Y2hfc3RhdHVzZXMuYXBwZW5kKCdFUlJPUicpCg==')
          old_summary=dec('')
          new_summary=dec('')
          p=Path('bf_production_paper_observer.py')
          text=p.read_text(encoding='utf-8')
          anchor='\n\ndef _historical_targets(store):'
          if 'def _history_batch_semantics(statuses):' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('HISTORY_FIX_ABORT=HELPER_ANCHOR_MISMATCH')
              text=text.replace(anchor, helper+anchor, 1)
          if old_init in text:
              text=text.replace(old_init,new_init,1)
          elif new_init not in text:
              raise SystemExit('HISTORY_FIX_ABORT=INIT_MISMATCH')
          if old_count in text:
              text=text.replace(old_count,new_count,1)
          elif new_count not in text:
              raise SystemExit('HISTORY_FIX_ABORT=COUNT_MISMATCH')
          if old_summary in text:
              text=text.replace(old_summary,new_summary,1)
          elif new_summary not in text:
              raise SystemExit('HISTORY_FIX_ABORT=SUMMARY_MISMATCH')
          p.write_text(text,encoding='utf-8')
          print('HISTORY_SEMANTICS_MATERIALIZED=GREEN')
          PY
          python -m py_compile bf_production_paper_observer.py
      - name: Focused semantic and history regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          PYTHONPATH=. pytest -q tests/test_rc6_history_partial_semantics.py tests/test_production_paper_v1634.py::test_historicos_usan_universo_completo_no_lote_activo tests/test_rc4_acceptance.py::test_history_identical_version_is_deduped tests/test_rc4_acceptance.py::test_history_file_without_v2_schema_falls_back_legacy
          echo HISTORY_FOCUSED_REGRESSION=GREEN
      - name: Commit tested history fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add bf_production_paper_observer.py
          if git diff --cached --quiet; then
            echo HISTORY_FIX_COMMIT=ALREADY_PRESENT
            exit 0
          fi
          git commit -m 'fix(rc6): preserve partial historical evidence semantics'
          git fetch --no-tags origin fix/rc6-w10-sector-map-binding-20260910
          git rebase origin/fix/rc6-w10-sector-map-binding-20260910
          PYTHONPATH=. pytest -q tests/test_rc6_history_partial_semantics.py
          git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
          echo HISTORY_FIX_COMMIT=GREEN

  closed-blocker-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove settlement and legacy blockers stay closed
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          PYTHONPATH=. pytest -q tests/test_rc4_hf1_last_mile.py::test_t1_without_cutoff_waits_until_full_expected_date_elapsed tests/test_rc4_hf2_consolidation.py::test_hf2_version_and_orders_remain_blocked tests/test_rc4_hf2_consolidation.py::test_live_page_keeps_current_round_and_history_semantics_clean
          echo SETTLEMENT_LEGACY_FOCUSED=GREEN
