name: RC6 Scalping Final Focal Regression 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-scalping-20261001
    paths:
      - '.github/workflows/rc6-scalping-final-focal-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile cf_intraday_scalping.py
      - run: python -m pytest -q tests/test_scalping_intraday_unsupported_state.py tests/test_intraday_scalping_hf3.py tests/test_intraday_scalping_rc6_integration.py
