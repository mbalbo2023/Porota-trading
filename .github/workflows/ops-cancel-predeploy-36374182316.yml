name: Delete unintended partial artifact 10950785628

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/ops-cancel-predeploy-36374182316.yml'

permissions:
  contents: read
  actions: write

jobs:
  delete-exact-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only artifact 10950785628
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10950785628" --jq .id)" = "10950785628"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/10950785628"
          if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10950785628" >/dev/null 2>&1; then
            echo "UNINTENDED_ARTIFACT_STILL_PRESENT" >&2
            exit 1
          fi
          echo "UNINTENDED_ARTIFACT_DELETE=GREEN|artifact=10950785628"
