name: RC6 IOL installed release read-only evidence

on:
  push:
    branches: [diagnostic/rc6-iol-installed-213]

permissions:
  contents: read

concurrency:
  group: rc6-iol-installed-213-readonly
  cancel-in-progress: false

jobs:
  evidence:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify installed digest and collect read-only host evidence
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: python3 -B -m scripts.rc6_iol_213_readonly --output "$RUNNER_TEMP/rc6-iol-installed-213.json"
      - name: Publish sanitized evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-iol-installed-213-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-iol-installed-213.json
          retention-days: 30
