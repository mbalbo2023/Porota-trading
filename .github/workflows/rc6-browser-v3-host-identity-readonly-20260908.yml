name: RC6 Browser V3 host identity read-only 2026-09-08

on:
  push:
    branches:
      - checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
    paths:
      - '.github/workflows/rc6-browser-v3-host-identity-readonly-20260908.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect Browser V3 identity only
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE' > /tmp/browser-v3.txt
          set -euo pipefail
          echo 'POROTA RC6 BROWSER V3 HOST IDENTITY — READ ONLY'
          echo 'HOST_MUTATION=NONE'
          echo 'SOURCE_CONTENT_EXPORTED=NO'
          echo "UTC=$(date -u +%FT%TZ)"
          cd /opt/porota-trading
          echo "REPO_HEAD=$(git rev-parse HEAD)"
          echo '--- ACTIVE CONTRACT EVIDENCE UNIT ---'
          sudo -n systemctl show porota-contract-evidence-rc6.service -p ExecStart -p Environment --no-pager 2>/dev/null | sed -E 's/(PASSWORD|TOKEN|SECRET|KEY|COOKIE|AUTHORIZATION)=[^ ]+/\1=<REDACTED>/Ig' || true
          echo '--- CANDIDATE FILES ---'
          mapfile -t files < <(find /opt/porota-trading /home/porotaadmin -xdev -type f \( -iname '*browser*' -o -iname '*contract*collector*.py' -o -iname '*dom*sweep*.py' -o -iname '*playwright*.py' \) 2>/dev/null | sort -u)
          printf 'CANDIDATE_COUNT=%s\n' "${#files[@]}"
          for f in "${files[@]}"; do
            [ -r "$f" ] || continue
            printf 'FILE=%s\n' "$f"
            sha256sum "$f" | sed 's/^/SHA256=/'
            printf 'BYTES=%s\n' "$(stat -c %s "$f")"
            printf 'MTIME=%s\n' "$(stat -c %y "$f")"
            # Policy markers only; no source lines/content.
            for m in 'GET' 'HEAD' 'OPTIONS' '/Operar' 'api/logger' 'zendesk-session' 'FAIL-CLOSED' 'FAIL_CLOSED' 'route.abort' 'abort(' 'third-party' 'first-party'; do
              c=$(grep -Fio -- "$m" "$f" 2>/dev/null | wc -l || true)
              printf 'MARKER[%s]=%s\n' "$m" "$c"
            done
            # Conservative secret-literal scan. Only counts patterns, never prints matches.
            python3 - "$f" <<'PY'
          import re,sys
          p=sys.argv[1]
          try: s=open(p,'r',encoding='utf-8',errors='ignore').read()
          except Exception: s=''
          patterns={
            'credential_assignment':r'(?i)(password|passwd|secret|token|api[_-]?key|cookie|authorization)\s*=\s*[\"\'][^\"\']{8,}[\"\']',
            'bearer_literal':r'(?i)bearer\s+[A-Za-z0-9._~+/-]{20,}',
            'jwt_literal':r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}',
          }
          for k,r in patterns.items(): print(f'SECRET_PATTERN[{k}]={len(re.findall(r,s))}')
          PY
            echo '---'
          done
          echo 'BROWSER_V3_IDENTITY_AUDIT=COMPLETE_READ_ONLY'
          REMOTE
          cp /tmp/browser-v3.txt POROTA_RC6_BROWSER_V3_HOST_IDENTITY_2026-09-08.txt
      - name: Commit sanitized identity report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add POROTA_RC6_BROWSER_V3_HOST_IDENTITY_2026-09-08.txt
          git commit -m 'audit(rc6): record Browser V3 host identity'
          git push origin HEAD:checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
