name: RC6 IOL freshness and family coverage for 27 November

on:
  pull_request:
    branches: [audit/rc6-iol-coverage-rca-base-20261128]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rc6-iol-wheel-coverage-readonly
  cancel-in-progress: false

jobs:
  evidence:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/rc6-iol-coverage-rca-20261128' && github.actor == 'mbalbo2023' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9eb17b3b93d200daba280ed06e069093516a6087
          persist-credentials: false
      - name: Reconcile saved IOL selections, quotes and decisions
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: python3 -B -m scripts.rc6_iol_214_readonly --output "$RUNNER_TEMP/rc6-iol-installed-214-auth.json"
      - name: Publish sanitized evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-iol-wheel-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-iol-installed-214-auth.json
          if-no-files-found: error
          retention-days: 30
