name: RC6 history backfill planner validation 2026-09-07
on:
  push:
    branches: [feature/rc6-history-backfill-planner-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_history_backfill_planner_rc6.py
      - run: python -m py_compile fj_history_backfill_planner_rc6.py
      - run: python -c "import fj_history_backfill_planner_rc6 as m; m.assert_shadow_only(); print('BACKFILL_PLANNER_SHADOW=GREEN')"
