name: RC6 696 bounded storage read only

on:
  push:
    branches: [fix/rc6-696-consolidated-20261022]
    paths:
      - .github/workflows/rc6-696-storage-readonly-once.yml

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bounded and read-only source
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/rc6_storage_wiring_audit.py
          python - <<'PY'
          from pathlib import Path
          source=Path("scripts/rc6_storage_wiring_audit.py").read_text()
          for guard in ("mode=ro", "query_only=ON", "MAX_SAMPLE = 1000", "MAX_OPCODES = 200_000"):
              assert guard in source, guard
          PY
      - name: Sample host SQLite metadata without mutation
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$DO_SSH_KEY" && test -n "$DO_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts' EXIT
          timeout 45s ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$DO_USER@$DO_HOST" \
            'cd /opt/porota-trading && timeout 30s python3 - --database-only --database data/market_history.db --sample 100' \
            < scripts/rc6_storage_wiring_audit.py | tee rc6-696-storage.json
          python - <<'PY'
          import json
          report=json.load(open("rc6-696-storage.json"))
          assert report["schema"]=="RC6_STORAGE_WIRING_READONLY_V1"
          assert report["wiring"] is None
          assert len(report["databases"])==1
          assert report["databases"][0]["read_only"] is True
          assert report["databases"][0]["deletion_allowed"] is False
          PY
      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-696-storage-readonly-${{ github.sha }}
          path: rc6-696-storage.json
          if-no-files-found: warn
          retention-days: 14
