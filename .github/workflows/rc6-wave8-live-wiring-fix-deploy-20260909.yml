name: RC6 Wave8 Live Wiring Fix Deploy 2026-09-09

on:
  push:
    branches: [fix/rc6-wave8-live-wiring-20260909]
    paths:
      - '.github/workflows/rc6-wave8-live-wiring-fix-deploy-20260909.yml'

permissions:
  contents: write

jobs:
  materialize-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rc6-wave8-live-wiring-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize canonical Wave8 live wiring fix
        shell: bash
        run: |
          set -euo pipefail
          cat > zz_wave8_dashboard_live_rc6.py <<'PYFILE'
          """RC6 Wave8 live-wiring closure.

          Dashboard-only, read-only wiring. Adds the missing Risk destination,
          keeps tabular data as real rows/columns, and wires SHADOW learning
          evidence into live rendered pages. No broker/order capability.
          """
          from __future__ import annotations
          import html
          from fastapi import Header, Query, Request
          from fastapi.responses import HTMLResponse
          import bg_paper_dashboard as bg
          import et_shadow_learning_rc6 as shadow_learning
          import fi_event_risk_shadow_rc6 as event_contract

          _installed=False
          CLASSIC_CSS="""
          <style id='porota-rc6-classic-responsive'>
          .paper-card{max-width:100%;overflow:hidden!important}
          .paper-table,.classic-responsive-table{display:table!important;width:100%!important;max-width:100%!important;table-layout:auto!important;border-collapse:collapse!important}
          .paper-table thead,.classic-responsive-table thead{display:table-header-group!important}
          .paper-table tbody,.classic-responsive-table tbody{display:table-row-group!important}
          .paper-table tr,.classic-responsive-table tr{display:table-row!important}
          .paper-table th,.paper-table td,.classic-responsive-table th,.classic-responsive-table td{display:table-cell!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;min-width:0!important}
          .porota-cell-label{display:none!important}
          @media(max-width:900px){.paper-table,.classic-responsive-table{font-size:.75rem!important}.paper-table th,.paper-table td,.classic-responsive-table th,.classic-responsive-table td{padding:5px 4px!important}}
          @media(max-width:620px){.paper-table,.classic-responsive-table{font-size:.68rem!important}.paper-table th,.paper-table td,.classic-responsive-table th,.classic-responsive-table td{padding:4px 3px!important}}
          </style>
          """

          def _esc(v): return html.escape(str(v if v not in (None,'') else '—'))

          def _learning_section():
              data=shadow_learning.collect()
              rows=[]
              for key,item in sorted((data.get('policies') or {}).items()):
                  m=item.get('metrics') or {}
                  rows.append('<tr>'
                    f'<td><b>{_esc(key)}</b></td><td>{_esc(item.get("stage"))}</td>'
                    f'<td>{_esc(item.get("authority"))}</td><td>{_esc(item.get("sessions"))}</td>'
                    f'<td>{_esc(m.get("evaluated"))}</td><td>{_esc(item.get("automatic_promotion"))}</td></tr>')
              body=''.join(rows) or "<tr><td colspan='6'>Recolectando evidencia SHADOW.</td></tr>"
              return """<section class='paper-card' id='wave8-shadow-learning-live'><h2>Aprendizaje SHADOW — wiring vivo</h2>
              <p class='paper-muted'>Evidencia contrafactual de solo lectura. No autoriza promoción automática ni órdenes reales.</p>
              <table class='paper-table classic-responsive-table'><thead><tr><th>Política</th><th>Etapa</th><th>Autoridad</th><th>Ruedas</th><th>Evaluadas</th><th>Auto promoción</th></tr></thead><tbody>"""+body+"</tbody></table></section>"

          def _risk_html():
              observer=(bg._rows('SELECT mode,process_state,session_state,ppi_auth,real_orders_sent,heartbeat_at FROM observer_state WHERE id=1') or [{}])[0]
              risk_tables=bg._rows("SELECT name FROM sqlite_master WHERE type='table' AND (lower(name) LIKE '%risk%' OR lower(name) LIKE '%gate%' OR lower(name) LIKE '%alert%') ORDER BY name")
              rows=[]
              for r in risk_tables:
                  name=str(r.get('name') or '')
                  try: n=(bg._rows(f'SELECT COUNT(*) AS n FROM "{name}"') or [{'n':'—'}])[0].get('n')
                  except Exception: n='—'
                  rows.append(f'<tr><td><b>{_esc(name)}</b></td><td>{_esc(n)}</td><td>Persistencia runtime</td></tr>')
              table=''.join(rows) or "<tr><td colspan='3'>No se encontraron tablas de riesgo; requiere reconciliación.</td></tr>"
              return f"""<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>{bg.THEME}{bg.TABLE_A11Y_CSS}{CLASSIC_CSS}</head><body>{bg.top_nav_html()}<main class='paper-page'>
              <h1>Riesgo</h1><div class='paper-grid'>
              <div class='paper-card'><h3>Modo</h3><b class='metric'>{_esc(observer.get('mode'))}</b></div>
              <div class='paper-card'><h3>Órdenes reales</h3><b class='metric'>{_esc(observer.get('real_orders_sent'))}</b><div class='paper-muted'>Debe ser 0</div></div>
              <div class='paper-card'><h3>PPI</h3><b class='metric'>{_esc(observer.get('ppi_auth'))}</b></div>
              <div class='paper-card'><h3>Event Risk</h3><b class='metric'>SHADOW</b><div class='paper-muted'>{len(event_contract.EVENT_TYPES)} tipos contractuales</div></div>
              </div>
              <section class='paper-card'><h2>Persistencia de riesgo / gates / alertas</h2><table class='paper-table classic-responsive-table'><thead><tr><th>Tabla</th><th>Registros</th><th>Rol</th></tr></thead><tbody>{table}</tbody></table></section>
              {_learning_section()}</main></body></html>"""

          def _append_before_main_end(page, fragment):
              marker='</main>'
              return page.replace(marker,fragment+marker,1) if marker in page else page+fragment

          def install(app, check_auth):
              global _installed
              if _installed: return
              _installed=True
              if 'porota-rc6-classic-responsive' not in bg.TABLE_A11Y_CSS:
                  bg.TABLE_A11Y_CSS += CLASSIC_CSS
              old_learning=bg.learning_page
              old_validation=bg.validation_page
              def learning_page_live(): return _append_before_main_end(old_learning(),_learning_section())
              def validation_page_live(): return _append_before_main_end(old_validation(),_learning_section())
              bg.learning_page=learning_page_live
              bg.validation_page=validation_page_live
              @app.get('/riesgo',response_class=HTMLResponse)
              def riesgo(request:Request,token:str=Query(default=''),authorization:str|None=Header(default=None)):
                  bg._authorize(check_auth,request,token,authorization)
                  return HTMLResponse(_risk_html())
          PYFILE

          python - <<'PY'
          from pathlib import Path
          nav=Path('da_dashboard_ux_hf6.py')
          s=nav.read_text(encoding='utf-8')
          needle='    NavItem("/historicos", "Históricos"),'
          insert='    NavItem("/riesgo", "Riesgo"),\n'+needle
          if 'NavItem("/riesgo", "Riesgo")' not in s:
              assert needle in s
              s=s.replace(needle,insert,1)
              nav.write_text(s,encoding='utf-8')
          od=Path('o_dashboard.py')
          s=od.read_text(encoding='utf-8')
          anchor='import bg_paper_dashboard\nbg_paper_dashboard.install(app, _check_auth)'
          add=anchor+'\n\n# RC6 Wave8: live wiring closure (Risk + classic tables + SHADOW learning).\nimport zz_wave8_dashboard_live_rc6\nzz_wave8_dashboard_live_rc6.install(app, _check_auth)'
          if 'zz_wave8_dashboard_live_rc6.install' not in s:
              assert anchor in s
              s=s.replace(anchor,add,1)
              od.write_text(s,encoding='utf-8')
          PY
          python -m py_compile zz_wave8_dashboard_live_rc6.py da_dashboard_ux_hf6.py o_dashboard.py et_shadow_learning_rc6.py fi_event_risk_shadow_rc6.py
          grep -q 'NavItem("/riesgo", "Riesgo")' da_dashboard_ux_hf6.py
          grep -q 'zz_wave8_dashboard_live_rc6.install' o_dashboard.py
          grep -q 'porota-rc6-classic-responsive' zz_wave8_dashboard_live_rc6.py
          ! grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order' zz_wave8_dashboard_live_rc6.py
          git config user.name 'porota-rc6-bot'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add zz_wave8_dashboard_live_rc6.py da_dashboard_ux_hf6.py o_dashboard.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(rc6): wire Wave8 risk tables and shadow learning live'
            git push origin HEAD:fix/rc6-wave8-live-wiring-20260909
          fi
          echo "MATERIALIZED_SHA=$(git rev-parse HEAD)"

      - name: Validate and build repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest requests
          python -m py_compile zz_wave8_dashboard_live_rc6.py da_dashboard_ux_hf6.py o_dashboard.py
          PYTHONPATH=. pytest -q tests/test_shadow_learning_rc6.py tests/test_forward_lab_metrics_hf2.py tests/test_dashboard_global_a11y_rc5.py tests/test_dashboard_table_layout_rc6.py
          ! git diff HEAD^ -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          docker build --pull=false -t porota-trading-bot:rc6-wave8-live-fix .
          echo WAVE8_FIX_CANDIDATE=GREEN

      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_w8fix"
          chmod 600 "$HOME/.ssh/porota_w8fix"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and prove Wave8 live wiring end to end
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          TARGET_BRANCH=fix/rc6-wave8-live-wiring-20260909
          ssh -i "$HOME/.ssh/porota_w8fix" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          CURRENT=$(git rev-parse HEAD)
          echo "PRE_HEAD=$CURRENT"
          test "$CURRENT" = "7531cbbb625d124657fb9fbbf38c311740caa486"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'; c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|{mode}|{real}'); assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          TMP=$(mktemp -d "$HOME/porota-w8fix.XXXXXX")
          trap 'git -C /opt/porota-trading worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label porota.wave=rc6-wave8-live-fix -t porota-trading-bot:17.0.0-rc6 "$TMP/source"
          git checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          git branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH" >/dev/null 2>&1 || true
          sudo -n python3 /opt/porota-trading/porota_mode_manager.py simulation
          sleep 15
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import da_dashboard_ux_hf6 as nav, bg_paper_dashboard as bg, zz_wave8_dashboard_live_rc6 as fix
          labels=[x.label for x in nav.TOP_NAV]; hrefs=[x.href for x in nav.TOP_NAV]
          print('TOP_NAV='+'|'.join(f'{a}:{b}' for a,b in zip(labels,hrefs)))
          assert '/riesgo' in hrefs and 'Riesgo' in labels
          assert 'porota-rc6-classic-responsive' in bg.TABLE_A11Y_CSS
          assert 'tr.porota-record-row{display:block' not in bg.TABLE_A11Y_CSS
          learning=bg.learning_page(); validation=bg.validation_page()
          assert 'wave8-shadow-learning-live' in learning
          assert 'wave8-shadow-learning-live' in validation
          print('WAVE8_DASHBOARD_WIRING=GREEN')
          PY
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os,urllib.request,urllib.error
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          for p in ('/','/riesgo','/aprendizaje','/validacion'):
              req=urllib.request.Request('http://127.0.0.1:8000'+p)
              if token:
                  req.add_header('Authorization','Bearer '+token); req.add_header('X-Dashboard-Token',token)
              with urllib.request.urlopen(req,timeout=10) as r:
                  body=r.read().decode('utf-8','replace'); print(f'HTTP|{p}|{r.status}|bytes={len(body)}')
                  assert r.status==200
                  if p=='/': assert 'Riesgo' in body
                  if p=='/riesgo': assert 'porota-rc6-classic-responsive' in body and 'Órdenes reales' in body
                  if p in ('/aprendizaje','/validacion'): assert 'wave8-shadow-learning-live' in body
          PY
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'; c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|{mode}|{real}'); assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          echo "POST_HEAD=$(git rev-parse HEAD)"
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          echo WAVE8_FULL_LIVE_WIRING=GREEN
          REMOTE
