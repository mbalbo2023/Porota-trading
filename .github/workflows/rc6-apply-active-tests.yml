name: RC6 apply validated runtime/test alignment

on:
  push:
    branches:
      - candidate/v17.0.0-rc6-weekend-20260905
    paths:
      - '.github/workflows/rc6-apply-active-tests.yml'

permissions:
  contents: write

concurrency:
  group: rc6-apply-active-tests
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0

      - name: Verify RC5 ancestry and committed DailyRisk persistence fix
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
          grep -q 'except ConcurrentRiskGateError:' dh_paper_dynamic_risk_gate_hf6.py
          grep -q 'c.commit()' dh_paper_dynamic_risk_gate_hf6.py

      - name: Align only exact stale test forms
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/rc6_apply_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_partial_allocation_integrity_v17.py')
          text=p.read_text(encoding='utf-8')
          old='from pathlib import Path\nimport sys\n'
          new='from pathlib import Path\nfrom dataclasses import replace\nimport sys\n'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('partial-allocation import anchor ambiguous')
              p.write_text(text.replace(old,new),encoding='utf-8')
              print('RC6_PARTIAL_REPLACE_IMPORT=APPLIED')
          elif new in text:
              print('RC6_PARTIAL_REPLACE_IMPORT=ALREADY_APPLIED')
          else:
              raise SystemExit('partial-allocation import anchor not recognized')
          PY

      - name: Verify test-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain tests/)"
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^.. tests/' || true)"
          git diff -- tests/

      - name: Build current runtime with aligned tests
        run: docker build --pull=false -t porota-rc6-alignment:${GITHUB_SHA} .

      - name: Active RC6 offline pytest gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app:/app/tests \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            --entrypoint bash porota-rc6-alignment:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              --ignore=tests/test_hotfix_rc3_hf2.py \
              --ignore=tests/test_hotfix_rc3_hf4.py \
              --ignore=tests/test_hotfix_rc3_hf6.py \
              --ignore=tests/test_intraday_scalping_hf3.py \
              --ignore=tests/test_rc4_acceptance.py \
              --ignore=tests/test_rc4_hf1_last_mile.py \
              --ignore=tests/test_rc4_hf2_consolidation.py'

      - name: Commit only validated active tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Porota RC6 CI'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add tests/
          git diff --cached --check
          git commit -m 'RC6 tests: align active fail-closed semantics'
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
