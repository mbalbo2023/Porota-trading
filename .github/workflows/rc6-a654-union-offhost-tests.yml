# A654 — Control-plane only. Deliberately NOT part of the product deploy pipeline.
# This file must be reviewed and merged into main before a manual run is possible.
name: RC6 A654 OFFHOST immutable-union tests

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full, exact 40-character commit SHA of DRAFT #945 (no branch or tag)'
        required: true
        type: string

# No API privileges: the public, SHA-pinned Git fetch below is anonymous.
permissions: {}

concurrency:
  group: rc6-a654-offhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-sha-offhost:
    name: Exact SHA, isolated offline synthetic regressions
    if: github.repository == 'mbalbo2023/Porota-trading' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUESTED_SHA: ${{ inputs.target_sha }}
      EXPECTED_SHA: cc0edf5e3c213b0fb6eccbe1818ca6f4f7fc0ff9
      EXPECTED_TREE: 2b83ac38f605d52b0181af01ff30232e075ee0ff
      REVIEW_BASE_SHA: 975f31c6374dd628d507850e0786201bc4ce779e
      A654_DATA: /tmp/rc6-a654-${{ github.run_id }}
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - name: Fail closed on arbitrary SHA, malformed input or noncanonical ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$REQUESTED_SHA" != "$EXPECTED_SHA" ]]; then
            echo '::error::A654 only accepts the immutable, reviewed DRAFT #945 SHA.'
            exit 41
          fi
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo '::error::A654 dispatch must use the reviewed main control-plane workflow.'
            exit 42
          fi
          echo "Pinned source SHA: $EXPECTED_SHA"
          echo "Pinned source tree: $EXPECTED_TREE"

      # Public GitHub checkout is anonymous. The only other approved egress is
      # inert PyPI package DATA fetching below, before network isolation. No
      # GitHub token, SSH, provider or droplet credentials are ever injected.
      - name: Fetch exact public Git SHA without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/mbalbo2023/Porota-trading.git
          git -c credential.helper= -c core.askPass=/usr/bin/false \
            fetch --no-tags --depth=1 origin "$REQUESTED_SHA"
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD

      - name: Verify immutable SHA/tree and bounded test inventory
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          actual_tree="$(git rev-parse --verify HEAD^{tree})"
          if [[ "$actual_sha" != "$EXPECTED_SHA" || "$actual_tree" != "$EXPECTED_TREE" ]]; then
            echo "::error::Source identity mismatch SHA=$actual_sha TREE=$actual_tree"
            exit 43
          fi
          git ls-files --error-unmatch -- \
            tests/test_rc6_a653_budget_fallback_lower_denied.py \
            tests/test_rc6_a653_book1_provenance_wiring.py \
            tests/test_rc6_a222_spot_scalping_guarded_release.py \
            tests/test_rc6_a321_fi_native_paper_market_sale.py \
            tests/test_rc6_a456_fi_native_maturity_chain.py \
            tests/test_rc6_fi_sell_persisted_evidence.py \
            tests/test_rc6_fi_sell_supervisor_wiring.py \
            tests/test_rc6_fi_sell_ro_snapshot_audit.py >/dev/null
          if ! command -v unshare >/dev/null || ! command -v ip >/dev/null || \
             ! command -v runuser >/dev/null || ! command -v python3 >/dev/null; then
            echo '::error::Offline build/network isolation tools unavailable; fail closed.'
            exit 44
          fi

      # Download inert source data and prebuilt wheels ONLY. No source archives
      # are unpacked, built, installed or imported while egress exists. Both
      # PPI-specific distributions are only sdists on official PyPI; hashes
      # below are pinned from the provider's package release pages.
      - name: Download reviewed PyPI package DATA; verify SDK SHA256 before isolation
        shell: bash
        run: |
          set -euo pipefail
          # Never import source-tree Python from outside the network sandbox.
          cd /tmp
          python3 -m pip --version
          python3 -m venv --help >/dev/null
          mkdir -p "$A654_DATA/source" "$A654_DATA/wheels"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          source = Path(os.environ['A654_DATA']) / 'source'
          fixed = (
              ('ppi-client', '1.3.0', 'ppi_client-1.3.0.tar.gz',
               'a930f7f4cc2531515c4e101c467126bf78d905880475b558ab1444461025d3eb'),
              ('signalrcorePPI', '0.9.2', 'signalrcorePPI-0.9.2.tar.gz',
               'd3968eefac13f1c55313987cd77d4633cd2518efe8b341349e8ae8becc6bd091'),
          )
          for project, version, filename, sha256 in fixed:
              metadata_url = f'https://pypi.org/pypi/{project}/{version}/json'
              with urlopen(Request(metadata_url, headers={'User-Agent':'RC6-A654-data-only'}), timeout=30) as response:
                  metadata = json.load(response)
              candidates = [entry for entry in metadata['urls']
                            if entry['packagetype'] == 'sdist' and entry['filename'] == filename]
              if len(candidates) != 1 or candidates[0]['digests']['sha256'] != sha256:
                  raise SystemExit(f'A654 source metadata digest mismatch: {project}')
              location = candidates[0]['url']
              parsed = urlsplit(location)
              if parsed.scheme != 'https' or parsed.hostname != 'files.pythonhosted.org' or not parsed.path.endswith('/'+filename):
                  raise SystemExit(f'A654 source URL not pinned to official PyPI host: {project}')
              with urlopen(Request(location, headers={'User-Agent':'RC6-A654-data-only'}), timeout=30) as response:
                  archive = response.read(131073)
              if len(archive) > 131072 or hashlib.sha256(archive).hexdigest() != sha256:
                  raise SystemExit(f'A654 downloaded source digest mismatch: {project}')
              (source / filename).write_bytes(archive)
              print(f'A654 VERIFIED INERT SOURCE DATA {project}=={version} sha256={sha256}')
          PY
          # Only listed, exact versions and binary wheels; no transitive resolver
          # or requirements.txt. Repo lock is preferred; msgpack 1.2.4 is
          # intentional py3.12 wheel compatibility drift vs lock's 1.0.2.
          python3 -m pip --isolated download --no-deps --only-binary=:all: \
            --index-url https://pypi.org/simple --dest "$A654_DATA/wheels" \
            'setuptools==80.9.0' 'wheel==0.45.1' 'packaging==25.0' \
            'pytest==9.1.1' 'pluggy==1.6.0' 'iniconfig==2.3.0' 'pygments==2.21.0' \
            'requests==2.34.2' 'urllib3==2.8.0' 'certifi==2026.7.22' \
            'charset-normalizer==3.5.1' 'idna==3.20' 'msgpack==1.2.4' \
            'python-dotenv==1.2.3' 'requests-toolbelt==1.0.0' \
            'websocket-client==1.0.0'
          # Only a disposable CI-runner directory becomes writable to the
          # isolated nobody UID. The source checkout remains runner-owned RO.
          sudo -n install -d -o nobody -g nogroup -m 0700 "$A654_DATA/sandbox"

      # Linux network namespace has no external interfaces/routes. All imported
      # SDK setup/build code and test collection run as unprivileged nobody with
      # a blank environment (no runner/docker groups or ambient tokens). All
      # package installs use --no-index after egress is irrevocably disabled.
      - name: Build verified SDK sdists and test PAPER code only in empty network namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo -n unshare --net -- /bin/bash -c '
            set -euo pipefail
            if [[ -n "$(ip -4 route show default)" || -n "$(ip -6 route show default)" ]]; then
              echo "::error::Network namespace still has a default route; refuse tests."
              exit 45
            fi
            echo "Network namespace isolated: no IPv4/IPv6 default route; SDK build is offline."
            exec runuser -u nobody -- env -i \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              HOME=/tmp LANG=C.UTF-8 A654_DATA="$1" \
              PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              /bin/bash -c '\''
                set -euo pipefail
                printf "%s  %s\n" \
                  a930f7f4cc2531515c4e101c467126bf78d905880475b558ab1444461025d3eb \
                  "$A654_DATA/source/ppi_client-1.3.0.tar.gz" | sha256sum --check --status
                printf "%s  %s\n" \
                  d3968eefac13f1c55313987cd77d4633cd2518efe8b341349e8ae8becc6bd091 \
                  "$A654_DATA/source/signalrcorePPI-0.9.2.tar.gz" | sha256sum --check --status
                python3 -m venv "$A654_DATA/sandbox/venv"
                py="$A654_DATA/sandbox/venv/bin/python"
                "$py" -m pip install --no-index --no-deps --only-binary=:all: \
                  --find-links="$A654_DATA/wheels" setuptools==80.9.0 wheel==0.45.1
                mkdir -p "$A654_DATA/sandbox/built"
                "$py" -m pip wheel --no-index --no-deps --no-build-isolation \
                  --wheel-dir "$A654_DATA/sandbox/built" \
                  "$A654_DATA/source/ppi_client-1.3.0.tar.gz" \
                  "$A654_DATA/source/signalrcorePPI-0.9.2.tar.gz"
                "$py" -m pip install --no-index --no-deps \
                  --find-links="$A654_DATA/wheels" \
                  --find-links="$A654_DATA/sandbox/built" \
                  ppi-client==1.3.0 signalrcorePPI==0.9.2 \
                  setuptools==80.9.0 wheel==0.45.1 packaging==25.0 \
                  pytest==9.1.1 pluggy==1.6.0 iniconfig==2.3.0 pygments==2.21.0 \
                  requests==2.34.2 urllib3==2.8.0 certifi==2026.7.22 \
                  charset-normalizer==3.5.1 idna==3.20 msgpack==1.2.4 \
                  python-dotenv==1.2.3 requests-toolbelt==1.0.0 websocket-client==1.0.0
                "$py" -m pip check
                "$py" -m pytest -q -p no:cacheprovider \
                tests/test_rc6_a653_budget_fallback_lower_denied.py \
                tests/test_rc6_a653_book1_provenance_wiring.py \
                tests/test_rc6_a222_spot_scalping_guarded_release.py \
                tests/test_rc6_a321_fi_native_paper_market_sale.py \
                tests/test_rc6_a456_fi_native_maturity_chain.py \
                tests/test_rc6_fi_sell_persisted_evidence.py \
                tests/test_rc6_fi_sell_supervisor_wiring.py \
                tests/test_rc6_fi_sell_ro_snapshot_audit.py
              '\''
          ' bash "$A654_DATA"
          git diff --exit-code HEAD --

      - name: Record precise evidence scope (never runtime readiness)
        if: always()
        shell: bash
        run: |
          {
            echo '### A654 immutable OFFHOST union test receipt'
            echo '- Mode: synthetic isolated test only; **NOT** Predeploy, Deploy, runtime or PPI authentication.'
            echo "- Required source commit: \`$EXPECTED_SHA\`"
            echo "- Required source tree: \`$EXPECTED_TREE\`"
            echo "- Review base #940: \`$REVIEW_BASE_SHA\`"
            echo "- GitHub Actions job state: **${{ job.status }}**"
            echo '- External fetch: anonymous GitHub source and reviewed PyPI archive/wheel DATA only, before isolation; no provider/host GET.'
            echo '- SDK source SHA256 is pinned; sdist setup/build, wheel install and tests run as nobody, env -i, network namespace without external routes.'
            echo '- Dependency policy: repo lock preferred; msgpack 1.2.4 is explicit Python 3.12 wheel drift from lock 1.0.2. No release-equivalence claim.'
            echo '- No executable product artifact build/upload, no production host mutation, no real orders.'
            echo '- PAPER readiness, ten-family admission, real PPI PIT and Book2 signer: **NO_VERIFICADO**.'
          } >> "$GITHUB_STEP_SUMMARY"
