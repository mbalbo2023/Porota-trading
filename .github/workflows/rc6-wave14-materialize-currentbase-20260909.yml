name: RC6 Wave14 Materialize Currentbase 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave14-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave14-materialize-currentbase-20260909.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize selected SRE components
        run: |
          set -euo pipefail
          git fetch --no-tags origin feature/rc6-sre-health-split-20260907 feature/rc6-operational-health-alert-outbox-20260908
          for p in rc6_fast_functional_health.py rc6_full_db_integrity.py rc6_preopen_host_hardened.py scripts/rc6_sre_preopen_postclose_deploy.sh systemd/porota-fast-functional-health-rc6.service systemd/porota-fast-functional-health-rc6.timer systemd/porota-full-db-integrity-rc6.service tests/test_sre_health_split_rc6.py; do mkdir -p "$(dirname "$p")"; git show "origin/feature/rc6-sre-health-split-20260907:$p" > "$p"; done
          for p in rc6_operational_alerts.py tests/test_rc6_operational_alerts.py; do mkdir -p "$(dirname "$p")"; git show "origin/feature/rc6-operational-health-alert-outbox-20260908:$p" > "$p"; done
          python -m pip install -q pytest
          python -m py_compile rc6_fast_functional_health.py rc6_full_db_integrity.py rc6_preopen_host_hardened.py rc6_operational_alerts.py
          python -m pytest -q tests/test_sre_health_split_rc6.py tests/test_rc6_operational_alerts.py
          grep -RniE 'send_order|place_order|cancel_order|/Operar/|budget_order' rc6_fast_functional_health.py rc6_full_db_integrity.py rc6_preopen_host_hardened.py rc6_operational_alerts.py && exit 1 || true
          echo WAVE14_SRE=CODE_READY_CANDIDATE
          echo ORDER_ROUTES=NOT_CALLED
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rc6_fast_functional_health.py rc6_full_db_integrity.py rc6_preopen_host_hardened.py rc6_operational_alerts.py scripts/rc6_sre_preopen_postclose_deploy.sh systemd/porota-fast-functional-health-rc6.service systemd/porota-fast-functional-health-rc6.timer systemd/porota-full-db-integrity-rc6.service tests/test_sre_health_split_rc6.py tests/test_rc6_operational_alerts.py
          git diff --cached --quiet || git commit -m 'feat(rc6 wave14): materialize tested SRE health and alerts'
          git push origin HEAD:deploy-prep/rc6-wave14-currentbase-20260909
