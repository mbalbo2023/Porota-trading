name: Porota Predeploy V2

on:
  pull_request:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: porota-predeploy-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-gate:
    name: Exact artifact predeploy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: porota-predeploy-v2:${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified2026-10-05
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set reviewed Python tooling platform
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified2026-10-05
        with:
          python-version: "3.11.16"

      - name: Freeze checkout byte provenance before build
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          python scripts/porota_artifact_provenance.py create \
            --repo-root . \
            --candidate-sha "$CANDIDATE_SHA" \
            --tree-sha "$CANDIDATE_TREE" \
            --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --json-out /tmp/porota-source-provenance.json
          SOURCE_MANIFEST_SHA256="$(sha256sum POROTA_SOURCE_PROVENANCE.json | awk '{print $1}')"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"
          echo "SOURCE_MANIFEST_SHA256=$SOURCE_MANIFEST_SHA256" >> "$GITHUB_ENV"
          python - <<'PY_ORIGIN'
          import os
          from pathlib import Path
          from scripts.porota_artifact_provenance import canonical_bytes
          from scripts.porota_predeploy_binding import api_get, REPOSITORY, WORKFLOW_PATH
          assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          assert os.environ['GITHUB_WORKFLOW_REF'].split('@')[0] == REPOSITORY + '/' + WORKFLOW_PATH
          workflow=api_get('/actions/workflows/porota-predeploy-v2.yml')
          assert workflow['path'] == WORKFLOW_PATH and workflow['state'] == 'active'
          origin={'repository':REPOSITORY,'workflow_path':WORKFLOW_PATH,'workflow_id':workflow['id'],
                  'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'event':'pull_request','candidate_sha':os.environ['CANDIDATE_SHA']}
          Path('/tmp/porota-predeploy-origin.json').write_bytes(canonical_bytes(origin))
          PY_ORIGIN

      - name: Policy invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'required_mode: PRODUCTION_PAPER' ops/policy/porota-policy.yaml
          grep -Fq 'real_trading_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'rollback_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'build_once_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'manual_partial_runtime_file_lists_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'droplet_disk_pretransfer_gate_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'droplet_disk_guard_must_run_before_transfer: true' ops/policy/porota-policy.yaml
          grep -Fq 'paper_backup_keep_newest: 3' ops/policy/porota-policy.yaml
          grep -Fq 'history_backup_keep_newest: 3' ops/policy/porota-policy.yaml
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('ops/policy/rc6-disk-housekeeping-v1.json').read_text())
          root_policy=Path('ops/policy/porota-policy.yaml').read_text()
          assert 'droplet_disk_pretransfer_min_free_bytes: 0' in root_policy
          assert 'droplet_disk_admission_authority: ops/policy/rc6-disk-housekeeping-v1.json' in root_policy
          assert 'droplet_disk_residual_reserve_bytes: 2147483648' in root_policy
          assert p['disk']['deploy_pretransfer_min_free_bytes'] == 0
          assert p['disk']['post_cleanup_min_free_bytes'] == 2 * 1024**3
          f=p['deploy']['pretransfer_formula']
          assert f['image_tar_multiplier'] == 1
          assert f['image_unpacked_multiplier'] == 1
          assert f['bundle_multiplier'] == 2
          assert f['fixed_headroom_bytes'] == 2 * 1024**3
          assert p['backups']['paper']['keep_newest'] == 3
          assert p['backups']['history']['keep_newest'] == 3
          assert p['deploy']['canonical_workflow'] == '.github/workflows/porota-deploy-v2-promote.yml'
          print('POROTA_DISK_POLICY_GATE=GREEN')
          PY
          echo 'POROTA_POLICY_GATE=GREEN'

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.porota_artifact_provenance import verify_source_manifest
          source=verify_source_manifest(Path('.'), Path('POROTA_SOURCE_PROVENANCE.json'), os.environ['CANDIDATE_SHA'], os.environ['CANDIDATE_TREE'])
          count=0
          for row in source['files']:
              path=Path(row['path'])
              if path.suffix == '.py' and path.parts[0] not in {'tests','docs'}:
                  compile(path.read_bytes(), str(path), 'exec')
                  count+=1
          assert count > 0
          print('POROTA_COMPILED_SOURCE_FILES=' + str(count))
          PY
          echo 'POROTA_COMPILE_GATE=GREEN'

      - name: Fail-closed negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python tests/ci_frozen_candidate_contract.py negative \
            --evidence /tmp/porota-negative-fixtures.json
          test "$(python -c 'import json; print(len(json.load(open("/tmp/porota-negative-fixtures.json"))))')" -eq 7
          echo 'POROTA_NEGATIVE_FIXTURES=GREEN'

      - name: Governed automatic test discovery and execution
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.build.lock.txt
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            --no-binary=msgpack,ppi-client,signalrcoreppi,ta --no-build-isolation -r requirements.lock.txt
          python -m pip check
          python -m pip freeze --all > /tmp/porota-installed-dependencies.txt
          python - <<'PY'
          from pathlib import Path
          import yaml

          policy = yaml.safe_load(Path('ops/policy/test-policy.yaml').read_text(encoding='utf-8'))
          governance = policy['test_governance']
          scope = policy['productive_scope']
          assert governance['automatic_discovery_required'] is True
          assert governance['manual_test_file_allowlist_as_primary_ci'] is False
          assert scope['roots'] == ['.'], 'productive scope must discover from repository root'
          exclusions = scope.get('exclusions', [])
          args = list(scope['roots'])
          evidence = []
          for item in exclusions:
              path = Path(item['path'])
              successor = Path(item['successor'])
              assert path.is_file(), f'excluded path missing: {path}'
              assert successor.is_file(), f'exclusion successor missing: {successor}'
              assert item.get('classification') and item.get('reason') and item.get('owner')
              args.append(f'--ignore={path.as_posix()}')
              evidence.append('|'.join((path.as_posix(), item['classification'], successor.as_posix())))
          Path('/tmp/porota-test-args.txt').write_text('\n'.join(args) + '\n', encoding='utf-8')
          Path('/tmp/porota-test-exclusions.txt').write_text('\n'.join(evidence) + ('\n' if evidence else ''), encoding='utf-8')
          print(f'POROTA_TEST_EXCLUSIONS={len(exclusions)}')
          PY
          mapfile -t TEST_ARGS < /tmp/porota-test-args.txt
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --collect-only -q "${TEST_ARGS[@]}" > /tmp/porota-test-collection.txt
          set +e
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q "${TEST_ARGS[@]}" --junitxml=/tmp/porota-governed-tests.xml
          TEST_RC=$?
          set -e
          TEST_RC="$TEST_RC" python - <<'PY'
          from pathlib import Path
          import json, os, re, xml.etree.ElementTree as ET

          collection = Path('/tmp/porota-test-collection.txt').read_text(encoding='utf-8')
          discovered = sum(int(n) for n in re.findall(r': (\d+)$', collection, re.MULTILINE))
          suite = ET.parse('/tmp/porota-governed-tests.xml').find('.//testsuite')
          tests = int(suite.get('tests', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          skipped_nodes = [node for node in suite.iter('skipped')]
          xfail = sum(node.get('type') == 'pytest.xfail' for node in skipped_nodes)
          skipped = len(skipped_nodes) - xfail
          exclusions = [line for line in Path('/tmp/porota-test-exclusions.txt').read_text(encoding='utf-8').splitlines() if line]
          result = {
              'schema_version': 1,
              'scope': 'repository-root automatic pytest discovery',
              'discovered': discovered,
              'executed': tests,
              'skipped': skipped,
              'xfail': xfail,
              'failures': failures,
              'errors': errors,
              'exclusions': exclusions,
              'pytest_exit_code': int(os.environ['TEST_RC']),
              'status': 'GREEN' if int(os.environ['TEST_RC']) == 0 and discovered == tests and discovered > 0 and not any((failures, errors, skipped, xfail)) else 'RED',
          }
          Path('/tmp/porota-governed-tests.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'POROTA_TEST_DISCOVERED={discovered}')
          print(f'POROTA_TEST_EXECUTED={tests}')
          print(f'POROTA_TEST_SKIPPED={skipped}')
          print(f'POROTA_TEST_XFAIL={xfail}')
          print(f'POROTA_TEST_FAILURES={failures}')
          print(f'POROTA_TEST_ERRORS={errors}')
          print(f'POROTA_TEST_EXCLUSIONS={len(exclusions)}')
          print(f'POROTA_GOVERNED_TEST_STATUS={result["status"]}')
          assert discovered > 0, 'automatic discovery returned zero tests'
          assert discovered == tests, f'collected/executed mismatch: {discovered}!={tests}'
          assert not any((failures, errors, skipped, xfail)), 'final governed suite requires zero failures/errors/skips/xfails'
          PY
          test "$TEST_RC" -eq 0
          echo 'POROTA_GOVERNED_TESTS=GREEN'

      - name: Issue 465 programable reauditing evidence gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/rc6_issue465_audit_gate.py verify \
            --repo-root . \
            --junit /tmp/porota-governed-tests.xml \
            --governed /tmp/porota-governed-tests.json \
            --out /tmp/porota-issue465-audit-gate.json

      - name: Governed test evidence summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f /tmp/porota-governed-tests.json ]; then
            echo '### Governed productive suite' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: RED — evidence file missing' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('/tmp/porota-governed-tests.json',encoding='utf-8'))
          print('### Governed productive suite')
          print(f'- Status: {data["status"]}')
          print(f'- Discovered: {data["discovered"]}')
          print(f'- Executed: {data["executed"]}')
          print(f'- Failures: {data["failures"]} | Errors: {data["errors"]}')
          print(f'- Skipped: {data["skipped"]} | Xfail: {data["xfail"]}')
          print(f'- Exclusions: {len(data["exclusions"])}')
          PY

      - name: Secret scan of tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_secret_scan.py --repo-root .

      - name: Host control-plane provenance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_control_plane_inventory.py \
            --repo-root . \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out /tmp/porota-host-control-plane.json

      - name: Dependency reproducibility gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_dependency_repro_audit.py \
            --repo-root . \
            --json-out /tmp/porota-dependency-repro.json \
            --check-installed \
            --fail-on-gap

      - name: Host control-plane manifest V2
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_manifest_v2.py \
            --repo-root . \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --source-sha "$CANDIDATE_SHA" \
            --json-out /tmp/porota-host-manifest-v2.json

      - name: Host control-plane reconciliation policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_policy_v2.py \
            --manifest /tmp/porota-host-manifest-v2.json \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out /tmp/porota-host-policy-v2.json

      - name: Build candidate exactly once
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_artifact_provenance.py checkout \
            --repo-root . --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" --verify-context
          docker build \
            --label "porota.commit=${CANDIDATE_SHA}" \
            --label "porota.tree=${CANDIDATE_TREE}" \
            --label "porota.source-manifest-sha256=${SOURCE_MANIFEST_SHA256}" \
            --label "porota.predeploy=v2" \
            -t "$IMAGE" .
          docker image inspect "$IMAGE" > /tmp/porota-image-inspect.json
          echo "POROTA_BUILD_ONCE=GREEN|IMAGE=$IMAGE"

      - name: Extract exact image application filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/porota-predeploy-app
          mkdir -p /tmp/porota-predeploy-app
          cid="$(docker create "$IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/app/." /tmp/porota-predeploy-app/
          docker rm "$cid" >/dev/null
          trap - EXIT
          test -f /tmp/porota-predeploy-app/Dockerfile
          echo 'POROTA_EXACT_ARTIFACT_EXTRACT=GREEN'

      - name: Artifact completeness and import closure
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_validate_deploy_artifact.py \
            --repo-root . \
            --artifact-root /tmp/porota-predeploy-app \
            --manifest-out /tmp/porota-artifact-manifest.json \
            --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --image-inspect /tmp/porota-image-inspect.json \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE"
          python - <<'PY'
          import json
          p='/tmp/porota-artifact-manifest.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='GREEN'
          print('POROTA_ARTIFACT_FILES=' + str(x['artifact_runtime_files']))
          print('POROTA_ARTIFACT_MISSING=' + str(len(x['missing_runtime_files'])))
          print('POROTA_IMPORT_CLOSURE_MISSING=' + str(len(x['missing_local_imports'])))
          PY
          for asset in n_instrument_watchlist.json POROTA_SECTOR_MAP_V1.csv; do
            test -f "/tmp/porota-predeploy-app/$asset"
            EXPECTED="$(sha256sum "$asset" | awk '{print $1}')"
            ACTUAL="$(sha256sum "/tmp/porota-predeploy-app/$asset" | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL"
            echo "POROTA_STATIC_RUNTIME_ASSET=GREEN|$asset|$ACTUAL"
          done

      - name: Exact image import smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -i --pull never --network none --entrypoint python "$IMAGE" - <<'PY'
          import bg_paper_dashboard
          import bf_production_paper_observer
          import bv_paper_runtime
          import bl_candle_engine
          import be_paper_engine
          import bw_daily_risk
          import dh_paper_dynamic_risk_gate_hf6
          import rc6_paper_family_lifecycle
          import rc6_ppi_future_contract_policy
          import rc6_shadow_runtime.worker
          import rc6_shadow_runtime.entry_signals
          import rc6_shadow_runtime.funnel
          import rc6_shadow_runtime.source_authority
          import rc6_dynamic_universe.promotion
          import rc6_ppi_global_budget
          import o_dashboard
          import rc6_trader_dashboard
          import rc6_trader_dashboard.projection
          import scripts.rc6_shadow_health_gate
          import json
          from pathlib import Path
          from scripts.porota_dependency_repro_audit import (
              current_platform_identity, installed_distribution_audit, platform_supported)
          policy=json.loads(Path('ops/policy/rc6-supply-chain-v1.json').read_text())
          installed=installed_distribution_audit(policy)
          assert installed['status']=='GREEN', installed
          assert platform_supported(current_platform_identity(), policy['platform'])
          print('POROTA_IMAGE_INSTALLED_CLOSURE=GREEN|' + str(installed['installed_total']))
          print('POROTA_RUNTIME_IMPORT_SMOKE=GREEN')
          PY

      - name: Exact image runtime smoke contract
        shell: bash
        run: |
          set -Eeuo pipefail
          # Report the extracted image contents, rather than assuming its
          # Docker context excludes test sources or CI metadata.
          python - <<'PY'
          from pathlib import Path
          app = Path('/tmp/porota-predeploy-app')
          sources = list(app.rglob('test_*.py'))
          print('POROTA_EXACT_IMAGE_TEST_SOURCES=' + ('PRESENT' if sources else 'ABSENT'))
          print('POROTA_EXACT_IMAGE_TEST_SOURCE_FILES=' + str(len(sources)))
          print('POROTA_EXACT_IMAGE_CI_METADATA=' + ('PRESENT' if (app / '.github').is_dir() else 'ABSENT'))
          PY
          echo "POROTA_EXACT_IMAGE_IMPORT_SMOKE=GREEN"
          echo "POROTA_FULL_SUITE=SEE_GOVERNED_TEST_EVIDENCE"
          echo "POROTA_GOVERNED_TEST_DISCOVERY=REPOSITORY_ROOT_AUTOMATIC"
      - name: PAPER safety source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          policy=Path('ops/policy/porota-policy.yaml').read_text(encoding='utf-8')
          assert 'required_mode: PRODUCTION_PAPER' in policy
          assert 'real_trading_allowed: false' in policy
          assert 'real_orders_sent_required: 0' in policy
          print('POROTA_PAPER_SAFETY_SOURCE_GATE=GREEN')
          PY

      - name: Export frozen candidate artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_build_deploy_bundle_v2.py \
            --repo-root . \
            --output /tmp/porota-deploy-bundle-v2.tgz \
            --manifest-out /tmp/porota-deploy-bundle-v2-manifest.json \
            --source-manifest POROTA_SOURCE_PROVENANCE.json
          python scripts/porota_artifact_provenance.py bundle \
            --repo-root . --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --bundle /tmp/porota-deploy-bundle-v2.tgz \
            --bundle-manifest /tmp/porota-deploy-bundle-v2-manifest.json \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --json-out /tmp/porota-bundle-byte-provenance.json
          docker save "$IMAGE" | gzip -1 > /tmp/porota-predeploy-image.tar.gz
          IMAGE_TAR_SHA="$(sha256sum /tmp/porota-predeploy-image.tar.gz | awk '{print $1}')"
          IMAGE_ID="$(docker image inspect -f '{{.Id}}' "$IMAGE")"
          IMAGE_SIZE_BYTES="$(docker image inspect -f '{{.Size}}' "$IMAGE")"
          IMAGE_CONFIG_SHA="$(docker image inspect -f '{{json .Config}}' "$IMAGE" | sha256sum | awk '{print $1}')"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          python scripts/porota_artifact_provenance.py image-tar \
            --repo-root . --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --image-tar /tmp/porota-predeploy-image.tar.gz --image-id "$IMAGE_ID" \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --json-out /tmp/porota-image-tar-byte-provenance.json
          python - "$CANDIDATE_SHA" "$TREE_SHA" "$IMAGE_ID" "$IMAGE_TAR_SHA" "$IMAGE_CONFIG_SHA" "$IMAGE_SIZE_BYTES" <<'PY'
          import json,os,sys
          candidate,tree,image_id,image_tar_sha,image_config_sha,image_size_bytes=sys.argv[1:]
          payload={
            "schema_version":1,
            "candidate_sha":candidate,
            "candidate_tree_sha":tree,
            "image_id":image_id,
            "image_tar_sha256":image_tar_sha,
            "image_config_sha256":image_config_sha,
            "image_size_bytes":int(image_size_bytes),
            "paper_mode_required":"PRODUCTION_PAPER",
            "real_orders_sent_required":0,
            "real_order_capability_required":"BLOCKED",
            "build_once":True,
            "source_manifest_sha256":os.environ['SOURCE_MANIFEST_SHA256'],
            "source_byte_provenance_required":True,
            "execution_origin":json.load(open("/tmp/porota-predeploy-origin.json",encoding="utf-8")),
          }
          open("/tmp/porota-frozen-candidate.json","w",encoding="utf-8").write(
              json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print("POROTA_FROZEN_CANDIDATE=GREEN|"+candidate+"|"+tree+"|"+image_id)
          PY

      - name: Frozen candidate fail-closed contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python tests/ci_frozen_candidate_contract.py validate \
            --frozen /tmp/porota-frozen-candidate.json \
            --image /tmp/porota-predeploy-image.tar.gz \
            --manifest /tmp/porota-deploy-bundle-v2-manifest.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --tree-sha "$(git rev-parse HEAD^{tree})"

      - name: Final convergence input and guard provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/rc6_convergence_provenance.py \
            --repo-root . --candidate-sha "$CANDIDATE_SHA" \
            --junit /tmp/porota-governed-tests.xml \
            --out /tmp/porota-final-input-provenance.json --fetch-source-refs

      - name: Upload predeploy evidence
        id: frozen_primary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified2026-10-05
        with:
          name: porota-predeploy-v2-${{ env.CANDIDATE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/porota-artifact-manifest.json
            /tmp/porota-source-provenance.json
            /tmp/porota-image-inspect.json
            /tmp/porota-bundle-byte-provenance.json
            /tmp/porota-image-tar-byte-provenance.json
            /tmp/porota-issue465-audit-gate.json
            docs/audits/ISSUE465_REAUDIT.json
            docs/audits/ISSUE465_REAUDIT.md
            /tmp/porota-host-control-plane.json
            /tmp/porota-dependency-repro.json
            /tmp/porota-installed-dependencies.txt
            /tmp/porota-predeploy-origin.json
            /tmp/porota-host-manifest-v2.json
            /tmp/porota-host-policy-v2.json
            /tmp/porota-deploy-bundle-v2.tgz
            /tmp/porota-deploy-bundle-v2-manifest.json
            /tmp/porota-predeploy-image.tar.gz
            /tmp/porota-frozen-candidate.json
            /tmp/porota-final-input-provenance.json
            /tmp/porota-governed-tests.xml
            /tmp/porota-governed-tests.json
            /tmp/porota-test-collection.txt
            /tmp/porota-test-exclusions.txt
            /tmp/porota-negative-fixtures.json
            ${{ runner.temp }}/porota-predeploy-evidence/

      - name: Replay exact published primary ZIP and export bounded evidence only
        if: success()
        shell: bash
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.frozen_primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.frozen_primary.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python scripts/porota_published_artifact_evidence.py \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --artifact-id "$PRIMARY_ARTIFACT_ID" --upload-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --image-ref "$IMAGE" --repo-root . \
            --evidence-root /tmp/porota-predeploy-published-evidence --deadline-seconds 600
          echo 'POROTA_SECONDARY_EVIDENCE_ONLY=GREEN|primary_remains_unique_promotable_artifact=true'

      - name: Upload small published-primary verification receipts
        id: primary_evidence_only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified2026-10-05
        with:
          name: porota-predeploy-v2-evidence-only-${{ env.CANDIDATE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: /tmp/porota-predeploy-published-evidence/*.json

      - name: Enforce secondary evidence API size and origin
        if: success()
        shell: bash
        env:
          SECONDARY_ARTIFACT_ID: ${{ steps.primary_evidence_only.outputs.artifact-id }}
          SECONDARY_ARTIFACT_DIGEST: ${{ steps.primary_evidence_only.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python - <<'PY_SECONDARY'
          import os
          from scripts.porota_artifact_http import api_get
          from scripts.porota_published_artifact_evidence import MAX_SECONDARY_ARTIFACT_BYTES, upload_digest
          artifact=api_get('/actions/artifacts/' + str(int(os.environ['SECONDARY_ARTIFACT_ID'])))
          expected='porota-predeploy-v2-evidence-only-' + os.environ['CANDIDATE_SHA'] + '-run-' + os.environ['GITHUB_RUN_ID'] + '-attempt-' + os.environ['GITHUB_RUN_ATTEMPT']
          assert artifact['name']==expected and artifact['expired'] is False
          assert artifact['digest']==upload_digest(os.environ['SECONDARY_ARTIFACT_DIGEST'])
          assert 0 < artifact['size_in_bytes'] <= MAX_SECONDARY_ARTIFACT_BYTES
          assert artifact['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert artifact['workflow_run']['head_sha']==os.environ['CANDIDATE_SHA']
          print('POROTA_SECONDARY_EVIDENCE_API=GREEN|id=' + str(artifact['id']) + '|bytes=' + str(artifact['size_in_bytes']) + '|promotable=false')
          PY_SECONDARY

      - name: Predeploy summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Porota Predeploy V2'
            echo "- Candidate SHA: \`${CANDIDATE_SHA}\`"
            echo '- Policy: GREEN'
            echo '- Compile: GREEN'
            echo '- Governed automatic test discovery: GREEN'
            echo '- Secret scan: GREEN'
            echo '- Host control-plane provenance: GREEN'
            echo '- Dependency reproducibility: GREEN'
            echo '- Host manifest V2: GREEN'
            echo '- Host reconciliation policy: GREEN'
            echo '- Build: ONCE'
            echo '- Exact artifact integrity: GREEN'
            echo '- Checkout/image/bundle/exported layers byte provenance: GREEN'
            echo '- Import closure: GREEN'
            echo '- Runtime import smoke: GREEN'
            echo '- Exact published ZIP replay and saved /app rootfs modes: GREEN'
            echo '- Downloaded primary loaded image and offline imports: GREEN'
            echo '- Bounded secondary receipts: EVIDENCE ONLY; primary remains sole promotable artifact'
            echo '- Full governed suite: GREEN (see porota-governed-tests.json)'
            echo '- Negative fail-closed fixtures: GREEN'
            echo '- PAPER safety source gate: GREEN'
            echo '- Droplet touched: NO'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'POROTA_PREDEPLOY_V2=GREEN'
          echo 'DROPLET_TOUCHED=NO'

      - name: Local cleanup
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter "ancestor=$IMAGE" | xargs -r docker rm -f
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
          rm -rf /tmp/porota-predeploy-app /tmp/porota-artifact-manifest.json /tmp/porota-host-control-plane.json /tmp/porota-dependency-repro.json /tmp/porota-host-manifest-v2.json /tmp/porota-host-policy-v2.json /tmp/porota-deploy-bundle-v2.tgz /tmp/porota-deploy-bundle-v2-manifest.json /tmp/porota-predeploy-image.tar.gz /tmp/porota-frozen-candidate.json /tmp/porota-governed-tests.xml /tmp/porota-governed-tests.json /tmp/porota-test-collection.txt /tmp/porota-test-exclusions.txt /tmp/porota-test-args.txt /tmp/porota-negative-fixtures.json "${RUNNER_TEMP}/porota-predeploy-evidence"
          rm -f POROTA_SOURCE_PROVENANCE.json /tmp/porota-source-provenance.json /tmp/porota-image-inspect.json /tmp/porota-bundle-byte-provenance.json /tmp/porota-image-tar-byte-provenance.json
          rm -f /tmp/porota-issue465-audit-gate.json
          rm -rf /tmp/porota-predeploy-published-evidence
          rm -f /tmp/porota-installed-dependencies.txt /tmp/porota-predeploy-origin.json
          rm -f /tmp/porota-final-input-provenance.json
          echo 'POROTA_PREDEPLOY_LOCAL_CLEANUP=GREEN'
