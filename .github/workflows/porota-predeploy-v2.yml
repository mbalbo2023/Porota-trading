      - name: Verify required published native evidence
        id: rc6_artifact_gate
        shell: bash
        run: |
          set -Eeuo pipefail
          # Independent QA: stat/parse followed by mutable-path artifact
          # upload is still vulnerable to same-UID swap. Even perfectly
          # validated JUnit counters are not immutable proof receipts.
          # Keep fail-closed until fd-sealed evidence and upload manifest
          # are implemented/reviewed. No artifact publication on this gate.
          echo 'POROTA_REQUIRED_EVIDENCE=HOLD79|proof_same_uid_toctou_unresolved'
          exit 79
          # RC6_NATIVE_EVIDENCE_OFFHOST_VALIDATOR_BEGIN
          python - <<'PY'
          import json, os, re, stat
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import yaml

          proof = Path(os.environ['RUNNER_TEMP']) / 'porota-native-sizing-evidence' / 'payload'
          private_root = proof.parent
          if (not private_root.is_dir() or private_root.is_symlink() or
                  private_root.stat().st_uid != os.getuid() or
                  stat.S_IMODE(private_root.stat().st_mode) != 0o700 or
                  not proof.is_dir() or proof.is_symlink()):
              raise SystemExit('REQUIRED_NATIVE_PRIVATE_ROOT_UNVERIFIED')
          required = [
              Path('/tmp/porota-frozen-candidate.json'),
              Path('/tmp/porota-deploy-bundle-v2.tgz'),
              Path('/tmp/porota-deploy-bundle-v2-manifest.json'),
              Path('/tmp/porota-predeploy-image.tar.gz'),
              Path('/tmp/porota-governed-tests.json'),
              proof / 'native-bound.xml',
              *(proof / 'session' / name for name in (
                  'dashboard_auth_52.xml', 'publication_io_identity.xml',
                  'scalping_capacity.xml', 'scheduler_monitor_backup.xml',
                  'signals_risk_exit_ledger.xml', 'sources_readiness_network.xml',
                  'sql_shadow_wal.xml', 'treasury_caucion.xml')),
              proof / 'session/stress.json',
              proof / 'catalog/full-catalog.json',
              proof / 'cadence/cadence-fresh.json',
              proof / 'cadence/cadence-legacy.json',
          ]
          for path in required:
              if path.is_symlink() or any(parent.is_symlink() for parent in path.parents):
                  raise SystemExit(f'REQUIRED_PREDEPLOY_EVIDENCE_ALIASED:{path.name}')
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'REQUIRED_PREDEPLOY_EVIDENCE_MISSING:{path.name}')
              if not os.access(path, os.R_OK) or not path.stat().st_mode & 0o444:
                  raise SystemExit(f'REQUIRED_PREDEPLOY_EVIDENCE_UNREADABLE:{path.name}')
          for path in (item for item in required if item.suffix == '.xml'):
              root = ET.parse(path).getroot()
              suites = ([root] if root.tag == 'testsuite' else
                        list(root.findall('.//testsuite')))
              valid_suites = bool(suites)
              for suite in suites:
                  attrs = {}
                  for key in ('tests', 'failures', 'errors', 'skipped'):
                      raw = suite.get(key)
                      if raw is None or re.fullmatch(r'[0-9]+', raw) is None:
                          valid_suites = False
                          break
                      attrs[key] = int(raw)
                  if (not valid_suites or attrs['tests'] < 1 or
                          attrs['tests'] != len(suite.findall('testcase')) or
                          any(attrs[key] for key in ('failures', 'errors', 'skipped'))):
                      valid_suites = False
                      break
              if (not valid_suites or
                      next(root.iter('failure'), None) is not None or
                      next(root.iter('error'), None) is not None or
                      next(root.iter('skipped'), None) is not None):
                  raise SystemExit(f'REQUIRED_NATIVE_JUNIT_NOT_GREEN:{path.name}')
          governed = json.loads(Path('/tmp/porota-governed-tests.json').read_text())
          if (type(governed) is not dict or governed.get('status') != 'GREEN' or
                  any(type(governed.get(key)) is not int or governed[key] != 0
                      for key in ('failures', 'errors', 'skipped', 'xfail'))):
              raise SystemExit('REQUIRED_GOVERNED_JUNIT_NOT_GREEN')
          for path in (proof / 'session/stress.json',
                       proof / 'cadence/cadence-fresh.json',
                       proof / 'cadence/cadence-legacy.json'):
              data = json.loads(path.read_text())
              if data['status'] != 'GREEN' or data['production_data_mounted'] is not False:
                  raise SystemExit(f'REQUIRED_NATIVE_RECEIPT_NOT_GREEN:{path.name}')
          upload_steps = yaml.safe_load(Path('.github/workflows/porota-predeploy-v2.yml').read_text())['jobs']['artifact-gate']['steps']
          upload = next(step for step in upload_steps if step.get('name') == 'Upload predeploy evidence')
          native_declared = set()
          prefix = '/porota-native-sizing-evidence/payload/'
          for item in upload['with']['path'].splitlines():
              item = item.strip()
              if 'porota-native-sizing-evidence' not in item:
                  continue
              if prefix not in item or '*' in item or item.startswith('!'):
                  raise SystemExit('PREDEPLOY_NATIVE_ALLOWLIST_UNBOUNDED')
              native_declared.add(item.split(prefix, 1)[1])
          native_required = {path.relative_to(proof).as_posix()
                             for path in required if proof in path.parents}
          if native_declared != native_required:
              raise SystemExit('PREDEPLOY_NATIVE_ALLOWLIST_DRIFT')
          for path in proof.rglob('*'):
              rel = path.relative_to(proof)
              if rel.parts[0] == 'tmp' or rel.parts[:2] in (
                      ('cadence', 'fresh'), ('cadence', 'legacy')):
                  continue
              if path.is_symlink():
                  raise SystemExit(f'NATIVE_EVIDENCE_ALIASED:{rel}')
              if path.is_file() and rel.as_posix() not in native_declared:
                  raise SystemExit(f'NATIVE_EVIDENCE_UNDECLARED_FILE:{rel}')
          print('POROTA_REQUIRED_EVIDENCE=GREEN')
          PY

