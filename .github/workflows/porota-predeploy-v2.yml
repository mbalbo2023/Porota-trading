name: Porota Predeploy V2

on:
  pull_request:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: porota-predeploy-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-gate:
    name: Exact artifact predeploy gate
    # Draft PRs cannot be promoted. Certify their final SHA once they become
    # ready_for_review instead of spending a full native cycle while drafting.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Existing35min gates + two12*120+60s physical stages + cleanup5min.
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: porota-predeploy-v2:${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact candidate
        id: rc6_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Initialize private runner staging
        id: rc6_private_stage
        shell: bash
        run: |
          set -Eeuo pipefail
          # Creating with no -p must FAIL on a preexisting foreign path.
          [[ -n "$RUNNER_TEMP" && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          rc6_stage="$RUNNER_TEMP/porota-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! mkdir -m 700 -- "$rc6_stage"; then
            echo 'POROTA_PRIVATE_STAGE=RED|exclusive_create_failed_no_foreign_cleanup'
            exit 79
          fi
          rc6_stage_identity="$(stat -c '%d:%i:%u:%a' -- "$rc6_stage")"
          [[ "$rc6_stage_identity" == *:$(id -u):700 ]]
          printf 'RC6_TMPDIR=%s\nRC6_TMPDIR_ID=%s\n' "$rc6_stage" "$rc6_stage_identity" >> "$GITHUB_ENV"
          echo 'POROTA_PRIVATE_STAGE=GREEN|exclusive_mode700'

      - name: Verify exact PR provenance before tests
        id: rc6_pr_provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          from scripts.rc6_ci_pr_provenance import verify

          event_path = Path(os.environ['GITHUB_EVENT_PATH'])
          assert event_path.is_file() and not event_path.is_symlink()
          assert event_path.stat().st_size <= 4 * 1024 * 1024
          event = json.loads(event_path.read_text(encoding='utf-8'))
          candidate = os.environ['CANDIDATE_SHA']
          proof = verify(event, expected_sha=candidate)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == candidate
          assert proof['automatic_go'] is False and proof['owner_go_verified'] is False
          print(f"POROTA_PR_PROVENANCE=GREEN|pr={proof['pr_number']}|automatic_go=NO")
          PY

      - name: Policy invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'required_mode: PRODUCTION_PAPER' ops/policy/porota-policy.yaml
          grep -Fq 'real_trading_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'rollback_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'build_once_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'manual_partial_runtime_file_lists_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'droplet_disk_pretransfer_gate_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'droplet_disk_guard_must_run_before_transfer: true' ops/policy/porota-policy.yaml
          grep -Fq 'failed_host_transition_replay_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'guard_fixture_contract_drift_must_fail_predeploy: true' ops/policy/porota-policy.yaml
          grep -Fq 'backups_suspended_by_operator: true' ops/policy/porota-policy.yaml
          grep -Fq 'paper_backup_keep_newest: 0' ops/policy/porota-policy.yaml
          grep -Fq 'history_backup_keep_newest: 0' ops/policy/porota-policy.yaml
          grep -Fq 'general_backup_keep_newest: 0' ops/policy/porota-policy.yaml
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('ops/policy/rc6-disk-housekeeping-v1.json').read_text())
          assert p['disk']['deploy_pretransfer_min_free_bytes'] == 0
          assert p['disk']['post_cleanup_min_free_bytes'] == 2 * 1024**3
          f=p['deploy']['pretransfer_formula']
          assert f['image_tar_multiplier'] == 1
          assert f['image_unpacked_multiplier'] == 2
          assert f['bundle_multiplier'] == 2
          assert f['fixed_headroom_bytes'] == 2 * 1024**3
          assert p['backups']['suspended'] is True
          assert all(p['backups'][name]['keep_newest'] == 0 for name in ('general', 'paper', 'history'))
          assert p['deploy']['canonical_workflow'] == '.github/workflows/porota-deploy-v2-promote.yml'
          print('POROTA_DISK_POLICY_GATE=GREEN')
          PY
          grep -Fq '    host_transition_required: true' ops/policy/test-policy.yaml
          grep -Fq '    observed_state_provenance_required: true' ops/policy/test-policy.yaml
          grep -Fq '    cross_module_guard_fixture_consistency_required: true' ops/policy/test-policy.yaml
          grep -Fq '    zero_failures_errors_skips_required: true' ops/policy/test-policy.yaml
          echo 'POROTA_INCIDENT_REPLAY_POLICY=GREEN'
          echo 'POROTA_POLICY_GATE=GREEN'

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q             -x '(^|/)(\.git|\.venv|venv|tests|docs)/' .
          echo 'POROTA_COMPILE_GATE=GREEN'

      - name: Fail-closed negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python tests/ci_frozen_candidate_contract.py negative \
            --evidence "$RC6_TMPDIR/porota-negative-fixtures.json"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["RC6_TMPDIR"] + "/porota-negative-fixtures.json"))))')" -eq 7
          echo 'POROTA_NEGATIVE_FIXTURES=GREEN'

      - name: Fast host-transition incident replay
        id: rc6_early_replay
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements.lock.txt
          # Source containment only: a valid HOLD never attests rootless custody.
          python -m scripts.rc6_deploy_legacy_host_guard --workflow .github/workflows/porota-deploy-v2-promote.yml
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            tests/test_rc6_deploy_quiescence.py \
            tests/test_rc6_deploy_scheduler_suspend.py \
            tests/test_rc6_cold2_apply_guard.py \
            tests/test_rc6_cold2_quarantine.py \
            tests/test_rc6_cold2_successor.py \
            tests/test_rc6_failed_cold_fix_forward.py \
            tests/test_rc6_cold2_complete_queue.py \
            tests/test_rc6_deploy_generation_gate.py \
            tests/test_rc6_native_soak.py \
            tests/test_rc6_degraded_closed_rescue.py \
            tests/test_rc6_a145_pending_rescue.py \
            tests/test_rc6_a151_operator_hold_deploy.py \
            tests/test_rc6_a166_ssh_argument_budget.py \
            tests/test_rc6_a172_running_continuation.py \
            tests/test_rc6_a175_running_continuation.py \
            tests/test_rc6_a178_a175_wiring.py \
            tests/test_rc6_deploy_failure_cleanup.py
          echo 'POROTA_HOST_TRANSITION_EARLY=GREEN'

      - name: Governed automatic test discovery and execution
        id: rc6_governed_suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          policy = yaml.safe_load(Path('ops/policy/test-policy.yaml').read_text(encoding='utf-8'))
          governance = policy['test_governance']
          scope = policy['productive_scope']
          assert governance['automatic_discovery_required'] is True
          assert governance['manual_test_file_allowlist_as_primary_ci'] is False
          assert scope['roots'] == ['.'], 'productive scope must discover from repository root'
          exclusions = scope.get('exclusions', [])
          args = list(scope['roots'])
          evidence = []
          for item in exclusions:
              path = Path(item['path'])
              successor = Path(item['successor'])
              assert path.is_file(), f'excluded path missing: {path}'
              assert successor.is_file(), f'exclusion successor missing: {successor}'
              assert item.get('classification') and item.get('reason') and item.get('owner')
              args.append(f'--ignore={path.as_posix()}')
              evidence.append('|'.join((path.as_posix(), item['classification'], successor.as_posix())))
          stage = Path(os.environ['RC6_TMPDIR'])
          (stage / 'porota-test-args.txt').write_text('\n'.join(args) + '\n', encoding='utf-8')
          (stage / 'porota-test-exclusions.txt').write_text('\n'.join(evidence) + ('\n' if evidence else ''), encoding='utf-8')
          print(f'POROTA_TEST_EXCLUSIONS={len(exclusions)}')
          PY
          mapfile -t TEST_ARGS < "$RC6_TMPDIR/porota-test-args.txt"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --collect-only -q "${TEST_ARGS[@]}" > "$RC6_TMPDIR/porota-test-collection.txt"
          set +e
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q "${TEST_ARGS[@]}" -o xfail_strict=true --junitxml="$RC6_TMPDIR/porota-governed-tests.xml"
          TEST_RC=$?
          set -e
          TEST_RC="$TEST_RC" python - <<'PY'
          from pathlib import Path
          import json, os, re, xml.etree.ElementTree as ET

          stage = Path(os.environ['RC6_TMPDIR'])
          collection = (stage / 'porota-test-collection.txt').read_text(encoding='utf-8')
          discovered = sum(int(n) for n in re.findall(r': (\d+)$', collection, re.MULTILINE))
          suite = ET.parse(stage / 'porota-governed-tests.xml').find('.//testsuite')
          # pytest's summary attribute can include extra phase reports; count
          # actual executed testcase elements to compare with collection.
          tests = len(suite.findall('testcase'))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          skipped_nodes = [node for node in suite.iter('skipped')]
          xfail = sum(node.get('type') == 'pytest.xfail' for node in skipped_nodes)
          skipped = len(skipped_nodes) - xfail
          exclusions = [line for line in (stage / 'porota-test-exclusions.txt').read_text(encoding='utf-8').splitlines() if line]
          result = {
              'schema_version': 1,
              'scope': 'repository-root automatic pytest discovery',
              'discovered': discovered,
              'executed': tests,
              'skipped': skipped,
              'xfail': xfail,
              'failures': failures,
              'errors': errors,
              'exclusions': exclusions,
              'pytest_exit_code': int(os.environ['TEST_RC']),
              'status': 'GREEN' if (int(os.environ['TEST_RC']) == 0 and discovered > 0 and discovered == tests
                                      and failures == errors == skipped == xfail == 0) else 'RED',
          }
          (stage / 'porota-governed-tests.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'POROTA_TEST_DISCOVERED={discovered}')
          print(f'POROTA_TEST_EXECUTED={tests}')
          print(f'POROTA_TEST_SKIPPED={skipped}')
          print(f'POROTA_TEST_XFAIL={xfail}')
          print(f'POROTA_TEST_FAILURES={failures}')
          print(f'POROTA_TEST_ERRORS={errors}')
          print(f'POROTA_TEST_EXCLUSIONS={len(exclusions)}')
          print(f'POROTA_GOVERNED_TEST_STATUS={result["status"]}')
          assert discovered > 0, 'automatic discovery returned zero tests'
          assert discovered == tests, f'collected/executed mismatch: {discovered}!={tests}'
          assert failures == errors == skipped == xfail == 0, (
              f'governed suite has failures/errors/skipped/xfail: {failures}/{errors}/{skipped}/{xfail}')
          PY
          test "$TEST_RC" -eq 0
          echo 'POROTA_GOVERNED_TESTS=GREEN'

      - name: Governed test evidence summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f "$RC6_TMPDIR/porota-governed-tests.json" ]; then
            echo '### Governed productive suite' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: RED — evidence file missing' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          data=json.load(open(os.environ['RC6_TMPDIR'] + '/porota-governed-tests.json',encoding='utf-8'))
          print('### Governed productive suite')
          print(f'- Status: {data["status"]}')
          print(f'- Discovered: {data["discovered"]}')
          print(f'- Executed: {data["executed"]}')
          print(f'- Failures: {data["failures"]} | Errors: {data["errors"]}')
          print(f'- Skipped: {data["skipped"]} | Xfail: {data["xfail"]}')
          print(f'- Exclusions: {len(data["exclusions"])}')
          PY

      - name: Optional exact-nodeid parallel proof pilot (non-authoritative)
        id: rc6_parallel_pilot
        # The productive 6k+ sequential suite above ALWAYS runs and remains
        # authoritative. Automatically trial this ONLY on same-repo PR #776,
        # exact consolidated head branch and canonical base; owners can still
        # explicitly opt in via repo variable for a different candidate.
        # A pilot failure makes this Predeploy RED for fix-forward RCA, never
        # changes the sequential authority or grants merge/deploy/trading GO.
        if: >-
          ${{ vars.RC6_CI_PARALLEL_PILOT == '1' ||
              (github.event.pull_request.number == 776 &&
               github.event.pull_request.head.repo.full_name == 'mbalbo2023/Porota-trading' &&
               github.event.pull_request.head.ref == 'candidate/rc6-a224-consolidated-after-775-20261031' &&
               github.event.pull_request.base.repo.full_name == 'mbalbo2023/Porota-trading' &&
               github.event.pull_request.base.ref == 'deploy/rc6-pr69-isolated-20260915') }}
        env:
          RC6_CI_PARALLEL_OPERATOR_OPT_IN: ${{ vars.RC6_CI_PARALLEL_PILOT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          export CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.rc6_ci_pr_provenance import select_parallel_pilot

          event_path = Path(os.environ['GITHUB_EVENT_PATH'])
          assert event_path.is_file() and not event_path.is_symlink()
          assert event_path.stat().st_size <= 4 * 1024 * 1024
          event = json.loads(event_path.read_text(encoding='utf-8'))
          scope = select_parallel_pilot(
              event, expected_sha=os.environ['CANDIDATE_SHA'],
              operator_opt_in=os.environ.get('RC6_CI_PARALLEL_OPERATOR_OPT_IN', ''))
          assert scope['automatic_go'] is False and scope['runtime_authority'] is False
          print('RC6_PARALLEL_PILOT_SCOPE=GREEN|' + scope['selection'] + '|automatic_go=NO')
          PY
          PILOT_RECEIPT="$(python -m scripts.rc6_ci_parallel_runner \
            --source-sha "$CANDIDATE_SHA" \
            --source-tree-sha "$CANDIDATE_TREE_SHA" \
            --repo . --shards 2 --output-junit "$RC6_TMPDIR/porota-parallel-pilot.xml")"
          PILOT_RECEIPT="${PILOT_RECEIPT#RC6_PARALLEL_PILOT=}"
          PILOT_RECEIPT="$PILOT_RECEIPT" python - <<'PY'
          from pathlib import Path
          import json
          import os

          sequential = json.loads((Path(os.environ['RC6_TMPDIR']) / 'porota-governed-tests.json').read_text(encoding='utf-8'))
          pilot = json.loads(os.environ['PILOT_RECEIPT'])
          assert sequential['status'] == 'GREEN'
          assert pilot['status'] == 'GREEN_QUORUM_OFFLINE_ONLY'
          assert pilot['source_sha'] == os.environ['CANDIDATE_SHA']
          assert pilot['source_tree_sha'] == os.environ['CANDIDATE_TREE_SHA']
          assert pilot['discovered'] == pilot['executed'] == sequential['discovered'] == sequential['executed']
          assert sequential['failures'] == sequential['errors'] == sequential['skipped'] == sequential['xfail'] == 0
          assert pilot['automatic_go'] is False and pilot['runtime_authority'] is False
          assert pilot['ci_activated'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
              report.write('\n### Optional parallel offline pilot (non-authoritative)\n')
              report.write(f"- SHA/tree: `{pilot['source_sha']}` / `{pilot['source_tree_sha']}`\n")
              report.write(f"- Exact JUnit cases: {pilot['executed']} / {sequential['executed']}\n")
              report.write(f"- Shards: {pilot['shards']} | automatic GO: NO\n")
              report.write(f"- Phase elapsed ms: {json.dumps(pilot['phase_elapsed_ms'], sort_keys=True)}\n")
          print('POROTA_OPTIONAL_PARALLEL_PILOT=GREEN|automatic_go=NO')
          PY

      - name: Secret scan of tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_secret_scan.py --repo-root .

      - name: Host control-plane provenance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_control_plane_inventory.py \
            --repo-root . \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out "$RC6_TMPDIR/porota-host-control-plane.json"

      - name: Dependency reproducibility gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_dependency_repro_audit.py \
            --repo-root . \
            --json-out "$RC6_TMPDIR/porota-dependency-repro.json" \
            --fail-on-gap

      - name: Host control-plane manifest V2
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_manifest_v2.py \
            --repo-root . \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --source-sha "$CANDIDATE_SHA" \
            --json-out "$RC6_TMPDIR/porota-host-manifest-v2.json"

      - name: Host control-plane reconciliation policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_policy_v2.py \
            --manifest "$RC6_TMPDIR/porota-host-manifest-v2.json" \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out "$RC6_TMPDIR/porota-host-policy-v2.json"

      - name: Resolve frozen tree for image identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CANDIDATE_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Set up Buildx for incremental dependency layers
        uses: docker/setup-buildx-action@v4

      - name: Build candidate exactly once
        id: rc6_build_once
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            POROTA_BUILD_SHA=${{ env.CANDIDATE_SHA }}
            POROTA_CANDIDATE_TREE_SHA=${{ env.CANDIDATE_TREE_SHA }}
          labels: |
            porota.commit=${{ env.CANDIDATE_SHA }}
            porota.predeploy=v2
          # Cache is an untrusted accelerator. The exact source/image/bundle
          # gates below still validate the candidate independently. No registry
          # or Droplet is involved, and cold cache misses rebuild from source.
          cache-from: type=gha,scope=porota-rc6-predeploy-v2
          cache-to: type=gha,scope=porota-rc6-predeploy-v2,mode=max,timeout=2m,ignore-error=true

      - name: Verify cached or rebuilt image identity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image inspect "$IMAGE" >/dev/null
          echo "POROTA_BUILD_ONCE=GREEN|IMAGE=$IMAGE"

      - name: Extract exact image application filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          # Exclusive child under the private runner staging root; never
          # delete a preexisting fixed-name /tmp path to make extraction fit.
          mkdir -m 700 -- "$RC6_TMPDIR/porota-predeploy-app"
          # docker create's returned CID, not an image/tag/name, is the only
          # candidate for cleanup. Verify commit/scope/run labels before both
          # reading files and deleting the stopped container (never --force).
          rc6_extract_container_id=
          rc6_extract_owner="|$CANDIDATE_SHA|v2|$GITHUB_RUN_ID"
          rc6_extract_owned() {
            [[ "$rc6_extract_container_id" =~ ^[0-9a-f]{64}$ ]] || return 1
            rc6_extract_actual="$(docker inspect -f '{{.Id}}|{{index .Config.Labels "porota.commit"}}|{{index .Config.Labels "porota.predeploy"}}|{{index .Config.Labels "porota.run_id"}}' "$rc6_extract_container_id" 2>/dev/null)" || return 1
            [[ "$rc6_extract_actual" == "$rc6_extract_container_id$rc6_extract_owner" ]]
          }
          rc6_extract_cleanup() {
            rc6_extract_rc=$?
            trap - EXIT
            if [[ -n "$rc6_extract_container_id" ]]; then
              if ! rc6_extract_owned; then
                echo 'POROTA_EXTRACT_CLEANUP=WARN|created_container_identity_unverified_no_delete'
                rc6_extract_rc=79
              elif docker rm "$rc6_extract_container_id" >/dev/null 2>&1; then
                echo 'POROTA_EXTRACT_CLEANUP=GREEN|verified_stopped_cid_removed'
              else
                echo 'POROTA_EXTRACT_CLEANUP=WARN|verified_cid_delete_failed'
                rc6_extract_rc=79
              fi
            fi
            if [[ "$rc6_extract_rc" -eq 0 ]]; then
              echo 'POROTA_EXACT_ARTIFACT_EXTRACT=GREEN'
            else
              echo 'POROTA_EXACT_ARTIFACT_EXTRACT=RED|no_unverified_cleanup'
            fi
            exit "$rc6_extract_rc"
          }
          trap rc6_extract_cleanup EXIT
          trap 'exit 143' INT TERM HUP
          if rc6_new_id="$(docker create --pull never \
            --label "porota.commit=$CANDIDATE_SHA" --label porota.predeploy=v2 \
            --label "porota.run_id=$GITHUB_RUN_ID" "$IMAGE")"; then
            rc6_extract_container_id="$rc6_new_id"
          else
            echo 'POROTA_EXACT_ARTIFACT_EXTRACT=RED|docker_create_failed'
            exit 79
          fi
          if ! rc6_extract_owned; then
            echo 'POROTA_EXACT_ARTIFACT_EXTRACT=RED|created_container_identity_unverified'
            exit 79
          fi
          docker cp "$rc6_extract_container_id:/app/." "$RC6_TMPDIR/porota-predeploy-app/"
          test -f "$RC6_TMPDIR/porota-predeploy-app/Dockerfile"

      - name: Artifact completeness and import closure
        shell: bash
        run: |
          set -Eeuo pipefail
          # Committed Git blobs are the image byte authority; labels, image
          # self-hashes and a clean build log alone cannot establish it.
          python scripts/porota_validate_deploy_artifact.py \
            --repo-root . \
            --artifact-root "$RC6_TMPDIR/porota-predeploy-app" \
            --candidate-sha "$CANDIDATE_SHA" \
            --manifest-out "$RC6_TMPDIR/porota-artifact-manifest.json"
          python - <<'PY'
          import json, os
          p=os.environ['RC6_TMPDIR']+'/porota-artifact-manifest.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='GREEN'
          assert x['source_image_provenance']['status']=='GREEN', 'GIT_BLOB_IMAGE_BYTES_NOT_PROVEN'
          assert x['source_image_provenance']['candidate_sha'] == os.environ['CANDIDATE_SHA']
          assert x['source_image_provenance']['verified_tracked_image_files'] > 0
          print('POROTA_IMAGE_GIT_BLOB_PROVENANCE=GREEN|' +
                x['source_image_provenance']['candidate_sha'] + '|' +
