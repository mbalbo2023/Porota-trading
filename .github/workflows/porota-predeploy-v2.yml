      - name: Exact image native sizing and generated catalog proof
        id: rc6_native_proof
        shell: bash
        run: |
          set -Eeuo pipefail
          # QA R162: same-UID pathname swaps can redirect mkdir/bind and
          # later proof reads after a successful root stat. Exact CID logic
          # below is retained for review, but must NOT execute until a truly
          # fd-anchored private stage and immutable evidence intake exists.
          echo 'POROTA_NATIVE_PROOF=HOLD79|root_same_uid_path_swap_unresolved'
          exit 79
          if [[ ! "${CANDIDATE_SHA:-}" =~ ^[0-9a-f]{40}$ ||
                "${IMAGE:-}" != "porota-predeploy-v2:${CANDIDATE_SHA:-}" ||
                ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ||
                ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo 'POROTA_NATIVE_PROOF=HOLD79|candidate_or_run_identity_invalid'
            exit 79
          fi
          # A980 selective recovery: runner-owned workspace, not a shared
          # predictable /tmp path. A foreign preexisting path is a HOLD79.
          rc6_native_root="$RUNNER_TEMP/porota-native-sizing-evidence"
          [[ -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" &&
             "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 79
          umask 077
          if ! mkdir -m 700 -- "$rc6_native_root"; then
            echo 'POROTA_NATIVE_PROOF=HOLD79|exclusive_proof_root_unavailable'
            exit 79
          fi
          rc6_native_root_id="$(stat -c '%d:%i:%u:%a' -- "$rc6_native_root")" || exit 79
          [[ "$rc6_native_root_id" == *:$(id -u):700 && ! -L "$rc6_native_root" ]] || exit 79
          # Keep the parent mode0700 throughout. Docker mounts only its
          # purpose-built payload child; UID1000 inside the isolated
          # container cannot traverse the private host parent or its siblings.
          mkdir -m 777 -- "$rc6_native_root/payload" || exit 79
          mkdir -m 777 -- "$rc6_native_root/payload/tmp" || exit 79
          [[ "$(stat -c '%d:%i:%u:%a' -- "$rc6_native_root")" == "$rc6_native_root_id" ]] || exit 79
          cleanup_native_proof() {
            rc6_cleanup_rc=$?
            if test -n "${rc6_session_pid:-}"; then
              wait "$rc6_session_pid" || rc6_cleanup_rc=1
              cat "$RUNNER_TEMP/porota-native-session.log"
            fi
            exit "$rc6_cleanup_rc"
          }
          trap cleanup_native_proof EXIT
          # RC6_A980_NATIVE_OWNER_BEGIN
          run_native_proof() (
            set -Eeuo pipefail
            rc6_container_id=
            rc6_create_started=0
            rc6_owned_removed=0
            rc6_label="$1"; shift
            rc6_name="porota-native-$rc6_label-$GITHUB_RUN_ID"
            rc6_owner_receipt="|$CANDIDATE_SHA|v2|$GITHUB_RUN_ID"
            rc6_owned_container() {
              [[ "$rc6_container_id" =~ ^[0-9a-f]{64}$ ]] || return 1
              rc6_actual="$(docker inspect -f '{{.Id}}|{{index .Config.Labels "porota.commit"}}|{{index .Config.Labels "porota.native-proof"}}|{{index .Config.Labels "porota.run_id"}}' "$rc6_container_id" 2>/dev/null)" || return 1
              [[ "$rc6_actual" == "$rc6_container_id$rc6_owner_receipt" ]]
            }
            rc6_cleanup_owned_native() {
              rc6_cleanup_rc=$?
              trap - EXIT
              if [[ -n "$rc6_container_id" ]]; then
                if rc6_owned_container; then
                  rc6_safe_to_remove=false
                  if rc6_running="$(docker inspect -f '{{.State.Running}}' "$rc6_container_id" 2>/dev/null)"; then
                    if [[ "$rc6_running" == false ]]; then
                      rc6_safe_to_remove=true
                    elif [[ "$rc6_running" == true ]]; then
                      if rc6_owned_container && docker stop --time 10 "$rc6_container_id" >/dev/null 2>&1; then
                        if rc6_after_stop="$(docker inspect -f '{{.State.Running}}' "$rc6_container_id" 2>/dev/null)" && [[ "$rc6_after_stop" == false ]]; then
                          rc6_safe_to_remove=true
                        else
                          echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|owned_container_still_running'
                        fi
                      else
                        echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|owned_stop_failed'
                      fi
                    else
                      echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|invalid_running_state'
                    fi
                  else
                    echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|running_state_unverified'
                  fi
                  if [[ "$rc6_safe_to_remove" == true ]] && rc6_owned_container; then
                    if ! docker rm "$rc6_container_id" >/dev/null 2>&1; then
                      echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|owned_cid_delete_failed'
                      rc6_cleanup_rc=79
                    fi
                  else
                    rc6_cleanup_rc=79
                  fi
                else
                  echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|unknown_cid_or_foreign_labels_no_delete'
                  rc6_cleanup_rc=79
                fi
              elif [[ "$rc6_owned_removed" == 1 ]]; then
                echo 'POROTA_NATIVE_PROOF_CLEANUP=GREEN|OWNED|exact_cid_removed'
              elif [[ "$rc6_create_started" == 0 ]]; then
                # A trusted local branch reached no Docker create attempt.
                echo 'POROTA_NATIVE_PROOF_CLEANUP=GREEN|NO_RESOURCE|no_create_attempt'
              else
                # Docker create failed/returned no CID: do NOT infer absence
                # or try a predictable name as delete authority.
                echo 'POROTA_NATIVE_PROOF_CLEANUP=HOLD79|create_outcome_unknown_no_cid'
                rc6_cleanup_rc=79
              fi
              exit "$rc6_cleanup_rc"
            }
            trap rc6_cleanup_owned_native EXIT
            trap 'exit 143' INT TERM HUP
            # The full session must prove the same 256 MiB cap used by the
            # Droplet stress governor. Other native sizing stages retain 512 MiB.
            rc6_memory=(--memory 512m --memory-swap 512m)
            if test "$rc6_label" = session; then
              rc6_memory=(--memory 256m --memory-swap 256m)
            fi
            mkdir -m 777 -- "$RUNNER_TEMP/porota-native-sizing-evidence/payload/tmp/$rc6_label" || exit 79
            rc6_create_started=1
            if rc6_new_id="$(docker create --name "$rc6_name" \
              --label "porota.commit=$CANDIDATE_SHA" --label porota.native-proof=v2 \
              --label "porota.run_id=$GITHUB_RUN_ID" --pull never "${rc6_memory[@]}" --cpus .75 \
              --network none --no-healthcheck --read-only --user 1000:1000 --workdir /app \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
              -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 -e "TMPDIR=/proof/tmp/$rc6_label" \
              -v "$RUNNER_TEMP/porota-native-sizing-evidence/payload:/proof" "$IMAGE" "$@")"; then
              rc6_container_id="$rc6_new_id"
            else
              echo 'POROTA_NATIVE_PROOF=HOLD79|docker_create_failed_no_name_cleanup'
              exit 79
            fi
            if ! rc6_owned_container; then
              echo 'POROTA_NATIVE_PROOF=HOLD79|created_cid_or_labels_unverified'
              exit 79
            fi
            set +e
            rc6_timeout=480
            case "$rc6_label" in
              cadence-fresh|cadence-legacy) rc6_timeout=1500 ;;
            esac
            timeout "$rc6_timeout" docker start -a "$rc6_container_id"
            rc6_result=$?
            set -e
            rc6_state="$(docker inspect -f '{{.State.ExitCode}}|{{.State.OOMKilled}}' "$rc6_container_id")"
            printf 'POROTA_NATIVE_SIZING_CONTAINER=%s|%s\n' "$rc6_label" "$rc6_state"
            test "$rc6_result" -eq 0
            test "$rc6_state" = '0|false'
            rc6_owned_container || exit 79
            docker rm "$rc6_container_id" >/dev/null
            rc6_container_id=
            rc6_owned_removed=1
          )
          # RC6_A980_NATIVE_OWNER_END
          run_native_proof cases python -m pytest -q -p no:cacheprovider \
            tests/test_rc6_shadow_native_bound.py tests/test_rc6_shadow_streaming_cost.py \
            tests/test_rc6_shadow_shared_audit.py tests/test_rc6_shadow_owned_state.py \
            tests/test_rc6_shadow_report_lifetime.py tests/test_rc6_shadow_cold_audit.py tests/test_rc6_owned_funnel_details.py tests/test_rc6_physical_cadence.py --junitxml=/proof/native-bound.xml
          # The generated catalogue runs inline without a pytest parent beside it.
          run_native_proof catalog python scripts/rc6_postdeploy_stress.py \
            --full-catalog-check --output /proof/catalog
          # The 405-minute virtual session and eight adversarial groups are
          # independent of cadence, but cadence legacy consumes fresh's exact
          # receipt and fixture. Keep fresh -> legacy ordered. Docker caps and
          # proof paths are separate; both branches must finish cleanly.
          # Pure ordering is tested OFFHOST independently of the blocked
          # physical Docker lifecycle. Only full native proof can print GREEN.
          source ./scripts/rc6_predeploy_native_orchestration.sh
          rc6_native_session_cadence
          echo 'POROTA_EXACT_IMAGE_NATIVE_SIZING=GREEN'
      - name: Exact image runtime smoke contract
