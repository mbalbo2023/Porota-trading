      - name: Upload sanitized RCA diagnostic (never promotion input)
        if: ${{ always() && steps.rc6_checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: porota-ci-rca-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/porota-v2-${{ github.run_id }}-${{ github.run_attempt }}/porota-rca-learning.json

      - name: Local cleanup
        id: rc6_local_cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          # Containers created above have exact-ID EXIT traps or --rm.
          # An image ancestry match cannot authorize stopping another app's
          # container, even on a nominally ephemeral runner.
          # RC6_A979_OWNED_IMAGE_BEGIN
          rc6_image_state=WARN
          rc6_image_reason=IMAGE_IDENTITY_UNVERIFIED
          if [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$IMAGE" == "porota-predeploy-v2:$CANDIDATE_SHA" ]]; then
            if rc6_image_receipt="$(docker image inspect --format '{{.Id}}|{{index .Config.Labels "porota.commit"}}|{{index .Config.Labels "porota.predeploy"}}' "$IMAGE" 2>/dev/null)"; then
              IFS='|' read -r rc6_image_id rc6_label_commit rc6_label_scope <<< "$rc6_image_receipt"
              if [[ "$rc6_image_id" =~ ^sha256:[0-9a-f]{64}$ && "$rc6_label_commit" == "$CANDIDATE_SHA" && "$rc6_label_scope" == v2 ]]; then
                # Read-only, ID-filtered inventory. Any container reference,
                # including an unrelated app's, forbids even untagging.
                if rc6_refs="$(docker container ls --all --quiet --filter "ancestor=$rc6_image_id" 2>/dev/null)"; then
                  if [[ -z "$rc6_refs" ]]; then
                    if rc6_image_recheck="$(docker image inspect --format '{{.Id}}|{{index .Config.Labels "porota.commit"}}|{{index .Config.Labels "porota.predeploy"}}' "$IMAGE" 2>/dev/null)" && [[ "$rc6_image_recheck" == "$rc6_image_receipt" ]]; then
                      if docker image rm "$IMAGE" >/dev/null 2>&1; then
                        rc6_image_state=GREEN
                        rc6_image_reason=OWNED_UNUSED_IMAGE_REMOVED
                      else
                        rc6_image_reason=IMAGE_DELETE_FAILED
                      fi
                    else
                      rc6_image_reason=IMAGE_CHANGED_DURING_CLEANUP
                    fi
                  else
                    rc6_image_reason=IMAGE_REFERENCED_BY_CONTAINER
                  fi
                else
                  rc6_image_reason=CONTAINER_REFERENCES_UNVERIFIED
                fi
              fi
            fi
          fi
          echo "POROTA_PREDEPLOY_IMAGE_CLEANUP=$rc6_image_state|reason=$rc6_image_reason"
          # RC6_A979_OWNED_IMAGE_END
          # RC6_A980_PRIVATE_STAGE_BEGIN
          rc6_stage_state=WARN
          rc6_stage_reason=PRIVATE_STAGE_IDENTITY_UNVERIFIED
          rc6_expected_stage="$RUNNER_TEMP/porota-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -n "${RC6_TMPDIR:-}" && -n "${RC6_TMPDIR_ID:-}" &&
                "$RC6_TMPDIR" == "$rc6_expected_stage" &&
                -d "$RC6_TMPDIR" && ! -L "$RC6_TMPDIR" &&
                -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]]; then
            rc6_stage_identity="$(stat -c '%d:%i:%u:%a' -- "$RC6_TMPDIR" 2>/dev/null)" || rc6_stage_identity=
            if [[ "$rc6_stage_identity" == "$RC6_TMPDIR_ID" &&
                  "$rc6_stage_identity" == *:$(id -u):700 ]]; then
              # This is the one exclusive, mode0700 runner-owned job directory,
              # not an arbitrary /tmp prefix, glob, or another app's path.
              if rm -rf -- "$RC6_TMPDIR" && [[ ! -e "$RC6_TMPDIR" && ! -L "$RC6_TMPDIR" ]]; then
                rc6_stage_state=GREEN
                rc6_stage_reason=PRIVATE_STAGE_REMOVED
              else
                rc6_stage_reason=PRIVATE_STAGE_DELETE_FAILED
              fi
            fi
          fi
          echo "POROTA_PREDEPLOY_STAGE_CLEANUP=$rc6_stage_state|reason=$rc6_stage_reason"
          # RC6_A980_PRIVATE_STAGE_END
          if [[ "$rc6_image_state" != GREEN || "$rc6_stage_state" != GREEN ]]; then
            echo 'POROTA_PREDEPLOY_LOCAL_CLEANUP=WARN|image_or_stage_cleanup_unverified'
            exit 79
          fi
          echo 'POROTA_PREDEPLOY_LOCAL_CLEANUP=GREEN'

      - name: Predeploy summary
        # This is the terminal certificate: cleanup failure can never leave a
        # misleading GREEN line from an earlier step in the run logs.
        if: ${{ success() && steps.rc6_local_cleanup.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo '### Porota Predeploy V2'
            echo "- Candidate SHA: \`${CANDIDATE_SHA}\`"
            echo '- Policy: GREEN'
            echo '- Compile: GREEN'
            echo '- Governed automatic test discovery: GREEN'
            echo '- Secret scan: GREEN'
            echo '- Host control-plane provenance: GREEN'
            echo '- Dependency reproducibility: GREEN'
            echo '- Host manifest V2: GREEN'
            echo '- Host reconciliation policy: GREEN'
            echo '- Build: ONCE'
            echo '- Exact artifact integrity: GREEN'
            echo '- Import closure: GREEN'
            echo '- Runtime import smoke: GREEN'
            echo '- Full governed suite: GREEN (see porota-governed-tests.json)'
            echo '- Negative fail-closed fixtures: GREEN'
            echo '- PAPER safety source gate: GREEN'
            echo '- Local runner cleanup: GREEN'
            echo '- Droplet touched: NO'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'POROTA_PREDEPLOY_V2=GREEN'
          echo 'DROPLET_TOUCHED=NO'
