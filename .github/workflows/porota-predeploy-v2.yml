name: Porota Predeploy V2

on:
  pull_request:
    branches: [deploy/rc6-pr69-isolated-20260915]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: porota-predeploy-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  artifact-gate:
    name: Exact artifact predeploy gate
    if: >-
      ${{ github.repository == 'mbalbo2023/Porota-trading' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: porota-predeploy-v2:${{ github.event.pull_request.head.sha }}
    outputs:
      candidate_sha: ${{ steps.impact.outputs.head_sha }}
      base_sha: ${{ steps.impact.outputs.base_sha }}
      classification: ${{ steps.impact.outputs.classification }}
      documentation_validated: ${{ steps.impact.outputs.documentation_validated }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Select the release Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classify the exact base and candidate trees
        id: impact
        run: |
          python3 -B scripts/porota_predeploy_impact.py --base-sha "$BASE_SHA" \
            --head-sha "$CANDIDATE_SHA" --output "$RUNNER_TEMP/predeploy-impact.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record validated documentation changes
        if: steps.impact.outputs.classification == 'DOCUMENTATION_ONLY'
        run: |
          set -Eeuo pipefail
          python3 -B scripts/porota_secret_scan.py --repo-root .
          echo 'DOCUMENTATION_ONLY: exact diff, Markdown text and changed local links validated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No image or release artifact was created. Application/runtime: NO_VERIFICADO.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare pinned policy parser
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Verify source, PAPER policy and tracked credentials
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "CANDIDATE_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          python3 -B - <<'PY'
          import ast, subprocess
          from pathlib import Path
          import yaml
          policy = yaml.safe_load(Path('ops/policy/porota-policy.yaml').read_text())
          mode = policy['operating_mode']
          assert mode['required_mode'] == 'PRODUCTION_PAPER'
          assert mode['real_trading_allowed'] is False
          assert type(mode['real_orders_sent_required']) is int and mode['real_orders_sent_required'] == 0
          for name in subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0'):
              if name.endswith('.py'):
                  ast.parse(Path(name).read_bytes(), filename=name)
          PY
          python3 -B scripts/porota_secret_scan.py --repo-root .

      - name: Set up reusable dependency layers
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        uses: docker/setup-buildx-action@v4

      - name: Build candidate exactly once
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            POROTA_BUILD_SHA=${{ env.CANDIDATE_SHA }}
            POROTA_CANDIDATE_TREE_SHA=${{ env.CANDIDATE_TREE_SHA }}
          labels: |
            porota.commit=${{ env.CANDIDATE_SHA }}
            porota.predeploy=v2
          cache-from: type=gha,scope=porota-rc6-predeploy-v2
          cache-to: type=gha,scope=porota-rc6-predeploy-v2,mode=max,timeout=2m,ignore-error=true

      - name: Test code and actual PAPER HTTP behavior on the same image
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          IMAGE_ID="$(docker image inspect -f '{{.Id}}' "$IMAGE")"
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          STAGE="$(mktemp -d "$RUNNER_TEMP/porota-predeploy-XXXXXXXX")"
          mkdir "$STAGE/release" "$STAGE/application"
          echo "RELEASE_DIR=$STAGE/release" >> "$GITHUB_ENV"
          OWNED_CIDS=()
          owned() {
            [[ "$1" =~ ^[0-9a-f]{64}$ ]] &&
              test "$(docker inspect -f '{{.Id}}|{{.Image}}|{{index .Config.Labels "porota.ci_run"}}' "$1")" = "$1|$IMAGE_ID|$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          }
          cleanup() {
            rc=$?
            trap - EXIT
            for cid in "${OWNED_CIDS[@]}"; do
              if ! owned "$cid"; then rc=1; continue; fi
              if test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true; then
                docker stop --time 10 "$cid" >/dev/null || { rc=1; continue; }
              fi
              owned "$cid" && docker rm "$cid" >/dev/null || rc=1
            done
            echo "CI_CLEANUP=owned_containers_only|image_retained_until_runner_disposal|result=$rc"
            exit "$rc"
          }
          trap cleanup EXIT
          common=(--pull never --network none --cap-drop ALL --security-opt no-new-privileges:true
                  --pids-limit 512 --memory 6g --label "porota.ci_run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          extract="$(docker create "${common[@]}" --entrypoint python "$IMAGE_ID" -c pass)"
          OWNED_CIDS+=("$extract")
          owned "$extract"
          docker cp "$extract:/app/." "$STAGE/application/"
          python3 -B scripts/porota_validate_deploy_artifact.py \
            --repo-root . --artifact-root "$STAGE/application" --candidate-sha "$CANDIDATE_SHA" \
            --manifest-out "$STAGE/source-image.json" > "$STAGE/source-image.log"
          if test -f scripts/rc6_iol_installed_replay.py; then
            replay="$(docker create "${common[@]}" --pids-limit 96 --memory 512m --cpus 0.75 \
              --no-healthcheck -e POROTA_IOL_OFFHOST_IPC=1 --entrypoint python "$IMAGE_ID" \
              -B -m scripts.rc6_iol_installed_replay)"
            OWNED_CIDS+=("$replay")
            owned "$replay"
            timeout 385 docker start --attach "$replay" > "$STAGE/isolated-replay.json"
            cat "$STAGE/isolated-replay.json"
            jq -e '.status == "PASS" and .iol_gateway_transport == "AF_UNIX_PEERCRED"' "$STAGE/isolated-replay.json" >/dev/null
          fi
          # Metadata omitted from the image is mounted read-only. Runtime source,
          # dependencies and the native backend are always the immutable image.
          code="$(docker create "${common[@]}" \
            --mount "type=bind,src=$PWD/.git,dst=/app/.git,readonly" \
            --mount "type=bind,src=$PWD/docs,dst=/app/docs,readonly" \
              --mount "type=bind,src=$PWD/.release,dst=/app/.release,readonly" \
              --mount "type=bind,src=$PWD/RC4_CONTROL_MANIFEST.json,dst=/app/RC4_CONTROL_MANIFEST.json,readonly" \
              --mount "type=bind,src=$PWD/RC4_MODULE_INVENTORY_STATUS.txt,dst=/app/RC4_MODULE_INVENTORY_STATUS.txt,readonly" \
              --mount "type=bind,src=$PWD/RC4_PACKAGE_MANIFEST.json,dst=/app/RC4_PACKAGE_MANIFEST.json,readonly" \
              --mount "type=bind,src=$PWD/RC4_SCRIPT_INVENTORY_STATUS.txt,dst=/app/RC4_SCRIPT_INVENTORY_STATUS.txt,readonly" \
              --mount "type=bind,src=$PWD/RC4_TEST_FILE_MATRIX.tsv,dst=/app/RC4_TEST_FILE_MATRIX.tsv,readonly" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/app \
            --entrypoint python "$IMAGE_ID" -B scripts/porota_ci.py \
            --output /tmp/code-tests.json --source-sha "$CANDIDATE_SHA" \
            --source-tree "$CANDIDATE_TREE_SHA" --image-id "$IMAGE_ID")"
          OWNED_CIDS+=("$code")
          owned "$code"
          set +e
          timeout 2500 docker start -a "$code" > "$STAGE/code-tests.log" 2>&1
          code_result=$?
          set -e
          docker cp "$code:/tmp/code-tests.json" "$STAGE/release/code-tests.json"
          cat "$STAGE/release/code-tests.json"
          # Capture the independent functional receipt even if code tests fail.
          # Both results still gate export of this exact image below.
          functional="$(docker create "${common[@]}" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --entrypoint python "$IMAGE_ID" \
            -B scripts/porota_ci_functional.py --output /tmp/functional.json \
            --source-sha "$CANDIDATE_SHA" --source-tree "$CANDIDATE_TREE_SHA" --image-id "$IMAGE_ID")"
          OWNED_CIDS+=("$functional")
          owned "$functional"
          set +e
          timeout 120 docker start -a "$functional" > "$STAGE/functional.log" 2>&1
          functional_result=$?
          set -e
          # tmpfs is gone after stop; the CLI emits its identical sanitized receipt.
          python3 -B - "$STAGE/functional.log" "$STAGE/release/functional.json" <<'PY'
          import json, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text()
          assert len(text) <= 1048576
          receipt = json.loads(text.splitlines()[-1])
          assert receipt['schema'] == 'porota.functional.v1'
          Path(sys.argv[2]).write_text(json.dumps(receipt, sort_keys=True)+'\n')
          PY
          # Preserve only summaries. Never upload raw logs, datasets or JUnit.
          cat "$STAGE/release/functional.json"
          test "$code_result" -eq 0
          test "$(docker inspect -f '{{.State.ExitCode}}|{{.State.OOMKilled}}' "$code")" = '0|false'
          test "$functional_result" -eq 0
          test "$(docker inspect -f '{{.State.ExitCode}}|{{.State.OOMKilled}}' "$functional")" = '0|false'

      - name: Export and validate the immutable release
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/porota_build_deploy_bundle_v2.py --repo-root . \
            --output "$RELEASE_DIR/porota-deploy-bundle-v2.tgz" \
            --manifest-out "$RELEASE_DIR/porota-deploy-bundle-v2-manifest.json" > "$RUNNER_TEMP/bundle-summary.log"
          test "$(docker image inspect -f '{{.Id}}' "$IMAGE_ID")" = "$IMAGE_ID"
          docker save "$IMAGE_ID" | gzip -1 > "$RELEASE_DIR/porota-predeploy-image.tar.gz"
          python3 -B scripts/porota_release.py create --directory "$RELEASE_DIR" --repository . \
            --image-id "$IMAGE_ID" --image-size-bytes "$(docker image inspect -f '{{.Size}}' "$IMAGE_ID")" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload one validated artifact
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: porota-predeploy-v2-${{ env.CANDIDATE_SHA }}
          path: ${{ env.RELEASE_DIR }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Record release identity
        if: steps.impact.outputs.classification == 'APPLICATION_RELEASE'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_DIGEST"
          echo "### Predeploy V2" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $CANDIDATE_SHA / $CANDIDATE_TREE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: $ARTIFACT_ID / $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Code and functional checks passed on this image. Droplet/runtime: NO_VERIFICADO." >> "$GITHUB_STEP_SUMMARY"

  release-evidence-required:
    name: RC6 required release evidence (offhost)
    needs: artifact-gate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the evidence appropriate to the verified change
        env:
          RESULT: ${{ needs.artifact-gate.result }}
          SOURCE_SHA: ${{ needs.artifact-gate.outputs.candidate_sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ needs.artifact-gate.outputs.base_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLASSIFICATION: ${{ needs.artifact-gate.outputs.classification }}
          DOCUMENTATION_VALIDATED: ${{ needs.artifact-gate.outputs.documentation_validated }}
          ARTIFACT_ID: ${{ needs.artifact-gate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.artifact-gate.outputs.artifact_digest }}
        run: |
          set -Eeuo pipefail
          test "$RESULT" = success
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          test "$BASE_SHA" = "$EXPECTED_BASE_SHA"
          case "$CLASSIFICATION" in
            DOCUMENTATION_ONLY)
              test "$DOCUMENTATION_VALIDATED" = true
              test -z "$ARTIFACT_ID$ARTIFACT_DIGEST"
              echo 'DOCUMENTATION_ONLY=validated|image=NOT_BUILT|artifact=NOT_CREATED|runtime=NO_VERIFICADO'
              ;;
            APPLICATION_RELEASE)
              test "$DOCUMENTATION_VALIDATED" = false
              [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
              echo 'RELEASE_VALIDATED=code+functional+immutable_bytes|host=NO_VERIFICADO'
              ;;
            *) echo '::error::Change classification is unverified.'; exit 1 ;;
          esac
