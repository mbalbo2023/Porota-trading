name: Porota Predeploy V2

on:
  pull_request:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    types: [ready_for_review]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: porota-predeploy-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact-gate:
    name: Exact artifact predeploy gate
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.repository.id == 1338680554 && github.event.number == 476 && github.event.pull_request.draft == false && github.event.pull_request.head.ref == 'recovery/rc6-material-fix-forward-3091e93-20261006' && github.event.pull_request.head.repo.id == 1338680554
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: porota-predeploy-v2:${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified2026-10-05
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set reviewed Python tooling platform
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified2026-10-05
        with:
          python-version: "3.11.16"

      - name: Require exact G0 through G6 native evidence before any Predeploy workspace or build
        id: prerequisite_gates
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 022
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          CONTROL_ROOT="$RUNNER_TEMP/rc6-g7-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VERIFIED="$RUNNER_TEMP/rc6-g7-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python -I -B scripts/rc6_material_pr_admission.py \
            --source-sha "$CANDIDATE_SHA" --source-tree "$CANDIDATE_TREE" --gate predeploy --control-root "$CONTROL_ROOT"
          python -I -B scripts/rc6_architectural_gates.py \
            --source-sha "$CANDIDATE_SHA" --source-tree "$CANDIDATE_TREE" --target-gate G7 \
            --admission-json "$CONTROL_ROOT/admission.json" \
            --evidence-root "$RUNNER_TEMP/rc6-g7-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --json-out "$VERIFIED"
          echo "RC6_G7_VERIFIED_ADMISSION=$VERIFIED" >> "$GITHUB_ENV"
          echo "RC6_G7_OWNER_ADMISSION=$CONTROL_ROOT/admission.json" >> "$GITHUB_ENV"
          echo 'RC6_G7_ALL_PREDECESSOR_PAYLOADS=GREEN'
          echo 'DEPLOY_OWNER=NOT_ACQUIRED'
          echo 'PUSH_ALONE_AUTHORIZES_PREDEPLOY=false'

      - name: Initialize proven private runner workspace
        id: private_workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_predeploy_cleanup.py init

      - name: Freeze checkout byte provenance before build
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          python scripts/porota_artifact_provenance.py create \
            --repo-root . \
            --candidate-sha "$CANDIDATE_SHA" \
            --tree-sha "$CANDIDATE_TREE" \
            --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-source-provenance.json"
          SOURCE_MANIFEST_SHA256="$(sha256sum POROTA_SOURCE_PROVENANCE.json | awk '{print $1}')"
          python scripts/porota_predeploy_cleanup.py claim-source \
            --scope "$POROTA_PREDEPLOY_OWNER" --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --sha256 "$SOURCE_MANIFEST_SHA256"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"
          echo "SOURCE_MANIFEST_SHA256=$SOURCE_MANIFEST_SHA256" >> "$GITHUB_ENV"
          python - <<'PY_ORIGIN'
          import os
          from pathlib import Path
          from scripts.porota_artifact_provenance import canonical_bytes
          from scripts.porota_predeploy_binding import api_get, REPOSITORY, WORKFLOW_PATH
          assert os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          assert os.environ['GITHUB_WORKFLOW_REF'].split('@')[0] == REPOSITORY + '/' + WORKFLOW_PATH
          workflow=api_get('/actions/workflows/porota-predeploy-v2.yml')
          assert workflow['path'] == WORKFLOW_PATH and workflow['state'] == 'active'
          origin={'repository':REPOSITORY,'workflow_path':WORKFLOW_PATH,'workflow_id':workflow['id'],
                  'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'event':'pull_request','candidate_sha':os.environ['CANDIDATE_SHA']}
          Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-predeploy-origin.json')).write_bytes(canonical_bytes(origin))
          PY_ORIGIN

      - name: Policy invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'required_mode: PRODUCTION_PAPER' ops/policy/porota-policy.yaml
          grep -Fq 'real_trading_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'rollback_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'build_once_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'manual_partial_runtime_file_lists_allowed: false' ops/policy/porota-policy.yaml
          grep -Fq 'droplet_disk_pretransfer_gate_required: true' ops/policy/porota-policy.yaml
          grep -Fq 'droplet_disk_guard_must_run_before_transfer: true' ops/policy/porota-policy.yaml
          grep -Fq 'paper_backup_keep_newest: 3' ops/policy/porota-policy.yaml
          grep -Fq 'history_backup_keep_newest: 3' ops/policy/porota-policy.yaml
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('ops/policy/rc6-disk-housekeeping-v1.json').read_text())
          root_policy=Path('ops/policy/porota-policy.yaml').read_text()
          assert 'droplet_disk_pretransfer_min_free_bytes: 0' in root_policy
          assert 'droplet_disk_admission_authority: ops/policy/rc6-disk-housekeeping-v1.json' in root_policy
          assert 'droplet_disk_residual_reserve_bytes: 2147483648' in root_policy
          assert p['disk']['deploy_pretransfer_min_free_bytes'] == 0
          assert p['disk']['post_cleanup_min_free_bytes'] == 2 * 1024**3
          f=p['deploy']['pretransfer_formula']
          assert f['image_tar_multiplier'] == 1
          assert f['image_unpacked_multiplier'] == 1
          assert f['bundle_multiplier'] == 2
          assert f['fixed_headroom_bytes'] == 2 * 1024**3
          assert p['backups']['paper']['keep_newest'] == 3
          assert p['backups']['history']['keep_newest'] == 3
          assert p['deploy']['canonical_workflow'] == '.github/workflows/porota-deploy-v2-promote.yml'
          print('POROTA_DISK_POLICY_GATE=GREEN')
          PY
          echo 'POROTA_POLICY_GATE=GREEN'

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.porota_artifact_provenance import verify_source_manifest
          source=verify_source_manifest(Path('.'), Path('POROTA_SOURCE_PROVENANCE.json'), os.environ['CANDIDATE_SHA'], os.environ['CANDIDATE_TREE'])
          count=0
          for row in source['files']:
              path=Path(row['path'])
              if path.suffix == '.py' and path.parts[0] not in {'tests','docs'}:
                  compile(path.read_bytes(), str(path), 'exec')
                  count+=1
          assert count > 0
          print('POROTA_COMPILED_SOURCE_FILES=' + str(count))
          PY
          echo 'POROTA_COMPILE_GATE=GREEN'

      - name: Fail-closed negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python tests/ci_frozen_candidate_contract.py negative \
            --evidence "${POROTA_PREDEPLOY_TMP}/porota-negative-fixtures.json"
          test "$(python -c 'import json, os; print(len(json.load(open(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], "porota-negative-fixtures.json")))))')" -eq 7
          echo 'POROTA_NEGATIVE_FIXTURES=GREEN'

      - name: Inventory original convergence source refs before governed tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/rc6_convergence_provenance.py \
            --repo-root . --candidate-sha "$CANDIDATE_SHA" \
            --out "${POROTA_PREDEPLOY_TMP}/porota-convergence-input-inventory.json" --fetch-source-refs

      - name: Governed automatic test discovery and execution - verify authenticated external G6
        shell: bash
        run: |
          set -Eeuo pipefail
          BOOTSTRAP_PYTHON="$(command -v python)"
          echo "POROTA_PREDEPLOY_BOOTSTRAP_PYTHON=$BOOTSTRAP_PYTHON" >> "$GITHUB_ENV"
          mkdir -m 700 "${POROTA_PREDEPLOY_TMP}/bootstrap-temp"
          export TMPDIR="${POROTA_PREDEPLOY_TMP}/bootstrap-temp"
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          g7_bootstrap_capacity() {
          "$BOOTSTRAP_PYTHON" - "$1" <<'PY_G7_BOOTSTRAP_CAPACITY'
          import os
          import sys
          from pathlib import Path
          from scripts.porota_predeploy_cleanup import read_file
          from scripts.rc6_architectural_gates import document, predeploy_capacity_gate
          raw,_=read_file(Path(os.environ['RC6_G7_OWNER_ADMISSION']),maximum=256*1024,mode=0o600)
          predeploy_capacity_gate(document(raw),scope=Path(os.environ['POROTA_PREDEPLOY_OWNER']),
              repo=Path.cwd(),environ=os.environ,stage=sys.argv[1])
          print('POROTA_G7_ENVIRONMENT_CAPACITY_LIVE=GREEN')
          PY_G7_BOOTSTRAP_CAPACITY
          }
          g7_bootstrap_capacity environment-bootstrap
          "$BOOTSTRAP_PYTHON" scripts/porota_predeploy_test_workspace.py create --scope "$POROTA_PREDEPLOY_OWNER"
          export PATH="${POROTA_PREDEPLOY_TMP}/venv/bin:$PATH"
          echo "${POROTA_PREDEPLOY_TMP}/venv/bin" >> "$GITHUB_PATH"
          g7_bootstrap_capacity locked-build
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements.build.lock.txt
          g7_bootstrap_capacity locked-runtime
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: \
            --no-binary=msgpack,ppi-client,signalrcoreppi,ta --no-build-isolation -r requirements.lock.txt
          python -m pip check
          python -m pip freeze --all > "${POROTA_PREDEPLOY_TMP}/porota-installed-dependencies.txt"
          python - <<'PY_EXTERNAL_GOV'
          import os
          from pathlib import Path
          from scripts.rc6_architectural_gates import document, import_verified_governed
          verified=document(Path(os.environ['RC6_G7_VERIFIED_ADMISSION']).read_bytes())
          assert verified['status']=='GREEN' and verified['target_gate']=='G7'
          assert verified['source_sha']==os.environ['CANDIDATE_SHA']
          assert verified['source_tree']==os.environ['CANDIDATE_TREE']
          result=import_verified_governed(verified,output_root=Path(os.environ['POROTA_PREDEPLOY_TMP']),epoch='311')
          print('POROTA_FULL_GOVERNED_NATIVE_ORIGIN=G6|run='+str(result['native_run_id'])+'|artifact='+str(result['artifact_id']))
          print('POROTA_G7_SOURCE_SUITE_REEXECUTED=false')
          print('POROTA_G7_PYTEST_FIN_CLAIMED=false')
          print('POROTA_GOVERNED_TESTS=GREEN|origin=AUTHENTICATED_G6_NATIVE_PAYLOAD')
          PY_EXTERNAL_GOV

      - name: Prove owned pytest post-read safety
        id: pytest_postread
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          "${POROTA_PREDEPLOY_BOOTSTRAP_PYTHON:-python}" scripts/porota_predeploy_test_workspace.py safe-postread \
            --scope "$POROTA_PREDEPLOY_OWNER"

      - name: Issue 465 programable reauditing evidence gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/rc6_issue465_audit_gate.py verify \
            --repo-root . \
            --junit "${POROTA_PREDEPLOY_TMP}/porota-governed-tests.xml" \
            --governed "${POROTA_PREDEPLOY_TMP}/porota-governed-tests.json" \
            --out "${POROTA_PREDEPLOY_TMP}/porota-issue465-audit-gate.json"

      - name: Governed test evidence summary
        if: always() && steps.pytest_postread.outputs.safe_postread == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f "${POROTA_PREDEPLOY_TMP}/porota-governed-tests.json" ]; then
            echo '### Governed productive suite' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: RED — evidence file missing' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import json
          data=json.load(open(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-governed-tests.json'),encoding='utf-8'))
          print('### Governed productive suite')
          print(f'- Status: {data["status"]}')
          print(f'- Discovered: {data["discovered"]}')
          print(f'- Executed: {data["executed"]}')
          print(f'- Failures: {data["failures"]} | Errors: {data["errors"]}')
          print(f'- Skipped: {data["skipped"]} | Xfail: {data["xfail"]}')
          print(f'- Exclusions: {len(data["exclusions"])}')
          PY

      - name: Secret scan of tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_secret_scan.py --repo-root .

      - name: Host control-plane provenance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_control_plane_inventory.py \
            --repo-root . \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-host-control-plane.json"

      - name: Dependency reproducibility gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_dependency_repro_audit.py \
            --repo-root . \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-dependency-repro.json" \
            --check-installed \
            --fail-on-gap

      - name: Host control-plane manifest V2
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_manifest_v2.py \
            --repo-root . \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --source-sha "$CANDIDATE_SHA" \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-host-manifest-v2.json"

      - name: Host control-plane reconciliation policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_host_policy_v2.py \
            --manifest "${POROTA_PREDEPLOY_TMP}/porota-host-manifest-v2.json" \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-host-policy-v2.json"

      - name: Final convergence input and guard provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/rc6_convergence_provenance.py \
            --repo-root . --candidate-sha "$CANDIDATE_SHA" \
            --junit "${POROTA_PREDEPLOY_TMP}/porota-governed-tests.xml" \
            --out "${POROTA_PREDEPLOY_TMP}/porota-final-input-provenance.json" --fetch-source-refs
          python - <<'PY_FINAL_MATERIAL'
          import os
          from pathlib import Path
          from scripts.rc6_convergence_provenance import read_json, final_material_receipt_binding
          final_material_receipt_binding(
              Path('.'), os.environ['CANDIDATE_SHA'], os.environ['CANDIDATE_TREE'],
              read_json(Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-final-input-provenance.json')).read_bytes()),
              read_json(Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-governed-tests.json')).read_bytes()),
              Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-governed-tests.xml')))
          print('POROTA_FINAL_MATERIAL_PROGRAMMING_GATES=GREEN')
          PY_FINAL_MATERIAL

      - name: Build candidate exactly once
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_artifact_provenance.py checkout \
            --repo-root . --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" --verify-context
          python - <<'PY_G7_BUILD_CAPACITY'
          import os
          from pathlib import Path
          from scripts.porota_predeploy_cleanup import read_file
          from scripts.rc6_architectural_gates import document, predeploy_capacity_gate
          raw,_=read_file(Path(os.environ['RC6_G7_OWNER_ADMISSION']),maximum=256*1024,mode=0o600)
          predeploy_capacity_gate(document(raw),scope=Path(os.environ['POROTA_PREDEPLOY_OWNER']),
              repo=Path.cwd(),environ=os.environ,stage='build')
          print('POROTA_G7_BUILD_CAPACITY_LIVE=GREEN')
          PY_G7_BUILD_CAPACITY
          python scripts/porota_predeploy_cleanup.py begin-build --scope "$POROTA_PREDEPLOY_OWNER"
          docker build \
            --label "porota.commit=${CANDIDATE_SHA}" \
            --label "porota.tree=${CANDIDATE_TREE}" \
            --label "porota.source-manifest-sha256=${SOURCE_MANIFEST_SHA256}" \
            --label "porota.predeploy=v2" \
            --label "porota.predeploy.owner=${POROTA_PREDEPLOY_OWNER_UUID}" \
            --label "porota.predeploy.run-id=${GITHUB_RUN_ID}" \
            --label "porota.predeploy.run-attempt=${GITHUB_RUN_ATTEMPT}" \
            -t "$IMAGE" .
          docker image inspect "$IMAGE" > "${POROTA_PREDEPLOY_TMP}/porota-image-inspect.json"
          python scripts/porota_predeploy_cleanup.py claim-image \
            --scope "$POROTA_PREDEPLOY_OWNER" --image-id "$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          echo "POROTA_BUILD_ONCE=GREEN|IMAGE=$IMAGE"

      - name: Extract exact image application filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir "${POROTA_PREDEPLOY_TMP}/porota-predeploy-app"
          cid="$(docker create "$IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/app/." "${POROTA_PREDEPLOY_TMP}/porota-predeploy-app/"
          docker rm "$cid" >/dev/null
          trap - EXIT
          test -f "${POROTA_PREDEPLOY_TMP}/porota-predeploy-app/Dockerfile"
          echo 'POROTA_EXACT_ARTIFACT_EXTRACT=GREEN'

      - name: Artifact completeness and import closure
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/porota_validate_deploy_artifact.py \
            --repo-root . \
            --artifact-root "${POROTA_PREDEPLOY_TMP}/porota-predeploy-app" \
            --manifest-out "${POROTA_PREDEPLOY_TMP}/porota-artifact-manifest.json" \
            --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --image-inspect "${POROTA_PREDEPLOY_TMP}/porota-image-inspect.json" \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE"
          python - <<'PY'
          import os
          import json
          p=os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-artifact-manifest.json')
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='GREEN'
          print('POROTA_ARTIFACT_FILES=' + str(x['artifact_runtime_files']))
          print('POROTA_ARTIFACT_MISSING=' + str(len(x['missing_runtime_files'])))
          print('POROTA_IMPORT_CLOSURE_MISSING=' + str(len(x['missing_local_imports'])))
          PY
          for asset in n_instrument_watchlist.json POROTA_SECTOR_MAP_V1.csv; do
            test -f "${POROTA_PREDEPLOY_TMP}/porota-predeploy-app/$asset"
            EXPECTED="$(sha256sum "$asset" | awk '{print $1}')"
            ACTUAL="$(sha256sum "${POROTA_PREDEPLOY_TMP}/porota-predeploy-app/$asset" | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL"
            echo "POROTA_STATIC_RUNTIME_ASSET=GREEN|$asset|$ACTUAL"
          done

      - name: Exact image import smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -i --pull never --network none --entrypoint python "$IMAGE" - <<'PY'
          import bg_paper_dashboard
          import bf_production_paper_observer
          import bv_paper_runtime
          import bl_candle_engine
          import be_paper_engine
          import bw_daily_risk
          import dh_paper_dynamic_risk_gate_hf6
          import rc6_paper_family_lifecycle
          import rc6_ppi_future_contract_policy
          import rc6_shadow_runtime.worker
          import rc6_shadow_runtime.entry_signals
          import rc6_shadow_runtime.funnel
          import rc6_shadow_runtime.source_authority
          import rc6_dynamic_universe.promotion
          import rc6_ppi_global_budget
          import o_dashboard
          import rc6_trader_dashboard
          import rc6_trader_dashboard.projection
          import scripts.rc6_shadow_health_gate
          import json
          from pathlib import Path
          from scripts.porota_dependency_repro_audit import (
              current_platform_identity, installed_distribution_audit, platform_supported)
          policy=json.loads(Path('ops/policy/rc6-supply-chain-v1.json').read_text())
          installed=installed_distribution_audit(policy)
          assert installed['status']=='GREEN', installed
          assert platform_supported(current_platform_identity(), policy['platform'])
          print('POROTA_IMAGE_INSTALLED_CLOSURE=GREEN|' + str(installed['installed_total']))
          print('POROTA_RUNTIME_IMPORT_SMOKE=GREEN')
          PY

      - name: Exact image native codec and archive control
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          docker run --rm --pull never --network none --read-only \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true \
            --no-healthcheck \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=33554432,uid=1000,gid=1000,mode=1777 \
            --entrypoint python "$ACTUAL_IMAGE_ID" \
            -m scripts.rc6_archive_v3_image_smoke \
            --source-manifest /app/POROTA_SOURCE_PROVENANCE.json \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --image-id "$ACTUAL_IMAGE_ID" > "${POROTA_PREDEPLOY_TMP}/porota-runtime-codec-smoke.json"
          python - "$ACTUAL_IMAGE_ID" <<'PY_CODEC_IMAGE'
          import os
          import os, sys
          from pathlib import Path
          from scripts.porota_artifact_provenance import verify_source_manifest
          from scripts.rc6_archive_v3_image_smoke import loads, sha, validate_report
          manifest_path = Path('POROTA_SOURCE_PROVENANCE.json')
          source = verify_source_manifest(Path('.'), manifest_path, os.environ['CANDIDATE_SHA'], os.environ['CANDIDATE_TREE'])
          raw = Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-runtime-codec-smoke.json')).read_bytes()
          validate_report(loads(raw), candidate_sha=os.environ['CANDIDATE_SHA'], tree_sha=os.environ['CANDIDATE_TREE'],
                          image_id=sys.argv[1], source_manifest_sha256=sha(manifest_path.read_bytes()),
                          source_sha256={row['path']: row['sha256'] for row in source['files']})
          print('POROTA_EXACT_IMAGE_NATIVE_CODEC_ARCHIVE=GREEN|' + sys.argv[1])
          PY_CODEC_IMAGE

      - name: Exact image runtime smoke contract
        shell: bash
        run: |
          set -Eeuo pipefail
          # Report the extracted image contents, rather than assuming its
          # Docker context excludes test sources or CI metadata.
          python - <<'PY'
          import os
          from pathlib import Path
          app = Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-predeploy-app'))
          sources = list(app.rglob('test_*.py'))
          print('POROTA_EXACT_IMAGE_TEST_SOURCES=' + ('PRESENT' if sources else 'ABSENT'))
          print('POROTA_EXACT_IMAGE_TEST_SOURCE_FILES=' + str(len(sources)))
          print('POROTA_EXACT_IMAGE_CI_METADATA=' + ('PRESENT' if (app / '.github').is_dir() else 'ABSENT'))
          PY
          echo "POROTA_EXACT_IMAGE_IMPORT_SMOKE=GREEN"
          echo "POROTA_FULL_SUITE=SEE_GOVERNED_TEST_EVIDENCE"
          echo "POROTA_GOVERNED_TEST_DISCOVERY=REPOSITORY_ROOT_AUTOMATIC"
      - name: PAPER safety source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          policy=Path('ops/policy/porota-policy.yaml').read_text(encoding='utf-8')
          assert 'required_mode: PRODUCTION_PAPER' in policy
          assert 'real_trading_allowed: false' in policy
          assert 'real_orders_sent_required: 0' in policy
          print('POROTA_PAPER_SAFETY_SOURCE_GATE=GREEN')
          PY

      - name: Export frozen candidate artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY_G7_EXPORT_CAPACITY'
          import os
          from pathlib import Path
          from scripts.porota_predeploy_cleanup import read_file
          from scripts.rc6_architectural_gates import document, predeploy_capacity_gate
          raw,_=read_file(Path(os.environ['RC6_G7_OWNER_ADMISSION']),maximum=256*1024,mode=0o600)
          predeploy_capacity_gate(document(raw),scope=Path(os.environ['POROTA_PREDEPLOY_OWNER']),
              repo=Path.cwd(),environ=os.environ,stage='artifact-export')
          print('POROTA_G7_ARTIFACT_EXPORT_CAPACITY_LIVE=GREEN')
          PY_G7_EXPORT_CAPACITY
          python scripts/porota_build_deploy_bundle_v2.py \
            --repo-root . \
            --output "${POROTA_PREDEPLOY_TMP}/porota-deploy-bundle-v2.tgz" \
            --manifest-out "${POROTA_PREDEPLOY_TMP}/porota-deploy-bundle-v2-manifest.json" \
            --source-manifest POROTA_SOURCE_PROVENANCE.json
          python scripts/porota_artifact_provenance.py bundle \
            --repo-root . --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --bundle "${POROTA_PREDEPLOY_TMP}/porota-deploy-bundle-v2.tgz" \
            --bundle-manifest "${POROTA_PREDEPLOY_TMP}/porota-deploy-bundle-v2-manifest.json" \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-bundle-byte-provenance.json"
          docker save "$IMAGE" | gzip -1 > "${POROTA_PREDEPLOY_TMP}/porota-predeploy-image.tar.gz"
          IMAGE_TAR_SHA="$(sha256sum "${POROTA_PREDEPLOY_TMP}/porota-predeploy-image.tar.gz" | awk '{print $1}')"
          IMAGE_ID="$(docker image inspect -f '{{.Id}}' "$IMAGE")"
          IMAGE_SIZE_BYTES="$(docker image inspect -f '{{.Size}}' "$IMAGE")"
          IMAGE_CONFIG_SHA="$(docker image inspect -f '{{json .Config}}' "$IMAGE" | sha256sum | awk '{print $1}')"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          python scripts/porota_artifact_provenance.py image-tar \
            --repo-root . --source-manifest POROTA_SOURCE_PROVENANCE.json \
            --image-tar "${POROTA_PREDEPLOY_TMP}/porota-predeploy-image.tar.gz" --image-id "$IMAGE_ID" \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --json-out "${POROTA_PREDEPLOY_TMP}/porota-image-tar-byte-provenance.json"
          python - "$CANDIDATE_SHA" "$TREE_SHA" "$IMAGE_ID" "$IMAGE_TAR_SHA" "$IMAGE_CONFIG_SHA" "$IMAGE_SIZE_BYTES" <<'PY'
          import os
          import hashlib,json,os,sys
          from pathlib import Path
          from scripts.rc6_archive_v3_image_smoke import SCHEMA, FIXTURE_SHA256, loads
          candidate,tree,image_id,image_tar_sha,image_config_sha,image_size_bytes=sys.argv[1:]
          rows={row['path']:row for row in json.loads(Path('POROTA_SOURCE_PROVENANCE.json').read_bytes())['files']}
          codec_raw=Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-runtime-codec-smoke.json')).read_bytes()
          assert loads(codec_raw)['image_id_argument'] == image_id
          payload={
            "schema_version":1,
            "candidate_sha":candidate,
            "candidate_tree_sha":tree,
            "image_id":image_id,
            "image_tar_sha256":image_tar_sha,
            "image_config_sha256":image_config_sha,
            "image_size_bytes":int(image_size_bytes),
            "paper_mode_required":"PRODUCTION_PAPER",
            "real_orders_sent_required":0,
            "real_order_capability_required":"BLOCKED",
            "build_once":True,
            "source_manifest_sha256":os.environ['SOURCE_MANIFEST_SHA256'],
            "source_byte_provenance_required":True,
            "final_input_provenance_sha256":hashlib.sha256(Path(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-final-input-provenance.json')).read_bytes()).hexdigest(),
            "runtime_codec_smoke":{
                "schema":SCHEMA,
                "receipt_sha256":hashlib.sha256(codec_raw).hexdigest(),
                "script_sha256":rows['scripts/rc6_archive_v3_image_smoke.py']['sha256'],
                "fixtures_sha256":{name:rows[name]['sha256'] for name in FIXTURE_SHA256},
                "image_id":image_id,
            },
            "execution_origin":json.load(open(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-predeploy-origin.json'),encoding="utf-8")),
          }
          open(os.path.join(os.environ["POROTA_PREDEPLOY_TMP"], 'porota-frozen-candidate.json'),"w",encoding="utf-8").write(
              json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print("POROTA_FROZEN_CANDIDATE=GREEN|"+candidate+"|"+tree+"|"+image_id)
          PY

      - name: Frozen candidate fail-closed contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python tests/ci_frozen_candidate_contract.py validate \
            --frozen "${POROTA_PREDEPLOY_TMP}/porota-frozen-candidate.json" \
            --image "${POROTA_PREDEPLOY_TMP}/porota-predeploy-image.tar.gz" \
            --manifest "${POROTA_PREDEPLOY_TMP}/porota-deploy-bundle-v2-manifest.json" \
            --candidate-sha "$CANDIDATE_SHA" \
            --tree-sha "$(git rev-parse HEAD^{tree})"

      - name: Upload predeploy evidence
        id: frozen_primary
        if: always() && steps.pytest_postread.outputs.safe_postread == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified2026-10-05
        with:
          name: porota-predeploy-v2-${{ env.CANDIDATE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-artifact-manifest.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-source-provenance.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-image-inspect.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-bundle-byte-provenance.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-image-tar-byte-provenance.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-issue465-audit-gate.json
            docs/audits/ISSUE465_REAUDIT.json
            docs/audits/ISSUE465_REAUDIT.md
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-host-control-plane.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-dependency-repro.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-installed-dependencies.txt
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-predeploy-origin.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-host-manifest-v2.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-host-policy-v2.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-deploy-bundle-v2.tgz
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-deploy-bundle-v2-manifest.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-predeploy-image.tar.gz
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-frozen-candidate.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-final-input-provenance.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-runtime-codec-smoke.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-governed-tests.xml
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-governed-tests.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-external-governed-origin.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-test-collection.txt
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-test-exclusions.txt
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-test-workspace.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-launch-intent.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-owned-fin.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-retained.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-retained-limit.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-progress.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-native.log
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-postread.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-producers-postread.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-collection-launch-intent.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-collection-owned-fin.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-collection-progress.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-collection-retained.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-collection-retained-limit.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-pytest-collection-postread.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-negative-fixtures.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-predeploy-evidence/

      - name: Upload only bounded owned pytest custody controls after unknown FIN
        if: always() && steps.pytest_postread.outputs.safe_postread != 'true' && steps.pytest_postread.outputs.control_receipt_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified2026-10-05
        with:
          name: porota-predeploy-v2-custody-controls-${{ env.CANDIDATE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ steps.pytest_postread.outputs.control_receipt }}

      - name: Replay exact published primary ZIP and export bounded evidence only
        if: success()
        shell: bash
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.frozen_primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.frozen_primary.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python scripts/porota_published_artifact_evidence.py \
            --candidate-sha "$CANDIDATE_SHA" --tree-sha "$CANDIDATE_TREE" \
            --artifact-id "$PRIMARY_ARTIFACT_ID" --upload-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --image-ref "$IMAGE" --repo-root . \
            --evidence-root "${POROTA_PREDEPLOY_TMP}/porota-predeploy-published-evidence" --deadline-seconds 600
          echo 'POROTA_SECONDARY_EVIDENCE_ONLY=GREEN|primary_remains_unique_promotable_artifact=true'

      - name: Upload small published-primary verification receipts
        id: primary_evidence_only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified2026-10-05
        with:
          name: porota-predeploy-v2-evidence-only-${{ env.CANDIDATE_SHA }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-predeploy-published-evidence/*.json
            ${{ env.POROTA_PREDEPLOY_TMP }}/porota-predeploy-published-evidence/*.xml

      - name: Enforce secondary evidence API size and origin
        if: success()
        shell: bash
        env:
          SECONDARY_ARTIFACT_ID: ${{ steps.primary_evidence_only.outputs.artifact-id }}
          SECONDARY_ARTIFACT_DIGEST: ${{ steps.primary_evidence_only.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python - <<'PY_SECONDARY'
          import os
          from scripts.porota_artifact_http import api_get
          from scripts.porota_published_artifact_evidence import MAX_SECONDARY_ARTIFACT_BYTES, upload_digest
          artifact=api_get('/actions/artifacts/' + str(int(os.environ['SECONDARY_ARTIFACT_ID'])))
          expected='porota-predeploy-v2-evidence-only-' + os.environ['CANDIDATE_SHA'] + '-run-' + os.environ['GITHUB_RUN_ID'] + '-attempt-' + os.environ['GITHUB_RUN_ATTEMPT']
          assert artifact['name']==expected and artifact['expired'] is False
          assert artifact['digest']==upload_digest(os.environ['SECONDARY_ARTIFACT_DIGEST'])
          assert 0 < artifact['size_in_bytes'] <= MAX_SECONDARY_ARTIFACT_BYTES
          assert artifact['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert artifact['workflow_run']['head_sha']==os.environ['CANDIDATE_SHA']
          print('POROTA_SECONDARY_EVIDENCE_API=GREEN|id=' + str(artifact['id']) + '|bytes=' + str(artifact['size_in_bytes']) + '|promotable=false')
          PY_SECONDARY

      - name: Local cleanup
        id: local_cleanup
        if: always() && steps.pytest_postread.outputs.safe_postread == 'true'
        timeout-minutes: 4
        shell: bash
        run: |
          set -Eeuo pipefail
          "${POROTA_PREDEPLOY_BOOTSTRAP_PYTHON:-python}" scripts/porota_predeploy_test_workspace.py require-owned-fin \
            --scope "$POROTA_PREDEPLOY_OWNER"
          "${POROTA_PREDEPLOY_BOOTSTRAP_PYTHON:-python}" scripts/porota_predeploy_cleanup.py cleanup \
            --scope "${RUNNER_TEMP}/porota-predeploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.owner.json" \
            --receipt "${RUNNER_TEMP}/porota-predeploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.cleanup.json"

      - name: Predeploy summary
        if: success() && steps.local_cleanup.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          "${POROTA_PREDEPLOY_BOOTSTRAP_PYTHON:-python}" - <<'PY_CLEANUP_SUMMARY'
          import json, os
          from scripts.porota_predeploy_cleanup import read_file, RECEIPT_SCHEMA
          raw, _ = read_file(os.environ['POROTA_PREDEPLOY_CLEANUP_RECEIPT'], maximum=1048576, mode=0o600)
          result = json.loads(raw)
          assert result['schema'] == RECEIPT_SCHEMA and result['status'] == 'GREEN'
          assert result['failures'] == [] and result['private_root_absent'] is True
          assert result['owner']['context']['candidate_sha'] == os.environ['CANDIDATE_SHA']
          assert result['owner']['context']['candidate_tree'] == os.environ['CANDIDATE_TREE']
          assert result['owner']['context']['run_id'] == os.environ['GITHUB_RUN_ID']
          assert result['owner']['context']['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert result['owner']['owner_uuid'] == os.environ['POROTA_PREDEPLOY_OWNER_UUID']
          print('POROTA_PREDEPLOY_CLEANUP_RECEIPT=GREEN')
          PY_CLEANUP_SUMMARY
          {
            echo '### Porota Predeploy V2'
            echo "- Candidate SHA: \`${CANDIDATE_SHA}\`"
            echo '- Policy: GREEN'
            echo '- Compile: GREEN'
            echo '- Governed automatic test discovery: GREEN'
            echo '- Secret scan: GREEN'
            echo '- Host control-plane provenance: GREEN'
            echo '- Dependency reproducibility: GREEN'
            echo '- Host manifest V2: GREEN'
            echo '- Host reconciliation policy: GREEN'
            echo '- Build: ONCE'
            echo '- Exact artifact integrity: GREEN'
            echo '- Checkout/image/bundle/exported layers byte provenance: GREEN'
            echo '- Import closure: GREEN'
            echo '- Runtime import smoke: GREEN'
            echo '- Exact published ZIP replay and saved /app rootfs modes: GREEN'
            echo '- Downloaded primary loaded image and offline imports: GREEN'
            echo '- Bounded secondary receipts: EVIDENCE ONLY; primary remains sole promotable artifact'
            echo '- Full governed suite: GREEN from authenticated G6 same-SHA native artifact; source suite not reexecuted in G7'
            echo '- G7 pytest producer witness: NO_PYTEST_LAUNCH_ATTEMPTED; external G6 FIN separately verified'
            echo '- Negative fail-closed fixtures: GREEN'
            echo '- PAPER safety source gate: GREEN'
            echo '- Local cleanup: GREEN (UUID/run/ImageID ownership verified; measured filesystem deltas in job log)'
            echo '- Droplet touched: NO'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'POROTA_PREDEPLOY_V2=GREEN'
          echo 'DROPLET_TOUCHED=NO'
