            ${{ runner.temp }}/porota-native-sizing-evidence/payload/cadence/cadence-legacy.json
            /tmp/porota-governed-tests.json
            /tmp/porota-test-collection.txt
            /tmp/porota-test-exclusions.txt
            /tmp/porota-negative-fixtures.json

      - name: Sanitized RCA phase learning (diagnostic only)
        # Observes even failed gates; uses only named step outcomes, no raw
        # logs or inferred cause. No merge/deploy/trade/operational GO.
        if: ${{ always() && steps.rc6_checkout.outcome == 'success' }}
        shell: bash
        env:
          RC6_CI_OUTCOME_PR_PROVENANCE: ${{ steps.rc6_pr_provenance.outcome }}
          RC6_CI_OUTCOME_EARLY_REPLAY: ${{ steps.rc6_early_replay.outcome }}
          RC6_CI_OUTCOME_GOVERNED_SUITE: ${{ steps.rc6_governed_suite.outcome }}
          RC6_CI_OUTCOME_PARALLEL_PILOT: ${{ steps.rc6_parallel_pilot.outcome }}
          RC6_CI_OUTCOME_BUILD_ONCE: ${{ steps.rc6_build_once.outcome }}
          RC6_CI_OUTCOME_NATIVE_PROOF: ${{ steps.rc6_native_proof.outcome }}
          RC6_CI_OUTCOME_ARTIFACT_GATE: ${{ steps.rc6_artifact_gate.outcome }}
        run: |
          set -Eeuo pipefail
          python -m scripts.rc6_ci_rca_snapshot \
            --registry ops/policy/rc6-rca-signatures-v1.json \
            --output /tmp/porota-rca-learning.json

      - name: Upload sanitized RCA diagnostic (never promotion input)
        if: ${{ always() && steps.rc6_checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: porota-ci-rca-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: /tmp/porota-rca-learning.json

      - name: Local cleanup
        id: rc6_local_cleanup
        if: always()
        shell: bash
        env:
          RC6_BUILD_OUTCOME: ${{ steps.rc6_build_once.outcome }}
          RC6_EXTRACT_OUTCOME: ${{ steps.rc6_extract_application.outcome }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${CANDIDATE_SHA:-}" =~ ^[0-9a-f]{40}$ ||
                "${IMAGE:-}" != "porota-predeploy-v2:${CANDIDATE_SHA:-}" ||
                ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ||
                ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ||
                ! "${RC6_BUILD_OUTCOME:-}" =~ ^(skipped|success|failure)$ ||
                ! "${RC6_EXTRACT_OUTCOME:-}" =~ ^(skipped|success|failure)$ ]]; then
            echo 'POROTA_PREDEPLOY_LOCAL_CLEANUP=HOLD79|creation_receipt_invalid'
            exit 79
          fi
          # A skipped GitHub step proves that this job never attempted to
          # create that resource. A failed Docker inspect never proves absence.
          rc6_image_state=WARN
          if [[ "$RC6_BUILD_OUTCOME" == skipped ]]; then
            rc6_image_state=GREEN
            echo 'POROTA_PREDEPLOY_IMAGE_CLEANUP=GREEN|NO_RESOURCE|build_not_started'
          elif [[ "$RC6_BUILD_OUTCOME" == success || "$RC6_BUILD_OUTCOME" == failure ]]; then
            if [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ &&
                  "$IMAGE" == "porota-predeploy-v2:$CANDIDATE_SHA" ]]; then
              # A979 read-only receipt of exact candidate tag and labels.
              # Even an immutable image ID does not authorize deletion:
              # a same-UID actor can retag a foreign sole tag to that ID.
              if rc6_image_receipt="$(docker image inspect \
                --format '{{.Id}}|{{index .Config.Labels "porota.commit"}}|{{index .Config.Labels "porota.predeploy"}}|{{json .RepoTags}}' \
                "$IMAGE" 2>/dev/null)"; then
                IFS='|' read -r rc6_image_id rc6_commit rc6_scope rc6_tags <<<"$rc6_image_receipt"
                if [[ "$rc6_image_id" =~ ^sha256:[0-9a-f]{64}$ &&
                      "$rc6_commit" == "$CANDIDATE_SHA" && "$rc6_scope" == v2 &&
                      "$rc6_tags" == "[\"$IMAGE\"]" ]]; then
                  # Inspected identity is not a stable deletion authority.
                  # Retain for ephemeral-runner teardown. Do not claim a
                  # current-release cleanup GO based on a mutable tag.
                  rc6_image_state=RETAINED
                  echo 'POROTA_PREDEPLOY_IMAGE_CLEANUP=RETAINED|HOLD79|tag_namespace_mutable_no_delete'
                fi
              fi
            fi
          fi
          if [[ "$rc6_image_state" == WARN ]]; then
            echo 'POROTA_PREDEPLOY_IMAGE_CLEANUP=WARN|unknown_or_foreign_image_no_delete'
          fi

          rc6_stage_state=WARN
          if [[ "$RC6_EXTRACT_OUTCOME" == skipped &&
                -z "${RC6_EXTRACT_STAGE:-}" && -z "${RC6_EXTRACT_STAGE_ID:-}" ]]; then
            rc6_stage_state=GREEN
            echo 'POROTA_PREDEPLOY_STAGE_CLEANUP=GREEN|NO_RESOURCE|extract_not_started'
          elif [[ "$RC6_EXTRACT_OUTCOME" == success || "$RC6_EXTRACT_OUTCOME" == failure ]]; then
            if [[ "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ &&
                  "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ &&
                  -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" &&
                  -n "${RC6_EXTRACT_STAGE:-}" && -n "${RC6_EXTRACT_STAGE_ID:-}" &&
                  "$RC6_EXTRACT_STAGE" == "$RUNNER_TEMP/porota-predeploy-app-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" &&
                  -d "$RC6_EXTRACT_STAGE" && ! -L "$RC6_EXTRACT_STAGE" ]]; then
              rc6_stage_identity="$(stat -c '%d:%i:%u:%a' -- "$RC6_EXTRACT_STAGE" 2>/dev/null)" || rc6_stage_identity=
              if [[ "$rc6_stage_identity" == "$RC6_EXTRACT_STAGE_ID" &&
                    "$rc6_stage_identity" == *:$(id -u):700 ]]; then
                # The pathname can be swapped by a same-UID actor *after*
                # stat; rm -rf would then erase a different app's directory.
                # Retain it for ephemeral-runner disposal, never claim that
                # a previous identity receipt authorizes current deletion.
                rc6_stage_state=RETAINED
                echo 'POROTA_PREDEPLOY_STAGE_CLEANUP=RETAINED|HOLD79|pathname_swap_unresolved_no_delete'
              fi
            fi
          fi
          if [[ "$rc6_stage_state" == WARN ]]; then
            echo 'POROTA_PREDEPLOY_STAGE_CLEANUP=WARN|unknown_or_foreign_stage_no_delete'
          fi
          if [[ "$rc6_image_state" != GREEN || "$rc6_stage_state" != GREEN ]]; then
            echo 'POROTA_PREDEPLOY_LOCAL_CLEANUP=HOLD79|ownership_not_proven'
            exit 79
          fi
          echo 'POROTA_PREDEPLOY_LOCAL_CLEANUP=GREEN|job_owned_only'

      - name: Predeploy summary
        # No GO certificate before verified cleanup and required evidence.
        if: ${{ success() && steps.rc6_local_cleanup.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo '### Porota Predeploy V2'
            echo "- Candidate SHA: \`${CANDIDATE_SHA}\`"
            echo '- Policy: GREEN'
            echo '- Compile: GREEN'
            echo '- Governed automatic test discovery: GREEN'
            echo '- Secret scan: GREEN'
            echo '- Host control-plane provenance: GREEN'
            echo '- Dependency reproducibility: GREEN'
            echo '- Host manifest V2: GREEN'
            echo '- Host reconciliation policy: GREEN'
            echo '- Build: ONCE'
            echo '- Exact artifact integrity: GREEN'
            echo '- Import closure: GREEN'
            echo '- Runtime import smoke: GREEN'
            echo '- Full governed suite: GREEN (see porota-governed-tests.json)'
            echo '- Negative fail-closed fixtures: GREEN'
            echo '- PAPER safety source gate: GREEN'
            echo '- Droplet touched: NO'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'POROTA_PREDEPLOY_V2=GREEN'
          echo 'DROPLET_TOUCHED=NO'

  release-evidence-required:
    name: RC6 required release evidence (offhost)
    # GitHub treats SKIPPED jobs as successful required checks. Unlike the
    # candidate gate, this product-targeted job must run on skipped/failure.
    # R254: R144 remains the image/native publication lock. Only trusted-main
    # R251 D/E release bytes may satisfy the separate required PR check.
    # This job never builds an image and never authorizes host deployment.
    needs: artifact-gate
    if: ${{ always() && github.event.pull_request.base.ref == 'deploy/rc6-pr69-isolated-20260915' }}
    runs-on: ubuntu-24.04
    # R252 audits the immutable full ZIP/image (bounded at 2 GiB), not just
    # the former small JSON. Do not time out legitimate, bounded verification.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout untrusted PR head for exact SHA inspection only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .rc6-release-head-inspect
          persist-credentials: false

      - name: Checkout immutable reviewed release evidence guard
        # R252 merged with independent SEC GO and required CI/attestation PASS.
        # Pin the exact merge commit; this is never a mutable branch checkout.
        # Never use mutable main or execute PR HEAD's version of the guard.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f831e2929d1a622f409211010fadaece6b15e953
          path: .rc6-release-guard-trusted
          persist-credentials: false

      - name: Verify pinned R252 trusted RELEASE receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC6_RELEASE_PR_DRAFT: ${{ github.event.pull_request.draft }}
          RC6_BRIDGE_REPOSITORY: ${{ github.repository }}
          RC6_BRIDGE_MODE: PR_CANDIDATE
          RC6_BRIDGE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RC6_BRIDGE_CANDIDATE_TREE_SHA: ''
          # R259: derive publisher identity from immutable trusted checkout.
          # Three empty E selectors trigger R252 bounded UNIQUE REST discovery;
          # no repository Variables write credential, no latest-by-date choice.
          # R252 must reauthenticate exact E/D run/attempt/artifact/ZIP bytes.
          RC6_BRIDGE_PUBLISHER_MAIN_SHA: ''
          RC6_BRIDGE_E_RUN_ID: ''
          RC6_BRIDGE_E_RUN_ATTEMPT: ''
          RC6_BRIDGE_E_ARTIFACT_ID: ''
          RC6_BRIDGE_PRODUCT_SHA: ''
          RC6_BRIDGE_PRODUCT_REF: ''
        run: |
          set -Eeuo pipefail
          # Fail closed on any mismatch with the independently reviewed main.
          test "$(git -C .rc6-release-guard-trusted rev-parse HEAD)" = \
            "f831e2929d1a622f409211010fadaece6b15e953" || exit 79
          test "$RC6_RELEASE_PR_DRAFT" = false || exit 79
          test "${{ github.event.pull_request.number }}" = 1087 || exit 79
          test "$(git -C .rc6-release-head-inspect rev-parse HEAD)" = \
            "$RC6_BRIDGE_CANDIDATE_SHA" || exit 79
          RC6_BRIDGE_CANDIDATE_TREE_SHA="$(git -C .rc6-release-head-inspect rev-parse HEAD^{tree})"
          export RC6_BRIDGE_CANDIDATE_TREE_SHA
          [[ "$RC6_BRIDGE_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 79
          [[ "$RC6_BRIDGE_CANDIDATE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 79
          test -f .rc6-release-guard-trusted/scripts/rc6_ci_release_required_guard.py || exit 79
          python3 -I .rc6-release-guard-trusted/scripts/rc6_ci_release_required_guard.py \
            --trusted-release-mode PR_CANDIDATE || exit 79
          echo 'RC6_R254=TRUSTED_RELEASE_BYTES_BOUND|automatic_go=NO|host=NO'
