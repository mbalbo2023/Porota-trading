      - name: Verify required published native evidence
        id: rc6_artifact_gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import yaml

          stage = Path(os.environ['RC6_TMPDIR'])
          proof = stage / 'porota-native-sizing-evidence'
          def is_aliased(path):
              return any(parent.is_symlink() for parent in (path, *path.parents)
                         if parent == stage or stage in parent.parents)
          required = [
              stage / 'porota-frozen-candidate.json',
              stage / 'porota-deploy-bundle-v2.tgz',
              stage / 'porota-deploy-bundle-v2-manifest.json',
              stage / 'porota-predeploy-image.tar.gz',
              stage / 'porota-governed-tests.json',
              proof / 'native-bound.xml',
              *(proof / 'session' / name for name in (
                  'dashboard_auth_52.xml', 'publication_io_identity.xml',
                  'scalping_capacity.xml', 'scheduler_monitor_backup.xml',
                  'signals_risk_exit_ledger.xml', 'sources_readiness_network.xml',
                  'sql_shadow_wal.xml', 'treasury_caucion.xml')),
              proof / 'session/stress.json',
              proof / 'catalog/full-catalog.json',
              proof / 'cadence/cadence-fresh.json',
              proof / 'cadence/cadence-legacy.json',
          ]
          for path in required:
              if is_aliased(path):
                  raise SystemExit(f'REQUIRED_PREDEPLOY_EVIDENCE_ALIASED:{path.name}')
              # Never sudo/chown a candidate-writable proof tree. If UID1000
              # generated mode0700 evidence the runner cannot read, HOLD79;
              # do not substitute broad recursive permission changes.
              if not os.access(path, os.R_OK):
                  print(f'REQUIRED_PREDEPLOY_EVIDENCE_UNREADABLE:{path.name}')
                  raise SystemExit(79)
              if not path.is_file():
                  raise SystemExit(f'REQUIRED_PREDEPLOY_EVIDENCE_MISSING:{path.name}')
              if path.stat().st_size == 0:
                  raise SystemExit(f'REQUIRED_PREDEPLOY_EVIDENCE_MISSING:{path.name}')
          for path in (item for item in required if item.suffix == '.xml'):
              root = ET.parse(path).getroot()
              if (not root.findall('.//testcase') or
                      next(root.iter('failure'), None) is not None or
                      next(root.iter('error'), None) is not None or
                      next(root.iter('skipped'), None) is not None):
                  raise SystemExit(f'REQUIRED_NATIVE_JUNIT_NOT_GREEN:{path.name}')
          governed = json.loads((stage / 'porota-governed-tests.json').read_text())
          if (governed['status'] != 'GREEN' or
                  any(governed[key] for key in ('failures', 'errors', 'skipped', 'xfail'))):
              raise SystemExit('REQUIRED_GOVERNED_JUNIT_NOT_GREEN')
          for path in (proof / 'session/stress.json',
                       proof / 'cadence/cadence-fresh.json',
                       proof / 'cadence/cadence-legacy.json'):
              data = json.loads(path.read_text())
              if data['status'] != 'GREEN' or data['production_data_mounted'] is not False:
                  raise SystemExit(f'REQUIRED_NATIVE_RECEIPT_NOT_GREEN:{path.name}')
          # Keep the single uploader's exact-file list as the only publisher
          # manifest. Detect newly generated receipts omitted from that list
          # instead of falsely certifying a silently incomplete artifact.
          workflow = yaml.safe_load(Path('.github/workflows/porota-predeploy-v2.yml').read_text())
          upload = next(step for step in workflow['jobs']['artifact-gate']['steps']
                        if step.get('name') == 'Upload predeploy evidence')
          # Split expression introducers so Actions cannot interpolate them
          # inside this Python code; we compare to the checked-in YAML text.
          prefix = '$' + '{{ runner.temp }}/porota-v2-$' + '{{ github.run_id }}-$' + '{{ github.run_attempt }}/'
          declared = [line.strip() for line in upload['with']['path'].splitlines() if line.strip()]
          if not declared or len(declared) != len(set(declared)):
              raise SystemExit('PREDEPLOY_UPLOAD_MANIFEST_DUPLICATE_OR_EMPTY')
          native_declared = set()
          for entry in declared:
              if not entry.startswith(prefix) or any(ch in entry for ch in '*!'):
                  raise SystemExit('PREDEPLOY_UPLOAD_MANIFEST_UNSAFE_PATH')
              name = entry[len(prefix):]
              relative = Path(name)
              if not name or relative.is_absolute() or '..' in relative.parts:
                  raise SystemExit('PREDEPLOY_UPLOAD_MANIFEST_UNSAFE_PATH')
              path = stage / relative
              # No exact allowlist name may alias a symlinked parent or a
              # foreign file. Checked before actions/upload-artifact.
              if is_aliased(path):
                  raise SystemExit(f'PREDEPLOY_UPLOAD_MANIFEST_ALIASED:{name}')
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'PREDEPLOY_UPLOAD_MANIFEST_MISSING:{name}')
              if relative.parts[0] == 'porota-native-sizing-evidence':
                  native_declared.add(Path(*relative.parts[1:]).as_posix())
          native_required = {path.relative_to(proof).as_posix()
                             for path in required if proof in path.parents}
          if native_declared != native_required:
              raise SystemExit('PREDEPLOY_NATIVE_ALLOWLIST_DRIFT')
          for path in proof.rglob('*'):
              relative = path.relative_to(proof)
              # These are sandbox temporary and generated cadence DATA, not
              # publishable evidence. No directory traversal/upload of them.
              if relative.parts[0] == 'tmp' or relative.parts[:2] in (
                      ('cadence', 'fresh'), ('cadence', 'legacy')):
                  continue
              if path.is_symlink():
                  raise SystemExit(f'NATIVE_EVIDENCE_ALIASED:{relative}')
              if path.is_file() and relative.as_posix() not in native_declared:
                  raise SystemExit(f'NATIVE_EVIDENCE_UNDECLARED_FILE:{relative}')
          print('POROTA_REQUIRED_EVIDENCE=GREEN')
          PY

