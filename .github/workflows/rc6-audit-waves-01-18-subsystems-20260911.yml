name: RC6 Audit Waves 01-18 and Subsystems 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-audit-waves-01-18-subsystems-20260911.yml

permissions:
  contents: read

concurrency:
  group: rc6-audit-waves-01-18-subsystems
  cancel-in-progress: false

jobs:
  static_traceability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace W01-W18 and subsystem evidence in candidate tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== RC6 STATIC TRACEABILITY AUDIT ==='
          echo "AUDIT_SHA=$(git rev-parse HEAD)"
          echo 'MUTATIONS=NONE'
          echo 'BUSINESS_LOGIC_CHANGES=NONE'
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('.')
          files=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              p=pathlib.Path(raw.decode('utf-8','replace'))
              try:
                  if p.stat().st_size > 2_000_000: continue
                  s=p.read_text('utf-8',errors='ignore')
              except Exception:
                  continue
              files.append((str(p),s))
          print('--- WAVE TOKENS BY NUMBER ---')
          for n in range(1,19):
              pats=[re.compile(rf'(?i)(?<![A-Za-z0-9])W0?{n}(?![0-9])'),
                    re.compile(rf'(?i)wave[_ -]*0?{n}(?![0-9])'),
                    re.compile(rf'(?i)ola[_ -]*0?{n}(?![0-9])')]
              hits=[]
              for p,s in files:
                  if any(x.search(s) for x in pats) or any(x.search(p) for x in pats):
                      hits.append(p)
              print(f'W{n:02d}|FILES={len(hits)}|SAMPLE={";".join(hits[:12]) or "NONE"}')
          print('--- SUBSYSTEM FILE/CONTENT EVIDENCE ---')
          terms={
            'GDELT':r'(?i)gdelt',
            'RISK':r'(?i)\b(risk|riesgo|var|drawdown|exposure)\b',
            'CONTRACT_EVIDENCE':r'(?i)(contract[_ -]?evidence|scrap|browser.*contract)',
            'HISTORY_INGEST':r'(?i)(histor|history|ingest|backfill|candle)',
            'NEWS_SENTIMENT':r'(?i)(news|noticia|sentiment|geopolit|event.*risk)',
            'SECTOR_BINDING':r'(?i)(sector.*binding|sector[_ -]?concentration)',
          }
          for label,pat in terms.items():
              rx=re.compile(pat)
              hits=[p for p,s in files if rx.search(p) or rx.search(s)]
              print(f'{label}|FILES={len(hits)}|SAMPLE={";".join(hits[:25]) or "NONE"}')
          PY
          echo '--- FEATURE-RELATED COMMIT TRACE (latest 300) ---'
          git log --all -n 300 --oneline --decorate=short | grep -Ei '(^|[^A-Za-z0-9])(w(ave)?[ _-]?(0?[1-9]|1[0-8])|ola[ _-]?(0?[1-9]|1[0-8])|gdelt|risk|riesgo|histor|ingest|backfill|scrap|contract|sector|calendar|exit|learning|introspection)' | head -n 220 || true
          echo 'STATIC_AUDIT_COMPLETE=YES'

  runtime_subsystems:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_audit"
          chmod 600 "$HOME/.ssh/porota_rc6_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit runtime ingestion scraping history risk and GDELT read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_audit" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          TARGET_SHA=e47eeffcb94a9468ac7e7f610beee0869353a77e
          echo '=== RC6 RUNTIME SUBSYSTEM AUDIT READ-ONLY ==='
          echo "UTC=$(date -u +%FT%TZ)"
          echo 'MUTATIONS=NONE'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          echo "HOST_SHA=$(git -C "$REPO" rev-parse HEAD)"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$TARGET_SHA"

          SAFETY="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import os,sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=10); c.execute('PRAGMA query_only=ON')
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone(); c.close()
          print('|'.join([mode,str(orders),os.getenv('ORDER_EXECUTION_MODE',''),os.getenv('REAL_ORDER_CAPABILITY','')]))
          PY
          )"
          echo "SAFETY=$SAFETY"
          case "$SAFETY" in PRODUCTION_PAPER\|0\|SIMULATED\|BLOCKED|PRODUCTION_PAPER\|0\|\|BLOCKED|PRODUCTION_PAPER\|0\|SIMULATED\|) ;; *) echo 'SAFETY_PRECHECK=FAIL'; exit 41;; esac
          echo 'SAFETY_PRECHECK=GREEN'

          echo '--- RELEVANT SYSTEMD UNITS ---'
          sudo -n systemctl list-unit-files --type=timer --type=service --no-pager --no-legend 2>/dev/null | grep -Ei 'porota.*(contract|evidence|histor|ingest|backfill|candle|risk|riesgo|gdelt|news|sentiment|functional|preopen)' || true
          echo '--- RELEVANT TIMERS CURRENT STATE ---'
          for u in porota-contract-evidence-rc6.timer porota-functional-health-rc6.timer porota-history-postclose-rc6.timer porota-candle-integrity-rc6.timer porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer porota-a3-history-weekend-rc6.timer; do
            echo "UNIT=$u|ACTIVE=$(sudo -n systemctl is-active "$u" 2>/dev/null || true)|ENABLED=$(sudo -n systemctl is-enabled "$u" 2>/dev/null || true)|LAST=$(sudo -n systemctl show "$u" -p LastTriggerUSec --value 2>/dev/null || true)|NEXT=$(sudo -n systemctl show "$u" -p NextElapseUSecRealtime --value 2>/dev/null || true)"
          done
          for s in porota-contract-evidence-rc6.service porota-functional-health-rc6.service porota-history-postclose-rc6.service porota-candle-integrity-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            echo "SERVICE=$s|RESULT=$(sudo -n systemctl show "$s" -p Result --value 2>/dev/null || true)|EXIT=$(sudo -n systemctl show "$s" -p ExecMainStatus --value 2>/dev/null || true)|INACTIVE=$(sudo -n systemctl show "$s" -p InactiveEnterTimestamp --value 2>/dev/null || true)"
          done

          echo '--- RUNTIME FEATURE FILES ---'
          sudo -n docker exec porota_production_observer sh -lc "find /app -maxdepth 2 -type f 2>/dev/null | grep -Ei '(gdelt|risk|riesgo|news|sentiment|geopolit|contract|evidence|scrap|histor|history|ingest|backfill|candle)' | sort | head -n 240" || true
          echo '--- RUNTIME CONTENT MARKERS ---'
          sudo -n docker exec porota_production_observer sh -lc "grep -RIlE 'GDELT|gdelt|geopolit|sentiment|event[_ -]?risk' /app --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' 2>/dev/null | head -n 120" || true

          echo '--- SQLITE SUBSYSTEM INVENTORY ---'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import os,sqlite3,glob,re
          dbs=sorted(set(glob.glob('/app/data/**/*.db',recursive=True)))
          print('DB_FILES='+str(len(dbs)))
          focus=re.compile(r'(histor|candle|contract|evidence|scrap|risk|riesgo|gdelt|news|sentiment|event|ingest|backfill)',re.I)
          for db in dbs[:80]:
              try:
                  c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=5); c.execute('PRAGMA query_only=ON')
                  tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
                  interesting=[t for t in tables if focus.search(t)]
                  print(f'DB={db}|TABLES={len(tables)}|FOCUS={";".join(interesting) or "NONE"}')
                  for t in interesting[:40]:
                      qt='"'+t.replace('"','""')+'"'
                      try: n=c.execute(f'select count(*) from {qt}').fetchone()[0]
                      except Exception as e: n=f'ERR:{type(e).__name__}'
                      cols=[r[1] for r in c.execute(f'pragma table_info({qt})')]
                      ts=next((x for x in cols if x.lower() in ('timestamp','ts','datetime','date','last_update','updated_at','created_at','asof','as_of','trading_date','candle_ts','fetched_at','observed_at')),None)
                      latest='NA'
                      if ts:
                          qcol='"'+ts.replace('"','""')+'"'
                          try: latest=c.execute(f'select max({qcol}) from {qt}').fetchone()[0]
                          except Exception: latest='ERR'
                      print(f'TABLE={t}|ROWS={n}|LATEST_COL={ts or "NONE"}|LATEST={latest}')
                  c.close()
              except Exception as e:
                  print(f'DB={db}|ERROR={type(e).__name__}:{e}')
          PY

          echo '--- DASHBOARD READ-ONLY PAGE SIGNALS ---'
          python3 - <<'PY'
          import re,subprocess,html
          urls=['http://127.0.0.1:8000/historicos','http://127.0.0.1:8000/instrumentos','http://127.0.0.1:8000/riesgo','http://127.0.0.1:8000/sistema?section=scraping']
          rx=re.compile(r'(cobertura|hist[oó]ric|ingesta|catalog|universo|contract|evidence|scrap|ready_paper|hold|riesgo|risk|gdelt|sentiment|geopolit|amarillo|verde|stale|missing|records=|market_closed|production_paper)',re.I)
          for u in urls:
              try:
                  raw=subprocess.check_output(['curl','-fsS','--max-time','8',u],text=True)
                  txt=re.sub(r'<script.*?</script>|<style.*?</style>',' ',raw,flags=re.S|re.I)
                  txt=re.sub(r'<[^>]+>','\n',txt); txt=html.unescape(txt)
                  lines=[]
                  for x in txt.splitlines():
                      x=' '.join(x.split())
                      if x and rx.search(x): lines.append(x)
                  print('PAGE='+u)
                  for x in lines[:120]: print('  '+x[:500])
              except Exception as e: print(f'PAGE={u}|ERROR={e}')
          PY

          echo '--- CONTRACT EVIDENCE FRESH CAPTURE ---'
          python3 - "$REPO" <<'PY'
          from pathlib import Path
          import json,sys,datetime
          root=Path(sys.argv[1])/'data/contract_evidence/rc6_trusted'
          files=sorted(root.glob('contract_*.json'),key=lambda p:p.stat().st_mtime,reverse=True)
          print('CAPTURE_COUNT='+str(len(files)))
          if files:
              p=files[0]; st=p.stat(); print(f'LATEST={p.name}|SIZE={st.st_size}|MTIME_UTC={datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat()}')
              try:
                  x=json.loads(p.read_text(errors='replace'))
                  if isinstance(x,dict):
                      print('TOP_KEYS='+';'.join(sorted(map(str,x.keys()))[:80]))
                      for k,v in x.items():
                          if isinstance(v,list): print(f'LIST={k}|ROWS={len(v)}')
                          elif isinstance(v,dict): print(f'DICT={k}|KEYS={len(v)}')
              except Exception as e: print('CAPTURE_PARSE_ERROR='+repr(e))
          PY

          echo '--- GDELT RUNTIME VERDICT INPUTS ---'
          GDELT_FILES="$(sudo -n docker exec porota_production_observer sh -lc "find /app -maxdepth 3 -type f 2>/dev/null | grep -i gdelt | wc -l" | tr -d ' ')"
          GDELT_CONTENT="$(sudo -n docker exec porota_production_observer sh -lc "grep -RIl 'gdelt' /app --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' 2>/dev/null | wc -l" | tr -d ' ')"
          echo "GDELT_FILENAME_MATCHES=$GDELT_FILES"
          echo "GDELT_CONTENT_MATCHES=$GDELT_CONTENT"

          FINAL="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('PRAGMA query_only=ON')
          x=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone(); c.close(); print('|'.join(map(str,x)))
          PY
          )"
          echo "FINAL_SAFETY=$FINAL"
          test "$FINAL" = 'PRODUCTION_PAPER|0'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'RUNTIME_SUBSYSTEM_AUDIT_COMPLETE=YES'
          HOST
