name: RC6 Policy Sector Convergence 2026-09-10

on:
  workflow_dispatch:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-policy-sector-convergence-20260910.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-w10-sector-map-binding-20260910
          fetch-depth: 0

      - name: Materialize approved policy convergence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rewrite(path, transform):
              p = Path(path)
              before = p.read_text(encoding='utf-8')
              after = transform(before)
              if after == before:
                  raise SystemExit(f'NO_CHANGE:{path}')
              p.write_text(after, encoding='utf-8')

          def economics_shadow_mode(text):
              text = text.replace('"PAPER_ECONOMIC_GATE_MODE": "BINDING"', '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"')
              if '"PAPER_ECONOMIC_GATE_MODE": "BINDING"' in text:
                  raise SystemExit('MODE_MANAGER_BINDING_REMAINS')
              return text

          rewrite('porota_mode_manager.py', economics_shadow_mode)

          def runtime_shadow(text):
              old = 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING")'
              new = 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")'
              if old not in text:
                  raise SystemExit('RUNTIME_ECONOMIC_DEFAULT_NOT_FOUND')
              return text.replace(old, new)
          rewrite('bv_paper_runtime.py', runtime_shadow)

          def dashboard_shadow(text):
              old = 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING").upper()'
              new = 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW").upper()'
              if old not in text:
                  raise SystemExit('DASHBOARD_ECONOMIC_DEFAULT_NOT_FOUND')
              return text.replace(old, new)
          rewrite('bg_paper_dashboard.py', dashboard_shadow)

          def broker_shadow(text):
              replacements = {
                  'economics_mode="BINDING"': 'economics_mode="SHADOW"',
                  'str(economics_mode or "BINDING").upper()': 'str(economics_mode or "SHADOW").upper()',
              }
              changed = text
              for old, new in replacements.items():
                  changed = changed.replace(old, new)
              if changed == text:
                  raise SystemExit('BROKER_ECONOMIC_DEFAULTS_NOT_FOUND')
              return changed
          rewrite('be_paper_engine.py', broker_shadow)

          def sector_fallback(text):
              anchor = '    return result\n\n\ndef collect(store, *, at=None, candidate=None) -> dict:\n'
              helper = '''    return result\n\n\ndef _reviewed_sector_mapping(sector_map: dict[tuple, dict], key: tuple) -> dict | None:\n    \"\"\"Resolve sector without treating settlement as an issuer attribute.\n\n    Exact reviewed evidence wins. If only settlement differs, reuse the mapping\n    solely when ticker/family/market/currency resolve to one reviewed sector.\n    Currency/family/market are deliberately not crossed. Ambiguity stays\n    unmapped so a BINDING sector gate remains fail-closed.\n    \"\"\"\n    exact = sector_map.get(key)\n    if exact:\n        return exact\n    identity = tuple(key[:4])\n    matches = [row for candidate_key, row in sector_map.items()\n               if tuple(candidate_key[:4]) == identity]\n    sectors = {str(row.get(\"sector\") or \"\").strip() for row in matches\n               if str(row.get(\"sector\") or \"\").strip()}\n    if len(sectors) != 1:\n        return None\n    for row in matches:\n        if str(row.get(\"sector\") or \"\").strip() in sectors:\n            resolved = dict(row)\n            resolved[\"resolution\"] = \"REVIEWED_UNAMBIGUOUS_SETTLEMENT_FALLBACK\"\n            return resolved\n    return None\n\n\ndef collect(store, *, at=None, candidate=None) -> dict:\n'''
              if anchor not in text:
                  raise SystemExit('SECTOR_HELPER_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, helper, 1)
              count = text.count('mapped = sector_map.get(key)')
              if count != 2:
                  raise SystemExit(f'EXPECTED_TWO_EXACT_LOOKUPS_GOT_{count}')
              return text.replace('mapped = sector_map.get(key)', 'mapped = _reviewed_sector_mapping(sector_map, key)')
          rewrite('es_policy_context_rc6.py', sector_fallback)

          def shadow_contract(text):
              old = '''def current_learning_contracts() -> tuple[LearningPolicy, ...]:\n    \"\"\"RC6 campaign starts all profitability/selection policies without veto.\"\"\"\n    return tuple(policy_contract(key, \"SHADOW\") for key in LEARNING_POLICIES)\n'''
              new = '''def current_learning_contracts() -> tuple[LearningPolicy, ...]:\n    \"\"\"Current RC6 authority: learn in SHADOW except the approved sector risk guard.\"\"\"\n    return tuple(\n        policy_contract(key, \"BINDING_PAPER\" if key == \"SECTOR_CONCENTRATION\" else \"SHADOW\")\n        for key in LEARNING_POLICIES\n    )\n'''
              if old not in text:
                  raise SystemExit('SHADOW_CONTRACT_ANCHOR_NOT_FOUND')
              return text.replace(old, new)
          rewrite('es_shadow_binding_contract_rc6.py', shadow_contract)

          def shadow_tests(text):
              old = '''def test_all_learning_policies_start_shadow_without_paper_veto():\n    rows = contract.current_learning_contracts()\n    assert {r.key for r in rows} == set(contract.LEARNING_POLICIES)\n    assert all(r.stage == \"SHADOW\" for r in rows)\n    assert all(r.authority == \"SHADOW\" for r in rows)\n    assert all(r.can_block_paper is False for r in rows)\n    assert all(r.automatic_promotion is False for r in rows)\n'''
              new = '''def test_learning_policies_stay_shadow_except_authorized_sector_risk_guard():\n    rows = {r.key: r for r in contract.current_learning_contracts()}\n    assert set(rows) == set(contract.LEARNING_POLICIES)\n    sector = rows[\"SECTOR_CONCENTRATION\"]\n    assert sector.stage == \"BINDING_PAPER\"\n    assert sector.authority == \"BINDING_PAPER\"\n    assert sector.can_block_paper is True\n    for key, row in rows.items():\n        if key == \"SECTOR_CONCENTRATION\":\n            continue\n        assert row.stage == \"SHADOW\"\n        assert row.authority == \"SHADOW\"\n        assert row.can_block_paper is False\n    assert all(row.automatic_promotion is False for row in rows.values())\n'''
              if old not in text:
                  raise SystemExit('SHADOW_TEST_ANCHOR_NOT_FOUND')
              return text.replace(old, new)
          rewrite('tests/test_shadow_binding_contract_rc6.py', shadow_tests)

          def ledger_isolation(text):
              anchor = "LATER='2026-09-01T11:00:00-03:00'\n\n\n"
              insert = '''LATER='2026-09-01T11:00:00-03:00'\n\n\n@pytest.fixture(autouse=True)\ndef isolate_ledger_integrity_from_entry_selection_policy(monkeypatch):\n    \"\"\"These tests start after admission; sector eligibility is tested elsewhere.\"\"\"\n    monkeypatch.setenv(\"PAPER_SECTOR_CONCENTRATION_POLICY\", \"SHADOW\")\n\n\n'''
              if anchor not in text:
                  raise SystemExit('LEDGER_FIXTURE_ANCHOR_NOT_FOUND')
              return text.replace(anchor, insert, 1)
          rewrite('tests/test_single_close_ledger_v17.py', ledger_isolation)

          Path('tests/test_rc6_sector_settlement_fallback.py').write_text('''\nimport es_policy_context_rc6 as policy\n\n\ndef row(sector):\n    return {\"sector\": sector, \"source\": \"TEST_REVIEWED\", \"author\": \"TEST\", \"effective_at\": \"2026-09-10\"}\n\n\ndef test_exact_reviewed_mapping_wins():\n    exact = (\"GGAL\", \"ACCIONES\", \"BYMA\", \"ARS\", \"INMEDIATA\")\n    mapping = {exact: row(\"FINANCIALS\")}\n    assert policy._reviewed_sector_mapping(mapping, exact)[\"sector\"] == \"FINANCIALS\"\n\n\ndef test_reviewed_sector_is_settlement_invariant_when_unambiguous():\n    reviewed = (\"AAPLD\", \"CEDEARS\", \"BYMA\", \"USD_MEP\", \"A-24HS\")\n    immediate = (\"AAPLD\", \"CEDEARS\", \"BYMA\", \"USD_MEP\", \"INMEDIATA\")\n    resolved = policy._reviewed_sector_mapping({reviewed: row(\"TECHNOLOGY\")}, immediate)\n    assert resolved[\"sector\"] == \"TECHNOLOGY\"\n    assert resolved[\"resolution\"] == \"REVIEWED_UNAMBIGUOUS_SETTLEMENT_FALLBACK\"\n\n\ndef test_sector_fallback_never_crosses_currency_family_or_market():\n    base = (\"GGAL\", \"ACCIONES\", \"BYMA\", \"ARS\", \"A-24HS\")\n    mapping = {base: row(\"FINANCIALS\")}\n    assert policy._reviewed_sector_mapping(mapping, (\"GGAL\", \"ACCIONES\", \"BYMA\", \"USD_MEP\", \"INMEDIATA\")) is None\n    assert policy._reviewed_sector_mapping(mapping, (\"GGAL\", \"CEDEARS\", \"BYMA\", \"ARS\", \"INMEDIATA\")) is None\n    assert policy._reviewed_sector_mapping(mapping, (\"GGAL\", \"ACCIONES\", \"NYSE\", \"ARS\", \"INMEDIATA\")) is None\n\n\ndef test_ambiguous_reviewed_sectors_remain_fail_closed():\n    mapping = {\n        (\"TEST\", \"ACCIONES\", \"BYMA\", \"ARS\", \"A-24HS\"): row(\"ENERGY\"),\n        (\"TEST\", \"ACCIONES\", \"BYMA\", \"ARS\", \"CI\"): row(\"FINANCIALS\"),\n    }\n    target = (\"TEST\", \"ACCIONES\", \"BYMA\", \"ARS\", \"INMEDIATA\")\n    assert policy._reviewed_sector_mapping(mapping, target) is None\n'''.lstrip(), encoding='utf-8')

          # Static convergence invariants.
          mode = Path('porota_mode_manager.py').read_text(encoding='utf-8')
          runtime = Path('bv_paper_runtime.py').read_text(encoding='utf-8')
          dash = Path('bg_paper_dashboard.py').read_text(encoding='utf-8')
          gate = Path('ck_policy_gate_hf6.py').read_text(encoding='utf-8')
          assert '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"' in mode
          assert '"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"' in mode
          assert '"PAPER_MAX_POSITIONS_PER_SECTOR": "2"' in mode
          assert 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in runtime
          assert 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in dash
          assert '_mode(SECTOR_ENV, "BINDING")' in gate
          print('POLICY_CONVERGENCE_STATIC=GREEN')
          PY

      - name: Build focused proof image
        run: docker build --pull=false -t porota-rc6-policy-proof:${GITHUB_SHA} .

      - name: Run focused policy sector and ledger regressions offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-policy-proof:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              tests/test_shadow_binding_contract_rc6.py \
              tests/test_rc6_runtime_safety.py \
              tests/test_rc6_t1_settlement_hotfix.py \
              tests/test_rc6_sector_settlement_fallback.py \
              tests/test_rc6_w10_sector_map_binding.py \
              tests/test_single_close_ledger_v17.py'

      - name: Commit converged policy only after proof is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add porota_mode_manager.py bv_paper_runtime.py bg_paper_dashboard.py \
            be_paper_engine.py es_policy_context_rc6.py es_shadow_binding_contract_rc6.py \
            tests/test_shadow_binding_contract_rc6.py tests/test_single_close_ledger_v17.py \
            tests/test_rc6_sector_settlement_fallback.py
          git diff --cached --check
          git commit -m 'fix(rc6): keep economics shadow and sector concentration binding'
          git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
