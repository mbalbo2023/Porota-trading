name: RC6 Policy Sector Convergence 2026-09-10

on:
  workflow_dispatch:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-policy-sector-convergence-20260910.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-w10-sector-map-binding-20260910
          fetch-depth: 0

      - name: Materialize approved policy convergence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, before, after):
              if before == after:
                  raise SystemExit(f"NO_CHANGE:{path}")
              Path(path).write_text(after, encoding="utf-8")

          p = "porota_mode_manager.py"
          before = load(p)
          after = before.replace('"PAPER_ECONOMIC_GATE_MODE": "BINDING"', '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"')
          assert '"PAPER_ECONOMIC_GATE_MODE": "BINDING"' not in after
          assert after.count('"PAPER_ECONOMIC_GATE_MODE": "SHADOW"') >= 2
          save(p, before, after)

          p = "bv_paper_runtime.py"
          before = load(p)
          old = 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING")'
          new = 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")'
          assert old in before
          save(p, before, before.replace(old, new))

          p = "bg_paper_dashboard.py"
          before = load(p)
          old = 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING").upper()'
          new = 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW").upper()'
          assert old in before
          save(p, before, before.replace(old, new))

          p = "be_paper_engine.py"
          before = load(p)
          after = before.replace('economics_mode="BINDING"', 'economics_mode="SHADOW"')
          after = after.replace('str(economics_mode or "BINDING").upper()', 'str(economics_mode or "SHADOW").upper()')
          assert after != before
          assert 'economics_mode="BINDING"' not in after
          assert 'str(economics_mode or "BINDING").upper()' not in after
          save(p, before, after)

          p = "es_policy_context_rc6.py"
          before = load(p)
          marker = "def collect(store, *, at=None, candidate=None) -> dict:"
          assert marker in before
          assert "def _reviewed_sector_mapping(" not in before
          helper = '''def _reviewed_sector_mapping(sector_map: dict[tuple, dict], key: tuple) -> dict | None:
              """Resolve sector across settlement only when reviewed identity is unambiguous."""
              exact = sector_map.get(key)
              if exact:
                  return exact
              identity = tuple(key[:4])
              matches = [row for candidate_key, row in sector_map.items()
                         if tuple(candidate_key[:4]) == identity]
              sectors = {str(row.get("sector") or "").strip() for row in matches
                         if str(row.get("sector") or "").strip()}
              if len(sectors) != 1:
                  return None
              resolved = dict(matches[0])
              resolved["resolution"] = "REVIEWED_UNAMBIGUOUS_SETTLEMENT_FALLBACK"
              return resolved


          '''
          # Dedent the helper while preserving its function body indentation.
          import textwrap
          helper = textwrap.dedent(helper)
          after = before.replace(marker, helper + marker, 1)
          assert after.count("mapped = sector_map.get(key)") == 2
          after = after.replace("mapped = sector_map.get(key)", "mapped = _reviewed_sector_mapping(sector_map, key)")
          save(p, before, after)

          p = "es_shadow_binding_contract_rc6.py"
          before = load(p)
          old = '    return tuple(policy_contract(key, "SHADOW") for key in LEARNING_POLICIES)'
          new = '''    return tuple(
              policy_contract(key, "BINDING_PAPER" if key == "SECTOR_CONCENTRATION" else "SHADOW")
              for key in LEARNING_POLICIES
          )'''
          assert old in before
          after = before.replace('"""RC6 campaign starts all profitability/selection policies without veto."""',
                                 '"""RC6 stays SHADOW except the explicitly authorized sector risk guard."""')
          after = after.replace(old, new)
          save(p, before, after)

          p = "tests/test_shadow_binding_contract_rc6.py"
          before = load(p)
          start = before.index("def test_all_learning_policies_start_shadow_without_paper_veto():")
          end = before.index("\n\ndef test_hard_safety_blocks_are_separate_from_learning_policies():", start)
          replacement = '''def test_learning_policies_stay_shadow_except_authorized_sector_risk_guard():
              rows = {r.key: r for r in contract.current_learning_contracts()}
              assert set(rows) == set(contract.LEARNING_POLICIES)
              sector = rows["SECTOR_CONCENTRATION"]
              assert sector.stage == "BINDING_PAPER"
              assert sector.authority == "BINDING_PAPER"
              assert sector.can_block_paper is True
              for key, row in rows.items():
                  if key == "SECTOR_CONCENTRATION":
                      continue
                  assert row.stage == "SHADOW"
                  assert row.authority == "SHADOW"
                  assert row.can_block_paper is False
              assert all(row.automatic_promotion is False for row in rows.values())
          '''
          replacement = textwrap.dedent(replacement).rstrip()
          after = before[:start] + replacement + before[end:]
          save(p, before, after)

          p = "tests/test_single_close_ledger_v17.py"
          before = load(p)
          marker = "LATER='2026-09-01T11:00:00-03:00'\n"
          assert marker in before
          fixture = '''

          @pytest.fixture(autouse=True)
          def isolate_ledger_integrity_from_entry_selection_policy(monkeypatch):
              """Ledger tests start after admission; sector eligibility is covered separately."""
              monkeypatch.setenv("PAPER_SECTOR_CONCENTRATION_POLICY", "SHADOW")
          '''
          fixture = textwrap.dedent(fixture)
          after = before.replace(marker, marker + fixture, 1)
          save(p, before, after)

          Path("tests/test_rc6_sector_settlement_fallback.py").write_text(textwrap.dedent('''
          import es_policy_context_rc6 as policy


          def row(sector):
              return {"sector": sector, "source": "TEST_REVIEWED", "author": "TEST", "effective_at": "2026-09-10"}


          def test_exact_reviewed_mapping_wins():
              exact = ("GGAL", "ACCIONES", "BYMA", "ARS", "INMEDIATA")
              assert policy._reviewed_sector_mapping({exact: row("FINANCIALS")}, exact)["sector"] == "FINANCIALS"


          def test_reviewed_sector_is_settlement_invariant_when_unambiguous():
              reviewed = ("AAPLD", "CEDEARS", "BYMA", "USD_MEP", "A-24HS")
              immediate = ("AAPLD", "CEDEARS", "BYMA", "USD_MEP", "INMEDIATA")
              resolved = policy._reviewed_sector_mapping({reviewed: row("TECHNOLOGY")}, immediate)
              assert resolved["sector"] == "TECHNOLOGY"
              assert resolved["resolution"] == "REVIEWED_UNAMBIGUOUS_SETTLEMENT_FALLBACK"


          def test_sector_fallback_never_crosses_currency_family_or_market():
              base = ("GGAL", "ACCIONES", "BYMA", "ARS", "A-24HS")
              mapping = {base: row("FINANCIALS")}
              assert policy._reviewed_sector_mapping(mapping, ("GGAL", "ACCIONES", "BYMA", "USD_MEP", "INMEDIATA")) is None
              assert policy._reviewed_sector_mapping(mapping, ("GGAL", "CEDEARS", "BYMA", "ARS", "INMEDIATA")) is None
              assert policy._reviewed_sector_mapping(mapping, ("GGAL", "ACCIONES", "NYSE", "ARS", "INMEDIATA")) is None


          def test_ambiguous_reviewed_sectors_remain_fail_closed():
              mapping = {
                  ("TEST", "ACCIONES", "BYMA", "ARS", "A-24HS"): row("ENERGY"),
                  ("TEST", "ACCIONES", "BYMA", "ARS", "CI"): row("FINANCIALS"),
              }
              target = ("TEST", "ACCIONES", "BYMA", "ARS", "INMEDIATA")
              assert policy._reviewed_sector_mapping(mapping, target) is None
          ''').lstrip(), encoding="utf-8")

          mode = load("porota_mode_manager.py")
          assert '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"' in mode
          assert '"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"' in mode
          assert '"PAPER_MAX_POSITIONS_PER_SECTOR": "2"' in mode
          assert 'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in load("bv_paper_runtime.py")
          assert 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' in load("bg_paper_dashboard.py")
          assert '_mode(SECTOR_ENV, "BINDING")' in load("ck_policy_gate_hf6.py")
          print("POLICY_CONVERGENCE_STATIC=GREEN")
          PY

      - name: Build focused proof image
        run: docker build --pull=false -t porota-rc6-policy-proof:${GITHUB_SHA} .

      - name: Run focused regressions offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-policy-proof:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              tests/test_shadow_binding_contract_rc6.py \
              tests/test_rc6_runtime_safety.py \
              tests/test_rc6_t1_settlement_hotfix.py \
              tests/test_rc6_sector_settlement_fallback.py \
              tests/test_rc6_w10_sector_map_binding.py \
              tests/test_single_close_ledger_v17.py'

      - name: Commit only after focused proof is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add porota_mode_manager.py bv_paper_runtime.py bg_paper_dashboard.py \
            be_paper_engine.py es_policy_context_rc6.py es_shadow_binding_contract_rc6.py \
            tests/test_shadow_binding_contract_rc6.py tests/test_single_close_ledger_v17.py \
            tests/test_rc6_sector_settlement_fallback.py
          git diff --cached --check
          git commit -m 'fix(rc6): keep economics shadow and sector concentration binding'
          git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
