name: RC6 WS-DISK-04 sqlite pragma-only reclaim audit

on:
  push:
    branches:
      - audit/ws-disk-01-readonly-20261001
    paths:
      - '.github/workflows/rc6-ws-disk-04-sqlite-pragma-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-disk-audit-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_audit" "$HOME/.ssh/known_hosts"

      - name: Read-only SQLite PRAGMAs
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_audit" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n timeout 30 python3 -u -' <<'PY'
          import os,sqlite3
          paths=[
            "/opt/porota-trading/data/paper_v17/observer_v17.db",
            "/opt/porota-trading/data/market_history.db",
            "/opt/porota-trading/data/evidence/ppi_history_exact_v1/manifest_exact_v1.db",
          ]
          print("READ_ONLY=true",flush=True)
          for p in paths:
              print(f"DB={p}",flush=True)
              try:
                  c=sqlite3.connect(f"file:{p}?mode=ro&immutable=0",uri=True,timeout=2)
                  c.execute("PRAGMA query_only=ON")
                  page_size=int(c.execute("PRAGMA page_size").fetchone()[0])
                  page_count=int(c.execute("PRAGMA page_count").fetchone()[0])
                  freelist=int(c.execute("PRAGMA freelist_count").fetchone()[0])
                  av=c.execute("PRAGMA auto_vacuum").fetchone()[0]
                  jm=c.execute("PRAGMA journal_mode").fetchone()[0]
                  c.close()
                  size=os.path.getsize(p)
                  free=page_size*freelist
                  print(f"SIZE_BYTES={size}",flush=True)
                  print(f"PAGE_SIZE={page_size}",flush=True)
                  print(f"PAGE_COUNT={page_count}",flush=True)
                  print(f"FREELIST_COUNT={freelist}",flush=True)
                  print(f"FREELIST_BYTES={free}",flush=True)
                  print(f"FREELIST_PCT={(100.0*freelist/page_count if page_count else 0):.4f}",flush=True)
                  print(f"AUTO_VACUUM={av}",flush=True)
                  print(f"JOURNAL_MODE={jm}",flush=True)
              except Exception as e:
                  print(f"ERROR={type(e).__name__}:{e}",flush=True)
          print("POROTA_SQLITE_PRAGMA_AUDIT=GREEN",flush=True)
          PY

      - name: Cleanup runner key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/porota_rc6_audit"
