name: RC6 Parallel RCA W12 and Module Orphans 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-parallel-rca-w12-orphans-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-orphans:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert immutable RC6 safety
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Classify static and operational references
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== ORPHAN_REFERENCE_SCAN ==='
          for m in fa_raw_evidence_store_rc6 fm_critical_approval_unix_runtime_rc6 rc5_release_preflight rc6_trusted_browser_contract_collector; do
            echo "--- MODULE=$m ---"
            rg -n --hidden --glob '!.git/**' --glob '!tests/**' --glob '!POROTA_TRADING_CHECKPOINT*' --glob '!*.md' "$m" . || true
          done
          echo '=== ENTRYPOINT_HEURISTICS ==='
          for f in fa_raw_evidence_store_rc6.py fm_critical_approval_unix_runtime_rc6.py rc5_release_preflight.py rc6_trusted_browser_contract_collector.py; do
            echo "--- FILE=$f ---"
            grep -nE '__main__|argparse|main\(|serve\(|run\(|archive_|socket|profile|collector|preflight' "$f" | head -n 80 || true
          done
          echo ORDER_ROUTES=NOT_CALLED

  host-w12:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect exact W12 profile and account-verify logic read-only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo '=== SERVICE_EFFECTIVE_IDENTITY ==='
          sudo -n systemctl show porota-contract-evidence-rc6.service -p User -p Group -p ExecStart -p EnvironmentFiles --no-pager || true
          echo '=== SAFE_W12_CONFIG ==='
          sudo -n python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/porota/contract-evidence-rc6.conf')
          allowed={'POROTA_CHROME_PROFILE','BROWSER_USER','BROWSER_HOME','POROTA_BROWSER_USER','POROTA_BROWSER_HOME','CE_PYTHON','POROTA_CE_PYTHON'}
          vals={}
          if p.is_file():
              for raw in p.read_text(encoding='utf-8',errors='replace').splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#') or '=' not in line: continue
                  k,v=line.split('=',1); k=k.strip(); v=v.strip().strip('"').strip("'")
                  if k in allowed: vals[k]=v
          for k in sorted(vals): print(f'{k}={vals[k]}')
          prof=vals.get('POROTA_CHROME_PROFILE')
          if prof:
              q=Path(prof)
              print('PROFILE_CONFIGURED=YES')
              print('PROFILE_EXISTS='+('YES' if q.is_dir() else 'NO'))
              if q.exists():
                  st=q.stat(); print(f'PROFILE_UID={st.st_uid}|PROFILE_GID={st.st_gid}|PROFILE_MODE={oct(st.st_mode & 0o777)}|PROFILE_MTIME_NS={st.st_mtime_ns}')
          else:
              print('PROFILE_CONFIGURED=NO')
          PY
          echo '=== REAUTH_ACCOUNT_VERIFY_SOURCE_SANITIZED ==='
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py')
          lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
          secretish=re.compile(r'(?i)(password|passwd|secret|token|cookie|otp|authorization)')
          for i in range(270,326):
              if i > len(lines): break
              s=lines[i-1]
              if secretish.search(s):
                  print(f'L{i}=<REDACTED_SECRET_RELATED_SOURCE_LINE>')
              else:
                  print(f'L{i}={s[:420]}')
          PY
          echo '=== ACTIVE_HOST_ENTRYPOINT_REFS ==='
          sudo -n rg -n --no-messages 'rc6_trusted_browser_contract_collector|fm_critical_approval_unix_runtime_rc6|fa_raw_evidence_store_rc6|rc5_release_preflight' /etc/systemd/system /usr/local/sbin /usr/local/lib /opt/porota-trading/scripts 2>/dev/null | head -n 160 || true
          echo '=== CURRENT_STATE_SAFE ==='
          sudo -n python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/opt/porota-trading/data/contract_evidence/rc6_trusted/runtime_state.json')
          if p.is_file():
              d=json.loads(p.read_text(encoding='utf-8'))
              for k in ('status','mode','real_orders_sent','order_routes','updated_at','generated_at','auth_status'):
                  if k in d: print(f'{k.upper()}={d.get(k)}')
          else: print('RUNTIME_STATE=MISSING')
          PY
          echo MUTATIONS=NONE
          echo COLLECTOR_EXECUTED=NO
          echo SECRETS_VALUES_PRINTED=NO
          echo ORDER_ROUTES=NOT_CALLED
          HOST
