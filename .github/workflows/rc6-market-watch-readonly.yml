name: RC6 motivo del HOLD de cauciones READ_ONLY
run-name: RC6 cauciones último intento READ_ONLY
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Leer el estado y los intentos PAPER existentes
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  cauciones:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' && inputs.operation == 'read_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read PAPER state and safe reason codes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:c2752f066fdde7028efca5e36e2ed32433e3f87cd5ca29783d0f56baa8b3b541 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json, re, sqlite3, time
          from cg_paper_workspace import database_path
          def code(value):
              return value if isinstance(value, str) and re.fullmatch(r'[A-Z][A-Z0-9_]{1,95}', value) else 'NO_VERIFICADO'
          with closing(sqlite3.connect(database_path().as_uri() + '?mode=ro', uri=True, timeout=.4)) as conn:
              conn.execute('PRAGMA query_only=ON')
              deadline = time.monotonic() + 2
              conn.set_progress_handler(lambda: time.monotonic() > deadline, 1000)
              mode, orders = conn.execute('SELECT mode, real_orders_sent FROM observer_state WHERE id=1').fetchone()
              if (mode, orders) != ('PRODUCTION_PAPER', 0):
                  raise SystemExit('PAPER_ZERO_NO_VERIFICADO')
              heartbeat, state, reason, attempt = conn.execute('SELECT heartbeat_at,state,code,last_attempt_at FROM paper_caucion_cash_sweep_state WHERE id=1').fetchone()
              attempts = conn.execute('SELECT status,code,count(*),min(evaluated_at),max(evaluated_at) FROM paper_caucion_cash_sweep_attempts WHERE request_id=? GROUP BY status,code LIMIT 30', ('paper-caucion-cash-sweep:2026-11-25:ARS:v1',)).fetchall()
              alerts = conn.execute("SELECT kind,state,count(*),max(sent_at) FROM paper_notification_outbox WHERE julianday(created_at)>=julianday(?) AND kind LIKE '%CAUCION%' GROUP BY kind,state LIMIT 20", ('2026-11-25T03:00:00Z',)).fetchall()
              print(json.dumps({'at':datetime.now(timezone.utc).isoformat(),'mode':mode,'orders':orders,'heartbeat':heartbeat,'state':code(state),'code':code(reason),'last_attempt':attempt,'attempts':[[code(s),code(c),n,first,last] for s,c,n,first,last in attempts],'alerts':[[code(k),code(s),n,sent] for k,s,n,sent in alerts]}))
          PY
          HOST
