name: RC6 Market Watch READ_ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-market-watch-readonly.yml'
      - 'scripts/rc6_market_watch_readonly.py'
      - 'tests/test_rc6_market_watch_readonly.py'
      - 'scripts/rc6_operator_dashboard_readonly.py'
      - 'tests/test_rc6_operator_dashboard_readonly.py'
      - 'docs/ops/RC6_MARKET_WATCH_READONLY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc6-market-watch-readonly.yml'
      - 'scripts/rc6_market_watch_readonly.py'
      - 'tests/test_rc6_market_watch_readonly.py'
      - 'scripts/rc6_operator_dashboard_readonly.py'
      - 'tests/test_rc6_operator_dashboard_readonly.py'
      - 'docs/ops/RC6_MARKET_WATCH_READONLY.md'
  schedule:
    # Argentina UTC-3; the job's local-time gate restricts monitoring to rueda.
    - cron: '7,17,27,37,47,57 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      notification_mode:
        description: 'normal delivers transitions; read_only records evidence without sending or creating delivery state'
        type: choice
        options: [normal, read_only]
        default: normal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-market-watch-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostic/rc6-624-consumer-profile-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      AB_BASELINE: 202e49c750ab0a69b5ba6790fcb14cc0c0d9039f
      AB_CANDIDATE: 99ea4aa009d105de70c4b2841488084bf34b8e7b
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test isolated monitor without network
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_market_watch_readonly.py tests/test_rc6_market_watch_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_market_watch_readonly.py -v
          python3 -m py_compile scripts/rc6_operator_dashboard_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_operator_dashboard_readonly.py -v
          git diff --check
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AB_BASELINE }}
          path: baseline624
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AB_CANDIDATE }}
          path: candidate624
      - uses: actions/checkout@v4
        with:
          ref: 4699c0f6a2ccf18b14148614e6c0a972f8e9ecd5
          path: frozen-docs624
      - name: Independently validate frozen baseline artifact bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ab624-validated"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12123121595/zip" > "$RUNNER_TEMP/ab624-frozen.zip"
          python3 frozen-docs624/docs/releases/evidence624/validate-frozen-artifact.py \
            --zip "$RUNNER_TEMP/ab624-frozen.zip" \
            --digest 511a06390863d6a987958e057d696a301614ba539d9d006f2fe729941e1208f7 \
            --sha "$AB_BASELINE" --tree f3ddca733e40649c4e2605f69d5b7ec59dd839e8 \
            --repo baseline624 --output "$RUNNER_TEMP/ab624-validated"
          docker load -i "$RUNNER_TEMP/ab624-validated/porota-predeploy-image.tar.gz"
      - name: Prepare same ABI and verified source overlays for isolated A/B
        shell: bash
        run: |
          set -Eeuo pipefail
          image="porota-predeploy-v2:$AB_BASELINE"
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/app/rc6_shadow_runtime" "$RUNNER_TEMP/ab624-native"
          docker rm "$cid" >/dev/null
          trap - EXIT
          native=("$RUNNER_TEMP"/ab624-native/_rc6_json_bound*.so)
          test "${#native[@]}" -eq 1
          cmp baseline624/rc6_shadow_runtime/_rc6_json_bound.c candidate624/rc6_shadow_runtime/_rc6_json_bound.c
          cp "${native[0]}" baseline624/rc6_shadow_runtime/
          cp "${native[0]}" candidate624/rc6_shadow_runtime/
          install -d -m777 "$RUNNER_TEMP/ab624-evidence"
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          for name in ('baseline624','candidate624'):
              root=Path(name)
              paths=subprocess.check_output(['git','-C',name,'ls-files','*.py'],text=True).splitlines()
              paths += [str(p.relative_to(root)) for p in (root/'rc6_shadow_runtime').glob('_rc6_json_bound*.so')]
              rows=[{'path':p,'sha256':hashlib.sha256((root/p).read_bytes()).hexdigest()} for p in paths]
              (root/'ab624-source-manifest.json').write_text(json.dumps(rows))
          PY
      - name: Candidate focal regressions inside frozen ABI without providers
        shell: bash
        run: |
          set -Eeuo pipefail
          # Resource fixtures exercise the mandatory 2GiB disk floor. Their
          # basetemp uses the bound evidence filesystem, as in native V2 proof;
          # the separate /tmp tmpfs remains bounded to 64MiB.
          python3 -c 'import shutil,sys; free=shutil.disk_usage(sys.argv[1]).free; assert free>=2*1024**3; print("AB624_FIXTURE_DISK_RESERVE=GREEN|free="+str(free))' "$RUNNER_TEMP/ab624-evidence"
          docker run --rm --pull never --memory 512m --memory-swap 512m --cpus .75 \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --workdir /experiment \
            --mount "type=bind,src=$GITHUB_WORKSPACE/candidate624,dst=/experiment,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/ab624-evidence,dst=/evidence" \
            --entrypoint python "porota-predeploy-v2:$AB_BASELINE" -B -m pytest -q -p no:cacheprovider \
            --basetemp=/evidence/focal-tmp --junitxml=/evidence/focal.xml \
            tests/test_rc6_progressive_audit.py tests/test_rc6_checkpoint_streaming.py tests/test_rc6_missing_view_sharing.py tests/test_rc6_owned_preopen.py \
            tests/test_rc6_dynamic_orchestrator.py tests/test_rc6_preopen_scalar_storage.py \
            tests/test_rc6_shadow_native_bound.py tests/test_rc6_shadow_runtime_wiring.py \
            tests/test_rc6_shadow_family_runtime.py tests/test_rc6_shadow_shared_audit.py \
            tests/test_rc6_shadow_streaming_cost.py tests/test_rc6_native_soak.py \
            tests/test_rc6_deploy_generation_gate.py tests/test_rc6_deploy_quiescence.py
      - name: Sequential fresh and legacy-bootstrap full-catalog A/B at 512MiB and .75CPU
        shell: bash
        run: |
          set -Eeuo pipefail
          for mode in fresh legacy; do
            for arm in baseline candidate; do
              source_dir="$GITHUB_WORKSPACE/${arm}624"
              if [ "$arm" = baseline ]; then source_sha="$AB_BASELINE"; else source_sha="$AB_CANDIDATE"; fi
              prefix=""
              legacy_args=()
              if [ "$mode" = legacy ]; then prefix="legacy-"; legacy_args=(--legacy); fi
              name="rc6-ab624-${prefix}$arm-$GITHUB_RUN_ID"
              docker create --name "$name" --pull never --memory 512m --memory-swap 512m --cpus .75 \
                --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
                --tmpfs /tmp:rw,nosuid,nodev,size=64m --workdir /experiment -e PYTHONHASHSEED=0 \
                --mount "type=bind,src=$source_dir,dst=/experiment,readonly" \
                --mount "type=bind,src=$source_dir/ab624-source-manifest.json,dst=/probe/source-manifest.json,readonly" \
                --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/rc6_checkpoint624_ab.py,dst=/probe/ab.py,readonly" \
                --mount "type=bind,src=$RUNNER_TEMP/ab624-evidence,dst=/evidence" \
                --entrypoint python "porota-predeploy-v2:$AB_BASELINE" -B /probe/ab.py measure \
                --arm "$arm" --source "$source_sha" "${legacy_args[@]}"
              set +e
              timeout 480 docker start -a "$name" > "$RUNNER_TEMP/ab624-evidence/${prefix}$arm.log" 2>&1
              rc=$?
              set -e
              docker inspect "$name" > "$RUNNER_TEMP/ab624-evidence/${prefix}$arm-container.json"
              test "$rc" -eq 0
              docker rm "$name" >/dev/null
            done
          done
          python3 scripts/rc6_checkpoint624_ab.py compare --directory "$RUNNER_TEMP/ab624-evidence"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ab624-evidence'
          values=[json.loads((root/(prefix+arm+'-container.json')).read_text())[0] for prefix in ('','legacy-') for arm in ('baseline','candidate')]
          assert len({v['Image'] for v in values})==1
          for v in values:
              h=v['HostConfig'];s=v['State']
              assert h['Memory']==h['MemorySwap']==512*1024**2 and h['NanoCpus']==750000000
              assert h['NetworkMode']=='none' and h['ReadonlyRootfs'] is True and v['Config']['User']=='1000:1000'
              assert s['ExitCode']==0 and s['OOMKilled'] is False
          print('AB624_SANDBOX_AND_OOM_CONTROLS=GREEN')
          PY
      - name: Reclaim only runner experiment output after sandboxes
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ab624-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-progressive624-controlled-ab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ab624-evidence/*.json
            ${{ runner.temp }}/ab624-evidence/*.xml
            ${{ runner.temp }}/ab624-evidence/*.log
            ${{ runner.temp }}/ab624-evidence/baseline/receipt.json
            ${{ runner.temp }}/ab624-evidence/candidate/receipt.json
            ${{ runner.temp }}/ab624-evidence/legacy-baseline/receipt.json
            ${{ runner.temp }}/ab624-evidence/legacy-candidate/receipt.json
            ${{ runner.temp }}/ab624-validated/byte-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove experiment containers on failure
        if: always()
        run: docker rm -f "rc6-ab624-baseline-$GITHUB_RUN_ID" "rc6-ab624-candidate-$GITHUB_RUN_ID" "rc6-ab624-legacy-baseline-$GITHUB_RUN_ID" "rc6-ab624-legacy-candidate-$GITHUB_RUN_ID" >/dev/null 2>&1 || true

  watch:
    needs: contracts
    if: false # bounded native202e RCA39096006422 captured; no repeated host observation
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded native RCA probes
        run: python3 -B -m py_compile scripts/rc6_native624_profile.py scripts/rc6_native624_image_mapping.py
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_market_watch"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_market_watch" "$HOME/.ssh/known_hosts"
      - name: Capture bounded RCA after native202e RAM reserve rejection READ_ONLY
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/native624
          timeout 240 ssh -i "$HOME/.ssh/rc6_market_watch" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            "$DO_USER@$DO_HOST" "sudo -n timeout 220 python3 -B - --sha 202e49c750ab0a69b5ba6790fcb14cc0c0d9039f --tree f3ddca733e40649c4e2605f69d5b7ec59dd839e8" \
            < scripts/rc6_native624_profile.py > evidence/native624/profile.json
          python3 -m json.tool evidence/native624/profile.json >/dev/null
          cat evidence/native624/profile.json
      - name: Verify loaded image content against frozen archive
        run: python3 -B scripts/rc6_native624_image_mapping.py --profile evidence/native624/profile.json --output evidence/native624/image-mapping.json --artifact-id 12123121595 --zip-bytes 414812982 --zip-sha256 511a06390863d6a987958e057d696a301614ba539d9d006f2fe729941e1208f7 --expected-image-id sha256:c3229770ff31728df35e9c6a803b7e59894461786b3a0f1299687bec16052596
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-native624-202e-ram-rca-${{ github.run_id }}
          path: evidence/native624
          if-no-files-found: error
          retention-days: 14
      - name: Remove credential
        if: always()
        run: rm -f "$HOME/.ssh/rc6_market_watch"

