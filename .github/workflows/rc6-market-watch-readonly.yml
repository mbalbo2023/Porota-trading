name: RC6 contratos exactos READ_ONLY
run-name: RC6 cambios materiales y verificación CAFCI READ_ONLY
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Leer cambios contractuales y validar el parser CAFCI
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' && inputs.operation == 'read_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:c2752f066fdde7028efca5e36e2ed32433e3f87cd5ca29783d0f56baa8b3b541 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json
          import re
          import sqlite3
          import time
          
          from cg_paper_workspace import database_path
          from cp_contract_evidence_v2_hf6 import material_evidence, pending_material_changes
          
          
          def safe_value(value):
              if value is None or type(value) in (bool,int,float):
                  return value
              if isinstance(value,str) and re.fullmatch(r"[A-Za-z0-9:_() .\-+]{1,170}", value):
                  return value
              return "REDACTED"
          
          
          with closing(sqlite3.connect(database_path().as_uri()+"?mode=ro", uri=True, timeout=.4)) as conn:
              conn.execute("PRAGMA query_only=ON")
              conn.execute("BEGIN")
              if conn.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone() != ("PRODUCTION_PAPER", 0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              deadline=time.monotonic()+4
              conn.set_progress_handler(lambda: time.monotonic()>=deadline,1000)
              pending=pending_material_changes(conn)
              reviews=conn.execute("SELECT 1 FROM sqlite_schema WHERE type='table' AND name='contract_evidence_v2_reviews'").fetchone()
              review_rows = "SELECT change_id FROM contract_evidence_v2_reviews" if reviews else "SELECT NULL AS change_id WHERE 0"
              rows=conn.execute(f"""WITH reviews AS ({review_rows})
                SELECT ch.change_id,ch.family,ch.ticker,ch.market,ch.currency,ch.settlement,
                   ch.detected_at,ch.previous_hash,ch.current_hash,prev.evidence_json,cur.evidence_json,
                   prev.source_ref,cur.source_ref,rev.change_id,latest.evidence_hash
                FROM contract_evidence_v2_changes ch
                LEFT JOIN contract_evidence_v2_snapshots prev
                  ON prev.family=ch.family AND prev.ticker=ch.ticker AND prev.market=ch.market
                   AND prev.currency=ch.currency AND prev.settlement=ch.settlement
                   AND prev.source_class=ch.source_class AND prev.evidence_hash=ch.previous_hash
                LEFT JOIN contract_evidence_v2_snapshots cur
                  ON cur.family=ch.family AND cur.ticker=ch.ticker AND cur.market=ch.market
                   AND cur.currency=ch.currency AND cur.settlement=ch.settlement
                   AND cur.source_class=ch.source_class AND cur.evidence_hash=ch.current_hash
                LEFT JOIN contract_evidence_v2_current latest
                  ON latest.family=ch.family AND latest.ticker=ch.ticker AND latest.market=ch.market
                   AND latest.currency=ch.currency AND latest.settlement=ch.settlement
                   AND latest.source_class=ch.source_class
                LEFT JOIN reviews rev ON rev.change_id=ch.change_id
                WHERE ch.status='CHANGED_REVIEW_REQUIRED' AND ch.source_class='DERIVED_OFFICIAL_RULE'
                  AND ((ch.family='CAUCIONES' AND ch.currency='ARS') OR
                       (ch.family='FUTUROS' AND ch.ticker IN ('DLR/NOV26','DLR/DIC26')))
                ORDER BY ch.change_id LIMIT 40""").fetchall()
              changes=[]
              for cid,f,k,m,c,s,t,older,newer,before,after,p_ref,c_ref,rev,latest in rows:
                  p=material_evidence(json.loads(before)) if before else {}
                  n=material_evidence(json.loads(after)) if after else {}
                  changes.append({"change_id":cid,"identity":[f,k,m,c,s],"detected_at":t,
                    "pending":(f,k,m,c,s) in pending,"exact_review_present":rev is not None,
                    "old_hash":older,"new_hash":newer,"latest_hash_matches":newer==latest,
                    "static_sources_match":p_ref==c_ref,
                    "delta":{key:[safe_value(p.get(key)),safe_value(n.get(key))] for key in sorted(p.keys()|n.keys())
                        if p.get(key)!=n.get(key) and re.fullmatch(r"[a-z_]{1,60}",key)}})
              print("RC6_FAMILY_CHANGE="+json.dumps({"at":datetime.now(timezone.utc).isoformat(),
                  "changes":changes},separators=(",",":"),ensure_ascii=True))
          PY
          HOST

  referencias:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' && inputs.operation == 'read_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d004109f162b44919fb7d97735344ecedffa811f
          persist-credentials: false
      - name: Verify public CAFCI and A3 responses without credentials
        shell: bash
        run: |
          python3 -B - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          
          from rc6_cafci_fci_reference import MAX_COMPRESSED_BYTES, SOURCE_URL, parse_cafci_daily_reference
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def fetch(url, limit):
              with build_opener(NoRedirect()).open(Request(url, headers={
                      "User-Agent": "Porota-RC6-Paper-Source-Audit/1.0"}), timeout=9) as response:
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise ValueError("SOURCE_RESPONSE_TOO_LARGE")
                  return response.headers, body, datetime.now(timezone.utc)
          
          
          def failure(error):
              if isinstance(error, HTTPError):
                  return {"status": "HTTP_ERROR", "http": error.code,
                          "redirect_host": urlsplit(error.headers.get("Location","")).hostname}
              if isinstance(error, URLError):
                  return {"status": "TRANSPORT_ERROR", "class": type(error.reason).__name__}
              code = str(error)
              return {"status": "REJECTED", "code": code if re.fullmatch(
                  r"[A-Z][A-Z0-9_]{1,80}", code) else type(error).__name__}
          
          
          result = {"at": datetime.now(timezone.utc).isoformat(), "ppi_calls": 0, "execution": False}
          try:
              headers, body, now = fetch(SOURCE_URL, MAX_COMPRESSED_BYTES)
              filename = headers.get_filename()
              result["cafci_http"] = {"filename": filename if re.fullmatch(
                  r"20[0-9]{6}_Planilla_Diaria_A\.xlsx", filename or "") else None,
                  "last_modified": headers.get("Last-Modified"), "size": len(body)}
              report = parse_cafci_daily_reference(body, captured_at=now,
                  http_last_modified_at=headers.get("Last-Modified"),
                  expected_sha256=sha256(body).hexdigest(), source_filename=filename)
              result["cafci"] = {"report": report.report_date.isoformat(),
                  "digest": report.source_sha256, "classes": len(report.classes),
                  "summary": report.summary,
                  "invalid_fee_classes": [row.cafci_class_id for row in report.classes if
                      any(hold.endswith("FEE_PERCENT_OUT_OF_RANGE") for hold in row.quality_holds)][:25],
                  "focal": [{"class_id": row.cafci_class_id, "cnv": row.cnv_fund_id,
                             "effective": row.nav_effective_date.isoformat() if row.nav_effective_date else None,
                             "fee_reference_only": True, "has_nav": row.nav_per_unit is not None,
                             "quality_holds": row.quality_holds} for row in report.classes
                             if row.cafci_class_id in (1114,1115)]}
          except (OSError, ValueError, TypeError) as error:
              result["cafci"] = failure(error)
          
          result["a3"] = {}
          for label, scope in (("product_DLR", {"product":"DLR"}), ("exact_DLR_NOV26", {"symbol":"DLR/NOV26"})):
              url = "https://apicem.matbarofex.com.ar/api/v1/closing-prices?" + urlencode({
                  **scope,"from":"2026-11-24T03:00:00Z","to":"2026-11-26T02:59:59Z","page":1,"pageSize":65})
              try:
                  _, body, at = fetch(url, 100000)
                  payload = json.loads(body)
                  data = payload.get("data") if isinstance(payload,dict) else None
                  if not isinstance(data,list):
                      raise ValueError("A3_DATA_MISSING")
                  records = [{k: row.get(k) for k in
                      ("symbol","dateTime","date","product","market","currency","settlementPrice","closingPrice","closePrice","close","lastPrice","settlement")
                      if k in row and type(row[k]) in (str,int,float)}
                      for row in data if type(row) is dict
                      and row.get("symbol") in ("DLR/NOV26","DLR/DIC26")]
                  result["a3"][label] = {"at":at.isoformat(),"rows":records,"digest":sha256(body).hexdigest(),
                      "page_count": len(data), "total_entries": payload.get("totalEntries"),
                      "example_symbols": sorted({r.get("symbol") for r in data if isinstance(r,dict)
                          and isinstance(r.get("symbol"),str)})[:15]}
              except (OSError, ValueError, TypeError) as error:
                  result["a3"][label] = failure(error)
          print("RC6_PUBLIC_FAMILY=" + json.dumps(result, separators=(",",":"),ensure_ascii=True))
          PY
