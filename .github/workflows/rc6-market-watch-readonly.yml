name: RC6 contratos exactos READ_ONLY
run-name: RC6 RCA exacto de Letras ON Opciones Futuros y FCI sin tráfico a PPI
on:
  push:
    branches: [audit/rc6-caucion-hold-readonly-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Verificar la serie exacta A3 y el cambio histórico
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' &&
      (github.event_name == 'push' || inputs.operation == 'read_only')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:b2e7dcd7668c41f16659886fd38ce1333ce6cb4688cacd63eedbc81825537067 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json
          import re
          import sqlite3
          import time
          
          from bu_instrument_catalog import ppi_full_key_evidence_reason
          from cg_paper_workspace import database_path
          from rc6_fund_source_quarantine import SETTLEMENT_AUTHORITY_FILE, _settlement_authority_pins
          from rc6_ppi_native_request_receipt import FIELD
          from scripts.rc6_operator_paper_rearm import OPERATOR_DIR_RUNTIME, _root_owned_receipt
          
          identities = (
              ("D30N6", "LETRAS", "BYMA", "ARS", "A-24HS"),
              ("AFCQC", "OBLIGACIONES", "BYMA", "USD_CCL", "A-24HS"),
              ("ALUC1000DI", "OPCIONES", "BYMA", "ARS", "INMEDIATA"),
              ("DLR/NOV26", "FUTUROS", "A3", "ARS", "INMEDIATA"),
              ("DLR/DIC26", "FUTUROS", "A3", "ARS", "INMEDIATA"),
              ("BZ.AHORRO.A", "FCI", "BYMA", "ARS", "INMEDIATA"),
              ("BZ.AHORRO.B", "FCI", "BYMA", "ARS", "INMEDIATA"),
          )
          
          
          def reason_detail(value):
              if isinstance(value, str) and re.fullmatch(r"[A-Z0-9_:;=]{1,500}", value):
                  return value
              return "DETAIL_OUTSIDE_SAFE_FORMAT"
          
          
          path = database_path()
          at = datetime.now(timezone.utc).isoformat()
          result = {"at": at, "samples": {}}
          with closing(sqlite3.connect(path.as_uri()+"?mode=ro", uri=True, timeout=.4)) as db:
              db.execute("PRAGMA query_only=ON")
              db.execute("BEGIN")
              deadline = time.monotonic()+4.0
              db.set_progress_handler(lambda: time.monotonic()>=deadline,1000)
              state=db.execute("SELECT mode,real_orders_sent,session_state,ppi_auth FROM observer_state WHERE id=1").fetchone()
              if state is None or state[:2]!=("PRODUCTION_PAPER",0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              result["mode"],result["real_orders_sent"],result["phase"],result["ppi_auth"]=state
              schema = {row[0] for row in db.execute("SELECT name FROM sqlite_schema WHERE type='table'")}
              if "candidate_refresh_state" in schema:
                  result["refresh"]=db.execute("SELECT state,checked_at FROM candidate_refresh_state WHERE id=1").fetchone()
              for key in identities:
                  row=db.execute("""SELECT settlement_source,last_seen_at,status,capability,metadata_json
                       FROM financial_instrument_catalog WHERE ticker=? AND instrument_type=? AND market=?
                       AND currency=? AND settlement=?""",key).fetchone()
                  if row is None:
                      result["samples"][key[0]]={"key":key,"state":"CATALOG_EXACT_KEY_MISSING"}
                      continue
                  source,last_seen,status,capability,raw=row
                  data=json.loads(raw)
                  values=dict(zip(("ticker","instrument_type","market","currency","settlement"),key))
                  values.update(settlement_source=source,raw=data)
                  gate=db.execute("""SELECT can_simulate,status,detail,checked_at FROM candidate_identity_v2
                                      WHERE ticker=? AND instrument_type=? AND market=? AND currency=? AND settlement=?""",key).fetchone()
                  retry=[]
                  if "complementary_contract_retry" in schema:
                      retry = [[reason_detail(src),reason_detail(st),reason_detail(why)]
                               for src,st,why in db.execute("""SELECT source,state,reason FROM complementary_contract_retry
                                  WHERE ticker=? AND instrument_type=? AND market=? AND currency=? AND settlement=?
                                  ORDER BY source LIMIT 8""",key)]
                  result["samples"][key[0]]={
                      "key":key,"catalog_status":reason_detail(status),"capability":reason_detail(capability),
                      "settlement_source":reason_detail(source),"last_seen_at":last_seen,
                      "literal_settlement_present":bool(data.get("settlement")),
                      "native_pair_present":bool(data.get(FIELD)),
                      "full_key_reason_now":ppi_full_key_evidence_reason(values,database=path,now=at) or "ACCEPTED",
                      "candidate":[gate[0],reason_detail(gate[1]),reason_detail(gate[2]),gate[3]] if gate else None,
                      "retry":retry,
                      "financial_terms_present":isinstance(data.get("financial_contract_v17"),dict),
                      "paper_family_terms_present":isinstance(data.get("paper_family_contract_v1"),dict),
                      "conflicts_present":bool(data.get("_contract_conflicts")),
                      "isin_present":bool(data.get("isin")),
                      "class_literal_present":any(data.get(n) for n in ("fundClassId","cafciClassId","cafci_class_id")),
                  }
          try:
              _root_owned_receipt(OPERATOR_DIR_RUNTIME,receipt_name=SETTLEMENT_AUTHORITY_FILE)
              _settlement_authority_pins()
          except FileNotFoundError:
              result["fci_authority"]="ABSENT"
          except PermissionError:
              result["fci_authority"]="UNREADABLE"
          except (OSError,ValueError) as error:
              result["fci_authority"]=reason_detail(str(error))
          else:
              result["fci_authority"]="VALID"
          
          print("RC6_EXACT_BLOCKERS="+json.dumps(result,ensure_ascii=True,separators=(",",":")))
          PY
          HOST
