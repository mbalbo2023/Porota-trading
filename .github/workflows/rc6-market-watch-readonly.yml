name: RC6 evidencia de ruedas por familia READ_ONLY
run-name: RC6 cauciones FCI futuros READ_ONLY
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Leer el estado PAPER de cauciones FCI y futuros
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  familias:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' && inputs.operation == 'read_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read PAPER family receipts in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 20 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:c2752f066fdde7028efca5e36e2ed32433e3f87cd5ca29783d0f56baa8b3b541 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json
          import re
          import sqlite3
          import time
          
          from cg_paper_workspace import database_path
          
          
          def token(value):
              return value if isinstance(value, str) and re.fullmatch(
                  r"[A-Z0-9][A-Z0-9_ /.:+\-]{0,63}", value, re.I) else None
          
          
          def stamp(value):
              try:
                  point = datetime.fromisoformat(value)
                  return point.astimezone(timezone.utc).isoformat() if point.tzinfo else None
              except (ValueError, TypeError):
                  return None
          
          
          start = "2026-11-25T19:25:00+00:00"
          cutoff = "2026-11-25T19:55:00+00:00"
          day_start = "2026-11-25T03:00:00+00:00"
          day_end = "2026-11-26T03:00:00+00:00"
          with closing(sqlite3.connect(database_path().as_uri() + "?mode=ro",
                                       uri=True, timeout=0.4)) as conn:
              conn.execute("PRAGMA query_only=ON")
              mode, orders, session, auth = conn.execute("""SELECT mode,real_orders_sent,
                  session_state,ppi_auth FROM observer_state WHERE id=1""").fetchone()
              if (mode, orders) != ("PRODUCTION_PAPER", 0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              conn.execute("BEGIN")
              tables = {row[0] for row in conn.execute("SELECT name FROM sqlite_schema WHERE type='table'")}
          
              def query(table, sql, params=()):
                  if table not in tables:
                      return {"table_absent": table}
                  deadline = time.monotonic() + 1.3
                  conn.set_progress_handler(lambda: time.monotonic() >= deadline, 1000)
                  try:
                      return conn.execute(sql, params).fetchall()
                  except sqlite3.Error as e:
                      return {"sql_error": token(getattr(e, "sqlite_errorname", ""))}
                  finally:
                      conn.set_progress_handler(None, 0)
          
              def rows(result, convert):
                  return [convert(*row) for row in result] if isinstance(result, list) else result
          
              release = {"at": datetime.now(timezone.utc).isoformat(), "mode": mode,
                         "orders": orders, "session": token(session), "auth": token(auth)}
              declared = query("financial_instrument_catalog", """SELECT
                  instrument_type,capability,settlement_source,count(*)
                  FROM financial_instrument_catalog WHERE instrument_type IN
                  ('CAUCIONES','FCI','FUTUROS') AND status='AVAILABLE'
                  GROUP BY instrument_type,capability,settlement_source ORDER BY 1,2,3 LIMIT 60""")
              catalog = rows(declared, lambda f,c,s,n: [token(f),token(c),token(s),n])
              status = query("candidate_identity_v2", """SELECT instrument_type,status,count(*),
                  max(checked_at) FROM candidate_identity_v2 WHERE instrument_type IN
                    ('CAUCIONES','FCI','FUTUROS') GROUP BY 1,2 ORDER BY 1,2 LIMIT 45""")
              projection = rows(status, lambda f,s,n,t: [token(f),token(s),n,stamp(t)])
              cfi = query("catalog_family_coverage", """SELECT instrument_type,declared,queries,
                  observed_count,ready_paper_count,discovery_status,checked_at FROM catalog_family_coverage
                  WHERE instrument_type IN ('CAUCIONES','FCI','FUTUROS') ORDER BY 1""")
              coverage = rows(cfi, lambda f,d,q,o,r,s,t: [token(f),d,q,o,r,token(s),stamp(t)])
              agents = query("source_sync", """SELECT source,status,last_attempt_at,last_success_at,items
                  FROM source_sync WHERE source IN ('FINANCIAL_INSTRUMENT_CATALOG','PPI_PUBLIC')
                  OR upper(source) LIKE '%CAFCI%' OR upper(source) LIKE '%FCI%'
                  OR upper(source) LIKE '%FUTUR%' OR upper(source) LIKE '%A3%'
                  ORDER BY source LIMIT 25""")
              sources = rows(agents, lambda s,c,a,b,n: [token(s),token(c),stamp(a),stamp(b),n])
              swp = query("paper_caucion_cash_sweep_attempts", """SELECT
                  status,code,min(evaluated_at),count(*) FROM paper_caucion_cash_sweep_attempts
                  WHERE request_id='paper-caucion-cash-sweep:2026-11-25:ARS:v1' GROUP BY 1,2 LIMIT 20""")
              sweep = rows(swp, lambda s,c,t,n: [token(s),token(c),stamp(t),n])
              hist = query("paper_caucion_live_book_history", """SELECT
                  ticker,market,currency,settlement,state,count(*),min(observed_at),max(observed_at),max(quoted_at)
                  FROM paper_caucion_live_book_history
                  WHERE julianday(observed_at) BETWEEN julianday(?) AND julianday(?)
                  GROUP BY 1,2,3,4,5 ORDER BY 1,2,3,4,5 LIMIT 120""", (start, cutoff))
              history = rows(hist, lambda a,b,c,d,s,n,f,l,q:
                             [token(a),token(b),token(c),token(d),token(s),n,stamp(f),stamp(l),stamp(q)])
              hist_all = query("paper_caucion_live_book_history", """SELECT count(*),min(observed_at),
                  max(observed_at) FROM paper_caucion_live_book_history""")
              hist_custody = rows(hist_all, lambda n,f,l: [n,stamp(f),stamp(l)])
              raw_ev = query("paper_events", """SELECT event_at,event_type,detail FROM paper_events
                  WHERE event_type IN ('CAUCION_LIVE_BOOK_REFRESH','CAUCION_LIVE_BOOK_REFRESH_ERROR')
                    AND julianday(event_at) >= julianday(?) AND julianday(event_at) <= julianday(?)
                  ORDER BY id LIMIT 55""", (day_start, day_end))
              events = []
              if isinstance(raw_ev, dict):
                  events = raw_ev
              else:
                  for at, event, detail in raw_ev:
                      if event.endswith("_ERROR"):
                          events.append([stamp(at), token(event), token(detail)])
                          continue
                      try:
                          data = json.loads(detail)
                          events.append([stamp(at),token(data.get("state")),data.get("records"),
                                         data.get("ready"),{token(k):token(v) for k,v in
                                         data.get("states",{}).items() if token(k) and token(v)}])
                      except (TypeError, ValueError, AttributeError):
                          events.append([stamp(at), "REFRESH_DETAIL_INVALID"])
              funds = query("financial_instrument_catalog", """SELECT ticker,market,currency,settlement,
                  capability,settlement_source,last_seen_at FROM financial_instrument_catalog
                  WHERE instrument_type='FCI' AND status='AVAILABLE'
                  ORDER BY CASE WHEN ticker LIKE '%AHORRO%' THEN 0 ELSE 1 END,
                  ticker,market,currency,settlement LIMIT 8""")
              fund_sample = rows(funds, lambda a,b,c,d,e,f,t: [*(token(x) for x in (a,b,c,d,e,f)),stamp(t)])
              dlr = query("financial_instrument_catalog", """SELECT ticker,market,currency,settlement,
                  capability,settlement_source,last_seen_at FROM financial_instrument_catalog
                  WHERE instrument_type='FUTUROS' AND ticker IN ('DLR/NOV26','DLR/DIC26','DLR/DEC26')
                  ORDER BY 1,2,3,4 LIMIT 14""")
              dlr_sample = rows(dlr, lambda a,b,c,d,e,f,t: [*(token(x) for x in (a,b,c,d,e,f)),stamp(t)])
              snapshots = query("market_snapshots", """SELECT asset_class,symbol,settlement,source,
                  count(*),max(observed_at) FROM market_snapshots WHERE symbol IN
                    ('DLR/NOV26','DLR/DIC26','DLR/DEC26')
                  AND asset_class='FUTUROS' GROUP BY 1,2,3,4 ORDER BY 1,2,3,4 LIMIT 30""")
              marks = rows(snapshots, lambda f,s,p,o,n,t: [token(f),token(s),token(p),token(o),n,stamp(t)])
              pl = query("paper_family_lifecycle", """SELECT family,state,count(*),max(updated_at)
                  FROM paper_family_lifecycle WHERE family IN ('FCI','FUTUROS')
                  GROUP BY 1,2 ORDER BY 1,2 LIMIT 40""")
              ledger = rows(pl, lambda f,s,n,t: [token(f),token(s),n,stamp(t)])
              print("RC6_FAMILY_PROBE=" + json.dumps({**release, "catalog":catalog,"coverage":coverage,
                  "projection":projection,"sources":sources,"sweep":sweep,"caucion_history":history,
                  "caucion_history_custody":hist_custody,"refresh":events,"fund_sample":fund_sample,
                  "dlr_sample":dlr_sample,"futures_snapshots":marks,"ledger":ledger},
                  separators=(",",":"), ensure_ascii=True))
          PY
          HOST
