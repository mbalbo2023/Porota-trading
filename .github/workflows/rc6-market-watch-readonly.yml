name: RC6 Market Watch READ_ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-market-watch-readonly.yml'
      - 'scripts/rc6_market_watch_readonly.py'
      - 'tests/test_rc6_market_watch_readonly.py'
      - 'scripts/rc6_operator_dashboard_readonly.py'
      - 'tests/test_rc6_operator_dashboard_readonly.py'
      - 'docs/ops/RC6_MARKET_WATCH_READONLY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc6-market-watch-readonly.yml'
      - 'scripts/rc6_market_watch_readonly.py'
      - 'tests/test_rc6_market_watch_readonly.py'
      - 'scripts/rc6_operator_dashboard_readonly.py'
      - 'tests/test_rc6_operator_dashboard_readonly.py'
      - 'docs/ops/RC6_MARKET_WATCH_READONLY.md'
  schedule:
    # Argentina UTC-3; the job's local-time gate restricts monitoring to rueda.
    - cron: '7,17,27,37,47,57 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      notification_mode:
        description: 'normal delivers transitions; read_only records evidence without sending or creating delivery state'
        type: choice
        options: [normal, read_only]
        default: normal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-market-watch-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test isolated monitor without network
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_market_watch_readonly.py tests/test_rc6_market_watch_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_market_watch_readonly.py -v
          python3 -m py_compile scripts/rc6_operator_dashboard_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_operator_dashboard_readonly.py -v
          git diff --check

      - name: Read pinned READ_ONLY diagnostic receipts without host access
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, io, json, math, re, urllib.request, zipfile, os
          artifacts = [
           (12091516859, "4a71ce4f28bfcbc5b91d421bbe4af52027c0f10b0891a41a02d00b219169a5b4"),
           (12091867055, "b749d35f4dfead62dcfc129237ba2398c9172abe1c2dfb3a57a251c02e37085f"),
          ]
          numeric = {"age_seconds","liveness_budget_seconds","native_sql_elapsed_ms","native_transform_elapsed_ms",
           "elapsed_ms","remaining_ms","rows","shadow_age_seconds","rss_kib","cpu_seconds","shadow_worker_process_count",
           "wal_bytes","sequence","selected_count","duration_seconds","planned_cadence_seconds","query_budget_ms",
           "provider_requests","real_orders_sent","error_line"}
          booleans = {"read_only","live_status_required","native_sql_within_budget","deadline_elapsed",
           "interrupted_by_deadline","deadline_expired","runtime_deadline_expired"}
          patterns = {
           "generation_id":r"[0-9a-f]{64}", "manifest_sha256":r"[0-9a-f]{64}",
           "configuration_fingerprint":r"[0-9a-f]{64}",
           "source_sha":r"[0-9a-f]{40}", "candidate_tree_sha":r"[0-9a-f]{40}",
           "as_of":r"20[0-9:T.+Z-]{17,40}", "generated_at":r"20[0-9:T.+Z-]{17,40}",
           "captured_at":r"20[0-9:T.+Z-]{17,40}", "started_at":r"20[0-9:T.+Z-]{17,40}",
           "finished_at":r"20[0-9:T.+Z-]{17,40}",
           "error_class":r"(?:ValueError|KeyError|TypeError|OSError|OperationalError|EvidencePayloadLimit)",
           "sqlite_errorname":r"SQLITE_[A-Z0-9_]{1,40}",
           "state":r"(?:R|S|D|T|Z|I|UNKNOWN)", "wchan":r"[A-Za-z0-9_]{1,64}",
           "status":r"(?:SHADOW_OBSERVING|FAIL_CLOSED|PREOPEN_SNAPSHOT_REQUIRED_DURING_SESSION|OK|FAIL_CLOSED|SKIP_BUDGET|CONTAINER_PROBE_TIMEOUT|CONTAINER_PROBE_FAILED|UNAVAILABLE|NOT_RUN_STAGE_ONLY)",
           "integrity":r"(?:UNVERIFIED|VERIFIED)", "worker_status":r"(?:SHADOW_OBSERVING|PREOPEN_SNAPSHOT_REQUIRED_DURING_SESSION)",
           "stage":r"(?:CATALOG_FULL|CATALOG_READY|OPEN_POSITIONS|SCHEMA_TABLES|INTRADAY_CONTRACTS|INTRADAY_POINTS|MARKET_SNAPSHOTS|RUNTIME_INPUT|CONTRACTS|INTRADAY|SNAPSHOTS|EVENTS)",
           "error_module":r"(?:runtime|worker|preopen|promotion|stages|families|lab|entry_signals|funnel|source_reads|read_contract|persistence|snapshot|common|live)",
           "runtime_read_stage":r"(?:CATALOG_FULL|OPEN_POSITIONS|SCHEMA_TABLES|INTRADAY_CONTRACTS|INTRADAY_POINTS|MARKET_SNAPSHOTS)",
           "real_routes":r"NOT_CALLED"
          }
          containers = {"shadow","committed_generation","native_sql_stages","runtime_sql_stages","query_stages",
           "shadow_worker_processes","observer_cycles","stages"}
          def clean(value, depth=0):
           if depth>6:return None
           if isinstance(value,list):return [clean(v,depth+1) for v in value[:20] if isinstance(v,dict)]
           if not isinstance(value,dict):return None
           out={}
           for key,v in value.items():
            if key in numeric and type(v) in (int,float) and math.isfinite(v) and 0<=v<=2**53:out[key]=v
            elif key in booleans and type(v) is bool:out[key]=v
            elif key in patterns and type(v) is str and re.fullmatch(patterns[key],v):out[key]=v
            elif key in containers and isinstance(v,(dict,list)):out[key]=clean(v,depth+1)
           return out
          for artifact_id,expected in artifacts:
           request=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip",
            headers={"Accept":"application/vnd.github+json"})
           request.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
           with urllib.request.urlopen(request,timeout=30) as response:
            raw=response.read(2*1024**2+1)
           assert len(raw)<=2*1024**2 and hashlib.sha256(raw).hexdigest()==expected,"ARTIFACT_IDENTITY_INVALID"
           with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            for member in archive.infolist():
             if member.filename not in {"snapshot.json","shadow_diagnostic.json"}:continue
             assert member.file_size<=1024**2,"DIAGNOSTIC_TOO_LARGE"
             data=json.loads(archive.read(member))
             print("RC6_PINNED_ARTIFACT_READBACK="+json.dumps(
              {"artifact_id":artifact_id,"sha256":expected,"member":member.filename,"safe":clean(data)},
              sort_keys=True,separators=(",",":")))
          
          PY

  watch:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate market-hours schedule
        id: window
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          local = datetime.now(timezone.utc).astimezone(ZoneInfo('America/Argentina/Buenos_Aires'))
          minutes = local.hour*60 + local.minute
          active = (os.environ.get('GITHUB_EVENT_NAME') != 'schedule' or
                    (local.weekday() < 5 and 10*60+30 <= minutes < 17*60+15))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('active=' + ('1' if active else '0') + '\n')
          print('MARKET_WATCH_TIME_GATE=' + ('ACTIVE' if active else 'SKIP_OFF_HOURS'))
          PY
      - name: Resolve productive SHA directly from GitHub
        id: productive
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          repo = os.environ['GITHUB_REPOSITORY']
          branch = urllib.parse.quote('deploy/rc6-pr69-isolated-20260915', safe='')
          url = f'https://api.github.com/repos/{repo}/branches/{branch}'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              info = json.load(response)
          sha = info['commit']['sha']
          assert len(sha) == 40 and all(c in '0123456789abcdef' for c in sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('sha=' + sha + '\n')
          print('RC6_PRODUCTIVE_SHA=' + sha)
          PY
      - name: Prepare strict SSH
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_market_watch"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_market_watch" "$HOME/.ssh/known_hosts"
      - name: Collect bounded read-only host truth
        if: steps.window.outputs.active == '1'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.productive.outputs.sha }}
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 20 python3 - probe --expected-sha '$EXPECTED_SHA'" \
            < scripts/rc6_market_watch_readonly.py > evidence/snapshot.json 2> evidence/.transport.stderr
          rc=$?
          set -e
          PROBE_EXIT_CODE="$rc" python3 scripts/rc6_market_watch_readonly.py transport-diagnostic \
            --stderr evidence/.transport.stderr > evidence/transport.json
          rm -f evidence/.transport.stderr
          if [ "$rc" -ne 0 ] || [ ! -s evidence/snapshot.json ]; then
            python3 scripts/rc6_market_watch_readonly.py transport-error > evidence/snapshot.json
            echo "::warning::Remote READ_ONLY probe unavailable. Evidence is fail-closed."
          fi
          python3 -m json.tool evidence/snapshot.json >/dev/null
      - name: Classify recent critical signatures without exporting logs
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 18 python3 - recent-critical-host" \
            < scripts/rc6_market_watch_readonly.py > evidence/recent_critical.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/recent_critical.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.recent-critical-readonly.v1","read_only":true,"status":"UNAVAILABLE"}' > evidence/recent_critical.json
          fi
      - name: Inventory public instrument metadata on manual runs only
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017') && steps.window.outputs.active == '1'
        timeout-minutes: 2
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit-inventory
          set +e
          timeout 40 ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" "sudo -n timeout 10 python3 - instrument-inventory-host" \
            < scripts/rc6_market_watch_readonly.py > audit-inventory/instruments.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool audit-inventory/instruments.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.instrument-audit-inventory.v1","status":"UNVERIFIED","read_only":true,"complete_inventory":false}' > audit-inventory/instruments.json
          fi
      - name: Preserve separate manual instrument inventory
        if: always() && (github.event_name == 'workflow_dispatch' || github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017') && steps.window.outputs.active == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rc6-instrument-inventory-${{ github.run_id }}
          path: audit-inventory/instruments.json
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose SHADOW SQLite stages on manual runs only
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017') && steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 12 python3 - shadow-diagnostic-host" \
            < scripts/rc6_market_watch_readonly.py > evidence/shadow_diagnostic.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/shadow_diagnostic.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.shadow-readonly-diagnostic.v1","status":"REMOTE_DIAGNOSTIC_UNAVAILABLE","read_only":true}' > evidence/shadow_diagnostic.json
          fi
          python3 - <<'PY'
          import json, math, re
          d=json.load(open("evidence/shadow_diagnostic.json"))
          g=d.get("committed_generation",{})
          keep={}
          for k in ("schema","integrity","error_class","error_reason","worker_status","source_sha","candidate_tree_sha","as_of"):
              v=g.get(k)
              if type(v) is str and re.fullmatch(r"[A-Za-z0-9_.:+-]{1,100}",v): keep[k]=v
          for k in ("age_seconds","liveness_budget_seconds","generation_tick_seconds","native_sql_elapsed_ms","native_transform_elapsed_ms","computed_report_raw_bytes","computed_report_compressed_bytes"):
              v=g.get(k)
              limit=512*1024**2 if k.startswith("computed_report_") else 1000000
              if type(v) in (int,float) and math.isfinite(v) and 0<=v<=limit: keep[k]=v
          print("RC6_GENERATION_DIAGNOSTIC="+json.dumps(keep,sort_keys=True,separators=(",",":")))
          print("RC6_NATIVE_STATUS_DIAGNOSTIC="+json.dumps(d.get("native_status_metadata",{}),sort_keys=True,separators=(",",":")))
          print("RC6_SHADOW_PROCESS_DIAGNOSTIC="+json.dumps(d.get("shadow_worker_processes",[]),sort_keys=True,separators=(",",":")))
          PY
      - name: Probe public GitHub schedule API from observer on manual runs only
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017') && steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 10 python3 - schedule-api-host" \
            < scripts/rc6_market_watch_readonly.py > evidence/schedule_api.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/schedule_api.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.market-schedule-api.v1","status":"REMOTE_PROBE_UNAVAILABLE","read_only":true}' > evidence/schedule_api.json
          fi
      - name: Sample observer Docker lifecycle metadata on manual runs only
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017') && steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 9 python3 - observer-lifecycle-host" \
            < scripts/rc6_market_watch_readonly.py > evidence/observer_lifecycle.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/observer_lifecycle.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.observer-lifecycle.v1","status":"REMOTE_PROBE_UNAVAILABLE","read_only":true,"events":[]}' > evidence/observer_lifecycle.json
          fi
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 22 python3 - porota-image-inventory-host" \
            < scripts/rc6_market_watch_readonly.py > evidence/porota_images.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/porota_images.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.porota-image-inventory.v1","status":"REMOTE_PROBE_UNAVAILABLE","read_only":true}' > evidence/porota_images.json
          fi
      - name: Audit authenticated dashboard routes and connector states without exporting content
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' || github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017')) && steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_market_watch" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 160 python3 - dashboard-host" \
            < scripts/rc6_operator_dashboard_readonly.py > evidence/dashboard_audit.json 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/dashboard_audit.json >/dev/null 2>&1; then
            printf '%s\n' '{"schema":"rc6.operator-dashboard-readonly.v1","read_only":true,"status":"NO_VERIFICADO","routes":[],"sources":[],"source_status":"NO_VERIFICADO"}' > evidence/dashboard_audit.json
          fi
          python3 - <<'PY'
          import json
          result=json.load(open('evidence/dashboard_audit.json',encoding='utf-8'))
          print('RC6_DASHBOARD_AUDIT_SCOPE='+str(result.get('audit_scope','NO_VERIFICADO')))
          print('RC6_DASHBOARD_AUDIT_STATUS='+str(result.get('status','NO_VERIFICADO')))
          print('RC6_DASHBOARD_ROUTE_STATUS='+json.dumps([
              {'path':r.get('path'),'http':r.get('http'),'nav':r.get('nav'),
               'content':r.get('content'),'error':r.get('error'),
               'elapsed_ms':r.get('elapsed_ms'),'slow_2s':r.get('slow_2s'),
               'projection_ms':r.get('projection_ms'),'read_queries':r.get('read_queries'),
               'unverified_mentions':r.get('unverified_mentions')}
              for r in result.get('routes',[])],sort_keys=True,separators=(',',':')))
          print('RC6_DASHBOARD_PROFILE_STATUS='+str(result.get('profile_status','NO_VERIFICADO')))
          print('RC6_DASHBOARD_PROFILE='+json.dumps(result.get('profile',[]),
              sort_keys=True,separators=(',',':')))
          print('RC6_DASHBOARD_BALANCE_QUERIES='+json.dumps(result.get('balance_queries',[]),
              sort_keys=True,separators=(',',':')))
          print('RC6_CONNECTOR_STATES='+json.dumps(result.get('sources',[]),
              sort_keys=True,separators=(',',':')))
          PY
      - name: Record genuine schedule cadence independently of observer
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/rc6_market_watch_readonly.py schedule-health --current evidence/snapshot.json --repo "$GITHUB_REPOSITORY"
      - name: Read previous committed monitor artifact (best effort)
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/rc6_market_watch_readonly.py select-previous \
            --current evidence/snapshot.json --repo "$GITHUB_REPOSITORY" \
            --workflow-id 384354765 --run-id "$GITHUB_RUN_ID" \
            --destination evidence/previous
      - name: Compare snapshots and detect transitions
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/rc6_market_watch_readonly.py classify \
            --current evidence/snapshot.json \
            --previous evidence/previous/snapshot.json \
            --previous-decision evidence/previous/decision.json > evidence/decision.json
          python3 - <<'PY'
          import json, os
          snap=json.load(open('evidence/snapshot.json',encoding='utf-8'))
          decision=json.load(open('evidence/decision.json',encoding='utf-8'))
          text=['## POROTA RC6 | Market Watch READ_ONLY',
                '- Product SHA: '+str(snap.get('expected_deploy_sha','NO_VERIFICADO')),
                '- Severity: '+str(snap.get('severity','NO_VERIFICADO')),
                '- Alerts: '+', '.join(decision['new_alerts'] or ['none']),
                '- Recovery: '+', '.join(decision['recovered'] or ['none']),
                '- Pending P1 confirmation: '+', '.join(decision['pending_confirmation'] or ['none']),
                '- Orders actually sent: no claim unless exact DB counter verified.',
                '- Trading mutations: NONE; provider calls: NONE; PPI Watch: NOT ACCESSED.',
                '- Alert delivery uses a separate bounded receipt only when requested.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(text)+'\n')
          print('RC6_MONITOR_STATUS='+decision['status'])
          print('RC6_MONITOR_NOTIFICATION='+decision['notification'])
          PY
      - name: Send transition through existing PAPER Telegram transport
        if: steps.window.outputs.active == '1'
        shell: bash
        env:
          NOTIFICATION_MODE: ${{ github.event_name == 'pull_request' && 'read_only' || inputs.notification_mode || 'normal' }}
        run: |
          set -Eeuo pipefail
          request="$(python3 scripts/rc6_market_watch_readonly.py prepare-alert \
            --decision evidence/decision.json)"
          if [ "$NOTIFICATION_MODE" = 'read_only' ]; then
            printf '%s\n' '{"status":"NOT_REQUESTED","read_only":true}' > evidence/delivery.json
          elif [ -z "$request" ]; then
            printf '%s\n' '{"status":"NO_TRANSITION"}' > evidence/delivery.json
          else
            set +e
            ssh -i "$HOME/.ssh/rc6_market_watch" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              "$DO_USER@$DO_HOST" \
              "sudo -n timeout 25 python3 - alert-host '$request'" \
              < scripts/rc6_market_watch_readonly.py > evidence/delivery.json 2>/dev/null
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || ! python3 -m json.tool evidence/delivery.json >/dev/null 2>&1; then
              printf '%s\n' '{"status":"UNVERIFIED"}' > evidence/delivery.json
            fi
          fi
          python3 scripts/rc6_market_watch_readonly.py finalize-delivery \
            --decision evidence/decision.json --receipt evidence/delivery.json
          python3 - <<'PY'
          import json
          data=json.load(open('evidence/decision.json',encoding='utf-8'))
          print('MARKET_WATCH_TELEGRAM='+data['delivery_status'])
          PY
      - name: Save immutable per-run evidence
        if: always() && steps.window.outputs.active == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rc6-market-watch-${{ github.run_id }}
          path: |
            evidence/snapshot.json
            evidence/transport.json
            evidence/decision.json
            evidence/shadow_diagnostic.json
            evidence/schedule_api.json
            evidence/observer_lifecycle.json
            evidence/porota_images.json
            evidence/recent_critical.json
            evidence/dashboard_audit.json
            evidence/delivery.json
            evidence/previous/source.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail checks on verified critical or confirmed P1
        if: steps.window.outputs.active == '1'
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          data=json.load(open('evidence/decision.json', encoding='utf-8'))
          snap=json.load(open('evidence/snapshot.json', encoding='utf-8'))
          findings=snap.get('findings')
          codes=sorted({code for row in (findings if isinstance(findings,list) else [])
              if isinstance(row,dict) for code in [row.get('code')]
              if type(code) is str and re.fullmatch(r'[A-Za-z0-9_:]{1,100}',code)})
          shadow=snap.get('shadow') if isinstance(snap.get('shadow'),dict) else {}
          context={}
          for key,allowed in {
              'status': {'FAIL_CLOSED','SHADOW_OBSERVING','PREOPEN_SNAPSHOT_REQUIRED_DURING_SESSION'},
              'error_class': {'OperationalError','ValueError','EvidencePayloadLimit'},
              'error_module': {'runtime','worker','preopen','promotion','stages','families',
                               'lab','entry_signals','funnel','source_reads','read_contract',
                               'persistence','snapshot','common','live'},
              'evidence_file': {'latest.json.gz','checkpoint.json.gz','status.json','preopen','other'},
          }.items():
              if type(shadow.get(key)) is str and shadow[key] in allowed:
                  context[key]=shadow[key]
          for key in ('error_line','evidence_measured_bytes','evidence_limit_bytes'):
              value=shadow.get(key)
              if type(value) is int and 0 <= value <= 2*1024**3:
                  context[key]=value
          label=shadow.get('sqlite_errorname')
          if type(label) is str and re.fullmatch(r'SQLITE_[A-Z0-9_]{1,40}',label):
              context['sqlite_errorname']=label
          print('RC6_MONITOR_SAFE_FINDINGS='+','.join(codes))
          print('RC6_MONITOR_SAFE_SHADOW='+json.dumps(context,sort_keys=True,separators=(',',':')))
          ops=snap.get('sqlite_ops') if isinstance(snap.get('sqlite_ops'),dict) else {}
          safe_ops={}
          for key in ('DAILY_BACKUP','HISTORY_BACKUP','SRE_SNAPSHOT','latest_backup','candle_worker'):
              item=ops.get(key)
              if not isinstance(item,dict):
                  continue
              safe={}
              for field in ('last_run_at','created_at','heartbeat_at'):
                  value=item.get(field)
                  if type(value) is str and re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.+-][0-9:]+)?',value):
                      safe[field]=value
              state=item.get('state')
              if type(state) is str and re.fullmatch(r'[A-Za-zÁÉÍÓÚáéíóú_]{1,32}',state):
                  safe['state']=state
              if key=='latest_backup' and item.get('kind') in ('DAILY','HISTORY'):
                  safe['kind']=item['kind']
              for field in ('size_bytes','cursor'):
                  value=item.get(field)
                  if type(value) is int and 0 <= value <= 2**53:
                      safe[field]=value
              safe_ops[key]=safe
          print('RC6_MONITOR_SAFE_SQLITE_OPS='+json.dumps(safe_ops,sort_keys=True,separators=(',',':')))
          try:
              recent=json.load(open('evidence/recent_critical.json', encoding='utf-8'))
          except (OSError,ValueError):
              recent={}
          containers=recent.get('containers') if isinstance(recent,dict) else {}
          containers=containers if isinstance(containers,dict) else {}
          traces=[]
          for name in ('porota_production_observer','porota_production_dashboard'):
              item=containers.get(name)
              rows=item.get('tracebacks') if isinstance(item,dict) else []
              for row in (rows[-12:] if isinstance(rows,list) else []):
                  if not isinstance(row,dict):
                      continue
                  frame=row.get('last_app_frame')
                  frame=frame if isinstance(frame,dict) else {}
                  cls=row.get('exception_class')
                  module=frame.get('module')
                  function=frame.get('function')
                  line=frame.get('line')
                  observed=row.get('observed_utc')
                  hint=row.get('sqlite_hint')
                  if (type(cls) is str and cls in {'sqlite3.OperationalError','ValueError','RuntimeError'}
                          and type(module) is str and re.fullmatch(r'[a-z0-9_]{1,70}\.py',module)
                          and type(function) is str and re.fullmatch(r'[A-Za-z0-9_]{1,80}',function)
                          and type(line) is int and 0 < line <= 1000000
                          and type(observed) is str and re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z',observed)):
                      traces.append({'container':name,'class':cls,'module':module,
                          'function':function,'line':line,'utc':observed,
                          'sqlite_hint':hint if type(hint) is str and hint in {'SQLITE_BUSY_LOCKED','SQLITE_INTERRUPT',
                              'SQLITE_FULL','SQLITE_IOERR','SQLITE_CANTOPEN','SQLITE_UNKNOWN'} else None})
          print('RC6_MONITOR_SAFE_RECENT_CRITICAL='+json.dumps(traces[-12:],sort_keys=True,separators=(',',':')))
          if data['confirmed']:
              print('::error::RC6 Market Watch incident: '+', '.join(data['confirmed']))
              raise SystemExit(2)
          print('RC6_MONITOR_CHECK=GREEN_OR_UNCONFIRMED')
          PY
      - name: Destroy SSH credential
        if: always()
        run: rm -f "$HOME/.ssh/rc6_market_watch"



  profile:
    needs: contracts
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostic/rc6-603-artifact-readback-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile isolated CI-only bounded-sizing research observer
        run: python3 -m py_compile scripts/rc6_native_json_bound_research.py
      - name: Verify previous CI call graph artifact bytes with explicit profiler timer scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,json,os,urllib.request,zipfile
          for artifact,size,expected,run in (
              (12101526598,1862,"02e0e17a273b5d16754e5f51f206f50d9a43d231b6f1107b42c4fda09b03936c",39033636402),
              (12102040345,2941,"dc505e00ca3bacd1655a6cbbfabb0de3a37e8edbf268f6246e5fa2c27eb713a2",39034187927)):
              req=urllib.request.Request(f"https://api.github.com/repos/mbalbo2023/Porota-trading/actions/artifacts/{artifact}/zip")
              req.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              with urllib.request.urlopen(req,timeout=30) as response:raw=response.read(2*1024**2+1)
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==expected
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  values=[x for x in archive.infolist() if x.filename=="serializer-profile.json"]
                  assert len(values)==1 and values[0].file_size<65536
                  content=archive.read(values[0]);data=json.loads(content)
              assert data["native_acceptance"] is False and data["production_data_mounted"] is False
              assert data["profiled_audit"]["cache_replay_inflater_creations"]==2
              print("RC6_PREVIOUS_CALLGRAPH_RECEIPT="+json.dumps({"run":run,"bytes":len(content),"sha256":hashlib.sha256(content).hexdigest(),
                  "base64":base64.b64encode(content).decode()},separators=(",",":")))
          print("RC6_PRIOR_PROFILE_TIMER_ERRATA=DEFAULT_REAL_TIME_NOT_PROCESS_CPU_FOR_PSTATS_ONLY; BENCHMARK_PROCESS_TIME_VALID")
          PY
      - name: Verify and load exact PR618 frozen artifact without rebuilding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,zipfile
          def request(url):
              req=urllib.request.Request(url)
              req.add_unredirected_header("Authorization","Bearer "+os.environ["GH_TOKEN"])
              return urllib.request.urlopen(req,timeout=45)
          base="https://api.github.com/repos/mbalbo2023/Porota-trading/actions/artifacts/12097933526"
          with request(base) as response:metadata=json.load(response)
          assert metadata["workflow_run"]["id"]==39025705021 and metadata["workflow_run"]["head_sha"]=="5cb663231b52aee566dec0b3bf9c5d45684b98f5"
          target=pathlib.Path("/tmp/rc6-exact618.zip");h=hashlib.sha256();total=0
          with request(base+"/zip") as response,target.open("wb") as output:
              while block:=response.read(1024**2):
                  total+=len(block);assert total<=500*1024**2
                  h.update(block);output.write(block)
          assert total==414541894 and h.hexdigest()=="7c6355cb6c156e37d83ff0d2e61a0116f54d75ce7a42dc63d9b43b136c0586b8"
          with zipfile.ZipFile(target) as archive:
              def member(name):
                  values=[x for x in archive.infolist() if pathlib.PurePosixPath(x.filename).name==name];assert len(values)==1
                  return values[0]
              frozen=json.loads(archive.read(member("porota-frozen-candidate.json")))
              assert frozen["candidate_sha"]=="5cb663231b52aee566dec0b3bf9c5d45684b98f5" and frozen["candidate_tree_sha"]=="2f1825afed2417e4d4d7a8f003fecc009708921f"
              assert frozen["image_id"]=="sha256:2f581a5cc45e34dad4974d35398aeef89f3dbc4c9ca7f4c3c172efd1123b62d9"
              image_hash=hashlib.sha256()
              with archive.open(member("porota-predeploy-image.tar.gz")) as source,open("/tmp/rc6-exact618-image.tar.gz","wb") as output:
                  while block:=source.read(1024**2):
                      image_hash.update(block);output.write(block)
              assert image_hash.hexdigest()==frozen["image_tar_sha256"]=="be43e9ee781a157d1b23169827b839280f8ca0a2475f9c9fd2da3ba7ed574f52"
          print("RC6_SERIALIZER_EXACT_FROZEN_BYTES=GREEN|zip_sha="+h.hexdigest()+"|tar_sha="+image_hash.hexdigest(),flush=True)
          PY
          docker load -i /tmp/rc6-exact618-image.tar.gz >/dev/null
          install -d -m 777 /tmp/rc6-perf618
      - name: Compile experimental binary on CI host using Python headers extracted from the exact image
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/rc6-python618-headers
          cid="$(docker create sha256:2f581a5cc45e34dad4974d35398aeef89f3dbc4c9ca7f4c3c172efd1123b62d9)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/include/python3.11/." /tmp/rc6-python618-headers/
          docker rm "$cid" >/dev/null
          trap - EXIT
          cc -O3 -Wall -Wextra -shared -fPIC -I/tmp/rc6-python618-headers \
            scripts/rc6_json_bound_research.c -o /tmp/rc6-perf618/_rc6_json_bound.so
          readelf --version-info /tmp/rc6-perf618/_rc6_json_bound.so > /tmp/rc6-perf618/binary-symbol-versions.txt
          readelf -d /tmp/rc6-perf618/_rc6_json_bound.so > /tmp/rc6-perf618/binary-needed.txt
          python3 - <<'PY'
          import pathlib,re
          versions=pathlib.Path("/tmp/rc6-perf618/binary-symbol-versions.txt").read_text()
          needed=pathlib.Path("/tmp/rc6-perf618/binary-needed.txt").read_text()
          assert "NEEDED" not in needed,"UNEXPECTED_NATIVE_LIBRARY_DEPENDENCY"
          assert not re.search(r"GLIBC_[0-9]",versions),"UNEXPECTED_GLIBC_VERSION_DEPENDENCY"
          print("RC6_NATIVE_BOUND_LINK_DEPENDENCIES=NONE; EXACT_FROZEN_PYTHON_HEADERS")
          PY
      - name: Compile and test C sizing predicate over exact frozen base without product changes
        shell: bash
        run: |
          set -Eeuo pipefail
          docker create --name rc6-serializer-ci --memory=512m --memory-swap=512m --cpus=.75 \
            --network=none --no-healthcheck --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 \
            --user=1000:1000 --workdir=/app -e PYTHONPATH=/app -e PYTHONDONTWRITEBYTECODE=1 -e TMPDIR=/profile \
            -v /tmp/rc6-perf618:/profile:rw \
            -v "$GITHUB_WORKSPACE/scripts/rc6_native_json_bound_research.py:/native-research.py:ro" \
            -v "$GITHUB_WORKSPACE/scripts/rc6_json_bound_research.c:/native-bound.c:ro" \
            sha256:2f581a5cc45e34dad4974d35398aeef89f3dbc4c9ca7f4c3c172efd1123b62d9 \
            python /native-research.py --output /profile --extension /profile/_rc6_json_bound.so --source /native-bound.c
          set +e
          timeout 480 docker start -a rc6-serializer-ci
          rc=$?
          set -e
          docker inspect --format 'RC6_NATIVE_BOUND_CONTAINER={{json .State}}|memory={{.HostConfig.Memory}}|cpu={{.HostConfig.NanoCpus}}' rc6-serializer-ci
          test "$rc" -eq 0
          test "$(docker inspect -f '{{.State.ExitCode}}|{{.State.OOMKilled}}' rc6-serializer-ci)" = '0|false'
      - name: Preserve only synthetic research metrics and exact experimental binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-native-json-bound-research-${{ github.run_id }}
          path: |
            /tmp/rc6-perf618/native-bound-research.json
            /tmp/rc6-perf618/_rc6_json_bound.so
            /tmp/rc6-perf618/binary-symbol-versions.txt
            /tmp/rc6-perf618/binary-needed.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Remove isolated CI container
        if: always()
        run: docker rm -f rc6-serializer-ci >/dev/null 2>&1 || true
