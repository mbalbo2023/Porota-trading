name: RC6 contratos exactos READ_ONLY
run-name: RC6 serie A3 y revisión histórica DLR READ_ONLY
on:
  push:
    branches: [audit/rc6-caucion-hold-readonly-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Verificar la serie exacta A3 y el cambio histórico
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' &&
      (github.event_name == 'push' || inputs.operation == 'read_only')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:c2752f066fdde7028efca5e36e2ed32433e3f87cd5ca29783d0f56baa8b3b541 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json
          import re
          import sqlite3
          import time
          
          from cg_paper_workspace import database_path
          from cp_contract_evidence_v2_hf6 import material_evidence, pending_material_changes
          
          
          def safe_value(value):
              if value is None or type(value) in (bool,int,float):
                  return value
              if isinstance(value,str) and re.fullmatch(r"[A-Za-z0-9:_() .\-+]{1,170}", value):
                  return value
              return "REDACTED"
          
          
          with closing(sqlite3.connect(database_path().as_uri()+"?mode=ro", uri=True, timeout=.4)) as conn:
              conn.execute("PRAGMA query_only=ON")
              conn.execute("BEGIN")
              if conn.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone() != ("PRODUCTION_PAPER", 0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              deadline=time.monotonic()+4
              conn.set_progress_handler(lambda: time.monotonic()>=deadline,1000)
              pending=pending_material_changes(conn)
              reviews=conn.execute("SELECT 1 FROM sqlite_schema WHERE type='table' AND name='contract_evidence_v2_reviews'").fetchone()
              review_rows = "SELECT change_id FROM contract_evidence_v2_reviews" if reviews else "SELECT NULL AS change_id WHERE 0"
              rows=conn.execute(f"""WITH reviews AS ({review_rows})
                SELECT ch.change_id,ch.family,ch.ticker,ch.market,ch.currency,ch.settlement,
                   ch.detected_at,ch.previous_hash,ch.current_hash,prev.evidence_json,cur.evidence_json,
                   prev.source_ref,cur.source_ref,rev.change_id,latest.evidence_hash
                FROM contract_evidence_v2_changes ch
                LEFT JOIN contract_evidence_v2_snapshots prev
                  ON prev.family=ch.family AND prev.ticker=ch.ticker AND prev.market=ch.market
                   AND prev.currency=ch.currency AND prev.settlement=ch.settlement
                   AND prev.source_class=ch.source_class AND prev.evidence_hash=ch.previous_hash
                LEFT JOIN contract_evidence_v2_snapshots cur
                  ON cur.family=ch.family AND cur.ticker=ch.ticker AND cur.market=ch.market
                   AND cur.currency=ch.currency AND cur.settlement=ch.settlement
                   AND cur.source_class=ch.source_class AND cur.evidence_hash=ch.current_hash
                LEFT JOIN contract_evidence_v2_current latest
                  ON latest.family=ch.family AND latest.ticker=ch.ticker AND latest.market=ch.market
                   AND latest.currency=ch.currency AND latest.settlement=ch.settlement
                   AND latest.source_class=ch.source_class
                LEFT JOIN reviews rev ON rev.change_id=ch.change_id
                WHERE ch.status='CHANGED_REVIEW_REQUIRED' AND ch.source_class='DERIVED_OFFICIAL_RULE'
                  AND ((ch.family='CAUCIONES' AND ch.currency='ARS') OR
                       (ch.family='FUTUROS' AND ch.ticker IN ('DLR/NOV26','DLR/DIC26')))
                ORDER BY ch.change_id LIMIT 40""").fetchall()
              changes=[]
              for cid,f,k,m,c,s,t,older,newer,before,after,p_ref,c_ref,rev,latest in rows:
                  p=material_evidence(json.loads(before)) if before else {}
                  n=material_evidence(json.loads(after)) if after else {}
                  item = {"change_id":cid,"identity":[f,k,m,c,s],"detected_at":t,
                    "pending":(f,k,m,c,s) in pending,"exact_review_present":rev is not None,
                    "old_hash":older,"new_hash":newer,"latest_hash_matches":newer==latest,
                    "static_sources_match":p_ref==c_ref,
                    "delta":{key:[safe_value(p.get(key)),safe_value(n.get(key))] for key in sorted(p.keys()|n.keys())
                        if p.get(key)!=n.get(key) and re.fullmatch(r"[a-z_]{1,60}",key)}}
                  if f == "FUTUROS":
                      item["previous_source"] = safe_value(p_ref)
                      item["current_source"] = safe_value(c_ref)
                      if before:
                          allowed = {"market", "currency", "settlement", "paper_quantity_min",
                              "paper_quantity_step", "paper_quantity_policy", "paper_margin_policy",
                              "paper_margin_rate", "broker_minimum_quantity","broker_quantity_step",
                              "broker_margin","policy_scope","readiness_guard","derivation_rule",
                              "evidence_scope","metadata_source"}
                          item["old_documented_policy"] = {k:safe_value(v) for k,v in json.loads(before).items()
                                                           if k in allowed}
                          item["old_additional_field_count"] = len(json.loads(before).keys()-allowed)
                  changes.append(item)
              print("RC6_FAMILY_CHANGE="+json.dumps({"at":datetime.now(timezone.utc).isoformat(),
                  "changes":changes},separators=(",",":"),ensure_ascii=True))
          PY
          HOST

  referencias:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' &&
      (github.event_name == 'push' || inputs.operation == 'read_only')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6d12321011dd6a4e75461085b9efb92c92561cfd
          persist-credentials: false
      - name: Verify corrected A3 CEM request and exact symbol
        shell: bash
        run: |
          python3 -B - <<'PY'
          from datetime import date, datetime, timezone
          import json
          import re
          
          from scripts.rc6_history_fresh_probe import _fetcher
          from scripts.rc6_history_fresh_sidecar import _day, _identity_conflicts, _target
          
          
          at = datetime.now(timezone.utc)
          ids = ("DLR/NOV26", "DLR/DIC26")
          receipts = {}
          fetch, close = _fetcher("A3_CEM")
          try:
              for ticker in ids:
                  target = _target((ticker, "FUTUROS", "A3", "ARS", "INMEDIATA"))
                  try:
                      payload = fetch(target, date(2026,11,24), date(2026,11,25))
                      rows = payload.get("data")
                      received = datetime.now(timezone.utc)
                      if not isinstance(rows,list) or len(rows)>10:
                          raise ValueError("A3_TARGET_RESPONSE_SCOPE")
                      selected = []
                      for row in rows:
                          if not isinstance(row,dict) or _identity_conflicts(row,target,"A3_CEM"):
                              continue
                          selected.append({"symbol": row.get("symbol"),"product": row.get("product"),
                              "raw_at":row.get("dateTime"),"session_day":_day(row,"A3_CEM",received).isoformat(),
                              "has_adjustment":type(row.get("settlement")) in (int,float) and row["settlement"]>0})
                      receipts[ticker]={"received":received.isoformat(),"records":len(rows),"matched":selected}
                  except Exception as exc:
                      code=str(exc)
                      receipts[ticker]={"error":code if re.fullmatch(r"[A-Z0-9_: /-]{3,90}",code) else type(exc).__name__}
          finally:
              close()
          print("RC6_CEM_CANDIDATE="+json.dumps({"at":at.isoformat(),"cases":receipts,
                "status":"REFERENCE_ONLY","runtime_entry_authority":False,"ppi_calls":0},separators=(",",":")))
          PY
