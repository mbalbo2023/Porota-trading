name: RC6 contratos exactos READ_ONLY
run-name: RC6 contratos exactos y fuentes públicas READ_ONLY
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Leer comprobantes de contrato y referencias públicas
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' && inputs.operation == 'read_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:c2752f066fdde7028efca5e36e2ed32433e3f87cd5ca29783d0f56baa8b3b541 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json
          import os
          import re
          import sqlite3
          import time
          
          from bu_instrument_catalog import ppi_full_key_evidence_reason
          from cg_paper_workspace import database_path
          from rc6_fund_source_quarantine import _settlement_authority_pins
          
          
          def tokens(values):
              return [item for item in values if isinstance(item, str) and re.fullmatch(
                  r"[A-Z][A-Z0-9_.: +\-]{0,89}", item, re.I)]
          
          
          with closing(sqlite3.connect(database_path().as_uri() + "?mode=ro",
                                       uri=True, timeout=.4)) as conn:
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA query_only=ON")
              conn.execute("BEGIN")
              if tuple(conn.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()) != ("PRODUCTION_PAPER", 0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              deadline = time.monotonic() + 4
              conn.set_progress_handler(lambda: time.monotonic() >= deadline, 1000)
              cohort = conn.execute("""SELECT f.*,c.can_simulate,c.status AS projected,c.detail
                FROM financial_instrument_catalog f LEFT JOIN candidate_identity_v2 c
                ON f.ticker=c.ticker AND f.instrument_type=c.instrument_type AND f.market=c.market
                  AND f.currency=c.currency AND f.settlement=c.settlement
                WHERE f.instrument_type='CAUCIONES' AND f.status='AVAILABLE'
                OR f.instrument_type='FCI' AND f.ticker IN ('BZ.AHORRO.A','BZ.AHORRO.B')
                OR f.instrument_type='FUTUROS' AND f.ticker IN ('DLR/NOV26','DLR/DIC26')
                ORDER BY f.instrument_type,f.ticker,f.market,f.currency,f.settlement LIMIT 40""").fetchall()
              details = []
              for row in cohort:
                  key = [row[k] for k in ("ticker","instrument_type","market","currency","settlement")]
                  data = json.loads(row["metadata_json"])
                  bridge = data.get("_contract_bridge") or {}
                  conflicts = data.get("_contract_conflicts") or {}
                  evidence = conn.execute("""SELECT cur.source_class
                      FROM contract_evidence_v2_current cur
                      WHERE cur.ticker=? AND cur.family=? AND cur.market=? AND cur.currency=? AND cur.settlement=?
                      ORDER BY 1 LIMIT 9""", key).fetchall()
                  blocked = conn.execute("""SELECT source_class,status,count(*) FROM contract_evidence_v2_changes
                      WHERE ticker=? AND family=? AND market=? AND currency=? AND settlement=?
                       AND status='CHANGED_REVIEW_REQUIRED' GROUP BY 1,2 LIMIT 8""", key).fetchall()
                  details.append([key,row["status"],row["capability"],row["settlement_source"],
                      ppi_full_key_evidence_reason(dict(row),database=database_path()),row["can_simulate"],
                      tokens((row["detail"] or "").split(";")),tokens(bridge.get("gaps",[])),
                      tokens(conflicts.get("fields",[]) if isinstance(conflicts,dict) else []),
                      sorted(k for k in ("isin","fundClassId","cafciClassId","cafci_class_id","cnv_fund_id",
                                         "paper_family_contract_v1","financial_contract_v17",
                                         "paper_caucion_contract_v1","_ppi_native_request_receipt") if k in data),
                      [list(r) for r in evidence], [list(r) for r in blocked]])
              try:
                  _settlement_authority_pins()
                  fci_pin = "FCI_SETTLEMENT_PIN_PRESENT"
              except ValueError:
                  fci_pin = "FCI_SETTLEMENT_PIN_ABSENT_OR_INVALID"
              print("RC6_FAMILY_DETAIL=" + json.dumps({
                  "at": datetime.now(timezone.utc).isoformat(),
                  "a3_live_auth_configured": all(os.getenv(key) for key in
                      ("A3_PRIMARY_USER","A3_PRIMARY_PASSWORD")),
                  "fci_settlement_authority":fci_pin,
                  "details":details}, separators=(",",":"),ensure_ascii=True))
          PY
          HOST

  referencias:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' && inputs.operation == 'read_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 44ee181dcc452215ab05fae7f3919e344e7601d7
          persist-credentials: false
      - name: Verify public CAFCI and A3 responses without credentials
        shell: bash
        run: |
          python3 -B - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          
          from rc6_cafci_fci_reference import MAX_COMPRESSED_BYTES, SOURCE_URL, parse_cafci_daily_reference
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def fetch(url, limit):
              with build_opener(NoRedirect()).open(Request(url, headers={
                      "User-Agent": "Porota-RC6-Paper-Source-Audit/1.0"}), timeout=9) as response:
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise ValueError("SOURCE_RESPONSE_TOO_LARGE")
                  return response.headers, body, datetime.now(timezone.utc)
          
          
          def failure(error):
              if isinstance(error, HTTPError):
                  return {"status": "HTTP_ERROR", "http": error.code,
                          "redirect_host": urlsplit(error.headers.get("Location","")).hostname}
              if isinstance(error, URLError):
                  return {"status": "TRANSPORT_ERROR", "class": type(error.reason).__name__}
              code = str(error)
              return {"status": "REJECTED", "code": code if re.fullmatch(
                  r"[A-Z][A-Z0-9_]{1,80}", code) else type(error).__name__}
          
          
          result = {"at": datetime.now(timezone.utc).isoformat(), "ppi_calls": 0, "execution": False}
          try:
              headers, body, now = fetch(SOURCE_URL, MAX_COMPRESSED_BYTES)
              filename = headers.get_filename()
              result["cafci_http"] = {"filename": filename if re.fullmatch(
                  r"20[0-9]{6}_Planilla_Diaria_A\.xlsx", filename or "") else None,
                  "last_modified": headers.get("Last-Modified"), "size": len(body)}
              report = parse_cafci_daily_reference(body, captured_at=now,
                  http_last_modified_at=headers.get("Last-Modified"),
                  expected_sha256=sha256(body).hexdigest(), source_filename=filename)
              result["cafci"] = {"report": report.report_date.isoformat(),
                  "digest": report.source_sha256, "classes": len(report.classes),
                  "focal": [{"class_id": row.cafci_class_id, "cnv": row.cnv_fund_id,
                             "effective": row.nav_effective_date.isoformat() if row.nav_effective_date else None,
                             "fee_reference_only": True, "has_nav": row.nav_per_unit is not None,
                             "quality_holds": row.quality_holds} for row in report.classes
                             if row.cafci_class_id in (1114,1115)]}
          except (OSError, ValueError, TypeError) as error:
              result["cafci"] = failure(error)
          
          result["a3"] = {}
          for ticker in ("DLR/NOV26","DLR/DIC26"):
              url = "https://apicem.matbarofex.com.ar/api/v1/closing-prices?" + urlencode({
                  "symbol":ticker,"from":"2026-11-24","to":"2026-11-25","page":1,"pageSize":10})
              try:
                  _, body, at = fetch(url, 100000)
                  payload = json.loads(body)
                  data = payload.get("data") if isinstance(payload,dict) else None
                  if not isinstance(data,list):
                      raise ValueError("A3_DATA_MISSING")
                  records = [{k: row.get(k) for k in
                      ("symbol","dateTime","date","product","market","currency","settlementPrice","closingPrice","closePrice","close","lastPrice","settlement")
                      if k in row and type(row[k]) in (str,int,float)}
                      for row in data if type(row) is dict]
                  result["a3"][ticker] = {"at":at.isoformat(),"rows":records,"digest":sha256(body).hexdigest(),
                      "fields": sorted(data[0]) if data and isinstance(data[0],dict) else []}
              except (OSError, ValueError, TypeError) as error:
                  result["a3"][ticker] = failure(error)
          print("RC6_PUBLIC_FAMILY=" + json.dumps(result, separators=(",",":"),ensure_ascii=True))
          PY
