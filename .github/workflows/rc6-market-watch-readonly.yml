name: RC6 PPI REST directo GGAL
run-name: RC6 Book y Current de GGAL en una sesión 26-11

on:
  push:
    branches: [audit/rc6-ppi-rest-ggal-once-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Prueba individual REST desde el Droplet
        type: choice
        options: [direct_ggal]
        default: direct_ggal
        required: true

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  direct-ggal:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-ppi-rest-ggal-once-20261125' &&
      github.actor == 'mbalbo2023' && github.triggering_actor == 'mbalbo2023' &&
      github.run_attempt == '1' && (github.event_name == 'push' || inputs.operation == 'direct_ggal')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify pinned probe
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s  %s\n' '82f51b6415cb5b96be3bd6a52d3143c578969ff297b65c0e37c8fc04363c148a' scripts/rc6_ppi_direct_ggal_once.sh | sha256sum -c
          bash -n scripts/rc6_ppi_direct_ggal_once.sh

      - name: Run the guarded one-shot direct REST probe on the Droplet
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d "$RUNNER_TEMP/rc6-direct-ggal.XXXXXX")
          trap 'rm -rf -- "$probe_dir"' EXIT
          receipt="$RUNNER_TEMP/rc6-direct-ggal.json"
          printf '%s\n' '{"state":"RC6_TRANSPORTE_ACTIONS_NO_VERIFICADO"}' > "$receipt"
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$DO_KEY" && test -n "$DO_KNOWN" || exit 1
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/known_hosts"
          if ! ssh -F /dev/null -i "$probe_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$probe_dir/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" 'bash -s' \
            < scripts/rc6_ppi_direct_ggal_once.sh > "$probe_dir/result" 2> "$probe_dir/stderr"; then
            exit 1
          fi
          python3 -B - "$probe_dir/result" "$receipt" <<'PY'
          import json
          from pathlib import Path
          import sys

          result, destination = map(Path, sys.argv[1:])
          raw = result.read_bytes()
          if len(raw) > 16384:
              raise SystemExit('RC6_RECIBO_NO_VERIFICADO')
          data = json.loads(raw)
          if not isinstance(data, dict) or not isinstance(data.get('state'), str):
              raise SystemExit('RC6_RECIBO_NO_VERIFICADO')
          for endpoint in ('Current', 'Book'):
              fields = data.get(endpoint, {}).get('data', {})
              if 'price' in fields:
                  fields['positive_price'] = (fields.pop('price') or 0) > 0
              if 'volume' in fields:
                  fields['volume_observed'] = fields.pop('volume') is not None
              for side in ('bid', 'offer'):
                  if side in fields:
                      fields[side].pop('price', None)
                      fields[side].pop('quantity', None)
          summary = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
          destination.write_text(summary + '\n', encoding='utf-8')
          print(summary)
          if data.get('login', {}).get('attempted') and data.get('real_order_routes_called') != 0:
              raise SystemExit('RC6_PRUEBA_DIRECTA_NO_ACREDITADA')
          PY

      - name: Save the probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-direct-ggal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-direct-ggal.json
          if-no-files-found: warn
          retention-days: 7
