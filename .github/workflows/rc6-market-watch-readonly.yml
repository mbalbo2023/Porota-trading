name: RC6 contratos exactos READ_ONLY
run-name: RC6 estado de recuperación datos y familias READ_ONLY
on:
  push:
    branches: [audit/rc6-caucion-hold-readonly-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Verificar la serie exacta A3 y el cambio histórico
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' &&
      (github.event_name == 'push' || inputs.operation == 'read_only')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:c2752f066fdde7028efca5e36e2ed32433e3f87cd5ca29783d0f56baa8b3b541 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import re
          import sqlite3
          import time
          
          from cg_paper_workspace import database_path
          from cv_history_store_adapter_hf6 import default_history_store
          from rc6_fund_source_quarantine import _settlement_authority_pins
          
          
          def enable_read_only(conn):
              conn.execute("PRAGMA query_only=ON")
              conn.execute("BEGIN")
              limit = time.monotonic() + 4
              conn.set_progress_handler(lambda: time.monotonic() >= limit, 1000)
          
          
          def status(value):
              return value if isinstance(value,str) and re.fullmatch(r"[A-Z0-9_]{1,80}",value) else None
          
          
          at = datetime.now(timezone.utc).isoformat()
          result = {"at": at, "mode": "PRODUCTION_PAPER", "real_orders_sent": 0}
          with closing(sqlite3.connect(database_path().as_uri()+"?mode=ro", uri=True, timeout=.4)) as conn:
              enable_read_only(conn)
              row = conn.execute("SELECT mode,real_orders_sent,session_state,ppi_auth FROM observer_state WHERE id=1").fetchone()
              if row is None or row[:2] != ("PRODUCTION_PAPER",0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              result["market"] = {"phase":status(row[2]),"ppi_auth":status(row[3])}
              result["workers"] = {
                  "candles": conn.execute("SELECT cursor,heartbeat_at,state FROM candle_worker_state WHERE id=1").fetchone(),
                  "scalping": conn.execute("""SELECT cursor,heartbeat_at,state,selected,successful,failed,
                      points_inserted,confirmed_identities,candidates FROM intraday_scalping_worker_state WHERE id=1""").fetchone(),
                  "caucion": conn.execute("""SELECT heartbeat_at,state,code,last_attempt_at
                      FROM paper_caucion_cash_sweep_state WHERE id=1""").fetchone(),
              }
              result["latest_candle_versions"] = {}
              for version in conn.execute("""SELECT c.id,c.known_at,c.bar_end,json_extract(s.identity_json,'$.resolution'),
                               json_extract(c.body_json,'$.quality')
                     FROM (SELECT * FROM candle_versions ORDER BY id DESC LIMIT 48) c
                     JOIN candle_series s USING(series_id) ORDER BY c.id DESC"""):
                  if version[3] in ("1m","5m"):
                      result["latest_candle_versions"].setdefault(version[3], (version[0],version[1],version[2],status(version[4])))
              result["exit"] = conn.execute("SELECT state,heartbeat_at FROM paper_exit_reader_state WHERE id=1").fetchone()
              result["fci"] = {}
              for ticker in ("BZ.AHORRO.A","BZ.AHORRO.B"):
                  row = conn.execute("""SELECT settlement_source,capability,metadata_json
                      FROM financial_instrument_catalog
                      WHERE ticker=? AND instrument_type='FCI' AND market='BYMA'
                        AND currency='ARS' AND settlement='INMEDIATA'""",(ticker,)).fetchone()
                  if row:
                      raw = json.loads(row[2])
                      result["fci"][ticker] = {
                          "settlement_source":status(row[0]),"capability":status(row[1]),
                          "primary_isin_present":bool(raw.get("isin")),
                          "exact_class_id_present":any(raw.get(k) for k in ("fundClassId","cafciClassId","cafci_class_id")),
                          "native_settlement_present":bool(raw.get("settlement")),
                      }
              try:
                  _settlement_authority_pins()
                  result["fci_settlement_pin"] = "PRESENT"
              except (OSError, ValueError):
                  result["fci_settlement_pin"] = "ABSENT_OR_INVALID"
          
          history = Path(default_history_store().path).absolute()
          require_history_path = history.resolve() == history and history.is_file() and history.stat().st_nlink == 1
          if not require_history_path:
              raise SystemExit("HISTORY_PATH_IDENTITY_FAILED")
          with closing(sqlite3.connect(history.as_uri()+"?mode=ro", uri=True, timeout=.4)) as conn:
              enable_read_only(conn)
              tables = {row[0] for row in conn.execute("SELECT name FROM sqlite_schema WHERE type='table'")}
              result["history"] = {"cutoff_state":None,"exact_series":{}}
              if "rc6_history_cutoff_repair_runs" in tables:
                  row = conn.execute("SELECT state FROM rc6_history_cutoff_repair_runs WHERE cutoff='2026-09-21'").fetchone()
                  result["history"]["cutoff_state"] = status(row[0]) if row else None
              if "history_canonical_v2" not in tables:
                  raise SystemExit("HISTORY_CANONICAL_TABLE_MISSING")
              for ticker, family, market, term in (
                      ("DLR/NOV26","FUTUROS","A3","INMEDIATA"),
                      ("DLR/DIC26","FUTUROS","A3","INMEDIATA"),
                      ("GGAL","ACCIONES","BYMA","A-24HS")):
                  rows = conn.execute("""SELECT date,source,price_basis,adjustment_basis FROM history_canonical_v2
                      WHERE symbol=? AND instrument_type=? AND market=? AND currency='ARS' AND settlement=?
                      ORDER BY date DESC LIMIT 8""",(ticker,family,market,term)).fetchall()
                  result["history"]["exact_series"][ticker] = [
                      (d,status(source),status(basis),status(adjust)) for d,source,basis,adjust in rows
                  ]
          print("RC6_RECOVERY_READ_ONLY=" + json.dumps(result,separators=(",",":"),ensure_ascii=True))
          PY
          HOST
