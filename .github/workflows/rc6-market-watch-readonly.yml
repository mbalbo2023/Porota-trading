name: RC6 Market Watch READ_ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-market-watch-readonly.yml'
      - 'scripts/rc6_market_watch_readonly.py'
      - 'tests/test_rc6_market_watch_readonly.py'
      - 'scripts/rc6_operator_dashboard_readonly.py'
      - 'tests/test_rc6_operator_dashboard_readonly.py'
      - 'docs/ops/RC6_MARKET_WATCH_READONLY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc6-market-watch-readonly.yml'
      - 'scripts/rc6_market_watch_readonly.py'
      - 'tests/test_rc6_market_watch_readonly.py'
      - 'scripts/rc6_operator_dashboard_readonly.py'
      - 'tests/test_rc6_operator_dashboard_readonly.py'
      - 'docs/ops/RC6_MARKET_WATCH_READONLY.md'
  schedule:
    # Argentina UTC-3; the job's local-time gate restricts monitoring to rueda.
    - cron: '7,17,27,37,47,57 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      notification_mode:
        description: 'normal delivers transitions; read_only records evidence without sending or creating delivery state'
        type: choice
        options: [normal, read_only]
        default: normal
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-market-watch-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test isolated monitor without network
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_market_watch_readonly.py tests/test_rc6_market_watch_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_market_watch_readonly.py -v
          python3 -m py_compile scripts/rc6_operator_dashboard_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_operator_dashboard_readonly.py -v
          git diff --check

  watch:
    needs: contracts
    if: false # targeted RCA and integrity ownership captured; no host action scheduled
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded native RCA probes
        run: python3 -B -m py_compile scripts/rc6_native624_integrity_ownership.py
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_market_watch"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_market_watch" "$HOME/.ssh/known_hosts"
      - name: Read specific integrity owners and cache accounting once
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/native624
          timeout 90 ssh -i "$HOME/.ssh/rc6_market_watch" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            "$DO_USER@$DO_HOST" "sudo -n timeout 75 python3 -B - --sha 246ac975ed527f40db496af47584c9dcdec933f8 --tree 05accd1e3d5e9b246aa2a43b6a78cfa639cb74eb" \
            < scripts/rc6_native624_integrity_ownership.py > evidence/native624/integrity-ownership.json
          python3 -m json.tool evidence/native624/integrity-ownership.json >/dev/null
          cat evidence/native624/integrity-ownership.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-native624-integrity-ownership-${{ github.run_id }}
          path: evidence/native624
          if-no-files-found: error
          retention-days: 14
      - name: Remove credential
        if: always()
        run: rm -f "$HOME/.ssh/rc6_market_watch"

