name: RC6 contratos exactos READ_ONLY
run-name: RC6 procedencia física de velas READ_ONLY
on:
  push:
    branches: [audit/rc6-caucion-hold-readonly-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Verificar la serie exacta A3 y el cambio histórico
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' &&
      (github.event_name == 'push' || inputs.operation == 'read_only')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:b2e7dcd7668c41f16659886fd38ce1333ce6cb4688cacd63eedbc81825537067 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import re
          import sqlite3
          import time
          
          from cg_paper_workspace import database_path
          from cv_history_store_adapter_hf6 import default_history_store
          from rc6_fund_source_quarantine import _settlement_authority_pins
          from cp_contract_evidence_v2_hf6 import _reviewed_dlr_a3_transition
          from scripts.rc6_candle_inmarket_evidence import _materialized_guarded_samples
          
          
          def enable_read_only(conn):
              conn.execute("PRAGMA query_only=ON")
              conn.execute("BEGIN")
              limit = time.monotonic() + 4
              conn.set_progress_handler(lambda: time.monotonic() >= limit, 1000)
          
          
          def status(value):
              return value if isinstance(value,str) and re.fullmatch(r"[A-Z0-9_]{1,80}",value) else None
          
          
          at = datetime.now(timezone.utc).isoformat()
          result = {"at": at, "mode": "PRODUCTION_PAPER", "real_orders_sent": 0}
          with closing(sqlite3.connect(database_path().as_uri()+"?mode=ro", uri=True, timeout=.4)) as conn:
              enable_read_only(conn)
              row = conn.execute("SELECT mode,real_orders_sent,session_state,ppi_auth FROM observer_state WHERE id=1").fetchone()
              if row is None or row[:2] != ("PRODUCTION_PAPER",0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              result["market"] = {"phase":status(row[2]),"ppi_auth":status(row[3])}
              result["workers"] = {
                  "candles": conn.execute("SELECT cursor,heartbeat_at,state FROM candle_worker_state WHERE id=1").fetchone(),
                  "scalping": conn.execute("""SELECT cursor,heartbeat_at,state,selected,successful,failed,
                      points_inserted,confirmed_identities,candidates FROM intraday_scalping_worker_state WHERE id=1""").fetchone(),
                  "caucion": conn.execute("""SELECT heartbeat_at,state,code,last_attempt_at
                      FROM paper_caucion_cash_sweep_state WHERE id=1""").fetchone(),
              }
              result["latest_candle_versions"] = {}
              for version in conn.execute("""SELECT c.id,c.known_at,c.bar_end,json_extract(s.identity_json,'$.resolution'),
                               json_extract(c.body_json,'$.quality')
                     FROM (SELECT * FROM candle_versions ORDER BY id DESC LIMIT 48) c
                     JOIN candle_series s USING(series_id) ORDER BY c.id DESC"""):
                  if version[3] in ("1m","5m"):
                      result["latest_candle_versions"].setdefault(version[3], (version[0],version[1],version[2],status(version[4])))
              from hashlib import sha256
              latest = {}
              for frame, item in result["latest_candle_versions"].items():
                  row = conn.execute("""SELECT s.identity_json,v.body_json,v.body_hash
                    FROM candle_versions v JOIN candle_series s USING(series_id) WHERE v.id=?""",
                    (item[0],)).fetchone()
                  series, bar = map(json.loads,row[:2])
                  latest[frame] = {
                      "identity":[series[k] for k in ("symbol","asset_class","market","currency","settlement")],
                      "source":series["source"],"price_kind":series["price_kind"],"samples":bar["samples"],
                      "synthetic":bar["synthetic"],"has_volume":bar["volume"] is not None,
                      "body_hash_matches":sha256(row[1].encode("utf-8")).hexdigest()==row[2],
                  }
              recent_guarded = conn.execute("""SELECT COUNT(*),MAX(v.known_at)
                  FROM (SELECT * FROM candle_versions ORDER BY id DESC LIMIT 256) v
                  JOIN candle_series s USING(series_id)
                  WHERE json_extract(s.identity_json,'$.source')='PPI_GUARDED_CURRENT'""").fetchone()
              archived_guarded = conn.execute("""SELECT COUNT(*),MAX(recorded_at)
                  FROM historical_raw_archive WHERE origin='PPI_GUARDED_CURRENT'""").fetchone()
              guarded_series = conn.execute("""SELECT COUNT(*) FROM candle_series
                  WHERE json_extract(identity_json,'$.source')='PPI_GUARDED_CURRENT'""").fetchone()[0]
              result["candle_provenance"] = {"latest":latest,"recent_guarded_versions":recent_guarded[0],
                  "last_guarded_version":recent_guarded[1],"guarded_raw_receipts":archived_guarded[0],
                  "last_guarded_receipt":archived_guarded[1],"guarded_series":guarded_series}
              if recent_guarded[1] is not None:
                  guarded_clock = datetime.fromisoformat(recent_guarded[1].replace("Z","+00:00"))
                  guarded_pair = _materialized_guarded_samples(conn,guarded_clock)
                  result["candle_provenance"]["guarded_replay_as_of_latest_guarded"] = {
                      "as_of":guarded_clock.isoformat(),"resolutions":guarded_pair.get("known_at_by_resolution",{})}
              candle_retained = result["latest_candle_versions"]
              result["paired_candle_replay"] = {"verified":False,"resolutions":{}}
              if all(frame in candle_retained for frame in ("1m","5m")):
                  last_observed = max(datetime.fromisoformat(candle_retained[frame][1].replace("Z","+00:00"))
                                      for frame in ("1m","5m"))
                  proof = _materialized_guarded_samples(conn,last_observed)
                  result["paired_candle_replay"] = {"verified":bool(proof),
                      "observed_at":last_observed.isoformat(),
                      "resolutions":proof.get("known_at_by_resolution",{})}
              result["exit"] = conn.execute("SELECT state,heartbeat_at FROM paper_exit_reader_state WHERE id=1").fetchone()
              result["dlr_review"] = {}
              for change_id in (34609,34610):
                  row = conn.execute("""SELECT ch.family,ch.ticker,ch.market,ch.currency,ch.settlement,
                         ch.source_class,ch.previous_hash,ch.current_hash,p.evidence_json,n.evidence_json,
                         p.source_ref,n.source_ref FROM contract_evidence_v2_changes ch
                         JOIN contract_evidence_v2_snapshots p
                         ON p.family=ch.family AND p.ticker=ch.ticker AND p.market=ch.market
                         AND p.currency=ch.currency AND p.settlement=ch.settlement
                         AND p.source_class=ch.source_class AND p.evidence_hash=ch.previous_hash
                         JOIN contract_evidence_v2_snapshots n
                         ON n.family=ch.family AND n.ticker=ch.ticker AND n.market=ch.market
                         AND n.currency=ch.currency AND n.settlement=ch.settlement
                         AND n.source_class=ch.source_class AND n.evidence_hash=ch.current_hash
                         WHERE ch.change_id=?""",(change_id,)).fetchone()
                  if row is None:
                      raise SystemExit("DLR_EXACT_REVIEW_EVIDENCE_MISSING")
                  columns = ("family","ticker","market","currency","settlement","source_class",
                             "previous_hash","current_hash")
                  change = dict(zip(columns,row[:8]))
                  result["dlr_review"][change["ticker"]] = {"change_id":change_id,
                      "accepted":_reviewed_dlr_a3_transition(change,json.loads(row[8]),
                                                             json.loads(row[9]),row[10],row[11])}
              if not all(record["accepted"] for record in result["dlr_review"].values()):
                  raise SystemExit("DLR_EXACT_REVIEW_NOT_APPLIED")
              families = ("FCI","CAUCIONES","FUTUROS","INDICES")
              result["catalog_coverage"] = {
                  row[0]: {"observed":row[1],"catalog_ready":row[2],"state":status(row[3]),"at":row[4]}
                  for row in conn.execute("""SELECT instrument_type,observed_count,ready_paper_count,
                          discovery_status,checked_at FROM catalog_family_coverage
                          WHERE instrument_type IN (?,?,?,?)""",families)
              }
              result["family_catalog_rows"] = {}
              for kind in families:
                  rows = conn.execute("""SELECT capability,COUNT(*) FROM financial_instrument_catalog
                          WHERE instrument_type=? AND status='AVAILABLE' GROUP BY capability""",
                          (kind,)).fetchall()
                  result["family_catalog_rows"][kind] = {status(value):count for value,count in rows}
              result["fci"] = {}
              for ticker in ("BZ.AHORRO.A","BZ.AHORRO.B"):
                  row = conn.execute("""SELECT settlement_source,capability,metadata_json
                      FROM financial_instrument_catalog
                      WHERE ticker=? AND instrument_type='FCI' AND market='BYMA'
                        AND currency='ARS' AND settlement='INMEDIATA'""",(ticker,)).fetchone()
                  if row:
                      raw = json.loads(row[2])
                      result["fci"][ticker] = {
                          "settlement_source":status(row[0]),"capability":status(row[1]),
                          "primary_isin_present":bool(raw.get("isin")),
                          "exact_class_id_present":any(raw.get(k) for k in ("fundClassId","cafciClassId","cafci_class_id")),
                          "native_settlement_present":bool(raw.get("settlement")),
                      }
              try:
                  _settlement_authority_pins()
                  result["fci_settlement_pin"] = "PRESENT"
              except (OSError, ValueError):
                  result["fci_settlement_pin"] = "ABSENT_OR_INVALID"
          
          history = Path(default_history_store().path).absolute()
          require_history_path = history.resolve() == history and history.is_file() and history.stat().st_nlink == 1
          if not require_history_path:
              raise SystemExit("HISTORY_PATH_IDENTITY_FAILED")
          with closing(sqlite3.connect(history.as_uri()+"?mode=ro", uri=True, timeout=.4)) as conn:
              enable_read_only(conn)
              tables = {row[0] for row in conn.execute("SELECT name FROM sqlite_schema WHERE type='table'")}
              result["history"] = {"cutoff_state":None,"exact_series":{},"dlr_reference":{}}
              if "rc6_history_cutoff_repair_runs" in tables:
                  row = conn.execute("SELECT state FROM rc6_history_cutoff_repair_runs WHERE cutoff='2026-09-21'").fetchone()
                  result["history"]["cutoff_state"] = status(row[0]) if row else None
              if "history_canonical_v2" not in tables:
                  raise SystemExit("HISTORY_CANONICAL_TABLE_MISSING")
              for ticker, family, market, term in (
                      ("DLR/NOV26","FUTUROS","A3","INMEDIATA"),
                      ("DLR/DIC26","FUTUROS","A3","INMEDIATA"),
                      ("GGAL","ACCIONES","BYMA","A-24HS")):
                  rows = conn.execute("""SELECT date,source,price_basis,adjustment_basis FROM history_canonical_v2
                      WHERE symbol=? AND instrument_type=? AND market=? AND currency='ARS' AND settlement=?
                      ORDER BY date DESC LIMIT 8""",(ticker,family,market,term)).fetchall()
                  result["history"]["exact_series"][ticker] = [
                      (d,status(source),status(basis),status(adjust)) for d,source,basis,adjust in rows
                  ]
              for ticker in ("DLR/NOV26","DLR/DIC26"):
                  row = conn.execute("""SELECT COUNT(*),MAX(date) FROM history_canonical_v2
                      WHERE symbol=? AND instrument_type='FUTUROS' AND market='A3'
                        AND currency='UNKNOWN' AND settlement='UNKNOWN' AND price_basis='SOURCE_REPORTED'
                        AND source='A3_CEM_CLOSING' AND adjustment_basis='UNKNOWN:A3_CEM_CLOSING'""",
                      (ticker,)).fetchone()
                  result["history"]["dlr_reference"][ticker] = {"rows":row[0],"last_session":row[1]}
          print("RC6_RECOVERY_READ_ONLY=" + json.dumps(result,separators=(",",":"),ensure_ascii=True))
          PY
          HOST
