name: RC6 A667 release CI diagnostic
on:
  push:
    branches: [audit/rc6-caucion-hold-readonly-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 90099ddf2399a59c544214d9138ea2f193c235cb
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: porota-a667-debug:exact-source
          cache-from: type=gha,scope=porota-rc6-predeploy-v2
      - name: Classify the failing synthetic ledger read
        shell: bash
        run: |
          set -Eeuo pipefail
          export RC6_A667_CHECKOUT_SOURCE=90099ddf2399a59c544214d9138ea2f193c235cb
          test "$(git rev-parse HEAD)" = "$RC6_A667_CHECKOUT_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = 69de3030b0e61b8462df3d1573350c0638ee0604
          probe="$RUNNER_TEMP/porota_a667_trace.py"
          cat > "$probe" <<'PY'
          from contextlib import contextmanager
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import time

          import pytest

          ROOT = Path("/app")
          TARGET = "test_material_changed_between_lease_acquire_and_start_revokes_send"

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_call(item):
              if TARGET not in item.nodeid:
                  yield
                  return
              import rc6_ppi_global_budget as budget
              before = budget._ledger_snapshot

              @contextmanager
              def snapshot(*args, **kwargs):
                  start = time.monotonic()
                  try:
                      with before(*args, **kwargs) as connection:
                          yield connection
                  except (OSError, ValueError, RuntimeError) as exc:
                      value = exc.args[0] if len(exc.args) == 1 else ""
                      reason = value if isinstance(value, str) and re.fullmatch(r"[A-Z_]{4,90}", value) else "UNCLASSIFIED"
                      print("A667_SNAPSHOT_FAILURE=" + json.dumps({
                          "reason": reason, "type": type(exc).__name__,
                          "elapsed_ms": round((time.monotonic() - start)*1000, 2),
                          "errno": getattr(exc, "errno", None),
                      }), flush=True)
                      raise
                  else:
                      print("A667_SNAPSHOT_PASS_MS=" + str(round((time.monotonic() - start)*1000, 2)), flush=True)

              budget._ledger_snapshot = snapshot
              try:
                  yield
              finally:
                  budget._ledger_snapshot = before

          def pytest_runtest_logreport(report):
              if report.when == "call" and TARGET in report.nodeid:
                  print("A667_TARGET=" + report.outcome, flush=True)

          def main():
              sys.path.insert(0, str(ROOT))
              from scripts import rc6_ci_parallel_runner as runner, rc6_ci_shard_quorum as shards
              env = dict(os.environ, PYTEST_DISABLE_PLUGIN_AUTOLOAD="1",
                         PYTHONPATH="/tmp:/app", RC6_CI_IDENTITY_PROOF="1",
                         RC6_CI_SOURCE_SHA="90099ddf2399a59c544214d9138ea2f193c235cb",
                         RC6_CI_SOURCE_TREE_SHA="69de3030b0e61b8462df3d1573350c0638ee0604")
              for key in ("PYTEST_ADDOPTS", "PYTEST_PLUGINS", "RC6_CI_MODULE_TRACE"):
                  env.pop(key, None)
              python = sys.executable
              plugin = ["-p", "scripts.rc6_ci_pytest_identity", "-p", "no:cacheprovider"]
              with tempfile.TemporaryDirectory(prefix="rc6-ci-parallel-", dir="/var/tmp") as scratch:
                  folder = Path(scratch)
                  manifest = folder / "collected.json"
                  env["RC6_CI_MANIFEST_PATH"] = str(manifest)
                  result = subprocess.run([python, "-m", "pytest", *plugin, "--collect-only", "-q",
                                           *runner._test_args(ROOT)],
                                          cwd=ROOT, env=env, capture_output=True, text=True)
                  if result.returncode:
                      return result.returncode
                  groups = shards.partition(json.loads(manifest.read_text()), 16)
                  group = next(group for group in groups if any(TARGET in item for item in group))
                  shard = folder / "shard-6"
                  shard.mkdir(mode=0o700)
                  env["RC6_CI_MANIFEST_PATH"] = str(shard / "executed.json")
                  print("A667_SHARD_CASES=" + str(len(group)))
                  result = subprocess.run([python, "-m", "pytest", *plugin, "-p", "porota_a667_trace",
                      "-s", "-q", "-o", "xfail_strict=true", "--maxfail=1",
                      f"--basetemp={shard/'basetemp'}", "--", *group],
                      cwd=ROOT, env=env, capture_output=True, text=True)
                  for line in result.stdout.splitlines():
                      match = re.search(r"A667_(?:SNAPSHOT_FAILURE|SNAPSHOT_PASS_MS|TARGET)=.*$", line)
                      if match:
                          print(match.group())
                  print("A667_SHARD_EXIT=" + str(result.returncode))
                  return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          docker run --rm --pull never --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 512 --memory 6g --mount "type=bind,src=$PWD/.git,dst=/app/.git,readonly" \
            --mount "type=bind,src=$PWD/docs,dst=/app/docs,readonly" \
            --mount "type=bind,src=$probe,dst=/tmp/porota_a667_trace.py,readonly" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/app \
            --entrypoint python porota-a667-debug:exact-source -B /tmp/porota_a667_trace.py
