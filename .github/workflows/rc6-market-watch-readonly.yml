name: RC6 contratos exactos READ_ONLY
run-name: RC6 errores de catálogo y recibos API por las once familias
on:
  push:
    branches: [audit/rc6-caucion-hold-readonly-20261125]
    paths: [.github/workflows/rc6-market-watch-readonly.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Verificar la serie exacta A3 y el cambio histórico
        type: choice
        options: [read_only]
        default: read_only
        required: true
permissions: {}
jobs:
  contratos:
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/audit/rc6-caucion-hold-readonly-20261125' &&
      github.actor == 'mbalbo2023' &&
      (github.event_name == 'push' || inputs.operation == 'read_only')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Read exact contract gate in SQLite query-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          probe_dir=$(mktemp -d)
          trap 'rm -f -- "$probe_dir/key" "$probe_dir/hosts"; rmdir "$probe_dir"' EXIT
          printf '%s\n' "$DO_KEY" > "$probe_dir/key"
          printf '%s\n' "$DO_KNOWN" > "$probe_dir/hosts"
          ssh -F /dev/null -i "$probe_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$probe_dir/hosts" \
            -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'timeout 15 bash -s' <<'HOST'
          set -Eeuo pipefail
          test "$(id -u)" = 1000 && test "$(id -un)" = porotaadmin
          docker=(docker -H unix:///run/user/1000/porota-rc6-docker.sock)
          cid=$("${docker[@]}" ps --no-trunc -q --filter label=io.porota.project=rc6 --filter label=io.porota.role=observer)
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          [[ $("${docker[@]}" inspect --format '{{.Image}}' "$cid") == sha256:b2e7dcd7668c41f16659886fd38ce1333ce6cb4688cacd63eedbc81825537067 ]]
          "${docker[@]}" exec -i "$cid" python -B - <<'PY'
          from contextlib import closing
          from datetime import datetime, timezone
          import json
          import re
          import sqlite3
          import time
          
          from bu_instrument_catalog import canonical_family
          from cg_paper_workspace import database_path
          from rc6_fund_source_quarantine import SETTLEMENT_AUTHORITY_FILE, _settlement_authority_pins
          from scripts.rc6_operator_paper_rearm import OPERATOR_DIR_RUNTIME, _root_owned_receipt
          
          
          def code(value):
              return value if isinstance(value, str) and re.fullmatch(r"[A-Z0-9_]{1,100}", value) else "DETAIL_REDACTED"
          
          
          result = {"at":datetime.now(timezone.utc).isoformat()}
          with closing(sqlite3.connect(database_path().as_uri()+"?mode=ro", uri=True, timeout=.4)) as db:
              db.execute("PRAGMA query_only=ON")
              db.execute("BEGIN")
              deadline = time.monotonic() + 4
              db.set_progress_handler(lambda: time.monotonic() >= deadline, 1000)
              row = db.execute("SELECT mode, real_orders_sent, session_state FROM observer_state WHERE id=1").fetchone()
              if row is None or row[:2] != ("PRODUCTION_PAPER", 0):
                  raise SystemExit("PAPER_ZERO_FAILED")
              result["mode"], result["real_orders_sent"], result["phase"] = row
              fields = ("instrument_types","markets","settlements","quantity_types","operation_terms","operation_types","operations")
              result["latest_complete_config"] = {}
              for name, checked_at, raw in db.execute("SELECT name, checked_at, payload_json FROM broker_market_configuration"):
                  if name not in fields:
                      continue
                  payload = json.loads(raw)
                  item = {"at":checked_at,"count":len(payload) if isinstance(payload,list) else None}
                  if name == "instrument_types" and isinstance(payload,list):
                      allowed = {canonical_family(text) for text in payload if isinstance(text,str)}
                      item.update(indices_listed="INDICES" in allowed, fci_listed="FCI" in allowed)
                  result["latest_complete_config"][name] = item
              result["family_runs"] = {}
              for family in ("ACCIONES","CEDEARS","ETFS","BONOS","LETRAS","OBLIGACIONES","OPCIONES","FUTUROS","CAUCIONES","FCI","INDICES"):
                  row = db.execute("""SELECT run_id, declared, queries, observed_count, ready_paper_count,
                                       discovery_status, checked_at
                                    FROM catalog_family_coverage WHERE instrument_type=?""", (family,)).fetchone()
                  if row is None:
                      continue
                  run_id, declared, queries, observed, ready, state, at = row
                  reasons = []
                  for st, detail, count in db.execute("""SELECT status, detail, COUNT(*) FROM catalog_query_results
                                        WHERE run_id=? AND instrument_type=? AND status IN ('ERROR','DEFERRED_PROVIDER','INVALID_METADATA')
                                        GROUP BY status,detail LIMIT 12""",(run_id,family)):
                      reasons.append([code(st),code(detail),count])
                  result["family_runs"][family] = {"at":at,"declared":declared,"queries":queries,"observed":observed,
                                                 "catalog_ready":ready,"state":code(state),"error_counts":reasons}
              cutoff = result["family_runs"].get("INDICES",{}).get("at")
              result["catalog_events"] = []
              result["configuration_wire"] = []
              if cutoff is not None:
                  for kind in ("CATALOG_CONFIGURATION_UNAVAILABLE","CATALOG_DISCOVERY_DEFERRED","PPI_GATEWAY_HOLD"):
                      rows = db.execute("""SELECT event_at,detail FROM paper_events
                                   WHERE event_type=? AND julianday(event_at) BETWEEN julianday(?, '-15 seconds') AND julianday(?, '+120 seconds')
                                   ORDER BY julianday(event_at) LIMIT 12""",(kind,cutoff,cutoff)).fetchall()
                      result["catalog_events"].extend([kind,at,code(detail.upper())] for at,detail in rows)
                  floor = db.execute("SELECT COALESCE(MAX(id),0)-12000 FROM http_audit").fetchone()[0]
                  allowed_paths = {"/api/1.0/configuration/"+name.replace("_","") for name in fields}
                  for at, path, state in db.execute("""SELECT happened_at,path,result FROM http_audit
                             WHERE id>? AND julianday(happened_at) BETWEEN julianday(?, '-10 seconds') AND julianday(?, '+90 seconds')
                             AND method='GET' AND path LIKE '/api/1.0/configuration/%'
                             ORDER BY id LIMIT 30""",(floor,cutoff,cutoff)):
                      if path in allowed_paths:
                          result["configuration_wire"].append([at,path,code(state)])
              from contextlib import nullcontext
              from types import SimpleNamespace
              from bf_production_paper_observer import _ppi_direct_rest_probe_candidates
              
              preferred = {
                  "ACCIONES": ("GGAL","ACCIONES","BYMA","ARS","A-24HS"),
                  "CEDEARS": ("AAPL","CEDEARS","BYMA","ARS","A-24HS"),
                  "BONOS": ("AL30","BONOS","BYMA","ARS","A-24HS"),
                  "FUTUROS": ("DLR/NOV26","FUTUROS","A3","ARS","INMEDIATA"),
                  "CAUCIONES": ("PESOS1","CAUCIONES","BYMA","ARS","INMEDIATA"),
                  "FCI": ("BZ.AHORRO.A","FCI","BYMA","ARS","INMEDIATA"),
              }
              families = ("ACCIONES","CEDEARS","ETFS","BONOS","LETRAS","OBLIGACIONES",
                          "OPCIONES","FUTUROS","CAUCIONES","FCI","INDICES")
              safe_key = re.compile(r"^[A-Z0-9][A-Z0-9 ._+/$()-]{0,79}$")
              physical_receipts = {}
              for event_at, detail in db.execute("""SELECT event_at,detail FROM paper_events
                     WHERE event_type='PPI_DIRECT_REST_NATIVE_WIRE_WITNESS'
                       AND julianday(event_at)>=julianday(?, '-3 days')
                     ORDER BY julianday(event_at) DESC LIMIT 240""",(result["at"],)):
                  match = re.search(r"(?:^|;)identity5=([^;]+);endpoint=(current|book);http_status=(200);", detail)
                  if not match:
                      continue
                  key = tuple(match[1].split(":"))
                  if len(key)!=5 or not all(safe_key.fullmatch(part) for part in key):
                      continue
                  physical_receipts.setdefault(key,{}).setdefault(match[2], {"http":200,"at":event_at})
              sample_status = """SELECT settlement_source, status, capability, metadata_json
                  FROM financial_instrument_catalog
                  WHERE ticker=? AND instrument_type=? AND market=? AND currency=? AND settlement=?"""
              result["samples"] = {}
              view = SimpleNamespace(connect=lambda: nullcontext(db))
              for family in families:
                  key = preferred.get(family)
                  record = db.execute(sample_status,key).fetchone() if key else None
                  if not record and family!="INDICES":
                      candidates = _ppi_direct_rest_probe_candidates(view, limit=1, family=family)
                      key = candidates[0] if candidates else None
                      record = db.execute(sample_status,key).fetchone() if key else None
                  if not record or not all(safe_key.fullmatch(part) for part in key):
                      result["samples"][family] = {"state":"NO_EXACT_PPI_SAMPLE"}
                      continue
                  source, state, capability, data = record
                  metadata = json.loads(data)
                  policy = db.execute("""SELECT can_simulate,status,detail FROM candidate_identity_v2
                                      WHERE ticker=? AND instrument_type=? AND market=? AND currency=? AND settlement=?""",key).fetchone()
                  result["samples"][family] = {"identity":key,"catalog_state":code(state),
                         "capability":code(capability),"settlement_source":code(source),
                         "origin":code(metadata.get("_discovery_source")),
                         "has_financial_terms":isinstance(metadata.get("financial_contract_v17"),dict),
                         "paper_gate":[bool(policy[0]),code(policy[1]),code(policy[2])] if policy else None,
                         "stored_native_http":physical_receipts.get(key,{})}
              from datetime import timedelta
              from bf_production_paper_observer import MARKET_OPEN_HOUR, MARKET_OPEN_MINUTE, PREOPEN_MINUTES, _market_phase
              from zoneinfo import ZoneInfo
              clock = datetime.now(ZoneInfo("America/Argentina/Buenos_Aires"))
              open_at = clock.replace(hour=MARKET_OPEN_HOUR,minute=MARKET_OPEN_MINUTE,second=0,microsecond=0)
              result["runtime_clock"] = {"phase":_market_phase(clock),
                  "preopen_art":(open_at-timedelta(minutes=PREOPEN_MINUTES)).isoformat(),
                  "open_art":open_at.isoformat()}
              import math
              import os
              from rc6_scanner_login_interlock import ScannerLoginInterlock
              from rc6_ppi_shared_session_owner import AUTH_COOLDOWN_SECONDS
              
              gate = ScannerLoginInterlock(database_path(), AUTH_COOLDOWN_SECONDS)
              root = os.open(gate.root,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC)
              try:
                  marker = gate._read(root)
              finally:
                  os.close(root)
              if marker and marker["boot_id"] == gate.boot_id() and gate.monotonic_ns() >= marker["monotonic_ns"]:
                  wait_s = max(0,math.ceil((marker["monotonic_ns"]+
                                   max(gate.cooldown_ns,marker["cooldown_ns"])-gate.monotonic_ns())/1e9))
                  earliest = clock+timedelta(seconds=wait_s)
                  # Reuse the direct probe's existing 23s wire limit and 52s restart observation.
                  observed_recovery_limit = earliest+timedelta(seconds=AUTH_COOLDOWN_SECONDS+23+52)
                  result["handover_preopen"]={"remaining_login_s":wait_s,"earliest_new_login_art":earliest.isoformat(),
                     "probe_and_auth_recovery_by_art":observed_recovery_limit.isoformat(),
                     "preopen_conflict":observed_recovery_limit>=open_at-timedelta(minutes=PREOPEN_MINUTES)}
              else:
                  result["handover_preopen"]={"state":"AUTH_INTERLOCK_CLOCK_UNVERIFIED"}
              result["family_recent_native_success"]={}
              for identity, endpoints in physical_receipts.items():
                  result["family_recent_native_success"].setdefault(identity[1],{"identity":identity,"http":endpoints})
              result["etf_sources"] = {}
              for row in db.execute("""SELECT status, coalesce(json_extract(metadata_json, '$._discovery_source'),'UNKNOWN'),
                         count(*) FROM financial_instrument_catalog
                         WHERE instrument_type='ETFS' AND json_valid(metadata_json) GROUP BY 1,2 LIMIT 20"""):
                  result["etf_sources"].setdefault(code(row[0]),{})[code(row[1])]=row[2]
              result["etf_observation"] = None
              for row in db.execute("""SELECT ticker,instrument_type,market,currency,settlement,settlement_source,
                           status,capability,json_extract(metadata_json, '$._discovery_source')
                         FROM financial_instrument_catalog WHERE instrument_type='ETFS'
                         AND json_valid(metadata_json) ORDER BY CASE WHEN status='AVAILABLE' THEN 0 ELSE 1 END,
                           last_seen_at DESC,ticker LIMIT 8"""):
                  if all(safe_key.fullmatch(part) for part in row[:5]):
                      result["etf_observation"]={"identity":row[:5],"settlement_source":code(row[5]),
                          "catalog_state":code(row[6]),"capability":code(row[7]),"origin":code(row[8])}
                      break
              result["fci_facts"] = {}
              for ticker in ("BZ.AHORRO.A","BZ.AHORRO.B"):
                  row = db.execute("""SELECT settlement_source, metadata_json FROM financial_instrument_catalog
                                  WHERE ticker=? AND instrument_type='FCI' AND market='BYMA'
                                    AND currency='ARS' AND settlement='INMEDIATA'""",(ticker,)).fetchone()
                  if row:
                      source, raw = row
                      metadata = json.loads(raw)
                      result["fci_facts"][ticker] = {
                          "isin_present": bool(metadata.get("isin")),
                          "class_literal_present": any(metadata.get(key) for key in ("fundClassId","cafciClassId","cafci_class_id")),
                          "term_literal_present": bool(metadata.get("settlement")),
                          "term_source": code(source),
                      }
          
          try:
              _root_owned_receipt(OPERATOR_DIR_RUNTIME, receipt_name=SETTLEMENT_AUTHORITY_FILE)
              _settlement_authority_pins()
          except FileNotFoundError:
              result["fci_settlement_authority"] = "ABSENT"
          except PermissionError:
              result["fci_settlement_authority"] = "UNREADABLE"
          except ValueError as exc:
              result["fci_settlement_authority"] = code(str(exc))
          except OSError:
              result["fci_settlement_authority"] = "FILESYSTEM_ERROR"
          else:
              result["fci_settlement_authority"] = "VALID"
          
          print("RC6_CATALOG_RCA_READ_ONLY="+json.dumps(result,separators=(",",":"),ensure_ascii=True))
          PY
          HOST
