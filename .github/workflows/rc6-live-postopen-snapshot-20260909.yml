name: RC6 Live Postopen Snapshot 2026-09-09

on:
  push:
    branches: [diag/rc6-live-postopen-20260909]
    paths:
      - '.github/workflows/rc6-live-postopen-snapshot-20260909.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only live snapshot
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo '=== IDENTITY ==='
          date --iso-8601=seconds
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short || true
          echo '=== CONTAINERS ==='
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard
          echo '=== CORE_DB ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import os,sqlite3,json,datetime
          path='file:/app/data/paper_v17/observer_v17.db?mode=ro'
          c=sqlite3.connect(path,uri=True); c.execute('pragma query_only=on')
          print('QUICK_CHECK='+str(c.execute('pragma quick_check').fetchone()[0]))
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          def cols(t):
              return [r[1] for r in c.execute(f'pragma table_info({t})')]
          if 'observer_state' in tables:
              cc=cols('observer_state')
              wanted=[x for x in ['mode','real_orders_sent','state','market_phase','last_cycle_at','updated_at'] if x in cc]
              if wanted:
                  row=c.execute('select '+','.join(wanted)+' from observer_state order by rowid desc limit 1').fetchone()
                  print('OBSERVER_STATE='+json.dumps(dict(zip(wanted,row)),default=str,sort_keys=True))
          for t in ['paper_decisions','paper_orders','paper_fills','paper_positions','production_history','production_history_attempts','candidate_universe','api_health','source_sync','historical_raw_archive']:
              if t not in tables: continue
              try: print(f'COUNT|{t}|'+str(c.execute(f'select count(*) from {t}').fetchone()[0]))
              except Exception as e: print(f'COUNT|{t}|ERROR|{type(e).__name__}')
          if 'production_history_attempts' in tables:
              cc=cols('production_history_attempts')
              if 'state' in cc:
                  print('HISTORY_ATTEMPTS_BY_STATE='+json.dumps(c.execute('select state,count(*) from production_history_attempts group by state order by count(*) desc').fetchall(),default=str))
              if 'attempted_at' in cc:
                  print('HISTORY_ATTEMPT_MAX='+str(c.execute('select max(attempted_at) from production_history_attempts').fetchone()[0]))
          if 'production_history' in tables:
              cc=cols('production_history')
              if 'downloaded_at' in cc: print('HISTORY_DOWNLOAD_MAX='+str(c.execute('select max(downloaded_at) from production_history').fetchone()[0]))
              if 'instrument_type' in cc: print('HISTORY_BY_FAMILY='+json.dumps(c.execute('select instrument_type,count(*) from production_history group by instrument_type order by instrument_type').fetchall(),default=str))
          if 'candidate_universe' in tables:
              cc=cols('candidate_universe')
              if 'instrument_type' in cc: print('UNIVERSE_BY_FAMILY='+json.dumps(c.execute('select instrument_type,count(*) from candidate_universe group by instrument_type order by instrument_type').fetchall(),default=str))
              if 'status' in cc: print('UNIVERSE_BY_STATUS='+json.dumps(c.execute('select status,count(*) from candidate_universe group by status order by count(*) desc').fetchall(),default=str))
          if 'api_health' in tables:
              cc=cols('api_health'); fields=[x for x in ['component','state','checked_at','last_success_at','source'] if x in cc]
              if fields:
                  rows=c.execute('select '+','.join(fields)+' from api_health order by component').fetchall()
                  print('API_HEALTH='+json.dumps([dict(zip(fields,r)) for r in rows],default=str))
          if 'source_sync' in tables:
              cc=cols('source_sync'); fields=[x for x in ['source','status','last_attempt_at','last_success_at','items'] if x in cc]
              if fields:
                  rows=c.execute('select '+','.join(fields)+' from source_sync order by source').fetchall()
                  print('SOURCE_SYNC='+json.dumps([dict(zip(fields,r)) for r in rows],default=str))
          c.close()
          print('RAW_STORAGE_MODE='+str(os.getenv('PPI_HISTORY_RAW_STORAGE_MODE')))
          PY
          echo '=== MARKET/CALENDAR ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import datetime
          import bf_production_paper_observer as obs
          now=datetime.datetime.now(obs.TZ)
          print('NOW='+now.isoformat())
          print('BUSINESS_DAY='+str(obs._business_day(now.date())))
          print('MARKET_PHASE='+str(obs._market_phase(now)))
          PY
          echo '=== TIMERS ==='
          systemctl list-timers --all --no-pager | grep -Ei 'porota|ppi|contract|history|histor' || true
          echo '=== SERVICES ==='
          systemctl list-units --type=service --all --no-pager | grep -Ei 'porota|ppi|contract|history|histor' || true
          echo '=== CONTRACT_EVIDENCE_FILES ==='
          find /opt/porota-trading /home/porotaadmin -maxdepth 5 -type f \( -iname '*contract*evidence*.json' -o -iname '*full*browser*.json' -o -iname '*ppi*web*.json' \) -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort | tail -30 || true
          echo '=== DASHBOARD_HTTP ==='
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os,urllib.request
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          for p in ['/','/vivo','/trading','/riesgo','/validacion','/aprendizaje','/historicos']:
              req=urllib.request.Request('http://127.0.0.1:8000'+p)
              if token:
                  req.add_header('Authorization','Bearer '+token); req.add_header('X-Dashboard-Token',token)
              try:
                  with urllib.request.urlopen(req,timeout=10) as r: body=r.read()
                  print(f'HTTP|{p}|{r.status}|bytes={len(body)}')
              except Exception as e:
                  print(f'HTTP|{p}|ERROR|{type(e).__name__}')
          PY
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo RUNTIME_MUTATION=NO
          REMOTE
