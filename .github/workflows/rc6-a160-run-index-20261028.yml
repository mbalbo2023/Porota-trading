name: RC6 A160 exact run index for frozen candidate

on:
  push:
    branches: [diagnostic/rc6-iol-source-health-ro-20261028]
    paths: [.github/workflows/rc6-a160-run-index-20261028.yml]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_DIAGNOSTIC_SHA: d39f2925355f9859396b2d33c4813ade5b7203f0
      EXPECTED_CANDIDATE_SHA: f1a565d9a08e153b93d75d2e3586b4ecdd0845ef
      EXPECTED_ARTIFACT_NAME: rc6-a160-held-preflight-ro-d39f2925355f9859396b2d33c4813ade5b7203f0
    steps:
      - name: Resolve and report the exact A160 Action without host contact
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          base=f'https://api.github.com/repos/{repo}'
          token=os.environ['GH_TOKEN']
          def api(path,body=None):
              request=urllib.request.Request(base+path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization':'Bearer '+token,
                           'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json'},
                  method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(request,timeout=20) as response:
                  return json.load(response)
          branch=urllib.parse.quote('diagnostic/rc6-a160-held-preflight-ro-20261028',safe='')
          target=os.environ['EXPECTED_DIAGNOSTIC_SHA']
          run=None
          for _ in range(64):
              rows=api('/actions/workflows/rc6-a160-held-preflight-readonly.yml/runs?branch='+branch+'&per_page=10')
              run=next((r for r in rows.get('workflow_runs',[]) if r.get('head_sha')==target),None)
              if run is not None and run.get('status')=='completed':
                  break
              time.sleep(15)
          if run is None:
              raise SystemExit('RC6_A160_RUN_NOT_FOUND')
          run_id=run['id']
          artifact='NONE'
          if run.get('status')=='completed':
              artifacts=api(f'/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
              match=next((a for a in artifacts if a.get('name')==os.environ['EXPECTED_ARTIFACT_NAME']),None)
              if match:
                  artifact=f"id={match['id']} bytes={match['size_in_bytes']} digest={match.get('digest')}"
          result=str(run.get('conclusion') or run.get('status'))
          body=(f'RC6 exact A160 host preflight run index for candidate `{os.environ["EXPECTED_CANDIDATE_SHA"]}`.\n\n'
                f'- Run: {run["html_url"]}\n- Diagnostic SHA: `{target}`\n'
                f'- Conclusion: **{result}**\n- Receipt artifact: `{artifact}`\n'
                '- This indexer makes no host request. The A160 job itself checks exact frozen artifact, '
                'Droplet identity, PAPER/0, paused timers, disk bytes/inodes and safety gates. '
                'A failed or absent host receipt is not GREEN.')
          api('/issues/732/comments',{'body':body})
          print(f'RC6_A160_RUN_ID={run_id}|CONCLUSION={result}|ARTIFACT={artifact}')
          if result!='success':
              raise SystemExit('RC6_A160_NOT_GREEN')
          PY
