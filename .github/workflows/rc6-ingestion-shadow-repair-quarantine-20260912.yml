name: RC6 ingestion shadow repair quarantine 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ingestion-shadow-repair-quarantine-20260912.yml']

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Quarantine polluted closeout identities and restore trusted universe
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }
          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"; case "$st" in active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 32;; esac
          done
          exec 8>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 600 8 || { echo ABORT=LEGACY_LOCK_BUSY; exit 33; }
          sudo -n install -d -m 0755 /run/porota-trading-history
          cat >/tmp/porota-ingest-repair-20260912.py <<'PY'
          import json,time,sqlite3
          from datetime import datetime, timezone
          import bf_production_paper_observer as m
          import bu_instrument_catalog as catalog
          from cv_history_store_adapter_hf6 import default_history_store

          RUN='RC6_INGEST_REPAIR_20260912'
          REASON='CLOSEOUT_OVERDISCOVERY_6462_EXTRA_IDENTITIES'
          LOCAL={'BYMA','ROFEX','A3','OTC'}; FOREIGN={'ACCIONES-USA','FCI-EXTERIOR'}
          DISCOVERY={
            'FCI':(('FONDO','RENTA','AHORRO','PPI','BALANZ','GALILEO','MONEY','PESOS','DOLAR','A','E','I','O','U','S','M','P'),('BYMA','OTC')),
            'LICITACIONES':(('LICITACION','LETRA','BONO','ON','A','E','I','O','U','S','M','P'),('BYMA','OTC')),
            'LEBAC':(('LEBAC','L','A','E','I','O','U','S','M','P'),('BYMA',)),
            'NOBAC':(('NOBAC','N','A','E','I','O','U','S','M','P'),('BYMA',)),
            'ETF':(('SPY','QQQ','DIA','IWM','ARGT','A','E','I','O','U','S','M','P'),('BYMA',)),
          }
          store=m.runtime_store()
          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); print(f'SAFETY_BEFORE={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              base=[dict(r) for r in c.execute("select ticker,instrument_type,market,currency,settlement,status,description,metadata_json from financial_instrument_catalog where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')")]
              current=[tuple(r) for r in c.execute("select ticker,instrument_type,market,currency,settlement from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')")]
          trusted={}
          for r in base:
              trusted[(r['ticker'],r['instrument_type'],r['market'],r['currency'],r['settlement'])]={**r,'source':'NORMALIZED_CATALOG_REPAIR'}
          key,secret=m._secret(); reader=m.ProductionMarketReader(key,secret,audit=store.audit_http); reader.login_once(); stats={}
          try:
              for fam,(queries,markets) in DISCOVERY.items():
                  st={'queries':0,'ok':0,'errors':0,'normalized':0}; stats[fam]=st
                  for q in queries:
                      for market in markets:
                          st['queries']+=1
                          try:
                              p=reader.search_instruments(q,fam,name=q,market=market); st['ok']+=1
                              for raw in p if isinstance(p,list) else []:
                                  try: rec=catalog.normalize_record(raw,'INMEDIATA' if fam=='FCI' else 'A-24HS',m.now_iso(),'ARG_LOCAL_API_REPAIR')
                                  except Exception: continue
                                  if rec['market'] not in LOCAL or rec['instrument_type'] in FOREIGN: continue
                                  k=(rec['ticker'],rec['instrument_type'],rec['market'],rec['currency'],rec['settlement'])
                                  trusted[k]={'ticker':rec['ticker'],'instrument_type':rec['instrument_type'],'market':rec['market'],'currency':rec['currency'],'settlement':rec['settlement'],'status':'API_DISCOVERED','description':rec['description'],'metadata_json':json.dumps(rec['raw'],ensure_ascii=False,default=str),'source':'PPI_PRODUCTION_SEARCH_REPAIR'}; st['normalized']+=1
                          except Exception as exc:
                              st['errors']+=1; print('DISCOVERY_ERROR='+json.dumps({'family':fam,'query':q,'market':market,'error':m.classify_read_error(exc)},sort_keys=True))
                          time.sleep(.04)
          finally: reader.close()
          errors=sum(v['errors'] for v in stats.values())
          cur=set(current); good=set(trusted); extra=cur-good; missing=good-cur
          good_coarse={(a,b,e) for a,b,c,d,e in good}; extra_coarse={(a,b,e) for a,b,c,d,e in extra}
          print('REPAIR_PREFLIGHT='+json.dumps({'current':len(cur),'trusted':len(good),'extra':len(extra),'missing':len(missing),'errors':errors,'coarse_overlap':len(good_coarse & extra_coarse)},sort_keys=True))
          assert len(cur)==8422 and len(good)==1960 and len(extra)==6462 and len(missing)==0 and errors==0 and len(good_coarse & extra_coarse)==0
          q_at=datetime.now(timezone.utc).isoformat()
          with store.connect() as c:
              c.execute('BEGIN IMMEDIATE')
              c.execute('CREATE TEMP TABLE trusted_full(ticker TEXT,instrument_type TEXT,market TEXT,currency TEXT,settlement TEXT,PRIMARY KEY(ticker,instrument_type,market,currency,settlement))')
              c.executemany('INSERT INTO trusted_full VALUES(?,?,?,?,?)',list(good))
              c.execute('CREATE TEMP TABLE extra_full(ticker TEXT,instrument_type TEXT,market TEXT,currency TEXT,settlement TEXT,PRIMARY KEY(ticker,instrument_type,market,currency,settlement))')
              c.executemany('INSERT INTO extra_full VALUES(?,?,?,?,?)',list(extra))
              c.execute('CREATE TEMP TABLE trusted_coarse(ticker TEXT,instrument_type TEXT,settlement TEXT,PRIMARY KEY(ticker,instrument_type,settlement))')
              c.executemany('INSERT OR IGNORE INTO trusted_coarse VALUES(?,?,?)',list(good_coarse))
              c.execute('CREATE TEMP TABLE extra_coarse(ticker TEXT,instrument_type TEXT,settlement TEXT,PRIMARY KEY(ticker,instrument_type,settlement))')
              c.executemany('INSERT OR IGNORE INTO extra_coarse VALUES(?,?,?)',list(extra_coarse))
              overlap=c.execute('select count(*) from extra_coarse e join trusted_coarse t using(ticker,instrument_type,settlement)').fetchone()[0]; assert overlap==0

              c.execute("CREATE TABLE IF NOT EXISTS ppi_argentina_api_shadow_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM ppi_argentina_api_shadow WHERE 0")
              c.execute("INSERT INTO ppi_argentina_api_shadow_quarantine_rc6 SELECT s.*,?,?,? FROM ppi_argentina_api_shadow s JOIN extra_full e USING(ticker,instrument_type,market,currency,settlement)",(REASON,RUN,q_at))
              qshadow=c.execute('select changes()').fetchone()[0]

              c.execute("CREATE TABLE IF NOT EXISTS production_history_attempts_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM production_history_attempts WHERE 0")
              c.execute("INSERT INTO production_history_attempts_quarantine_rc6 SELECT p.*,?,?,? FROM production_history_attempts p JOIN extra_coarse e ON e.ticker=p.symbol AND e.instrument_type=p.instrument_type AND e.settlement=p.settlement",(REASON,RUN,q_at))
              qattempt=c.execute('select changes()').fetchone()[0]
              c.execute("CREATE TABLE IF NOT EXISTS production_history_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM production_history WHERE 0")
              c.execute("INSERT INTO production_history_quarantine_rc6 SELECT p.*,?,?,? FROM production_history p JOIN extra_coarse e ON e.ticker=p.symbol AND e.instrument_type=p.instrument_type AND e.settlement=p.settlement",(REASON,RUN,q_at))
              qhist=c.execute('select changes()').fetchone()[0]

              tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              qclass=0
              if 'ppi_api_closeout_classification_rc6' in tables:
                  c.execute("CREATE TABLE IF NOT EXISTS ppi_api_closeout_classification_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM ppi_api_closeout_classification_rc6 WHERE 0")
                  c.execute("INSERT INTO ppi_api_closeout_classification_quarantine_rc6 SELECT p.*,?,?,? FROM ppi_api_closeout_classification_rc6 p JOIN extra_full e USING(ticker,instrument_type,market,currency,settlement)",(REASON,RUN,q_at)); qclass=c.execute('select changes()').fetchone()[0]
                  c.execute("DELETE FROM ppi_api_closeout_classification_rc6 WHERE EXISTS (SELECT 1 FROM extra_full e WHERE e.ticker=ppi_api_closeout_classification_rc6.ticker AND e.instrument_type=ppi_api_closeout_classification_rc6.instrument_type AND e.market=ppi_api_closeout_classification_rc6.market AND e.currency=ppi_api_closeout_classification_rc6.currency AND e.settlement=ppi_api_closeout_classification_rc6.settlement)")

              c.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_ledger_ids_rc6(id INTEGER PRIMARY KEY,quarantine_reason TEXT NOT NULL,quarantine_run TEXT NOT NULL,quarantined_at TEXT NOT NULL)')
              if 'history_attempt_ledger_v2' in tables:
                  c.execute("INSERT OR IGNORE INTO ppi_ingest_quarantine_ledger_ids_rc6 SELECT l.id,?,?,? FROM history_attempt_ledger_v2 l JOIN extra_coarse e ON e.ticker=l.symbol AND e.instrument_type=l.instrument_type AND e.settlement=l.settlement",(REASON,RUN,q_at))
              c.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_rejection_ids_rc6(id INTEGER PRIMARY KEY,quarantine_reason TEXT NOT NULL,quarantine_run TEXT NOT NULL,quarantined_at TEXT NOT NULL)')
              if 'history_row_rejections_v2' in tables:
                  c.execute("INSERT OR IGNORE INTO ppi_ingest_quarantine_rejection_ids_rc6 SELECT DISTINCT r.id,?,?,? FROM history_row_rejections_v2 r JOIN extra_full e ON e.ticker=r.symbol AND e.instrument_type=r.instrument_type AND e.market=r.market AND e.settlement=r.settlement",(REASON,RUN,q_at))
              c.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_raw_ids_rc6(id INTEGER PRIMARY KEY,quarantine_reason TEXT NOT NULL,quarantine_run TEXT NOT NULL,quarantined_at TEXT NOT NULL)')
              if 'historical_raw_archive' in tables:
                  raw=c.execute("select id,body_json from historical_raw_archive where origin='PPI_HISTORY_ARGENTINA_API_CLOSEOUT'").fetchall(); marks=[]
                  extra4={(a,b,c,e) for a,b,c,d,e in extra}
                  for rr in raw:
                      try:
                          body=json.loads(rr['body_json']); k=(str(body.get('symbol') or '').upper(),str(body.get('asset_class') or '').upper(),str(body.get('market') or '').upper(),str(body.get('settlement') or '').upper())
                          if k in extra4: marks.append((int(rr['id']),REASON,RUN,q_at))
                      except Exception: pass
                  if marks: c.executemany('INSERT OR IGNORE INTO ppi_ingest_quarantine_raw_ids_rc6 VALUES(?,?,?,?)',marks)

              c.execute("DELETE FROM production_history WHERE EXISTS (SELECT 1 FROM extra_coarse e WHERE e.ticker=production_history.symbol AND e.instrument_type=production_history.instrument_type AND e.settlement=production_history.settlement)")
              dhist=c.execute('select changes()').fetchone()[0]
              c.execute("DELETE FROM production_history_attempts WHERE EXISTS (SELECT 1 FROM extra_coarse e WHERE e.ticker=production_history_attempts.symbol AND e.instrument_type=production_history_attempts.instrument_type AND e.settlement=production_history_attempts.settlement)")
              dattempt=c.execute('select changes()').fetchone()[0]
              c.execute("DELETE FROM ppi_argentina_api_shadow WHERE EXISTS (SELECT 1 FROM extra_full e WHERE e.ticker=ppi_argentina_api_shadow.ticker AND e.instrument_type=ppi_argentina_api_shadow.instrument_type AND e.market=ppi_argentina_api_shadow.market AND e.currency=ppi_argentina_api_shadow.currency AND e.settlement=ppi_argentina_api_shadow.settlement)")
              dshadow=c.execute('select changes()').fetchone()[0]
              if 'ppi_web_residual_manifest_rc6' in tables:
                  c.execute("DELETE FROM ppi_web_residual_manifest_rc6 WHERE NOT EXISTS (SELECT 1 FROM trusted_full t WHERE t.ticker=ppi_web_residual_manifest_rc6.ticker AND t.instrument_type=ppi_web_residual_manifest_rc6.instrument_type AND t.market=ppi_web_residual_manifest_rc6.market AND t.currency=ppi_web_residual_manifest_rc6.currency AND t.settlement=ppi_web_residual_manifest_rc6.settlement)")

              c.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_repair_runs_rc6(run_id TEXT PRIMARY KEY,repaired_at TEXT NOT NULL,reason TEXT NOT NULL,shadow_quarantined INTEGER,attempts_quarantined INTEGER,history_quarantined INTEGER,classifications_quarantined INTEGER,shadow_deleted INTEGER,attempts_deleted INTEGER,history_deleted INTEGER,details_json TEXT NOT NULL)')
              c.execute('INSERT OR REPLACE INTO ppi_ingest_repair_runs_rc6 VALUES(?,?,?,?,?,?,?,?,?,?,?)',(RUN,q_at,REASON,qshadow,qattempt,qhist,qclass,dshadow,dattempt,dhist,json.dumps({'trusted':len(good),'extra':len(extra),'discovery_stats':stats},sort_keys=True)))
              shadow_after=c.execute("select count(*) from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')").fetchone()[0]
              assert shadow_after==1960
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              print('OBSERVER_REPAIR='+json.dumps({'shadow_q':qshadow,'attempt_q':qattempt,'history_q':qhist,'class_q':qclass,'shadow_deleted':dshadow,'attempt_deleted':dattempt,'history_deleted':dhist,'shadow_after':shadow_after},sort_keys=True))

          # Dedicated History Store: keep append-only versions, remove contaminated rows only from canonical active views.
          hstore=default_history_store(); extra4={(a,b,c,e) for a,b,c,d,e in extra}
          with hstore.connect() as h:
              h.execute('BEGIN IMMEDIATE')
              ht={r[0] for r in h.execute("select name from sqlite_master where type='table'")}
              h.execute('CREATE TEMP TABLE extra_identity(symbol TEXT,instrument_type TEXT,market TEXT,settlement TEXT,PRIMARY KEY(symbol,instrument_type,market,settlement))')
              h.executemany('INSERT OR IGNORE INTO extra_identity VALUES(?,?,?,?)',list(extra4))
              h.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_identity_rc6(symbol TEXT,instrument_type TEXT,market TEXT,settlement TEXT,quarantine_reason TEXT,quarantine_run TEXT,quarantined_at TEXT,PRIMARY KEY(symbol,instrument_type,market,settlement,quarantine_run))')
              h.executemany('INSERT OR IGNORE INTO ppi_ingest_quarantine_identity_rc6 VALUES(?,?,?,?,?,?,?)',[(a,b,c,d,REASON,RUN,q_at) for a,b,c,d in extra4])
              canon_q=close_q=0
              if 'history_canonical_v2' in ht:
                  h.execute("CREATE TABLE IF NOT EXISTS history_canonical_v2_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM history_canonical_v2 WHERE 0")
                  h.execute("INSERT INTO history_canonical_v2_quarantine_rc6 SELECT x.*,?,?,? FROM history_canonical_v2 x JOIN extra_identity e ON e.symbol=x.symbol AND e.instrument_type=x.instrument_type AND e.market=x.market AND e.settlement=x.settlement",(REASON,RUN,q_at)); canon_q=h.execute('select changes()').fetchone()[0]
                  h.execute("DELETE FROM history_canonical_v2 WHERE EXISTS (SELECT 1 FROM extra_identity e WHERE e.symbol=history_canonical_v2.symbol AND e.instrument_type=history_canonical_v2.instrument_type AND e.market=history_canonical_v2.market AND e.settlement=history_canonical_v2.settlement)")
              if 'history_close_canonical_v1' in ht:
                  h.execute("CREATE TABLE IF NOT EXISTS history_close_canonical_v1_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM history_close_canonical_v1 WHERE 0")
                  h.execute("INSERT INTO history_close_canonical_v1_quarantine_rc6 SELECT x.*,?,?,? FROM history_close_canonical_v1 x JOIN extra_identity e ON e.symbol=x.symbol AND e.instrument_type=x.instrument_type AND e.market=x.market AND e.settlement=x.settlement",(REASON,RUN,q_at)); close_q=h.execute('select changes()').fetchone()[0]
                  h.execute("DELETE FROM history_close_canonical_v1 WHERE EXISTS (SELECT 1 FROM extra_identity e WHERE e.symbol=history_close_canonical_v1.symbol AND e.instrument_type=history_close_canonical_v1.instrument_type AND e.market=history_close_canonical_v1.market AND e.settlement=history_close_canonical_v1.settlement)")
              h.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_version_ids_rc6(id INTEGER PRIMARY KEY,table_name TEXT,quarantine_reason TEXT,quarantine_run TEXT,quarantined_at TEXT)')
              if 'history_versions_v2' in ht:
                  h.execute("INSERT OR IGNORE INTO ppi_ingest_quarantine_version_ids_rc6 SELECT v.id,'history_versions_v2',?,?,? FROM history_versions_v2 v JOIN extra_identity e ON e.symbol=v.symbol AND e.instrument_type=v.instrument_type AND e.market=v.market AND e.settlement=v.settlement",(REASON,RUN,q_at))
              if 'history_close_versions_v1' in ht:
                  # negative id namespace avoids collision with full-OHLC version ids in the marker table
                  for r in h.execute("select v.id from history_close_versions_v1 v join extra_identity e on e.symbol=v.symbol and e.instrument_type=v.instrument_type and e.market=v.market and e.settlement=v.settlement"):
                      h.execute('INSERT OR IGNORE INTO ppi_ingest_quarantine_version_ids_rc6 VALUES(?,?,?,?,?)',(-int(r[0]),'history_close_versions_v1',REASON,RUN,q_at))
              assert h.execute('pragma quick_check').fetchone()[0]=='ok'
              print('HISTORY_STORE_REPAIR='+json.dumps({'canonical_quarantined':canon_q,'close_canonical_quarantined':close_q,'versions_preserved':True},sort_keys=True))

          with store.connect() as c:
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              shadow=c.execute("select count(*) from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')").fetchone()[0]
              classified=c.execute("select count(*) from ppi_argentina_api_shadow s join production_history_attempts p on p.symbol=s.ticker and p.instrument_type=s.instrument_type and p.settlement=s.settlement where s.market in ('BYMA','ROFEX','A3','OTC') and s.instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')").fetchone()[0]
              unclassified=c.execute("select count(*) from ppi_argentina_api_shadow s left join production_history_attempts p on p.symbol=s.ticker and p.instrument_type=s.instrument_type and p.settlement=s.settlement where s.market in ('BYMA','ROFEX','A3','OTC') and s.instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR') and p.symbol is null").fetchone()[0]
              coarse_coll=c.execute("select count(*) from (select ticker,instrument_type,settlement,count(*) n from ppi_argentina_api_shadow group by 1,2,3 having n>1)").fetchone()[0]
              print('REPAIR_FINAL='+json.dumps({'shadow':shadow,'classified_join':classified,'unclassified':unclassified,'trusted_coarse_collision_groups':coarse_coll,'safety':f'{s[0]}|{s[1]}'},sort_keys=True))
              assert shadow==1960 and c.execute('pragma quick_check').fetchone()[0]=='ok'
          print('REPAIR_STATUS=SUCCESS_QUARANTINED_NOT_SILENTLY_DROPPED'); print('WEB_HISTORY_GATE=BLOCKED_PENDING_TRUSTED_CLOSEOUT_AND_CURRENCY_KEY_RECONCILIATION'); print('ORDER_ROUTES=NOT_CALLED'); print('REAL_ORDERS_SENT=0')
          PY
          sudo -n flock -w 600 /run/porota-trading-history/ppi-fullfamily-history.lock /usr/bin/docker exec -i porota_production_observer python - < /tmp/porota-ingest-repair-20260912.py
          rm -f /tmp/porota-ingest-repair-20260912.py
          HOST
