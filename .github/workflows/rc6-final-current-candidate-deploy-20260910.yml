name: RC6 Final Current Candidate Deploy 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-final-current-candidate-deploy-20260910.yml

permissions:
  contents: read

concurrency:
  group: rc6-final-current-candidate-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy pinned RC6 functional candidate without automatic rollback
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          umask 077

          REPO=/opt/porota-trading
          TARGET_BRANCH=fix/rc6-w10-sector-map-binding-20260910
          TARGET_SHA=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          CANDIDATE_IMAGE=porota-trading-bot:17.0.0-rc6-candidate-f8adec8a
          WORKTREE="/tmp/porota-rc6-final-f8adec8a-$$"
          ACTIVATION_STARTED=NO

          cleanup() {
            set +e
            if [ -d "$WORKTREE" ]; then
              git -C "$REPO" worktree remove --force "$WORKTREE" >/dev/null 2>&1 || rm -rf "$WORKTREE"
            fi
            git -C "$REPO" worktree prune >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo '=== POROTA RC6 FINAL CURRENT CANDIDATE DEPLOY ==='
          echo "TARGET_SHA=$TARGET_SHA"
          echo "UTC_START=$(date -u +%FT%TZ)"
          echo 'AUTO_ROLLBACK=DISABLED'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'

          test "$(git -C "$REPO" diff --name-only | wc -l | tr -d ' ')" = 0
          test "$(git -C "$REPO" diff --cached --name-only | wc -l | tr -d ' ')" = 0
          DISK_BEFORE="$(df -PB1 "$REPO" | awk 'NR==2{print $4}')"
          echo "DISK_FREE_BEFORE=$DISK_BEFORE"
          test "$DISK_BEFORE" -ge 8589934592

          PRE_SAFETY="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close()
          print('|'.join(map(str,(q,*row))))
          PY
          )"
          echo "PRE_SAFETY=$PRE_SAFETY"
          test "$PRE_SAFETY" = 'ok|PRODUCTION_PAPER|0'
          PRE_HEALTH="$(curl -fsS http://127.0.0.1:8000/health)"
          echo "PRE_HEALTH=$PRE_HEALTH"
          python3 - "$PRE_HEALTH" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1]); assert x.get('status')=='ok'; assert x.get('version')=='17.0.0-rc6'
          PY

          echo '=== FETCH PINNED TARGET ==='
          git -C "$REPO" fetch --no-tags origin "$TARGET_BRANCH"
          git -C "$REPO" cat-file -e "$TARGET_SHA^{commit}"
          git -C "$REPO" merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD
          echo "FETCHED_TARGET=$(git -C "$REPO" rev-parse "$TARGET_SHA")"

          echo '=== UNTRACKED COLLISION GATE ==='
          python3 - "$REPO" "$TARGET_SHA" <<'PY'
          import subprocess,sys
          repo,sha=sys.argv[1:]
          def z(args):
              raw=subprocess.check_output(args)
              return {x.decode('utf-8','surrogateescape') for x in raw.split(b'\0') if x}
          untracked=z(['git','-C',repo,'ls-files','--others','--exclude-standard','-z'])
          tracked=z(['git','-C',repo,'ls-tree','-r','--name-only','-z',sha])
          collisions=sorted(untracked & tracked)
          print(f'HOST_UNTRACKED_COUNT={len(untracked)}')
          print(f'TARGET_TRACKED_COUNT={len(tracked)}')
          print(f'UNTRACKED_TARGET_COLLISIONS={len(collisions)}')
          if collisions:
              print('\n'.join(collisions[:50]))
              raise SystemExit(4)
          PY

          git -C "$REPO" worktree add --detach "$WORKTREE" "$TARGET_SHA"
          test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$TARGET_SHA"

          echo '=== CANDIDATE IDENTITY ==='
          PYTHONPATH="$WORKTREE" python3 - <<'PY'
          import _version as v
          assert v.VERSION == '17.0.0-rc6'
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('RC6_SOURCE_IDENTITY=GREEN')
          PY

          echo '=== BUILD UNIQUE CANDIDATE IMAGE ==='
          sudo -n docker build --pull=false \
            --label "porota.commit=$TARGET_SHA" \
            --label 'porota.version=17.0.0-rc6' \
            -t "$CANDIDATE_IMAGE" "$WORKTREE"
          CANDIDATE_ID="$(sudo -n docker image inspect "$CANDIDATE_IMAGE" -f '{{.Id}}')"
          CANDIDATE_COMMIT="$(sudo -n docker image inspect "$CANDIDATE_IMAGE" -f '{{ index .Config.Labels "porota.commit" }}')"
          echo "CANDIDATE_IMAGE_ID=$CANDIDATE_ID"
          echo "CANDIDATE_IMAGE_COMMIT=$CANDIDATE_COMMIT"
          test "$CANDIDATE_COMMIT" = "$TARGET_SHA"

          DISK_AFTER_BUILD="$(df -PB1 "$REPO" | awk 'NR==2{print $4}')"
          echo "DISK_FREE_AFTER_BUILD=$DISK_AFTER_BUILD"
          test "$DISK_AFTER_BUILD" -ge 6442450944

          echo '=== OFFLINE PRE-ACTIVATION PROOF ==='
          sudo -n docker run --rm -i --pull never --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --entrypoint python "$CANDIDATE_IMAGE" - <<'PY'
          import _version as v
          import porota_mode_manager as m
          s=m.paper_settings({})
          assert v.VERSION=='17.0.0-rc6'
          assert v.MODE=='PRODUCTION_PAPER'
          assert v.EXECUTION=='SIMULATED'
          assert v.REAL_ORDER_CAPABILITY=='BLOCKED'
          assert s['PAPER_ECONOMIC_GATE_MODE']=='SHADOW'
          assert s['PAPER_EXPECTANCY_POLICY']=='OBSERVATION_ONLY'
          assert s['PAPER_MARKET_REGIME_POLICY']=='ALERT_ONLY'
          assert s['PAPER_SECTOR_CONCENTRATION_POLICY']=='BINDING'
          assert str(s['PAPER_MAX_POSITIONS_PER_SECTOR'])=='2'
          print('OFFLINE_POLICY_PROOF=GREEN')
          PY

          sudo -n docker run --rm --pull never --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
            --entrypoint python "$CANDIDATE_IMAGE" -m pytest -q -p no:cacheprovider \
            tests/test_hotfix_rc3_hf4.py \
            tests/test_hotfix_rc3_hf6.py \
            tests/test_intraday_scalping_hf3.py
          echo 'OFFLINE_CANDIDATE_TESTS=GREEN'

          echo '=== SNAPSHOT PRE-ACTIVATION DB SCHEMA ==='
          PRE_SCHEMA="$(mktemp)"
          POST_SCHEMA="$(mktemp)"
          sudo -n docker exec -i porota_production_observer python - <<'PY' > "$PRE_SCHEMA"
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          for row in c.execute("SELECT type,name,coalesce(sql,'') FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"):
              print('\t'.join(str(x).replace('\n',' ') for x in row))
          c.close()
          PY

          echo '=== ACTIVATE PINNED RC6 ==='
          git -C "$REPO" checkout -f --detach "$TARGET_SHA"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$TARGET_SHA"
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          test "$(sudo -n docker image inspect "$TARGET_IMAGE" -f '{{ index .Config.Labels "porota.commit" }}')" = "$TARGET_SHA"
          ACTIVATION_STARTED=YES
          echo "ACTIVATION_STARTED=$ACTIVATION_STARTED"
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation

          echo '=== WAIT HEALTH ==='
          HEALTH_OK=NO
          for _ in $(seq 1 45); do
            if H="$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null)"; then
              if python3 - "$H" <<'PY' >/dev/null 2>&1
          import json,sys
          x=json.loads(sys.argv[1]); assert x.get('status')=='ok' and x.get('version')=='17.0.0-rc6'
          PY
              then HEALTH_OK=YES; break; fi
            fi
            sleep 2
          done
          echo "HEALTH_OK=$HEALTH_OK"
          test "$HEALTH_OK" = YES

          echo '=== POST-ACTIVATION SAFETY ==='
          OBS="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)"
          DASH="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)"
          echo "OBSERVER=$OBS"
          echo "DASHBOARD=$DASH"
          test "$OBS" = "true|$TARGET_IMAGE|0|true"
          test "$DASH" = "true|$TARGET_IMAGE|0"

          CANONICAL_ID="$(sudo -n docker image inspect "$TARGET_IMAGE" -f '{{.Id}}')"
          OBS_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_production_observer)"
          DASH_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_production_dashboard)"
          echo "CANONICAL_IMAGE_ID=$CANONICAL_ID"
          echo "OBSERVER_IMAGE_ID=$OBS_ID"
          echo "DASHBOARD_IMAGE_ID=$DASH_ID"
          test "$OBS_ID" = "$CANONICAL_ID"
          test "$DASH_ID" = "$CANONICAL_ID"
          DEPLOYED_COMMIT="$(sudo -n docker image inspect "$OBS_ID" -f '{{ index .Config.Labels "porota.commit" }}')"
          echo "DEPLOYED_IMAGE_COMMIT=$DEPLOYED_COMMIT"
          test "$DEPLOYED_COMMIT" = "$TARGET_SHA"

          POST_SAFETY="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          vals=[]
          row=None
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=10)
              c.execute('PRAGMA query_only=ON')
              vals.append(c.execute('PRAGMA quick_check').fetchone()[0])
              if p.endswith('observer_v17.db'):
                  row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              c.close()
          print('|'.join(map(str,(*vals,*row))))
          PY
          )"
          echo "POST_SAFETY=$POST_SAFETY"
          test "$POST_SAFETY" = 'ok|ok|PRODUCTION_PAPER|0'

          sudo -n docker exec -i porota_production_observer python - <<'PY' > "$POST_SCHEMA"
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          for row in c.execute("SELECT type,name,coalesce(sql,'') FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"):
              print('\t'.join(str(x).replace('\n',' ') for x in row))
          c.close()
          PY
          python3 - "$PRE_SCHEMA" "$POST_SCHEMA" <<'PY'
          import sys
          pre=set(open(sys.argv[1],encoding='utf-8').read().splitlines())
          post=set(open(sys.argv[2],encoding='utf-8').read().splitlines())
          missing=sorted(pre-post)
          print(f'PRE_SCHEMA_OBJECTS={len(pre)}')
          print(f'POST_SCHEMA_OBJECTS={len(post)}')
          print(f'DESTRUCTIVE_SCHEMA_CHANGES={len(missing)}')
          if missing:
              print('\n'.join(missing[:50]))
              raise SystemExit(5)
          PY
          rm -f "$PRE_SCHEMA" "$POST_SCHEMA"

          echo '=== TIMER / W12 / FUNCTIONAL HEALTH POSTFLIGHT ==='
          required_timers=(
            porota-contract-evidence-rc6.timer
            porota-functional-health-rc6.timer
            porota-history-postclose-rc6.timer
            porota-host-general-backup-rc6.timer
            porota-preopen-rc6.timer
            porota-candle-integrity-rc6.timer
            porota-a3-history-daily-rc6.timer
            porota-a3-history-reconcile-rc6.timer
            porota-a3-history-weekend-rc6.timer
          )
          for unit in "${required_timers[@]}"; do
            active="$(sudo -n systemctl is-active "$unit" 2>/dev/null || true)"
            enabled="$(sudo -n systemctl is-enabled "$unit" 2>/dev/null || true)"
            echo "UNIT=$unit|ACTIVE=$active|ENABLED=$enabled"
            test "$active" = active
            test "$enabled" = enabled
          done

          sudo -n systemctl start porota-functional-health-rc6.service
          test "$(sudo -n systemctl show porota-functional-health-rc6.service -p Result --value)" = success
          echo 'FUNCTIONAL_HEALTH_SERVICE=GREEN'

          python3 - "$REPO" <<'PY' > /tmp/porota_rc6_latest_capture_path
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])/'data/contract_evidence/rc6_trusted'
          files=list(root.glob('contract_*.json'))
          if not files: raise SystemExit(2)
          print(max(files,key=lambda p:p.stat().st_mtime))
          PY
          HOST_CAPTURE="$(cat /tmp/porota_rc6_latest_capture_path)"
          rm -f /tmp/porota_rc6_latest_capture_path
          echo "LATEST_HOST_CAPTURE=$HOST_CAPTURE"
          stat -c 'LATEST_HOST_CAPTURE_STAT=%a|%u|%g|%s|%y' "$HOST_CAPTURE"
          test "$(stat -c '%a' "$HOST_CAPTURE")" = 640
          test "$(stat -c '%g' "$HOST_CAPTURE")" = "$(sudo -n docker exec porota_production_observer id -g)"
          REL="${HOST_CAPTURE#"$REPO/data/}"
          sudo -n docker exec porota_production_observer test -r "/app/data/$REL"
          echo 'W12_CAPTURE_READABLE=YES'

          echo '=== SOAK ==='
          sleep 60
          FINAL_HEALTH="$(curl -fsS http://127.0.0.1:8000/health)"
          echo "FINAL_HEALTH=$FINAL_HEALTH"
          FINAL_SAFETY="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close()
          print('|'.join(map(str,(q,*row))))
          PY
          )"
          echo "FINAL_SAFETY=$FINAL_SAFETY"
          test "$FINAL_SAFETY" = 'ok|PRODUCTION_PAPER|0'
          test "$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_observer)" = 0
          test "$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_dashboard)" = 0
          test "$(git -C "$REPO" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$REPO" diff --name-only | wc -l | tr -d ' ')" = 0
          test "$(git -C "$REPO" diff --cached --name-only | wc -l | tr -d ' ')" = 0

          echo "HOST_SHA_FINAL=$(git -C "$REPO" rev-parse HEAD)"
          echo "DEPLOYED_IMAGE_COMMIT_FINAL=$(sudo -n docker image inspect "$(sudo -n docker inspect -f '{{.Image}}' porota_production_observer)" -f '{{ index .Config.Labels "porota.commit" }}')"
          echo "UTC_END=$(date -u +%FT%TZ)"
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDERS_SENT=0'
          echo 'RC6_FINAL_DEPLOY=GREEN'
          HOST
