name: RC6 733 backup retire inventory read-only

on:
  push:
    branches:
      - diagnostic/rc6-733-backup-inventory-readonly-20261024
    paths:
      - .github/workflows/rc6-733-backup-inventory-readonly.yml
      - scripts/rc6_733_backup_inventory_readonly.py

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      CANDIDATE_SHA: 4bba1335cc1875c6feb6d8a75aea141c31b83653
      CANDIDATE_TREE: bbdf7f979e7b7092e0705f8037b3cb65f4865546
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory exact candidate backup retire allowlist without mutation
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          EXPECTED=$'.github/workflows/rc6-733-backup-inventory-readonly.yml\nscripts/rc6_733_backup_inventory_readonly.py'
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = "$EXPECTED"
          python3 -m py_compile scripts/rc6_733_backup_inventory_readonly.py
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_733_backup_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_733_backup_readonly" "$HOME/.ssh/known_hosts"
          SOURCE_B64="$(base64 -w0 scripts/rc6_679_backup_suspension.py)"
          SOURCE_SHA="$(sha256sum scripts/rc6_679_backup_suspension.py | cut -d' ' -f1)"
          PROBE_B64="$(base64 -w0 scripts/rc6_733_backup_inventory_readonly.py)"
          timeout 45 ssh -i "$HOME/.ssh/rc6_733_backup_readonly" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 30 python3 -c 'import base64;exec(base64.b64decode(\"$PROBE_B64\"))' '$SOURCE_B64' '$SOURCE_SHA' '$CANDIDATE_SHA' '$CANDIDATE_TREE'"
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/rc6_733_backup_readonly"
