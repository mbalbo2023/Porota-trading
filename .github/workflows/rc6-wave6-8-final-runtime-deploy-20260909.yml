name: RC6 Waves6-8 Final Runtime Deploy 2026-09-09

on:
  push:
    branches: [integration/rc6-wave6-8-convergence-20260909]
    paths:
      - '.github/workflows/rc6-wave6-8-final-runtime-deploy-20260909.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate converged Waves 6 7 8 candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest requests
          python -m py_compile cp_history_ingest_policy_hf6.py cq_history_attempt_ledger_hf6.py cr_data912_reconcile_hf6.py cs_postclose_history_scheduler_hf6.py ct_ppi_history_salvage_hf6.py cu_history_store_v2_hf6.py cv_history_store_adapter_hf6.py cw_data912_history_v2_sink.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py es_shadow_binding_contract_rc6.py et_shadow_learning_rc6.py bw_daily_risk.py p_risk_guardian.py ch_empirical_learning.py s_learning_engine.py ec_forward_lab_metrics_hf2.py ei_dashboard_table_accessibility_rc5.py eq_dashboard_table_layout_rc6.py er_dashboard_table_semantics_rc6.py da_dashboard_ux_hf6.py fb_raw_evidence_exact_v1.py
          PYTHONPATH=. pytest -q test_cp_history_ingest_policy_hf6.py test_hf6_history_data912_v2.py tests/test_history_freshness_metrics_rc5.py tests/test_history_close_only_hf2.py tests/test_shadow_binding_contract_rc6.py tests/test_shadow_learning_rc6.py tests/test_daily_risk_outbox_v17.py tests/test_forward_lab_metrics_hf2.py tests/test_dashboard_global_a11y_rc5.py tests/test_dashboard_table_layout_rc6.py tests/test_fb_raw_evidence_exact_v1.py
          ! git diff -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          echo WAVES_6_7_8_CANDIDATE=GREEN
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
      - name: Build candidate image
        run: docker build --pull=false -t porota-trading-bot:rc6-waves6-8-final .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_w678"
          chmod 600 "$HOME/.ssh/porota_w678"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy Waves 6 7 8 over definitive Wave4
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: integration/rc6-wave6-8-convergence-20260909
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_w678" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=90 "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          CURRENT=$(git rev-parse HEAD)
          echo "PRE_HEAD=$CURRENT"
          test "$CURRENT" = "fe87c1dbafd8a11833e8bdcac5b9173d9b075603"
          sudo -n docker inspect -f 'PRE_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'PRE_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]
          c.close()
          print(f'PRE_DB={q}|{mode}|{real}|LEGACY_RAW={raw}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0 and raw==0
          PY
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          TMP=$(mktemp -d "$HOME/porota-w678.XXXXXX")
          trap 'git -C /opt/porota-trading worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label porota.wave=rc6-waves6-8-final -t porota-trading-bot:17.0.0-rc6 "$TMP/source"
          git checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          git branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH" >/dev/null 2>&1 || true
          sudo -n python3 /opt/porota-trading/porota_mode_manager.py simulation
          sleep 15
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import os,sqlite3
          import cp_history_ingest_policy_hf6, cq_history_attempt_ledger_hf6, cr_data912_reconcile_hf6, cs_postclose_history_scheduler_hf6
          import fi_event_risk_shadow_rc6, fk_gdelt_shadow_feed_rc6, es_shadow_binding_contract_rc6, et_shadow_learning_rc6
          import ch_empirical_learning, s_learning_engine, ec_forward_lab_metrics_hf2, fb_raw_evidence_exact_v1
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]
          c.close()
          print(f'POST_DB={q}|{mode}|{real}|LEGACY_RAW={raw}')
          print('RAW_STORAGE_MODE='+str(os.getenv('PPI_HISTORY_RAW_STORAGE_MODE')))
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0 and raw==0
          assert os.getenv('PPI_HISTORY_RAW_STORAGE_MODE')=='EXTERNAL_EXACT_V1'
          print('WAVE6_RUNTIME=GREEN')
          print('WAVE7_RUNTIME=GREEN')
          print('WAVE8_RUNTIME=GREEN')
          PY
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import cl_contract_evidence_dashboard_hf6 as ce
          import bh_universe_dashboard_hf6 as u
          html=u._page()
          assert 'Evidencia contractual' in html
          print('WAVE5_REGRESSION_AFTER_W678=GREEN')
          PY
          echo "POST_HEAD=$(git rev-parse HEAD)"
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          echo WAVES_1_TO_8_RUNTIME_DEPLOY=GREEN
          REMOTE
