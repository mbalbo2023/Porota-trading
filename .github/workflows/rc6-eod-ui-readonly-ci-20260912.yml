name: RC6 EOD UI read-only CI 2026-09-12

on:
  push:
    branches: [analysis/rc6-eod-overnight-replay-20260912]
    paths:
      - 'bg_paper_dashboard.py'
      - 'fo_eod_overnight_dashboard_rc6.py'
      - 'tests/test_eod_overnight_dashboard_rc6.py'
      - '.github/workflows/rc6-eod-ui-readonly-ci-20260912.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile changed modules
        run: python -m py_compile bg_paper_dashboard.py fo_eod_overnight_dashboard_rc6.py tests/test_eod_overnight_dashboard_rc6.py
      - name: Run focused EOD UI regression tests
        run: python -m pytest -q -p no:cacheprovider --tb=short tests/test_eod_overnight_dashboard_rc6.py
      - name: Enforce PAPER safety identity
        run: |
          python - <<'PY'
          import _version as v
          assert v.MODE == 'PRODUCTION_PAPER'
          assert v.EXECUTION == 'SIMULATED'
          assert v.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('EOD_UI_CI=GREEN')
          print('REAL_ORDER_CAPABILITY=BLOCKED')
          PY
