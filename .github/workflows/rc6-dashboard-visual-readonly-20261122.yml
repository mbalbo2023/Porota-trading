name: RC6 audit effective timer schedules and guarded receipts

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Read timer directives and two sanitized status receipts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os,re
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          code="from pathlib import Path\nfrom datetime import datetime,timezone\nimport json,re,subprocess\ncfg=json.loads(\"{\\\"sha\\\":\\\"223725e2860b295533d480d6ad24aee46f098b8e\\\",\\\"names\\\":[\\\"porota-byma-morning-watch-rc6.timer\\\",\\\"porota-candle-integrity-rc6.timer\\\",\\\"porota-fast-functional-health-rc6.timer\\\",\\\"porota-full-db-integrity-rc6.timer\\\",\\\"porota-introspection-publish-rc6.timer\\\",\\\"porota-introspection-rc6.timer\\\",\\\"porota-iol-oauth-health-rc6.timer\\\",\\\"porota-iol-shadow-collector-rc6.timer\\\",\\\"porota-local-eod-history-rc6.timer\\\",\\\"porota-market-watch-silence-rc6.timer\\\",\\\"porota-preopen-rc6.timer\\\",\\\"porota-rc6-candle-inmarket-verify.timer\\\",\\\"porota-runtime-evidence-rc6.timer\\\",\\\"porota-scheduler-export-rc6.timer\\\",\\\"porota-snapshot-postclose-rc6.timer\\\",\\\"porota-snapshot-preopen-rc6.timer\\\"]}\")\nroot=Path(\"/opt/porota-trading\")\ndef metadata(path):\n    try:\n        if not path.is_symlink() and path.is_file() and path.stat().st_size <= 150000:\n            value=json.loads(path.read_text())\n            return value if isinstance(value,dict) else {}\n    except (OSError,ValueError):\n        pass\n    return {}\ndef value(v,regex):\n    return v if isinstance(v,str) and re.fullmatch(regex,v) else None\ndef enum(v):\n    return value(v,r\"[A-Z0-9_-]{1,105}\")\ndef stamp(v):\n    return value(v,r\"[0-9TZ:+.\\-]{1,40}\")\nrelease=metadata(root/\"data/deploy/CURRENT_STATE_V2.json\")\nassert release.get(\"deployment_sha\")==cfg[\"sha\"] and release.get(\"real_orders_sent\")==0\nsettings={}\nfor timer in cfg[\"names\"]:\n    assert re.fullmatch(r\"porota-[a-z0-9_.@-]+\\.timer\",timer)\n    result=subprocess.run([\"systemctl\",\"--no-pager\",\"cat\",timer],capture_output=True,text=True,timeout=5,check=False)\n    section=None\n    norm=[]\n    for raw_line in result.stdout.splitlines():\n        line=raw_line.strip()\n        if line.startswith(\"[\") and line.endswith(\"]\"):\n            section=line[1:-1]\n        if section==\"Timer\" and \"=\" in line:\n            key,val=line.split(\"=\",1)\n            if key in {\"OnCalendar\",\"OnBootSec\",\"OnActiveSec\",\"OnUnitActiveSec\",\"OnUnitInactiveSec\",\"AccuracySec\",\n                       \"RandomizedDelaySec\",\"Persistent\",\"Unit\",\"WakeSystem\",\"OnStartupSec\"} and (val==\"\" or\n                       value(val,r\"[a-zA-Z0-9_:./,*+~@\\- µ]{1,230}\") is not None):\n                norm.append([key,val])\n    settings[timer]={\"read\":result.returncode==0,\"directives\":norm}\ngate=metadata(Path.home()/\".config/porota-rc6/operator/paper-preopen-v2.json\")\niol=metadata(root/\"data/market/iol_oauth_guardian_state.json\")\nprint(json.dumps({\"observed_at\":datetime.now(timezone.utc).isoformat(),\"deployment_sha\":cfg[\"sha\"],\n    \"settings\":settings,\"preopen\":{\"receipt_present\":bool(gate),\"status\":enum(gate.get(\"status\")),\n    \"reason\":enum(gate.get(\"reason\")),\"phase\":enum(gate.get(\"phase\")),\"issued_at_ar\":stamp(gate.get(\"issued_at_ar\")),\n    \"bound_to_current\":bool(gate) and gate.get(\"candidate_sha\")==release.get(\"candidate_sha\")},\n    \"iol\":{\"receipt_present\":bool(iol),\"state\":enum(iol.get(\"state\")),\"reason\":enum(iol.get(\"reason\")),\n    \"failure_class\":enum(iol.get(\"failure_class\")),\"checked_at\":stamp(iol.get(\"checked_at\")),\n    \"http_status\":iol.get(\"http_status\") if type(iol.get(\"http_status\")) is int else None,\n    \"probe_attempts\":iol.get(\"probe_attempts\") if type(iol.get(\"probe_attempts\")) is int else None},\n    \"host_mutations\":0,\"provider_requests\":0},sort_keys=True))\n"
          with connection(os.environ) as (ssh,_,_):
              output=ssh_run(ssh,['/usr/bin/python3','-B','-'],data=code.encode(),timeout=80)
          if output.returncode:
              lines=re.findall(rb'File "<stdin>", line (\d+)',output.stderr[-8192:])
              reason=lines[-1].decode() if lines else 'unavailable'
              raise SystemExit('READ_ONLY_RUNTIME_DASHBOARD_UNAVAILABLE_AT_'+reason)
          receipt=json.loads(output.stdout)
          print(json.dumps({'timer_count': len(receipt['settings']), 'mutations': receipt['host_mutations'], 'provider_requests': receipt['provider_requests']}))
          Path(os.environ['RUNNER_TEMP'],'porota-effective-schedule.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: porota-effective-schedule
          path: ${{ runner.temp }}/porota-effective-schedule.json
          if-no-files-found: error
          retention-days: 14
