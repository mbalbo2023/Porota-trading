name: RC6 verify the first Scheduler export after deploy

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Read the timer snapshot after its natural refresh
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os,re
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          code="from datetime import datetime, timezone\nimport hashlib, json\nfrom pathlib import Path\nspec=json.loads(\"{\\\"merge\\\":\\\"223725e2860b295533d480d6ad24aee46f098b8e\\\",\\\"source\\\":\\\"f368d498d91e5cb542ef45e3511163b9de67a6c9\\\",\\\"hash\\\":\\\"f0fb53cf3c8dd960fde4b4bd4081ffcff7957ffdd30c3dbbd81b9af92f2ba16d\\\"}\")\nroot=Path(\"/opt/porota-trading\")\nmarker=json.loads((root/\"data/deploy/CURRENT_STATE_V2.json\").read_text())\nassert marker[\"deployment_sha\"]==spec[\"merge\"] and marker[\"candidate_sha\"]==spec[\"source\"]\nassert marker[\"validation_status\"]==\"VALIDATED_RUNTIME\" and marker[\"real_orders_sent\"]==0\nexporter=root/\"scripts/porota_export_scheduler_state_rc6.sh\"\nassert hashlib.sha256(exporter.read_bytes()).hexdigest()==spec[\"hash\"]\nsnapshot=json.loads((root/\"data/scheduler/systemd_timers.json\").read_text())\nnow=datetime.now(timezone.utc)\nrecorded=datetime.fromisoformat(snapshot[\"recorded_at\"])\ndeployed=datetime.fromisoformat(marker[\"recorded_at\"])\nunit=next(r for r in snapshot[\"timers\"] if r[\"unit\"]==\"porota-scheduler-export-rc6.timer\")\nprint(json.dumps({\"observed_at\":now.isoformat(),\"deployment_sha\":spec[\"merge\"],\n    \"recorded_at\":recorded.isoformat(),\"recorded_after_deploy\":recorded>=deployed,\n    \"seconds_old\":round((now-recorded).total_seconds(),2),\"state\":snapshot[\"state\"],\"rows\":len(snapshot[\"timers\"]),\n    \"monotonic_targets\":sum(bool(r.get(\"next_elapse_monotonic_at\")) for r in snapshot[\"timers\"]),\n    \"exporter\":{k:unit.get(k) for k in (\"active_state\",\"enabled_state\",\"last_result\",\"last_trigger\",\"next_elapse_monotonic_at\")},\n    \"mutations\":0},sort_keys=True))\n"
          with connection(os.environ) as (ssh,_,_):
              output=ssh_run(ssh,['/usr/bin/python3','-B','-'],data=code.encode(),timeout=45)
          if output.returncode:
              lines=re.findall(rb'File "<stdin>", line (\d+)',output.stderr[-8192:])
              reason=lines[-1].decode() if lines else 'unavailable'
              raise SystemExit('READ_ONLY_RUNTIME_DASHBOARD_UNAVAILABLE_AT_'+reason)
          receipt=json.loads(output.stdout)
          print(json.dumps(receipt,sort_keys=True))
          Path(os.environ['RUNNER_TEMP'],'scheduler-after-deploy.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-after-deploy
          path: ${{ runner.temp }}/scheduler-after-deploy.json
          if-no-files-found: error
          retention-days: 14
