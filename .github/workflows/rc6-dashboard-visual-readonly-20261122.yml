          python -m pip install -q -r "$RUNNER_TEMP/browser-dependencies.txt" 'playwright==1.55.0'
          PYTHONPATH="$GITHUB_WORKSPACE/candidate" python -B "$GITHUB_WORKSPACE/diagnostic/scripts/dashboard_visual_audit/verify_candidate.py" "$RUNNER_TEMP"
