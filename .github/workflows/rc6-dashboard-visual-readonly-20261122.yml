name: RC6 validation milestone dialog check

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout the isolated diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Playwright
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.55.0'
          command -v google-chrome >/dev/null

      - name: Review the installed read-only dashboard with Chromium
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python3 -B scripts/dashboard_visual_audit/live_probe.py

      - name: Upload filtered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-dashboard-visual-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/porota-dashboard-audit/host-facts.json
            ${{ runner.temp }}/porota-dashboard-audit/audit.json
            ${{ runner.temp }}/porota-dashboard-audit/*.png
          if-no-files-found: warn
          retention-days: 7
