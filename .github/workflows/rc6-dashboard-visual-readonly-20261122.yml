name: RC6 Scheduler execution evidence regression
on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths: [.github/workflows/rc6-dashboard-visual-readonly-20261122.yml]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 966a67283fc6197fb9ca7d865bf9e31bd66648f7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-change Scheduler, Dashboard and M0 tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "966a67283fc6197fb9ca7d865bf9e31bd66648f7"
          test "$(git rev-parse HEAD^{tree})" = "112dbeb0dac29dd4cba9291f160389925339f8d9"
          bash -n scripts/porota_export_scheduler_state_rc6.sh
          python -m pip install --disable-pip-version-check -q pytest==9.1.1
          python -m pytest -q \
            tests/test_rc6_scheduler_offhours_export.py \
            tests/test_rc6_679_scheduler_projection.py \
            tests/test_rc6_685_scheduler_visual_truth.py \
            tests/test_rc6_validation_dynamic_evidence.py \
            tests/test_rc6_postclose_validation_publish.py \
            tests/test_rc6_scheduler_operational_scope.py \
            tests/test_scheduler_dashboard_hf6.py | tee "$RUNNER_TEMP/scheduler-tests.txt"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scheduler-execution-tested-966a672
          path: ${{ runner.temp }}/scheduler-tests.txt
          if-no-files-found: error
          retention-days: 30
