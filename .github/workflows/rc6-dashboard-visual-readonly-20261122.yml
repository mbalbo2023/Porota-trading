name: RC6 Playwright READ_ONLY del release 202

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml
      - scripts/dashboard_visual_audit/live_probe.py
      - scripts/dashboard_visual_audit/browser_audit.py

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the isolated diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: diagnostic
          persist-credentials: false
      - name: Read the route inventory from the exact product tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 28f8337e9026fcfea6dace798d5c9e7267f85d8a
          path: product
          persist-credentials: false
      - name: Start Chromium in the Actions runner
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.55.0'
          command -v google-chrome >/dev/null
          python3 -B - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel='chrome', headless=True)
              print('CHROMIUM_START=OK ' + browser.version)
              browser.close()
          PY
      - name: Inspect the authenticated PAPER dashboard with only GET and HEAD
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse 'HEAD^{tree}')" = ae8d1932a78f378634b1fa325f18bc71654aee32
          PYTHONPATH="$GITHUB_WORKSPACE/product" python3 -B diagnostic/scripts/dashboard_visual_audit/live_probe.py
      - name: Preserve only the sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-dashboard-visual-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/porota-dashboard-audit/
          retention-days: 7
          if-no-files-found: warn
