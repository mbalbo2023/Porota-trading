name: RC6 verify deployed PAPER routes and evidence

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Verify deployed PAPER routes and evidence without writes
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os,re
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          code="EXPECTED=\"{\\\"merge\\\":\\\"223725e2860b295533d480d6ad24aee46f098b8e\\\",\\\"sha\\\":\\\"f368d498d91e5cb542ef45e3511163b9de67a6c9\\\",\\\"image\\\":\\\"sha256:48295734b3613947e036d9a4629ac3d560c4007e5a6358496eec296228d9cde2\\\",\\\"host_sources\\\":{\\\"rc6_scheduler_snapshot.py\\\":\\\"e44d458839e735b4c10cfa632c23c0d83a3ab2931250bf3028983f819ae09cf3\\\",\\\"scripts/porota_export_scheduler_state_rc6.sh\\\":\\\"f0fb53cf3c8dd960fde4b4bd4081ffcff7957ffdd30c3dbbd81b9af92f2ba16d\\\",\\\"ops_runtime_evidence_rc6.py\\\":\\\"4268c7be47d8cc96491a0ae473880db99c83b3e7f16cc9c05ecb04bbec82be91\\\"}}\"\nDASHBOARD=\"import json, os\\nfrom urllib.request import Request, urlopen\\n\\ntoken = os.environ[\\\"DASHBOARD_ACCESS_TOKEN\\\"]\\nroutes = (\\\"/health\\\", \\\"/sistema/evidencia\\\", \\\"/validacion\\\", \\\"/sistema/validacion\\\",\\n          \\\"/sistema/validacion?channel=campaign\\\", \\\"/sistema/scheduler\\\", \\\"/en-vivo\\\")\\nchecks = {}\\nfor path in routes:\\n    req = Request(\\\"http://127.0.0.1:8000\\\" + path, headers={\\\"Authorization\\\": \\\"Bearer \\\" + token})\\n    with urlopen(req, timeout=4) as resp:\\n        status = resp.status\\n        body = resp.read(2 * 1024**2 + 1)\\n    assert status == 200 and 0 < len(body) <= 2 * 1024**2\\n    if path == \\\"/health\\\":\\n        assert json.loads(body).get(\\\"status\\\") == \\\"ok\\\"\\n    if path.startswith(\\\"/validacion\\\") or path.startswith(\\\"/sistema/validacion\\\"):\\n        assert b\\\"data-view='sistema/validacion'\\\" in body\\n        assert \\\"Dinero real bloqueado por política RC6\\\".encode() in body\\n    checks[path] = {\\\"status\\\":status,\\\"bytes\\\":len(body)}\\nprint(json.dumps(checks))\\n\"\nfrom collections import Counter\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nimport hashlib, importlib.util, json, os, re, subprocess\n\nspec = json.loads(EXPECTED)\nroot = Path(\"/opt/porota-trading\")\ndata = root / \"data\"\ndeploy = data / \"deploy\"\nmarker_path = deploy / \"CURRENT_STATE_V2.json\"\nmarker = json.loads(marker_path.read_text())\nassert marker[\"validation_status\"] == \"VALIDATED_RUNTIME\" and marker[\"deployment_sha\"] == spec[\"merge\"]\nassert marker[\"candidate_sha\"] == spec[\"sha\"] and marker[\"image_id\"] == spec[\"image\"]\nassert marker[\"mode\"] == \"PRODUCTION_PAPER\" and marker[\"real_order_capability\"] == \"BLOCKED\"\nassert type(marker[\"real_orders_sent\"]) is int and marker[\"real_orders_sent\"] == 0\ndigests = {}\nfor name, expected in spec[\"host_sources\"].items():\n    path = root / name\n    assert path.is_file() and not path.is_symlink()\n    observed = hashlib.sha256(path.read_bytes()).hexdigest()\n    assert observed == expected\n    digests[name] = observed\n\ndocker = [\"/usr/bin/docker\", \"--host\",f\"unix:///run/user/{os.getuid()}/porota-rc6-docker.sock\"]\ndash = subprocess.check_output([*docker,\"ps\",\"--no-trunc\",\"--quiet\",\"--filter\",\"label=io.porota.project=rc6\",\n                                \"--filter\",\"label=io.porota.role=dashboard\"], text=True,timeout=5).strip()\nassert re.fullmatch(r\"[0-9a-f]{64}\", dash)\nactual = subprocess.check_output([*docker,\"inspect\",\"--format\",\"{{.Image}}\",dash],text=True,timeout=5).strip()\nassert actual == spec[\"image\"]\nhttp = subprocess.run([*docker,\"exec\",\"-i\",dash,\"python\",\"-B\",\"-\"],\n                      input=DASHBOARD,text=True,capture_output=True,timeout=35,check=False)\nif http.returncode:\n    raise SystemExit(\"READ_ONLY_HTTP_CHECK_FAILED\")\nroutes = json.loads(http.stdout)\n\nevidence_spec = importlib.util.spec_from_file_location(\"rc6_live_evidence\",root/\"ops_runtime_evidence_rc6.py\")\nevidence = importlib.util.module_from_spec(evidence_spec)\nevidence_spec.loader.exec_module(evidence)\nbundle = evidence.build_bundle(\n    db_path=data/\"paper_v17/observer_v17.db\", operation_mode_path=data/\"operation_mode.json\",\n    deploy_state_path=marker_path, frozen_path=deploy/\"porota-frozen-candidate.json\",\n    manifest_path=deploy/\"porota-deploy-bundle-v2-manifest.json\", previous_path=None,\n    freshness_seconds=86400, include_ppi_watch=False)\nevidence.validate_bundle(bundle)\ncounts = Counter()\nsample = []\nfor row in bundle[\"instruments\"]:\n    ident, cat = row[\"identity\"], row[\"catalog\"]\n    family = ident[\"family\"]\n    receipts = row.get(\"market_observation\",{}).get(\"native_reads\",[])\n    counts[family,\"identities\"] += 1\n    counts[family,\"catalog_literal\"] += int(\n        bool(cat.get(\"ppi_settlement_literal\")) and cat.get(\"settlement_source\") == \"PPI_FIELD\"\n        and cat.get(\"settlement_state\") not in (\"LITERAL_MISMATCH\",\"NO_VERIFICADO\"))\n    counts[family,\"matched_read_literals\"] += sum(bool(r.get(\"response_settlement_literal\"))\n        and r.get(\"settlement_matches_request\") is True for r in receipts)\n    if ident[\"ticker\"] in {\"AL30\",\"GD30\",\"GGAL\",\"AAPL\",\"YMCID\",\"D30N6\",\"PESOS1\"}:\n        sample.append({\n            **{k:ident[k] for k in (\"ticker\",\"family\",\"market\",\"currency\",\"settlement\")},\n            \"catalog_literal\":cat.get(\"ppi_settlement_literal\"),\"source\":cat.get(\"settlement_source\"),\n            \"readiness\":row[\"readiness\"][\"status\"],\n            \"native_reads\":[{k:r.get(k) for k in (\"endpoint\",\"response_settlement_literal\",\n                                      \"response_settlement_status\",\"settlement_matches_request\")} for r in receipts]})\nsnapshot = json.loads((data/\"scheduler/systemd_timers.json\").read_text())\ntimers = snapshot.get(\"timers\",[])\nselected = {\"porota-scheduler-export-rc6.timer\", \"porota-snapshot-postclose-rc6.timer\",\n            \"porota-runtime-evidence-rc6.timer\"}\nprojection_file = data/\"validation/validation_milestones_rc6.json\"\nprojection = json.loads(projection_file.read_text()) if projection_file.is_file() else {}\nbound = (projection.get(\"release\") or {}).get(\"deployment_sha\") == spec[\"merge\"]\nprint(json.dumps({\n    \"observed_at\":datetime.now(timezone.utc).isoformat(), \"deployment_sha\":marker[\"deployment_sha\"],\n    \"host_sources\":digests,\"http\":routes,\"real_orders_sent\":marker[\"real_orders_sent\"],\n    \"observer\":bundle[\"observer\"],\"query_only\":bundle[\"database\"][\"query_only\"],\n    \"market_snapshot_window\":bundle[\"database\"][\"market_snapshot_window\"],\n    \"catalog_rows\":bundle[\"database\"][\"catalog_rows\"],\n    \"catalog\":{family:{key:counts[family,key] for key in (\"identities\",\"catalog_literal\",\"matched_read_literals\")}\n               for family in sorted({k[0] for k in counts})},\"instrument_sample\":sample[:30],\n    \"evidence_status\":bundle[\"status\"],\n    \"evidence_gaps\":[gap for gap in bundle[\"gaps\"] if gap != \"PPI_WATCH_NO_VERIFICADO\"][:12],\n    \"scheduler\":{\"recorded_at\":snapshot.get(\"recorded_at\"),\"rows\":len(timers),\n                 \"monotonic_targets\":sum(bool(timer.get(\"next_elapse_monotonic_at\")) for timer in timers),\n                 \"selected\":[{k:timer.get(k) for k in (\"unit\",\"active_state\",\"enabled_state\",\"last_result\",\n                            \"last_trigger\",\"next_elapse_monotonic_at\")} for timer in timers if timer.get(\"unit\") in selected]},\n    \"campaign\":{\"ledger_exists\":(data/\"validation/validation_campaign_rc6.jsonl\").is_file(),\n                \"projection_exists\":projection_file.is_file(),\"deployment_bound\":bound,\n                \"session_date\":projection.get(\"session_date\"),\"generated_at\":projection.get(\"generated_at\"),\n                \"bound_milestones\":len(projection.get(\"milestones\",{})) if bound else 0},\n    \"provoked_provider_requests\":0,\"host_mutations\":0},sort_keys=True))\n"
          with connection(os.environ) as (ssh,_,_):
              output=ssh_run(ssh,['/usr/bin/python3','-B','-'],data=code.encode(),timeout=45)
          if output.returncode:
              lines=re.findall(rb'File "<stdin>", line (\d+)',output.stderr[-8192:])
              reason=lines[-1].decode() if lines else 'unavailable'
              raise SystemExit('READ_ONLY_RUNTIME_DASHBOARD_UNAVAILABLE_AT_'+reason)
          receipt=json.loads(output.stdout)
          print(json.dumps(receipt,sort_keys=True))
          Path(os.environ['RUNNER_TEMP'],'runtime-dashboard.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-runtime-dashboard
          path: ${{ runner.temp }}/runtime-dashboard.json
          if-no-files-found: error
          retention-days: 14
