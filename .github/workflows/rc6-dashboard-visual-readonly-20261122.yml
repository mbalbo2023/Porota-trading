name: RC6 validation candidate Playwright

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9471840d3463026e62a55d3f44cea13eee705bad
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Review the exact candidate with two simulated PAPER sessions
        working-directory: candidate
        env:
          POROTA_QA_SHA: 9471840d3463026e62a55d3f44cea13eee705bad
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$POROTA_QA_SHA"
          grep -E '^(fastapi|uvicorn|python-multipart|python-dotenv|apscheduler|requests)==.* requirements.lock.txt > "$RUNNER_TEMP/browser-dependencies.txt"
          python -m pip install -q -r "$RUNNER_TEMP/browser-dependencies.txt" 'playwright==1.55.0'
          PYTHONPATH="$GITHUB_WORKSPACE/candidate" python -B "$GITHUB_WORKSPACE/diagnostic/scripts/dashboard_visual_audit/verify_candidate.py" "$RUNNER_TEMP"
      - name: Preserve focused browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: validation-candidate-playwright
          path: ${{ runner.temp }}/playwright.json
          if-no-files-found: error
          retention-days: 30
