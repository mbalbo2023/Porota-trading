name: RC6 audit physical timers and SQLite schema

on:
  push:
    branches: [diagnostic/rc6-dashboard-visual-20261122]
    paths:
      - .github/workflows/rc6-dashboard-visual-readonly-20261122.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Capture Porota metadata without starting jobs
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os,re
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          code="EXPECTED_SHA=\"223725e2860b295533d480d6ad24aee46f098b8e\"\n\"\"\"Bounded, metadata-only capture for the current Porota release.\"\"\"\n\nfrom contextlib import closing\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport sqlite3\nimport subprocess\nfrom zoneinfo import ZoneInfo\n\n\nROOT = Path(\"/opt/porota-trading\")\nTIMER_NAME = re.compile(r\"^porota-[a-z0-9@_.-]{1,100}\\.timer$\")\nSERVICE_NAME = re.compile(r\"^porota-[a-z0-9@_.-]{1,110}\\.service$\")\nSQL_NAME = re.compile(r\"^[A-Za-z_][A-Za-z0-9_]{0,100}$\")\nSCHEDULE = re.compile(r\"^[A-Za-z0-9_./:+,*~={}(); \\-µ]+$\")\nEVENTS = {\n    \"7d4958e842da4a758f6c1cdc7b36dcc5\": \"starting\",\n    \"39f53479d3a045ac8e11786248231fbf\": \"started\",\n    \"9d1aaa27d60140bd96365438aad20286\": \"stopped\",\n    \"be02cf6855d2428ba40df7e9d022f03d\": \"failed\",\n    \"7ad2d189f7e94e70a38c781354912448\": \"succeeded\",\n}\n\n\ndef capture(args, timeout=12):\n    return subprocess.run(args, capture_output=True, text=True, timeout=timeout,\n                          env={**os.environ, \"TZ\": \"UTC\", \"LC_ALL\": \"C\"}, check=False)\n\n\ndef properties(names, fields):\n    result = capture([\"systemctl\", \"show\", \"--no-pager\", \"--all\",\n                      \"--property=\" + \",\".join((\"Id\", *fields)), *names])\n    rows = {}\n    for block in result.stdout.strip().split(\"\\n\\n\"):\n        row = dict(line.split(\"=\", 1) for line in block.splitlines() if \"=\" in line)\n        if row.get(\"Id\") in names:\n            rows[row[\"Id\"]] = row\n    return rows\n\n\ndef safe_schedule(value):\n    return value if value and len(value) <= 1600 and SCHEDULE.fullmatch(value) else None\n\n\ndef digest(path):\n    try:\n        candidate = Path(path)\n        if candidate.is_file() and candidate.stat().st_size <= 256_000:\n            return hashlib.sha256(candidate.read_bytes()).hexdigest()\n    except OSError:\n        pass\n    return None\n\n\ndef commands(value):\n    code = re.findall(r\"(?<![A-Za-z0-9_.-])([A-Za-z][A-Za-z0-9_.-]{0,90}\\.(?:py|sh))(?![A-Za-z0-9_.-])\", value)\n    flags = re.findall(r\"\\b(preopen|postclose|health|light|reconcile|daily|weekend|candle-integrity|backup|introspection|scheduler-export|runtime-evidence|snapshot-preopen|snapshot-postclose|local-eod)\\b\", value)\n    return {\"files\": sorted(set(code))[:16], \"selectors\": sorted(set(flags))[:16]}\n\n\ndef passthrough(row, fields):\n    return {k: safe_schedule(row.get(k)) for k in fields}\n\n\ndef journal(services, now):\n    midnight = now.astimezone(ZoneInfo(\"America/Argentina/Buenos_Aires\")).replace(\n        hour=0, minute=0, second=0, microsecond=0).astimezone(timezone.utc)\n    scope = [\"UNIT=\" + s for s in services]\n    request = [\"journalctl\", \"--system\", \"--since\", midnight.strftime(\"%Y-%m-%d %H:%M:%S UTC\"),\n               \"--no-pager\", \"--output=json\", \"--output-fields=__REALTIME_TIMESTAMP,UNIT,MESSAGE_ID\",\n               \"--lines=3200\", *scope, *(\"MESSAGE_ID=\"+event for event in EVENTS)]\n    try:\n        result = capture(request, 16)\n        raw = result.stdout.splitlines()\n    except (OSError, subprocess.TimeoutExpired):\n        return {\"state\": \"UNAVAILABLE\", \"since_utc\": midnight.isoformat(), \"events\": []}\n    outcome = []\n    for line in raw:\n        try:\n            j = json.loads(line)\n            if j.get(\"UNIT\") in services and j.get(\"MESSAGE_ID\") in EVENTS:\n                outcome.append([j[\"UNIT\"], EVENTS[j[\"MESSAGE_ID\"]], int(j[\"__REALTIME_TIMESTAMP\"])])\n        except (TypeError, KeyError, ValueError):\n            continue\n    coverage = (\"BOUNDED_TAIL\" if len(raw) >= 3200 else \"RETURNED\") if outcome else \"NO_VISIBLE_EVENTS\"\n    if result.returncode != 0 or \"not seeing messages\" in result.stderr.lower() or \"insufficient permissions\" in result.stderr.lower():\n        coverage = \"RESTRICTED\" if outcome else \"UNAVAILABLE\"\n    return {\"state\": coverage, \"since_utc\": midnight.isoformat(), \"events\": outcome}\n\n\ndef metadata():\n    path = ROOT / \"data/paper_v17/observer_v17.db\"\n    if not path.is_file() or path.is_symlink():\n        return {\"state\": \"UNAVAILABLE\"}\n    try:\n        with closing(sqlite3.connect(path.as_uri() + \"?mode=ro\", uri=True, timeout=2)) as connection:\n            connection.execute(\"PRAGMA query_only=ON\")\n            query = \"SELECT type, name, tbl_name FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name\"\n            items = []\n            for kind, name, parent in connection.execute(query):\n                if not SQL_NAME.fullmatch(name) or not SQL_NAME.fullmatch(parent):\n                    continue\n                item = {\"type\": kind, \"name\": name, \"table\": parent}\n                if kind in (\"table\", \"view\"):\n                    info = connection.execute('PRAGMA table_xinfo(\"' + name + '\")')\n                    item[\"columns\"] = [\n                        {\"name\": col_name, \"type\": affinity if re.fullmatch(r\"[A-Z0-9(), ]{0,45}\", affinity.upper()) else \"CUSTOM\",\n                         \"not_null\": bool(notnull), \"primary_key_order\": pk, \"default_defined\": default is not None,\n                         \"hidden\": hidden}\n                        for _, col_name, affinity, notnull, default, pk, hidden in info\n                        if SQL_NAME.fullmatch(col_name)]\n                    fk = connection.execute('PRAGMA foreign_key_list(\"' + name + '\")')\n                    item[\"foreign_keys\"] = [\n                        {\"table\": target, \"from\": col_from, \"to\": col_to, \"on_delete\": on_delete}\n                        for _, _, target, col_from, col_to, _, on_delete, _ in fk\n                        if SQL_NAME.fullmatch(target) and SQL_NAME.fullmatch(col_from)]\n                if kind == \"index\":\n                    item[\"columns\"] = [column for _, cid, column, descending, collation, key\n                                       in connection.execute('PRAGMA index_xinfo(\"' + name + '\")')\n                                       if key and column and SQL_NAME.fullmatch(column)]\n                items.append(item)\n            return {\"state\": \"READ_ONLY\", \"db_alias\": \"observer_v17.db\",\n                    \"journal_mode\": connection.execute(\"PRAGMA journal_mode\").fetchone()[0],\n                    \"query_only\": connection.execute(\"PRAGMA query_only\").fetchone()[0] == 1,\n                    \"user_version\": connection.execute(\"PRAGMA user_version\").fetchone()[0],\n                    \"size_bytes\": path.stat().st_size, \"objects\": items}\n    except (OSError, sqlite3.Error):\n        return {\"state\": \"METADATA_UNAVAILABLE\"}\n\n\ndef main():\n    now = datetime.now(timezone.utc)\n    release = json.loads((ROOT / \"data/deploy/CURRENT_STATE_V2.json\").read_text())\n    assert (release.get(\"deployment_sha\") == EXPECTED_SHA\n            and release.get(\"validation_status\") == \"VALIDATED_RUNTIME\"\n            and release.get(\"real_orders_sent\") == 0)\n    result = capture([\"systemctl\", \"list-unit-files\", \"--type=timer\", \"--no-legend\", \"--no-pager\"])\n    assert result.returncode == 0\n    names = sorted({fields[0] for line in result.stdout.splitlines()\n                    if (fields := line.split()) and TIMER_NAME.fullmatch(fields[0])})\n    assert 0 < len(names) <= 90\n    timer_fields = (\"LoadState\", \"ActiveState\", \"SubState\", \"UnitFileState\", \"Unit\", \"Triggers\",\n                    \"TimersCalendar\", \"TimersMonotonic\", \"AccuracyUSec\", \"RandomizedDelayUSec\", \"Persistent\",\n                    \"WakeSystem\", \"LastTriggerUSec\", \"NextElapseUSecRealtime\", \"NextElapseUSecMonotonic\",\n                    \"FragmentPath\", \"DropInPaths\")\n    timer = properties(names, timer_fields)\n    targets = {}\n    for name in names:\n        row = timer.get(name, {})\n        declared = [row.get(\"Unit\", \"\"), *row.get(\"Triggers\", \"\").split()]\n        targets[name] = next((i for i in declared if SERVICE_NAME.fullmatch(i)), name[:-6]+\".service\")\n    services = sorted(set(targets.values()))\n    service_fields = (\"LoadState\", \"ActiveState\", \"SubState\", \"Result\", \"ExecMainCode\", \"ExecMainStatus\",\n                      \"ExecMainStartTimestamp\", \"ExecMainExitTimestamp\", \"StateChangeTimestamp\",\n                      \"Type\", \"User\", \"FragmentPath\", \"DropInPaths\", \"ExecStart\", \"TimeoutStartUSec\", \"Slice\")\n    svc = properties(services, service_fields)\n    items = []\n    for name in names:\n        row = timer.get(name, {})\n        target = targets[name]\n        service = svc.get(target, {})\n        items.append({\"unit\": name, \"actual_service\": target,\n                      \"timer\": passthrough(row, tuple(k for k in timer_fields if k not in (\"Unit\",\"Triggers\",\"FragmentPath\",\"DropInPaths\"))),\n                      \"timer_file_sha256\": digest(row.get(\"FragmentPath\") or \"\"),\n                      \"timer_dropin_count\": len(row.get(\"DropInPaths\",\"\").split()),\n                      \"service\": passthrough(service, tuple(k for k in service_fields if k not in (\"User\",\"FragmentPath\",\"DropInPaths\",\"ExecStart\"))),\n                      \"execution_role\": \"configured_nonroot\" if service.get(\"User\") not in (None, \"\", \"0\", \"root\") else \"root_or_default\",\n                      \"service_file_sha256\": digest(service.get(\"FragmentPath\") or \"\"),\n                      \"service_dropin_count\": len(service.get(\"DropInPaths\",\"\").split()),\n                      \"entrypoints\": commands(service.get(\"ExecStart\",\"\"))})\n    zone = capture([\"timedatectl\", \"show\", \"--property=Timezone\", \"--value\"])\n    print(json.dumps({\"schema\": \"porota.audit-timer-db-metadata.v1\", \"observed_at\": now.isoformat(),\n                      \"deployment_sha\": EXPECTED_SHA, \"host_timezone\": safe_schedule(zone.stdout.strip()),\n                      \"real_orders_sent\": release[\"real_orders_sent\"], \"host_mutations\": 0, \"ppi_requests\": 0,\n                      \"timers\": items, \"journal\": journal(services, now), \"database\": metadata()}, ensure_ascii=False))\n\n\nif __name__ == \"__main__\":\n    main()\n"
          with connection(os.environ) as (ssh,_,_):
              output=ssh_run(ssh,['/usr/bin/python3','-B','-'],data=code.encode(),timeout=85)
          if output.returncode:
              lines=re.findall(rb'File "<stdin>", line (\d+)',output.stderr[-8192:])
              reason=lines[-1].decode() if lines else 'unavailable'
              raise SystemExit('READ_ONLY_RC6_METADATA_UNAVAILABLE_AT_'+reason)
          receipt=json.loads(output.stdout)
          print(json.dumps({'timer_count':len(receipt['timers']),'journal':receipt['journal']['state'],'db_objects':len(receipt['database'].get('objects',[])),'mutations':receipt['host_mutations'],'ppi_requests':receipt['ppi_requests']},sort_keys=True))
          Path(os.environ['RUNNER_TEMP'],'porota-runtime-audit.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: porota-runtime-audit
          path: ${{ runner.temp }}/porota-runtime-audit.json
          if-no-files-found: error
          retention-days: 14
