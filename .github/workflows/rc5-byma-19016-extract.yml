name: RC5 - extraer BYMA 19016 oficial

on:
  push:
    branches:
      - audit/rc5-byma-19016-extract-20260905

permissions:
  contents: read

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar tabla oficial vigente de BYMA
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.prod.website-files.com/6697a441a50c6b926e1972e0/6a984eb5fd2f133f28622aa4_INFORME%20BYMA%202026_v02sep.pdf'
          echo "SOURCE_PAGE=https://www.byma.com.ar/mercado/horarios"
          echo "SOURCE_COMMUNICATION=https://www.byma.com.ar/comunicados/horarios-de-negociacion-liquidacion-y-recepcion-de-informacion"
          echo "COMMUNICATION=19016"
          echo "COMMUNICATION_DATE=2026-09-01"
          curl -A 'Mozilla/5.0 Porota-Research/1.0' -fL --retry 2 --max-time 45 "$URL" -o /tmp/byma19016.pdf
          test "$(head -c 5 /tmp/byma19016.pdf)" = '%PDF-'
          echo "PDF_BYTES=$(wc -c </tmp/byma19016.pdf)"
          echo "PDF_SHA256=$(sha256sum /tmp/byma19016.pdf | awk '{print $1}')"
          file /tmp/byma19016.pdf

      - name: Intentar texto nativo y usar OCR sólo si es imagen
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout /tmp/byma19016.pdf /tmp/native.txt || true
          if [ -s /tmp/native.txt ]; then
            cp /tmp/native.txt /tmp/final.txt
            echo 'EXTRACTION=NATIVE_TEXT'
          else
            echo 'EXTRACTION=OCR_IMAGE_ONLY'
            if ! command -v pdftoppm >/dev/null || ! command -v tesseract >/dev/null; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
            fi
            mkdir -p /tmp/pages /tmp/ocr
            pdftoppm -r 220 -png /tmp/byma19016.pdf /tmp/pages/page >/dev/null 2>&1
            : > /tmp/final.txt
            n=0
            for img in /tmp/pages/page-*.png; do
              n=$((n+1))
              out="/tmp/ocr/page_${n}"
              tesseract "$img" "$out" -l eng --psm 6 >/dev/null 2>&1
              printf '\n===== PAGE %02d =====\n' "$n" >> /tmp/final.txt
              cat "${out}.txt" >> /tmp/final.txt
            done
          fi
          echo "TEXT_LINES=$(wc -l </tmp/final.txt)"
          echo '--- BYMA 19016 EXTRACT BEGIN ---'
          sed -n '1,1600p' /tmp/final.txt
          echo '--- BYMA 19016 EXTRACT END ---'
