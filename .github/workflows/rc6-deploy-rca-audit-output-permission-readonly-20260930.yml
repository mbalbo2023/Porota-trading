name: RC6 Deploy RCA Audit Output Permission Read-Only 2026-09-30

on:
  push:
    branches:
      - fix/ws-deploy-rca-audit-output-permission-20260930
    paths:
      - '.github/workflows/rc6-deploy-rca-audit-output-permission-readonly-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly_permission_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Prove audit-output ownership mismatch without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          echo "RCA_HOST_PATHS_BEGIN"
          sudo -n stat -c 'HOST_STAT=%u:%g|mode=%a|%n' "$REPO/data" "$REPO/data/deploy" 2>&1 || true
          sudo -n find "$REPO/data/deploy" -maxdepth 1 -type f -name 'zero-known-error-*.json' \
            -printf 'HOST_AUDIT_FILE=%u:%g|mode=%m|%p\n' 2>/dev/null | sort || true
          echo "RCA_HOST_PATHS_END"
          echo "RCA_DASHBOARD_ID=$(sudo -n docker exec porota_production_dashboard id)"
          sudo -n docker inspect -f 'RCA_DASHBOARD_CONFIG_USER={{.Config.User}}|status={{.State.Status}}|image={{.Image}}' porota_production_dashboard
          sudo -n docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app/data"}}RCA_DATA_MOUNT={{.Type}}|source={{.Source}}|rw={{.RW}}{{end}}{{end}}' porota_production_dashboard
          sudo -n docker exec porota_production_dashboard python - <<'PY'
          import os
          from pathlib import Path
          p=Path('/app/data/deploy')
          st=p.stat()
          print(f'RCA_CONTAINER_PATH=euid={os.geteuid()}|egid={os.getegid()}|owner={st.st_uid}:{st.st_gid}|mode={oct(st.st_mode & 0o777)}|writable={os.access(p, os.W_OK)}')
          PY
          if sudo -n docker exec porota_production_dashboard test -w /app/data/deploy; then
            echo 'RCA_CONTAINER_DEPLOY_WRITABLE=YES'
          else
            echo 'RCA_CONTAINER_DEPLOY_WRITABLE=NO'
          fi
          echo 'RCA_PERMISSION_PROBE=GREEN_READ_ONLY'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
