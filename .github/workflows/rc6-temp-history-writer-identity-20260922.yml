name: RC6 read-only history writer identity audit
on:
  push:
    branches: [audit/rc6-iol-decision-demand-20260921]
    paths:
      - .github/workflows/rc6-temp-history-writer-identity-20260922.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare strict SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Identify history database reader without changing runtime
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "IDENTITY_AUDIT_ART=$(TZ=America/Argentina/Buenos_Aires date -Is)"
          echo 'CONTAINERS (names/status only):'
          sudo -n docker ps --no-trunc --format '{{.ID}} {{.Names}} {{.Status}}'
          sudo -n docker inspect -f 'CONTAINER={{.Id}} NAME={{.Name}} MOUNTS={{range .Mounts}}{{.Source}}->{{.Destination}}:RW={{.RW}};{{end}}' porota_production_observer
          if sudo -n docker inspect -f '{{.State.Running}}' porota_production_observer 2>/dev/null | grep -qx true; then
            sudo -n docker exec porota_production_observer stat -c 'DB_MODE=%a OWNER=%U:%G UID=%u GID=%g SIZE=%s MTIME=%y PATH=%n' /app/data/market_history.db
          sudo -n stat -c 'HOST_PATH=%n MODE=%a OWNER=%U:%G UID=%u GID=%g SIZE=%s' /opt/porota-trading/data /opt/porota-trading/data/market_history.db /opt/porota-trading/data/market_history.db-wal /opt/porota-trading/data/market_history.db-shm 2>/dev/null || true
          sudo -n docker exec porota_production_observer sh -c 'id; stat -c "CONTAINER_PATH=%n MODE=%a OWNER=%U:%G UID=%u GID=%g SIZE=%s" /app/data /app/data/market_history.db /app/data/market_history.db-wal /app/data/market_history.db-shm 2>/dev/null || true'
          sudo -n docker exec -i porota_production_observer python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          live=sqlite3.connect('file:/app/data/market_history.db?mode=ro',uri=True,timeout=10)
          live.execute('PRAGMA query_only=ON')
          tables=[r[0] for r in live.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
          print('HISTORY_TABLES='+','.join(tables))
          for name in tables:
              if 'history' in name.lower() or 'candle' in name.lower():
                  cols=[r[1] for r in live.execute('PRAGMA table_info("'+name.replace('"','')+'")')]
                  print('HISTORY_COLUMNS_'+name+'='+','.join(cols))
          live.close()
          root=Path('/app/data/evidence/ppi_history_exact_v1')
          p=root/'manifest_exact_v1.db'
          if p.exists():
              c=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True,timeout=10)
              c.row_factory=sqlite3.Row; c.execute('PRAGMA query_only=ON')
              rows=c.execute("SELECT origin,quality,inner_sha256,wrapper_json FROM exact_attempts_v1 WHERE origin='PPI_HISTORY' AND quality='VALID_PAYLOAD'").fetchall()
              ids={}; missing_market=0
              for r in rows:
                  try: w=json.loads(r['wrapper_json'] or '{}')
                  except (TypeError,ValueError): continue
                  m=w.get('metadata') if isinstance(w.get('metadata'),dict) else {}
                  symbol=w.get('symbol') or m.get('symbol')
                  typ=w.get('instrument_type') or m.get('instrument_type') or w.get('asset_class') or m.get('asset_class')
                  market=w.get('market') or m.get('market') or w.get('exchange') or m.get('exchange')
                  if not market: missing_market+=1
                  if symbol and typ:
                      key=(str(typ).upper(),str(symbol).upper())
                      ids[key]=(market,r['inner_sha256'])
              counts={}
              for typ,sym in ids: counts[typ]=counts.get(typ,0)+1
              print('ARCHIVE_COVERAGE='+json.dumps({'valid_attempts':len(rows),'distinct_type_symbol':len(ids),'by_type':counts,'missing_market_attempts':missing_market},sort_keys=True))
              c.close()
          PY
          else
            echo 'porota_production_observer=NOT_RUNNING'
          fi
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          rows = subprocess.run(
              ["lslocks", "-n", "-o", "COMMAND,PID,TYPE,MODE,PATH"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          pids = sorted({line.split()[1] for line in rows
                         if "/app/data/market_history.db" in line and len(line.split()) >= 5
                         and line.split()[1].isdigit()})
          print("DB_LOCK_HOLDER_COUNT=" + str(len(pids)))
          for pid in pids:
              proc = Path("/proc") / pid
              try:
                  comm = (proc / "comm").read_text().strip()
                  status = (proc / "status").read_text()
                  parent = re.search(r"^PPid:\s+(\d+)", status, re.M)
                  ppid = parent.group(1) if parent else "?"
                  pcomm = (Path("/proc") / ppid / "comm").read_text().strip() if ppid.isdigit() else "?"
                  groups = (proc / "cgroup").read_text().strip().replace("\n", ";")
                  print(f"DB_LOCK_PID={pid} COMM={comm} PPID={ppid} PARENT_COMM={pcomm}")
                  print("DB_LOCK_CGROUP=" + groups[:400])
              except OSError:
                  print("DB_LOCK_PID=" + pid + " STATE=EXITED_DURING_READ")
          PY
          sudo -n docker exec -i porota_production_observer python3 - <<'PY'
          import sqlite3
          p="file:/app/data/market_history.db?mode=ro"
          c=sqlite3.connect(p,uri=True,timeout=3)
          c.execute("PRAGMA query_only=ON")
          print("DB_JOURNAL_MODE="+str(c.execute("PRAGMA journal_mode").fetchone()[0]))
          print("DB_SCHEMA_VERSION="+str(c.execute("PRAGMA schema_version").fetchone()[0]))
          c.close()
          PY
          sudo -n grep -RIn --include='*.py' --include='*.sh' --include='*.yml' --include='*.service' -E 'chmod .*444|market_history\.db.*chmod|chmod .*market_history' /opt/porota-trading /etc/systemd/system 2>/dev/null | head -40 || true
          sudo -n docker exec -i porota_production_observer python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path('/app/data/evidence/ppi_history_exact_v1/manifest_exact_v1.db')
          print('ARCHIVE_MANIFEST_EXISTS='+str(p.exists()))
          if p.exists():
              db=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True,timeout=10)
              db.execute('PRAGMA query_only=ON')
              names=[r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
              print('ARCHIVE_TABLES='+','.join(names))
              for name in names:
                  cols=[r[1] for r in db.execute("PRAGMA table_info(" + name + ")")]
                  print('ARCHIVE_COLUMNS_'+name+'='+','.join(cols))
              db.close()
          PY
          sudo -n docker exec -i porota_production_observer python3 - <<'PY'
          import gzip, json, sqlite3
          from pathlib import Path
          root=Path('/app/data/evidence/ppi_history_exact_v1')
          db=sqlite3.connect('file:'+str(root/'manifest_exact_v1.db')+'?mode=ro',uri=True,timeout=10)
          db.row_factory=sqlite3.Row
          db.execute('PRAGMA query_only=ON')
          row=db.execute("SELECT origin,quality,inner_sha256,wrapper_json FROM exact_attempts_v1 WHERE quality='VALID_PAYLOAD' ORDER BY inserted_at DESC LIMIT 1").fetchone()
          if not row:
              print('ARCHIVE_OBJECT=NONE')
          else:
              try: wrapper=json.loads(row['wrapper_json'] or '{}')
              except (TypeError,ValueError): wrapper={}
              metadata=wrapper.get('metadata') if isinstance(wrapper.get('metadata'),dict) else {}
              identity={k:v for k,v in {**metadata,**wrapper}.items()
                        if k in {'symbol','asset_class','instrument_type','market','exchange','settlement','date_from','date_to','currency'}
                        and isinstance(v,(str,int,float,bool,type(None)))}
              h=row['inner_sha256']
              p=root/'objects'/'sha256'/h[:2]/(h+'.json.gz')
              if p.exists():
                  with gzip.open(p,'rt',encoding='utf-8') as stream: obj=json.load(stream)
                  if isinstance(obj,list):
                      dates=[str(x.get('date',''))[:10] for x in obj if isinstance(x,dict) and x.get('date')]
                      first=obj[0] if obj and isinstance(obj[0],dict) else {}
                      print('ARCHIVE_OBJECT='+json.dumps({'origin':row['origin'],'quality':row['quality'],'identity':identity,'rows':len(obj),'first_row_fields':sorted(first.keys()),'first_date':min(dates) if dates else None,'last_date':max(dates) if dates else None},sort_keys=True))
                  else:
                      print('ARCHIVE_OBJECT_TYPE='+type(obj).__name__)
              else:
                  print('ARCHIVE_OBJECT_FILE=MISSING')
          db.close()
          PY
          sudo -n python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '/opt/porota-trading')
          store=Path('/root/.config/porota/iol_mcp_oauth_bootstrap.json')
          print('IOL_OAUTH_STORE_EXISTS='+str(store.exists()))
          try:
              from iol_mcp_readonly_adapter_rc6 import OAuthStoreReadOnlyMCP, IOLMCPError
              client=OAuthStoreReadOnlyMCP()
              allow={'symbol','market','currency','type','asset_type','description','units_per_lot','lot_size',
                     'last','last_price','unit_price','lot_price','price','bid','ask','best_bid','best_ask',
                     'variation','variation_pct','volume','date','datetime','timestamp',
                     'observed_at','last_updated','maturity','isin'}
              for tool,args in (
                  ('get_asset_info',{'symbol':'YMCID','market':'BCBA'}),
                  ('get_asset_quote',{'symbol':'YMCID','market':'BCBA','term':'t1'}),
              ):
                  try:
                      value=client.call(tool,args)
                      records=value if isinstance(value,list) else [value]
                      safe=[]
                      for r in records:
                          if not isinstance(r,dict): continue
                          item={'keys':sorted(r.keys()),'values':{k:(str(v) if type(v).__name__=='Decimal' else v) for k,v in r.items() if k in allow and (isinstance(v,(str,int,float,bool,type(None))) or type(v).__name__=='Decimal')}}
                          trade=r.get('trade')
                          if isinstance(trade,dict): item['trade']={'keys':sorted(trade.keys()),'values':{k:v for k,v in trade.items() if k in allow and isinstance(v,(str,int,float,bool,type(None)))}}
                          for side in ('bids','asks'):
                              levels=r.get(side)
                              if isinstance(levels,list):
                                  first=levels[0] if levels and isinstance(levels[0],dict) else {}
                                  item[side]={'count':len(levels),'first_keys':sorted(first.keys()),'first_values':{k:v for k,v in first.items() if k in allow and isinstance(v,(str,int,float,bool,type(None)))}}
                          safe.append(item)
                      print('IOL_'+tool.upper()+'='+json.dumps({'record_count':len(records),'records':safe},sort_keys=True))
                  except IOLMCPError as exc:
                      print('IOL_'+tool.upper()+'=ERROR|'+str(exc))
                  except Exception as exc:
                      print('IOL_'+tool.upper()+'=ERROR|'+type(exc).__name__)
          except Exception as exc:
              print('IOL_ADAPTER=ERROR|'+type(exc).__name__)
          PY
          sudo -n docker exec -i porota_production_observer python3 - <<'PY'
          import inspect, json
          from ppi_client.ppi import PPI
          from ppi_client.models.estimate_bonds import EstimateBonds
          client=PPI(sandbox=False)
          method=type(client.marketdata).estimate_bonds
          fields=getattr(EstimateBonds,'model_fields',None) or getattr(EstimateBonds,'__annotations__',{})
          model=[]
          for name,value in fields.items():
              required=value.is_required() if hasattr(value,'is_required') else True
              annotation=getattr(value,'annotation',value)
              model.append({'name':name,'required':required,'type':getattr(annotation,'__name__',str(annotation))})
          source=inspect.getsource(method).splitlines()
          module=inspect.getmodule(type(client.marketdata))
          route=getattr(module,'ESTIMATE_BONDS',None) if module else None
          relevant=[line.strip() for line in source if any(x in line.lower() for x in ('post','url','estimate','endpoint','request','json'))]
          print('PPI_SDK_VERSION=1.3.0')
          print('PPI_ESTIMATE_SIGNATURE='+str(inspect.signature(method)))
          print('PPI_ESTIMATE_ROUTE='+str(route))
          print('PPI_ESTIMATE_MODEL='+json.dumps(model,sort_keys=True))
          print('PPI_ESTIMATE_HTTP='+json.dumps(relevant[:24]))
          print('PPI_SDK_INSPECT=NO_NETWORK')
          PY
          echo "MUTATIONS=NONE"
          HOST
