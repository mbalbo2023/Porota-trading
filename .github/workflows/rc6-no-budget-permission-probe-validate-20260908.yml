name: RC6 no Budget permission probe validate 2026-09-08

on:
  push:
    branches:
      - checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
    paths:
      - '.github/workflows/rc6-no-budget-permission-probe-validate-20260908.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc6-no-budget-permission-probe-validate-20260908
  cancel-in-progress: false

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/rc6-ppi-dom-api-operability-alerting-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create isolated safety branch
        run: |
          set -euo pipefail
          git checkout -b fix/rc6-no-order-route-permission-probe-20260908
      - name: Replace permission probe with search-only evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('m_instrument_universe.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def detect_account_permissions(ppi_client) -> dict:\n')
          end=s.index('\n\ndef ', start+10)
          new='''def detect_account_permissions(ppi_client) -> dict:\n    """Collect search visibility without touching any order-route endpoint.\n\n    RC6 safety policy forbids using Budget/Confirm/Cancel as permission probes.\n    Search visibility is evidence of discoverability only and MUST NOT be\n    interpreted as broker execution permission. Execution remains NOT_PROVEN\n    until separate documentary/empirical evidence is available.\n    """\n    permisos = {}\n    for asset_class, cfg in ALL_TYPES.items():\n        estado = {\n            "puede_operar": False,\n            "motivo": "",\n            "instrumentos_visibles": 0,\n            "estado_verificacion": "EXECUTION_NOT_PROVEN_NO_ORDER_ROUTE_PROBE",\n        }\n        try:\n            resultados = ppi_client.search_instruments(cfg["instrument_type"])\n        except Exception as exc:\n            estado["motivo"] = f"La búsqueda read-only de instrumentos falló: {type(exc).__name__}"\n            estado["estado_verificacion"] = "SEARCH_FAILED_EXECUTION_NOT_PROVEN"\n            permisos[asset_class] = estado\n            continue\n        estado["instrumentos_visibles"] = len(resultados or [])\n        if resultados:\n            estado["motivo"] = (\n                "Instrumentos visibles por búsqueda read-only; esto NO demuestra permiso de ejecución. "\n                "No se consultó Budget/Confirm/Cancel."\n            )\n        else:\n            estado["motivo"] = (\n                "Sin instrumentos visibles en búsqueda read-only; ejecución permanece NOT_PROVEN. "\n                "No se consultó Budget/Confirm/Cancel."\n            )\n        permisos[asset_class] = estado\n    return permisos\n'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Add safety regression tests
        run: |
          cat > tests/test_rc6_no_budget_permission_probe.py <<'PY'
          import m_instrument_universe as universe

          class SearchOnly:
              def __init__(self): self.calls=[]
              def search_instruments(self, instrument_type):
                  self.calls.append(('search',instrument_type)); return [{'ticker':'TEST'}]
              def budget_order(self,*a,**k):
                  raise AssertionError('BUDGET_ORDER_MUST_NOT_BE_CALLED')
              def confirm_order(self,*a,**k):
                  raise AssertionError('CONFIRM_ORDER_MUST_NOT_BE_CALLED')
              def cancel_order(self,*a,**k):
                  raise AssertionError('CANCEL_ORDER_MUST_NOT_BE_CALLED')

          def test_permission_discovery_is_search_only_and_fail_closed():
              p=SearchOnly(); result=universe.detect_account_permissions(p)
              assert result
              assert all(v['puede_operar'] is False for v in result.values())
              assert all('NOT_PROVEN' in v['estado_verificacion'] for v in result.values())
              assert all(c[0]=='search' for c in p.calls)
          PY
      - name: Install minimal test dependencies
        run: |
          set -euo pipefail
          pip install pytest
      - name: Run targeted safety tests
        run: |
          set -euo pipefail
          pytest -q tests/test_rc6_no_budget_permission_probe.py tests/test_ppi_documented_contract_v17.py
          python -m py_compile m_instrument_universe.py j_main.py
          ! sed -n '/def detect_account_permissions/,/^def /p' m_instrument_universe.py | grep -q 'budget_order('
      - name: Commit tested fix to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add m_instrument_universe.py tests/test_rc6_no_budget_permission_probe.py
          git commit -m 'fix(rc6): remove order-route permission probing'
          git push -u origin fix/rc6-no-order-route-permission-probe-20260908
