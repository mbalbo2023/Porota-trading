name: RC6 PR76 legacy preflight pointer

# RC6 Predeploy V2 owns the productive test gate. Keeping this historical
# entry manual-only avoids silent allowlist omissions and duplicate CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-predeploy-pointer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical governed test policy
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/porota-predeploy-v2.yml
          test -f ops/policy/test-policy.yaml
          grep -Fq 'Governed automatic test discovery and execution' .github/workflows/porota-predeploy-v2.yml
          grep -Fq 'automatic_discovery_required: true' ops/policy/test-policy.yaml
          echo 'POROTA_LEGACY_PR76_PREFLIGHT=RETIRED_TO_CANONICAL_PREDEPLOY_V2'
          echo 'TEST_RESULT_CLAIM=NONE'
