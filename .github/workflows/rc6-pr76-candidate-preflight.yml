name: RC6 PR candidate preflight

on:
  pull_request:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    paths:
      - 'am_us_equity_calendar_rc6.py'
      - 'bf_production_paper_observer.py'
      - 'be_paper_engine.py'
      - 'ek_history_freshness_metrics_rc5.py'
      - 'bm_exit_supervisor.py'
      - 'rc6_macro_risk_shadow.py'
      - 'rc6_action4_audit.py'
      - 'bg_paper_dashboard.py'
      - 'tests/test_rc6_*.py'
      - '.github/workflows/rc6-pr69-isolated-transactional-deploy-20260915.yml'
      - '.github/workflows/rc6-pr76-candidate-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile candidate safety paths
        run: |
          set -Eeuo pipefail
          python -m py_compile am_us_equity_calendar_rc6.py ek_history_freshness_metrics_rc5.py bf_production_paper_observer.py be_paper_engine.py bm_exit_supervisor.py rc6_macro_risk_shadow.py rc6_action4_audit.py bg_paper_dashboard.py
      - name: Install deterministic test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" requests
      - name: Verify CEDEAR calendar, stale-data and exit invariants
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_cedear_underlying_calendar.py tests/test_rc6_history_cedear_calendar.py tests/test_rc6_history_operational_scope.py tests/test_rc6_take_profit_regression.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_action4_audit.py
          python -m pytest -q tests/test_exit_supervision_v17.py -k "max_hold_sin_datos_persiste_y_se_ejecuta_despues_de_reiniciar or 1655_sigue_dentro_de_rueda_y_un_stop_puede_cerrar or eod_no_aplica_a_cauciones_o_derivados_y_frena_entradas"
