name: RC6 PR candidate preflight

on:
  pull_request:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    paths:
      - 'am_us_equity_calendar_rc6.py'
      - 'bf_production_paper_observer.py'
      - 'be_paper_engine.py'
      - 'ek_history_freshness_metrics_rc5.py'
      - 'bm_exit_supervisor.py'
      - 'rc6_macro_risk_shadow.py'
      - 'rc6_action4_audit.py'
      - 'cp_history_ingest_policy_hf6.py'
      - 'cr_data912_reconcile_hf6.py'
      - 'dd_history_metrics_hf6.py'
      - 'test_hf6_history_data912_v2.py'
      - 'test_cp_history_ingest_policy_hf6.py'
      - 'bg_paper_dashboard.py'
      - 'tests/test_rc6_*.py'
      - '.github/workflows/rc6-pr69-isolated-transactional-deploy-20260915.yml'
      - '.github/workflows/rc6-pr76-candidate-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile candidate safety paths
        run: |
          set -Eeuo pipefail
          python -m py_compile _version.py bu_instrument_catalog.py bf_production_paper_observer.py bg_paper_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py be_paper_engine.py bh_universe_dashboard_hf6.py da_dashboard_ux_hf6.py ck_contract_evidence_runner_hf6.py cl_contract_evidence_dashboard_hf6.py bm_exit_supervisor.py bv_paper_runtime.py porota_mode_manager.py rc6_report_retention.py rc6_action4_audit.py rc6_macro_risk_shadow.py rc6_gdelt_shadow.py ba_data912_history.py al_historical_ingest.py rc6_validation_projection.py en_validation_project_dashboard_rc6.py az_maintenance_job.py az_maintenance_scheduler.py am_us_equity_calendar_rc6.py
      - name: Install deterministic test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" requests
      - name: Mirror canonical compile and deterministic release tests
        run: |
          set -Eeuo pipefail
          python -m pytest -q test_hf6_history_data912_v2.py test_cp_history_ingest_policy_hf6.py
          python -m pytest -q tests/test_rc6_complementary_catalog_merge.py tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_rc6_legacy_history_scope.py tests/test_rc6_deploy_readiness_contract.py tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_history_operational_scope.py tests/test_rc6_introspection_scope.py tests/test_rc6_scheduler_operational_scope.py tests/test_rc6_internal_history_scheduler_guard.py tests/test_rc6_take_profit_regression.py tests/test_rc6_cedear_underlying_calendar.py tests/test_rc6_history_cedear_calendar.py
          python -m pytest -q tests/test_exit_supervision_v17.py -k "max_hold_sin_datos_persiste_y_se_ejecuta_despues_de_reiniciar or 1655_sigue_dentro_de_rueda_y_un_stop_puede_cerrar or eod_no_aplica_a_cauciones_o_derivados_y_frena_entradas"