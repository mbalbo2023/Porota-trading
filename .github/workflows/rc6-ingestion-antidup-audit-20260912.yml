name: RC6 ingestion anti-dup audit 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ingestion-antidup-audit-20260912.yml']

permissions:
  contents: read

jobs:
  anti-dup:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for ingestion lock then audit identity collisions and duplicate risk read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "AUDIT_AT_UTC=$(date -u +%FT%TZ)"
          echo "HOST_SHA=$(git -C /opt/porota-trading rev-parse HEAD)"
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 3600 9 || { echo 'ANTIDUP=BLOCKED_HISTORY_LOCK_TIMEOUT'; exit 32; }
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          db='file:/app/data/paper_v17/observer_v17.db?mode=ro'
          c=sqlite3.connect(db,uri=True,timeout=30); c.execute('pragma query_only=on')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print('SAFETY=%s|%s'%s)
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          def n(sql,args=()): return c.execute(sql,args).fetchone()[0]
          def cols(t): return [r[1] for r in c.execute('pragma table_info('+t+')')]
          def pk(t): return [(r[1],r[5]) for r in c.execute('pragma table_info('+t+')') if r[5]]
          print('SHADOW_PK='+json.dumps(pk('ppi_argentina_api_shadow')))
          print('PROD_ATTEMPTS_PK='+json.dumps(pk('production_history_attempts')))
          print('PROD_HISTORY_PK='+json.dumps(pk('production_history')))
          full_dups=n('''select count(*) from (select ticker,instrument_type,market,currency,settlement,count(*) x from ppi_argentina_api_shadow group by 1,2,3,4,5 having x>1)''')
          coarse_collisions=n('''select count(*) from (select ticker,instrument_type,settlement,count(*) x from ppi_argentina_api_shadow group by 1,2,3 having x>1)''')
          coarse_rows=n('''select coalesce(sum(x),0) from (select count(*) x from ppi_argentina_api_shadow group by ticker,instrument_type,settlement having count(*)>1)''')
          print('SHADOW_FULL_IDENTITY_DUP_GROUPS='+str(full_dups))
          print('SHADOW_HISTORY_KEY_COLLISION_GROUPS='+str(coarse_collisions))
          print('SHADOW_HISTORY_KEY_COLLISION_ROWS='+str(coarse_rows))
          for r in c.execute('''select ticker,instrument_type,settlement,count(*) x,group_concat(distinct market),group_concat(distinct currency) from ppi_argentina_api_shadow group by ticker,instrument_type,settlement having x>1 order by x desc,ticker limit 25'''):
              print('HISTORY_KEY_COLLISION='+json.dumps({'ticker':r[0],'family':r[1],'settlement':r[2],'rows':r[3],'markets':r[4],'currencies':r[5]},sort_keys=True))
          pa_dups=n('''select count(*) from (select symbol,instrument_type,settlement,count(*) x from production_history_attempts group by 1,2,3 having x>1)''')
          ph_dups=n('''select count(*) from (select symbol,instrument_type,settlement,count(*) x from production_history group by 1,2,3 having x>1)''')
          print('PRODUCTION_ATTEMPT_DUP_GROUPS='+str(pa_dups))
          print('PRODUCTION_HISTORY_DUP_GROUPS='+str(ph_dups))
          shadow=n("select count(*) from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')")
          joinrows=n('''select count(*) from ppi_argentina_api_shadow s join production_history_attempts p on p.symbol=s.ticker and p.instrument_type=s.instrument_type and p.settlement=s.settlement where s.market in ('BYMA','ROFEX','A3','OTC') and s.instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')''')
          unclassified=n('''select count(*) from ppi_argentina_api_shadow s left join production_history_attempts p on p.symbol=s.ticker and p.instrument_type=s.instrument_type and p.settlement=s.settlement where s.market in ('BYMA','ROFEX','A3','OTC') and s.instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR') and p.symbol is null''')
          print('API_SHADOW_LOCAL='+str(shadow))
          print('API_JOIN_ROWS='+str(joinrows))
          print('API_UNCLASSIFIED='+str(unclassified))
          if 'ppi_web_residual_manifest_rc6' in tables:
              m=n('select count(*) from ppi_web_residual_manifest_rc6')
              md=n('''select count(*) from (select ticker,instrument_type,market,currency,settlement,count(*) x from ppi_web_residual_manifest_rc6 group by 1,2,3,4,5 having x>1)''')
              print('WEB_MANIFEST_ROWS='+str(m)); print('WEB_MANIFEST_DUP_GROUPS='+str(md))
          else:
              print('WEB_MANIFEST_ROWS=NOT_CREATED')
          # Gate: exact identity duplicates or duplicate rows in canonical ledgers are fatal.
          assert full_dups==0 and pa_dups==0 and ph_dups==0
          # Coarse-key collisions are not silently accepted because production_history keys omit market/currency.
          if coarse_collisions:
              print('ANTIDUP_GATE=BLOCK_WEB_HISTORY_UNTIL_KEY_RECONCILIATION')
          else:
              print('ANTIDUP_GATE=GREEN')
          c.close()
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
