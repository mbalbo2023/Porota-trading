name: RC6 Parallel Bundle Predeploy Cert 2026-09-12

on:
  push:
    branches:
      - "cert/rc6-parallel-bundle-predeploy-20260912"
    paths:
      - "cf_intraday_scalping.py"
      - "eq_dashboard_table_layout_rc6.py"
      - "fi_swing_paper_shadow_rc6.py"
      - "fj_caucion_cash_sweep_shadow_rc6.py"
      - "fk_scalping_revision_metrics_rc6.py"
      - "fl_trader_dashboard_shadow_rc6.py"
      - "tests/test_rc6_scalping_revision_telemetry.py"
      - "tests/test_rc6_scalping_revision_metrics.py"
      - "tests/test_rc6_swing_paper_shadow.py"
      - "tests/test_rc6_caucion_cash_sweep_shadow.py"
      - "tests/test_rc6_trader_dashboard_shadow_observability.py"
      - ".github/workflows/rc6-scalping-revision-telemetry-20260911.yml"
      - ".github/workflows/rc6-scalping-telemetry-observability-20260911.yml"
      - ".github/workflows/rc6-trader-dashboard-shadow-observability-20260911.yml"
      - ".github/workflows/rc6-parallel-bundle-predeploy-cert-20260912.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYED_BASE_SHA: eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a
      DASHBOARD_OPERATION_MODE: PRODUCTION_PAPER
      CAUCIONES_AUTO_PLACEMENT: "false"
      PYTHONPATH: .
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install narrow certification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests fastapi python-multipart python-dotenv

      - name: Prove deployed baseline is exact ancestor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$DEPLOYED_BASE_SHA" HEAD)" = "$DEPLOYED_BASE_SHA"
          echo "DEPLOYED_BASE_ANCESTOR=GREEN"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"

      - name: Exact full-bundle delta guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$DEPLOYED_BASE_SHA"...HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/rc6-parallel-bundle-predeploy-cert-20260912.yml
          .github/workflows/rc6-scalping-revision-telemetry-20260911.yml
          .github/workflows/rc6-scalping-telemetry-observability-20260911.yml
          .github/workflows/rc6-trader-dashboard-shadow-observability-20260911.yml
          cf_intraday_scalping.py
          eq_dashboard_table_layout_rc6.py
          fi_swing_paper_shadow_rc6.py
          fj_caucion_cash_sweep_shadow_rc6.py
          fk_scalping_revision_metrics_rc6.py
          fl_trader_dashboard_shadow_rc6.py
          tests/test_rc6_caucion_cash_sweep_shadow.py
          tests/test_rc6_scalping_revision_metrics.py
          tests/test_rc6_scalping_revision_telemetry.py
          tests/test_rc6_swing_paper_shadow.py
          tests/test_rc6_trader_dashboard_shadow_observability.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo '--- EXPECTED FULL DELTA ---'
          cat /tmp/expected.txt
          echo '--- ACTUAL FULL DELTA ---'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo "FULL_BUNDLE_DELTA=GREEN"

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            cf_intraday_scalping.py \
            eq_dashboard_table_layout_rc6.py \
            fi_swing_paper_shadow_rc6.py \
            fj_caucion_cash_sweep_shadow_rc6.py \
            fk_scalping_revision_metrics_rc6.py \
            fl_trader_dashboard_shadow_rc6.py

      - name: Full targeted regression suite
        run: |
          python -m pytest -q \
            tests/test_rc6_scalping_revision_telemetry.py \
            tests/test_rc6_scalping_revision_metrics.py \
            tests/test_rc6_swing_paper_shadow.py \
            tests/test_rc6_caucion_cash_sweep_shadow.py \
            tests/test_rc6_trader_dashboard_shadow_observability.py \
            tests/test_rc6_scalping_intraday_fee_bonus.py \
            tests/test_rc6_scalping_active_paper_learning.py

      - name: Preserve 120 second contract policy and shadow invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fg_intraday_contract_policy_rc6 as contract
          import fi_swing_paper_shadow_rc6 as swing
          import fj_caucion_cash_sweep_shadow_rc6 as caucion
          assert contract.DEFAULT_MUTABLE_SECONDS == 120, contract.DEFAULT_MUTABLE_SECONDS
          swing.assert_shadow_only()
          caucion.assert_shadow_only()
          print('MUTABLE_WINDOW_SECONDS=120')
          print('SWING_PAPER=SHADOW_ONLY')
          print('CAUCION_CASH_SWEEP=SHADOW_ONLY')
          PY

      - name: Static execution-surface guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          shadow_files = [
              'fi_swing_paper_shadow_rc6.py',
              'fj_caucion_cash_sweep_shadow_rc6.py',
              'fk_scalping_revision_metrics_rc6.py',
              'fl_trader_dashboard_shadow_rc6.py',
          ]
          forbidden = [
              '/operar', 'send_order(', 'place_order(',
              'requests.post(', 'requests.put(', 'requests.delete(',
          ]
          violations = {}
          for name in shadow_files:
              src = Path(name).read_text(encoding='utf-8').lower()
              hits = [token for token in forbidden if token in src]
              if hits:
                  violations[name] = hits
          if violations:
              raise SystemExit(f'forbidden execution surface: {violations}')
          print('SHADOW_EXECUTION_SURFACE=NONE')
          PY

      - name: Prove production-sensitive execution modules unchanged
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$DEPLOYED_BASE_SHA"...HEAD)"
          for f in c_ppi_client.py bd_ppi_readonly_guard.py be_paper_engine.py bm_exit_supervisor.py p_risk_guardian.py bw_daily_risk.py dh_paper_dynamic_risk_gate_hf6.py; do
            if printf '%s\n' "$changed" | grep -Fxq "$f"; then
              echo "unexpected execution/risk module change: $f" >&2
              exit 1
            fi
          done
          echo "EXECUTION_RISK_CORE_UNCHANGED=GREEN"

      - name: Certification safety summary
        run: |
          test "${CAUCIONES_AUTO_PLACEMENT}" = "false"
          test "${DASHBOARD_OPERATION_MODE}" = "PRODUCTION_PAPER"
          echo "MODE=PRODUCTION_PAPER"
          echo "CAUCIONES_AUTO_PLACEMENT=false"
          echo "REAL_ORDER_SURFACE_ADDED=0"
          echo "RC6_PARALLEL_BUNDLE_PREDEPLOY=GREEN"
