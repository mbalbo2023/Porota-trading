name: RC6 runtime safety fixes

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - 'scripts/rc6_apply_runtime_safety_fixes.py'
      - 'tests/test_rc6_runtime_safety.py'
      - '.github/workflows/rc6-runtime-safety-fixes.yml'

permissions:
  contents: write

concurrency:
  group: rc6-runtime-safety-fixes
  cancel-in-progress: false

jobs:
  apply-prove-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - run: python scripts/rc6_apply_runtime_safety_fixes.py
      - run: python -m py_compile be_paper_engine.py bv_paper_runtime.py cf_sale_settlement.py
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused safety proofs
        run: python -m pytest -q tests/test_rc6_runtime_safety.py
      - name: Static safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'daily_loss_pct=None' be_paper_engine.py
          grep -q 'PAPER_ECONOMIC_GATE_MODE.*, "SHADOW"' bv_paper_runtime.py
          grep -A5 "basis=='PENDING_CONFIRMATION'" cf_sale_settlement.py | grep -q 'return None'
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Commit proven migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- be_paper_engine.py bv_paper_runtime.py cf_sale_settlement.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add be_paper_engine.py bv_paper_runtime.py cf_sale_settlement.py
          git commit -m 'RC6: fail closed on implicit risk and unconfirmed T+1 [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
