name: RC6 history quality deep audit 2026-09-06

on:
  push:
    branches:
      - audit/rc6-history-quality-deep-20260906

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_hist_audit"
          chmod 600 "$HOME/.ssh/porota_hist_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only history quality RCA
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_hist_audit" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/rc6-history-quality-deep.txt
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          LIVE_BRANCH=hotfix/rc6-cedear-us-labor-day-20260906
          LIVE_SHA=db26c76723bb988c956589c572b87cbcb4191731
          LIVE_IMAGE=porota-trading-bot:17.0.0-rc6
          test "$(git -C "$REPO" branch --show-current)" = "$LIVE_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$LIVE_SHA"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = "true|$LIVE_IMAGE|0|true"
          echo '=== RC6 HISTORY QUALITY DEEP AUDIT — READ ONLY ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json,re
          obs='/app/data/paper_v17/observer_v17.db'
          hist='/app/data/market_history.db'
          c=sqlite3.connect(f'file:{obs}?mode=ro',uri=True,timeout=30); c.row_factory=sqlite3.Row; c.execute('PRAGMA query_only=ON')
          h=sqlite3.connect(f'file:{hist}?mode=ro',uri=True,timeout=30); h.row_factory=sqlite3.Row; h.execute('PRAGMA query_only=ON')
          out={}
          out['observer_quick_check']=c.execute('PRAGMA quick_check').fetchone()[0]
          out['history_quick_check']=h.execute('PRAGMA quick_check').fetchone()[0]
          out['mode_orders']=dict(c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone())

          out['attempt_state_by_family']=[dict(r) for r in c.execute('''
            SELECT instrument_type,state,COUNT(*) identities,SUM(valid_rows) valid_rows,
                   MIN(valid_rows) min_rows,MAX(valid_rows) max_rows
            FROM production_history_attempts
            GROUP BY instrument_type,state ORDER BY instrument_type,state''')]

          if c.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='history_row_rejections_v2'").fetchone():
              out['rejections_total']=int(c.execute('SELECT COUNT(*) FROM history_row_rejections_v2').fetchone()[0])
              out['rejections_by_reason']=[dict(r) for r in c.execute('''
                SELECT reason,COUNT(*) rows,COUNT(DISTINCT symbol||'|'||instrument_type||'|'||market||'|'||settlement) identities
                FROM history_row_rejections_v2 GROUP BY reason ORDER BY rows DESC''')]
              out['rejections_by_family_reason']=[dict(r) for r in c.execute('''
                SELECT instrument_type,reason,COUNT(*) rows,COUNT(DISTINCT symbol) symbols
                FROM history_row_rejections_v2 GROUP BY instrument_type,reason ORDER BY rows DESC LIMIT 80''')]
              out['top_rejected_identities']=[dict(r) for r in c.execute('''
                SELECT symbol,instrument_type,market,settlement,reason,COUNT(*) rows
                FROM history_row_rejections_v2
                GROUP BY symbol,instrument_type,market,settlement,reason
                ORDER BY rows DESC LIMIT 60''')]

          # Simulate the current target ordering and expose why a complete identity can still be selected.
          rows=c.execute('''SELECT u.ticker,u.instrument_type,u.settlement,u.market,
              h.downloaded_at,a.attempted_at,a.state,a.valid_rows,
              CASE WHEN h.row_count>0 THEN 1 ELSE 0 END legacy_complete
            FROM candidate_universe u
            LEFT JOIN production_history h ON h.symbol=u.ticker
              AND h.instrument_type=u.instrument_type AND h.settlement=u.settlement
            LEFT JOIN production_history_attempts a ON a.symbol=u.ticker
              AND a.instrument_type=u.instrument_type AND a.settlement=u.settlement
            WHERE u.status='AVAILABLE' AND (u.can_simulate=1 OR u.instrument_type='INDICES')
            ORDER BY COALESCE(a.attempted_at,h.downloaded_at) IS NOT NULL,
              COALESCE(a.attempted_at,h.downloaded_at),u.instrument_type,u.ticker''').fetchall()
          first40=[dict(r) for r in rows[:40]]
          out['current_order_first40']=first40
          out['current_order_first40_summary']={
              'total':len(first40),
              'legacy_complete':sum(int(r['legacy_complete'] or 0) for r in first40),
              'not_legacy_complete':sum(1-int(r['legacy_complete'] or 0) for r in first40),
              'states':{}
          }
          for r in first40:
              k=str(r['state'] or 'NO_ATTEMPT')
              out['current_order_first40_summary']['states'][k]=out['current_order_first40_summary']['states'].get(k,0)+1

          # Proposed deterministic priority, for analysis only: never persisted or executed.
          rank={'NO_ATTEMPT':0,'ERROR':1,'EMPTY_OR_INVALID':2,'PARTIAL':3,'VALID_ROWS_WITH_REJECTIONS':4,'VALID_PAYLOAD':5}
          proposed=sorted((dict(r) for r in rows), key=lambda r:(
              1 if int(r['legacy_complete'] or 0) else 0,
              rank.get(str(r['state'] or 'NO_ATTEMPT').upper(),3),
              int(r['valid_rows'] or 0),
              str(r['instrument_type']),str(r['ticker']),str(r['settlement'])
          ))[:40]
          out['proposed_priority_first40']=proposed
          out['proposed_priority_summary']={
              'total':len(proposed),
              'legacy_complete':sum(int(r['legacy_complete'] or 0) for r in proposed),
              'not_legacy_complete':sum(1-int(r['legacy_complete'] or 0) for r in proposed),
              'states':{}
          }
          for r in proposed:
              k=str(r['state'] or 'NO_ATTEMPT')
              out['proposed_priority_summary']['states'][k]=out['proposed_priority_summary']['states'].get(k,0)+1

          out['canonical_by_family_source']=[dict(r) for r in h.execute('''
            SELECT instrument_type,source,COUNT(*) rows,
                   COUNT(DISTINCT symbol||'|'||market||'|'||settlement) identities,
                   MIN(date) first_day,MAX(date) latest_day
            FROM history_canonical_v2 GROUP BY instrument_type,source
            ORDER BY instrument_type,source''')]

          # Suffix concentration is diagnostic only; no identity mapping is inferred.
          if c.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='history_row_rejections_v2'").fetchone():
              suffix={}
              for r in c.execute('SELECT symbol,instrument_type,reason FROM history_row_rejections_v2'):
                  sym=str(r['symbol'] or '')
                  bucket='ENDS_C' if sym.endswith('C') else 'ENDS_D' if sym.endswith('D') else 'OTHER'
                  key=(str(r['instrument_type']),bucket,str(r['reason']))
                  suffix[key]=suffix.get(key,0)+1
              out['rejection_suffix_buckets']=[{'instrument_type':k[0],'bucket':k[1],'reason':k[2],'rows':v} for k,v in sorted(suffix.items(), key=lambda kv:kv[1], reverse=True)[:80]]

          c.close(); h.close()
          assert out['observer_quick_check']=='ok' and out['history_quick_check']=='ok'
          assert out['mode_orders']['mode']=='PRODUCTION_PAPER' and int(out['mode_orders']['real_orders_sent'] or 0)==0
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          print('RC6_HISTORY_QUALITY_DEEP_AUDIT=GREEN')
          PY
          echo "OBSERVER=$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)"
          echo 'RUNTIME_CHANGED=NO'
          echo 'NETWORK_CALLS=NO'
          HOST
          {
            echo '### RC6 history quality deep audit'
            echo '```text'
            sed -n '1,2000p' /tmp/rc6-history-quality-deep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
