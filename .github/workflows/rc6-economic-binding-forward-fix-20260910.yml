name: RC6 Economic Binding Forward Fix 2026-09-10
on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: ['.github/workflows/rc6-economic-binding-forward-fix-20260910.yml']
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert immutable RC6 PAPER safety identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo 'RC6_PAPER_SAFETY=GREEN'
      - name: Apply canonical BINDING fallbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          changes = {
              'bg_paper_dashboard.py': (
                  'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW").upper()',
                  'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING").upper()',
              ),
              'bv_paper_runtime.py': (
                  'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW"),',
                  'economics_mode=os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING"),',
              ),
          }
          for name,(old,new) in changes.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'UNEXPECTED_MATCH_COUNT:{name}:{text.count(old)}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          grep -q 'PAPER_ECONOMIC_GATE_MODE=BINDING' .env.example
          grep -q 'PAPER_ECONOMIC_GATE_MODE", "BINDING"' bg_paper_dashboard.py
          grep -q 'PAPER_ECONOMIC_GATE_MODE", "BINDING"' bv_paper_runtime.py
          echo 'ECONOMIC_BINDING_DEFAULTS=GREEN'
      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Re-run exact masked regression and economic contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q tests/test_hotfix_rc3_hf2.py::test_dashboard_expone_binding_y_guardas_hf3 tests/test_hotfix_rc3_hf2.py::test_economia_shadow_cuenta_apertura_con_fallo
          echo 'ECONOMIC_BINDING_REGRESSION=GREEN'
      - name: Persist forward fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bg_paper_dashboard.py bv_paper_runtime.py
          git diff --cached --check
          git commit -m 'fix(rc6): align economic gate operational defaults with BINDING contract'
          git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
      - name: Run complete suite and expose next failure
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -x -vv --tb=short > /tmp/pytest-economic-fix.txt 2>&1
          rc=$?
          echo "PYTEST_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '===== FIRST FAILURE EXTRACT ====='
            grep -nE '(^_{3,}|FAILED|ERROR|E   |AssertionError|NameError|TypeError|AttributeError|ImportError|ModuleNotFoundError|KeyError|ValueError)' /tmp/pytest-economic-fix.txt | tail -n 120 || true
            echo '===== LAST 180 LINES ====='
            tail -n 180 /tmp/pytest-economic-fix.txt || true
            exit "$rc"
          fi
          tail -n 100 /tmp/pytest-economic-fix.txt
          echo 'INTEGRATED_TESTS=GREEN'
      - name: Prove no real order capability introduced
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
