name: RC6 SRE critical INIT APPLY exact plan
on:
  push:
    branches: [ops/rc6-sre-deep-20261011]
    paths: [.github/workflows/rc6-sre-critical-apply-20261011.yml]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.ref == 'refs/heads/ops/rc6-sre-deep-20261011' && github.actor == 'mbalbo2023' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Admit exact paired global owner and successful plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import datetime as dt,json,os,re,urllib.request
          repo="mbalbo2023/Porota-trading"
          def get(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+path,
                headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                         "Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          run=get("actions/runs/38162933932")
          assert run["conclusion"]=="success" and run["run_attempt"]==1
          assert run["head_sha"]=="0e138562a8d7ac17e864b917b5329816b0bdb8d6"
          now=dt.datetime.now(dt.timezone.utc)
          owners=[]
          for issue in (471,473):
              comments=[]
              for page in range(1,20):
                  part=get(f"issues/{issue}/comments?per_page=100&page={page}")
                  comments+=part
                  if len(part)<100:break
              assert len(part)<100,"OWNER_PAGINATION_UNBOUNDED"
              mine=[]
              for c in comments:
                  body=c["body"] or ""
                  def field(key):
                      m=re.search(r"(?m)(?:^|[ |])"+re.escape(key)+r"=([^\s|]+)",body)
                      return m.group(1) if m else None
                  owner=field("DEPLOY_OWNER")
                  if not owner:continue
                  lease=field("SOURCE_LEASE_EXPIRES_UTC")
                  released=field("RELEASED")=="true"
                  if (owner not in ("NOT_ACQUIRED","NONE","RELEASED")
                      and owner!="WORK_RC6_SRE_20261011_1740Z"
                      and not released and lease
                      and dt.datetime.fromisoformat(lease.replace("Z","+00:00"))>now):
                      raise RuntimeError("OTHER_GLOBAL_DEPLOY_OWNER_ACTIVE")
                  if (owner=="WORK_RC6_SRE_20261011_1740Z"
                      and field("PLAN_JSON_SHA256")=="42ed53067f73cc706bbd626c66b9723169f3b64f08209059489bedcb4ac0f412"
                      and field("SOURCE_LEASE_EXPIRES_UTC")=="2026-10-11T18:35:00Z"
                      and field("RELEASED")=="false"):
                      mine.append(c["id"])
              assert mine and now<dt.datetime.fromisoformat("2026-10-11T18:35:00+00:00"),"OWNER_PAIR_EXPIRED_OR_MISSING"
              owners.append(mine[-1])
          assert owners==[6112131669,6112131516],("OWNER_PAIR_CHANGED",owners)
          print("GLOBAL_DEPLOY_OWNER=PAIRED_EXACT;PLAN_RUN=SUCCESS_ATTEMPT_1;OTHER_ACTIVE=NONE")
          PY
      - name: Fetch and check original plan bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/sre-plan"
          gh run download 38162933932 -R mbalbo2023/Porota-trading -n rc6-sre-critical-plan-38162933932-1 -D "$RUNNER_TEMP/sre-plan"
          echo "42ed53067f73cc706bbd626c66b9723169f3b64f08209059489bedcb4ac0f412  $RUNNER_TEMP/sre-plan/rc6-sre-critical-plan.json" | sha256sum -c -
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"sre-plan/rc6-sre-critical-plan.json"
          x=json.loads(p.read_text())
          assert x["schema"]=="porota.rc6.sre.critical-unit-plan.v1"
          assert x["mutation"]=="SINGLE_CRITICAL_UNIT_INIT_PRESERVE_HEALTH_RESTART"
          assert x["old_sha256"]=="401df866b4fcd89c96a363fd1d9a8aeacc4079b1db96a683173ae8eb187bd396"
          assert x["new_sha256"]=="f5af85d294036c5e96ba30d88d6bc4863dcd4b04f15824ac6feae6c68296feef"
          assert x["before"]["paper"]==["PRODUCTION_PAPER",0]
          PY
      - name: Apply only the sealed critical init patch
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DO_HOST" && test -n "$DO_USER"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6-sre-apply"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6-sre-apply" "$HOME/.ssh/known_hosts"
          tool_sha="$(sha256sum scripts/ops/rc6_sre_critical_repair.py | cut -d' ' -f1)"
          test "$tool_sha" = 5eb8d13f3f7bef756012d36661351e9da145bfb77d3f1eb47fbc2b65ce4283bb
          plan_b64="$(base64 -w0 "$RUNNER_TEMP/sre-plan/rc6-sre-critical-plan.json")"
          set +e
          timeout 220 ssh -i "$HOME/.ssh/rc6-sre-apply" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$DO_USER@$DO_HOST" "sudo -n python3 - --mode apply --tool-sha256 $tool_sha --plan-base64 $plan_b64" < scripts/ops/rc6_sre_critical_repair.py > "$RUNNER_TEMP/rc6-sre-critical-apply.json"
          rc=$?
          set -e
          if [ -s "$RUNNER_TEMP/rc6-sre-critical-apply.json" ]; then
            python3 -m json.tool "$RUNNER_TEMP/rc6-sre-critical-apply.json" >/dev/null || exit 5
            python3 - "$RUNNER_TEMP/rc6-sre-critical-apply.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print("CRITICAL_APPLY_VALIDATED="+str(x.get("validated")))
          PY
          else
            printf '{"schema":"porota.rc6.sre.critical-unit-apply-error.v1","result":"NO_JSON_FROM_HOST","mutation_state":"UNKNOWN","exit_code":%s}\n' "$rc" > "$RUNNER_TEMP/rc6-sre-critical-apply.json"
          fi
          sha256sum "$RUNNER_TEMP/rc6-sre-critical-apply.json"
          test "$rc" -eq 0
          python3 - "$RUNNER_TEMP/rc6-sre-critical-apply.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))["validated"] is True
          PY
      - name: Preserve apply result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-sre-critical-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-sre-critical-apply.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove runner-only SSH key
        if: always()
        run: rm -f "$HOME/.ssh/rc6-sre-apply"
