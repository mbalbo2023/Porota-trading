name: RC6 audit P0 small fixes

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - 'scripts/rc6_apply_audit_p0_small_fixes.py'
      - '.github/workflows/rc6-audit-p0-small-fixes.yml'

permissions:
  contents: write

concurrency:
  group: rc6-audit-p0-small
  cancel-in-progress: false

jobs:
  apply-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - name: Apply isolated fixes
        run: python scripts/rc6_apply_audit_p0_small_fixes.py
      - name: Compile
        run: python -m py_compile c_ppi_client.py bi_operational_services.py ak_byma_calendar.py
      - name: Static safety proof
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ORDER_GATE_MISSING' c_ppi_client.py
          ! grep -A2 -B1 'except ImportError:' c_ppi_client.py | grep -q 'pass'
          grep -q 'business_day and hour >=' bi_operational_services.py
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for root in (Path('systemd'),Path('deploy/systemd')):
              if not root.exists(): continue
              for p in root.glob('*.timer'):
                  t=p.read_text()
                  if 'Persistent=' in t and 'OnCalendar=' not in t and any(x in t for x in ('OnBootSec=','OnUnitActiveSec=','OnActiveSec=')):
                      bad.append(str(p))
          assert not bad,bad
          print('RC6_TIMER_PERSISTENT_SEMANTICS=GREEN')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TIMER_FILES < <(git diff --name-only -- 'systemd/*.timer' 'deploy/systemd/*.timer')
          FILES=(c_ppi_client.py bi_operational_services.py "${TIMER_FILES[@]}")
          if git diff --quiet -- "${FILES[@]}"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FILES[@]}"
          git commit -m 'RC6: fail closed order gate and suppress routine weekend close [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
