name: RC6 host backup and auto-check deep forensics

# Sunday 2026-09-06 evidence refresh before deciding RC6-native replacement versus retirement.
on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-host-backup-autocheck-deep-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only diagnosis
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/deep.txt
          set -euo pipefail
          ROOT=/opt/porota-trading
          DB="$ROOT/data/paper_v17/observer_v17.db"
          echo 'POROTA_BACKUP_AUTOCHECK_FORENSICS=START'
          cd "$ROOT"
          echo "BRANCH=$(git branch --show-current)"
          echo "HEAD=$(git rev-parse HEAD)"
          df -B1 / | awk 'NR==2{print "ROOT_BYTES=total="$2"|used="$3"|avail="$4"|pct="$5}'
          echo 'HOST_BACKUP_JOB_DB_EVIDENCE:'
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          uri='file:'+sys.argv[1]+'?mode=ro'
          c=sqlite3.connect(uri,uri=True,timeout=10)
          try:
              row=c.execute("SELECT job_key,last_run_at,last_success_at,state,detail FROM operational_jobs WHERE job_key='HOST_GENERAL_BACKUP'").fetchone()
              print('NONE' if row is None else '|'.join('' if x is None else str(x) for x in row))
          except Exception as e:
              print('READ_ERROR='+type(e).__name__+':'+str(e)[:500])
          finally:
              c.close()
          PY
          echo 'SOURCE_SYMLINKS:'
          find "$ROOT/data" "$ROOT/sre_vector_db" -type l -printf '%p -> %l\n' 2>/dev/null | head -n 100 || true
          echo 'BACKUP_DESTINATION:'
          sudo -n find /opt/porota-backups -maxdepth 1 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ|%s|%f\n' 2>/dev/null | sort | tail -n 20 || true
          echo 'BACKUP_RELEVANT_SIZE_BYTES:'
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          skip={'backups','restore_test','.git','.venv','__pycache__','.pytest_cache','.hypothesis'}
          total=0; files=0
          for base in ('data','sre_vector_db'):
              p=root/base
              if not p.exists(): continue
              for x in p.rglob('*'):
                  rel=x.relative_to(p)
                  if any(part in skip for part in rel.parts): continue
                  if x.is_file() and not x.name.endswith(('-wal','-shm')):
                      try: total += x.stat().st_size; files += 1
                      except OSError: pass
          print(f'files={files}|bytes={total}')
          PY
          echo 'AUTOCHECK_SOURCE_PROBES:'
          sudo -n grep -nE 'docker.*exec|timeout|TimeoutExpired|subprocess\.run|communicate|TELEGRAM|observer' /usr/local/sbin/porota-rc4-auto-check 2>/dev/null | head -n 120 || true
          echo 'AUTOCHECK_TIMER:'
          sudo -n systemctl show porota-rc4-auto-check.timer --no-pager -p NextElapseUSecRealtime -p LastTriggerUSec -p OnCalendar || true
          echo 'AUTOCHECK_LAST_REPORTS:'
          sudo -n find "$ROOT/data/diagnosticos/auto_checks" -maxdepth 1 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ|%s|%f\n' 2>/dev/null | sort | tail -n 12 || true
          echo 'POROTA_BACKUP_AUTOCHECK_FORENSICS=END'
          REMOTE
          {
            echo '### Backup + auto-check deep forensics — read only'
            echo '```text'
            sed -n '1,340p' /tmp/deep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
