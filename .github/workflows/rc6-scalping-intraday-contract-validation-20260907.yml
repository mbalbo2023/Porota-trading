name: RC6 scalping intraday contract validation 2026-09-07
on:
  push:
    branches: [hotfix/rc6-scalping-intraday-contract-20260907]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest fastapi requests
      - name: Apply deterministic integration patch in CI workspace
        run: python scripts/rc6_apply_scalping_intraday_policy.py cf_intraday_scalping.py
      - name: Prove source is patched and compiles
        run: |
          grep -q 'mutables_refrescados={refreshed}' cf_intraday_scalping.py
          grep -q 'from fg_intraday_contract_policy_rc6 import classify_revision, previous_for_session' cf_intraday_scalping.py
          python -m py_compile fg_intraday_contract_policy_rc6.py cf_intraday_scalping.py
      - name: Focused RC6 intraday contract and integrated scanner tests
        run: >-
          python -m pytest -q
          tests/test_intraday_contract_policy_rc6.py
          tests/test_intraday_scalping_rc6_integration.py
          tests/test_intraday_scalping_hf3.py::test_payload_observado_es_minuto_precio_volumen_sin_inventar_ohlc
          tests/test_intraday_scalping_hf3.py::test_volumen_se_confirma_solo_con_solapamiento_estable_y_minuto_nuevo
          tests/test_intraday_scalping_hf3.py::test_modificar_un_minuto_cerrado_frena_el_contrato
          tests/test_intraday_scalping_hf3.py::test_rotacion_no_excluye_familias_ni_mercados
      - run: python -c "import fg_intraday_contract_policy_rc6 as m; m.assert_fail_closed(); print('INTRADAY_POLICY_AND_INTEGRATION=GREEN_OFFLINE')"
      - name: Persist proven source change on isolated branch only
        run: |
          set -euo pipefail
          git add cf_intraday_scalping.py
          if git diff --cached --quiet; then
            echo 'SCALPING_SOURCE_ALREADY_PERSISTED=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc6): integrate scalping mutable-minute policy [skip ci]'
          git push origin HEAD:hotfix/rc6-scalping-intraday-contract-20260907
          echo 'SCALPING_SOURCE_PERSISTED=YES'
