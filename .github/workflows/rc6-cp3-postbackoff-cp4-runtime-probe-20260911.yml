name: RC6 CP3 Blocked Paths + CP4 Deployed Wiring 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-cp3-postbackoff-cp4-runtime-probe-20260911.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  cp3_blocked_paths_readonly:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail; install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Find sanitized successful capture metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          test "$(git -C /opt/porota-trading rev-parse HEAD)" = "$TARGET"; echo HOST_HEAD="$TARGET"; echo MUTATIONS=NONE
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import json,urllib.parse
          roots=[Path('/home'),Path('/opt/porota-trading/data'),Path('/tmp')]
          files=[]
          for root in roots:
              try: files += list(root.rglob('contract_*.json'))
              except Exception: pass
          files=sorted({str(p):p for p in files}.values(),key=lambda p:p.stat().st_mtime,reverse=True)[:20]
          print('CAPTURE_FILES_FOUND='+str(len(files)))
          for p in files:
              try:d=json.loads(p.read_text())
              except Exception:continue
              print('CAPTURE='+p.name+'|MTIME='+str(int(p.stat().st_mtime))+'|AUTH='+str(d.get('auth_status'))+'|ROUTES='+str(len(d.get('routes') or []))+'|ENDPOINTS='+str(len(d.get('endpoints') or {}))+'|BLOCKED='+str(len(d.get('blocked_nonread') or []))+'|ORDERS='+str(d.get('real_orders_sent')))
              for i,x in enumerate((d.get('blocked_nonread') or [])[:80]):
                  if not isinstance(x,dict):continue
                  method=str(x.get('method') or '')
                  u=urllib.parse.urlsplit(str(x.get('url') or ''))
                  print(f'BLOCKED_PATH={method}|{u.netloc}|{u.path}')
          PY
          echo '--- RECENT COLLECTION SUMMARY ---'
          sudo -n journalctl -u porota-contract-evidence-rc6.service --since '2026-09-11 14:30:00 UTC' --no-pager -n 260 | grep -E 'STATUS=GREEN_COLLECTION|AUTH_STATUS=|blocked_nonread|records|REAL_ORDERS_SENT=' | tail -n 140 || true
          echo CP3_BLOCKED_PATHS_RCA_COMPLETE=YES
          HOST

  cp4_deployed_wiring_readonly:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail; install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Compare host/container A3 wiring with deterministic mapper
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          test "$(git -C /opt/porota-trading rev-parse HEAD)" = "$TARGET"; echo HOST_HEAD="$TARGET"; echo MUTATIONS=NONE
          echo '--- SYSTEMD UNIT ---'; sudo -n systemctl cat porota-a3-history-rc6@.service --no-pager
          echo '--- HOST SOURCE HASH/IMPORT ---'
          sha256sum /opt/porota-trading/ew_a3_history_rc6.py /opt/porota-trading/fd_a3_identity_mapper_rc6.py 2>/dev/null || true
          grep -nE 'fd_a3_identity_mapper|porota_to_a3_dlr|_resolve_source_identity|CEM_SYMBOL_FAMILY_NOT_EXACT' /opt/porota-trading/ew_a3_history_rc6.py 2>/dev/null || true
          echo '--- CONTAINER SOURCE HASH/IMPORT ---'
          sudo -n docker exec -i porota_production_observer sh -lc "sha256sum /app/ew_a3_history_rc6.py /app/fd_a3_identity_mapper_rc6.py 2>/dev/null || true; grep -nE 'fd_a3_identity_mapper|porota_to_a3_dlr|_resolve_source_identity|CEM_SYMBOL_FAMILY_NOT_EXACT' /app/ew_a3_history_rc6.py 2>/dev/null || true"
          echo '--- SAFE OFFLINE MAPPER SMOKE INSIDE CONTAINER ---'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          try:
              import fd_a3_identity_mapper_rc6 as m
              for s in ['DLR/SEP26','DLR/DIC26','DLR/SEP26/OCT26','DLR/SEP26M']:
                  try: print(s+'=>'+m.porota_to_a3_dlr(s))
                  except Exception as e: print(s+'=>FAIL_CLOSED:'+type(e).__name__+':'+str(e))
          except Exception as e: print('MAPPER_IMPORT_ERROR='+type(e).__name__+':'+str(e))
          PY
          echo CP4_DEPLOYED_WIRING_RCA_COMPLETE=YES
          HOST
