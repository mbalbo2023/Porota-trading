name: RC6 F01 host read-only status

on:
  push:
    branches: [audit/rc6-f01-host-readonly-20260912]
    paths:
      - .github/workflows/rc6-f01-host-readonly-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_f01_readonly"
          chmod 600 "$HOME/.ssh/porota_f01_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect host state without mutation
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_f01_readonly" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          REPO=/opt/porota-trading
          echo "HOST_SHA=$(git -C "$REPO" rev-parse HEAD 2>/dev/null || echo UNAVAILABLE)"
          if [ -z "$(git -C "$REPO" status --porcelain 2>/dev/null)" ]; then echo "HOST_GIT_DIRTY=NO"; else echo "HOST_GIT_DIRTY=YES"; fi
          git -C "$REPO" status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | while IFS= read -r path; do
            [ -z "$path" ] || echo "HOST_GIT_DIRTY_PATH=$path"
          done
          echo "DISK_AVAIL_BYTES=$(df -PB1 "$REPO" 2>/dev/null | awk 'NR==2{print $4}' || echo UNKNOWN)"
          echo "HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:8000/health 2>/dev/null || echo UNAVAILABLE)"
          OBS="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}|{{.Image}}' porota_production_observer 2>/dev/null || echo UNAVAILABLE)"
          DASH="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.Image}}' porota_production_dashboard 2>/dev/null || echo UNAVAILABLE)"
          echo "OBSERVER=$OBS"
          echo "DASHBOARD=$DASH"
          OBS_ID="$(printf '%s' "$OBS" | awk -F'|' '{print $5}')"
          if [ -n "$OBS_ID" ] && [ "$OBS_ID" != "UNAVAILABLE" ]; then
            echo "IMAGE_COMMIT=$(sudo -n docker image inspect "$OBS_ID" -f '{{ index .Config.Labels "porota.commit" }}' 2>/dev/null || echo UNKNOWN)"
          else
            echo "IMAGE_COMMIT=UNKNOWN"
          fi
          SAFETY="$(sudo -n docker exec -i porota_production_observer python - <<'PY' 2>/dev/null || echo READ_FAILED
          import sqlite3
          c=sqlite3.connect("file:/app/data/paper_v17/observer_v17.db?mode=ro",uri=True,timeout=10)
          c.execute("PRAGMA query_only=ON")
          q=c.execute("PRAGMA quick_check").fetchone()[0]
          mode,orders=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close(); print("|".join(map(str,(q,mode,orders))))
          PY
          )"
          echo "PAPER_SAFETY=$SAFETY"
          for unit in porota-contract-evidence-rc6.timer porota-functional-health-rc6.timer \
            porota-history-postclose-rc6.timer porota-host-general-backup-rc6.timer \
            porota-preopen-rc6.timer porota-candle-integrity-rc6.timer \
            porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer \
            porota-a3-history-weekend-rc6.timer; do
            active="$(sudo -n systemctl is-active "$unit" 2>/dev/null || echo UNKNOWN)"
            enabled="$(sudo -n systemctl is-enabled "$unit" 2>/dev/null || echo UNKNOWN)"
            echo "TIMER=$unit|ACTIVE=$active|ENABLED=$enabled"
          done
          # Read file metadata/Git status and exact process/unit references; do not emit argv or file contents.
          TARGETS="$(sed 's/^[[:space:]]*//' <<'TARGET_PATHS'
          scripts/ppi_web_authenticated_probe_hf6.py
          v17_build_cache_cleanup_1.py
          v17_build_cache_cleanup_1_result.json
          v17_git_object_dirs_group_fix_r1.py
          v17_git_permissions_audit_r1.py
          v17_git_remote_diagnostic_r1.py
          v17_hf1_resume_deploy.pid
          v17_hf1_resume_deploy.sh
          v17_legacy_history_source_audit_1.py
          v17_legacy_history_source_audit_1_result.json
          v17_mode_manager_readonly_audit_1.py
          v17_mode_manager_readonly_audit_1_result.json
          v17_postcommission_inventory_1.py
          v17_postcommission_inventory_1_result.json
          v17_rc2_build_preflight_r1.py
          v17_rc2_canonical_prestart_backup_1.py
          v17_rc2_canonical_prestart_backup_1_result.json
          v17_rc2_consolidated_commissioning_1.py
          v17_rc2_consolidated_commissioning_1_result.json
          v17_rc2_consolidated_commissioning_2.py
          v17_rc2_consolidated_commissioning_2_result.json
          v17_rc2_consolidated_commissioning_3.py
          v17_rc2_consolidated_commissioning_3_result.json
          v17_rc2_disposable_paper_gate_1.py
          v17_rc2_disposable_paper_gate_1_result.json
          v17_rc2_isolated_smoke_r1.py
          v17_rc2_live_quote_canary_1.py
          v17_rc2_live_quote_canary_1_result.json
          v17_rc2_network_build_r2.py
          v17_rc2_offline_build_r1.py
          v17_rc2_ppi_readonly_canary_1.py
          v17_rc2_ppi_readonly_canary_2_result.json
          v17_rc2_source_update_r1.py
          v17_rc2_source_update_r2.py
          v17_rc2_source_update_r3.py
          v17_rc3_automated_deploy_1.py
          v17_rc3_automated_deploy_1_result.json
          v17_rc3_automated_deploy_2.py
          v17_rc3_automated_deploy_2_result.json
          v17_rc3_automated_deploy_3.py
          v17_rc3_automated_deploy_3_result.json
          v17_rc3_automated_deploy_4.py
          v17_rc3_automated_deploy_4_result.json
          v17_rc3_final_readonly_verification_2.py
          v17_rc3_final_readonly_verification_2_result.json
          v17_rc3_final_readonly_verification_3.py
          v17_rc3_final_readonly_verification_3_result.json
          v17_rc3_hf2_deploy_result.json
          v17_rc3_postacceptance_finalize_1.py
          v17_rc3_postacceptance_finalize_1_result_20260829T212931Z.json
          v17_rc3_resume_deploy_5.py
          v17_rc3_resume_deploy_5_result.json
          v17_rc3_root_mode_resume_6.py
          v17_rc3_root_mode_resume_6_result.json
          v17_trusted_history_catalog_import_1.py
          v17_trusted_history_catalog_import_1_result.json
          v17_trusted_history_catalog_import_2.py
          v17_trusted_history_catalog_import_2_result.json
          TARGET_PATHS
          )"
          NOW="$(date +%s)"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            full="$REPO/$rel"
            if [ ! -e "$full" ] && [ ! -L "$full" ]; then echo "PATH_META=$rel|MISSING"; continue; fi
            meta="$(stat -c '%F|birth=%w|mtime=%y|ctime=%z|bytes=%s|mtime_epoch=%Y' -- "$full" 2>/dev/null || echo STAT_FAILED)"
            mtime_epoch="$(stat -c '%Y' -- "$full" 2>/dev/null || echo 0)"
            age_days=$(( (NOW - mtime_epoch) / 86400 ))
            echo "PATH_META=$rel|$meta|age_days=$age_days"
            git_code="$(git -C "$REPO" status --porcelain=v1 --untracked-files=all -- "$rel" 2>/dev/null | awk 'NR==1{print substr($0,1,2)}' || true)"
            [ -n "$git_code" ] || git_code="CLEAN_OR_IGNORED"
            echo "PATH_GIT=$rel|$git_code"
          done <<< "$TARGETS"

          TARGETS="$TARGETS" python3 - "$REPO" <<'PY'
          import os, subprocess, sys
          from pathlib import Path

          root = os.path.realpath(sys.argv[1])
          targets = set(os.environ["TARGETS"].splitlines())
          exact = {os.path.normpath(os.path.join(root, item)): item for item in targets}
          seen = set()
          for pid in os.listdir("/proc"):
              if not pid.isdigit():
                  continue
              proc = Path("/proc") / pid
              try:
                  args = [os.fsdecode(x) for x in (proc / "cmdline").read_bytes().split(b"\\0") if x]
                  cwd = os.path.realpath(proc / "cwd")
                  comm = (proc / "comm").read_text().strip()
              except (OSError, UnicodeError):
                  continue
              for arg in args:
                  full = os.path.normpath(arg if os.path.isabs(arg) else os.path.join(cwd, arg))
                  rel = exact.get(full)
                  if rel and (rel, pid) not in seen:
                      print(f"PATH_PROCESS={rel}|PID={pid}|COMM={comm}")
                      seen.add((rel, pid))
          def output(argv):
              try:
                  return subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, timeout=3, check=False).stdout
              except Exception:
                  return ""
          for kind in ("service", "timer"):
              listing = output(["systemctl", "list-units", "--type=" + kind, "--state=active", "--no-legend", "--plain", "--no-pager"])
              for row in listing.splitlines():
                  fields = row.split()
                  if not fields:
                      continue
                  unit = fields[0]
                  service = output(["systemctl", "show", unit, "--property=Unit", "--value"]).strip() if kind == "timer" else unit
                  if not service:
                      continue
                  spec = output(["systemctl", "show", service, "--property=ExecStart", "--value"])
                  for rel in targets:
                      if rel in spec or os.path.basename(rel) in spec:
                          print(f"PATH_ACTIVE_UNIT={rel}|KIND={kind}|UNIT={unit}")
          pidfile = Path(root) / "v17_hf1_resume_deploy.pid"
          try:
              text = pidfile.read_text().splitlines()[0].strip()
              if not text.isdigit():
                  print("HF1_PIDFILE=INVALID")
              elif not Path("/proc", text, "cmdline").exists():
                  print("HF1_PIDFILE=STALE")
              else:
                  argv = [os.fsdecode(x) for x in Path("/proc", text, "cmdline").read_bytes().split(b"\\0") if x]
                  if any(os.path.basename(x) == "v17_hf1_resume_deploy.sh" for x in argv):
                      print(f"HF1_PIDFILE=ACTIVE_MATCH|PID={text}")
                  else:
                      print(f"HF1_PIDFILE=PID_EXISTS_NOT_MATCHED|PID={text}")
          except (OSError, IndexError):
              print("HF1_PIDFILE=ABSENT_OR_UNREADABLE")
          import time
          markers = (b"api.invertironline.com", b"seriehistorica", b"get_serie_historica")
          count = 0
          hz = os.sysconf("SC_CLK_TCK")
          for pid in os.listdir("/proc"):
              if not pid.isdigit():
                  continue
              proc = Path("/proc") / pid
              try:
                  raw = (proc / "cmdline").read_bytes().lower()
                  if not any(marker in raw for marker in markers):
                      continue
                  comm = (proc / "comm").read_text().strip()
                  fields = (proc / "stat").read_text().rsplit(")", 1)[1].strip().split()
                  start_ticks = int(fields[19])
                  elapsed = max(0, int(time.time() - start_ticks / hz))
                  print(f"IOL_HISTORY_PROCESS|PID={pid}|COMM={comm}|ELAPSED_SECONDS={elapsed}")
                  count += 1
              except (OSError, ValueError, IndexError):
                  pass
          print(f"IOL_HISTORY_QUERY_SIGNATURE_COUNT={count}")
          PY
          echo "HOST_MUTATION=NONE"
          echo "REAL_ORDER_ROUTES=NOT_CALLED"
          REMOTE
