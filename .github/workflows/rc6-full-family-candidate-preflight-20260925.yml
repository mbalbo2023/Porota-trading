name: RC6 full-family candidate preflight 2026-09-25
# candidate-refresh: 494f34721b2699966f8f24d3e8842bd1d2240e76

on:
  push:
    branches:
      - diag/rc6-availability-readonly-20260925

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-full-family-paper-promotion-20260925
          fetch-depth: 0

      - name: Pin exact candidate SHA
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="494f34721b2699966f8f24d3e8842bd1d2240e76"
          echo "CANDIDATE_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Compile changed promotion paths
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            iol_mcp_readonly_adapter_rc6.py \
            iol_shadow_observation_rc6.py \
            rc6_iol_family_reference.py \
            scripts/rc6_iol_shadow_collect.py \
            bu_instrument_catalog.py \
            bf_production_paper_observer.py \
            be_paper_engine.py \
            bq_exit_policy.py \
            dh_paper_dynamic_risk_gate_hf6.py \
            rc6_source_consolidation.py \
            ak_byma_calendar.py \
            co_market_sessions_hf6.py

      - name: Install repository runtime and test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run focused promotion and safety tests
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_iol_mcp_readonly_adapter_rc6.py \
            tests/test_iol_shadow_collector_rc6.py \
            tests/test_rc6_iol_family_reference.py \
            tests/test_rc6_complementary_catalog_merge.py \
            tests/test_rc6_observer_complementary_reconcile.py \
            tests/test_rc6_multisource_discovery.py \
            tests/test_rc6_family_readiness.py \
            tests/test_fixed_income_nominal_contract_rc6.py \
            tests/test_rc6_cauciones_contract.py \
            tests/test_rc6_option_paper_execution.py \
            tests/test_rc6_sector_settlement_fallback.py \
            tests/test_rc6_byma_morning_watch.py

      - name: Run BYMA contract calendar and session regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_byma_calendar.py \
            tests/test_byma_schedule_rc5.py \
            tests/test_rc6_byma_calendar_failclosed.py \
            tests/test_rc6_option_paper_execution.py \
            tests/test_exit_supervision_v17.py \
            tests/test_rc6_t1_settlement_hotfix.py

      - name: Run canonical release regression slice
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_rc6_operational_scope.py \
            tests/test_rc6_deploy_readiness_contract.py \
            tests/test_rc6_live_scope_gate_fallback.py \
            tests/test_rc6_take_profit_regression.py \
            tests/test_exit_supervision_v17.py \
            tests/test_derivatives_and_gate.py \
            tests/test_production_paper_v1634.py

      - name: Static BYMA and real-order guards
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          import iol_mcp_readonly_adapter_rc6 as iol_adapter

          changed = [
              "iol_mcp_readonly_adapter_rc6.py","iol_shadow_observation_rc6.py",
              "rc6_iol_family_reference.py","scripts/rc6_iol_shadow_collect.py",
              "bu_instrument_catalog.py","bf_production_paper_observer.py",
              "be_paper_engine.py","bq_exit_policy.py","dh_paper_dynamic_risk_gate_hf6.py",
          ]
          forbidden_tools = {
              "place_order","cancel_order","subscribe_fci","redeem_fci","place_caucion",
              "validate_order","validate_caucion","validate_fci_subscription","validate_fci_redemption",
          }
          assert not (iol_adapter.ALLOWED_TOOLS & iol_adapter.FORBIDDEN_ACCOUNT_OR_EXECUTION_TOOLS)
          for name in changed:
              tree=ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  # Block direct calls to external execution verbs. A local
                  # PAPER method definition named place_caucion is not a Call
                  # and therefore is not a false positive.
                  if isinstance(node.func, ast.Attribute) and node.func.attr in forbidden_tools:
                      raise SystemExit(f"FORBIDDEN_REAL_ROUTE_CALL:{name}:{node.func.attr}")
                  # Also block generic MCP client.call('execution_tool', ...).
                  if (isinstance(node.func, ast.Attribute) and node.func.attr == "call"
                          and node.args and isinstance(node.args[0], ast.Constant)
                          and node.args[0].value in forbidden_tools):
                      raise SystemExit(f"FORBIDDEN_MCP_EXECUTION_TOOL:{name}:{node.args[0].value}")

          source=Path("rc6_source_consolidation.py").read_text(encoding="utf-8")
          capture=Path("scripts/rc6_public_source_capture.py").read_text(encoding="utf-8")
          calendar=Path("ak_byma_calendar.py").read_text(encoding="utf-8")
          sessions=Path("co_market_sessions_hf6.py").read_text(encoding="utf-8")
          policy=Path("bq_exit_policy.py").read_text(encoding="utf-8")
          assert '"BYMA"' in source and "open.bymadata.com.ar" in source
          assert 'item.get("source") != "BYMA"' in capture
          assert "ANIOS_AUDITADOS" in calendar and "fail" in calendar.lower()
          assert "BYMA_HOURS_COMMUNICATION" in sessions and "19024" in sessions
          assert "OPTION_EXPIRY_TRADING_CUTOFF" in policy
          morning=Path("scripts/rc6_byma_morning_watch.py").read_text(encoding="utf-8")
          timer=Path("systemd/porota-byma-morning-watch-rc6.timer").read_text(encoding="utf-8")
          assert "OBSERVE_ONLY" in morning and "real_money_authorized" in morning
          assert "08:30:00 America/Argentina/Buenos_Aires" in timer and "Persistent=true" in timer
          assert '"OPCIONES"' in policy and '"BYMA"' in policy

          workflow=Path(".github/workflows/rc6-pr69-isolated-transactional-deploy-20260915.yml").read_text(encoding="utf-8")
          if "python /app/scripts/rc6_history_cutoff_repair_once.py" in workflow:
              raise SystemExit("ONE_SHOT_HISTORY_REPAIR_REENTERED_DEPLOY")
          print("STATIC_BYMA_AND_PAPER_SAFETY=GREEN")
          PY

      - name: Run complete repository test suite
        run: |
          set -Eeuo pipefail
          python -m pytest -q
