name: RC6 Canonical BINDING Source Fix 2026-09-10

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths:
      - '.github/workflows/rc6-canonical-binding-source-fix-20260910.yml'

permissions:
  contents: write

jobs:
  canonical-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert immutable RC6 PAPER safety identity
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Canonicalize active economic binding source
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('porota_mode_manager.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('"PAPER_ECONOMIC_GATE_MODE": "SHADOW",', '"PAPER_ECONOMIC_GATE_MODE": "BINDING",'),
              ('HF3_FROZEN_PAPER_SETTINGS = {', 'RC6_FROZEN_PAPER_SETTINGS = {'),
              ('values.update(HF3_FROZEN_PAPER_SETTINGS)', 'values.update(RC6_FROZEN_PAPER_SETTINGS)'),
              ('# HF6: el freno blando deja de abrir; el límite duro recién entonces', '# RC6: el freno blando deja de abrir; el límite duro recién entonces'),
              ('# ninguna de las ocho identidades HF5; catálogo, libro y portones siguen', '# conserva el foco operativo validado; catálogo, libro y portones siguen'),
              ('# .env viejo porque volvería a abrir con economía negativa o riesgo HF2.', '# .env viejo porque volvería a abrir con economía negativa o riesgo obsoleto.'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('MISSING_EXPECTED_SOURCE:'+old)
              s = s.replace(old, new)
          if 'HF3_FROZEN_PAPER_SETTINGS' in s:
              raise SystemExit('ACTIVE_HF3_CONFIG_NAME_REMAINS')
          p.write_text(s, encoding='utf-8')

          p = Path('be_paper_engine.py')
          s = p.read_text(encoding='utf-8')
          changes = [
              ('economics_mode="SHADOW", min_net_reward_risk="1.20",',
               'economics_mode="BINDING", min_net_reward_risk="1.20",'),
              ('self.economics_mode = str(economics_mode or "SHADOW").upper()',
               'self.economics_mode = str(economics_mode or "BINDING").upper()'),
          ]
          for old,new in changes:
              if s.count(old) != 1:
                  raise SystemExit(f'UNEXPECTED_MATCH_COUNT:{old}:{s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from porota_mode_manager import paper_settings
          cfg=paper_settings({})
          assert cfg['PAPER_ECONOMIC_GATE_MODE']=='BINDING', cfg['PAPER_ECONOMIC_GATE_MODE']
          print('RC6_CANONICAL_ECONOMIC_BINDING=GREEN')
          PY
      - name: Install tests
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Prove exact masked contracts first
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_hotfix_rc3_hf4.py::test_configuracion_desplegada_no_es_un_noop \
            tests/test_hotfix_rc3_hf4.py::test_parametros_de_riesgo_hf3_siguen_congelados \
            tests/test_hotfix_rc3_hf2.py::test_dashboard_expone_binding_y_guardas_hf3 \
            tests/test_caucion_ledger_v17.py::test_caucion_rota_no_detiene_supervision_ni_salidas_spot \
            tests/test_daily_risk_outbox_v17.py::test_aviso_y_fill_comparten_commit_y_rollback
          echo CANONICAL_BINDING_REGRESSIONS=GREEN
      - name: Persist canonical source fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add porota_mode_manager.py be_paper_engine.py
          git diff --cached --check
          git commit -m 'fix(rc6): canonicalize economic binding configuration source'
          git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
      - name: Run full suite and expose next failure
        run: |
          set +e
          PYTHONPATH=. pytest -x -vv --tb=short > /tmp/pytest-rc6-canonical.txt 2>&1
          rc=$?
          echo "PYTEST_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '===== FIRST FAILURE ====='
            grep -nE '(^_{3,}|FAILED|ERROR|E   |AssertionError|NameError|TypeError|AttributeError|ImportError|ModuleNotFoundError|KeyError|ValueError)' /tmp/pytest-rc6-canonical.txt | tail -n 120 || true
            echo '===== LAST 180 LINES ====='
            tail -n 180 /tmp/pytest-rc6-canonical.txt || true
            exit "$rc"
          fi
          tail -n 100 /tmp/pytest-rc6-canonical.txt
          echo INTEGRATED_TESTS=GREEN
      - name: Prove safety invariants
        if: always()
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo REAL_ORDER_ROUTES=NOT_CALLED
          echo REAL_ORDER_TEST=NOT_PERFORMED
