name: RC6 diagnostic failures

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-diagnostic-failures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
      - run: docker build --pull=false -t porota-rc6-diag:${GITHUB_SHA} .
      - name: Residual partial-allocation admission reason
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app:/app/tests \
            --entrypoint bash porota-rc6-diag:${GITHUB_SHA} -lc '
              set -euo pipefail
              cat >/tmp/partial_probe.py <<"PY"
          from dataclasses import replace
          from pathlib import Path
          import tempfile
          from be_paper_engine import D, PaperBroker, PaperStore
          from test_production_paper_v1634 import quote

          root=Path(tempfile.mkdtemp())
          b=PaperBroker(PaperStore(str(root/"partial.db")), initial_cash="10000",
                        initial_cash_by_currency={"ARS":"10000"}, daily_loss_pct="100")
          base=replace(quote(ask_size="100"), settlement="INMEDIATA", currency="ARS")
          print("FIRST_OPEN", b._open(base,D(".8"),{}))
          p=b.store.open_positions()[0]
          first=replace(quote(minute=1,bid_size="40",price="110"), settlement="INMEDIATA", currency="ARS")
          print("PARTIAL_CLOSE", b._close(p,first,"TEST_PARTIAL"))
          remaining=b.store.open_positions()[0]
          candidate=quote(symbol="ALUA",minute=2,ask_size="100")

          wrong_mark=quote(symbol=remaining["symbol"],minute=2,ask_size="100")
          print("WRONG_MARK_SETTLEMENT", wrong_mark.settlement, "POSITION_SETTLEMENT", remaining["settlement"])
          b.store.add_quote(wrong_mark)
          print("ADMISSION_WITH_WRONG_MARK", b.admission_error(candidate,candidate.observed_at))
          print("OPEN_WITH_WRONG_MARK", b._open(candidate,D(".8"),{}))

          right_mark=replace(wrong_mark, settlement=remaining["settlement"], currency=remaining["currency"], market=remaining["market"])
          b.store.add_quote(right_mark)
          print("RIGHT_MARK_SETTLEMENT", right_mark.settlement)
          print("ADMISSION_WITH_RIGHT_MARK", b.admission_error(candidate,candidate.observed_at))
          print("OPEN_WITH_RIGHT_MARK", b._open(candidate,D(".8"),{}))
          PY
              python /tmp/partial_probe.py
            '

      - name: Targeted admission and risk probes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-diag:${GITHUB_SHA} -lc '
          cd /app
          cat >/tmp/rc6_probe.py <<"PY"
          from pathlib import Path
          from dataclasses import replace
          import sys, tempfile
          sys.path.insert(0,"/app")
          sys.path.insert(0,"/app/tests")
          from be_paper_engine import D, PaperBroker, PaperStore
          from bs_instrument_contracts import InstrumentContract
          from test_production_paper_v1634 import quote

          root=Path(tempfile.mkdtemp())
          at="2026-08-28T11:00:00-03:00"

          def show(label, broker, q):
              try:
                  print(label, broker._open(q,D(".8"),{}))
              except Exception as exc:
                  print(label, "EXC", type(exc).__name__, str(exc))

          base=quote(symbol="AAPLD",at=at,ask_size="10000",bid_size="10000")
          contract=InstrumentContract("AAPLD","CEDEARS","USD_MEP","BYMA","INMEDIATA",D("1"),D("1"),"FIXTURE")
          q=replace(base,asset_class="CEDEARS",settlement="INMEDIATA",currency="USD_MEP",market="BYMA",contract=contract)
          show("MEP", PaperBroker(PaperStore(str(root/"mep.db")),initial_cash_by_currency={"USD_MEP":"10000"}), q)

          b=PaperBroker(PaperStore(str(root/"multi.db")),initial_cash="100000",max_positions=5)
          for i in range(5):
              qi=quote(symbol=f"ABIERTA{i}",at=at,ask_size="1000")
              show(f"MULTI{i}",b,qi)

          b=PaperBroker(PaperStore(str(root/"qty.db")),initial_cash="1000",risk_pct="1",max_position_pct="1",max_total_exposure_pct="1",slippage_bps="0")
          show("QTY",b,replace(quote(ask_size="100000"),ask=D("100")))
          if b.store.open_positions(): print("QTY_VALUE",b.store.open_positions()[0]["quantity"])

          b=PaperBroker(PaperStore(str(root/"norisk.db")),initial_cash="10000",daily_loss_pct=None)
          show("NO_RISK",b,quote(at=at,ask_size="100"))
          PY
          python /tmp/rc6_probe.py
          '
      - name: Daily loss outbox isolated regression
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-diag:${GITHUB_SHA} -lc '
              cd /app
              python -m pytest -vv -s -p no:cacheprovider --tb=long tests/test_daily_risk_outbox_v17.py::test_limite_se_revalida_dentro_del_lock_antes_del_fill
            '
          rc=$?
          echo DAILY_LOSS_ATOMIC_TEST_RC=$rc
          exit 0
