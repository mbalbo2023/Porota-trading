name: RC6 diagnostic failures

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-diagnostic-failures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
      - run: docker build --pull=false -t porota-rc6-diag:${GITHUB_SHA} .
      - name: Modern exact failure probes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-diag:${GITHUB_SHA} -lc '
              set +e
              for spec in \
                tests/test_daily_risk_outbox_v17.py \
                tests/test_dashboard_paper_v1634.py \
                tests/test_dashboard_session.py \
                tests/test_exit_supervision_v17.py \
                tests/test_operational_safety_v163.py \
                tests/test_partial_allocation_integrity_v17.py \
                tests/test_prepare_directory_v17.py \
                tests/test_open_entry_terms_v17.py \
                tests/test_production_paper_v1634.py \
                tests/test_rc6_runtime_safety.py \
                tests/test_rc6_host_backup_symlink.py
              do
                echo "===== $spec ====="
                python -m pytest -q -p no:cacheprovider --tb=short "$spec"
                echo "RC=$?"
              done
              exit 0
            ' | tee rc6-diag.log
          {
            echo '### RC6 modern diagnostic probes'
            echo '```text'
            tail -n 900 rc6-diag.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
