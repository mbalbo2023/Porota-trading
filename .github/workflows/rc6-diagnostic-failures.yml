name: RC6 diagnostic failures

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-diagnostic-failures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
      - run: docker build --pull=false -t porota-rc6-diag:${GITHUB_SHA} .
      - name: Exact open and failure probes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e ENVIRONMENT=SANDBOX \
            -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 \
            -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-diag:${GITHUB_SHA} -lc '
              set +e
              python - <<"PY"
from pathlib import Path
import tempfile
from be_paper_engine import PaperBroker,PaperStore,D
from tests.test_production_paper_v1634 import quote
root=Path(tempfile.mkdtemp())
b=PaperBroker(PaperStore(str(root/"p.db")),initial_cash="10000")
for sym in ("ALUA","GGAL","YPFD","PAMP","COME","BMA"):
    ok,reason,pid=b._open(quote(symbol=sym,at="2026-08-28T11:00:00-03:00",ask_size="100"),D(".8"),{})
    print(f"OPEN_PROBE|{sym}|ok={ok}|reason={reason}|pid={pid}|opens={len(b.store.open_positions())}")
print("DAILY_RISK", None if b.daily_risk is None else (str(b.daily_risk.limit_pct),str(b.daily_risk.soft_limit_pct)))
PY
              for spec in \
                "tests/test_daily_risk_outbox_v17.py::test_aviso_y_fill_comparten_commit_y_rollback" \
                "tests/test_daily_risk_outbox_v17.py::test_resumen_fallido_viejo_se_encola_y_ack_actualiza_estado" \
                "tests/test_daily_risk_outbox_v17.py::test_limite_se_revalida_dentro_del_lock_antes_del_fill" \
                "tests/test_dashboard_paper_v1634.py::test_vivo_esta_enrutado_al_panel_consolidado" \
                "tests/test_dashboard_session.py::test_actividad_en_vivo_responde_con_sesion_valida" \
                "tests/test_exit_supervision_v17.py::test_no_fabrica_fill_con_mercado_cerrado_ni_calendario_desconocido[2026-08-28T16:55:00-03:00]" \
                "tests/test_operational_safety_v163.py::test_motor_heredado_no_supera_datos_incompletos_ni_en_scalping[False-OK]" \
                "tests/test_partial_allocation_integrity_v17.py::test_error_bloquea_caja_riesgo_y_caucion_sin_cegar_otro_stop[source]" \
                "tests/test_prepare_directory_v17.py::test_prepares_exact_empty_directory_and_removes_probe"
              do
                echo "===== $spec ====="
                python -m pytest -p no:cacheprovider -vv --tb=long "$spec"
                echo "RC=$?"
              done
            ' | tee rc6-diag.log
          {
            echo '### RC6 diagnostic failure probes'
            echo '```text'
            tail -n 700 rc6-diag.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
