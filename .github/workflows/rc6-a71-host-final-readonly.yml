name: RC6 A74 candidate menu regression and installed 52-view audit
'on':
  push:
    branches:
    - ops/rc6-a71-host-audit-20261025
    paths:
    - .github/workflows/rc6-a71-host-final-readonly.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  candidate_menu_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 8d2e2343e6cf54264a77a4b99822377c4ccd335f
        fetch-depth: 2
    - name: Use runner browser
      shell: bash
      run: |-
        set -Eeuo pipefail
        python3 -m pip install --disable-pip-version-check playwright==1.55.0
        command -v google-chrome
    - name: Reproduce base failure and candidate pointer Escape focus success
      shell: bash
      run: "set -Eeuo pipefail\npython3 - <<'PY'\n\"\"\"Real browser, intercepted synthetic shell only: base versus candidate.\"\"\"\nimport ast,datetime,json,os,pathlib,shutil,subprocess,types\nfrom playwright.sync_api import sync_playwright\nfrom rc6_trader_dashboard.navigation import DESTINATIONS\nfrom rc6_trader_dashboard.shell import render\nBASE='f351009b528747d7a593946d0100646cb540bc3a'\ndef source(path):\n    return subprocess.check_output(['git','show',BASE+':'+path],text=True)\nnamespace={'__name__':'rc6_trader_dashboard.a74_base_shell','__package__':'rc6_trader_dashboard'}\nexec(compile(source('rc6_trader_dashboard/shell.py'),'base-shell.py','exec'),namespace)\ntree=ast.parse(source('rc6_trader_dashboard/design_system.py'))\nfor node in tree.body:\n    if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ('CSS','SCRIPT'):\n        namespace[node.targets[0].id]=ast.literal_eval(node.value)\nprojection=types.SimpleNamespace(runtime={'mode':'PRODUCTION_PAPER','session_state':'MARKET_CLOSED','real_orders_sent':0,'heartbeat_freshness':'FRESH','market_freshness':'STALE'},shadow={'report':{}},shadow_fresh=False,filters={},now=datetime.datetime.now(datetime.timezone.utc))\n\
        documents={'before':namespace['render'](DESTINATIONS[0],'resumen',projection,'<p>OFFHOST SYNTHETIC LAYOUT CONTRACT ONLY</p>'),\n           'after':render(DESTINATIONS[0],'resumen',projection,'<p>OFFHOST SYNTHETIC LAYOUT CONTRACT ONLY</p>')}\nR={'schema':'RC6_A74_MENU_BEFORE_AFTER_BROWSER_V1','base_sha':BASE,'candidate_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'network':'INTERCEPTED_SYNTHETIC_LAYOUT_ONLY','provider_requests':0,'cases':[]}\nwith sync_playwright() as p:\n    browser=p.chromium.launch(headless=True,executable_path=shutil.which('google-chrome'))\n    page=browser.new_page();page.set_default_timeout(3000);errors=[]\n    page.on('pageerror',lambda error:errors.append(type(error).__name__))\n    current={'html':''}\n    page.route('http://menu.test/**',lambda route:route.fulfill(status=200,content_type='text/html',body=current['html']))\n    for variant,html in documents.items():\n      current['html']=html\n      for width in (800,390,1440):\n\
        \        page.set_viewport_size({'width':width,'height':980});page.goto('http://menu.test/',wait_until='load')\n        row={'variant':variant,'width':width,'primary_destinations':page.locator('.primary-nav > a').count()};assert row['primary_destinations']==8\n        menu=page.get_by_role('button',name='Men\xFA',exact=True);close=page.get_by_role('button',name='Cerrar men\xFA',exact=True)\n        if width<=1024:\n            menu.click();assert menu.get_attribute('aria-expanded')=='true'\n            visible=close.count()==1 and close.is_visible();row['visible_close']=visible\n            row['opening_toggle_unobstructed']=bool(menu.evaluate('e=>{const b=e.getBoundingClientRect();return e.contains(document.elementFromPoint(b.left+b.width/2,b.top+b.height/2));}'))\n            if variant=='before':\n                assert not visible;row['expected_missing_control_reproduced']=True;page.keyboard.press('Escape')\n            else:\n                assert visible\n                bounds=close.bounding_box();assert\
        \ bounds['height']>=44\n                close.click();assert menu.get_attribute('aria-expanded')=='false'\n                assert menu.evaluate('e=>document.activeElement===e')\n                row['pointer_close_and_focus_restored']=True\n                menu.click();page.keyboard.press('Escape');assert menu.get_attribute('aria-expanded')=='false'\n                assert menu.evaluate('e=>document.activeElement===e');row['escape_and_focus_restored']=True\n        else:\n            assert not menu.is_visible()\n            if close.count():assert not close.is_visible()\n            row['desktop_drawer_controls_hidden']=True\n        R['cases'].append(row)\n    browser.close();assert not errors\nR['js_errors']=len(errors);R['status']='PASS';R['source_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()\n(pathlib.Path(os.environ['RUNNER_TEMP'])/'a74_menu_regression.json').write_text(json.dumps(R,sort_keys=True))\nprint('A74_MENU_REGRESSION='+json.dumps(R,sort_keys=True),flush=True)\n\
        PY\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rc6-a74-candidate-menu-regression
        path: |-
          ${{ runner.temp }}/a74_menu_regression.json
        retention-days: 7
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      A74_PROBE: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 8d2e2343e6cf54264a77a4b99822377c4ccd335f
        fetch-depth: 2
    - name: Use runner Chrome without system package downloads
      shell: bash
      run: |-
        set -Eeuo pipefail
        python3 -m pip install --disable-pip-version-check playwright==1.55.0 cryptography==44.0.2
        command -v google-chrome
        google-chrome --version
