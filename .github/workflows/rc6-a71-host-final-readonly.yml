name: 'RC6 A74 installed watchdog calendar after #741'
'on':
  push:
    branches:
    - ops/rc6-a71-host-audit-20261025
    paths:
    - .github/workflows/rc6-a71-host-final-readonly.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
    - name: Read exact installed calendar and next elapse without invoking service
      shell: bash
      run: |
        set -Eeuo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a74"
        chmod 600 "$HOME/.ssh/rc6_a74"
        printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"
        umask 077
        timeout 25 ssh -i "$HOME/.ssh/rc6_a74" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'python3 -' > "$RUNNER_TEMP/a74_watchdog_installed.json" <<'PY'
        import datetime,json,pathlib,subprocess,zoneinfo
        unit='porota-market-watch-silence-rc6.timer'
        def read(args):
          p=subprocess.run(args,capture_output=True,text=True,timeout=6)
          if p.returncode:raise RuntimeError('READ_FAILED')
          return p.stdout
        body=read(['systemctl','cat',unit,'--no-pager'])
        fields=dict(line.split('=',1) for line in read(['systemctl','show',unit,'-p','ActiveState','-p','NextElapseUSecRealtime','-p','Unit','--no-pager']).splitlines() if '=' in line)
        marker=json.loads(pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json').read_text())
        schedules=[line.split('=',1)[1] for line in body.splitlines() if line.startswith('OnCalendar=')]
        expected=['Mon..Fri *-*-* 11..16:03,13,23,33,43,53:00 America/Argentina/Buenos_Aires','Mon..Fri *-*-* 17:03,13:00 America/Argentina/Buenos_Aires']
        assert schedules==expected and fields.get('ActiveState')=='active'
        assert fields.get('Unit')=='porota-market-watch-silence-rc6.service'
        assert marker.get('deploy_sha')=='b183a9e8b9b9028d647390c006a8512cb0dc9f52' and marker.get('mode')=='PRODUCTION_PAPER' and marker.get('real_orders_sent')==0
        assert marker.get('real_order_routes')=='NOT_CALLED' and marker.get('image_id')=='sha256:41155071b25004454ae5f96ef430f5ed7104079e85103eef3c62f7bd08034cca'
        next_elapse=fields.get('NextElapseUSecRealtime','')
        assert '2026-10-26' in next_elapse and ':03:' in next_elapse
        out={'schema':'RC6_A74_WATCHDOG_INSTALLED_V1','source_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'timer':fields,'calendar':schedules,'candidate_sha':marker.get('candidate_sha'),'deploy_sha':marker.get('deploy_sha'),'image_id':marker.get('image_id'),'mode':marker.get('mode'),'real_orders_sent':marker.get('real_orders_sent'),'real_order_routes':marker.get('real_order_routes')}
        print(json.dumps(out,sort_keys=True))
        PY
        python3 - <<'PY'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'a74_watchdog_installed.json'
        d=json.loads(p.read_text())
        assert d['timer']['ActiveState']=='active' and len(d['calendar'])==2
        print('A74_WATCHDOG_INSTALLED=GREEN|next='+d['timer']['NextElapseUSecRealtime'])
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rc6-a74-watchdog-installed
        path: ${{ runner.temp }}/a74_watchdog_installed.json
        retention-days: 7
    - name: Delete runner credential
      if: always()
      shell: bash
      run: rm -f "$HOME/.ssh/rc6_a74"
