name: RC6 A71 bounded failure and family cut audit
on:
  push:
    branches: [ops/rc6-a71-host-audit-20261025]
    paths: [.github/workflows/rc6-a71-host-final-readonly.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Sanitized diagnoses and SHADOW family cut
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a71"
          chmod 600 "$HOME/.ssh/rc6_a71"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/rc6_a71" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'python3 -' > "$RUNNER_TEMP/a71_final.json" <<'PY'
          import datetime,gzip,json,pathlib,re,sqlite3,subprocess,time
          root=pathlib.Path('/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/dynamic-shadow')
          output={'source_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'a3':{},'a3_schema':{},'shadow':{},'timer':{},'closed_probe_table_counts':{},'equity_cursor_35s':{},'warnings':[]}
          def call(argv,seconds=5):
              try:
                  p=subprocess.run(argv,capture_output=True,text=True,timeout=seconds)
                  return p.returncode,p.stdout[:100000]
              except (OSError,subprocess.TimeoutExpired):return 124,''
          # Never emit raw journal messages, SQL, traceback paths, or provider data.
          for mode in ('DAILY_INCREMENTAL','RECONCILE','WEEKEND_DEEP'):
              unit='porota-a3-history-rc6@'+mode+'.service'
              rc,raw=call(['sudo','-n','journalctl','-u',unit,'-n','45','--no-pager','-o','json'],5)
              frames=[];errors=[];results=[]
              for line in raw.splitlines():
                  try:message=str(json.loads(line).get('MESSAGE',''))
                  except (ValueError,TypeError):continue
                  match=re.search(r'File "[^"]*/([A-Za-z0-9_]+\.py)", line ([0-9]{1,5})',message)
                  if match:frames.append({'module':match.group(1),'line':int(match.group(2))})
                  match=re.search(r'\b(SnapshotError|ValueError|sqlite3\.OperationalError):\s*([A-Z][A-Z0-9_]{2,90})\b',message)
                  if match:errors.append([match.group(1),match.group(2)])
                  try:
                      j=json.loads(message)
                      if isinstance(j,dict):results.append({k:j.get(k) for k in ('ran','reason','mode','selected','failed','complete') if k in j})
                  except (ValueError,TypeError):pass
              output['a3'][mode]={'journal_rc':rc,'frames':frames[-12:],'errors':errors[-3:],'results':results[-2:]}
          code="import sqlite3,json; c=sqlite3.connect('file:/app/data/market_history.db?mode=ro',uri=True,timeout=.1); c.execute('PRAGMA query_only=ON'); print(json.dumps({n:[r[1] for r in c.execute('PRAGMA table_info('+n+')')] for n in ('history_versions_v2','history_canonical_v2','history_close_versions_v1','history_close_canonical_v1')})); c.close()"
          rc,raw=call(['sudo','-n','docker','exec','porota_production_observer','python','-c',code],6)
          output['a3_schema']={'rc':rc}
          if rc==0:
              try:output['a3_schema']['columns']=json.loads(raw)
              except ValueError:output['a3_schema']['error']='PARSE_FAILED'
          if root.is_dir():
              def safe_read(p,compressed=False):
                  if not p.is_file() or p.is_symlink() or p.stat().st_size>4*1024*1024:return None
                  with (gzip.open(p,'rt') if compressed else open(p,'r')) as stream:
                      envelope=json.load(stream)
                  return envelope.get('payload') if isinstance(envelope,dict) else None
              for name in ('status.json','idle.json','publication.json','CURRENT.json'):
                  try:
                      p=root/name;obj=safe_read(p)
                      if not isinstance(obj,dict):continue
                      keys=('schema','as_of','phase','status','mode','error_class','error_module',
                            'error_line','runtime_read_stage','source_as_of','heartbeat_at',
                            'last_generation_id','last_source_as_of','source_freshness_renewed',
                            'provider_requests','real_orders_sent','real_routes','catalog_ready_count',
                            'entry_signal_lab_status','operational_funnel_status','file','sequence',
                            'total_seconds','total_cpu_seconds','poll_seconds')
                      safe={k:obj[k] for k in keys if k in obj and isinstance(obj[k],(str,int,float,bool,type(None)))}
                      if isinstance(obj.get('generation_timing'),dict):
                          t=obj['generation_timing'];safe['timing']={k:t.get(k) for k in (
                              'tick_seconds','tick_cpu_seconds','process_peak_rss_kib','stages_seconds',
                              'stages_cpu_seconds') if k in t}
                      output['shadow'][name]=safe
                  except (OSError,ValueError,TypeError):output['shadow'][name]={'error':'READ_FAILED'}
              evidence=pathlib.Path('/opt/porota-trading/data/validation/candle_inmarket_latest.json')
              try:
                  if evidence.is_file() and not evidence.is_symlink() and evidence.stat().st_size<65536:
                      value=json.loads(evidence.read_text())
                      output['timer']['candle_inmarket_evidence']={k:value.get(k) for k in
                          ('status','observed_at','expires_at','worker_state','current_cursor',
                           'baseline_cursor','dirty_due_bars','collection_error','checks')}
              except (OSError,ValueError,TypeError):output['timer']['candle_inmarket_evidence']={'error':'READ_FAILED'}
              try:
                  current=safe_read(root/'CURRENT.json') or {}
                  cut_name=current.get('file','')
                  if re.fullmatch(r'cut-[a-f0-9]{64}\.json\.gz',cut_name):
                      cut=safe_read(root/cut_name,True)
                      report=(cut or {}).get('report') or {}
                      family=report.get('family_routing') or {}
                      rows=family.get('families') or []
                      output['shadow']['cut']={'as_of':report.get('as_of'),'status':report.get('status'),
                          'family_status':family.get('status'),'family_count':len(rows),
                          'families':[{k:row.get(k) for k in ('family','status','catalog_count','entry_authority')}
                                      for row in rows[:20] if isinstance(row,dict)],
                          'funnel_status':(report.get('operational_funnel') or {}).get('status')}
              except (OSError,ValueError,TypeError):output['shadow']['cut']={'error':'READ_FAILED'}
          try:
              db='/opt/porota-trading/data/paper_v17/observer_v17.db'
              c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=.1)
              c.execute('PRAGMA query_only=ON')
              allowed={'financial_instrument_catalog':20000,'paper_positions':4096,
                       'paper_future_positions':4096,'paper_family_lifecycle':4096,
                       'ppi_intraday_contract_state':20000}
              present={row[0] for row in c.execute("SELECT name FROM sqlite_master WHERE type='table' LIMIT 1000")}
              for name,limit in allowed.items():
                  if name not in present:
                      output['closed_probe_table_counts'][name]={'absent':True};continue
                  deadline=time.monotonic()+.25
                  c.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
                  try:
                      count=c.execute('SELECT COUNT(*) FROM "'+name+'"').fetchone()[0]
                      output['closed_probe_table_counts'][name]={'rows':count,'cap':limit,'over_cap':count>limit}
                  except sqlite3.Error as exc:
                      output['closed_probe_table_counts'][name]={'error':type(exc).__name__}
                  finally:c.set_progress_handler(None,0)
              c.close()
          except (sqlite3.Error,OSError) as exc:output['closed_probe_table_counts']['error']=type(exc).__name__
          # Bound observer output to a window; only service state and aggregate timing.
          for unit in ('porota-candle-integrity-rc6.service','porota-rc6-candle-inmarket-verify.service',
                       'porota-live-decision-cockpit-rc6.service','porota-runtime-evidence-rc6.service'):
              rc,out=call(['sudo','-n','systemctl','show',unit,'--no-pager','-p','Result',
                  '-p','ExecMainStatus','-p','ExecMainStartTimestamp','-p','ExecMainExitTimestamp',
                  '-p','CPUUsageNSec'],5)
              output['timer'][unit]={'rc':rc,**dict(x.split('=',1) for x in out.splitlines() if '=' in x)}
          for unit in ('porota-live-decision-cockpit-rc6.service','porota-private-snapshot.service',
                       'porota-1016-github-verify.service'):
              rc,raw=call(['sudo','-n','systemctl','cat',unit,'--no-pager'],5)
              program=[];settings=[]
              for line in raw.splitlines():
                  if line.startswith('ExecStart='):
                      program.extend(re.findall(r'/(?:opt|usr/local|app)/[A-Za-z0-9_./-]+',line)[:8])
                      settings.extend(x for x in ('docker','python','curl','sqlite','snapshot','cockpit','8766') if x in line.lower())
                  elif line.startswith(('OnCalendar=','OnUnitActiveSec=','Description=')):
                      settings.append(line[:120])
              output['timer'][unit+'_wiring']={'rc':rc,'programs':program[:12],'settings':settings[:12]}
          # A read-only pair tests whether the PAPER valuation clock invalidates
          # the CLOSED SHADOW equality signature at the same 30-second cadence.
          try:
              db='/opt/porota-trading/data/paper_v17/observer_v17.db'
              def equity_cursor():
                  with sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=.1) as c:
                      c.execute('PRAGMA query_only=ON')
                      row=c.execute('SELECT rowid,measured_at FROM paper_equity_by_currency ORDER BY rowid DESC LIMIT 1').fetchone()
                      return {'rowid':row[0],'measured_at':row[1]} if row else None
              first=equity_cursor()
              time.sleep(35)
              second=equity_cursor()
              output['equity_cursor_35s']={'before':first,'after':second,
                  'delta_rowid':second['rowid']-first['rowid'] if first and second else None}
          except (sqlite3.Error,OSError,TypeError) as exc:
              output['equity_cursor_35s']={'error':type(exc).__name__}
          # Installed dashboard probe returns booleans and status only. The bearer
          # stays inside its own container and no HTML or credentials leave it.
          route_code="""import json,os,urllib.request,urllib.error
          url='http://127.0.0.1:8000/validacion'
          def fetch(token=None):
              headers={'Authorization':'Bearer '+token} if token else {}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=12) as response:
                      return response.status,response.read(2000001)
              except urllib.error.HTTPError as exc:
                  return exc.code,b''
          token=os.environ.get('DASHBOARD_ACCESS_TOKEN','')
          unauth,_=fetch()
          auth,body=fetch(token) if token else (None,b'')
          page=body.decode('utf-8','replace')
          print(json.dumps({'auth_available':bool(token),'unauthorized_status':unauth,
           'authorized_status':auth,'body_bounded':len(body)<=2000000,
           'm0':('M0 ·' in page),'m11':('M11 ·' in page),
           'real_money_blocked':('Dinero real' in page and 'BLOCKED' in page),
           'legacy_counterfactual':('analitica/contrafactuales' in page)}))
          """
          rc,raw=call(['sudo','-n','docker','exec','porota_production_dashboard',
                       'python3','-c',route_code],20)
          try: output['dashboard_validation_route']={'rc':rc,**json.loads(raw)}
          except (ValueError,TypeError): output['dashboard_validation_route']={'rc':rc,'error':'UNAVAILABLE'}
          rc,raw=call(['ss','-ltnH'],5)
          output['port_8766']={'rc':rc,'listener_present':bool(re.search(r':8766\s',raw)) if rc==0 else None}
          rc,raw=call(['git','-C','/opt/porota-trading','rev-parse','HEAD'],5)
          output['host_checkout_git_head_historical']={'rc':rc,'sha':raw.strip() if re.fullmatch(r'[0-9a-f]{40}\n?',raw) else None}
          # The host checkout .git pointer is historical; read the root-owned
          # marker with a bounded sudo read and emit only allowlisted fields.
          rc,raw=call(['sudo','-n','python3','-c',"import json,pathlib; p=pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json'); assert p.is_file() and not p.is_symlink() and p.stat().st_size<=65536; s=json.loads(p.read_bytes()); print(json.dumps({k:s.get(k) for k in ('candidate_sha','deploy_sha','image_id','mode','real_orders_sent','real_order_routes','ppi_watch_untouched','validation_status')},sort_keys=True))"],5)
          try: output['installed_runtime_identity']={'rc':rc,**json.loads(raw)}
          except (ValueError,TypeError): output['installed_runtime_identity']={'rc':rc,'error':'UNAVAILABLE'}
          output['container_images']={}
          for name in ('porota_production_observer','porota_production_dashboard',
                       'porota_critical_approval_rc6'):
              rc,raw=call(['sudo','-n','docker','inspect','-f','{{.Image}}',name],5)
              output['container_images'][name]=raw.strip() if rc==0 and re.fullmatch(r'sha256:[0-9a-f]{64}\n?',raw) else None
          output['postdeploy_timer_states']={}
          for unit in ('porota-a3-history-daily-rc6.timer',
                       'porota-a3-history-reconcile-rc6.timer',
                       'porota-a3-history-weekend-rc6.timer',
                       'porota-live-decision-cockpit-rc6.timer',
                       'porota-1016-github-verify.timer'):
              enabled,_enabled=call(['systemctl','is-enabled',unit],3)
              active,_active=call(['systemctl','is-active',unit],3)
              output['postdeploy_timer_states'][unit]={'enabled':_enabled.strip()[:20],
                                                          'active':_active.strip()[:20]}
          output['source_end_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          print(json.dumps(output,sort_keys=True,separators=(',',':')))
          PY
          python3 - "$RUNNER_TEMP/a71_final.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));print('A71_FINAL_READ_ONLY=COMPLETE')
          print('SHADOW='+str(r['shadow'].get('status.json',{}).get('status')))
          print('A3_ERRORS='+str({k:v['errors'] for k,v in r['a3'].items()}))
          PY
          timeout 55 ssh -i "$HOME/.ssh/rc6_a71" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'sudo -n docker exec -i porota_production_observer python -' > "$RUNNER_TEMP/a72_probe.json" <<'PY'
          import datetime,hashlib,json,sqlite3,time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from cg_paper_workspace import artifact_root
          from rc6_shadow_runtime.worker import ShadowRuntime,closed_input_signature
          from rc6_shadow_runtime import worker as module
          path=Path('/app/data/paper_v17/observer_v17.db')
          result={'source_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'probe':'SHADOW_CLOSED_SIGNATURE_READ_ONLY','db_exists':path.is_file(),
                  'samples':[]}
          if path.is_file():
              worker=ShadowRuntime(path,evidence_root=artifact_root(path)/'dynamic-shadow')
              original_tables=module._CLOSED_INPUT_TABLES
              expected=('id','measured_at','currency','cash','exposure',
                  'pending_proceeds','caucion_principal','caucion_accrued',
                  'unrealized_pnl','realized_pnl','equity')
              def component_digests():
                  pieces={};cursors={}
                  with sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=.005) as c:
                      c.execute('PRAGMA query_only=ON')
                      deadline=time.monotonic()+3
                      c.set_progress_handler(lambda:int(time.monotonic()>deadline),200)
                      present={r[0] for r in c.execute(
                          "SELECT name FROM sqlite_master WHERE type='table' LIMIT 1000")}
                      for name,cap in original_tables:
                          if name not in present:pieces[name]='ABSENT';continue
                          if name=='financial_instrument_catalog':
                              records=[c.execute('SELECT COUNT(*),COALESCE(MAX(rowid),0),MAX(last_seen_at) FROM financial_instrument_catalog').fetchone()]
                          else:
                              order='julianday(event_at)' if name=='ppi_intraday_points' else 'rowid'
                              projection='rowid,captured_at,payload_sha256' if name=='decision_evidence_snapshots' else '*'
                              records=c.execute(f'SELECT {projection} FROM "{name}" ORDER BY {order} DESC LIMIT ?', (cap+1,)).fetchall()
                          h=hashlib.sha256()
                          for row in records:
                              raw=repr(tuple(row)).encode('utf8','surrogatepass')
                              if len(raw)>65536:raise ValueError('ROW_TOO_LARGE')
                              h.update(len(raw).to_bytes(4,'big'));h.update(raw)
                          pieces[name]=h.hexdigest()
                          cursors[name]=c.execute(f'SELECT COALESCE(MAX(rowid),0) FROM "{name}"').fetchone()[0]
                  sources={}
                  for index,source in enumerate(sorted(set(worker.source_inputs+list(worker.capacity_controller.protected_paths)),key=str)):
                      st=source.stat() if source.exists() else None
                      sources[index]=(st.st_dev,st.st_ino,st.st_size,st.st_mtime_ns) if st else None
                  return pieces,cursors,sources
              for n in range(2):
                  at=datetime.datetime.now(datetime.timezone.utc)
                  started=time.monotonic()
                  value=closed_input_signature(worker,at)
                  module._CLOSED_INPUT_TABLES=tuple(t for t in original_tables
                      if t[0]!='paper_equity_by_currency')
                  try:other=closed_input_signature(worker,at)
                  finally:module._CLOSED_INPUT_TABLES=original_tables
                  with sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=.005) as c:
                      c.execute('PRAGMA query_only=ON')
                      columns=tuple(r[1] for r in c.execute(
                          'PRAGMA table_info("paper_equity_by_currency")'))
                      raw=c.execute('SELECT * FROM paper_equity_by_currency ORDER BY id DESC LIMIT 501').fetchall()
                      risk_cols=tuple(r[1] for r in c.execute(
                          'PRAGMA table_info("paper_daily_risk")'))
                      risk_day=at.astimezone(ZoneInfo('America/Argentina/Buenos_Aires')).date().isoformat()
                      risk_rows={r[1]:tuple(r) for r in c.execute(
                          'SELECT * FROM paper_daily_risk WHERE day=? LIMIT 9',(risk_day,))}
                  latest={}
                  for row in raw[:500]:
                      measured=datetime.datetime.fromisoformat(row[1])
                      if row[2] not in latest or measured>latest[row[2]][0]:
                          latest[row[2]]=(measured,tuple(row[2:]))
                  economic=(len(raw)>500,tuple(sorted((k,v) for k,(_,v) in latest.items())))
                  pieces,cursors,sources=component_digests()
                  result['samples'].append({'valid':value is not None,
                      'elapsed_ms':round(1000*(time.monotonic()-started),2),
                      'utc':at.isoformat(),'same_as_prior':n==1 and value is not None and value==previous,
                      'other_valid':other is not None,'other_same_as_prior':n==1 and other is not None and other==previous_other,
                      'equity_schema_exact':columns==expected,
                      'equity_economics_same_as_prior':n==1 and economic==previous_economic})
                  previous,previous_other,previous_economic=value,other,economic
                  if n==1:
                      result['changed_tables']=[name for name in pieces if pieces[name]!=previous_pieces.get(name)]
                      result['changed_source_indices']=[index for index in sources if sources[index]!=previous_sources.get(index)]
                      result['changed_table_rowid_deltas']={name:cursors[name]-previous_cursors.get(name,0)
                          for name in result['changed_tables'] if name in cursors}
                      result['daily_risk_changed_fields']=sorted({risk_cols[i]
                          for currency,row in risk_rows.items() if currency in previous_risk_rows
                          for i,(old,new) in enumerate(zip(previous_risk_rows[currency],row)) if old!=new})
                      result['daily_risk_currency_set_same']=set(risk_rows)==set(previous_risk_rows)
                  previous_pieces,previous_cursors,previous_sources=pieces,cursors,sources
                  previous_risk_rows=risk_rows
                  if n==0:time.sleep(32)
          print(json.dumps(result,sort_keys=True))
          PY
          python3 - "$RUNNER_TEMP/a72_probe.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));print('A72_CLOSED_SIGNATURE='+str(r['samples']))
          PY
          timeout 135 ssh -i "$HOME/.ssh/rc6_a71" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'python3 -' > "$RUNNER_TEMP/a72_runtime.json" <<'PY'
          """Bounded read-only SHADOW idle proof, run on the RC6 host via Actions."""
          import datetime
          import json
          import os
          from pathlib import Path
          import sqlite3
          import subprocess
          import time
          
          UTC = datetime.timezone.utc
          ROOT = Path('/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/dynamic-shadow')
          DATABASE = Path('/opt/porota-trading/data/paper_v17/observer_v17.db')
          
          
          def command(argv, seconds=6):
              try:
                  proc = subprocess.run(argv, capture_output=True, text=True, timeout=seconds)
                  return proc.returncode, proc.stdout[:25000]
              except (OSError, subprocess.TimeoutExpired):
                  return 124, ''
          
          
          def owned(name):
              path = ROOT / name
              if not path.is_file() or path.is_symlink() or path.stat().st_size > 2 * 1024 * 1024:
                  return None
              try:
                  payload = json.loads(path.read_bytes())
                  return payload.get('payload') if isinstance(payload, dict) else None
              except (OSError, ValueError):
                  return None
          
          
          def worker_cpu():
              rc, raw = command(['sudo', '-n', 'docker', 'top', 'porota_production_observer',
                                 '-eo', 'pid,ppid,args'])
              if rc:
                  return None, None
              pids = []
              for line in raw.splitlines()[1:]:
                  fields = line.split(None, 2)
                  if len(fields) == 3 and fields[0].isdigit() and '--dynamic-shadow-worker' in fields[2]:
                      pids.append(int(fields[0]))
              if len(pids) != 1:
                  return None, None
              pid = pids[0]
              try:
                  raw = Path('/proc', str(pid), 'stat').read_text()
                  fields = raw[raw.rfind(')') + 2:].split()
                  return pid, (int(fields[11]) + int(fields[12])) / os.sysconf('SC_CLK_TCK')
              except (OSError, ValueError, IndexError):
                  return None, None
          
          
          def sample():
              pointer = owned('CURRENT.json') or {}
              idle = owned('idle.json') or {}
              status = owned('status.json') or {}
              pid, cpu = worker_cpu()
              values = {'utc': datetime.datetime.now(UTC).isoformat(),
                        'generation_id': pointer.get('generation_id'),
                        'idle_state': idle.get('state'), 'idle_heartbeat': idle.get('heartbeat_at'),
                        'idle_generation_id': idle.get('last_generation_id'),
                        'idle_source_freshness_renewed': idle.get('source_freshness_renewed'),
                        'phase': status.get('phase'), 'status': status.get('status'),
                        'source_as_of': status.get('as_of'),
                        'real_orders_sent': status.get('real_orders_sent'),
                        'real_routes': status.get('real_routes'), 'pid': pid, 'cpu_seconds': cpu}
              if DATABASE.is_file():
                  try:
                      with sqlite3.connect(DATABASE.as_uri() + '?mode=ro', uri=True, timeout=.005) as c:
                          c.execute('PRAGMA query_only=ON')
                          values['equity_max_id'] = c.execute(
                              'SELECT COALESCE(MAX(id),0) FROM paper_equity_by_currency').fetchone()[0]
                  except sqlite3.Error:
                      values['equity_max_id'] = None
              return values
          
          
          before = sample()
          time.sleep(95)
          after = sample()
          same_worker = (before['pid'] is not None and before['pid'] == after['pid']
                         and before['cpu_seconds'] is not None and after['cpu_seconds'] is not None)
          result = {
              'source_start_utc': before['utc'], 'source_end_utc': after['utc'],
              'before': before, 'after': after,
              'same_worker': same_worker,
              'cpu_delta_seconds': (round(after['cpu_seconds'] - before['cpu_seconds'], 3)
                                    if same_worker else None),
              'equity_id_delta': (after['equity_max_id'] - before['equity_max_id']
                                  if isinstance(before.get('equity_max_id'), int)
                                  and isinstance(after.get('equity_max_id'), int) else None),
              'same_generation': (before['generation_id'] is not None
                                  and before['generation_id'] == after['generation_id']),
              'idle_heartbeat_advanced': (before['idle_heartbeat'] is not None
                                          and after['idle_heartbeat'] is not None
                                          and after['idle_heartbeat'] > before['idle_heartbeat']),
          }
          print(json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
          python3 - "$RUNNER_TEMP/a72_runtime.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print("A72_RUNTIME_PROOF="+str({k:r.get(k) for k in ("same_worker","cpu_delta_seconds","equity_id_delta","same_generation","idle_heartbeat_advanced")}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-a71-final-readonly
          path: |
            ${{ runner.temp }}/a71_final.json
            ${{ runner.temp }}/a72_probe.json
            ${{ runner.temp }}/a72_runtime.json
          retention-days: 7
