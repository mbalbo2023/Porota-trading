name: RC6 A74 publisher provenance access readonly
'on':
  push:
    branches:
    - ops/rc6-a71-host-audit-20261025
    paths:
    - .github/workflows/rc6-a71-host-final-readonly.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
    - name: Read host provenance as publisher and root
      shell: bash
      run: |
        set -Eeuo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a74"
        chmod 600 "$HOME/.ssh/rc6_a74"
        printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"
        umask 077
        timeout 25 ssh -i "$HOME/.ssh/rc6_a74" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'python3 -' > "$RUNNER_TEMP/a74_publisher_normal.json" <<'PY'

        import json,os,pathlib,stat,subprocess
        p=pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
        q=pathlib.Path('/opt/porota-trading/data/deploy/porota-frozen-candidate.json')
        r={'schema':'RC6_A74_PUBLISHER_PROVENANCE_ACCESS_V1','euid':os.geteuid(),'egid':os.getegid(),'files':{}}
        for name,target in [('state',p),('frozen',q)]:
          item={}
          try:
            s=target.lstat()
            item.update(exists=True,regular=stat.S_ISREG(s.st_mode),symlink=stat.S_ISLNK(s.st_mode),mode=oct(stat.S_IMODE(s.st_mode)),uid=s.st_uid,gid=s.st_gid)
            if not item['regular'] or item['symlink'] or s.st_size>1048576:raise ValueError('FILE_METADATA_UNSAFE')
            payload=json.loads(target.read_text())
            item['readable']=True
            item['selected_fields']={k:payload.get(k) for k in ('deploy_sha','candidate_sha','image_id','mode','real_orders_sent','real_order_routes','recorded_at','validation_status') if k in payload}
          except (OSError,ValueError) as e:item['readable']=False;item['error_class']=type(e).__name__
          r['files'][name]=item
        s=subprocess.run(['systemctl','show','porota-runtime-evidence-rc6.service','-p','User','-p','Group','-p','ActiveState','-p','Result','--no-pager'],capture_output=True,text=True,timeout=5)
        r['publisher_service']={'query_rc':s.returncode,'fields':dict(x.split('=',1) for x in s.stdout.splitlines() if '=' in x)}
        print(json.dumps(r,sort_keys=True))

        PY
        timeout 25 ssh -i "$HOME/.ssh/rc6_a74" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'sudo -n python3 -' > "$RUNNER_TEMP/a74_publisher_root.json" <<'PY'

        import json,os,pathlib,stat,subprocess
        p=pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
        q=pathlib.Path('/opt/porota-trading/data/deploy/porota-frozen-candidate.json')
        r={'schema':'RC6_A74_PUBLISHER_PROVENANCE_ACCESS_V1','euid':os.geteuid(),'egid':os.getegid(),'files':{}}
        for name,target in [('state',p),('frozen',q)]:
          item={}
          try:
            s=target.lstat()
            item.update(exists=True,regular=stat.S_ISREG(s.st_mode),symlink=stat.S_ISLNK(s.st_mode),mode=oct(stat.S_IMODE(s.st_mode)),uid=s.st_uid,gid=s.st_gid)
            if not item['regular'] or item['symlink'] or s.st_size>1048576:raise ValueError('FILE_METADATA_UNSAFE')
            payload=json.loads(target.read_text())
            item['readable']=True
            item['selected_fields']={k:payload.get(k) for k in ('deploy_sha','candidate_sha','image_id','mode','real_orders_sent','real_order_routes','recorded_at','validation_status') if k in payload}
          except (OSError,ValueError) as e:item['readable']=False;item['error_class']=type(e).__name__
          r['files'][name]=item
        s=subprocess.run(['systemctl','show','porota-runtime-evidence-rc6.service','-p','User','-p','Group','-p','ActiveState','-p','Result','--no-pager'],capture_output=True,text=True,timeout=5)
        r['publisher_service']={'query_rc':s.returncode,'fields':dict(x.split('=',1) for x in s.stdout.splitlines() if '=' in x)}
        print(json.dumps(r,sort_keys=True))

        PY
        python3 - <<'PY'
        import datetime,json,os,pathlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])
        u=json.loads((root/'a74_publisher_normal.json').read_text())
        s=json.loads((root/'a74_publisher_root.json').read_text())
        m=s['files']['state']
        assert m['readable'] and m['selected_fields']['deploy_sha']=='089d3d9914ba9400c4c2c385ccb4987772f00f70'
        assert m['selected_fields']['mode']=='PRODUCTION_PAPER' and m['selected_fields']['real_orders_sent']==0
        r={'schema':'RC6_A74_PUBLISHER_ACCESS_RECONCILIATION_V1','source_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
         'normal':u,'root':s,'publisher_user_matches_probe':u['publisher_service']['fields'].get('User')=='porotaadmin',
         'root_marker_readable':m['readable'],'publisher_marker_readable':u['files']['state']['readable']}
        (root/'a74_publisher_reconciliation.json').write_text(json.dumps(r,sort_keys=True))
        print('A74_PUBLISHER_ROOT_MARKER='+str(m['readable'])+'|UNPRIVILEGED='+str(u['files']['state']['readable'])+'|SAME_USER='+str(r['publisher_user_matches_probe']))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rc6-a74-publisher-provenance
        path: ${{ runner.temp }}/a74_publisher_reconciliation.json
        retention-days: 7
    - name: Delete runner credential
      if: always()
      shell: bash
      run: |-
        rm -f "$HOME/.ssh/rc6_a74"
