name: RC6 A74 real installed dashboard visual audit
'on':
  push:
    branches:
    - ops/rc6-a71-host-audit-20261025
    paths:
    - .github/workflows/rc6-a71-host-final-readonly.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: f351009b528747d7a593946d0100646cb540bc3a
    - name: Browser dependencies on runner only
      shell: bash
      run: |-
        set -Eeuo pipefail
        python3 -m pip install --disable-pip-version-check playwright==1.55.0 cryptography==44.0.2
        python3 -m playwright install --with-deps chromium
    - name: Read-only browser journey with encrypted screenshots
      shell: bash
      run: "set -Eeuo pipefail\ninstall -m 700 -d \"$HOME/.ssh\"\nprintf '%s\\n' \"$SSH_KEY\" > \"$HOME/.ssh/rc6_a74\"\nchmod 600 \"$HOME/.ssh/rc6_a74\"\nprintf '%s\\n' \"$KNOWN_HOSTS\" > \"$HOME/.ssh/known_hosts\"\nchmod 600 \"$HOME/.ssh/known_hosts\"\numask 077\nssh -i \"$HOME/.ssh/rc6_a74\" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\" -o ConnectTimeout=10 \"$DO_USER@$DO_HOST\" 'sudo -n python3 -' > \"$RUNNER_TEMP/a74_visual_identity_before.json\" <<'PY'\nimport json,pathlib,subprocess\np=pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')\nassert p.is_file() and not p.is_symlink() and p.stat().st_size<65536\ns=json.loads(p.read_bytes())\nassert s['deploy_sha']=='f351009b528747d7a593946d0100646cb540bc3a' and s['mode']=='PRODUCTION_PAPER' and s['real_orders_sent']==0\nassert s['image_id']=='sha256:07e13c476c7ff7fdfff8e9595ac440554529cf770e9dcb01192ec0d70b31a101'\nfor name in ('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6'):\n\
        \ p=subprocess.run(['docker','inspect','-f','{{.Image}} {{.State.Status}}',name],capture_output=True,text=True,timeout=5)\n assert p.returncode==0 and p.stdout.strip()==s['image_id']+' running'\nprint(json.dumps({k:s.get(k) for k in ('deploy_sha','candidate_sha','image_id','mode','real_orders_sent','real_order_routes','ppi_watch_untouched','native_acceptance_mode','source_freshness_renewed')}))\nPY\nssh -i \"$HOME/.ssh/rc6_a74\" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\" -o ConnectTimeout=10 \"$DO_USER@$DO_HOST\" 'sudo -n docker exec porota_production_dashboard python3 -c '\"'\"'import os; print(os.environ.get(\"DASHBOARD_ACCESS_TOKEN\",\"\"))'\"'\"'' > \"$RUNNER_TEMP/a74_dashboard_token\"\ncat > \"$RUNNER_TEMP/a74_audit.pub\" <<'PUBLIC'\n-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzjSuugAK4NVPC7PDaas5\nvqvHe0ryMo8vQBZdCcB/NWEOAr4kCHxyyOhXfnQnbsrlTlcd5YFSRY0n6Vd43xs5\nMkg2MpPus3UQXDF7z9hnJtoLZS09tucVe4NYGgj+TG24MS0HmLcnf7c1wz5NQJwq\n\
        yLAr6bSw8fKEcEQMgKEFH1uFSDWuV9bvI/I4QHQm9tOwfb5j2PPnYwTx8UlIt0lN\nJQ+VtjbB/IRH5m26hVrgLWi542Q/4E5LGh4/ayP97AeDQHfuh8k4ZP9QP3aQDT2g\nKUgdWulWDXuYXzj6bDlLzvFafbVocaiN23sZPwUSMPkj/Pdva4ab3IM5uNxiXi/u\ngtgHly6Y1wceM6eEsy05bUe3HeYF8tvJ/EVhzSrOa+IZrRKsE+S3RlmyFrcyeifT\nlelPjOwN9NeQg87d0ELJ8i5qJlKCcVULUXwPIqEWiYsDTnmuUGuN3lTxxwtfKc84\niA+6lCgY3y0IeyhphNyQfY02nSBOf9FANf2czYNvWOEfAgMBAAE=\n-----END PUBLIC KEY-----\nPUBLIC\nssh -i \"$HOME/.ssh/rc6_a74\" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\" -o ConnectTimeout=10 \"$DO_USER@$DO_HOST\" -M -S \"$RUNNER_TEMP/a74_tunnel\" -o ExitOnForwardFailure=yes -f -N -L 127.0.0.1:18000:127.0.0.1:8000\npython3 - <<'PY'\n\"\"\"Real installed dashboard QA. No POST, financial action, or public screenshots.\"\"\"\nimport collections,datetime,hashlib,io,json,os,pathlib,re,time,urllib.parse,zipfile\nfrom cryptography.hazmat.primitives import hashes,serialization\nfrom cryptography.hazmat.primitives.asymmetric\
        \ import padding\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\nfrom playwright.sync_api import sync_playwright\nfrom rc6_trader_dashboard.navigation import CANONICAL_PATHS\n\nROOT=pathlib.Path(os.environ['RUNNER_TEMP']);PRIVATE=ROOT/'a74_visual_private';PRIVATE.mkdir(mode=0o700)\nTOKEN=(ROOT/'a74_dashboard_token').read_text().strip()\nassert len(TOKEN)>10 and '\\n' not in TOKEN\nBASE='http://127.0.0.1:18000';PATHS=list(CANONICAL_PATHS)\nassert len(PATHS)==52 and all('?' not in x for x in PATHS)\nALLOWED=set(PATHS)|{'/validacion','/favicon.ico'}\nR={'schema':'RC6_A74_REAL_BROWSER_V1','source_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),\n   'expected_product_sha':'f351009b528747d7a593946d0100646cb540bc3a','canonical_routes':len(PATHS),\n   'real_device_voice_access':'NO_VERIFICADO','market_open':'NO_VERIFICADO','requests_write_blocked':True,\n   'screenshots_public':False,'cases':[],'paginations':[],'validation_route':{},'warnings':[]}\nSTART=time.monotonic()\n\
        \ndef check_budget():\n    if time.monotonic()-START>900:raise TimeoutError('BROWSER_TOTAL_BUDGET')\n\ndef inspect_modals(page):\n    buttons=page.locator('[data-detail-dialog]');count=buttons.count()\n    out={'discovered':count,'tested':0,'opened':0,'content_present':0,'labelled':0,'fit_viewport':0,'escape_closed':0,'focus_restored':0,'failures':[]}\n    assert count<=160\n    for i in range(count):\n        check_budget();b=buttons.nth(i)\n        try:\n            target=b.get_attribute('data-detail-dialog')\n            assert target and re.fullmatch(r'[A-Za-z0-9_.-]+',target)\n            b.scroll_into_view_if_needed(timeout=4000);b.click(timeout=4000)\n            dialog=page.locator('[id=\"'+target+'\"]');dialog.wait_for(state='visible',timeout=3000)\n            state=dialog.evaluate('''e=>{const b=e.getBoundingClientRect();const n=e.getAttribute('aria-labelledby');return {open:e.open,content:Array.from(e.querySelectorAll('dd')).some(x=>x.textContent.trim()),label:!!(n&&document.getElementById(n)?.textContent.trim()),fits:b.left>=-1&&b.right<=innerWidth+1&&b.top>=-1&&b.bottom<=innerHeight+1}}''')\n\
        \            out['opened']+=bool(state['open']);out['content_present']+=bool(state['content']);out['labelled']+=bool(state['label']);out['fit_viewport']+=bool(state['fits'])\n            if not all(state.values()):out['failures'].append({'index':i,'checks':state})\n            if i==0 and not (PRIVATE/'first-modal.jpg').exists():page.screenshot(path=str(PRIVATE/'first-modal.jpg'),type='jpeg',quality=75)\n            page.keyboard.press('Escape');page.wait_for_timeout(120)\n            out['escape_closed']+=not dialog.is_visible()\n            out['focus_restored']+=bool(b.evaluate('e=>document.activeElement===e'))\n            out['tested']+=1\n        except Exception as exc:\n            out['failures'].append({'index':i,'error_class':type(exc).__name__})\n            page.keyboard.press('Escape')\n    return out\n\nwith sync_playwright() as p:\n    browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])\n    context=browser.new_context(extra_http_headers={'Authorization':'Bearer\
        \ '+TOKEN},reduced_motion='reduce')\n    rejected=collections.Counter()\n    def allow(route):\n        request=route.request;u=urllib.parse.urlsplit(request.url)\n        if u.scheme=='http' and u.netloc=='127.0.0.1:18000' and u.path in ALLOWED and request.method in ('GET','HEAD'):\n            route.continue_()\n        else:\n            rejected['WRITE' if request.method not in ('GET','HEAD') else 'NON_ALLOWLISTED_ORIGIN_OR_PATH']+=1\n            route.abort()\n    context.route('**/*',allow)\n    page=context.new_page();js_errors=[]\n    page.on('pageerror',lambda error:js_errors.append(type(error).__name__))\n    for width,height,label in ((800,1280,'tablet_emulation'),(390,844,'phone_emulation')):\n        page.set_viewport_size({'width':width,'height':height})\n        for index,path in enumerate(PATHS):\n            check_budget();row={'path':path,'viewport':label,'width':width,'height':height}\n            prior=len(js_errors)\n            try:\n                response=page.goto(BASE+path,wait_until='load',timeout=25000)\n\
        \                page.locator('#terminal-content').wait_for(state='visible',timeout=5000)\n                page.wait_for_timeout(400)\n                row['http_status']=response.status if response else None\n                row.update(page.evaluate('''()=>{let names=0,small=0,visible=0;for(const e of document.querySelectorAll('a[href],button,input,select,summary')){let b=e.getBoundingClientRect();if(!b.width||!b.height||getComputedStyle(e).visibility==='hidden')continue;visible++;let n=e.getAttribute('aria-label')||e.textContent.trim()||e.getAttribute('title')||Array.from(e.labels||[]).map(x=>x.textContent).join('')||e.getAttribute('placeholder');if(!n)names++;if(b.height<44)small++;}let badges={};for(const e of document.querySelectorAll('[data-status]')){let s=e.getAttribute('data-status');if(/^[A-Z0-9_ -]{1,90}$/.test(s))badges[s]=(badges[s]||0)+1;}return {heading_present:!!document.querySelector('h1')?.textContent.trim(),main_present:!!document.querySelector('main'),body_horizontal_overflow:document.documentElement.scrollWidth>innerWidth+1,visible_controls:visible,unnamed_controls:names,controls_under_44px:small,paper_label_present:document.body.innerText.includes('PAPER\
        \ / SHADOW ONLY'),status_badges:badges,first_page_rows:document.querySelectorAll('tr[data-row=\"true\"]').length}}'''))\n                row['modals']=inspect_modals(page)\n                page.evaluate('window.scrollTo(0,document.documentElement.scrollHeight)');page.wait_for_timeout(100)\n                row['scroll']=page.evaluate('({height:document.documentElement.scrollHeight,viewport:innerHeight,position:scrollY})')\n                page.evaluate('window.scrollTo(0,0)');page.wait_for_timeout(100)\n                menu=page.locator('#terminal-menu')\n                if menu.is_visible():\n                    menu.click();row['menu_opened']=menu.get_attribute('aria-expanded')=='true'\n                    row['menu_destinations']=page.locator('#porota-canonical-nav a').count()\n                    menu.click();row['menu_closed']=menu.get_attribute('aria-expanded')=='false'\n                if label=='tablet_emulation':\n                    page.screenshot(path=str(PRIVATE/f'view-{index:02d}.jpg'),type='jpeg',quality=75)\n\
        \                    links=[]\n                    for a in page.locator('nav.pager a').all():\n                        if a.inner_text().strip()=='Mostrar 10 m\xE1s':\n                            href=a.get_attribute('href')\n                            if href and urllib.parse.urlsplit(href).path==path and 'token' not in urllib.parse.parse_qs(urllib.parse.urlsplit(href).query):links.append(href)\n                    for href in sorted(set(links)):\n                        check_budget();pr={'path':path,'offset':10}\n                        try:\n                            response=page.goto(BASE+href,wait_until='load',timeout=25000)\n                            page.locator('#terminal-content').wait_for(state='visible',timeout=5000)\n                            page.wait_for_timeout(400)\n                            pr['http_status']=response.status if response else None\n                            pr['row_count']=page.locator('tr[data-row=\"true\"]').count();pr['modals']=inspect_modals(page)\n\
        \                        except Exception as exc:pr['error_class']=type(exc).__name__\n                        R['paginations'].append(pr);page.wait_for_timeout(800)\n                row['js_errors']=len(js_errors)-prior\n            except Exception as exc:row['error_class']=type(exc).__name__\n            R['cases'].append(row)\n            page.wait_for_timeout(1200)\n    page.set_viewport_size({'width':800,'height':1280})\n    response=page.goto(BASE+'/validacion',wait_until='load',timeout=25000)\n    text=page.locator('body').inner_text()\n    R['validation_route']={'http_status':response.status if response else None,'m0_present':'M0 \xB7' in text,'m11_present':'M11 \xB7' in text,'real_money_blocked':'Dinero real' in text and 'BLOCKED' in text}\n    page.screenshot(path=str(PRIVATE/'validation.jpg'),type='jpeg',quality=75)\n    R['request_rejections']=dict(rejected)\n    context.close();browser.close()\n\nR['source_end_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()\n\
        R['elapsed_seconds']=round(time.monotonic()-START,3)\nR['summary']={'cases':len(R['cases']),'http_200':sum(x.get('http_status')==200 for x in R['cases']),\n    'case_errors':sum('error_class' in x for x in R['cases']),'layout_overflow':sum(x.get('body_horizontal_overflow',False) for x in R['cases']),\n    'js_errors':sum(x.get('js_errors',0) for x in R['cases']),\n    'first_page_modals_discovered':sum(x.get('modals',{}).get('discovered',0) for x in R['cases']),\n    'first_page_modals_tested':sum(x.get('modals',{}).get('tested',0) for x in R['cases']),\n    'modal_failures':sum(len(x.get('modals',{}).get('failures',[])) for x in R['cases']),\n    'pagination_cases':len(R['paginations'])}\n(PRIVATE/'audit.json').write_text(json.dumps(R,sort_keys=True,separators=(',',':')))\n(ROOT/'a74_visual_summary.json').write_text(json.dumps(R,sort_keys=True,separators=(',',':')))\n# Only the public key is present on the runner. Auth token and SSH credentials\n# are never included, and the RSA\
        \ private key never leaves the audit workspace.\narchive=io.BytesIO()\nwith zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:\n    for file in sorted(PRIVATE.iterdir()):z.write(file,file.name)\nkey=os.urandom(32);nonce=os.urandom(12);data=archive.getvalue()\npublic=serialization.load_pem_public_key((ROOT/'a74_audit.pub').read_bytes())\nsealed=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))\n(ROOT/'a74_visual_encrypted.bin').write_bytes(AESGCM(key).encrypt(nonce,data,b'RC6_A74_PRIVATE_QA_V1'))\nenvelope={'schema':'RC6_A74_PRIVATE_QA_V1','encrypted_key':sealed.hex(),'nonce':nonce.hex(),'plaintext_sha256':hashlib.sha256(data).hexdigest(),'plaintext_bytes':len(data),'rsa_public_sha256':hashlib.sha256((ROOT/'a74_audit.pub').read_bytes()).hexdigest()}\n(ROOT/'a74_visual_envelope.json').write_text(json.dumps(envelope,sort_keys=True))\nprint('A74_VISUAL_SUMMARY='+json.dumps(R['summary'],sort_keys=True))\nPY\nssh -i \"$HOME/.ssh/rc6_a74\"\
        \ -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\" -o ConnectTimeout=10 \"$DO_USER@$DO_HOST\" 'sudo -n python3 -' > \"$RUNNER_TEMP/a74_visual_identity_after.json\" <<'PY'\nimport json,pathlib,subprocess\np=pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')\nassert p.is_file() and not p.is_symlink() and p.stat().st_size<65536\ns=json.loads(p.read_bytes())\nassert s['deploy_sha']=='f351009b528747d7a593946d0100646cb540bc3a' and s['mode']=='PRODUCTION_PAPER' and s['real_orders_sent']==0\nassert s['image_id']=='sha256:07e13c476c7ff7fdfff8e9595ac440554529cf770e9dcb01192ec0d70b31a101'\nfor name in ('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6'):\n p=subprocess.run(['docker','inspect','-f','{{.Image}} {{.State.Status}}',name],capture_output=True,text=True,timeout=5)\n assert p.returncode==0 and p.stdout.strip()==s['image_id']+' running'\nprint(json.dumps({k:s.get(k)\
        \ for k in ('deploy_sha','candidate_sha','image_id','mode','real_orders_sent','real_order_routes','ppi_watch_untouched','native_acceptance_mode','source_freshness_renewed')}))\nPY\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rc6-a74-real-browser-encrypted
        path: |-
          ${{ runner.temp }}/a74_visual_summary.json
          ${{ runner.temp }}/a74_visual_encrypted.bin
          ${{ runner.temp }}/a74_visual_envelope.json
          ${{ runner.temp }}/a74_visual_identity_before.json
          ${{ runner.temp }}/a74_visual_identity_after.json
        retention-days: 7
    - name: Close tunnel and remove private runner material
      if: always()
      shell: bash
      run: |-
        ssh -i "$HOME/.ssh/rc6_a74" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" -S "$RUNNER_TEMP/a74_tunnel" -O exit || true
        rm -f "$HOME/.ssh/rc6_a74" "$RUNNER_TEMP/a74_dashboard_token" "$RUNNER_TEMP/a74_audit.pub"
        rm -rf -- "$RUNNER_TEMP/a74_visual_private"
