name: RC6 A74 guarded browser probe and exact runtime census
'on':
  push:
    branches:
    - ops/rc6-a71-host-audit-20261025
    paths:
    - .github/workflows/rc6-a71-host-final-readonly.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      A74_PROBE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: f351009b528747d7a593946d0100646cb540bc3a
    - name: Use runner Chrome without system package downloads
      shell: bash
      run: |-
        set -Eeuo pipefail
        python3 -m pip install --disable-pip-version-check playwright==1.55.0 cryptography==44.0.2
        command -v google-chrome
        google-chrome --version
    - name: Bounded source census and incremental two-route browser probe
      shell: bash
      run: "set -Eeuo pipefail\ninstall -m 700 -d \"$HOME/.ssh\"\nprintf '%s\\n' \"$SSH_KEY\" > \"$HOME/.ssh/rc6_a74\"\nchmod 600 \"$HOME/.ssh/rc6_a74\"\nprintf '%s\\n' \"$KNOWN_HOSTS\" > \"$HOME/.ssh/known_hosts\"\nchmod 600 \"$HOME/.ssh/known_hosts\"\numask 077\ntimeout 120 ssh -i \"$HOME/.ssh/rc6_a74\" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\" -o ConnectTimeout=10 \"$DO_USER@$DO_HOST\" 'python3 -' > \"$RUNNER_TEMP/a74_final_runtime.json\" <<'PY'\n\"\"\"Finite RC6 metadata audit. Never starts a worker or writes runtime data.\"\"\"\nimport datetime,hashlib,json,os,pathlib,re,shutil,sqlite3,subprocess,time\nfrom zoneinfo import ZoneInfo\n\nSTART=time.monotonic()\nUTC=datetime.timezone.utc\nROOT=pathlib.Path('/opt/porota-trading')\nR={'schema':'RC6_A74_READONLY_V1','source_utc':datetime.datetime.now(UTC).isoformat(),\n   'read_only':True,'probe_renews_source_freshness':False,'warnings':[]}\n\ndef command(args,seconds=5):\n\
        \    try:\n        p=subprocess.run(args,capture_output=True,text=True,timeout=seconds)\n        return p.returncode,p.stdout[:250000]\n    except (OSError,subprocess.TimeoutExpired):return 124,''\n\ndef show(unit,props):\n    rc,out=command(['systemctl','show',unit,'--no-pager','--property='+','.join(props)])\n    return {'query_rc':rc,**dict(x.split('=',1) for x in out.splitlines() if '=' in x)}\n\ndef mem_available():\n    try:return int(re.search(r'^MemAvailable:\\s+([0-9]+)',pathlib.Path('/proc/meminfo').read_text(),re.M).group(1))*1024\n    except (OSError,AttributeError):return 0\n\nR['resources']={'free_bytes':shutil.disk_usage('/').free,'memory_available_bytes':mem_available()}\nrc,raw=command(['sudo','-n','python3','-c',\"import json,pathlib; p=pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json'); assert p.is_file() and not p.is_symlink() and p.stat().st_size<65536; s=json.loads(p.read_bytes()); print(json.dumps({k:s.get(k) for k in ('candidate_sha','deploy_sha','image_id','mode','real_orders_sent','real_order_routes','ppi_watch_untouched','validation_status','native_acceptance_mode','source_freshness_renewed')}))\"\
        ])\ntry:R['marker']={'query_rc':rc,**json.loads(raw)}\nexcept ValueError:R['marker']={'query_rc':rc,'error':'MARKER_UNAVAILABLE'}\nR['containers']={}\nfor name in ('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6'):\n    rc,raw=command(['sudo','-n','docker','inspect','-f','{{.Image}} {{.State.Status}} {{.RestartCount}} {{.State.OOMKilled}} {{.State.StartedAt}}',name])\n    vals=raw.split()\n    if rc==0 and len(vals)==5 and re.fullmatch(r'sha256:[0-9a-f]{64}',vals[0]):\n        R['containers'][name]={'image':vals[0],'status':vals[1],'restarts':vals[2],'oom':vals[3],'started_at':vals[4]}\n    else:R['containers'][name]={'error':'CONTAINER_QUERY_FAILED','query_rc':rc}\n\nrc,raw=command(['systemctl','list-unit-files','porota*.timer','--no-legend','--no-pager'])\nnames=sorted(set(x.split()[0] for x in raw.splitlines() if re.match(r'^porota[A-Za-z0-9@_.-]*\\.timer\\s',x)))\nnames=[n for n in names if not re.search(r'ppi[-_]?watch',n,re.I)]\nR['timer_inventory']={'query_rc':rc,'count':len(names),'ppi_watch_excluded':True,'rows':[]}\n\
        services=set()\nfor unit in names[:64]:\n    row=show(unit,('ActiveState','SubState','UnitFileState','LastTriggerUSec','NextElapseUSecRealtime','NextElapseUSecMonotonic','Triggers','Persistent','AccuracyUSec','RandomizedDelayUSec','TimersCalendar','TimersMonotonic'))\n    row['unit']=unit\n    _,definition=command(['systemctl','cat',unit,'--no-pager'])\n    row['calendar_definition']=[x for x in definition.splitlines() if x.startswith(('OnCalendar=','OnBootSec=','OnUnitActiveSec=','Unit=','Persistent='))][:12]\n    target=next((x[5:] for x in row['calendar_definition'] if x.startswith('Unit=')),None)\n    if not target:\n        target=next((x for x in row.get('Triggers','').split() if x.endswith('.service')),None)\n    if target and re.fullmatch(r'porota[A-Za-z0-9@_.-]*\\.service',target) and not re.search(r'ppi[-_]?watch',target,re.I):services.add(target)\n    row['service']=target\n    R['timer_inventory']['rows'].append(row)\n\nservices.update(('porota-a3-history-rc6@DAILY_INCREMENTAL.service','porota-a3-history-rc6@RECONCILE.service','porota-a3-history-rc6@WEEKEND_DEEP.service','porota-host-general-backup-rc6.service','porota-history-postclose-rc6.service'))\n\
        R['services']=[]\nfor unit in sorted(services):\n    row=show(unit,('ActiveState','SubState','UnitFileState','Result','ExecMainStatus','CPUUsageNSec','IOReadBytes','IOWriteBytes','MemoryPeak','NRestarts','ExecMainStartTimestamp','ExecMainExitTimestamp','ExecMainStartTimestampMonotonic','ExecMainExitTimestampMonotonic','InvocationID','TimeoutStartUSec','Nice','IOSchedulingClass'))\n    row['unit']=unit\n    rc,definition=command(['systemctl','cat',unit,'--no-pager'])\n    starts=[x for x in definition.splitlines() if x.startswith('ExecStart=')]\n    row['docker_wrapper']=any('docker' in x for x in starts)\n    row['programs']=sorted(set(y for x in starts for y in re.findall(r'(?<![A-Za-z0-9_])[A-Za-z0-9_/-]+\\.(?:py|sh)\\b',x)))[:12]\n    row['has_explicit_flock']=any('flock' in x for x in starts)\n    R['services'].append(row)\n\ndef read_envelope(name):\n    p=ROOT/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow'/name\n    try:\n        if not p.is_file() or p.is_symlink()\
        \ or p.stat().st_size>262144:return None\n        o=json.loads(p.read_bytes())\n        return o.get('payload') if isinstance(o,dict) else None\n    except (OSError,ValueError):return None\n\ndef proc_sample():\n    result={}\n    rc,raw=command(['sudo','-n','docker','top','porota_production_observer','-eo','pid,ppid,args'])\n    roles={'--dynamic-shadow-worker':'dynamic_shadow','--scanner-worker':'scanner','--performance-worker':'performance','--exit-reader':'exit_reader','--notification-worker':'notifications','--candle-worker':'candles','--intraday-scalping-worker':'intraday_scalping','--caucion-cash-sweep-worker':'caucion_cash_sweep'}\n    for line in raw.splitlines()[1:]:\n        fields=line.split(None,2)\n        if len(fields)!=3 or not fields[0].isdigit() or not any(x in fields[2] for x in ('bf_production_paper_observer.py','bv_paper_runtime.py')):continue\n        pid=int(fields[0]);role=next((v for k,v in roles.items() if k in fields[2]),'scanner' if 'bf_production_paper_observer.py'\
        \ in fields[2] else 'observer_clock')\n        try:\n            stat=(pathlib.Path('/proc')/str(pid)/'stat').read_text()\n            parts=stat[stat.rfind(')')+2:].split()\n            item={'pid':pid,'role':role,'cpu_seconds':(int(parts[11])+int(parts[12]))/os.sysconf('SC_CLK_TCK'),'rss_bytes':int(parts[21])*os.sysconf('SC_PAGE_SIZE')}\n            try:\n                io=dict(x.split(':',1) for x in (pathlib.Path('/proc')/str(pid)/'io').read_text().splitlines())\n                item.update({k:int(io[k]) for k in ('read_bytes','write_bytes','rchar','wchar')})\n            except OSError:item['io_error']='PERMISSION_UNAVAILABLE'\n            result[str(pid)]=item\n        except (OSError,ValueError,IndexError):continue\n    return result\n\nbefore=proc_sample();wall=time.monotonic()\ntime.sleep(12)\nafter=proc_sample();elapsed=time.monotonic()-wall\nR['process_sample']={'elapsed_seconds':round(elapsed,3),'rows':[],'count_before':len(before),'count_after':len(after)}\nfor pid,a\
        \ in after.items():\n    b=before.get(pid)\n    if not b:R['process_sample']['rows'].append(dict(a,continuity=False));continue\n    out={k:a[k] for k in ('pid','role','rss_bytes')}\n    out.update(continuity=True,cpu_delta_seconds=round(a['cpu_seconds']-b['cpu_seconds'],3))\n    out['cpu_fraction_one_core']=round(out['cpu_delta_seconds']/elapsed,4)\n    for k in ('read_bytes','write_bytes','rchar','wchar'):\n        if k in a and k in b:out[k+'_delta']=a[k]-b[k]\n    R['process_sample']['rows'].append(out)\nR['shadow']={}\nfor name in ('CURRENT.json','idle.json','status.json'):\n    o=read_envelope(name) or {}\n    R['shadow'][name]={k:o.get(k) for k in ('generation_id','as_of','status','phase','state','heartbeat_at','last_generation_id','source_freshness_renewed','real_orders_sent','real_routes','generation_timing','poll_seconds') if k in o}\n\nR['databases']={}\nif R['resources']['memory_available_bytes']>=256*1024*1024:\n    for label,p in (('paper',ROOT/'data/paper_v17/observer_v17.db'),('history',ROOT/'data/market_history.db')):\n\
        \        d={'state':'NO_VERIFICADO','read_only':True,'full_scan':False,'deletion_allowed':False}\n        if not p.is_file() or p.is_symlink():R['databases'][label]=dict(d,reason='SOURCE_UNAVAILABLE');continue\n        d['files']={suffix or 'main':pathlib.Path(str(p)+suffix).stat().st_size for suffix in ('','-wal','-shm') if pathlib.Path(str(p)+suffix).is_file()}\n        try:\n            with sqlite3.connect(p.as_uri()+'?mode=ro',uri=True,timeout=.05) as c:\n                c.execute('PRAGMA query_only=ON')\n                deadline=time.monotonic()+2\n                c.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)\n                d['pragmas']={k:c.execute('PRAGMA '+k).fetchone()[0] for k in ('page_size','page_count','freelist_count','journal_mode')}\n                meta=c.execute(\"SELECT name,type,sql FROM sqlite_master WHERE type IN ('table','index') LIMIT 500\").fetchall()\n                d['tables']={name:{'columns':[r[1] for r in c.execute('PRAGMA table_info(\"\
        '+name.replace('\"','\"\"')+'\")')]} for name,kind,sql in meta if kind=='table'}\n                d['indexes']=[name for name,kind,sql in meta if kind=='index']\n                if label=='paper':\n                    c.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)\n                    if 'observer_state' in d['tables']:\n                        row=c.execute('SELECT mode,process_state,session_state,heartbeat_at,real_orders_sent FROM observer_state ORDER BY id DESC LIMIT 1').fetchone()\n                        d['observer_state']=dict(zip(('mode','process_state','session_state','heartbeat_at','real_orders_sent'),row)) if row else None\n                    for table in ('financial_instrument_catalog','candidate_universe'):\n                        if table not in d['tables']:continue\n                        columns=d['tables'][table]['columns']\n                        projection=['instrument_type']+[k for k in ('status','capability','can_simulate') if k in columns]\n\
        \                        q=','.join('\"'+k+'\"' for k in projection)\n                        try:\n                            deadline=time.monotonic()+.5\n                            rows=c.execute('SELECT '+q+',count(*) FROM \"'+table+'\" GROUP BY '+q+' LIMIT 200').fetchall()\n                            d[table+'_groups']=[dict(zip(projection+['count'],r)) for r in rows]\n                        except sqlite3.Error:d[table+'_groups']={'state':'NO_VERIFICADO','reason':'BOUNDED_QUERY_ABORTED'}\n                d['state']='VALIDADO_RUNTIME'\n        except (OSError,sqlite3.Error) as exc:d.update(state='NO_VERIFICADO',reason=type(exc).__name__)\n        R['databases'][label]=d\nelse:R['warnings'].append('SQL_METADATA_SKIPPED_MEMORY_RESERVE')\n\nR['host_managed_source_hashes']={}\nEXPECTED={'ops_runtime_evidence_rc6.py': '09c9a2c4729b443e39ea86c008ac81f95b3f2f08717069117732fa8af5dbda33', 'scripts/porota_publish_runtime_evidence_github_rc6.sh': '58f788d957128d42dde035492347beb0f5ac547b378f8adb7b98618102532e2f',\
        \ 'scripts/porota_export_scheduler_state_rc6.sh': 'f61197b511bee3b0e69a4c4db8302ab0ea471fad59c8e2bfc4e2b72edf752b5c', 'scripts/rc6_iol_shadow_collect.py': '89110add33f031f0649741be8c6df354a06002f5d0208a9cf8ce3bf46169bd1e', 'scripts/rc6_public_source_capture.py': 'b6fc3939bb73e8a4cd828ce3cc265431396594d6b1d6171809bee0e45d1be17a', 'scripts/rc6_full_universe_evidence.py': '85261dd1c5160778b4fa1ad3a2a1414f1198b48275c20b08380dda941dc1d7e0', 'rc6_local_eod_history.py': '8a70e9c70bfe4310b1a0704d35c4af5efec6d320707fb4532336d852a670d445', 'ew_a3_history_rc6.py': '50a7c73373bd3571a8a4f75bd0aac095f4c9a0dc4dbabcb6f7a571d9ce4c6a89', 'ex_a3_history_job_rc6.py': '501140f718059dc782aa1f77f5138d73081e813de0753e97942da7a884735f77', 'cv_history_store_adapter_hf6.py': 'd6b96cf45751172eda45be057f14ebfc092be81ece1c4181be48155ae0edaac5', 'cu_history_store_v2_hf6.py': '8565376c6918f810465cd4289d2b1ab2b60149fa1343590acf15bcc6fec939bc', 'bf_production_paper_observer.py': '185a0214590dfbd1695bdc91e3d7018cc9bcf386295da63ad239c6d4f43a2e3e',\
        \ 'bv_paper_runtime.py': 'ba4ec879ea9ab61a45cecf8e800cc5b61cff62fac7c8f6008969a809cd42284f', 'bl_candle_engine.py': 'a009df5d92ad40c1f5a8a0d0c6ddd9cd94da44bb2ffd3a54fe1a5ca4c1748345', 'bn_telegram_bus.py': '3e64b7641999aff82f31b7a6ebbf7a101fc29f04d9c0e4b5157083d316369d66', 'rc6_performance/capture.py': '5e0bf6a95cc66668e810ce628b4af53a395753d0956b1433ad1172813e131c5a', 'rc6_shadow_runtime/worker.py': '88e5f34a8d019fa089529a78c447bfe69a103f5fba778a782c39833bdebe2cda', 'cf_intraday_scalping.py': '42cbe3c2ce5537eca7d2abfc89f5855c7dbbb1c8d2286c6b8cef58412ca83bbb', 'di_caucion_cash_sweep_runtime_hf6.py': 'a274b405a82c11d07981a8e28d13af095ce38707a2ed231720e29f874720b4bd'}\nfor relative,digest in EXPECTED.items():\n    p=ROOT/relative\n    try:\n        good=p.is_file() and not p.is_symlink() and p.stat().st_size<2*1024**2\n        actual=hashlib.sha256(p.read_bytes()).hexdigest() if good else None\n        R['host_managed_source_hashes'][relative]={'expected_sha256':digest,'actual_sha256':actual,'matches':actual==digest}\n\
        \    except OSError:R['host_managed_source_hashes'][relative]={'matches':False,'error':'READ_FAILED'}\ntry:\n    p=ROOT/'data/market_history.db'\n    with sqlite3.connect(p.as_uri()+'?mode=ro',uri=True,timeout=.05) as c:\n        c.execute('PRAGMA query_only=ON')\n        names=[r[0] for r in c.execute(\"SELECT name FROM sqlite_master WHERE type='table' LIMIT 100\")]\n        R['history_declared_foreign_key_counts']={name:len(c.execute('PRAGMA foreign_key_list(\"'+name.replace('\"','\"\"')+'\")').fetchall()) for name in names}\nexcept sqlite3.Error:R['history_declared_foreign_key_counts']={'state':'NO_VERIFICADO'}\n\nR['source_end_utc']=datetime.datetime.now(UTC).isoformat()\nR['source_art']=datetime.datetime.fromisoformat(R['source_utc']).astimezone(ZoneInfo('America/Argentina/Buenos_Aires')).isoformat()\nR['elapsed_seconds']=round(time.monotonic()-START,3)\nprint(json.dumps(R,sort_keys=True,separators=(',',':')))\nPY\ntimeout 35 ssh -i \"$HOME/.ssh/rc6_a74\" -o BatchMode=yes -o\
        \ IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\" -o ConnectTimeout=10 \"$DO_USER@$DO_HOST\" 'sudo -n docker exec -i porota_production_observer python -' > \"$RUNNER_TEMP/a74_exact_family_contracts.json\" <<'PY'\n\"\"\"Read-only exact catalog/contract reconciliation inside installed image.\"\"\"\nimport collections,datetime,json,os,re,sqlite3,time\nimport bu_instrument_catalog as catalog\nfrom be_paper_engine import OPERATIONAL_FAMILIES\nfrom rc6_paper_admission_gate import admission_status,focus_contracts\n\nAT=datetime.datetime.now(datetime.timezone.utc);START=time.monotonic()\nPATH='/app/data/paper_v17/observer_v17.db'\nFAMILIES=('ACCIONES','CEDEARS','ETFS','BONOS','LETRAS','OBLIGACIONES','OPCIONES','FUTUROS','CAUCIONES','FCI')\nR={'schema':'RC6_A74_EXACT_FAMILY_CONTRACTS_V1','source_utc':AT.isoformat(),'read_only':True,\n   'real_order_routes_called':False,'catalog_contract_check_only':True,'fills_forced':False,\n   'effective_operational_families':sorted(OPERATIONAL_FAMILIES),'family_env_override_present':bool(os.getenv('POROTA_OPERATIONAL_FAMILIES')),\n\
        \   'families':{},'warnings':[]}\ndef family(value):return {'ETF':'ETFS','ON':'OBLIGACIONES'}.get(value,value)\ndef key(row):return tuple(row[k] for k in ('ticker','instrument_type','market','currency','settlement'))\ndef safe(value):\n    s=str(value)\n    return s if re.fullmatch(r'[A-Z][A-Z0-9_]{1,100}',s) else 'UNCLASSIFIED_CONTRACT_ERROR'\nc=sqlite3.connect('file:'+PATH+'?mode=ro',uri=True,timeout=.1);c.row_factory=sqlite3.Row\ntry:\n    c.execute('PRAGMA query_only=ON');c.execute('PRAGMA cache_size=-2048')\n    deadline=time.monotonic()+2;c.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)\n    c.execute('BEGIN')\n    safety=c.execute('SELECT mode,real_orders_sent,session_state,heartbeat_at FROM observer_state WHERE id=1').fetchone()\n    R['safety']={k:safety[k] for k in safety.keys()} if safety else None\n    assert safety and safety['mode']=='PRODUCTION_PAPER' and type(safety['real_orders_sent']) is int and safety['real_orders_sent']==0\n    rows=c.execute('SELECT\
        \ ticker,instrument_type,market,currency,settlement,settlement_source,status,capability,last_seen_at,metadata_json FROM financial_instrument_catalog LIMIT 20001').fetchall()\n    exact=c.execute('SELECT * FROM candidate_identity_v2 LIMIT 20001').fetchall()\n    assert len(rows)<=20000 and len(exact)<=20000\n    ledgers={key(r):dict(r) for r in exact};assert len(ledgers)==len(exact)\n    R['catalog_rows']=len(rows);R['exact_candidate_rows']=len(exact)\n    # A JOIN here verifies recorded PAPER fills, never creates a simulated fill.\n    R['paper_fill_rows_by_family']=[dict(r) for r in c.execute('SELECT p.asset_class AS family,f.side,COUNT(*) AS rows,MIN(f.filled_at) AS first_at,MAX(f.filled_at) AS last_at FROM paper_fills f JOIN paper_positions p USING(paper_id) GROUP BY p.asset_class,f.side LIMIT 40')]\n    R['orphan_paper_fill_count']=c.execute('SELECT COUNT(*) FROM paper_fills f WHERE NOT EXISTS(SELECT 1 FROM paper_positions p WHERE p.paper_id=f.paper_id)').fetchone()[0]\n    R['paper_positions_by_family']=[dict(r)\
        \ for r in c.execute('SELECT asset_class AS family,status,COUNT(*) AS rows FROM paper_positions GROUP BY asset_class,status LIMIT 50')]\n    R['paper_future_positions']=[dict(r) for r in c.execute('SELECT status,COUNT(*) AS rows FROM paper_future_positions GROUP BY status LIMIT 10')]\n    R['paper_family_lifecycle']=[dict(r) for r in c.execute('SELECT family,state,COUNT(*) AS rows FROM paper_family_lifecycle GROUP BY family,state LIMIT 40')]\n    R['paper_cauciones']=[dict(r) for r in c.execute('SELECT status,COUNT(*) AS rows,MIN(opened_at) AS first_at,MAX(opened_at) AS last_at FROM paper_cauciones GROUP BY status LIMIT 10')]\n    c.rollback()\nfinally:c.close()\nfor name in FAMILIES:\n    chosen=[r for r in rows if family(r['instrument_type'])==name]\n    stats={'catalog_rows':len(chosen),'catalog_available':0,'candidate_exact_ready':0,\n           'stored_capability_ready':0,'recomputed_capability_ready':0,\n           'capability_disagreement':0,'ppi_primary_identity_rows':0,'metadata_invalid':0,\n\
        \           'contract_error_reasons':collections.Counter(),'live_quote_freshness':'NO_VERIFICADO',\n           'strategy_signal_and_risk_admission':'NO_VERIFICADO','monday_OPEN':'NO_VERIFICADO'}\n    for row in chosen:\n        if time.monotonic()-START>12:raise TimeoutError('FAMILY_CPU_WALL_BUDGET')\n        item=dict(row);ledger=ledgers.get(key(row))\n        stats['catalog_available']+=row['status']=='AVAILABLE'\n        stats['stored_capability_ready']+=str(row['capability']).startswith('READY_PAPER_') and row['status']=='AVAILABLE'\n        stats['candidate_exact_ready']+=bool(ledger and ledger['can_simulate']==1 and ledger['status']=='AVAILABLE')\n        try:\n            raw=json.loads(item.pop('metadata_json'))\n            if not isinstance(raw,dict):raise ValueError('METADATA_INVALID')\n            item['raw']=raw\n            stats['ppi_primary_identity_rows']+=bool(catalog._candidate_has_ppi_primary(row['settlement_source'],json.dumps(raw)))\n            actual=catalog.capability(item)\n\
        \            ready=str(actual).startswith('READY_PAPER_')\n            stats['recomputed_capability_ready']+=ready and row['status']=='AVAILABLE'\n            stats['capability_disagreement']+=actual!=row['capability']\n            if not ready:stats['contract_error_reasons'][safe(actual)]+=1\n        except (ValueError,TypeError,KeyError,AttributeError):stats['metadata_invalid']+=1\n    stats['contract_error_reasons']=dict(stats['contract_error_reasons'])\n    R['families'][name]=stats\nallowed,reason=admission_status()\nR['current_global_paper_preopen_gate']={'allowed':allowed,'reason':safe(reason) if reason else ''}\nfocus=focus_contracts(PATH)\nR['current_focus_identity_check']={k:focus.get(k) for k in ('state','reason','ready','required') if k in focus}\nR['current_focus_identity_check']['missing_count']=len(focus.get('missing',[]))\nR['source_end_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()\nR['elapsed_seconds']=round(time.monotonic()-START,3)\nprint(json.dumps(R,sort_keys=True,separators=(',',':')))\n\
