        \            page.keyboard.press('Escape')\n            if failures>=2:out['stopped_after_consecutive_failures']=True;break\n    return out\n\npersist('BEFORE_BROWSER');print('A74_BROWSER_START='+json.dumps({'probe':PROBE,'selected_routes':len(PATHS)}),flush=True)\ntry:\n  with sync_playwright() as p:\n    browser=p.chromium.launch(headless=True,executable_path=shutil.which('google-chrome'),args=['--disable-dev-shm-usage'])\n    context=browser.new_context(extra_http_headers={'Authorization':'Bearer '+TOKEN},reduced_motion='reduce')\n    rejected=collections.Counter()\n    def allow(route):\n        req=route.request;u=urllib.parse.urlsplit(req.url)\n        if u.scheme=='http' and u.netloc=='127.0.0.1:18000' and u.path in set(ALL)|{'/validacion','/favicon.ico'} and req.method in ('GET','HEAD'):route.continue_()\n        else:rejected['WRITE' if req.method not in ('GET','HEAD') else 'NON_ALLOWLISTED']+=1;route.abort()\n    context.route('**/*',allow)\n    page=context.new_page();page.set_default_timeout(2200);js=[]\n\
