name: RC6 A176 29-Oct administrative NO_GO receipt only

on:
  push:
    branches: [fix/rc6-a178-formal-takeover-20261029]
    paths:
      - .github/workflows/rc6-a176-admin-no-go-seal-20261029.yml
      - scripts/rc6_a176_operator_no_go_seal.py
      - tests/test_rc6_a176_operator_no_go_seal.py

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  operator-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact A178 WIP
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify single-write tests and A176 ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 8152e0a2ea3cf3138e1ba1138b0465a080ff561d "$GITHUB_SHA"
          python3 -m unittest tests.test_rc6_a176_operator_no_go_seal -v
          python3 -m py_compile scripts/rc6_a176_operator_no_go_seal.py
          git diff --check

      - name: Recheck exact product HEAD and failed A175 Deploy from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          base="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$base/branches/deploy/rc6-pr69-isolated-20260915" \
            -o "$RUNNER_TEMP/a176-product.json"
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$base/actions/runs/40796450488" \
            -o "$RUNNER_TEMP/a176-failed-deploy.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          branch=json.loads((tmp/'a176-product.json').read_text())
          failed=json.loads((tmp/'a176-failed-deploy.json').read_text())
          if (branch.get('commit',{}).get('sha')!='3c5210fef9d4f1d4c95b286b0dbc61b6654fe055' or
                  failed.get('head_sha')!='3c5210fef9d4f1d4c95b286b0dbc61b6654fe055' or
                  failed.get('status')!='completed' or failed.get('conclusion')!='failure'):
              raise SystemExit('A176_PRODUCT_OR_A175_FAILURE_PROVENANCE_DRIFT')
          print('A176_PRODUCT_AND_FAILED_DEPLOY_PROVENANCE=GREEN')
          PY

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Issue exactly one 29-Oct NO_GO sidecar under host mutex
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]
          umask 077
          timeout --signal=TERM --kill-after=5s 150s \
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 "$DO_USER@$DO_HOST" \
              "sudo -n env PYTHONDONTWRITEBYTECODE=1 RC6_GH_RUN_ID=$GITHUB_RUN_ID RC6_GH_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT python3 -" \
              < scripts/rc6_a176_operator_no_go_seal.py \
              | tee "$RUNNER_TEMP/a176-seal-result.log"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'a176-seal-result.log').read_text()
          rows=[x.split('=',1)[1] for x in raw.splitlines() if x.startswith('RC6_A176_ADMIN_NO_GO=')]
          if len(rows)!=1: raise SystemExit('A176_SEAL_OUTPUT_INVALID')
          row=json.loads(rows[0])
          if (row.get('schema')!='RC6_A176_ADMIN_NO_GO_SEAL_V1' or
                  row.get('status')!='SEALED_NO_GO' or
                  row.get('business_day_art')!='2026-10-29' or
                  row.get('paper_execution_authorized') is not False or
                  row.get('real_orders_sent')!=0 or row.get('ppi_watch')!='NOT_MUTATED' or
                  row.get('host_mutations') not in (0,1) or
                  not re.fullmatch('[0-9a-f]{64}',row.get('receipt_sha256',''))):
              raise SystemExit('A176_SEAL_PROOF_RED')
          print('A176_ADMIN_NO_GO_PROOF=SEALED|sha256='+row['receipt_sha256']+
                '|operational_go=false|PAPER=0|real_orders=0')
          PY

      - name: Preserve exact receipt result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a176-no-go-receipt-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a176-seal-result.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Erase runner SSH and GitHub response material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/a176-product.json" "$RUNNER_TEMP/a176-failed-deploy.json" \
            "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
