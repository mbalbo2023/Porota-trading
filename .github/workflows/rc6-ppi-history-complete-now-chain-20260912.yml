name: RC6 PPI history complete now chain 2026-09-12
on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-complete-now-chain-20260912.yml']
permissions:
  contents: read
jobs:
  install-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Install independent completion chain
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo "HOST_SHA=$(git rev-parse HEAD)"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import bf_production_paper_observer as m
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('SAFETY=%s|%s'%s); print('MARKET_PHASE='+m._market_phase())
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0 and m._market_phase()=='CLOSED'
          PY
          cat >/tmp/porota-ppi-argentina-complete-now-rc6.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          SERVICE=porota-ppi-argentina-nightly-rc6.service
          OUT=/opt/porota-trading/data/audit/ppi_history_complete_now_latest.txt
          install -d -m 0755 /opt/porota-trading/data/audit
          exec > >(tee "$OUT") 2>&1
          echo "CHAIN_START_UTC=$(date -u +%FT%TZ)"
          pending() {
            docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          nightly=bool(c.execute("select count(*) from sqlite_master where type='table' and name='ppi_argentina_nightly_history_attempts'").fetchone()[0])
          if nightly:
              q='''SELECT COUNT(*) FROM ppi_argentina_api_shadow s LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement LEFT JOIN ppi_argentina_nightly_history_attempts n ON n.ticker=s.ticker AND n.instrument_type=s.instrument_type AND n.market=s.market AND n.currency=s.currency AND n.settlement=s.settlement WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR') AND COALESCE(n.state,p.state) IS NULL'''
          else:
              q='''SELECT COUNT(*) FROM ppi_argentina_api_shadow s LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR') AND p.state IS NULL'''
          print(c.execute(q).fetchone()[0]); c.close()
          PY
          }
          for _ in $(seq 1 540); do
            state="$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
            case "$state" in active|activating) sleep 5;; *) break;; esac
          done
          state="$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
          case "$state" in active|activating) echo 'CHAIN_ABORT=FIRST_PASS_TIMEOUT'; exit 50;; esac
          echo "FIRST_PASS_RESULT=$(systemctl show "$SERVICE" -p Result --value 2>/dev/null || true)|STATUS=$(systemctl show "$SERVICE" -p ExecMainStatus --value 2>/dev/null || true)"
          P="$(pending | tail -n1)"; echo "PENDING_AFTER_FIRST=$P"
          for pass in 2 3; do
            [ "$P" -gt 0 ] || break
            docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import bf_production_paper_observer as m
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0 and m._market_phase()=='CLOSED'
          print('PASS_SAFETY=GREEN')
          PY
            for u in porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
              s="$(systemctl is-active "$u" 2>/dev/null || true)"; case "$s" in active|activating) echo "CHAIN_ABORT=CONCURRENT:$u"; exit 51;; esac
            done
            B="$P"; echo "PASS_${pass}_START_PENDING=$B|UTC=$(date -u +%FT%TZ)"
            systemctl reset-failed "$SERVICE" || true
            systemctl start "$SERVICE"
            R="$(systemctl show "$SERVICE" -p Result --value)"; S="$(systemctl show "$SERVICE" -p ExecMainStatus --value)"
            echo "PASS_${pass}_RESULT=$R|STATUS=$S|UTC=$(date -u +%FT%TZ)"
            [ "$R" = success ] && [ "$S" = 0 ] || exit 52
            P="$(pending | tail -n1)"; echo "PASS_${pass}_PENDING_AFTER=$P"
            [ "$P" -lt "$B" ] || { echo 'CHAIN_ABORT=NO_PROGRESS'; exit 53; }
          done
          docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); print('FINAL_SAFETY=%s|%s'%s)
          n=c.execute('select count(*) from ppi_argentina_nightly_history_attempts').fetchone()[0]; print('NIGHTLY_IDENTITIES='+str(n))
          for r in c.execute("select instrument_type,count(*),sum(case when state in ('VALID_PAYLOAD','PARTIAL') then 1 else 0 end),sum(case when state='EMPTY_OR_INVALID' then 1 else 0 end),sum(case when state='ERROR' then 1 else 0 end),sum(valid_rows) from ppi_argentina_nightly_history_attempts group by instrument_type order by instrument_type"):
              print('NIGHTLY_FAMILY=%s|TESTED=%s|USABLE=%s|EMPTY=%s|ERROR=%s|VALID_ROWS=%s'%r)
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          c.close()
          PY
          echo "FINAL_PENDING=$P"
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDERS_SENT=0'
          echo "CHAIN_END_UTC=$(date -u +%FT%TZ)"
          SH
          sudo -n install -o root -g root -m 0755 /tmp/porota-ppi-argentina-complete-now-rc6.sh /usr/local/sbin/porota-ppi-argentina-complete-now-rc6.sh
          cat >/tmp/porota-ppi-argentina-complete-now-rc6.service <<'UNIT'
          [Unit]
          Description=Porota RC6 complete pending PPI Argentina history now
          After=docker.service network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/porota-ppi-argentina-complete-now-rc6.sh
          TimeoutStartSec=90min
          Nice=10
          IOSchedulingClass=idle
          UNIT
          sudo -n install -o root -g root -m 0644 /tmp/porota-ppi-argentina-complete-now-rc6.service /etc/systemd/system/porota-ppi-argentina-complete-now-rc6.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl reset-failed porota-ppi-argentina-complete-now-rc6.service || true
          sudo -n systemctl start --no-block porota-ppi-argentina-complete-now-rc6.service
          sleep 2
          systemctl show porota-ppi-argentina-complete-now-rc6.service -p ActiveState -p SubState -p Result --no-pager
          echo 'CHAIN_INSTALL=GREEN'
          echo 'ORDER_ROUTES=NOT_CALLED'
          HOST
