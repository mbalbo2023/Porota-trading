name: RC6 Contract blocked nonread audit 2026-09-14

on:
  push:
    branches: [ops/rc6-contract-blocked-nonread-audit-20260914]
    paths:
      - '.github/workflows/rc6-contract-blocked-nonread-audit-20260914.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-blocked-nonread:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rc6-contract-blocked-nonread-audit-20260914

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read existing capture and classify blocked requests
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          RESULT=POROTA_TRADING_CONTRACT_BLOCKED_NONREAD_AUDIT_2026-09-14.txt
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY' > "$RESULT"
          import json, os
          from collections import Counter, defaultdict
          from urllib.parse import urlsplit

          p='/opt/porota-trading/data/contract_evidence/rc6_trusted/contract_point1_20260914T000107Z.json'
          print('PROBE=RC6_CONTRACT_BLOCKED_NONREAD_AUDIT_V1')
          print('CAPTURE='+p)
          print('READ_ONLY=YES')
          print('DB_TOUCHED=NO')
          print('BROWSER_STARTED=NO')
          if not os.path.isfile(p):
              print('RESULT=RED_CAPTURE_MISSING')
              raise SystemExit(0)
          d=json.load(open(p,encoding='utf-8'))
          rows=d.get('blocked_nonread') or []
          print('AUTH_STATUS='+str(d.get('auth_status')))
          print('REAL_ORDERS_SENT='+str(d.get('real_orders_sent')))
          print('BLOCKED_NONREAD_RAW_COUNT='+str(len(rows)))

          def classify(method, host, path):
              hp=(host+' '+path).lower()
              pth=path.lower()
              third_party = not (host == 'portfoliopersonal.com' or host.endswith('.portfoliopersonal.com'))
              telemetry_tokens=('clarity','analytics','google-analytics','googletagmanager','doubleclick','bat.bing','bing.com','collect','telemetry','metrics','events','track')
              dangerous_tokens=('/operar','/orden','/orders','/trade','/confirm','/cancel','/anular','/enviarorden','/crearorden','/nuevaorden')
              auth_tokens=('login','auth','sso','session','token')
              if third_party and any(x in hp for x in telemetry_tokens):
                  return 'THIRD_PARTY_TELEMETRY_CANDIDATE'
              if not third_party and any(x in pth for x in dangerous_tokens):
                  return 'PPI_ORDER_OR_MUTATION_PATH_DANGEROUS'
              if not third_party and any(x in pth for x in auth_tokens):
                  return 'PPI_AUTH_OR_SSO'
              if third_party:
                  return 'THIRD_PARTY_NONREAD_REVIEW_REQUIRED'
              return 'PPI_TECHNICAL_NONREAD_REVIEW_REQUIRED'

          grouped=Counter()
          cats=Counter()
          cat_rows=defaultdict(list)
          for r in rows:
              method=str(r.get('method') or '').upper()
              u=urlsplit(str(r.get('url') or ''))
              host=u.netloc.lower()
              path=u.path or '/'
              key=(method,host,path)
              grouped[key]+=1
          print('BLOCKED_NONREAD_UNIQUE_COUNT='+str(len(grouped)))
          print('--- UNIQUE_GROUPS ---')
          for (method,host,path),count in sorted(grouped.items()):
              cat=classify(method,host,path)
              cats[cat]+=count
              cat_rows[cat].append((method,host,path,count))
              print(f'{count}\t{cat}\t{method}\t{host}\t{path}')
          print('--- CATEGORY_COUNTS ---')
          for cat,count in sorted(cats.items()):
              print(f'{cat}={count}')
          print('--- CLASSIFICATION_SUMMARY ---')
          for cat in sorted(cat_rows):
              print(f'[{cat}]')
              for method,host,path,count in cat_rows[cat]:
                  print(f'{count}x {method} {host}{path}')
          print('RESULT=GREEN_AUDIT_COMPLETE_NO_MUTATION')
          PY
          cat "$RESULT"

      - name: Persist sanitized audit result
        run: |
          set -euo pipefail
          RESULT=POROTA_TRADING_CONTRACT_BLOCKED_NONREAD_AUDIT_2026-09-14.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git diff --cached --quiet && exit 0
          git commit -m 'audit(contract): persist blocked nonread classification [skip ci]'
          git push origin HEAD:ops/rc6-contract-blocked-nonread-audit-20260914
