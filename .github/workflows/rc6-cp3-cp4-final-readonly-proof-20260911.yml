name: RC6 CP3 CP4 Final Readonly Proof 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-cp3-cp4-final-readonly-proof-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  ce_runtime:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect actual CE service runtime and data path read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          test "$(git -C /opt/porota-trading rev-parse HEAD)" = "$TARGET"
          echo MUTATIONS=NONE
          echo '--- CE SERVICE/TIMER ---'
          sudo -n systemctl cat porota-contract-evidence-rc6.service
          sudo -n systemctl cat porota-contract-evidence-rc6.timer
          echo "CE_TIMER_ACTIVE=$(sudo -n systemctl is-active porota-contract-evidence-rc6.timer)"
          echo "CE_TIMER_ENABLED=$(sudo -n systemctl is-enabled porota-contract-evidence-rc6.timer)"
          echo "CE_SERVICE_RESULT=$(sudo -n systemctl show porota-contract-evidence-rc6.service -p Result --value)"
          echo '--- ACTUAL RUNTIME WRAPPER ---'
          test -r /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          sudo -n sed -n '1,520p' /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          echo '--- REFERENCED CE/NORMALIZER FILE NAMES ---'
          sudo -n find /usr/local/sbin /usr/local/lib/porota -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort | grep -Ei '(contract|evidence|normal|semantic|capture)' || true
          echo '--- LATEST CAPTURE SANITIZED STRUCTURE ---'
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/opt/porota-trading/data/contract_evidence/rc6_trusted')
          files=list(root.glob('contract_*.json'))
          print('CAPTURE_COUNT='+str(len(files)))
          if not files:
              print('CP3_CAPTURE_PRESENT_GATE=RED|REASON=NO_CAPTURE_FILES')
          else:
              p=max(files,key=lambda x:x.stat().st_mtime)
              x=json.loads(p.read_text())
              print('FILE='+p.name)
              print('STAT='+oct(p.stat().st_mode & 0o777)+'|SIZE='+str(p.stat().st_size))
              print('TOP_KEYS='+';'.join(sorted(x)))
              print('AUTH='+str(x.get('auth_status'))+'|ORDERS='+str(x.get('real_orders_sent'))+'|AMOUNT='+str(x.get('amount_filled'))+'|PRICE='+str(x.get('price_filled')))
              for k in ('jobs','routes','endpoints','blocked_nonread'):
                  v=x.get(k)
                  print(f'{k.upper()}_TYPE={type(v).__name__}|SIZE={len(v) if hasattr(v,"__len__") else "NA"}')
                  if isinstance(v,list):
                      for item in v[:12]:
                          if isinstance(item,dict):
                              safe={a:b for a,b in item.items() if a.lower() not in {'cookie','cookies','authorization','token','password','username','user','headers','body','payload','content','html'}}
                              print('  '+json.dumps(safe,ensure_ascii=False,sort_keys=True)[:1200])
              blocked=x.get('blocked_nonread')
              if isinstance(blocked,list):
                  print('CP3_BLOCKED_NONREAD_GATE='+('GREEN' if len(blocked)==0 else 'RED')+'|TYPE=list|COUNT='+str(len(blocked)))
              else:
                  print('CP3_BLOCKED_NONREAD_GATE=RED|REASON=UNKNOWN_SHAPE|TYPE='+type(blocked).__name__)
              orders=x.get('real_orders_sent')
              print('CP3_REAL_ORDERS_GATE='+('GREEN' if orders == 0 else 'RED')+'|VALUE='+repr(orders))
              endpoints=x.get('endpoints')
              if isinstance(endpoints,dict):
                  print('CP3_ENDPOINTS_MATERIALIZATION_INPUT='+('GREEN' if len(endpoints)>0 else 'YELLOW')+'|TYPE=dict|COUNT='+str(len(endpoints)))
              else:
                  print('CP3_ENDPOINTS_MATERIALIZATION_INPUT=RED|REASON=UNKNOWN_SHAPE|TYPE='+type(endpoints).__name__)
          PY
          echo '--- CE TABLE COUNTS/FRESHNESS IN OBSERVER DB ---'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          names=[r[0] for r in c.execute("select name from sqlite_master where type='table' and (lower(name) like '%contract%' or lower(name) like '%evidence%') order by name")]
          print('CE_TABLES='+';'.join(names))
          total_rows=0
          nonempty=0
          freshness=[]
          for t in names:
              q='"'+t.replace('"','""')+'"'
              cols=[r[1] for r in c.execute(f'pragma table_info({q})')]
              n=c.execute(f'select count(*) from {q}').fetchone()[0]
              total_rows+=n
              nonempty+=int(n>0)
              print(f'TABLE={t}|ROWS={n}|COLS={";".join(cols[:60])}')
              for col in ('observed_at','captured_at','fetched_at','updated_at','created_at','run_at','ts'):
                  if col in cols:
                      try:
                          v=c.execute(f'select max("{col}") from {q}').fetchone()[0]
                          print(f'  MAX_{col}={v}')
                          if v is not None: freshness.append((t,col,str(v)))
                      except Exception as e:
                          print(f'  MAX_{col}_ERROR={type(e).__name__}')
          print(f'CE_TOTAL_ROWS={total_rows}|CE_NONEMPTY_TABLES={nonempty}|CE_TABLE_COUNT={len(names)}')
          print('CP3_DB_MATERIALIZATION_GATE='+('GREEN' if total_rows>0 and nonempty>0 else 'YELLOW'))
          print('CP3_DB_FRESHNESS_SIGNALS='+str(len(freshness)))
          c.close()
          PY
          echo CE_RUNTIME_PROOF_COMPLETE=YES
          HOST

  a3_identity:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Prove actual PPI/A3 FUTURES identity shapes read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          test "$(git -C /opt/porota-trading rev-parse HEAD)" = "$TARGET"
          echo MUTATIONS=NONE
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3, json
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          print('--- FUTURES STATE ---')
          cols=[r[1] for r in c.execute('pragma table_info(a3_history_ingest_state_rc6)')]
          print('STATE_COLS='+';'.join(cols))
          states=[]
          for r in c.execute("select * from a3_history_ingest_state_rc6 where instrument_type='FUTURES' order by symbol limit 80"):
              d=dict(r); states.append(d); print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          print('A3_FUTURES_STATE_ROWS='+str(len(states)))
          print('A3_FUTURES_COMPLETE_ROWS='+str(sum(1 for r in states if str(r.get('status') or '').upper()=='COMPLETE')))
          print('--- CATALOG-LIKE TABLES ---')
          names=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          for t in names:
              if any(x in t.lower() for x in ('catalog','instrument','universe','candidate')):
                  q='"'+t.replace('"','""')+'"'; tc=[r[1] for r in c.execute(f'pragma table_info({q})')]
                  if 'symbol' in tc:
                      n=c.execute(f'select count(*) from {q}').fetchone()[0]
                      print(f'TABLE={t}|ROWS={n}|COLS={";".join(tc[:50])}')
                      fam=next((x for x in ('instrument_type','family','type') if x in tc),None)
                      if fam:
                          try:
                              for r in c.execute(f"select symbol,{fam} family from {q} where upper(coalesce({fam},'')) in ('FUTURES','FUTUROS') order by symbol limit 120"): print('  '+json.dumps(dict(r),ensure_ascii=False,sort_keys=True))
                          except Exception as e: print('  QUERY_ERROR='+repr(e))
          c.close()
          PY
          echo '--- A3 ALIGNMENT OBSERVABILITY ---'
          sudo -n docker exec porota_production_observer sh -lc "test -r /app/data/paper_v17/observability/a3_catalog_alignment_latest.json && cat /app/data/paper_v17/observability/a3_catalog_alignment_latest.json || true"
          echo A3_IDENTITY_PROOF_COMPLETE=YES
          HOST
