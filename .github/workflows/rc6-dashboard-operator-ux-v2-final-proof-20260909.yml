name: RC6 Dashboard Operator UX V2 Final Proof 2026-09-09

on:
  push:
    branches: [proof/rc6-dashboard-operator-ux-v2-final-20260909]
    paths: ['.github/workflows/rc6-dashboard-operator-ux-v2-final-proof-20260909.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only live proof
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECTED=9197aedf35fe1739b594c742902e80df069c47c9
          HEAD=$(git rev-parse HEAD); echo "HEAD=$HEAD"; test "$HEAD" = "$EXPECTED"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|READONLY={{.HostConfig.ReadonlyRootfs}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os,re,urllib.request
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          pages=['/','/vivo','/trading','/trading/renta-fija','/universo-operativo','/instrumentos','/riesgo','/validacion','/historicos','/sistema','/scalping']
          bodies={}
          for p in pages:
              req=urllib.request.Request('http://127.0.0.1:8000'+p)
              if token:
                  req.add_header('Authorization','Bearer '+token); req.add_header('X-Dashboard-Token',token)
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8','replace'); bodies[p]=body
                  tables=len(re.findall(r'<table(?:\s|>)',body,re.I)); th=len(re.findall(r'<th(?:\s|>)',body,re.I))
                  index_nodes=len(re.findall(r"<nav\b[^>]*id=['\"]porota-page-index['\"]",body,re.I))
                  generated_captions=len(re.findall(r"<caption\b[^>]*class=['\"][^'\"]*porota-table-title",body,re.I))
                  print(f'PAGE={p}|HTTP={r.status}|TABLES={tables}|TH={th}|INDEX_NODES={index_nodes}|GENERATED_CAPTIONS={generated_captions}')
                  assert r.status==200
                  assert 'porota-rc6-classic-responsive' in body
                  if tables: assert th>0
                  assert 'overflow-wrap:anywhere' not in body
                  assert generated_captions==0
          assert len(re.findall(r"<(?:nav|div|aside)\b[^>]*class=['\"][^'\"]*subnav[^'\"]*['\"]",bodies['/trading'],re.I))==1
          assert not re.search(r"<nav\b[^>]*id=['\"]porota-page-index['\"]",bodies['/trading'],re.I)
          assert not re.search(r"<nav\b[^>]*id=['\"]porota-page-index['\"]",bodies['/trading/renta-fija'],re.I)
          assert re.search(r"<(?:nav|div|aside)\b[^>]*class=['\"][^'\"]*system-nav",bodies['/sistema'],re.I)
          assert not re.search(r"<nav\b[^>]*id=['\"]porota-page-index['\"]",bodies['/sistema'],re.I)
          assert 'rc6-family-live-activity' in bodies['/trading']
          assert 'Actividad real de análisis por familia' in bodies['/trading']
          assert not re.search(r'<h2[^>]*>\s*4\.\s*Scalping\s*</h2>',bodies['/vivo'],re.I)
          assert not re.search(r'<h2[^>]*>\s*5\.\s*Motores\s*/\s*workers\s*</h2>',bodies['/vivo'],re.I)
          assert 'Matriz de controles exigidos' in bodies['/riesgo']
          print('DASHBOARD_OPERATOR_UX_V2_LIVE=GREEN')
          PY
          POST=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          row=c.execute('select mode,process_state,session_state,ppi_auth,real_orders_sent,last_market_data_at from observer_state where id=1').fetchone()
          raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]
          c.close()
          print(f'{q}|{row[0]}|{row[4]}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}|{row[1]}|{row[2]}|{row[3]}|{row[5]}')
          PY
          )
          echo "POST_RUNTIME=$POST"
          case "$POST" in ok\|PRODUCTION_PAPER\|0\|0\|EXTERNAL_EXACT_V1\|*) ;; *) exit 1;; esac
          echo RUNTIME_MUTATION=NO
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          REMOTE
