name: RC6 732 bounded read-only SQLite metadata audit
on:
  push:
    branches:
      - diagnostic/rc6-732-readonly-browser-20261024
    paths:
      - .github/workflows/rc6-732-readonly-sqlite-audit-20261024.yml
      - scripts/rc6_732_sqlite_metadata_readonly.py
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source, set strict SSH and inspect metadata only
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD ae1e299d3f39a21cf5e6320b42bc0461636ab710)" = ae1e299d3f39a21cf5e6320b42bc0461636ab710
          python -m py_compile scripts/rc6_732_sqlite_metadata_readonly.py
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_732_sqlite"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_732_sqlite" "$HOME/.ssh/known_hosts"
          EXPECTED_TREE="$(git rev-parse '6d06d825a90f9f22a1eb685b6b3c93940f6b19b9^{tree}')"
          timeout 15 ssh -i "$HOME/.ssh/rc6_732_sqlite" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n docker exec porota_production_dashboard python /app/scripts/porota_image_source_identity.py --expected-sha 6d06d825a90f9f22a1eb685b6b3c93940f6b19b9 --expected-tree '$EXPECTED_TREE'"
          timeout 35 ssh -i "$HOME/.ssh/rc6_732_sqlite" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            'sudo -n docker exec -i porota_production_dashboard nice -n 19 python3 -' \
            < scripts/rc6_732_sqlite_metadata_readonly.py
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/rc6_732_sqlite"
