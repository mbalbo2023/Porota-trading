name: RC6 A667 Cold Audit Cause READ_ONLY

# No schedule: one explicit post-review diagnostic only. PRs only run offline
# contracts; private host data is never accessed on PR/branch executions.
on:
  workflow_dispatch:
    inputs:
      expected_deploy_sha:
        description: 'Exact deployed product SHA from the current runtime checkpoint'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-a665-cold-queue-readonly.yml'
      - 'scripts/rc6_a665_cold_queue_readonly.py'
      - 'tests/test_rc6_a665_cold_queue_readonly.py'

permissions:
  contents: read

concurrency:
  group: rc6-a665-cold-queue-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise bounded private receipt reader OFFHOST
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_a665_cold_queue_readonly.py tests/test_rc6_a665_cold_queue_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_a665_cold_queue_readonly.py -v
          git diff --check

  host_readonly:
    needs: contracts
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    # Exclusive global host safety mutex, NOT a deploy authorization.
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exact SHA and manual gate before host permissions
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p evidence
      - name: Configure runner-only SSH credentials
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$RUNNER_TEMP/rc6_a665_ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rc6_a665_ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/rc6_a665_ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/rc6_a665_ssh/key" "$RUNNER_TEMP/rc6_a665_ssh/known_hosts"
      - name: READ_ONLY mount namespace, open private queue/receipts; no SQLite, provider, or mutation
        run: |
          set -Eeuo pipefail
          trap 'rm -f evidence/.a667_private_raw.json' EXIT
          set +e
          ssh -i "$RUNNER_TEMP/rc6_a665_ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6_a665_ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            'sudo -n timeout 24 unshare --mount --propagation private -- /bin/sh -eu -c "mount --bind /opt/porota-trading/data /opt/porota-trading/data && mount -o remount,bind,ro /opt/porota-trading/data && exec python3 -B -"' \
            < scripts/rc6_a665_cold_queue_readonly.py \
            > evidence/.a667_private_raw.json 2>/dev/null
          remote_rc=$?
          set -e
          REMOTE_RC="$remote_rc" python3 - <<'PY'
          import importlib.util,json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path

          schema='rc6.a667.cold-failure-cause-readonly.v3'
          raw=Path('evidence/.a667_private_raw.json')
          source=Path('scripts/rc6_a665_cold_queue_readonly.py')
          spec=importlib.util.spec_from_file_location('a667_ro_categories',source)
          categories=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(categories)
          safe={'schema':schema,'read_only':True,'state':'NO_VERIFICADO',
                'reason':'HOST_RESPONSE_INVALID_OR_UNAVAILABLE',
                'provider_gets':0,'orders_called':False,'mutations':0,
                'cold_audit_runtime_called':False,'os_readonly_mount_verified':False,
                'generated_at_utc':None,'generated_at_art':None,
                'observed_deploy_sha':None,'expected_deploy_sha':os.environ['EXPECTED_DEPLOY_SHA'],
                'receipt_count':None,'failed_receipt_count':None,'folder_entries_checked':None,
                'queue_state':'NO_VERIFICADO','queue_failed_binding':'NO_VERIFICADO',
                'failed_error_code':'NO_VERIFICADO',
                'failed_error_phase':'NO_VERIFICADO',
                'failed_error_class':'NO_VERIFICADO',
                'failed_manifest_relation':'NO_VERIFICADO',
                'current_failed_relation':'NO_VERIFICADO',
                'current_snapshot_class':'NO_VERIFICADO',
                'current_generation_class':'NO_VERIFICADO',
                'original_old_cut_presence':'NO_VERIFICADO',
                'historical_cold2_cut_presence':'NO_VERIFICADO',
                'current_cut_manifest_binding':'NO_VERIFICADO',
                'current_cut_paper_zero_routes_blocked':None,
                'known_successor_manifest_exact':None,
                'unrecognized_failed_id_bound':None,
                'live_status_class':'NO_VERIFICADO',
                'live_cancel_site_class':'NO_VERIFICADO',
                'live_error_origin_class':'NO_VERIFICADO',
                'live_paper_zero_routes_blocked':None,
                'original_archive_class':'NO_VERIFICADO',
                'historical_cold2_archive_class':'NO_VERIFICADO',
                'historical_cold2_pack_metadata_cause':'NO_VERIFICADO',
                'quiescence_verified':False,
                'computed_report_hash_verified':False,
                'pack_content_hash_verified':False,
                'runtime_running_verified':False,
                'envelopes_hash_verified':False,'metadata_snapshot_stable':False,
                'paper_admission_verified':False,'causal_fix_verified':False,
                'remote_exit_code_class':'ZERO' if os.environ['REMOTE_RC']=='0' else 'NONZERO'}
          fallback=safe.copy()
          try:
              if raw.stat().st_size>4096 or os.environ['REMOTE_RC']!='0':
                  raise ValueError('NO_BOUNDED_HOST_RECEIPT')
              obj=json.loads(raw.read_text(encoding='utf-8'))
              if (type(obj) is not dict or obj.get('schema')!=schema or
                  obj.get('state')!='READ_ONLY_OBSERVED' or
                  obj.get('reason')!='COUNTS_AND_CAUSE_ONLY_NO_REPAIR' or
                  obj.get('read_only') is not True or
                  obj.get('os_readonly_mount_verified') is not True or
                  obj.get('provider_gets')!=0 or obj.get('orders_called') is not False or
                  obj.get('mutations')!=0 or obj.get('cold_audit_runtime_called') is not False or
                  obj.get('envelopes_hash_verified') is not True or
                  obj.get('metadata_snapshot_stable') is not True or
                  obj.get('paper_admission_verified') is not False or
                  obj.get('causal_fix_verified') is not False or
                  obj.get('quiescence_verified') is not False or
                  obj.get('computed_report_hash_verified') is not False or
                  obj.get('pack_content_hash_verified') is not False or
                  obj.get('runtime_running_verified') is not False or
                  obj.get('observed_deploy_sha')!=os.environ['EXPECTED_DEPLOY_SHA']):
                  raise ValueError('INVALID_HOST_INVARIANT')
              for key in ('receipt_count','failed_receipt_count','folder_entries_checked'):
                  value=obj.get(key)
                  if type(value) is not int or not 0<=value<=512:
                      raise ValueError('COUNTER_INVALID')
                  safe[key]=value
              if not (safe['failed_receipt_count']<=safe['receipt_count']<=safe['folder_entries_checked']):
                  raise ValueError('COUNT_ORDER_INVALID')
              if obj.get('queue_state') not in ('ABSENT','FAILED','PENDING','COMPLETE'):
                  raise ValueError('QUEUE_STATE_INVALID')
              if obj.get('queue_failed_binding') not in (
                  'MATCHES_FAILED_RECEIPT','FAILED_RECEIPT_QUEUE_NOT_BOUND',
                  'MULTIPLE_FAILED_RECEIPTS','FAILED_QUEUE_WITHOUT_FAILED_RECEIPT',
                  'NO_FAILED_RECEIPT'):
                  raise ValueError('QUEUE_BINDING_INVALID')
              count=safe['failed_receipt_count']
              binding=obj['queue_failed_binding']
              queue_state=obj['queue_state']
              valid_binding=(
                  count==1 and binding=='MATCHES_FAILED_RECEIPT' and queue_state=='FAILED' or
                  count==1 and binding=='FAILED_RECEIPT_QUEUE_NOT_BOUND' or
                  count>=2 and binding=='MULTIPLE_FAILED_RECEIPTS' or
                  count==0 and binding=='FAILED_QUEUE_WITHOUT_FAILED_RECEIPT' and queue_state=='FAILED' or
                  count==0 and binding=='NO_FAILED_RECEIPT' and queue_state!='FAILED')
              if not valid_binding:
                  raise ValueError('COUNT_BINDING_CONTRADICTS_QUEUE')
              for key,allowed in (
                  ('failed_error_code',categories.FAILURE_CODES),
                  ('failed_error_phase',categories.FAILURE_PHASES),
                  ('failed_error_class',categories.FAILURE_CLASSES)):
                  value=obj.get(key)
                  if (type(value) is not str or
                      value not in allowed | {'NO_VERIFICADO','OTHER_REDACTED'}):
                      raise ValueError('FAILED_CATEGORICAL_LABEL_INVALID')
                  safe[key]=value
              manifest=obj.get('failed_manifest_relation')
              current=obj.get('current_failed_relation')
              if manifest not in ('NO_VERIFICADO','MANIFEST_BINDING_MISMATCH',
                  'PACK_METADATA_UNVERIFIED','PACK_METADATA_MISMATCH',
                  'MANIFEST_AND_PACK_METADATA_BOUND_NOT_HASHED'):
                  raise ValueError('MANIFEST_RELATION_INVALID')
              if current not in ('NO_VERIFICADO','CURRENT_POINTER_INVALID',
                  'CURRENT_CUT_SIZE_UNVERIFIED','CURRENT_REFERENCE_UNVERIFIED',
                  'CURRENT_POINTER_RACE_HOLD','CURRENT_OTHER_OR_NO_FAILED_REFERENCE',
                  'CURRENT_FAILED_PENDING_REFERENCE_BOUND',
                  'CURRENT_FAILED_REFERENCE_UNBOUND'):
                  raise ValueError('CURRENT_RELATION_INVALID')
              if count!=1 or binding!='MATCHES_FAILED_RECEIPT':
                  if (any(safe[k]!='NO_VERIFICADO' for k in
                          ('failed_error_code','failed_error_phase','failed_error_class')) or
                      manifest!='NO_VERIFICADO' or current!='NO_VERIFICADO'):
                      raise ValueError('UNBOUND_FAILED_DETAIL_EXPORTED')
              safe['failed_manifest_relation']=manifest
              safe['current_failed_relation']=current
              for key,allowed in (
                  ('current_snapshot_class',{'NO_VERIFICADO','KNOWN_SUCCESSOR',
                      'HISTORICAL_COLD2','ORIGINAL_FAILED','OTHER'}),
                  ('current_generation_class',{'NO_VERIFICADO','ORIGINAL_CUT',
                      'HISTORICAL_COLD2_CUT','OTHER'}),
                  ('original_old_cut_presence',{'NO_VERIFICADO','ABSENT',
                      'PRESENT','UNSAFE_FILE'}),
                  ('historical_cold2_cut_presence',{'NO_VERIFICADO','ABSENT',
                      'PRESENT','UNSAFE_FILE'}),
                  ('current_cut_manifest_binding',{'NO_VERIFICADO','BOUND',
                      'UNBOUND'}),
                  ('live_status_class',{'NO_VERIFICADO','SHADOW_OBSERVING',
                      'FAIL_CLOSED','OTHER'}),
                  ('live_cancel_site_class',{'NO_VERIFICADO','FRAME_265',
                      'STAGE_360','SEAL_386_NOT_WHITELISTED','OTHER',
                      'NOT_COLD_AUDIT_VALUE_ERROR'}),
                   ('live_error_origin_class',{'NO_VERIFICADO',
                       'MEMORY_RESERVE_GUARD_55','FAILED_BACKLOG_GUARD',
                       'CANCEL_SITE_265_360_386','OTHER_COLD_AUDIT_LINE',
                       'NOT_COLD_AUDIT_VALUE_ERROR'}),
                  ('original_archive_class',{'NO_VERIFICADO','ABSENT',
                      'INCOMPLETE_OR_EXTRA','SMALL_RECEIPT_MISMATCH',
                      'PACK_METADATA_UNVERIFIED','METADATA_BOUND_PACK_NOT_HASHED'}),
                  ('historical_cold2_archive_class',{'NO_VERIFICADO','ABSENT',
                      'INCOMPLETE_OR_EXTRA','SMALL_RECEIPT_MISMATCH',
                       'PACK_METADATA_UNVERIFIED','METADATA_BOUND_PACK_NOT_HASHED'}),
                   ('historical_cold2_pack_metadata_cause',{'NO_VERIFICADO',
                       'NOT_APPLICABLE','NONE','PACK_TYPE_LINK_MODE','PACK_OWNER',
                       'PACK_BYTES','IDENTITY_SHAPE','PACK_DEV_INO',
                       'PACK_IDENTITY_SIZE','PACK_MTIME'})):
                  value=obj.get(key)
                  if type(value) is not str or value not in allowed:
                      raise ValueError('HOST_CATEGORY_INVALID_'+key)
                  safe[key]=value
              for key in ('known_successor_manifest_exact',
                           'unrecognized_failed_id_bound',
                          'current_cut_paper_zero_routes_blocked',
                          'live_paper_zero_routes_blocked'):
                  value=obj.get(key)
                  if value is not None and type(value) is not bool:
                      raise ValueError('HOST_BOOLEAN_INVALID_'+key)
                  safe[key]=value
              if current == 'CURRENT_FAILED_PENDING_REFERENCE_BOUND':
                  if (safe['current_snapshot_class']=='NO_VERIFICADO' or
                      safe['current_generation_class']=='NO_VERIFICADO' or
                      safe['original_old_cut_presence']=='NO_VERIFICADO' or
                      safe['historical_cold2_cut_presence']=='NO_VERIFICADO' or
                      safe['current_cut_manifest_binding']=='NO_VERIFICADO'):
                      raise ValueError('CURRENT_CATEGORY_NOT_BOUND')
                  expected_unrecognized=(
                      safe['current_snapshot_class']=='OTHER' and
                      safe['current_generation_class']=='OTHER' and
                      safe['current_cut_manifest_binding']=='BOUND' and
                      manifest=='MANIFEST_AND_PACK_METADATA_BOUND_NOT_HASHED')
                  if safe['unrecognized_failed_id_bound'] is not expected_unrecognized:
                      raise ValueError('UNKNOWN_FAILED_ID_NOT_BOUND')
              elif (any(safe[key]!='NO_VERIFICADO' for key in (
                      'current_snapshot_class','current_generation_class',
                      'original_old_cut_presence','historical_cold2_cut_presence',
                      'current_cut_manifest_binding')) or
                       safe['known_successor_manifest_exact'] is not None or
                       safe['unrecognized_failed_id_bound'] is not None):
                  raise ValueError('CURRENT_CATEGORY_WITHOUT_FAILED_BINDING')
              if current in ('NO_VERIFICADO','CURRENT_POINTER_INVALID',
                      'CURRENT_CUT_SIZE_UNVERIFIED','CURRENT_REFERENCE_UNVERIFIED',
                      'CURRENT_POINTER_RACE_HOLD') and (
                      safe['current_cut_paper_zero_routes_blocked'] is not None):
                  raise ValueError('CURRENT_PAPER_WITHOUT_VALIDATED_CUT')
              if (safe['current_snapshot_class']=='KNOWN_SUCCESSOR') != (
                      safe['known_successor_manifest_exact'] is not None):
                  raise ValueError('SUCCESSOR_METADATA_WITHOUT_IDENTITY')
              if safe['live_status_class']=='NO_VERIFICADO' and (
                      safe['live_cancel_site_class']!='NO_VERIFICADO' or
                       safe['live_error_origin_class']!='NO_VERIFICADO' or
                      safe['live_paper_zero_routes_blocked'] is not None):
                  raise ValueError('LIVE_STATUS_UNBOUND')
              if safe['live_cancel_site_class'] in ('FRAME_265','STAGE_360',
                      'SEAL_386_NOT_WHITELISTED') and safe['live_status_class']!='FAIL_CLOSED':
                  raise ValueError('COLD_CANCEL_WITHOUT_FAIL_CLOSED')
              if (safe['live_error_origin_class']=='CANCEL_SITE_265_360_386') != (
                      safe['live_cancel_site_class'] in (
                          'FRAME_265','STAGE_360','SEAL_386_NOT_WHITELISTED')):
                  raise ValueError('LIVE_SITE_CAUSE_CONTRADICTION')
              if ((safe['live_error_origin_class']=='NOT_COLD_AUDIT_VALUE_ERROR') !=
                      (safe['live_cancel_site_class']=='NOT_COLD_AUDIT_VALUE_ERROR')):
                  raise ValueError('LIVE_CAUSE_MODULE_CONTRADICTION')
              archive=safe['historical_cold2_archive_class']
              cause=safe['historical_cold2_pack_metadata_cause']
              if (archive=='PACK_METADATA_UNVERIFIED' and cause not in (
                      'PACK_TYPE_LINK_MODE','PACK_OWNER','PACK_BYTES',
                      'IDENTITY_SHAPE','PACK_DEV_INO','PACK_IDENTITY_SIZE',
                      'PACK_MTIME') or archive=='METADATA_BOUND_PACK_NOT_HASHED' and
                      cause!='NONE' or archive not in (
                      'PACK_METADATA_UNVERIFIED','METADATA_BOUND_PACK_NOT_HASHED') and
                      cause not in ('NOT_APPLICABLE','NO_VERIFICADO')):
                  raise ValueError('HISTORICAL_PACK_CAUSE_CONTRADICTION')
              utc=datetime.fromisoformat(obj['generated_at_utc'])
              art=datetime.fromisoformat(obj['generated_at_art'])
              if (utc.utcoffset()!=timedelta(0) or
                  art.utcoffset()!=timedelta(hours=-3) or
                  abs((utc-art).total_seconds())>1 or
                  abs((datetime.now(timezone.utc)-utc).total_seconds())>300):
                  raise ValueError('CLOCK_UNVERIFIED')
              safe.update(state='READ_ONLY_OBSERVED',reason='COUNTS_AND_CAUSE_ONLY_NO_REPAIR',
                          os_readonly_mount_verified=True,
                          observed_deploy_sha=obj['observed_deploy_sha'],
                          generated_at_utc=utc.isoformat(),generated_at_art=art.isoformat(),
                          queue_state=obj['queue_state'],
                          queue_failed_binding=obj['queue_failed_binding'],
                          envelopes_hash_verified=True,metadata_snapshot_stable=True)
          except (OSError,KeyError,ValueError,TypeError,UnicodeError,OverflowError):
              safe=fallback
          Path('evidence/a667_cold_failure_cause_readonly.json').write_text(
              json.dumps(safe,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print('A667_QUEUE_STATE='+safe['state'])
          print('A667_FAILURE_CODE='+safe['failed_error_code'])
          print('A667_FAILURE_PHASE='+safe['failed_error_phase'])
          print('A667_CURRENT_RELATION='+safe['current_failed_relation'])
          print('A667_CURRENT_CLASS='+safe['current_snapshot_class'])
          print('A667_LIVE_STATUS='+safe['live_status_class'])
          print('A667_LIVE_CAUSE='+safe['live_error_origin_class'])
          print('A667_COLD2_PACK_CAUSE='+safe['historical_cold2_pack_metadata_cause'])
          print('A667_PROVIDER_GETS=0 ORDERS_CALLED=false MUTATIONS=0')
          PY
          rm -f evidence/.a667_private_raw.json
      - name: Preserve only sanitized bounded aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a667-cold-failure-cause-readonly-${{ github.run_id }}
          path: evidence/a667_cold_failure_cause_readonly.json
          if-no-files-found: warn
          retention-days: 90
      - name: Fail closed if host proof unavailable; no PAPER GO asserted
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('evidence/a667_cold_failure_cause_readonly.json')
          if not path.is_file() or json.loads(path.read_text()).get('state')!='READ_ONLY_OBSERVED':
              raise SystemExit('A667_RUNTIME_COLD_CAUSE_NO_VERIFICADO')
          print('A667_CATEGORICAL_OBSERVED_ONLY_NO_FIX_NO_PAPER_GO')
          PY
      - name: Delete only temporary runner SSH key and known_hosts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/rc6_a665_ssh/key" "$RUNNER_TEMP/rc6_a665_ssh/known_hosts"
