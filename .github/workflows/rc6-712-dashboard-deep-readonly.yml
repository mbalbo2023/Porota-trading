name: RC6 712 dashboard deep read-only navigation
# GET-only browser audit of the exact PAPER dashboard. Shares the deploy mutex.
on:
  push:
    branches:
      - diagnostic/rc6-712-dashboard-deep-readonly-20261022
    paths:
      - .github/workflows/rc6-712-dashboard-deep-readonly.yml
      - scripts/rc6_712_dashboard_deep_readonly.py
      - scripts/rc6_712_dashboard_lineage_readonly.py
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source and verify no deploy drift
        id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD bc661130968f2b85b8b2146f76923ddd26eb7837)" = bc661130968f2b85b8b2146f76923ddd26eb7837
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          python -m py_compile scripts/rc6_712_dashboard_deep_readonly.py scripts/rc6_712_dashboard_lineage_readonly.py
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_679_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_679_readonly" "$HOME/.ssh/known_hosts"
      - name: Bounded dashboard producer lineage read only
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          timeout 30 ssh -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            'sudo -n docker exec -i porota_production_dashboard nice -n 19 python3 -' \
            < scripts/rc6_712_dashboard_lineage_readonly.py
      - name: Authenticated real browser inspection via local SSH tunnel
        if: ${{ always() && steps.pin.outcome == 'success' }}
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          command -v google-chrome >/dev/null
          TOKEN="$(timeout 15 ssh -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            'sudo -n docker exec porota_production_dashboard printenv DASHBOARD_ACCESS_TOKEN')"
          test "${#TOKEN}" -ge 24
          echo "::add-mask::$TOKEN"
          ssh -N -L 127.0.0.1:18085:127.0.0.1:8000 \
            -i "$HOME/.ssh/rc6_679_readonly" -o BatchMode=yes -o ConnectTimeout=10 \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" &
          TUNNEL_PID=$!
          trap 'kill "$TUNNEL_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if DASHBOARD_ACCESS_TOKEN="$TOKEN" python -c 'import os,urllib.request; u="http://127.0.0.1:18085/api/dashboard/truth"; r=urllib.request.urlopen(urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["DASHBOARD_ACCESS_TOKEN"]}),timeout=8); assert r.status==200'; then break; fi
            sleep 1
          done
          DASHBOARD_ACCESS_TOKEN="$TOKEN" python scripts/rc6_712_dashboard_deep_readonly.py --output deep-visual-evidence
          unset TOKEN
      - name: Preserve sanitized visual evidence
        if: ${{ always() && steps.pin.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc6-712-sanitized-deep-dashboard
          path: deep-visual-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/rc6_679_readonly"
