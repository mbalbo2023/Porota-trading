name: RC6 Observer Exit139 Window RCA Read-Only 2026-09-30
on:
  push:
    branches: [audit/ws-deploy-rca-post-immediate-readonly-20260930]
    paths: ['.github/workflows/rc6-observer-exit139-window-readonly-20260930.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Capture exact pre-crash windows
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DB=/opt/porota-trading/data/paper_v17/observer_v17.db
          for spec in \
            '1|2026-09-30T13:35:15Z|2026-09-30T13:35:59Z' \
            '2|2026-09-30T14:18:45Z|2026-09-30T14:19:32Z' \
            '3|2026-09-30T14:44:20Z|2026-09-30T14:45:07Z' \
            '4|2026-09-30T15:10:00Z|2026-09-30T15:10:48Z' \
            '5|2026-09-30T15:11:35Z|2026-09-30T15:12:22Z'
          do
            IFS='|' read -r n since until <<< "$spec"
            echo "RCA139_WINDOW_${n}_BEGIN"
            sudo -n docker logs --since "$since" --until "$until" --timestamps porota_production_observer 2>&1 \
              | grep -v '^.*Timeout (0:00:45)!$' \
              | tail -n 180 || true
            echo "RCA139_WINDOW_${n}_END"
          done
          SAFETY="$(sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=3); c.execute("pragma query_only=on")
          r=c.execute("select mode,real_orders_sent from observer_state where id=1").fetchone(); print(f"{r[0]}|{int(r[1] or 0)}"); c.close()
          PY
          )"
          echo "RCA139_WINDOW_SAFETY=$SAFETY"; test "$SAFETY" = PRODUCTION_PAPER\|0
          echo RCA139_WINDOW_READ_ONLY=GREEN
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
