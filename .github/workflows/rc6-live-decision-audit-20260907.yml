name: RC6 live decision audit 2026-09-07

on:
  push:
    branches:
      - diag/rc6-live-decision-audit-20260907
    paths:
      - '.github/workflows/rc6-live-decision-audit-20260907.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/rc6-live-decision-audit-20260907
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_diag"
          chmod 600 "$HOME/.ssh/porota_rc6_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect live decision evidence read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_diag" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/rc6-live-decision-audit.txt
          set -u
          REPO=/opt/porota-trading
          echo '=== RC6 LIVE DECISION AUDIT / READ ONLY ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo "REPO_BRANCH=$(git -C "$REPO" branch --show-current 2>/dev/null || echo ERROR)"
          echo "REPO_HEAD=$(git -C "$REPO" rev-parse HEAD 2>/dev/null || echo ERROR)"
          echo "OBSERVER=$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer 2>/dev/null || echo ERROR)"
          echo "DASHBOARD=$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard 2>/dev/null || echo ERROR)"

          sudo -n docker exec -i porota_production_observer python - <<'PY' || true
          import json, sqlite3, re, traceback
          DB='/app/data/paper_v17/observer_v17.db'
          TARGETS=['MRCXC','TX28D','CVX','AAPLC','AAPLD','SUPVD','CEPU','BBAR','BMA','YPFD','GFGC6200DI','GFGC6000SE','DLR/SEP26/OCT26','DLR/SEP26/NOV26 M']
          try:
              c=sqlite3.connect(f'file:{DB}?mode=ro', uri=True, timeout=30)
              c.row_factory=sqlite3.Row
              c.execute('PRAGMA query_only=ON')
              print('DB_QUICK_CHECK='+str(c.execute('PRAGMA quick_check').fetchone()[0]))
              state=c.execute('SELECT * FROM observer_state WHERE id=1').fetchone()
              print('OBSERVER_STATE='+json.dumps(dict(state) if state else None,ensure_ascii=False,default=str))
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}

              print('--- LATEST DECISION PER TARGET ---')
              for s in TARGETS:
                  try:
                      r=c.execute('SELECT * FROM paper_decisions WHERE symbol=? ORDER BY id DESC LIMIT 1',(s,)).fetchone()
                      print(json.dumps({'target':s,'decision':dict(r) if r else None},ensure_ascii=False,default=str))
                  except Exception as exc:
                      print(json.dumps({'target':s,'decision_error':f'{type(exc).__name__}:{exc}'},ensure_ascii=False))

              print('--- LATEST SNAPSHOT PER TARGET ---')
              if 'market_snapshots' in tables:
                  for s in TARGETS:
                      try:
                          r=c.execute('SELECT * FROM market_snapshots WHERE symbol=? ORDER BY id DESC LIMIT 1',(s,)).fetchone()
                          row=dict(r) if r else None
                          if row and row.get('contract_json'):
                              try: row['contract_json']=json.loads(row['contract_json'])
                              except Exception: pass
                          print(json.dumps({'target':s,'snapshot':row},ensure_ascii=False,default=str))
                      except Exception as exc:
                          print(json.dumps({'target':s,'snapshot_error':f'{type(exc).__name__}:{exc}'},ensure_ascii=False))

              print('--- LATEST TRADE GATE PER TARGET ---')
              if 'trade_gate_evaluations' in tables:
                  for s in TARGETS:
                      try:
                          r=c.execute('SELECT * FROM trade_gate_evaluations WHERE symbol=? ORDER BY id DESC LIMIT 1',(s,)).fetchone()
                          print(json.dumps({'target':s,'gate':dict(r) if r else None},ensure_ascii=False,default=str))
                      except Exception as exc:
                          print(json.dumps({'target':s,'gate_error':f'{type(exc).__name__}:{exc}'},ensure_ascii=False))

              print('--- RECENT REASON COUNTS ---')
              if 'paper_decisions' in tables:
                  try:
                      for r in c.execute('''SELECT reason,COUNT(*) n FROM (SELECT reason FROM paper_decisions ORDER BY id DESC LIMIT 1500)
                                            GROUP BY reason ORDER BY n DESC,reason LIMIT 50'''):
                          print(f"{r['n']:4d} | {r['reason']}")
                  except Exception as exc: print('REASON_COUNTS_ERROR='+repr(exc))

              print('--- NOMINAL / LOT / QUANTITY METADATA DISCOVERY ---')
              ident=re.compile(r'^[A-Za-z_][A-Za-z0-9_]*$')
              keywords=('nominal','unit','lot','quantity','minimum','min_','face','par_value')
              for table in sorted(tables):
                  if not ident.match(table): continue
                  try: cols=[r[1] for r in c.execute(f'PRAGMA table_info("{table}")')]
                  except Exception: continue
                  key=next((x for x in ('symbol','ticker') if x in cols),None)
                  interesting=[x for x in cols if any(k in x.lower() for k in keywords)]
                  if not key or not interesting: continue
                  select=[key]+interesting
                  if any(not ident.match(x) for x in select): continue
                  marks=','.join('?' for _ in TARGETS)
                  sql='SELECT '+','.join('"'+x+'"' for x in select)+f' FROM "{table}" WHERE "{key}" IN ({marks}) LIMIT 100'
                  try: rows=[dict(r) for r in c.execute(sql,TARGETS)]
                  except Exception as exc:
                      print(json.dumps({'table':table,'error':f'{type(exc).__name__}:{exc}'},ensure_ascii=False)); continue
                  if rows: print(json.dumps({'table':table,'columns':select,'rows':rows},ensure_ascii=False,default=str))
              c.close()
              print('READ_ONLY_DB_AUDIT=COLLECTED')
          except Exception as exc:
              print('DB_AUDIT_FATAL='+f'{type(exc).__name__}:{exc}')
              traceback.print_exc()
          PY

          echo '--- DASHBOARD VISIBLE REASONS ---'
          sudo -n docker exec -i porota_production_dashboard python - <<'PY' || true
          import os,urllib.request,traceback
          try:
              token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
              if not token:
                  print('DASHBOARD_TOKEN=UNAVAILABLE_IN_CONTAINER')
              else:
                  req=urllib.request.Request('http://127.0.0.1:8000/en-vivo',headers={'Authorization':'Bearer '+token,'User-Agent':'PorotaRC6DecisionAudit'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(5_000_000).decode('utf-8','replace'); status=r.status
                  print('HTTP_STATUS='+str(status))
                  for needle in ['NEEDS_NOMINAL_UNITS','UNDERLYING_MARKET_CLOSED: US_LABOR_DAY','FUTUROS: requiere su ciclo financiero específico','OPCIONES: requiere su ciclo financiero específico','Score paper debajo del umbral versionado','Aprendiendo serie']:
                      print(needle+'='+str(needle in body))
          except Exception as exc:
              print('DASHBOARD_AUDIT_ERROR='+f'{type(exc).__name__}:{exc}')
              traceback.print_exc()
          PY

          echo 'OBSERVER_RESTART_REQUESTED=NO'
          echo 'RUNTIME_MUTATION_REQUESTED=NO'
          echo 'NETWORK_ORDER_TEST=NO'
          echo 'RC6_LIVE_DECISION_AUDIT=COLLECTED'
          HOST

      - name: Persist evidence on diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/evidence
          cp /tmp/rc6-live-decision-audit.txt audit/evidence/RC6_LIVE_DECISION_AUDIT_20260907.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/evidence/RC6_LIVE_DECISION_AUDIT_20260907.txt
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(rc6): persist live decision audit'
          git push origin HEAD:diag/rc6-live-decision-audit-20260907

      - name: Summary
        run: |
          {
            echo '### POROTA TRADING RC6 live decision audit'
            echo '```text'
            cat /tmp/rc6-live-decision-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
