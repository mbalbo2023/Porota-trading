name: RC6 Contract Normalized Binding Candidates Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-contract-normalized-binding-candidates-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Compare explicit web identities with API universe
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          OBS=porota_production_observer
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import sqlite3,json,re
          from collections import defaultdict
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True,timeout=30);c.row_factory=sqlite3.Row;c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0];st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and st and st['mode']=='PRODUCTION_PAPER' and int(st['real_orders_sent'] or 0)==0
          print('SAFETY='+json.dumps({'quick_check':q,'mode':st['mode'],'session':st['session_state'],'real_orders_sent':st['real_orders_sent']},sort_keys=True))

          def latest_rows(fam):
              r=c.execute('''select s.evidence_json,s.observed_at from contract_evidence_v2_current cur
                             join contract_evidence_v2_snapshots s on s.snapshot_id=cur.snapshot_id
                             where upper(cur.family)=? and cur.source_class='PPI_AUTHENTICATED_WEB'
                             order by s.observed_at desc limit 1''',(fam,)).fetchone()
              if not r:return [],None
              try:ev=json.loads(r['evidence_json'] or '{}')
              except Exception:return [],r['observed_at']
              rows=[]
              for t in ev.get('tables') or []:
                  if isinstance(t,dict):
                      rows += [x for x in (t.get('rows') or []) if isinstance(x,list) and x]
              return rows,r['observed_at']

          def compact(x):
              return re.sub(r'\s+','',str(x or '').upper())
          def no_dot_compact(x):
              return compact(x).replace('.','')

          for fam in ('FUTUROS','OPCIONES'):
              api={str(r['ticker']).strip().upper():str(r['market']).strip().upper() for r in c.execute('select ticker,market from api_universe_v1 where family=?',(fam,))}
              rows,obs=latest_rows(fam)
              web=[str(r[0]).strip() for r in rows if str(r[0]).strip()]
              exact=[]; compact_matches=[]; nodot_matches=[]; collisions=[]
              by_comp=defaultdict(list); by_nodot=defaultdict(list)
              for t in api:
                  by_comp[compact(t)].append(t); by_nodot[no_dot_compact(t)].append(t)
              for w in web:
                  wu=w.upper()
                  if wu in api: exact.append((w,wu))
                  cm=by_comp.get(compact(w),[])
                  if len(cm)==1: compact_matches.append((w,cm[0]))
                  elif len(cm)>1: collisions.append({'web':w,'rule':'compact','api':cm})
                  nm=by_nodot.get(no_dot_compact(w),[])
                  if len(nm)==1: nodot_matches.append((w,nm[0]))
                  elif len(nm)>1: collisions.append({'web':w,'rule':'nodot_compact','api':nm})
              print('NORMALIZED='+json.dumps({'family':fam,'observed_at':obs,'api':len(api),'web_rows':len(web),'exact':len(set(exact)),'compact_unique':len(set(compact_matches)),'nodot_compact_unique':len(set(nodot_matches)),'compact_sample':compact_matches[:25],'nodot_sample':nodot_matches[:25],'collisions':collisions[:15]},ensure_ascii=False,sort_keys=True))

          api_c={str(r['ticker']).strip().upper() for r in c.execute("select ticker from api_universe_v1 where family='CAUCIONES'")}
          rows,obs=latest_rows('CAUCIONES')
          derived=[];ambiguous=[]
          pat=re.compile(r'^\s*(\d+)\s+(PESOS?|D[ÓO]LARES?)\s+(\d+)D\s*$',re.I)
          for rr in rows:
              cell=str(rr[0]).strip();m=pat.match(cell)
              if not m: continue
              ordinal,cur,days=m.groups();days=int(days)
              prefix='PESOS' if cur.upper().startswith('PESO') else 'DOLAR'
              ticker=f'{prefix}{days}'
              if ticker in api_c: derived.append((cell,ticker))
              else: ambiguous.append((cell,ticker))
          print('NORMALIZED='+json.dumps({'family':'CAUCIONES','observed_at':obs,'api':len(api_c),'web_rows':len(rows),'deterministic_api_matches':len(set(derived)),'match_sample':derived[:30],'non_api_derived_sample':ambiguous[:20]},ensure_ascii=False,sort_keys=True))
          c.close()
          print('MUTATIONS=NONE')
          print('BROWSER_RUN=NO')
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          PY
          HOST
