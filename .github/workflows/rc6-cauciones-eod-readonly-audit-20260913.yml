name: RC6 Cauciones EOD read-only audit 2026-09-13

on:
  workflow_dispatch:
  push:
    branches: [ops/rc6-ppi-web-residual-ready-20260913]
    paths:
      - '.github/workflows/rc6-cauciones-eod-readonly-audit-20260913.yml'

permissions:
  contents: read

jobs:
  caucion-runtime-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Caucion observer DB inventory read-only lightweight
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          timeout 90 sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json,collections
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          out={'candidate_rows':0,'candidate_can_simulate':0,'candidate_statuses':{},'candidate_sample':[],'contract_current_rows':0,'contract_sources':{},'contract_current_sample':[],'coverage':None,'tables_present':sorted(tables & {'candidate_universe','contract_evidence_v2_current','catalog_family_coverage'})}
          if 'candidate_universe' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(candidate_universe)')]
              wanted=[x for x in ('ticker','instrument_type','market','settlement','status','can_simulate','capability') if x in cols]
              q='select '+','.join('"'+x+'"' for x in wanted)+' from candidate_universe where upper(coalesce(instrument_type,\'\')) in (\'CAUCION\',\'CAUCIONES\') order by ticker limit 200'
              rows=[dict(r) for r in c.execute(q)]
              out['candidate_rows']=int(c.execute("select count(*) from candidate_universe where upper(coalesce(instrument_type,'')) in ('CAUCION','CAUCIONES')").fetchone()[0])
              out['candidate_can_simulate']=int(c.execute("select count(*) from candidate_universe where upper(coalesce(instrument_type,'')) in ('CAUCION','CAUCIONES') and can_simulate=1").fetchone()[0]) if 'can_simulate' in cols else None
              if 'status' in cols:
                  out['candidate_statuses']=dict(c.execute("select coalesce(status,'NULL'),count(*) from candidate_universe where upper(coalesce(instrument_type,'')) in ('CAUCION','CAUCIONES') group by status").fetchall())
              out['candidate_sample']=rows[:30]
          if 'catalog_family_coverage' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(catalog_family_coverage)')]
              if 'instrument_type' in cols:
                  rows=[dict(r) for r in c.execute("select * from catalog_family_coverage where upper(instrument_type) in ('CAUCION','CAUCIONES') limit 10")]
                  out['coverage']=rows
          if 'contract_evidence_v2_current' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(contract_evidence_v2_current)')]
              out['contract_current_rows']=int(c.execute("select count(*) from contract_evidence_v2_current where upper(coalesce(family,'')) in ('CAUCION','CAUCIONES')").fetchone()[0]) if 'family' in cols else 0
              if all(x in cols for x in ('family','source_class')):
                  out['contract_sources']=dict(c.execute("select source_class,count(*) from contract_evidence_v2_current where upper(coalesce(family,'')) in ('CAUCION','CAUCIONES') group by source_class").fetchall())
              wanted=[x for x in ('family','ticker','market','settlement','source_class','observed_at','snapshot_id') if x in cols]
              if wanted and 'family' in cols:
                  q='select '+','.join('"'+x+'"' for x in wanted)+" from contract_evidence_v2_current where upper(coalesce(family,'')) in ('CAUCION','CAUCIONES') order by ticker,source_class limit 40"
                  out['contract_current_sample']=[dict(r) for r in c.execute(q)]
          print('CAUCION_RUNTIME_LIGHT_JSON='+json.dumps(out,ensure_ascii=False,sort_keys=True,default=str))
          c.close()
          PY
          HOST

  caucion-code-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify caucion static/dynamic gate and API discovery are fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import bd_ppi_readonly_guard as guardmod
          rules=Path('cq_family_contract_rules_hf6.py').read_text(encoding='utf-8')
          guard=Path('bd_ppi_readonly_guard.py').read_text(encoding='utf-8')
          catalog=Path('bu_instrument_catalog.py').read_text(encoding='utf-8')
          required_static=['market','currency','settlement','side','term_days','principal_min','principal_step','day_count_basis','fee_schedule','trading_session']
          required_dynamic=['operable','market_session_state','tna','available_principal','expiry_at']
          missing_static=[x for x in required_static if x not in rules]
          missing_dynamic=[x for x in required_dynamic if x not in rules]
          forbidden=('order_budget','budget','send_order','place_order','cancel_order','order')
          checks={
            'official_caucion_discovery_present':'_search_cauciones_official' in guard and 'search_instrument' in guard,
            'default_days_exact':tuple(guardmod.caucion_discovery_days('')) == (1,2,7,30,120),
            'read_market_methods':all(x in guard for x in ('current','book','intraday')),
            'no_order_surface':all(not hasattr(guardmod.ProductionMarketReader,x) for x in forbidden),
            'catalog_holds_caucion':'NEEDS_CAUCION_TERMS' in catalog,
            'static_gate_complete':not missing_static,
            'dynamic_gate_complete':not missing_dynamic,
          }
          print('CAUCION_CODE_AUDIT='+json.dumps({'checks':checks,'missing_static_tokens':missing_static,'missing_dynamic_tokens':missing_dynamic},sort_keys=True))
          assert all(checks.values()), checks
          PY

  caucion-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Safety snapshot only - no starts or restarts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          for u in porota-ppi-web-residual-rc6.service porota-ppi-fullfamily-history-rc6.service; do
            echo "UNIT=$u"
            sudo -n systemctl show "$u" -p ActiveState -p SubState -p Result -p MainPID --no-pager || true
          done
          echo 'CAUCION_RELATED_UNITS_BEGIN'
          sudo -n systemctl list-units --all --no-pager --plain | grep -Ei 'cauc|postclose' || true
          echo 'CAUCION_RELATED_UNITS_END'
          echo 'CAUCION_RELATED_TIMERS_BEGIN'
          sudo -n systemctl list-timers --all --no-pager | grep -Ei 'cauc|postclose' || true
          echo 'CAUCION_RELATED_TIMERS_END'
          echo 'WRITER_PROCESSES_BEGIN'
          ps -eo pid,args | grep -E 'ppi-web-residual|ppi-fullfamily-history' | grep -v grep || true
          echo 'WRITER_PROCESSES_END'
          HOST
