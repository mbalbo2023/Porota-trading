name: RC6 source precedence full preflight 2026-09-25

on:
  push:
    branches:
      - diag/rc6-availability-readonly-20260925

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-source-precedence-ppi-iol-byma-20260925
          fetch-depth: 0

      - name: Pin exact source-precedence candidate
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="785420c1d59256f7600797032ac9eb7eb1c398a9"
          echo "SOURCE_PRECEDENCE_FULL_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile critical paths
        run: |
          set -Eeuo pipefail
          python -m py_compile             rc6_multisource_discovery.py             rc6_source_consolidation.py             bu_instrument_catalog.py             bf_production_paper_observer.py             rc6_iol_family_reference.py             scripts/rc6_iol_shadow_collect.py             scripts/rc6_byma_morning_pipeline.py

      - name: Run source precedence and family regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q             tests/test_rc6_multisource_discovery.py             tests/test_rc6_complementary_catalog_merge.py             tests/test_rc6_observer_complementary_reconcile.py             tests/test_rc6_iol_family_reference.py             tests/test_iol_shadow_collector_rc6.py             tests/test_rc6_option_paper_execution.py             tests/test_rc6_byma_morning_watch.py             tests/test_rc6_byma_morning_pipeline.py             tests/test_rc6_byma_preopen_watch.py             tests/test_rc6_family_readiness.py             tests/test_fixed_income_nominal_contract_rc6.py             tests/test_rc6_cauciones_contract.py

      - name: Run canonical PAPER regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q             tests/test_rc6_operational_scope.py             tests/test_rc6_deploy_readiness_contract.py             tests/test_rc6_live_scope_gate_fallback.py             tests/test_rc6_take_profit_regression.py             tests/test_exit_supervision_v17.py             tests/test_derivatives_and_gate.py             tests/test_production_paper_v1634.py

      - name: Static precedence and real-order guards
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          import iol_mcp_readonly_adapter_rc6 as adapter

          assert not (adapter.ALLOWED_TOOLS & adapter.FORBIDDEN_ACCOUNT_OR_EXECUTION_TOOLS)

          catalog=Path("bu_instrument_catalog.py").read_text(encoding="utf-8")
          discovery=Path("rc6_multisource_discovery.py").read_text(encoding="utf-8")
          observer=Path("bf_production_paper_observer.py").read_text(encoding="utf-8")
          workflow=Path(".github/workflows/rc6-pr69-isolated-transactional-deploy-20260915.yml").read_text(encoding="utf-8")

          assert 'PPI_PRIMARY>IOL_COMPLEMENTARY>BYMA_PUBLIC_COMPLEMENTARY' in catalog
          assert 'COMPLEMENT_OVERWRITE_BLOCKED' in observer
          assert 'promoted_this_run=' in observer and 'ready_total=' in observer
          assert 'BYMA_MORNING_WATCH_TIMER=GREEN' in workflow
          assert 'python /app/scripts/rc6_history_cutoff_repair_once.py' not in workflow

          forbidden={"place_order","cancel_order","subscribe_fci","redeem_fci","place_caucion"}
          for name in (
              "rc6_multisource_discovery.py","bu_instrument_catalog.py",
              "bf_production_paper_observer.py","rc6_iol_family_reference.py",
              "scripts/rc6_iol_shadow_collect.py",
          ):
              tree=ast.parse(Path(name).read_text(encoding="utf-8"),filename=name)
              for node in ast.walk(tree):
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute):
                      if node.func.attr in forbidden:
                          raise SystemExit(f"FORBIDDEN_REAL_ROUTE_CALL:{name}:{node.func.attr}")
          print("SOURCE_PRECEDENCE_SAFETY=GREEN|PPI>IOL>BYMA|REAL_ROUTES_BLOCKED")
          PY

      - name: Full-suite regression delta versus productive SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          BASELINE_SHA="c0921d947c5823d7ec15d865a7cc9925250c4f4e"
          BASELINE_DIR="/tmp/rc6-precedence-baseline"
          rm -rf "$BASELINE_DIR"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_SHA"

          run_suite() {
            local dir="$1" out="$2"
            set +e
            (cd "$dir" && python -m pytest -q) >"$out" 2>&1
            local rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then
              cat "$out"
              return "$rc"
            fi
            return 0
          }

          run_suite "$BASELINE_DIR" /tmp/base.log
          run_suite "$GITHUB_WORKSPACE" /tmp/candidate.log

          failures() {
            grep -E '^(FAILED|ERROR) tests/' "$1" | sed -E 's/ - .*//' | sort -u || true
          }
          failures /tmp/base.log > /tmp/base.fail
          failures /tmp/candidate.log > /tmp/candidate.fail
          comm -13 /tmp/base.fail /tmp/candidate.fail > /tmp/new.fail
          echo "BASELINE_FAILURES=$(wc -l < /tmp/base.fail)"
          echo "CANDIDATE_FAILURES=$(wc -l < /tmp/candidate.fail)"
          if [ -s /tmp/new.fail ]; then
            echo "NEW_FAILURES=RED"
            cat /tmp/new.fail
            exit 1
          fi
          echo "FULL_SUITE_DELTA=GREEN|new_failures=0"
