name: RC6 Wave16 Live Safe Cache Image Cleanup 2026-09-09

on:
  push:
    branches:
      - deploy-prep/rc6-wave16-currentbase-20260909
    paths:
      - .github/workflows/rc6-wave16-live-safe-cache-image-cleanup-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-wave16-live-safe-cache-image-cleanup-20260909
  cancel-in-progress: false

jobs:
  safe-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota-cleanup"
          chmod 600 "$HOME/.ssh/porota-cleanup"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prune only safe cache and obsolete unused image
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/porota-cleanup" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_SHA=$(git rev-parse HEAD)

          safety_check() {
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True)
          c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          }

          echo '=== PRE SAFETY ==='
          echo "RUNTIME_HEAD=$PRE_SHA"
          safety_check

          echo '=== PRE CAPACITY ==='
          df -h /opt/porota-trading
          sudo -n docker system df || true

          echo '=== CONTAINER IMAGE REFERENCES ==='
          sudo -n docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' || true

          # Never stop/restart/remove containers, volumes, or networks here.
          # Keep all images referenced by any container implicitly: Docker refuses
          # normal removal while referenced. Also preserve the IOL shadow image
          # because it is on the active ingestion critical path even if idle.
          IOL_KEEP='porota-iol-history-shadow:17.0.0-rc6'
          OBSOLETE='porota-trading-bot:rc6-scalping-rollback-5076b6dff8c6'

          echo '=== BUILD CACHE PRUNE ==='
          sudo -n docker builder prune -af || true

          echo '=== DANGLING IMAGE PRUNE ==='
          sudo -n docker image prune -f || true

          echo '=== TARGETED OBSOLETE IMAGE CLEANUP ==='
          if sudo -n docker image inspect "$OBSOLETE" >/dev/null 2>&1; then
            OBS_ID=$(sudo -n docker image inspect -f '{{.Id}}' "$OBSOLETE")
            REFCOUNT=$(sudo -n docker ps -a --no-trunc --format '{{.Image}}' | while read -r ref; do
              [ -n "$ref" ] || continue
              id=$(sudo -n docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null || true)
              [ "$id" = "$OBS_ID" ] && echo 1
            done | wc -l)
            if [ "$REFCOUNT" -eq 0 ]; then
              sudo -n docker image rm "$OBSOLETE" || true
              echo "OBSOLETE_IMAGE_REMOVED=$OBSOLETE"
            else
              echo "OBSOLETE_IMAGE_PRESERVED_REFERENCED=$OBSOLETE"
            fi
          else
            echo "OBSOLETE_IMAGE_NOT_PRESENT=$OBSOLETE"
          fi

          if sudo -n docker image inspect "$IOL_KEEP" >/dev/null 2>&1; then
            echo "CRITICAL_PATH_IMAGE_PRESERVED=$IOL_KEEP"
          else
            echo "CRITICAL_PATH_IMAGE_ALREADY_ABSENT=$IOL_KEEP"
          fi

          echo '=== HOST PACKAGE CACHE CLEAN ==='
          sudo -n apt-get clean || true

          echo '=== POST CAPACITY ==='
          df -h /opt/porota-trading
          sudo -n docker system df || true
          sudo -n docker images --format '{{.Repository}}:{{.Tag}}|{{.Size}}|{{.ID}}' || true

          test "$(git rev-parse HEAD)" = "$PRE_SHA"
          echo '=== POST SAFETY ==='
          safety_check
          echo 'CONTAINERS_RESTARTED=NO'
          echo 'CONTAINERS_REMOVED=NO'
          echo 'VOLUMES_REMOVED=NO'
          echo 'NETWORKS_REMOVED=NO'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RUNTIME_CHANGED=NO'
          echo 'RC6_W16_SAFE_CACHE_IMAGE_CLEANUP=GREEN'
          REMOTE
