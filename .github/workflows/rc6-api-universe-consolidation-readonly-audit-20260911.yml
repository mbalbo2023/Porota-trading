name: RC6 API Universe Consolidation Readonly Audit 2026-09-11

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-api-universe-consolidation-readonly-audit-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Consolidate captured live API authority versus local catalog and web evidence
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          TARGET=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import json, sqlite3
          from collections import defaultdict

          # Authority captured minutes earlier by live authenticated production API audit
          # workflow 34659647038 / job 103459289644. Avoid a second login/cooldown hit.
          api_types=sorted({
              'ACCIONES','ACCIONES-USA','BONOS','CAUCIONES','CEDEARS','ETF','FCI',
              'FCI-EXTERIOR','FUTUROS','LEBAC','LETRAS','LICITACIONES','NOBAC','ON','OPCIONES'
          })
          print('API_AUTHORITY_SOURCE=LIVE_PRODUCTION_CAPTURE_34659647038_103459289644')

          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20)
          c.row_factory=sqlite3.Row
          c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          state=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and state and state[0]=='PRODUCTION_PAPER' and int(state[2] or 0)==0
          print('PRE_SAFETY='+'|'.join(map(str,(q,*state))))

          aliases={
              'ACCIONES_USA':'ACCIONES-USA', 'FCI_EXTERIOR':'FCI-EXTERIOR',
              'FCI_LOCAL':'FCI', 'OBLIGACIONES':'ON', 'ETFS':'ETF'
          }
          norm=lambda x: aliases.get(str(x or '').strip().upper(),str(x or '').strip().upper())

          catalog=defaultdict(lambda:{'rows':0,'tickers':set()})
          for r in c.execute("select instrument_type,ticker from instrument_catalog"):
              fam=norm(r['instrument_type']); catalog[fam]['rows']+=1; catalog[fam]['tickers'].add(str(r['ticker']).upper())

          evidence=defaultdict(lambda:{'rows':0,'explicit':set(),'wildcards':0})
          for r in c.execute("select family,ticker from contract_evidence_v2_current"):
              fam=norm(r['family']); t=str(r['ticker'] or '*').strip().upper()
              evidence[fam]['rows']+=1
              if t in {'','*','UNKNOWN','NONE','N/A','NULL'}: evidence[fam]['wildcards']+=1
              else: evidence[fam]['explicit'].add(t)

          hist=defaultdict(lambda:{'series':0,'rows':0})
          for r in c.execute("select instrument_type,count(*) n,coalesce(sum(row_count),0) rows from production_history group by instrument_type"):
              fam=norm(r['instrument_type']); hist[fam]['series']=int(r['n']); hist[fam]['rows']=int(r['rows'])

          universe=sorted(set(api_types)|set(catalog)|set(evidence)|set(hist))
          for fam in universe:
              declared=fam in api_types
              discovered=len(catalog[fam]['tickers'])>0
              status=('API_DISCOVERED' if declared and discovered else 'API_DECLARED_NOT_DISCOVERED' if declared else 'CONTEXT_ONLY')
              print('UNIVERSE='+json.dumps({
                  'family':fam,'status':status,'api_declared':declared,'api_discovered':discovered,
                  'catalog_tickers':len(catalog[fam]['tickers']),
                  'evidence_explicit_tickers':len(evidence[fam]['explicit']),
                  'evidence_wildcards':evidence[fam]['wildcards'],
                  'history_series':hist[fam]['series'],'history_rows':hist[fam]['rows'],
                  'context_only':not declared
              },sort_keys=True,ensure_ascii=False))

          print('API_DECLARED='+json.dumps(api_types,ensure_ascii=False))
          print('API_DECLARED_NOT_DISCOVERED='+json.dumps(sorted(f for f in api_types if not catalog[f]['tickers']),ensure_ascii=False))
          print('CONTEXT_ONLY_EVIDENCE='+json.dumps(sorted(f for f in evidence if f not in api_types),ensure_ascii=False))
          c.close()

          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          state=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('FINAL_SAFETY='+'|'.join(map(str,(q,*state))))
          assert q=='ok' and state and state[0]=='PRODUCTION_PAPER' and int(state[2] or 0)==0
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
