name: RC6 historical source evidence offhost

# A331: manual-only. RUNNER_EXISTING is original #785; the new opt-in mode
# executes one read-only PPI History GET inside the exact pinned PAPER Docker
# image using credentials already held ONLY there. It never deploys or writes
# host files/DB/History v2, and cannot prove causal PIT from retrospective EOD.
# A338 adds a separate manual Book mode with the EXISTING atomic PPI budget
# lease. Only the global PPI budget sidecar's native acquire/start/finish may
# write; never trading DB/History v2/PPI Watch, no independent PIT claim.
# A516 adds an opt-in metadata-only diagnosis of A338's missing budget lease.
# A516 never attempts provider GET, budget initialization, or trading DB access.
on:
  pull_request:
    paths:
      - '.github/workflows/rc6-history-fresh-offhost-evidence.yml'
      - 'scripts/rc6_a331_host_ppi_history_readonly.py'
      - 'tests/test_rc6_a331_host_ppi_history_readonly.py'
      - 'scripts/rc6_a338_host_ppi_book_atomic.py'
      - 'tests/test_rc6_a338_host_ppi_book_atomic.py'
      - 'scripts/rc6_a516_host_budget_metadata_ro.py'
      - 'tests/test_rc6_a516_host_budget_metadata_ro.py'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Existing PPI credential boundary; no new GitHub secrets
        required: true
        default: DROPLET_EXISTING_CREDENTIALS
        type: choice
        options:
          - DROPLET_EXISTING_CREDENTIALS
          - RUNNER_EXISTING
          - DROPLET_ATOMIC_BOOK
          - DROPLET_BUDGET_METADATA
      from_day:
        description: History-only first ART day; ignored for Book
        required: true
        default: '2026-10-30'
        type: string
      to_day:
        description: History-only last ART day; ignored for Book
        required: true
        default: '2026-10-30'
        type: string
      targets_json:
        description: One exact [symbol,family,market,currency,settlement] target (History or Book)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rc6-history-fresh-offhost-evidence
  cancel-in-progress: false

jobs:
  offhost-contracts:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert manual-only remote path and bounded identity/day gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/rc6-history-fresh-offhost-evidence.yml').read_text()
          required = (
              "github.event_name == 'workflow_dispatch'",
              "github.ref == 'refs/heads/main'",
              "github.repository == 'mbalbo2023/Porota-trading'",
              'FRESH_ACTION_ONE_TARGET_REQUIRED',
              'FRESH_ACTION_ONE_ART_DAY_REQUIRED',
              'len(raw.encode()) > 512',
              'persist-credentials: false',
              'Destroy private runner capture',
              'DROPLET_EXISTING_CREDENTIALS',
              'RC6_EXPECTED_IMAGE_ID',
              'sudo -n timeout 45 docker exec -i',
              'python -B -',
              'A331_DROPLET_PAPER_RUNTIME_IDENTITY',
          )
          assert all(item in text for item in required), 'A327_MANUAL_OR_SCOPE_GUARD_DRIFT'
          PY
      - name: Test A331 hostile inputs and no-provider no-host path
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_rc6_a331_host_ppi_history_readonly.py -v
          python3 -m unittest discover -s tests -p test_rc6_a338_host_ppi_book_atomic.py -v
          python3 -m unittest discover -s tests -p test_rc6_a516_host_budget_metadata_ro.py -v
      - uses: actions/checkout@v4
        with:
          ref: bcbd445f94234188a1ae88888f1587eb2eb149d0
          persist-credentials: false
      - name: Test immutable reviewed source offline without provider or host
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = bcbd445f94234188a1ae88888f1587eb2eb149d0
          test "$(git rev-parse HEAD^{tree})" = 35be1605dc73ca33888b276bb457971ca3dab34b
          python3 -m pip install --disable-pip-version-check pytest==9.1.1
          python3 -m pytest -q tests/test_rc6_history_fresh_sidecar.py
          echo RC6_A327_OFFHOST_ONLY_CONTRACT=GREEN

  capture:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/Porota-trading' && inputs.execution_mode == 'RUNNER_EXISTING' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RC6_SOURCE_SHA: bcbd445f94234188a1ae88888f1587eb2eb149d0
      RC6_SOURCE_TREE: 35be1605dc73ca33888b276bb457971ca3dab34b
      RC6_FROM_DAY: ${{ inputs.from_day || '2026-10-30' }}
      RC6_TO_DAY: ${{ inputs.to_day || '2026-10-30' }}
      RC6_TARGETS_JSON: ${{ inputs.targets_json }}
    steps:
      - name: Checkout exact reviewed evidence code
        uses: actions/checkout@v4
        with:
          ref: bcbd445f94234188a1ae88888f1587eb2eb149d0
          persist-credentials: false

      - name: Verify source SHA, tree and PAPER safety before secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RC6_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RC6_SOURCE_TREE"
          grep -Fq 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -Fq 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo "HISTORY_OFFHOST_CODE=GREEN|sha=$RC6_SOURCE_SHA|tree=$RC6_SOURCE_TREE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned read-only probe dependencies
        run: python -m pip install --disable-pip-version-check ppi-client==1.3.0 requests==2.34.2 pytest==9.1.1

      - name: Test evidence and validate bounded ART request before credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_rc6_history_fresh_sidecar.py
          python - <<'PY'
          import json, os
          from datetime import date, datetime, timezone
          from pathlib import Path
          from scripts.rc6_history_fresh_sidecar import preflight, request_window

          raw = os.environ["RC6_TARGETS_JSON"]
          if len(raw.encode()) > 512:
              raise SystemExit("FRESH_ACTION_TARGET_BUDGET_EXCEEDED")
          targets = json.loads(raw)
          if not isinstance(targets, list) or len(targets) != 1:
              raise SystemExit("FRESH_ACTION_ONE_TARGET_REQUIRED")
          from_day = date.fromisoformat(os.environ["RC6_FROM_DAY"])
          to_day = date.fromisoformat(os.environ["RC6_TO_DAY"])
          if from_day != to_day:
              raise SystemExit("FRESH_ACTION_ONE_ART_DAY_REQUIRED")
          request_window(datetime.now(timezone.utc), from_day, to_day)
          preflight(targets, "PPI")
          path = Path(os.environ["RUNNER_TEMP"]) / "rc6-fresh-targets.json"
          path.write_text(json.dumps(targets), encoding="utf-8")
          path.chmod(0o600)
          print("HISTORY_OFFHOST_PREFLIGHT=GREEN|targets=" + str(len(targets)) +
                "|from=" + from_day.isoformat() + "|to=" + to_day.isoformat())
          PY

      - name: Capture one bounded PPI source window without host access
        shell: bash
        env:
          # A complete pair is chosen atomically. Neither pair's history
          # entitlement is assumed; missing credentials remain NO_VERIFICADO.
          RC6_PPI_HISTORY_KEY: ${{ secrets.PPI_HISTORY_READONLY_API_KEY }}
          RC6_PPI_HISTORY_SECRET: ${{ secrets.PPI_HISTORY_READONLY_API_SECRET }}
          RC6_PPI_CAPACITY_KEY: ${{ secrets.PPI_CAPACITY_READONLY_API_KEY }}
          RC6_PPI_CAPACITY_SECRET: ${{ secrets.PPI_CAPACITY_READONLY_API_SECRET }}
        run: |
          set -Eeuo pipefail
          if test -n "$RC6_PPI_HISTORY_KEY" && test -n "$RC6_PPI_HISTORY_SECRET"; then
            export PPI_API_KEY="$RC6_PPI_HISTORY_KEY" PPI_API_SECRET="$RC6_PPI_HISTORY_SECRET"
            export RC6_CREDENTIAL_SOURCE=HISTORY_READONLY
          elif test -n "$RC6_PPI_CAPACITY_KEY" && test -n "$RC6_PPI_CAPACITY_SECRET"; then
            export PPI_API_KEY="$RC6_PPI_CAPACITY_KEY" PPI_API_SECRET="$RC6_PPI_CAPACITY_SECRET"
            export RC6_CREDENTIAL_SOURCE=CAPACITY_READONLY
          else
            export PPI_API_KEY= PPI_API_SECRET= RC6_CREDENTIAL_SOURCE=NONE
          fi
          set +e
          timeout 150 python - > "$RUNNER_TEMP/rc6-fresh-stdout.private" \
            2> "$RUNNER_TEMP/rc6-fresh-stderr.private" <<'PY'
          import os
          from pathlib import Path
          from scripts.rc6_history_fresh_probe import main

          root = Path(os.environ["RUNNER_TEMP"])
          args = ["--source", "PPI", "--targets", str(root / "rc6-fresh-targets.json"),
                  "--sidecar", str(root / "rc6-fresh-private.sqlite"),
                  "--receipt", str(root / "rc6-fresh-receipt.json"),
                  "--from-day", os.environ["RC6_FROM_DAY"],
                  "--to-day", os.environ["RC6_TO_DAY"]]
          try:
              raise SystemExit(main(args))
          except Exception as exc:
              # Never print provider response, URL, token or exception text.
              name = type(exc).__name__
              (root / "rc6-fresh-error-class.private").write_text(
                  name if name.isidentifier() and len(name) <= 80 else "UNCLASSIFIED")
              raise SystemExit(1)
          PY
          probe_rc=$?
          set -e
          export RC6_PROBE_RC="$probe_rc"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.rc6_history_fresh_verify import verify

          root = Path(os.environ["RUNNER_TEMP"])
          receipt = root / "rc6-fresh-receipt.json"
          sidecar = root / "rc6-fresh-private.sqlite"
          error_file = root / "rc6-fresh-error-class.private"
          rc = int(os.environ["RC6_PROBE_RC"])
          error_class = error_file.read_text().strip() if error_file.is_file() else (
              "TIMEOUT" if rc == 124 else "NO_VERIFICADO")
          result = json.loads(receipt.read_text()) if rc == 0 and receipt.is_file() else {
              "state": "NO_VERIFICADO", "reason": "PROBE_PROCESS_FAILED",
              "provider_requests": None, "history_v2_writes": 0,
              "execution_allowed": False}
          if (result.get("history_v2_writes") != 0 or result.get("execution_allowed") is not False
                  or result.get("state") not in {"EVIDENCE_ONLY_NO_GO", "NO_VERIFICADO"}):
              raise SystemExit("FRESH_ACTION_UNSAFE_RECEIPT")
          proof = None
          if result["state"] == "EVIDENCE_ONLY_NO_GO":
              if not sidecar.is_file():
                  raise SystemExit("FRESH_ACTION_SIDECAR_MISSING")
              proof = verify(sidecar)
              if proof["history_v2_writes"] != 0 or proof["state"] != "EVIDENCE_ONLY_NO_GO":
                  raise SystemExit("FRESH_ACTION_VERIFY_RED")
          elif sidecar.exists():
              raise SystemExit("FRESH_ACTION_UNEXPECTED_SIDECAR")
          manifest = {
              "schema": "rc6.history.offhost.action.v1",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["RC6_SOURCE_SHA"],
              "source_tree": os.environ["RC6_SOURCE_TREE"],
              "requested_from": os.environ["RC6_FROM_DAY"],
              "requested_to": os.environ["RC6_TO_DAY"],
              "probe_exit": rc, "result": result, "verification": proof,
              "error_class": error_class if rc else None,
              "credential_source": os.environ["RC6_CREDENTIAL_SOURCE"],
              "credentials_present": bool(os.getenv("PPI_API_KEY") and
                                          os.getenv("PPI_API_SECRET")),
              "host_access": False, "history_v2_writes": 0,
              "real_orders_sent_by_action": 0, "order_routes_called": False}
          out = root / "rc6-fresh-sanitized-action-receipt.json"
          out.write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          print("HISTORY_OFFHOST_ACTION=" + result["state"] +
                "|provider_requests=" + str(result.get("provider_requests")) +
                "|error_class=" + str(error_class if rc else "NONE") +
                "|history_v2_writes=0|host_access=NO|real_orders_sent=0")
          PY
          test "$probe_rc" -eq 0

      - name: Publish only sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-history-offhost-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rc6-fresh-sanitized-action-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Destroy private runner capture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in rc6-fresh-targets.json rc6-fresh-private.sqlite \
              rc6-fresh-receipt.json rc6-fresh-stdout.private \
              rc6-fresh-stderr.private rc6-fresh-error-class.private; do
            path="$RUNNER_TEMP/$name"
            if test -f "$path"; then shred -u "$path"; fi
          done

  a331-host-ppi-existing-credentials:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/Porota-trading' && inputs.execution_mode == 'DROPLET_EXISTING_CREDENTIALS' }}
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      RC6_EXPECTED_PRODUCT_SHA: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
      RC6_EXPECTED_IMAGE_ID: sha256:4a8f7306188979fe6976f400209151bd529bf0d9f46f068b50bbc54fc96fd70b
      RC6_FROM_DAY: ${{ inputs.from_day }}
      RC6_TO_DAY: ${{ inputs.to_day }}
      RC6_TARGETS_JSON: ${{ inputs.targets_json }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate one exact ART day, identity, image pin and PAPER boundaries before SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p test_rc6_a331_host_ppi_history_readonly.py -q
          export RC6_A331_SCRIPT_SHA256="$(sha256sum scripts/rc6_a331_host_ppi_history_readonly.py | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json, os, re
          from scripts.rc6_a331_host_ppi_history_readonly import preflight
          raw = os.environ['RC6_TARGETS_JSON']
          if len(raw.encode()) > 512:
              raise SystemExit('A331_TARGET_JSON_BUDGET_EXCEEDED')
          target = json.loads(raw)
          encoded = base64.b64encode(json.dumps(target, separators=(',', ':')).encode()).decode()
          identity, day = preflight(encoded, os.environ['RC6_FROM_DAY'], os.environ['RC6_TO_DAY'])
          assert re.fullmatch('[a-f0-9]{64}', os.environ['RC6_A331_SCRIPT_SHA256'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('RC6_A331_TARGET_B64=' + encoded + '\n')
              env.write('RC6_A331_SCRIPT_SHA256=' + os.environ['RC6_A331_SCRIPT_SHA256'] + '\n')
          print('A331_PREFLIGHT=GREEN|exact_targets=1|art_days=1|read_only=YES')
          PY

      - name: Strict SSH known-host pin and existing Docker PPI credentials only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a331_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a331_readonly" "$HOME/.ssh/known_hosts"
          set +e
          timeout --signal=TERM --kill-after=5s 70s ssh \
            -i "$HOME/.ssh/rc6_a331_readonly" -o BatchMode=yes \
            -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "set -Eeuo pipefail; image=\$(sudo -n docker inspect -f '{{.Image}}' porota_production_observer); test \"\$image\" = '$RC6_EXPECTED_IMAGE_ID'; printf 'RUNTIME_IMAGE_ID=%s\\n' \"\$image\"; sudo -n timeout 45 docker exec -i -e RC6_A331_TARGET_B64=$RC6_A331_TARGET_B64 -e RC6_A331_FROM_DAY=$RC6_FROM_DAY -e RC6_A331_TO_DAY=$RC6_TO_DAY -e RC6_A331_EXPECTED_PRODUCT_SHA=$RC6_EXPECTED_PRODUCT_SHA -e PYTHONDONTWRITEBYTECODE=1 porota_production_observer python -B -" \
            < scripts/rc6_a331_host_ppi_history_readonly.py \
            > "$RUNNER_TEMP/rc6-a331-stdout.private" \
            2> "$RUNNER_TEMP/rc6-a331-stderr.private"
          host_rc=$?
          set -e
          export RC6_A331_HOST_RC="$host_rc"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from scripts.rc6_a331_host_ppi_history_readonly import (
              SCHEMA, preflight, verify_sanitized_receipt)
          root = Path(os.environ['RUNNER_TEMP'])
          captured = root / 'rc6-a331-stdout.private'
          raw = captured.read_bytes() if captured.exists() and captured.stat().st_size <= 65536 else b''
          lines = raw.decode('utf-8', errors='replace').splitlines()
          image = lines[0].partition('=')[2] if len(lines) == 2 and lines[0].startswith('RUNTIME_IMAGE_ID=') else ''
          try:
              result = json.loads(lines[1]) if image == os.environ['RC6_EXPECTED_IMAGE_ID'] else {}
          except (ValueError, IndexError):
              result = {}
          allowed = {'schema', 'source', 'requested_identity', 'ppi_instrument_type', 'art_day',
              'state', 'reason', 'expected_product_sha', 'credential_location', 'provider_requests',
              'history_invocations', 'rows_in_day', 'total_provider_rows', 'canonical_payload_sha256',
              'canonical_payload_bytes', 'first_known_at_utc', 'source_knowledge',
              'causal_pit_rows_verified', 'paper_sim_rows_verified', 'paper_mode',
              'paper_mode_evidence', 'real_order_capability', 'real_orders_scope',
              'real_orders_sent', 'host_db_writes', 'history_v2_writes',
              'read_only_transport', 'row_identity', 'row_settlement', 'row_volume_kind',
              'row_currency', 'row_price_basis', 'ready_implication',
              'execution_allowed', 'raw_provider_payload_persisted'}
          identity, day = preflight(os.environ['RC6_A331_TARGET_B64'],
                                    os.environ['RC6_FROM_DAY'], os.environ['RC6_TO_DAY'])
          valid = bool(result and set(result) <= allowed
              and verify_sanitized_receipt(result, identity, day)
              and result.get('schema') == SCHEMA
              and result.get('state') in {'EVIDENCE_ONLY_NO_GO', 'NO_VERIFICADO'}
              and result.get('expected_product_sha') == os.environ['RC6_EXPECTED_PRODUCT_SHA']
              and result.get('paper_mode') == 'PRODUCTION_PAPER'
              and result.get('real_order_capability') == 'BLOCKED'
              and result.get('real_orders_sent') == 0 and result.get('host_db_writes') == 0
              and result.get('history_v2_writes') == 0 and result.get('causal_pit_rows_verified') == 0
              and result.get('paper_sim_rows_verified') == 0
              and result.get('execution_allowed') is False
              and result.get('raw_provider_payload_persisted') is False
              and isinstance(result.get('provider_requests'), int)
              and 0 <= result['provider_requests'] <= 4
              and isinstance(result.get('rows_in_day'), int)
              and 0 <= result['rows_in_day'] <= 500
              and (result.get('canonical_payload_sha256') is None
                   or re.fullmatch('[a-f0-9]{64}', result['canonical_payload_sha256'])))
          if not valid:
              result = {'schema': SCHEMA, 'state': 'NO_VERIFICADO',
                  'reason': 'A331_DROPLET_PAPER_RUNTIME_IDENTITY_OR_RECEIPT_UNVERIFIED',
                  'provider_requests': None, 'causal_pit_rows_verified': 0,
                  'paper_sim_rows_verified': 0, 'real_orders_sent': 0,
                  'host_db_writes': 0, 'history_v2_writes': 0,
                  'execution_allowed': False, 'raw_provider_payload_persisted': False}
          manifest = {'schema': 'rc6.a331.action.sanitized.v1',
              'run_id': os.environ['GITHUB_RUN_ID'], 'workflow_sha': os.environ['GITHUB_SHA'],
              'source_sha256': os.environ['RC6_A331_SCRIPT_SHA256'],
              'expected_product_sha': os.environ['RC6_EXPECTED_PRODUCT_SHA'],
              'expected_runtime_image_id': os.environ['RC6_EXPECTED_IMAGE_ID'],
              'host_exit': int(os.environ['RC6_A331_HOST_RC']),
              'credential_handling': 'EXISTING_CONTAINER_ONLY',
              'result': result, 'no_host_file_writes': True,
              'no_raw_data_uploaded': True, 'no_new_credentials': True,
              'real_orders_sent_by_action': 0, 'deploy_dispatches': 0}
          output = root / 'rc6-a331-sanitized-only.json'
          output.write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          print('A331_DROPLET_HISTORY=' + result['state'] +
                '|provider_requests=' + str(result.get('provider_requests')) +
                '|rows=' + str(result.get('rows_in_day', 0)) +
                '|causal_pit=0|paper=0|host_db_writes=0|real_orders=0')
          if not valid or int(os.environ['RC6_A331_HOST_RC']) != 0:
              raise SystemExit(2)
          PY

      - name: Always materialize fail-closed sanitized receipt even on preflight or SSH error
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'rc6-a331-sanitized-only.json'
          if not out.is_file():
              manifest = {
                  'schema': 'rc6.a331.action.sanitized.v1',
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'workflow_sha': os.environ['GITHUB_SHA'],
                  'state': 'NO_VERIFICADO',
                  'reason': 'A331_PREFLIGHT_OR_SSH_FAILED_BEFORE_SANITIZATION',
                  'expected_product_sha': os.environ['RC6_EXPECTED_PRODUCT_SHA'],
                  'expected_runtime_image_id': os.environ['RC6_EXPECTED_IMAGE_ID'],
                  'provider_requests': None, 'causal_pit_rows_verified': 0,
                  'paper_sim_rows_verified': 0, 'real_orders_sent_by_action': 0,
                  'host_db_writes_by_action': 0, 'history_v2_writes_by_action': 0,
                  'credential_handling': 'EXISTING_CONTAINER_ONLY',
                  'no_new_credentials': True, 'no_raw_data_uploaded': True,
                  'deploy_dispatches': 0}
              out.write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          PY

      - name: Publish sanitized digest/count only, no PPI raw or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a331-host-ppi-history-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/rc6-a331-sanitized-only.json
          if-no-files-found: warn
          retention-days: 7

      - name: Destroy runner private SSH/stdio capture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in "$HOME/.ssh/rc6_a331_readonly" \
              "$RUNNER_TEMP/rc6-a331-stdout.private" \
              "$RUNNER_TEMP/rc6-a331-stderr.private"; do
            if test -f "$path"; then shred -u "$path"; fi
          done

  a338-host-ppi-atomic-book:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/Porota-trading' && inputs.execution_mode == 'DROPLET_ATOMIC_BOOK' }}
    # A Book GET uses the same host budget authority as the running observer.
    # Serializing diagnostics against Deploy V2 prevents image pin races.
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      RC6_EXPECTED_PRODUCT_SHA: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
      RC6_EXPECTED_IMAGE_ID: sha256:4a8f7306188979fe6976f400209151bd529bf0d9f46f068b50bbc54fc96fd70b
      RC6_A338_TARGETS_JSON: ${{ inputs.targets_json }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce one reviewed 5-key Book target and run adversarial tests before SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p test_rc6_a338_host_ppi_book_atomic.py -q
          export RC6_A338_SCRIPT_SHA256="$(sha256sum scripts/rc6_a338_host_ppi_book_atomic.py | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json, os, re
          from scripts.rc6_a338_host_ppi_book_atomic import preflight
          raw = os.environ['RC6_A338_TARGETS_JSON']
          if len(raw.encode()) > 512:
              raise SystemExit('A338_TARGET_JSON_BUDGET_EXCEEDED')
          target = json.loads(raw)
          encoded = base64.b64encode(json.dumps(target, separators=(',', ':')).encode()).decode()
          preflight(encoded)
          assert re.fullmatch('[a-f0-9]{64}', os.environ['RC6_A338_SCRIPT_SHA256'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('RC6_A338_TARGET_B64=' + encoded + '\n')
              env.write('RC6_A338_SCRIPT_SHA256=' + os.environ['RC6_A338_SCRIPT_SHA256'] + '\n')
          print('A338_PREFLIGHT=GREEN|exact_targets=1|book_get_max=1|atomic_budget=REQUIRED|real_orders=0')
          PY

      - name: Strict SSH pin and one Book GET through existing global PPI budget
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a338_atomic"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a338_atomic" "$HOME/.ssh/known_hosts"
          set +e
          timeout --signal=TERM --kill-after=5s 70s ssh \
            -i "$HOME/.ssh/rc6_a338_atomic" -o BatchMode=yes \
            -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "set -Eeuo pipefail; image=\$(sudo -n docker inspect -f '{{.Image}}' porota_production_observer); test \"\$image\" = '$RC6_EXPECTED_IMAGE_ID'; printf 'RUNTIME_IMAGE_ID=%s\\n' \"\$image\"; sudo -n timeout 45 docker exec -i -e RC6_A338_TARGET_B64=$RC6_A338_TARGET_B64 -e RC6_A338_EXPECTED_PRODUCT_SHA=$RC6_EXPECTED_PRODUCT_SHA -e PYTHONDONTWRITEBYTECODE=1 porota_production_observer python -B -" \
            < scripts/rc6_a338_host_ppi_book_atomic.py \
            > "$RUNNER_TEMP/rc6-a338-stdout.private" \
            2> "$RUNNER_TEMP/rc6-a338-stderr.private"
          host_rc=$?
          set -e
          export RC6_A338_HOST_RC="$host_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.rc6_a338_host_ppi_book_atomic import (
              SCHEMA, preflight, verify_sanitized_receipt)
          root = Path(os.environ['RUNNER_TEMP'])
          captured = root / 'rc6-a338-stdout.private'
          raw = captured.read_bytes() if captured.exists() and captured.stat().st_size <= 65536 else b''
          lines = raw.decode('utf-8', errors='replace').splitlines()
          image = lines[0].partition('=')[2] if len(lines) == 2 and lines[0].startswith('RUNTIME_IMAGE_ID=') else ''
          try:
              result = json.loads(lines[1]) if image == os.environ['RC6_EXPECTED_IMAGE_ID'] else {}
          except (ValueError, IndexError):
              result = {}
          identity = preflight(os.environ['RC6_A338_TARGET_B64'])
          valid = bool(result and verify_sanitized_receipt(result, identity)
              and result.get('schema') == SCHEMA
              and result.get('expected_product_sha') == os.environ['RC6_EXPECTED_PRODUCT_SHA']
              and result.get('paper_mode') == 'PRODUCTION_PAPER'
              and result.get('real_order_capability') == 'BLOCKED'
              and result.get('real_orders_sent_by_action') == 0
              and result.get('trading_db_writes_by_action') == 0
              and result.get('history_v2_writes_by_action') == 0
              and result.get('ppi_watch_mutations_by_action') == 0
              and result.get('execution_allowed') is False
              and result.get('independent_ed25519_verified') is False
              and result.get('source_pit_verified') is False
              and result.get('book_gets') in (0, 1))
          if not valid:
              result = {'schema': SCHEMA, 'state': 'NO_VERIFICADO',
                  'reason': 'A338_HOST_OR_RECEIPT_UNVERIFIED',
                  'book_gets': None, 'source_pit_verified': False,
                  'real_orders_sent_by_action': 0,
                  'trading_db_writes_by_action': 0,
                  'history_v2_writes_by_action': 0,
                  'ppi_watch_mutations_by_action': 0,
                  'execution_allowed': False}
          manifest = {'schema': 'rc6.a338.action.sanitized.v1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_sha': os.environ['GITHUB_SHA'],
              'source_sha256': os.environ['RC6_A338_SCRIPT_SHA256'],
              'expected_product_sha': os.environ['RC6_EXPECTED_PRODUCT_SHA'],
              'expected_runtime_image_id': os.environ['RC6_EXPECTED_IMAGE_ID'],
              'credential_handling': 'EXISTING_CONTAINER_ONLY',
              'budget_writes_only': 'GLOBAL_PPI_BUDGET_ATOMIC_LEASE',
              'host_exit': int(os.environ['RC6_A338_HOST_RC']),
              'result': result, 'no_raw_provider_data_uploaded': True,
              'real_orders_sent_by_action': 0, 'predeploy_dispatches': 0,
              'deploy_dispatches': 0}
          out = root / 'rc6-a338-sanitized-only.json'
          out.write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          print('A338_DROPLET_BOOK=' + result['state'] +
                '|book_gets=' + str(result.get('book_gets')) +
                '|atomic_lease=' + str(result.get('lease_started', False)) +
                '|PIT=NO_VERIFICADO|real_orders=0')
          if not valid or int(os.environ['RC6_A338_HOST_RC']) != 0:
              raise SystemExit(2)
          PY

      - name: Materialize fail-closed receipt on precheck or SSH failure
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'rc6-a338-sanitized-only.json'
          if not out.is_file():
              out.write_text(json.dumps({
                  'schema': 'rc6.a338.action.sanitized.v1',
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'workflow_sha': os.environ['GITHUB_SHA'],
                  'state': 'NO_VERIFICADO',
                  'reason': 'A338_PREFLIGHT_OR_SSH_FAILED',
                  'expected_product_sha': os.environ['RC6_EXPECTED_PRODUCT_SHA'],
                  'expected_runtime_image_id': os.environ['RC6_EXPECTED_IMAGE_ID'],
                  'book_gets': None, 'source_pit_verified': False,
                  'credential_handling': 'EXISTING_CONTAINER_ONLY',
                  'no_raw_provider_data_uploaded': True,
                  'real_orders_sent_by_action': 0,
                  'trading_db_writes_by_action': 0,
                  'history_v2_writes_by_action': 0,
                  'ppi_watch_mutations_by_action': 0,
                  'predeploy_dispatches': 0, 'deploy_dispatches': 0},
                  sort_keys=True, indent=2) + '\n')
          PY

      - name: Publish only sanitized Book proof, no quotes or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a338-host-ppi-book-atomic-${{ github.run_id }}
          path: ${{ runner.temp }}/rc6-a338-sanitized-only.json
          if-no-files-found: warn
          retention-days: 7

      - name: Destroy runner private SSH and stdio files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in "$HOME/.ssh/rc6_a338_atomic" \
              "$RUNNER_TEMP/rc6-a338-stdout.private" \
              "$RUNNER_TEMP/rc6-a338-stderr.private"; do
            if test -f "$path"; then shred -u "$path"; fi
          done

  a516-host-budget-metadata-only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/Porota-trading' && inputs.execution_mode == 'DROPLET_BUDGET_METADATA' }}
    # Pin the running image exactly as the existing A331/A338 jobs do.
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RC6_EXPECTED_PRODUCT_SHA: 7e1e744d6ca9ab30c51b5747dd4467af5ece0145
      RC6_EXPECTED_IMAGE_ID: sha256:4a8f7306188979fe6976f400209151bd529bf0d9f46f068b50bbc54fc96fd70b
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test A516 closed-vocabulary and zero-provider contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s tests -p test_rc6_a516_host_budget_metadata_ro.py -v
          python3 -B -m py_compile scripts/rc6_a516_host_budget_metadata_ro.py
          git diff --check
      - name: Read only budget sidecar metadata from pinned PAPER image
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a516_metadata"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a516_metadata" "$HOME/.ssh/known_hosts"
          set +e
          timeout --signal=TERM --kill-after=5s 65s ssh \
            -i "$HOME/.ssh/rc6_a516_metadata" -o BatchMode=yes \
            -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "set -Eeuo pipefail; image=\$(sudo -n docker inspect -f '{{.Image}}' porota_production_observer); test \"\$image\" = '$RC6_EXPECTED_IMAGE_ID'; printf 'RUNTIME_IMAGE_ID=%s\n' \"\$image\"; sudo -n timeout 30 docker exec -i -e RC6_A516_EXPECTED_PRODUCT_SHA=$RC6_EXPECTED_PRODUCT_SHA -e PYTHONDONTWRITEBYTECODE=1 porota_production_observer python -B -" \
            < scripts/rc6_a516_host_budget_metadata_ro.py \
            > "$RUNNER_TEMP/rc6-a516-stdout.private" \
            2> "$RUNNER_TEMP/rc6-a516-stderr.private"
          host_rc=$?
          set -e
          export RC6_A516_HOST_RC="$host_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.rc6_a516_host_budget_metadata_ro import SCHEMA, PRODUCT_SHA, verify_receipt
          root=Path(os.environ['RUNNER_TEMP'])
          private=root / 'rc6-a516-stdout.private'
          raw=(private.read_bytes() if private.is_file() and private.stat().st_size <= 8192 else b'')
          lines=raw.decode('utf-8',errors='replace').splitlines()
          image=(lines[0].partition('=')[2] if len(lines)==2 and lines[0].startswith('RUNTIME_IMAGE_ID=') else '')
          try:
              result=json.loads(lines[1]) if image==os.environ['RC6_EXPECTED_IMAGE_ID'] else {}
          except (ValueError,IndexError):
              result={}
          valid=(verify_receipt(result) and os.environ['RC6_A516_HOST_RC']=='0'
                 and result.get('expected_product_sha')==PRODUCT_SHA)
          if not valid:
              result={'schema':SCHEMA,'state':'NO_VERIFICADO','diagnosis':'HOST_PROBE_FAILED',
                  'expected_product_sha':PRODUCT_SHA,'trading_database_opened':False,
                  'budget_sidecar_written':False,'budget_lease_acquired':False,
                  'provider_calls':0,'real_orders_sent':0,'ppi_watch_touched':False,
                  'book_replay_verified':False,'paper_ready':False}
          manifest={'schema':'rc6.a516.action.sanitized.v1',
              'run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['GITHUB_SHA'],
              'expected_product_sha':PRODUCT_SHA,
              'expected_runtime_image_id':os.environ['RC6_EXPECTED_IMAGE_ID'],
              'host_exit':int(os.environ['RC6_A516_HOST_RC']),
              'result':result,'metadata_only':True,'book_gets':0,'host_files_written':0,
              'predeploy_dispatches':0,'deploy_dispatches':0}
          (root/'rc6-a516-sanitized-only.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('A516_BUDGET_METADATA='+result['state']+'|classification='+result['diagnosis']+
                '|provider_gets=0|book_replay=NO_GO|real_orders=0')
          if not valid:
              raise SystemExit(2)
          PY
      - name: Fail-closed A516 receipt if preflight or SSH failed
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.rc6_a516_host_budget_metadata_ro import SCHEMA, PRODUCT_SHA
          out=Path(os.environ['RUNNER_TEMP'])/'rc6-a516-sanitized-only.json'
          if not out.is_file():
              out.write_text(json.dumps({
                  'schema':'rc6.a516.action.sanitized.v1',
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'workflow_sha':os.environ['GITHUB_SHA'],
                  'expected_product_sha':PRODUCT_SHA,
                  'expected_runtime_image_id':os.environ['RC6_EXPECTED_IMAGE_ID'],
                  'result':{'schema':SCHEMA,'state':'NO_VERIFICADO',
                      'diagnosis':'HOST_PROBE_FAILED','expected_product_sha':PRODUCT_SHA,
                      'trading_database_opened':False,'budget_sidecar_written':False,
                      'budget_lease_acquired':False,'provider_calls':0,
                      'real_orders_sent':0,'ppi_watch_touched':False,
                      'book_replay_verified':False,'paper_ready':False},
                  'metadata_only':True,'book_gets':0,'host_files_written':0,
                  'predeploy_dispatches':0,'deploy_dispatches':0},
                  sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve only sanitized budget classification, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a516-host-budget-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/rc6-a516-sanitized-only.json
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy runner-only SSH and private output
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in "$HOME/.ssh/rc6_a516_metadata" \
              "$RUNNER_TEMP/rc6-a516-stdout.private" \
              "$RUNNER_TEMP/rc6-a516-stderr.private"; do
            if test -f "$path"; then shred -u "$path"; fi
          done
