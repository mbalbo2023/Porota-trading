name: RC6 read-only disk usage audit

on:
  push:
    branches:
      - audit/rc6-disk-usage-20260907
    paths:
      - '.github/workflows/rc6-disk-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/rc6-disk-usage-20260907
          fetch-depth: 0

      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DO_HOST"
          test -n "$DO_USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_audit"
          chmod 600 "$HOME/.ssh/porota_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect read-only disk inventory from Droplet
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          REPORT="POROTA_DISK_AUDIT_RC6_2026-09-07.txt"
          ssh -i "$HOME/.ssh/porota_audit" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' > "$REPORT" <<'REMOTE'
          set -u
          REPO=/opt/porota-trading
          sep() { printf '\n======================================================================\n%s\n======================================================================\n' "$1"; }
          run() { printf '\n$ %s\n' "$*"; "$@" 2>&1 || true; }

          echo 'POROTA TRADING — RC6 READ-ONLY DISK AUDIT'
          echo 'MUTATIONS=NONE'
          echo 'DELETE=NONE'
          echo 'PRUNE=NONE'
          echo 'VACUUM=NONE'
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "AR=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HOST=$(hostname)"
          echo "USER=$(id -un)"

          sep '01. FILESYSTEM CAPACITY AND INODES'
          run df -hT /
          run df -hT "$REPO"
          run df -ih /
          run lsblk -o NAME,SIZE,FSTYPE,TYPE,MOUNTPOINTS

          sep '02. TOP-LEVEL DISK CONSUMPTION ON ROOT FILESYSTEM'
          echo 'Description: size of each first-level directory; this identifies whether /var, /opt, /home, /usr, etc. dominates.'
          sudo -n du -x -h -d 1 / 2>/dev/null | sort -h || true

          sep '03. /OPT BREAKDOWN'
          echo 'Description: POROTA runtime, staging, backups, and other application data under /opt.'
          sudo -n du -x -h -d 2 /opt 2>/dev/null | sort -h | tail -n 120 || true

          sep '04. POROTA REPOSITORY BREAKDOWN'
          echo 'Description: code checkout vs persistent runtime data and local Git metadata.'
          if [ -d "$REPO" ]; then
            sudo -n du -x -h -d 1 "$REPO" 2>/dev/null | sort -h || true
            echo '-- Git identity --'
            git -C "$REPO" branch --show-current 2>/dev/null || true
            git -C "$REPO" rev-parse HEAD 2>/dev/null || true
            echo '-- Git object storage --'
            du -sh "$REPO/.git" 2>/dev/null || true
            git -C "$REPO" count-objects -vH 2>/dev/null || true
            echo '-- Worktrees --'
            git -C "$REPO" worktree list 2>/dev/null || true
            echo '-- Status counts only (contents are not printed) --'
            printf 'UNTRACKED_COUNT='; git -C "$REPO" status --porcelain 2>/dev/null | awk '$1=="??"{n++} END{print n+0}'
            printf 'MODIFIED_OR_STAGED_COUNT='; git -C "$REPO" status --porcelain 2>/dev/null | awk '$1!="??"{n++} END{print n+0}'
          fi

          sep '05. POROTA DATA — DIRECTORY BREAKDOWN'
          echo 'Description: persistent trading DBs, historical market data, introspection, diagnostics, runtime patches, logs, backups and evidence.'
          if [ -d "$REPO/data" ]; then
            sudo -n du -x -h -d 2 "$REPO/data" 2>/dev/null | sort -h | tail -n 180 || true
          else
            echo 'DATA_DIR=NOT_FOUND'
          fi

          sep '06. POROTA DATA — 60 LARGEST FILES'
          echo 'Description: exact files consuming most space inside /opt/porota-trading/data. File contents are never read.'
          if [ -d "$REPO/data" ]; then
            sudo -n find "$REPO/data" -xdev -type f -printf '%s\t%TY-%Tm-%Td %TH:%TM\t%p\n' 2>/dev/null \
              | sort -nr | head -n 60 \
              | awk -F '\t' '{cmd="numfmt --to=iec-i --suffix=B "$1; cmd|getline s; close(cmd); print s"\t"$2"\t"$3}' || true
          fi

          sep '07. SQLITE DB / WAL / SHM FOOTPRINT'
          echo 'Description: active SQLite databases and sidecar WAL/SHM files; these are PROTECTED and are inventory-only.'
          if [ -d "$REPO/data" ]; then
            sudo -n find "$REPO/data" -xdev -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) \
              -printf '%s\t%TY-%Tm-%Td %TH:%TM\t%p\n' 2>/dev/null \
              | sort -nr \
              | awk -F '\t' '{cmd="numfmt --to=iec-i --suffix=B "$1; cmd|getline s; close(cmd); print s"\t"$2"\t"$3}' || true
          fi

          sep '08. BACKUPS / STAGING / DEPLOY ARTIFACTS'
          echo 'Description: backup sets and deploy bundles are common reclaim candidates only after retention validation.'
          for p in \
            "$REPO/data/backups" \
            /opt/porota-staging \
            /opt/porota-backups \
            /home/porotaadmin \
            /tmp; do
            if [ -e "$p" ]; then
              echo "-- $p --"
              sudo -n du -x -h -d 2 "$p" 2>/dev/null | sort -h | tail -n 80 || true
            fi
          done

          sep '09. ARCHIVES AND LARGE DEPLOY FILES'
          echo 'Description: tar/zip/gzip artifacts outside live DBs; candidates depend on provenance and retention.'
          for base in /opt /home/porotaadmin /tmp; do
            [ -d "$base" ] || continue
            sudo -n find "$base" -xdev -type f \( -iname '*.zip' -o -iname '*.tar' -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.gz' \) \
              -printf '%s\t%TY-%Tm-%Td\t%p\n' 2>/dev/null || true
          done | sort -nr | head -n 100 | awk -F '\t' '{cmd="numfmt --to=iec-i --suffix=B "$1; cmd|getline s; close(cmd); print s"\t"$2"\t"$3}' || true

          sep '10. DOCKER SUMMARY'
          echo 'Description: images, containers, local volumes and build cache. No prune is executed.'
          run sudo -n docker system df
          echo '-- Images --'
          sudo -n docker image ls --digests --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}' 2>&1 || true
          echo '-- Containers incl. writable size --'
          sudo -n docker ps -a --size --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Size}}' 2>&1 || true
          echo '-- Volumes --'
          sudo -n docker volume ls 2>&1 || true
          echo '-- Build cache --'
          sudo -n docker builder du 2>&1 || true

          sep '11. DOCKER ROOT BREAKDOWN'
          echo 'Description: physical Docker storage areas such as overlay2, containers, volumes, buildkit and image metadata.'
          if [ -d /var/lib/docker ]; then
            sudo -n du -x -h -d 2 /var/lib/docker 2>/dev/null | sort -h | tail -n 140 || true
          fi

          sep '12. DOCKER CONTAINER JSON LOGS'
          echo 'Description: container stdout/stderr JSON logs can grow even when the application itself is healthy.'
          for cid in $(sudo -n docker ps -aq 2>/dev/null); do
            name=$(sudo -n docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's#^/##')
            log=$(sudo -n docker inspect -f '{{.LogPath}}' "$cid" 2>/dev/null)
            [ -n "$log" ] || continue
            bytes=$(sudo -n stat -c '%s' "$log" 2>/dev/null || echo 0)
            human=$(numfmt --to=iec-i --suffix=B "$bytes" 2>/dev/null || echo "$bytes")
            printf '%s\t%s\t%s\n' "$human" "$name" "$log"
          done | sort -h || true

          sep '13. SYSTEM JOURNAL AND /VAR/LOG'
          echo 'Description: OS/systemd/Docker service logs outside POROTA data.'
          run sudo -n journalctl --disk-usage
          sudo -n du -x -h -d 2 /var/log 2>/dev/null | sort -h | tail -n 100 || true
          echo '-- 40 largest files in /var/log --'
          sudo -n find /var/log -xdev -type f -printf '%s\t%TY-%Tm-%Td %TH:%TM\t%p\n' 2>/dev/null \
            | sort -nr | head -n 40 \
            | awk -F '\t' '{cmd="numfmt --to=iec-i --suffix=B "$1; cmd|getline s; close(cmd); print s"\t"$2"\t"$3}' || true

          sep '14. PACKAGE / SNAP / CACHE FOOTPRINT'
          echo 'Description: usually low-risk OS caches, but nothing is removed by this audit.'
          for p in /var/cache /var/cache/apt /var/lib/apt/lists /var/lib/snapd/snaps /var/lib/systemd/coredump; do
            [ -e "$p" ] && sudo -n du -sh "$p" 2>/dev/null || true
          done

          sep '15. OPEN-DELETED FILES'
          echo 'Description: deleted files still held open by a process continue consuming disk until the process closes them.'
          if command -v lsof >/dev/null 2>&1; then
            sudo -n lsof +L1 2>/dev/null | head -n 120 || true
          else
            echo 'LSOF=NOT_INSTALLED'
          fi

          sep '16. LARGEST FILES UNDER /OPT, /VAR, /HOME AND /TMP'
          echo 'Description: cross-check for unexpectedly large files outside known POROTA paths.'
          for base in /opt /var /home /tmp; do
            [ -d "$base" ] || continue
            sudo -n find "$base" -xdev -type f -printf '%s\t%TY-%Tm-%Td %TH:%TM\t%p\n' 2>/dev/null || true
          done | sort -nr | head -n 80 | awk -F '\t' '{cmd="numfmt --to=iec-i --suffix=B "$1; cmd|getline s; close(cmd); print s"\t"$2"\t"$3}' || true

          sep '17. PROTECTED POROTA PATHS — DO NOT DELETE DURING CLEANUP'
          echo '/opt/porota-trading/data'
          echo '/opt/porota-trading/data/paper_v17/observer_v17.db'
          echo '/opt/porota-trading/data/paper_v17/observer_v17.db-wal (if present)'
          echo '/opt/porota-trading/data/paper_v17/observer_v17.db-shm (if present)'
          echo '/opt/porota-trading/data/market_history.db'
          echo '/opt/porota-trading/.env'
          echo '/opt/porota-trading/.secrets'
          echo 'Current RC6 Docker image(s) used by running observer/dashboard'
          echo 'Operational untracked artifacts until classified'

          sep '18. AUDIT COMPLETION'
          echo 'AUDIT_STATUS=COMPLETE_READ_ONLY'
          echo 'NEXT_ACTION=CLASSIFY_CANDIDATES_BEFORE_ANY_DELETE'
          echo 'No files, images, containers, volumes, logs, journals, caches, DBs or Git objects were modified.'
          REMOTE
          test -s "$REPORT"
          echo "REPORT=$REPORT"
          wc -l "$REPORT"

      - name: Commit audit report to audit branch
        shell: bash
        run: |
          set -euo pipefail
          REPORT="POROTA_DISK_AUDIT_RC6_2026-09-07.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'audit: capture RC6 Droplet disk usage read-only report'
          git push origin HEAD:audit/rc6-disk-usage-20260907
