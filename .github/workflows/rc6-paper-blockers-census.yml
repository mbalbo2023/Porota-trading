name: RC6 PAPER Blockers Census

on:
  push:
    branches: [audit/rc6-paper-residuals-20261003]
    paths:
      - scripts/rc6_paper_blockers_census.py
      - tests/test_rc6_paper_blockers_census.py
      - .github/workflows/rc6-paper-blockers-census.yml
  workflow_dispatch:
    inputs:
      expected_product_sha:
        description: Exact expected product SHA, checked before host read
        required: true
        default: da697c6e6c2274579f9e4a112fabc4327475dd35
        type: string

permissions:
  contents: read

concurrency:
  group: rc6-paper-blockers-census-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_product_sha || 'da697c6e6c2274579f9e4a112fabc4327475dd35' }}

jobs:
  offline-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile and prove query-only census
        run: |
          python3 -m py_compile scripts/rc6_paper_blockers_census.py tests/test_rc6_paper_blockers_census.py
          python3 -m unittest discover -s tests -p test_rc6_paper_blockers_census.py -v
          python3 -c 'from pathlib import Path; s=Path(".github/workflows/rc6-paper-blockers-census.yml").read_text(); remotes=[x for x in s.splitlines() if x.strip().startswith(chr(34)+"timeout ")]; assert len(remotes)==1; remote=remotes[0]; assert "sudo -n python3 -B - --db" in remote; assert "chmod" not in remote and "chown" not in remote; print("PROTECTED_PROVENANCE_READ_CHANNEL=GREEN")'

  static-family-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        family: [OPCIONES, FUTUROS, OBLIGACIONES]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inventory code paths without importing application
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git grep -n -E 'candidate_identity_v2|PAUSED_EXPLICIT' -- '*.py' > evidence/identity-writers.txt || test "$?" -eq 1
          git grep -n -E "$FAMILY|NEEDS_OPTION_CONTRACT|NEEDS_FUTURES_MARGIN|RETRY_IDENTITY_AMBIGUOUS" -- '*contract*.py' 'rc6_family_readiness.py' 'rc6_on_validation.py' > evidence/family-requirements.txt || test "$?" -eq 1
          head -n 90 evidence/identity-writers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-blockers-static-${{ matrix.family }}-${{ github.run_id }}
          path: evidence/
          retention-days: 7

  current-identity-census:
    needs: offline-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert product HEAD and immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL=$(gh api 'repos/mbalbo2023/Porota-trading/git/ref/heads/deploy/rc6-pr69-isolated-20260915' --jq .object.sha)
          test "$ACTUAL" = "$EXPECTED_SHA"
          mkdir -p evidence
          git rev-parse HEAD > evidence/tooling-sha.txt
          printf '%s\n' "$ACTUAL" > evidence/product-sha.txt
          git archive --format=tar.gz --output=evidence/source.tar.gz HEAD
      - name: Prepare existing strict Actions SSH channel
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6-census-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/rc6-census-known-hosts"
          chmod 600 "$HOME/.ssh/rc6-census-key" "$HOME/.ssh/rc6-census-known-hosts"
      - name: One bounded read-only export, no application imports or broker calls
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=5s 50s ssh \
            -i "$HOME/.ssh/rc6-census-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/rc6-census-known-hosts" \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "timeout --signal=TERM --kill-after=3s 40s sudo -n python3 -B - --db /opt/porota-trading/data/paper_v17/observer_v17.db --state /opt/porota-trading/data/deploy/CURRENT_STATE_V2.json --expected-sha $EXPECTED_SHA" \
            < scripts/rc6_paper_blockers_census.py > evidence/census.json
          python3 -c 'import collections,json,pathlib; p=pathlib.Path("evidence/census.json"); x=json.loads(p.read_text()); assert x["complete"] and x["database_writes"]==0 and x["broker_calls"]==0; reasons=collections.Counter((r["instrument_type"],r["status"],r["detail"]) for r in x["tables"]["candidate_identity_v2"] if not (r["status"]=="AVAILABLE" and r["can_simulate"]==1)); s={"captured_at":x["captured_at"],"product_sha":x["product_sha"],"elapsed_seconds":x["elapsed_seconds"],"table_counts":{k:len(v) for k,v in x["tables"].items()},"summary":x["summary"],"blocking_details":[dict(family=f,status=t,detail=d,n=n) for (f,t,d),n in sorted(reasons.items())],"schemas":x["schemas"],"related_table_names":x["related_table_names"]}; pathlib.Path("evidence/summary.json").write_text(json.dumps(s,indent=2,ensure_ascii=False)); print(json.dumps(s,indent=2,ensure_ascii=False))'
          sha256sum evidence/census.json evidence/source.tar.gz > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-blockers-census-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only runner-local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/rc6-census-key" "$HOME/.ssh/rc6-census-known-hosts"
