name: RC6 Wave8 Live CSS Diagnostic 2026-09-09
on:
  push:
    branches: [fix/rc6-wave8-final-ux-closure-20260909]
    paths: ['.github/workflows/rc6-wave8-live-css-diagnostic-20260909.yml']
permissions:
  contents: read
jobs:
  diagnose-live-html:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only live HTML contract diagnostic
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "HEAD=$(cd /opt/porota-trading && git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os, urllib.request
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          checks=[
              ('marker','porota-rc6-classic-responsive'),
              ('overflow_x','overflow-x:auto'),
              ('nowrap','white-space:nowrap'),
              ('keep_all','word-break:keep-all'),
              ('max_content','width:max-content'),
          ]
          for path in ['/validacion','/aprendizaje','/historicos']:
              req=urllib.request.Request('http://127.0.0.1:8000'+path)
              if token:
                  req.add_header('Authorization','Bearer '+token)
                  req.add_header('X-Dashboard-Token',token)
              with urllib.request.urlopen(req,timeout=15) as r:
                  body=r.read().decode('utf-8','replace')
              print(f'PAGE={path}|HTTP={r.status}|BYTES={len(body)}')
              for name,needle in checks:
                  print(f'CHECK|{path}|{name}|{needle in body}|COUNT={body.count(needle)}')
              bad='overflow-wrap:anywhere'
              print(f'CHECK|{path}|bad_wrap_absent|{bad not in body}|COUNT={body.count(bad)}')
              print(f'CHECK|{path}|table_count|{body.lower().count("<table")}|classic_table_count={body.count("classic-responsive-table")}')
          print('DIAGNOSTIC_MUTATION=NO')
          print('ORDER_ROUTES=NOT_CALLED')
          PY
          REMOTE
