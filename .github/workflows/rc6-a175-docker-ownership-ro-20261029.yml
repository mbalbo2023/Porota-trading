name: RC6 A175 postfailure Docker ownership and disk audit READ ONLY

on:
  push:
    branches: [audit/rc6-a175-docker-ownership-ro-20261029]
    paths:
      - .github/workflows/rc6-a175-docker-ownership-ro-20261029.yml

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact audit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bounded adversarial classification tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_rc6_a175_docker_ownership_ro -v

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inventory A171/A174/A175 Docker owners and durable A175 state
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          test "$(sha256sum scripts/rc6_a175_docker_ownership_ro.py | cut -d' ' -f1)" = "$RC6_SOURCE_SHA"
          mkdir -p evidence
          timeout --signal=TERM --kill-after=5s 100s \
            ssh -T -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 "$DO_USER@$DO_HOST" \
              'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -' \
              < scripts/rc6_a175_docker_ownership_ro.py | tee evidence/ownership.json
          test "$(wc -c < evidence/ownership.json)" -lt 32768
        env:
          RC6_SOURCE_SHA: '65c3b530073c94b56f5b63afe93938ac605e9265c33bdaf2cec24215b92af3d0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-a175-docker-ownership-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Erase runner SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
