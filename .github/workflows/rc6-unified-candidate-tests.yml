name: RC6 unified candidate tests
on:
  push:
    branches:
      - candidate/rc6-unified-ingestion-20260917
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" fastapi requests
      - run: python -m py_compile iol_shadow_observation_rc6.py iol_shadow_collector_rc6.py iol_mcp_readonly_adapter_rc6.py rc6_counterfactual_learning.py rc6_validation_truth.py scripts/rc6_iol_shadow_collect.py scripts/rc6_candle_inmarket_evidence.py
      - run: python -m pytest -q tests/test_iol_shadow_observation_rc6.py tests/test_iol_shadow_collector_rc6.py tests/test_rc6_iol_shadow_runtime.py tests/test_iol_shadow_validation_view_rc6.py tests/test_rc6_counterfactual_learning.py tests/test_rc6_validation_truth.py tests/test_rc6_candle_inmarket_evidence.py tests/test_rc6_postclose_history_quarantine.py tests/test_rc6_gdelt_shadow.py tests/test_rc6_validation_projection.py tests/test_rc6_validation_dynamic_evidence.py
