name: RC6 supplemental material evidence
run-name: RC6 compatibility registration @ ${{ github.ref_name }}

# Compatibility with the trusted-base guard during main's first simplification
# PR. This registration does not build or attest a release. Predeploy owns that
# responsibility on the single application candidate.
on:
  workflow_dispatch:

permissions: {}

jobs:
  deny-bootstrap:
    name: Explain retired entry point
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Use canonical Predeploy
        run: |
          echo '::error::This compatibility registration does not run release tests. Use porota-predeploy-v2.yml on the application candidate.'
          echo 'RELEASE_EVIDENCE=NONE|runtime=NO_VERIFICADO'
          exit 1
