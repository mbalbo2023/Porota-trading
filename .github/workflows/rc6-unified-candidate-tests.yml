name: RC6 supplemental material evidence
run-name: RC6 material ${{ inputs.gate || 'cheap' }} @ ${{ inputs.source_sha || github.event.pull_request.head.sha }}

# Draft candidate PR events admit G0/G1 only. Later stages need native Actions payloads
# from its predecessors and a fresh single-gate owner authorization.
on:
  pull_request:
    branches: [deploy/rc6-pr69-isolated-20260915]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen owner-authorized candidate commit (40 lowercase hex)
        required: true
        type: string
      source_tree:
        description: Exact source Git tree (40 lowercase hex)
        required: true
        type: string
      gate:
        description: One ordered source stage; no artifact or deploy authority
        required: true
        type: choice
        options:
          - focal311
          - focal312
          - BIG-browser
          - Horizon
          - full-gov311
          - full-gov312
          - capacity-probe
          - capacity-calibration
          - evidence-custody
      launch_receipt_url:
        description: Immutable issue471 single-gate authorization with predecessor artifact manifest
        required: true
        type: string
      owner_session:
        description: Exact SESSION_SUCCESSOR in the durable launch receipt
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  # Serialize all heavy producers of a candidate, including fullGov and BIG.
  group: rc6-supplementary-material-${{ inputs.source_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  ordered-source-gate:
    name: RC6 ${{ inputs.gate || 'G0-G1-cheap-dual' }} @ ${{ inputs.source_sha || github.event.pull_request.head.sha }}
    if: github.event.repository.id == 1338680554 && github.event.sender.login == 'mbalbo2023' && inputs.gate != 'evidence-custody' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == true && github.event.pull_request.user.login == 'mbalbo2023' && github.event.pull_request.head.repo.id == 1338680554 && github.event.pull_request.head.repo.owner.login == 'mbalbo2023' && github.event.pull_request.base.repo.id == 1338680554 && github.event.pull_request.base.ref == 'deploy/rc6-pr69-isolated-20260915'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RC6_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      RC6_SOURCE_TREE: ${{ inputs.source_tree }}
      RC6_GATE: ${{ inputs.gate || 'cheap' }}
      RC6_LAUNCH_RECEIPT: ${{ inputs.launch_receipt_url }}
      RC6_OWNER_SESSION: ${{ inputs.owner_session }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate Source for bounded admission bootstrap only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RC6_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact scoped authorization and fresh successor lease
        id: admit
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 022
          args=(--source-sha "$RC6_SOURCE_SHA" --gate "$RC6_GATE" --control-root "$RUNNER_TEMP/rc6-pr-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RC6_GATE}")
          if [ -n "$RC6_SOURCE_TREE" ]; then args+=(--source-tree "$RC6_SOURCE_TREE"); fi
          if [ -n "$RC6_LAUNCH_RECEIPT" ]; then args+=(--launch-receipt-url "$RC6_LAUNCH_RECEIPT"); fi
          if [ -n "$RC6_OWNER_SESSION" ]; then args+=(--owner-session "$RC6_OWNER_SESSION"); fi
          python3 -I -B scripts/rc6_material_pr_admission.py "${args[@]}"
      - name: Measure live compound capacity before reviewed Python tooling
        if: env.RC6_GATE != 'capacity-probe' && env.RC6_GATE != 'capacity-calibration'
        shell: bash
        env:
          RC6_ADMISSION_JSON: ${{ steps.admit.outputs.admission_path }}
        run: |
          set -Eeuo pipefail
          python3 -I -B - <<'PY_TOOLING'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from scripts.rc6_material_carrier import tooling_capacity
          tooling_capacity(Path(os.environ['RC6_ADMISSION_JSON']),Path.cwd(),os.environ)
          PY_TOOLING
      - name: Prepare reviewed CPython311 tooling
        if: env.RC6_GATE != 'capacity-probe' && env.RC6_GATE != 'capacity-calibration'
        id: py311
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Prepare reviewed CPython312 tooling
        if: env.RC6_GATE != 'capacity-probe' && env.RC6_GATE != 'capacity-calibration'
        id: py312
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify canonical policy and cheap-only push boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/porota-predeploy-v2.yml
          test -f ops/policy/test-policy.yaml
          grep -F 'automatic_discovery_required: true' ops/policy/test-policy.yaml
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$RC6_GATE" = cheap; fi
          echo 'POROTA_CANONICAL_ARTIFACT_PIPELINE=PREDEPLOY_V2_ONLY'
          echo 'PUSH_HEAVY_OR_PREDEPLOY_AUTHORIZATION=false'
          echo 'DEPLOY_OWNER=NOT_ACQUIRED'
          echo 'real_orders_sent=0'
      - name: Run one stage after payload and live capacity admission
        id: gate
        if: env.RC6_GATE != 'capacity-probe' && env.RC6_GATE != 'capacity-calibration'
        shell: bash
        env:
          RC6_SOURCE_TREE: ${{ steps.admit.outputs.source_tree }}
          RC6_LAUNCH_RECEIPT: ${{ steps.admit.outputs.launch_receipt_url }}
          RC6_OWNER_SESSION: ${{ steps.admit.outputs.owner_session }}
          RC6_PYTHON311: ${{ steps.py311.outputs.python-path }}
          RC6_PYTHON312: ${{ steps.py312.outputs.python-path }}
        run: |
          set -Eeuo pipefail
          umask 022
          "$RC6_PYTHON311" -I -B scripts/rc6_material_carrier.py \
            --repo-root "$GITHUB_WORKSPACE" --source-sha "$RC6_SOURCE_SHA" --source-tree "$RC6_SOURCE_TREE" \
            --gate "$RC6_GATE" --launch-receipt-url "$RC6_LAUNCH_RECEIPT" --owner-session "$RC6_OWNER_SESSION" \
            --require-pr-admission --python311 "$RC6_PYTHON311" --python312 "$RC6_PYTHON312"
      - name: Run isolated capacity diagnosis without candidate qualification
        id: diagnostic
        if: github.event_name == 'workflow_dispatch' && (env.RC6_GATE == 'capacity-probe' || env.RC6_GATE == 'capacity-calibration')
        shell: bash
        env:
          RC6_DIAGNOSTIC_ADMISSION: ${{ steps.admit.outputs.admission_path }}
        run: |
          set -Eeuo pipefail
          umask 022
          python3 -I -B scripts/rc6_material_carrier.py \
            --diagnostic-admission-json "$RC6_DIAGNOSTIC_ADMISSION" --repo-root "$GITHUB_WORKSPACE"
      - name: Preserve bounded admission controls on every terminal path
        if: always() && steps.admit.outputs.control_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-admission-${{ env.RC6_SOURCE_SHA }}-${{ env.RC6_GATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.admit.outputs.control_root }}/*.json
      - name: Preserve native custody controls on every terminal path
        if: always() && steps.gate.outputs.control_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-controls-${{ env.RC6_SOURCE_SHA }}-${{ env.RC6_GATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.gate.outputs.control_root }}/*.json
      - name: Preserve isolated diagnostic controls on every terminal path
        if: always() && steps.diagnostic.outputs.control_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-capacity-controls-${{ env.RC6_SOURCE_SHA }}-${{ env.RC6_GATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.diagnostic.outputs.control_root }}/*.json
      - name: Preserve diagnostic RAW only after physical FIN and authenticated cleanup
        if: always() && steps.diagnostic.outputs.safe_payload_upload == 'true' && steps.diagnostic.outputs.payload_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-capacity-diagnostic-${{ env.RC6_SOURCE_SHA }}-${{ env.RC6_GATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.diagnostic.outputs.payload_root }}
      - name: Preserve original RAW after physical FIN even on logical RED
        if: always() && steps.gate.outputs.safe_payload_upload == 'true' && steps.gate.outputs.payload_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-raw-${{ env.RC6_SOURCE_SHA }}-${{ env.RC6_GATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.gate.outputs.payload_root }}

  evidence-custody:
    name: Recover exact historical RAW into verified draft-release assets
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'evidence-custody' && github.repository_id == '1338680554' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - name: Checkout the exact custody controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate owner and copy immutable ZIPs with complete recovery readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC6_SOURCE_SHA: ${{ inputs.source_sha }}
          RC6_SOURCE_TREE: ${{ inputs.source_tree }}
          RC6_OWNER_SESSION: ${{ inputs.owner_session }}
          RC6_LAUNCH_RECEIPT: ${{ inputs.launch_receipt_url }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RC6_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RC6_SOURCE_TREE"
          python3 -I -B scripts/rc6_actions_custody.py \
            --plan ops/policy/rc6-actions-custody-20261009.json \
            --source-sha "$RC6_SOURCE_SHA" --source-tree "$RC6_SOURCE_TREE" \
            --owner-session "$RC6_OWNER_SESSION" --launch-receipt-url "$RC6_LAUNCH_RECEIPT" \
            --output "$RUNNER_TEMP/rc6-durable-custody.json"
      - name: Preserve the verified custody receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-durable-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-durable-custody.json
          if-no-files-found: error
          retention-days: 90
      - name: Admit bounded development checks before tooling
        id: development_admission
        env:
          GH_TOKEN: ${{ github.token }}
          RC6_SOURCE_SHA: ${{ inputs.source_sha }}
          RC6_SOURCE_TREE: ${{ inputs.source_tree }}
          RC6_OWNER_SESSION: ${{ inputs.owner_session }}
          RC6_LAUNCH_RECEIPT: ${{ inputs.launch_receipt_url }}
        run: |
          set -Eeuo pipefail
          umask 022
          python3 -I -B scripts/rc6_development_checks.py \
            --admit-only --plan ops/policy/rc6-development-checks-v1.json \
            --source-sha "$RC6_SOURCE_SHA" --source-tree "$RC6_SOURCE_TREE" \
            --owner-session "$RC6_OWNER_SESSION" --launch-receipt-url "$RC6_LAUNCH_RECEIPT" \
            --output "$RUNNER_TEMP/rc6-development-controls"
          python3 -I -B - <<'PY_READONLY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from scripts.rc6_capacity_comparison import readonly_runner_observation
          path=Path(os.environ['RUNNER_TEMP'])/'rc6-development-controls'/'runner-readonly.json'
          path.write_text(json.dumps(readonly_runner_observation(path.parent),sort_keys=True,indent=2)+'\n')
          PY_READONLY
      - name: Prepare bounded Python311 development tooling
        id: dev311
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Prepare bounded Python312 development tooling
        id: dev312
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install only the fourteen hashed development wheels and run exact Source checks
        env:
          GH_TOKEN: ${{ github.token }}
          RC6_PYTHON311: ${{ steps.dev311.outputs.python-path }}
          RC6_PYTHON312: ${{ steps.dev312.outputs.python-path }}
          RC6_SOURCE_SHA: ${{ inputs.source_sha }}
          RC6_SOURCE_TREE: ${{ inputs.source_tree }}
          RC6_OWNER_SESSION: ${{ inputs.owner_session }}
          RC6_LAUNCH_RECEIPT: ${{ inputs.launch_receipt_url }}
        run: |
          set -Eeuo pipefail
          umask 022
          "$RC6_PYTHON311" -m pip install --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/rc6-development-controls/tooling.lock.txt"
          "$RC6_PYTHON312" -m pip install --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/rc6-development-controls/tooling.lock.txt"
          "$RC6_PYTHON311" -I -B scripts/rc6_development_checks.py \
            --plan ops/policy/rc6-development-checks-v1.json \
            --source-sha "$RC6_SOURCE_SHA" --source-tree "$RC6_SOURCE_TREE" \
            --owner-session "$RC6_OWNER_SESSION" --launch-receipt-url "$RC6_LAUNCH_RECEIPT" \
            --python311 "$RC6_PYTHON311" --python312 "$RC6_PYTHON312" \
            --output "$RUNNER_TEMP/rc6-development-controls"
      - name: Preserve sealed development RAW and readonly runner observations
        if: always() && steps.development_admission.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-development-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-development-controls/
          if-no-files-found: error
          retention-days: 90
