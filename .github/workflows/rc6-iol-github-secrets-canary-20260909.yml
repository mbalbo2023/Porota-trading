name: RC6 IOL GitHub Secrets Canary 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-iol-github-secrets-canary-20260909.yml']
permissions:
  contents: read
jobs:
  secret-canary:
    runs-on: ubuntu-24.04
    env:
      IOL_USERNAME: ${{ secrets.IOL_USERNAME }}
      IOL_PASSWORD: ${{ secrets.IOL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret presence and official API token
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${IOL_USERNAME:-}" ] || [ -z "${IOL_PASSWORD:-}" ]; then
            echo 'GITHUB_IOL_SECRETS_PRESENT=NO'
            exit 2
          fi
          echo 'GITHUB_IOL_SECRETS_PRESENT=YES'
          python -m pip install -q requests
          IOL_ENABLED=true PYTHONPATH=. python - <<'PY'
          import os
          from rc6_iol_client_v2 import IOLClient
          c=IOLClient(os.environ['IOL_USERNAME'],os.environ['IOL_PASSWORD'])
          data=c.get_serie_historica('GGAL',mercado='bcba',dias=30,ajustada=True)
          print('IOL_GITHUB_SECRET_GGAL_ROWS='+str(len(data)))
          if not data:
              raise SystemExit('IOL_GITHUB_SECRET_CANARY_FAILED')
          print('IOL_GITHUB_SECRET_CANARY=GREEN')
          PY
