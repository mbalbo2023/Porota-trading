name: RC6 weekend ingestion schedule preflight 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-weekend-ingestion-schedule-preflight-20260912.yml']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect current host, safety, timers and deploy activity
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          echo "HOST_SHA=$(git rev-parse HEAD)"
          echo "HOST_BRANCH=$(git branch --show-current || true)"
          echo '=== DEPLOY_ACTIVITY ==='
          pgrep -af 'git (pull|checkout|reset)|docker compose|docker-compose|deploy|buildx|docker build' || true
          test ! -e .git/index.lock || { echo 'ABORT=GIT_INDEX_LOCK_PRESENT'; exit 41; }

          echo '=== SAFETY ==='
          sudo -n docker exec porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print('SAFETY=%s|%s'%s)
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          cols=[r[1] for r in c.execute('pragma table_info(observer_state)')]
          print('OBSERVER_STATE_COLS='+','.join(cols))
          for col in ('market_phase','market_state','phase','status'):
              if col in cols:
                  try:
                      print(col.upper()+'='+str(c.execute('select '+col+' from observer_state where id=1').fetchone()[0]))
                  except Exception:
                      pass
          c.close()
          PY

          echo '=== TIMERS ==='
          for u in porota-ppi-argentina-nightly-rc6.timer porota-contract-evidence-rc6.timer; do
            echo "--- $u ---"
            systemctl is-enabled "$u" 2>/dev/null || true
            systemctl is-active "$u" 2>/dev/null || true
            systemctl cat "$u" 2>/dev/null || true
            systemctl list-timers "$u" --all --no-pager 2>/dev/null || true
          done

          echo '=== SERVICES ==='
          for u in porota-ppi-argentina-nightly-rc6.service porota-contract-evidence-rc6.service; do
            echo "--- $u ---"
            systemctl show "$u" -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p ExecMainStartTimestamp --no-pager 2>/dev/null || true
          done

          echo '=== INGEST_COUNTS ==='
          sudo -n docker exec porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          def one(sql):
              try: return c.execute(sql).fetchone()[0]
              except Exception: return 'NA'
          print('ARG_API_SHADOW='+str(one('select count(*) from ppi_argentina_api_shadow')))
          print('HISTORY_ATTEMPTS='+str(one('select count(*) from production_history_attempts')))
          print('HISTORY_USABLE='+str(one("select count(*) from production_history_attempts where state in ('VALID_PAYLOAD','PARTIAL')")))
          print('CONTRACT_CURRENT='+str(one('select count(*) from contract_evidence_v2_current')))
          print('CONTRACT_RUNS='+str(one('select count(*) from contract_evidence_v2_runs')))
          c.close()
          PY

          echo 'HOST_MUTATION=NONE'
          echo 'HTTP_CALLS=NONE'
          echo 'ORDER_ROUTES=NOT_CALLED'
          HOST
