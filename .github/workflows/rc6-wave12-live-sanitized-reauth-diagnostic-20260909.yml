name: RC6 Wave12 Live Sanitized Reauth Diagnostic 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: [.github/workflows/rc6-wave12-live-sanitized-reauth-diagnostic-20260909.yml]

permissions:
  contents: read

jobs:
  one-shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static safety gate
        run: |
          set -Eeuo pipefail
          bash -n scripts/porota_contract_evidence_rc6_runtime.sh
          ! grep -REn '/Operar|/Orden|api/Orders|send_order|place_order|new_order' rc6_trusted_browser_contract_collector.py
          grep -q 'REAUTH_DIAG_STAGE' scripts/porota_contract_evidence_rc6_runtime.sh
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w12diag"
          chmod 600 "$HOME/.ssh/w12diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Install isolated diagnostics and run once
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w12diag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          LIB=/usr/local/lib/porota-contract-evidence-rc6
          cd "$REPO"
          test "$(git rev-parse HEAD)" = 9197aedf35fe1739b594c742902e80df069c47c9
          OBS_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          git fetch --no-tags origin deploy-prep/rc6-wave12-currentbase-20260909
          test "$(git rev-parse origin/deploy-prep/rc6-wave12-currentbase-20260909)" = "$TARGET_SHA"
          TMP=$(mktemp -d "$HOME/w12diag.XXXXXX")
          cleanup(){ git -C "$REPO" worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"; }
          trap cleanup EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          for f in rc6_contract_due_job.py rc6_contract_schedule.py rc6_ppi_contract_normalizer.py rc6_trusted_browser_contract_collector.py rc6_contract_capture_importer.py rc6_ppi_web_reauth.py; do
            sudo -n install -o root -g root -m 0644 "$TMP/source/$f" "$LIB/$f"
          done
          sudo -n install -o root -g root -m 0755 "$TMP/source/scripts/porota_contract_evidence_rc6_runtime.sh" /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          sudo -n install -o root -g root -m 0644 "$TMP/source/systemd/porota-contract-evidence-rc6.service" /etc/systemd/system/porota-contract-evidence-rc6.service
          sudo -n systemctl daemon-reload
          set +e
          sudo -n systemctl start porota-contract-evidence-rc6.service
          RC=$?
          set -e
          echo "SERVICE_START_RC=$RC"
          sudo -n journalctl -u porota-contract-evidence-rc6.service -n 70 --no-pager -o cat | grep -E '^(STATUS=|AUTH_STATUS=|REAUTH_ATTEMPTED=|AUTH_BROWSER_STARTED=|REAUTH_DIAG_STAGE=|REAUTH_DIAG_PAGE=|REAUTH_DIAG_BLOCKED=|IMPORT_RC=|DB_QUICK_CHECK=|REAL_ORDERS_SENT=)' | tail -n 18 || true
          OBS_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          test "$OBS_POST" = "$OBS_PRE"; test "$DASH_POST" = "$DASH_PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'DB={q}|{m}|{r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          REMOTE
