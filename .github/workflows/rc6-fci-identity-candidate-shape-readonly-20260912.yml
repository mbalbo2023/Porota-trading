name: RC6 FCI Identity Candidate Shape Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-fci-identity-candidate-shape-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect FCI and FCI exterior identity candidates
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo HOST_SHA="$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import sqlite3,json,re
          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('SAFETY='+'|'.join(map(str,(q,*st))))
          rows=c.execute('''select cur.family,s.evidence_json from contract_evidence_v2_current cur
                            join contract_evidence_v2_snapshots s on s.snapshot_id=cur.snapshot_id
                            where upper(cur.family) in ('FCI','FCI_LOCAL','FCI_EXTERIOR')
                              and cur.source_class='PPI_AUTHENTICATED_WEB'
                            order by cur.family''').fetchall()
          deny=('token','cookie','secret','password','credential','authorization','account','otp')
          for r in rows:
              try: ev=json.loads(r['evidence_json'] or '{}')
              except Exception: ev={}
              print('FCI_HEADERS='+json.dumps({'family':r['family'],'table_headers_observed':ev.get('table_headers_observed'),'count':ev.get('unlinked_observation_count')},ensure_ascii=False,sort_keys=True))
              sample=ev.get('unlinked_observations_sample') or []
              for i,item in enumerate(sample[:12]):
                  if not isinstance(item,dict): continue
                  clean={}
                  for k,v in item.items():
                      low=str(k).lower()
                      if any(x in low for x in deny): continue
                      if isinstance(v,(str,int,float,bool)) or v is None:
                          clean[str(k)]=re.sub(r'\s+',' ',str(v))[:220] if isinstance(v,str) else v
                      elif isinstance(v,list) and len(v)<=20 and all(isinstance(x,(str,int,float,bool)) or x is None for x in v):
                          clean[str(k)]=[re.sub(r'\s+',' ',str(x))[:160] if isinstance(x,str) else x for x in v]
                  print('FCI_SAMPLE='+json.dumps({'family':r['family'],'index':i,'row':clean},ensure_ascii=False,sort_keys=True))
          c.close()
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
