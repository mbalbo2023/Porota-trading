name: RC6 Wave12 Refresh Trusted Session V2 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave12-refresh-trusted-session-v2-20260909.yml']
permissions:
  contents: read
jobs:
  refresh-trusted-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile rc6_ppi_web_reauth.py
          grep -q 'AUTHENTICATED_TRUSTED_DEVICE' rc6_ppi_web_reauth.py
          grep -q 'APPROVED_AUTH_POSTS' rc6_ppi_web_reauth.py
          ! grep -REn 'send_order|place_order|cancel_order|/Operar|/Orden|api/Orders' rc6_ppi_web_reauth.py
          echo 'W12_REFRESH_STATIC=GREEN'
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w12refresh"
          chmod 600 "$HOME/.ssh/w12refresh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Refresh trusted profile with host-only secret
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/w12refresh" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECTED=9197aedf35fe1739b594c742902e80df069c47c9
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          SECRET=/etc/porota/contract-evidence-web.env
          PY=/opt/porota-contract-evidence-venv/bin/python
          PRE=$(git rev-parse HEAD)
          test "$PRE" = "$EXPECTED"
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc6.service 2>/dev/null || true)" != active
          OBS_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH_PRE=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          test "$(sudo -n stat -c '%U|%a' "$SECRET")" = 'porotaadmin|600'
          test "$(sudo -n stat -c '%U' "$PROFILE")" = 'porotaadmin'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'W12_REFRESH_PRE_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          git fetch --no-tags origin deploy-prep/rc6-wave12-currentbase-20260909
          git cat-file -e "$TARGET_SHA^{commit}"
          TMP=$(mktemp -d "$HOME/w12refresh.XXXXXX")
          trap 'rm -rf "$TMP"' EXIT
          git show "$TARGET_SHA:rc6_ppi_web_reauth.py" > "$TMP/rc6_ppi_web_reauth.py"
          set +e
          OUT=$(sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin PYTHONPATH="$TMP" "$PY" "$TMP/rc6_ppi_web_reauth.py" --profile "$PROFILE" --secret "$SECRET" 2>&1)
          RC=$?
          set -e
          SAFE=$(OUT="$OUT" python3 - <<'PY'
          import json,os
          raw=os.environ.get('OUT','')
          try: d=json.loads(raw)
          except Exception: d={'status':'INVALID_SANITIZED_OUTPUT'}
          keys=('status','attempts','stage','page_url','blocked_post_path','credentials_exposed','orders_visited','real_orders_sent')
          o={k:d.get(k) for k in keys if k in d}
          print(json.dumps(o,sort_keys=True))
          assert o.get('credentials_exposed') is False
          assert o.get('orders_visited') is False
          assert int(o.get('real_orders_sent') or 0)==0
          assert o.get('status')=='AUTHENTICATED_TRUSTED_DEVICE'
          PY
          )
          echo "W12_REFRESH_RC=$RC"
          echo "W12_REFRESH_RESULT=$SAFE"
          test "$RC" -eq 0
          OBS_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH_POST=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          test "$OBS_POST" = "$OBS_PRE"
          test "$DASH_POST" = "$DASH_PRE"
          test "$(git rev-parse HEAD)" = "$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'W12_REFRESH_POST_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'RUNTIME_CHANGED=NO'
          echo 'W12_TRUSTED_SESSION_REFRESH=GREEN'
          REMOTE
