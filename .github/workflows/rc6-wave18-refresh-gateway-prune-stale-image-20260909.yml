name: RC6 Wave18 Refresh Gateway And Prune Stale Image 2026-09-09

on:
  push:
    branches:
      - deploy-prep/rc6-wave18-currentbase-20260909
    paths:
      - .github/workflows/rc6-wave18-refresh-gateway-prune-stale-image-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-wave18-control-plane-maintenance
  cancel-in-progress: false

jobs:
  refresh-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Recreate isolated gateway on current image and prune stale image
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_SHA=$(git rev-parse HEAD)
          C=porota_critical_approval_rc6
          UNIT=porota-critical-approval-rc6.service
          PROXY=porota-critical-github-proxy-rc6.service
          STALE_TAG=porota-trading-bot:rc6-scalping-rollback-5076b6dff8c6

          db_state() {
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          }

          echo '=== PRECHECK ==='
          echo "RUNTIME_HEAD=$PRE_SHA"
          db_state
          test "$(sudo -n systemctl is-active "$UNIT")" = active
          test "$(sudo -n systemctl is-active "$PROXY")" = active
          OBS_ID=$(sudo -n docker inspect -f '{{.Id}}' porota_production_observer)
          DASH_ID=$(sudo -n docker inspect -f '{{.Id}}' porota_production_dashboard)
          OLD_CONTAINER_ID=$(sudo -n docker inspect -f '{{.Id}}' "$C")
          OLD_IMAGE_ID=$(sudo -n docker inspect -f '{{.Image}}' "$C")
          CURRENT_IMAGE_ID=$(sudo -n docker image inspect -f '{{.Id}}' porota-trading-bot:17.0.0-rc6)
          echo "OLD_CONTAINER_ID=${OLD_CONTAINER_ID:0:12}"
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID"
          echo "CURRENT_IMAGE_ID=$CURRENT_IMAGE_ID"
          test "$OLD_IMAGE_ID" != "$CURRENT_IMAGE_ID"
          echo 'STALE_IMAGE_PROOF=GREEN'
          df -h /opt/porota-trading

          echo '=== RESTART ISOLATED APPROVAL GATEWAY ONLY ==='
          sudo -n systemctl restart "$UNIT"

          for _ in $(seq 1 30); do
            if sudo -n docker inspect "$C" >/dev/null 2>&1; then
              NEW_CONTAINER_ID=$(sudo -n docker inspect -f '{{.Id}}' "$C")
              NEW_IMAGE_ID=$(sudo -n docker inspect -f '{{.Image}}' "$C")
              RUNNING=$(sudo -n docker inspect -f '{{.State.Running}}' "$C")
              if [ "$NEW_CONTAINER_ID" != "$OLD_CONTAINER_ID" ] && [ "$NEW_IMAGE_ID" = "$CURRENT_IMAGE_ID" ] && [ "$RUNNING" = true ]; then
                break
              fi
            fi
            sleep 2
          done
          NEW_CONTAINER_ID=$(sudo -n docker inspect -f '{{.Id}}' "$C")
          NEW_IMAGE_ID=$(sudo -n docker inspect -f '{{.Image}}' "$C")
          echo "NEW_CONTAINER_ID=${NEW_CONTAINER_ID:0:12}"
          echo "NEW_IMAGE_ID=$NEW_IMAGE_ID"
          test "$NEW_CONTAINER_ID" != "$OLD_CONTAINER_ID"
          test "$NEW_IMAGE_ID" = "$CURRENT_IMAGE_ID"
          test "$(sudo -n systemctl is-active "$UNIT")" = active
          test "$(sudo -n systemctl is-active "$PROXY")" = active
          echo 'GATEWAY_CURRENT_IMAGE=GREEN'

          echo '=== STABILITY WINDOW ==='
          for n in 1 2 3 4 5 6; do
            sleep 10
            H=$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$C")
            P=$(sudo -n docker stats --no-stream --format '{{.PIDs}}' "$C" 2>/dev/null || echo 999)
            echo "STABILITY_${n}=HEALTH:$H|PIDS:$P"
            test "$P" -lt 32
          done
          test "$(sudo -n docker inspect -f '{{.State.Running}}' "$C")" = true
          test "$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$C")" = healthy

          sudo -n docker exec "$C" python -c 'from fm_critical_approval_unix_runtime_rc6 import UnixGithubIssuesClient; h=UnixGithubIssuesClient().health(); assert h.get("status")=="ok" and h.get("capability")=="issues_only",h; print("ISSUES_CAPABILITY_BROKER=GREEN")'
          sudo -n docker logs --tail 80 "$C" 2>&1 | grep -q 'critical-approval-runtime: READY'
          if sudo -n docker logs --tail 120 "$C" 2>&1 | grep -Eiq 'HTTP_409|terminated by other getUpdates|TELEGRAM_SINGLE_CONSUMER_NOT_ENFORCED'; then
            echo 'TELEGRAM_SINGLE_CONSUMER=RED'
            exit 1
          fi
          echo 'TELEGRAM_SINGLE_CONSUMER=GREEN'

          echo '=== TRADING RUNTIME NON-INTERFERENCE ==='
          test "$(sudo -n docker inspect -f '{{.Id}}' porota_production_observer)" = "$OBS_ID"
          test "$(sudo -n docker inspect -f '{{.Id}}' porota_production_dashboard)" = "$DASH_ID"
          test "$(git rev-parse HEAD)" = "$PRE_SHA"
          db_state
          echo 'TRADING_RUNTIME_UNCHANGED=GREEN'

          echo '=== REMOVE NOW-UNUSED STALE IMAGE ==='
          # Refuse deletion if any container still uses the stale immutable image.
          USES=$(sudo -n docker ps -aq | while read -r id; do
            [ -n "$id" ] || continue
            img=$(sudo -n docker inspect -f '{{.Image}}' "$id" 2>/dev/null || true)
            [ "$img" = "$OLD_IMAGE_ID" ] && echo "$id"
          done)
          test -z "$USES"
          if sudo -n docker image inspect "$STALE_TAG" >/dev/null 2>&1; then
            TAG_ID=$(sudo -n docker image inspect -f '{{.Id}}' "$STALE_TAG")
            test "$TAG_ID" = "$OLD_IMAGE_ID"
            sudo -n docker image rm "$STALE_TAG"
          fi
          if sudo -n docker image inspect "$OLD_IMAGE_ID" >/dev/null 2>&1; then
            sudo -n docker image rm "$OLD_IMAGE_ID"
          fi
          if sudo -n docker image inspect "$OLD_IMAGE_ID" >/dev/null 2>&1; then
            echo 'STALE_IMAGE_REMOVE=RED'
            exit 1
          fi
          echo 'STALE_IMAGE_REMOVE=GREEN'

          echo '=== FINAL ==='
          df -h /opt/porota-trading
          sudo -n docker system df || true
          sudo -n docker images --format '{{.Repository}}:{{.Tag}}|{{.Size}}|{{.ID}}'
          db_state
          echo 'CONTAINERS_REMOVED=OLD_GATEWAY_ONLY_BY_SYSTEMD_RECREATE'
          echo 'OBSERVER_RESTARTED=NO'
          echo 'DASHBOARD_RESTARTED=NO'
          echo 'VOLUMES_REMOVED=NO'
          echo 'NETWORKS_REMOVED=NO'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'REAL_ORDERS_SENT=0'
          echo 'RC6_W18_GATEWAY_REFRESH_STALE_IMAGE_CLEANUP=GREEN'
          REMOTE
