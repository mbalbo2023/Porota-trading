name: RC6 GHCR immutable archive proof

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-ghcr-archive-proof.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish-repull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0

      - name: Verify exact RC5 ancestry and safety identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
          python - <<'PY'
          import _version
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate by immutable SHA tag
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
        run: |
          set -euo pipefail
          TAG="rc6-candidate-${GITHUB_SHA}"
          REF="$IMAGE:$TAG"
          docker build --pull=false --label "porota.commit=${GITHUB_SHA}" -t "$REF" .
          docker push "$REF"
          DIGEST="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          test -n "$DIGEST"
          case "$DIGEST" in sha256:*) ;; *) echo 'INVALID_DIGEST'; exit 1;; esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'image=%s\ndigest=%s\ncommit=%s\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" > /tmp/rc6-ghcr-manifest.txt

      - name: Delete local copy and re-pull exact digest from GitHub
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm "${{ steps.publish.outputs.ref }}"
          docker pull "$IMAGE@$DIGEST"
          LABEL="$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "porota.commit"}}')"
          test "$LABEL" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            "$IMAGE@$DIGEST" python - <<'PY'
          import _version
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('GHCR_REPULL_SAFETY=GREEN')
          PY

      - name: Upload immutable manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc6-ghcr-manifest-${{ github.sha }}
          path: /tmp/rc6-ghcr-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Evidence summary
        shell: bash
        run: |
          {
            echo '### RC6 immutable external archive proof'
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: ${{ steps.publish.outputs.ref }}"
            echo "- Digest: ${{ steps.publish.outputs.digest }}"
            echo '- Local build copy was removed before exact digest re-pull.'
            echo '- Re-pulled image preserved exact porota.commit label and safety identity.'
          } >> "$GITHUB_STEP_SUMMARY"
