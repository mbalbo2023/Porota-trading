name: RC6 DOM expected universe reconciler validate 2026-09-08
on:
  push:
    branches: [feature/rc6-dom-expected-universe-reconciler-20260908]
    paths: ['.github/workflows/rc6-dom-expected-universe-reconciler-validate-20260908.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc6-dom-expected-universe-reconciler-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create pure coverage reconciler
        run: |
          set -euo pipefail
          cat > rc6_dom_coverage_reconciler.py <<'PY'
          """Pure reconciliation of authenticated DOM coverage against an independent universe.

          Never calls PPI, browser or DB. A DOM row count can prove truncation when
          expected identities are known; it can never prove completeness by itself.
          """
          from __future__ import annotations
          from dataclasses import dataclass, asdict

          FAMILY_MAP={
              'FCI':'FCI','FCI EXTERIOR':'FCI-EXTERIOR','ACCIONES':'ACCIONES',
              'ACCIONES USA':'ACCIONES-USA','BONOS':'BONOS','CAUCIONES':'CAUCIONES',
              'CEDEARS':'CEDEARS','CEDEAR':'CEDEARS','ETF':'ETF','FUTUROS':'FUTUROS',
              'LETRAS':'LETRAS','LICITACIONES':'LICITACIONES','ON':'ON','OPCIONES':'OPCIONES',
              'ÍNDICES':'INDICES','INDICES':'INDICES','MONEDAS':'MONEDAS','TASAS':'TASAS'}

          @dataclass(frozen=True)
          class CoverageResult:
              family:str
              dom_unique:int
              expected_unique:int|None
              matched:int|None
              missing:int|None
              extra:int|None
              status:str
              expected_source:str|None
              complete_proven:bool

          def canonical_family(value):
              key=' '.join(str(value or '').strip().upper().split())
              return FAMILY_MAP.get(key,key)

          def reconcile(*,family,dom_ids,expected_ids=None,expected_source=None):
              fam=canonical_family(family)
              dom={str(x).strip().upper() for x in dom_ids if str(x).strip()}
              if expected_ids is None:
                  return CoverageResult(fam,len(dom),None,None,None,None,
                      'PARTIAL_UNKNOWN_EXPECTED',None,False)
              expected={str(x).strip().upper() for x in expected_ids if str(x).strip()}
              if not expected_source:
                  raise ValueError('EXPECTED_SOURCE_REQUIRED')
              matched=len(dom & expected); missing=len(expected-dom); extra=len(dom-expected)
              if missing:
                  status='PARTIAL_TRUNCATED' if len(dom)<=len(expected) else 'IDENTITY_MISMATCH'
                  complete=False
              elif extra:
                  status='DOM_EXTRA_IDENTITY_MISMATCH'; complete=False
              else:
                  status='COMPLETE_PROVEN'; complete=True
              return CoverageResult(fam,len(dom),len(expected),matched,missing,extra,status,str(expected_source),complete)

          def readiness(result):
              if result.complete_proven: return 'COVERAGE_GREEN'
              if result.status in {'PARTIAL_TRUNCATED','IDENTITY_MISMATCH','DOM_EXTRA_IDENTITY_MISMATCH'}: return 'COVERAGE_YELLOW'
              return 'COVERAGE_GRAY'
          PY
          cat > tests/test_rc6_dom_coverage_reconciler.py <<'PY'
          import rc6_dom_coverage_reconciler as r

          def ids(n): return [f'X{i}' for i in range(n)]

          def test_dom_50_vs_expected_193_proves_truncation():
              x=r.reconcile(family='CEDEARs',dom_ids=ids(50),expected_ids=ids(193),expected_source='candidate_universe:PPI_PRODUCTION_CATALOG')
              assert x.family=='CEDEARS' and x.status=='PARTIAL_TRUNCATED' and x.missing==143 and not x.complete_proven

          def test_options_43_unique_vs_383_expected_is_partial():
              x=r.reconcile(family='Opciones',dom_ids=ids(43),expected_ids=ids(383),expected_source='candidate_universe')
              assert x.status=='PARTIAL_TRUNCATED' and x.missing==340

          def test_less_than_50_without_expected_never_becomes_complete():
              x=r.reconcile(family='Letras',dom_ids=ids(30),expected_ids=None)
              assert x.status=='PARTIAL_UNKNOWN_EXPECTED' and not x.complete_proven and r.readiness(x)=='COVERAGE_GRAY'

          def test_exact_identity_set_proves_complete_with_provenance():
              x=r.reconcile(family='Acciones',dom_ids=['GGAL','YPFD'],expected_ids=['YPFD','GGAL'],expected_source='api-catalog-run:abc')
              assert x.status=='COMPLETE_PROVEN' and x.complete_proven and x.expected_source=='api-catalog-run:abc'

          def test_dom_extra_blocks_complete():
              x=r.reconcile(family='ETF',dom_ids=['A','B'],expected_ids=['A'],expected_source='catalog')
              assert x.status=='DOM_EXTRA_IDENTITY_MISMATCH' and not x.complete_proven

          def test_expected_universe_requires_provenance():
              try:r.reconcile(family='Bonos',dom_ids=['A'],expected_ids=['A'])
              except ValueError as e: assert 'EXPECTED_SOURCE_REQUIRED' in str(e)
              else: raise AssertionError('expected provenance failure')
          PY
      - name: Test pure coverage policy
        run: |
          set -euo pipefail
          pip install -q pytest
          python -m py_compile rc6_dom_coverage_reconciler.py
          pytest -q tests/test_rc6_dom_coverage_reconciler.py
          ! grep -Eiq '(requests|playwright|selenium|urlopen|budget_order|confirm_order|cancel_order)' rc6_dom_coverage_reconciler.py
      - name: Commit tested reconciler
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rc6_dom_coverage_reconciler.py tests/test_rc6_dom_coverage_reconciler.py
          git commit -m 'feat(rc6): reconcile DOM coverage against expected universe'
          git push origin HEAD:feature/rc6-dom-expected-universe-reconciler-20260908
