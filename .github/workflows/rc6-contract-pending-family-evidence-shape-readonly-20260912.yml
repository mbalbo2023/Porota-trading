name: RC6 Contract Pending Family Evidence Shape Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-contract-pending-family-evidence-shape-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect safe current evidence shapes
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo HOST_SHA="$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import sqlite3,json,re
          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('SAFETY='+'|'.join(map(str,(q,*st))))

          families=('FCI','FCI_LOCAL','FCI_EXTERIOR','LICITACIONES')
          deny=('token','cookie','auth','secret','password','credential','header','body','session','account','otp')
          wanted=('ticker','symbol','name','description','code','id','instrument','fund','fondo','auction','licit','market','currency','settlement','manager','custodian','jurisdiction','route','path','endpoint')
          def safe_walk(node,path='',depth=0,out=None):
              out=[] if out is None else out
              if depth>5 or len(out)>=80: return out
              if isinstance(node,dict):
                  for k,v in node.items():
                      ks=str(k); low=ks.lower(); p=(path+'.'+ks).strip('.')
                      if any(x in low for x in deny): continue
                      if isinstance(v,(str,int,float,bool)) and any(x in low for x in wanted):
                          s=re.sub(r'\s+',' ',str(v)).strip()[:180]
                          if s: out.append((p,s))
                      elif isinstance(v,(dict,list)):
                          safe_walk(v,p,depth+1,out)
              elif isinstance(node,list):
                  for i,v in enumerate(node[:30]): safe_walk(v,f'{path}[{i}]',depth+1,out)
              return out

          ph=','.join('?' for _ in families)
          rows=c.execute(f'''select cur.family,cur.ticker,cur.market,cur.settlement,cur.source_class,s.observed_at,s.evidence_json
                             from contract_evidence_v2_current cur
                             join contract_evidence_v2_snapshots s on s.snapshot_id=cur.snapshot_id
                             where upper(cur.family) in ({ph})
                             order by cur.family,case when cur.ticker in ('*','UNKNOWN','') then 1 else 0 end,cur.ticker,cur.source_class''',families).fetchall()
          for r in rows:
              try: ev=json.loads(r['evidence_json'] or '{}')
              except Exception: ev={}
              keys=sorted(str(k) for k in ev.keys())[:80] if isinstance(ev,dict) else []
              pairs=safe_walk(ev)
              print('EVIDENCE_SHAPE='+json.dumps({'family':r['family'],'ticker':r['ticker'],'market':r['market'],'settlement':r['settlement'],'source_class':r['source_class'],'observed_at':r['observed_at'],'top_keys':keys,'safe_pairs':pairs[:80]},ensure_ascii=False,sort_keys=True))
          c.close()
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
