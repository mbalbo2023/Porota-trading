name: RC6 isolated IOL family-reference probe 2026-09-25

on:
  push:
    branches:
      - diag/rc6-availability-readonly-20260925

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_diag" "$HOME/.ssh/known_hosts"
      - name: Probe exact read-only IOL response contracts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_diag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          sudo -n env PYTHONPATH=/opt/porota-trading python3 - <<'PY'
          import json
          from iol_mcp_readonly_adapter_rc6 import OAuthStoreReadOnlyMCP
          c=OAuthStoreReadOnlyMCP()
          def summarize(name,args):
              try:
                  r=c.call(name,args)
                  out={"tool":name,"type":type(r).__name__}
                  if isinstance(r,dict):
                      out["keys"]=sorted(r.keys())
                      if name=="get_asset_info":
                          out["sample"]={k:r.get(k) for k in ("symbol","description","market","type","currency","units_per_lot","country","term")}
                      elif name=="get_fixed_income_analytics":
                          out["sample"]={k:r.get(k) for k in ("ticker","instrument_type","payment_currency","maturity_date")}
                          out["calculation_inputs_keys"]=sorted((r.get("calculation_inputs") or {}).keys()) if isinstance(r.get("calculation_inputs"),dict) else []
                      elif name=="simulate_fixed_income_by_nominals":
                          out["sample"]={k:r.get(k) for k in ("ticker","nominals","dirty_price_per100","amount_invested","amount_invested_ars","maturity_date")}
                      elif name=="get_options_chain":
                          opts=r.get("options") if isinstance(r.get("options"),list) else []
                          out["underlying"]=r.get("underlying"); out["count"]=len(opts)
                          out["first"]={k:opts[0].get(k) for k in ("symbol","option_type","strike_price","expiration","bid_price","ask_price","volume","is_stale")} if opts else None
                      elif name=="get_fci_funds":
                          vals=r.get("result") if isinstance(r.get("result"),list) else r.get("funds") if isinstance(r.get("funds"),list) else []
                          out["count"]=len(vals); out["first"]={k:vals[0].get(k) for k in ("asset","description","market","currency","operable","fciType")} if vals else None
                      elif name=="get_caucion_rates":
                          vals=r.get("result") if isinstance(r.get("result"),list) else r.get("rates") if isinstance(r.get("rates"),list) else []
                          out["count"]=len(vals); out["first"]=vals[0] if vals else None
                  print("IOL_TOOL_SHAPE="+json.dumps(out,ensure_ascii=False,sort_keys=True))
              except Exception as exc:
                  print("IOL_TOOL_SHAPE="+json.dumps({"tool":name,"error":type(exc).__name__+":"+str(exc)[:160]},sort_keys=True))
          summarize("get_asset_info",{"symbol":"AL30","market":"BCBA"})
          summarize("get_fixed_income_analytics",{"ticker":"AL30"})
          summarize("simulate_fixed_income_by_nominals",{"ticker":"AL30","nominals":1,"currency":"ARS"})
          summarize("get_options_chain",{"symbol":"GGAL"})
          summarize("get_fci_funds",{})
          summarize("get_caucion_rates",{"currency":"ARS","caucion_type":"colocadora"})
          summarize("get_caucion_rates",{"currency":"USD","caucion_type":"colocadora"})
          PY
          REMOTE
