name: RC6 isolated IOL family-reference probe 2026-09-25

on:
  push:
    branches:
      - diag/rc6-availability-readonly-20260925

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_diag" "$HOME/.ssh/known_hosts"
      - name: Run family reference against live read-only sources in isolated temp root
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_diag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/porota-family-probe.XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT
          cp /opt/porota-trading/data/market/iol_shadow_latest.json "$TMP/iol_shadow_latest.json"
          cd /opt/porota-trading
          sudo -n env PYTHONPATH=/opt/porota-trading PROBE_ROOT="$TMP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from iol_mcp_readonly_adapter_rc6 import OAuthStoreReadOnlyMCP
          import rc6_iol_family_reference as f
          root=Path(os.environ["PROBE_ROOT"])
          result=f.collect(OAuthStoreReadOnlyMCP(),root=root,db_path="/opt/porota-trading/data/paper_v17/observer_v17.db")
          records=[r for r in result.get("records",[]) if isinstance(r,dict)]
          contracts=[r for r in records if isinstance(r.get("financial_contract_v17"),dict) and r.get("financial_contract_v17")]
          def counts(rows):
              out={}
              for r in rows:
                  fam=str(r.get("instrument_type") or r.get("family") or "UNKNOWN")
                  out[fam]=out.get(fam,0)+1
              return out
          print("ISOLATED_FAMILY_REFERENCE="+json.dumps({
              "refreshed_at":result.get("refreshed_at"),
              "records":len(records),"by_family":counts(records),
              "contracts":len(contracts),"contracts_by_family":counts(contracts),
              "fci_count":len(result.get("fci",[]) if isinstance(result.get("fci"),list) else []),
              "caucion_ars_count":len((result.get("cauciones") or {}).get("ARS",[]) if isinstance((result.get("cauciones") or {}).get("ARS",[]),list) else []),
              "caucion_usd_count":len((result.get("cauciones") or {}).get("USD",[]) if isinstance((result.get("cauciones") or {}).get("USD",[]),list) else []),
              "errors":result.get("errors",[])
          },ensure_ascii=False,sort_keys=True))
          for r in contracts[:10]:
              print("CONTRACT_SAMPLE="+json.dumps({
                  "ticker":r.get("ticker"),"family":r.get("instrument_type"),
                  "market":r.get("market"),"currency":r.get("currency"),
                  "settlement":r.get("settlement"),"contract":r.get("financial_contract_v17")
              },ensure_ascii=False,sort_keys=True))
          PY
          REMOTE
