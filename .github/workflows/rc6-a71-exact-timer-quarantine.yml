name: RC6 A71 exact failed and unused timer quarantine
on:
  push:
    branches: [ops/rc6-a71-host-audit-20261025]
    paths: [.github/workflows/rc6-a71-exact-timer-quarantine.yml]
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Guarded exact five-timer deactivation
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a71"
          chmod 600 "$HOME/.ssh/rc6_a71"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/rc6_a71" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'python3 -' > "$RUNNER_TEMP/a71_timer_quarantine.json" <<'PY'
          import datetime,json,subprocess,sys
          units={
            'porota-a3-history-daily-rc6.timer':'porota-a3-history-rc6@DAILY_INCREMENTAL.service',
            'porota-a3-history-reconcile-rc6.timer':'porota-a3-history-rc6@RECONCILE.service',
            'porota-a3-history-weekend-rc6.timer':'porota-a3-history-rc6@WEEKEND_DEEP.service',
            'porota-live-decision-cockpit-rc6.timer':'porota-live-decision-cockpit-rc6.service',
            'porota-1016-github-verify.timer':'porota-1016-github-verify.service'}
          def run(*args):
              p=subprocess.run(['sudo','-n',*args],capture_output=True,text=True,timeout=20)
              if p.returncode:raise RuntimeError('CALL_FAILED:'+args[0])
              return p.stdout.strip()
          def show(unit,fields):
              args=['systemctl','show',unit,'--no-pager']
              for field in fields:args+=['-p',field]
              return dict(row.split('=',1) for row in run(*args).splitlines() if '=' in row)
          receipt={'source_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'scope':'FIVE_EXACT_TIMERS_ONLY','before':{},'after':{},'disabled':[],
                   'ppi_watch':'UNTOUCHED','database_mutation':False}
          fields=('LoadState','ActiveState','UnitFileState','FragmentPath','Triggers','NextElapseUSecRealtime')
          try:
              if any(any(name in job for name in units) for job in run('systemctl','list-jobs','--no-legend','--no-pager').splitlines()):
                  raise RuntimeError('TARGETED_TIMER_JOB_ACTIVE')
              private=show('porota-private-snapshot.service',('ActiveState','UnitFileState'))
              if private.get('ActiveState')!='inactive' or private.get('UnitFileState') not in ('disabled','masked'):
                  raise RuntimeError('PRIVATE_8766_SITE_NOT_DISABLED')
              for timer,service in units.items():
                  state=show(timer,fields);other=show(service,('ActiveState','Result','ExecMainStatus'))
                  receipt['before'][timer]={'state':state,'service':other}
                  if state.get('LoadState')!='loaded' or state.get('ActiveState')!='active' or state.get('UnitFileState')!='enabled':
                      raise RuntimeError('TIMER_STATE_CHANGED')
                  if state.get('FragmentPath')!='/etc/systemd/system/'+timer or state.get('Triggers')!=service:
                      raise RuntimeError('TIMER_WIRING_CHANGED')
                  if other.get('ActiveState')!='failed' and timer.startswith('porota-a3-'):
                      raise RuntimeError('A3_FAILURE_NOT_CURRENT')
                  if timer.startswith('porota-a3-') and (other.get('Result')!='exit-code' or other.get('ExecMainStatus')!='1'):
                      raise RuntimeError('A3_FAILURE_SHAPE_CHANGED')
                  if timer.endswith('1016-github-verify.timer') and state.get('NextElapseUSecRealtime'):
                      raise RuntimeError('LEGACY_TIMER_HAS_NEXT')
                  if timer.endswith('live-decision-cockpit-rc6.timer') and other.get('ActiveState')!='inactive':
                      raise RuntimeError('COCKPIT_COLLECTOR_ACTIVE')
              for timer in units:
                  run('systemctl','disable','--now',timer)
                  receipt['disabled'].append(timer)
              for timer in units:
                  state=show(timer,fields)
                  receipt['after'][timer]=state
                  if state.get('ActiveState')!='inactive' or state.get('UnitFileState')!='disabled':
                      raise RuntimeError('TIMER_STILL_ACTIVE')
              receipt['status']='PASS'
          except Exception as exc:
              receipt['status']='STOPPED';receipt['error_class']=type(exc).__name__
              receipt['error_code']=str(exc)[:120] if type(exc) is RuntimeError else 'UNCLASSIFIED'
          finally:
              receipt['source_end_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          if receipt['status']!='PASS':sys.exit(2)
          PY
          python3 - "$RUNNER_TEMP/a71_timer_quarantine.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));print('A71_TIMER_QUARANTINE='+r['status'])
          print('DISABLED_COUNT='+str(len(r['disabled'])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-a71-timer-quarantine-receipt
          path: ${{ runner.temp }}/a71_timer_quarantine.json
          retention-days: 7
