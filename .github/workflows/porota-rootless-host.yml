name: Porota rootless host

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect Porota's rootless prerequisites without changing the host
        type: choice
        required: true
        default: inspect
        options: [inspect]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      ${{ github.repository == 'mbalbo2023/Porota-trading' &&
          github.ref == 'refs/heads/main' && github.actor == 'mbalbo2023' &&
          inputs.operation == 'inspect' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe fixed RC6 resources through the existing Actions identity
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json, os, re, subprocess, tempfile
          from pathlib import Path
          host, user = os.environ['DO_HOST'], os.environ['DO_USER']
          if (not re.fullmatch(r'[a-zA-Z0-9.:-]+', host) or host.startswith('-')
                  or not re.fullmatch(r'[a-z_][a-z0-9_-]*', user)
                  or not os.environ['DO_SSH_KEY'].strip()
                  or not os.environ['DO_KNOWN_HOSTS'].strip()):
              raise SystemExit('HOST_CONNECTION_CONFIGURATION_INVALID')
          with tempfile.TemporaryDirectory(prefix='porota-ssh-') as directory:
              key, known = Path(directory)/'key', Path(directory)/'known_hosts'
              key.write_text(os.environ['DO_SSH_KEY'].rstrip()+'\n'); key.chmod(0o600)
              known.write_text(os.environ['DO_KNOWN_HOSTS'].rstrip()+'\n'); known.chmod(0o600)
              command = ['ssh', '-i', str(key), '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes',
                         '-o', 'StrictHostKeyChecking=yes', '-o', 'UserKnownHostsFile='+str(known),
                         '-o', 'ConnectTimeout=10', user+'@'+host,
                         'python3 -B - inspect --root /opt/porota-trading']
              result = subprocess.run(command, input=Path('scripts/porota_rootless_setup.py').read_bytes(),
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=180)
              if result.returncode:
                  raise SystemExit('HOST_INSPECTION_FAILED_EXIT_'+str(result.returncode))
              receipt = json.loads(result.stdout)
              if receipt.get('schema') != 'porota.rootless.inspect.v1' or receipt.get('host_mutations') != 0:
                  raise SystemExit('HOST_INSPECTION_RECEIPT_INVALID')
              receipt['control_sha'] = os.environ['GITHUB_SHA']
              receipt['run_id'] = int(os.environ['GITHUB_RUN_ID'])
              output = Path(os.environ['RUNNER_TEMP'])/'rootless-inspect.json'
              output.write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
              print(json.dumps(receipt, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Porota rootless inspection\n\n')
                  summary.write('Read only; host mutations: 0. Runtime validation: NO_VERIFICADO.\n\n')
                  summary.write('```json\n'+json.dumps(receipt, indent=2, sort_keys=True)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: porota-rootless-inspect-${{ github.run_id }}
          path: ${{ runner.temp }}/rootless-inspect.json
          if-no-files-found: error
          retention-days: 30
