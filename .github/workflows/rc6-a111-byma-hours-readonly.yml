name: RC6 A111 BYMA published hours read only

on:
  push:
    branches: [audit/rc6-a111-byma-hours-20261026]
    paths: [.github/workflows/rc6-a111-byma-hours-readonly.yml]

permissions:
  contents: read

jobs:
  published-hours:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract bounded official timetable
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://cdn.prod.website-files.com/6697a441a50c6b926e1972e0/6ab2dda27ea9e2c80e659a15_BYMA-COM19024-Horarios_de_Negociacion_Liquidacion_Recepcion-v2.pdf'
          curl --fail --silent --show-error --location --max-time 30 --retry 1 \
            --max-filesize 2000000 "$url" -o /tmp/byma-com19024.pdf
          test "$(head -c 4 /tmp/byma-com19024.pdf)" = '%PDF'
          test "$(stat -c %s /tmp/byma-com19024.pdf)" -le 2000000
          python3 -m pip install --quiet --disable-pip-version-check --no-input pypdf==5.9.0
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pages = PdfReader('/tmp/byma-com19024.pdf').pages
          if not 1 <= len(pages) <= 20:
              raise SystemExit('BYMA_PAGE_BUDGET_UNVERIFIED')
          Path('/tmp/byma-com19024.txt').write_text('\n'.join(
              page.extract_text(extraction_mode='layout') or '' for page in pages))
          print('PDF_PAGES=' + str(len(pages)))
          PY
          sha256sum /tmp/byma-com19024.pdf | awk '{print "OFFICIAL_PDF_SHA256=" $1}'
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/byma-com19024.txt').read_text(errors='replace').splitlines()
          print('PDF_TEXT_LINES=' + str(len(lines)))
          matches = [(n + 1, ' '.join(line.split())) for n, line in enumerate(lines)
                     if re.search(r'\b(?:1[0-9]|20|21):[0-5][0-9]\b|octubre|noviembre|02/11|2/11|vigencia|horarios', line, re.I)]
          if not matches or len(matches) > 160:
              raise SystemExit('BYMA_TIMETABLE_EXTRACTION_UNVERIFIED')
          for n, line in matches:
              print(f'BYMA_HOURS_LINE={n}|{line[:220]}')
          PY
