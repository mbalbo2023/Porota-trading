name: RC6 Wave2 PPI 1.3.0 Runtime Deploy 2026-09-08

on:
  push:
    branches: [deploy/rc6-wave2-ppi130-runtime-20260908]
    paths:
      - 'requirements.txt'
      - '.github/workflows/rc6-wave2-ppi130-runtime-validate-20260908.yml'
      - '.github/workflows/rc6-wave2-ppi130-runtime-deploy-20260908.yml'

permissions:
  contents: read

concurrency:
  group: rc6-wave2-ppi130-runtime-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact deployed Wave1B ancestry and diff gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=860b26ca22a73679217e8953207041da2b8afffd
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          got=set(Path('/tmp/changed.txt').read_text().splitlines())
          allowed={
            'requirements.txt',
            '.github/workflows/rc6-wave2-ppi130-runtime-validate-20260908.yml',
            '.github/workflows/rc6-wave2-ppi130-runtime-deploy-20260908.yml',
          }
          assert got <= allowed, sorted(got-allowed)
          assert 'requirements.txt' in got
          print('WAVE2_PPI130_DIFF_SCOPE=GREEN')
          PY
      - name: Resolve canonical dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import importlib.metadata as m
          assert m.version('ppi-client') == '1.3.0'
          assert m.version('signalrcorePPI') == '0.9.2'
          assert m.version('websocket-client') == '1.0.0'
          print('PPI_CLIENT_VERSION=1.3.0')
          print('PPI_DEPENDENCY_CONTRACT=GREEN')
          PY
      - name: Compile and focused safety regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile bd_ppi_readonly_guard.py bv_paper_runtime.py m_instrument_universe.py bf_production_paper_observer.py
          python -m pytest -q tests/test_rc6_no_budget_permission_probe.py tests/test_rc6_operational_alerts.py tests/test_rc6_wave1b_sla_scraping.py
      - name: No order-route expansion invariant
        shell: bash
        run: |
          set -euo pipefail
          BASE=860b26ca22a73679217e8953207041da2b8afffd
          git diff --name-only "$BASE" HEAD | grep -Ev '^(requirements.txt|.github/workflows/rc6-wave2-ppi130-runtime-validate-20260908.yml|.github/workflows/rc6-wave2-ppi130-runtime-deploy-20260908.yml)$' && exit 1 || true
          echo 'ORDER_ROUTE_EXPANSION=NO'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ROLLBACK_AUTOMATICO=NO'
      - name: Build exact candidate image
        run: |
          set -euo pipefail
          docker build --pull=false --label "porota.commit=$GITHUB_SHA" --label 'porota.wave=rc6-wave2-ppi130' -t porota-wave2:${GITHUB_SHA} .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m --tmpfs /app/data:rw,nosuid,nodev,size=64m --entrypoint python porota-wave2:${GITHUB_SHA} - <<'PY'
          import importlib.metadata as m
          import _version
          assert _version.VERSION=='17.0.0-rc6'
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'
          assert m.version('ppi-client')=='1.3.0'
          import bd_ppi_readonly_guard, bv_paper_runtime, m_instrument_universe, bf_production_paper_observer
          print('IMAGE_INVARIANTS=GREEN')
          print('PPI_CLIENT_RUNTIME_CANDIDATE=1.3.0')
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_wave2"
          chmod 600 "$HOME/.ssh/porota_wave2"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Preflight and deploy without automatic rollback
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: deploy/rc6-wave2-ppi130-runtime-20260908
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_wave2" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          EXPECTED_BASE=860b26ca22a73679217e8953207041da2b8afffd
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          cd "$REPO"
          echo '=== WAVE2 PPI130 PRECHECK ==='
          echo "UTC=$(date -u +%FT%TZ)"
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA"
          test "$CURRENT_SHA" = "$EXPECTED_BASE"
          TRACKED_DIFF=$(git diff --name-only)
          printf '%s\n' "$TRACKED_DIFF"
          python3 - "$TRACKED_DIFF" <<'PY'
          import sys
          got={x for x in sys.argv[1].splitlines() if x}
          allowed={'scripts/porota_export_runtime_logs_hf6.sh','scripts/porota_export_scheduler_state_hf6.sh'}
          assert got <= allowed, sorted(got-allowed)
          print('HOST_TRACKED_DIFF_GATE=GREEN')
          PY
          sudo -n docker inspect -f 'OBSERVER_RUNNING={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD_RUNNING={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'PRE_DB={q}|{mode}|{real}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          sudo -n test -r /opt/porota-trading/.secrets/ppi_production.json
          echo 'PPI_CANONICAL_SECRET_READABLE_VIA_SUDO=GREEN'
          FREE=$(df -PB1 "$REPO" | awk 'NR==2{print $4}')
          echo "DISK_FREE_PRE=$FREE"
          test "$FREE" -ge 6442450944

          echo '=== FETCH / TARGET PROOF ==='
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$TARGET_SHA"
          git diff --name-only "$EXPECTED_BASE" "$TARGET_SHA" | sort

          echo '=== HOST BUILD ==='
          TMP=$(mktemp -d "$HOME/porota-wave2.XXXXXX")
          trap 'git -C "$REPO" worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label 'porota.wave=rc6-wave2-ppi130' -t "$TARGET_IMAGE" "$TMP/source"
          test "$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"
          sudo -n docker run --rm --network none --entrypoint python "$TARGET_IMAGE" - <<'PY'
          import importlib.metadata as m
          assert m.version('ppi-client')=='1.3.0'
          print('HOST_IMAGE_PPI_CLIENT=1.3.0')
          PY

          echo '=== ACTIVATE — NO AUTOMATIC ROLLBACK POLICY ==='
          git checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          chmod 0755 scripts/porota_export_runtime_logs_hf6.sh scripts/porota_export_scheduler_state_hf6.sh 2>/dev/null || true
          git branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH" >/dev/null 2>&1 || true
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation

          echo '=== POSTFLIGHT ==='
          sleep 10
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import importlib.metadata as m
          import sqlite3
          assert m.version('ppi-client')=='1.3.0'
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'POST_DB={q}|{mode}|{real}')
          print('POST_PPI_CLIENT=1.3.0')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer)" = 'true|0|porota-trading-bot:17.0.0-rc6'
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)" = 'true|0|porota-trading-bot:17.0.0-rc6'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'ROLLBACK_AUTOMATICO=NO'
          echo 'WAVE2_PPI130_DEPLOY=GREEN'
          REMOTE
      - name: Failure diagnostics only — never rollback
        if: failure()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set +e
          ssh -i "$HOME/.ssh/porota_wave2" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          echo '=== WAVE2 PPI130 FAILURE DIAGNOSTICS READ ONLY ==='
          date -u
          cd /opt/porota-trading 2>/dev/null || exit 0
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null)"
          git status --short 2>/dev/null | head -n 40
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer 2>/dev/null || true
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard 2>/dev/null || true
          sudo -n docker logs --tail 120 porota_production_observer 2>&1 | sed -E 's/(Bearer|Authorization:)[[:space:]]+[A-Za-z0-9._~+\/-]+/\1 <REDACTED>/Ig; s/(token|secret|password|cookie|api[_-]?key)(["= :]+)[^ ,}"[:space:]]+/\1\2<REDACTED>/Ig' || true
          echo 'ROLLBACK_PERFORMED=NO'
          echo 'NEXT_ACTION=RCA_FIX_REVALIDATE_REDEPLOY_OR_REQUEST_USER_ROLLBACK_AUTHORIZATION'
          REMOTE
          exit 1
