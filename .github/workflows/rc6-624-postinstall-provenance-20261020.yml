name: RC6 624 read-only postinstall provenance
on:
  push:
    branches:
      - diagnostic/rc6-624-intraday-position-inventory-20261020
    paths:
      - .github/workflows/rc6-624-postinstall-provenance-20261020.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_read"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_read" "$HOME/.ssh/known_hosts"
          timeout 65 ssh -i "$HOME/.ssh/rc6_read" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "sudo -n python3 -" <<'PY'
          import json
          from pathlib import Path
          root=Path('/opt/porota-trading/data/deploy')
          p=root/'CURRENT_STATE_V2.json'
          state=json.loads(p.read_text()) if p.exists() else None
          rows=[]
          for p in root.glob('quiescence-*.json'):
              if p.is_symlink() or p.stat().st_size>65536: continue
              r=json.loads(p.read_text())
              if r.get('recorded_at','').startswith('2026-10-20'):
                  rows.append({'candidate':r.get('candidate_sha'),'status':r.get('status'),
                    'installation_started':r.get('installation_started'),'recorded_at':r.get('recorded_at'),
                    'market_open_suspended':r.get('market_open_suspended'),
                    'open_paper_carryover':r.get('open_paper_carryover'),
                    'containers':{n:(v.get('id'),v.get('image')) for n,v in r.get('containers',{}).items()}})
          print('RC6_POSTINSTALL_PROVENANCE='+json.dumps({'current_state':state,'receipts':rows},sort_keys=True))
          PY
          timeout 65 ssh -i "$HOME/.ssh/rc6_read" -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "sudo -n python3 -" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path('/opt/porota-trading')
          sys.path.insert(0,str(root))
          from scripts import rc6_cold2_quarantine as old
          shadow,source,_=old.paths(root)
          pointer=old.envelope(shadow/'CURRENT.json')
          cut=old.envelope(shadow/pointer['file'],zipped=True)
          ref=cut['report']['computed_report']
          ident=ref['snapshot_id']
          archive=root/'data/deploy'/('rc6-failed-cold-'+ident)
          def get(name):
              p=source/name
              return p if p.exists() else archive/name
          m=old.envelope(get('manifest-'+ident+'.json'),cold=True)
          r=old.envelope(get('receipt-'+ident+'.json'),cold=True)
          q=old.envelope(get('queue.json'),cold=True)
          h=old.digest(m)
          checks={
            'epoch':m.get('epoch')=='rc6.audit-actual-values.v1',
            'snapshot':m.get('snapshot_id')==ident,
            'pack':m.get('pack')==ident+'.pack',
            'identity':isinstance(m.get('pack_identity'),list) and len(m['pack_identity'])==5,
            'sealed_type':type(m.get('sealed_at')) in (float,int),
            'deadline':m.get('deadline_at')==m.get('sealed_at',0)+30.0,
            'ref_manifest':ref.get('manifest_sha256')==h,
            'ref_deadline':ref.get('deadline_at')==m.get('deadline_at'),
            'ref_source_as_of':ref.get('source_as_of')==m.get('source_as_of'),
            'ref_config':ref.get('configuration_fingerprint')==m.get('configuration_fingerprint'),
            'receipt_id':r.get('snapshot_id')==ident,
            'receipt_state':r.get('state')=='FAILED',
            'receipt_manifest':r.get('manifest_sha256')==h,
            'receipt_error_class':r.get('error_class')=='ValueError',
            'receipt_error_code':r.get('error_code')=='SHADOW_COLD_DEADLINE_EXPIRED_OR_CLOCK_REGRESSED',
            'receipt_error_phase':r.get('error_phase')=='REPORT_WRITE',
            'failed_type':type(r.get('failed_at')) in (float,int),
            'failed_range':m.get('sealed_at',0)<=r.get('failed_at',-1)<=m.get('deadline_at',0)+5,
            'queue_id':q.get('snapshot_id')==ident,
            'queue_state':q.get('state')=='FAILED',
            'queue_manifest':q.get('manifest_sha256')==h,
          }
          print('RC6_SUCCESSOR_BINDING_DIAG='+json.dumps({'id':ident,'checks':checks,
            'sealed_at':m.get('sealed_at'),'deadline_at':m.get('deadline_at'),
            'failed_at':r.get('failed_at'),'error_class':r.get('error_class'),
            'error_code':r.get('error_code'),'error_phase':r.get('error_phase'),
            'queue_state':q.get('state'),'receipt_state':r.get('state'),
            'source_names':sorted(p.name for p in source.iterdir()),
            'archive_names':sorted(p.name for p in archive.iterdir()) if archive.exists() else []},sort_keys=True))
          PY
          rm -f "$HOME/.ssh/rc6_read"
