name: RC6 624 read-only postinstall provenance
on:
  push:
    branches:
      - diagnostic/rc6-624-intraday-position-inventory-20261020
    paths:
      - .github/workflows/rc6-624-postinstall-provenance-20261020.yml
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Strict SSH
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_read"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_read" "$HOME/.ssh/known_hosts"
      - name: Read-only native status and exact owned provenance
        run: |
          set -Eeuo pipefail
          timeout 100 ssh -i "$HOME/.ssh/rc6_read" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "sudo -n python3 -" <<'PY'
          import json, gzip, sqlite3, subprocess, shutil
          from pathlib import Path
          root=Path('/opt/porota-trading')
          shadow=root/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow'
          def doc(p, zipped=False):
              if p.is_symlink() or not p.is_file() or p.stat().st_size>4194304: return None
              try:
                  with (gzip.open(p,'rt') if zipped else p.open()) as f: value=json.load(f)
                  return value.get('payload',value) if isinstance(value,dict) else value
              except (OSError,ValueError): return None
          def choose(d,keys):
              return {k:d.get(k) for k in keys} if isinstance(d,dict) else None
          state=doc(root/'data/deploy/CURRENT_STATE_V2.json')
          current=doc(shadow/'CURRENT.json')
          status=doc(shadow/'status.json')
          health=doc(shadow.parent/'runtime-health.json')
          cut=None
          if isinstance(current,dict):
              name=current.get('file')
              if isinstance(name,str) and name.startswith('cut-') and name.endswith('.json.gz') and '/' not in name:
                  cut=doc(shadow/name,True)
          source=shadow/'cold-audit'
          queue=doc(source/'queue.json')
          receipt=None
          if isinstance(queue,dict):
              ident=queue.get('snapshot_id')
              if isinstance(ident,str) and len(ident)==32 and all(c in '0123456789abcdef' for c in ident):
                  receipt=doc(source/('receipt-'+ident+'.json'))
          containers={}
          for name in ('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6'):
              p=subprocess.run(['docker','inspect',name],capture_output=True,text=True,timeout=10)
              if p.returncode:
                  containers[name]='ABSENT'
              else:
                  row=json.loads(p.stdout)[0]
                  containers[name]={'id':row['Id'],'image':row['Image'],'status':row['State']['Status'],'exit_code':row['State']['ExitCode'],'oom':row['State']['OOMKilled'],'restarts':row['RestartCount'],'health':(row['State'].get('Health') or {}).get('Status')}
          with sqlite3.connect((root/'data/paper_v17/observer_v17.db').as_uri()+'?mode=ro',uri=True) as db:
              mode,orders,process=db.execute('SELECT mode,real_orders_sent,process_state FROM observer_state WHERE id=1').fetchone()
              spots=db.execute("SELECT COUNT(*) FROM paper_positions WHERE status='OPEN'").fetchone()[0]
          report={'current_state':choose(state,('candidate_sha','validation_status','image_id','real_orders_sent')),
                  'containers':containers,'paper':{'mode':mode,'orders':orders,'process':process,'spots':spots},
                  'shadow_status':choose(status,('status','as_of','error_code','error_module','error_line','failure_reason','generation_timing','runtime_sql_diagnostics')),
                  'health':choose(health,('source_sha','candidate_tree_sha','status','as_of','error_code')),
                  'pointer':choose(current,('generation_id','sequence','file')),
                  'cut_status':choose(cut.get('status') if isinstance(cut,dict) else None,('status','as_of','error_code','error_module','error_line')),
                  'cut_reference':choose((cut.get('report') or {}).get('computed_report') if isinstance(cut,dict) else None,('state','snapshot_id','deadline_at')),
                  'cold_queue':choose(queue,('state','snapshot_id','error_code')),
                  'cold_receipt':choose(receipt,('state','error_code','error_phase','failed_at')),
                  'disk_free':shutil.disk_usage('/').free}
          assert mode=='PRODUCTION_PAPER' and type(orders) is int and orders==0
          print('RC6_NATIVE_POSTFAIL_DIAG='+json.dumps(report,sort_keys=True,default=str))
          PY
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/rc6_read"
