name: RC6 Deploy RCA Post-Immediate Read-Only 2026-09-30

on:
  push:
    branches:
      - audit/ws-deploy-rca-post-immediate-readonly-20260930
    paths:
      - '.github/workflows/rc6-deploy-rca-post-immediate-readonly-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post_immediate_readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Exercise full runtime auditor and remaining gates without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          IMAGE='porota-trading-bot:17.0.0-rc6'
          DB="$REPO/data/paper_v17/observer_v17.db"

          echo "RCA_POST_IMMEDIATE_BEGIN"
          sudo -n docker inspect -f 'RCA_IMAGE={{.Image}}|status={{.State.Status}}|oom={{.State.OOMKilled}}|restarts={{.RestartCount}}' porota_production_dashboard
          sudo -n docker inspect -f 'RCA_OBSERVER_IMAGE={{.Image}}|status={{.State.Status}}|oom={{.State.OOMKilled}}|restarts={{.RestartCount}}' porota_production_observer
          SAFETY="$(sudo -n timeout 15 python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=3)
          c.execute("PRAGMA query_only=ON")
          row=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()
          print(f"{row[0]}|{int(row[1] or 0)}")
          PY
          )"
          echo "RCA_SAFETY=$SAFETY"
          test "$SAFETY" = "PRODUCTION_PAPER|0"

          COMMON=(
            sudo -n docker run --rm --pull never --network host --read-only
            --user botuser --cap-drop ALL --security-opt no-new-privileges:true
            --tmpfs /tmp:rw,noexec,nosuid,size=64m
            --env-file "$REPO/data/diagnosticos/dashboard_mode_v17.env"
            -e PAPER_V17_DB_PATH=/app/data/paper_v17/observer_v17.db
            -e DATA_DIR=/app/data
            -e SERVER_TIMEZONE=America/Argentina/Buenos_Aires
            -e PAPER_SCALPING_MODE=ACTIVE_PAPER
            -e PAPER_CAUCION_SWEEP_MODE=ACTIVE_PAPER
            -v "$REPO/data:/app/data:ro"
          )

          set +e
          FULL="$("${COMMON[@]}" --entrypoint python "$IMAGE" \
            /app/scripts/rc6_zero_known_error_runtime_audit.py \
            --label rca-full-main --output /tmp/rca-full-main.json 2>&1)"
          FULL_RC=$?
          set -e
          echo "$FULL"
          echo "RCA_FULL_MAIN_RC=$FULL_RC"
          test "$FULL_RC" -eq 0
          grep -Fq 'POROTA_ZERO_KNOWN_ERROR_RUNTIME_AUDIT=GREEN|rca-full-main' <<< "$FULL"
          grep -Fq 'ZERO_KNOWN_P0=YES' <<< "$FULL"
          grep -Fq 'ZERO_KNOWN_P1=YES' <<< "$FULL"
          grep -Fq 'DASHBOARD_TRUTH=CONSISTENT' <<< "$FULL"
          echo "RCA_FULL_MAIN_OUTPUT_WRITE_TMPFS=GREEN"

          # Exercise the same baseline/stability contract without writing the host DB
          # or the host evidence directory. Each snapshot only reads runtime truth.
          set +e
          STABILITY="$("${COMMON[@]}" --entrypoint python "$IMAGE" - 2>&1 <<'PY'
          import time
          from scripts import rc6_zero_known_error_runtime_audit as audit
          baseline=audit.collect("rca-stability-baseline")
          audit._assert_snapshot(baseline)
          print("RCA_STABILITY_BASELINE=GREEN", flush=True)
          for cycle in range(1,4):
              time.sleep(35)
              snap=audit.collect(f"rca-stability-{cycle}")
              audit._assert_snapshot(snap, baseline)
              print(f"RCA_STABILITY_{cycle}=GREEN", flush=True)
          PY
          )"
          STABILITY_RC=$?
          set -e
          echo "$STABILITY"
          echo "RCA_STABILITY_RC=$STABILITY_RC"
          test "$STABILITY_RC" -eq 0
          grep -Fq 'RCA_STABILITY_1=GREEN' <<< "$STABILITY"
          grep -Fq 'RCA_STABILITY_2=GREEN' <<< "$STABILITY"
          grep -Fq 'RCA_STABILITY_3=GREEN' <<< "$STABILITY"

          # Exact dry preopen phase gates are explicitly read-only/no-order tests.
          for phase in T_MINUS_45 T_MINUS_10; do
            PREOPEN="$(sudo -n timeout 300 python3 "$REPO/rc6_preopen.py" --phase "$phase" 2>&1)"
            echo "$PREOPEN"
            grep -Fq '"status": "GREEN"' <<< "$PREOPEN"
            grep -Fq '"read_only": true' <<< "$PREOPEN"
            grep -Fq '"network_order_test_performed": false' <<< "$PREOPEN"
            echo "RCA_PREOPEN_${phase}=GREEN"
          done

          RECENT_CRITICAL="$({
            sudo -n docker logs --since 20m porota_production_observer 2>&1 || true
            sudo -n docker logs --since 20m porota_production_dashboard 2>&1 || true
          } | grep -E 'Traceback|REAL_ORDER_CAPABILITY=(ENABLED|REAL)|real_orders_sent=[1-9][0-9]*' || true)"
          test -z "$RECENT_CRITICAL"
          echo "RCA_RECENT_CRITICAL_LOG_SIGNATURES=0"

          PPI_WATCH="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          printf 'RCA_PPI_WATCH_READ_ONLY=%s\n' "$PPI_WATCH"
          echo "RCA_POST_IMMEDIATE_READ_ONLY=GREEN"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
