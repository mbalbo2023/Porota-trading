name: RC6 Deploy RCA Post-Immediate Read-Only 2026-09-30

on:
  push:
    branches:
      - audit/ws-deploy-rca-post-immediate-readonly-20260930
    paths:
      - '.github/workflows/rc6-deploy-rca-post-immediate-readonly-20260930.yml'

permissions:
  contents: read

jobs:
  observer_restart_window_readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Read exact observer restart window
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DB=/opt/porota-trading/data/paper_v17/observer_v17.db
          echo "RCA_RESTART_WINDOW_STATE=$(sudo -n docker inspect -f 'status={{.State.Status}}|started={{.State.StartedAt}}|restarts={{.RestartCount}}|oom={{.State.OOMKilled}}|exit={{.State.ExitCode}}|error={{.State.Error}}' porota_production_observer)"
          echo "RCA_RESTART_WINDOW_LOGS_BEGIN"
          sudo -n docker logs \
            --since '2026-09-30T14:38:30Z' \
            --until '2026-09-30T14:46:00Z' \
            --timestamps porota_production_observer 2>&1 | tail -n 700 || true
          echo "RCA_RESTART_WINDOW_LOGS_END"
          echo "RCA_RESTART_WINDOW_DOCKERD_BEGIN"
          sudo -n journalctl -u docker.service \
            --since '2026-09-30 14:38:30 UTC' \
            --until '2026-09-30 14:46:00 UTC' \
            --no-pager 2>/dev/null | tail -n 400 || true
          echo "RCA_RESTART_WINDOW_DOCKERD_END"
          SAFETY="$(sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=3)
          c.execute("PRAGMA query_only=ON")
          row=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()
          print(f"{row[0]}|{int(row[1] or 0)}")
          PY
          )"
          echo "RCA_RESTART_WINDOW_SAFETY=$SAFETY"
          test "$SAFETY" = "PRODUCTION_PAPER|0"
          echo "RCA_RESTART_WINDOW_READ_ONLY=GREEN"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
