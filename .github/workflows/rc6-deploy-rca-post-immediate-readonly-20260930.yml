name: RC6 Deploy RCA Post-Immediate Read-Only 2026-09-30

on:
  push:
    branches:
      - audit/ws-deploy-rca-post-immediate-readonly-20260930
    paths:
      - '.github/workflows/rc6-deploy-rca-post-immediate-readonly-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer_lock_readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Isolate observer database-lock restart without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          DB="$REPO/data/paper_v17/observer_v17.db"

          echo "RCA_LOCK_CONTAINER=$(sudo -n docker inspect -f 'status={{.State.Status}}|started={{.State.StartedAt}}|oom={{.State.OOMKilled}}|restarts={{.RestartCount}}|image={{.Image}}|policy={{.HostConfig.RestartPolicy.Name}}' porota_production_observer)"
          echo "RCA_LOCK_PROCESSES_BEGIN"
          sudo -n docker top porota_production_observer -eo pid,ppid,etime,comm,args || true
          echo "RCA_LOCK_PROCESSES_END"

          echo "RCA_LOCK_LOG_CONTEXT_BEGIN"
          sudo -n docker logs --since 60m --timestamps porota_production_observer 2>&1 | \
            grep -B 25 -A 35 -E 'database is locked|Traceback \(most recent call last\)|Fatal Python error|segmentation|MemoryError|OperationalError' | \
            tail -n 260 || true
          echo "RCA_LOCK_LOG_CONTEXT_END"

          echo "RCA_LOCK_KERNEL_OOM_BEGIN"
          sudo -n journalctl -k --since '60 minutes ago' --no-pager 2>/dev/null | \
            grep -Ei 'out of memory|oom-kill|killed process' | tail -n 80 || true
          echo "RCA_LOCK_KERNEL_OOM_END"

          sudo -n timeout 20 python3 - "$DB" <<'PY'
          import sqlite3,sys,json
          path=sys.argv[1]
          c=sqlite3.connect(f"file:{path}?mode=ro",uri=True,timeout=5)
          c.execute("PRAGMA query_only=ON")
          pragmas={}
          for name in ("journal_mode","locking_mode","busy_timeout","cache_size"):
              try:
                  pragmas[name]=c.execute(f"PRAGMA {name}").fetchone()[0]
              except sqlite3.Error as exc:
                  pragmas[name]=type(exc).__name__
          print("RCA_LOCK_PRAGMAS="+json.dumps(pragmas,sort_keys=True))
          row=c.execute("SELECT mode,process_state,session_state,ppi_auth,heartbeat_at,real_orders_sent,detail FROM observer_state WHERE id=1").fetchone()
          print("RCA_LOCK_OBSERVER_STATE="+json.dumps(list(row),default=str))
          c.close()
          PY

          SAFETY="$(sudo -n timeout 15 python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=3)
          c.execute("PRAGMA query_only=ON")
          row=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()
          print(f"{row[0]}|{int(row[1] or 0)}")
          PY
          )"
          echo "RCA_LOCK_SAFETY=$SAFETY"
          test "$SAFETY" = "PRODUCTION_PAPER|0"
          echo "RCA_OBSERVER_LOCK_READ_ONLY=GREEN"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
