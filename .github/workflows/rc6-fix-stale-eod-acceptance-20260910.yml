name: RC6 Fix Stale EOD Acceptance 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-fix-stale-eod-acceptance-20260910.yml

permissions:
  contents: write

jobs:
  repair-stale-eod-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable RC6 PAPER safety identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py

      - name: Replace stale hard-coded EOD acceptance with clock-derived assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_rc4_acceptance.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_rc4_max_hold_reports_when_eod_dominates_without_retuning():
              from rc4_validation import max_hold_effectiveness
              row=max_hold_effectiveness(360)
              assert row['earliest_open_to_forced_eod_minutes']==345
              assert row['effective_ceiling_minutes']==345
              assert row['state']=='DOMINATED_BY_EOD'
              assert row['parameter_change_allowed'] is False
          '''
          new = '''def test_rc4_max_hold_uses_current_session_clock_without_stale_magic_number():
              from rc4_validation import max_hold_effectiveness
              from bq_exit_policy import PaperSessionPolicy
              policy = PaperSessionPolicy()
              open_minutes = policy.open_time.hour * 60 + policy.open_time.minute
              close_minutes = policy.close_time.hour * 60 + policy.close_time.minute
              eod_minutes = close_minutes - open_minutes - policy.exit_minutes
              row = max_hold_effectiveness(360, policy=policy)
              assert row['earliest_open_to_forced_eod_minutes'] == eod_minutes
              assert row['effective_ceiling_minutes'] == min(360, eod_minutes)
              assert row['state'] == ('DOMINATED_BY_EOD' if 360 > eod_minutes else 'REACHABLE')
              assert row['parameter_change_allowed'] is False

          def test_rc4_max_hold_reports_when_eod_really_dominates_without_retuning():
              from rc4_validation import max_hold_effectiveness
              from bq_exit_policy import PaperSessionPolicy
              policy = PaperSessionPolicy()
              open_minutes = policy.open_time.hour * 60 + policy.open_time.minute
              close_minutes = policy.close_time.hour * 60 + policy.close_time.minute
              eod_minutes = close_minutes - open_minutes - policy.exit_minutes
              row = max_hold_effectiveness(eod_minutes + 1, policy=policy)
              assert row['earliest_open_to_forced_eod_minutes'] == eod_minutes
              assert row['effective_ceiling_minutes'] == eod_minutes
              assert row['state'] == 'DOMINATED_BY_EOD'
              assert row['parameter_change_allowed'] is False
          '''
          if old not in s:
              raise SystemExit('STALE_EOD_BLOCK_NOT_FOUND_FAIL_CLOSED')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('EOD_TEST_PATCH=APPLIED')
          PY

      - name: Prove isolated EOD acceptance behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          PYTHONPATH=. pytest -q tests/test_rc4_acceptance.py -k 'max_hold'
          echo 'EOD_ACCEPTANCE_ISOLATED=GREEN'
          echo 'RUNTIME_MUTATIONS=NONE'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'

      - name: Commit only the acceptance-test repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_rc4_acceptance.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'tests/test_rc4_acceptance.py'
          git commit -m 'test(rc6): derive EOD max-hold expectations from active session clock'
          git push origin HEAD:${GITHUB_REF_NAME}
