name: RC6 Wave12 Cotizaciones-Only Materialize 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths:
      - '.github/workflows/rc6-wave12-cotizaciones-only-materialize-20260909.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: deploy-prep/rc6-wave12-currentbase-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce canonical route policy and test
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('rc6_trusted_browser_contract_collector.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            '"CONTRACT_EVIDENCE_DYNAMIC": ["/Cotizaciones/Bonos", "/Operar/Bonos", "/Operar/Ons"],':'"CONTRACT_EVIDENCE_DYNAMIC": ["/Cotizaciones/Bonos"],',
            '"CONTRACT_EVIDENCE_CAUCIONES": ["/Cotizaciones/Cauciones", "/Operar/Cauciones"],':'"CONTRACT_EVIDENCE_CAUCIONES": ["/Cotizaciones/Cauciones"],',
            '"CONTRACT_EVIDENCE_AUCTIONS": ["/Cotizaciones/Licitaciones", "/Operar/Licitaciones"],':'"CONTRACT_EVIDENCE_AUCTIONS": ["/Cotizaciones/Licitaciones"],',
            '"CONTRACT_EVIDENCE_DERIVATIVES": ["/Cotizaciones/Opciones", "/Cotizaciones/Futuros", "/Operar/Opciones", "/Operar/260"],':'"CONTRACT_EVIDENCE_DERIVATIVES": ["/Cotizaciones/Opciones", "/Cotizaciones/Futuros"],',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('EXPECTED_ROUTE_BLOCK_NOT_FOUND:'+old[:60])
              s=s.replace(old,new)
          old='''        "/Cotizaciones/Futuros", "/Cotizaciones/Letras", "/Cotizaciones/Licitaciones", "/Cotizaciones/Ons",\n        "/Cotizaciones/Opciones", "/Cotizaciones/Indices", "/Cotizaciones/Monedas", "/Cotizaciones/Tasas",\n        "/Operar/FCIs", "/Operar/FCIsExterior", "/Operar/Acciones", "/Operar/AccionesExterior", "/Operar/Bonos",\n        "/Operar/Cauciones", "/Operar/Cedears", "/Operar/ETFs", "/Operar/260", "/Operar/Letras", "/Operar/Ons",\n        "/Operar/Opciones", "/Operar/Licitaciones", "/Operar/Canjes"],'''
          new='''        "/Cotizaciones/Futuros", "/Cotizaciones/Letras", "/Cotizaciones/Licitaciones", "/Cotizaciones/Ons",\n        "/Cotizaciones/Opciones", "/Cotizaciones/Indices", "/Cotizaciones/Monedas", "/Cotizaciones/Tasas"],'''
          if old not in s:
              raise SystemExit('EXPECTED_FULL_BROWSER_OPERAR_BLOCK_NOT_FOUND')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cat > tests/test_rc6_contract_routes_cotizaciones_only.py <<'PY'
          import rc6_trusted_browser_contract_collector as c
          
          def test_all_navigation_routes_are_cotizaciones_only():
              routes=[r for group in c.ROUTES.values() for r in group]
              assert routes
              assert all(r.startswith('/Cotizaciones/') for r in routes), routes
              assert not any('/Operar' in r or '/Orden' in r for r in routes)
          
          def test_collector_network_methods_remain_read_only():
              assert c.SAFE_METHODS == {'GET','HEAD','OPTIONS'}
          PY
          python -m pip install -q pytest
          PYTHONPATH=. pytest -q tests/test_contract_evidence_reauth_wiring_rc6.py tests/test_ppi_web_reauth_rc6.py tests/test_rc6_contract_routes_cotizaciones_only.py
          python - <<'PY'
          import rc6_trusted_browser_contract_collector as c
          routes=[r for rs in c.ROUTES.values() for r in rs]
          assert all(r.startswith('/Cotizaciones/') for r in routes)
          assert c.SAFE_METHODS == {'GET','HEAD','OPTIONS'}
          print('SCRAPING_ROUTE_POLICY=COTIZACIONES_ONLY')
          print('ORDER_ROUTES=NOT_PRESENT')
          print('REAL_ORDER_TEST=NOT_PERFORMED')
          PY
          git diff --check
      - name: Commit materialized policy
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'porota-rc6-ci'
          git config user.email 'porota-rc6-ci@users.noreply.github.com'
          git add rc6_trusted_browser_contract_collector.py tests/test_rc6_contract_routes_cotizaciones_only.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rc6 wave12): enforce Cotizaciones-only navigation'
          git push origin HEAD:deploy-prep/rc6-wave12-currentbase-20260909
