name: RC6 BYMA Calendar Fail-Closed Hotfix 2026-09-09

on:
  push:
    branches: [hotfix/rc6-byma-calendar-failclosed-20260909]
    paths:
      - '.github/workflows/rc6-byma-calendar-failclosed-hotfix-20260909.yml'

permissions:
  contents: write

concurrency:
  group: porota-rc6-runtime-deploy
  cancel-in-progress: false

jobs:
  materialize-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Materialize minimal fail-closed fix and injection test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('bf_production_paper_observer.py')
          s=p.read_text(encoding='utf-8')
          old='''def _business_day(day):\n    try:\n        import ak_byma_calendar as calendar\n        return bool(calendar.es_dia_habil_operativo(day))\n    except Exception:\n        return day.weekday() < 5\n'''
          new='''def _business_day(day):\n    try:\n        import ak_byma_calendar as calendar\n        return bool(calendar.es_dia_habil_operativo(day))\n    except Exception:\n        # Safety gate: without a verifiable BYMA calendar, never admit a PAPER session.\n        return False\n'''
          assert old in s, 'expected legacy fail-open block not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          t=Path('tests/test_rc6_byma_calendar_failclosed.py')
          t.write_text(r'''import ast\nimport datetime as dt\nimport sys\nimport types\nimport unittest\nfrom pathlib import Path\n\n\ndef load_business_day():\n    tree=ast.parse(Path("bf_production_paper_observer.py").read_text(encoding="utf-8"))\n    fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="_business_day")\n    ns={}\n    exec(compile(ast.Module(body=[fn],type_ignores=[]),"bf_production_paper_observer.py","exec"),ns)\n    return ns["_business_day"]\n\n\nclass TestBymaCalendarFailClosed(unittest.TestCase):\n    def tearDown(self):\n        sys.modules.pop("ak_byma_calendar",None)\n\n    def test_calendar_exception_closes_business_day(self):\n        fake=types.ModuleType("ak_byma_calendar")\n        def boom(_day):\n            raise RuntimeError("injected calendar failure")\n        fake.es_dia_habil_operativo=boom\n        sys.modules["ak_byma_calendar"]=fake\n        self.assertFalse(load_business_day()(dt.date(2026,9,9)))\n\n    def test_calendar_true_is_preserved(self):\n        fake=types.ModuleType("ak_byma_calendar")\n        fake.es_dia_habil_operativo=lambda _day: True\n        sys.modules["ak_byma_calendar"]=fake\n        self.assertTrue(load_business_day()(dt.date(2026,9,9)))\n\n\nif __name__=="__main__":\n    unittest.main()\n''',encoding='utf-8')
          PY
          python -m py_compile bf_production_paper_observer.py tests/test_rc6_byma_calendar_failclosed.py
          python tests/test_rc6_byma_calendar_failclosed.py
          ! grep -Fq 'return day.weekday() < 5' bf_production_paper_observer.py
          grep -Fq 'return False' bf_production_paper_observer.py
          echo BYMA_FAILCLOSED_UNIT=GREEN
          echo ORDER_ROUTES=NOT_CALLED

      - name: Commit tested fix to exact branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'porota-rc6-automation'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add bf_production_paper_observer.py tests/test_rc6_byma_calendar_failclosed.py
          git commit -m 'fix(rc6): fail closed on BYMA calendar exception'
          git push origin HEAD:hotfix/rc6-byma-calendar-failclosed-20260909
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact tested SHA and prove fail-closed live
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          BASE_SHA: e428d1e33c9f59f38cdf5be41bceb3ac19e4eeaf
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' BASE_SHA='$BASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_HEAD=$(git rev-parse HEAD); echo "PRE_HEAD=$PRE_HEAD"; test "$PRE_HEAD" = "$BASE_SHA"
          sudo -n docker inspect -f 'PRE_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'PRE_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          PRE=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]; c.close(); print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "PRE_DB=$PRE"; test "$PRE" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'

          git fetch --no-tags origin hotfix/rc6-byma-calendar-failclosed-20260909
          test "$(git rev-parse origin/hotfix/rc6-byma-calendar-failclosed-20260909)" = "$TARGET_SHA"
          TMP=$(mktemp -d "$HOME/porota-bymafc.XXXXXX")
          trap 'git -C /opt/porota-trading worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label porota.hotfix=rc6-byma-calendar-failclosed -t porota-trading-bot:17.0.0-rc6 "$TMP/source"
          git checkout -f -B hotfix/rc6-byma-calendar-failclosed-20260909 "$TARGET_SHA"
          sudo -n python3 /opt/porota-trading/porota_mode_manager.py simulation
          sleep 15

          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import datetime as dt,sys,types
          import bf_production_paper_observer as obs
          fake=types.ModuleType('ak_byma_calendar')
          def boom(_day): raise RuntimeError('injected calendar failure')
          fake.es_dia_habil_operativo=boom
          sys.modules['ak_byma_calendar']=fake
          assert obs._business_day(dt.date(2026,9,9)) is False
          probe=dt.datetime(2026,9,9,11,0,tzinfo=obs.TZ)
          assert obs._market_phase(probe)=='CLOSED'
          print('BYMA_FAILCLOSED_LIVE=GREEN')
          PY
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os,urllib.request
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          for p in ['/','/vivo','/riesgo','/validacion','/historicos']:
              req=urllib.request.Request('http://127.0.0.1:8000'+p)
              if token:
                  req.add_header('Authorization','Bearer '+token); req.add_header('X-Dashboard-Token',token)
              with urllib.request.urlopen(req,timeout=15) as r:
                  body=r.read().decode('utf-8','replace')
              assert r.status==200
              assert 'porota-rc6-classic-responsive' in body
              assert 'overflow-wrap:anywhere' not in body
              print(f'HTTP|{p}|{r.status}|GREEN')
          print('WAVE8_REGRESSION=GREEN')
          PY
          POST=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]; c.close(); print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "POST_DB=$POST"; test "$POST" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          echo "POST_HEAD=$(git rev-parse HEAD)"; test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          echo BYMA_CALENDAR_FAILCLOSED_RUNTIME=GREEN
          REMOTE
