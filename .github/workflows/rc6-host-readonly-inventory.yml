name: RC6 host maintenance - evidence-first READ_ONLY
on:
  push:
    branches:
      - ops/rc6-host-maintenance-20261011
    paths:
      - .github/workflows/rc6-host-readonly-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-host-audit-maintenance-20261011
  cancel-in-progress: false

jobs:
  host-audit:
    if: github.repository == 'mbalbo2023/Porota-trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Strict SSH without host-key enrollment
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6-host-audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6-host-audit" "$HOME/.ssh/known_hosts"
      - name: Audit existing Droplet WITHOUT writing or restarting it
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          timeout 500 ssh -i "$HOME/.ssh/rc6-host-audit" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 "$DO_USER@$DO_HOST" 'python3 -' \
            > "$RUNNER_TEMP/rc6-host-inventory.json" <<'PY'
          import datetime, json, os, pathlib, shutil, sqlite3, stat, subprocess, time
          from urllib.parse import quote

          def run(argv, timeout=35, max_chars=16000):
              try:
                  result=subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                        text=True, timeout=timeout, check=False)
                  return {"exit_code": result.returncode, "output": result.stdout[:max_chars]}
              except Exception as exc:
                  return {"error": type(exc).__name__ + ": " + str(exc)[:300]}

          report={"schema":"porota.rc6.host-maintenance-readonly.v1",
                  "captured_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "phase":"AUDIT_ONLY", "host_mutation_authorized":False,
                  "cleanup_performed":False, "environment":"DROPLET_NOT_CODEX_NOT_ACTIONS"}
          usage=shutil.disk_usage("/")
          fs=os.statvfs("/")
          report["filesystem"]={"total_bytes":usage.total,"used_bytes":usage.used,
             "free_bytes":usage.free,"total_inodes":fs.f_files,
             "free_inodes":fs.f_ffree,
             "free_inode_percent":round(100*fs.f_ffree/max(1,fs.f_files),3)}
          report["hostname"]=os.uname().nodename
          report["kernel"]=os.uname().release
          report["commands"]={}
          commands=[
            ("root_mount",["findmnt","-n","-o","SOURCE,FSTYPE,OPTIONS","/"],10),
            ("host_git_sha",["git","-C","/opt/porota-trading","rev-parse","HEAD"],12),
            ("host_git_branch",["git","-C","/opt/porota-trading","branch","--show-current"],12),
            ("docker_containers",["sudo","-n","docker","ps","-a","--format","{{.Names}}|{{.Status}}|{{.Image}}"],40),
            ("docker_active_images",["sudo","-n","docker","inspect","-f","{{.Name}}|{{.Image}}|{{.State.Status}}|{{.RestartCount}}","porota_production_observer","porota_production_dashboard","porota_critical_approval_rc6"],30),
            ("docker_disk",["sudo","-n","docker","system","df"],40),
            ("docker_images",["sudo","-n","docker","images","--format","{{.ID}}|{{.Repository}}:{{.Tag}}|{{.Size}}"],45),
            ("docker_volumes",["sudo","-n","docker","volume","ls","--format","{{.Name}}"],20),
            ("directory_sizes",["sudo","-n","du","-x","-B1","-s","/var/lib/docker","/opt/porota-trading/data","/opt/porota-backups","/var/log","/var/cache/apt","/tmp"],105),
            ("journal_bytes",["sudo","-n","journalctl","--disk-usage"],25),
            ("systemd_failed",["systemctl","--failed","--no-legend","--no-pager"],25),
            ("systemd_timers",["systemctl","list-timers","--all","--no-legend","--no-pager"],25),
            ("active_swap",["swapon","--show","--bytes"],10),
            ("memory",["free","-b"],10)
          ]
          for name,args,seconds in commands:
              report["commands"][name]=run(args,seconds)
          report["ppi_watch_units"]=[]
          units=run(["systemctl","list-unit-files","--no-legend","--no-pager"],25,60000)
          if units.get("exit_code")==0:
              for row in units["output"].splitlines():
                  name=row.split()[0] if row.split() else ""
                  if "ppi" in name.lower() and "watch" in name.lower():
                      report["ppi_watch_units"].append({"name":name,
                          "active":run(["systemctl","is-active",name],10),
                          "enabled":run(["systemctl","is-enabled",name],10)})
          else:
              report["ppi_watch_units_error"]=units
          db="/opt/porota-trading/data/paper_v17/observer_v17.db"
          query=("import sqlite3,sys,json;"
                 "c=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True,timeout=3);"
                 "c.execute('pragma query_only=ON');"
                 "r=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone();"
                 "print(json.dumps({'mode':r[0],'real_orders_sent':r[1]}));c.close()")
          report["paper_state"]=run(["sudo","-n","python3","-c",query,db],15,1200)
          report["tmp_old_prefix_candidates"]=[]
          root=pathlib.Path("/tmp")
          now=time.time()
          for p in root.iterdir():
              if len(report["tmp_old_prefix_candidates"])>=80:break
              if not p.name.startswith(("porota","rc6")):continue
              try:
                  st=p.lstat()
                  if now-st.st_mtime<7*86400:continue
                  report["tmp_old_prefix_candidates"].append({
                      "name":p.name,"type":"symlink" if stat.S_ISLNK(st.st_mode) else "dir" if stat.S_ISDIR(st.st_mode) else "file",
                      "size_bytes":st.st_size,"age_days":round((now-st.st_mtime)/86400,1)})
              except OSError:pass
          report["backups"]={}
          for root in ("/opt/porota-backups",
             "/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/backups/paper",
             "/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/backups/history"):
              p=pathlib.Path(root)
              item={"exists":p.exists(),"entries":[]}
              if p.exists() and p.is_dir():
                  for f in sorted(p.iterdir(),key=lambda x:x.name)[-30:]:
                      try:
                          s=f.lstat()
                          item["entries"].append({"name":f.name,"size_bytes":s.st_size,
                             "kind":"regular" if stat.S_ISREG(s.st_mode) else "OTHER",
                             "mtime_utc":datetime.datetime.fromtimestamp(s.st_mtime,datetime.timezone.utc).isoformat()})
                      except OSError:pass
              report["backups"][root]=item
          report["protected_paths_not_modified"]=True
          print(json.dumps(report,sort_keys=True,indent=2))
          PY
          python3 -m json.tool "$RUNNER_TEMP/rc6-host-inventory.json" > /dev/null
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"rc6-host-inventory.json").read_text())
          f=j["filesystem"]
          print(f"RC6_HOST_AUDIT=EVIDENCE_CAPTURED|free_bytes={f['free_bytes']}|inode_free={f['free_inode_percent']}|cleaned=false")
          print("RC6_HOST_AUDIT_SQLITE="+str(j["paper_state"]))
          PY
      - name: Upload read-only original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-host-readonly-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-host-inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean runner SSH credential only
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/rc6-host-audit"
