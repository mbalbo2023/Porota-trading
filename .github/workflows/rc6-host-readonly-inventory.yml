name: RC6 host truth read-only

# Sunday 2026-09-06 exact host-state refresh immediately before RC6 deployment.
on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-host-readonly-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read host truth only
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/host.txt
          set -euo pipefail
          cd /opt/porota-trading
          echo "HOST_TRUTH=START"
          echo "BRANCH=$(git branch --show-current)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "ROOT=$(df -PT -B1 / | awk 'NR==2{print $2"|"$3"|"$4"|"$5"|"$6}')"
          for c in porota_production_observer porota_production_dashboard; do
            echo "$c=$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' "$c")"
          done
          echo "--- RC4_UNITS ---"
          sudo -n systemctl list-units --all --no-pager --no-legend | grep -i 'porota.*rc4' || true
          echo "--- RC4_UNIT_FILES ---"
          sudo -n systemctl list-unit-files --no-pager --no-legend | grep -i 'porota.*rc4' || true
          echo "--- RC4_TIMERS ---"
          sudo -n systemctl list-timers --all --no-pager --no-legend | grep -i 'porota.*rc4' || true
          echo "--- POROTA_TIMERS ---"
          sudo -n systemctl list-timers --all --no-pager --no-legend | grep -i porota || true
          echo "--- DB_STATE ---"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          o=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);o.execute('pragma query_only=on')
          qo=o.execute('pragma quick_check').fetchone()[0]
          row=o.execute('select mode,process_state,session_state,ppi_auth,real_orders_sent,heartbeat_at from observer_state where id=1').fetchone();o.close()
          h=sqlite3.connect('file:/app/data/market_history.db?mode=ro',uri=True);h.execute('pragma query_only=on');qh=h.execute('pragma quick_check').fetchone()[0];h.close()
          print('QC_OBSERVER='+str(qo));print('QC_HISTORY='+str(qh));print('OBSERVER_STATE='+'|'.join(map(str,row)))
          PY
          echo "HOST_TRUTH=END"
          REMOTE
          {
            echo '### RC6 host truth — read-only'
            echo '```text'
            sed -n '1,220p' /tmp/host.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
