name: RC6 PPI identity and 365d depth diagnostic 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-identity-depth-365-diagnostic-20260912.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only exact identity and 365d depth certification
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }

          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 0 9 || { echo ABORT=WRITER_OR_SERIALIZED_JOB_ACTIVE; exit 32; }

          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"
            case "$st" in active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 33;; esac
          done

          sudo -n docker exec -i porota_production_observer python -B - <<'PY'
          import json, sqlite3
          from collections import Counter, defaultdict
          import bf_production_paper_observer as m
          from cv_history_store_adapter_hf6 import default_history_store

          TARGET_START='2025-09-12'
          TARGET_END='2026-09-12'
          RECENT_1='2026-09-11'
          RECENT_2='2026-09-10'

          def norm(v):
              return str(v or '').strip().upper()

          def pick(cols, *names):
              for n in names:
                  if n in cols:
                      return n
              return None

          store=m.runtime_store()
          with store.connect() as c:
              c.execute('pragma query_only=on')
              qc=c.execute('pragma quick_check').fetchone()[0]
              print('OBSERVER_QUICK_CHECK='+str(qc)); assert qc=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_BEFORE={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              cols=[r[1] for r in c.execute('pragma table_info(ppi_argentina_api_shadow)')]
              print('SHADOW_COLUMNS='+json.dumps(cols))
              sym=pick(cols,'ticker','symbol')
              fam=pick(cols,'instrument_type','family','type')
              mkt=pick(cols,'market')
              stl=pick(cols,'settlement')
              cur=pick(cols,'currency','moneda')
              assert all([sym,fam,mkt,stl]), (sym,fam,mkt,stl)
              selected=[sym,fam,mkt,stl]+([cur] if cur else [])
              q='select '+','.join('"'+x+'"' for x in selected)+" from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')"
              shadow_rows=c.execute(q).fetchall()

          current=[]
          key_currency=defaultdict(set)
          for r in shadow_rows:
              k=(norm(r[0]),norm(r[1]),norm(r[2]),norm(r[3]))
              current.append(k)
              key_currency[k].add(norm(r[4]) if cur else '')
          current_set=set(current)
          dup_shadow=len(current)-len(current_set)
          currency_collisions={k:sorted(v) for k,v in key_currency.items() if len(v)>1}
          print('IMPLEMENTED_HISTORY_IDENTITY_KEY=symbol|instrument_type|market|settlement')
          print('SHADOW_RAW_ROWS='+str(len(current)))
          print('SHADOW_DISTINCT_IMPLEMENTED_KEYS='+str(len(current_set)))
          print('SHADOW_DUPLICATE_IMPLEMENTED_KEY_ROWS='+str(dup_shadow))
          print('SHADOW_HAS_CURRENCY_COLUMN='+('YES' if cur else 'NO'))
          print('CURRENCY_COLLISION_GROUPS='+str(len(currency_collisions)))
          if currency_collisions:
              sample=[{'key':list(k),'currencies':v} for k,v in sorted(currency_collisions.items())[:50]]
              print('CURRENCY_COLLISION_SAMPLE='+json.dumps(sample,sort_keys=True))
              raise SystemExit('ABORT=IMPLEMENTED_KEY_COLLAPSES_CURRENT_CURRENCY_IDENTITIES')
          assert len(current)==1960, len(current)
          assert len(current_set)==1960, len(current_set)

          hpath=default_history_store().path
          h=sqlite3.connect(f'file:{hpath}?mode=ro',uri=True)
          h.row_factory=sqlite3.Row
          h.execute('pragma query_only=on')
          hqc=h.execute('pragma quick_check').fetchone()[0]
          print('HISTORY_QUICK_CHECK='+str(hqc)); assert hqc=='ok'
          tables={r[0] for r in h.execute("select name from sqlite_master where type='table'")}
          assert 'history_canonical_v2' in tables

          hist_keys=set()
          stats={}
          for r in h.execute('''select upper(trim(symbol)) symbol,upper(trim(instrument_type)) instrument_type,
                                      upper(trim(market)) market,upper(trim(settlement)) settlement,
                                      count(*) n,min(date) min_date,max(date) max_date
                               from history_canonical_v2
                               group by upper(trim(symbol)),upper(trim(instrument_type)),upper(trim(market)),upper(trim(settlement))'''):
              k=(r['symbol'],r['instrument_type'],r['market'],r['settlement'])
              hist_keys.add(k); stats[k]=(int(r['n']),r['min_date'],r['max_date'])

          missing=current_set-hist_keys
          extras=hist_keys-current_set
          covered=current_set & hist_keys
          print(f'CURRENT_IDENTITIES={len(current_set)} COVERED_CURRENT={len(covered)} MISSING_CURRENT={len(missing)} HISTORICAL_EXTRAS={len(extras)} HISTORICAL_TOTAL_KEYS={len(hist_keys)}')

          families=sorted({k[1] for k in current_set} | {k[1] for k in hist_keys})
          coverage={}
          depth={}
          for f in families:
              universe={k for k in current_set if k[1]==f}
              cov={k for k in covered if k[1]==f}
              miss={k for k in missing if k[1]==f}
              ext={k for k in extras if k[1]==f}
              start_reached=sum(1 for k in cov if stats[k][1] and stats[k][1] <= TARGET_START)
              start_after=sum(1 for k in cov if stats[k][1] and stats[k][1] > TARGET_START)
              recent11=sum(1 for k in cov if stats[k][2] and stats[k][2] >= RECENT_1)
              recent10=sum(1 for k in cov if stats[k][2] and stats[k][2] >= RECENT_2)
              older=sum(1 for k in cov if not stats[k][2] or stats[k][2] < RECENT_2)
              mins=[stats[k][1] for k in cov if stats[k][1]]
              maxs=[stats[k][2] for k in cov if stats[k][2]]
              rows=sum(stats[k][0] for k in cov)
              coverage[f]={'universe':len(universe),'covered':len(cov),'missing':len(miss),'historical_extras':len(ext)}
              depth[f]={'covered':len(cov),'zero':len(miss),'start_reached_365':start_reached,'start_after_target':start_after,
                        'max_ge_2026_09_11':recent11,'max_ge_2026_09_10':recent10,'max_older_than_2026_09_10':older,
                        'earliest_min':min(mins) if mins else None,'latest_min':max(mins) if mins else None,
                        'earliest_max':min(maxs) if maxs else None,'latest_max':max(maxs) if maxs else None,
                        'canonical_rows_current_ids':rows}
          print('COVERAGE_BY_FAMILY='+json.dumps(coverage,sort_keys=True))
          print('DEPTH_365_BY_FAMILY='+json.dumps(depth,sort_keys=True))

          missing_list=[{'symbol':k[0],'family':k[1],'market':k[2],'settlement':k[3]} for k in sorted(missing,key=lambda x:(x[1],x[0],x[2],x[3]))]
          extras_list=[{'symbol':k[0],'family':k[1],'market':k[2],'settlement':k[3],'rows':stats[k][0],'min':stats[k][1],'max':stats[k][2]} for k in sorted(extras,key=lambda x:(x[1],x[0],x[2],x[3]))]
          print('MISSING_CURRENT_FULL='+json.dumps(missing_list,separators=(',',':')))
          print('HISTORICAL_EXTRAS_FULL='+json.dumps(extras_list,separators=(',',':')))

          # Same ticker/family/market but different settlement: report, never auto-map.
          cur3=defaultdict(set); ext3=defaultdict(set)
          for k in current_set: cur3[k[:3]].add(k[3])
          for k in extras: ext3[k[:3]].add(k[3])
          mismatch=[]
          for k3,es in ext3.items():
              if k3 in cur3 and es != cur3[k3]:
                  mismatch.append({'symbol':k3[0],'family':k3[1],'market':k3[2],'current_settlements':sorted(cur3[k3]),'extra_settlements':sorted(es)})
          print('SETTLEMENT_MISMATCH_GROUPS='+str(len(mismatch)))
          print('SETTLEMENT_MISMATCH_BY_FAMILY='+json.dumps(dict(Counter(x['family'] for x in mismatch)),sort_keys=True))
          print('SETTLEMENT_MISMATCH_SAMPLE='+json.dumps(mismatch[:100],separators=(',',':')))

          dup=h.execute('''select count(*) from (
               select symbol,instrument_type,market,settlement,date,count(*) n
               from history_canonical_v2 group by symbol,instrument_type,market,settlement,date having n>1)''').fetchone()[0]
          print('CANONICAL_DUPLICATE_KEY_DATE_GROUPS='+str(dup)); assert dup==0
          if 'history_versions_v2' in tables:
              q='''select count(*) from history_versions_v2 where (upper(trim(symbol)),upper(trim(instrument_type)),upper(trim(market)),upper(trim(settlement))) in (%s)'''
              # Avoid giant tuple SQL; count extras in Python for deterministic audit.
              ev=0
              for r in h.execute('select symbol,instrument_type,market,settlement from history_versions_v2'):
                  k=(norm(r[0]),norm(r[1]),norm(r[2]),norm(r[3]))
                  if k in extras: ev+=1
              print('EXTRA_IDENTITY_VERSION_ROWS='+str(ev))
          h.close()

          start_total=sum(v['start_reached_365'] for v in depth.values())
          start_after_total=sum(v['start_after_target'] for v in depth.values())
          recent11_total=sum(v['max_ge_2026_09_11'] for v in depth.values())
          recent10_total=sum(v['max_ge_2026_09_10'] for v in depth.values())
          older_total=sum(v['max_older_than_2026_09_10'] for v in depth.values())
          print('DEPTH_TOTAL='+json.dumps({'target_start':TARGET_START,'target_end':TARGET_END,'zero':len(missing),'start_reached_365':start_total,'start_after_target':start_after_total,'max_ge_2026_09_11':recent11_total,'max_ge_2026_09_10':recent10_total,'max_older_than_2026_09_10':older_total},sort_keys=True))

          with store.connect() as c:
              c.execute('pragma query_only=on')
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_AFTER={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          print('DIAGNOSTIC_STATUS=SUCCESS_READ_ONLY')
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
