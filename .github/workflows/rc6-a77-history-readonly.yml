name: RC6 A77 bounded history admission (read only)

on:
  push:
    branches: [audit/rc6-a77-history-readonly-20261025]
    paths: ['.github/workflows/rc6-a77-history-readonly.yml']

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Probe exact history gates without mutation or provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 180 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for unit in porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer porota-a3-history-weekend-rc6.timer porota-history-postclose-rc6.timer; do
            enabled="$(systemctl is-enabled "$unit" || true)"
            active="$(systemctl is-active "$unit" || true)"
            printf 'HISTORY_TIMER=%s|%s|%s\n' "$unit" "$enabled" "$active"
            test "$enabled" = masked
            test "$active" = inactive
          done
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import collections,json,os,sqlite3
          from pathlib import Path
          from ew_a3_history_rc6 import load_targets

          paper='/app/data/paper_v17/observer_v17.db'
          history='/app/data/market_history.db'
          def connect(path):
              c=sqlite3.connect(Path(path).as_uri()+'?mode=ro',uri=True,timeout=.3)
              c.row_factory=sqlite3.Row
              c.execute('PRAGMA query_only=ON')
              c.execute('PRAGMA busy_timeout=300')
              return c
          class Store:
              def connect(self):return connect(paper)
          with connect(paper) as c:
              state=c.execute('SELECT mode,real_orders_sent,session_state,heartbeat_at FROM observer_state WHERE id=1').fetchone()
              assert state and state['mode']=='PRODUCTION_PAPER' and type(state['real_orders_sent']) is int and state['real_orders_sent']==0
              assert state['session_state']=='MARKET_CLOSED'
              targets=load_targets(Store())
              families=dict(sorted(collections.Counter(t[1] for t in targets).items()))
              target_markets=[{'family':k[0],'market':k[1],'n':n} for k,n in sorted(
                  collections.Counter((t[1],t[2]) for t in targets).items())]
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              candidate_counts=[]
              if 'candidate_identity_v2' in tables:
                  candidate_counts=[{'family':r[0],'market':r[1],'can_simulate':r[2],'n':r[3]}
                      for r in c.execute("SELECT instrument_type,market,can_simulate,COUNT(*) FROM candidate_identity_v2 "
                                         "WHERE instrument_type IN ('FUTUROS','OPCIONES') "
                                         "GROUP BY instrument_type,market,can_simulate ORDER BY instrument_type,market,can_simulate LIMIT 30")]
              source=None
              if 'source_sync' in tables:
                  row=c.execute("SELECT status,last_attempt_at FROM source_sync WHERE source='PPI_PRODUCTION_HISTORY'").fetchone()
                  source=dict(row) if row else None
          with connect(history) as c:
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              cutoff=None
              cutoff_failures=[]
              if 'rc6_history_cutoff_repair_runs' in tables:
                  row=c.execute("SELECT state,targets,complete,failed,ppi_queries FROM rc6_history_cutoff_repair_runs WHERE cutoff='2026-09-21'").fetchone()
                  cutoff=dict(row) if row else None
              if 'rc6_history_cutoff_repair' in tables:
                  cutoff_failures=[{'state':r[0],'error_class':r[1],'n':r[2]} for r in c.execute(
                      "SELECT state,COALESCE(error_class,''),COUNT(*) FROM rc6_history_cutoff_repair "
                      "WHERE cutoff='2026-09-21' GROUP BY state,error_class ORDER BY COUNT(*) DESC LIMIT 20")]
              cols={t:[r[1] for r in c.execute('PRAGMA table_info('+t+')')]
                    for t in ('history_versions_v2','history_canonical_v2','history_close_versions_v1')}
          result={'schema':'rc6-a77-history-admission-v1','paper':state['mode'],
                  'real_orders_sent':state['real_orders_sent'],'session':state['session_state'],
                  'a3_exact_target_count':len(targets),'a3_by_family':families,
                  'a3_target_markets':target_markets,'candidate_identity_counts':candidate_counts,
                  'cutoff_repair':cutoff,'cutoff_states':cutoff_failures,'ppi_source_sync':source,
                  'history_db_bytes':os.stat(history).st_size,
                  'history_volume_available_bytes':os.statvfs(history).f_bavail*os.statvfs(history).f_frsize,
                  'history_schema_columns':cols,'provider_requests':0,'history_writes':False,
                  'ppi_watch_accessed':False}
          print(json.dumps(result,sort_keys=True))
          PY
          REMOTE
      - name: Inventory verified migration capacity and currency provenance read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n docker exec -i porota_production_observer python -' <<'PY'
          import json,os,sqlite3,time
          from pathlib import Path
          history='/app/data/market_history.db'
          paper='/app/data/paper_v17/observer_v17.db'
          def ro(path):
              c=sqlite3.connect(Path(path).as_uri()+'?mode=ro',uri=True,timeout=.3)
              c.execute('PRAGMA query_only=ON')
              c.execute('PRAGMA busy_timeout=300')
              deadline=time.monotonic()+15
              c.set_progress_handler(lambda:int(time.monotonic()>deadline),10000)
              return c
          def cgroup(name):
              try:return Path('/sys/fs/cgroup/'+name).read_text().strip()
              except OSError:return 'NO_VERIFICADO'
          result={'schema':'rc6-a77-migration-capacity-v1','read_only':True,
                  'source_bytes':os.stat(history).st_size,
                  'volume_free_bytes':os.statvfs(history).f_bavail*os.statvfs(history).f_frsize,
                  'scratch_configured_max_bytes':os.getenv('POROTA_SQLITE_SCRATCH_MAX_BYTES','UNSET'),
                  'scratch_configured_reserve_bytes':os.getenv('POROTA_SQLITE_SCRATCH_RESERVE_BYTES','UNSET'),
                  'cgroup_memory_max':cgroup('memory.max'),'cgroup_memory_current':cgroup('memory.current'),
                  'real_routes':'NOT_CALLED','provider_requests':0,'history_writes':False}
          try:
              with ro(history) as c:
                  r=c.execute("""SELECT COUNT(*),
                      SUM(CASE WHEN json_valid(metadata_json) AND
                          json_extract(metadata_json,'$.currency') IS NOT NULL THEN 1 ELSE 0 END)
                      FROM history_versions_v2""").fetchone()
                  result['legacy_versions']=r[0];result['explicit_metadata_currency']=r[1]
                  result['legacy_canonical']=c.execute('SELECT COUNT(*) FROM history_canonical_v2').fetchone()[0]
              with ro(paper) as c:
                  result['catalog_unique_currency_keys']=c.execute("""SELECT COUNT(*) FROM (
                      SELECT ticker,instrument_type,market,settlement
                      FROM financial_instrument_catalog
                      WHERE currency NOT IN ('','UNKNOWN') AND status='AVAILABLE'
                      GROUP BY ticker,instrument_type,market,settlement
                      HAVING COUNT(DISTINCT currency)=1)""").fetchone()[0]
                  result['catalog_ambiguous_currency_keys']=c.execute("""SELECT COUNT(*) FROM (
                      SELECT ticker,instrument_type,market,settlement
                      FROM financial_instrument_catalog
                      WHERE currency NOT IN ('','UNKNOWN') AND status='AVAILABLE'
                      GROUP BY ticker,instrument_type,market,settlement
                      HAVING COUNT(DISTINCT currency)>1)""").fetchone()[0]
              result['state']='VALIDATED'
          except Exception as exc:result.update(state='NO_VERIFICADO',error_class=type(exc).__name__)
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Probe scalping PAPER preopen readiness read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 50 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for unit in porota-preopen-rc6.timer porota-preopen-1015-rc6.timer; do
            printf 'SCALPING_PREOPEN_TIMER=%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          sudo -n docker inspect --format 'SCALPING_OBSERVER_CONTAINER={{.State.Status}}|{{.RestartCount}}' porota_production_observer
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json,os,sqlite3
          from datetime import datetime,timezone
          from pathlib import Path
          from rc6_paper_admission_gate import FOCUS
          from cf_intraday_scalping import DEFAULT_INTRADAY_SCAN_SECONDS,DEFAULT_INTRADAY_BATCH_LIMIT
          db=Path('/app/data/paper_v17/observer_v17.db')
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=.3)
          c.row_factory=sqlite3.Row;c.execute('PRAGMA query_only=ON');c.execute('PRAGMA busy_timeout=300')
          observer=c.execute('SELECT mode,session_state,real_orders_sent,heartbeat_at FROM observer_state WHERE id=1').fetchone()
          worker=c.execute('SELECT heartbeat_at,state,cursor,selected,successful,failed,points_inserted,confirmed_identities,candidates,real_orders_sent FROM intraday_scalping_worker_state WHERE id=1').fetchone()
          ready=[]
          for symbol,family,settlement in FOCUS:
              n=c.execute("""SELECT COUNT(*) FROM financial_instrument_catalog f
                  JOIN candidate_identity_v2 r USING(ticker,instrument_type,market,currency,settlement)
                  WHERE f.ticker=? AND f.instrument_type=? AND f.settlement=?
                    AND f.status='AVAILABLE' AND f.capability='READY_PAPER_SPOT'
                    AND r.status='AVAILABLE' AND r.can_simulate=1""",(symbol,family,settlement)).fetchone()[0]
              ready.append({'symbol':symbol,'exact_ready':n==1,'cardinality':n})
          eligible=c.execute("""SELECT COUNT(*) FROM candidate_identity_v2
              WHERE status='AVAILABLE' AND can_simulate=1
                AND instrument_type IN ('ACCIONES','CEDEARS','ETFS')""").fetchone()[0]
          latest_candidate=c.execute('SELECT MAX(evaluated_at) FROM scalping_candidates').fetchone()[0]
          c.close()
          now=datetime.now(timezone.utc)
          def age(value):
              try:return round((now-datetime.fromisoformat(value.replace('Z','+00:00')).astimezone(timezone.utc)).total_seconds(),1)
              except Exception:return None
          receipt=Path('/app/data/deploy/paper_scalping_preopen_gate_v1.json')
          try:
              raw=json.loads(receipt.read_text(encoding='utf-8'))
              gate={k:raw.get(k) for k in ('status','trade_day_ar','phase','reason')}
              gate['build_matches']=raw.get('candidate_sha')==os.getenv('POROTA_BUILD_SHA')
          except Exception:gate={'status':'NO_VERIFICADO'}
          mode=os.getenv('PAPER_SCALPING_MODE','ACTIVE_OBSERVE')
          result={'schema':'rc6-a77-scalping-preopen-v1','as_of_utc':now.isoformat(),
                  'observer':{'mode':observer['mode'],'session':observer['session_state'],
                      'real_orders_sent':observer['real_orders_sent'],'heartbeat_age_seconds':age(observer['heartbeat_at'])},
                  'worker':dict(worker) if worker else None,'worker_heartbeat_age_seconds':age(worker['heartbeat_at']) if worker else None,
                  'scalping_mode':mode,'scan_seconds':os.getenv('PAPER_INTRADAY_SCAN_SECONDS',str(DEFAULT_INTRADAY_SCAN_SECONDS)),
                  'batch_limit':os.getenv('PAPER_INTRADAY_BATCH_LIMIT',str(DEFAULT_INTRADAY_BATCH_LIMIT)),
                  'exact_focus':ready,'eligible_spot_identities':eligible,
                  'latest_candidate_at':latest_candidate,'preopen_receipt':gate,
                  'real_routes':'NOT_CALLED','provider_requests':0,'ppi_watch_accessed':False,
                  'history_writes':False}
          result['state']='CLOSED_PREOPEN_READY_FOR_LIVE_CHECK' if (
              observer['mode']=='PRODUCTION_PAPER' and observer['real_orders_sent']==0
              and worker and worker['state']=='WAITING_MARKET' and worker['real_orders_sent']==0
              and result['worker_heartbeat_age_seconds'] is not None
              and 0<=result['worker_heartbeat_age_seconds']<=120 and mode=='ACTIVE_PAPER'
              and all(item['exact_ready'] for item in ready)) else 'NO_VERIFICADO_OR_BLOCKED'
          print(json.dumps(result,sort_keys=True,default=str))
          PY
          REMOTE
      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
