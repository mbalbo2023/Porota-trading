name: RC6 A77 bounded history admission (read only)

on:
  push:
    branches: [audit/rc6-a77-history-readonly-20261025]
    paths: ['.github/workflows/rc6-a77-history-readonly.yml']

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Probe exact history gates without mutation or provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 180 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for unit in porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer porota-a3-history-weekend-rc6.timer porota-history-postclose-rc6.timer; do
            enabled="$(systemctl is-enabled "$unit" || true)"
            active="$(systemctl is-active "$unit" || true)"
            printf 'HISTORY_TIMER=%s|%s|%s\n' "$unit" "$enabled" "$active"
            test "$enabled" = masked
            test "$active" = inactive
          done
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import collections,json,os,sqlite3
          from pathlib import Path
          from ew_a3_history_rc6 import load_targets

          paper='/app/data/paper_v17/observer_v17.db'
          history='/app/data/market_history.db'
          def connect(path):
              c=sqlite3.connect(Path(path).as_uri()+'?mode=ro',uri=True,timeout=.3)
              c.row_factory=sqlite3.Row
              c.execute('PRAGMA query_only=ON')
              c.execute('PRAGMA busy_timeout=300')
              return c
          class Store:
              def connect(self):return connect(paper)
          with connect(paper) as c:
              state=c.execute('SELECT mode,real_orders_sent,session_state,heartbeat_at FROM observer_state WHERE id=1').fetchone()
              assert state and state['mode']=='PRODUCTION_PAPER' and type(state['real_orders_sent']) is int and state['real_orders_sent']==0
              assert state['session_state']=='MARKET_CLOSED'
              targets=load_targets(Store())
              families=dict(sorted(collections.Counter(t[1] for t in targets).items()))
              target_markets=[{'family':k[0],'market':k[1],'n':n} for k,n in sorted(
                  collections.Counter((t[1],t[2]) for t in targets).items())]
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              candidate_counts=[]
              if 'candidate_identity_v2' in tables:
                  candidate_counts=[{'family':r[0],'market':r[1],'can_simulate':r[2],'n':r[3]}
                      for r in c.execute("SELECT instrument_type,market,can_simulate,COUNT(*) FROM candidate_identity_v2 "
                                         "WHERE instrument_type IN ('FUTUROS','OPCIONES') "
                                         "GROUP BY instrument_type,market,can_simulate ORDER BY instrument_type,market,can_simulate LIMIT 30")]
              source=None
              if 'source_sync' in tables:
                  row=c.execute("SELECT status,last_attempt_at FROM source_sync WHERE source='PPI_PRODUCTION_HISTORY'").fetchone()
                  source=dict(row) if row else None
          with connect(history) as c:
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              cutoff=None
              cutoff_failures=[]
              if 'rc6_history_cutoff_repair_runs' in tables:
                  row=c.execute("SELECT state,targets,complete,failed,ppi_queries FROM rc6_history_cutoff_repair_runs WHERE cutoff='2026-09-21'").fetchone()
                  cutoff=dict(row) if row else None
              if 'rc6_history_cutoff_repair' in tables:
                  cutoff_failures=[{'state':r[0],'error_class':r[1],'n':r[2]} for r in c.execute(
                      "SELECT state,COALESCE(error_class,''),COUNT(*) FROM rc6_history_cutoff_repair "
                      "WHERE cutoff='2026-09-21' GROUP BY state,error_class ORDER BY COUNT(*) DESC LIMIT 20")]
              cols={t:[r[1] for r in c.execute('PRAGMA table_info('+t+')')]
                    for t in ('history_versions_v2','history_canonical_v2','history_close_versions_v1')}
          result={'schema':'rc6-a77-history-admission-v1','paper':state['mode'],
                  'real_orders_sent':state['real_orders_sent'],'session':state['session_state'],
                  'a3_exact_target_count':len(targets),'a3_by_family':families,
                  'a3_target_markets':target_markets,'candidate_identity_counts':candidate_counts,
                  'cutoff_repair':cutoff,'cutoff_states':cutoff_failures,'ppi_source_sync':source,
                  'history_db_bytes':os.stat(history).st_size,
                  'history_volume_available_bytes':os.statvfs(history).f_bavail*os.statvfs(history).f_frsize,
                  'history_schema_columns':cols,'provider_requests':0,'history_writes':False,
                  'ppi_watch_accessed':False}
          print(json.dumps(result,sort_keys=True))
          PY
          REMOTE
      - name: Inventory verified migration capacity and currency provenance read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n docker exec -i porota_production_observer python -' <<'PY'
          import json,os,sqlite3,time
          from pathlib import Path
          history='/app/data/market_history.db'
          paper='/app/data/paper_v17/observer_v17.db'
          def ro(path):
              c=sqlite3.connect(Path(path).as_uri()+'?mode=ro',uri=True,timeout=.3)
              c.execute('PRAGMA query_only=ON')
              c.execute('PRAGMA busy_timeout=300')
              deadline=time.monotonic()+15
              c.set_progress_handler(lambda:int(time.monotonic()>deadline),10000)
              return c
          def cgroup(name):
              try:return Path('/sys/fs/cgroup/'+name).read_text().strip()
              except OSError:return 'NO_VERIFICADO'
          result={'schema':'rc6-a77-migration-capacity-v1','read_only':True,
                  'source_bytes':os.stat(history).st_size,
                  'volume_free_bytes':os.statvfs(history).f_bavail*os.statvfs(history).f_frsize,
                  'scratch_configured_max_bytes':os.getenv('POROTA_SQLITE_SCRATCH_MAX_BYTES','UNSET'),
                  'scratch_configured_reserve_bytes':os.getenv('POROTA_SQLITE_SCRATCH_RESERVE_BYTES','UNSET'),
                  'cgroup_memory_max':cgroup('memory.max'),'cgroup_memory_current':cgroup('memory.current'),
                  'real_routes':'NOT_CALLED','provider_requests':0,'history_writes':False}
          try:
              with ro(history) as c:
                  r=c.execute("""SELECT COUNT(*),
                      SUM(CASE WHEN json_valid(metadata_json) AND
                          json_extract(metadata_json,'$.currency') IS NOT NULL THEN 1 ELSE 0 END)
                      FROM history_versions_v2""").fetchone()
                  result['legacy_versions']=r[0];result['explicit_metadata_currency']=r[1]
                  result['legacy_canonical']=c.execute('SELECT COUNT(*) FROM history_canonical_v2').fetchone()[0]
              with ro(paper) as c:
                  result['catalog_unique_currency_keys']=c.execute("""SELECT COUNT(*) FROM (
                      SELECT ticker,instrument_type,market,settlement
                      FROM financial_instrument_catalog
                      WHERE currency NOT IN ('','UNKNOWN') AND status='AVAILABLE'
                      GROUP BY ticker,instrument_type,market,settlement
                      HAVING COUNT(DISTINCT currency)=1)""").fetchone()[0]
                  result['catalog_ambiguous_currency_keys']=c.execute("""SELECT COUNT(*) FROM (
                      SELECT ticker,instrument_type,market,settlement
                      FROM financial_instrument_catalog
                      WHERE currency NOT IN ('','UNKNOWN') AND status='AVAILABLE'
                      GROUP BY ticker,instrument_type,market,settlement
                      HAVING COUNT(DISTINCT currency)>1)""").fetchone()[0]
              result['state']='VALIDATED'
          except Exception as exc:result.update(state='NO_VERIFICADO',error_class=type(exc).__name__)
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Probe scalping PAPER preopen readiness read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 50 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for unit in porota-preopen-rc6.timer porota-preopen-1015-rc6.timer; do
            printf 'SCALPING_PREOPEN_TIMER=%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          sudo -n docker inspect --format 'SCALPING_OBSERVER_CONTAINER={{.State.Status}}|{{.RestartCount}}' porota_production_observer
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json,os,sqlite3
          from datetime import datetime,timezone
          from pathlib import Path
          from rc6_paper_admission_gate import FOCUS
          from cf_intraday_scalping import DEFAULT_INTRADAY_SCAN_SECONDS,DEFAULT_INTRADAY_BATCH_LIMIT
          db=Path('/app/data/paper_v17/observer_v17.db')
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=.3)
          c.row_factory=sqlite3.Row;c.execute('PRAGMA query_only=ON');c.execute('PRAGMA busy_timeout=300')
          observer=c.execute('SELECT mode,session_state,real_orders_sent,heartbeat_at FROM observer_state WHERE id=1').fetchone()
          worker=c.execute('SELECT heartbeat_at,state,cursor,selected,successful,failed,points_inserted,confirmed_identities,candidates,real_orders_sent FROM intraday_scalping_worker_state WHERE id=1').fetchone()
          ready=[]
          for symbol,family,settlement in FOCUS:
              n=c.execute("""SELECT COUNT(*) FROM financial_instrument_catalog f
                  JOIN candidate_identity_v2 r USING(ticker,instrument_type,market,currency,settlement)
                  WHERE f.ticker=? AND f.instrument_type=? AND f.settlement=?
                    AND f.status='AVAILABLE' AND f.capability='READY_PAPER_SPOT'
                    AND r.status='AVAILABLE' AND r.can_simulate=1""",(symbol,family,settlement)).fetchone()[0]
              ready.append({'symbol':symbol,'exact_ready':n==1,'cardinality':n})
          eligible=c.execute("""SELECT COUNT(*) FROM candidate_identity_v2
              WHERE status='AVAILABLE' AND can_simulate=1
                AND instrument_type IN ('ACCIONES','CEDEARS','ETFS')""").fetchone()[0]
          latest_candidate=c.execute('SELECT MAX(evaluated_at) FROM scalping_candidates').fetchone()[0]
          c.close()
          now=datetime.now(timezone.utc)
          def age(value):
              try:return round((now-datetime.fromisoformat(value.replace('Z','+00:00')).astimezone(timezone.utc)).total_seconds(),1)
              except Exception:return None
          receipt=Path('/app/data/deploy/paper_scalping_preopen_gate_v1.json')
          try:
              raw=json.loads(receipt.read_text(encoding='utf-8'))
              gate={k:raw.get(k) for k in ('status','trade_day_ar','phase','reason')}
              gate['build_matches']=raw.get('candidate_sha')==os.getenv('POROTA_BUILD_SHA')
          except Exception:gate={'status':'NO_VERIFICADO'}
          mode=os.getenv('PAPER_SCALPING_MODE','ACTIVE_OBSERVE')
          result={'schema':'rc6-a77-scalping-preopen-v1','as_of_utc':now.isoformat(),
                  'observer':{'mode':observer['mode'],'session':observer['session_state'],
                      'real_orders_sent':observer['real_orders_sent'],'heartbeat_age_seconds':age(observer['heartbeat_at'])},
                  'worker':dict(worker) if worker else None,'worker_heartbeat_age_seconds':age(worker['heartbeat_at']) if worker else None,
                  'scalping_mode':mode,'scan_seconds':os.getenv('PAPER_INTRADAY_SCAN_SECONDS',str(DEFAULT_INTRADAY_SCAN_SECONDS)),
                  'batch_limit':os.getenv('PAPER_INTRADAY_BATCH_LIMIT',str(DEFAULT_INTRADAY_BATCH_LIMIT)),
                  'exact_focus':ready,'eligible_spot_identities':eligible,
                  'latest_candidate_at':latest_candidate,'preopen_receipt':gate,
                  'real_routes':'NOT_CALLED','provider_requests':0,'ppi_watch_accessed':False,
                  'history_writes':False}
          result['state']='CLOSED_PREOPEN_READY_FOR_LIVE_CHECK' if (
              observer['mode']=='PRODUCTION_PAPER' and observer['real_orders_sent']==0
              and worker and worker['state']=='WAITING_MARKET' and worker['real_orders_sent']==0
              and result['worker_heartbeat_age_seconds'] is not None
              and 0<=result['worker_heartbeat_age_seconds']<=120 and mode=='ACTIVE_PAPER'
              and all(item['exact_ready'] for item in ready)) else 'NO_VERIFICADO_OR_BLOCKED'
          print(json.dumps(result,sort_keys=True,default=str))
          PY
          REMOTE
      - name: Probe SHADOW generation and ten-family intake read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n docker exec -i porota_production_observer python -' <<'PY'
          import json,os,sqlite3,time
          from pathlib import Path
          from cg_paper_workspace import artifact_root,database_path
          from rc6_shadow_runtime.persistence import EvidenceFiles,read_committed_generation
          db=database_path()
          root=artifact_root(db)/'dynamic-shadow'
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=.3)
          c.row_factory=sqlite3.Row;c.execute('PRAGMA query_only=ON');c.execute('PRAGMA busy_timeout=300')
          tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          candidate=[{'family':r[0],'status':r[1],'can_simulate':r[2],'n':r[3]}
              for r in c.execute("""SELECT instrument_type,status,can_simulate,COUNT(*)
                  FROM candidate_identity_v2 GROUP BY instrument_type,status,can_simulate
                  ORDER BY instrument_type,status,can_simulate""")]
          catalog=[{'family':r[0],'status':r[1],'n':r[2]}
              for r in c.execute("""SELECT instrument_type,status,COUNT(*)
                  FROM financial_instrument_catalog GROUP BY instrument_type,status
                  ORDER BY instrument_type,status""")]
          sync=[{'source':r[0],'status':r[1],'attempt':r[2],'success':r[3]}
              for r in c.execute("""SELECT source,status,last_attempt_at,last_success_at
                  FROM source_sync ORDER BY source LIMIT 60""")] if 'source_sync' in tables else []
          intraday=[{'state':r[0],'n':r[1]} for r in c.execute(
              'SELECT state,COUNT(*) FROM ppi_intraday_contract_state GROUP BY state ORDER BY COUNT(*) DESC LIMIT 20'
              )] if 'ppi_intraday_contract_state' in tables else []
          observer=dict(c.execute('SELECT mode,session_state,ppi_auth,real_orders_sent,http_blocked FROM observer_state WHERE id=1').fetchone())
          c.close()
          files=EvidenceFiles(root,payload_limit=4*1024**2)
          status=files.read('status.json')
          pointer=files.read('CURRENT.json')
          idle=files.read('idle.json')
          verified=None
          try:
              cut=read_committed_generation(root,require_current_status=False)
              report=cut['report']
              family=report.get('family_routing') or {}
              verified={'manifest_valid':True,'generation_id':cut['pointer']['generation_id'],
                  'sequence':cut['pointer']['sequence'],'report_phase':report.get('phase'),
                  'report_status':report.get('status'),
                  'family_statuses':[{'family':r.get('family'),'catalog_count':r.get('catalog_count'),
                      'status':r.get('status'),'entry_authority':r.get('entry_authority')}
                      for r in family.get('families',[])],
                  'source_errors_count':len(report.get('source_errors') or []),
                  'native_ppi_errors_count':len(report.get('native_ppi_errors') or [])}
          except Exception as exc:verified={'manifest_valid':False,'error_class':type(exc).__name__}
          now=time.time()
          sources=[]
          for name in ('rc6_public_sources_latest.json','iol_shadow_latest.json',
                       'iol_family_reference_latest.json','rc6_ppi_capacity_latest.json'):
              p=Path('/app/data/market')/name
              sources.append({'name':name,'exists':p.is_file(),
                  'age_seconds':round(now-p.stat().st_mtime) if p.is_file() else None})
          result={'schema':'rc6-a77-shadow-family-preopen-v1','read_only':True,
                  'observer':observer,'candidate_families':candidate,'catalog_families':catalog,
                  'source_sync':sync,'intraday_contract_states':intraday,
                  'shadow_status':{k:status.get(k) for k in ('as_of','phase','status','catalog_ready_count',
                      'provider_requests','real_orders_sent','real_routes','capacity_policy_status',
                      'entry_signal_lab_status','operational_funnel_status','ppi_watch')} if isinstance(status,dict) else None,
                  'pointer_sequence':pointer.get('sequence') if isinstance(pointer,dict) else None,
                  'idle':{k:idle.get(k) for k in ('schema','last_generation_id','source_freshness_renewed',
                      'real_orders_sent')} if isinstance(idle,dict) else None,
                  'validated_last_cut':verified,'source_artifacts':sources,
                  'history_writes':False,'provider_requests':0,'ppi_watch_accessed':False,
                  'real_routes':'NOT_CALLED'}
          print(json.dumps(result,sort_keys=True,default=str))
          PY
      - name: Reconcile family blocker reasons and SHADOW candidate epoch read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 50 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n docker exec -i porota_production_observer python -' <<'PY'
          import json,sqlite3
          from pathlib import Path
          db=Path('/app/data/paper_v17/observer_v17.db')
          c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=.3)
          c.row_factory=sqlite3.Row;c.execute('PRAGMA query_only=ON');c.execute('PRAGMA busy_timeout=300')
          current=c.execute("""SELECT COUNT(*) n,MIN(checked_at) min_at,MAX(checked_at) max_at
              FROM candidate_identity_v2 WHERE status='AVAILABLE' AND can_simulate=1""").fetchone()
          reasons=[{'family':r[0],'reason':r[1],'n':r[2]}
              for r in c.execute("""SELECT instrument_type,
                  CASE WHEN instr(detail,';')>0 THEN substr(detail,1,instr(detail,';')-1)
                       ELSE substr(detail,1,100) END,COUNT(*)
                  FROM candidate_identity_v2 WHERE status='PAUSED_EXPLICIT'
                  GROUP BY instrument_type,2 ORDER BY instrument_type,COUNT(*) DESC LIMIT 45""")]
          contracts={}
          if c.execute("SELECT 1 FROM sqlite_master WHERE name='contract_evidence_v2_current'").fetchone():
              cols=[r[1] for r in c.execute('PRAGMA table_info(contract_evidence_v2_current)')]
              contracts={'count':c.execute('SELECT COUNT(*) FROM contract_evidence_v2_current').fetchone()[0],
                  'columns':cols[:25]}
          intraday=c.execute("""SELECT MAX(checked_at),MAX(last_source_at)
              FROM ppi_intraday_contract_state""").fetchone()
          result={'schema':'rc6-a77-family-blockers-v1','read_only':True,
              'candidate_ready_current':dict(current),'paused_reasons':reasons,
              'contract_evidence':contracts,'intraday_contract_latest_checked_at':intraday[0],
              'intraday_contract_latest_source_at':intraday[1],
              'history_writes':False,'provider_requests':0,'ppi_watch_accessed':False}
          print(json.dumps(result,sort_keys=True))
          c.close()
          PY
      - name: Trace complete SHADOW to PAPER native ledger read only
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 105 ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n docker exec -i porota_production_observer python -' <<'PY'
          """Bounded, read-only RC6 causal trace inventory for a GitHub Actions probe."""
          import hashlib
          import json
          import sqlite3
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta, timezone
          
          from cg_paper_workspace import artifact_root, database_path
          from rc6_shadow_runtime.persistence import read_committed_generation
          
          
          def safe_json(raw):
              try:
                  return json.loads(raw or "{}")
              except (TypeError, ValueError):
                  return {}
          
          
          db_path = database_path()
          db = sqlite3.connect(db_path.as_uri() + "?mode=ro", uri=True, timeout=0.5)
          db.row_factory = sqlite3.Row
          db.execute("PRAGMA query_only=ON")
          db.execute("PRAGMA busy_timeout=500")
          since = (datetime.now(timezone.utc) - timedelta(days=10)).isoformat()
          tables = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          cut = read_committed_generation(artifact_root(db_path) / "dynamic-shadow", require_current_status=False)
          report = cut["report"]
          funnel = report.get("operational_funnel") or {}
          stages = defaultdict(Counter)
          for row in funnel.get("cohorts") or []:
              stages[(row.get("family"), row.get("channel"))].update(row.get("stages") or {})
          
          native = Counter()
          families = defaultdict(Counter)
          gaps = Counter()
          signal_metrics = Counter()
          blocked_reasons = defaultdict(Counter)
          missing_temporal = []
          examples = []
          last_gate_id = db.execute("SELECT COALESCE(MAX(id),0) FROM trade_gate_evaluations").fetchone()[0] if "trade_gate_evaluations" in tables else 0
          if last_gate_id:
              rows = db.execute("""SELECT g.id,g.decision_key,g.evaluated_at,g.technical_gate,g.patrimonial_gate,
                  g.final_result,g.reason,g.paper_id,g.detail_json,
                  d.action AS decision_action,d.decided_at AS decision_at,
                  p.symbol AS position_symbol,p.asset_class AS position_family,
                  p.settlement AS position_settlement,p.currency AS position_currency,
                  p.market AS position_market,p.opened_at AS opened_at,
                  f.id AS buy_fill_id,f.filled_at AS buy_filled_at,
                  e.payload_json,e.payload_sha256
                  FROM trade_gate_evaluations AS g
                  LEFT JOIN paper_decisions AS d ON d.decision_key=g.decision_key
                  LEFT JOIN paper_positions AS p ON p.paper_id=g.paper_id
                  LEFT JOIN paper_fills AS f ON f.paper_id=g.paper_id AND f.side='BUY_SIMULATED'
                  LEFT JOIN decision_evidence_snapshots AS e ON e.decision_key=g.decision_key
                  WHERE g.id>? AND julianday(g.evaluated_at)>=julianday(?)
                  ORDER BY g.id LIMIT 2001""", (max(0,last_gate_id-10000),since)).fetchall()
              native["gate_rows_bounded"] = min(len(rows),2000)
              native["gate_rows_truncated"] = int(len(rows)>2000)
              for r in rows[:2000]:
                  payload = safe_json(r["payload_json"])
                  quote = payload.get("quote_used") or {}
                  family = quote.get("asset_class") or r["position_family"] or "UNKNOWN"
                  target = families[family]
                  target["gate_rows"] += 1
                  result = r["final_result"]
                  target["final_"+str(result)] += 1
                  if result=="BLOCKED":
                      blocked_reasons[family][str(r["reason"] or "NO_REASON")[:100]] += 1
                  if not r["payload_json"]:
                      gaps["GATE_EVIDENCE_MISSING"] += 1
                  elif hashlib.sha256(r["payload_json"].encode()).hexdigest()!=r["payload_sha256"]:
                      gaps["GATE_EVIDENCE_HASH_MISMATCH"] += 1
                  elif payload.get("decision_key")!=r["decision_key"]:
                      gaps["GATE_EVIDENCE_KEY_MISMATCH"] += 1
                  if not r["decision_action"]:
                      gaps["GATE_PAPER_DECISION_MISSING"] += 1
                  if result=="OPENED_SIMULATED":
                      target["opened_gates"] += 1
                      runtime=payload.get("runtime") or {}
                      inputs=payload.get("inputs_used") or {}
                      vector=inputs.get("entry_signal_inputs") or {}
                      source_status=runtime.get("source_status") or "MISSING"
                      signal_metrics["source_"+str(source_status)] += 1
                      signal_metrics["clock_"+str(runtime.get("clock_mode") or "MISSING")] += 1
                      signal_metrics["vector_"+str(vector.get("price_sample_status") or "MISSING")] += 1
                      signal_metrics["temporal_ready_"+str((vector.get("temporal_contract") or {}).get("temporal_ready"))] += 1
                      if (vector.get("temporal_contract") or {}).get("temporal_ready") is None:
                          missing_temporal.append({"family":family,"gate_id":r["id"],"at":r["evaluated_at"]})
                      signal_metrics["economics_passed_"+str((inputs.get("economics") or {}).get("passed"))] += 1
                      for key in ("signal_at","decision_at","intent_at"):
                          signal_metrics[key+("_present" if runtime.get(key) else "_missing")] += 1
                      if not isinstance(runtime.get("git_sha"),str) or len(runtime["git_sha"])!=40:
                          gaps["OPEN_GATE_FROZEN_SOURCE_SHA_MISSING"] += 1
                      if not runtime.get("configuration_fingerprint"):
                          gaps["OPEN_GATE_CONFIGURATION_FINGERPRINT_MISSING"] += 1
                      if r["technical_gate"]!="APPROVE" or r["patrimonial_gate"]!="APPROVE":
                          gaps["OPEN_GATE_PORTON_CONTRADICTION"] += 1
                      samples=vector.get("price_samples") or []
                      if samples:
                          observed=tuple(quote.get(k) for k in ("symbol","asset_class","settlement","currency","market"))
                          if any(tuple(s.get(k) for k in ("symbol","asset_class","settlement","currency","market"))!=observed for s in samples):
                              gaps["OPEN_GATE_SIGNAL_SAMPLE_IDENTITY_MISMATCH"] += 1
                      if vector.get("price_sample_status")=="NATIVE_EXACT_VECTOR" and len(samples)<3:
                          gaps["OPEN_GATE_EXACT_VECTOR_SHORT"] += 1
                      try:
                          observed_at=datetime.fromisoformat(quote["observed_at"])
                          signal_at=datetime.fromisoformat(runtime["signal_at"])
                          decision_at=datetime.fromisoformat(runtime["decision_at"])
                          filled_at=datetime.fromisoformat(r["buy_filled_at"])
                          if not observed_at<=signal_at<=decision_at<=filled_at:
                              gaps["OPEN_GATE_CAUSAL_CLOCK_ORDER_INVALID"] += 1
                          if any(not datetime.fromisoformat(s["source_at"])<=datetime.fromisoformat(s["received_at"])<=
                                     datetime.fromisoformat(s["known_at"])<=signal_at for s in samples):
                              gaps["OPEN_GATE_SAMPLE_CLOCK_ORDER_INVALID"] += 1
                          else:
                              signal_metrics["sample_clocks_causal"] += 1
                      except (KeyError,TypeError,ValueError):
                          gaps["OPEN_GATE_CAUSAL_CLOCK_UNVERIFIED"] += 1
                      if not (r["paper_id"] and r["position_symbol"] and r["buy_fill_id"]):
                          gaps["OPEN_GATE_WITHOUT_POSITION_AND_BUY_FILL"] += 1
                      else:
                          target["exact_buy_fill_linked"] += 1
                          expected=(r["position_symbol"],r["position_family"],r["position_settlement"],r["position_currency"],r["position_market"])
                          observed=tuple(quote.get(k) for k in ("symbol","asset_class","settlement","currency","market"))
                          if expected!=observed:
                              gaps["OPEN_GATE_QUOTE_IDENTITY_MISMATCH"] += 1
                          if r["buy_filled_at"]!=r["opened_at"]:
                              gaps["OPEN_GATE_FILL_CLOCK_MISMATCH"] += 1
                          if r["decision_action"]!="BUY":
                              gaps["OPEN_GATE_WITHOUT_BUY_DECISION"] += 1
                          details=safe_json(r["detail_json"])
                          adm_key=details.get("financial_admission_snapshot_key")
                          adm_sha=details.get("financial_admission_snapshot_sha256")
                          if not adm_key or not adm_sha:
                              gaps["OPEN_GATE_ADMISSION_SNAPSHOT_UNLINKED"] += 1
                          else:
                              admission=db.execute("SELECT payload_json,payload_sha256 FROM decision_evidence_snapshots WHERE decision_key=?",(adm_key,)).fetchone()
                              if not admission or admission["payload_sha256"]!=adm_sha or hashlib.sha256(admission["payload_json"].encode()).hexdigest()!=adm_sha:
                                  gaps["OPEN_GATE_ADMISSION_SNAPSHOT_INVALID"] += 1
                              else:
                                  frozen=safe_json(admission["payload_json"])
                                  if frozen.get("native_decision_key")!=r["decision_key"] or (frozen.get("decision") or {}).get("paper_id")!=r["paper_id"]:
                                      gaps["OPEN_GATE_ADMISSION_SNAPSHOT_CAUSAL_MISMATCH"] += 1
                                  else:
                                      target["atomic_admission_linked"] += 1
                  elif r["paper_id"] and r["buy_fill_id"]:
                      gaps["NON_OPEN_GATE_WITH_BUY_FILL"] += 1
                  if len(examples)<10 and result=="OPENED_SIMULATED":
                      examples.append({"family":family,"gate_id":r["id"],"time":r["evaluated_at"],"filled_at":r["buy_filled_at"]})
          
          fill_counts=[]
          if {"paper_fills","paper_positions"}<=tables:
              fill_counts=[dict(r) for r in db.execute("""SELECT p.asset_class family,f.side,COUNT(*) n,MAX(f.filled_at) last_at
                  FROM paper_fills f JOIN paper_positions p ON p.paper_id=f.paper_id
                  WHERE julianday(f.filled_at)>=julianday(?)
                  GROUP BY p.asset_class,f.side ORDER BY p.asset_class,f.side""",(since,))]
          lifetime={}
          if {"paper_positions","paper_fills"}<=tables:
              lifetime["positions"]=[dict(r) for r in db.execute("""SELECT asset_class family,status,
                  COUNT(*) n,MIN(opened_at) first_at,MAX(opened_at) last_at
                  FROM paper_positions GROUP BY asset_class,status ORDER BY asset_class,status""")]
              lifetime["fills"]=[dict(r) for r in db.execute("""SELECT p.asset_class family,f.side,
                  COUNT(*) n,MAX(f.filled_at) last_at
                  FROM paper_fills f JOIN paper_positions p ON p.paper_id=f.paper_id
                  GROUP BY p.asset_class,f.side ORDER BY p.asset_class,f.side""")]
          if "trade_gate_evaluations" in tables:
              by_family=defaultdict(Counter)
              for r in db.execute("""SELECT g.final_result,e.payload_json FROM trade_gate_evaluations g
                  LEFT JOIN decision_evidence_snapshots e ON e.decision_key=g.decision_key ORDER BY g.id LIMIT 10000"""):
                  family=(safe_json(r["payload_json"]).get("quote_used") or {}).get("asset_class") or "UNKNOWN"
                  by_family[family][r["final_result"]] += 1
              lifetime["gate_results"]={k:dict(v) for k,v in sorted(by_family.items())}
          if "candidate_identity_v2" in tables:
              lifetime["candidate_authority"]=[dict(r) for r in db.execute("""SELECT instrument_type family,
                  SUM(CASE WHEN status='AVAILABLE' AND can_simulate=1 THEN 1 ELSE 0 END) ready,
                  SUM(CASE WHEN status='PAUSED_EXPLICIT' THEN 1 ELSE 0 END) paused
                  FROM candidate_identity_v2 GROUP BY instrument_type ORDER BY instrument_type""")]
          candidate_counts=[]
          if "scalping_candidates" in tables:
              candidate_counts=[dict(r) for r in db.execute("""SELECT asset_class family,action,COUNT(*) n,MAX(evaluated_at) last_at
                  FROM scalping_candidates WHERE julianday(evaluated_at)>=julianday(?)
                  GROUP BY asset_class,action ORDER BY asset_class,action""",(since,))]
              lifetime["scalping_candidates"]=[dict(r) for r in db.execute("""SELECT asset_class family,action,
                  COUNT(*) n,MAX(evaluated_at) last_at FROM scalping_candidates
                  GROUP BY asset_class,action ORDER BY asset_class,action""")]
          future_counts=[]
          if "paper_family_lifecycle_events" in tables:
              future_counts=[dict(r) for r in db.execute("""SELECT family,to_state,COUNT(*) n,MAX(occurred_at) last_at
                  FROM paper_family_lifecycle_events WHERE julianday(occurred_at)>=julianday(?)
                  GROUP BY family,to_state ORDER BY family,to_state""",(since,))]
          specialized={}
          if "paper_cauciones" in tables:
              specialized["cauciones"]=[dict(r) for r in db.execute("""SELECT status,COUNT(*) n,
                  MIN(opened_at) first_at,MAX(opened_at) last_at,
                  SUM(CASE WHEN julianday(opened_at)>=julianday(?) THEN 1 ELSE 0 END) recent
                  FROM paper_cauciones GROUP BY status ORDER BY status""",(since,))]
          if "paper_family_lifecycle_events" in tables:
              specialized["family_lifecycle"]=[dict(r) for r in db.execute("""SELECT family,to_state,
                  COUNT(*) n,MAX(occurred_at) last_at,
                  SUM(CASE WHEN julianday(occurred_at)>=julianday(?) THEN 1 ELSE 0 END) recent
                  FROM paper_family_lifecycle_events GROUP BY family,to_state ORDER BY family,to_state""",(since,))]
          observer=dict(db.execute("SELECT mode,session_state,real_orders_sent FROM observer_state WHERE id=1").fetchone())
          db.close()
          from rc6_dynamic_universe.routing import strategy_route
          families_to_check=("ACCIONES","CEDEARS","ETFS","BONOS","LETRAS","OBLIGACIONES","OPCIONES","FUTUROS","CAUCIONES","FCI")
          routes=[{k:strategy_route(family).get(k) for k in ("family","engine","status","generic_equity","strategy_status","reason_codes")}
                  for family in families_to_check]
          out={"schema":"rc6-a78-causal-trace-readonly-v1","read_only":True,"as_of_utc":datetime.now(timezone.utc).isoformat(),
               "window_since_utc":since,"shadow_generation":{"as_of":report.get("as_of"),"phase":report.get("phase"),
               "status":report.get("status"),"sequence":cut["pointer"].get("sequence"),
               "computed_audit_state":(cut.get("computed_audit") or {}).get("state")},
               "funnel":{"status":funnel.get("status"),"sessions_retained":funnel.get("sessions_retained"),
               "source_gaps":funnel.get("source_gaps"),"source_read_truncated":funnel.get("source_read_truncated"),
               "shadow_to_factual_causality":funnel.get("shadow_to_factual_causality"),
               "durable_counts":funnel.get("counts"),"by_currency_channel":funnel.get("by_currency_channel"),
               "family_channel_stages":[{"family":family,"channel":channel,"stages":dict(counts)}
                                        for (family,channel),counts in sorted(stages.items())]},
               "entry_signal_lab":{k:(report.get("entry_signal_lab") or {}).get(k) for k in
                                   ("status","native_decisions_observed","source_read_truncated","cohort_total")},
               "native_gate_rows":{"bounds":dict(native),"by_family":{k:dict(v) for k,v in sorted(families.items())},
                                   "gaps":dict(gaps),"signal_metrics":dict(signal_metrics),
                                   "missing_temporal":missing_temporal,
                                   "blocked_reasons":{k:v.most_common(12) for k,v in sorted(blocked_reasons.items())},
                                   "opened_examples":examples},
               "spot_fill_counts":fill_counts,"scalping_candidates":candidate_counts,"lifetime":lifetime,"routes":routes,
               "future_lifecycle_counts":future_counts,"specialized":specialized,"observer":observer,
               "history_writes":False,"provider_requests":0,"ppi_watch_accessed":False,"real_routes":"NOT_CALLED"}
          print(json.dumps(out,sort_keys=True,default=str))
