name: RC6 FCI Prefix Universe Sweep Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-fci-prefix-universe-sweep-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Derive web prefixes and validate returned identities through PPI production API
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo HOST_SHA="$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import json,sqlite3,re,time
          from bf_production_paper_observer import _secret
          from bd_ppi_readonly_guard import ProductionMarketReader

          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20);c.row_factory=sqlite3.Row;c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('PRE_SAFETY='+'|'.join(map(str,(q,*st))))
          web={}
          for family in ('FCI','FCI_EXTERIOR'):
              row=c.execute('''select s.evidence_json from contract_evidence_v2_current cur
                               join contract_evidence_v2_snapshots s on s.snapshot_id=cur.snapshot_id
                               where upper(cur.family)=? and cur.source_class='PPI_AUTHENTICATED_WEB'
                               order by s.observed_at desc limit 1''',(family,)).fetchone()
              ev=json.loads(row['evidence_json'] or '{}') if row else {}
              names=[]
              for item in ev.get('unlinked_observations_sample') or []:
                  if isinstance(item,dict):
                      n=re.sub(r'\s+',' ',str(item.get('identity_observed') or '')).strip()
                      if n: names.append(n)
              prefixes=[]
              for n in names:
                  p=n.split()[0].strip('()[]{}.,;:').strip()
                  if len(p)>=3 and p.upper() not in {'THE','FUND','FONDO'} and p.casefold() not in {x.casefold() for x in prefixes}:
                      prefixes.append(p)
              web[family]=prefixes[:12]
              print('PREFIXES='+json.dumps({'family':family,'prefixes':web[family]},ensure_ascii=False,sort_keys=True))
          c.close()

          reader=ProductionMarketReader(*_secret())
          safe_keys=('ticker','description','currency','type','market','settlement','id','instrumentId','instrumentID')
          discovered={}
          try:
              reader.login_once()
              cfg=reader.market_configuration()
              for family,market in (('FCI','BYMA'),('FCI-EXTERIOR','OTC')):
                  found={}
                  for prefix in web.get(family,[]):
                      try:
                          payload=reader.search_instruments(prefix,family,name=prefix,market=market)
                          rows=[{k:raw.get(k) for k in safe_keys if k in raw} for raw in payload[:50]]
                          print('PREFIX_RESULT='+json.dumps({'family':family,'prefix':prefix,'market':market,'count':len(payload),'rows':rows},ensure_ascii=False,sort_keys=True,default=str))
                          for raw in payload:
                              if not isinstance(raw,dict): continue
                              t=str(raw.get('ticker') or '').strip().upper()
                              typ=str(raw.get('type') or '').strip().upper()
                              m=str(raw.get('market') or '').strip().upper()
                              if t and typ==family and m==market:
                                  found[t]={k:raw.get(k) for k in safe_keys if k in raw}
                      except Exception as exc:
                          print('PREFIX_RESULT='+json.dumps({'family':family,'prefix':prefix,'market':market,'count':0,'error':type(exc).__name__+':'+str(exc)[:180]},ensure_ascii=False,sort_keys=True))
                      time.sleep(0.18)
                  discovered[family]=found
                  print('DISCOVERED_SUMMARY='+json.dumps({'family':family,'market':market,'count':len(found),'tickers':sorted(found)},ensure_ascii=False,sort_keys=True))
              print('HTTP_BLOCKED='+str(reader.metrics['http_blocked']))
              assert reader.metrics['http_blocked']==0
          finally:
              reader.close()

          c=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=20);c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone();c.close()
          assert q=='ok' and st and st[0]=='PRODUCTION_PAPER' and int(st[2] or 0)==0
          print('FINAL_SAFETY='+'|'.join(map(str,(q,*st))))
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          print('MUTATIONS=NONE')
          PY
          HOST
