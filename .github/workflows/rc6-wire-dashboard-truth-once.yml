name: RC6 wire dashboard truth layer

on:
  push:
    branches:
      - candidate/v17.0.0-rc6-weekend-20260905
    paths:
      - 'ep_dashboard_truth_layer_rc6.py'
      - 'scripts/rc6_wire_dashboard_truth.py'
      - 'tests/test_dashboard_truth_layer_rc6.py'
      - '.github/workflows/rc6-wire-dashboard-truth-once.yml'

permissions:
  contents: write

concurrency:
  group: rc6-wire-dashboard-truth
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0

      - name: Verify exact RC5 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD

      - name: Wire truth layer deterministically
        run: python scripts/rc6_wire_dashboard_truth.py

      - name: Compile dashboard modules
        run: python -m py_compile ep_dashboard_truth_layer_rc6.py en_validation_project_dashboard_rc6.py o_dashboard.py

      - name: Pure dashboard semantics smoke
        shell: bash
        run: |
          python - <<'PY'
          import ep_dashboard_truth_layer_rc6 as t
          assert t.market_sensitive_display_state('RUNNING',session_state='MARKET_CLOSED',open_positions=0)=='EN_ESPERA_MERCADO_CERRADO'
          assert t.market_sensitive_display_state('RUNNING',session_state='WAITING_MARKET',open_positions=1)=='MONITOREO_PASIVO'
          assert t.market_sensitive_display_state('STALE',session_state='MARKET_CLOSED',open_positions=0)=='STALE'
          assert 'no es el modo global' in t.policy_description('BINDING')
          print('RC6_DASHBOARD_TRUTH_SMOKE=GREEN')
          PY

      - name: Commit wiring only if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- o_dashboard.py; then
            echo 'RC6_DASHBOARD_TRUTH_WIRING_COMMIT=NOT_NEEDED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add o_dashboard.py
          git commit -m 'RC6: wire dashboard truth layer [skip ci]'
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
