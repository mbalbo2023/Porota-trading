name: RC6 Wave18 Final Ready Deploy 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave18-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave18-final-ready-deploy-20260909.yml']
permissions:
  contents: read
jobs:
  ready-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: W18 control-plane certification
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q pytest
          python -m py_compile fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py
          PYTHONPATH=. pytest -q tests/test_critical_approval_gateway_rc6.py tests/test_critical_github_proxy_rc6.py
          bash -n ops/rc6_deploy_critical_control_plane.sh
          ! grep -REn '(/Operar|api/Orders|send_order|place_order|new_order)' fg_critical_approval_gateway_rc6.py fm_critical_approval_unix_runtime_rc6.py fn_critical_github_proxy_rc6.py
          ! grep -En 'CONTROL_PLANE_ROLLBACK|trap[[:space:]]+cleanup[[:space:]]+EXIT|systemctl disable --now porota-critical' ops/rc6_deploy_critical_control_plane.sh
          grep -q 'trap cleanup_stage EXIT' ops/rc6_deploy_critical_control_plane.sh
          echo 'AUTO_ROLLBACK_PRESENT=NO'
          echo 'RECOVERY_AUTHORIZED_MANUAL=YES'
          echo "CERTIFIED_SOURCE_SHA=${GITHUB_SHA}"
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w18ready"; chmod 600 "$HOME/.ssh/w18ready"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only live safety proof
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w18ready" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading; LIVE=9197aedf35fe1739b594c742902e80df069c47c9; test "$(git rev-parse HEAD)" = "$LIVE"
          OBS1=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer); DASH1=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on'); q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close(); print(f'DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          git fetch --no-tags origin deploy-prep/rc6-wave18-currentbase-20260909; test "$(git rev-parse origin/deploy-prep/rc6-wave18-currentbase-20260909)" = "$TARGET_SHA"
          OBS2=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer); DASH2=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)
          test "$OBS1" = "$OBS2"; test "$DASH1" = "$DASH2"; test "$(git rev-parse HEAD)" = "$LIVE"
          echo "CERTIFIED_SOURCE_SHA=$TARGET_SHA"; echo 'ORDER_ROUTES=NOT_CALLED'; echo 'REAL_ORDER_TEST=NOT_PERFORMED'; echo 'RUNTIME_CHANGED=NO'; echo 'ROLLBACK_AUTOMATICO=NO'; echo 'W18_READY_DEPLOY=YES'
          REMOTE
