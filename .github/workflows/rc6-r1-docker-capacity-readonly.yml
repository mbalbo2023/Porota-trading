name: RC6 R1 Docker Capacity READ_ONLY

# Manual, bounded host inventory. Never touches PPI, runtime, Docker objects,
# data, locks or cleanup. Legacy host inventory holds the global deploy mutex;
# current-login OS prerequisite metadata is disjoint and never locks deploy.
on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact last observed physical product SHA (required in legacy capacity mode only)
        required: false
        type: string
        default: ''
      inspect_rc6_timers:
        description: Include bounded READ_ONLY evidence for 16 versioned RC6 timers
        required: false
        type: boolean
        default: false
      rootless_metadata_only:
        description: Inspect only Porota's dedicated private rootless UID/socket/data-root (no global Docker)
        required: false
        type: boolean
        default: false
      current_login_capability_only:
        description: Current nonroot login OS prerequisites only (never connect to Docker, sudo or any socket)
        required: false
        type: boolean
        default: false
      linger_inventory_only:
        description: UID1000 logind/user-systemd bounded inventory only (read-only user D-Bus; no Docker)
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-r1-docker-capacity-readonly.yml'
      - 'scripts/rc6_rootless_metadata_readonly.py'
      - 'tests/test_rc6_rootless_metadata_readonly.py'
      - 'scripts/rc6_linger_runtime_inventory_readonly.py'
      - 'tests/test_rc6_linger_runtime_inventory_readonly.py'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check bounded read-only source and untouched worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test -f .github/workflows/rc6-r1-docker-capacity-readonly.yml
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/rc6-r1-docker-capacity-readonly.yml').read_text()
          for required in ('workflow_dispatch:', 'rc6-unified-paper-deploy',
                           'docker', 'statvfs', 'expected_deployed_sha'):
              assert required in source, required
          host=source.rsplit('\n      - name: Read filesystem and Docker metadata only (max 35 seconds)\n',1)[1]
          for forbidden in ('docker prune', 'docker image rm', 'docker system prune',
                            'docker rm ', 'docker rmi ', 'docker exec', 'PPI_GET'):
              assert forbidden not in host, forbidden
          timer=source.split('\n      - name: Inspect RC6 timer contract READ_ONLY\n',1)[1].split(
              '\n      - name: Runner-only SSH cleanup\n',1)[0]
          for forbidden in ('systemctl start', 'systemctl stop', 'systemctl restart',
                            'systemctl enable', 'systemctl disable', 'daemon-reload',
                            'docker image rm', 'docker prune', 'PPI_GET', 'journalctl'):
              assert forbidden not in timer, forbidden
          assert 'inspect_rc6_timers:' in source and 'porota-byma-morning-watch-rc6.timer' in timer
          print('RC6_R1_DOCKER_RO_OFFHOST=GREEN')
          PY
          python3 -m unittest tests.test_rc6_rootless_metadata_readonly -q
          python3 -m unittest tests.test_rc6_linger_runtime_inventory_readonly -q

  host_readonly:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.current_login_capability_only && !inputs.linger_inventory_only
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deployed_sha }}
      ROOTLESS_METADATA_ONLY: ${{ inputs.rootless_metadata_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Bound SHA and runner-only SSH credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$ROOTLESS_METADATA_ONLY" == "true" ]]; then
            [[ -z "$EXPECTED_DEPLOY_SHA" || "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          else
            [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/rc6_r1_capacity"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rc6_r1_capacity/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/rc6_r1_capacity/known_hosts"
          chmod 600 "$RUNNER_TEMP/rc6_r1_capacity/key" "$RUNNER_TEMP/rc6_r1_capacity/known_hosts"
      - name: Read filesystem and Docker metadata only (max 35 seconds)
        if: ${{ !inputs.rootless_metadata_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/rc6_r1_capacity/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6_r1_capacity/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 35 env RC6_EXPECTED_DEPLOY_SHA=$EXPECTED_DEPLOY_SHA python3 -B -" \
            > "$RUNNER_TEMP/rc6_r1_capacity/raw.json" <<'PY'
          import datetime, json, os, re, shutil, subprocess, sys

          def docker(*args):
              command=subprocess.run(('docker',)+args, capture_output=True,
                                     text=True, timeout=9, check=True)
              if len(command.stdout)>131072:
                  raise ValueError('DOCKER_RESPONSE_BOUND')
              return command.stdout.strip()

          try:
              expected=os.environ['RC6_EXPECTED_DEPLOY_SHA']
              if re.fullmatch(r'[a-f0-9]{40}',expected) is None:
                  raise ValueError('EXPECTED_SHA_INVALID')
              disk=shutil.disk_usage('/')
              stat=os.statvfs('/')
              inodes_free=(100*stat.f_favail/stat.f_files) if stat.f_files else 0
              docker_root=docker('info','--format','{{.DockerRootDir}}')
              if (not docker_root.startswith('/') or len(docker_root)>256
                      or not os.path.isdir(docker_root)):
                  raise ValueError('DOCKER_ROOT_UNSAFE')
              docker_disk=shutil.disk_usage(docker_root)
              docker_stat=os.statvfs(docker_root)
              docker_inodes_free=(100*docker_stat.f_favail/docker_stat.f_files) if docker_stat.f_files else 0
              all_containers=docker('ps','-aq','--no-trunc').splitlines()
              all_images=sorted(set(docker('image','ls','-aq','--no-trunc').splitlines()))
              if len(all_containers)>128 or len(all_images)>128:
                  raise ValueError('DOCKER_INVENTORY_BOUND')
              sha=re.compile(r'sha256:[a-f0-9]{64}')
              container=re.compile(r'[a-f0-9]{12,64}')
              if any(container.fullmatch(x) is None for x in all_containers):
                  raise ValueError('CONTAINER_ID_UNSAFE')
              if any(sha.fullmatch(x) is None for x in all_images):
                  raise ValueError('IMAGE_ID_UNSAFE')
              referenced=set()
              for cid in all_containers:
                  value=docker('inspect','--format','{{.Image}}',cid)
                  if sha.fullmatch(value) is None:
                      raise ValueError('REFERENCED_IMAGE_UNSAFE')
                  referenced.add(value)
              owned_names=('porota_production_observer',
                           'porota_production_dashboard','porota_critical_approval_rc6')
              owned=[]
              for name in owned_names:
                  try:
                      value=docker('inspect','--format',
                                   '{{json .State.Running}}|{{json .Image}}',name)
                      running,image_raw=value.split('|',1)
                      image=json.loads(image_raw)
                      if running not in ('true','false') or sha.fullmatch(image) is None:
                          raise ValueError('OWNED_CONTAINER_UNSAFE')
                      owned.append({'name':name,'running':running=='true',
                                    'image_referenced':image in referenced})
                  except subprocess.CalledProcessError:
                      owned.append({'name':name,'state':'ABSENT'})
              candidate=re.compile(r'(?:porota-predeploy-v2:|porota-trading-bot:17\.0\.0-rc6-candidate-)[a-f0-9]{40}')
              eligible=0
              eligible_bytes_upper_bound=0
              candidate_ref=0
              protected=0
              for iid in all_images:
                  fields=docker('image','inspect','--format',
                     '{{json .Id}}|{{json .RepoTags}}|{{json .RepoDigests}}|{{json .Size}}',iid).split('|')
                  if len(fields)!=4:
                      raise ValueError('IMAGE_FIELDS_UNSAFE')
                  identity,tags,digests,size=map(json.loads,fields)
                  if (identity!=iid or tags is not None and not isinstance(tags,list)
                          or digests is not None and not isinstance(digests,list)
                          or type(size) is not int or size<0):
                      raise ValueError('IMAGE_DETAILS_UNSAFE')
                  tags=tags or []
                  digests=digests or []
                  if (any(type(t) is not str for t in tags+digests)):
                      raise ValueError('IMAGE_TAGS_UNSAFE')
                  if iid in referenced:
                      candidate_ref+=int(bool(tags) and all(candidate.fullmatch(t) for t in tags))
                      continue
                  repos={tag.split(':',1)[0] for tag in tags}
                  matched=(bool(tags) and all(candidate.fullmatch(t) for t in tags) and
                    all((m:=re.fullmatch(r'(porota-predeploy-v2|porota-trading-bot)@sha256:[a-f0-9]{64}',d))
                        is not None and m.group(1) in repos for d in digests))
                  if matched:
                      eligible+=1
                      eligible_bytes_upper_bound+=size
                  else:
                      protected+=1
              summary=[]
              for line in docker('system','df','--format','{{json .}}').splitlines():
                  entry=json.loads(line)
                  if not isinstance(entry,dict) or entry.get('Type') not in (
                         'Images','Containers','Local Volumes','Build Cache'):
                      raise ValueError('SYSTEM_DF_UNSAFE')
                  summary.append({k:entry.get(k) for k in
                                 ('Type','TotalCount','Active','Size','Reclaimable')})
              if {entry['Type'] for entry in summary} != {
                    'Images','Containers','Local Volumes','Build Cache'}:
                  raise ValueError('SYSTEM_DF_INCOMPLETE')
              observed=subprocess.run(['git','-C','/opt/porota-trading','rev-parse','HEAD'],
                                      capture_output=True,text=True,timeout=3,check=True).stdout.strip()
              if re.fullmatch(r'[a-f0-9]{40}',observed) is None:
                  raise ValueError('HOST_CODE_ID_INVALID')
              at=datetime.datetime.now(datetime.timezone.utc)
              payload={'schema':'rc6.r1.docker-capacity-readonly.v1',
                  'state':'READ_ONLY_OBSERVED','mutations':0,'provider_gets':0,
                  'generated_at_utc':at.isoformat(),
                  'generated_at_art':at.astimezone(datetime.timezone(datetime.timedelta(hours=-3))).isoformat(),
                  'expected_deployed_sha':expected,'observed_code_sha':observed,
                  'code_identity_matches':observed==expected,
                  'disk_total_bytes':disk.total,'disk_free_bytes':disk.free,
                  'disk_used_bytes':disk.used,'inode_free_percent':round(inodes_free,3),
                  'docker_root_same_filesystem':os.stat(docker_root).st_dev==os.stat('/').st_dev,
                  'docker_root_disk_total_bytes':docker_disk.total,
                  'docker_root_disk_free_bytes':docker_disk.free,
                  'docker_root_inode_free_percent':round(docker_inodes_free,3),
                  'containers_total':len(all_containers),'images_total':len(all_images),
                  'referenced_images':len(referenced),'owned_containers':owned,
                  'unreferenced_candidate_only_images':eligible,
                  'unreferenced_candidate_estimated_upper_bytes':eligible_bytes_upper_bound,
                  'referenced_candidate_only_images':candidate_ref,
                  'other_or_ambiguous_unreferenced_images':protected,
                  'docker_system_df':summary}
              print(json.dumps(payload,sort_keys=True,separators=(',',':')))
          except (Exception,) as exc:
              print(json.dumps({'schema':'rc6.r1.docker-capacity-readonly.v1',
                 'state':'NO_VERIFICADO','mutations':0,'provider_gets':0,
                 'reason':type(exc).__name__},sort_keys=True))
              sys.exit(2)
          PY
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'])/'rc6_r1_capacity/raw.json'
          if raw.stat().st_size>8192:
              raise SystemExit('RC6_R1_DOCKER_RO=RED|RECEIPT_BOUND')
          data=json.loads(raw.read_text())
          if (data.get('schema')!='rc6.r1.docker-capacity-readonly.v1' or
                  data.get('state')!='READ_ONLY_OBSERVED' or
                  data.get('mutations')!=0 or data.get('provider_gets')!=0 or
                  data.get('expected_deployed_sha')!=os.environ['EXPECTED_DEPLOY_SHA']):
              raise SystemExit('RC6_R1_DOCKER_RO=RED|RECEIPT_UNVERIFIED')
          print(json.dumps(data,sort_keys=True))
          print('RC6_R1_DOCKER_RO=GREEN')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### RC6 R1 Docker capacity — READ_ONLY\n\n')
              out.write('```json\n'+json.dumps(data,sort_keys=True,indent=2)+'\n```\n')
          PY
      - name: Inspect RC6 timer contract READ_ONLY
        if: ${{ !inputs.rootless_metadata_only && inputs.inspect_rc6_timers }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/rc6_r1_capacity/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6_r1_capacity/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 50 python3 -B -" \
            > "$RUNNER_TEMP/rc6_r1_capacity/timers.json" <<'PY'
          import hashlib, json, re, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          # Exact ACTIVE_TIMER identifiers from product policy at 7124100b.
          # This is physical observation, never permission to resume a timer.
          names = (
              'porota-runtime-evidence-rc6.timer',
              'porota-candle-integrity-rc6.timer',
              'porota-fast-functional-health-rc6.timer',
              'porota-market-watch-silence-rc6.timer',
              'porota-full-db-integrity-rc6.timer',
              'porota-preopen-rc6.timer',
              'porota-introspection-publish-rc6.timer',
              'porota-introspection-rc6.timer',
              'porota-iol-shadow-collector-rc6.timer',
              'porota-rc6-candle-inmarket-verify.timer',
              'porota-scheduler-export-rc6.timer',
              'porota-snapshot-postclose-rc6.timer',
              'porota-snapshot-preopen-rc6.timer',
              'porota-byma-morning-watch-rc6.timer',
              'porota-iol-oauth-health-rc6.timer',
              'porota-local-eod-history-rc6.timer',
          )
          props = ('Id', 'LoadState', 'ActiveState', 'SubState', 'Result',
                   'UnitFileState', 'ActiveEnterTimestamp',
                   'InactiveEnterTimestamp', 'LastTriggerUSec',
                   'NextElapseUSecRealtime', 'Unit')

          def read_command(*args):
              result = subprocess.run(args, capture_output=True, text=True,
                                      timeout=3, check=False)
              if len(result.stdout) > 2048 or len(result.stderr) > 2048:
                  raise ValueError('SYSTEMCTL_RESPONSE_BOUND')
              return result.stdout.strip(), result.returncode

          def inspect(name):
              if not re.fullmatch(r'porota-[a-z0-9-]+\.timer', name) and name != 'porota-byma-morning-watch-rc6.service':
                  raise ValueError('UNIT_NAME_UNSAFE')
              active, active_rc = read_command('systemctl', 'is-active', name)
              enabled, enabled_rc = read_command('systemctl', 'is-enabled', name)
              raw, show_rc = read_command('systemctl', 'show', name,
                                          '--no-pager', '--property='+','.join(props))
              state = {}
              for line in raw.splitlines():
                  key, sep, value = line.partition('=')
                  if sep and key in props and len(value) <= 96 and re.fullmatch(r'[a-zA-Z0-9 .:+_/-]*', value):
                      state[key] = value
              return {'unit':name, 'active':active[:24] if re.fullmatch(r'[a-z-]{1,24}', active) else 'NO_VERIFICADO',
                      'active_rc':active_rc, 'enabled':enabled[:24] if re.fullmatch(r'[a-z-]{1,24}', enabled) else 'NO_VERIFICADO',
                      'enabled_rc':enabled_rc, 'show_rc':show_rc, 'show':state}

          try:
              if len(names) != 16 or len(set(names)) != 16:
                  raise ValueError('POLICY_TIMER_COUNT_MISMATCH')
              states = [inspect(name) for name in names]
              byma_service = inspect('porota-byma-morning-watch-rc6.service')
              root = Path('/opt/porota-trading/data/deploy')
              receipts = []
              if root.is_dir() and not root.is_symlink():
                  paths = list(root.glob('scheduler-suspend-*.json'))
                  if len(paths) > 128:
                      raise ValueError('SCHEDULER_RECEIPT_COUNT_BOUND')
                  if any(path.is_symlink() for path in paths):
                      raise ValueError('SCHEDULER_RECEIPT_ALIAS')
                  paths.sort(key=lambda path:path.stat().st_mtime, reverse=True)
                  for path in paths[:6]:
                      if path.is_symlink() or path.stat().st_size > 65536:
                          raise ValueError('SCHEDULER_RECEIPT_UNSAFE')
                      raw = path.read_bytes()
                      data = json.loads(raw)
                      candidate = data.get('candidate_sha')
                      status = data.get('status')
                      if not (isinstance(candidate,str) and re.fullmatch(r'[a-f0-9]{40}',candidate)
                              and isinstance(status,str) and re.fullmatch(r'[A-Z_]{1,32}',status)):
                          raise ValueError('SCHEDULER_RECEIPT_METADATA_UNSAFE')
                      receipts.append({'candidate_sha':candidate, 'status':status,
                          'sha256':hashlib.sha256(raw).hexdigest(),
                          'timer_count':len(data.get('timers',[])) if isinstance(data.get('timers'),list) else -1,
                          'attempted_count':len(data.get('attempted',[])) if isinstance(data.get('attempted'),list) else -1})
              payload = {'schema':'rc6.r1.scheduler-physical-readonly.v1',
                  'state':'READ_ONLY_OBSERVED', 'mutations':0, 'provider_gets':0,
                  'policy_product_sha':'7124100b401238e70747d04399bf8054a8e278ae',
                  'generated_at_utc':datetime.now(timezone.utc).isoformat(),
                  'timers':states, 'byma_service':byma_service,
                  'prior_suspend_receipts':receipts}
              print(json.dumps(payload,sort_keys=True,separators=(',',':')))
          except Exception as exc:
              print(json.dumps({'schema':'rc6.r1.scheduler-physical-readonly.v1',
                  'state':'NO_VERIFICADO', 'mutations':0, 'provider_gets':0,
                  'reason':type(exc).__name__},sort_keys=True))
              # The runner rejects this receipt and reports the bounded error.
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'])/'rc6_r1_capacity/timers.json'
          if raw.stat().st_size > 16384:
              raise SystemExit('RC6_R1_SCHEDULER_RO=RED|RECEIPT_BOUND')
          data=json.loads(raw.read_text())
          if data.get('state')!='READ_ONLY_OBSERVED':
              reason=data.get('reason','UNKNOWN')
              print('RC6_R1_SCHEDULER_RO=RED|HOST_REASON='+
                    (reason if isinstance(reason,str) and reason.isidentifier() else 'UNKNOWN'))
              raise SystemExit(2)
          names=[entry.get('unit') for entry in data.get('timers',[])]
          if (data.get('schema')!='rc6.r1.scheduler-physical-readonly.v1' or
              data.get('state')!='READ_ONLY_OBSERVED' or
              data.get('mutations')!=0 or data.get('provider_gets')!=0 or
              len(names)!=16 or len(set(names))!=16 or
              'porota-byma-morning-watch-rc6.timer' not in names):
              raise SystemExit('RC6_R1_SCHEDULER_RO=RED|RECEIPT_UNVERIFIED')
          print(json.dumps(data,sort_keys=True))
          print('RC6_R1_SCHEDULER_RO=GREEN|READ_ONLY_OBSERVED_NOT_DEPLOY_READY')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### RC6 R1 scheduler — physical READ_ONLY (not deploy readiness)\n\n')
              out.write('```json\n'+json.dumps(data,sort_keys=True,indent=2)+'\n```\n')
          PY
      - name: Read private Porota rootless metadata only
        if: ${{ inputs.rootless_metadata_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Explicit account+socket in the streamed probe; no sudo, no default
          # /var/run/docker.sock and no Docker/global image/container inventory.
          ssh -i "$RUNNER_TEMP/rc6_r1_capacity/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6_r1_capacity/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            'test "$(id -u)" = "$(id -u porota-rc6)" && test "$(id -u)" -ge 1000 && timeout 20 python3 -B -' \
            < scripts/rc6_rootless_metadata_readonly.py \
            > "$RUNNER_TEMP/rc6_r1_capacity/rootless.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          raw = Path(os.environ['RUNNER_TEMP']) / 'rc6_r1_capacity/rootless.json'
          if raw.stat().st_size > 8192:
              raise SystemExit('RC6_R1_ROOTLESS_RO=NO_VERIFICADO|RECEIPT_BOUND')
          data = json.loads(raw.read_text())
          core = {'schema', 'state', 'read_only', 'mutations', 'provider_gets',
                  'rootless_certified'}
          positive = core | {'porota_private_account', 'porota_private_socket',
                             'porota_rootless_engine', 'porota_private_data_root',
                             'foreign_docker_inspected'}
          negative = core | {'reason'}
          if (data.get('schema') != 'rc6.r1.rootless-private-readonly.v1'
                  or data.get('read_only') is not True
                  or type(data.get('mutations')) is not int or data['mutations'] != 0
                  or type(data.get('provider_gets')) is not int or data['provider_gets'] != 0
                  or data.get('rootless_certified') is not False):
              raise SystemExit('RC6_R1_ROOTLESS_RO=NO_VERIFICADO|RECEIPT_INVALID')
          if data.get('state') == 'NO_VERIFICADO' and set(data) == negative:
              reason = data['reason']
              if not isinstance(reason, str) or not re.fullmatch(r'[A-Z_]{1,48}', reason):
                  reason = 'HOST_PROBE_FAILED'
              raise SystemExit('RC6_R1_ROOTLESS_RO=NO_VERIFICADO|' + reason)
          if (data.get('state') != 'READ_ONLY_OBSERVED_NOT_CERTIFIED'
                  or set(data) != positive
                  or not all(data[field] is True for field in (
                      'porota_private_account', 'porota_private_socket',
                      'porota_rootless_engine', 'porota_private_data_root'))
                  or data.get('foreign_docker_inspected') is not False):
              raise SystemExit('RC6_R1_ROOTLESS_RO=NO_VERIFICADO|RECEIPT_INVALID')
          print(json.dumps(data, sort_keys=True, separators=(',', ':')))
          print('RC6_R1_ROOTLESS_RO=READ_ONLY_OBSERVED_NOT_CERTIFIED')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Porota private rootless — metadata only, NOT a deploy certificate\n\n')
              out.write('```json\n' + json.dumps(data, sort_keys=True, indent=2) + '\n```\n')
          PY
      - name: Runner-only SSH cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rc6_r1_capacity/key" "$RUNNER_TEMP/rc6_r1_capacity/known_hosts" "$RUNNER_TEMP/rc6_r1_capacity/raw.json" "$RUNNER_TEMP/rc6_r1_capacity/timers.json" "$RUNNER_TEMP/rc6_r1_capacity/rootless.json"

  current_login_readonly:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.current_login_capability_only || inputs.linger_inventory_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      # Do not load repository code or any secret before proving that the
      # workflow identity is the exact protected-main source under review.
      - name: Validate current-login trusted context
        shell: bash
        env:
          RC6_LINGER_ONLY: ${{ inputs.linger_inventory_only }}
          RC6_CURRENT_LOGIN_ONLY: ${{ inputs.current_login_capability_only }}
          RC6_ROOTLESS_ONLY: ${{ inputs.rootless_metadata_only }}
          RC6_TIMER_MODE: ${{ inputs.inspect_rc6_timers }}
          RC6_DEPLOY_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REPOSITORY:-}" != "mbalbo2023/Porota-trading" ||
                "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ||
                "${GITHUB_REF:-}" != "refs/heads/main" ||
                "${GITHUB_REF_PROTECTED:-}" != "true" ||
                "${GITHUB_WORKFLOW_REF:-}" != "mbalbo2023/Porota-trading/.github/workflows/rc6-r1-docker-capacity-readonly.yml@refs/heads/main" ||
                ! "${GITHUB_WORKFLOW_SHA:-}" =~ ^[0-9a-f]{40}$ ||
                "${GITHUB_WORKFLOW_SHA:-}" != "${GITHUB_SHA:-}" ||
                "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            echo 'RC6_CURRENT_LOGIN_RO=UNTRUSTED_CONTEXT|CERT2=NO_VERIFICADO'
            exit 79
          fi
          # The user-bus inventory is opt-in, exclusive and cannot fall into
          # the legacy rootful host path or any other inspection mode.
          if [[ "${RC6_LINGER_ONLY:-false}" == "true" &&
                ( "${RC6_CURRENT_LOGIN_ONLY:-false}" != "false" ||
                  "${RC6_ROOTLESS_ONLY:-false}" != "false" ||
                  "${RC6_TIMER_MODE:-false}" != "false" ||
                  -n "${RC6_DEPLOY_SHA:-}" ) ]]; then
            echo 'RC6_LINGER_INVENTORY=INPUT_MODE_CONFLICT|CERT2=NO_VERIFICADO'
            exit 79
          fi
      - name: Checkout exact trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify trusted checkout and offhost contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]]
          python3 -m unittest tests.test_rc6_rootless_metadata_readonly -q
          python3 -m unittest tests.test_rc6_linger_runtime_inventory_readonly -q
      - name: Read current login OS metadata without Docker or sudo
        if: ${{ inputs.current_login_capability_only }}
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$DO_HOST" =~ ^[a-zA-Z0-9.-]{1,253}$ ]]
          [[ "$DO_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          install -m 700 -d "$RUNNER_TEMP/rc6_current_login_ro"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rc6_current_login_ro/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/rc6_current_login_ro/known_hosts"
          chmod 600 "$RUNNER_TEMP/rc6_current_login_ro/key" "$RUNNER_TEMP/rc6_current_login_ro/known_hosts"
          # This streams a bounded Python metadata probe through the existing
          # authenticated login. It never invokes Docker, sudo or socket.connect.
          ssh -F /dev/null -i "$RUNNER_TEMP/rc6_current_login_ro/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6_current_login_ro/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            '/usr/bin/timeout 25 /usr/bin/python3 -I -S -B - --current-login' \
            < scripts/rc6_rootless_metadata_readonly.py \
            > "$RUNNER_TEMP/rc6_current_login_ro/receipt.json" 2>/dev/null
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          raw = Path(os.environ['RUNNER_TEMP']) / 'rc6_current_login_ro/receipt.json'
          if raw.stat().st_size > 4096:
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_BOUND|CERT2=NO_VERIFICADO')
          def no_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('DUPLICATE_KEY')
                  result[key] = value
              return result
          def reject_non_json_constant(_):
              raise ValueError('NON_JSON_NUMBER')
          try:
              data = json.loads(raw.read_text(), object_pairs_hook=no_duplicate_keys,
                                parse_constant=reject_non_json_constant)
          except (ValueError, UnicodeError):
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          common = {'schema', 'state', 'read_only', 'mutations', 'provider_gets',
                    'docker_queries', 'socket_connections', 'sudo_executed',
                    'rootless_certified'}
          positive = common | {'foreign_docker_inspected', 'principal_nonroot_unique',
                    'runtime_directory_private', 'user_manager_socket_present',
                    'rootless_tools_present', 'rootless_launcher_present',
                    'user_linger_record_present', 'user_linger_marker_status',
                    'subuids_assigned', 'userns_enabled',
                    'default_socket_absent', 'project_socket_namespace_absent',
                    'ready_for_private_rootless_review'}
          negative = common | {'reason'}
          if (not isinstance(data, dict) or
                  data.get('schema') != 'rc6.r1.current-login-capability-readonly.v1' or
                  data.get('state') != 'NO_VERIFICADO' or
                  data.get('read_only') is not True or
                  any(type(data.get(k)) is not int or data[k] != 0 for k in
                      ('mutations','provider_gets','docker_queries','socket_connections')) or
                  data.get('sudo_executed') is not False or
                  data.get('rootless_certified') is not False):
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          if set(data) == negative:
              if not isinstance(data.get('reason'), str) or not re.fullmatch(
                      r'[A-Z_]{1,48}', data['reason']):
                  raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
              raise SystemExit('RC6_CURRENT_LOGIN_RO=PREREQUISITES_UNVERIFIED|CERT2=NO_VERIFICADO')
          if (set(data) != positive or
                  data.get('foreign_docker_inspected') is not False or
                  any(type(data.get(k)) is not bool for k in positive - common -
                      {'foreign_docker_inspected', 'user_linger_marker_status'})):
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          # A loginctl Linger=yes claim is NOT made: this is only rooted
          # on-disk marker metadata, classified by the nonroot OS probe.
          marker_status = data['user_linger_marker_status']
          marker_codes = {'TRUSTED', 'PARENT_MISSING', 'PARENT_UNTRUSTED',
                          'PARENT_UNVERIFIED', 'MARKER_MISSING',
                          'MARKER_UNTRUSTED', 'MARKER_UNVERIFIED'}
          if (type(marker_status) is not str or marker_status not in marker_codes or
                  data['user_linger_record_present'] is not (marker_status == 'TRUSTED')):
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          required = tuple(positive - common - {'foreign_docker_inspected',
                             'ready_for_private_rootless_review',
                             'user_linger_marker_status'})
          # The public failure output contains only bounded, allowlisted
          # categories. Never log the raw host receipt, login, paths or maps.
          reason_codes = (
              ('principal_nonroot_unique', 'LOGIN_IDENTITY'),
              ('runtime_directory_private', 'RUNTIME_DIRECTORY'),
              ('user_manager_socket_present', 'USER_MANAGER_BUS'),
              ('rootless_tools_present', 'ROOTLESS_TOOLCHAIN'),
              ('rootless_launcher_present', 'ROOTLESS_LAUNCHER'),
              ('user_linger_record_present', 'SYSTEMD_LINGER'),
              ('subuids_assigned', 'SUBID_MAPPINGS'),
              ('userns_enabled', 'USER_NAMESPACE'),
              ('default_socket_absent', 'DEFAULT_SOCKET_CONFLICT'),
              ('project_socket_namespace_absent', 'PROJECT_NAMESPACE_CONFLICT'),
          )
          if {field for field, _ in reason_codes} != set(required):
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          ready = all(data[field] for field, _ in reason_codes)
          if data['ready_for_private_rootless_review'] is not ready:
              raise SystemExit('RC6_CURRENT_LOGIN_RO=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          if not ready:
              missing = ','.join(code for field, code in reason_codes if not data[field])
              linger_code = ('|LINGER_MARKER_STATUS=' + marker_status
                             if not data['user_linger_record_present'] else '')
              raise SystemExit('RC6_CURRENT_LOGIN_RO=PREREQUISITES_INCOMPLETE'
                               '|MISSING_CATEGORIES=' + missing + linger_code +
                               '|CERT2=NO_VERIFICADO')
          print('RC6_CURRENT_LOGIN_RO=PREREQUISITES_READY_NOT_CERTIFIED|CERT2=NO_VERIFICADO')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### RC6 current-login OS prerequisites (metadata READ_ONLY)\n\n')
              out.write('Readiness metadata observed; no daemon queried, no socket connected, '
                        'no host changes. No runtime/deployment certification.\n')
          PY
      - name: Read bounded systemd user inventory
        if: ${{ inputs.linger_inventory_only }}
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$DO_HOST" =~ ^[a-zA-Z0-9.-]{1,253}$ &&
                   "$DO_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ &&
                   -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]; then
            echo 'RC6_LINGER_INVENTORY=CREDENTIAL_PREREQUISITES_UNVERIFIED|CERT2=NO_VERIFICADO'
            exit 79
          fi
          install -m 700 -d "$RUNNER_TEMP/rc6_current_login_ro"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rc6_current_login_ro/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/rc6_current_login_ro/known_hosts"
          chmod 600 "$RUNNER_TEMP/rc6_current_login_ro/key" "$RUNNER_TEMP/rc6_current_login_ro/known_hosts"
          # Fixed opt-in nonroot systemd user D-Bus reads only. The remote
          # script emits aggregate enum categories, never unit names or paths.
          if ! ssh -F /dev/null -i "$RUNNER_TEMP/rc6_current_login_ro/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/rc6_current_login_ro/known_hosts" \
              -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
              "$DO_USER@$DO_HOST" \
              '/usr/bin/timeout 25 /usr/bin/python3 -I -S -B - --linger-inventory' \
              < scripts/rc6_linger_runtime_inventory_readonly.py \
              > "$RUNNER_TEMP/rc6_current_login_ro/linger.json" 2>/dev/null; then
            echo 'RC6_LINGER_INVENTORY=SSH_OR_REMOTE_UNVERIFIED|CERT2=NO_VERIFICADO'
            exit 79
          fi
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'rc6_current_login_ro/linger.json'
          try:
              raw = path.read_bytes()
          except OSError:
              raise SystemExit('RC6_LINGER_INVENTORY=RECEIPT_UNAVAILABLE|CERT2=NO_VERIFICADO')
          if len(raw) > 4096:
              raise SystemExit('RC6_LINGER_INVENTORY=RECEIPT_BOUND|CERT2=NO_VERIFICADO')
          def no_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('DUPLICATE_KEY')
                  result[key] = value
              return result
          def reject_non_json_constant(_):
              raise ValueError('NON_JSON_NUMBER')
          try:
              data = json.loads(raw.decode('utf-8'), object_pairs_hook=no_duplicate_keys,
                                parse_constant=reject_non_json_constant)
          except (ValueError, UnicodeError):
              raise SystemExit('RC6_LINGER_INVENTORY=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          common = {'schema','state','read_only','mutations','docker_queries',
                    'docker_socket_connections','sudo_executed','rootless_certified'}
          fields = {'linger_effective','enabled_user_units','active_user_services',
                    'user_timers','user_sockets','default_target_dependencies',
                    'autostart_risk','systemd_dbus_state'}
          expected = common | fields
          if (not isinstance(data, dict) or
                  data.get('schema') != 'rc6.r1.linger-runtime-inventory-readonly.v1' or
                  data.get('state') != 'NO_VERIFICADO' or
                  data.get('read_only') is not True or
                  any(type(data.get(k)) is not int or data[k] != 0 for k in
                      ('mutations','docker_queries','docker_socket_connections')) or
                  data.get('sudo_executed') is not False or
                  data.get('rootless_certified') is not False):
              raise SystemExit('RC6_LINGER_INVENTORY=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          if set(data) == common | {'reason'}:
              if not isinstance(data['reason'], str) or not re.fullmatch(
                      r'[A-Z_]{1,48}', data['reason']):
                  raise SystemExit('RC6_LINGER_INVENTORY=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
              raise SystemExit('RC6_LINGER_INVENTORY=HOST_PREREQUISITES_UNVERIFIED|CERT2=NO_VERIFICADO')
          if (set(data) != expected or
                  data.get('linger_effective') not in ('YES','NO') or
                  any(data.get(k) not in ('PRESENT','NONE_OBSERVED') for k in (
                      'enabled_user_units','active_user_services','user_timers',
                      'user_sockets','default_target_dependencies')) or
                  data.get('autostart_risk') not in ('PRESENT','UNVERIFIED') or
                  data.get('systemd_dbus_state') != 'QUERIED_READONLY' or
                  (data['autostart_risk'] == 'PRESENT') != any(
                      data[k] == 'PRESENT' for k in (
                          'enabled_user_units','active_user_services','user_timers',
                          'user_sockets','default_target_dependencies'))):
              raise SystemExit('RC6_LINGER_INVENTORY=RECEIPT_INVALID|CERT2=NO_VERIFICADO')
          print('RC6_LINGER_INVENTORY=READ_ONLY_OBSERVED'
                '|LINGER_EFFECTIVE=' + data['linger_effective'] +
                '|AUTOSTART_RISK=' + data['autostart_risk'] +
                '|CERT2=NO_VERIFICADO')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### RC6 user-systemd inventory — READ_ONLY (not CERT2)\n\n')
              out.write('Effective linger: '+data['linger_effective']+'; '
                        'aggregate user-unit risk: '+data['autostart_risk']+'; '
                        'no host writes, Docker queries or certification.\n')
          PY
      - name: Runner-only current-login credential cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rc6_current_login_ro/key" "$RUNNER_TEMP/rc6_current_login_ro/known_hosts" "$RUNNER_TEMP/rc6_current_login_ro/receipt.json" "$RUNNER_TEMP/rc6_current_login_ro/linger.json"
