name: RC6 unified evidence finalization 20261002
on:
  push:
    branches: [audit/rc6-unified-review-20261002]
    paths:
      - .github/workflows/rc6-unified-evidence-finalize-20261002.yml
      - scripts/rc6_finalize_unified_evidence_20261002.py
permissions:
  contents: write
  actions: read
concurrency:
  group: rc6-unified-evidence-finalize-20261002
  cancel-in-progress: false
jobs:
  finalize_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile standalone script and reject seven invalid evidence fixtures
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/rc6_finalize_unified_evidence_20261002.py
          python scripts/rc6_finalize_unified_evidence_20261002.py selftest
      - name: Bounded exact dependency barrier, no runtime access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rc6_finalize_unified_evidence_20261002.py wait
      - uses: actions/download-artifact@v4
        with:
          name: rc6-unified-postdeploy-evidence-37078669217
          run-id: '37078669217'
          github-token: ${{ github.token }}
          path: /tmp/rc6-independent-evidence
      - name: Persist verified release evidence on audit branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/rc6_finalize_unified_evidence_20261002.py finalize
          test "$(git ls-remote origin refs/heads/deploy/rc6-pr69-isolated-20260915 | cut -f1)" = e9cf3fdbd9e6a71a0aa72365ff3b2727378db10f
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/releases/RC6_UNIFIED_FINAL_STATE_2026-10-02.json docs/releases/RC6_UNIFIED_CLOSURE_2026-10-02.md docs/releases/RC6_UNIFIED_EXECUTION_2026-10-02.md
          git commit -m 'docs(rc6): record verified unified runtime and explicit market-window residuals'
          git push origin HEAD:refs/heads/audit/rc6-unified-review-20261002
          git rev-parse HEAD > evidence/closure-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-unified-finalization-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
