name: RC6 IOL History AAPL Mode Diagnostic V4 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-iol-history-aapl-mode-diagnostic-v4-20260909.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ioldiag"
          chmod 600 "$HOME/.ssh/ioldiag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Probe historical GET variants only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -i "$HOME/.ssh/ioldiag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE=$(git rev-parse HEAD)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          python3 - <<'PY'
          import json, ssl, urllib.error, urllib.parse, urllib.request
          from datetime import date, timedelta
          from pathlib import Path
          vals={}
          for raw in Path('/opt/porota-trading/.env').read_text(encoding='utf-8',errors='replace').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          u,p=vals.get('IOL_USERNAME',''),vals.get('IOL_PASSWORD','')
          assert u and p, 'IOL_CREDENTIALS_MISSING'
          base='https://api.invertironline.com'; ctx=ssl.create_default_context()
          payload=urllib.parse.urlencode({'username':u,'password':p,'grant_type':'password'}).encode()
          req=urllib.request.Request(base+'/token',data=payload,headers={'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json','User-Agent':'PorotaTrading-RC6-ReadOnly/1.0'},method='POST')
          with urllib.request.urlopen(req,timeout=20,context=ctx) as r: token=json.loads(r.read().decode())['access_token']
          print('IOL_AUTH=GREEN')
          end=date.today(); start=end-timedelta(days=365)
          cases=[]
          for market in ['bCBA','BCBA']:
              for kind in ['ajustada','sinAjustar','true','false']:
                  path=f'/api/v2/{market}/Titulos/AAPL/Cotizacion/seriehistorica/{start:%Y-%m-%d}/{end:%Y-%m-%d}/{kind}'
                  q=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'PorotaTrading-RC6-ReadOnly/1.0'},method='GET')
                  code=-1; rows=-1; shape='NONE'
                  try:
                      with urllib.request.urlopen(q,timeout=20,context=ctx) as r:
                          code=r.status; obj=json.loads(r.read().decode('utf-8','replace'))
                          if isinstance(obj,list): rows=len(obj); shape='LIST'
                          elif isinstance(obj,dict):
                              arr=obj.get('precios')
                              rows=len(arr) if isinstance(arr,list) else -1; shape='DICT'
                  except urllib.error.HTTPError as e: code=e.code
                  except Exception as e: shape='ERROR_'+type(e).__name__
                  cases.append({'market':market,'kind':kind,'http':code,'rows':rows,'shape':shape})
          print('IOL_AAPL_VARIANTS='+json.dumps(cases,separators=(',',':')))
          winners=[x for x in cases if x['http']==200 and x['rows']>0]
          print('IOL_AAPL_WINNERS='+str(len(winners)))
          if not winners: raise SystemExit('NO_AAPL_HISTORY_VARIANT_FOUND')
          print('IOL_AAPL_HISTORY_DIAGNOSTIC=GREEN')
          PY
          test "$(git rev-parse HEAD)" = "$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RUNTIME_CHANGED=NO'
          REMOTE