name: RC6 Wave7 Event Risk Binding Validate 2026-09-08
on:
  push:
    branches: [integration/rc6-wave7-event-risk-binding-20260908]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baseline and compile
        run: |
          set -euo pipefail
          BASE=860b26ca22a73679217e8953207041da2b8afffd
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          python -m pip install -q requests pytest
          python -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py es_shadow_binding_contract_rc6.py et_shadow_learning_rc6.py bw_daily_risk.py p_risk_guardian.py
      - name: Focused tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_shadow_binding_contract_rc6.py tests/test_shadow_learning_rc6.py tests/test_daily_risk_outbox_v17.py
      - name: Shadow and order-route safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import fi_event_risk_shadow_rc6 as e, fk_gdelt_shadow_feed_rc6 as g
          e.assert_shadow_only(); g.assert_shadow_only(); print('EVENT_RISK_SHADOW_ONLY=GREEN')
          PY
          ! git diff 860b26ca22a73679217e8953207041da2b8afffd HEAD -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo WAVE7_VALIDATE=GREEN
