name: RC6 Decision Opportunity Study Readonly

on:
  push:
    branches:
      - audit/rc6-alpha-tuning-analysis-20260923
    paths:
      - rc6_decision_opportunity_coverage.py
      - tests/test_rc6_decision_opportunity_coverage.py
      - rc6_decision_unit_opportunity.py
      - tests/test_rc6_decision_unit_opportunity.py
      - rc6_cross_sectional_rank_study.py
      - tests/test_rc6_cross_sectional_rank_study.py
      - .github/workflows/rc6-decision-opportunity-coverage-readonly-20260923.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-decision-opportunity-coverage-readonly
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Static safety and focused test
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile rc6_decision_opportunity_coverage.py rc6_decision_unit_opportunity.py rc6_cross_sectional_rank_study.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_rc6_decision_opportunity_coverage.py tests/test_rc6_decision_unit_opportunity.py tests/test_rc6_cross_sectional_rank_study.py
          grep -q 'mode=ro' rc6_decision_opportunity_coverage.py
          grep -q 'PRAGMA query_only=ON' rc6_decision_opportunity_coverage.py
          ! grep -Eq 'requests\.|urllib|httpx|subprocess|os\.system' rc6_decision_opportunity_coverage.py

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Verify PAPER safety before coverage audit
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          STATE="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n docker exec -i porota_production_observer python -c \"import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('PRAGMA query_only=ON');r=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone();print('|'.join(map(str,r)));c.close()\"")"
          echo "PRE_SAFETY=$STATE"
          test "$STATE" = "PRODUCTION_PAPER|0"

      - name: Measure decision-level evidence coverage
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n docker exec -i porota_production_observer sh -lc 'cd /app && python - --db /app/data/paper_v17/observer_v17.db'"             < rc6_decision_opportunity_coverage.py > rc6_decision_opportunity_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rc6_decision_opportunity_coverage.json').read_text(encoding='utf-8'))
          assert r['read_only'] is True
          assert r['labels_created'] is False
          assert r['synthetic_fills_created'] is False
          assert r['network_calls_performed'] is False
          assert r['broker_calls_performed'] is False
          assert r['safety']=={'mode':'PRODUCTION_PAPER','real_orders_sent':0}
          print('DECISION_COVERAGE='+json.dumps(r['coverage'],sort_keys=True))
          print('DECISION_COVERAGE_BY_DAY='+json.dumps(r['by_day'],sort_keys=True))
          PY

      - name: Build decision-level unit opportunity labels
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n docker exec -i porota_production_observer sh -lc 'cd /app && python - --db /app/data/paper_v17/observer_v17.db'" \
            < rc6_decision_unit_opportunity.py > rc6_decision_unit_opportunity.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rc6_decision_unit_opportunity.json').read_text(encoding='utf-8'))
          assert r['read_only'] is True
          assert r['hypothetical_portfolio_trades'] is False
          assert r['unit_opportunity_labels'] is True
          assert r['network_calls_performed'] is False
          assert r['broker_calls_performed'] is False
          assert r['safety']=={'mode':'PRODUCTION_PAPER','real_orders_sent':0}
          print('UNIT_OPPORTUNITY_COVERAGE='+json.dumps(r['coverage'],sort_keys=True))
          print('UNIT_OPPORTUNITY_SPLIT='+json.dumps(r['temporal_split'],sort_keys=True))
          for key,x in sorted(r['analysis'].items()):
              print('UNIT_OPPORTUNITY_TARGET_'+key+'='+json.dumps({
                'all':x['all'],'train':x['train'],'validation':x['validation'],
                'auc_train':x['auc_train'],'auc_validation':x['auc_validation'],
                'by_action':x['by_action']},sort_keys=True))
          PY

      - name: Evaluate cross-sectional ranking
        shell: bash
        run: |
          set -Eeuo pipefail
          python rc6_cross_sectional_rank_study.py rc6_decision_unit_opportunity.json --out rc6_cross_sectional_rank_study.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rc6_cross_sectional_rank_study.json').read_text(encoding='utf-8'))
          print('RANK_PASSED='+json.dumps(r['passed'],sort_keys=True))
          for target,profiles in sorted(r['profiles'].items()):
              for name,x in sorted(profiles.items()):
                  if name!='BASE':
                      print('RANK_'+target+'_'+name+'='+json.dumps(x,sort_keys=True))
          PY

      - name: Verify PAPER safety after coverage audit
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          STATE="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n docker exec -i porota_production_observer python -c \"import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('PRAGMA query_only=ON');r=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone();print('|'.join(map(str,r)));c.close()\"")"
          echo "POST_SAFETY=$STATE"
          test "$STATE" = "PRODUCTION_PAPER|0"
          echo "LABELS_CREATED=FALSE"
          echo "SYNTHETIC_FILLS_CREATED=FALSE"
          echo "RC6_DECISION_COVERAGE_READONLY=GREEN"

      - name: Upload sanitized coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc6-decision-opportunity-coverage-${{ github.run_id }}
          path: |
            rc6_decision_opportunity_coverage.json
            rc6_decision_unit_opportunity.json
            rc6_cross_sectional_rank_study.json
          if-no-files-found: error
          retention-days: 30
