name: RC6 commit SHADOW migration

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - '.github/workflows/rc6-shadow-policy-commit.yml'

permissions:
  contents: write

concurrency:
  group: rc6-shadow-commit
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - name: Apply idempotent migration
        run: python scripts/rc6_apply_shadow_policy_v3.py
      - name: Compile affected source
        run: |
          python -m py_compile porota_mode_manager.py bg_paper_dashboard.py \
            bf_production_paper_observer.py be_paper_engine.py \
            ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py \
            ck_policy_gate_hf6.py es_shadow_binding_contract_rc6.py
      - name: Static invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '"'"'PAPER_ECONOMIC_GATE_MODE"'"': "'"'SHADOW"'"'' porota_mode_manager.py)" -ge 2
          ! grep -q '"'"'PAPER_ECONOMIC_GATE_MODE"'"': "'"'BINDING"'"'' porota_mode_manager.py
          ! grep -q 'os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING")' bg_paper_dashboard.py
          ! grep -q 'os.getenv("PAPER_ECONOMIC_GATE_MODE", "BINDING")' bf_production_paper_observer.py
          grep -q 'features\["economics_mode"\] = self.economics_mode' be_paper_engine.py
          grep -q 'economic_violation = (economics_mode == "BINDING"' be_paper_engine.py
          grep -q 'P0-APRENDIZAJE — SHADOW' POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md
      - name: Commit SHADOW migration
        shell: bash
        run: |
          set -euo pipefail
          FILES='porota_mode_manager.py bg_paper_dashboard.py bf_production_paper_observer.py be_paper_engine.py ep_dashboard_truth_layer_rc6.py eo_dashboard_truth_semantics_rc6.py ck_policy_gate_hf6.py POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md'
          if git diff --quiet -- $FILES; then
            echo RC6_SHADOW_MIGRATION=ALREADY_PRESENT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'RC6: restore SHADOW-first PAPER learning [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
