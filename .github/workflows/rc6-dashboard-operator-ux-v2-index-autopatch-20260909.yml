name: RC6 Dashboard Operator UX V2 Index Autopatch 2026-09-09

on:
  push:
    branches: [fix/rc6-dashboard-operator-ux-v2-20260909]
    paths: ['.github/workflows/rc6-dashboard-operator-ux-v2-index-autopatch-20260909.yml']

permissions:
  contents: write

concurrency:
  group: porota-rc6-runtime-deploy
  cancel-in-progress: false

jobs:
  patch-deploy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rc6-dashboard-operator-ux-v2-20260909
      - name: Patch stale page-index removal and commit exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('zz_wave8_dashboard_live_rc6.py')
          s=p.read_text()
          old="""    text=_GENERATED_CAPTION_RE.sub('',text)\n    text=_dedupe_secondary_navs(text)\n    used=set(re.findall(r\"\\bid=['\\\"]([^'\\\"]+)['\\\"]\",text,re.IGNORECASE))\n"""
          new="""    text=_GENERATED_CAPTION_RE.sub('',text)\n    text=_dedupe_secondary_navs(text)\n    # Normalization can run more than once (bg._document + ASGI middleware).\n    # If a domain-specific subnav is present, remove any page index injected by\n    # an earlier pass so the operator sees exactly one navigation surface.\n    if _SECONDARY_NAV_RE.search(text):\n        text=_PAGE_INDEX_RE.sub('',text)\n    used=set(re.findall(r\"\\bid=['\\\"]([^'\\\"]+)['\\\"]\",text,re.IGNORECASE))\n"""
          if old not in s:
              raise SystemExit('EXPECTED_DECORATE_BLOCK_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile zz_wave8_dashboard_live_rc6.py
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add zz_wave8_dashboard_live_rc6.py
          git commit -m 'fix(rc6): suppress stale page index when domain subnav exists'
          git push origin HEAD:fix/rc6-dashboard-operator-ux-v2-20260909
          echo "PATCHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Build deploy dashboard-only and prove operator UX
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$PATCHED_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo "PRE_HEAD=$(git rev-parse HEAD)"
          PRE=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]; c.close(); print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "PRE_DB=$PRE"; test "$PRE" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          sudo -n docker inspect -f 'PRE_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          git fetch --no-tags origin fix/rc6-dashboard-operator-ux-v2-20260909
          test "$(git rev-parse origin/fix/rc6-dashboard-operator-ux-v2-20260909)" = "$TARGET_SHA"
          TMP=$(mktemp -d "$HOME/porota-uxv2idx.XXXXXX")
          trap 'git -C /opt/porota-trading worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label porota.wave=rc6-dashboard-operator-ux-v2 -t porota-trading-bot:17.0.0-rc6 "$TMP/source"
          git checkout -f -B fix/rc6-dashboard-operator-ux-v2-20260909 "$TARGET_SHA"
          sudo -n python3 - <<'PY'
          import porota_mode_manager as p
          p.start_dashboard('PRODUCTION_PAPER')
          PY
          sleep 12
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import os,re,urllib.request
          token=os.getenv('DASHBOARD_ACCESS_TOKEN','')
          pages=['/','/vivo','/trading','/trading/renta-fija','/universo-operativo','/instrumentos','/riesgo','/validacion','/historicos','/sistema','/scalping']
          bodies={}
          for p in pages:
              req=urllib.request.Request('http://127.0.0.1:8000'+p)
              if token:
                  req.add_header('Authorization','Bearer '+token); req.add_header('X-Dashboard-Token',token)
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8','replace'); bodies[p]=body
                  tables=len(re.findall(r'<table(?:\s|>)',body,re.I)); th=len(re.findall(r'<th(?:\s|>)',body,re.I))
                  print(f'HTTP|{p}|{r.status}|tables={tables}|th={th}')
                  assert r.status==200 and 'porota-rc6-classic-responsive' in body
                  if tables: assert th>0
                  assert 'overflow-wrap:anywhere' not in body
                  assert not re.search(r"<caption\b[^>]*class=['\"][^'\"]*porota-table-title",body,re.I)
          assert bodies['/trading'].count("class='subnav'")==1
          assert 'porota-page-index' not in bodies['/trading']
          assert 'porota-page-index' not in bodies['/trading/renta-fija']
          assert 'system-nav' in bodies['/sistema'] and 'porota-page-index' not in bodies['/sistema']
          assert 'rc6-family-live-activity' in bodies['/trading']
          assert 'Actividad real de análisis por familia' in bodies['/trading']
          assert not re.search(r'<h2[^>]*>\s*4\.\s*Scalping\s*</h2>',bodies['/vivo'],re.I)
          assert not re.search(r'<h2[^>]*>\s*5\.\s*Motores\s*/\s*workers\s*</h2>',bodies['/vivo'],re.I)
          assert 'Matriz de controles exigidos' in bodies['/riesgo']
          print('DASHBOARD_OPERATOR_UX_V2_LIVE=GREEN')
          PY
          POST=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]; c.close(); print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "POST_DB=$POST"; test "$POST" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          echo "POST_HEAD=$(git rev-parse HEAD)"
          echo OBSERVER_RESTARTED_BY_THIS_DEPLOY=NO
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          REMOTE
