name: RC6 IOL Runtime State Read-Only 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-iol-20261001
      - audit/rc6-a186-iol-guardian-ro-20261029
    paths:
      - '.github/workflows/rc6-iol-runtime-state-readonly-20261001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Read IOL runtime state only
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=10s 90s ssh -i "$HOME/.ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import json
          from pathlib import Path
          p=Path('/opt/porota-trading/data/market/iol_family_reference_latest.json')
          print('IOL_RUNTIME_STATE=START')
          if not p.is_file():
              print('IOL_CACHE=MISSING'); raise SystemExit(2)
          x=json.loads(p.read_text(encoding='utf-8'))
          keep={
            'refreshed_at':x.get('refreshed_at'),
            'cache_state':x.get('cache_state'),
            'live_sections':x.get('live_sections'),
            'section_states':x.get('section_states'),
            'last_known_good_at':x.get('last_known_good_at'),
            'continuation_state':x.get('continuation_state'),
            'fallback_order':x.get('fallback_order'),
            'errors':x.get('errors'),
            'caucion_ars_records':len((x.get('cauciones') or {}).get('ARS') or []),
            'caucion_usd_records':len((x.get('cauciones') or {}).get('USD') or []),
            'fci_records':len(x.get('fci') or []),
          }
          print('IOL_CACHE='+json.dumps(keep,sort_keys=True,default=str))
          q=Path('/opt/porota-trading/data/market/iol_shadow_latest.json')
          if q.is_file():
              shadow=json.loads(q.read_text(encoding='utf-8'))
              print('IOL_SHADOW_TELEMETRY='+json.dumps(shadow.get('telemetry') or {},sort_keys=True,default=str))
          PY
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "systemctl show porota-iol-shadow-collector-rc6.service -p Result -p ExecMainStatus -p ActiveState -p SubState --no-pager || true; systemctl show porota-iol-shadow-collector-rc6.timer -p ActiveState -p UnitFileState -p LastTriggerUSec --no-pager || true"
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n timeout 25 python3 -' <<'PY'
          import json, subprocess, time
          from pathlib import Path

          def status(unit, fields):
              result = subprocess.run(
                  ['systemctl', 'show', unit, '--no-pager',
                   *['-p' + field for field in fields]],
                  capture_output=True, text=True, timeout=8, check=False)
              values = dict(line.split('=', 1) for line in result.stdout.splitlines()
                            if '=' in line)
              print('IOL_UNIT=' + json.dumps({'unit':unit, 'rc':result.returncode,
                  'values':values}, sort_keys=True))

          status('porota-iol-oauth-health-rc6.timer',
                 ('LoadState','ActiveState','UnitFileState','Unit','LastTriggerUSec'))
          status('porota-iol-oauth-health-rc6.service',
                 ('LoadState','ActiveState','SubState','Result','ExecMainCode',
                  'ExecMainStatus','ConditionResult'))
          for label, path, fields in (
              ('IOL_OAUTH_GUARDIAN', '/opt/porota-trading/data/market/iol_oauth_guardian_state.json',
               ('schema','state','reason','failure_class','http_status',
                'checked_at','last_authenticated_at','last_reauth_required_at',
                'probe_attempts','incident_seq')),
              ('IOL_FAMILY_CACHE', '/opt/porota-trading/data/market/iol_family_reference_latest.json',
               ('source','cache_state','refreshed_at','last_known_good_at','live_sections')),
          ):
              p = Path(path)
              if not p.is_file() or p.stat().st_size > 1048576:
                  print(label + '=MISSING_OR_OVERSIZED')
                  continue
              obj = json.loads(p.read_text(encoding='utf-8'))
              keep = {key:obj.get(key) for key in fields}
              print(label + '=' + json.dumps(keep, sort_keys=True, default=str))
          oauth = Path('/root/.config/porota/iol_mcp_oauth_bootstrap.json')
          if oauth.is_file() and oauth.stat().st_size <= 65536:
              metadata = json.loads(oauth.read_text(encoding='utf-8'))
              tokens = metadata.get('tokens') or {}
              obtained = metadata.get('token_obtained_at_epoch')
              expires = tokens.get('expires_in')
              remaining = (round(float(obtained) + float(expires) - time.time())
                           if obtained is not None and expires is not None else None)
              print('IOL_OAUTH_STORE_METADATA=' + json.dumps({
                  'access_present': bool(tokens.get('access_token')),
                  'refresh_present': bool(tokens.get('refresh_token')),
                  'endpoint_present': bool(metadata.get('token_endpoint')),
                  'seconds_remaining': remaining,
                  'file_mode': oct(oauth.stat().st_mode & 0o777),
              }, sort_keys=True))
          else:
              print('IOL_OAUTH_STORE_METADATA=MISSING_OR_OVERSIZED')
          print('IOL_GUARDIAN_FORENSICS=COMPLETE_READ_ONLY')
          PY
          echo 'IOL_RUNTIME_STATE=GREEN_READONLY'
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
