name: RC6 IOL Runtime State Read-Only 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-iol-20261001
      - audit/rc6-a186-iol-guardian-ro-20261029
    paths:
      - '.github/workflows/rc6-iol-runtime-state-readonly-20261001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Read IOL runtime state only
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=10s 90s ssh -i "$HOME/.ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import json
          from pathlib import Path
          p=Path('/opt/porota-trading/data/market/iol_family_reference_latest.json')
          print('IOL_RUNTIME_STATE=START')
          if not p.is_file():
              print('IOL_CACHE=MISSING'); raise SystemExit(2)
          x=json.loads(p.read_text(encoding='utf-8'))
          keep={
            'refreshed_at':x.get('refreshed_at'),
            'cache_state':x.get('cache_state'),
            'live_sections':x.get('live_sections'),
            'section_states':x.get('section_states'),
            'last_known_good_at':x.get('last_known_good_at'),
            'continuation_state':x.get('continuation_state'),
            'fallback_order':x.get('fallback_order'),
            'errors':x.get('errors'),
            'caucion_ars_records':len((x.get('cauciones') or {}).get('ARS') or []),
            'caucion_usd_records':len((x.get('cauciones') or {}).get('USD') or []),
            'fci_records':len(x.get('fci') or []),
          }
          print('IOL_CACHE='+json.dumps(keep,sort_keys=True,default=str))
          q=Path('/opt/porota-trading/data/market/iol_shadow_latest.json')
          if q.is_file():
              shadow=json.loads(q.read_text(encoding='utf-8'))
              print('IOL_SHADOW_TELEMETRY='+json.dumps(shadow.get('telemetry') or {},sort_keys=True,default=str))
          PY
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "systemctl show porota-iol-shadow-collector-rc6.service -p Result -p ExecMainStatus -p ActiveState -p SubState --no-pager || true; systemctl show porota-iol-shadow-collector-rc6.timer -p ActiveState -p UnitFileState -p LastTriggerUSec --no-pager || true"
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n timeout 25 python3 -' <<'PY'
          import json, subprocess, time
          from pathlib import Path

          def status(unit, fields):
              result = subprocess.run(
                  ['systemctl', 'show', unit, '--no-pager',
                   *['-p' + field for field in fields]],
                  capture_output=True, text=True, timeout=8, check=False)
              values = dict(line.split('=', 1) for line in result.stdout.splitlines()
                            if '=' in line)
              print('IOL_UNIT=' + json.dumps({'unit':unit, 'rc':result.returncode,
                  'values':values}, sort_keys=True))

          status('porota-iol-oauth-health-rc6.timer',
                 ('LoadState','ActiveState','UnitFileState','Unit','LastTriggerUSec'))
          status('porota-iol-oauth-health-rc6.service',
                 ('LoadState','ActiveState','SubState','Result','ExecMainCode',
                  'ExecMainStatus','ConditionResult'))
          for label, path, fields in (
              ('IOL_OAUTH_GUARDIAN', '/opt/porota-trading/data/market/iol_oauth_guardian_state.json',
               ('schema','state','reason','failure_class','http_status',
                'checked_at','last_authenticated_at','last_reauth_required_at',
                'probe_attempts','incident_seq')),
              ('IOL_FAMILY_CACHE', '/opt/porota-trading/data/market/iol_family_reference_latest.json',
               ('source','cache_state','refreshed_at','last_known_good_at','live_sections')),
          ):
              p = Path(path)
              if not p.is_file() or p.stat().st_size > 1048576:
                  print(label + '=MISSING_OR_OVERSIZED')
                  continue
              obj = json.loads(p.read_text(encoding='utf-8'))
              keep = {key:obj.get(key) for key in fields}
              print(label + '=' + json.dumps(keep, sort_keys=True, default=str))
          oauth = Path('/root/.config/porota/iol_mcp_oauth_bootstrap.json')
          if oauth.is_file() and oauth.stat().st_size <= 65536:
              metadata = json.loads(oauth.read_text(encoding='utf-8'))
              tokens = metadata.get('tokens') or {}
              obtained = metadata.get('token_obtained_at_epoch')
              expires = tokens.get('expires_in')
              remaining = (round(float(obtained) + float(expires) - time.time())
                           if obtained is not None and expires is not None else None)
              print('IOL_OAUTH_STORE_METADATA=' + json.dumps({
                  'access_present': bool(tokens.get('access_token')),
                  'refresh_present': bool(tokens.get('refresh_token')),
                  'endpoint_present': bool(metadata.get('token_endpoint')),
                  'seconds_remaining': remaining,
                  'file_mode': oct(oauth.stat().st_mode & 0o777),
              }, sort_keys=True))
          else:
              print('IOL_OAUTH_STORE_METADATA=MISSING_OR_OVERSIZED')
          print('IOL_GUARDIAN_FORENSICS=COMPLETE_READ_ONLY')
          PY
          echo 'IOL_RUNTIME_STATE=GREEN_READONLY'
      - name: Read-only capacity and safe Docker inventory
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=5s 80s ssh -T -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import json,os,shutil,subprocess
          roots=('/','/opt/porota-trading/data','/var/log','/tmp','/var/lib/docker')
          space={p:{'free':shutil.disk_usage(p).free,'total':shutil.disk_usage(p).total} for p in roots if os.path.exists(p)}
          print('A186_DISK_MOUNTS='+json.dumps(space,sort_keys=True))
          for label,argv,limit in (
              ('DOCKER_SYSTEM_DF',['docker','system','df','--format','{{json .}}'],20),
              ('DOCKER_IMAGE_LIST',['docker','image','ls','--format','{{json .}}'],20),
              ('ROOT_USAGE',['du','-sB1','/opt/porota-trading/data','/var/log','/tmp','/var/lib/docker'],40),
          ):
              try:
                  x=subprocess.run(argv,capture_output=True,text=True,timeout=limit,check=False)
                  lines=x.stdout.splitlines()
                  print('A186_'+label+'='+json.dumps({'rc':x.returncode,'lines':lines[:55],'truncated':len(lines)>55},sort_keys=True))
              except Exception as exc:
                  print('A186_'+label+'='+type(exc).__name__)
          print('A186_DISK_DIAGNOSTIC=READ_ONLY_COMPLETE')
          PY
      - name: Exact container-to-image and durable marker read-only attestation
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=5s 65s ssh -T -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          def docker(*args):
              x=subprocess.run(['docker',*args],capture_output=True,text=True,timeout=20,check=False)
              if x.returncode or len(x.stdout)>1000000: raise RuntimeError('DOCKER_READ_FAILED:'+args[0])
              return x.stdout.strip()
          cids=docker('ps','-aq','--no-trunc').splitlines()
          images=sorted(set(docker('image','ls','-aq','--no-trunc').splitlines()))
          containers=[]
          for cid in cids:
              row=json.loads(docker('inspect',cid))[0]
              containers.append({'id':row['Id'],'image':row['Image'],'name':row['Name'],'running':row['State']['Running'],'status':row['State']['Status']})
          inventory=[]
          for iid in images:
              row=json.loads(docker('image','inspect',iid))[0]
              inventory.append({'id':row['Id'],'tags':row.get('RepoTags') or [],'digests':row.get('RepoDigests') or [],'layer_count':len((row.get('RootFS') or {}).get('Layers') or []),'referenced_by':[c['id'] for c in containers if c['image']==row['Id']]})
          marker=Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
          allowed=('candidate_sha','deploy_sha','image_id','validation_status','mode','real_orders_sent','real_order_routes','ppi_watch_untouched')
          state=json.loads(marker.read_text()) if marker.exists() and marker.stat().st_size<65536 else {}
          print('A186_DOCKER_EXACT='+json.dumps({'containers':containers,'images':inventory,'marker':{k:state.get(k) for k in allowed}},sort_keys=True))
          print('A186_IMAGE_REF_PROOF=READ_ONLY_COMPLETE')
          PY
      - name: Canonical host mutex barrier and lock read-only classification
        run: |
          set -Eeuo pipefail
          timeout 30 ssh -T -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PY'
          import json,stat
          from pathlib import Path
          for p in (Path('/run/lock/porota-rc6-deploy-v2.lock'),Path('/run/lock/porota-rc6-deploy-v2-attempt.json'),Path('/tmp/porota-rc6-deploy-v2.lock')):
              if not p.exists():
                  print('A186_MUTEX_FILE='+json.dumps({'name':p.name,'exists':False})); continue
              s=p.lstat()
              out={'name':p.name,'exists':True,'regular':stat.S_ISREG(s.st_mode),'uid':s.st_uid,'mode':oct(stat.S_IMODE(s.st_mode)),'size':s.st_size}
              if p.name.endswith('attempt.json') and stat.S_ISREG(s.st_mode) and s.st_size<=65536:
                  j=json.loads(p.read_text())
                  out['phase']=j.get('phase'); out['status']=j.get('status'); out['candidate_sha']=j.get('candidate_sha')
              print('A186_MUTEX_FILE='+json.dumps(out,sort_keys=True))
          PY
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
