name: RC6 Contract narrow trusted capture 2026-09-14

on:
  push:
    branches: [ops/rc6-ppi-web-residual-ready-20260913]
    paths:
      - '.github/workflows/rc6-contract-narrow-capture-20260914.yml'
      - 'scripts/rc6_contract_point1_reauth_capture.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narrow-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rc6-ppi-web-residual-ready-20260913

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"
          chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Apply known session-expired workaround and retry capture
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          RESULT=POROTA_TRADING_CONTRACT_NARROW_CAPTURE_RESULT_2026-09-14.txt
          REMOTE="/tmp/porota-contract-point1-reauth-${GITHUB_RUN_ID}.sh"
          SSH_OPTS=(-i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${SSH_OPTS[@]}" scripts/rc6_contract_point1_reauth_capture.sh "$DO_USER@$DO_HOST:$REMOTE"
          set +e
          ssh "${SSH_OPTS[@]}" "$DO_USER@$DO_HOST" "chmod 700 '$REMOTE' && sudo -n bash '$REMOTE'; rc=\$?; rm -f '$REMOTE'; exit \$rc" > "$RESULT"
          RC=$?
          set -e
          cat "$RESULT"
          exit "$RC"

      - name: Persist sanitized reauth/capture result
        if: always()
        run: |
          set -euo pipefail
          RESULT=POROTA_TRADING_CONTRACT_NARROW_CAPTURE_RESULT_2026-09-14.txt
          test -f "$RESULT" || printf 'PROBE_RESULT=MISSING\n' > "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git diff --cached --quiet && exit 0
          git commit -m 'audit(contract): persist canonical reauth retry result [skip ci]'
          git push origin HEAD:ops/rc6-ppi-web-residual-ready-20260913
