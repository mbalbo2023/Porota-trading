name: RC6 checkpoint P0 dashboard

on:
  push:
    branches:
      - candidate/v17.0.0-rc6-weekend-20260905
    paths:
      - 'scripts/rc6_checkpoint_add_p0_dashboard_truth.py'
      - '.github/workflows/rc6-checkpoint-p0-dashboard-once.yml'

permissions:
  contents: write

concurrency:
  group: rc6-checkpoint-p0-dashboard
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: python scripts/rc6_checkpoint_add_p0_dashboard_truth.py
      - name: Commit checkpoint only if changed
        shell: bash
        run: |
          set -euo pipefail
          FILE=POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md
          if git diff --quiet -- "$FILE"; then
            echo 'RC6_CHECKPOINT_P0_DASHBOARD_COMMIT=NOT_NEEDED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'RC6: checkpoint P0 dashboard consistency [skip ci]'
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
