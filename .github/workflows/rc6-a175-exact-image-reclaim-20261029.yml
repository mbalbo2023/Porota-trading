name: RC6 A178 reclaim exactly two old unreferenced A171 A174 images

on:
  push:
    branches: [fix/rc6-a178-formal-takeover-20261029]
    paths:
      - .github/workflows/rc6-a175-exact-image-reclaim-20261029.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  reclaim:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Adversarial Docker ownership fixtures
        run: python3 -m unittest tests.test_rc6_a175_exact_image_reclaim -v

      - name: Revalidate exact historical Predeploy and Deploy provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          base="https://api.github.com/repos/mbalbo2023/Porota-trading/actions"
          for spec in 40781948389:40785249266 40767794099:40771934853; do
            pre="${spec%%:*}"
            deploy="${spec#*:}"
            for suffix in "runs/$pre" "runs/$pre/artifacts?per_page=100" "runs/$deploy"; do
              case "$suffix" in
                "runs/$pre") path="$RUNNER_TEMP/pre-$pre.json" ;;
                "runs/$pre/artifacts?per_page=100") path="$RUNNER_TEMP/art-$pre.json" ;;
                *) path="$RUNNER_TEMP/deploy-$deploy.json" ;;
              esac
              curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' "$base/$suffix" -o "$path"
            done
          done
          python3 scripts/rc6_a175_artifact_provenance.py \
            "$RUNNER_TEMP/pre-40781948389.json" "$RUNNER_TEMP/art-40781948389.json" \
            "$RUNNER_TEMP/deploy-40785249266.json" \
            "$RUNNER_TEMP/pre-40767794099.json" "$RUNNER_TEMP/art-40767794099.json" \
            "$RUNNER_TEMP/deploy-40771934853.json"

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Recheck and remove only pinned unreferenced image IDs
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          timeout --signal=TERM --kill-after=5s 180s \
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 "$DO_USER@$DO_HOST" \
              'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -' \
              < scripts/rc6_a175_exact_image_reclaim.py \
              | tee "$RUNNER_TEMP/a178-image-reclaim-result.log"

      - name: Assert exact two removals, measured capacity and PAPER safety
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'a178-image-reclaim-result.log'
          rows=[line for line in path.read_text().splitlines() if line.startswith('{')]
          if len(rows)!=1: raise SystemExit('RECLAIM_JSON_MISSING')
          row=json.loads(rows[0])
          expected={'sha256:9ca6e7ca98f11bbb82353434f54ffab15b218ec54319c83ae1661aaf897a40e9',
                    'sha256:e61052af13c01d9ce76e92f38b50c794dac8a146427e132d43a8a80554a879aa'}
          if (row.get('schema')!='RC6_A175_EXACT_IMAGE_RECLAIM_V1' or
                  row.get('status')!='GREEN' or
                  set(row.get('removed_image_ids',[]))!=expected or
                  len(row.get('steps',[]))!=2 or
                  any(step.get('protected_containers_unchanged') is not True
                      for step in row.get('steps',[])) or
                  row.get('real_orders_sent')!=0 or
                  row.get('ppi_watch')!='NOT_ACCESSED' or
                  any(type(row.get(key)) is not int for key in
                      ('disk_before','disk_after','observed_delta_bytes')) or
                  row['disk_after']-row['disk_before']!=row['observed_delta_bytes']):
              raise SystemExit('RECLAIM_EVIDENCE_RED')
          print('RC6_A178_EXACT_IMAGE_RECLAIM=GREEN|observed_delta_bytes='+
                str(row['observed_delta_bytes'])+'|real_orders_sent=0|PPI_Watch=NOT_ACCESSED')
          PY

      - name: Preserve exact host image reclamation measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a178-exact-image-reclaim-${{ github.run_id }}
          path: ${{ runner.temp }}/a178-image-reclaim-result.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Erase runner provenance and SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/{pre-40781948389,art-40781948389,deploy-40785249266,pre-40767794099,art-40767794099,deploy-40771934853}.json \
            "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
