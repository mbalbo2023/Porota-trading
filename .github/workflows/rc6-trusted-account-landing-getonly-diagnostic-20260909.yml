name: RC6 Trusted Account Landing GET-only Diagnostic 2026-09-09
on:
  push:
    branches: [diag/rc6-trusted-reauth-account-landing-20260909]
    paths: ['.github/workflows/rc6-trusted-account-landing-getonly-diagnostic-20260909.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Sanitized GET-only trusted-profile diagnostic
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          PY=/opt/porota-contract-evidence-venv/bin/python
          CHROME=/usr/bin/google-chrome-stable
          sudo -n -u porotaadmin env HOME=/home/porotaadmin PROFILE="$PROFILE" CHROME="$CHROME" "$PY" - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          profile=os.environ['PROFILE']; chrome=os.environ['CHROME']
          otp=re.compile(r'(otp|token|c[oó]digo|pin|segundo factor|doble factor)',re.I)
          with sync_playwright() as pw:
              ctx=pw.chromium.launch_persistent_context(user_data_dir=profile,executable_path=chrome,headless=True,locale='es-AR',timezone_id='America/Argentina/Buenos_Aires',args=['--no-sandbox','--disable-dev-shm-usage'])
              blocked=[]
              def guard(route,request):
                  m=request.method.upper(); u=urlsplit(request.url)
                  if u.scheme!='https': return route.abort()
                  if m in {'GET','HEAD','OPTIONS'}: return route.continue_()
                  blocked.append(f'{u.netloc}{u.path}'[:180]); return route.abort()
              ctx.route('**/*',guard)
              page=ctx.pages[0] if ctx.pages else ctx.new_page(); page.set_default_navigation_timeout(15000)
              for label,url in [('ACCOUNT','https://cuenta.portfoliopersonal.com/cuentas'),('TRADING','https://trading.portfoliopersonal.com/')]:
                  try: page.goto(url,wait_until='domcontentloaded',timeout=15000)
                  except Exception: pass
                  page.wait_for_timeout(1200)
                  clean=f'{urlsplit(page.url).scheme}://{urlsplit(page.url).netloc}{urlsplit(page.url).path}'
                  body=(page.locator('body').inner_text(timeout=3000) if page.locator('body').count() else '')[:12000]
                  password=page.locator("input[type='password']").count()
                  username=page.locator("input[autocomplete='username'],input[name*='user' i],input[type='email']").count()
                  otp_inputs=page.locator("input[autocomplete='one-time-code'],input[name*='otp' i],input[name*='pin' i],input[name*='code' i]").count()
                  login_btn=page.locator("button:has-text('Ingresar'),button[type='submit']").count()
                  first_party=sum(1 for c in ctx.cookies() if c.get('domain','').endswith('portfoliopersonal.com'))
                  print(f'{label}_URL={clean}')
                  print(f'{label}_PASSWORD_INPUTS={password}|USERNAME_INPUTS={username}|OTP_INPUTS={otp_inputs}|LOGIN_BUTTONS={login_btn}|OTP_TEXT={bool(otp.search(body))}|FIRST_PARTY_COOKIE_COUNT={first_party}')
              print('BLOCKED_MUTATION_COUNT='+str(len(blocked)))
              print('MUTATIONS_ALLOWED=NO')
              print('CREDENTIALS_PRINTED=NO')
              print('COOKIE_VALUES_PRINTED=NO')
              print('ORDER_ROUTES=NOT_CALLED')
              ctx.close()
          PY
          HOST
