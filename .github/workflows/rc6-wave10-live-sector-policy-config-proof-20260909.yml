name: RC6 Wave10 Live Sector Policy Config Proof 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave10-currentbase-20260909]
    paths: [.github/workflows/rc6-wave10-live-sector-policy-config-proof-20260909.yml]

permissions:
  contents: read

jobs:
  inspect-live-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w10cfg"
          chmod 600 "$HOME/.ssh/w10cfg"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read non-secret policy values only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w10cfg" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo "LIVE_HEAD=$(git rev-parse HEAD)"
          file_value=$(awk -F= '$1=="PAPER_SECTOR_CONCENTRATION_POLICY"{v=$0;sub(/^[^=]*=/,"",v);print v;exit}' .env 2>/dev/null || true)
          file_limit=$(awk -F= '$1=="PAPER_MAX_POSITIONS_PER_SECTOR"{v=$0;sub(/^[^=]*=/,"",v);print v;exit}' .env 2>/dev/null || true)
          echo "ENV_FILE_SECTOR_POLICY=${file_value:-UNSET}"
          echo "ENV_FILE_SECTOR_LIMIT=${file_limit:-UNSET}"
          sudo -n docker exec porota_production_observer sh -lc 'printf "CONTAINER_SECTOR_POLICY=%s\n" "${PAPER_SECTOR_CONCENTRATION_POLICY:-UNSET}"; printf "CONTAINER_SECTOR_LIMIT=%s\n" "${PAPER_MAX_POSITIONS_PER_SECTOR:-UNSET}"'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'DB={q}|{mode}|{real}'); assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE
