name: RC6 PPI shadow-family history proof 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-shadow-family-history-proof-20260912.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for shadow discovery then prove history
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = 'eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a' || { echo 'ABORT=HOST_SHA_MISMATCH'; exit 31; }

          ready=0
          for _ in $(seq 1 120); do
            count="$(sudo -n docker exec porota_production_observer python -c "import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);x=c.execute(\"select count(*) from sqlite_master where type='table' and name='ppi_full_discovery_shadow'\").fetchone()[0];print(c.execute('select count(*) from ppi_full_discovery_shadow').fetchone()[0] if x else 0);c.close()" 2>/dev/null || echo 0)"
            if [ "$count" -gt 0 ] 2>/dev/null; then
              echo "SHADOW_READY_COUNT=$count"
              ready=1
              break
            fi
            sleep 20
          done
          test "$ready" = 1 || { echo 'ABORT=SHADOW_DISCOVERY_NOT_READY'; exit 32; }

          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 1200 9 || { echo 'ABORT=PPI_LOCK_TIMEOUT'; exit 33; }

          sudo -n timeout 900 docker exec -i porota_production_observer python - <<'PY'
          import json
          from datetime import timedelta
          import bf_production_paper_observer as m

          store=m.runtime_store()
          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_BEFORE={s[0]}|{s[1]}')
              assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              families=[r[0] for r in c.execute('select distinct instrument_type from ppi_full_discovery_shadow order by instrument_type')]
              targets={}
              for fam in families:
                  rows=c.execute('''select ticker,instrument_type,settlement,market,currency
                    from ppi_full_discovery_shadow where instrument_type=?
                    order by ticker limit 3''',(fam,)).fetchall()
                  targets[fam]=[tuple(r) for r in rows]
          print('SHADOW_FAMILIES='+json.dumps(families))
          end=m.datetime.now(m.TZ).date()
          start=end-timedelta(days=365)
          key,secret=m._secret()
          reader=m.ProductionMarketReader(key,secret,audit=store.audit_http)
          reader.login_once()
          results=[]
          try:
              for fam in families:
                  for ticker,kind,settlement,market,currency in targets[fam]:
                      result={'family':fam,'ticker':ticker,'settlement':settlement,'market':market,'currency':currency}
                      try:
                          payload=reader.history(ticker,kind,settlement,start,end)
                          provider=len(payload) if isinstance(payload,list) else 0
                          valid=m._history_count(payload,as_of=m.now_iso(),date_from=start,date_to=end)
                          result.update({'state':'HTTP_OK','provider_rows':provider,'valid_rows':valid})
                      except Exception as exc:
                          result.update({'state':'ERROR','error':m.classify_read_error(exc),'error_type':type(exc).__name__})
                      results.append(result)
                      print('SHADOW_HISTORY_PROOF='+json.dumps(result,ensure_ascii=False,sort_keys=True))
              metrics=reader.metrics
          finally:
              reader.close()
          print('=== SHADOW_HISTORY_SUMMARY ===')
          for fam in families:
              subset=[r for r in results if r['family']==fam]
              print(json.dumps({'family':fam,'tested':len(subset),
                'http_ok':sum(r.get('state')=='HTTP_OK' for r in subset),
                'with_provider_rows':sum(int(r.get('provider_rows') or 0)>0 for r in subset),
                'with_valid_rows':sum(int(r.get('valid_rows') or 0)>0 for r in subset),
                'provider_rows':sum(int(r.get('provider_rows') or 0) for r in subset),
                'valid_rows':sum(int(r.get('valid_rows') or 0) for r in subset)},sort_keys=True))
          print('READER_METRICS='+json.dumps(metrics,sort_keys=True))
          with store.connect() as c:
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'SAFETY_AFTER={s[0]}|{s[1]}')
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          PY
          HOST
