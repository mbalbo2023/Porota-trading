name: RC6 Wave18 Critical Approval Health RCA 2026-09-09

on:
  push:
    branches:
      - deploy-prep/rc6-wave18-currentbase-20260909
    paths:
      - .github/workflows/rc6-wave18-critical-approval-health-rca-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-wave18-critical-approval-health-rca-20260909
  cancel-in-progress: false

jobs:
  readonly-rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota-w18-rca"
          chmod 600 "$HOME/.ssh/porota-w18-rca"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only health RCA
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/porota-w18-rca" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_SHA=$(git rev-parse HEAD)
          TARGET=porota_critical_approval_rc6

          safety() {
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          }

          echo '=== PRE SAFETY ==='
          echo "RUNTIME_HEAD=$PRE_SHA"
          safety

          echo '=== TARGET STATE ==='
          sudo -n docker inspect "$TARGET" | python3 -c '
          import json,sys,re
          o=json.load(sys.stdin)[0]
          s=o.get("State") or {}; h=s.get("Health") or {}; cfg=o.get("Config") or {}
          print("RUNNING="+str(s.get("Running")))
          print("STATUS="+str(s.get("Status")))
          print("HEALTH="+str(h.get("Status")))
          print("RESTARTS="+str(o.get("RestartCount")))
          print("IMAGE="+str(cfg.get("Image")))
          print("READONLY_ROOTFS="+str((o.get("HostConfig") or {}).get("ReadonlyRootfs")))
          print("USER="+str(cfg.get("User")))
          for e in (h.get("Log") or [])[-5:]:
              out=str(e.get("Output") or "").replace("\n"," ")
              out=re.sub(r"(?i)(token|secret|password|authorization|cookie)=?[^ ]*",r"\1=[REDACTED]",out)
              print("HEALTH_LOG="+str(e.get("ExitCode"))+"|"+out[:500])
          '

          echo '=== SYSTEMD OWNERSHIP ==='
          for u in porota-critical-approval-rc6.service porota-critical-github-proxy-rc6.service; do
            if systemctl list-unit-files --no-legend "$u" 2>/dev/null | grep -q "$u"; then
              echo "UNIT_PRESENT=$u"
              systemctl is-enabled "$u" 2>/dev/null || true
              systemctl is-active "$u" 2>/dev/null || true
              systemctl show "$u" -p FragmentPath -p ExecMainStatus -p NRestarts --no-pager 2>/dev/null || true
            else
              echo "UNIT_PRESENT=NO|$u"
            fi
          done

          echo '=== SANITIZED CONTAINER LOG TAIL ==='
          sudo -n docker logs --tail 120 "$TARGET" 2>&1 | python3 -c '
          import sys,re
          pats=[
            (re.compile(r"(?i)(authorization|bearer|token|secret|password|cookie)(\s*[:=]\s*|\s+)[^\s,;]+"),r"\1=[REDACTED]"),
            (re.compile(r"(?i)(chat_id|user_id)(\s*[:=]\s*)[-0-9]+"),r"\1=[REDACTED]")]
          for line in sys.stdin:
              for p,r in pats: line=p.sub(r,line)
              print(line.rstrip()[:1000])
          ' || true

          echo '=== CONTROL PLANE METADATA ONLY ==='
          for d in /opt/porota-trading/data/control_plane /opt/porota-control-plane-rc6 /run/porota-critical-approval-rc6; do
            if [ -e "$d" ]; then
              echo "PATH_PRESENT=$d"
              sudo -n find "$d" -maxdepth 2 -printf '%y|%M|%u:%g|%TY-%Tm-%TdT%TH:%TM:%TS|%p\n' 2>/dev/null | head -120
            else
              echo "PATH_PRESENT=NO|$d"
            fi
          done

          echo '=== CONSUMER REFERENCES ==='
          sudo -n docker inspect porota_production_observer porota_production_dashboard | python3 -c '
          import json,sys
          for o in json.load(sys.stdin):
              name=o.get("Name","").lstrip("/")
              env=[x.split("=",1)[0] for x in ((o.get("Config") or {}).get("Env") or [])]
              refs=[x for x in env if any(k in x.upper() for k in ("CRITICAL","APPROVAL","CONTROL_PLANE","GITHUB_SOCKET"))]
              mounts=[]
              for m in o.get("Mounts") or []:
                  src=str(m.get("Source") or ""); dst=str(m.get("Destination") or "")
                  if any(k in (src+" "+dst).lower() for k in ("control_plane","critical","approval")):
                      mounts.append(dst)
              print(f"CONSUMER={name}|ENV_NAMES={refs}|MOUNT_DESTS={mounts}")
          '

          echo '=== IMAGE LABELS ==='
          sudo -n docker image inspect "$(sudo -n docker inspect -f '{{.Image}}' "$TARGET")" | python3 -c '
          import json,sys
          o=json.load(sys.stdin)[0]
          labels=(o.get("Config") or {}).get("Labels") or {}
          for k in sorted(labels):
              if k.startswith("porota.") or k.startswith("org.opencontainers.image."):
                  print(k+"="+str(labels[k]))
          '

          test "$(git rev-parse HEAD)" = "$PRE_SHA"
          echo '=== POST SAFETY ==='
          safety
          echo 'HOST_MUTATION=NO'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RC6_W18_CRITICAL_APPROVAL_HEALTH_RCA=GREEN'
          REMOTE
