name: RC6 Consolidated Control-Plane No-Hang Tests 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-controlplane-20261001
    paths:
      - '.github/workflows/rc6-consolidated-bounded-runtime-progress.yml'
      - 'tests/test_rc6_controlplane_nohang.py'
      - '.github/workflows/rc6-consolidated-controlplane-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_rc6_controlplane_nohang.py
