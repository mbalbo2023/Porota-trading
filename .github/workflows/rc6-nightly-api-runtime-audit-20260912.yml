name: RC6 nightly API runtime audit 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-nightly-api-runtime-audit-20260912.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect nightly PPI API service read only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = 'c8773c8346a880ac5ecfe99ece5555c5bb771524' || { echo ABORT=HOST_SHA_MOVED; exit 31; }
          echo '=== UNIT ==='
          systemctl cat porota-ppi-argentina-nightly-rc6.service 2>/dev/null || true
          echo '=== TIMER ==='
          systemctl cat porota-ppi-argentina-nightly-rc6.timer 2>/dev/null || true
          echo '=== EXEC_PATHS ==='
          systemctl show porota-ppi-argentina-nightly-rc6.service -p ExecStart --value 2>/dev/null || true
          for p in /usr/local/sbin/porota-ppi-argentina-nightly-rc6.sh /usr/local/sbin/porota-ppi-argentina-nightly-rc6-runtime.sh; do
            if [ -r "$p" ]; then echo "--- $p ---"; sed -n '1,280p' "$p"; fi
          done
          echo '=== NEXT ==='
          systemctl list-timers porota-ppi-argentina-nightly-rc6.timer --all --no-pager || true
          echo HOST_MUTATION=NONE
          echo ORDER_ROUTES=NOT_CALLED
          HOST
