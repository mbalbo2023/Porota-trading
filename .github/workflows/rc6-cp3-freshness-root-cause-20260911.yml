name: RC6 CP3 Freshness Root Cause 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-cp3-freshness-root-cause-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  cp3_freshness_rca:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Diagnose CE timer journal state and importer freshness read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ACTUAL="$(git -C /opt/porota-trading rev-parse HEAD)"
          echo "HOST_HEAD=$ACTUAL"; test "$ACTUAL" = "$TARGET"
          echo MUTATIONS=NONE
          echo '--- TIMER STATUS ---'
          sudo -n systemctl show porota-contract-evidence-rc6.timer -p ActiveState -p UnitFileState -p LastTriggerUSec -p NextElapseUSecRealtime -p Triggers --no-pager
          sudo -n systemctl show porota-contract-evidence-rc6.service -p ActiveState -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager
          echo '--- RUNTIME STATE SANITIZED ---'
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/opt/porota-trading/data/contract_evidence/rc6_trusted/runtime_state.json')
          if not p.exists(): print('RUNTIME_STATE=ABSENT')
          else:
              try:
                  d=json.loads(p.read_text())
                  safe={k:v for k,v in d.items() if k.lower() not in {'token','password','username','user','cookie','cookies','authorization','headers','body','payload','content','html'}}
                  print('RUNTIME_STATE='+json.dumps(safe,sort_keys=True))
              except Exception as e: print('RUNTIME_STATE_ERROR='+type(e).__name__)
          PY
          echo '--- RECENT SERVICE JOURNAL SANITIZED ---'
          sudo -n journalctl -u porota-contract-evidence-rc6.service --since '2026-09-10 18:00:00 UTC' --no-pager -n 160 \
            | sed -E 's/(token|password|authorization|cookie|username|user)=([^ ]+)/\1=[REDACTED]/Ig' \
            | tail -n 160
          echo '--- RECENT CE RUNS ---'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          for t in ('contract_evidence_v2_runs','contract_evidence_runs'):
              if not c.execute("select 1 from sqlite_master where type='table' and name=?",(t,)).fetchone(): continue
              cols=[r[1] for r in c.execute(f'pragma table_info("{t}")')]
              print('TABLE='+t+'|COLS='+';'.join(cols))
              order=next((x for x in ('started_at','finished_at','run_id') if x in cols),'rowid')
              rows=c.execute(f'select * from "{t}" order by "{order}" desc limit 20').fetchall()
              for r in rows:
                  d=dict(r)
                  if 'detail' in d and d['detail'] is not None: d['detail']=str(d['detail'])[:1500]
                  print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          print('--- CURRENT FRESHNESS BY FAMILY ---')
          if c.execute("select 1 from sqlite_master where type='table' and name='contract_evidence_v2_current'").fetchone():
              for r in c.execute('select family,count(*) n,max(observed_at) max_observed from contract_evidence_v2_current group by family order by family'):
                  print(json.dumps(dict(r),ensure_ascii=False,sort_keys=True))
          c.close()
          PY
          echo CP3_FRESHNESS_RCA_COMPLETE=YES
          HOST
