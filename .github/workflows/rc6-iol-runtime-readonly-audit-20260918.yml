name: RC6 IOL runtime readonly audit 2026-09-18

on:
  push:
    branches:
      - audit/rc6-iol-runtime-readonly-20260918
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-iol-runtime-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_iol_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_iol_audit" "$HOME/.ssh/known_hosts"

      - name: Read-only IOL runtime proof
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_iol_audit" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -u
          echo "RC6_IOL_AUDIT_UTC=$(date -u +%FT%TZ)"
          echo "MUTATIONS=NONE"
          echo "REAL_ORDER_ROUTES=NOT_CALLED"
          echo "HOST_SHA=$(sudo -n git -C /opt/porota-trading rev-parse HEAD 2>&1 || true)"

          echo "--- SAFETY ---"
          sudo -n docker exec -i porota_production_observer python - <<'PY' 2>&1 || true
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('PRAGMA query_only=ON')
          print('POST_STATE='+'|'.join(map(str,c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone())))
          print('SQLITE_QUICK_CHECK='+str(c.execute('PRAGMA quick_check').fetchone()[0]))
          c.close()
          PY

          echo "--- IOL UNITS ---"
          for unit in porota-iol-shadow-collector-rc6.timer porota-iol-shadow-collector-rc6.service; do
            echo "UNIT=$unit"
            sudo -n systemctl is-enabled "$unit" 2>&1 || true
            sudo -n systemctl is-active "$unit" 2>&1 || true
            sudo -n systemctl show "$unit" -p Result -p ActiveState -p SubState -p ExecMainStatus -p LastTriggerUSec -p NextElapseUSecRealtime -p Conditions --no-pager 2>&1 || true
          done

          echo "--- OAUTH PRESENCE ONLY ---"
          if sudo -n test -r /root/.config/porota/iol_mcp_oauth_bootstrap.json; then
            echo "IOL_OAUTH_BOOTSTRAP=READABLE"
            sudo -n python3 - <<'PY'
          import json
          p='/root/.config/porota/iol_mcp_oauth_bootstrap.json'
          try:
              x=json.load(open(p,encoding='utf-8'))
              tokens=x.get('tokens') if isinstance(x,dict) else {}
              registration=x.get('client_registration') if isinstance(x,dict) else {}
              oauth_state=x.get('oauth_state') if isinstance(x,dict) else {}
              print('IOL_OAUTH_SCHEMA=top_keys:'+','.join(sorted(map(str,x.keys())))+'|token_keys:'+','.join(sorted(map(str,tokens.keys()))) if isinstance(tokens,dict) else 'IOL_OAUTH_SCHEMA=TOKENS_INVALID')
              print('IOL_OAUTH_METADATA_KEYS=registration:'+','.join(sorted(map(str,registration.keys())))+'|state:'+','.join(sorted(map(str,oauth_state.keys()))) if isinstance(registration,dict) and isinstance(oauth_state,dict) else 'IOL_OAUTH_METADATA_KEYS=INVALID')
          except Exception as e:
              print('IOL_OAUTH_SCHEMA_ERROR='+type(e).__name__)
          PY
          else
            echo "IOL_OAUTH_BOOTSTRAP=NOT_READABLE"
          fi

          echo "--- HOST CACHE ---"
          CACHE=/opt/porota-trading/data/market/iol_shadow_latest.json
          if sudo -n test -f "$CACHE"; then
            sudo -n stat -c 'IOL_CACHE_STAT=%s|%y' "$CACHE"
            sudo -n python3 - "$CACHE" <<'PY'
          import json,sys
          try:
              p=json.load(open(sys.argv[1],encoding='utf-8'))
              rows=p.get('symbols') if isinstance(p,dict) else []
              states={}
              reasons={}
              for row in rows if isinstance(rows,list) else []:
                  state=str(row.get('state','UNKNOWN')).upper() if isinstance(row,dict) else 'INVALID'
                  states[state]=states.get(state,0)+1
                  reason=str(row.get('reason','') if isinstance(row,dict) else '')[:120]
                  if reason:
                      reasons[reason]=reasons.get(reason,0)+1
              print('IOL_CACHE_SUMMARY='+'|'.join([
                  'schema='+str(p.get('schema_version')),
                  'source='+str(p.get('source')),
                  'mode='+str(p.get('mode')),
                  'effect='+str(p.get('decision_effect')),
                  'refreshed_at='+str(p.get('refreshed_at')),
                  'symbols='+str(len(rows) if isinstance(rows,list) else 0),
                  'states='+','.join(f'{k}:{v}' for k,v in sorted(states.items())),
                  'reasons='+','.join(f'{k}:{v}' for k,v in sorted(reasons.items())),
              ]))
          except Exception as exc:
              print('IOL_CACHE_PARSE_ERROR='+type(exc).__name__)
          PY
          else
            echo "IOL_CACHE=ABSENT"
          fi

          echo "--- DASHBOARD VIEW PATH ---"
          sudo -n docker exec porota_production_dashboard sh -lc 'if test -f /app/data/market/iol_shadow_latest.json; then stat -c "DASHBOARD_CACHE_STAT=%s|%y" /app/data/market/iol_shadow_latest.json; else echo DASHBOARD_CACHE=ABSENT; fi' 2>&1 || true

          echo "--- DASHBOARD RENDER (READ-ONLY) ---"
          sudo -n docker exec -i porota_production_dashboard python - <<'PY' 2>&1 || true
          import urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/validacion", timeout=10) as response:
                  body=response.read().decode("utf-8","replace")
                  print("DASHBOARD_VALIDATION_HTTP="+str(response.status))
                  print("DASHBOARD_RENDER_IOL_READY="+str("Estado IOL</div><div class='paper-card-value'>READY" in body or ">READY</" in body))
                  print("DASHBOARD_RENDER_IOL_UNAVAILABLE="+str(">UNAVAILABLE</" in body))
                  print("DASHBOARD_RENDER_IOL_ROWS="+str("Aún no hay evidencia IOL cacheada" not in body))
          except Exception as exc:
              print("DASHBOARD_VALIDATION_ERROR="+type(exc).__name__)
          PY

          echo "--- DASHBOARD COMPONENT RENDER (READ-ONLY) ---"
          sudo -n docker exec -i porota_production_dashboard python - <<'PY' 2>&1 || true
          try:
              import ez_iol_shadow_validation_view_rc6 as iol_view
              body=iol_view.render()
              print("DASHBOARD_COMPONENT_IOL_READY="+str(">READY</" in body))
              print("DASHBOARD_COMPONENT_IOL_UNAVAILABLE="+str(">UNAVAILABLE</" in body))
              print("DASHBOARD_COMPONENT_IOL_ROWS="+str("Aún no hay evidencia IOL cacheada" not in body))
          except Exception as exc:
              print("DASHBOARD_COMPONENT_RENDER_ERROR="+type(exc).__name__)
          PY

          echo "--- DASHBOARD CACHE RESOLUTION (READ-ONLY) ---"
          sudo -n docker exec -i porota_production_dashboard python - <<'PY' 2>&1 || true
          try:
              import os
              import iol_shadow_observation_rc6 as observation
              path=observation.cache_path()
              data=observation.collect()
              print("DASHBOARD_CACHE_OVERRIDE_SET="+str(bool(os.getenv("POROTA_IOL_SHADOW_CACHE_PATH","").strip())))
              print("DASHBOARD_COMPONENT_CACHE_EXISTS="+str(path.is_file()))
              print("DASHBOARD_COMPONENT_COLLECT_STATE="+str(data.get("state")))
              print("DASHBOARD_COMPONENT_COLLECT_ROWS="+str(len(data.get("symbols") or [])))
          except Exception as exc:
              print("DASHBOARD_CACHE_RESOLUTION_ERROR="+type(exc).__name__)
          PY

          echo "--- SERVICE JOURNAL (SANITIZED) ---"
          sudo -n journalctl -u porota-iol-shadow-collector-rc6.service -n 80 --no-pager 2>&1 | sed -E 's/(Bearer |access_token["=: ]+|refresh_token["=: ]+)[^[:space:]]+/\1[REDACTED]/g' || true
          echo "RC6_IOL_AUDIT_COMPLETE=YES"
          HOST

# Re-run after IOL OAuth refresh deployment.

# Re-run to verify rendered dashboard after IOL recovery.

# Re-run with container stdin attached for dashboard render proof.

# Re-run to prove the IOL view component reads the mounted cache.

# Re-run to identify dashboard cache resolution without exposing paths.
