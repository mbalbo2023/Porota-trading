name: RC6 624 PR637 failed COLD archive read-only inventory

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/rc6-624-637-cold-readonly.yml]

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'diagnostic/rc6-624-637-cold-readonly-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2601a910f2997bd6a9d59dee81af2c3818c25a6c
      - name: Confirm exact failed promotion and diagnostic source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 2601a910f2997bd6a9d59dee81af2c3818c25a6c
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/mbalbo2023/Porota-trading/actions/runs/39180374877',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=15) as response: run=json.load(response)
          assert run['head_sha']=='ee938348e6486900dcd595275e25440a3983021c'
          assert run['status']=='completed' and run['conclusion']=='failure'
          print('RC6_637_EXACT_RED_DEPLOY=GREEN')
          PY
      - name: Inspect only exact namespace and current safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/key"' EXIT
          mkdir -p evidence
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 "$DO_USER@$DO_HOST" 'sudo -n python3 -B -' <<'PY' > evidence/inventory.json
          import hashlib,json,os,shutil,sqlite3,subprocess,time
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/opt/porota-trading')
          ident='89e7f81dbc9b4a628bdc30edf86a17b0'
          source=root/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow/cold-audit'
          archive=root/'data/deploy'/('rc6-failed-cold-'+ident)
          shadow=source.parent
          names={ident+'.pack','manifest-'+ident+'.json','receipt-'+ident+'.json','queue.json'}
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          def directory(path):
              out={'exists':path.exists(),'symlink':path.is_symlink()}
              if not path.is_dir() or path.is_symlink():return out
              actual={p.name for p in path.iterdir()}
              out['names']=sorted(actual)
              out['mode']=oct(path.lstat().st_mode&0o777)
              out['exact_expected_names']=actual==names
              out['files']={}
              for name in sorted(actual&names):
                  p=path/name
                  st=p.lstat()
                  out['files'][name]={'bytes':st.st_size,'sha256':sha(p) if p.is_file() and not p.is_symlink() else None,
                      'inode':st.st_ino,'device':st.st_dev,'mtime_ns':st.st_mtime_ns,'ctime_ns':st.st_ctime_ns,
                      'mode':oct(st.st_mode&0o777),'nlink':st.st_nlink}
              qpath=path/'queue.json'
              if qpath.is_file() and not qpath.is_symlink() and qpath.stat().st_size<=256*1024:
                  envelope=json.loads(qpath.read_text())
                  payload=envelope.get('payload',{})
                  encoded=json.dumps(payload,sort_keys=True,separators=(',',':'),default=str,
                      ensure_ascii=True,allow_nan=False).encode('ascii')
                  out['queue']={'envelope_valid':hashlib.sha256(encoded).hexdigest()==envelope.get('sha256'),
                      'snapshot_id':payload.get('snapshot_id'),'state':payload.get('state')}
              return out
          def inspect(name):
              x=json.loads(subprocess.check_output(['docker','inspect',name],text=True,timeout=15))[0]
              return {'id':x['Id'],'image':x['Image'],'status':x['State']['Status'],
                  'health':(x['State'].get('Health') or {}).get('Status'),'restarts':x['RestartCount'],
                  'oom':x['State']['OOMKilled']}
          def envelope(path):
              raw=path.read_bytes()
              assert len(raw)<=256*1024
              value=json.loads(raw)
              payload=value['payload']
              encoded=json.dumps(payload,sort_keys=True,separators=(',',':'),default=str,
                  ensure_ascii=True,allow_nan=False).encode('ascii')
              return {'valid':hashlib.sha256(encoded).hexdigest()==value['digest'],
                  'generation_id':payload.get('generation_id'),'file':payload.get('file'),
                  'status':payload.get('status'),'real_orders_sent':payload.get('real_orders_sent')}
          def cut_summary(name):
              import gzip
              assert name.startswith('cut-') and name.endswith('.json.gz') and '/' not in name
              with gzip.open(shadow/name,'rb') as stream:raw=stream.read(4*1024*1024+1)
              assert len(raw)<=4*1024*1024
              value=json.loads(raw);payload=value['payload']
              encoded=json.dumps(payload,sort_keys=True,separators=(',',':'),default=str,
                  ensure_ascii=True,allow_nan=False).encode('ascii')
              report=payload.get('report',{}).get('computed_report',{})
              manifest=payload.get('manifest',{})
              return {'valid':hashlib.sha256(encoded).hexdigest()==value['digest'],
                  'generation_id':payload.get('generation_id'),
                  'snapshot_id':report.get('snapshot_id'),
                  'state':report.get('state'),
                  'status':payload.get('status',{}).get('status'),
                  'manifest_generation_id':manifest.get('generation_id'),
                  'manifest_sequence':manifest.get('sequence'),
                  'manifest_sha256':hashlib.sha256(json.dumps(manifest,sort_keys=True,
                      separators=(',',':'),default=str,ensure_ascii=True,allow_nan=False).encode('ascii')).hexdigest()}
          db=root/'data/paper_v17/observer_v17.db'
          con=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=2)
          con.execute('PRAGMA query_only=ON')
          mode,orders,process,session,heartbeat=con.execute(
              'SELECT mode,real_orders_sent,process_state,session_state,heartbeat_at FROM observer_state WHERE id=1').fetchone()
          assert mode=='PRODUCTION_PAPER' and type(orders) is int and orders==0
          con.close()
          qpath=root/'data/deploy/quiescence-38b04252f5e25d43bf40c2fa332a9d01d3eb8fb1.json'
          q=json.loads(qpath.read_text())
          stop_checks={}
          for name in ('porota_production_observer','porota_production_dashboard'):
              docker=json.loads(subprocess.check_output(['docker','inspect',name],text=True,timeout=15))[0]
              lifecycle={key:docker['State'].get(key) for key in ('Status','StartedAt','FinishedAt','ExitCode','OOMKilled')}
              proof=q.get('stop_evidence',{}).get(name,{})
              stop_checks[name]={'same_lifecycle':proof.get('after')==lifecycle,
                  'classification':proof.get('classification'),
                  'same_id':q.get('containers',{}).get(name,{}).get('id')==docker['Id'],
                  'same_image':q.get('containers',{}).get(name,{}).get('image')==docker['Image'],
                  'exit_code':lifecycle['ExitCode'],'status':lifecycle['Status']}
          q={k:q.get(k) for k in ('status','candidate_sha','installation_started','inflight','real_orders_sent','ppi_watch_accessed','containers')}
          q['stop_checks']=stop_checks
          current=json.loads((shadow/'CURRENT.json').read_text())['payload']
          current_cut=cut_summary(current['file'])
          old_name='cut-b6687dbca06ab97bc9c93d3f7940c61bba577f68d4ff4b9f887332638c0b7cb8.json.gz'
          old_cut=cut_summary(old_name) if (shadow/old_name).exists() else {'exists':False}
          units=subprocess.check_output(['systemctl','list-unit-files','--no-legend'],text=True,timeout=10).splitlines()
          ppi={}
          for line in units:
              name=line.split()[0]
              if 'ppi' in name.lower() and 'watch' in name.lower():
                  ppi[name]=[subprocess.run(['systemctl',cmd,name],capture_output=True,text=True,timeout=5).stdout.strip()
                             for cmd in ('is-active','is-enabled')]
          mem=next(int(x.split()[1])*1024 for x in Path('/proc/meminfo').read_text().splitlines()
                   if x.startswith('MemAvailable:'))
          images=[]
          for line in subprocess.check_output(['docker','image','ls','--no-trunc','--format','{{json .}}'],
              text=True,timeout=15).splitlines():
              row=json.loads(line)
              images.append({k:row.get(k) for k in ('Repository','Tag','ID','Size')})
          all_containers=[]
          for cid in subprocess.check_output(['docker','ps','-aq','--no-trunc'],text=True,timeout=15).splitlines():
              row=json.loads(subprocess.check_output(['docker','inspect',cid],text=True,timeout=15))[0]
              all_containers.append({'id':row['Id'],'name':row['Name'],'image':row['Image'],
                  'status':row['State']['Status']})
          policy=json.loads((root/'ops/policy/rc6-disk-housekeeping-v1.json').read_text())
          backup={}
          for group,cfg in policy['backups'].items():
              if group=='protected_paths':continue
              base=Path(cfg['root'])
              rows=sorted(({'name':p.name,'size':p.stat().st_size,'mtime_ns':p.stat().st_mtime_ns}
                  for p in base.glob(cfg['glob']) if p.is_file() and not p.is_symlink()),
                  key=lambda x:(x['mtime_ns'],x['name']),reverse=True)
              backup[group]={'keep_newest':cfg['keep_newest'],'pinned_names':cfg.get('pinned_names',[]),
                  'rows':rows}
          usage={str(path):sum(p.stat().st_size for p in Path(path).rglob('*') if p.is_file() and not p.is_symlink())
              for path in ('/var/cache/apt','/var/log/journal') if Path(path).exists()}
          disk_df=subprocess.check_output(['docker','system','df','--verbose'],text=True,timeout=30)
          def du(path):
              if not Path(path).exists():return None
              return subprocess.check_output(['du','-sx','-B1',path],text=True,timeout=40).split()[0]
          selected={p:du(p) for p in ('/tmp','/opt/porota-trading/data/deploy',
              '/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db',
              '/var/lib/docker/buildkit','/var/lib/docker/overlay2','/var/cache','/var/log')}
          tmp=[]
          for p in Path('/tmp').iterdir():
              if not p.name.startswith(('porota','rc6')):continue
              stat=p.lstat()
              tmp.append({'name':p.name,'mode':oct(stat.st_mode&0o777),
                  'mtime_ns':stat.st_mtime_ns,'size':du(str(p))})
          logs=[]
          for p in Path('/var/log').rglob('*'):
              if p.is_file() and not p.is_symlink():
                  st=p.stat()
                  logs.append({'path':str(p),'bytes':st.st_size,'mtime_ns':st.st_mtime_ns})
          logs=sorted(logs,key=lambda row:row['bytes'],reverse=True)[:25]
          journal=subprocess.check_output(['journalctl','--disk-usage'],text=True,timeout=20)
          result={'schema':'rc6.issue624.cold-dual-namespace-readonly.v1',
              'observed_at':datetime.now(timezone.utc).isoformat(),'read_only':True,
              'source':directory(source),'archive':directory(archive),
              'live':{'pointer':envelope(shadow/'CURRENT.json'),
                  'status':envelope(shadow/'status.json'),
                  'pointer_payload':{k:current.get(k) for k in ('generation_id','file','sequence','manifest_sha256')},
                  'current_cut':current_cut,'old_cut':old_cut},
              'quiescence':q,'observer_db':{'mode':mode,'real_orders_sent':orders,'process_state':process,
                  'session_state':session,'heartbeat_at':heartbeat},
              'containers':{n:inspect(n) for n in ('porota_production_observer',
                  'porota_production_dashboard','porota_critical_approval_rc6')},
              'ppi_watch':ppi,'disk_free_bytes':shutil.disk_usage('/').free,
              'mem_available_bytes':mem,'disk_inventory':{'images':images,
                  'containers':all_containers,'backups':backup,'cache_usage':usage,
                  'docker_df':disk_df,'selected_du':selected,'tmp':tmp,
                  'large_logs':logs,'journal_usage':journal}}
          print(json.dumps(result,sort_keys=True,separators=(',',':')))
          PY
          python3 - <<'PY' > "$RUNNER_TEMP/rc6_candidate_probe.py"
          from pathlib import Path
          cold=Path('scripts/rc6_failed_cold_fix_forward.py').read_text()
          quiescence=Path('scripts/rc6_deploy_quiescence.py').read_text()
          print('import json\nfrom pathlib import Path')
          print('cold_ns={"__name__":"rc6_cold_diagnostic"}')
          print('exec(compile('+repr(cold)+',"<exact-candidate-cold>","exec"),cold_ns)')
          print('quiescence_ns={"__name__":"rc6_quiescence_diagnostic"}')
          print('exec(compile('+repr(quiescence)+',"<exact-candidate-quiescence>","exec"),quiescence_ns)')
          print("root=Path('/opt/porota-trading')")
          print("shadow=root/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow'")
          print("archive=root/'data/deploy/rc6-failed-cold-89e7f81dbc9b4a628bdc30edf86a17b0'")
          print("proof=cold_ns['checked'](archive,shadow)")
          print("owned={name:quiescence_ns['inspect'](name) for name in quiescence_ns['OWNED']}")
          print("next_receipt=quiescence_ns['adopt_stopped_after_failed_install']('2601a910f2997bd6a9d59dee81af2c3818c25a6c',root/'data/deploy',owned)")
          print("assert proof['pack_sha256']=='16bced23e0c4e5abfed908fb0185639c05e313fa0cbe166a6a9dcf1c0539d30e'")
          print("assert proof['old_cut_gc_complete'] is True and next_receipt['status']=='DRAINED'")
          print("print(json.dumps({'candidate':'2601a910f2997bd6a9d59dee81af2c3818c25a6c','cold':proof,'continuation':{'status':next_receipt['status'],'from':next_receipt['fix_forward_from'],'prior_receipt_sha256':next_receipt['prior_receipt_sha256']},'read_only':True},sort_keys=True))")
          PY
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 "$DO_USER@$DO_HOST" 'sudo -n python3 -B -' \
            < "$RUNNER_TEMP/rc6_candidate_probe.py" > evidence/candidate-proof.json
          python -m json.tool evidence/inventory.json >/dev/null
          python -m json.tool evidence/candidate-proof.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('evidence/inventory.json'))
          assert x['read_only'] and x['observer_db']['mode']=='PRODUCTION_PAPER' and x['observer_db']['real_orders_sent']==0
          print('RC6_637_DUAL_NAMESPACE_READONLY=GREEN')
          print('SOURCE_PRESENT='+str(x['source']['exists'])+'|ARCHIVE_PRESENT='+str(x['archive']['exists']))
          print('CONTAINERS='+','.join(n+':'+v['status'] for n,v in x['containers'].items()))
          print('DISK_FREE_BYTES='+str(x['disk_free_bytes']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-624-637-cold-inventory-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
