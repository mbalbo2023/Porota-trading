name: RC6 624 COLD original-byte forensic replay

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/rc6-624-637-cold-readonly.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  replay:
    if: github.head_ref == 'diagnostic/rc6-624-637-cold-readonly-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97361c1ce3476465d267e9216e6bcc065696e72f
      - name: Bind exact source and historical RED
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 97361c1ce3476465d267e9216e6bcc065696e72f
          python3 - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/mbalbo2023/Porota-trading'
          def get(path):
              req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=20) as stream:return json.load(stream)
          assert get('/branches/deploy/rc6-pr69-isolated-20260915')['commit']['sha']=='d52e45fe85ed184a76d35120ca543f5d63f38b2c'
          run=get('/actions/runs/39185545107')
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert run['head_sha']=='d52e45fe85ed184a76d35120ca543f5d63f38b2c'
          print('EXACT_PRODUCT_AND_RED=GREEN')
          PY
      - name: Read original evidence into ephemeral runner, without host writes
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m700 -d "$HOME/.ssh" "$RUNNER_TEMP/cold-original"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          trap 'rm -f "$HOME/.ssh/key"' EXIT
          remote() { ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$DO_USER@$DO_HOST" "$@"; }
          remote 'sudo -n python3 -B -' <<'PY' > "$RUNNER_TEMP/cold-original/meta.json"
          import hashlib,json,os,shutil,sqlite3,stat
          from pathlib import Path
          root=Path('/opt/porota-trading')
          db=root/'data/paper_v17/observer_v17.db'
          shadow=root/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow'
          cold=shadow/'cold-audit'
          ident='7dc99ccd8f7c47849ca3705ae1cb2c49'
          pack=cold/(ident+'.pack')
          def envelope(path):
              e=json.loads(path.read_bytes());p=e['payload']
              raw=json.dumps(p,sort_keys=True,separators=(',',':'),default=str,ensure_ascii=True,allow_nan=False).encode('ascii')
              assert hashlib.sha256(raw).hexdigest()==e['sha256']
              return p
          manifest=envelope(cold/('manifest-'+ident+'.json'))
          receipt=envelope(cold/('receipt-'+ident+'.json'))
          queue=envelope(cold/'queue.json')
          assert receipt['state']==queue['state']=='FAILED' and manifest['snapshot_id']==queue['snapshot_id']==ident
          assert manifest['pack_sha256']=='d19b7e9062327a4f9d013b57cff9f2d1824f9dba386d9756bc0e2a0b3240cf0c'
          st=pack.stat();assert stat.S_ISREG(st.st_mode) and st.st_nlink==1 and st.st_size==211783290
          assert [st.st_dev,st.st_ino,st.st_size,st.st_mtime_ns,st.st_ctime_ns]==manifest['pack_identity']
          con=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True);con.execute('PRAGMA query_only=ON')
          mode,orders,process,session=con.execute('SELECT mode,real_orders_sent,process_state,session_state FROM observer_state WHERE id=1').fetchone();con.close()
          assert mode=='PRODUCTION_PAPER' and type(orders) is int and orders==0
          assert session=='MARKET_CLOSED' and process=='WAITING_MARKET'
          rows=[]
          for path in shadow.iterdir():
              s=path.lstat();assert not stat.S_ISLNK(s.st_mode)
              rows.append({'name':path.name,'bytes':s.st_size,'dir':stat.S_ISDIR(s.st_mode)})
          assert shutil.disk_usage('/').free>2*1024**3
          print(json.dumps({'schema':'rc6.cold2.replay-input.v1','id':ident,'pack_bytes':st.st_size,
              'pack_sha256':manifest['pack_sha256'],'pack_identity':manifest['pack_identity'],
              'manifest_sha256':queue['manifest_sha256'],'failed_at':receipt['failed_at'],
              'sealed_at':manifest['sealed_at'],'deadline_at':manifest['deadline_at'],
              'mode':mode,'orders':orders,'session':session,'process':process,
              'disk_free':shutil.disk_usage('/').free,'root_rows':rows},sort_keys=True))
          PY
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/cold-original/meta.json'))
          assert x['pack_sha256']=='d19b7e9062327a4f9d013b57cff9f2d1824f9dba386d9756bc0e2a0b3240cf0c'
          print('READ_ONLY_INPUT=GREEN|root_count='+str(len(x['root_rows']))+'|root_bytes='+str(sum(p['bytes'] for p in x['root_rows']))+'|free='+str(x['disk_free']))
          PY
          cold=/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/dynamic-shadow/cold-audit
          remote "sudo -n cat $cold/7dc99ccd8f7c47849ca3705ae1cb2c49.pack" > "$RUNNER_TEMP/cold-original/original.pack"
          remote "sudo -n cat $cold/manifest-7dc99ccd8f7c47849ca3705ae1cb2c49.json" > "$RUNNER_TEMP/cold-original/original-manifest.json"
          remote "sudo -n cat $cold/receipt-7dc99ccd8f7c47849ca3705ae1cb2c49.json" > "$RUNNER_TEMP/cold-original/original-receipt.json"
          remote "sudo -n cat $cold/queue.json" > "$RUNNER_TEMP/cold-original/original-queue.json"
          test "$(sha256sum "$RUNNER_TEMP/cold-original/original.pack" | cut -d' ' -f1)" = d19b7e9062327a4f9d013b57cff9f2d1824f9dba386d9756bc0e2a0b3240cf0c
          remote 'sudo -n stat -c "%d:%i:%s:%Y:%Z" /opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/dynamic-shadow/cold-audit/7dc99ccd8f7c47849ca3705ae1cb2c49.pack' > "$RUNNER_TEMP/cold-original/post-stat.txt"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/cold-original/meta.json'))
          d,i,size,*_=open(os.environ['RUNNER_TEMP']+'/cold-original/post-stat.txt').read().strip().split(':')
          assert list(map(int,(d,i,size)))==x['pack_identity'][:3]
          print('ORIGINAL_PACK_TRANSFER_HASH_AND_INODE=GREEN')
          PY
      - name: Verify historical source and ABI against frozen artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m700 -d "$HOME/.ssh" "$RUNNER_TEMP/cold-image"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          trap 'rm -f "$HOME/.ssh/key"' EXIT
          remote() { ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$DO_USER@$DO_HOST" "$@"; }
          live_id="$(remote "sudo -n docker inspect -f '{{.Image}}' porota_critical_approval_rc6")"
          test "$live_id" = sha256:687af03ef0cd81c992d604d5ae391105229b7102b7fbca4d0c8582e973ad5098
          for item in cold_audit.py persistence.py _rc6_json_bound.so; do
            remote "sudo -n docker cp porota_critical_approval_rc6:/app/rc6_shadow_runtime/$item - | tar -xOf - | sha256sum" | cut -d' ' -f1 >> "$RUNNER_TEMP/cold-image/live-hashes.txt"
          done
          gh run download 39151289967 --repo mbalbo2023/Porota-trading --name porota-predeploy-v2-97361c1ce3476465d267e9216e6bcc065696e72f --dir "$RUNNER_TEMP/cold-image"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cold-image'
          f=json.loads(next(root.rglob('porota-frozen-candidate.json')).read_text())
          assert f['candidate_sha']=='97361c1ce3476465d267e9216e6bcc065696e72f'
          assert f['image_id']=='sha256:d83ab03030be37b6265f1cc691ceae2ebf36f45f2b61a4e4c6c269c05c52e07c'
          assert f['paper_mode_required']=='PRODUCTION_PAPER' and f['real_orders_sent_required']==0
          image=next(root.rglob('porota-predeploy-image.tar.gz'))
          h=hashlib.sha256()
          with image.open('rb') as stream:
              while b:=stream.read(1024*1024):h.update(b)
          assert h.hexdigest()==f['image_tar_sha256']
          print('FROZEN_IMAGE_BYTES=GREEN|image_id='+f['image_id'])
          PY
          image_path="$(find "$RUNNER_TEMP/cold-image" -name porota-predeploy-image.tar.gz -print -quit)"
          gzip -dc "$image_path" | docker load >/dev/null
          image_id=sha256:d83ab03030be37b6265f1cc691ceae2ebf36f45f2b61a4e4c6c269c05c52e07c
          test "$(docker image inspect -f '{{.Id}}' "$image_id")" = "$image_id"
          docker run --rm --network none --read-only --entrypoint python "$image_id" -B -c \
            'import hashlib,pathlib;from rc6_shadow_runtime import cold_audit,persistence;assert persistence._native_json_bound is not None;root=pathlib.Path(cold_audit.__file__).parent;print("\n".join(hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ("cold_audit.py","persistence.py","_rc6_json_bound.so")))' > "$RUNNER_TEMP/cold-image/frozen-hashes.txt"
          diff -u "$RUNNER_TEMP/cold-image/live-hashes.txt" "$RUNNER_TEMP/cold-image/frozen-hashes.txt"
          echo 'HISTORICAL_SOURCE_NATIVE_ABI_BYTE_PARITY=GREEN'
          echo "$image_id" > "$RUNNER_TEMP/cold-image/loaded-id.txt"
      - name: Finite isolated replay at original occupancy and empty occupancy
        shell: bash
        run: |
          set -Eeuo pipefail
          image_id="$(cat "$RUNNER_TEMP/cold-image/loaded-id.txt")"
          mkdir -p "$RUNNER_TEMP/cold-replay"
          cp "$RUNNER_TEMP/cold-original/meta.json" "$RUNNER_TEMP/cold-replay/meta.json"
          cp "$RUNNER_TEMP/cold-original/original-manifest.json" "$RUNNER_TEMP/cold-replay/original-manifest.json"
          cp "$RUNNER_TEMP/cold-original/original-receipt.json" "$RUNNER_TEMP/cold-replay/original-receipt.json"
          cp "$RUNNER_TEMP/cold-original/original-queue.json" "$RUNNER_TEMP/cold-replay/original-queue.json"
          cp "$RUNNER_TEMP/cold-original/original.pack" "$RUNNER_TEMP/cold-replay/original.pack"
          cat > "$RUNNER_TEMP/cold-replay/replay.py" <<'PY'
          import hashlib,json,os,re,shutil,stat,time,traceback
          from pathlib import Path
          from rc6_shadow_runtime import cold_audit as c,persistence as p
          base=Path('/sandbox');meta=json.loads((base/'meta.json').read_text())
          original=json.loads((base/'original-manifest.json').read_text())
          assert p.digest(original['payload'])==original['sha256']==meta['manifest_sha256']
          assert json.loads((base/'original-receipt.json').read_text())['payload']['state']=='FAILED'
          assert c._native() is not None
          print('NATIVE_ABI=GREEN',flush=True)
          results=[]
          for case in ('historical_occupancy','empty_occupancy'):
              root=base/case;root.mkdir(mode=0o700)
              cold=root/'cold-audit';cold.mkdir(mode=0o700)
              if case=='historical_occupancy':
                  for n,row in enumerate(meta['root_rows']):
                      if row['dir'] or row['name']=='writer.lock':continue
                      name=row['name'];assert '/' not in name and name not in ('.','..')
                      with (root/name).open('wb') as stream:stream.truncate(row['bytes'])
              ident=meta['id'];pack=cold/(ident+'.pack')
              shutil.copyfile(base/'original.pack',pack);pack.chmod(0o600)
              st=pack.stat()
              manifest=dict(original['payload'])
              # Only the disposable copy is re-bound to its own inode and live clock.
              manifest['pack_identity']=c._identity(st)
              manifest['sealed_at']=time.time()-2.28
              manifest['deadline_at']=manifest['sealed_at']+c.DEADLINE
              def envelope(payload):return {'payload':payload,'sha256':p.digest(payload)}
              (cold/('manifest-'+ident+'.json')).write_text(json.dumps(envelope(manifest),sort_keys=True,separators=(',',':')))
              queue={'state':'PENDING','snapshot_id':ident,'manifest_sha256':p.digest(manifest)}
              (cold/'queue.json').write_text(json.dumps(envelope(queue),sort_keys=True,separators=(',',':')))
              for file in cold.iterdir():file.chmod(0o600)
              stage=['admission'];orig=c._expand
              def expand(*a,**k):
                  stage[0]='expand';yield from orig(*a,**k)
              c._expand=expand
              start=time.monotonic();code='SUCCESS';error_class='';receipt=''
              try:
                  with p.EvidenceFiles(root) as files:
                      stage[0]='drain'
                      c.drain(files)
              except Exception as exc:
                  error_class=type(exc).__name__
                  message=str(exc)
                  code=message if re.fullmatch(r'SHADOW_[A-Z0-9_]{1,120}',message) else 'UNCLASSIFIED'
              finally:c._expand=orig
              receipt=json.loads((cold/('receipt-'+ident+'.json')).read_text())['payload']['state'] if (cold/('receipt-'+ident+'.json')).exists() else 'MISSING'
              results.append({'case':case,'code':code,'error_class':error_class,'phase':stage[0],
                  'receipt':receipt,'elapsed_s':round(time.monotonic()-start,3),
                  'root_count':len(list(root.iterdir())),'root_bytes':sum(x.lstat().st_size for x in root.iterdir())})
              print('REPLAY='+case+'|'+code+'|'+str(results[-1]['elapsed_s']),flush=True)
              if case=='historical_occupancy' and code not in ('SHADOW_EVIDENCE_CAPACITY_REACHED','SUCCESS'):
                  break
          out={'schema':'rc6.cold2.replay.v1','original_pack_sha256':meta['pack_sha256'],
              'original_manifest_sha256':meta['manifest_sha256'],'image_sha':os.environ.get('POROTA_BUILD_SHA'),
              'cgroup_memory_bytes':512*1024**2,'cpus':0.75,
              'resource_model':'runner_cgroup; source/root occupancy measured after original failure',
              'historical_deadline_remaining_s':round(meta['deadline_at']-meta['failed_at'],3),
              'cases':results}
          (base/'summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
          timeout 150 docker run --rm -i --network none --read-only --memory 512m --memory-swap 512m --cpus .75 \
            --pids-limit 128 --user "$(id -u):$(id -g)" --mount "type=bind,source=$RUNNER_TEMP/cold-replay,target=/sandbox" \
            "$image_id" python -B /sandbox/replay.py
          python3 -m json.tool "$RUNNER_TEMP/cold-replay/summary.json" >/dev/null
          cp "$RUNNER_TEMP/cold-replay/summary.json" "$RUNNER_TEMP/cold-summary.json"
      - name: Upload only sanitized summary, never original bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-cold2-sanitized-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove ephemeral sensitive bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/cold-original" "$RUNNER_TEMP/cold-replay" "$RUNNER_TEMP/cold-image"
