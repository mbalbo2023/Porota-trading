name: RC6 canonical 1960 PPI API history audit 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-canonical-1960-history-audit-20260912.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Audit historical coverage for exact canonical 1960 read only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }
          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"; case "$st" in active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 32;; esac
          done
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 600 9 || { echo ABORT=HISTORY_LOCK_BUSY; exit 33; }
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json
          from collections import Counter,defaultdict
          import bf_production_paper_observer as m
          from cv_history_store_adapter_hf6 import default_history_store
          store=m.runtime_store()
          with store.connect() as c:
              qc=c.execute('pragma quick_check').fetchone()[0]; print('OBSERVER_QUICK_CHECK='+str(qc)); assert qc=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); print(f'SAFETY={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              shadow=[tuple(r) for r in c.execute("select ticker,instrument_type,market,currency,settlement from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR') order by instrument_type,ticker,market,currency,settlement")]
              assert len(shadow)==1960
              full_dups=c.execute("select count(*) from (select ticker,instrument_type,market,currency,settlement,count(*) n from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR') group by 1,2,3,4,5 having n>1)").fetchone()[0]
              coarse_coll=c.execute("select count(*) from (select ticker,instrument_type,settlement,count(*) n from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR') group by 1,2,3 having n>1)").fetchone()[0]
              print('CANONICAL_SHADOW=1960'); print('FULL_DUP_GROUPS='+str(full_dups)); print('COARSE_COLLISION_GROUPS='+str(coarse_coll)); assert full_dups==0 and coarse_coll==0
              tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              attempts={}
              if 'production_history_attempts' in tabs:
                  for r in c.execute('select symbol,instrument_type,settlement,state,valid_rows from production_history_attempts'):
                      attempts[(r[0],r[1],r[2])]={'state':r[3],'valid_rows':int(r[4] or 0)}
              family=defaultdict(Counter); rows_by_family=Counter(); missing=[]
              for ticker,itype,market,currency,settlement in shadow:
                  a=attempts.get((ticker,itype,settlement))
                  if a is None:
                      family[itype]['MISSING']+=1; missing.append((ticker,itype,market,currency,settlement))
                  else:
                      family[itype][str(a['state'])]+=1; rows_by_family[itype]+=a['valid_rows']
              print('HISTORY_ATTEMPT_CANONICAL_MATCHED='+str(1960-len(missing)))
              print('HISTORY_ATTEMPT_CANONICAL_MISSING='+str(len(missing)))
              for fam in sorted(family):
                  print('FAMILY_HISTORY='+json.dumps({'family':fam,'states':dict(sorted(family[fam].items())),'valid_rows':rows_by_family[fam]},sort_keys=True))
              if missing:
                  for x in missing[:100]: print('MISSING_IDENTITY='+json.dumps({'ticker':x[0],'family':x[1],'market':x[2],'currency':x[3],'settlement':x[4]},sort_keys=True))
              if 'production_history' in tabs:
                  hkeys={(r[0],r[1],r[2]) for r in c.execute('select symbol,instrument_type,settlement from production_history')}
                  canonical_coarse={(a,b,e) for a,b,c,d,e in shadow}
                  print('PRODUCTION_HISTORY_CANONICAL_KEYS='+str(len(hkeys & canonical_coarse)))
                  print('PRODUCTION_HISTORY_NONCANONICAL_ACTIVE_KEYS='+str(len(hkeys-canonical_coarse)))
              if 'ppi_api_closeout_classification_rc6' in tabs:
                  print('CLOSEOUT_CLASSIFICATION_ROWS='+str(c.execute('select count(*) from ppi_api_closeout_classification_rc6').fetchone()[0]))
          h=default_history_store()
          with h.connect() as c:
              qc=c.execute('pragma quick_check').fetchone()[0]; print('HISTORY_STORE_QUICK_CHECK='+str(qc)); assert qc=='ok'
              tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              canonical4={(a,b,c,e) for a,b,c,d,e in shadow}
              for t in ['history_canonical_v2','history_close_canonical_v1']:
                  if t in tabs:
                      keys={(r[0],r[1],r[2],r[3]) for r in c.execute('select distinct symbol,instrument_type,market,settlement from '+t)}
                      print(t.upper()+'_CANONICAL_KEYS='+str(len(keys & canonical4)))
                      print(t.upper()+'_NONCANONICAL_ACTIVE_KEYS='+str(len(keys-canonical4)))
                      print(t.upper()+'_TOTAL_ROWS='+str(c.execute('select count(*) from '+t).fetchone()[0]))
          print('HISTORY_AUDIT_STATUS=SUCCESS_READ_ONLY')
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
