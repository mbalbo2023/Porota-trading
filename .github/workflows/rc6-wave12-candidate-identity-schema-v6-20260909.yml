name: RC6 Wave12 Candidate Identity Schema V6 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave12-candidate-identity-schema-v6-20260909.yml']
permissions:
  contents: read
jobs:
  candidate-identity:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w12idschema"
          chmod 600 "$HOME/.ssh/w12idschema"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Query candidate universe read-only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -i "$HOME/.ssh/w12idschema" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE=$(git rev-parse HEAD)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json, re, sqlite3
          db='file:/app/data/paper_v17/observer_v17.db?mode=ro'
          c=sqlite3.connect(db,uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          cols=[dict(cid=x[0],name=x[1],type=x[2],notnull=x[3],default=x[4],pk=x[5]) for x in c.execute('pragma table_info(candidate_universe)')]
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}')
          print('CANDIDATE_COLUMNS='+json.dumps(cols,separators=(',',':')))
          names=[x['name'] for x in cols]
          identity=[n for n in names if re.search(r'(ticker|symbol|code|codigo|id|species|especie|isin|market|mercado|instrument|type|settlement|plazo|source)',n,re.I)]
          print('IDENTITY_COLUMNS='+','.join(identity))
          if not identity: raise SystemExit('NO_IDENTITY_COLUMNS')
          # Only instrument-market identity fields are printed; no account/user fields.
          safe=[n for n in identity if not re.search(r'(user|usuario|account|cuenta|token|secret|password|email|dni|cuit)',n,re.I)]
          famcol='instrument_type' if 'instrument_type' in names else None
          status_clause=" WHERE status='AVAILABLE'" if 'status' in names else ''
          query='SELECT '+','.join('"'+n+'"' for n in safe)+' FROM candidate_universe'+status_clause+' ORDER BY '+('instrument_type,ticker' if 'instrument_type' in names and 'ticker' in names else 'rowid')+' LIMIT 80'
          rows=[{k:x[k] for k in safe} for x in c.execute(query)]
          print('CANDIDATE_IDENTITY_SAMPLES='+json.dumps(rows,ensure_ascii=False,separators=(',',':')))
          counts={}
          if famcol:
              counts={str(x[0]):int(x[1]) for x in c.execute('SELECT instrument_type,count(*) FROM candidate_universe'+status_clause+' GROUP BY instrument_type ORDER BY instrument_type')}
          print('CANDIDATE_FAMILY_COUNTS='+json.dumps(counts,ensure_ascii=False,separators=(',',':')))
          c.close()
          print('W12_CANDIDATE_IDENTITY_SCHEMA=GREEN')
          PY
          test "$(git rev-parse HEAD)" = "$PRE"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RUNTIME_CHANGED=NO'
          REMOTE