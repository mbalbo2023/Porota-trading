name: RC6 Wave13 Materialize Currentbase 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave13-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave13-materialize-currentbase-20260909.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize selected history components
        run: |
          set -euo pipefail
          git fetch --no-tags origin feature/rc6-history-backfill-planner-20260907 feature/rc6-history-reconciler-v2-20260907
          git show origin/feature/rc6-history-backfill-planner-20260907:fj_history_backfill_planner_rc6.py > fj_history_backfill_planner_rc6.py
          git show origin/feature/rc6-history-backfill-planner-20260907:tests/test_history_backfill_planner_rc6.py > tests/test_history_backfill_planner_rc6.py
          git show origin/feature/rc6-history-reconciler-v2-20260907:fb_history_reconciler_rc6.py > fb_history_reconciler_rc6.py
          git show origin/feature/rc6-history-reconciler-v2-20260907:tests/test_history_reconciler_rc6.py > tests/test_history_reconciler_rc6.py
          python -m pip install -q pytest
          python -m py_compile fj_history_backfill_planner_rc6.py fb_history_reconciler_rc6.py
          python -m pytest -q tests/test_history_backfill_planner_rc6.py tests/test_history_reconciler_rc6.py
          python -c "import fj_history_backfill_planner_rc6 as p,fb_history_reconciler_rc6 as r;p.assert_shadow_only();r.assert_shadow_only();print('A3_DEFAULT=FAIL_CLOSED');print('CANONICAL_WRITE=DENY');print('ORDER_ROUTES=NOT_CALLED')"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fj_history_backfill_planner_rc6.py fb_history_reconciler_rc6.py tests/test_history_backfill_planner_rc6.py tests/test_history_reconciler_rc6.py
          git diff --cached --quiet || git commit -m 'feat(rc6 wave13): materialize tested history planner and reconciler'
          git push origin HEAD:deploy-prep/rc6-wave13-currentbase-20260909
