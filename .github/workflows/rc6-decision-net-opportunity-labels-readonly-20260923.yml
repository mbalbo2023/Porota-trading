name: RC6 Decision Net Opportunity Labels Readonly

on:
  push:
    branches:
      - audit/rc6-alpha-tuning-analysis-20260923
    paths:
      - rc6_decision_net_opportunity_labels.py
      - tests/test_rc6_decision_net_opportunity_labels.py
      - .github/workflows/rc6-decision-net-opportunity-labels-readonly-20260923.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-decision-net-opportunity-labels-readonly
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Static safety and focused test
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile rc6_decision_net_opportunity_labels.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_rc6_decision_net_opportunity_labels.py
          grep -q 'mode=ro' rc6_decision_net_opportunity_labels.py
          grep -q 'PRAGMA query_only=ON' rc6_decision_net_opportunity_labels.py
          ! grep -Eq 'requests\.|urllib|httpx|subprocess|os\.system' rc6_decision_net_opportunity_labels.py

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Verify PAPER safety before labels
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          STATE="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n docker exec -i porota_production_observer python -c \"import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('PRAGMA query_only=ON');r=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone();print('|'.join(map(str,r)));c.close()\"")"
          echo "PRE_SAFETY=$STATE"
          test "$STATE" = "PRODUCTION_PAPER|0"

      - name: Build BUY and HOLD net-opportunity labels
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n docker exec -i porota_production_observer sh -lc 'cd /app && python - --db /app/data/paper_v17/observer_v17.db'"             < rc6_decision_net_opportunity_labels.py > rc6_decision_net_opportunity_labels.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rc6_decision_net_opportunity_labels.json').read_text(encoding='utf-8'))
          assert r['read_only'] and not r['network_calls_performed'] and not r['broker_calls_performed']
          assert r['factual_fills_created'] is False
          assert r['safety']=={'mode':'PRODUCTION_PAPER','real_orders_sent':0}
          print('LABEL_COVERAGE='+json.dumps(r['coverage'],sort_keys=True))
          print('LABEL_TARGET_COUNTS='+json.dumps(r['target_counts'],sort_keys=True))
          print('LABEL_BY_DAY='+json.dumps(r['by_day'],sort_keys=True))
          PY

      - name: Verify PAPER safety after labels
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          STATE="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n docker exec -i porota_production_observer python -c \"import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('PRAGMA query_only=ON');r=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone();print('|'.join(map(str,r)));c.close()\"")"
          echo "POST_SAFETY=$STATE"
          test "$STATE" = "PRODUCTION_PAPER|0"
          echo "FACTUAL_FILLS_CREATED=FALSE"
          echo "RC6_DECISION_NET_OPPORTUNITY_LABELS=GREEN"

      - name: Upload labels artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc6-decision-net-opportunity-labels-${{ github.run_id }}
          path: rc6_decision_net_opportunity_labels.json
          if-no-files-found: error
          retention-days: 30
