name: RC6 Critical control-plane secret probe

on:
  push:
    branches: [feature/rc6-critical-telegram-approval-20260907]
    paths:
      - '.github/workflows/rc6-critical-control-plane-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check issue-control secret presence without exposing it
        shell: bash
        env:
          ISSUE_TOKEN: ${{ secrets.POROTA_GITHUB_ISSUE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ISSUE_TOKEN:-}" ]; then
            echo 'POROTA_GITHUB_ISSUE_CONTROL_TOKEN=PRESENT'
          else
            echo 'POROTA_GITHUB_ISSUE_CONTROL_TOKEN=MISSING'
          fi
          echo 'SECRET_VALUE_LOGGED=NO'
