name: RC6 hotfix CEDEAR US Labor Day

on:
  push:
    branches: [hotfix/rc6-cedear-us-labor-day-20260906]
    paths:
      - 'bu_instrument_catalog.py'
      - 'rc6_preopen.py'
      - 'tests/test_rc6_us_underlying_holiday.py'
      - 'scripts/rc6_data_learning_readonly_audit.py'
      - '.github/workflows/rc6-hotfix-cedear-labor-day.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: porota-rc6-hotfix-cedear-labor-day
  cancel-in-progress: false

env:
  BASE_LIVE_SHA: 5bdad270c2a23bb2456a320d41e18940ce70ec6f
  TARGET_BRANCH: hotfix/rc6-cedear-us-labor-day-20260906

jobs:
  validate-publish:
    name: Full offline validation and immutable archive
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact lineage and release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_LIVE_SHA" HEAD
          git diff --check
          python - <<'PY'
          import _version
          assert _version.VERSION == '17.0.0-rc6'
          assert _version.MODE == 'PRODUCTION_PAPER'
          assert _version.EXECUTION == 'SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY == 'BLOCKED'
          print('HOTFIX_RELEASE_IDENTITY=GREEN')
          PY

      - name: Compile source tree
        run: python -m compileall -q .

      - name: Build exact hotfix candidate
        run: docker build --pull=false --label "porota.commit=$GITHUB_SHA" --label "porota.version=17.0.0-rc6" -t porota-rc6-hotfix:${GITHUB_SHA} .

      - name: Focused US holiday regression tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint python porota-rc6-hotfix:${GITHUB_SHA} \
            -m pytest -q -p no:cacheprovider tests/test_rc6_us_underlying_holiday.py

      - name: Active RC6 pytest suite offline
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX -e DB_PATH=/tmp/porota-ci.db \
            -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false \
            --entrypoint bash porota-rc6-hotfix:${GITHUB_SHA} -lc \
            'python -m pytest -q -p no:cacheprovider --tb=short \
              --ignore=tests/test_hotfix_rc3_hf2.py \
              --ignore=tests/test_hotfix_rc3_hf4.py \
              --ignore=tests/test_hotfix_rc3_hf6.py \
              --ignore=tests/test_intraday_scalping_hf3.py \
              --ignore=tests/test_rc4_acceptance.py \
              --ignore=tests/test_rc4_hf1_last_mile.py \
              --ignore=tests/test_rc4_hf2_consolidation.py' > /tmp/rc6-hotfix-pytest.log 2>&1
          rc=$?
          set -e
          tail -n 300 /tmp/rc6-hotfix-pytest.log || true
          exit "$rc"

      - name: Hotfix safety invariants offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777 \
            --entrypoint python porota-rc6-hotfix:${GITHUB_SHA} - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import _version
          import bu_instrument_catalog as c
          at=datetime(2026,9,7,10,15,tzinfo=ZoneInfo('America/Argentina/Buenos_Aires'))
          after=datetime(2026,9,8,10,15,tzinfo=ZoneInfo('America/Argentina/Buenos_Aires'))
          expected='UNDERLYING_MARKET_CLOSED: US_LABOR_DAY'
          for s in ('AAPL','AAPLD','AAPLC','MSFT','KO','MELI'):
              assert c.rc6_underlying_opening_block(s,'CEDEARS',at)==expected
          assert c.rc6_underlying_opening_block('MSFT','CEDEAR',at)==expected
          assert c.rc6_underlying_opening_block('GGAL','ACCIONES',at)==''
          assert c.rc6_underlying_opening_block('MSFT','CEDEARS',after)==''
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'
          assert _version.EXECUTION=='SIMULATED'
          print('HOTFIX_INVARIANTS=GREEN')
          PY

      - name: Login GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable hotfix archive
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/mbalbo2023/porota-trading
        run: |
          set -euo pipefail
          REF="$IMAGE:rc6-hotfix-cedear-${GITHUB_SHA}"
          docker tag "porota-rc6-hotfix:${GITHUB_SHA}" "$REF"
          docker push "$REF" 2>&1 | tee /tmp/push.log
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/push.log | tail -n1)"
          if [ -z "$DIGEST" ]; then
            DIGEST="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          case "$DIGEST" in sha256:*) ;; *) echo INVALID_DIGEST; exit 1;; esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'version=17.0.0-rc6\ncommit=%s\nbase_live=%s\nimage=%s\ndigest=%s\n' \
            "$GITHUB_SHA" "$BASE_LIVE_SHA" "$IMAGE" "$DIGEST" > /tmp/hotfix-manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rc6-hotfix-cedear-manifest-${{ github.sha }}
          path: /tmp/hotfix-manifest.txt
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Transactional RC6 to RC6-hotfix deployment
    needs: validate-publish
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_deploy"
          chmod 600 "$HOME/.ssh/porota_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Activate exact hotfix with rollback to exact pre-hotfix RC6
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          ARCHIVE_DIGEST: ${{ needs.validate-publish.outputs.digest }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' BASE_LIVE_SHA='$BASE_LIVE_SHA' ARCHIVE_DIGEST='$ARCHIVE_DIGEST' bash -s" <<'HOST'
          set -Eeuo pipefail
          umask 077
          REPO=/opt/porota-trading
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          EXPECTED_BRANCH=release-candidate/v17.0.0-rc6-deploy3-20260906
          CURRENT_BRANCH="$(git -C "$REPO" branch --show-current)"
          CURRENT_SHA="$(git -C "$REPO" rev-parse HEAD)"
          CURRENT_IMAGE_ID="$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{.Id}}')"
          CURRENT_LABEL="$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')"
          ROLLBACK_IMAGE="porota-trading-bot:17.0.0-rc6-prehotfix-${CURRENT_SHA:0:12}"
          TMP=''; WT=''; ACTIVATED=0

          verify_runtime() {
            local expected_label="$1"
            local obs dash state label
            obs="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)"
            dash="$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}' porota_production_dashboard)"
            echo "VERIFY_OBSERVER=$obs"
            echo "VERIFY_DASHBOARD=$dash"
            test "$obs" = "true|$TARGET_IMAGE|0|true"
            test "$dash" = "true|$TARGET_IMAGE|0"
            label="$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')"
            test "$label" = "$expected_label"
            state="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          out=[]
          for p in ('/app/data/paper_v17/observer_v17.db','/app/data/market_history.db'):
              c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=20)
              c.execute('PRAGMA query_only=ON')
              out.append(c.execute('PRAGMA quick_check').fetchone()[0])
              if p.endswith('observer_v17.db'):
                  row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
              c.close()
          print('|'.join(map(str,(*out,*row))))
          PY
          )"
            echo "VERIFY_DB=$state"
            test "$state" = 'ok|ok|PRODUCTION_PAPER|0'
            curl -fsS http://127.0.0.1:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok'"
          }

          rollback() {
            echo 'HOTFIX_ROLLBACK=START'
            sudo -n docker tag "$ROLLBACK_IMAGE" "$TARGET_IMAGE"
            git -C "$REPO" checkout -f -B "$CURRENT_BRANCH" "$CURRENT_SHA"
            git -C "$REPO" branch --set-upstream-to="origin/$CURRENT_BRANCH" "$CURRENT_BRANCH" >/dev/null 2>&1 || true
            sudo -n python3 "$REPO/porota_mode_manager.py" simulation
            verify_runtime "$CURRENT_LABEL"
            echo 'HOTFIX_ROLLBACK=GREEN'
          }

          cleanup() {
            if [ -n "$WT" ] && [ -d "$WT" ]; then git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; fi
            [ -z "$TMP" ] || rmdir "$TMP" >/dev/null 2>&1 || true
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$ACTIVATED" -eq 1 ]; then rollback || true; fi
            cleanup
            exit "$rc"
          }
          trap on_exit EXIT

          echo '=== RC6 CEDEAR HOTFIX PREDEPLOY ==='
          echo "CURRENT_BRANCH=$CURRENT_BRANCH"
          echo "CURRENT_SHA=$CURRENT_SHA"
          echo "TARGET_BRANCH=$TARGET_BRANCH"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ARCHIVE_DIGEST=$ARCHIVE_DIGEST"
          test "$CURRENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$CURRENT_SHA" = "$BASE_LIVE_SHA"
          test "$CURRENT_LABEL" = "$BASE_LIVE_SHA"
          git -C "$REPO" diff --quiet
          git -C "$REPO" diff --cached --quiet
          test "$(df -PB1 "$REPO" | awk 'NR==2{print $4}')" -ge 8589934592
          verify_runtime "$BASE_LIVE_SHA"

          for _ in $(seq 1 40); do
            active="$(sudo -n systemctl list-units --type=service --state=active --no-legend 'porota-a3-history-rc6@*.service' 2>/dev/null | awk '{print $1}' || true)"
            ce="$(sudo -n systemctl is-active porota-contract-evidence-rc6.service 2>/dev/null || true)"
            if [ -z "$active" ] && [ "$ce" != active ]; then break; fi
            echo "WAIT_BACKGROUND_JOB=${active:-contract-evidence}"
            sleep 15
          done
          test -z "$(sudo -n systemctl list-units --type=service --state=active --no-legend 'porota-a3-history-rc6@*.service' 2>/dev/null | awk '{print $1}' || true)"
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc6.service 2>/dev/null || true)" != active

          git -C "$REPO" fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git -C "$REPO" rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git -C "$REPO" merge-base --is-ancestor "$BASE_LIVE_SHA" "$TARGET_SHA"
          python3 - "$REPO" "$TARGET_SHA" <<'PY'
          import subprocess,sys
          repo,sha=sys.argv[1:]
          untracked=set(subprocess.check_output(['git','-C',repo,'ls-files','--others','--exclude-standard'],text=True).splitlines())
          tracked=set(subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',sha],text=True).splitlines())
          collisions=sorted(untracked & tracked)
          assert not collisions, 'UNTRACKED_TARGET_COLLISION:'+','.join(collisions[:20])
          print(f'UNTRACKED_COLLISION_GATE=GREEN count={len(untracked)}')
          PY

          sudo -n docker tag "$CURRENT_IMAGE_ID" "$ROLLBACK_IMAGE"
          TMP="$(mktemp -d "$HOME/porota-rc6-hotfix.XXXXXX")"
          WT="$TMP/source"
          git -C "$REPO" worktree add --detach "$WT" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label 'porota.version=17.0.0-rc6' -t "$TARGET_IMAGE" "$WT"
          test "$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"
          test "$(df -PB1 "$REPO" | awk 'NR==2{print $4}')" -ge 8589934592

          sudo -n docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0770 \
            --entrypoint python "$TARGET_IMAGE" -m pytest -q -p no:cacheprovider tests/test_rc6_us_underlying_holiday.py

          echo 'HOTFIX_ACTIVATION=START'
          ACTIVATED=1
          git -C "$REPO" checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          git -C "$REPO" branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH" >/dev/null 2>&1 || true
          test -z "$(git -C "$REPO" diff --name-only)"
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation
          verify_runtime "$TARGET_SHA"

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import bu_instrument_catalog as c
          import _version
          at=datetime(2026,9,7,10,15,tzinfo=ZoneInfo('America/Argentina/Buenos_Aires'))
          expected='UNDERLYING_MARKET_CLOSED: US_LABOR_DAY'
          for s in ('AAPL','AAPLD','AAPLC','MSFT','KO','MELI'):
              assert c.rc6_underlying_opening_block(s,'CEDEARS',at)==expected
          assert c.rc6_underlying_opening_block('GGAL','ACCIONES',at)==''
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'
          print('RUNTIME_CEDEAR_HOLIDAY_PROOF=GREEN')
          PY

          for unit in \
            porota-functional-health-rc6.timer \
            porota-history-postclose-rc6.timer \
            porota-host-general-backup-rc6.timer \
            porota-preopen-rc6.timer \
            porota-candle-integrity-rc6.timer \
            porota-a3-history-daily-rc6.timer \
            porota-a3-history-reconcile-rc6.timer \
            porota-a3-history-weekend-rc6.timer \
            porota-contract-evidence-rc6.timer; do
            test "$(sudo -n systemctl is-enabled "$unit")" = enabled
            test "$(sudo -n systemctl is-active "$unit")" = active
            echo "TIMER_GREEN=$unit"
          done
          echo "ROLLBACK_IMAGE_KEPT=$ROLLBACK_IMAGE"
          echo 'HOTFIX_DEPLOY=GREEN'
          HOST

  data-learning-audit:
    name: Read-only ingestion history scraping and learning audit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_audit"
          chmod 600 "$HOME/.ssh/porota_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect SQLite data and learning evidence read-only
        id: data_audit
        continue-on-error: true
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh -i "$HOME/.ssh/porota_audit" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n docker exec porota_production_observer python /app/scripts/rc6_data_learning_readonly_audit.py" \
            | tee /tmp/rc6-data-learning-audit.json

      - name: Collect scheduler and Contract Evidence wiring evidence
        id: scheduler_audit
        continue-on-error: true
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_audit" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST' | tee /tmp/rc6-scheduler-audit.txt
          set -euo pipefail
          echo 'SCHEMA=POROTA_RC6_SCHEDULER_READONLY_AUDIT_V1'
          echo "HOST_SHA=$(git -C /opt/porota-trading rev-parse HEAD)"
          echo "HOST_BRANCH=$(git -C /opt/porota-trading branch --show-current)"
          echo "REAL_ORDERS_SENT=$(sudo -n docker exec porota_production_observer python -c \"import sqlite3; c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); print(c.execute('select real_orders_sent from observer_state where id=1').fetchone()[0])\")"
          for unit in \
            porota-history-postclose-rc6.timer \
            porota-candle-integrity-rc6.timer \
            porota-a3-history-daily-rc6.timer \
            porota-a3-history-reconcile-rc6.timer \
            porota-a3-history-weekend-rc6.timer \
            porota-contract-evidence-rc6.timer; do
            echo "TIMER=$unit|enabled=$(sudo -n systemctl is-enabled "$unit" 2>/dev/null || true)|active=$(sudo -n systemctl is-active "$unit" 2>/dev/null || true)"
            sudo -n systemctl show "$unit" -p LastTriggerUSec -p NextElapseUSecRealtime --no-pager 2>/dev/null | sed "s/^/$unit|/"
          done
          for svc in \
            porota-history-postclose-rc6.service \
            porota-candle-integrity-rc6.service \
            porota-a3-history-rc6@DAILY_INCREMENTAL.service \
            porota-a3-history-rc6@RECONCILE.service \
            porota-a3-history-rc6@WEEKEND_DEEP.service \
            porota-contract-evidence-rc6.service; do
            echo "SERVICE=$svc"
            sudo -n systemctl show "$svc" -p ActiveState -p Result -p ExecMainStatus -p InactiveExitTimestamp --no-pager 2>/dev/null | sed "s/^/$svc|/"
          done
          test -d /usr/local/lib/porota-contract-evidence-rc6
          test -x /usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          echo 'CONTRACT_EVIDENCE_OVERLAY=GREEN_PRESENT'
          journalctl -u porota-contract-evidence-rc6.service -n 80 --no-pager 2>/dev/null \
            | grep -E 'STATUS=|AUTH_BROWSER_STARTED=|REAL_ORDERS_SENT=|GREEN_NOT_DUE|DUE|FAIL|ERROR' \
            | tail -n 30 || true
          echo 'SCHEDULER_AUDIT=COMPLETE'
          HOST

      - name: Show compact data audit summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/rc6-data-learning-audit.json')
          if not p.exists():
              print('DATA_AUDIT_MISSING'); raise SystemExit(0)
          d=json.loads(p.read_text())
          print('DATA_AUDIT_STATUS='+str(d.get('status')))
          print('OBSERVER='+str(d.get('observer',{}).get('state')))
          print('HISTORY='+str(d.get('history',{}).get('state')))
          print('SHADOW='+str(d.get('shadow_learning',{}).get('state')))
          print('LIVE='+json.dumps(d.get('observer',{}).get('live_market',{}),ensure_ascii=False,sort_keys=True))
          print('CANDLES='+json.dumps(d.get('observer',{}).get('candles',{}),ensure_ascii=False,sort_keys=True))
          print('A3='+json.dumps(d.get('observer',{}).get('a3_state',{}),ensure_ascii=False,sort_keys=True))
          print('HISTORY_V2='+json.dumps(d.get('history',{}).get('canonical_v2',{}),ensure_ascii=False,sort_keys=True))
          print('ATTEMPTS='+json.dumps(d.get('history',{}).get('attempts_v2',{}),ensure_ascii=False,sort_keys=True))
          print('PAPER_LEARNING='+json.dumps(d.get('observer',{}).get('paper_learning',{}),ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-data-learning-readonly-audit-${{ github.sha }}
          path: |
            /tmp/rc6-data-learning-audit.json
            /tmp/rc6-scheduler-audit.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce hard read-only audit gates
        if: always()
        shell: bash
        run: |
          test '${{ steps.data_audit.outcome }}' = success
          test '${{ steps.scheduler_audit.outcome }}' = success
