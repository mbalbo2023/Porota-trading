name: RC6 A652 EOD catalog reconciliation READ_ONLY

# Opt-in only; never runs host automatically, on PR, or as a Predeploy/Deploy.
# A live WAL file may write -shm on URI mode=ro: require private RO OS mount.
on:
  workflow_dispatch:
    inputs:
      run_host:
        description: "Execute exactly one READ_ONLY EOD host receipt (after mutex review)"
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc6-a652-catalog-eod-readonly.yml'
      - 'scripts/rc6_a652_catalog_eod_readonly.py'
      - 'tests/test_rc6_a652_catalog_eod_readonly.py'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compile and prove only bounded local SQLite fixture access
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/rc6_a652_catalog_eod_readonly.py tests/test_rc6_a652_catalog_eod_readonly.py
          python3 -m unittest discover -s tests -p test_rc6_a652_catalog_eod_readonly.py -v
          git diff --check

  host_readonly:
    needs: contracts
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_host == true
    # Same global mutex as Deploy V2 and other scheduled host audits.
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate checkout and runner-only SSH identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_a652_eod_ro"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_a652_eod_ro" "$HOME/.ssh/known_hosts"
          mkdir -p evidence
      - name: One-shot private namespace SQLite mode=ro; no PPI or orders
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/rc6_a652_eod_ro" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            'sudo -n timeout 25 unshare --mount --propagation private -- /bin/sh -eu -c "mount --bind /opt/porota-trading/data /opt/porota-trading/data && mount -o remount,bind,ro /opt/porota-trading/data && exec python3 -B - host-probe"' \
            < scripts/rc6_a652_catalog_eod_readonly.py \
            > evidence/.host_raw.json 2>/dev/null
          remote_rc=$?
          set -e
          if [ "$remote_rc" -ne 0 ]; then
            # Never launder a nonzero SSH result into a plausible receipt.
            : > evidence/.host_raw.json
          fi
          set +e
          python3 scripts/rc6_a652_catalog_eod_readonly.py sanitize \
            evidence/.host_raw.json evidence/a652_catalog_eod_readonly.json
          sanitized_rc=$?
          set -e
          rm -f evidence/.host_raw.json
          if [ "$remote_rc" -ne 0 ]; then
            echo 'A652_EOD_HOST_TRANSPORT=NONZERO'
            exit 1
          fi
          if [ "$sanitized_rc" -ne 0 ]; then
            echo 'A652_EOD_RUNTIME_EVIDENCE=NO_VERIFICADO'
            exit 2
          fi
          echo 'A652_EOD_AGGREGATE_ONLY_NOT_PAPER_GO'
      - name: Preserve ONLY sanitized aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a652-catalog-eod-ro-${{ github.run_id }}
          path: evidence/a652_catalog_eod_readonly.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove only the runner temporary identity
        if: always()
        run: |
          rm -f "$HOME/.ssh/rc6_a652_eod_ro"
