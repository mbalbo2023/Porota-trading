name: RC6 one-time history archive preflight
on:
  push:
    branches:
      - audit/rc6-iol-decision-demand-20260921
    paths:
      - .github/workflows/rc6-temp-history-preflight-20260922.yml
permissions:
  contents: read
concurrency:
  group: rc6-history-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Inspect existing exact PPI history without writing
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "PREFLIGHT_ART=$(TZ=America/Argentina/Buenos_Aires date -Is)"
          df -hT /opt
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json,gzip,hashlib,os
          from pathlib import Path
          root=Path(os.getenv('PPI_HISTORY_EVIDENCE_ROOT','/app/data/evidence/ppi_history_exact_v1'))
          db=root/'manifest_exact_v1.db'
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=20); c.row_factory=sqlite3.Row
          c.execute('PRAGMA query_only=ON')
          cols={r[1] for r in c.execute('PRAGMA table_info(exact_attempts_v1)')}
          print('ARCHIVE_TABLE_COLS='+','.join(sorted(cols)))
          counts={}; families={}; dates={}; samples=0; hash_ok=0; hash_bad=0
          sql="SELECT origin,recorded_at,quality,inner_sha256,wrapper_json,body_sha256,body_bytes FROM exact_attempts_v1 WHERE origin='PPI_HISTORY'"
          for r in c.execute(sql):
              try: w=json.loads(r['wrapper_json'])
              except Exception: continue
              fam=str(w.get('asset_class') or '').upper()
              if fam not in ('ACCIONES','CEDEARS'): continue
              counts[fam]=counts.get(fam,0)+1
              sym=str(w.get('symbol') or w.get('ticker') or '').upper()
              if sym: families.setdefault(fam,set()).add(sym)
              d=str(r['recorded_at'] or '')[:10]
              if d: dates[fam]=[min(d,dates.get(fam,[d,d])[0]),max(d,dates.get(fam,[d,d])[1])]
              if samples<4:
                  p=root/'objects'/'sha256'/r['inner_sha256'][:2]/(r['inner_sha256']+'.json.gz')
                  try:
                      raw=gzip.open(p,'rb').read()
                      ok=hashlib.sha256(raw).hexdigest()==r['inner_sha256']
                      hash_ok+=int(ok); hash_bad+=int(not ok)
                      payload=json.loads(raw)
                      if isinstance(payload,str): payload=json.loads(payload)
                      rows=payload if isinstance(payload,list) else payload.get('historicalData',payload.get('data',[])) if isinstance(payload,dict) else []
                      rowdates=[str(x.get('date',''))[:10] for x in rows if isinstance(x,dict) and x.get('date')]
                      print('SAMPLE='+json.dumps({'family':fam,'symbol':sym,'quality':r['quality'],'recorded_at':r['recorded_at'],'wrapper_keys':sorted(w.keys()),'payload_type':type(payload).__name__,'rows':len(rows),'first':min(rowdates) if rowdates else None,'last':max(rowdates) if rowdates else None,'object_hash_ok':ok},sort_keys=True))
                  except Exception as e:
                      hash_bad+=1; print('SAMPLE_ERROR='+type(e).__name__)
                  samples+=1
          print('ARCHIVE_COUNTS='+json.dumps({k:{'attempts':counts[k],'symbols':len(families.get(k,set())),'recorded_range':dates.get(k)} for k in sorted(counts)},sort_keys=True))
          print('SAMPLE_HASHES='+json.dumps({'checked':hash_ok+hash_bad,'ok':hash_ok,'bad':hash_bad},sort_keys=True))
          c.close()
          PY
          echo "MUTATIONS=NONE"
          HOST
