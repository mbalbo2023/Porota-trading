name: RC6 Wave6-8 Convergence 2026-09-09

on:
  push:
    branches: [integration/rc6-wave6-8-convergence-20260909]
    paths:
      - '.github/workflows/rc6-wave6-8-convergence-20260909.yml'

permissions:
  contents: write

jobs:
  converge-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge Wave6 Wave7 Wave8 onto definitive Wave4 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name porota-ci
          git config user.email porota-ci@users.noreply.github.com
          git fetch origin \
            integration/rc6-wave6-history-web-shadow-20260908 \
            integration/rc6-wave7-event-risk-binding-20260908 \
            integration/rc6-wave8-learning-ux-20260908
          git merge --no-edit --no-ff origin/integration/rc6-wave6-history-web-shadow-20260908
          git merge --no-edit --no-ff origin/integration/rc6-wave7-event-risk-binding-20260908
          git merge --no-edit --no-ff origin/integration/rc6-wave8-learning-ux-20260908
          git diff --check HEAD~1 HEAD || true
      - name: Validate combined runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest requests
          python -m py_compile \
            cp_history_ingest_policy_hf6.py cq_history_attempt_ledger_hf6.py \
            cr_data912_reconcile_hf6.py cs_postclose_history_scheduler_hf6.py \
            ct_ppi_history_salvage_hf6.py cu_history_store_v2_hf6.py \
            cv_history_store_adapter_hf6.py cw_data912_history_v2_sink.py \
            dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py \
            fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py \
            es_shadow_binding_contract_rc6.py et_shadow_learning_rc6.py \
            bw_daily_risk.py p_risk_guardian.py ch_empirical_learning.py \
            s_learning_engine.py ec_forward_lab_metrics_hf2.py \
            ei_dashboard_table_accessibility_rc5.py eq_dashboard_table_layout_rc6.py \
            er_dashboard_table_semantics_rc6.py da_dashboard_ux_hf6.py \
            bf_production_paper_observer.py porota_mode_manager.py fb_raw_evidence_exact_v1.py
          PYTHONPATH=. pytest -q \
            test_cp_history_ingest_policy_hf6.py test_hf6_history_data912_v2.py \
            tests/test_history_freshness_metrics_rc5.py tests/test_history_close_only_hf2.py \
            tests/test_shadow_binding_contract_rc6.py tests/test_shadow_learning_rc6.py \
            tests/test_daily_risk_outbox_v17.py tests/test_forward_lab_metrics_hf2.py \
            tests/test_dashboard_global_a11y_rc5.py tests/test_dashboard_table_layout_rc6.py \
            tests/test_fb_raw_evidence_exact_v1.py
          ! git diff 0f2ce3c697cbfb462ff3e21d4f94d085886461ce HEAD -- '*.py' | grep -Ei 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order'
          grep -q 'EXTERNAL_EXACT_V1' porota_mode_manager.py
          echo WAVE6_8_CONVERGENCE=GREEN
          echo PRODUCTION_MODE=PRODUCTION_PAPER_ONLY
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo ORDER_ROUTES=NOT_CALLED
      - name: Push converged candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:integration/rc6-wave6-8-convergence-20260909
