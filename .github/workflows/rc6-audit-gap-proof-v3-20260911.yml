name: RC6 Audit Gap Proof V3 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-audit-gap-proof-v3-20260911.yml]

permissions:
  contents: read

jobs:
  wave_ancestry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove early-wave ancestry against deployed candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=e47eeffcb94a9468ac7e7f610beee0869353a77e
          git cat-file -e "$TARGET^{commit}"
          echo "TARGET=$TARGET"
          for item in \
            W01A:origin/integration/rc6-wave1-safety-observability-20260908 \
            W01B:origin/integration/rc6-wave1b-sla-scraping-20260908 \
            W02:origin/integration/rc6-wave2-ppi130-runtime-20260908 \
            W03:origin/integration/rc6-wave3-browser-v3-20260908 \
            W04:origin/integration/rc6-wave4-disk-phase-a-20260908 \
            W05:origin/integration/rc6-wave5-contract-evidence-dashboard-20260908 \
            W06:origin/integration/rc6-wave6-history-web-shadow-20260908 \
            W07:origin/integration/rc6-wave7-event-risk-binding-20260908 \
            W08:origin/integration/rc6-wave8-learning-ux-20260908; do
            k=${item%%:*}; ref=${item#*:}; sha=$(git rev-parse "$ref")
            if git merge-base --is-ancestor "$sha" "$TARGET"; then a=YES; else a=NO; fi
            echo "$k|TIP=$sha|ANCESTOR_OF_DEPLOYED=$a"
          done
          echo 'EARLY_WAVE_ANCESTRY_COMPLETE=YES'

  runtime_gap_proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Audit authenticated dashboard and data freshness read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          TARGET=e47eeffcb94a9468ac7e7f610beee0869353a77e
          test "$(git -C /opt/porota-trading rev-parse HEAD)" = "$TARGET"
          echo 'MUTATIONS=NONE'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os,re
          obs='/app/data/paper_v17/observer_v17.db'; hist='/app/data/market_history.db'
          c=sqlite3.connect(f'file:{obs}?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          mode,orders=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'SAFETY={mode}|{orders}')
          for t in ['contract_evidence','contract_evidence_runs','contract_evidence_v2_current','contract_evidence_v2_runs','contract_evidence_v2_snapshots','financial_news','paper_daily_risk','paper_risk_capital','paper_events','a3_history_ingest_state_rc6','history_attempt_ledger_v2','production_history','production_history_attempts']:
              try:
                  cols=[r[1] for r in c.execute(f'pragma table_info("{t}")')]
                  n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
                  print(f'TABLE={t}|ROWS={n}|COLS={";".join(cols[:40])}')
                  for col in ['observed_at','fetched_at','created_at','updated_at','generated_at','started_at','finished_at','timestamp','date','as_of','run_at']:
                      if col in cols:
                          try: v=c.execute(f'select max("{col}") from "{t}"').fetchone()[0]
                          except Exception: v='ERR'
                          print(f'LATEST={t}.{col}|{v}')
              except Exception as e: print(f'TABLE={t}|ERROR={type(e).__name__}:{e}')
          # Identify any explicit event/GDELT persistence surface.
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          print('EXPLICIT_EVENT_GDELT_TABLES='+';'.join(t for t in tables if re.search(r'(gdelt|event.?risk|news|sentiment|geopolit)',t,re.I)))
          c.close()
          h=sqlite3.connect(f'file:{hist}?mode=ro',uri=True,timeout=10); h.execute('pragma query_only=on')
          for t in ['history_canonical_v2','history_versions_v2','market_historical_ohlcv','ingest_runs']:
              try:
                  cols=[r[1] for r in h.execute(f'pragma table_info("{t}")')]; n=h.execute(f'select count(*) from "{t}"').fetchone()[0]
                  latest='NA'; col=next((x for x in ['date','timestamp','created_at','started_at','finished_at'] if x in cols),None)
                  if col: latest=h.execute(f'select max("{col}") from "{t}"').fetchone()[0]
                  print(f'HISTORY_TABLE={t}|ROWS={n}|LATEST={latest}|LATEST_COL={col or "NONE"}')
              except Exception as e: print(f'HISTORY_TABLE={t}|ERROR={type(e).__name__}:{e}')
          h.close()
          PY

          echo '--- RELEVANT ACTIVE UNITS ---'
          sudo -n systemctl list-unit-files --type=timer --type=service --no-pager --no-legend | grep -Ei 'porota.*(gdelt|event|news|sentiment|risk|contract|evidence|histor|candle)' || true
          echo '--- CE RECENT EXECUTIONS ---'
          echo "CE_SERVICE_RESULT=$(sudo -n systemctl show porota-contract-evidence-rc6.service -p Result --value)"
          echo "CE_SERVICE_LAST_END=$(sudo -n systemctl show porota-contract-evidence-rc6.service -p InactiveEnterTimestamp --value)"
          echo "CE_TIMER_LAST=$(sudo -n systemctl show porota-contract-evidence-rc6.timer -p LastTriggerUSec --value)"
          python3 - <<'PY'
          from pathlib import Path
          import datetime
          p=Path('/opt/porota-trading/data/contract_evidence/rc6_trusted')
          fs=sorted(p.glob('contract_*.json'),key=lambda x:x.stat().st_mtime,reverse=True)
          print('CE_CAPTURE_COUNT='+str(len(fs)))
          if fs:
              x=fs[0]; print('CE_LATEST_CAPTURE='+x.name); print('CE_LATEST_MTIME_UTC='+datetime.datetime.fromtimestamp(x.stat().st_mtime,datetime.timezone.utc).isoformat())
          PY

          echo '--- AUTHENTICATED DASHBOARD SIGNALS ---'
          TOKEN="$(sudo -n docker exec porota_production_dashboard sh -lc 'printf %s "$DASHBOARD_ACCESS_TOKEN"')"
          test -n "$TOKEN"
          for path in /historicos /instrumentos /riesgo '/sistema?section=scraping'; do
            echo "PAGE=$path"
            curl -fsS --max-time 10 -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8000$path" | python3 -c 'import sys,re,html; s=sys.stdin.read(); s=re.sub(r"<script.*?</script>|<style.*?</style>"," ",s,flags=re.S|re.I); s=re.sub(r"<[^>]+>","\n",s); s=html.unescape(s); rx=re.compile(r"(cobertura|hist[oó]ric|ingesta|cat[aá]logo|universo|contract|evidence|scrap|ready_paper|hold|riesgo|risk|gdelt|sentiment|geopolit|amarillo|verde|stale|missing|records=|sector|binding|daily|drawdown|exposure|event)",re.I); out=[]; [out.append(" ".join(x.split())) for x in s.splitlines() if x.strip() and rx.search(" ".join(x.split()))]; print("\n".join(out[:180]))'
          done

          echo '--- GDELT LIVE WIRING CHECK ---'
          echo "GDELT_FILES=$(sudo -n docker exec porota_production_observer sh -lc "find /app -maxdepth 2 -type f -iname '*gdelt*' | wc -l" | tr -d ' ')"
          echo "GDELT_TIMERS=$(sudo -n systemctl list-unit-files --type=timer --no-legend | grep -ci gdelt || true)"
          echo "EVENT_RISK_TIMERS=$(sudo -n systemctl list-unit-files --type=timer --no-legend | grep -Eci '(event.?risk|news|sentiment)' || true)"
          FINAL="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on'); print('|'.join(map(str,c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()))); c.close()
          PY
          )"
          echo "FINAL_SAFETY=$FINAL"; test "$FINAL" = 'PRODUCTION_PAPER|0'
          echo 'RUNTIME_GAP_PROOF_COMPLETE=YES'
          HOST
