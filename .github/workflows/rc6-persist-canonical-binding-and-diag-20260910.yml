name: RC6 Persist Canonical BINDING and Diagnose 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - porota_mode_manager.py
      - be_paper_engine.py
      - POROTA_SECTOR_MAP_V1.csv
      - .github/workflows/rc6-persist-canonical-binding-and-diag-20260910.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-and-diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable RC6 PAPER safety identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py

      - name: Persist canonical RC6 binding source
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('porota_mode_manager.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('# HF6: el freno blando deja de abrir; el límite duro recién entonces',
               '# RC6: el freno blando deja de abrir; el límite duro recién entonces'),
              ('"PAPER_ECONOMIC_GATE_MODE": "SHADOW",',
               '"PAPER_ECONOMIC_GATE_MODE": "BINDING",'),
              ('# ninguna de las ocho identidades HF5; catálogo, libro y portones siguen',
               '# conserva las identidades de foco validadas; catálogo, libro y portones siguen'),
              ('HF3_FROZEN_PAPER_SETTINGS = {', 'RC6_FROZEN_PAPER_SETTINGS = {'),
              ('# .env viejo porque volvería a abrir con economía negativa o riesgo HF2.',
               '# .env viejo porque volvería a abrir con economía negativa o riesgo obsoleto.'),
              ('values.update(HF3_FROZEN_PAPER_SETTINGS)',
               'values.update(RC6_FROZEN_PAPER_SETTINGS)'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          if 'HF3_FROZEN_PAPER_SETTINGS' in s:
              raise SystemExit('ACTIVE_HF3_CONFIG_NAME_REMAINS')
          if s.count('"PAPER_ECONOMIC_GATE_MODE": "BINDING",') < 2:
              raise SystemExit('CANONICAL_BINDING_NOT_APPLIED_TWICE')
          p.write_text(s, encoding='utf-8')

          p = Path('be_paper_engine.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('economics_mode="SHADOW", min_net_reward_risk="1.20",',
                        'economics_mode="BINDING", min_net_reward_risk="1.20",')
          s = s.replace('self.economics_mode = str(economics_mode or "SHADOW").upper()',
                        'self.economics_mode = str(economics_mode or "BINDING").upper()')
          if 'economics_mode="SHADOW", min_net_reward_risk="1.20",' in s:
              raise SystemExit('PAPERBROKER_SHADOW_DEFAULT_REMAINS')
          if 'economics_mode or "SHADOW"' in s:
              raise SystemExit('PAPERBROKER_SHADOW_FALLBACK_REMAINS')
          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from porota_mode_manager import paper_settings
          cfg = paper_settings({})
          assert cfg['PAPER_ECONOMIC_GATE_MODE'] == 'BINDING', cfg
          print('RC6_CANONICAL_ECONOMIC_BINDING=GREEN')
          PY

          if ! git diff --quiet -- porota_mode_manager.py be_paper_engine.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add porota_mode_manager.py be_paper_engine.py
            git commit -m 'fix(rc6): persist canonical economic binding configuration'
            git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
          else
            echo 'CANONICAL_BINDING_ALREADY_PERSISTED=YES'
          fi

      - name: Install integrated dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Diagnose sequential GGAL and AAPL openings
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python - <<'PY'
          import tempfile
          from pathlib import Path
          from be_paper_engine import D, PaperBroker, PaperStore, Quote
          from bq_exit_policy import PaperSessionPolicy
          from porota_mode_manager import paper_settings

          AT='2026-09-01T11:00:00-03:00'
          def quote(family='ACCIONES', symbol='GGAL'):
              p=D('100')
              return Quote(symbol, family, 'A-24HS', p, p-D('0.1'), p+D('0.1'),
                           D('1000'), D('1000'), AT, currency='ARS', market='BYMA',
                           metadata_source='RC6_DIAG', book_at=AT, trade_at=AT,
                           last_kind='TRADE')
          cfg=paper_settings({})
          with tempfile.TemporaryDirectory() as td:
              broker=PaperBroker(
                  PaperStore(str(Path(td)/'composition.db')),
                  session_policy=PaperSessionPolicy(), clock_fn=lambda: AT,
                  economics_mode=cfg['PAPER_ECONOMIC_GATE_MODE'],
                  min_net_reward_risk=cfg['PAPER_MIN_NET_REWARD_RISK'],
                  stop_loss_pct=cfg['PAPER_STOP_LOSS_PCT'],
                  target_gain_pct=cfg['PAPER_TARGET_GAIN_PCT'],
                  intraday_fee_rebate=cfg['PAPER_INTRADAY_FEE_REBATE'])
              print('BROKER_ECONOMICS_MODE='+broker.economics_mode)
              print('OPEN_GGAL='+repr(broker._open(quote('ACCIONES','GGAL'),D('.9'),{})))
              print('OPEN_AAPL='+repr(broker._open(quote('CEDEARS','AAPL'),D('.9'),{})))
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          PY

      - name: Run causal and integrated first-failure tests
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. python scripts/rc6_w10_sector_map_preflight.py
          PYTHONPATH=. pytest -q tests/test_caucion_ledger_v17.py::test_caucion_rota_no_detiene_supervision_ni_salidas_spot
          PYTHONPATH=. pytest -q tests/test_hotfix_rc3_hf4.py::test_configuracion_desplegada_no_es_un_noop
          PYTHONPATH=. pytest -x -q

      - name: Prove safety invariants
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo REAL_ORDER_ROUTES=NOT_CALLED
          echo REAL_ORDER_TEST=NOT_PERFORMED
