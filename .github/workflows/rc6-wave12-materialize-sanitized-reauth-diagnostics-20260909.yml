name: RC6 Wave12 Materialize Sanitized Reauth Diagnostics 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave12-currentbase-20260909]
    paths: [.github/workflows/rc6-wave12-materialize-sanitized-reauth-diagnostics-20260909.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add sanitized reauth diagnostics only
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/porota_contract_evidence_rc6_runtime.sh')
          s=p.read_text(encoding='utf-8')
          old='''  REAUTH_STATE="$(REAUTH_OUT="$REAUTH_OUT" python3 - <<'PY2'\nimport json,os\ntry: print(json.loads(os.environ.get('REAUTH_OUT','{}')).get('status','UNKNOWN'))\nexcept Exception: print('INVALID_REAUTH_OUTPUT')\nPY2\n)"\n'''
          if old not in s:
              # The canonical script uses PY as the heredoc marker; normalize exact block.
              old='''  REAUTH_STATE="$(REAUTH_OUT="$REAUTH_OUT" python3 - <<'PY'\nimport json,os\ntry: print(json.loads(os.environ.get('REAUTH_OUT','{}')).get('status','UNKNOWN'))\nexcept Exception: print('INVALID_REAUTH_OUTPUT')\nPY\n)"\n'''
          assert old in s, 'reauth state block not found'
          new=old+'''  read -r REAUTH_STAGE REAUTH_PAGE REAUTH_BLOCKED < <(REAUTH_OUT="$REAUTH_OUT" python3 - <<'PY'\nimport json,os\ntry:\n d=json.loads(os.environ.get('REAUTH_OUT','{}'))\n vals=[str(d.get('stage') or 'NONE'),str(d.get('page_url') or 'NONE'),str(d.get('blocked_post_path') or 'NONE')]\n print(*[v.replace('\\n',' ')[:240] for v in vals])\nexcept Exception:\n print('INVALID_REAUTH_OUTPUT NONE NONE')\nPY\n)\n  printf 'REAUTH_DIAG_STAGE=%s\\nREAUTH_DIAG_PAGE=%s\\nREAUTH_DIAG_BLOCKED=%s\\n' "$REAUTH_STAGE" "$REAUTH_PAGE" "$REAUTH_BLOCKED"\n'''
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          bash -n scripts/porota_contract_evidence_rc6_runtime.sh
          ! grep -En 'printf.*REAUTH_OUT|echo.*REAUTH_OUT|cat.*REAUTH_OUT' scripts/porota_contract_evidence_rc6_runtime.sh
          grep -q 'REAUTH_DIAG_STAGE' scripts/porota_contract_evidence_rc6_runtime.sh
          echo 'SANITIZED_REAUTH_DIAGNOSTICS=GREEN'
      - name: Commit patch
        run: |
          set -Eeuo pipefail
          git config user.name porota-rc6-ci
          git config user.email porota-rc6-ci@users.noreply.github.com
          git add scripts/porota_contract_evidence_rc6_runtime.sh
          git commit -m 'diag(rc6 wave12): expose sanitized reauth stage only'
          git push origin HEAD:deploy-prep/rc6-wave12-currentbase-20260909
