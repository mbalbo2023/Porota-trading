name: RC6 ingestion live lock probe 2026-09-12
on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ingestion-live-lock-probe-20260912.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"; printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only lock and process probe
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -u
          echo "AT=$(date -u +%FT%TZ)"
          echo "HOST_SHA=$(git -C /opt/porota-trading rev-parse HEAD)"
          echo '=== SERVICES ==='
          for u in porota-ppi-argentina-nightly-rc6.service porota-ppi-argentina-nightly-continue-rc6.service porota-ppi-argentina-nightly-chain-rc6.service porota-contract-evidence-weekend-backfill-rc6.service; do systemctl show "$u" -p Id -p ActiveState -p SubState -p Result --no-pager 2>/dev/null || true; done
          echo '=== LOCKS ==='
          sudo -n lslocks 2>/dev/null | grep -E 'porota|ppi-fullfamily|trading-history' || true
          echo '=== PROCESSES ==='
          ps -eo pid,ppid,etimes,user,args | grep -E 'porota-ingest-repair|ppi-argentina|docker exec.*porota_production_observer.*python|flock.*ppi-fullfamily' | grep -v grep || true
          echo 'HOST_MUTATION=NONE'
          HOST
