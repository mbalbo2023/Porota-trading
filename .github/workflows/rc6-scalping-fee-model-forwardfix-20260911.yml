name: RC6 Scalping Fee Model Forward Fix 2026-09-11
on:
  push:
    branches: [test/rc6-scalping-active-paper-eod-20260911]
    paths:
      - '.github/workflows/rc6-scalping-fee-model-forwardfix-20260911.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rc6-scalping-active-paper-eod-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply minimal fee-model wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cf_intraday_scalping.py')
          s=p.read_text()
          old='''            import au_fee_schedule\n            one_leg = Decimal(str(au_fee_schedule.costo_por_tramo(family_name(record["instrument_type"]))))\n            modeled_roundtrip = one_leg * 2 + spread + Decimal("0.0004")\n            required_move = modeled_roundtrip + Decimal(os.getenv("PAPER_SCALPING_MIN_NET_MARGIN", "0.005"))\n'''
          new='''            from fh_scalping_economics_rc6 import modeled_roundtrip_cost\n            fee_model = modeled_roundtrip_cost(family_name(record["instrument_type"]), spread)\n            modeled_roundtrip = fee_model["modeled_roundtrip_fraction"]\n            required_move = modeled_roundtrip + Decimal(os.getenv("PAPER_SCALPING_MIN_NET_MARGIN", "0.005"))\n'''
          if old not in s:
              raise SystemExit('EXPECTED_COST_SNIPPET_NOT_FOUND')
          s=s.replace(old,new,1)
          old2='''                "modeled_roundtrip_fraction": str(modeled_roundtrip),\n                "required_move_fraction": str(required_move),\n'''
          new2='''                "modeled_roundtrip_fraction": str(modeled_roundtrip),\n                "fee_model": fee_model["fee_model"],\n                "full_leg_fee_fraction": str(fee_model["full_leg_fee_fraction"]),\n                "discounted_leg_fee_fraction": str(fee_model["discounted_leg_fee_fraction"]),\n                "slippage_buffer_fraction": str(fee_model["slippage_buffer_fraction"]),\n                "required_move_fraction": str(required_move),\n'''
          if old2 not in s:
              raise SystemExit('EXPECTED_ECONOMICS_SNIPPET_NOT_FOUND')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Install focused dependencies
        run: python -m pip install -q pytest fastapi requests
      - name: Compile
        run: python -m py_compile cf_intraday_scalping.py fh_scalping_economics_rc6.py
      - name: Fee-model proof
        run: python -m pytest -q tests/test_rc6_scalping_intraday_fee_bonus.py
      - name: Scalping and contract regressions
        run: python -m pytest -q tests/test_rc6_scalping_active_paper_learning.py tests/test_intraday_scalping_rc6_integration.py tests/test_intraday_contract_policy_rc6.py
      - name: Runtime safety regression
        run: python -m pytest -q tests/test_rc6_runtime_safety.py
      - name: Assert PAPER-only invariants
        run: |
          python - <<'PY'
          import _version
          assert _version.MODE=='PRODUCTION_PAPER'
          assert _version.EXECUTION=='SIMULATED'
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'
          src=open('cf_intraday_scalping.py').read()
          assert 'modeled_roundtrip_cost' in src
          assert 'OPENED_SIMULATED' in src
          assert 'send_order' not in src.lower()
          print('SCALPING_FEE_FORWARD_FIX=GREEN')
          PY
      - name: Commit validated source delta
        env:
          BRANCH: test/rc6-scalping-active-paper-eod-20260911
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cf_intraday_scalping.py
          git diff --cached --check
          git commit -m 'fix(rc6): apply PPI intraday bonus to scalping economics'
          git push origin HEAD:"$BRANCH"
