name: RC6 Wave1B SLA Scraping Validate 2026-09-08

on:
  push:
    branches: [integration/rc6-wave1b-sla-scraping-20260908]
    paths:
      - 'rc6_data_sla_policy.py'
      - 'rc6_dom_coverage_reconciler.py'
      - 'rc6_scraping_semaphore.py'
      - 'tests/test_rc6_wave1b_sla_scraping.py'
      - '.github/workflows/rc6-wave1b-sla-scraping-validate-20260908.yml'

permissions:
  contents: read

concurrency:
  group: rc6-wave1b-sla-scraping-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baseline ancestry and diff gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=b927ddacd062db0a2400c82dc69c9049a9b18d5c
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
      - name: Compile pure modules
        run: |
          python -m py_compile rc6_data_sla_policy.py rc6_dom_coverage_reconciler.py rc6_scraping_semaphore.py
      - name: Focused tests
        run: |
          python -m pip install -q pytest
          pytest -q tests/test_rc6_wave1b_sla_scraping.py
      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eri 'budget_order|confirm_order|cancel_order|masscancel|send_order|place_order' rc6_data_sla_policy.py rc6_dom_coverage_reconciler.py rc6_scraping_semaphore.py
          ! grep -Eri 'requests\.|urllib|ppi_client|docker|sqlite3\.connect' rc6_data_sla_policy.py rc6_dom_coverage_reconciler.py rc6_scraping_semaphore.py
          echo 'WAVE1B_PURE_BACKEND=GREEN'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ROLLBACK_AUTOMATICO=NO'
