name: RC6 Wave5 Live Wiring Audit 2026-09-09
on:
  push:
    branches: [audit/rc6-wave5-live-wiring-20260909]
    paths:
      - '.github/workflows/rc6-wave5-live-wiring-audit-20260909.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_wave5_audit"
          chmod 600 "$HOME/.ssh/porota_wave5_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify Wave5 live wiring read only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_wave5_audit" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/porota-trading
          echo "HEAD=$(git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          c.close()
          print(f'DB={q}|{mode}|{real}')
          print('CONTRACT_EVIDENCE_TABLE_PRESENT='+str('contract_evidence' in tables))
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import cl_contract_evidence_dashboard_hf6 as ce
          import bh_universe_dashboard_hf6 as u
          html=u._page()
          assert 'Evidencia contractual' in html
          assert 'quién debe resolver cada bloqueo' in html
          print('WAVE5_CONTRACT_EVIDENCE_DASHBOARD_WIRING=GREEN')
          print('WAVE5_PAGE_RENDER=GREEN')
          PY
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'WAVE5_LIVE_WIRING_AUDIT=GREEN'
          REMOTE
