name: RC6 733 visual candidate offhost audit

on:
  push:
    branches:
      - diagnostic/rc6-733-visual-candidate-20261024
    paths:
      - .github/workflows/rc6-733-visual-candidate-offhost-20261024.yml
      - scripts/rc6_733_visual_candidate_offhost.py

permissions:
  contents: read

concurrency:
  group: rc6-733-visual-offhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-browser:
    name: 52 canonical routes and first-page dialogs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Prove candidate tree and diagnostic-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE=4bba1335cc1875c6feb6d8a75aea141c31b83653
          test "$(git rev-parse "$CANDIDATE^{tree}")" = bbdf7f979e7b7092e0705f8037b3cb65f4865546
          git diff --name-only "$CANDIDATE" HEAD | sort > /tmp/rc6-visual-delta.txt
          cat > /tmp/rc6-visual-expected.txt <<'EOF'
          .github/workflows/rc6-733-visual-candidate-offhost-20261024.yml
          scripts/rc6_733_visual_candidate_offhost.py
          EOF
          diff -u /tmp/rc6-visual-expected.txt /tmp/rc6-visual-delta.txt
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          echo "RC6_VISUAL_CANDIDATE_SHA=$CANDIDATE"
          echo "RC6_VISUAL_CANDIDATE_TREE=$(git rev-parse "$CANDIDATE^{tree}")"
          echo 'DROPLET_TOUCHED=NO'
      - name: Install source lock and browser driver on runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements.lock.txt
          python3 -m pip install --disable-pip-version-check 'playwright==1.55.0'
          command -v google-chrome
          python3 -m py_compile scripts/rc6_733_visual_candidate_offhost.py
      - name: Navigate exact source with synthetic data and inspect every first-page dialog
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          timeout 1020 python3 scripts/rc6_733_visual_candidate_offhost.py \
            --output /tmp/rc6-733-visual \
            --candidate-sha 4bba1335cc1875c6feb6d8a75aea141c31b83653 \
            --candidate-tree-sha bbdf7f979e7b7092e0705f8037b3cb65f4865546
          python3 - <<'PY'
          from pathlib import Path
          import json
          result=json.loads(Path('/tmp/rc6-733-visual/visual-receipt.json').read_text())
          assert result['status']=='GREEN' and result['route_viewport_checks']==104
          assert result['candidate_sha']=='4bba1335cc1875c6feb6d8a75aea141c31b83653'
          assert result['candidate_tree_sha']=='bbdf7f979e7b7092e0705f8037b3cb65f4865546'
          assert len(result['screenshots'])==104
          assert result['first_page_rows']==result['first_page_dialogs_opened']
          print('RC6_733_VISUAL_OFFHOST=GREEN|ROUTES=52|VIEWPORT_CHECKS=104|DIALOGS=' +
                str(result['first_page_dialogs_opened']))
          print('DROPLET_TOUCHED=NO')
          PY
      - name: Preserve synthetic visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-733-visual-synthetic-${{ github.sha }}
          path: /tmp/rc6-733-visual/
          if-no-files-found: warn
          retention-days: 7
