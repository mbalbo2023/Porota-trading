name: WS Runtime SQLite Focused CI 2026-09-30
on:
  push:
    branches: [fix/ws-runtime-sqlite-contention-20260930]
    paths:
      - be_paper_engine.py
      - tests/test_production_paper_v1634.py
      - .github/workflows/ws-runtime-sqlite-focused-ci-20260930.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile
        run: python -m py_compile be_paper_engine.py tests/test_production_paper_v1634.py
      - name: SQLite contention regressions
        run: |
          python -m pytest -q tests/test_production_paper_v1634.py \
            -k 'paper_store_connect_no_reissues_wal_write_pragma or paper_store_connect_fails_closed_when_database_is_not_wal'
