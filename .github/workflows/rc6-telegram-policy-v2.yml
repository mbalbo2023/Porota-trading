name: RC6 Telegram weekend severity v2

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths: ['.github/workflows/rc6-telegram-policy-v2.yml']

permissions:
  contents: write

jobs:
  prove-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python scripts/rc6_wire_telegram_policy.py
      - run: python -m py_compile eu_telegram_policy_rc6.py bn_telegram_bus.py
      - name: Focused tests
        run: pytest -q tests/test_telegram_policy_rc6.py tests/test_telegram_outbox_policy_rc6.py
      - name: Prove critical cannot be suppressed
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import eu_telegram_policy_rc6 as p
          sat=datetime(2026,9,5,12,tzinfo=ZoneInfo('America/Argentina/Buenos_Aires'))
          critical=p.decide(kind='ANY',priority=0,at=sat,business_day=False)
          routine=p.decide(kind='CLOSING_SUMMARY',priority=30,at=sat,business_day=False)
          assert critical.allow and critical.critical_unsuppressible
          assert not routine.allow and routine.terminal_state=='SUPPRESSED_WEEKEND'
          print('RC6_TELEGRAM_POLICY=GREEN')
          PY
      - name: Commit outbox wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bn_telegram_bus.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bn_telegram_bus.py
          git commit -m 'RC6: centralize weekend Telegram suppression with critical bypass [skip ci]'
          git pull --rebase origin candidate/v17.0.0-rc6-weekend-20260905
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
