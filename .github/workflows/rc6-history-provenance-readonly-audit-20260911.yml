name: RC6 History Provenance Readonly Audit 2026-09-11

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-history-provenance-readonly-audit-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-history-provenance-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Audit canonical history provenance read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          export TZ=America/Argentina/Buenos_Aires
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          echo "ART_NOW=$(date --iso-8601=seconds)"
          echo "HOST_SHA=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          echo "HOST_SHA_POLICY=OBSERVE_ONLY_NO_PIN_ASSERTION"
          HEALTH="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          echo "HEALTH=$HEALTH"
          printf '%s' "$HEALTH" | grep -q '17.0.0-rc6'

          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3,json
          obs='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+obs+'?mode=ro',uri=True,timeout=10); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          print('SAFETY='+json.dumps({'quick_check':q,'mode':r[0],'session':r[1],'real_orders_sent':r[2]},sort_keys=True))
          assert q=='ok' and r[0]=='PRODUCTION_PAPER' and int(r[2] or 0)==0
          tabs={x[0] for x in c.execute("select name from sqlite_master where type='table'")}
          for t in sorted(tabs):
              if any(k in t.lower() for k in ('history','attempt','a3','iol','ppi')):
                  cols=[x[1] for x in c.execute(f'pragma table_info("{t}")')]
                  n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
                  print('OBSERVER_TABLE='+json.dumps({'table':t,'count':n,'cols':cols},sort_keys=True))
                  if n and len(cols)<=35:
                      order=next((x for x in ('attempted_at','started_at','updated_at','last_attempt_at','last_success_at','created_at','observed_at','id') if x in cols),None)
                      sql=f'select * from "{t}"'+(f' order by "{order}" desc' if order else '')+' limit 12'
                      for row in c.execute(sql):
                          print('OBSERVER_ROW='+json.dumps({'table':t,'row':{k:(str(row[k])[:260] if row[k] is not None else None) for k in row.keys()}},sort_keys=True,ensure_ascii=False))
          c.close()
          PY

          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3,json
          p='/app/data/market_history.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True,timeout=20); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          qc=c.execute('pragma quick_check').fetchone()[0]
          print('HISTORY_QUICK_CHECK='+str(qc)); assert qc=='ok'
          tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          print('HISTORY_TABLES='+json.dumps(sorted(tabs)))
          for t in ('history_canonical_v2','history_versions_v2'):
              if t not in tabs: continue
              cols=[r[1] for r in c.execute(f'pragma table_info("{t}")')]
              n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
              print('HISTORY_SCHEMA='+json.dumps({'table':t,'cols':cols},sort_keys=True))
              print('HISTORY_COUNT='+json.dumps({'table':t,'count':n},sort_keys=True))
              src_cols=[x for x in cols if any(k in x.lower() for k in ('source','provider','origin','vendor','feed'))]
              print('SOURCE_COLUMNS='+json.dumps({'table':t,'cols':src_cols},sort_keys=True))
              datecol=next((x for x in ('date','trading_date','bar_date','as_of') if x in cols),None)
              for sc in src_cols:
                  sel=f'"{sc}",count(*) n'+(f',min("{datecol}") first,max("{datecol}") last' if datecol else '')
                  for row in c.execute(f'select {sel} from "{t}" group by "{sc}" order by n desc'):
                      d={'table':t,'column':sc,'value':row[0],'rows':row[1]}
                      if datecol: d.update(first=row[2],last=row[3])
                      print('SOURCE_GROUP='+json.dumps(d,sort_keys=True,default=str))
              if t=='history_canonical_v2' and {'instrument_type','symbol'}.issubset(cols):
                  dq=(f',min("{datecol}") first,max("{datecol}") last' if datecol else '')
                  for row in c.execute(f'select instrument_type,count(*) rows,count(distinct symbol) symbols{dq} from history_canonical_v2 group by instrument_type order by instrument_type'):
                      print('FAMILY='+json.dumps(dict(row),sort_keys=True,default=str))
              if t=='history_versions_v2' and n:
                  order=next((x for x in ('version_id','observed_at','created_at','id') if x in cols),None)
                  if order:
                      for row in c.execute(f'select * from history_versions_v2 order by "{order}" desc limit 15'):
                          d={k:(str(row[k])[:220] if row[k] is not None else None) for k in row.keys()}
                          print('VERSION_SAMPLE='+json.dumps(d,sort_keys=True,ensure_ascii=False))
          for t in sorted(tabs):
              if any(k in t.lower() for k in ('attempt','a3','iol','ppi')):
                  cols=[r[1] for r in c.execute(f'pragma table_info("{t}")')]
                  n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
                  print('AUX_TABLE='+json.dumps({'table':t,'count':n,'cols':cols},sort_keys=True))
                  if n:
                      order=next((x for x in ('attempted_at','started_at','updated_at','last_attempt_at','last_success_at','created_at','observed_at','id') if x in cols),None)
                      sql=f'select * from "{t}"'+(f' order by "{order}" desc' if order else '')+' limit 15'
                      for row in c.execute(sql):
                          print('AUX_ROW='+json.dumps({'table':t,'row':{k:(str(row[k])[:260] if row[k] is not None else None) for k in row.keys()}},sort_keys=True,ensure_ascii=False))
          c.close()
          PY

          echo '=== LATEST HISTORY SERVICES ==='
          for s in porota-history-postclose-rc6.service porota-a3-history-rc6@DAILY_INCREMENTAL.service porota-a3-history-rc6@RECONCILE.service porota-a3-history-rc6@WEEKEND_DEEP.service; do
            echo "---$s---"
            sudo -n systemctl show "$s" -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager 2>/dev/null || true
            sudo -n journalctl -u "$s" -n 90 --no-pager -l 2>/dev/null | grep -E 'STATUS=|source|provider|canonical|versions|appended|NOT_DUE|IOL|PPI|A3|complete|failed|selected|mapped' | tail -n 45 || true
          done

          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('FINAL_SAFETY='+str(r))
          assert r and r[0]=='PRODUCTION_PAPER' and int(r[1] or 0)==0
          print('MUTATIONS=NONE')
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          PY
          HOST
