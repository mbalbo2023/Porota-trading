name: RC6 Phase B2.2 Double Parse Overlap Audit 2026-09-08

on:
  push:
    branches: [audit/rc6-phase-b22-double-parse-overlap-20260908]
    paths:
      - '.github/workflows/rc6-phase-b22-double-parse-overlap-audit-20260908.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_phase_b22"
          chmod 600 "$HOME/.ssh/porota_phase_b22"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Phase B2.2 read-only double-parse overlap analysis
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_phase_b22" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/porota-trading
          echo '=== POROTA RC6 PHASE B2.2 DOUBLE-PARSE OVERLAP AUDIT — READ ONLY ==='
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HEAD=$(git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3, json, hashlib, collections, statistics

          DB='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+DB+'?mode=ro', uri=True)
          c.execute('pragma query_only=on')
          c.execute('pragma temp_store=memory')
          print('QUICK_CHECK='+str(c.execute('pragma quick_check').fetchone()[0]))
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'MODE={mode}')
          print(f'REAL_ORDERS_SENT={real}')
          assert mode=='PRODUCTION_PAPER' and int(real)==0

          def walk_lists(x,path='$'):
              out=[]
              if isinstance(x,list):
                  if x and all(isinstance(v,dict) for v in x): out.append((path,x))
                  for v in x[:3]: out.extend(walk_lists(v,path+'[]'))
              elif isinstance(x,dict):
                  for k,v in x.items(): out.extend(walk_lists(v,path+'.'+str(k)))
              return out

          def canon_hash(obj):
              b=json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False,default=str).encode('utf-8','surrogatepass')
              return hashlib.sha256(b).hexdigest(),len(b)

          payloads=0; outer_parse_errors=0; inner_parse_errors=0; no_row_list=0
          row_occ=0; row_counts=collections.Counter(); row_bytes={}
          selected_bytes_total=0; selected_lengths=[]; path_counts=collections.Counter(); sig_counts=collections.Counter()
          quality_counts=collections.Counter(); valid_rows_total=0
          seen_by_identity=collections.defaultdict(set); prev_by_identity={}
          overlap=[]; novelty=[]; jaccards=[]; identity_payloads=collections.Counter()

          for rid,quality,body in c.execute('select id,quality,body_json from historical_raw_archive order by id'):
              payloads+=1; quality_counts[str(quality)]+=1
              try: outer=json.loads(body)
              except Exception:
                  outer_parse_errors+=1; continue
              inner_s=outer.get('payload_json') if isinstance(outer,dict) else None
              try:
                  inner=json.loads(inner_s) if isinstance(inner_s,str) else inner_s
              except Exception:
                  inner_parse_errors+=1; continue
              candidates=walk_lists(inner)
              if not candidates:
                  no_row_list+=1; continue
              path,lst=max(candidates,key=lambda t:len(t[1]))
              path_counts[path]+=1; selected_lengths.append(len(lst))
              sig=tuple(sorted({k for d in lst for k in d.keys()})); sig_counts[sig]+=1
              valid_rows_total += int(outer.get('valid_rows') or 0) if isinstance(outer,dict) else 0
              ident=(str(outer.get('asset_class')),str(outer.get('symbol')),str(outer.get('settlement')))
              identity_payloads[ident]+=1
              local=set()
              for item in lst:
                  h,b=canon_hash(item); local.add(h); row_counts[h]+=1; row_bytes.setdefault(h,b); selected_bytes_total+=b; row_occ+=1
              seen=seen_by_identity[ident]
              if local:
                  overlap.append(len(local&seen)/len(local)*100.0)
                  novelty.append(len(local-seen)/len(local)*100.0)
              if ident in prev_by_identity:
                  prev=prev_by_identity[ident]; union=len(prev|local)
                  if union: jaccards.append(len(prev&local)/union*100.0)
              seen.update(local); prev_by_identity[ident]=local

          unique_rows=len(row_counts)
          duplicate_occ=sum(n-1 for n in row_counts.values() if n>1)
          duplicate_groups=sum(1 for n in row_counts.values() if n>1)
          unique_bytes=sum(row_bytes.values())
          reusable=max(0,selected_bytes_total-unique_bytes)
          print(f'PAYLOADS_TOTAL={payloads}')
          print(f'OUTER_JSON_PARSE_ERRORS={outer_parse_errors}')
          print(f'INNER_JSON_PARSE_ERRORS={inner_parse_errors}')
          print(f'PAYLOADS_WITHOUT_LIST_OF_DICTS_INNER={no_row_list}')
          analyzed=payloads-outer_parse_errors-inner_parse_errors-no_row_list
          print(f'PAYLOADS_ANALYZED={analyzed}')
          print(f'INNER_SELECTED_ROW_OCCURRENCES={row_occ}')
          print(f'INNER_SELECTED_UNIQUE_ROW_HASHES={unique_rows}')
          print(f'INNER_DUPLICATE_ROW_OCCURRENCES={duplicate_occ}')
          print(f'INNER_DUPLICATE_GROUPS={duplicate_groups}')
          print(f'INNER_DUPLICATE_ROW_PCT={(duplicate_occ/row_occ*100 if row_occ else 0):.4f}')
          print(f'INNER_CANONICAL_ROW_BYTES_TOTAL={selected_bytes_total}')
          print(f'INNER_CANONICAL_ROW_BYTES_UNIQUE={unique_bytes}')
          print(f'INNER_CANONICAL_ROW_BYTES_REUSED={reusable}')
          print(f'INNER_CANONICAL_ROW_BYTES_REUSED_PCT={(reusable/selected_bytes_total*100 if selected_bytes_total else 0):.4f}')
          print(f'OUTER_VALID_ROWS_SUM={valid_rows_total}')
          if selected_lengths:
              print(f'ROWS_PER_PAYLOAD_MEDIAN={statistics.median(selected_lengths):.2f}')
              print(f'ROWS_PER_PAYLOAD_P90={sorted(selected_lengths)[int(0.9*(len(selected_lengths)-1))]}')
              print(f'ROWS_PER_PAYLOAD_MAX={max(selected_lengths)}')
          if overlap:
              print(f'OVERLAP_VS_PRIOR_SAME_IDENTITY_MEDIAN_PCT={statistics.median(overlap):.4f}')
              print(f'OVERLAP_VS_PRIOR_SAME_IDENTITY_P90_PCT={sorted(overlap)[int(0.9*(len(overlap)-1))]:.4f}')
          if novelty: print(f'NOVELTY_VS_PRIOR_SAME_IDENTITY_MEDIAN_PCT={statistics.median(novelty):.4f}')
          if jaccards:
              print(f'CONSECUTIVE_SAME_IDENTITY_JACCARD_MEDIAN_PCT={statistics.median(jaccards):.4f}')
              print(f'CONSECUTIVE_SAME_IDENTITY_JACCARD_P90_PCT={sorted(jaccards)[int(0.9*(len(jaccards)-1))]:.4f}')
          print('TOP_INNER_ROW_PATHS:')
          for p,n in path_counts.most_common(10): print(f'PATH|COUNT={n}|{p}')
          print('TOP_INNER_ROW_SIGNATURES:')
          for sig,n in sig_counts.most_common(8): print(f'SIGNATURE|COUNT={n}|KEYS={";".join(sig)}')
          print('QUALITY_COUNTS:')
          for q,n in quality_counts.most_common(): print(f'QUALITY|{q}|{n}')
          print('TOP_IDENTITIES_BY_PAYLOADS:')
          for ident,n in identity_payloads.most_common(15): print(f'IDENTITY|COUNT={n}|ASSET_CLASS={ident[0]}|SYMBOL={ident[1]}|SETTLEMENT={ident[2]}')
          tb=int(c.execute("select sum(pgsize) from dbstat where name='historical_raw_archive'").fetchone()[0] or 0)
          print(f'HISTORICAL_RAW_ARCHIVE_DBSTAT_BYTES={tb}')
          c.close()
          print('PAYLOAD_CONTENT_PRINTED=NO')
          print('B22_CLASSIFICATION=DOUBLE_PARSE_EXACT_ROW_OVERLAP')
          print('EVIDENCE_LOST=NOT_TESTED_YET')
          PY
          echo 'MUTATIONS=NONE'
          echo 'DELETE=NOT_RUN'
          echo 'VACUUM=NOT_RUN'
          echo 'PRUNE=NOT_RUN'
          echo 'EXTERNAL_V1_ACTIVATION=NOT_PERFORMED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE
