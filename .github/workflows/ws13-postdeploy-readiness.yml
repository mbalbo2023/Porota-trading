name: WS13 postdeploy universe audit READ ONLY

on:
  push:
    branches:
      - audit/ws13-postdeploy-readiness-20260929

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Checkout audit provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source and PPI Watch scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only 9003834fd284e7cd71c64c67467bafee2cbbe550..HEAD > changed-paths.txt
          if grep -Eiq '(^|/)(ppi[^/]*watch|watch[^/]*ppi)' changed-paths.txt; then
            echo 'PPI_WATCH_SOURCE_SCOPE=FAILED'
            cat changed-paths.txt
            exit 1
          fi
          echo 'PPI_WATCH_SOURCE_SCOPE=UNTOUCHED'

      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_audit" "$HOME/.ssh/known_hosts"

      - name: Collect exhaustive production evidence READ ONLY
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_audit" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" python3 - > ws13_postdeploy_readiness.json <<'PY'
          import collections, datetime, json, pathlib, sqlite3, subprocess

          DB = '/opt/porota-trading/data/paper_v17/observer_v17.db'
          BASELINE = {
              'catalog_total': 9652,
              'catalog_available': 6889,
              'catalog_ready': 809,
              'candidate_ready': 651,
              'evidence_v2_current': 520,
              'catalog_ready_by_family': {'ACCIONES': 126, 'CEDEARS': 683},
              'candidate_ready_by_family': {'ACCIONES': 92, 'CEDEARS': 559},
          }

          def command(*args):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, check=False).stdout.strip()

          def scalar(c, sql, params=()):
              row = c.execute(sql, params).fetchone()
              return row[0] if row else None

          def grouped(c, sql):
              return {str(row[0]): int(row[1]) for row in c.execute(sql)}

          def tables(c):
              return {r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}

          def safe_json(value):
              try:
                  parsed = json.loads(value or '{}')
              except (TypeError, ValueError):
                  return {}
              return parsed if isinstance(parsed, dict) else {}

          c = sqlite3.connect(f'file:{DB}?mode=ro', uri=True, timeout=30)
          c.row_factory = sqlite3.Row
          c.execute('PRAGMA query_only=ON')
          available_tables = tables(c)
          quick = scalar(c, 'PRAGMA quick_check')
          observer = dict(c.execute('SELECT * FROM observer_state WHERE id=1').fetchone())

          catalog_total = scalar(c, 'SELECT COUNT(*) FROM financial_instrument_catalog')
          catalog_available = scalar(c, "SELECT COUNT(*) FROM financial_instrument_catalog WHERE status='AVAILABLE'")
          catalog_ready = scalar(c, "SELECT COUNT(*) FROM financial_instrument_catalog WHERE status='AVAILABLE' AND capability LIKE 'READY_PAPER_%'")
          catalog_by_status = grouped(c, 'SELECT status,COUNT(*) FROM financial_instrument_catalog GROUP BY status ORDER BY status')
          catalog_available_by_family = grouped(c, "SELECT instrument_type,COUNT(*) FROM financial_instrument_catalog WHERE status='AVAILABLE' GROUP BY instrument_type ORDER BY instrument_type")
          catalog_ready_by_family = grouped(c, "SELECT instrument_type,COUNT(*) FROM financial_instrument_catalog WHERE status='AVAILABLE' AND capability LIKE 'READY_PAPER_%' GROUP BY instrument_type ORDER BY instrument_type")
          catalog_by_capability = grouped(c, "SELECT capability,COUNT(*) FROM financial_instrument_catalog WHERE status='AVAILABLE' GROUP BY capability ORDER BY capability")

          candidate_identity_total = scalar(c, 'SELECT COUNT(*) FROM candidate_identity_v2')
          candidate_identity_ready = scalar(c, "SELECT COUNT(*) FROM candidate_identity_v2 WHERE status='AVAILABLE' AND can_simulate=1")
          candidate_identity_ready_by_family = grouped(c, "SELECT instrument_type,COUNT(*) FROM candidate_identity_v2 WHERE status='AVAILABLE' AND can_simulate=1 GROUP BY instrument_type ORDER BY instrument_type")
          candidate_identity_blocked_by_family = grouped(c, "SELECT instrument_type,COUNT(*) FROM candidate_identity_v2 WHERE status='AVAILABLE' AND can_simulate=0 GROUP BY instrument_type ORDER BY instrument_type")
          candidate_universe_total = scalar(c, 'SELECT COUNT(*) FROM candidate_universe')
          candidate_universe_ready = scalar(c, "SELECT COUNT(*) FROM candidate_universe WHERE status='AVAILABLE' AND can_simulate=1")
          candidate_universe_ready_by_family = grouped(c, "SELECT instrument_type,COUNT(*) FROM candidate_universe WHERE status='AVAILABLE' AND can_simulate=1 GROUP BY instrument_type ORDER BY instrument_type")
          runtime_unique_ready = scalar(c, """SELECT COUNT(*) FROM (
              SELECT ticker,instrument_type,settlement FROM candidate_identity_v2
              WHERE status='AVAILABLE' AND can_simulate=1
              GROUP BY ticker,instrument_type,settlement HAVING COUNT(*)=1)""")

          evidence_current = scalar(c, 'SELECT COUNT(*) FROM contract_evidence_v2_current')
          evidence_by_source = grouped(c, 'SELECT source_class,COUNT(*) FROM contract_evidence_v2_current GROUP BY source_class ORDER BY source_class')
          evidence_by_family = grouped(c, 'SELECT family,COUNT(*) FROM contract_evidence_v2_current GROUP BY family ORDER BY family')
          ppi_evidence_rows = scalar(c, "SELECT COUNT(*) FROM contract_evidence_v2_current WHERE source_class='PPI_STRUCTURED_API'")
          ppi_catalog_keys = {tuple(r) for r in c.execute("""SELECT instrument_type,ticker,market,currency,settlement
              FROM financial_instrument_catalog WHERE status='AVAILABLE'""")}
          ppi_evidence_keys = {tuple(r) for r in c.execute("""SELECT family,ticker,market,currency,settlement
              FROM contract_evidence_v2_current WHERE source_class='PPI_STRUCTURED_API'""")}
          uncovered_ppi_keys = [dict(zip(('family','ticker','market','currency','settlement'), row))
                                for row in sorted(ppi_catalog_keys - ppi_evidence_keys)]
          extra_ppi_keys = [dict(zip(('family','ticker','market','currency','settlement'), row))
                            for row in sorted(ppi_evidence_keys - ppi_catalog_keys)]
          latest_mass = None
          row = c.execute("""SELECT run_id,job_key,started_at,finished_at,state,records,changed,conflicts,detail
              FROM contract_evidence_v2_runs
              WHERE job_key='CONTRACT_EVIDENCE_V2_MASS_PPI_CATALOG'
              ORDER BY started_at DESC LIMIT 1""").fetchone()
          if row:
              latest_mass = dict(row)
              latest_mass['detail'] = safe_json(latest_mass.get('detail'))

          retry = {}
          if 'complementary_contract_retry' in available_tables:
              for row in c.execute("""SELECT ticker,instrument_type,market,currency,settlement,
                  source,state,reason,last_attempt_at,attempts FROM complementary_contract_retry"""):
                  key = tuple(row[k] for k in ('ticker','instrument_type','market','currency','settlement'))
                  retry.setdefault(key, []).append({k: row[k] for k in
                      ('source','state','reason','last_attempt_at','attempts')})

          candidates = {}
          for row in c.execute('SELECT * FROM candidate_identity_v2'):
              key = tuple(row[k] for k in ('ticker','instrument_type','market','currency','settlement'))
              candidates[key] = dict(row)

          residuals = []
          for row in c.execute("""SELECT ticker,instrument_type,market,currency,settlement,
              settlement_source,last_seen_at,status,capability,metadata_json
              FROM financial_instrument_catalog WHERE status='AVAILABLE'
              ORDER BY instrument_type,ticker,market,currency,settlement"""):
              key = tuple(row[k] for k in ('ticker','instrument_type','market','currency','settlement'))
              candidate = candidates.get(key) or {}
              if int(candidate.get('can_simulate') or 0) == 1:
                  continue
              metadata = safe_json(row['metadata_json'])
              bridge = metadata.get('_contract_bridge') if isinstance(metadata.get('_contract_bridge'), dict) else {}
              residuals.append({
                  'ticker': row['ticker'], 'family': row['instrument_type'],
                  'market': row['market'], 'currency': row['currency'],
                  'settlement': row['settlement'], 'settlement_source': row['settlement_source'],
                  'last_seen_at': row['last_seen_at'], 'catalog_capability': row['capability'],
                  'candidate_status': candidate.get('status'),
                  'candidate_detail': candidate.get('detail') or 'MISSING_CANDIDATE_IDENTITY_V2',
                  'bridge_status': bridge.get('status'), 'bridge_gaps': bridge.get('gaps') or [],
                  'retry': retry.get(key, []),
              })
          residual_by_family = dict(collections.Counter(r['family'] for r in residuals))
          residual_by_capability = dict(collections.Counter(r['catalog_capability'] for r in residuals))
          residual_by_blocker = dict(collections.Counter(r['candidate_detail'] for r in residuals))

          current_state_path = pathlib.Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
          current_state = safe_json(current_state_path.read_text() if current_state_path.exists() else '{}')
          frozen_path = pathlib.Path('/opt/porota-trading/data/deploy/porota-frozen-candidate.json')
          frozen = safe_json(frozen_path.read_text() if frozen_path.exists() else '{}')
          manifest_path = pathlib.Path('/opt/porota-trading/data/deploy/porota-deploy-bundle-v2-manifest.json')
          manifest = safe_json(manifest_path.read_text() if manifest_path.exists() else '{}')
          runtime = {}
          for name in ('porota_production_observer', 'porota_production_dashboard'):
              raw = command('sudo', '-n', 'docker', 'inspect', name)
              try:
                  item = json.loads(raw)[0]
                  runtime[name] = {
                      'status': ((item.get('State') or {}).get('Status')),
                      'image': item.get('Image'),
                      'config_image': ((item.get('Config') or {}).get('Image')),
                      'labels': ((item.get('Config') or {}).get('Labels') or {}),
                  }
              except (ValueError, IndexError, TypeError):
                  runtime[name] = {'inspect_error': raw[:1000]}
          watch_units = []
          for unit in command('systemctl', 'list-unit-files', '--no-legend').splitlines():
              name = unit.split()[0] if unit.split() else ''
              low = name.lower()
              if 'ppi' in low and 'watch' in low:
                  watch_units.append({
                      'unit': name,
                      'enabled': command('systemctl', 'is-enabled', name),
                      'active': command('systemctl', 'is-active', name),
                  })
          c.close()

          after = {
              'catalog_total': catalog_total,
              'catalog_available': catalog_available,
              'catalog_ready': catalog_ready,
              'candidate_identity_total': candidate_identity_total,
              'candidate_identity_ready': candidate_identity_ready,
              'candidate_universe_total': candidate_universe_total,
              'candidate_universe_ready': candidate_universe_ready,
              'runtime_unique_ready': runtime_unique_ready,
              'evidence_v2_current': evidence_current,
              'ppi_identity_coverage': len(ppi_catalog_keys & ppi_evidence_keys),
              'ppi_evidence_rows': ppi_evidence_rows,
          }
          payload = {
              'schema': 'ws13-postdeploy-readiness-v1',
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'database': {'path': DB, 'mode': 'ro', 'query_only': True, 'quick_check': quick},
              'safety': {
                  'mode': observer.get('mode'),
                  'real_orders_sent': observer.get('real_orders_sent'),
                  'real_order_routes': current_state.get('real_order_routes'),
                  'ppi_watch_untouched': current_state.get('ppi_watch_untouched'),
                  'ppi_watch_units': watch_units,
                  'paper_only': True,
              },
              'observer_state': observer,
              'runtime': runtime,
              'runtime_provenance': {'current_state': current_state, 'frozen_candidate': frozen,
                                     'deploy_manifest': manifest},
              'before': BASELINE,
              'after': after,
              'delta': {key: after[key] - BASELINE[key] for key in BASELINE if key in after},
              'catalog': {
                  'by_status': catalog_by_status,
                  'available_by_family': catalog_available_by_family,
                  'ready_by_family': catalog_ready_by_family,
                  'available_by_capability': catalog_by_capability,
              },
              'candidate_identity_v2': {
                  'ready_by_family': candidate_identity_ready_by_family,
                  'blocked_by_family': candidate_identity_blocked_by_family,
              },
              'candidate_universe': {'ready_by_family': candidate_universe_ready_by_family},
              'evidence_v2': {
                  'current_by_source': evidence_by_source,
                  'current_by_family': evidence_by_family,
                  'ppi_available_key_coverage': {
                      'catalog_keys': len(ppi_catalog_keys),
                      'evidence_keys': len(ppi_evidence_keys),
                      'covered_keys': len(ppi_catalog_keys & ppi_evidence_keys),
                      'uncovered_keys': uncovered_ppi_keys,
                      'extra_keys': extra_ppi_keys,
                  },
                  'latest_mass_run': latest_mass,
              },
              'residual_summary': {
                  'count': len(residuals),
                  'by_family': residual_by_family,
                  'by_capability': residual_by_capability,
                  'by_blocker': residual_by_blocker,
              },
              'residual_instruments': residuals,
          }
          assert quick == 'ok'
          assert observer.get('mode') == 'PRODUCTION_PAPER'
          assert int(observer.get('real_orders_sent') or 0) == 0
          assert current_state.get('real_order_routes') in ('NONE', 'NOT_CALLED')
          assert current_state.get('ppi_watch_untouched') is True
          assert not uncovered_ppi_keys
          assert catalog_available == len(ppi_catalog_keys & ppi_evidence_keys)
          assert latest_mass and latest_mass.get('state') == 'OK'
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True, default=str))
          PY
          python -m json.tool ws13_postdeploy_readiness.json >/dev/null
          echo "WS13_POSTDEPLOY_AUDIT=GREEN|bytes=$(stat -c %s ws13_postdeploy_readiness.json)"

      - name: Upload exhaustive audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ws13-postdeploy-readiness
          path: ws13_postdeploy_readiness.json
          if-no-files-found: error
          retention-days: 90

      - name: Audit summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('ws13_postdeploy_readiness.json',encoding='utf-8'))
          s=p['safety']; a=p['after']; r=p['residual_summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### WS13 postdeploy READ_ONLY\n')
              f.write(f"- mode: `{s['mode']}`\n- real_orders_sent: `{s['real_orders_sent']}`\n")
              f.write(f"- catalog AVAILABLE: `{a['catalog_available']}`\n")
              f.write(f"- Evidence v2 PPI coverage: `{a['ppi_identity_coverage']}`\n")
              f.write(f"- candidate_identity_v2 READY: `{a['candidate_identity_ready']}`\n")
              f.write(f"- residual instrument-specific rows: `{r['count']}`\n")
              f.write(f"- residual by family: `{json.dumps(r['by_family'],sort_keys=True)}`\n")
          PY
