name: RC6 PPI history semantic readonly probe 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-semantic-readonly-probe-20260912.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Compare PPI semantics within families read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -u
          SVC=porota-ppi-fullfamily-history-rc6.service
          cd /opt/porota-trading || exit 2
          echo "PROBE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SYSTEMD_ACTIVE_BEFORE=$(systemctl is-active "$SVC" 2>/dev/null || true)"
          sudo -n docker exec -i porota_production_observer python -u - status < /opt/porota-ingest/ppi_history_control_rc6.py 2>&1 || true

          sudo -n docker exec -i porota_production_observer python -u - <<'PY'
          import json, math, sqlite3, statistics
          from collections import Counter
          from datetime import datetime, timedelta
          import bf_production_paper_observer as observer
          from bd_ppi_readonly_guard import ProductionMarketReader

          RUN_ID='PPI-HIST-20260912-001'
          FAMILIES=('CEDEARS','ON','FUTUROS','OPCIONES')
          store=observer.runtime_store()
          c=sqlite3.connect('file:' + store.path + '?mode=ro', uri=True, timeout=10)
          candidates=[]
          for fam in FAMILIES:
              bad=c.execute('''SELECT symbol,instrument_type,market,settlement,state
                               FROM ppi_history_ingest_tasks WHERE run_id=? AND instrument_type=?
                                 AND state='DONE_EMPTY' AND provider_rows>0
                               ORDER BY provider_rows DESC,symbol LIMIT 1''',(RUN_ID,fam)).fetchone()
              ctrl=c.execute('''SELECT symbol,instrument_type,market,settlement,state
                                FROM ppi_history_ingest_tasks WHERE run_id=? AND instrument_type=?
                                  AND state='ALREADY_COVERED'
                                ORDER BY symbol LIMIT 1''',(RUN_ID,fam)).fetchone()
              if bad: candidates.append(tuple(bad))
              if ctrl and (not bad or tuple(ctrl[:4]) != tuple(bad[:4])): candidates.append(tuple(ctrl))
              elif bad:
                  second=c.execute('''SELECT symbol,instrument_type,market,settlement,state
                                      FROM ppi_history_ingest_tasks WHERE run_id=? AND instrument_type=?
                                        AND state='DONE_EMPTY' AND provider_rows>0 AND symbol<>?
                                      ORDER BY provider_rows DESC,symbol LIMIT 1''',(RUN_ID,fam,bad[0])).fetchone()
                  if second: candidates.append(tuple(second))
          c.close()
          candidates.append(('GGAL','ACCIONES','BYMA','A-48HS','PPI_DOC_CONTROL'))
          print('SEMANTIC_COMPARE_CANDIDATES=' + json.dumps(candidates))

          key,secret=observer._secret(); reader=ProductionMarketReader(key,secret,audit=None); reader.login_once()
          start=datetime.now(observer.TZ).date()-timedelta(days=365); end=datetime.now(observer.TZ).date()
          fields=('openingPrice','max','min','price','volume','previousClose','marketChange','marketChangePercent')
          def num(v):
              try:
                  x=float(v); return x if math.isfinite(x) else None
              except Exception: return None
          def uniq(payload,field):
              vals=[]
              for r in payload:
                  if isinstance(r,dict):
                      v=num(r.get(field));
                      if v is not None: vals.append(v)
              return len(set(vals)), (round(float(statistics.median(vals)),6) if vals else None)
          for symbol,family,market,settlement,task_state in candidates:
              try: payload=reader.history(symbol,family,settlement,start,end)
              except Exception as exc:
                  print('SEMANTIC_COMPARE_ERROR=' + json.dumps({'symbol':symbol,'family':family,'settlement':settlement,'task_state':task_state,'error':str(exc)[:220]},sort_keys=True)); continue
              counts=Counter(); examples=[]
              for r in payload if isinstance(payload,list) else []:
                  if not isinstance(r,dict): continue
                  o,h,l,p=(num(r.get('openingPrice')),num(r.get('max')),num(r.get('min')),num(r.get('price')))
                  if h is not None and l is not None and h==l: counts['high_eq_low']+=1
                  if o==0: counts['open_zero']+=1
                  if h==0: counts['high_zero']+=1
                  if l==0: counts['low_zero']+=1
                  if num(r.get('volume'))==0: counts['volume_zero']+=1
                  if None not in (o,h,l,p):
                      ok=o>0 and h>0 and l>0 and p>0 and l <= min(o,p) <= max(o,p) <= h
                      counts['ohlc_ok' if ok else 'ohlc_bad']+=1
                      if not ok and len(examples)<3:
                          examples.append({k:r.get(k) for k in ('date','openingPrice','max','min','price','volume','previousClose','marketChange','marketChangePercent')})
              distinct={}; medians={}
              for f in fields:
                  distinct[f],medians[f]=uniq(payload if isinstance(payload,list) else [],f)
              print('SEMANTIC_COMPARE_RESULT=' + json.dumps({'symbol':symbol,'family':family,'market':market,'settlement':settlement,'task_state':task_state,'rows':len(payload) if isinstance(payload,list) else -1,'counts':dict(counts),'distinct_values':distinct,'medians':medians,'bad_examples':examples},sort_keys=True,default=str))
          reader.close(); print('SEMANTIC_COMPARE=PASS')
          PY

          echo "SYSTEMD_ACTIVE_AFTER=$(systemctl is-active "$SVC" 2>/dev/null || true)"
          sudo -n docker exec -i porota_production_observer python -u - status < /opt/porota-ingest/ppi_history_control_rc6.py 2>&1 || true
          HOST
