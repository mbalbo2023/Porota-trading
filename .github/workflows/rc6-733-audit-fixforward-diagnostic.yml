name: RC6 733 audit fix-forward diagnostic

on:
  push:
    branches:
      - work/rc6-733-audit-fixforward-20261024

permissions:
  contents: read

concurrency:
  group: rc6-733-audit-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offhost:
    name: Offhost gate and cleanup regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install exact Python lock
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements.lock.txt
      - name: Syntax and targeted adversarial regressions
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q tests/test_ci_productive_predeploy_contract.py tests/test_rc6_disk_deploy_guard.py tests/test_rc6_disk_materialization_reserve.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q -p no:cacheprovider --junitxml=/tmp/rc6-audit-diagnostic.xml tests/test_ci_productive_predeploy_contract.py tests/test_rc6_disk_deploy_guard.py tests/test_rc6_disk_materialization_reserve.py tests/test_rc6_deploy_host_mutex.py
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse('/tmp/rc6-audit-diagnostic.xml').getroot()
          cases=list(root.iter('testcase'))
          red=sum(1 for case in cases if any(case.find(tag) is not None for tag in ('failure','error','skipped')))
          assert cases and red==0, (len(cases),red)
          print('RC6_DIAGNOSTIC_CASES=' + str(len(cases)) + '|RED=0')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          for filename in ('porota-predeploy-v2.yml','porota-deploy-v2-promote.yml'):
              doc=yaml.safe_load((Path('.github/workflows')/filename).read_text())
              for job in doc['jobs'].values():
                  for step in job['steps']:
                      if 'run' in step:
                          subprocess.run(['bash','-n'],input=step['run'],text=True,check=True)
          print('RC6_FIX_FORWARD_SYNTAX=GREEN')
          PY
          echo 'DROPLET_TOUCHED=NO'
      - name: Diagnose sudo file-descriptor inheritance on runner only
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, subprocess, tempfile
          baseline=subprocess.run(['sudo','-n','python3','-c','print("SUDO_AVAILABLE")'],
                                  capture_output=True,text=True)
          print('RC6_RUNNER_SUDO_BASE_RC=' + str(baseline.returncode))
          print('RC6_RUNNER_SUDO_BASE_OUTPUT=' + baseline.stdout.strip())
          assert baseline.returncode==0 and baseline.stdout.strip()=='SUDO_AVAILABLE', baseline.stderr.strip()
          fd,path=tempfile.mkstemp(prefix='rc6-fd-runner-')
          try:
              result=subprocess.run(['sudo','-n','python3','-c',
                  'import os,sys; fd=int(sys.argv[1]); ' +
                  'print("FD_OPEN" if os.path.exists("/proc/self/fd/"+str(fd)) else "FD_CLOSED")',
                  str(fd)],pass_fds=(fd,),text=True,capture_output=True)
              print('RC6_RUNNER_NESTED_SUDO_FD=' + result.stdout.strip())
              print('RC6_RUNNER_NESTED_SUDO_RC=' + str(result.returncode))
              assert result.returncode==0 and result.stdout.strip() in ('FD_OPEN','FD_CLOSED'), result.stderr.strip()
              override=subprocess.run(['sudo','-n','-C',str(fd+1),'python3','-c',
                  'import os,sys; print("FD_OPEN" if os.path.exists("/proc/self/fd/"+sys.argv[1]) else "FD_CLOSED")',
                  str(fd)],pass_fds=(fd,),text=True,capture_output=True)
              print('RC6_RUNNER_SUDO_CLOSEFROM_OVERRIDE_RC=' + str(override.returncode))
              print('RC6_RUNNER_SUDO_CLOSEFROM_OVERRIDE_FD=' + override.stdout.strip())
              print('RC6_RUNNER_SUDO_CLOSEFROM_OVERRIDE_DENIED=' +
                    str('close from' in override.stderr.lower() or 'closefrom' in override.stderr.lower()))
          finally:
              os.close(fd); os.unlink(path)
          PY
          echo 'DROPLET_TOUCHED=NO'
