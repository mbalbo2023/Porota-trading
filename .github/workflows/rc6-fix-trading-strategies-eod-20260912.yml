name: RC6 Fix Trading Estrategias EOD 2026-09-12

on:
  push:
    branches: [analysis/rc6-eod-overnight-replay-20260912]
    paths:
      - '.github/workflows/rc6-fix-trading-strategias-eod-20260912.yml'
      - '.github/workflows/rc6-fix-trading-strategies-eod-20260912.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/rc6-eod-overnight-replay-20260912
          fetch-depth: 0

      - name: Replace duplicated Scalping view with EOD Overnight strategy panel
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('bg_paper_dashboard.py')
          text = path.read_text(encoding='utf-8')
          anchor = "    if section=='estrategias':"
          next_anchor = "    families=families_for_group(section)"
          start = text.index(anchor)
          end = text.index(next_anchor, start)
          old = text[start:end]
          if '_main_fragment(scalping_page())' not in old:
              raise SystemExit('Trading Estrategias no longer contains the expected Scalping duplicate; refusing ambiguous patch')
          new = "\n".join([
              "    if section=='estrategias':",
              "        from fo_eod_overnight_dashboard_rc6 import render as render_eod_overnight",
              "        body=(\"<h1>Trading — Estrategias</h1>\"+subnav+",
              "              \"<div class='paper-notice'>Las estrategias se muestran aquí sin duplicar módulos que ya tienen navegación propia. \"",
              "              \"Scalping permanece exclusivamente en su menú principal.</div>\"+",
              "              render_eod_overnight())",
              "        return _document('Trading — Estrategias',body,refresh=30)",
              "",
          ])
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY

      - name: Static safety assertions
        run: |
          set -euo pipefail
          python -m py_compile bg_paper_dashboard.py fo_eod_overnight_dashboard_rc6.py
          python - <<'PY'
          from pathlib import Path
          text=Path('bg_paper_dashboard.py').read_text(encoding='utf-8')
          start=text.index("if section=='estrategias':")
          end=text.index('families=families_for_group(section)', start)
          block=text[start:end]
          assert '_main_fragment(scalping_page())' not in block
          assert 'render_eod_overnight()' in block
          assert 'Scalping permanece exclusivamente en su menú principal.' in block
          eod=Path('fo_eod_overnight_dashboard_rc6.py').read_text(encoding='utf-8')
          assert 'CURRENT_EOD' in eod
          assert 'ACTIVE_PAPER' in eod
          assert 'Auto-promoción' in eod
          assert 'mode=ro' in eod
          assert 'PRAGMA query_only=ON' in eod
          assert 'INSERT ' not in eod and 'UPDATE ' not in eod and 'DELETE ' not in eod
          print('TRADING_ESTRATEGIAS_EOD_STATIC_GUARDS=GREEN')
          PY

      - name: Commit forward-fix
        run: |
          set -euo pipefail
          if git diff --quiet -- bg_paper_dashboard.py; then
            echo 'No diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bg_paper_dashboard.py
          git commit -m 'fix: stop duplicating Scalping under Trading Estrategias'
          git push origin HEAD:analysis/rc6-eod-overnight-replay-20260912
