name: RC5 - aplicar integración /en-vivo

on:
  push:
    branches:
      - candidate/rc5-dashboard-live-integration-20260905
    paths:
      - .github/workflows/rc5-apply-live-dashboard.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/rc5-dashboard-live-integration-20260905
          fetch-depth: 0

      - name: Aplicar parche exacto
        run: python scripts/rc5_apply_live_dashboard.py

      - name: Validar sintaxis y tests dirigidos
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bg_paper_dashboard.py eb_dashboard_live_policy_hf2.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_dashboard_live_policy_hf2.py \
            tests/test_dashboard_live_integration_rc5.py
          git diff --check

      - name: Commit de la integración probada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Porota RC5 Automation'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add bg_paper_dashboard.py tests/test_dashboard_live_integration_rc5.py
          git commit -m 'feat(rc5): integrar /en-vivo day-only y accesible'
          git push origin HEAD:candidate/rc5-dashboard-live-integration-20260905
