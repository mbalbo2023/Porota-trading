name: RC6 Contract endpoint provenance audit 2026-09-14

on:
  push:
    branches: [ops/rc6-contract-blocked-nonread-audit-20260914]
    paths:
      - '.github/workflows/rc6-contract-endpoint-provenance-audit-20260914.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  endpoint-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rc6-contract-blocked-nonread-audit-20260914

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect existing captures and installed DOM path read-only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          RESULT=POROTA_TRADING_CONTRACT_ENDPOINT_PROVENANCE_AUDIT_2026-09-14.txt
          ssh -i "$HOME/.ssh/k" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'sudo -n bash -s' <<'HOST' > "$RESULT"
          set -Eeuo pipefail
          OUTDIR=/opt/porota-trading/data/contract_evidence/rc6_trusted
          CURRENT="$OUTDIR/contract_point1_20260914T000107Z.json"
          LIB=/usr/local/lib/porota-contract-evidence-rc6
          WITHDOM=/usr/local/sbin/porota-contract-evidence-rc6-with-dom.sh

          echo 'PROBE=RC6_CONTRACT_ENDPOINT_PROVENANCE_AUDIT_V1'
          echo 'READ_ONLY=YES'
          echo 'BROWSER_STARTED=NO'
          echo 'DB_TOUCHED=NO'

          python3 - "$CURRENT" "$OUTDIR" <<'PY'
          import json,sys,glob,os
          from urllib.parse import urlsplit
          cur,outdir=sys.argv[1],sys.argv[2]
          print('--- CURRENT_CAPTURE_ROUTES ---')
          try:
              d=json.load(open(cur,encoding='utf-8'))
          except Exception as e:
              print('CURRENT_CAPTURE_READ=ERROR_'+type(e).__name__)
              d={}
          print('CURRENT_AUTH='+str(d.get('auth_status')))
          print('CURRENT_ENDPOINTS='+str(len(d.get('endpoints') or {})))
          print('CURRENT_BLOCKED_NONREAD='+str(len(d.get('blocked_nonread') or [])))
          for i,r in enumerate(d.get('routes') or [],1):
              if not isinstance(r,dict): continue
              u=urlsplit(str(r.get('url') or ''))
              safe_url=(u.scheme+'://'+u.netloc+u.path) if u.scheme else str(r.get('url') or '')
              title=str(r.get('title') or '').replace('\n',' ')[:120]
              print(f"ROUTE_{i}=job:{r.get('job')}|requested:{r.get('requested')}|reached:{r.get('reached')}|url:{safe_url}|error:{r.get('error','')}|title:{title}")

          print('--- HISTORICAL_TRUSTED_CAPTURES_WITH_ENDPOINTS ---')
          rows=[]
          for p in sorted(glob.glob(os.path.join(outdir,'contract*.json'))):
              try:
                  x=json.load(open(p,encoding='utf-8'))
              except Exception:
                  continue
              ep=x.get('endpoints') or {}
              if not isinstance(ep,dict) or not ep:
                  continue
              kinds={}; sources=[]
              for v in ep.values():
                  if not isinstance(v,dict): continue
                  kind=str(v.get('kind') or 'UNKNOWN')
                  kinds[kind]=kinds.get(kind,0)+1
                  src=str(v.get('source_url') or '')
                  if src:
                      u=urlsplit(src); sources.append((kind,u.netloc,u.path))
              rows.append((str(x.get('generated_at') or ''),os.path.basename(p),str(x.get('auth_status')),len(ep),kinds,sources))
          print('HIST_CAPTURES_ENDPOINTS_COUNT='+str(len(rows)))
          for generated,name,auth,n,kinds,sources in rows[-20:]:
              print('CAPTURE='+name+'|generated:'+generated+'|auth:'+auth+'|endpoints:'+str(n)+'|kinds:'+json.dumps(kinds,sort_keys=True,separators=(',',':')))
              for kind,host,path in sorted(set(sources))[:40]:
                  print('  SOURCE='+kind+'|'+host+'|'+path)
          PY

          echo '--- INSTALLED_DOM_PATH ---'
          if [[ -r "$WITHDOM" ]]; then
            echo "WITHDOM_PRESENT=YES"
            echo "WITHDOM_SHA256=$(sha256sum "$WITHDOM" | awk '{print $1}')"
            grep -nE 'DOM|dom|LIB=|PYTHON|capture|import|exec|python|OUT|ROOT|PROFILE' "$WITHDOM" \
              | sed -E 's#([A-Za-z_]*(TOKEN|PASSWORD|SECRET|COOKIE|AUTH)[A-Za-z_]*)=[^ ]+#\1=REDACTED#gI' \
              | head -n 120 || true
          else
            echo 'WITHDOM_PRESENT=NO'
          fi

          echo '--- LIB_FILES_RELEVANT_TO_DOM_OR_TARGETS ---'
          if [[ -d "$LIB" ]]; then
            find "$LIB" -maxdepth 1 -type f -printf '%f\n' | grep -Ei 'dom|browser|contract|evidence' | sort | head -n 100 || true
            echo '--- TARGET_REFERENCES_IN_LIB ---'
            grep -RInE 'InstrumentosOperables|CaucionesOperables|ConfiguracionOperatoriaSimplificada|SubyacenteOpciones|DatosTecnicos' "$LIB" \
              --include='*.py' --include='*.sh' \
              | sed -E 's#([A-Za-z_]*(TOKEN|PASSWORD|SECRET|COOKIE|AUTH)[A-Za-z_]*)=[^ ]+#\1=REDACTED#gI' \
              | head -n 160 || true
          fi

          echo 'RESULT=GREEN_ENDPOINT_PROVENANCE_AUDIT_COMPLETE_NO_MUTATION'
          HOST
          cat "$RESULT"

      - name: Persist sanitized provenance audit
        if: always()
        run: |
          set -euo pipefail
          RESULT=POROTA_TRADING_CONTRACT_ENDPOINT_PROVENANCE_AUDIT_2026-09-14.txt
          test -f "$RESULT" || printf 'PROBE_RESULT=MISSING\n' > "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git diff --cached --quiet && exit 0
          git commit -m 'audit(contract): persist endpoint provenance audit [skip ci]'
          git push origin HEAD:ops/rc6-contract-blocked-nonread-audit-20260914
