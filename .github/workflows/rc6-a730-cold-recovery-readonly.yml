name: RC6 A730 COLD Recovery Predicate READ_ONLY

# Manual only from reviewed main. No provider, host writes, timer, deploy,
# Docker cleanup, or COLD drain/ensure_idle: those are MUTATING operations.
on:
  workflow_dispatch:
    inputs:
      expected_previous_deploy_sha:
        description: Last independently validated runtime product SHA (R1)
        required: true
        type: string
        default: eefcf6d8c93f3eddfc23bd471d9d5b41d9a31a9f
      failed_deploy_sha:
        description: Exact failed Deploy V2 product SHA (R2)
        required: true
        type: string
        default: 7ac6e368bd42137817e3271839c35f579bdbbbbe
      failed_candidate_sha:
        description: Frozen failed R2 candidate SHA
        required: true
        type: string
        default: a16a31c7bc4634362870c731273e084eea9d357d
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rc6-a730-cold-recovery-readonly.yml
      - scripts/rc6_a730_cold_recovery_readonly.py
      - tests/test_rc6_a730_cold_recovery_readonly.py

permissions:
  contents: read

jobs:
  offline_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise hermetic COLD proof and public sanitizer
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m py_compile scripts/rc6_a730_cold_recovery_readonly.py tests/test_rc6_a730_cold_recovery_readonly.py
          python3 -B -m unittest discover -s tests -p test_rc6_a730_cold_recovery_readonly.py -v
          git diff --check

  host_readonly:
    needs: offline_contracts
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: rc6-unified-paper-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      RC6_RO_PREVIOUS_SHA: ${{ inputs.expected_previous_deploy_sha }}
      RC6_RO_FAILED_DEPLOY_SHA: ${{ inputs.failed_deploy_sha }}
      RC6_RO_FAILED_CANDIDATE_SHA: ${{ inputs.failed_candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: SHA validation and private runner SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RC6_RO_PREVIOUS_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RC6_RO_FAILED_DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RC6_RO_FAILED_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RC6_RO_PREVIOUS_SHA" != "$RC6_RO_FAILED_DEPLOY_SHA"
          test "$RC6_RO_FAILED_DEPLOY_SHA" != "$RC6_RO_FAILED_CANDIDATE_SHA"
          test "$RC6_RO_PREVIOUS_SHA" != "$RC6_RO_FAILED_CANDIDATE_SHA"
          test -n "$DO_HOST" && test -n "$DO_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d "$RUNNER_TEMP/rc6_a730_ro"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/rc6_a730_ro/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/rc6_a730_ro/known_hosts"
          chmod 600 "$RUNNER_TEMP/rc6_a730_ro/key" "$RUNNER_TEMP/rc6_a730_ro/known_hosts"
          printf '%s\n' '{"schema":"rc6.a730.cold-recovery-readonly.v1","state":"NO_VERIFICADO"}' \
            > "$RUNNER_TEMP/rc6_a730_ro/raw.private.json"
      - name: Bounded COLD receipts and optional computed hash on private readonly mount
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          timeout --signal=TERM --kill-after=4s 135s ssh \
            -i "$RUNNER_TEMP/rc6_a730_ro/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rc6_a730_ro/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=7 -o ServerAliveCountMax=2 \
            "$DO_USER@$DO_HOST" \
            "sudo -n timeout 110 unshare --mount --propagation private -- /bin/sh -eu -c 'mount --bind /opt/porota-trading/data /opt/porota-trading/data && mount -o remount,bind,ro /opt/porota-trading/data && exec env RC6_RO_PREVIOUS_SHA=$RC6_RO_PREVIOUS_SHA RC6_RO_FAILED_DEPLOY_SHA=$RC6_RO_FAILED_DEPLOY_SHA RC6_RO_FAILED_CANDIDATE_SHA=$RC6_RO_FAILED_CANDIDATE_SHA python3 -B - --host'" \
            < scripts/rc6_a730_cold_recovery_readonly.py \
            > "$RUNNER_TEMP/rc6_a730_ro/raw.private.json" 2>/dev/null
          rc=$?
          set -e
          echo "A730_REMOTE_RC=$rc" >> "$GITHUB_ENV"
          echo 'A730_PRIVATE_CAPTURE_ATTEMPTED=1|no_writes|no_provider|no_recovery'
      - name: Independently sanitize receipt exact keys and enums
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$RUNNER_TEMP/rc6_a730_ro"
          printf '%s\n' '{"schema":"rc6.a730.cold-recovery-readonly.v1","state":"NO_VERIFICADO"}' \
            > "$RUNNER_TEMP/rc6_a730_ro/sanitized.json"
          if ! test -f "$RUNNER_TEMP/rc6_a730_ro/raw.private.json"; then
            printf '%s\n' '{"schema":"rc6.a730.cold-recovery-readonly.v1","state":"NO_VERIFICADO"}' \
              > "$RUNNER_TEMP/rc6_a730_ro/raw.private.json"
          fi
          set +e
          python3 -B scripts/rc6_a730_cold_recovery_readonly.py --sanitize \
            < "$RUNNER_TEMP/rc6_a730_ro/raw.private.json" \
            > "$RUNNER_TEMP/rc6_a730_ro/sanitized.json"
          safe_rc=$?
          set -e
          A730_SAFE_RC="$safe_rc" A730_REMOTE_RC="${A730_REMOTE_RC:-255}" python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'rc6_a730_ro/sanitized.json'
          if path.stat().st_size>4096:
              raise SystemExit('A730_RECEIPT_TOO_LARGE')
          obj=json.loads(path.read_text())
          if (os.environ['A730_SAFE_RC']!='0' or os.environ['A730_REMOTE_RC']!='0' or
                  obj.get('state')!='DIAGNOSTIC_ONLY'):
              print('A730=NO_VERIFICADO|safe_no_repair')
              raise SystemExit(2)
          print('A730=DIAGNOSTIC_ONLY|successor_recovery_proven=false')
          print('A730_CURRENT='+obj['current']['source_state']+
                '|computed='+obj['current']['computed_report_state'])
          print('A730_LEGACY_ORIGINAL='+obj['legacy_original']+
                '|legacy_cold2='+obj['legacy_cold2'])
          PY
      - name: Upload only bounded sanitized metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a730-cold-recovery-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/rc6_a730_ro/sanitized.json
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy runner-only private SSH and raw output
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for item in key known_hosts raw.private.json; do
            file="$RUNNER_TEMP/rc6_a730_ro/$item"
            if test -f "$file" && ! test -L "$file"; then
              shred -u "$file"
            fi
          done
