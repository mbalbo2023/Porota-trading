name: RC6 PPI API universe certification 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-api-universe-certification-20260912.yml']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Certify current trusted local PPI universe read only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }
          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"; case "$st" in active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 32;; esac
          done
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 600 9 || { echo ABORT=HISTORY_LOCK_BUSY; exit 33; }
          sudo -n timeout 1200 docker exec -i porota_production_observer python - <<'PY'
          import json,time
          from collections import Counter
          import bf_production_paper_observer as m
          import bu_instrument_catalog as catalog

          LOCAL={'BYMA','ROFEX','A3','OTC'}
          FOREIGN={'ACCIONES-USA','FCI-EXTERIOR'}
          EXPECTED={
            'ACCIONES':55,'BONOS':42,'CAUCIONES':10,'CEDEARS':191,'FCI':1040,
            'FUTUROS':52,'LEBACS':1,'LETRAS':23,'LICITACIONES':18,'ON':91,'OPCIONES':437,
          }
          DISCOVERY={
            'FCI':(('FONDO','RENTA','AHORRO','PPI','BALANZ','GALILEO','MONEY','PESOS','DOLAR','A','E','I','O','U','S','M','P'),('BYMA','OTC')),
            'LICITACIONES':(('LICITACION','LETRA','BONO','ON','A','E','I','O','U','S','M','P'),('BYMA','OTC')),
            'LEBAC':(('LEBAC','L','A','E','I','O','U','S','M','P'),('BYMA',)),
            'NOBAC':(('NOBAC','N','A','E','I','O','U','S','M','P'),('BYMA',)),
            'ETF':(('SPY','QQQ','DIA','IWM','ARGT','A','E','I','O','U','S','M','P'),('BYMA',)),
          }
          store=m.runtime_store()
          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_BEFORE={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              base=[dict(r) for r in c.execute("select ticker,instrument_type,market,currency,settlement,status,description,metadata_json from financial_instrument_catalog where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')")]
              current=[tuple(r) for r in c.execute("select ticker,instrument_type,market,currency,settlement from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')")]
              shadow_dups=c.execute("select count(*) from (select ticker,instrument_type,market,currency,settlement,count(*) n from ppi_argentina_api_shadow group by 1,2,3,4,5 having n>1)").fetchone()[0]
          trusted={}
          for r in base:
              k=(r['ticker'],r['instrument_type'],r['market'],r['currency'],r['settlement'])
              trusted[k]=r
          key,secret=m._secret(); reader=m.ProductionMarketReader(key,secret,audit=store.audit_http); reader.login_once(); stats={}; direct=set()
          try:
              for fam,(queries,markets) in DISCOVERY.items():
                  st={'queries':0,'ok':0,'empty':0,'errors':0,'normalized':0}; stats[fam]=st
                  for q in queries:
                      for market in markets:
                          st['queries']+=1
                          try:
                              p=reader.search_instruments(q,fam,name=q,market=market); st['ok']+=1
                              if not p: st['empty']+=1
                              for raw in p if isinstance(p,list) else []:
                                  try: rec=catalog.normalize_record(raw,'INMEDIATA' if fam=='FCI' else 'A-24HS',m.now_iso(),'ARG_LOCAL_API_CERT')
                                  except Exception: continue
                                  if rec['market'] not in LOCAL or rec['instrument_type'] in FOREIGN: continue
                                  k=(rec['ticker'],rec['instrument_type'],rec['market'],rec['currency'],rec['settlement'])
                                  trusted[k]=rec; direct.add(k); st['normalized']+=1
                          except Exception as exc:
                              st['errors']+=1; print('DISCOVERY_ERROR='+json.dumps({'family':fam,'query':q,'market':market,'error':m.classify_read_error(exc)},sort_keys=True))
                          time.sleep(.04)
          finally:
              reader.close()
          cur=set(current); good=set(trusted); extra=cur-good; missing=good-cur
          counts=Counter(k[1] for k in good)
          errors=sum(v['errors'] for v in stats.values())
          print('DISCOVERY_STATS='+json.dumps(stats,sort_keys=True))
          print('CERT_BASE_CATALOG='+str(len(base)))
          print('CERT_DIRECT_UNIQUE='+str(len(direct)))
          print('CERT_TRUSTED_TOTAL='+str(len(good)))
          print('CERT_SHADOW_TOTAL='+str(len(cur)))
          print('CERT_EXTRA='+str(len(extra)))
          print('CERT_MISSING='+str(len(missing)))
          print('CERT_SHADOW_DUP_GROUPS='+str(shadow_dups))
          print('CERT_FAMILY_COUNTS='+json.dumps(dict(sorted(counts.items())),sort_keys=True))
          print('CERT_EXPECTED='+json.dumps(EXPECTED,sort_keys=True))
          assert errors==0
          assert len(good)==1960 and len(cur)==1960
          assert not extra and not missing and shadow_dups==0
          assert dict(counts)==EXPECTED
          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_AFTER={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          print('PPI_API_DISCOVERY_MILESTONE=CERTIFIED')
          print('SCOPE=ARGENTINA_LOCAL_PROVIDER_RETURNED_IDENTITIES')
          print('FOREIGN_EXCLUDED=ACCIONES-USA,FCI-EXTERIOR,NYSE,NASDAQ')
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
