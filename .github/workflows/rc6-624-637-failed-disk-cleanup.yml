name: RC6 624 bounded read-only resource census

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/rc6-624-637-failed-disk-cleanup.yml]

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.head_ref == 'diagnostic/rc6-624-safe-disk-map-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d52e45fe85ed184a76d35120ca543f5d63f38b2c
      - name: Confirm exact RED and product identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = d52e45fe85ed184a76d35120ca543f5d63f38b2c
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/mbalbo2023/Porota-trading/actions/runs/39185545107',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=15) as response: run=json.load(response)
          assert run['head_sha']=='d52e45fe85ed184a76d35120ca543f5d63f38b2c'
          assert run['status']=='completed' and run['conclusion']=='failure'
          print('RC6_641_EXACT_RED=GREEN')
          PY
      - name: Read bounded resource census
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/key"' EXIT
          mkdir -p evidence
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 "$DO_USER@$DO_HOST" 'sudo -n timeout 30 python3 -B -' <<'PY' > evidence/resources.json
          import datetime as dt,json,os,sqlite3,subprocess,time
          from pathlib import Path
          start=time.monotonic()
          def read(path,maximum=8192):
              p=Path(path)
              return p.read_text(errors='replace') if p.is_file() and not p.is_symlink() and p.stat().st_size<=maximum else ''
          def command(*args,limit=5):
              return subprocess.check_output(args,stderr=subprocess.DEVNULL,text=True,timeout=limit)
          with sqlite3.connect('file:/opt/porota-trading/data/paper_v17/observer_v17.db?mode=ro',
                               uri=True,timeout=.2) as db:
              db.execute('PRAGMA query_only=ON')
              db.execute('PRAGMA busy_timeout=200')
              deadline=time.monotonic()+1
              db.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
              mode,orders,process,session=db.execute(
                  'SELECT mode,real_orders_sent,process_state,session_state FROM observer_state WHERE id=1').fetchone()
          assert mode=='PRODUCTION_PAPER' and type(orders) is int and orders==0
          assert process=='WAITING_MARKET' and session in ('MARKET_CLOSED','WAITING_MARKET')
          mem={}
          for line in read('/proc/meminfo').splitlines():
              if ':' not in line:continue
              k,v=line.split(':',1)
              if k in {'MemTotal','MemFree','MemAvailable','Buffers','Cached','SReclaimable',
                       'Shmem','SwapTotal','SwapFree','Slab'}:mem[k]=int(v.strip().split()[0])*1024
          pressure={k:read('/proc/pressure/'+k,1024).splitlines()[:2] for k in ('cpu','memory','io')}
          fs=os.statvfs('/')
          disk={'free_bytes':fs.f_bavail*fs.f_frsize,'total_bytes':fs.f_blocks*fs.f_frsize,
                'inodes_free_percent':100*fs.f_ffree/fs.f_files}
          rows=[]
          for line in command('ps','-eo','pid,ppid,rss,etimes,pcpu,comm','--no-headers',limit=4).splitlines()[:2048]:
              f=line.split(None,5)
              if len(f)!=6:continue
              try:pid,ppid,rss,elapsed=map(int,f[:4]);cpu=float(f[4])
              except ValueError:continue
              rows.append({'pid':pid,'ppid':ppid,'rss_bytes':rss*1024,'elapsed_seconds':elapsed,
                           'cpu_lifetime_percent':cpu,'comm':f[5][:64]})
          names=('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6')
          containers={}
          for name in names:
              obj=json.loads(command('docker','inspect',name,limit=5))[0]
              pid=obj['State']['Pid']
              assert obj['State']['Status']=='running' and type(pid) is int and pid>1
              paths=read('/proc/'+str(pid)+'/cgroup',4096).splitlines()
              rel=next((row.split(':',2)[-1] for row in paths if row.startswith('0::')),'')
              cgroot=Path('/sys/fs/cgroup').resolve()
              cg=(cgroot/rel.lstrip('/')).resolve()
              assert cg==cgroot or cgroot in cg.parents
              cgstats={}
              for field in ('memory.current','memory.peak','memory.max','memory.swap.current','pids.current'):
                  val=read(cg/field,128).strip()
                  cgstats[field]=int(val) if val.isdecimal() else val[:32]
              stat={}
              for line in read(cg/'memory.stat',8192).splitlines():
                  parts=line.split()
                  if len(parts)==2 and parts[0] in ('anon','file','kernel','slab','sock','shmem','inactive_file','active_file'):
                      stat[parts[0]]=int(parts[1])
              cgstats['memory.stat']=stat
              containers[name]={'pid':pid,'image_id':obj['Image'],'status':obj['State']['Status'],
                                'health':(obj['State'].get('Health') or {}).get('Status'),
                                'oom':obj['State']['OOMKilled'],'restarts':obj['RestartCount'],
                                'cgroup':cgstats}
          def shallow(path):
              out=[];begin=time.monotonic()
              with os.scandir(path) as entries:
                  for idx,ent in enumerate(entries):
                      if idx>=80 or time.monotonic()-begin>1:break
                      if not ent.is_file(follow_symlinks=False):continue
                      st=ent.stat(follow_symlinks=False)
                      out.append({'name':ent.name[:80],'allocated_bytes':st.st_blocks*512,
                                  'modified_utc':dt.datetime.fromtimestamp(st.st_mtime,dt.timezone.utc).isoformat()})
              return sorted(out,key=lambda x:x['allocated_bytes'],reverse=True)[:12]
          direct={}
          for path in ('/var/log','/var/log/journal','/opt/porota-trading/data/deploy','/tmp'):
              try:direct[path]=shallow(path)
              except (OSError,TimeoutError) as exc:direct[path]={'error_class':type(exc).__name__}
          result={'schema':'rc6.issue624.resource-census.v1','status':'READ_ONLY',
                  'at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
                  'duration_seconds':round(time.monotonic()-start,3),
                  'observer':{'mode':mode,'orders':orders,'process':process,'session':session},
                  'meminfo_bytes':mem,'pressure':pressure,'disk':disk,'process_count':len(rows),
                  'top_rss':sorted(rows,key=lambda x:x['rss_bytes'],reverse=True)[:25],
                  'top_cpu_lifetime':sorted(rows,key=lambda x:x['cpu_lifetime_percent'],reverse=True)[:15],
                  'owned_containers':containers,'shallow_regular_files':direct,
                  'real_orders_sent':0,'ppi_watch_accessed':False}
          # Link the largest Python child to its supervised role without argv/env.
          health=Path('/opt/porota-trading/data/paper_v17/artifacts/observer_v17.db/runtime-health.json')
          if health.is_file() and not health.is_symlink() and health.stat().st_size<=32768:
              children=json.loads(health.read_text()).get('children',{})
              result['child_roles']={name:{k:row.get(k) for k in ('pid','state','restarts')}
                  for name,row in children.items() if isinstance(row,dict)}
          else:result['child_roles']={'status':'UNAVAILABLE'}
          # One 1-second CPU delta; ps %cpu is a lifetime average.
          watched={p['pid'] for p in result['top_rss'][:15]}
          def cpu_ticks(pid):
              raw=read('/proc/'+str(pid)+'/stat',4096)
              tail=raw.rsplit(')',1)
              if len(tail)!=2:return None
              f=tail[1].split()
              return int(f[11])+int(f[12]) if len(f)>12 else None
          before={pid:cpu_ticks(pid) for pid in watched}
          time.sleep(1)
          after={pid:cpu_ticks(pid) for pid in watched}
          hz=os.sysconf('SC_CLK_TCK')
          result['one_second_cpu_percent']=[
              {'pid':pid,'cpu_percent_one_core':round((after[pid]-before[pid])*100/hz,1)}
              for pid in watched if before[pid] is not None and after[pid] is not None
              and after[pid]>=before[pid]]
          result['one_second_cpu_percent'].sort(key=lambda row:row['cpu_percent_one_core'],reverse=True)
          details={}
          for row in result['top_rss'][:5]:
              data=read('/proc/'+str(row['pid'])+'/smaps_rollup',8192)
              vals={}
              for line in data.splitlines():
                  if ':' not in line:continue
                  k,v=line.split(':',1)
                  if k in ('Rss','Pss','Private_Dirty','Anonymous','Swap'):
                      vals[k]=int(v.strip().split()[0])*1024
              details[str(row['pid'])]=vals
          result['top_memory_breakdown_bytes']=details
          print(json.dumps(result,sort_keys=True,separators=(',',':')))
          PY
          python3 - <<'PY'
          import json
          x=json.load(open('evidence/resources.json'))
          assert x['status']=='READ_ONLY' and x['real_orders_sent']==0
          print('RC6_624_RESOURCE_CENSUS=READ_ONLY|free='+str(x['disk']['free_bytes'])+
                '|mem_available='+str(x['meminfo_bytes']['MemAvailable'])+
                '|processes='+str(x['process_count']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-624-resource-census-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
