name: RC6 A3 historical background

on:
  push:
    branches: [candidate/v17.0.0-rc6-weekend-20260905]
    paths:
      - 'ew_a3_history_rc6.py'
      - 'ex_a3_history_job_rc6.py'
      - 'tests/test_a3_history_rc6.py'
      - 'systemd/porota-a3-history-rc6@.service'
      - 'systemd/porota-a3-history-*-rc6.timer'
      - '.github/workflows/rc6-a3-history.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0
      - run: git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - run: python -m py_compile ew_a3_history_rc6.py ex_a3_history_job_rc6.py cz_a3_cem_public_history_hf6.py db_a3_cem_normalizer_hf6.py
      - run: python -m pytest -q tests/test_a3_history_rc6.py tests/test_a3_cem_public_history_hf6.py tests/test_a3_primary_readonly_hf6.py
      - name: Prove no order routing and intended cadence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'execution_allowed.*False' ew_a3_history_rc6.py
          ! grep -Eq 'send_order|new_order|replace_order|cancel_order' ew_a3_history_rc6.py ex_a3_history_job_rc6.py
          grep -q 'DAILY_INCREMENTAL' systemd/porota-a3-history-daily-rc6.timer
          grep -q 'RECONCILE' systemd/porota-a3-history-reconcile-rc6.timer
          grep -q 'WEEKEND_DEEP' systemd/porota-a3-history-weekend-rc6.timer
          grep -q 'America/Argentina/Buenos_Aires' systemd/porota-a3-history-daily-rc6.timer
          grep -q 'Persistent=true' systemd/porota-a3-history-daily-rc6.timer
