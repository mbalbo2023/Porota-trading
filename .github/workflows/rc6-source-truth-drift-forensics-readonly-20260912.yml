name: RC6 Source Truth Drift Forensics Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-source-truth-drift-forensics-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect source-truth unit provenance and drift
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo "HOST_SHA=$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          echo '=== SAFETY ==='
          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3,json
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True,timeout=20);c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0];r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone();c.close()
          print(json.dumps({'quick_check':q,'mode':r[0],'session':r[1],'real_orders_sent':r[2]},sort_keys=True))
          assert q=='ok' and r[0]=='PRODUCTION_PAPER' and int(r[2] or 0)==0
          PY
          echo '=== CURRENT UNIT STATE ==='
          for u in porota-source-truth-rc6.timer porota-source-truth-rc6.service; do
            echo "UNIT=$u"
            sudo -n systemctl is-active "$u" 2>&1 || true
            sudo -n systemctl is-enabled "$u" 2>&1 || true
            sudo -n systemctl status "$u" --no-pager -l 2>&1 | head -n 80 || true
            sudo -n systemctl cat "$u" --no-pager 2>&1 | head -n 160 || true
          done
          echo '=== UNIT FILE SEARCH ==='
          sudo -n find /etc/systemd/system /usr/lib/systemd/system /lib/systemd/system -maxdepth 3 -type f \( -iname '*source*truth*' -o -iname '*porota*truth*' \) -print 2>/dev/null | sort || true
          echo '=== LOCAL SCRIPT SEARCH ==='
          sudo -n find /usr/local/sbin /usr/local/bin /usr/local/lib -maxdepth 4 -type f \( -iname '*source*truth*' -o -iname '*porota*truth*' \) -print 2>/dev/null | sort || true
          echo '=== REPO REFERENCES ==='
          git -C "$ROOT" grep -n -I -E 'source[-_ ]truth|SOURCE_TRUTH|porota-source-truth' HEAD -- . ':!data' 2>/dev/null | head -n 220 || true
          echo '=== JOURNAL REFERENCES ==='
          sudo -n journalctl --no-pager -l --since '2026-09-08 00:00:00' 2>/dev/null | grep -Ei 'porota-source-truth|source[-_ ]truth' | tail -n 220 || true
          echo '=== SYSTEMD KNOWN POROTA TIMERS ==='
          sudo -n systemctl list-timers --all --no-pager | grep -E 'porota-.*rc6' || true
          echo 'MUTATIONS=NONE'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          HOST
