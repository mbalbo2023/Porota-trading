name: RC6 cauciones official transactional deploy 2026-09-07
on:
  push:
    branches: [hotfix/rc6-cauciones-official-live-20260907]
    paths:
      - '.github/workflows/rc6-cauciones-postclose-deploy-20260907.yml'
permissions:
  contents: read
concurrency:
  group: porota-rc6-cauciones-postclose
  cancel-in-progress: false
env:
  BASE_LIVE_SHA: aaeb09dc74414140c252d91199abe024a67e995b
  BASE_LIVE_BRANCH: hotfix/rc6-scalping-intraday-contract-20260907
  TARGET_BRANCH: hotfix/rc6-cauciones-official-live-20260907
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest fastapi requests
      - name: Exact lineage and narrow diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_LIVE_SHA" HEAD
          python - <<'PY'
          import subprocess
          base='aaeb09dc74414140c252d91199abe024a67e995b'
          allowed={
            'bd_ppi_readonly_guard.py',
            'tests/test_rc6_cauciones_official_contract.py',
            '.github/workflows/rc6-cauciones-postclose-deploy-20260907.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines())
          bad=changed-allowed
          assert not bad, f'UNEXPECTED_DIFF={sorted(bad)}'
          assert {'bd_ppi_readonly_guard.py','tests/test_rc6_cauciones_official_contract.py'} <= changed
          print('NARROW_DIFF=GREEN',sorted(changed))
          PY
      - name: Compile and focused tests
        run: |
          python -m py_compile bd_ppi_readonly_guard.py
          python -m pytest -q tests/test_rc6_cauciones_official_contract.py
      - name: Build and safety regression
        run: |
          docker build --pull=false --label "porota.commit=${GITHUB_SHA}" --label porota.version=17.0.0-rc6 -t porota-cauciones:${GITHUB_SHA} .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1777 --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 -e PYTHONDONTWRITEBYTECODE=1 -e ENVIRONMENT=SANDBOX -e DB_PATH=/tmp/porota-ci.db -e TELEGRAM_CHAT_ID=0 -e STARTUP_REQUIRE_AUTH=false --entrypoint python porota-cauciones:${GITHUB_SHA} -m pytest -q -p no:cacheprovider tests/test_rc6_cauciones_official_contract.py tests/test_rc6_t1_settlement_hotfix.py tests/test_rc6_us_underlying_holiday.py tests/test_intraday_contract_policy_rc6.py tests/test_intraday_scalping_rc6_integration.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_cauciones"
          chmod 600 "$HOME/.ssh/porota_cauciones"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Activate observer-only with rollback
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_cauciones" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$USER@$HOST" "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' BASE_LIVE_SHA='$BASE_LIVE_SHA' BASE_LIVE_BRANCH='$BASE_LIVE_BRANCH' bash -s" <<'HOST'
          set -Eeuo pipefail
          umask 077
          REPO=/opt/porota-trading
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          CANDIDATE_IMAGE="porota-trading-bot:rc6-cauciones-${TARGET_SHA:0:12}"
          ROLLBACK_IMAGE="porota-trading-bot:rc6-cauciones-rollback-${BASE_LIVE_SHA:0:12}"
          SECRET="$REPO/.secrets/ppi_production.json"
          RUNTIME_ENV="$REPO/data/diagnosticos/observer_runtime_v17.env"
          WT=''; TMP=''; ACTIVATED=0
          dashboard_id="$(sudo -n docker inspect -f '{{.Id}}' porota_production_dashboard)"
          dashboard_state="$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)"
          verify(){
            local label="$1"
            test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.Config.Image}}|{{.RestartCount}}|{{.HostConfig.ReadonlyRootfs}}' porota_production_observer)" = "true|$TARGET_IMAGE|0|true"
            test "$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$label"
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import os,sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=30);c.execute('PRAGMA query_only=ON')
          assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone();c.close()
          assert mode=='PRODUCTION_PAPER' and int(orders)==0
          assert os.getenv('PAPER_T1_FULL_DATE_RELEASE')=='true'
          print('OBSERVER_SAFETY=GREEN')
          PY
          }
          rollback(){
            sudo -n docker rm -f porota_production_observer >/dev/null 2>&1 || true
            sudo -n docker tag "$ROLLBACK_IMAGE" "$TARGET_IMAGE"
            git -C "$REPO" checkout -f -B "$BASE_LIVE_BRANCH" "$BASE_LIVE_SHA"
            sudo -n docker run -d --name porota_production_observer --pull never --restart unless-stopped --no-healthcheck --user botuser --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=32m -e PPI_PRODUCTION_SECRET_FILE=/run/secrets/ppi_production.json -e PAPER_DB_PATH=/app/data/paper_v17/observer_v17.db -e PAPER_T1_FULL_DATE_RELEASE=true -e MARKET_OPEN_HOUR=10 -e MARKET_OPEN_MINUTE=30 -e MARKET_CLOSE_HOUR=17 -e MARKET_CLOSE_MINUTE=0 -e PAPER_PREOPEN_MINUTES=15 -e PPI_LOGIN_COOLDOWN_SECONDS=900 -e PPI_HISTORY_BATCH_LIMIT=40 -e DATA_DIR=/app/data -e SERVER_TIMEZONE=America/Argentina/Buenos_Aires --env-file "$RUNTIME_ENV" -v "$REPO/data:/app/data" -v "$SECRET:/run/secrets/ppi_production.json:ro" --entrypoint python "$TARGET_IMAGE" bv_paper_runtime.py >/dev/null
            sleep 8; verify "$BASE_LIVE_SHA"
            echo CAUCIONES_ROLLBACK=GREEN
          }
          cleanup(){ [ -z "$WT" ] || git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true; [ -z "$TMP" ] || rmdir "$TMP" >/dev/null 2>&1 || true; }
          onexit(){ rc=$?; if [ "$rc" -ne 0 ] && [ "$ACTIVATED" -eq 1 ]; then rollback || true; fi; cleanup; exit "$rc"; }
          trap onexit EXIT
          test "$(git -C "$REPO" branch --show-current)" = "$BASE_LIVE_BRANCH"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$BASE_LIVE_SHA"
          test "$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$BASE_LIVE_SHA"
          test -f "$SECRET" && test -f "$RUNTIME_ENV"
          git -C "$REPO" diff --quiet && git -C "$REPO" diff --cached --quiet
          verify "$BASE_LIVE_SHA"
          current_id="$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{.Id}}')"; sudo -n docker tag "$current_id" "$ROLLBACK_IMAGE"
          git -C "$REPO" fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git -C "$REPO" rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git -C "$REPO" merge-base --is-ancestor "$BASE_LIVE_SHA" "$TARGET_SHA"
          TMP="$(mktemp -d "$HOME/porota-cauciones.XXXXXX")"; WT="$TMP/source"; git -C "$REPO" worktree add --detach "$WT" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label porota.version=17.0.0-rc6 -t "$CANDIDATE_IMAGE" "$WT"
          sudo -n docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777 --entrypoint python "$CANDIDATE_IMAGE" - <<'PY'
          import _version,bd_ppi_readonly_guard as m
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED' and _version.EXECUTION=='SIMULATED'
          assert m.DEFAULT_CAUCION_DISCOVERY_DAYS==(1,2,7,30,120)
          assert m._POST_PATHS=={'/api/1.0/account/loginapi','/api/1.0/account/refreshtoken'}
          for name in ('order_budget','budget','send_order','place_order','cancel_order','order'):
              assert not hasattr(m.ProductionMarketReader,name)
          print('CAUCIONES_REMOTE_CANDIDATE=GREEN')
          PY
          sudo -n docker tag "$CANDIDATE_IMAGE" "$TARGET_IMAGE"
          sudo -n docker rm -f porota_production_observer >/dev/null
          ACTIVATED=1
          sudo -n docker run -d --name porota_production_observer --pull never --restart unless-stopped --no-healthcheck --user botuser --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=32m -e PPI_PRODUCTION_SECRET_FILE=/run/secrets/ppi_production.json -e PAPER_DB_PATH=/app/data/paper_v17/observer_v17.db -e PAPER_T1_FULL_DATE_RELEASE=true -e MARKET_OPEN_HOUR=10 -e MARKET_OPEN_MINUTE=30 -e MARKET_CLOSE_HOUR=17 -e MARKET_CLOSE_MINUTE=0 -e PAPER_PREOPEN_MINUTES=15 -e PPI_LOGIN_COOLDOWN_SECONDS=900 -e PPI_HISTORY_BATCH_LIMIT=40 -e DATA_DIR=/app/data -e SERVER_TIMEZONE=America/Argentina/Buenos_Aires --env-file "$RUNTIME_ENV" -v "$REPO/data:/app/data" -v "$SECRET:/run/secrets/ppi_production.json:ro" --entrypoint python "$TARGET_IMAGE" bv_paper_runtime.py >/dev/null
          sleep 10; verify "$TARGET_SHA"
          git -C "$REPO" checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          test "$(sudo -n docker inspect -f '{{.Id}}' porota_production_dashboard)" = "$dashboard_id"
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)" = "$dashboard_state"
          curl -fsS http://127.0.0.1:8000/health | python3 -c "import sys,json; assert json.load(sys.stdin).get('status')=='ok'"
          ACTIVATED=0
          sudo -n docker image rm "$ROLLBACK_IMAGE" "$CANDIDATE_IMAGE" >/dev/null 2>&1 || true
          echo CAUCIONES_POSTCLOSE_DEPLOY=GREEN
          echo TARGET_SHA=$TARGET_SHA
          echo REAL_ORDERS_SENT=0
          echo DASHBOARD_UNCHANGED=YES
          HOST
