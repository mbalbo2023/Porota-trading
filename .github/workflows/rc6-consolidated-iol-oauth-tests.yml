name: RC6 Consolidated IOL OAuth Tests 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-iol-20261001
    paths:
      - 'iol_mcp_readonly_adapter_rc6.py'
      - 'scripts/rc6_iol_oauth_health.py'
      - 'systemd/porota-iol-oauth-health-rc6.service'
      - 'systemd/porota-iol-oauth-health-rc6.timer'
      - 'tests/test_iol_mcp_oauth_refresh_rc6.py'
      - 'tests/test_rc6_iol_oauth_health.py'
      - '.github/workflows/rc6-consolidated-iol-oauth-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install focal test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m py_compile iol_mcp_readonly_adapter_rc6.py scripts/rc6_iol_oauth_health.py
      - name: Run OAuth focal tests
        run: python -m pytest -q tests/test_iol_mcp_oauth_refresh_rc6.py tests/test_rc6_iol_oauth_health.py
      - name: Guard PAPER-only source scope
        run: |
          set -Eeuo pipefail
          grep -q 'FORBIDDEN_ACCOUNT_OR_EXECUTION_TOOLS' iol_mcp_readonly_adapter_rc6.py
          grep -q 'real_order_routes.*NOT_PRESENT' scripts/rc6_iol_oauth_health.py
