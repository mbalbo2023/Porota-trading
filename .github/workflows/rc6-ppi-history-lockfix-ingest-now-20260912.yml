name: RC6 PPI history lockfix and ingest now 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-lockfix-ingest-now-20260912.yml']

permissions:
  contents: read

jobs:
  repair-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Repair lock permission and ingest pending local PPI history
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          SERVICE=porota-ppi-argentina-nightly-rc6.service
          TIMER=porota-ppi-argentina-nightly-rc6.timer
          LOCK=/run/lock/porota-ppi-fullfamily-history.lock
          HOST_SHA_START="$(git rev-parse HEAD)"
          echo "HOST_SHA_START=$HOST_SHA_START"

          echo '=== PRE_SAFETY ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import bf_production_paper_observer as m
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          print('QUICK_CHECK='+str(c.execute('pragma quick_check').fetchone()[0]))
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print('SAFETY=%s|%s'%s)
          print('MARKET_PHASE='+str(m._market_phase()))
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          assert m._market_phase()=='CLOSED'
          c.close()
          PY

          echo '=== CONCURRENCY_PREFLIGHT ==='
          for u in porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            state="$(systemctl is-active "$u" 2>/dev/null || true)"
            echo "CONFLICT_UNIT=$u|STATE=$state"
            case "$state" in active|activating) echo "ABORT=CONCURRENT_HISTORY_SERVICE:$u"; exit 40;; esac
          done

          echo '=== LOCK_RCA_AND_REPAIR ==='
          echo "SERVICE_USER_RAW=$(systemctl show "$SERVICE" -p User --value 2>/dev/null || true)"
          echo "SERVICE_GROUP_RAW=$(systemctl show "$SERVICE" -p Group --value 2>/dev/null || true)"
          sudo -n ls -ld /run /run/lock || true
          sudo -n ls -l "$LOCK" 2>/dev/null || true
          sudo -n stat -c 'LOCK_BEFORE=%F|%U:%G|%a|%n' "$LOCK" 2>/dev/null || true
          if sudo -n test -L "$LOCK"; then
            echo 'ABORT=LOCK_IS_SYMLINK'
            exit 41
          fi
          if sudo -n test -e "$LOCK"; then
            if ! sudo -n flock -n "$LOCK" -c 'true'; then
              echo 'ABORT=LOCK_BUSY'
              exit 42
            fi
          fi
          unit_user="$(systemctl show "$SERVICE" -p User --value 2>/dev/null || true)"
          [ -n "$unit_user" ] || unit_user=root
          unit_group="$(systemctl show "$SERVICE" -p Group --value 2>/dev/null || true)"
          if [ -z "$unit_group" ]; then unit_group="$(id -gn "$unit_user")"; fi
          sudo -n rm -f "$LOCK"
          sudo -n install -o "$unit_user" -g "$unit_group" -m 0660 /dev/null "$LOCK"
          sudo -n stat -c 'LOCK_AFTER=%F|%U:%G|%a|%n' "$LOCK"
          sudo -n -u "$unit_user" bash -c "exec 9>'$LOCK'; flock -n 9; echo LOCK_OPEN_AS_SERVICE_USER=GREEN"
          echo 'LOCK_FIX=GREEN'

          pending_now() {
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          nightly=bool(c.execute("select count(*) from sqlite_master where type='table' and name='ppi_argentina_nightly_history_attempts'").fetchone()[0])
          if nightly:
              q='''SELECT COUNT(*) FROM ppi_argentina_api_shadow s
              LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement
              LEFT JOIN ppi_argentina_nightly_history_attempts n ON n.ticker=s.ticker AND n.instrument_type=s.instrument_type AND n.market=s.market AND n.currency=s.currency AND n.settlement=s.settlement
              WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR')
                AND COALESCE(n.state,p.state) IS NULL'''
          else:
              q='''SELECT COUNT(*) FROM ppi_argentina_api_shadow s
              LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement
              WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR')
                AND p.state IS NULL'''
          print(c.execute(q).fetchone()[0])
          c.close()
          PY
          }

          echo '=== INGEST_NOW ==='
          sudo -n systemctl reset-failed "$SERVICE" || true
          BEFORE="$(pending_now | tail -n1)"
          echo "PENDING_BEFORE=$BEFORE"
          test "$BEFORE" -gt 0 || { echo 'INGEST_STATUS=NO_PENDING'; exit 0; }

          for pass in 1 2; do
            CUR="$(pending_now | tail -n1)"
            echo "PASS_${pass}_PENDING_BEFORE=$CUR"
            [ "$CUR" -gt 0 ] || break
            if [ "$(git rev-parse HEAD)" != "$HOST_SHA_START" ]; then
              echo 'ABORT=HOST_SHA_MOVED_DURING_INGEST'
              exit 43
            fi
            for u in porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
              state="$(systemctl is-active "$u" 2>/dev/null || true)"
              case "$state" in active|activating) echo "ABORT=CONCURRENT_HISTORY_SERVICE:$u"; exit 44;; esac
            done
            sudo -n systemctl reset-failed "$SERVICE" || true
            echo "PASS_${pass}_START=$(date -u +%FT%TZ)"
            sudo -n systemctl start "$SERVICE"
            result="$(systemctl show "$SERVICE" -p Result --value)"
            status="$(systemctl show "$SERVICE" -p ExecMainStatus --value)"
            echo "PASS_${pass}_RESULT=$result|STATUS=$status|END=$(date -u +%FT%TZ)"
            test "$result" = success
            test "$status" = 0
            AFTER="$(pending_now | tail -n1)"
            echo "PASS_${pass}_PENDING_AFTER=$AFTER"
            if [ "$AFTER" -ge "$CUR" ]; then
              echo "ABORT=NO_PENDING_PROGRESS|BEFORE=$CUR|AFTER=$AFTER"
              exit 45
            fi
          done

          echo '=== FINAL_DELTA ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          nightly=bool(c.execute("select count(*) from sqlite_master where type='table' and name='ppi_argentina_nightly_history_attempts'").fetchone()[0])
          state_expr='COALESCE(n.state,p.state)' if nightly else 'p.state'
          join="""LEFT JOIN ppi_argentina_nightly_history_attempts n
            ON n.ticker=s.ticker AND n.instrument_type=s.instrument_type
           AND n.market=s.market AND n.currency=s.currency AND n.settlement=s.settlement""" if nightly else ''
          q=f'''SELECT s.instrument_type,COUNT(*),
            SUM(CASE WHEN {state_expr} IS NOT NULL THEN 1 ELSE 0 END),
            SUM(CASE WHEN {state_expr} IN ('VALID_PAYLOAD','PARTIAL') THEN 1 ELSE 0 END),
            SUM(CASE WHEN {state_expr} IN ('EMPTY_OR_INVALID','ERROR') THEN 1 ELSE 0 END),
            SUM(CASE WHEN {state_expr} IS NULL THEN 1 ELSE 0 END)
            FROM ppi_argentina_api_shadow s
            LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement
            {join}
            WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR')
            GROUP BY s.instrument_type ORDER BY s.instrument_type'''
          rows=list(c.execute(q))
          totals=[sum(int(r[i] or 0) for r in rows) for i in range(1,6)]
          for r in rows:
              print('FAMILY_DELTA=%s|TOTAL=%s|ATTEMPTED=%s|USABLE=%s|HARD=%s|PENDING=%s'%r)
          print('TOTAL_DELTA=API:%d|ATTEMPTED:%d|USABLE:%d|HARD:%d|PENDING:%d'%tuple(totals))
          if nightly:
              print('NIGHTLY_IDENTITIES='+str(c.execute('select count(*) from ppi_argentina_nightly_history_attempts').fetchone()[0]))
              for r in c.execute("select instrument_type,count(*),sum(case when state in ('VALID_PAYLOAD','PARTIAL') then 1 else 0 end),sum(case when state='EMPTY_OR_INVALID' then 1 else 0 end),sum(case when state='ERROR' then 1 else 0 end),sum(valid_rows) from ppi_argentina_nightly_history_attempts group by instrument_type order by instrument_type"):
                  print('NIGHTLY_FAMILY=%s|TESTED=%s|USABLE=%s|EMPTY=%s|ERROR=%s|VALID_ROWS=%s'%r)
          print('SAFETY=%s|%s'%s)
          c.close()
          PY

          echo '=== FINAL_SERVICE_AND_TIMER ==='
          systemctl show "$SERVICE" -p Result -p ExecMainStatus --no-pager
          echo "TIMER_ENABLED=$(systemctl is-enabled "$TIMER" 2>/dev/null || true)"
          echo "TIMER_ACTIVE=$(systemctl is-active "$TIMER" 2>/dev/null || true)"
          echo '=== LAST_HISTORY_JOURNAL ==='
          sudo -n journalctl -u "$SERVICE" --since '20 minutes ago' --no-pager -o short-iso -n 120 | grep -E 'ARG_NIGHTLY|READER_METRICS|SCOPE=|REAL_ORDERS_SENT|ORDER_ROUTES|SKIP=|Failed|failed|Finished|Started' || true
          echo 'HOST_MUTATION=LOCK_PERMISSION_ONLY_PLUS_HISTORY_DATA'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDERS_SENT=0'
          HOST
