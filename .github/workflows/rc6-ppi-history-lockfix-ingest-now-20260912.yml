name: RC6 PPI history lockfix and ingest now 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-lockfix-ingest-now-20260912.yml']

permissions:
  contents: read

jobs:
  repair-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Repair lock path and ingest pending local PPI history
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          SERVICE=porota-ppi-argentina-nightly-rc6.service
          TIMER=porota-ppi-argentina-nightly-rc6.timer
          SCRIPT=/usr/local/sbin/porota-ppi-argentina-nightly-rc6.sh
          OLD_LOCK=/run/lock/porota-ppi-fullfamily-history.lock
          NEW_DIR=/run/porota-trading-history
          NEW_LOCK=/run/porota-trading-history/ppi-fullfamily-history.lock
          HOST_SHA_START="$(git rev-parse HEAD)"
          echo "HOST_SHA_START=$HOST_SHA_START"

          echo '=== PRE_SAFETY ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import bf_production_paper_observer as m
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          qc=c.execute('pragma quick_check').fetchone()[0]
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print('QUICK_CHECK='+str(qc)); print('SAFETY=%s|%s'%s); print('MARKET_PHASE='+str(m._market_phase()))
          assert qc=='ok' and s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0 and m._market_phase()=='CLOSED'
          c.close()
          PY

          echo '=== CONCURRENCY_PREFLIGHT ==='
          for u in porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            state="$(systemctl is-active "$u" 2>/dev/null || true)"
            echo "CONFLICT_UNIT=$u|STATE=$state"
            case "$state" in active|activating) echo "ABORT=CONCURRENT_HISTORY_SERVICE:$u"; exit 40;; esac
          done
          if sudo -n fuser "$OLD_LOCK" >/tmp/old_lock_holders 2>/dev/null; then
            echo "ABORT=OLD_LOCK_HAS_HOLDERS|PIDS=$(cat /tmp/old_lock_holders)"
            exit 41
          fi

          echo '=== PERMANENT_LOCK_PATH_FIX ==='
          test -r "$SCRIPT"
          grep -Fq 'exec 9>/run/lock/porota-ppi-fullfamily-history.lock' "$SCRIPT" || {
            grep -Fq 'exec 9>"/run/porota-trading-history/ppi-fullfamily-history.lock"' "$SCRIPT" || {
              echo 'ABORT=UNEXPECTED_SCRIPT_LOCK_STANZA'; exit 42;
            }
          }
          BACKUP="/var/backups/porota-ppi-history-lockfix-$(date -u +%Y%m%dT%H%M%SZ).sh"
          sudo -n cp -a "$SCRIPT" "$BACKUP"
          echo "SCRIPT_BACKUP=$BACKUP"
          if grep -Fq 'exec 9>/run/lock/porota-ppi-fullfamily-history.lock' "$SCRIPT"; then
            sudo -n python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          old='''set -Eeuo pipefail\nexec 9>/run/lock/porota-ppi-fullfamily-history.lock\nflock -n 9 || { echo 'SKIP=PPI_HISTORY_LOCK_BUSY'; exit 0; }\n'''
          new='''set -Eeuo pipefail\nLOCK_DIR=/run/porota-trading-history\ninstall -d -o root -g root -m 0755 "$LOCK_DIR"\nexec 9>"$LOCK_DIR/ppi-fullfamily-history.lock"\nflock -n 9 || { echo 'SKIP=PPI_HISTORY_LOCK_BUSY'; exit 0; }\n'''
          if old not in s:
              raise SystemExit('LOCK_STANZA_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          fi
          sudo -n bash -n "$SCRIPT"
          sudo -n rm -rf "$NEW_DIR"
          sudo -n install -d -o root -g root -m 0755 "$NEW_DIR"
          sudo -n bash -c "exec 9>'$NEW_LOCK'; flock -n 9; echo LOCK_OPEN_ROOT=GREEN"
          grep -n -E 'LOCK_DIR|exec 9>' "$SCRIPT" | head -n 5
          echo 'LOCK_FIX=GREEN'

          pending_now() {
            sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          nightly=bool(c.execute("select count(*) from sqlite_master where type='table' and name='ppi_argentina_nightly_history_attempts'").fetchone()[0])
          if nightly:
              q='''SELECT COUNT(*) FROM ppi_argentina_api_shadow s
              LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement
              LEFT JOIN ppi_argentina_nightly_history_attempts n ON n.ticker=s.ticker AND n.instrument_type=s.instrument_type AND n.market=s.market AND n.currency=s.currency AND n.settlement=s.settlement
              WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR') AND COALESCE(n.state,p.state) IS NULL'''
          else:
              q='''SELECT COUNT(*) FROM ppi_argentina_api_shadow s
              LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement
              WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR') AND p.state IS NULL'''
          print(c.execute(q).fetchone()[0]); c.close()
          PY
          }

          echo '=== INGEST_NOW ==='
          BEFORE="$(pending_now | tail -n1)"
          echo "PENDING_BEFORE=$BEFORE"
          test "$BEFORE" -gt 0 || { echo 'INGEST_STATUS=NO_PENDING'; exit 0; }
          for pass in 1 2; do
            CUR="$(pending_now | tail -n1)"
            echo "PASS_${pass}_PENDING_BEFORE=$CUR"
            [ "$CUR" -gt 0 ] || break
            test "$(git rev-parse HEAD)" = "$HOST_SHA_START" || { echo 'ABORT=HOST_SHA_MOVED_DURING_INGEST'; exit 43; }
            for u in porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
              state="$(systemctl is-active "$u" 2>/dev/null || true)"
              case "$state" in active|activating) echo "ABORT=CONCURRENT_HISTORY_SERVICE:$u"; exit 44;; esac
            done
            sudo -n systemctl reset-failed "$SERVICE" || true
            echo "PASS_${pass}_START=$(date -u +%FT%TZ)"
            sudo -n systemctl start "$SERVICE"
            result="$(systemctl show "$SERVICE" -p Result --value)"
            status="$(systemctl show "$SERVICE" -p ExecMainStatus --value)"
            echo "PASS_${pass}_RESULT=$result|STATUS=$status|END=$(date -u +%FT%TZ)"
            test "$result" = success && test "$status" = 0
            AFTER="$(pending_now | tail -n1)"
            echo "PASS_${pass}_PENDING_AFTER=$AFTER"
            [ "$AFTER" -lt "$CUR" ] || { echo "ABORT=NO_PENDING_PROGRESS|BEFORE=$CUR|AFTER=$AFTER"; exit 45; }
          done

          echo '=== FINAL_DELTA ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          nightly=bool(c.execute("select count(*) from sqlite_master where type='table' and name='ppi_argentina_nightly_history_attempts'").fetchone()[0])
          e='COALESCE(n.state,p.state)' if nightly else 'p.state'
          j="""LEFT JOIN ppi_argentina_nightly_history_attempts n ON n.ticker=s.ticker AND n.instrument_type=s.instrument_type AND n.market=s.market AND n.currency=s.currency AND n.settlement=s.settlement""" if nightly else ''
          q=f'''SELECT s.instrument_type,COUNT(*),SUM(CASE WHEN {e} IS NOT NULL THEN 1 ELSE 0 END),SUM(CASE WHEN {e} IN ('VALID_PAYLOAD','PARTIAL') THEN 1 ELSE 0 END),SUM(CASE WHEN {e} IN ('EMPTY_OR_INVALID','ERROR') THEN 1 ELSE 0 END),SUM(CASE WHEN {e} IS NULL THEN 1 ELSE 0 END) FROM ppi_argentina_api_shadow s LEFT JOIN production_history_attempts p ON p.symbol=s.ticker AND p.instrument_type=s.instrument_type AND p.settlement=s.settlement {j} WHERE s.market IN ('BYMA','ROFEX','A3','OTC') AND s.instrument_type NOT IN ('ACCIONES-USA','FCI-EXTERIOR') GROUP BY s.instrument_type ORDER BY s.instrument_type'''
          rows=list(c.execute(q)); totals=[sum(int(r[i] or 0) for r in rows) for i in range(1,6)]
          for r in rows: print('FAMILY_DELTA=%s|TOTAL=%s|ATTEMPTED=%s|USABLE=%s|HARD=%s|PENDING=%s'%r)
          print('TOTAL_DELTA=API:%d|ATTEMPTED:%d|USABLE:%d|HARD:%d|PENDING:%d'%tuple(totals))
          if nightly:
              print('NIGHTLY_IDENTITIES='+str(c.execute('select count(*) from ppi_argentina_nightly_history_attempts').fetchone()[0]))
              for r in c.execute("select instrument_type,count(*),sum(case when state in ('VALID_PAYLOAD','PARTIAL') then 1 else 0 end),sum(case when state='EMPTY_OR_INVALID' then 1 else 0 end),sum(case when state='ERROR' then 1 else 0 end),sum(valid_rows) from ppi_argentina_nightly_history_attempts group by instrument_type order by instrument_type"):
                  print('NIGHTLY_FAMILY=%s|TESTED=%s|USABLE=%s|EMPTY=%s|ERROR=%s|VALID_ROWS=%s'%r)
          print('SAFETY=%s|%s'%s); c.close()
          PY
          echo "TIMER_ENABLED=$(systemctl is-enabled "$TIMER" 2>/dev/null || true)"
          echo "TIMER_ACTIVE=$(systemctl is-active "$TIMER" 2>/dev/null || true)"
          sudo -n journalctl -u "$SERVICE" --since '100 minutes ago' --no-pager -o short-iso -n 160 | grep -E 'ARG_NIGHTLY|READER_METRICS|SCOPE=|REAL_ORDERS_SENT|ORDER_ROUTES|SKIP=|Failed|failed|Finished|Started' || true
          echo 'HOST_MUTATION=LOCK_PATH_FIX_PLUS_HISTORY_DATA'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDERS_SENT=0'
          HOST
