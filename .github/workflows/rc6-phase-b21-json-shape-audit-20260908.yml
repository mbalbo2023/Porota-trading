name: RC6 Phase B2.1 JSON Shape Audit 2026-09-08

on:
  push:
    branches: [audit/rc6-phase-b21-json-shape-20260908]
    paths:
      - '.github/workflows/rc6-phase-b21-json-shape-audit-20260908.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_phase_b21"
          chmod 600 "$HOME/.ssh/porota_phase_b21"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Phase B2.1 read-only JSON shape inspection
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_phase_b21" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/porota-trading
          echo '=== POROTA RC6 PHASE B2.1 JSON SHAPE AUDIT — READ ONLY ==='
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HEAD=$(git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3, json, collections
          DB='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+DB+'?mode=ro', uri=True)
          c.execute('pragma query_only=on')
          c.execute('pragma temp_store=memory')
          print('QUICK_CHECK='+str(c.execute('pragma quick_check').fetchone()[0]))
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'MODE={mode}')
          print(f'REAL_ORDERS_SENT={real}')
          assert mode=='PRODUCTION_PAPER' and int(real)==0

          root_types=collections.Counter(); top_keys=collections.Counter(); key_type=collections.Counter()
          depth_counts=collections.Counter(); list_paths=collections.Counter(); list_item_types=collections.Counter()
          dict_paths=collections.Counter(); scalar_paths=collections.Counter(); quality=collections.Counter(); origin=collections.Counter()
          payloads=0; parse_errors=0

          def walk(x,path='$',depth=0):
              depth_counts[depth]+=1
              if isinstance(x,dict):
                  dict_paths[path]+=1
                  for k,v in x.items():
                      kp=f'{path}.{k}'
                      key_type[(kp,type(v).__name__)]+=1
                      walk(v,kp,depth+1)
              elif isinstance(x,list):
                  list_paths[path]+=1
                  if x:
                      kinds=tuple(sorted(set(type(v).__name__ for v in x[:50])))
                      list_item_types[(path,','.join(kinds))]+=1
                  for v in x[:3]:
                      walk(v,path+'[]',depth+1)
              else:
                  scalar_paths[path]+=1

          for o,q,b in c.execute('select origin,quality,body_json from historical_raw_archive order by id'):
              payloads+=1; quality[str(q)]+=1; origin[str(o)]+=1
              try:
                  obj=json.loads(b)
              except Exception:
                  parse_errors+=1; continue
              root_types[type(obj).__name__]+=1
              if isinstance(obj,dict):
                  for k in obj.keys(): top_keys[str(k)]+=1
              walk(obj)

          print(f'PAYLOADS_TOTAL={payloads}')
          print(f'JSON_PARSE_ERRORS={parse_errors}')
          print('ROOT_TYPES:')
          for k,n in root_types.most_common(): print(f'ROOT|{k}|{n}')
          print('TOP_LEVEL_KEYS:')
          for k,n in top_keys.most_common(30): print(f'TOPKEY|{k}|{n}')
          print('TOP_KEY_TYPES:')
          for (p,t),n in key_type.most_common(50): print(f'KEYTYPE|COUNT={n}|TYPE={t}|PATH={p}')
          print('TOP_LIST_PATHS:')
          for p,n in list_paths.most_common(30): print(f'LISTPATH|COUNT={n}|{p}')
          print('TOP_LIST_ITEM_TYPES:')
          for (p,t),n in list_item_types.most_common(30): print(f'LISTITEM|COUNT={n}|TYPES={t}|PATH={p}')
          print('TOP_DICT_PATHS:')
          for p,n in dict_paths.most_common(30): print(f'DICTPATH|COUNT={n}|{p}')
          print('DEPTH_COUNTS:')
          for d,n in sorted(depth_counts.items()): print(f'DEPTH|{d}|{n}')
          print('QUALITY_COUNTS:')
          for q,n in quality.most_common(): print(f'QUALITY|{q}|{n}')
          print('TOP_ORIGINS:')
          for o,n in origin.most_common(20): print(f'ORIGIN|COUNT={n}|{o}')
          c.close()
          print('PAYLOAD_CONTENT_PRINTED=NO')
          print('B21_CLASSIFICATION=SHAPE_ONLY')
          print('EVIDENCE_LOST=NOT_TESTED_YET')
          PY
          echo 'MUTATIONS=NONE'
          echo 'DELETE=NOT_RUN'
          echo 'VACUUM=NOT_RUN'
          echo 'PRUNE=NOT_RUN'
          echo 'EXTERNAL_V1_ACTIVATION=NOT_PERFORMED'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE