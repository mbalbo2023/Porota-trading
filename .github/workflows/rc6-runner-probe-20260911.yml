name: RC6 Runner Probe 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-runner-probe-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu_24:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe runner
        run: |
          set -euxo pipefail
          echo RUNNER_PROBE=OK
          uname -a
  ubuntu_22:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe runner
        run: |
          set -euxo pipefail
          echo RUNNER_PROBE=OK
          uname -a
