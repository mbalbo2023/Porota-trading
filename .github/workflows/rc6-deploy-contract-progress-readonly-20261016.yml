name: RC6 Deploy Contract Progress Readonly 2026-10-16
on:
  push:
    branches: [ops/rc6-contract-progress-readonly-20261016]
    paths: ['.github/workflows/rc6-deploy-contract-progress-readonly-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Read host process and resource status only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo "UTC=$(date -u +%FT%TZ)"
          echo "MEM_AVAILABLE=$(awk '/MemAvailable:/{print $2*1024}' /proc/meminfo)"
          echo "SWAP_FREE=$(awk '/SwapFree:/{print $2*1024}' /proc/meminfo)"
          echo "DISK_FREE=$(df -PB1 / | awk 'NR==2{print $4}')"
          echo "CONTRACT_PROCESSES_BEGIN"
          ps -eo pid,ppid,etime,%cpu,%mem,stat,args --no-headers | awk '/[c]k_contract_evidence_runner_hf6.py/ {print $1,$2,$3,$4,$5,$6}' | head -10
          echo "CONTRACT_PROCESSES_END"
          echo "CONTAINERS_BEGIN"
          sudo -n docker ps --format '{{.Names}}|{{.Status}}' | grep -E 'porota|^[a-zA-Z0-9_-]+\\|Up' | head -15 || true
          echo "CONTAINERS_END"
          for name in porota_production_observer porota_production_dashboard; do
            sudo -n docker inspect -f "$name|{{.State.Status}}|OOM={{.State.OOMKilled}}|RESTARTS={{.RestartCount}}" "$name"
          done
          echo "REAL_ORDER_ROUTES=NOT_CALLED_BY_THIS_WORKFLOW"
          HOST
      - name: Sample only the contract Python stack
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --user py-spy==0.4.1
          TOOL="$HOME/.local/bin/py-spy"
          test -x "$TOOL"
          REMOTE_TOOL="/tmp/rc6-contract-pyspy-$(date +%s)-$"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$TOOL" "$DO_USER@$DO_HOST:$REMOTE_TOOL"
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' -- "$REMOTE_TOOL" <<'HOST'
          set -Eeuo pipefail
          TOOL="$1"
          trap 'rm -f "$TOOL"' EXIT
          chmod 700 "$TOOL"
          PID="$(ps -eo pid,comm,args --no-headers | awk '$2 ~ /^python/ && /[c]k_contract_evidence_runner_hf6.py/ {print $1; exit}')"
          if [ -z "$PID" ]; then echo "CONTRACT_PROCESS_NOT_ACTIVE"; exit 0; fi
          echo "CONTRACT_PID=$PID"
          sudo -n timeout 12 "$TOOL" dump --pid "$PID" --nonblocking
          HOST
      - name: Read bounded candidate readiness RCA
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json,sqlite3,time
          path='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=3)
          c.execute('PRAGMA query_only=ON')
          end=time.monotonic()+10
          c.set_progress_handler(lambda:int(time.monotonic()>end),1000)
          out={}
          out['candidate_by_family']=[list(r) for r in c.execute("SELECT instrument_type,COUNT(*),SUM(can_simulate),MAX(checked_at) FROM candidate_identity_v2 GROUP BY instrument_type ORDER BY instrument_type")]
          out['catalog_ready_by_family']=[list(r) for r in c.execute("SELECT instrument_type,COUNT(*) FROM financial_instrument_catalog WHERE status='AVAILABLE' AND capability LIKE 'READY_PAPER_%' GROUP BY instrument_type ORDER BY instrument_type")]
          out['candidate_reasons']=[list(r) for r in c.execute("SELECT substr(detail,1,100),COUNT(*) n FROM candidate_identity_v2 WHERE can_simulate=0 GROUP BY substr(detail,1,100) ORDER BY n DESC LIMIT 12")]
          out['letras']=[list(r) for r in c.execute("SELECT r.status,r.can_simulate,substr(r.detail,1,110),COUNT(*) FROM candidate_identity_v2 r WHERE r.instrument_type='LETRAS' GROUP BY r.status,r.can_simulate,substr(r.detail,1,110) ORDER BY COUNT(*) DESC LIMIT 8")]
          out['observer']=[list(r) for r in c.execute("SELECT mode,real_orders_sent,session_state,process_state,heartbeat_at FROM observer_state WHERE id=1")]
          c.close()
          print('CANDIDATE_RCA='+json.dumps(out,sort_keys=True,separators=(',',':')))
          PY
          HOST
      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/key"
