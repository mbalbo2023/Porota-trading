name: RC6 Retire Intraday AI Regression 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-retire-intraday-ai-regression-20260910.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-retirement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable RC6 identity and binding policies
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          grep -q '"PAPER_ECONOMIC_GATE_MODE": "BINDING"' porota_mode_manager.py
          grep -q '"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"' porota_mode_manager.py

      - name: Replace obsolete intraday Gemini gate regressions with RC6 OFF invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_production_paper_v1634.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def test_gemini_es_porton_critico_y_persiste_veredicto(tmp_path):')
          end = s.index('def test_gemini_descarta_modelo_retirado_y_prioriza_inventario_real():')
          replacement = '''def test_rc6_ia_intradia_esta_retirada_del_porton_operativo():
              source = Path(observer.__file__).read_text(encoding="utf-8")
              assert 'ai_gate=None, require_ai=False' in source
              assert 'ai_mode="OFF"' in source
              assert 'broker.on_quote(' in source
              assert 'gemini_gate' not in source[source.index('def run():'):]
          
          
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q tests/test_production_paper_v1634.py
          git diff --check

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Prove intraday AI retirement and canonical safety gates
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_production_paper_v1634.py::test_rc6_ia_intradia_esta_retirada_del_porton_operativo \
            tests/test_rc6_wave10_sector_binding_default.py \
            tests/test_hotfix_rc3_hf4.py::test_configuracion_desplegada_no_es_un_noop
          grep -q 'broker = broker_from_environment(store, ai_gate=None, require_ai=False,' bf_production_paper_observer.py
          grep -q 'ai_mode="OFF", context_fn=None)' bf_production_paper_observer.py
          echo INTRADAY_AI_OPERATIONAL_PATH=OFF
          echo W10_BINDING=GREEN
          echo REAL_ORDER_ROUTES=NOT_CALLED

      - name: Persist only the obsolete regression retirement
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_production_paper_v1634.py
          if git diff --cached --quiet; then
            echo NO_TEST_DELTA
          else
            git commit -m 'test(rc6): retire intraday AI gate from operational regression'
            git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
          fi

      - name: Continue integrated suite to next deterministic failure
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -x -vv --tb=short > /tmp/pytest-next.txt 2>&1
          rc=$?
          echo "PYTEST_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            grep -nE 'FAILED|ERROR|E   |AssertionError|NameError|TypeError|AttributeError|KeyError|ValueError' /tmp/pytest-next.txt | tail -n 120 || true
            tail -n 180 /tmp/pytest-next.txt || true
            exit "$rc"
          fi
          tail -n 120 /tmp/pytest-next.txt
          echo INTEGRATED_TESTS=GREEN

      - name: Reassert immutable safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo RC6_PAPER_SAFETY_FINAL=GREEN
          echo REAL_ORDER_TEST=NOT_PERFORMED
