name: RC6 History Ingestion Gap Forensics Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-history-ingestion-gap-forensics-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect history attempts and family support
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo "HOST_SHA=$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import sqlite3,json
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True,timeout=30);c.row_factory=sqlite3.Row;c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0];st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and st and st['mode']=='PRODUCTION_PAPER' and int(st['real_orders_sent'] or 0)==0
          print('SAFETY='+json.dumps({'quick_check':q,'mode':st['mode'],'session':st['session_state'],'real_orders_sent':st['real_orders_sent']},sort_keys=True))
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          candidates=[t for t in tables if 'history' in t.lower() or 'ingest' in t.lower() or 'a3' in t.lower()]
          print('OBSERVER_HISTORY_TABLES='+json.dumps(candidates,sort_keys=True))
          for t in candidates:
              cols=[r['name'] for r in c.execute('pragma table_info("'+t.replace('"','""')+'")')]
              if t in ('production_history_attempts','a3_history_state','production_history') or 'attempt' in t.lower() or 'state' in t.lower():
                  try:
                      rows=[dict(r) for r in c.execute('select * from "'+t.replace('"','""')+'" order by rowid desc limit 80')]
                  except Exception: rows=[]
                  safe=[]
                  deny=('token','secret','cookie','auth','password','credential','account')
                  for r in rows:
                      safe.append({k:v for k,v in r.items() if not any(x in k.lower() for x in deny)})
                  print('TABLE_SAMPLE='+json.dumps({'table':t,'columns':cols,'rows':safe},ensure_ascii=False,sort_keys=True,default=str))
          c.close()
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          PY
          echo '=== HISTORY SOURCE SUPPORT REFERENCES ==='
          git -C "$ROOT" grep -n -I -E 'instrument_type|ACCIONES|BONOS|CEDEARS|FUTUROS|LETRAS|OPCIONES|CAUCIONES|FCI|ACCIONES-USA|ACCIONES_USA|history_canonical_v2|market_history' HEAD -- '*.py' ':!tests' 2>/dev/null | grep -Ei 'history|histor|backfill|ingest|a3|iol|ppi' | head -n 520 || true
          echo 'MUTATIONS=NONE'
          HOST
