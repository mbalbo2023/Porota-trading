name: RC6 A179 exact restored-state frozen V2 closure

on:
  push:
    branches:
      - repair/rc6-a179-restored-state-finalize-20261029

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  complete-exact-frozen-postrestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
      RC6_A179_NATIVE_RUN: '40916351644'
      RC6_CANDIDATE: '7d62d2f4ed353231da8566a360a1179e99bcc7eb'
    steps:
      - name: Checkout exact isolated transition code
        uses: actions/checkout@v4
      - name: Checkout exact already installed product and canonical mutex
        uses: actions/checkout@v4
        with:
          ref: d961d19e55d78c68d902a14b41480344365cde1e
          path: certified-product
      - name: Verify product SHA tree, safety tests and canonical mutex code
        run: |
          set -Eeuo pipefail
          test "$(git -C certified-product rev-parse HEAD)" = d961d19e55d78c68d902a14b41480344365cde1e
          test "$(git -C certified-product rev-parse HEAD^{tree})" = 31ced11ce047bfa092f5398c13aeb37b74afd629
          test "$(sha256sum certified-product/scripts/rc6_deploy_host_mutex.py | cut -d' ' -f1)" = "$(sha256sum scripts/rc6_deploy_host_mutex.py | cut -d' ' -f1)"
          test "$(sha256sum certified-product/scripts/rc6_deploy_quiescence.py | cut -d' ' -f1)" = 0f016652f884cd27bba0e29e3128da615266d09b8bf7a0a1f9a063d1386f0fc6
          python3 -m unittest tests.test_rc6_a179_resume_validate -v
          python3 -m py_compile scripts/rc6_a179_resume_validate.py
          echo 'RC6_A179_RESTORED_TRANSITION_TESTS=GREEN'
      - name: Verify exactly failed and independent read-only prior Actions
        run: |
          set -Eeuo pipefail
          for pair in '40920287873:failure:9a6b7fc31c61106e601e16f1e790191f7df5c2ca' '40920889475:success:bdfdea2d18d937ecd643fddfcea1adb1b5be08ac' '40919271822:success:b7e3cffab7a3359bc2a138d6e1e9f2d9ac4e035f'; do
            IFS=: read -r run conclusion sha <<< "$pair"
            curl --fail --silent --show-error --connect-timeout 10 --max-time 40 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              | jq -e --arg conclusion "$conclusion" --arg sha "$sha" \
                '.status == "completed" and .conclusion == $conclusion and .head_sha == $sha and .run_attempt == 1' >/dev/null
          done
          echo 'RC6_A179_TRANSITION_PRIOR_RUNS_AND_INDEPENDENT_PROOF=EXACT'
      - name: Configure exact known host SSH
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_a179_restored"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_a179_restored" "$HOME/.ssh/known_hosts"
      - name: Read-only exact restored state preflight with expected identity-only RED
        run: |
          set -Eeuo pipefail
          timeout 240 ssh -i "$HOME/.ssh/porota_rc6_a179_restored" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode restored-readiness" \
            < scripts/rc6_a179_resume_validate.py | tee a179-restored-state-preflight.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=Path('a179-restored-state-preflight.jsonl').read_text().splitlines()
          assert len(rows)==1 and rows[0].startswith('RC6_A179_RESUME_RESTORED-READINESS=')
          j=json.loads(rows[0].split('=',1)[1])
          assert j['status']=='GREEN_READ_ONLY_PENDING_TRANSITION'
          assert j['transition']=='EXACT_EXPECTED_PENDING_MARKER_RED_ONLY'
          assert j['native_run_id']=='40916351644' and j['operator_no_go']=='HELD'
          assert j['real_orders_sent']==j['host_mutations']==j['ppi_watch_mutations']==0
          print('RC6_A179_POSTRESTORE_PREFLIGHT=EXACT_PENDING_GREEN_READ_ONLY')
          PY
      - name: Finalize exact already restored frozen image under canonical host mutex
        id: finish_restored
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          MUTEX_B64="$(base64 -w0 certified-product/scripts/rc6_deploy_host_mutex.py)"
          timeout --signal=TERM --kill-after=10s 780 ssh \
            -i "$HOME/.ssh/porota_rc6_a179_restored" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$MUTEX_B64\"))' '$DO_USER' root --attempt '$RC6_CANDIDATE' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' --phase finalize env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode finish-restored" \
            < scripts/rc6_a179_resume_validate.py | tee a179-restored-finalize.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=Path('a179-restored-finalize.jsonl').read_text().splitlines()
          expected=['RC6_A179_PHASE_TRANSITION=EXACT_EXPECTED_MARKER_RED_ONLY',
                    'RC6_A179_PHASE_SCHEDULERS=GREEN_RESTORED_VERIFIED',
                    'RC6_A179_PHASE_EMPTY_BACKUP=GREEN',
                    'RC6_A179_PHASE_FINAL_MARKER=VALIDATED_RUNTIME',
                    'RC6_A179_PHASE_NATIVE_POSTMARKER=GREEN']
          assert len(rows)==6 and all(any(r.startswith(k) for r in rows) for k in expected)
          assert rows[-1].startswith('RC6_A179_RESUME_FINISH-RESTORED=')
          j=json.loads(rows[-1].split('=',1)[1])
          assert j['status']=='VALIDATED_RUNTIME' and j['postmarker_native_preopen']=='BOTH_PAUSED_NO_GO_GREEN'
          assert j['native_run_id']=='40916351644' and j['reused_frozen_artifact'] is True
          assert j['real_orders_sent']==j['ppi_watch_mutations']==j['host_rebuilds']==j['critical_restarts']==j['backup_deleted_files']==0
          assert j['operator_no_go']=='HELD'
          print('RC6_A179_RESTORED_FROZEN_V2=VALIDATED_RUNTIME|NO_GO|PAPER0')
          PY
      - name: On failed finalize retire ONLY verified safe IDLE attempt
        if: failure() && steps.finish_restored.outcome == 'failure'
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          MUTEX_B64="$(base64 -w0 certified-product/scripts/rc6_deploy_host_mutex.py)"
          timeout 240 ssh -i "$HOME/.ssh/porota_rc6_a179_restored" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$MUTEX_B64\"))' '$DO_USER' root --attempt '$RC6_CANDIDATE' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' --phase cleanup_final env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode cleanup-forward-attempt" \
            < scripts/rc6_a179_resume_validate.py | tee a179-restored-safe-cleanup.jsonl
      - name: Independent final runtime without staged helper or host lock
        run: |
          set -Eeuo pipefail
          timeout 240 ssh -i "$HOME/.ssh/porota_rc6_a179_restored" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n env PYTHONDONTWRITEBYTECODE=1 RC6_A179_RUN_ID='$RC6_A179_NATIVE_RUN' python3 - --mode postfinal" \
            < scripts/rc6_a179_resume_validate.py | tee a179-restored-postfinal.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=Path('a179-restored-postfinal.jsonl').read_text().splitlines()
          assert len(rows)==1 and rows[0].startswith('RC6_A179_RESUME_POSTFINAL=')
          j=json.loads(rows[0].split('=',1)[1])
          assert j['status']=='VALIDATED_RUNTIME' and j['preopen_phases']=='BOTH_NATIVE_PAUSED_NO_GO_GREEN'
          assert j['native_run_id']=='40916351644' and j['real_orders_sent']==0
          assert j['operator_no_go']=='HELD' and j['host_mutations']==j['ppi_watch_mutations']==0
          print('RC6_A179_INDEPENDENT_RUNTIME=VALIDATED_RUNTIME|NO_GO|PAPER0')
          PY
      - name: Archive evidence from all stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-a179-restored-frozen-v2-closure
          path: |
            a179-restored-state-preflight.jsonl
            a179-restored-finalize.jsonl
            a179-restored-safe-cleanup.jsonl
            a179-restored-postfinal.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Wipe ephemeral SSH key from runner
        if: always()
        run: rm -f "$HOME/.ssh/porota_rc6_a179_restored"
