name: RC6 PPI Web authenticated readonly E2E 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-web-residual-scraper-20260912]
    paths: ['.github/workflows/rc6-ppi-web-auth-readonly-e2e-20260912.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-ppi-web-auth-readonly-e2e
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Authenticated browser GET-only probe
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          CE_PY=/opt/porota-contract-evidence-venv/bin/python
          SVC=porota-ppi-fullfamily-history-rc6.service

          echo "INGEST_SERVICE=$(systemctl is-active "$SVC" 2>/dev/null || true)"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro', uri=True, timeout=10)
          c.execute('PRAGMA query_only=ON')
          qc=c.execute('PRAGMA quick_check').fetchone()[0]
          row=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          print(f'SAFETY_DB={qc}|{row[0]}|{int(row[1] or 0)}')
          assert qc=='ok' and row[0]=='PRODUCTION_PAPER' and int(row[1] or 0)==0
          PY

          test -d "$PROFILE"
          test -x "$CE_PY"
          OWNER=$(sudo -n stat -c '%U' "$PROFILE")
          test -n "$OWNER" && test "$OWNER" != root
          TMP=$(mktemp -d /tmp/ppi-web-readonly-profile.XXXXXX)
          trap 'sudo -n rm -rf "$TMP"' EXIT
          sudo -n cp -a "$PROFILE"/. "$TMP"/
          sudo -n rm -f "$TMP"/SingletonLock "$TMP"/SingletonCookie "$TMP"/SingletonSocket
          sudo -n chown -R "$OWNER":"$OWNER" "$TMP"

          sudo -n -u "$OWNER" env TMP_PROFILE="$TMP" "$CE_PY" - <<'PY'
          import json, os
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          routes = [
              '/Cotizaciones/Acciones',
              '/Cotizaciones/Bonos',
              '/Cotizaciones/Opciones',
          ]
          allowed_hosts={'trading.portfoliopersonal.com','www.portfoliopersonal.com','cuenta.portfoliopersonal.com','api.portfoliopersonal.com'}
          blocked=[]
          seen=[]
          results=[]

          with sync_playwright() as p:
              ctx=p.chromium.launch_persistent_context(
                  user_data_dir=os.environ['TMP_PROFILE'],
                  executable_path='/usr/bin/google-chrome-stable',
                  headless=True,
                  args=['--no-sandbox','--disable-dev-shm-usage'],
              )
              def guard(route):
                  req=route.request
                  method=req.method.upper()
                  host=(urlparse(req.url).hostname or '').lower()
                  if method not in {'GET','HEAD','OPTIONS'}:
                      blocked.append({'method':method,'host':host,'path':urlparse(req.url).path})
                      return route.abort()
                  if host and host not in allowed_hosts and not host.endswith('.portfoliopersonal.com'):
                      # Third-party static/telemetry is unnecessary for this probe.
                      return route.abort()
                  return route.continue_()
              ctx.route('**/*', guard)
              page=ctx.pages[0] if ctx.pages else ctx.new_page()
              page.on('response', lambda r: seen.append((r.request.method, (urlparse(r.url).hostname or '').lower(), urlparse(r.url).path, r.status)))
              for path in routes:
                  url='https://trading.portfoliopersonal.com'+path
                  try:
                      resp=page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(2500)
                      u=urlparse(page.url)
                      title=page.title()[:120]
                      tables=page.locator('table').count()
                      body_len=len(page.locator('body').inner_text(timeout=5000)) if page.locator('body').count() else 0
                      authenticated=(u.hostname=='trading.portfoliopersonal.com' and '/logout' not in u.path.lower() and '/login' not in u.path.lower())
                      results.append({'requested':path,'status':resp.status if resp else None,'final_host':u.hostname,'final_path':u.path,'authenticated':authenticated,'title_nonempty':bool(title.strip()),'tables':tables,'body_text_len':body_len})
                  except Exception as exc:
                      results.append({'requested':path,'error':type(exc).__name__,'authenticated':False})
              ctx.close()

          safe_seen=[]
          for method,host,path,status in seen:
              if host.endswith('portfoliopersonal.com') and method.upper() in {'GET','HEAD','OPTIONS'}:
                  item={'method':method,'host':host,'path':path,'status':status}
                  if item not in safe_seen:
                      safe_seen.append(item)
                  if len(safe_seen)>=30:
                      break
          print('PPI_WEB_RESULTS='+json.dumps(results,ensure_ascii=False,sort_keys=True))
          print('PPI_WEB_GET_ENDPOINTS='+json.dumps(safe_seen,ensure_ascii=False,sort_keys=True))
          print('BLOCKED_MUTATING_REQUESTS='+str(len(blocked)))
          print('BLOCKED_MUTATING_METHODS='+json.dumps(sorted(set(x['method'] for x in blocked))))
          ok=sum(1 for r in results if r.get('authenticated'))
          print(f'AUTHENTICATED_PRIVATE_ROUTES={ok}/{len(routes)}')
          if ok < 1:
              raise SystemExit('AUTHENTICATED_PRIVATE_ROUTE_NOT_PROVEN')
          print('PPI_WEB_AUTH_READONLY_E2E=PASS')
          PY

          echo 'PROFILE_ORIGINAL_UNTOUCHED=YES'
          echo 'REAL_ORDERS_SENT=0'
          HOST
