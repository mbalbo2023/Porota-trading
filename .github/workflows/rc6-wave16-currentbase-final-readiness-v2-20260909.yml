name: RC6 Wave16 Currentbase Final Readiness V2 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave16-currentbase-20260909]
    paths: [.github/workflows/rc6-wave16-currentbase-final-readiness-v2-20260909.yml]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify housekeeping is data-safe
        run: |
          set -Eeuo pipefail
          f=ops/rc6_build_cache_safe_cleanup.sh
          test -f "$f"
          grep -Eq 'docker[[:space:]]+builder[[:space:]]+prune' "$f"
          ! grep -En 'docker[[:space:]]+(image|container|volume|system)[[:space:]]+prune|rm -rf .*data|docker[[:space:]]+rm|docker[[:space:]]+rmi' "$f"
          bash -n "$f"
          echo 'W16_DATA_DESTRUCTIVE_OPS=NONE'
          echo 'W16_CODE_READY=GREEN'
