name: Porota Deploy V2 Promote

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA tested by Predeploy and merged into the product branch
        type: string
        required: true
      predeploy_run_id:
        description: Successful Predeploy run containing the immutable release
        type: string
        required: true
      operation:
        description: Use migrate once for the initial rootless transition, then deploy
        type: choice
        options: [deploy, migrate]
        default: deploy
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the tested artifact and verify runtime
    if: >-
      github.repository == 'mbalbo2023/Porota-trading' &&
      github.ref == 'refs/heads/deploy/rc6-pr69-isolated-20260915' &&
      github.actor == 'mbalbo2023' && github.triggering_actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact product revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and download the exact tested release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREDEPLOY_RUN_ID: ${{ inputs.predeploy_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREDEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          python3 -B -m scripts.porota_actions_release \
            --directory "$RUNNER_TEMP/porota/release" \
            --candidate-sha "$CANDIDATE_SHA" --run-id "$PREDEPLOY_RUN_ID"

      - name: Execute rootless procedure and verify physical receipt
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$OPERATION" == deploy || "$OPERATION" == migrate ]]
          python3 -B -m scripts.porota_actions_host "$OPERATION" \
            --release-dir "$RUNNER_TEMP/porota/release" \
            --receipt "$RUNNER_TEMP/porota/runtime.json"

      - name: Preserve physical evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: porota-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/porota/download.json
            ${{ runner.temp }}/porota/runtime.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report observed state
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'porota/runtime.json'
          receipt = json.loads(path.read_text()) if path.is_file() else {'state': 'NO_VERIFICADO'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Porota runtime\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY
