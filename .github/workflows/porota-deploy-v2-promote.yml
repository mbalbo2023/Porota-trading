name: RC6 Deploy V2 promote frozen candidate

on:
  push:
    branches:
      - deploy/rc6-pr69-isolated-20260915
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Checkout production promotion commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact frozen candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t PARTS < <(git rev-list --parents -n 1 HEAD | tr ' ' '\n')
          if [ "${#PARTS[@]}" -ne 3 ]; then
            PARENT_COUNT=$(( ${#PARTS[@]} - 1 ))
            echo "POROTA_DEPLOY_V2_PROMOTION_COMMIT_INVALID=RED|sha=${PARTS[0]:-UNKNOWN}|parents=${PARENT_COUNT}|required=2"
            echo "::error::Deploy V2 requires a two-parent merge commit so the exact Predeploy candidate remains addressable."
            exit 31
          fi
          CANDIDATE_SHA="${PARTS[2]}"
          DEPLOY_SHA="${PARTS[0]}"
          CANDIDATE_TREE="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          DEPLOY_TREE="$(git rev-parse "$DEPLOY_SHA^{tree}")"
          test "$CANDIDATE_TREE" = "$DEPLOY_TREE"
          {
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_TREE=$CANDIDATE_TREE"
            echo "DEPLOY_SHA=$DEPLOY_SHA"
          } >> "$GITHUB_ENV"
          echo "POROTA_DEPLOY_V2_TREE_IDENTITY=GREEN|candidate=$CANDIDATE_SHA|deploy=$DEPLOY_SHA|tree=$DEPLOY_TREE"

      - name: Locate successful Predeploy V2 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          candidate=os.environ["CANDIDATE_SHA"]
          token=os.environ["GH_TOKEN"]
          name=f"porota-predeploy-v2-{candidate}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          q=urllib.parse.quote(name,safe="")
          data=get(f"https://api.github.com/repos/{repo}/actions/artifacts?name={q}&per_page=100")
          candidates=[]
          for artifact in data.get("artifacts",[]):
              if artifact.get("expired") or artifact.get("name") != name:
                  continue
              run_id=(artifact.get("workflow_run") or {}).get("id")
              if not run_id:
                  continue
              run=get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
              if run.get("name")!="Porota Predeploy V2" or run.get("conclusion")!="success":
                  continue
              candidates.append((artifact.get("created_at") or "",artifact,run))
          if not candidates:
              raise SystemExit("NO_SUCCESSFUL_FROZEN_PREDEPLOY_ARTIFACT")
          _,artifact,run=max(candidates,key=lambda x:x[0])
          out=os.environ["GITHUB_ENV"]
          with open(out,"a",encoding="utf-8") as f:
              f.write(f"PREDEPLOY_ARTIFACT_ID={artifact['id']}\n")
              f.write(f"PREDEPLOY_RUN_ID={run['id']}\n")
          print(f"POROTA_FROZEN_PREDEPLOY_FOUND=GREEN|run={run['id']}|artifact={artifact['id']}|name={name}")
          PY

      - name: Download and verify frozen artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/porota-frozen-v2
          mkdir -p /tmp/porota-frozen-v2
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREDEPLOY_ARTIFACT_ID/zip" \
            -o /tmp/porota-frozen-v2.zip
          unzip -q /tmp/porota-frozen-v2.zip -d /tmp/porota-frozen-v2
          for name in porota-frozen-candidate.json porota-predeploy-image.tar.gz porota-deploy-bundle-v2.tgz porota-deploy-bundle-v2-manifest.json porota-host-manifest-v2.json porota-host-policy-v2.json; do
            src="$(find /tmp/porota-frozen-v2 -type f -name "$name" -print -quit)"
            test -n "$src"
            cp "$src" "/tmp/$name"
          done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          frozen=json.loads(Path("/tmp/porota-frozen-candidate.json").read_text())
          manifest=json.loads(Path("/tmp/porota-deploy-bundle-v2-manifest.json").read_text())
          assert frozen["candidate_sha"]==os.environ["CANDIDATE_SHA"]
          assert frozen["candidate_tree_sha"]==os.environ["CANDIDATE_TREE"]
          assert frozen["paper_mode_required"]=="PRODUCTION_PAPER"
          assert int(frozen["real_orders_sent_required"])==0
          assert frozen["build_once"] is True
          assert int(frozen.get("image_size_bytes", 0)) > 0
          def sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          assert sha("/tmp/porota-predeploy-image.tar.gz")==frozen["image_tar_sha256"]
          assert sha("/tmp/porota-deploy-bundle-v2.tgz")==manifest["bundle_sha256"]
          print("POROTA_FROZEN_ARTIFACT_VERIFY=GREEN")
          PY

      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_deploy" "$HOME/.ssh/known_hosts"

      - name: Dynamic pre-transfer disk guard and conditional safe cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          RC6_DISK_PREFLIGHT_REQUIRED=1
          IMAGE_TAR_BYTES="$(stat -c '%s' /tmp/porota-predeploy-image.tar.gz)"
          BUNDLE_BYTES="$(stat -c '%s' /tmp/porota-deploy-bundle-v2.tgz)"
          IMAGE_UNPACKED_BYTES="$(python -c 'import json; print(int(json.load(open("/tmp/porota-frozen-candidate.json"))["image_size_bytes"]))')"
          REQUIRED_LINE="$(python scripts/rc6_disk_space_guard.py \
            --policy ops/policy/rc6-disk-housekeeping-v1.json \
            --image-tar-bytes "$IMAGE_TAR_BYTES" \
            --image-unpacked-bytes "$IMAGE_UNPACKED_BYTES" \
            --bundle-bytes "$BUNDLE_BYTES")"
          echo "$REQUIRED_LINE"
          REQUIRED_PRETRANSFER_FREE="${REQUIRED_LINE#RC6_DISK_REQUIRED_PRETRANSFER_FREE=}"
          [[ "$REQUIRED_PRETRANSFER_FREE" =~ ^[0-9]+$ ]]

          SSH=(ssh -i "$HOME/.ssh/porota_rc6_deploy" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          probe_disk() {
            "${SSH[@]}" "$DO_USER@$DO_HOST" \
              "python3 -c 'import os,shutil; d=shutil.disk_usage(\"/\"); v=os.statvfs(\"/\"); print(d.free); print(f\"{100.0*v.f_ffree/v.f_files:.6f}\")'"
          }

          evaluate_gate() {
            local available="$1" inode_free="$2"
            python scripts/rc6_disk_space_guard.py \
              --policy ops/policy/rc6-disk-housekeeping-v1.json \
              --image-tar-bytes "$IMAGE_TAR_BYTES" \
              --image-unpacked-bytes "$IMAGE_UNPACKED_BYTES" \
              --bundle-bytes "$BUNDLE_BYTES" \
              --available-bytes "$available" \
              --inode-free-percent "$inode_free" \
              --json
          }

          mapfile -t METRICS < <(probe_disk)
          test "${#METRICS[@]}" -eq 2
          AVAILABLE_BYTES="${METRICS[0]}"
          INODE_FREE_PERCENT="${METRICS[1]}"
          AVAILABLE_BEFORE_PRECLEAN="$AVAILABLE_BYTES"

          set +e
          GATE_OUTPUT="$(evaluate_gate "$AVAILABLE_BYTES" "$INODE_FREE_PERCENT" 2>&1)"
          GATE_RC=$?
          set -e
          echo "$GATE_OUTPUT"

          RC6_DISK_PRECLEAN_TRIGGERED=0
          if [ "$GATE_RC" -ne 0 ]; then
            RC6_DISK_PRECLEAN_TRIGGERED=1
            echo "RC6_DISK_PRECLEAN=START|available=$AVAILABLE_BYTES|required=$REQUIRED_PRETRANSFER_FREE"
            POLICY_B64="$(base64 -w0 ops/policy/rc6-disk-housekeeping-v1.json)"
            "${SSH[@]}" "$DO_USER@$DO_HOST" "POLICY_B64='$POLICY_B64' bash -s" <<'PRECLEAN_REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          TMP_POLICY=/tmp/porota-dynamic-deploy-disk-policy.json
          printf '%s' "$POLICY_B64" | base64 -d > "$TMP_POLICY"
          test -f "$REPO/scripts/rc6_disk_housekeeping.py"

          PPI_BEFORE="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"

          find /tmp -maxdepth 1 -type d -name 'porota-deploy-v2-*' -exec rm -rf -- {} +
          sudo -n python3 "$REPO/scripts/rc6_disk_housekeeping.py" \
            --policy "$TMP_POLICY" --mode cleanup \
            --json-out /tmp/porota-predeploy-housekeeping.json
          sudo -n docker image prune -f
          sudo -n docker builder prune -af
          if sudo -n docker buildx version >/dev/null 2>&1; then sudo -n docker buildx prune -af; fi

          STATE="$(sudo -n timeout 10 python3 - "$REPO/data/paper_v17/observer_v17.db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True,timeout=2)
          c.execute("PRAGMA query_only=ON")
          c.execute("PRAGMA busy_timeout=1000")
          mode,orders=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()
          print(f"{mode}|{orders}")
          PY
          )"
          test "$STATE" = "PRODUCTION_PAPER|0"
          test "$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer)" = running
          test "$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_dashboard)" = running
          PPI_AFTER="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          test "$PPI_AFTER" = "$PPI_BEFORE"
          rm -f "$TMP_POLICY"
          echo "RC6_DISK_PRECLEAN_REMOTE=GREEN"
          PRECLEAN_REMOTE

            mapfile -t METRICS < <(probe_disk)
            test "${#METRICS[@]}" -eq 2
            AVAILABLE_BYTES="${METRICS[0]}"
            INODE_FREE_PERCENT="${METRICS[1]}"
            set +e
            GATE_OUTPUT="$(evaluate_gate "$AVAILABLE_BYTES" "$INODE_FREE_PERCENT" 2>&1)"
            GATE_RC=$?
            set -e
            echo "$GATE_OUTPUT"
          fi

          test "$GATE_RC" -eq 0
          SAFE_PREFLIGHT_RECLAIM=$((AVAILABLE_BYTES-AVAILABLE_BEFORE_PRECLEAN))
          echo "SAFE_PREFLIGHT_RECLAIM=$SAFE_PREFLIGHT_RECLAIM"
          {
            echo "RC6_DISK_PREFLIGHT_GREEN=1"
            echo "RC6_DISK_REQUIRED_PRETRANSFER_FREE=$REQUIRED_PRETRANSFER_FREE"
            echo "RC6_DISK_AVAILABLE_PRETRANSFER=$AVAILABLE_BYTES"
            echo "RC6_DISK_IMAGE_TAR_BYTES=$IMAGE_TAR_BYTES"
            echo "RC6_DISK_IMAGE_UNPACKED_BYTES=$IMAGE_UNPACKED_BYTES"
            echo "RC6_DISK_BUNDLE_BYTES=$BUNDLE_BYTES"
            echo "RC6_DISK_PRECLEAN_TRIGGERED=$RC6_DISK_PRECLEAN_TRIGGERED"
          } >> "$GITHUB_ENV"
          echo "RC6_DISK_PRETRANSFER_GATE=GREEN|available=$AVAILABLE_BYTES|required=$REQUIRED_PRETRANSFER_FREE|image_tar=$IMAGE_TAR_BYTES|image_unpacked=$IMAGE_UNPACKED_BYTES|bundle=$BUNDLE_BYTES|preclean=$RC6_DISK_PRECLEAN_TRIGGERED"

      - name: Transfer frozen artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RC6_DISK_PREFLIGHT_GREEN:-0}" = "1"
          REMOTE_DIR="/tmp/porota-deploy-v2-$CANDIDATE_SHA"
          SSH=(ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          SCP=(scp -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SSH[@]}" "$DO_USER@$DO_HOST" "rm -rf '$REMOTE_DIR' && mkdir -p '$REMOTE_DIR'"
          "${SCP[@]}" /tmp/porota-frozen-candidate.json /tmp/porota-predeploy-image.tar.gz /tmp/porota-deploy-bundle-v2.tgz /tmp/porota-deploy-bundle-v2-manifest.json /tmp/porota-host-manifest-v2.json /tmp/porota-host-policy-v2.json "$DO_USER@$DO_HOST:$REMOTE_DIR/"

      - name: Promote exact frozen candidate and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_deploy" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_TREE='$CANDIDATE_TREE' DEPLOY_SHA='$DEPLOY_SHA' RC6_DISK_REQUIRED_PRETRANSFER_FREE='$RC6_DISK_REQUIRED_PRETRANSFER_FREE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          REMOTE_DIR="/tmp/porota-deploy-v2-$CANDIDATE_SHA"
          STAGE="$REMOTE_DIR/stage"
          STABLE_IMAGE="porota-trading-bot:17.0.0-rc6"
          FROZEN_IMAGE="porota-predeploy-v2:$CANDIDATE_SHA"
          CANDIDATE_IMAGE="porota-trading-bot:17.0.0-rc6-candidate-$CANDIDATE_SHA"

          echo "RC6_DEPLOY_V2=START|candidate=$CANDIDATE_SHA|deploy=$DEPLOY_SHA"
          DISK_BEFORE="$(df -PB1 / | awk 'NR==2 {print $4}')"
          echo "DISK_BEFORE=$DISK_BEFORE"
          DOCKER_DF_BEFORE="$(sudo -n docker system df 2>&1 || true)"
          echo "DOCKER_SYSTEM_DF_BEFORE=$DOCKER_DF_BEFORE"
          REMOTE_TMP_BEFORE="$(du -sb /tmp/porota-deploy-v2-* 2>/dev/null | awk '{sum += $1} END {print sum+0}')"
          echo "REMOTE_DEPLOY_TMP_BEFORE=$REMOTE_TMP_BEFORE"
          # The heavy pre-transfer gate already cleaned first when required.
          # After transfer, re-check the remaining peak needed for bundle staging
          # + Docker image materialization + the final residual reserve.
          find /tmp -maxdepth 1 -type d -name 'porota-deploy-v2-*' ! -path "$REMOTE_DIR" -exec rm -rf -- {} +
          DISK_PREFLIGHT_AFTER="$(df -PB1 / | awk 'NR==2 {print $4}')"
          DOCKER_DF_AFTER="$(sudo -n docker system df 2>&1 || true)"
          IMAGE_TAR_BYTES="$(stat -c '%s' "$REMOTE_DIR/porota-predeploy-image.tar.gz")"
          BUNDLE_BYTES="$(stat -c '%s' "$REMOTE_DIR/porota-deploy-bundle-v2.tgz")"
          IMAGE_UNPACKED_BYTES="$(python3 -c 'import json; print(int(json.load(open("'"$REMOTE_DIR"'/porota-frozen-candidate.json"))["image_size_bytes"]))')"
          # Keep the post-transfer gate on the exact same candidate-policy
          # calculation that already passed before transfer. The Droplet's
          # currently installed repo may still carry an older disk policy until
          # the candidate bundle is installed, so it is not an authority here.
          [[ "$RC6_DISK_REQUIRED_PRETRANSFER_FREE" =~ ^[0-9]+$ ]]
          REQUIRED_LOAD_FREE=$((RC6_DISK_REQUIRED_PRETRANSFER_FREE - IMAGE_TAR_BYTES - BUNDLE_BYTES))
          test "$REQUIRED_LOAD_FREE" -gt 0
          echo "DISK_PREFLIGHT_AFTER=$DISK_PREFLIGHT_AFTER"
          echo "DOCKER_SYSTEM_DF_AFTER=$DOCKER_DF_AFTER"
          echo "IMAGE_TAR_BYTES=$IMAGE_TAR_BYTES"
          echo "IMAGE_UNPACKED_BYTES=$IMAGE_UNPACKED_BYTES"
          echo "BUNDLE_BYTES=$BUNDLE_BYTES"
          echo "RC6_DISK_REQUIRED_PRETRANSFER_FREE=$RC6_DISK_REQUIRED_PRETRANSFER_FREE"
          echo "REQUIRED_LOAD_FREE=$REQUIRED_LOAD_FREE"
          test "$DISK_PREFLIGHT_AFTER" -ge "$REQUIRED_LOAD_FREE"
          echo "RC6_DISK_POSTTRANSFER_LOAD_GATE=GREEN|available=$DISK_PREFLIGHT_AFTER|required=$REQUIRED_LOAD_FREE"

          PRE_STATE="NO_RUNNING_OBSERVER"
          if [ "$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer 2>/dev/null || true)" = running ]; then
            PRE_STATE="$(sudo -n timeout 10 python3 - "$REPO/data/paper_v17/observer_v17.db" <<'PY'
          import sqlite3,sys
          path=sys.argv[1]
          c=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=2)
          c.execute('PRAGMA query_only=ON')
          c.execute('PRAGMA busy_timeout=1000')
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close()
          print(f"STATE_FAST|{mode}|{orders}")
          PY
            )"
          fi
          echo "PRE_STATE_HOST_READONLY=$PRE_STATE"
          if [ "$PRE_STATE" != NO_RUNNING_OBSERVER ]; then test "$PRE_STATE" = "STATE_FAST|PRODUCTION_PAPER|0"; fi

          PPI_WATCH_BEFORE="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          printf 'PPI_WATCH_BEFORE=%s\n' "$PPI_WATCH_BEFORE"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$REMOTE_DIR/porota-deploy-bundle-v2.tgz" -C "$STAGE"

          sudo -n python3 - "$STAGE" "$REPO" "$REMOTE_DIR/porota-deploy-bundle-v2-manifest.json" <<'PY'
          import hashlib,json,os,shutil,sys
          from pathlib import Path
          stage,repo,manifest=map(Path,sys.argv[1:])
          data=json.loads(manifest.read_text())
          assert data.get("status")=="GREEN" and data.get("files")
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          for row in data["files"]:
              rel=Path(row["path"])
              assert not rel.is_absolute() and ".." not in rel.parts, rel
              src=stage/rel
              assert src.is_file() and sha(src)==row["sha256"], rel
              dst=repo/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              assert sha(dst)==row["sha256"], rel
          print(f"POROTA_BUNDLE_INSTALL=GREEN|files={len(data['files'])}")
          PY

          EXPECTED_IMAGE_ID="$(python3 -c 'import json; print(json.load(open("'"$REMOTE_DIR"'/porota-frozen-candidate.json"))["image_id"])')"
          gunzip -c "$REMOTE_DIR/porota-predeploy-image.tar.gz" | sudo -n docker load
          LOADED_IMAGE_ID="$(sudo -n docker image inspect -f '{{.Id}}' "$FROZEN_IMAGE" | tr -d '\r\n')"
          RUNTIME_IMAGE_ID="$LOADED_IMAGE_ID"
          EXPECTED_IMAGE_ID="$(printf "%s" "$EXPECTED_IMAGE_ID" | tr -d '\r\n')"
          IMAGE_TAR_SHA="$(sha256sum "$REMOTE_DIR/porota-predeploy-image.tar.gz" | awk '{print $1}')"
          EXPECTED_TAR_SHA="$(python3 -c 'import json; print(json.load(open("'"$REMOTE_DIR"'/porota-frozen-candidate.json"))["image_tar_sha256"])')"
          IMAGE_CONFIG_SHA="$(sudo -n docker image inspect -f '{{json .Config}}' "$FROZEN_IMAGE" | sha256sum | awk '{print $1}')"
          EXPECTED_CONFIG_SHA="$(python3 -c 'import json; print(json.load(open("'"$REMOTE_DIR"'/porota-frozen-candidate.json")).get("image_config_sha256",""))')"
          echo "POROTA_IMAGE_ID_VERIFY=loaded=$LOADED_IMAGE_ID|expected=$EXPECTED_IMAGE_ID"
          echo "POROTA_IMAGE_CONFIG_DIAGNOSTIC=loaded=$IMAGE_CONFIG_SHA|expected=$EXPECTED_CONFIG_SHA|ENGINE_NORMALIZATION=OBSERVED"
          echo "POROTA_IMAGE_TAR_VERIFY=loaded=$IMAGE_TAR_SHA|expected=$EXPECTED_TAR_SHA"
          test -n "$LOADED_IMAGE_ID"
          test "$IMAGE_TAR_SHA" = "$EXPECTED_TAR_SHA"
          sudo -n docker tag "$FROZEN_IMAGE" "$CANDIDATE_IMAGE"
          sudo -n docker tag "$FROZEN_IMAGE" "$STABLE_IMAGE"
          echo "POROTA_BUILD_ONCE_PROMOTION=GREEN|expected_image=$EXPECTED_IMAGE_ID|loaded_image=$RUNTIME_IMAGE_ID"

          sudo -n python3 "$REPO/scripts/porota_apply_host_control_plane_v2.py" \
            --root "$REPO" \
            --policy ops/policy/host-control-plane-reconciliation-v2.json \
            --json-out "$REMOTE_DIR/host-control-plane-applied.json"

          # Shared /app/data/market is writable only by the unprivileged RC6
          # runtime UID. Fix the directory itself (not recursively) so atomic
          # *.tmp -> latest replacements work without broadening privileges.
          test ! -L "$REPO/data/market"
          sudo -n install -d -o 1000 -g 1000 -m 0750 "$REPO/data/market"
          MARKET_DIR_IDENTITY="$(sudo -n stat -c '%u:%g|%a' "$REPO/data/market")"
          echo "RC6_MARKET_DIR_IDENTITY=$MARKET_DIR_IDENTITY"
          test "$MARKET_DIR_IDENTITY" = "1000:1000|750"
          echo "RC6_BYMA_SHARED_PATH_WRITABLE_GUARD=GREEN"

          MODE_OUTPUT="$(sudo -n env POROTA_COPY_OUTPUT=0 python3 "$REPO/porota_mode_manager.py" simulation 2>&1)"
          echo "$MODE_OUTPUT"
          grep -q 'POROTA_MODE=OK' <<< "$MODE_OUTPUT"

          OBSERVER_IMAGE_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_production_observer)"
          DASHBOARD_IMAGE_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_production_dashboard)"
          echo "POROTA_RUNTIME_IMAGE_ID_VERIFY=observer=$OBSERVER_IMAGE_ID|dashboard=$DASHBOARD_IMAGE_ID|loaded=$RUNTIME_IMAGE_ID"
          test "$OBSERVER_IMAGE_ID" = "$RUNTIME_IMAGE_ID"
          test "$DASHBOARD_IMAGE_ID" = "$RUNTIME_IMAGE_ID"

          POST_CONTAINER_STATUS="$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer 2>/dev/null || true)"
          POST_CONTAINER_OOM_KILLED="$(sudo -n docker inspect -f '{{.State.OOMKilled}}' porota_production_observer 2>/dev/null || true)"
          echo "POST_CONTAINER_STATUS=$POST_CONTAINER_STATUS|OOM_KILLED=$POST_CONTAINER_OOM_KILLED"
          if [ "$POST_CONTAINER_STATUS" != running ]; then
            sudo -n docker start porota_production_observer >/dev/null
            POST_CONTAINER_STATUS="$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer)"
            echo "POST_CONTAINER_RESTARTED_STATUS=$POST_CONTAINER_STATUS"
          fi
          POST_STATE=""
          POST_STATE_RC=1
          for POST_STATE_ATTEMPT in 1 2 3; do
            set +e
            POST_STATE="$(sudo -n timeout 10 python3 - "$REPO/data/paper_v17/observer_v17.db" <<'PY'
          import sqlite3,sys
          path=sys.argv[1]
          c=sqlite3.connect(f"file:{path}?mode=ro",uri=True,timeout=2)
          c.execute('PRAGMA query_only=ON')
          c.execute('PRAGMA busy_timeout=1000')
          mode,orders=c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          c.close()
          print(f"STATE_FAST|{mode}|{orders}")
          PY
            )"
            POST_STATE_RC=$?
            set -e
            echo "POST_STATE_HOST_READONLY_ATTEMPT=$POST_STATE_ATTEMPT|RC=$POST_STATE_RC|VALUE=$POST_STATE"
            [ "$POST_STATE_RC" -eq 0 ] && break
            sleep 2
          done
          test "$POST_STATE_RC" -eq 0
          echo "POST_STATE=$POST_STATE"
          test "$POST_STATE" = "STATE_FAST|PRODUCTION_PAPER|0"

          # Fail-safe provenance is materialized immediately after the exact
          # image is running and PAPER safety is proven. If any later audit
          # fails, CURRENT_STATE_V2 describes the actual promoted runtime as
          # DEPLOYED_VALIDATION_PENDING instead of silently describing the
          # previous image.
          sudo -n mkdir -p "$REPO/data/deploy"
          # The promoted runtime already proves the exact frozen artifact
          # identity. Persist that provenance before any long validation so a
          # later fail-closed audit cannot leave the previous candidate on disk.
          sudo -n install -m 0644 "$REMOTE_DIR/porota-frozen-candidate.json" \
            "$REPO/data/deploy/porota-frozen-candidate.json"
          sudo -n install -m 0644 "$REMOTE_DIR/porota-deploy-bundle-v2-manifest.json" \
            "$REPO/data/deploy/porota-deploy-bundle-v2-manifest.json"
          echo "RC6_FROZEN_PROVENANCE_PROVISIONAL=GREEN|candidate=$CANDIDATE_SHA"
          sudo -n python3 - "$REPO/data/deploy/CURRENT_STATE_V2.json" "$CANDIDATE_SHA" "$DEPLOY_SHA" "$RUNTIME_IMAGE_ID" "$POST_STATE" <<'PY'
          import json,os,sys,tempfile
          from datetime import datetime,timezone
          path,candidate,deploy,image_id,post=sys.argv[1:]
          payload={
            "schema_version":2,
            "recorded_at":datetime.now(timezone.utc).isoformat(),
            "candidate_sha":candidate,
            "deploy_sha":deploy,
            "image_id":image_id,
            "mode":"PRODUCTION_PAPER",
            "real_orders_sent":0,
            "real_order_routes":"NOT_CALLED",
            "observer_state":post,
            "ppi_watch_untouched":True,
            "deployment_strategy":"FIX_FORWARD_ONLY",
            "build_once":True,
            "validation_status":"DEPLOYED_VALIDATION_PENDING",
          }
          directory=os.path.dirname(path)
          fd,tmp=tempfile.mkstemp(prefix=".CURRENT_STATE_V2.",suffix=".tmp",dir=directory)
          try:
              with os.fdopen(fd,"w",encoding="utf-8") as handle:
                  json.dump(payload,handle,indent=2,sort_keys=True); handle.write("\n")
              os.replace(tmp,path)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print("RC6_CURRENT_STATE_PROVISIONAL=GREEN")
          PY
          echo "POST_SQLITE_QUICK_CHECK=DEFERRED_TO_CONTRACT_RUNNER"

          # Full contract evidence reconciliation remains read-only at the broker
          # boundary. The remote v1 sweep is closed-session only, but deterministic
          # local Evidence v2 policy materialization is mandatory in every deploy.
          # Stop the observer during the database mutation to prevent its startup
          # catalogue refresh racing the exact deploy reconciliation.  It is
          # restarted unconditionally before evaluating the runner result.
          sudo -n docker stop porota_production_observer >/dev/null
          echo "OBSERVER_PAUSED_FOR_CONTRACT_RECONCILIATION=GREEN"
          set +e
          # The exhaustive PPI v1 compatibility pass performs ~2k bounded read-only
          # requests before the mass v2 reconciliation. Production evidence shows a
          # normal closed-session run needs ~35 minutes. Keep a 55-minute TERM budget
          # and a hard 60-second KILL ceiling within the 90-minute workflow limit.
          CONTRACT_OUTPUT="$(sudo -n timeout --signal=TERM --kill-after=60 3300 sudo -n docker run --rm --pull never \
            --user botuser --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            -e PPI_PRODUCTION_SECRET_FILE=/run/secrets/ppi_production.json \
            -e PAPER_V17_DB_PATH=/app/data/paper_v17/observer_v17.db \
            -e DATA_DIR=/app/data \
            -e SERVER_TIMEZONE=America/Argentina/Buenos_Aires \
            --env-file /opt/porota-trading/data/diagnosticos/observer_runtime_v17.env \
            -v /opt/porota-trading/data:/app/data \
            -v /opt/porota-trading/.secrets/ppi_production.json:/run/secrets/ppi_production.json:ro \
            --entrypoint python "$STABLE_IMAGE" ck_contract_evidence_runner_hf6.py 2>&1)"
          CONTRACT_RC=$?
          set -e
          sudo -n docker start porota_production_observer >/dev/null
          echo "OBSERVER_RESTARTED_AFTER_CONTRACT_RECONCILIATION=GREEN"
          echo "RC6_FULL_CONTRACT_RECONCILIATION_EXIT=$CONTRACT_RC"
          echo "$CONTRACT_OUTPUT"
          test "$CONTRACT_RC" -eq 0
          grep -Fq "STATUS=OK" <<< "$CONTRACT_OUTPUT"
          if grep -Fq "REMOTE_PPI_V1_REFRESH=SKIPPED_MARKET_OPEN" <<< "$CONTRACT_OUTPUT"; then
            grep -Fq "DATABASE_READONLY_PROBE=1" <<< "$CONTRACT_OUTPUT"
            echo "RC6_REMOTE_PPI_V1_REFRESH=SKIPPED_MARKET_OPEN"
          else
            grep -Fq "QUICK_CHECK=ok" <<< "$CONTRACT_OUTPUT"
          fi
          grep -Fq "LATEST_EVIDENCE_V2_RUN=('CONTRACT_EVIDENCE_V2_MASS_PPI_CATALOG', 'OK'" <<< "$CONTRACT_OUTPUT"
          echo "RC6_FULL_CONTRACT_RECONCILIATION=GREEN"

          sudo -n docker run --rm --pull never --user botuser --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --entrypoint python -i "$STABLE_IMAGE" - <<'PY'
          from bs_instrument_contracts import FAMILIES
          import bf_production_paper_observer as observer
          assert observer.OPERATIONAL_FAMILIES == FAMILIES
          assert observer.SAFE_PAPER_TYPES == set(FAMILIES)
          print("OPERATIONAL_SCOPE=ALL_CONTRACT_FAMILIES")
          PY

          RUNTIME_CHECK="$(sudo -n timeout 120 python3 - "$REPO/data/paper_v17/observer_v17.db" <<'PY'
          import sqlite3,sys,time
          from datetime import datetime,timezone
          path=sys.argv[1]
          deadline=time.monotonic()+90
          last=None
          def fresh(value,seconds):
              try:
                  observed=datetime.fromisoformat(str(value).replace("Z","+00:00"))
                  return observed.tzinfo is not None and 0 <= (datetime.now(timezone.utc)-observed.astimezone(timezone.utc)).total_seconds() <= seconds
              except (TypeError,ValueError):
                  return False
          while time.monotonic() < deadline:
              try:
                  c=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=3)
                  c.execute('PRAGMA query_only=ON')
                  last=c.execute(
                      'SELECT mode,real_orders_sent,ppi_auth,process_state,session_state,last_market_data_at,heartbeat_at '
                      'FROM observer_state WHERE id=1'
                  ).fetchone()
                  c.close()
              except sqlite3.Error:
                  last=None
              paper=last and last[0]=='PRODUCTION_PAPER' and int(last[1] or 0)==0 and last[2]=='OK'
              heartbeat=paper and fresh(last[6],120)
              market_required=bool(last and last[4]=='MARKET_OPEN')
              market_fresh=(not market_required) or fresh(last[5],300)
              if paper and heartbeat and market_fresh:
                  print('GO_CHECK=GREEN|'+'|'.join(map(str,last))+f'|MARKET_DATA_REQUIRED={market_required}')
                  break
              time.sleep(5)
          else:
              print(f'GO_CHECK_FAILED_AFTER_STARTUP={last}')
              raise SystemExit(1)
          PY
          )"
          echo "$RUNTIME_CHECK"
          grep -q '^GO_CHECK=GREEN' <<< "$RUNTIME_CHECK"

          # The exhaustive contract reconciliation can create a transient host
          # memory peak.  The dashboard is independently restartable and must
          # be proven healthy after that peak before any postdeploy assertion.
          DASHBOARD_STATUS="$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_dashboard 2>/dev/null || true)"
          DASHBOARD_OOM_KILLED="$(sudo -n docker inspect -f '{{.State.OOMKilled}}' porota_production_dashboard 2>/dev/null || true)"
          echo "DASHBOARD_POST_RECONCILIATION_STATUS=$DASHBOARD_STATUS|OOM_KILLED=$DASHBOARD_OOM_KILLED"
          if [ "$DASHBOARD_STATUS" != running ]; then
            sudo -n docker logs --tail 120 porota_production_dashboard 2>&1 || true
            sudo -n docker start porota_production_dashboard >/dev/null
            echo "DASHBOARD_POST_RECONCILIATION_RESTART=PERFORMED"
          fi
          DASHBOARD_HTTP=000
          for DASHBOARD_ATTEMPT in $(seq 1 18); do
            DASHBOARD_HTTP="$(curl -sS -o /tmp/porota-v2-health -w '%{http_code}' --max-time 10 http://127.0.0.1:8000/health || true)"
            echo "DASHBOARD_HEALTH_ATTEMPT=$DASHBOARD_ATTEMPT|HTTP=$DASHBOARD_HTTP"
            [ "$DASHBOARD_HTTP" = 200 ] && break
            sleep 5
          done
          if [ "$DASHBOARD_HTTP" != 200 ]; then
            sudo -n docker inspect porota_production_dashboard || true
            sudo -n docker logs --tail 200 porota_production_dashboard 2>&1 || true
            exit 1
          fi
          test "$DASHBOARD_HTTP" = 200
          DASHBOARD_IMAGE_ID="$(sudo -n docker inspect -f '{{.Image}}' porota_production_dashboard)"
          test "$DASHBOARD_IMAGE_ID" = "$RUNTIME_IMAGE_ID"
          echo "DASHBOARD_HEALTH_HTTP=200|image=$DASHBOARD_IMAGE_ID"

          # From this point onward no controlled container restart is expected.
          # A newly recreated exact-image runtime must still have zero automatic
          # restarts before any postdeploy bootstrap or audit begins.
          OBSERVER_RESTART_BASE="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_observer)"
          DASHBOARD_RESTART_BASE="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_dashboard)"
          echo "RC6_POST_RECONCILIATION_RESTART_BASELINE=observer=$OBSERVER_RESTART_BASE|dashboard=$DASHBOARD_RESTART_BASE"
          test "$OBSERVER_RESTART_BASE" = 0
          test "$DASHBOARD_RESTART_BASE" = 0

          # Bootstrap compacto tras un deploy correcto. Cada tarea es diaria y
          # acotada; no habilita rutas de orden real.
          for job in validation_projection action4_audit; do
            JOB_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 60 python az_maintenance_job.py "$job" 2>&1)"
            echo "$JOB_OUTPUT"
            grep -Fq "Tarea $job completada." <<< "$JOB_OUTPUT"
            echo "BOOTSTRAP_$(tr '[:lower:]' '[:upper:]' <<< "$job")=GREEN"
          done

          # Migrate only the local cache contract. This preserves every market
          # value byte-for-byte, never calls IOL and never creates an order route.
          IOL_MIGRATION_OUTPUT="$(sudo -n python3 "$REPO/scripts/rc6_iol_reference_contract_migrate.py" \
            --path "$REPO/data/market/iol_family_reference_latest.json" 2>&1)"
          echo "$IOL_MIGRATION_OUTPUT"
          grep -Fq 'IOL_REFERENCE_CONTRACT_MIGRATION=GREEN' <<< "$IOL_MIGRATION_OUTPUT"
          grep -Fq 'ZERO_FILL=false|REAL_ROUTES=[]' <<< "$IOL_MIGRATION_OUTPUT"

          # Unified WS-INTEG-03 runtime truth audit. It is read-only at the DB
          # and network boundaries and runs inside the exact promoted image.
          # Its only write is the persisted audit evidence JSON. The dashboard
          # runs as botuser, so the bind-mounted evidence directory must be owned
          # by that exact runtime UID/GID before invoking the auditor.
          AUDIT_HOST_DIR="$REPO/data/deploy"
          AUDIT_UID="$(sudo -n docker exec porota_production_dashboard id -u)"
          AUDIT_GID="$(sudo -n docker exec porota_production_dashboard id -g)"
          [[ "$AUDIT_UID" =~ ^[0-9]+$ ]]
          [[ "$AUDIT_GID" =~ ^[0-9]+$ ]]
          sudo -n install -d -o "$AUDIT_UID" -g "$AUDIT_GID" -m 0750 "$AUDIT_HOST_DIR"
          sudo -n find "$AUDIT_HOST_DIR" -maxdepth 1 -type f -name 'zero-known-error-*.json' \
            -exec chown "$AUDIT_UID:$AUDIT_GID" {} +
          sudo -n find "$AUDIT_HOST_DIR" -maxdepth 1 -type f -name 'zero-known-error-*.json' \
            -exec chmod 0640 {} +
          AUDIT_HOST_STAT="$(sudo -n stat -c '%u:%g|%a' "$AUDIT_HOST_DIR")"
          echo "RC6_ZERO_KNOWN_ERROR_OUTPUT_PATH=$AUDIT_HOST_STAT|runtime=$AUDIT_UID:$AUDIT_GID"
          test "$AUDIT_HOST_STAT" = "$AUDIT_UID:$AUDIT_GID|750"
          sudo -n docker exec porota_production_dashboard test -w /app/data/deploy
          echo "RC6_ZERO_KNOWN_ERROR_OUTPUT_PATH_WRITABLE=GREEN"

          # A transient per-symbol market-data failure intentionally marks the
          # scalping worker DEGRADED for that scan interval. Never treat
          # DEGRADED as healthy: wait, boundedly and read-only, for the worker
          # to publish a fresh healthy heartbeat before taking the immediate
          # Zero-Known-Error snapshot. This closes the race where a healthy
          # self-recovering worker was sampled between scan cycles.
          SCALPING_STABILIZATION_SECONDS=420
          SCALPING_STABILIZATION_POLL_SECONDS=15
          SCALPING_STABILIZATION_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%6N+00:00)"
          SCALPING_STABILIZATION_ATTEMPTS=$((SCALPING_STABILIZATION_SECONDS / SCALPING_STABILIZATION_POLL_SECONDS + 1))
          SCALPING_STABILIZED=false
          for SCALPING_ATTEMPT in $(seq 1 "$SCALPING_STABILIZATION_ATTEMPTS"); do
            OBSERVER_RESTART_NOW="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_observer)"
            DASHBOARD_RESTART_NOW="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_dashboard)"
            test "$OBSERVER_RESTART_NOW" = "$OBSERVER_RESTART_BASE"
            test "$DASHBOARD_RESTART_NOW" = "$DASHBOARD_RESTART_BASE"
            SCALPING_GATE="$(sudo -n timeout 10 python3 - "$REPO/data/paper_v17/observer_v17.db" "$SCALPING_STABILIZATION_STARTED_AT" <<'PY'
          import sqlite3,sys
          from datetime import datetime, timezone

          path,started_raw=sys.argv[1:3]
          started=datetime.fromisoformat(started_raw.replace("Z","+00:00"))
          c=sqlite3.connect(f"file:{path}?mode=ro",uri=True,timeout=3)
          c.row_factory=sqlite3.Row
          c.execute("PRAGMA query_only=ON")
          c.execute("PRAGMA busy_timeout=1000")
          worker=c.execute("""
            SELECT heartbeat_at,state,successful,failed,real_orders_sent
            FROM intraday_scalping_worker_state WHERE id=1
          """).fetchone()
          observer=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()

          if worker is None or observer is None:
              print("WAIT|reason=missing_state")
              raise SystemExit(0)

          heartbeat=str(worker["heartbeat_at"] or "")
          try:
              dt=datetime.fromisoformat(heartbeat.replace("Z","+00:00"))
              if dt.tzinfo is None:
                  raise ValueError("naive heartbeat")
              age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()
          except Exception:
              age=10**9

          state=str(worker["state"] or "")
          successful=int(worker["successful"] or 0)
          failed=int(worker["failed"] or 0)
          worker_orders=int(worker["real_orders_sent"] or 0)
          observer_mode=str(observer["mode"] or "")
          observer_orders=int(observer["real_orders_sent"] or 0)
          healthy_state=state in ("RUNNING","WAITING_MARKET")
          post_gate_heartbeat=dt >= started if age < 10**9 else False
          healthy=(healthy_state and failed==0 and 0 <= age <= 300
                   and post_gate_heartbeat
                   and worker_orders==0 and observer_mode=="PRODUCTION_PAPER"
                   and observer_orders==0)
          prefix="GREEN" if healthy else "WAIT"
          print(
              f"{prefix}|state={state}|heartbeat_age_seconds={age:.3f}"
              f"|post_gate_heartbeat={str(post_gate_heartbeat).lower()}"
              f"|successful={successful}|failed={failed}"
              f"|worker_orders={worker_orders}"
              f"|observer={observer_mode}/{observer_orders}"
          )
          PY
            )"
            echo "RC6_SCALPING_STABILIZATION_ATTEMPT=$SCALPING_ATTEMPT|$SCALPING_GATE"
            grep -Fq 'worker_orders=0' <<< "$SCALPING_GATE"
            grep -Fq 'observer=PRODUCTION_PAPER/0' <<< "$SCALPING_GATE"
            if [[ "$SCALPING_GATE" == GREEN\|* ]]; then
              SCALPING_STABILIZED=true
              break
            fi
            if [ "$SCALPING_ATTEMPT" -lt "$SCALPING_STABILIZATION_ATTEMPTS" ]; then
              sleep "$SCALPING_STABILIZATION_POLL_SECONDS"
            fi
          done
          test "$SCALPING_STABILIZED" = true
          echo "RC6_SCALPING_STABILIZATION=GREEN"

          AUDIT_BASE=/app/data/deploy/zero-known-error-immediate.json
          set +e
          AUDIT_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 300 \
            python /app/scripts/rc6_zero_known_error_runtime_audit.py \
              --label immediate --output "$AUDIT_BASE" 2>&1)"
          AUDIT_RC=$?
          set -e
          echo "$AUDIT_OUTPUT"
          if [ "$AUDIT_RC" -ne 0 ]; then
            echo "RC6_ZERO_KNOWN_ERROR_IMMEDIATE=RED|RC=$AUDIT_RC"
            sudo -n docker inspect -f 'DASHBOARD={{.State.Status}}|OOM={{.State.OOMKilled}}|RESTARTS={{.RestartCount}}|IMAGE={{.Image}}' porota_production_dashboard || true
            sudo -n docker logs --tail 250 porota_production_dashboard 2>&1 || true
            exit "$AUDIT_RC"
          fi
          echo "RC6_ZERO_KNOWN_ERROR_IMMEDIATE=GREEN"

          # The compressed frozen image/bundle and extracted stage are no longer
          # needed after immutable promotion + immediate audit. Reclaim only these
          # deploy-transient bytes before the preopen disk guard so the deploy
          # cannot fail against space it is itself temporarily consuming.
          rm -f "$REMOTE_DIR/porota-predeploy-image.tar.gz" "$REMOTE_DIR/porota-deploy-bundle-v2.tgz"
          rm -rf "$STAGE"
          DISK_PREOPEN_AFTER_SAFE_RECLAIM="$(df -PB1 / | awk 'NR==2 {print $4}')"
          echo "RC6_PREOPEN_SAFE_RECLAIM=GREEN|free=$DISK_PREOPEN_AFTER_SAFE_RECLAIM"
          POST_CLEANUP_MIN_FREE="$(python3 -c 'import json; print(json.load(open("'"$REPO"'/ops/policy/rc6-disk-housekeeping-v1.json"))["disk"]["post_cleanup_min_free_bytes"])')"
          echo "RC6_DISK_POST_CLEANUP_MIN_FREE=$POST_CLEANUP_MIN_FREE"
          test "$DISK_PREOPEN_AFTER_SAFE_RECLAIM" -ge "$POST_CLEANUP_MIN_FREE"

          # Refresh the official BYMA morning evidence with the just-installed
          # candidate. The structured public capture remains complementary:
          # official-page failures are fail-closed, while OPEN_DATA source-path
          # failures remain visible without impersonating calendar authority.
          set +e
          BYMA_MORNING_OUTPUT="$(sudo -n timeout 180 python3 "$REPO/scripts/rc6_byma_morning_pipeline.py" --root "$REPO/data/market" 2>&1)"
          BYMA_MORNING_RC=$?
          set -e
          echo "$BYMA_MORNING_OUTPUT"
          if [ "$BYMA_MORNING_RC" -ne 0 ]; then
            echo "RC6_BYMA_MORNING_REFRESH=RED|RC=$BYMA_MORNING_RC"
            exit "$BYMA_MORNING_RC"
          fi
          echo "RC6_BYMA_MORNING_REFRESH=GREEN"

          # Execute the same fail-closed preopen contract under both scheduled
          # phase labels. No order route, DB write, restart or Telegram send is
          # performed by rc6_preopen.py.
          for phase in T_MINUS_45 T_MINUS_10; do
            set +e
            PREOPEN_OUTPUT="$(sudo -n timeout 300 python3 "$REPO/rc6_preopen.py" --phase "$phase" 2>&1)"
            PREOPEN_RC=$?
            set -e
            echo "$PREOPEN_OUTPUT"
            if [ "$PREOPEN_RC" -ne 0 ]; then
              echo "RC6_PREOPEN_${phase}=RED|RC=$PREOPEN_RC"
              exit "$PREOPEN_RC"
            fi
            printf '%s\n' "$PREOPEN_OUTPUT" | \
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$REPO" python3 \
                "$REPO/scripts/rc6_deploy_preopen_gate.py" \
                --phase "$phase" --return-code "$PREOPEN_RC"
            echo "RC6_PREOPEN_${phase}=RESULT_ACCEPTED"
          done

          # Observe several worker/dashboard refresh cycles before success.
          # Every later snapshot compares against the immediate baseline and
          # fails if READY regresses, LKG disappears or a worker heartbeat does
          # not advance. Container restart counters are also invariant: a
          # self-recovered SIGSEGV/exit-139 is still a failed deployment.
          echo "RC6_STABILITY_RESTART_BASELINE=observer=$OBSERVER_RESTART_BASE|dashboard=$DASHBOARD_RESTART_BASE"
          for cycle in 1 2 3; do
            sleep 35
            set +e
            AUDIT_OUTPUT="$(sudo -n docker exec porota_production_dashboard timeout 300 \
              python /app/scripts/rc6_zero_known_error_runtime_audit.py \
                --label "stability-$cycle" --baseline "$AUDIT_BASE" \
                --output "/app/data/deploy/zero-known-error-stability-$cycle.json" 2>&1)"
            AUDIT_RC=$?
            set -e
            echo "$AUDIT_OUTPUT"
            if [ "$AUDIT_RC" -ne 0 ]; then
              echo "RC6_ZERO_KNOWN_ERROR_STABILITY_$cycle=RED|RC=$AUDIT_RC"
              sudo -n docker logs --tail 250 porota_production_dashboard 2>&1 || true
              exit "$AUDIT_RC"
            fi
            OBSERVER_RESTART_NOW="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_observer)"
            DASHBOARD_RESTART_NOW="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_dashboard)"
            echo "RC6_STABILITY_RESTART_$cycle=observer=$OBSERVER_RESTART_NOW|dashboard=$DASHBOARD_RESTART_NOW"
            test "$OBSERVER_RESTART_NOW" = "$OBSERVER_RESTART_BASE"
            test "$DASHBOARD_RESTART_NOW" = "$DASHBOARD_RESTART_BASE"
            echo "RC6_ZERO_KNOWN_ERROR_STABILITY_$cycle=GREEN"
          done

          # Exit-139 incidents appeared after the runtime had initially looked
          # healthy. Extend the observation window cheaply after the three full
          # audits: no heavy HTTP sweep, only direct container-liveness and
          # restart-count invariants once per minute.
          for soak in 1 2 3 4 5; do
            sleep 60
            OBSERVER_STATUS_SOAK="$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer)"
            DASHBOARD_STATUS_SOAK="$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_dashboard)"
            OBSERVER_RESTART_SOAK="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_observer)"
            DASHBOARD_RESTART_SOAK="$(sudo -n docker inspect -f '{{.RestartCount}}' porota_production_dashboard)"
            echo "RC6_EXIT139_SOAK_$soak=observer:$OBSERVER_STATUS_SOAK/$OBSERVER_RESTART_SOAK|dashboard:$DASHBOARD_STATUS_SOAK/$DASHBOARD_RESTART_SOAK"
            test "$OBSERVER_STATUS_SOAK" = running
            test "$DASHBOARD_STATUS_SOAK" = running
            test "$OBSERVER_RESTART_SOAK" = "$OBSERVER_RESTART_BASE"
            test "$DASHBOARD_RESTART_SOAK" = "$DASHBOARD_RESTART_BASE"
          done
          echo "RC6_EXIT139_SOAK=GREEN"

          RECENT_CRITICAL="$({
            sudo -n docker logs --since 15m porota_production_observer 2>&1 || true
            sudo -n docker logs --since 15m porota_production_dashboard 2>&1 || true
          } | grep -E 'Traceback|REAL_ORDER_CAPABILITY=(ENABLED|REAL)|real_orders_sent=[1-9][0-9]*' || true)"
          test -z "$RECENT_CRITICAL"
          echo "RC6_RECENT_CRITICAL_LOG_SIGNATURES=0"

          PPI_WATCH_AFTER="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          test "$PPI_WATCH_AFTER" = "$PPI_WATCH_BEFORE"
          echo "PPI_WATCH_UNTOUCHED=GREEN"

          sudo -n mkdir -p "$REPO/data/deploy"
          sudo -n install -m 0644 "$REMOTE_DIR/porota-frozen-candidate.json" \
            "$REPO/data/deploy/porota-frozen-candidate.json"
          sudo -n install -m 0644 "$REMOTE_DIR/porota-deploy-bundle-v2-manifest.json" \
            "$REPO/data/deploy/porota-deploy-bundle-v2-manifest.json"
          sudo -n python3 - "$REPO/data/deploy/porota-frozen-candidate.json" \
            "$REPO/data/deploy/porota-deploy-bundle-v2-manifest.json" \
            "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$IMAGE_TAR_SHA" <<'PY'
          import json,sys
          frozen_path,manifest_path,candidate,tree,image_tar_sha=sys.argv[1:]
          frozen=json.load(open(frozen_path,encoding="utf-8"))
          manifest=json.load(open(manifest_path,encoding="utf-8"))
          assert frozen["candidate_sha"] == candidate
          assert frozen["candidate_tree_sha"] == tree
          assert frozen["image_tar_sha256"] == image_tar_sha
          assert manifest.get("status") == "GREEN"
          assert manifest.get("bundle_sha256")
          print("POROTA_RUNTIME_PROVENANCE_MATERIALIZED=GREEN")
          PY
          sudo -n python3 - "$REPO/data/deploy/CURRENT_STATE_V2.json" "$CANDIDATE_SHA" "$DEPLOY_SHA" "$RUNTIME_IMAGE_ID" "$POST_STATE" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          path,candidate,deploy,image_id,post=sys.argv[1:]
          payload={
            "schema_version":2,
            "recorded_at":datetime.now(timezone.utc).isoformat(),
            "candidate_sha":candidate,
            "deploy_sha":deploy,
            "image_id":image_id,
            "mode":"PRODUCTION_PAPER",
            "real_orders_sent":0,
            "real_order_routes":"NOT_CALLED",
            "observer_state":post,
            "dashboard_health_http":200,
            "ppi_watch_untouched":True,
            "deployment_strategy":"FIX_FORWARD_ONLY",
            "build_once":True,
            "validation_status":"VALIDATED_RUNTIME",
          }
          import os,tempfile
          directory=os.path.dirname(path)
          fd,tmp=tempfile.mkstemp(prefix=".CURRENT_STATE_V2.",suffix=".tmp",dir=directory)
          try:
              with os.fdopen(fd,"w",encoding="utf-8") as handle:
                  json.dump(payload,handle,indent=2,sort_keys=True); handle.write("\n")
              os.replace(tmp,path)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print("CURRENT_STATE_V2=GREEN|validation_status=VALIDATED_RUNTIME")
          PY

          # Reconcile the critical approval gateway to the already-promoted
          # stable image before image cleanup. The control-plane code remains
          # host-mounted; this only removes the old immutable image pin.
          CRIT_CONTAINER=porota_critical_approval_rc6
          if sudo -n docker inspect "$CRIT_CONTAINER" >/dev/null 2>&1; then
            CRIT_IMAGE_BEFORE="$(sudo -n docker inspect -f '{{.Image}}' "$CRIT_CONTAINER")"
            if [ "$CRIT_IMAGE_BEFORE" != "$RUNTIME_IMAGE_ID" ]; then
              test "$(sudo -n systemctl is-active porota-critical-github-proxy-rc6.service)" = active
              test "$(sudo -n systemctl is-active porota-critical-approval-rc6.service)" = active
              UNIT_TEXT="$(sudo -n systemctl cat porota-critical-approval-rc6.service)"
              grep -Fq "$STABLE_IMAGE" <<<"$UNIT_TEXT"
              grep -Fq '/opt/porota-control-plane-rc6/current:/code:ro' <<<"$UNIT_TEXT"

              sudo -n docker run --rm --pull never --read-only --user botuser \
                --cap-drop ALL --security-opt no-new-privileges:true \
                --pids-limit 32 --memory 128m --tmpfs /tmp:rw,noexec,nosuid,size=16m \
                -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/code \
                -v /opt/porota-control-plane-rc6/current:/code:ro \
                --entrypoint python "$STABLE_IMAGE" \
                -c 'import fm_critical_approval_unix_runtime_rc6; print("CRITICAL_IMAGE_COMPATIBILITY=GREEN")'

              sudo -n systemctl restart porota-critical-approval-rc6.service
              CRIT_READY=0
              for _ in $(seq 1 40); do
                if [ "$(sudo -n systemctl is-active porota-critical-approval-rc6.service 2>/dev/null || true)" = active ]; then
                  CRIT_STATUS="$(sudo -n docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.RestartCount}}|{{.Image}}' "$CRIT_CONTAINER" 2>/dev/null || true)"
                  if [ "$CRIT_STATUS" = "running|healthy|0|$RUNTIME_IMAGE_ID" ]; then
                    CRIT_READY=1
                    break
                  fi
                fi
                sleep 2
              done
              test "$CRIT_READY" -eq 1
              sudo -n docker exec "$CRIT_CONTAINER" python -c 'from fm_critical_approval_unix_runtime_rc6 import UnixGithubIssuesClient; h=UnixGithubIssuesClient().health(); assert h.get("status")=="ok" and h.get("capability")=="issues_only",h; print("ISSUES_CAPABILITY_BROKER=GREEN")'

              OLD_IMAGE_USERS=0
              for cid in $(sudo -n docker ps -aq); do
                CID_IMAGE="$(sudo -n docker inspect -f '{{.Image}}' "$cid")"
                if [ "$CID_IMAGE" = "$CRIT_IMAGE_BEFORE" ]; then
                  OLD_IMAGE_USERS=1
                  echo "RC6_OLD_CRITICAL_IMAGE_STILL_REFERENCED=$cid"
                fi
              done
              test "$OLD_IMAGE_USERS" -eq 0

              for tag in $(sudo -n docker image inspect -f '{{range .RepoTags}}{{println .}}{{end}}' "$CRIT_IMAGE_BEFORE" 2>/dev/null | sed '/^<none>:/d' || true); do
                case "$tag" in
                  "$STABLE_IMAGE")
                    echo "RC6_OLD_CRITICAL_IMAGE_STABLE_TAG_COLLISION=RED"
                    exit 63
                    ;;
                  porota-trading-bot:17.0.0-rc6-candidate-*)
                    sudo -n docker image rm "$tag"
                    ;;
                  *)
                    echo "RC6_PRESERVE_NONCANDIDATE_IMAGE_TAG=$tag"
                    ;;
                esac
              done
              sudo -n docker image rm "$CRIT_IMAGE_BEFORE" >/dev/null 2>&1 || true
              echo "CRITICAL_APPROVAL_IMAGE_RECONCILED=GREEN|image=$RUNTIME_IMAGE_ID"
            fi
          fi

          # Remove only tagged RC6 candidate images that no container references.
          # Other unused images remain untouched; dangling layers are handled below.
          for image_id in $(sudo -n docker image ls -q --no-trunc | sort -u); do
            IMAGE_IN_USE=0
            for cid in $(sudo -n docker ps -aq); do
              if [ "$(sudo -n docker inspect -f '{{.Image}}' "$cid")" = "$image_id" ]; then
                IMAGE_IN_USE=1
                break
              fi
            done
            if [ "$IMAGE_IN_USE" -eq 1 ]; then
              continue
            fi
            for tag in $(sudo -n docker image inspect -f '{{range .RepoTags}}{{println .}}{{end}}' "$image_id" 2>/dev/null | sed '/^<none>:/d' || true); do
              case "$tag" in
                porota-trading-bot:17.0.0-rc6-candidate-*)
                  echo "RC6_REMOVE_UNUSED_CANDIDATE_IMAGE=$tag"
                  sudo -n docker image rm "$tag"
                  ;;
              esac
            done
          done

          # Mandatory final cleanup after runtime validation/provenance.
          sudo -n mkdir -p "$REPO/data/deploy"
          sudo -n python3 "$REPO/scripts/rc6_disk_housekeeping.py" \
            --policy "$REPO/ops/policy/rc6-disk-housekeeping-v1.json" \
            --mode cleanup \
            --json-out "$REPO/data/deploy/last-deploy-housekeeping.json"
          sudo -n docker image rm "$FROZEN_IMAGE" >/dev/null 2>&1 || true
          sudo -n docker image prune -f
          sudo -n docker builder prune -af
          if sudo -n docker buildx version >/dev/null 2>&1; then sudo -n docker buildx prune -af; fi
          rm -rf "$REMOTE_DIR"
          mapfile -t FINAL_DISK_METRICS < <(python3 -c 'import os,shutil; d=shutil.disk_usage("/"); v=os.statvfs("/"); print(d.free); print(f"{100.0*v.f_ffree/v.f_files:.6f}")')
          DISK_AFTER="${FINAL_DISK_METRICS[0]}"
          FINAL_INODE_FREE_PERCENT="${FINAL_DISK_METRICS[1]}"
          echo "DISK_AFTER=$DISK_AFTER"
          echo "FINAL_INODE_FREE_PERCENT=$FINAL_INODE_FREE_PERCENT"
          echo "SPACE_RECOVERED=$((DISK_AFTER-DISK_BEFORE))"
          FINAL_MIN_FREE="$(python3 -c 'import json; print(json.load(open("'"$REPO"'/ops/policy/rc6-disk-housekeeping-v1.json"))["disk"]["post_cleanup_min_free_bytes"])')"
          FINAL_MIN_INODE="$(python3 -c 'import json; print(json.load(open("'"$REPO"'/ops/policy/rc6-disk-housekeeping-v1.json"))["disk"]["min_inode_free_percent"])')"
          echo "RC6_DISK_FINAL_MIN_FREE=$FINAL_MIN_FREE"
          echo "RC6_DISK_FINAL_MIN_INODE_PERCENT=$FINAL_MIN_INODE"
          test "$DISK_AFTER" -ge "$FINAL_MIN_FREE"
          python3 - "$FINAL_INODE_FREE_PERCENT" "$FINAL_MIN_INODE" <<'PY'
          import sys
          assert float(sys.argv[1]) >= float(sys.argv[2])
          PY
          test "$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_observer)" = running
          test "$(sudo -n docker inspect -f '{{.State.Status}}' porota_production_dashboard)" = running
          if sudo -n docker inspect "$CRIT_CONTAINER" >/dev/null 2>&1; then
            test "$(sudo -n docker inspect -f '{{.State.Status}}' "$CRIT_CONTAINER")" = running
            test "$(sudo -n docker inspect -f '{{.Image}}' "$CRIT_CONTAINER")" = "$RUNTIME_IMAGE_ID"
            test "$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CRIT_CONTAINER")" = healthy
          fi
          PPI_WATCH_FINAL="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          test "$PPI_WATCH_FINAL" = "$PPI_WATCH_BEFORE"
          echo "RC6_FINAL_HOUSEKEEPING=GREEN|free=$DISK_AFTER|inode_free_percent=$FINAL_INODE_FREE_PERCENT"
          echo "REAL_ORDERS_SENT=0 REAL_ORDER_ROUTES=NOT_CALLED"
          echo "RC6_DEPLOY_V2=GREEN|candidate=$CANDIDATE_SHA|deploy=$DEPLOY_SHA|image=$RUNTIME_IMAGE_ID|expected_image=$EXPECTED_IMAGE_ID"
          REMOTE

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '### POROTA RC6 Deploy V2'
            echo "- Deploy commit: `$DEPLOY_SHA`"
            echo "- Frozen candidate: `$CANDIDATE_SHA`"
            echo "- Predeploy run: `$PREDEPLOY_RUN_ID`"
            echo '- BUILD ONCE promotion: GREEN'
            echo '- PRODUCTION_PAPER: required'
            echo '- real_orders_sent: 0 required'
            echo '- PPI Watch: untouched'
            echo '- Strategy: FIX-FORWARD ONLY'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Runner cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/porota-frozen-v2 /tmp/porota-frozen-v2.zip /tmp/porota-frozen-candidate.json /tmp/porota-predeploy-image.tar.gz /tmp/porota-deploy-bundle-v2.tgz /tmp/porota-deploy-bundle-v2-manifest.json /tmp/porota-host-manifest-v2.json /tmp/porota-host-policy-v2.json
          rm -f "$HOME/.ssh/porota_rc6_deploy"
          echo "POROTA_DEPLOY_V2_RUNNER_CLEANUP=GREEN"
