name: RC6 Wave1A Safety Observability Deploy 2026-09-08

on:
  push:
    branches: [deploy/rc6-wave1a-safety-observability-20260908]
    paths:
      - 'm_instrument_universe.py'
      - 'bf_production_paper_observer.py'
      - 'rc6_operational_alerts.py'
      - 'tests/test_rc6_no_budget_permission_probe.py'
      - 'tests/test_rc6_operational_alerts.py'
      - '.github/workflows/rc6-wave1a-safety-observability-deploy-20260908.yml'

permissions:
  contents: read

concurrency:
  group: rc6-wave1a-safety-observability-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact live-baseline diff gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=c17b0d777ba49d88c53c5a7ed14218d8eaa94638
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'm_instrument_universe.py',
            'bf_production_paper_observer.py',
            'rc6_operational_alerts.py',
            'tests/test_rc6_no_budget_permission_probe.py',
            'tests/test_rc6_operational_alerts.py',
            '.github/workflows/rc6-wave1a-safety-observability-deploy-20260908.yml',
          }
          got=set(Path('/tmp/changed.txt').read_text().splitlines())
          assert got <= allowed, sorted(got-allowed)
          assert {'m_instrument_universe.py','bf_production_paper_observer.py','rc6_operational_alerts.py'} <= got
          print('WAVE1A_DIFF_SCOPE=GREEN')
          PY
      - name: Install canonical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and focused tests
        run: |
          set -euo pipefail
          python -m py_compile m_instrument_universe.py bf_production_paper_observer.py rc6_operational_alerts.py
          python -m pytest -q tests/test_rc6_no_budget_permission_probe.py tests/test_rc6_operational_alerts.py
      - name: No order-route permission probe invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('m_instrument_universe.py').read_text(encoding='utf-8'))
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='detect_account_permissions')
          names=[]
          for n in ast.walk(fn):
              if isinstance(n,ast.Attribute): names.append(n.attr)
          forbidden={'budget_order','confirm_order','cancel_order'}
          assert not (forbidden & set(names)), sorted(forbidden & set(names))
          print('NO_ORDER_ROUTE_PERMISSION_PROBE=GREEN')
          PY
      - name: Alert bridge safety invariant
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('rc6_operational_alerts.py')
          s=p.read_text(encoding='utf-8').lower()
          assert 'budget_order' not in s and 'confirm_order' not in s and 'cancel_order' not in s
          tree=ast.parse(p.read_text(encoding='utf-8'))
          imports=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports += [a.name for a in n.names]
              elif isinstance(n,ast.ImportFrom): imports.append(n.module or '')
          assert not any('ppi_client' in x for x in imports)
          print('ALERT_BRIDGE_ORDER_ISOLATION=GREEN')
          PY
      - name: Build exact candidate image
        run: |
          docker build --pull=false --label "porota.commit=$GITHUB_SHA" --label 'porota.wave=rc6-wave1a' -t porota-wave1a:${GITHUB_SHA} .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m --tmpfs /app/data:rw,nosuid,nodev,size=64m --entrypoint python porota-wave1a:${GITHUB_SHA} -c "import _version; assert _version.VERSION=='17.0.0-rc6'; assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'; import rc6_operational_alerts; print('IMAGE_INVARIANTS=GREEN')"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_wave1a"
          chmod 600 "$HOME/.ssh/porota_wave1a"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Preflight and deploy without automatic rollback
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: deploy/rc6-wave1a-safety-observability-20260908
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_wave1a" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          EXPECTED_BASE=c17b0d777ba49d88c53c5a7ed14218d8eaa94638
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          cd "$REPO"
          echo '=== WAVE1A PRECHECK ==='
          echo "UTC=$(date -u +%FT%TZ)"
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA"
          test "$CURRENT_SHA" = "$EXPECTED_BASE"
          TRACKED_DIFF=$(git diff --name-only)
          printf '%s\n' "$TRACKED_DIFF"
          python3 - "$TRACKED_DIFF" <<'PY'
          import sys
          got={x for x in sys.argv[1].splitlines() if x}
          allowed={'scripts/porota_export_runtime_logs_hf6.sh','scripts/porota_export_scheduler_state_hf6.sh'}
          assert got <= allowed, sorted(got-allowed)
          print('HOST_TRACKED_DIFF_GATE=GREEN')
          PY
          sudo -n docker inspect -f 'OBSERVER_RUNNING={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD_RUNNING={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'PRE_DB={q}|{mode}|{real}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          FREE=$(df -PB1 "$REPO" | awk 'NR==2{print $4}')
          echo "DISK_FREE_PRE=$FREE"
          test "$FREE" -ge 6442450944

          echo '=== FETCH / TARGET PROOF ==='
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$TARGET_SHA"
          git diff --name-only "$EXPECTED_BASE" "$TARGET_SHA" | sort

          echo '=== HOST BUILD ==='
          TMP=$(mktemp -d "$HOME/porota-wave1a.XXXXXX")
          trap 'git -C "$REPO" worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label 'porota.wave=rc6-wave1a' -t "$TARGET_IMAGE" "$TMP/source"
          test "$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"

          echo '=== ACTIVATE — NO AUTOMATIC ROLLBACK POLICY ==='
          git checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          chmod 0755 scripts/porota_export_runtime_logs_hf6.sh scripts/porota_export_scheduler_state_hf6.sh 2>/dev/null || true
          git branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH" >/dev/null 2>&1 || true
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation

          echo '=== POSTFLIGHT ==='
          sleep 8
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          import rc6_operational_alerts
          import m_instrument_universe
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'POST_DB={q}|{mode}|{real}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          print('WAVE1A_MODULE_IMPORTS=GREEN')
          PY
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer)" = 'true|0|porota-trading-bot:17.0.0-rc6'
          test "$(sudo -n docker inspect -f '{{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard)" = 'true|0|porota-trading-bot:17.0.0-rc6'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ROLLBACK_AUTOMATICO=NO'
          echo 'WAVE1A_DEPLOY=GREEN'
          REMOTE
      - name: Failure diagnostics only — never rollback
        if: failure()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set +e
          ssh -i "$HOME/.ssh/porota_wave1a" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          echo '=== WAVE1A FAILURE DIAGNOSTICS READ ONLY ==='
          date -u
          cd /opt/porota-trading 2>/dev/null || exit 0
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null)"
          git status --short 2>/dev/null | head -n 40
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer 2>/dev/null || true
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard 2>/dev/null || true
          sudo -n docker logs --tail 100 porota_production_observer 2>&1 | sed -E 's/(Bearer|Authorization:)[[:space:]]+[A-Za-z0-9._~+\/-]+/\1 <REDACTED>/Ig; s/(token|secret|password|cookie|api[_-]?key)(["= :]+)[^ ,}"[:space:]]+/\1\2<REDACTED>/Ig' || true
          echo 'ROLLBACK_PERFORMED=NO'
          echo 'NEXT_ACTION=RCA_CORRECT_REDEPLOY_OR_REQUEST_USER_ROLLBACK_AUTHORIZATION'
          REMOTE
          exit 1
