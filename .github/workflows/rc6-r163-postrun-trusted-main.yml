# R163 proposal only. This file MUST be reviewed and merged through an
# authorized PR to protected default main before workflow_run can fire.
# R144/HOLD79 unchanged: no release, host access, build, or deploy.
name: RC6 R163 Trusted Main Postrun Bytes (AUDIT ONLY)

on:
  workflow_run:
    workflows: [RC6 R163 Offhost Guard79 Proof (PROBE ONLY)]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: rc6-r163-trusted-main-postrun-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  authenticate-postrun-zip:
    name: Authenticated REST ZIP bytes (TRUSTED MAIN AUDIT ONLY)
    if: >-
      ${{ github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.name == 'RC6 R163 Offhost Guard79 Proof (PROBE ONLY)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact default-main SHA, never upstream PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, immutable
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify trusted main source and audit raw ZIP
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC6_TRUSTED_MAIN_SHA: ${{ github.sha }}
          RC6_EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          RC6_EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main || exit 79
          test "$(git rev-parse HEAD)" = "$RC6_TRUSTED_MAIN_SHA" || exit 79
          RC6_TRUSTED_SOURCE_SHA256=ab1e8705512565c777fd3c1fba10ed6d63acd898a0707005a3f6cb06e3aa101f
          printf '%s  %s\n' "$RC6_TRUSTED_SOURCE_SHA256" \
            scripts/rc6_r163_trusted_postrun_byte_audit.py | sha256sum --check --status || exit 79
          [[ "$RC6_EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 79
          [[ "$RC6_EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 79
          python3 -I scripts/rc6_r163_trusted_postrun_byte_audit.py \
            --event "$GITHUB_EVENT_PATH" \
            --run-id "$RC6_EXPECTED_RUN_ID" \
            --run-attempt "$RC6_EXPECTED_RUN_ATTEMPT"
          echo 'RC6_R163_TRUSTED_MAIN=BYTES_MATCH_READONLY|automatic_go=NO|release_go=NO|runtime_verified=NO'
      - name: Keep release and runtime gates closed
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RC6_R163_TRUSTED_POSTRUN=AUDIT_ONLY|R144=UNCHANGED|HOLD79=UNCHANGED|automatic_go=NO'
          echo 'Final PAPER, Deploy V2 and runtime gates are not exercised by this workflow.'
