name: RC6 Wave17 Currentbase Live UX Proof V2 2026-09-09

on:
  push:
    branches: [deploy-prep/rc6-wave17-currentbase-20260909]
    paths: [.github/workflows/rc6-wave17-currentbase-live-ux-proof-v2-20260909.yml]

permissions:
  contents: read

jobs:
  live-ux-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_w17"
          chmod 600 "$HOME/.ssh/porota_w17"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify authenticated live UX read-only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_w17" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = 9197aedf35fe1739b594c742902e80df069c47c9
          token=$(awk -F= '$1=="DASHBOARD_ACCESS_TOKEN"{v=$0;sub(/^[^=]*=/,"",v);print v;exit}' .env)
          token=${token%$'\r'}; token=${token#\"}; token=${token%\"}; token=${token#\'}; token=${token%\'}
          test -n "$token"
          for path in / /vivo /trading /riesgo /validacion /historicos; do
            body=$(mktemp)
            code=$(curl -sS -H "Authorization: Bearer $token" -o "$body" -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "HTTP $path=$code"; test "$code" = 200
            if grep -qi '<table' "$body"; then grep -qi '<th' "$body" || { echo "MISSING_TABLE_HEADERS=$path"; exit 21; }; fi
            ! grep -Eqi '<caption[^>]*porota-table-title' "$body"
            rm -f "$body"
          done
          unset token
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          print('W17_LIVE_SAFETY=GREEN')
          PY
          echo 'W17_LIVE_UX=GREEN'
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE
