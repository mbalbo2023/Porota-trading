name: RC6 Wave9 Final Ready Deploy 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave9-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave9-final-ready-deploy-20260909.yml']
permissions:
  contents: read
jobs:
  ready-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Contract safety certification
        run: |
          set -Eeuo pipefail
          python -m pip install -q pytest
          python -m py_compile fe_fixed_income_nominal_contract_rc6.py rc6_cauciones_contract.py
          PYTHONPATH=. pytest -q tests/test_fixed_income_nominal_contract_rc6.py tests/test_rc6_cauciones_contract.py
          python - <<'PY'
          import ast
          files=('fe_fixed_income_nominal_contract_rc6.py','rc6_cauciones_contract.py')
          bad=[]
          for p in files:
              t=ast.parse(open(p,encoding='utf-8').read())
              for n in ast.walk(t):
                  if isinstance(n,ast.Import): bad += [a.name for a in n.names if a.name in ('requests','httpx','sqlite3')]
          assert not bad,bad
          print('CONTRACTS=PURE_NO_RUNTIME_IO')
          PY
          ! grep -REn 'send_order|place_order|cancel_order|api/Orders|/Operar/' fe_fixed_income_nominal_contract_rc6.py rc6_cauciones_contract.py
          echo "CERTIFIED_SOURCE_SHA=${GITHUB_SHA}"
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w9ready"; chmod 600 "$HOME/.ssh/w9ready"; printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only live exact-SHA proof
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w9ready" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail; cd /opt/porota-trading; LIVE=9197aedf35fe1739b594c742902e80df069c47c9; test "$(git rev-parse HEAD)" = "$LIVE"
          OBS=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer); DASH=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on'); q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close(); print(q,m,r); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          git fetch --no-tags origin deploy-prep/rc6-wave9-currentbase-20260909; test "$(git rev-parse origin/deploy-prep/rc6-wave9-currentbase-20260909)" = "$TARGET_SHA"
          test "$OBS" = "$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)"; test "$DASH" = "$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)"; test "$(git rev-parse HEAD)" = "$LIVE"
          echo "CERTIFIED_SOURCE_SHA=$TARGET_SHA"; echo 'ORDER_ROUTES=NOT_CALLED'; echo 'RUNTIME_CHANGED=NO'; echo 'W9_READY_DEPLOY=YES'
          REMOTE
