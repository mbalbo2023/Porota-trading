name: RC6 Wave11 Currentbase Readiness 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave11-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave11-currentbase-readiness-20260909.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate shadow modules
        run: |
          set -euo pipefail
          python -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
          python -m pytest -q tests/test_event_risk_shadow_rc6.py tests/test_fk_gdelt_shadow_feed_rc6.py
          python - <<'PY'
          import fi_event_risk_shadow_rc6 as e
          assert getattr(e,'AUTHORITY','SHADOW') != 'BINDING' or hasattr(e,'assert_shadow_only')
          e.assert_shadow_only()
          print('WAVE11_EVENT_RISK=CODE_READY_CANDIDATE')
          print('RUNTIME_MUTATION=NO')
          print('ORDER_ROUTES=NOT_CALLED')
          PY
