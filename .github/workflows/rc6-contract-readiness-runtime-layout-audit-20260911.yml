name: RC6 Contract Readiness Runtime Layout Audit 2026-09-11

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-contract-readiness-runtime-layout-audit-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert PAPER identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          python -m py_compile cp_contract_evidence_v2_hf6.py cq_contract_readiness_hf6.py
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only runtime layout
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          TARGET=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          echo "HOST_SHA=$(git -C "$ROOT" rev-parse HEAD)"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo "HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('SAFETY='+'|'.join(map(str,(q,*r))))
          assert q=='ok' and r and r[0]=='PRODUCTION_PAPER' and int(r[2] or 0)==0
          PY
          echo '=== CONTAINER ==='
          sudo -n docker inspect "$OBS" --format 'IMAGE={{.Config.Image}}|IMAGE_ID={{.Image}}|WORKDIR={{.Config.WorkingDir}}'
          echo '=== MOUNTS ==='
          sudo -n docker inspect "$OBS" --format '{{range .Mounts}}{{println .Type "|" .Source "|" .Destination "|" .RW}}{{end}}'
          echo '=== MODULE ==='
          sudo -n docker exec "$OBS" python - <<'PY'
          import cp_contract_evidence_v2_hf6 as m,inspect,hashlib,pathlib
          p=pathlib.Path(inspect.getfile(m))
          b=p.read_bytes()
          print('MODULE_PATH='+str(p))
          print('MODULE_SHA256='+hashlib.sha256(b).hexdigest())
          print('MODULE_WRITABLE='+str(p.parent.exists()))
          PY
          echo '=== COMPOSE REFERENCES ==='
          (grep -RniE 'porota_production_observer|observer|volumes:|/app' "$ROOT"/docker-compose*.yml "$ROOT"/compose*.yml 2>/dev/null | head -n 180) || true
          echo MUTATIONS=NONE
          echo REAL_ORDER_ROUTES=NOT_CALLED
          echo REAL_ORDERS_SENT=0
          HOST
