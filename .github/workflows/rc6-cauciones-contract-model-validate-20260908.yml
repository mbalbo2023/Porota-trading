name: RC6 Cauciones Contract Model Validate 2026-09-08

on:
  push:
    branches:
      - feature/rc6-cauciones-contract-model-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile pure contract module
        run: python -m py_compile rc6_cauciones_contract.py
      - name: Run cauciones contract tests
        run: python -m pytest -q tests/test_rc6_cauciones_contract.py
      - name: Enforce isolation from broker and order routes
        run: |
          ! grep -niE 'ppi_client|budget_order|confirm_order|cancel_order|requests\.|httpx\.|aiohttp\.' rc6_cauciones_contract.py
          echo 'BROKER_NETWORK_ORDER_IMPORTS=NONE'
      - name: Final verdict
        run: |
          echo 'CAUCIONES_CONTRACT_MODEL=GREEN'
          echo 'DEPLOY_PERFORMED=NO'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
