name: RC6 W12 Exact Blocked POST Readonly 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-exact-blocked-post-readonly-20260910.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert immutable RC6 safety
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read exact verification guard evidence only
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          HELPER=/usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py
          WRAPPER=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          OUT=/opt/porota-trading/data/contract_evidence/rc6_trusted
          echo '=== APPROVED_POST_POLICY_SOURCE ==='
          sudo -n python3 - "$HELPER" <<'PY'
          import ast,sys
          from pathlib import Path
          p=Path(sys.argv[1]); src=p.read_text(encoding='utf-8',errors='replace'); tree=ast.parse(src)
          allowed={'APPROVED_AUTH_POSTS','IGNORED_BLOCKED_POST_HOSTS','ALLOWED_PAGE_HOSTS'}
          for node in tree.body:
              if isinstance(node,(ast.Assign,ast.AnnAssign)):
                  targets=node.targets if isinstance(node,ast.Assign) else [node.target]
                  names=[t.id for t in targets if isinstance(t,ast.Name)]
                  if not any(n in allowed for n in names): continue
                  try: val=ast.literal_eval(node.value)
                  except Exception: val='<NON_LITERAL>'
                  for n in names:
                      if n in allowed: print(f'{n}={val!r}')
          PY
          echo '=== REAUTH_STATE_WRITING_SOURCE ==='
          sudo -n python3 - "$HELPER" "$WRAPPER" <<'PY'
          import sys,re
          from pathlib import Path
          sensitive=re.compile(r'(?i)(password|passwd|secret|token|cookie|otp|authorization)')
          wanted=('blocked_post_path','status_payload','clean_host_path','REAUTH','reauth','--state','state','write_text','json.dump','json.dumps','print(')
          for name in sys.argv[1:]:
              p=Path(name); print('FILE='+str(p))
              for i,line in enumerate(p.read_text(encoding='utf-8',errors='replace').splitlines(),1):
                  if not any(w in line for w in wanted): continue
                  if sensitive.search(line): print(f'L{i}=<REDACTED_SECRET_RELATED_SOURCE_LINE>')
                  else: print(f'L{i}={line.strip()[:500]}')
          PY
          echo '=== W12_STATE_FILES ==='
          sudo -n find "$OUT" -maxdepth 2 -type f \( -iname '*state*.json' -o -iname '*reauth*.json' -o -iname '*status*.json' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 40 || true
          echo '=== SAFE_STATE_VALUES ==='
          sudo -n python3 - "$OUT" <<'PY'
          import json,sys,re
          from pathlib import Path
          root=Path(sys.argv[1]); files=[]
          for pat in ('*state*.json','*reauth*.json','*status*.json'):
              files.extend(root.rglob(pat))
          files=sorted(set(files), key=lambda p:p.stat().st_mtime, reverse=True)[:20]
          wanted={'status','detail','reason','stage','auth_status','blocked_post_path','blocked_path','path','host_path','generated_at','updated_at','real_orders_sent','order_routes','mode'}
          secretish=re.compile(r'(?i)(password|passwd|secret|token|cookie|otp|authorization)')
          def walk(v,prefix=''):
              if isinstance(v,dict):
                  for k,x in v.items():
                      key=str(k)
                      if secretish.search(key): continue
                      new=f'{prefix}.{key}' if prefix else key
                      if key in wanted and isinstance(x,(str,int,float,bool,type(None))):
                          s=str(x)
                          s=re.sub(r'([?&][^=]+=)[^& ]+',r'\1<REDACTED>',s)
                          print(f'{new}={s[:500]}')
                      elif isinstance(x,(dict,list)): walk(x,new)
              elif isinstance(v,list):
                  for idx,x in enumerate(v[:50]): walk(x,f'{prefix}[{idx}]')
          for p in files:
              print('STATE_FILE='+p.name)
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: print('PARSE='+type(e).__name__); continue
              walk(d)
          PY
          echo '=== RECENT_SERVICE_EXIT ==='
          sudo -n systemctl show porota-contract-evidence-rc6.service -p ExecMainStatus -p Result -p ActiveState -p InactiveExitTimestamp --no-pager || true
          echo MUTATIONS=NONE
          echo COLLECTOR_EXECUTED=NO
          echo SECRETS_VALUES_PRINTED=NO
          echo ORDER_ROUTES=NOT_CALLED
          HOST
