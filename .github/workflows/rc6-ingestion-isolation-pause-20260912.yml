name: RC6 ingestion isolation pause 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ingestion-isolation-pause-20260912.yml']

permissions:
  contents: read

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Pause scheduled producers and maintenance during ingestion closeout
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }
          AUDIT=/opt/porota-trading/data/audit/ingestion_isolation_pause_20260912.txt
          sudo -n mkdir -p /opt/porota-trading/data/audit
          {
            echo "PAUSED_AT=$(date -u +%FT%TZ)"
            echo "HOST_SHA=$ACTUAL"
            echo 'REASON=TEMPORARY_INGESTION_ISOLATION_USER_REQUEST'
            echo '=== PRIOR_TIMER_STATE ==='
          } | sudo -n tee "$AUDIT" >/dev/null

          TIMERS=(
            porota-a3-history-daily-rc6.timer
            porota-a3-history-reconcile-rc6.timer
            porota-a3-history-weekend-rc6.timer
            porota-candle-integrity-rc6.timer
            porota-contract-evidence-rc6.timer
            porota-contract-evidence-weekend-backfill-rc6.timer
            porota-fast-functional-health-rc6.timer
            porota-full-db-integrity-rc6.timer
            porota-functional-health-rc6.timer
            porota-history-postclose-rc6.timer
            porota-host-general-backup-rc6.timer
            porota-introspection-publish-rc6.timer
            porota-introspection-rc6.timer
            porota-log-export-hf6.timer
            porota-ppi-argentina-nightly-rc6.timer
            porota-preopen-rc6.timer
            porota-scheduler-export-hf6.timer
            porota-weekend-ingestion-audit-rc6.timer
          )
          for t in "${TIMERS[@]}"; do
            if systemctl cat "$t" >/dev/null 2>&1; then
              echo "TIMER=$t ENABLED=$(systemctl is-enabled "$t" 2>/dev/null || true) ACTIVE=$(systemctl is-active "$t" 2>/dev/null || true)" | sudo -n tee -a "$AUDIT" >/dev/null
              sudo -n systemctl disable --now "$t"
            fi
          done

          SERVICES=(
            porota-a3-history-rc6@DAILY_INCREMENTAL.service
            porota-a3-history-rc6@RECONCILE.service
            porota-a3-history-rc6@WEEKEND_DEEP.service
            porota-candle-integrity-rc6.service
            porota-contract-evidence-rc6.service
            porota-contract-evidence-weekend-backfill-rc6.service
            porota-fast-functional-health-rc6.service
            porota-full-db-integrity-rc6.service
            porota-functional-health-rc6.service
            porota-history-postclose-rc6.service
            porota-host-general-backup-rc6.service
            porota-introspection-publish-rc6.service
            porota-introspection-rc6.service
            porota-log-export-hf6.service
            porota-ppi-argentina-nightly-rc6.service
            porota-preopen-rc6.service
            porota-scheduler-export-hf6.service
            porota-weekend-ingestion-audit-rc6.service
          )
          for s in "${SERVICES[@]}"; do
            st="$(systemctl is-active "$s" 2>/dev/null || true)"
            if [[ "$st" == active || "$st" == activating ]]; then
              echo "STOPPING_SERVICE=$s STATE=$st" | sudo -n tee -a "$AUDIT" >/dev/null
              sudo -n systemctl stop "$s" || true
            fi
          done

          echo '=== STALE_PROCESS_CLEANUP ===' | sudo -n tee -a "$AUDIT" >/dev/null
          mapfile -t stale_iol < <(ps -eo pid=,ppid=,etimes=,args= | awk '($2==1 && $3>600 && ($0 ~ /IOL_ENABLED=true/ || $0 ~ /api\.invertironline\.com\/token/)){print $1}')
          if ((${#stale_iol[@]})); then
            echo "STALE_IOL_PIDS=${stale_iol[*]}" | sudo -n tee -a "$AUDIT" >/dev/null
            sudo -n kill -TERM "${stale_iol[@]}" 2>/dev/null || true
            sleep 2
            for p in "${stale_iol[@]}"; do sudo -n kill -KILL "$p" 2>/dev/null || true; done
          else
            echo 'STALE_IOL_PIDS=NONE' | sudo -n tee -a "$AUDIT" >/dev/null
          fi

          mapfile -t stale_stdin < <(ps -eo pid=,etimes=,args= | awk '($2>3600 && $3=="python" && $4=="-"){print $1}')
          if ((${#stale_stdin[@]})); then
            echo "STALE_PYTHON_STDIN_PIDS=${stale_stdin[*]}" | sudo -n tee -a "$AUDIT" >/dev/null
            sudo -n kill -TERM "${stale_stdin[@]}" 2>/dev/null || true
            sleep 2
            for p in "${stale_stdin[@]}"; do sudo -n kill -KILL "$p" 2>/dev/null || true; done
          else
            echo 'STALE_PYTHON_STDIN_PIDS=NONE' | sudo -n tee -a "$AUDIT" >/dev/null
          fi

          echo '=== POST_PAUSE_TIMERS ==='
          for t in "${TIMERS[@]}"; do
            if systemctl cat "$t" >/dev/null 2>&1; then echo "TIMER=$t ENABLED=$(systemctl is-enabled "$t" 2>/dev/null || true) ACTIVE=$(systemctl is-active "$t" 2>/dev/null || true)"; fi
          done
          echo '=== POST_PAUSE_RELEVANT_ACTIVE ==='
          systemctl list-units --type=service --state=active,activating --no-legend --no-pager 2>/dev/null | grep -Ei 'porota|ppi|history|contract|scrap|a3' || true
          echo '=== POST_PAUSE_OLD_STDIN ==='
          ps -eo pid,etimes,args | awk '($2>3600 && $3=="python" && $4=="-"){print}' || true
          echo '=== SAFETY ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import bf_production_paper_observer as m
          s=m.runtime_store()
          with s.connect() as c:
              print('DB_QUICK_CHECK='+str(c.execute('pragma quick_check').fetchone()[0]))
              r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print('SAFETY=%s|%s'%r)
              assert r[0]=='PRODUCTION_PAPER' and int(r[1] or 0)==0
          PY
          echo "RESTORE_MANIFEST=$AUDIT"
          echo 'INGESTION_ISOLATION=ACTIVE'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'REAL_ORDERS_SENT=0'
          HOST
