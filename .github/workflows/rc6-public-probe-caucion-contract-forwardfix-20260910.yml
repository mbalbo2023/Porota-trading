name: RC6 Public Probe Caucion Contract Forward Fix 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - '.github/workflows/rc6-public-probe-caucion-contract-forwardfix-20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forward-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable RC6 PAPER safety identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo RC6_PAPER_SAFETY=GREEN

      - name: Align public probe with official caucion discovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/v17_ppi_public_probe.py')
          s = p.read_text(encoding='utf-8')
          old = "QUERIES = (('CAUCION','CAUCIONES'),('PESOS','CAUCIONES'),\n           ('DOLAR','CAUCIONES'),('ALUA','ACCIONES'))"
          new = "QUERIES = (('CAUCION','CAUCIONES'),('ALUA','ACCIONES'))"
          if old not in s:
              raise SystemExit('PROBE_QUERIES_SOURCE_DRIFT')
          s = s.replace(old, new, 1)
          old = """        # Sólo identidades devueltas; nunca pedir un book para el texto del filtro.\n        for r in rows:\n            ticker=r.get('ticker')\n            if (not isinstance(ticker,str) or not ticker.strip() or len(ticker)>80\n                    or r.get('type')!=family or r.get('market')!='BYMA'):\n                continue\n            identity=(ticker,family)\n            if identity not in seen:\n                seen.add(identity)\n                candidates.append(identity)\n                break  # un candidato nuevo por filtro; máximo cuatro en total\n"""
          new = """        # Sólo identidades devueltas; nunca pedir un book para el texto del filtro.\n        # El alias CAUCION ya expande al contrato oficial PESOS{días}/DOLAR{días};\n        # tomar hasta tres identidades distintas preserva la muestra histórica sin\n        # volver a emitir los filtros legacy redundantes PESOS/DOLAR.\n        per_filter_limit = 3 if family == 'CAUCIONES' and query == 'CAUCION' else 1\n        added = 0\n        for r in rows:\n            ticker=r.get('ticker')\n            if (not isinstance(ticker,str) or not ticker.strip() or len(ticker)>80\n                    or r.get('type')!=family or r.get('market')!='BYMA'):\n                continue\n            identity=(ticker,family)\n            if identity not in seen:\n                seen.add(identity)\n                candidates.append(identity)\n                added += 1\n                if added >= per_filter_limit:\n                    break\n"""
          if old not in s:
              raise SystemExit('PROBE_CANDIDATE_LOOP_SOURCE_DRIFT')
          s = s.replace(old, new, 1)
          if "if len(report['http'])>=24:" not in s:
              raise SystemExit('PROBE_HTTP_LIMIT_SOURCE_DRIFT')
          s = s.replace("if len(report['http'])>=24:", "if len(report['http'])>=32:", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_ppi_public_probe_v17.py')
          s = p.read_text(encoding='utf-8')
          old = """        elif name=='searchinstrument':\n            filters={'CAUCION':'CAU-FIXTURE-1','PESOS':'CAU-FIXTURE-2',\n                     'DOLAR':'CAU-FIXTURE-3','ALUA':'ALUA'}\n            value=[{'ticker':filters[query['ticker'][0]],'type':query['type'][0],\n                    'market':'BYMA','currency':'Pesos','apiSecret':FIXTURE_SECRET}]\n"""
          new = """        elif name=='searchinstrument':\n            ticker=query['ticker'][0]\n            instrument_type=query['type'][0]\n            if instrument_type=='CAUCIONES' and (ticker.startswith('PESOS') or ticker.startswith('DOLAR')):\n                returned=ticker\n            else:\n                returned={'ALUA':'ALUA'}[ticker]\n            value=[{'ticker':returned,'type':instrument_type,\n                    'market':'BYMA','currency':'Pesos','apiSecret':FIXTURE_SECRET}]\n"""
          if old not in s:
              raise SystemExit('PUBLIC_PROBE_FIXTURE_SOURCE_DRIFT')
          s = s.replace(old, new, 1)
          if "assert len(calls)==20 and sum(p.endswith('LoginApi') for _,p,_ in calls)==1" not in s:
              raise SystemExit('PUBLIC_PROBE_CALLCOUNT_SOURCE_DRIFT')
          s = s.replace("assert len(calls)==20 and sum(p.endswith('LoginApi') for _,p,_ in calls)==1",
                        "assert len(calls)==27 and sum(p.endswith('LoginApi') for _,p,_ in calls)==1", 1)
          if s.count("assert report['quotes']==[] and len(calls)==12") != 2:
              raise SystemExit('PUBLIC_PROBE_EMPTY_CALLCOUNT_SOURCE_DRIFT')
          s = s.replace("assert report['quotes']==[] and len(calls)==12",
                        "assert report['quotes']==[] and len(calls)==19")
          old = "assert all(r['status']=='NOT_ENUMERATED' for r in report['searches'][:3])"
          if old not in s:
              raise SystemExit('PUBLIC_PROBE_NOT_ENUMERATED_SOURCE_DRIFT')
          s = s.replace(old, "assert report['searches'][0]['status']=='NOT_ENUMERATED'", 1)
          old = """        for _ in range(24):\n            requests.get('https://clientapi.portfoliopersonal.com/api/1.0/Configuration/Markets')\n        with pytest.raises(probe.ProbeStop,match='HTTP_LIMIT'):\n"""
          new = """        for _ in range(32):\n            requests.get('https://clientapi.portfoliopersonal.com/api/1.0/Configuration/Markets')\n        with pytest.raises(probe.ProbeStop,match='HTTP_LIMIT'):\n"""
          if old not in s:
              raise SystemExit('PUBLIC_PROBE_LIMIT_TEST_SOURCE_DRIFT')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python -m compileall -q scripts/v17_ppi_public_probe.py tests/test_ppi_public_probe_v17.py
          git diff --check
          git diff -- scripts/v17_ppi_public_probe.py tests/test_ppi_public_probe_v17.py

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Prove focused public-probe and read-only contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q tests/test_ppi_public_probe_v17.py tests/test_bd_ppi_readonly_guard.py
          echo PUBLIC_PROBE_OFFICIAL_CAUCION_CONTRACT=GREEN
          echo REAL_ORDER_ROUTES=NOT_CALLED

      - name: Persist source fix only after focused proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v17_ppi_public_probe.py tests/test_ppi_public_probe_v17.py
          if git diff --cached --quiet; then
            echo NO_SOURCE_DELTA
          else
            git commit -m 'fix(rc6): align public probe with official caucion discovery'
            git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
          fi

      - name: Continue full integrated suite and expose next failure
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -x -vv --tb=short > /tmp/pytest-next.txt 2>&1
          rc=$?
          echo "PYTEST_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '===== FIRST FAILURE EXTRACT ====='
            grep -nE '(^_{3,}|FAILED|ERROR|E   |AssertionError|NameError|TypeError|AttributeError|ImportError|ModuleNotFoundError|KeyError|ValueError)' /tmp/pytest-next.txt | tail -n 120 || true
            echo '===== LAST 160 LINES ====='
            tail -n 160 /tmp/pytest-next.txt || true
            exit "$rc"
          fi
          tail -n 100 /tmp/pytest-next.txt
          echo INTEGRATED_TESTS=GREEN

      - name: Reassert safety invariants
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo REAL_ORDER_TEST=NOT_PERFORMED
          echo RC6_PAPER_SAFETY_FINAL=GREEN
