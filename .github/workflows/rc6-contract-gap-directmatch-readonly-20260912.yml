name: RC6 Contract Gap Direct Match Readonly 2026-09-12

on:
  push:
    branches:
      - fix/rc6-postfinal-contract-dom-stability-20260911
    paths:
      - .github/workflows/rc6-contract-gap-directmatch-readonly-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect exact literal matches in stored web tables
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          BASE=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          HEAD=$(git -C "$ROOT" rev-parse HEAD)
          git -C "$ROOT" merge-base --is-ancestor "$BASE" "$HEAD"
          echo "HOST_SHA=$HEAD"
          curl -fsS --max-time 5 http://127.0.0.1:8000/health; echo
          sudo -n docker exec -i "$OBS" python -u - <<'PY'
          import sqlite3,json,re
          from collections import defaultdict
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True,timeout=30); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          st=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          assert q=='ok' and st and st['mode']=='PRODUCTION_PAPER' and int(st['real_orders_sent'] or 0)==0
          print('SAFETY='+json.dumps({'quick_check':q,'mode':st['mode'],'session':st['session_state'],'real_orders_sent':st['real_orders_sent']},sort_keys=True))
          aliases={'ACCIONES_USA':'ACCIONES-USA','FCI_EXTERIOR':'FCI-EXTERIOR','FCI_LOCAL':'FCI','ETFS':'ETF'}
          canon=lambda v: aliases.get(str(v or '').strip().upper(),str(v or '').strip().upper())
          target_families=('CAUCIONES','OPCIONES','FUTUROS','LETRAS','ON','ACCIONES-USA','ETF','FCI','ACCIONES')
          api=defaultdict(list)
          for r in c.execute('select family,ticker,market from api_universe_v1'):
              fam=canon(r['family'])
              if fam in target_families: api[fam].append(str(r['ticker'] or '').strip().upper())
          # newest wildcard authenticated-web evidence per family; no network/browser run
          latest={}
          for fam0 in target_families:
              fam_variants=[fam0]
              if fam0=='ACCIONES-USA': fam_variants+=['ACCIONES_USA']
              if fam0=='FCI': fam_variants+=['FCI_LOCAL']
              ph=','.join('?' for _ in fam_variants)
              row=c.execute(f'''select cur.family,s.observed_at,s.evidence_json from contract_evidence_v2_current cur
                                join contract_evidence_v2_snapshots s on s.snapshot_id=cur.snapshot_id
                                where upper(cur.family) in ({ph}) and cur.source_class='PPI_AUTHENTICATED_WEB'
                                order by s.observed_at desc limit 1''',[x.upper() for x in fam_variants]).fetchone()
              latest[fam0]=row
          for fam in target_families:
              tickers=sorted(set(api.get(fam,[])))
              row=latest.get(fam)
              ev={}
              if row:
                  try: ev=json.loads(row['evidence_json'] or '{}')
                  except Exception: ev={}
              tables=[]
              if isinstance(ev,dict):
                  if isinstance(ev.get('tables'),list): tables=ev['tables']
                  elif isinstance(ev.get('unlinked_observations_sample'),list): tables=[]
              corpus=[]; headers=[]
              for t in tables:
                  if not isinstance(t,dict): continue
                  headers.extend(str(x) for x in (t.get('headers') or []))
                  for rr in (t.get('rows') or []):
                      if isinstance(rr,list): corpus.extend(str(x) for x in rr)
              normalized='\n'.join(corpus).upper()
              direct=[t for t in tickers if t and re.search(r'(?<![A-Z0-9./-])'+re.escape(t)+r'(?![A-Z0-9./-])',normalized)]
              print('DIRECT_MATCH='+json.dumps({'family':fam,'api_identities':len(tickers),'web_observed_at':row['observed_at'] if row else None,'headers':headers[:40],'materialized_cells':len(corpus),'direct_literal_matches':len(direct),'direct_match_sample':direct[:30]},ensure_ascii=False,sort_keys=True))
          c.close()
          print('MUTATIONS=NONE')
          print('BROWSER_RUN=NO')
          print('REAL_ORDER_ROUTES=NOT_CALLED')
          PY
          HOST
