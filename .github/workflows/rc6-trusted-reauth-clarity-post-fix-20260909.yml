name: RC6 Trusted Reauth Clarity POST Fix 2026-09-09

on:
  push:
    branches: [fix/rc6-trusted-reauth-clarity-post-20260909]
    paths:
      - '.github/workflows/rc6-trusted-reauth-clarity-post-fix-20260909.yml'
      - 'rc6_same_context_contract_probe.py'

permissions:
  contents: read

concurrency:
  group: porota-rc6-runtime-deploy
  cancel-in-progress: false

jobs:
  rca-fix-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Build isolated trusted-reauth fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin hotfix/rc6-contract-evidence-auto-reauth-20260907
          git show origin/hotfix/rc6-contract-evidence-auto-reauth-20260907:rc6_ppi_web_reauth.py > /tmp/rc6_ppi_web_reauth.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rc6_ppi_web_reauth.py')
          s=p.read_text(encoding='utf-8')
          old='APPROVED_AUTH_POSTS = {("cuenta.portfoliopersonal.com", "/login")}\n'
          assert old in s
          new='APPROVED_AUTH_POSTS = {("cuenta.portfoliopersonal.com", "/login"), ("api.portfoliopersonal.com", "/api/Seguridad/Auth/Login")}\nIGNORED_BLOCKED_POST_HOSTS = {"px.ads.linkedin.com", "metrics.hotjar.io", "l.clarity.ms"}\n'
          s=s.replace(old,new,1)
          old2='''                if method == "POST" and key in APPROVED_AUTH_POSTS:\n                    return route.continue_()\n                blocked_post_path = clean_host_path(request.url)\n                return route.abort()\n'''
          new2='''                if method == "POST" and key in APPROVED_AUTH_POSTS:\n                    return route.continue_()\n                if method == "POST" and u.netloc in IGNORED_BLOCKED_POST_HOSTS:\n                    return route.abort()\n                blocked_post_path = clean_host_path(request.url)\n                return route.abort()\n'''
          assert old2 in s
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
          python -m py_compile /tmp/rc6_ppi_web_reauth.py rc6_same_context_contract_probe.py
          grep -q 'l.clarity.ms' /tmp/rc6_ppi_web_reauth.py
          grep -q 'metrics.hotjar.io' /tmp/rc6_ppi_web_reauth.py
          grep -q 'px.ads.linkedin.com' /tmp/rc6_ppi_web_reauth.py
          grep -q 'api.portfoliopersonal.com.*Seguridad/Auth/Login' /tmp/rc6_ppi_web_reauth.py
          ! grep -REni '/Operar/|/Orden|budget_order|confirm_order|cancel_order|masscancel|send_order|place_order' /tmp/rc6_ppi_web_reauth.py rc6_same_context_contract_probe.py
          echo RCA=THIRD_PARTY_CLARITY_POST_ABORTED_BUT_MISCLASSIFIED_AS_AUTH_BLOCKER
          echo FIX=KEEP_CLARITY_HOTJAR_LINKEDIN_POSTS_BLOCKED_BUT_DO_NOT_CLASSIFY_AS_AUTH_FAILURE
          echo ORDER_ROUTES=NOT_CALLED

      - name: Prepare strict SSH and stage files
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/rc6_ppi_web_reauth.py rc6_same_context_contract_probe.py "$DO_USER@$DO_HOST:/tmp/"

      - name: Install isolated fix and prove same-context evidence
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          SECRET=/etc/porota/contract-evidence-web.env
          PY=/opt/porota-contract-evidence-venv/bin/python
          CHROME=/usr/bin/google-chrome-stable
          HELPER=/usr/local/lib/porota-contract-evidence-rc6/rc6_ppi_web_reauth.py
          STAGE=/tmp/porota-contract-evidence-clarity-fix
          OUTDIR="$ROOT/data/contract_evidence/rc4_trusted"
          cd "$ROOT"

          echo "LIVE_HEAD=$(git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          PRE=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]; c.close(); print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "PRE_DB=$PRE"; test "$PRE" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          test -x "$PY"; test -x "$CHROME"; test -f "$SECRET"; test -d "$PROFILE"

          sudo -n install -o root -g root -m 0755 /tmp/rc6_ppi_web_reauth.py "$HELPER"
          sudo -n rm -rf "$STAGE"
          sudo -n install -d -o porotaadmin -g porotaadmin -m 0700 "$STAGE"
          sudo -n install -o porotaadmin -g porotaadmin -m 0600 /tmp/rc6_same_context_contract_probe.py "$STAGE/rc6_same_context_contract_probe.py"
          sudo -n cp "$HELPER" "$STAGE/reauth_same_context.py"
          sudo -n chown porotaadmin:porotaadmin "$STAGE/reauth_same_context.py"
          sudo -n chmod 0600 "$STAGE/reauth_same_context.py"
          sudo -n rm -f /tmp/rc6_same_context_contract_probe.py /tmp/rc6_ppi_web_reauth.py

          sudo -n python3 - "$STAGE/reauth_same_context.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          marker='from urllib.parse import urlsplit'
          assert marker in s
          s=s.replace(marker, marker+'\nimport rc6_same_context_contract_probe as same_probe',1)
          a='ctx.close(); print(status_payload("AUTHENTICATED_TRUSTED_DEVICE", attempts=0)); return 0'
          b='ctx.close(); print(status_payload("AUTHENTICATED_TRUSTED_DEVICE", attempts=attempts)); return 0'
          ra='same_probe.collect(ctx, page, os.environ["POROTA_SAME_CONTEXT_OUTPUT"]); ctx.close(); print(status_payload("AUTHENTICATED_TRUSTED_DEVICE", attempts=0)); return 0'
          rb='same_probe.collect(ctx, page, os.environ["POROTA_SAME_CONTEXT_OUTPUT"]); ctx.close(); print(status_payload("AUTHENTICATED_TRUSTED_DEVICE", attempts=attempts)); return 0'
          assert a in s and b in s
          p.write_text(s.replace(a,ra,1).replace(b,rb,1),encoding='utf-8')
          PY
          sudo -n chown porotaadmin:porotaadmin "$STAGE/reauth_same_context.py"
          sudo -n chmod 0600 "$STAGE/reauth_same_context.py"

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          TMP="$STAGE/contract_${STAMP}_samecontext.json"
          FINAL="$OUTDIR/contract_${STAMP}_samecontext.json"
          set +e
          OUT=$(sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin PYTHONPATH="$STAGE:$ROOT:/usr/local/lib/porota-contract-evidence-rc6" POROTA_CHROME_EXECUTABLE="$CHROME" POROTA_SAME_CONTEXT_OUTPUT="$TMP" "$PY" "$STAGE/reauth_same_context.py" --profile "$PROFILE" --secret "$SECRET" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "SAME_CONTEXT_RC=$RC"; test "$RC" -eq 0; test -s "$TMP"

          python3 - "$TMP" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); routes=d.get('routes') or []; reached=sum(1 for r in routes if r.get('reached'))
          print('AUTH='+str(d.get('auth_status'))); print('ROUTES='+str(len(routes))); print('REACHED='+str(reached)); print('ENDPOINTS='+str(len(d.get('endpoints') or {}))); print('REAL_ORDERS='+str(d.get('real_orders_sent')))
          assert d.get('auth_status')=='AUTHENTICATED_TRUSTED_DEVICE'
          assert int(d.get('real_orders_sent',0))==0
          assert len(routes) >= 16 and reached >= 12
          assert all(str(r.get('requested','')).startswith('/Cotizaciones/') for r in routes)
          PY

          GID=$(sudo -n docker exec porota_production_observer id -g 2>/dev/null || echo 1000)
          sudo -n install -o root -g "$GID" -m 0640 "$TMP" "$FINAL"
          REL="${FINAL#$ROOT/data/}"
          IMPORT=$(sudo -n docker exec porota_production_observer python /app/rc4_contract_import_job.py --input "/app/data/$REL")
          echo "IMPORT=$IMPORT"
          test "$(sudo -n systemctl is-enabled porota-contract-evidence-rc4.timer)" = enabled
          test "$(sudo -n systemctl is-active porota-contract-evidence-rc4.timer)" = active

          POST=$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,os
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); raw=c.execute('select count(*) from historical_raw_archive').fetchone()[0]; c.close(); print(f'{q}|{m}|{r}|{raw}|{os.getenv("PPI_HISTORY_RAW_STORAGE_MODE")}')
          PY
          )
          echo "POST_DB=$POST"; test "$POST" = 'ok|PRODUCTION_PAPER|0|0|EXTERNAL_EXACT_V1'
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          echo CONTRACT_EVIDENCE_CLARITY_FIX=GREEN
          echo ORDER_ROUTES=NOT_CALLED
          echo ROLLBACK_AUTOMATICO=NO
          HOST
