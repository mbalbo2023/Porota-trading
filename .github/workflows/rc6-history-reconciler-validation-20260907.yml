name: RC6 history reconciler validation 2026-09-07
on:
  push:
    branches: [feature/rc6-history-reconciler-v2-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: pytest -q tests/test_history_reconciler_rc6.py
      - run: python -m py_compile fb_history_reconciler_rc6.py
      - run: python -c "import fb_history_reconciler_rc6 as m; m.assert_shadow_only(); print('HISTORY_RECONCILER_SHADOW=GREEN')"
