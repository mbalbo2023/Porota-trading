name: RC6 PPI contract field inventory 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-contract-field-inventory-20260912.yml']

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inventory raw PPI fields without values
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = 'eddcc29bc52eaf0b3d50f87dc851a48accb0fc8a' || { echo 'ABORT=HOST_SHA_MISMATCH'; exit 31; }

          ready=0
          for _ in $(seq 1 150); do
            count="$(sudo -n docker exec porota_production_observer python -c "import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);x=c.execute(\"select count(*) from sqlite_master where type='table' and name='ppi_full_discovery_shadow'\").fetchone()[0];print(c.execute('select count(*) from ppi_full_discovery_shadow').fetchone()[0] if x else 0);c.close()" 2>/dev/null || echo 0)"
            if [ "$count" -gt 0 ] 2>/dev/null; then ready=1; break; fi
            sleep 20
          done
          test "$ready" = 1 || { echo 'ABORT=SHADOW_NOT_READY'; exit 32; }

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import json,sqlite3
          db='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
          print(f'SAFETY={s[0]}|{s[1]}')
          blocked=('account','cuenta','dni','cuit','email','mail','phone','telefono','token','cookie','authorization','secret','password','session','usuario','user')
          def safe(k):
              low=str(k).lower()
              return not any(x in low for x in blocked)
          def paths(obj,prefix='',depth=0):
              out=set()
              if depth>3: return out
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if not safe(k): continue
                      p=f'{prefix}.{k}' if prefix else str(k)
                      out.add(p)
                      if isinstance(v,(dict,list)): out.update(paths(v,p,depth+1))
              elif isinstance(obj,list):
                  for v in obj[:5]:
                      if isinstance(v,(dict,list)): out.update(paths(v,prefix+'[]',depth+1))
              return out

          byfam={}
          counts={}
          for r in c.execute('select instrument_type,metadata_json from financial_instrument_catalog'):
              fam=r['instrument_type']; counts[fam]=counts.get(fam,0)+1
              try: obj=json.loads(r['metadata_json'])
              except Exception: obj={}
              raw=obj.get('raw',obj) if isinstance(obj,dict) else {}
              byfam.setdefault(fam,set()).update(paths(raw))
          for r in c.execute('select instrument_type,raw_json from ppi_full_discovery_shadow'):
              fam=r['instrument_type']; counts[fam]=counts.get(fam,0)+1
              try: raw=json.loads(r['raw_json'])
              except Exception: raw={}
              byfam.setdefault(fam,set()).update(paths(raw))
          print('=== PPI_RAW_FIELD_PATHS_BY_FAMILY ===')
          for fam in sorted(byfam):
              print(json.dumps({'family':fam,'records_seen':counts.get(fam,0),'field_paths':sorted(byfam[fam])[:300]},ensure_ascii=False,sort_keys=True))
          print('=== PPI_CONFIGURATION_ENUMS ===')
          for r in c.execute('select name,payload_json from broker_market_configuration order by name'):
              try: value=json.loads(r['payload_json'])
              except Exception: value=[]
              print(json.dumps({'name':r['name'],'value':value},ensure_ascii=False,sort_keys=True))
          c.close()
          print('HOST_MUTATION=NONE')
          print('ORDER_ROUTES=NOT_CALLED')
          PY
          HOST
