name: RC6 PPI Client 1.3.0 Shadow Validate 2026-09-08

on:
  push:
    branches:
      - upgrade/rc6-ppi-client-1.3.0-shadow-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Confirm broker package version
        run: |
          python - <<'PY'
          import importlib.metadata as md
          v=md.version('ppi-client')
          print('PPI_CLIENT_VERSION='+v)
          assert v == '1.3.0', v
          PY
      - name: Inspect production login contract without network
        run: |
          python - <<'PY'
          import requests
          from ppi_client.ppi import PPI

          captured=[]
          orig=requests.sessions.Session.request

          class StopHere(Exception):
              pass

          def fake(self, method, url, **kwargs):
              captured.append((method,url,kwargs))
              raise StopHere()

          requests.sessions.Session.request=fake
          try:
              p=PPI(sandbox=False)
              try:
                  p.account.login_api('DUMMY_KEY','DUMMY_SECRET')
              except StopHere:
                  pass
          finally:
              requests.sessions.Session.request=orig

          assert captured, 'login request not captured'
          method,url,kw=captured[0]
          headers={str(k).lower():str(v) for k,v in (kw.get('headers') or {}).items()}
          print('LOGIN_METHOD='+str(method))
          print('LOGIN_URL='+str(url))
          print('AUTHORIZEDCLIENT='+headers.get('authorizedclient','MISSING'))
          print('CLIENTKEY='+headers.get('clientkey','MISSING'))
          assert str(method).upper() == 'POST'
          assert url == 'https://clientapi.portfoliopersonal.com/api/1.0/Account/LoginApi'
          assert 'apikey' in headers
          assert 'apisecret' in headers
          assert 'authorizedclient' in headers
          assert 'clientkey' in headers
          print('NETWORK_CALL_PERFORMED=NO')
          PY
      - name: Compile critical PPI modules
        run: |
          python -m py_compile c_ppi_client.py bd_ppi_readonly_guard.py bv_paper_runtime.py
      - name: Run focused tests if present
        run: |
          set -e
          TESTS=""
          for f in \
            tests/test_bd_ppi_readonly_guard.py \
            tests/test_ppi_readonly_guard.py \
            tests/test_bv_paper_runtime.py \
            tests/test_c_ppi_client.py; do
            if [ -f "$f" ]; then TESTS="$TESTS $f"; fi
          done
          if [ -n "$TESTS" ]; then
            python -m pytest -q $TESTS
          else
            echo 'FOCUSED_TESTS=NOT_PRESENT'
          fi
      - name: Enforce no order-route probe regression
        run: |
          ! grep -RniE 'budget_order\(|confirm_order\(|cancel_order\(' m_instrument_universe.py j_main.py 2>/dev/null
          echo 'NO_ORDER_ROUTE_PERMISSION_PROBE=GREEN'
      - name: Final shadow verdict
        run: |
          echo 'PPI_CLIENT_130_SHADOW=GREEN'
          echo 'DEPLOY_PERFORMED=NO'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
