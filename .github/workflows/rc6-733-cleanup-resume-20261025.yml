name: RC6 733 exact failed-attempt cleanup resume

on:
  push:
    branches:
      - diagnostic/rc6-733-cold-postfailure-20261025
    paths:
      - .github/workflows/rc6-733-cleanup-resume-20261025.yml

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  exact_cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      CANDIDATE_SHA: 26a95f734cb9eece72e89a1d084c7006a1e05fa2
      FAILED_RUN_ID: '40154025294'
      FAILED_RUN_ATTEMPT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resume only the exact stopped failed attempt
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          python3 -m py_compile scripts/rc6_deploy_scheduler_suspend.py scripts/rc6_deploy_host_mutex.py scripts/rc6_deploy_failure_cleanup.py
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_733_cleanup"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_733_cleanup" "$HOME/.ssh/known_hosts"
          RC6_MUTEX_B64="$(base64 -w0 scripts/rc6_deploy_host_mutex.py)"
          POLICY_B64="$(base64 -w0 ops/policy/host-control-plane-reconciliation-v2.json)"
          timeout 150 ssh -i "$HOME/.ssh/rc6_733_cleanup" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$RC6_MUTEX_B64\"))' '$DO_USER' root --attempt '$CANDIDATE_SHA' '$FAILED_RUN_ID' '$FAILED_RUN_ATTEMPT' --phase cleanup_restore python3 - --candidate-sha '$CANDIDATE_SHA' --action recover-closed --policy-b64 '$POLICY_B64'" \
            < scripts/rc6_deploy_scheduler_suspend.py
          timeout 180 ssh -i "$HOME/.ssh/rc6_733_cleanup" \
            -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n python3 -c 'import base64;exec(base64.b64decode(\"$RC6_MUTEX_B64\"))' '$DO_USER' root --attempt '$CANDIDATE_SHA' '$FAILED_RUN_ID' '$FAILED_RUN_ATTEMPT' --phase cleanup_final timeout 150 python3 - --candidate-sha '$CANDIDATE_SHA' --run-id '$FAILED_RUN_ID' --attempt '$FAILED_RUN_ATTEMPT'" \
            < scripts/rc6_deploy_failure_cleanup.py
          echo 'RC6_733_EXACT_CLEANUP_RESUME=COMPLETE'
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/rc6_733_cleanup"
