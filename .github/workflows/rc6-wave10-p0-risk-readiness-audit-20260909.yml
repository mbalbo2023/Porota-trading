name: RC6 Wave10 P0 Risk Readiness Audit 2026-09-09
on:
  push:
    branches: [wave10/rc6-p0-risk-engine-binding-20260909]
    paths: ['.github/workflows/rc6-wave10-p0-risk-readiness-audit-20260909.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inventory binding surfaces
        run: |
          set -euo pipefail
          git fetch origin feature/rc6-forward-lab-v2-20260907 feature/rc6-mfe-mae-provenance-20260907 work/v17-backtest-daily-risk work/v17-risk-outbox || true
          python -m py_compile bw_daily_risk.py bm_exit_supervisor.py be_paper_engine.py bv_paper_runtime.py
          python - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text(errors='ignore') for p in Path('.').glob('*.py'))
          for token in ['DAILY','PATRIMON','SETTLEMENT','SECTOR','CONCENTRATION','SLIPPAGE','LIQUIDITY','KILL']:
              print(f'RISK_SURFACE_{token}='+str(token.lower() in text.lower()))
          print('WAVE10_RUNTIME_MUTATION=NO')
          print('REAL_ORDER_TEST=NOT_PERFORMED')
          PY
