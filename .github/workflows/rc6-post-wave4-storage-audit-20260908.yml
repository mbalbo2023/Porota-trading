name: RC6 Post Wave4 Storage Audit 2026-09-08

on:
  push:
    branches: [audit/rc6-post-wave4-storage-20260908]
    paths:
      - '.github/workflows/rc6-post-wave4-storage-audit-20260908.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_audit"
          chmod 600 "$HOME/.ssh/porota_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Compact read-only post-Wave4 storage inventory
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_audit" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/porota-trading
          echo '=== POST-WAVE4 STORAGE COMPACT AUDIT ==='
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HEAD=$(git rev-parse HEAD)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard
          df -PB1 /opt/porota-trading | awk 'NR==2{print "FS_SIZE_BYTES="$2" FS_USED_BYTES="$3" FS_FREE_BYTES="$4" FS_USE_PCT="$5}'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3, os, glob
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          print('OBSERVER_QUICK_CHECK='+str(c.execute('pragma quick_check').fetchone()[0]))
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          print(f'MODE={mode}')
          print(f'REAL_ORDERS_SENT={real}')
          print(f'OBSERVER_DB_BYTES={os.path.getsize(p)}')
          ps=c.execute('pragma page_size').fetchone()[0]; fl=c.execute('pragma freelist_count').fetchone()[0]
          print(f'OBSERVER_FREELIST_BYTES={ps*fl}')
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          if 'historical_raw_archive' in tables:
              print('HISTORICAL_RAW_ARCHIVE_ROWS='+str(c.execute('select count(*) from historical_raw_archive').fetchone()[0]))
          try:
              for name,b in c.execute("select name,sum(pgsize) from dbstat group by name order by sum(pgsize) desc limit 12"):
                  print(f'DBSTAT={int(b)}|{name}')
          except Exception as e:
              print('DBSTAT_AVAILABLE=NO|'+type(e).__name__)
          c.close()
          for hp in glob.glob('/app/data/**/market_history.db',recursive=True):
              h=sqlite3.connect('file:'+hp+'?mode=ro',uri=True); h.execute('pragma query_only=on')
              print(f'MARKET_HISTORY_DB_BYTES={os.path.getsize(hp)}')
              print('MARKET_HISTORY_QUICK_CHECK='+str(h.execute('pragma quick_check').fetchone()[0]))
              h.close()
          PY
          echo '=== RAW_EVIDENCE ==='
          sudo -n docker exec porota_production_observer sh -lc 'for p in /app/data/evidence /app/data/paper_v17/evidence; do if [ -e "$p" ]; then B=$(du -sb "$p" | awk "{print \$1}"); N=$(find "$p" -type f 2>/dev/null | wc -l); echo "EVIDENCE_PATH=$p|BYTES=$B|FILES=$N"; fi; done'
          echo '=== BACKUPS ==='
          sudo -n docker exec porota_production_observer sh -lc 'find /app/data/backups /app/data/paper_v17/artifacts/observer_v17.db/backups -maxdepth 2 -type f -printf "%s|%TY-%Tm-%TdT%TH:%TM:%TS|%p\\n" 2>/dev/null | sort -nr | head -n 100' || true
          sudo -n docker exec porota_production_observer sh -lc 'find /app/data -type d -iname "*backup*" -print 2>/dev/null | while read p; do B=$(du -sb "$p" 2>/dev/null | awk "{print \$1}"); N=$(find "$p" -type f 2>/dev/null | wc -l); echo "BACKUP_PATH=$p|BYTES=${B:-0}|FILES=$N"; done'
          echo '=== TOP_DATA_DIRS ==='
          sudo -n docker exec porota_production_observer sh -lc 'du -x -B1 -d 2 /app/data 2>/dev/null | sort -nr | head -n 15 | sed "s#^[[:space:]]*#DATA_DIR=#"'
          echo '=== HOST_LAYOUT ==='
          sudo -n du -x -B1 -d 1 / 2>/dev/null | sort -nr | head -n 20 | sed 's#^[[:space:]]*#HOST_DIR=#' || true
          echo '=== HOST_BACKUP_FILES ==='
          for root in /opt/porota-trading /opt/porota-backups /var/backups /root /srv; do
            if [ -e "$root" ]; then
              sudo -n find "$root" -xdev -type f \( -iname '*backup*' -o -iname '*bak*' -o -iname '*.tar' -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.zip' -o -iname '*.dump' \) -printf 'BACKUP_FILE=%s|%TY-%Tm-%TdT%TH:%TM:%TS|%p\n' 2>/dev/null | sort -nr | head -n 100 || true
            fi
          done
          echo '=== CONTAINER_MOUNTS ==='
          sudo -n docker inspect -f 'OBSERVER_MOUNTS={{range .Mounts}}{{.Source}}|{{.Destination}}|{{.Type}};{{end}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD_MOUNTS={{range .Mounts}}{{.Source}}|{{.Destination}}|{{.Type}};{{end}}' porota_production_dashboard
          echo '=== DOCKER ==='
          sudo -n docker system df -v | sed -n '1,180p'
          sudo -n docker system df --format 'TYPE={{.Type}}|TOTAL={{.TotalCount}}|ACTIVE={{.Active}}|SIZE={{.Size}}|RECLAIMABLE={{.Reclaimable}}'
          echo '=== WAVE4 ==='
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import fa_raw_evidence_store_rc6 as s
          print('RAW_STORAGE_MODE='+s.raw_storage_mode({}))
          print('COORDINATOR_MODE='+s.coordinator_mode({}))
          print('EXTERNAL_V1_ACTIVE='+str(s.raw_storage_mode({})=='EXTERNAL_V1'))
          PY
          echo 'MUTATIONS=NONE'
          echo 'VACUUM=NOT_RUN'
          echo 'DELETE=NOT_RUN'
          echo 'PRUNE=NOT_RUN'
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE
