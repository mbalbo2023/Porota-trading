name: RC6 deploy3 fix active legacy timers

on:
  push:
    branches: [release-candidate/v17.0.0-rc6-deploy3-20260906]
    paths:
      - '.github/workflows/rc6-deploy3-fix-active-legacy-timers.yml'

permissions:
  contents: write

concurrency:
  group: rc6-deploy3-fix-active-legacy-timers
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-candidate/v17.0.0-rc6-deploy3-20260906
          fetch-depth: 0

      - name: Patch active legacy timer retirement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/rc6_transactional_host_deploy_v3.sh')
          text=p.read_text(encoding='utf-8')
          old='''for unit in "${RC6_CORE_TIMERS[@]}"; do
            sudo -n systemctl enable --now "$unit" >/dev/null
            test "$(sudo -n systemctl is-enabled "$unit")" = enabled
            test "$(sudo -n systemctl is-active "$unit")" = active
          done
          if sudo -n systemctl list-timers --all --no-legend --no-pager | grep -Eiq 'porota-.*rc4'; then
            echo 'RC4_ACTIVE_TIMERS_REMAIN'
            exit 1
          fi
          echo 'SYSTEMD_RC6_MIGRATION=GREEN'
          '''
          new='''for unit in "${RC6_CORE_TIMERS[@]}"; do
            sudo -n systemctl enable --now "$unit" >/dev/null
            test "$(sudo -n systemctl is-enabled "$unit")" = enabled
            test "$(sudo -n systemctl is-active "$unit")" = active
          done

          # Some legacy timers may still be loaded/active even if their unit-file
          # state is not reported as enabled. Retire the actual active timer set
          # explicitly, then verify the scheduler truth rather than assuming that
          # list-unit-files was exhaustive. This is runtime retirement only; inert
          # legacy unit files remain available as rollback evidence.
          mapfile -t RC4_ACTIVE_TIMERS < <(
            sudo -n systemctl list-timers --all --no-legend --no-pager \
              | awk '{for(i=1;i<=NF;i++) if($i ~ /^porota-.*rc4\\.timer$/) print $i}' \
              | sort -u
          )
          for unit in "${RC4_ACTIVE_TIMERS[@]}"; do
            [ -n "$unit" ] || continue
            echo "RETIRE_ACTIVE_RC4_TIMER=$unit"
            sudo -n systemctl disable --now "$unit" >/dev/null 2>&1 || sudo -n systemctl stop "$unit"
            sudo -n systemctl reset-failed "$unit" >/dev/null 2>&1 || true
          done
          sudo -n systemctl daemon-reload
          sleep 2
          REMAINING_RC4_TIMERS="$(sudo -n systemctl list-timers --all --no-legend --no-pager | grep -Ei 'porota-.*rc4' || true)"
          if [ -n "$REMAINING_RC4_TIMERS" ]; then
            echo 'RC4_ACTIVE_TIMERS_REMAIN'
            printf '%s\\n' "$REMAINING_RC4_TIMERS"
            exit 1
          fi
          echo 'SYSTEMD_RC6_MIGRATION=GREEN'
          '''
          if text.count(old) != 1:
              raise SystemExit(f'RC6_TIMER_RETIREMENT_ANCHOR_COUNT={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          bash -n scripts/rc6_transactional_host_deploy_v3.sh
          git diff --check
          git diff -- scripts/rc6_transactional_host_deploy_v3.sh

      - name: Commit script correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Porota RC6 CI'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add scripts/rc6_transactional_host_deploy_v3.sh
          git commit -m 'RC6 deploy3: retire actual active RC4 timers deterministically'
          git push origin HEAD:release-candidate/v17.0.0-rc6-deploy3-20260906
