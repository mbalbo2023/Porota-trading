name: RC6 CP1 CP2 CP5 Final Runtime Proof V2 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-cp1-cp2-cp5-final-runtime-proof-v2-20260911.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  cp1:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: CP1 actual runtime health safety freshness
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          for c in porota_production_observer porota_production_dashboard; do
            status="$(sudo -n docker inspect -f '{{.State.Status}}' "$c")"
            health="$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")"
            restarts="$(sudo -n docker inspect -f '{{.RestartCount}}' "$c")"
            echo "$c|status=$status|health=$health|restarts=$restarts"
            test "$status" = running
            test "$restarts" -eq 0
            test "$health" = healthy -o "$health" = none
          done
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          from datetime import datetime,timezone
          def age(v):
              if not v: return None
              d=datetime.fromisoformat(str(v).replace('Z','+00:00'))
              if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
              return (datetime.now(timezone.utc)-d.astimezone(timezone.utc)).total_seconds()
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,process_state,session_state,ppi_auth,heartbeat_at,last_market_data_at,real_orders_sent from observer_state where id=1').fetchone()
          quick=c.execute('pragma quick_check').fetchone()[0]
          jobs=c.execute('select count(*) from operational_jobs').fetchone()[0]
          events=c.execute('select count(*) from paper_events').fetchone()[0]
          c.close()
          out={'quick_check':quick,'mode':r['mode'] if r else None,'process_state':r['process_state'] if r else None,'session':r['session_state'] if r else None,'ppi_auth':r['ppi_auth'] if r else None,'orders':r['real_orders_sent'] if r else None,'heartbeat_age_s':age(r['heartbeat_at']) if r else None,'market_data_age_s':age(r['last_market_data_at']) if r else None,'operational_jobs':jobs,'paper_events':events}
          print(json.dumps(out,default=str))
          assert quick=='ok'
          assert r and r['mode']=='PRODUCTION_PAPER' and int(r['real_orders_sent'] or 0)==0
          assert out['heartbeat_age_s'] is not None and out['heartbeat_age_s'] <= 300
          if r['session_state']=='MARKET_OPEN':
              assert out['market_data_age_s'] is not None and out['market_data_age_s'] <= 900
          assert jobs>0 and events>0
          print('CP1_RUNTIME_HEALTH=GREEN')
          print('CP1_DB=GREEN')
          print('CP1_SAFETY=GREEN')
          print('REAL_ORDERS_SENT=0')
          print('CP1_FINAL=GREEN')
          PY
          HOST

  cp2:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: CP2 live ledger and dashboard wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          from datetime import datetime,timezone
          def age(v):
              if not v:return None
              d=datetime.fromisoformat(str(v).replace('Z','+00:00'))
              if d.tzinfo is None:d=d.replace(tzinfo=timezone.utc)
              return (datetime.now(timezone.utc)-d.astimezone(timezone.utc)).total_seconds()
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          led=c.execute('select count(*) n,max(completed_at) mx from history_attempt_ledger_v2').fetchone()
          jobs=c.execute('select count(*) n,max(last_run_at) mx from operational_jobs').fetchone()
          ev=c.execute('select count(*) n,max(event_at) mx from paper_events').fetchone()
          c.close()
          out={'mode':r['mode'] if r else None,'session':r['session_state'] if r else None,'orders':r['real_orders_sent'] if r else None,'history_ledger_rows':led['n'],'history_ledger_last':led['mx'],'operational_jobs':jobs['n'],'operational_jobs_last':jobs['mx'],'paper_events':ev['n'],'paper_events_last':ev['mx'],'paper_event_age_s':age(ev['mx'])}
          print(json.dumps(out,default=str))
          assert r and r['mode']=='PRODUCTION_PAPER' and int(r['real_orders_sent'] or 0)==0
          assert led['n']>0 and jobs['n']>0 and ev['n']>0
          assert ev['mx'] is not None
          assert out['paper_event_age_s'] is not None and out['paper_event_age_s'] <= 900
          print('CP2_LEDGER_LIVE=GREEN')
          print('CP2_OBSERVER_LIVE=GREEN')
          PY
          TOKEN="$(sudo -n docker exec porota_production_dashboard sh -lc 'printf %s "$DASHBOARD_ACCESS_TOKEN"')"
          test -n "$TOKEN"
          for spec in '/en-vivo|En vivo' '/validacion|Validaci' '/instrumentos|Instrumentos' '/historicos|Hist' '/riesgo|Riesgo'; do
            p="${spec%%|*}"; needle="${spec#*|}"; tmp="$(mktemp)"
            code="$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8000$p")"
            bytes="$(wc -c < "$tmp")"
            echo "PAGE=$p|http=$code|bytes=$bytes"
            test "$code" = 200
            test "$bytes" -gt 5000
            grep -Fqi "$needle" "$tmp"
            rm -f "$tmp"
          done
          echo CP2_DASHBOARD_LIVE=GREEN
          echo CP2_SAFETY=GREEN
          echo REAL_ORDERS_SENT=0
          echo CP2_FINAL=GREEN
          HOST

  cp5:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Source shadow-only regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
          python -m pytest -q tests/test_event_risk_shadow_rc6.py tests/test_fk_gdelt_shadow_feed_rc6.py
          python - <<'PY'
          import fi_event_risk_shadow_rc6 as e, fk_gdelt_shadow_feed_rc6 as g
          e.assert_shadow_only(); g.assert_shadow_only()
          print('CP5_GDELT_SOURCE_SHADOW_ONLY=GREEN')
          PY
          ! grep -REn 'send_order|place_order|cancel_order|api/Orders|/Operar/' fi_event_risk_shadow_rc6.py fk_gdelt_shadow_feed_rc6.py
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: CP5 deployed runtime shadow and UX proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          sudo -n docker exec -i -w /app porota_production_observer python - <<'PY'
          import sqlite3,json
          import fi_event_risk_shadow_rc6 as e, fk_gdelt_shadow_feed_rc6 as g
          e.assert_shadow_only(); g.assert_shadow_only()
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          news=c.execute('select count(*) n,max(fetched_at) mx from financial_news').fetchone()
          c.close()
          print(json.dumps({'mode':r['mode'] if r else None,'session':r['session_state'] if r else None,'orders':r['real_orders_sent'] if r else None,'financial_news_rows':news['n'],'financial_news_last':news['mx']}))
          assert r and r['mode']=='PRODUCTION_PAPER' and int(r['real_orders_sent'] or 0)==0
          assert news['n']>0 and news['mx']
          print('CP5_DEPLOYED_SHADOW_CONTRACT=GREEN')
          print('CP5_EVENT_DATA_PRESENT=GREEN')
          PY
          ! sudo -n grep -REn 'send_order|place_order|cancel_order|api/Orders|/Operar/' "$ROOT/fi_event_risk_shadow_rc6.py" "$ROOT/fk_gdelt_shadow_feed_rc6.py"
          grep -Fq "'operational_action':'SHADOW_ONLY'" "$ROOT/fi_event_risk_shadow_rc6.py"
          TOKEN="$(sudo -n docker exec porota_production_dashboard sh -lc 'printf %s "$DASHBOARD_ACCESS_TOKEN"')"
          tmp="$(mktemp)"; code="$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/riesgo)"
          echo "RISK_PAGE_HTTP=$code|bytes=$(wc -c < "$tmp")"; test "$code" = 200; test "$(wc -c < "$tmp")" -gt 5000; rm -f "$tmp"
          echo GDELT_SHADOW_ONLY=GREEN
          echo CP5_RUNTIME_UX=GREEN
          echo CP5_SAFETY=GREEN
          echo REAL_ORDERS_SENT=0
          echo CP5_FINAL=GREEN
          HOST
