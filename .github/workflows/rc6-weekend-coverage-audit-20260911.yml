name: RC6 Weekend Coverage Audit 2026-09-11

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-weekend-coverage-audit-20260911.yml

permissions:
  contents: read

concurrency:
  group: rc6-weekend-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_coverage_audit"
          chmod 600 "$HOME/.ssh/porota_coverage_audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit exact live gaps and safe executors
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_coverage_audit" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          export TZ=America/Argentina/Buenos_Aires
          ROOT=/opt/porota-trading
          OBS=porota_production_observer
          TARGET_SHA=f8adec8a02b2f9f0ef2dffbee75458c958bf711e
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"

          echo '=== SAFETY ==='
          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=20); c.execute('pragma query_only=on')
          print('QUICK='+str(c.execute('pragma quick_check').fetchone()[0]))
          r=c.execute('select mode,session_state,ppi_auth,real_orders_sent from observer_state where id=1').fetchone(); print('STATE='+'|'.join(map(str,r)))
          assert r[0]=='PRODUCTION_PAPER' and int(r[3])==0; c.close()
          PY
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'

          echo '=== EXACT OBSERVER COVERAGE / GAPS ==='
          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=30); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          def emit(tag,sql,args=()):
              if sql:
                  for r in c.execute(sql,args): print(tag+'|'+json.dumps(dict(r),sort_keys=True,default=str))
          if 'candidate_universe' in tabs:
              emit('UNIVERSE', '''select instrument_type family,status,can_simulate,count(*) rows,count(distinct ticker) symbols,
                    min(last_checked_at) oldest_check,max(last_checked_at) newest_check
                    from candidate_universe group by instrument_type,status,can_simulate order by instrument_type,status,can_simulate''')
          if 'instrument_catalog' in tabs:
              emit('CATALOG', '''select instrument_type family,count(*) symbols,min(downloaded_at) oldest,max(downloaded_at) newest
                    from instrument_catalog group by instrument_type order by symbols desc,family''')
          if 'production_history' in tabs:
              emit('PPI_HISTORY', '''select instrument_type family,count(*) symbols,sum(row_count) payload_rows,
                    min(downloaded_at) oldest,max(downloaded_at) newest from production_history group by instrument_type order by symbols desc,family''')
          if 'production_history_attempts' in tabs:
              emit('PPI_ATTEMPT', '''select instrument_type family,state,count(*) symbols,sum(valid_rows) valid_rows,
                    min(attempted_at) oldest,max(attempted_at) newest from production_history_attempts
                    group by instrument_type,state order by instrument_type,state''')
              emit('PPI_ATTEMPT_TOTAL', 'select count(*) attempts,min(attempted_at) oldest,max(attempted_at) newest from production_history_attempts')
          if 'a3_history_ingest_state_rc6' in tabs:
              emit('A3_STATE', '''select instrument_type family,status,count(*) symbols,sum(rows_last) rows_last,
                    min(last_attempt_at) oldest,max(last_attempt_at) newest from a3_history_ingest_state_rc6
                    group by instrument_type,status order by instrument_type,status''')
          if 'source_sync' in tabs:
              emit('SOURCE_SYNC','select * from source_sync order by source')
          if 'api_health' in tabs:
              emit('API_HEALTH','select component,state,checked_at,last_success_at,source,detail from api_health order by component')
          c.close()
          PY

          echo '=== CANONICAL COVERAGE ==='
          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/market_history.db?mode=ro',uri=True,timeout=30); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          for r in c.execute('''select instrument_type family,source,count(*) rows,count(distinct symbol) symbols,min(date) first_date,max(date) last_date
                                from history_canonical_v2 group by instrument_type,source order by instrument_type,rows desc'''):
              print('CANONICAL|'+json.dumps(dict(r),sort_keys=True,default=str))
          c.close()
          PY

          echo '=== TARGETED EXECUTOR INVENTORY ==='
          cd "$ROOT"
          for f in ak_iol_client.py al_historical_ingest.py ba_data912_history.py cp_history_ingest_policy_hf6.py cq_history_attempt_ledger_hf6.py cr_data912_reconcile_hf6.py cs_postclose_history_scheduler_hf6.py ct_ppi_history_salvage_hf6.py cu_history_store_v2_hf6.py cw_data912_history_v2_sink.py cx_a3_primary_readonly_hf6.py cz_a3_cem_public_history_hf6.py ew_a3_history_rc6.py ex_a3_history_job_rc6.py fb_history_reconciler_rc6.py fj_history_backfill_planner_rc6.py rc6_postclose_history_job.py; do
            if [ -f "$f" ]; then
              echo "EXECUTOR_PRESENT=$f|bytes=$(stat -c %s "$f")"
              grep -nE '^class |^def |if __name__|argparse|sys\.argv|os\.getenv|MODE|FAMIL|SOURCE|BACKFILL|BOOTSTRAP|batch|limit' "$f" 2>/dev/null | head -n 80 | sed "s#^#EXECUTOR_META=$f|#" || true
            else
              echo "EXECUTOR_MISSING=$f"
            fi
          done

          echo '=== TIMERS / COLLISION STATUS ==='
          for t in porota-contract-evidence-rc6.timer porota-history-postclose-rc6.timer porota-candle-integrity-rc6.timer porota-a3-history-daily-rc6.timer porota-a3-history-reconcile-rc6.timer porota-a3-history-weekend-rc6.timer; do
            echo "TIMER=$t|active=$(sudo -n systemctl is-active "$t" 2>/dev/null || true)|enabled=$(sudo -n systemctl is-enabled "$t" 2>/dev/null || true)|last=$(sudo -n systemctl show "$t" -p LastTriggerUSec --value 2>/dev/null || true)|next=$(sudo -n systemctl show "$t" -p NextElapseUSecRealtime --value 2>/dev/null || true)"
          done

          echo '=== FINAL ==='
          sudo -n docker exec -i "$OBS" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=10); c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); print('FINAL_STATE='+'|'.join(map(str,r))); assert r[0]=='PRODUCTION_PAPER' and int(r[2])==0; c.close()
          PY
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          echo 'MUTATIONS=NONE'
          echo 'REAL_ORDER_ROUTES=NOT_CALLED'
          echo 'COVERAGE_AUDIT_V2=GREEN'
          HOST
