name: RC6 postclose bundle validation 2026-09-07
on:
  push:
    branches: [feature/rc6-postclose-bundle-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_postclose_bundle_rc6.py
      - run: python -m py_compile fh_postclose_bundle_rc6.py
