name: RC6 Consolidated IOL Source-Path Read-Only RCA 2026-10-01

on:
  push:
    branches:
      - work/ws-consolidated-iol-20261001
    paths:
      - '.github/workflows/rc6-consolidated-iol-sourcepath-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rca:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Probe Droplet IOL MCP source path without refresh or writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          DB=data/paper_v17/observer_v17.db
          STORE=/root/.config/porota/iol_mcp_oauth_bootstrap.json
          echo "IOL_SOURCEPATH_RCA=START"
          sudo -n python3 - "$DB" "$STORE" <<'PY'
          import json, os, sqlite3, sys
          from pathlib import Path
          sys.path.insert(0, "/opt/porota-trading")
          from iol_mcp_readonly_adapter_rc6 import OAuthStoreReadOnlyMCP, IOLMCPError

          db,store=sys.argv[1],Path(sys.argv[2])
          c=sqlite3.connect(f"file:{db}?mode=ro",uri=True,timeout=3)
          c.execute("PRAGMA query_only=ON")
          row=c.execute("SELECT mode,real_orders_sent,ppi_auth,process_state,session_state FROM observer_state WHERE id=1").fetchone()
          c.close()
          print("SAFETY="+json.dumps({"mode":row[0],"real_orders_sent":row[1],"ppi_auth":row[2],"process_state":row[3],"session_state":row[4]},sort_keys=True))
          assert row[0]=="PRODUCTION_PAPER" and int(row[1] or 0)==0

          if store.exists():
              st=store.stat()
              print(f"OAUTH_STORE=EXISTS|mode={oct(st.st_mode & 0o777)}|uid={st.st_uid}|gid={st.st_gid}|mtime_ns={st.st_mtime_ns}|bytes={st.st_size}")
              try:
                  meta=json.loads(store.read_text(encoding="utf-8"))
                  print("OAUTH_METADATA="+json.dumps({
                      "issuer_present":bool(meta.get("issuer")),
                      "tokens_present":isinstance(meta.get("tokens"),dict),
                      "access_token_present":bool((meta.get("tokens") or {}).get("access_token")),
                      "refresh_token_present":bool((meta.get("tokens") or {}).get("refresh_token")),
                      "client_registration_present":isinstance(meta.get("client_registration"),dict),
                  },sort_keys=True))
              except Exception as exc:
                  print("OAUTH_METADATA_ERROR="+type(exc).__name__)
          else:
              print("OAUTH_STORE=MISSING")

          class NoRefresh(OAuthStoreReadOnlyMCP):
              def _refresh_after_401(self, headers):
                  raise IOLMCPError("IOL_MCP_REFRESH_REQUIRED_READONLY_PROBE", status_code=401)

          client=NoRefresh(store,timeout_seconds=12)
          def probe(name,args):
              try:
                  value=client.call(name,args)
                  rows=value.get("result") if isinstance(value,dict) else None
                  count=len(rows) if isinstance(rows,list) else None
                  keys=sorted(value.keys()) if isinstance(value,dict) else []
                  print("IOL_TOOL="+json.dumps({"tool":name,"state":"OK","row_count":count,"top_keys":keys[:20]},sort_keys=True))
              except Exception as exc:
                  print("IOL_TOOL="+json.dumps({
                      "tool":name,"state":"ERROR","type":type(exc).__name__,
                      "message":str(exc)[:180],
                      "status_code":getattr(exc,"status_code",None),
                  },sort_keys=True))
          for name,args in (
              ("get_caucion_rates",{"currency":"ARS","caucion_type":"colocadora"}),
              ("get_caucion_rates",{"currency":"USD","caucion_type":"colocadora"}),
              ("get_asset_info",{"symbol":"AL30","market":"BCBA"}),
              ("get_options_chain",{"symbol":"GGAL"}),
              ("get_fci_funds",{}),
          ):
              probe(name,args)
          print("IOL_SOURCEPATH_RCA=GREEN_READONLY")
          PY
          echo "REAL_ORDERS_SENT=0|REAL_ROUTES=NOT_CALLED"
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key"
