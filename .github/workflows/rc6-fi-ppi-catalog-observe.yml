name: RC6 PAPER fixed-income replay on the exact candidate
on:
  push:
    branches: [diagnostic/rc6-fi-ppi-catalog-20261123]
    paths: [.github/workflows/rc6-fi-ppi-catalog-observe.yml]
permissions:
  contents: read
jobs:
  replay:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fce4337023a23eb969792f87008bc4bcd15b40b3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm the exact candidate and install dependencies under its lock
        run: |
          test "$(git rev-parse HEAD)" = "fce4337023a23eb969792f87008bc4bcd15b40b3"
          test "$(git rev-parse HEAD^{tree})" = "eef6387be8173243acb1ee4ac7ed5bb47aee11e8"
          python -m pip install --disable-pip-version-check -c requirements.lock.txt pytest pytest-cov requests PyYAML python-dotenv cryptography fastapi pandas ta google-genai anthropic ppi-client hypothesis responses vcrpy
      - name: Replay six contracts and verify gateway and preopen
        env:
          PYTHONPATH: .:tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m pytest -o addopts='' --junitxml="$RUNNER_TEMP/fi-replay.xml" -q -rs \
            tests/test_rc6_fi_market_sale_authority.py \
            tests/test_rc6_a620_paper_causal_decision_receipt.py \
            tests/test_rc6_fixed_income_event_ledger.py \
            tests/test_rc6_fixed_income_risk_projection.py \
            tests/test_rc6_ppi_global_gateway_runtime.py \
            tests/test_rc6_paper_preopen_gate.py \
            tests/test_porota_preopen_rootless.py \
            tests/test_byma_schedule_rc5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-fi-witness-exact-sha
          path: ${{ runner.temp }}/fi-replay.xml
          if-no-files-found: error
          retention-days: 14
