name: RC6 observe physical history import progress

on:
  push:
    branches: [diagnostic/rc6-history-ppi-pilot-20261123]
    paths: [scripts/history_ppi_pilot/import_progress.py]

permissions:
  contents: read

jobs:
  progress:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the committed History V2 versions from a read-only connection
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" python3 -B scripts/history_ppi_pilot/import_progress.py
      - uses: actions/upload-artifact@v4
        with:
          name: rc6-history-live-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/history-live-progress.json
          retention-days: 7
          if-no-files-found: error
