name: RC6 dashboard classic tables validate 2026-09-07

on:
  push:
    branches:
      - ux/rc6-dashboard-classic-tables-20260907

permissions:
  contents: read

concurrency:
  group: rc6-dashboard-classic-tables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard candidate
        run: |
          set -euo pipefail
          docker build --pull=false --label "porota.commit=${GITHUB_SHA}" \
            -t porota-dashboard-rc6-classic:test .

      - name: Classic table presentation tests
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=192m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0770 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python porota-dashboard-rc6-classic:test \
            -m pytest -q -p no:cacheprovider \
            tests/test_dashboard_table_layout_rc6.py \
            tests/test_dashboard_runtime_truth_fixes_rc6.py \
            tests/test_dashboard_go_live_ux_rc6.py \
            tests/test_dashboard_blocking_semantics_rc6.py \
            tests/test_dashboard_truth_layer_rc6.py \
            tests/test_dashboard_global_a11y_rc5.py

      - name: Compile changed presentation modules in memory
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1777 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python porota-dashboard-rc6-classic:test \
            -c "paths=('ev_dashboard_table_accessibility_rc6.py','eq_dashboard_table_layout_rc6.py','er_dashboard_table_semantics_rc6.py'); [compile(open(p,encoding='utf-8').read(),p,'exec') for p in paths]; print('COMPILE_IN_MEMORY=GREEN')"

      - name: Assert no deployment capability in this workflow
        run: |
          set -euo pipefail
          ! grep -Eq 'DO_SSH_KEY|DO_HOST|ssh |docker run -d|deploy:' .github/workflows/rc6-dashboard-classic-tables-validate-20260907.yml
          echo 'VALIDATION_ONLY=YES'
