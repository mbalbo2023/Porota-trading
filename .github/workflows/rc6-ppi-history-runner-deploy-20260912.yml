name: RC6 deploy and start durable PPI history runner 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-runner-deploy-20260912.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-start-canary-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ingestion branch
        uses: actions/checkout@v4

      - name: Validate runner syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/ppi_history_runner_rc6.py
          bash -n ops/ppi_history_runner_wrapper_rc6.sh
          grep -q '^ExecStart=/usr/local/sbin/porota-ppi-history-runner-rc6$' ops/porota-ppi-fullfamily-history-rc6.service

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preflight host safety integrity universe lock and disk
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"
          echo "HOST_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECT" || { echo "ABORT=HOST_SHA_CHANGED"; exit 31; }

          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 0 9 || { echo "ABORT=CANONICAL_HISTORY_LOCK_BUSY"; exit 32; }
          flock -u 9

          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"
            case "$st" in active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 33;; esac
          done

          FREE_KB="$(df -Pk /opt/porota-trading | awk 'NR==2{print $4}')"
          echo "HOST_FREE_KB=$FREE_KB"
          test "$FREE_KB" -ge 3145728 || { echo "ABORT=DISK_BELOW_3G"; exit 34; }

          sudo -n docker inspect -f '{{.State.Running}}' porota_production_observer | grep -qx true || { echo "ABORT=OBSERVER_CONTAINER_DOWN"; exit 35; }
          sudo -n docker exec -i porota_production_observer python -B - <<'PY'
          import sqlite3
          import bf_production_paper_observer as m
          from cv_history_store_adapter_hf6 import default_history_store

          def norm(v): return str(v or '').strip().upper()
          def pick(cols,*names):
              for n in names:
                  if n in cols: return n

          store=m.runtime_store()
          with store.connect() as c:
              qc=c.execute('pragma quick_check').fetchone()[0]
              print('OBSERVER_QUICK_CHECK='+str(qc)); assert qc=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_BEFORE={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              cols=[r[1] for r in c.execute('pragma table_info(ppi_argentina_api_shadow)')]
              sym=pick(cols,'ticker','symbol'); fam=pick(cols,'instrument_type','family','type')
              mkt=pick(cols,'market'); stl=pick(cols,'settlement')
              assert all([sym,fam,mkt,stl])
              q='select '+','.join('"'+x+'"' for x in [sym,fam,mkt,stl])+" from ppi_argentina_api_shadow where market in ('BYMA','ROFEX','A3','OTC') and instrument_type not in ('ACCIONES-USA','FCI-EXTERIOR')"
              rows=c.execute(q).fetchall()
              keys={(norm(r[0]),norm(r[1]),norm(r[2]),norm(r[3])) for r in rows}
              print(f'SHADOW_ROWS={len(rows)} SHADOW_KEYS={len(keys)}')
              assert len(rows)==1960 and len(keys)==1960
          h=default_history_store()
          with h.connect() as c:
              qc=c.execute('pragma quick_check').fetchone()[0]
              dup=c.execute('''select count(*) from (select symbol,instrument_type,market,settlement,date,count(*) n from history_canonical_v2 group by symbol,instrument_type,market,settlement,date having n>1)''').fetchone()[0]
              rows=c.execute('select count(*) from history_canonical_v2').fetchone()[0]
              print(f'HISTORY_QUICK_CHECK={qc} CANONICAL_DUPLICATES={dup} CANONICAL_ROWS={rows}')
              assert qc=='ok' and int(dup)==0
          print('PREFLIGHT=PASS')
          PY
          HOST

      - name: Copy versioned runner wrapper and unit
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          SCP=(scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          "${SCP[@]}" ops/ppi_history_runner_rc6.py "$DO_USER@$DO_HOST:/tmp/ppi_history_runner_rc6.py"
          "${SCP[@]}" ops/ppi_history_runner_wrapper_rc6.sh "$DO_USER@$DO_HOST:/tmp/ppi_history_runner_wrapper_rc6.sh"
          "${SCP[@]}" ops/porota-ppi-fullfamily-history-rc6.service "$DO_USER@$DO_HOST:/tmp/porota-ppi-fullfamily-history-rc6.service"

      - name: Install durable systemd owner
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          sudo -n install -d -m 0755 /opt/porota-ingest
          sudo -n install -m 0644 /tmp/ppi_history_runner_rc6.py /opt/porota-ingest/ppi_history_runner_rc6.py
          sudo -n install -m 0755 /tmp/ppi_history_runner_wrapper_rc6.sh /usr/local/sbin/porota-ppi-history-runner-rc6
          sudo -n install -m 0644 /tmp/porota-ppi-fullfamily-history-rc6.service /etc/systemd/system/porota-ppi-fullfamily-history-rc6.service
          rm -f /tmp/ppi_history_runner_rc6.py /tmp/ppi_history_runner_wrapper_rc6.sh /tmp/porota-ppi-fullfamily-history-rc6.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable porota-ppi-fullfamily-history-rc6.service
          echo "RUNNER_SHA256=$(sha256sum /opt/porota-ingest/ppi_history_runner_rc6.py | awk '{print $1}')"
          echo "WRAPPER_SHA256=$(sha256sum /usr/local/sbin/porota-ppi-history-runner-rc6 | awk '{print $1}')"
          echo "SYSTEMD_INSTALLED=YES"
          HOST

      - name: Start and require first committed API batch
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          SVC=porota-ppi-fullfamily-history-rc6.service
          sudo -n systemctl start "$SVC"
          echo "SYSTEMD_START_REQUESTED=YES"
          ok=0
          for _ in $(seq 1 300); do
            ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
            SNAP="$(sudo -n docker exec -i porota_production_observer python -B - <<'PY' 2>/dev/null || true
import bf_production_paper_observer as m
try:
    with m.runtime_store().connect() as c:
        r=c.execute("select status,last_committed_batch,heartbeat,rows_canonical,done_identities,pending_identities,error_identities,safety,detail from ppi_history_ingest_runtime where run_id='PPI-HIST-20260912-001'").fetchone()
    if r:
        print('STATUS='+str(r[0])); print('BATCH='+str(r[1])); print('HEARTBEAT='+str(r[2])); print('ROWS='+str(r[3])); print('DONE='+str(r[4])); print('PENDING='+str(r[5])); print('ERRORS='+str(r[6])); print('SAFETY='+str(r[7])); print('DETAIL='+str(r[8]))
except Exception:
    pass
PY
)"
            STATUS="$(printf '%s\n' "$SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
            BATCH="$(printf '%s\n' "$SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
            echo "CANARY_ACTIVE=$ACTIVE STATUS=${STATUS:-NONE} BATCH=${BATCH:-0}"
            case "$STATUS" in BLOCKED_*) echo "$SNAP"; sudo -n journalctl -u "$SVC" -n 120 --no-pager; exit 41;; esac
            if [[ "${BATCH:-0}" =~ ^[0-9]+$ ]] && [ "${BATCH:-0}" -ge 1 ]; then
              echo "$SNAP"
              echo "FIRST_COMMITTED_BATCH=YES"
              ok=1
              break
            fi
            if [ "$ACTIVE" = failed ]; then sudo -n journalctl -u "$SVC" -n 120 --no-pager; exit 42; fi
            sleep 2
          done
          test "$ok" -eq 1 || { echo "ABORT=NO_COMMITTED_BATCH_WITHIN_10_MIN"; sudo -n journalctl -u "$SVC" -n 160 --no-pager; exit 43; }
          HOST

      - name: Controlled interruption and integrity proof
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          SVC=porota-ppi-fullfamily-history-rc6.service
          BEFORE="$(sudo -n docker exec -i porota_production_observer python -B - <<'PY'
import bf_production_paper_observer as m
with m.runtime_store().connect() as c:
    r=c.execute("select last_committed_batch,heartbeat from ppi_history_ingest_runtime where run_id='PPI-HIST-20260912-001'").fetchone()
print(f'{int(r[0])}|{r[1]}')
PY
)"
          BEFORE_BATCH="${BEFORE%%|*}"
          echo "BEFORE_STOP=$BEFORE"
          sudo -n systemctl stop "$SVC"
          test "$(systemctl is-active "$SVC" 2>/dev/null || true)" != active
          sudo -n docker exec -i porota_production_observer sh -c 'test ! -s /tmp/porota-ppi-fullfamily-history.pid || ! kill -0 $(cat /tmp/porota-ppi-fullfamily-history.pid) 2>/dev/null'
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 0 9 || { echo "ABORT=LOCK_NOT_RELEASED_AFTER_CONTROLLED_STOP"; exit 51; }
          flock -u 9
          sudo -n docker exec -i porota_production_observer python -B - <<'PY'
import bf_production_paper_observer as m
from cv_history_store_adapter_hf6 import default_history_store
with m.runtime_store().connect() as c:
    s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
    print(f'SAFETY_AFTER_STOP={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
h=default_history_store()
with h.connect() as c:
    qc=c.execute('pragma quick_check').fetchone()[0]
    dup=c.execute('''select count(*) from (select symbol,instrument_type,market,settlement,date,count(*) n from history_canonical_v2 group by symbol,instrument_type,market,settlement,date having n>1)''').fetchone()[0]
    print(f'POST_STOP_QUICK_CHECK={qc} POST_STOP_DUPLICATES={dup}')
    assert qc=='ok' and int(dup)==0
PY
          echo "CONTROLLED_STOP_INTEGRITY=PASS"
          printf '%s\n' "$BEFORE_BATCH" > /tmp/porota_ingest_before_batch
          HOST

      - name: Restart resume and leave runner durable
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          SVC=porota-ppi-fullfamily-history-rc6.service
          BEFORE_BATCH="$(cat /tmp/porota_ingest_before_batch)"
          rm -f /tmp/porota_ingest_before_batch
          sudo -n systemctl start "$SVC"
          resumed=0
          FINAL=""
          for _ in $(seq 1 300); do
            ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
            SNAP="$(sudo -n docker exec -i porota_production_observer python -B - <<'PY' 2>/dev/null || true
import bf_production_paper_observer as m
try:
    with m.runtime_store().connect() as c:
        r=c.execute("select status,last_committed_batch,heartbeat,rows_canonical,done_identities,pending_identities,error_identities,safety,detail from ppi_history_ingest_runtime where run_id='PPI-HIST-20260912-001'").fetchone()
    if r:
        print('STATUS='+str(r[0])); print('BATCH='+str(r[1])); print('HEARTBEAT='+str(r[2])); print('ROWS='+str(r[3])); print('DONE='+str(r[4])); print('PENDING='+str(r[5])); print('ERRORS='+str(r[6])); print('SAFETY='+str(r[7])); print('DETAIL='+str(r[8]))
except Exception:
    pass
PY
)"
            STATUS="$(printf '%s\n' "$SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
            BATCH="$(printf '%s\n' "$SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
            echo "RESUME_ACTIVE=$ACTIVE STATUS=${STATUS:-NONE} BATCH=${BATCH:-0} BEFORE=$BEFORE_BATCH"
            case "$STATUS" in BLOCKED_*) echo "$SNAP"; sudo -n journalctl -u "$SVC" -n 140 --no-pager; exit 61;; esac
            if [[ "${BATCH:-0}" =~ ^[0-9]+$ ]] && [ "${BATCH:-0}" -gt "$BEFORE_BATCH" ]; then resumed=1; FINAL="$SNAP"; break; fi
            case "$STATUS" in API_PASS_COMPLETE|API_PASS_COMPLETE_WITH_ERRORS) resumed=1; FINAL="$SNAP"; break;; esac
            if [ "$ACTIVE" = failed ]; then sudo -n journalctl -u "$SVC" -n 140 --no-pager; exit 62; fi
            sleep 2
          done
          test "$resumed" -eq 1 || { echo "ABORT=NO_PROGRESS_AFTER_RESTART"; sudo -n journalctl -u "$SVC" -n 180 --no-pager; exit 63; }
          echo "$FINAL"

          sudo -n docker exec -i porota_production_observer python -B - <<'PY'
import bf_production_paper_observer as m
from cv_history_store_adapter_hf6 import default_history_store
with m.runtime_store().connect() as c:
    s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
    r=c.execute("select status,last_committed_batch,heartbeat,done_identities,pending_identities,error_identities,rows_canonical,disk_free_gib,safety from ppi_history_ingest_runtime where run_id='PPI-HIST-20260912-001'").fetchone()
    print(f'SAFETY_FINAL={s[0]}|{s[1]}'); assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
    print('FINAL_RUNTIME='+'|'.join(str(x) for x in r))
h=default_history_store()
with h.connect() as c:
    qc=c.execute('pragma quick_check').fetchone()[0]
    dup=c.execute('''select count(*) from (select symbol,instrument_type,market,settlement,date,count(*) n from history_canonical_v2 group by symbol,instrument_type,market,settlement,date having n>1)''').fetchone()[0]
    print(f'FINAL_QUICK_CHECK={qc} FINAL_DUPLICATES={dup}')
    assert qc=='ok' and int(dup)==0
PY
          ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
          echo "SYSTEMD_FINAL_ACTIVE=$ACTIVE"
          if [ "$ACTIVE" = active ]; then
            echo "RUNNER_LEFT_RUNNING=YES"
          else
            STATUS="$(printf '%s\n' "$FINAL" | sed -n 's/^STATUS=//p' | tail -1)"
            case "$STATUS" in API_PASS_COMPLETE|API_PASS_COMPLETE_WITH_ERRORS) echo "RUNNER_FINISHED_DURING_CANARY=YES";; *) echo "ABORT=SERVICE_NOT_ACTIVE_AND_NOT_COMPLETE"; exit 64;; esac
          fi
          echo "DEPLOY_CANARY_RESUME=PASS"
          HOST
