name: RC6 deploy and start durable PPI history runner 2026-09-12

on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-ppi-history-runner-deploy-20260912.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-start-canary-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ingestion branch
        uses: actions/checkout@v4

      - name: Validate versioned runner assets
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/ppi_history_runner_rc6.py ops/ppi_history_control_rc6.py
          bash -n ops/ppi_history_runner_wrapper_rc6.sh
          grep -q '^ExecStart=/usr/local/sbin/porota-ppi-history-runner-rc6$' ops/porota-ppi-fullfamily-history-rc6.service

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy bounded deployment assets to temporary host paths
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ops/ppi_history_runner_rc6.py "$DO_USER@$DO_HOST:/tmp/ppi_history_runner_rc6.py"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ops/ppi_history_control_rc6.py "$DO_USER@$DO_HOST:/tmp/ppi_history_control_rc6.py"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ops/ppi_history_runner_wrapper_rc6.sh "$DO_USER@$DO_HOST:/tmp/ppi_history_runner_wrapper_rc6.sh"
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ops/porota-ppi-fullfamily-history-rc6.service "$DO_USER@$DO_HOST:/tmp/porota-ppi-fullfamily-history-rc6.service"

      - name: Preflight install start interrupt resume and leave systemd owner running
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          SVC=porota-ppi-fullfamily-history-rc6.service
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"
          echo "HOST_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECT" || { echo "ABORT=HOST_SHA_CHANGED"; exit 31; }

          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 0 9 || { echo "ABORT=CANONICAL_HISTORY_LOCK_BUSY"; exit 32; }
          flock -u 9

          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"
            case "$st" in
              active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 33 ;;
            esac
          done

          FREE_KB="$(df -Pk /opt/porota-trading | awk 'NR==2{print $4}')"
          echo "HOST_FREE_KB=$FREE_KB"
          test "$FREE_KB" -ge 3145728 || { echo "ABORT=DISK_BELOW_3G"; exit 34; }
          sudo -n docker inspect -f '{{.State.Running}}' porota_production_observer | grep -qx true || { echo "ABORT=OBSERVER_CONTAINER_DOWN"; exit 35; }
          sudo -n docker exec -i porota_production_observer python -u - preflight < /tmp/ppi_history_control_rc6.py

          sudo -n install -d -m 0755 /opt/porota-ingest
          sudo -n install -m 0644 /tmp/ppi_history_runner_rc6.py /opt/porota-ingest/ppi_history_runner_rc6.py
          sudo -n install -m 0644 /tmp/ppi_history_control_rc6.py /opt/porota-ingest/ppi_history_control_rc6.py
          sudo -n install -m 0755 /tmp/ppi_history_runner_wrapper_rc6.sh /usr/local/sbin/porota-ppi-history-runner-rc6
          sudo -n install -m 0644 /tmp/porota-ppi-fullfamily-history-rc6.service /etc/systemd/system/porota-ppi-fullfamily-history-rc6.service
          rm -f /tmp/ppi_history_runner_rc6.py /tmp/ppi_history_control_rc6.py /tmp/ppi_history_runner_wrapper_rc6.sh /tmp/porota-ppi-fullfamily-history-rc6.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable "$SVC"
          echo "SYSTEMD_INSTALLED=YES"

          snapshot() {
            sudo -n docker exec -i porota_production_observer python -u - status < /opt/porota-ingest/ppi_history_control_rc6.py 2>/dev/null || true
          }
          integrity() {
            sudo -n docker exec -i porota_production_observer python -u - integrity < /opt/porota-ingest/ppi_history_control_rc6.py
          }

          sudo -n systemctl start "$SVC"
          echo "SYSTEMD_START_REQUESTED=YES"
          first=0
          FIRST_SNAP=''
          for _ in $(seq 1 300); do
            ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
            SNAP="$(snapshot)"
            STATUS="$(printf '%s\n' "$SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
            BATCH="$(printf '%s\n' "$SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
            PID="$(printf '%s\n' "$SNAP" | sed -n 's/^PID=//p' | tail -1)"
            echo "CANARY_ACTIVE=$ACTIVE STATUS=${STATUS:-NONE} BATCH=${BATCH:-0} PID=${PID:-0}"
            case "$STATUS" in
              BLOCKED_*) echo "$SNAP"; sudo -n journalctl -u "$SVC" -n 120 --no-pager; exit 41 ;;
            esac
            if [[ "${BATCH:-0}" =~ ^[0-9]+$ ]] && [ "${BATCH:-0}" -ge 1 ] && [[ "${PID:-0}" =~ ^[1-9][0-9]*$ ]]; then
              first=1
              FIRST_SNAP="$SNAP"
              break
            fi
            if [ "$ACTIVE" = failed ]; then
              sudo -n journalctl -u "$SVC" -n 120 --no-pager
              exit 42
            fi
            sleep 2
          done
          test "$first" -eq 1 || { echo "ABORT=NO_COMMITTED_BATCH_WITHIN_10MIN"; sudo -n journalctl -u "$SVC" -n 160 --no-pager; exit 43; }
          echo "$FIRST_SNAP"
          BEFORE_BATCH="$(printf '%s\n' "$FIRST_SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
          BEFORE_HEARTBEAT="$(printf '%s\n' "$FIRST_SNAP" | sed -n 's/^HEARTBEAT=//p' | tail -1)"
          echo "FIRST_COMMITTED_BATCH=YES"
          integrity

          sudo -n systemctl stop "$SVC"
          AFTER_STOP="$(snapshot)"
          STOP_PID="$(printf '%s\n' "$AFTER_STOP" | sed -n 's/^PID=//p' | tail -1)"
          echo "$AFTER_STOP"
          test "${STOP_PID:-0}" = 0 || { echo "ABORT=RUNNER_PID_SURVIVED_CONTROLLED_STOP"; exit 51; }
          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 0 9 || { echo "ABORT=LOCK_NOT_RELEASED_AFTER_CONTROLLED_STOP"; exit 52; }
          flock -u 9
          integrity
          echo "CONTROLLED_STOP_INTEGRITY=PASS"

          sudo -n systemctl start "$SVC"
          resumed=0
          FINAL_SNAP=''
          for _ in $(seq 1 300); do
            ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
            SNAP="$(snapshot)"
            STATUS="$(printf '%s\n' "$SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
            BATCH="$(printf '%s\n' "$SNAP" | sed -n 's/^BATCH=//p' | tail -1)"
            HEARTBEAT="$(printf '%s\n' "$SNAP" | sed -n 's/^HEARTBEAT=//p' | tail -1)"
            PID="$(printf '%s\n' "$SNAP" | sed -n 's/^PID=//p' | tail -1)"
            echo "RESUME_ACTIVE=$ACTIVE STATUS=${STATUS:-NONE} BATCH=${BATCH:-0} PID=${PID:-0}"
            case "$STATUS" in
              BLOCKED_*) echo "$SNAP"; sudo -n journalctl -u "$SVC" -n 140 --no-pager; exit 61 ;;
            esac
            if [[ "${BATCH:-0}" =~ ^[0-9]+$ ]] && [ "${BATCH:-0}" -gt "$BEFORE_BATCH" ] && [ "$HEARTBEAT" != "$BEFORE_HEARTBEAT" ] && [[ "${PID:-0}" =~ ^[1-9][0-9]*$ ]]; then
              resumed=1
              FINAL_SNAP="$SNAP"
              break
            fi
            case "$STATUS" in
              API_PASS_COMPLETE|API_PASS_COMPLETE_WITH_ERRORS)
                resumed=1
                FINAL_SNAP="$SNAP"
                break
                ;;
            esac
            if [ "$ACTIVE" = failed ]; then
              sudo -n journalctl -u "$SVC" -n 140 --no-pager
              exit 62
            fi
            sleep 2
          done
          test "$resumed" -eq 1 || { echo "ABORT=NO_PROGRESS_AFTER_RESTART"; sudo -n journalctl -u "$SVC" -n 180 --no-pager; exit 63; }
          echo "$FINAL_SNAP"
          integrity

          ACTIVE="$(systemctl is-active "$SVC" 2>/dev/null || true)"
          STATUS="$(printf '%s\n' "$FINAL_SNAP" | sed -n 's/^STATUS=//p' | tail -1)"
          echo "SYSTEMD_FINAL_ACTIVE=$ACTIVE"
          if [ "$ACTIVE" = active ]; then
            echo "RUNNER_LEFT_RUNNING=YES"
          else
            case "$STATUS" in
              API_PASS_COMPLETE|API_PASS_COMPLETE_WITH_ERRORS) echo "RUNNER_FINISHED_DURING_CANARY=YES" ;;
              *) echo "ABORT=SERVICE_NOT_ACTIVE_AND_NOT_COMPLETE"; exit 64 ;;
            esac
          fi
          echo "DEPLOY_CANARY_RESUME=PASS"
          HOST
