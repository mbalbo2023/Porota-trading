name: RC6 WS-INTEG-03 Route Budget Read-Only RCA 2026-09-30

on:
  push:
    branches:
      - fix/ws-integ-03-runtime-route-budgets-20260930
    paths:
      - '.github/workflows/rc6-ws-integ-03-route-budget-rca-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly_route_budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_diagnostic"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_diagnostic" "$HOME/.ssh/known_hosts"

      - name: Measure all runtime routes without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota_rc6_diagnostic" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo -n docker inspect -f 'ROUTE_RCA_IMAGE={{.Image}}|STATUS={{.State.Status}}|OOM={{.State.OOMKilled}}|RESTARTS={{.RestartCount}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_dashboard python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen

          paths = (
              '/', '/vivo', '/trading', '/trading/acciones', '/universo-operativo',
              '/instrumentos', '/validacion', '/analisis', '/aprendizaje', '/scalping',
              '/riesgo', '/historicos', '/reportes', '/sistema', '/salud',
              '/api/dashboard/truth',
          )
          token = os.environ['DASHBOARD_ACCESS_TOKEN']
          for cycle in (1, 2):
              for path in paths:
                  started = time.monotonic()
                  status = None
                  size = None
                  error = None
                  try:
                      request = Request('http://127.0.0.1:8000' + path,
                                        headers={'Authorization': 'Bearer ' + token})
                      with urlopen(request, timeout=90) as response:
                          body = response.read()
                          status, size = response.status, len(body)
                  except Exception as exc:
                      error = type(exc).__name__
                  print('ROUTE_BUDGET=' + json.dumps({
                      'cycle': cycle, 'path': path, 'status': status, 'bytes': size,
                      'seconds': round(time.monotonic() - started, 3), 'error': error,
                  }, sort_keys=True, separators=(',', ':')), flush=True)
          PY
          sudo -n python3 - <<'PY'
          import sqlite3
          path='/opt/porota-trading/data/paper_v17/observer_v17.db'
          connection=sqlite3.connect(f'file:{path}?mode=ro', uri=True)
          connection.execute('PRAGMA query_only=ON')
          row=connection.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone()
          connection.close()
          print(f'ROUTE_RCA_SAFETY={row[0]}|real_orders_sent={row[1]}|real_routes=[]')
          PY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/porota_rc6_diagnostic"
