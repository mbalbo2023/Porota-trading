# Fresh read-only production verification requested 2026-09-21 UTC; remote commands below are read-only.
name: RC6 GDELT runtime read-only 2026-09-20

on:
  push:
    branches:
      - audit/rc6-gdelt-runtime-readonly-20260920
    paths:
      - '.github/workflows/rc6-gdelt-runtime-readonly-20260920.yml'

permissions:
  contents: read

jobs:
  readonly-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read production state only
        shell: bash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/rc6-readonly.txt
          set -euo pipefail
          echo READONLY_BEGIN
          echo PAPER_AND_GDELT_STATUS
          sudo -n docker exec -i -w /app porota_production_observer python - <<'PY'
          import json, sqlite3
          import rc6_gdelt_event_risk_job as g
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=5)
          c.execute('PRAGMA query_only=ON')
          print('OBSERVER_QC='+str(c.execute('PRAGMA quick_check').fetchone()[0]))
          row=c.execute('SELECT mode,process_state,session_state,ppi_auth,real_orders_sent,heartbeat_at,last_market_data_at FROM observer_state WHERE id=1').fetchone()
          print('OBSERVER_STATE='+json.dumps(row,ensure_ascii=False))
          c.close()
          status=g.latest_status()
          keys=('state','last_run_state','freshness','freshness_seconds','started_at','finished_at','requested_event_types','successful_event_types','events_total','latest_event_available_at','authority','decision_effect','errors_json')
          print('GDELT_STATUS='+json.dumps({k:status.get(k) for k in keys},ensure_ascii=False,sort_keys=True))
          try:
              events=g.latest_events(limit=100)
              print('GDELT_TITLED_EVENTS='+str(len(events)))
              for e in events[:10]: print('GDELT_HEADLINE='+json.dumps({k:e.get(k) for k in ('published_at','event_type','title','source_domain','provenance_url')},ensure_ascii=False))
          except Exception as e:
              print('GDELT_EVENTS_READ_ERROR='+type(e).__name__+':'+str(e))
          PY
          echo DECISION_RISK_POSITION_LEARNING_READONLY
          sudo -n docker exec -i -w /app porota_production_observer python - <<'PY'
          import json, sqlite3
          db='file:/app/data/paper_v17/observer_v17.db?mode=ro'
          c=sqlite3.connect(db,uri=True,timeout=5); c.row_factory=sqlite3.Row; c.execute('PRAGMA query_only=ON')
          def rows(sql,args=()): return [dict(r) for r in c.execute(sql,args).fetchall()]
          tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          for table,sql in {
            'paper_decisions': "SELECT decided_at,symbol,action,score,reason FROM paper_decisions ORDER BY id DESC LIMIT 12",
            'trade_gate_evaluations': "SELECT evaluated_at,symbol,technical_gate,ai_gate,patrimonial_gate,final_result,reason FROM trade_gate_evaluations WHERE date(evaluated_at,'-3 hours')=date('now','-3 hours') ORDER BY id DESC LIMIT 20",
            'paper_daily_risk': "SELECT day,currency,state,evaluated_at,daily_pnl,detail FROM paper_daily_risk ORDER BY evaluated_at DESC LIMIT 8",
            'open_positions': "SELECT paper_id,symbol,status,quantity,opened_at FROM paper_positions WHERE status='OPEN' ORDER BY opened_at DESC LIMIT 20",
            'learning_samples': "SELECT COUNT(*) total,SUM(CASE WHEN label_timestamp IS NOT NULL THEN 1 ELSE 0 END) labeled,MAX(feature_timestamp) latest_sample,MAX(label_timestamp) latest_label FROM paper_learning_samples"
          }.items():
            try: print('AUDIT_'+table.upper()+'='+json.dumps(rows(sql) if table!='learning_samples' else (rows(sql)[0] if rows(sql) else {}),ensure_ascii=False,default=str))
            except Exception as e: print('AUDIT_'+table.upper()+'_ERROR='+type(e).__name__+':'+str(e))
          if 'paper_events' in tables:
            print('AUDIT_RECENT_RISK_EVENTS='+json.dumps(rows("SELECT event_at,event_type,detail FROM paper_events WHERE upper(event_type) LIKE '%RISK%' OR upper(detail) LIKE '%CLOCK%' ORDER BY id DESC LIMIT 20"),ensure_ascii=False,default=str))
          c.close()
          PY
          sudo -n docker exec -i -w /app porota_production_dashboard python - <<'PY'
          import json, sqlite3
          import cr_pending_settlement_diagnostics_hf6 as d
          class Store:
              def connect(self):
                  c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True,timeout=5)
                  c.row_factory=sqlite3.Row; c.execute('PRAGMA query_only=ON'); return c
          try:
              x=d.snapshot(Store())
              print('AUDIT_SETTLEMENT='+json.dumps({k:x.get(k) for k in ('state','diagnosis','counts','totals','snapshot_pending','live_pending','rows','as_of')},ensure_ascii=False,default=str))
          except Exception as e: print('AUDIT_SETTLEMENT_ERROR='+type(e).__name__+':'+str(e))
          PY
          echo RISK_PANEL_RENDER
          sudo -n docker exec -i -w /app porota_production_dashboard python - <<'PY'
          import re
          import rc6_risk_gdelt_dashboard as d
          html=d.render_section()
          print('RISK_TABLE_PRESENT='+str('rc6-gdelt-news-table' in html))
          print('SHOW_MORE_PRESENT='+str('Mostrar más' in html))
          print('INITIAL_VISIBLE_ROWS='+str(len(re.findall(r'<tr(?![^>]*gdelt-more-row)[^>]*>',html))))
          print('TABLE_ROWS='+str(len(re.findall(r'<tr[^>]*>',html))))
          PY
          echo TIMER_UNIT_FILES
          sudo -n systemctl list-unit-files --type=timer --no-pager | grep -i porota || true
          echo ALL_TIMER_STATUS
          sudo -n systemctl list-timers --all --no-pager
          echo TARGET_TIMER_STATES
          for u in porota-preopen-rc6.timer porota-snapshot-preopen-rc6.timer porota-iol-shadow-collector-rc6.timer porota-snapshot-postclose-rc6.timer porota-introspection-rc6.timer porota-introspection-publish-rc6.timer porota-scheduler-export-rc6.timer porota-candle-integrity-rc6.timer porota-rc6-candle-inmarket-verify.timer porota-introspeccion-hf5.timer porota-introspection-publish.timer porota-scheduler-export-hf6.timer porota-gdelt-rc6.timer; do
            echo "$u|enabled=$(sudo -n systemctl is-enabled "$u" 2>/dev/null || true)|active=$(sudo -n systemctl is-active "$u" 2>/dev/null || true)"
          done
          echo READONLY_END
          REMOTE
          { echo 'RC6 runtime check (read-only)'; sed -n '1,220p' /tmp/rc6-readonly.txt; } >> "$GITHUB_STEP_SUMMARY"