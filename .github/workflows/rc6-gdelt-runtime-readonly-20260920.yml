            try: print('AUDIT_'+table.upper()+'='+json.dumps(rows(sql) if table!='learning_samples' else (rows(sql)[0] if rows(sql) else {}),ensure_ascii=False,default=str))
            except Exception as e: print('AUDIT_'+table.upper()+'_ERROR='+type(e).__name__+':'+str(e))
