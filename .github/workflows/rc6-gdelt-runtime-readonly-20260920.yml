          db='file:/app/data/paper_v17/observer_v17.db?mode=ro'
          c=sqlite3.connect(db,uri=True,timeout=5); c.row_factory=sqlite3.Row; c.execute('PRAGMA query_only=ON')
          def rows(sql,args=()): return [dict(r) for r in c.execute(sql,args).fetchall()]
          tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          for table,sql in {
            'paper_decisions': "SELECT decided_at,symbol,action,score,reason FROM paper_decisions ORDER BY id DESC LIMIT 12",
            'trade_gate_evaluations': "SELECT evaluated_at,symbol,technical_gate,ai_gate,patrimonial_gate,final_result,reason FROM trade_gate_evaluations WHERE date(evaluated_at,'-3 hours')=date('now','-3 hours') ORDER BY id DESC LIMIT 20",
