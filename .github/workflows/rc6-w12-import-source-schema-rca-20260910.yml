name: RC6 W12 Import Source Schema RCA 2026-09-10

on:
  push:
    branches:
      - fix/rc6-w10-sector-map-binding-20260910
    paths:
      - .github/workflows/rc6-w12-import-source-schema-rca-20260910.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert immutable RC6 PAPER safety
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect importer source capture shape and DB schema without writes
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          LIB=/usr/local/lib/porota-contract-evidence-rc6
          DB="$ROOT/data/paper_v17/observer_v17.db"
          LATEST="$(find "$ROOT/data/contract_evidence/rc6_trusted" -maxdepth 1 -type f -name 'contract_*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"

          echo '=== IMPORTER_SOURCE ==='
          sudo -n sed -n '1,320p' "$LIB/rc6_contract_capture_importer.py"
          echo '=== NORMALIZER_SOURCE ==='
          sudo -n sed -n '1,360p' "$LIB/rc6_ppi_contract_normalizer.py"

          echo '=== LATEST_CAPTURE_SHAPE ==='
          sudo -n python3 - "$LATEST" <<'PY'
          import json,sys
          p=sys.argv[1]; d=json.load(open(p,encoding='utf-8'))
          print('FILE='+p)
          print('TOP_KEYS='+','.join(sorted(map(str,d.keys()))))
          for k,v in d.items():
              if isinstance(v,list): print(f'{k}=LIST[{len(v)}]')
              elif isinstance(v,dict): print(f'{k}=DICT_KEYS[{",".join(sorted(map(str,v.keys()))[:40])}]')
              elif k not in {'cookies','headers','authorization','token','secret','password'}: print(f'{k}={str(v)[:300]}')
          PY

          echo '=== CONTRACT_DB_SCHEMA ==='
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True); c.execute('pragma query_only=on')
          tabs=[r[0] for r in c.execute("select name from sqlite_master where type='table' and name like 'contract_evidence%' order by name")]
          print('TABLES='+','.join(tabs))
          for t in tabs:
              print('TABLE='+t)
              for r in c.execute(f'pragma table_info({t})'): print('COL='+repr(tuple(r)))
              try: print('COUNT='+str(c.execute(f'select count(*) from {t}').fetchone()[0]))
              except Exception as e: print('COUNT_ERR='+repr(e))
          c.close()
          PY

          echo '=== FILE_PERMISSIONS ==='
          sudo -n stat -c '%A %U:%G %a %s %n' "$LATEST" "$DB" "$LIB/rc6_contract_capture_importer.py" "$LIB/rc6_ppi_contract_normalizer.py"

          echo '=== SAFETY ==='
          sudo -n python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True); c.execute('pragma query_only=on')
          r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print('MODE='+str(r[0] if r else None)); print('REAL_ORDERS_SENT='+str(r[1] if r else None))
          PY
          echo 'MUTATIONS=NONE'
          echo 'IMPORTER_EXECUTED=NO'
          echo 'ORDER_ROUTES=NOT_CALLED'
          HOST
