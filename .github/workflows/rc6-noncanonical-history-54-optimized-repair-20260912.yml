name: RC6 noncanonical history 54 optimized repair 2026-09-12
on:
  push:
    branches: [ops/rc6-ppi-fullfamily-history-20260912]
    paths: ['.github/workflows/rc6-noncanonical-history-54-optimized-repair-20260912.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Controlled stale cleanup termination and indexed idempotent repair
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          cd /opt/porota-trading
          EXPECT='a47f3339ec6dfe9d5afde444b1aaddabceb0e94d'
          ACTUAL="$(git rev-parse HEAD)"; echo "HOST_SHA=$ACTUAL"; test "$ACTUAL" = "$EXPECT" || { echo ABORT=HOST_SHA_CHANGED; exit 31; }

          for u in porota-ppi-argentina-nightly-rc6.service porota-history-postclose-rc6.service porota-a3-history-daily-rc6.service porota-a3-history-reconcile-rc6.service porota-a3-history-weekend-rc6.service; do
            st="$(systemctl is-active "$u" 2>/dev/null || true)"
            case "$st" in active|activating) echo "ABORT=HISTORY_SERVICE_ACTIVE:$u"; exit 32;; esac
          done

          echo '=== STOP READ-ONLY WAITERS SO REPAIR GETS SERIALIZED PRIORITY ==='
          mapfile -t waiters < <(ps -eo pid=,args= | awk '/flock -w 1800 9/ {print $1}')
          for p in "${waiters[@]:-}"; do
            [ -n "$p" ] || continue
            echo "TERM_AUDIT_WAITER_PID=$p"
            kill -TERM "$p" 2>/dev/null || sudo -n kill -TERM "$p" 2>/dev/null || true
          done
          sleep 2

          echo '=== TERMINATE ONLY THE CONFIRMED STALE PYTHON CLEANUP ==='
          mapfile -t oldpy < <(sudo -n docker top porota_production_observer -eo pid,args 2>/dev/null | awk '$2=="python" && $3=="-" {print $1}')
          if [ "${#oldpy[@]}" -gt 1 ]; then
            echo "ABORT=MULTIPLE_PYTHON_DASH_PROCESSES:${oldpy[*]}"; exit 33
          fi
          if [ "${#oldpy[@]}" -eq 1 ]; then
            p="${oldpy[0]}"
            echo "STALE_CLEANUP_PY_PID=$p"
            sudo -n kill -TERM "$p"
            for i in $(seq 1 20); do kill -0 "$p" 2>/dev/null || break; sleep 1; done
            if kill -0 "$p" 2>/dev/null; then
              echo "ESCALATE_KILL_PID=$p"
              sudo -n kill -KILL "$p"
            fi
          else
            echo 'STALE_CLEANUP_PY_PID=NONE_ALREADY_EXITED'
          fi

          sudo -n install -d -m 0755 /run/porota-trading-history
          for i in $(seq 1 30); do
            holder="$(sudo -n lslocks -rn -o PID,MODE,PATH 2>/dev/null | awk '$3=="/run/porota-trading-history/ppi-fullfamily-history.lock" && $2 !~ /\*/ {print $1; exit}')"
            [ -z "$holder" ] && break
            sleep 1
          done
          holder="$(sudo -n lslocks -rn -o PID,MODE,PATH 2>/dev/null | awk '$3=="/run/porota-trading-history/ppi-fullfamily-history.lock" && $2 !~ /\*/ {print $1; exit}')"
          if [ -n "$holder" ]; then
            cmd="$(sudo -n sh -c "tr '\\0' ' ' </proc/$holder/cmdline" 2>/dev/null || true)"
            echo "RESIDUAL_HOLDER_PID=$holder CMD=$cmd"
            if [[ "$cmd" == *"/run/porota-trading-history/ppi-fullfamily-history.lock"* && "$cmd" == *"docker exec -i porota_production_observer python -"* ]]; then
              child="$(pgrep -P "$holder" | head -1 || true)"
              [ -z "$child" ] || sudo -n kill -TERM "$child" 2>/dev/null || true
              sudo -n kill -TERM "$holder" 2>/dev/null || true
              sleep 3
            else
              echo 'ABORT=UNEXPECTED_HISTORY_LOCK_HOLDER'; exit 34
            fi
          fi

          exec 9>/run/lock/porota-ppi-fullfamily-history.lock
          flock -w 120 9 || { echo ABORT=OUTER_HISTORY_LOCK_BUSY; exit 35; }

          sudo -n flock -w 120 /run/porota-trading-history/ppi-fullfamily-history.lock /usr/bin/docker exec -i porota_production_observer python - <<'PY'
          import json
          from datetime import datetime, timezone
          import bf_production_paper_observer as m
          from cv_history_store_adapter_hf6 import default_history_store

          RUN='RC6_NONCANONICAL_54_QUARANTINE_20260912'
          REASON='POST_REPAIR_NONCANONICAL_OPTION_HISTORY_54'
          AT=datetime.now(timezone.utc).isoformat()
          store=m.runtime_store()

          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_BEFORE={s[0]}|{s[1]}')
              assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0
              keys=[tuple(r) for r in c.execute("select distinct symbol,instrument_type,settlement from production_history_quarantine_rc6 where quarantine_run=?",(RUN,))]
              print('TARGET_KEYS='+str(len(keys)))
              assert len(keys)==54 and {x[1] for x in keys}=={'OPCIONES'}
              noncanonical=c.execute("""select count(*) from production_history p
                left join ppi_argentina_api_shadow s
                  on s.ticker=p.symbol and s.instrument_type=p.instrument_type and s.settlement=p.settlement
                where s.ticker is null""").fetchone()[0]
              print('OBSERVER_NONCANONICAL_ACTIVE='+str(noncanonical)); assert noncanonical==0

          hstore=default_history_store()
          with hstore.connect() as h:
              assert h.execute('pragma quick_check').fetchone()[0]=='ok'
              tabs={r[0] for r in h.execute("select name from sqlite_master where type='table'")}
              h.execute('CREATE TEMP TABLE extra54(symbol TEXT,instrument_type TEXT,settlement TEXT,PRIMARY KEY(symbol,instrument_type,settlement))')
              h.executemany('INSERT INTO extra54 VALUES(?,?,?)',keys)

              # The original cleanup created quarantine tables with CTAS, which inherited no indexes.
              # Add lookup indexes before the repair; include date so every candle is preserved.
              if 'history_canonical_v2_quarantine_rc6' in tabs:
                  h.execute('CREATE INDEX IF NOT EXISTS idx_hcv2_q_rc6_lookup ON history_canonical_v2_quarantine_rc6(symbol,instrument_type,market,settlement,date,quarantine_run)')
              if 'history_close_canonical_v1_quarantine_rc6' in tabs:
                  h.execute('CREATE INDEX IF NOT EXISTS idx_hccv1_q_rc6_lookup ON history_close_canonical_v1_quarantine_rc6(symbol,instrument_type,market,settlement,date,quarantine_run)')
              h.commit()
              print('QUARANTINE_INDEXES=READY')

              h.execute('BEGIN IMMEDIATE')
              h.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_identity_rc6(symbol TEXT,instrument_type TEXT,market TEXT,settlement TEXT,quarantine_reason TEXT,quarantine_run TEXT,quarantined_at TEXT,PRIMARY KEY(symbol,instrument_type,market,settlement,quarantine_run))')
              h.execute('CREATE TABLE IF NOT EXISTS ppi_ingest_quarantine_version_ids_rc6(id INTEGER PRIMARY KEY,table_name TEXT,quarantine_reason TEXT,quarantine_run TEXT,quarantined_at TEXT)')

              h.execute('CREATE TEMP TABLE target_full(symbol TEXT,instrument_type TEXT,market TEXT,settlement TEXT,PRIMARY KEY(symbol,instrument_type,market,settlement))')
              if 'history_canonical_v2' in tabs:
                  h.execute("""INSERT OR IGNORE INTO target_full
                    SELECT DISTINCT x.symbol,x.instrument_type,x.market,x.settlement
                    FROM history_canonical_v2 x JOIN extra54 e
                      ON e.symbol=x.symbol AND e.instrument_type=x.instrument_type AND e.settlement=x.settlement""")
              full_rows_before=h.execute("""select count(*) from history_canonical_v2 x join target_full t
                on t.symbol=x.symbol and t.instrument_type=x.instrument_type and t.market=x.market and t.settlement=x.settlement""").fetchone()[0] if 'history_canonical_v2' in tabs else 0
              full_ids=h.execute('select count(*) from target_full').fetchone()[0]
              print(f'FULL_TARGET_IDENTITIES={full_ids} FULL_TARGET_ROWS={full_rows_before}')

              qfull=0
              if 'history_canonical_v2' in tabs:
                  h.execute("CREATE TABLE IF NOT EXISTS history_canonical_v2_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM history_canonical_v2 WHERE 0")
                  h.execute("""INSERT INTO history_canonical_v2_quarantine_rc6
                    SELECT x.*,?,?,? FROM history_canonical_v2 x JOIN target_full t
                      ON t.symbol=x.symbol AND t.instrument_type=x.instrument_type AND t.market=x.market AND t.settlement=x.settlement
                    WHERE NOT EXISTS (
                      SELECT 1 FROM history_canonical_v2_quarantine_rc6 q
                      WHERE q.symbol=x.symbol AND q.instrument_type=x.instrument_type AND q.market=x.market
                        AND q.settlement=x.settlement AND q.date=x.date AND q.quarantine_run=?)""",(REASON,RUN,AT,RUN))
                  qfull=h.execute('select changes()').fetchone()[0]
                  h.execute("""INSERT OR IGNORE INTO ppi_ingest_quarantine_identity_rc6
                    SELECT symbol,instrument_type,market,settlement,?,?,? FROM target_full""",(REASON,RUN,AT))
                  if 'history_versions_v2' in tabs:
                      h.execute("""INSERT OR IGNORE INTO ppi_ingest_quarantine_version_ids_rc6
                        SELECT v.id,'history_versions_v2',?,?,? FROM history_versions_v2 v JOIN target_full t
                          ON t.symbol=v.symbol AND t.instrument_type=v.instrument_type AND t.market=v.market AND t.settlement=v.settlement""",(REASON,RUN,AT))
                  h.execute("""DELETE FROM history_canonical_v2
                    WHERE EXISTS (SELECT 1 FROM target_full t
                      WHERE t.symbol=history_canonical_v2.symbol AND t.instrument_type=history_canonical_v2.instrument_type
                        AND t.market=history_canonical_v2.market AND t.settlement=history_canonical_v2.settlement)""")
                  full_deleted=h.execute('select changes()').fetchone()[0]
              else:
                  full_deleted=0

              h.execute('CREATE TEMP TABLE target_close(symbol TEXT,instrument_type TEXT,market TEXT,settlement TEXT,PRIMARY KEY(symbol,instrument_type,market,settlement))')
              if 'history_close_canonical_v1' in tabs:
                  h.execute("""INSERT OR IGNORE INTO target_close
                    SELECT DISTINCT x.symbol,x.instrument_type,x.market,x.settlement
                    FROM history_close_canonical_v1 x JOIN extra54 e
                      ON e.symbol=x.symbol AND e.instrument_type=x.instrument_type AND e.settlement=x.settlement""")
              close_rows_before=h.execute("""select count(*) from history_close_canonical_v1 x join target_close t
                on t.symbol=x.symbol and t.instrument_type=x.instrument_type and t.market=x.market and t.settlement=x.settlement""").fetchone()[0] if 'history_close_canonical_v1' in tabs else 0
              print('CLOSE_TARGET_ROWS='+str(close_rows_before))

              qclose=0
              if 'history_close_canonical_v1' in tabs:
                  h.execute("CREATE TABLE IF NOT EXISTS history_close_canonical_v1_quarantine_rc6 AS SELECT *,'' quarantine_reason,'' quarantine_run,'' quarantined_at FROM history_close_canonical_v1 WHERE 0")
                  h.execute("""INSERT INTO history_close_canonical_v1_quarantine_rc6
                    SELECT x.*,?,?,? FROM history_close_canonical_v1 x JOIN target_close t
                      ON t.symbol=x.symbol AND t.instrument_type=x.instrument_type AND t.market=x.market AND t.settlement=x.settlement
                    WHERE NOT EXISTS (
                      SELECT 1 FROM history_close_canonical_v1_quarantine_rc6 q
                      WHERE q.symbol=x.symbol AND q.instrument_type=x.instrument_type AND q.market=x.market
                        AND q.settlement=x.settlement AND q.date=x.date AND q.quarantine_run=?)""",(REASON,RUN,AT,RUN))
                  qclose=h.execute('select changes()').fetchone()[0]
                  h.execute("""INSERT OR IGNORE INTO ppi_ingest_quarantine_identity_rc6
                    SELECT symbol,instrument_type,market,settlement,?,?,? FROM target_close""",(REASON,RUN,AT))
                  if 'history_close_versions_v1' in tabs:
                      ids=[int(r[0]) for r in h.execute("""select v.id from history_close_versions_v1 v join target_close t
                        on t.symbol=v.symbol and t.instrument_type=v.instrument_type and t.market=v.market and t.settlement=v.settlement""")]
                      for vid in ids:
                          h.execute("INSERT OR IGNORE INTO ppi_ingest_quarantine_version_ids_rc6 VALUES(?,?,?,?,?)",(-vid,'history_close_versions_v1',REASON,RUN,AT))
                  h.execute("""DELETE FROM history_close_canonical_v1
                    WHERE EXISTS (SELECT 1 FROM target_close t
                      WHERE t.symbol=history_close_canonical_v1.symbol AND t.instrument_type=history_close_canonical_v1.instrument_type
                        AND t.market=history_close_canonical_v1.market AND t.settlement=history_close_canonical_v1.settlement)""")
                  close_deleted=h.execute('select changes()').fetchone()[0]
              else:
                  close_deleted=0

              h.commit()
              assert h.execute('pragma quick_check').fetchone()[0]=='ok'
              remain_full=h.execute("""select count(*) from history_canonical_v2 x join extra54 e
                on e.symbol=x.symbol and e.instrument_type=x.instrument_type and e.settlement=x.settlement""").fetchone()[0] if 'history_canonical_v2' in tabs else 0
              remain_close=h.execute("""select count(*) from history_close_canonical_v1 x join extra54 e
                on e.symbol=x.symbol and e.instrument_type=x.instrument_type and e.settlement=x.settlement""").fetchone()[0] if 'history_close_canonical_v1' in tabs else 0
              qrun_full=h.execute("""select count(*) from history_canonical_v2_quarantine_rc6 q join extra54 e
                on e.symbol=q.symbol and e.instrument_type=q.instrument_type and e.settlement=q.settlement
                where q.quarantine_run=?""",(RUN,)).fetchone()[0] if 'history_canonical_v2_quarantine_rc6' in tabs else 0
              dup=h.execute("""select count(*) from (
                select symbol,instrument_type,market,settlement,date,count(*) n
                from history_canonical_v2 group by symbol,instrument_type,market,settlement,date having count(*)>1)""").fetchone()[0] if 'history_canonical_v2' in tabs else 0
              print('HISTORY_STORE_REPAIR='+json.dumps({
                'full_target_rows':full_rows_before,'full_quarantined_new':qfull,'full_deleted':full_deleted,
                'close_target_rows':close_rows_before,'close_quarantined_new':qclose,'close_deleted':close_deleted,
                'run_quarantine_full_rows':qrun_full,'remaining_full':remain_full,'remaining_close':remain_close,
                'canonical_duplicate_groups':dup,'append_only_versions_preserved_and_marked':True},sort_keys=True))
              assert remain_full==0 and remain_close==0 and dup==0
              if full_rows_before:
                  assert qrun_full>=full_rows_before

          with store.connect() as c:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              s=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
              print(f'SAFETY_AFTER={s[0]}|{s[1]}')
              assert s[0]=='PRODUCTION_PAPER' and int(s[1] or 0)==0

          print('REPAIR_STATUS=SUCCESS_NONCANONICAL_54_OPTIMIZED')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST
