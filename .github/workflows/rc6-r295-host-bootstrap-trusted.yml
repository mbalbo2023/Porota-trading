name: RC6 R297 owner-GO OFFHOST review only (NO host GO)

# This step verifies owner-GO/reviewed source bytes OFFHOST only. GREEN is
# explicitly NOT host_control_verified, NOT a root bootstrap, NOT a deploy.
# Do not promote this scaffold to main as a host-physical workflow.
on:
  workflow_dispatch:
    inputs:
      owner_comment_id:
        description: Immutable GitHub OWNER GO issue-comment ID (future review)
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  owner_go_offhost_evidence_only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mbalbo2023' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RC6_R295_OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
      RC6_EXPECTED_DO_ID: ${{ secrets.RC6_EXPECTED_DO_ID }}
      RC6_EXPECTED_DO_REGION: ${{ secrets.RC6_EXPECTED_DO_REGION }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact trusted main event SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify owner-GO and pinned R280 SHA offhost; NO physical operations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I scripts/rc6_r295_host_bootstrap_guard.py --check-offhost
