name: RC6 R298 trusted files bootstrap (OFFHOST default; no deploy GO)

# OFFHOST verifies owner-GO without host secrets. Physical modes are explicit,
# require SHA/digest owner authority and never imply host_control_verified.
on:
  workflow_dispatch:
    inputs:
      owner_comment_id:
        description: Immutable OWNER GO comment ID, or PREPARE for the selected GENESIS bootstrap
        required: true
        type: string
      bootstrap_action:
        description: OFFHOST by default; physical modes require scoped GO
        required: true
        type: choice
        default: offhost
        options:
          - offhost
          - install_files
          - resume_files
          - install_genesis_launcher
          - install_genesis_custodian

permissions:
  contents: read
  issues: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  owner_go_offhost_evidence_only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mbalbo2023' && inputs.bootstrap_action == 'offhost' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RC6_R295_OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact trusted main event SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify owner-GO and pinned R280 SHA offhost; NO physical operations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I scripts/rc6_r295_host_bootstrap_guard.py --check-offhost

  approved_root_files_only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mbalbo2023' && (inputs.bootstrap_action == 'install_files' || inputs.bootstrap_action == 'resume_files') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RC6_R295_OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
      BOOTSTRAP_ACTION: ${{ inputs.bootstrap_action }}
      RC6_EXPECTED_DO_ID: ${{ secrets.RC6_EXPECTED_DO_ID }}
      RC6_EXPECTED_DO_REGION: ${{ secrets.RC6_EXPECTED_DO_REGION }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact trusted main SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Execute only the selected OWNER-approved files transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${BOOTSTRAP_ACTION}" in
            install_files)
              python3 -I scripts/rc6_r295_host_bootstrap_guard.py --execute-approved-bootstrap
              ;;
            resume_files)
              python3 -I scripts/rc6_r295_host_bootstrap_guard.py --resume-approved-bootstrap
              ;;
            *)
              echo "RC6_R298_BOOTSTRAP=HOLD79|reason=UNKNOWN_ACTION|host_control_verified=NO_VERIFICADO"
              exit 79
              ;;
          esac

  approved_genesis_launcher_only:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.repository == 'mbalbo2023/Porota-trading' &&
          github.ref == 'refs/heads/main' && github.ref_protected &&
          github.actor == 'mbalbo2023' && github.triggering_actor == 'mbalbo2023' &&
          inputs.bootstrap_action == 'install_genesis_launcher' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - &genesis_checkout
        name: Checkout the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - &genesis_checkout_identity
        name: Verify checkout identity before passing host credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Prepare the host fingerprint for the GENESIS launcher approval
        if: ${{ inputs.owner_comment_id == 'PREPARE' }}
        shell: bash
        env:
          RC6_R295_OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
          DO_HOST: ${{ secrets.DO_HOST }}
          RC6_EXPECTED_DO_ID: ${{ secrets.RC6_EXPECTED_DO_ID }}
          RC6_EXPECTED_DO_REGION: ${{ secrets.RC6_EXPECTED_DO_REGION }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import sys

          try:
              from scripts.rc6_genesis_launcher_authority import host_identity_sha256

              sha = os.environ["GITHUB_SHA"]
              if (os.environ["RC6_R295_OWNER_COMMENT_ID"] != "PREPARE"
                      or not re.fullmatch("[a-f0-9]{40}", sha)):
                  raise ValueError
              fingerprint = host_identity_sha256(os.environ)
              if not re.fullmatch("[a-f0-9]{64}", fingerprint):
                  raise ValueError
          except Exception:
              print("RC6_R362_PREPARE=HOLD79")
              sys.exit(79)
          print("RC6_R362_HOST_IDENTITY_SHA256=" + fingerprint)
          print("GITHUB_SHA=" + sha)
          PY
      - name: Publish the approved GENESIS launcher
        if: ${{ inputs.owner_comment_id != 'PREPARE' }}
        shell: bash
        env: &genesis_publication_credentials
          BOOTSTRAP_ACTION: ${{ inputs.bootstrap_action }}
          RC6_R295_OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
          GITHUB_TOKEN: ${{ github.token }}
          RC6_EXPECTED_DO_ID: ${{ secrets.RC6_EXPECTED_DO_ID }}
          RC6_EXPECTED_DO_REGION: ${{ secrets.RC6_EXPECTED_DO_REGION }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          python3 -B -m scripts.rc6_genesis_launcher_bootstrap --install-approved-launcher

  approved_genesis_custodian_only:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.repository == 'mbalbo2023/Porota-trading' &&
          github.ref == 'refs/heads/main' && github.ref_protected &&
          github.actor == 'mbalbo2023' && github.triggering_actor == 'mbalbo2023' &&
          inputs.bootstrap_action == 'install_genesis_custodian' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - *genesis_checkout
      - *genesis_checkout_identity
      - name: Prepare the verified custodian package and host fingerprints
        if: ${{ inputs.owner_comment_id == 'PREPARE' }}
        shell: bash
        env:
          BOOTSTRAP_ACTION: ${{ inputs.bootstrap_action }}
          RC6_R295_OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
          DO_HOST: ${{ secrets.DO_HOST }}
          RC6_EXPECTED_DO_ID: ${{ secrets.RC6_EXPECTED_DO_ID }}
          RC6_EXPECTED_DO_REGION: ${{ secrets.RC6_EXPECTED_DO_REGION }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          python3 -B -m scripts.rc6_genesis_launcher_bootstrap --prepare-custodian
      - name: Publish the approved GENESIS custodian package
        if: ${{ inputs.owner_comment_id != 'PREPARE' }}
        shell: bash
        env: *genesis_publication_credentials
        run: |
          set -Eeuo pipefail
          python3 -B -m scripts.rc6_genesis_launcher_bootstrap --install-approved-custodian
