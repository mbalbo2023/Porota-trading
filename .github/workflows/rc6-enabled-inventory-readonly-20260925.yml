name: RC6 Enabled Inventory Readonly

on:
  push:
    branches:
      - audit/rc6-enabled-inventory-20260925
    paths:
      - .github/workflows/rc6-enabled-inventory-readonly-20260925.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Read enabled inventory
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "sudo -n python3 -" <<'PY'
          import json, sqlite3
          db="/opt/porota-trading/data/paper_v17/observer_v17.db"
          c=sqlite3.connect(f"file:{db}?mode=ro",uri=True,timeout=10)
          c.row_factory=sqlite3.Row
          c.execute("PRAGMA query_only=ON")
          out={}
          tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          if "financial_instrument_catalog" in tables:
              out["catalog"]=[dict(r) for r in c.execute("""
                SELECT instrument_type family,status,capability,COUNT(*) n
                FROM financial_instrument_catalog
                GROUP BY instrument_type,status,capability
                ORDER BY instrument_type,status,capability
              """)]
          if "candidate_universe" in tables:
              out["candidate_universe"]=[dict(r) for r in c.execute("""
                SELECT instrument_type family,status,can_simulate,COUNT(*) n
                FROM candidate_universe
                GROUP BY instrument_type,status,can_simulate
                ORDER BY instrument_type,status,can_simulate
              """)]
          if "observer_state" in tables:
              out["observer_state"]=dict(c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone())
          c.close()
          print("ENABLED_INVENTORY="+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
