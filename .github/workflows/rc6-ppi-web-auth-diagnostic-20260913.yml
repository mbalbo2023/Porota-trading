name: RC6 PPI Web auth sanitized diagnostic 2026-09-13

on:
  push:
    branches: [ops/rc6-ppi-web-residual-ready-20260913]
    paths: ['.github/workflows/rc6-ppi-web-auth-diagnostic-20260913.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect login form with all non-read traffic blocked
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          SECRET=/etc/porota/contract-evidence-web.env
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          VENV=/opt/porota-contract-evidence-venv
          sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin SECRET="$SECRET" PROFILE="$PROFILE" \
            "$VENV/bin/python" - <<'PY'
          import os,re
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          vals={}
          for line in Path(os.environ['SECRET']).read_text().splitlines():
              s=line.strip()
              if s and not s.startswith('#') and '=' in s:
                  k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          user=vals.get('PPI_WEB_USERNAME',''); password=vals.get('PPI_WEB_PASSWORD','')
          assert user and password
          attempted=[]
          with sync_playwright() as pw:
              ctx=pw.chromium.launch_persistent_context(user_data_dir=os.environ['PROFILE'], executable_path='/usr/bin/google-chrome-stable', headless=True, locale='es-AR', timezone_id='America/Argentina/Buenos_Aires', args=['--no-sandbox','--disable-dev-shm-usage'])
              page=ctx.pages[0] if ctx.pages else ctx.new_page(); page.set_default_timeout(8000)
              def guard(route,request):
                  u=urlsplit(request.url); m=request.method.upper()
                  if m not in {'GET','HEAD','OPTIONS'}:
                      attempted.append((m,u.netloc,u.path))
                      return route.abort()
                  return route.continue_()
              ctx.route('**/*',guard)
              page.goto('https://cuenta.portfoliopersonal.com/login',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(900)
              print('URL_BEFORE='+f'{urlsplit(page.url).scheme}://{urlsplit(page.url).netloc}{urlsplit(page.url).path}')
              for i in range(min(page.locator('form').count(),5)):
                  f=page.locator('form').nth(i)
                  print(f'FORM_{i}_METHOD='+(f.get_attribute('method') or ''))
                  print(f'FORM_{i}_ACTION='+(f.get_attribute('action') or ''))
              ins=page.locator('input')
              print('INPUT_COUNT='+str(ins.count()))
              for i in range(min(ins.count(),20)):
                  q=ins.nth(i)
                  attrs={k:(q.get_attribute(k) or '') for k in ('type','name','id','placeholder','autocomplete')}
                  print('INPUT_%d=%s' % (i, '|'.join(f'{k}:{v}' for k,v in attrs.items())))
              buttons=page.locator('button,input[type="submit"]')
              print('BUTTON_COUNT='+str(buttons.count()))
              for i in range(min(buttons.count(),15)):
                  q=buttons.nth(i)
                  txt=(q.inner_text(timeout=1000) if q.evaluate("e=>e.tagName.toLowerCase()==='button'") else q.get_attribute('value') or '')
                  print(f'BUTTON_{i}='+re.sub(r'\s+',' ',txt).strip()[:100])
              username=None; passwd=None
              for sel in ["input[autocomplete='username']","input[placeholder*='usuario' i]","input[name*='user' i]","input[id*='user' i]","input[type='email']"]:
                  q=page.locator(sel)
                  if q.count() and q.first.is_visible(): username=q.first; break
              for sel in ["input[type='password']","input[autocomplete='current-password']","input[name*='pass' i]","input[id*='pass' i]"]:
                  q=page.locator(sel)
                  if q.count() and q.first.is_visible(): passwd=q.first; break
              print('USERNAME_FIELD_FOUND='+str(username is not None))
              print('PASSWORD_FIELD_FOUND='+str(passwd is not None))
              if username is not None and passwd is not None:
                  username.fill(user); passwd.fill(password)
                  submit=None
                  for sel in ["button:has-text('Ingresar')","button:has-text('Continuar')","button[type='submit']","input[type='submit']"]:
                      q=page.locator(sel)
                      if q.count() and q.first.is_visible(): submit=q.first; break
                  print('SUBMIT_FOUND='+str(submit is not None))
                  if submit is not None:
                      submit.click(no_wait_after=True); page.wait_for_timeout(1800)
              print('NONREAD_ATTEMPTS='+str(len(attempted)))
              for i,(m,h,p) in enumerate(attempted[:20]): print(f'NONREAD_{i}={m}|{h}|{p}')
              alerts=[]
              for sel in ['[role="alert"]','.alert','.error','.invalid-feedback']:
                  q=page.locator(sel)
                  for i in range(min(q.count(),5)):
                      try:
                          if q.nth(i).is_visible():
                              t=re.sub(r'\s+',' ',q.nth(i).inner_text(timeout=1000)).strip()
                              if t and t not in alerts: alerts.append(t[:180])
                      except Exception: pass
              print('ALERT_COUNT='+str(len(alerts)))
              for i,t in enumerate(alerts[:10]): print(f'ALERT_{i}={t}')
              print('CREDENTIALS_EXPOSED=NO')
              print('REAL_ORDERS_SENT=0')
              ctx.close()
          PY
          HOST
