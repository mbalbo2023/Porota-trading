name: RC6 isolated decision-evidence tests

on:
  push:
    branches:
      - feat/rc6-unified-evidence-consolidation-20260919
    paths:
      - 'be_paper_engine.py'
      - 'bg_paper_dashboard.py'
      - 'iol_shadow_decision_input_rc6.py'
      - 'rc6_decision_evidence_report.py'
      - 'rc6_decision_evidence_view.py'
      - 'rc6_shadow_profiles.py'
      - 'systemd/porota-snapshot-postclose-rc6.service'
      - 'tests/test_decision_evidence_snapshots_rc6.py'
      - 'tests/test_iol_shadow_decision_input_rc6.py'
      - 'tests/test_rc6_decision_evidence_report.py'
      - 'tests/test_rc6_decision_evidence_view.py'
      - 'tests/test_rc6_shadow_profiles.py'
      - '.github/workflows/rc6-isolated-decision-evidence-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: isolated tests (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9" requests fastapi
      - name: Compile changed runtime modules
        run: >-
          python -m py_compile
          be_paper_engine.py
          bg_paper_dashboard.py
          iol_shadow_decision_input_rc6.py
          rc6_decision_evidence_report.py
          rc6_decision_evidence_view.py
          rc6_shadow_profiles.py
      - name: Run decision-evidence tests
        run: >-
          python -m pytest -q
          tests/test_decision_evidence_snapshots_rc6.py
          tests/test_iol_shadow_decision_input_rc6.py
          tests/test_rc6_decision_evidence_report.py
          tests/test_rc6_decision_evidence_view.py
          tests/test_rc6_shadow_profiles.py
