name: RC6 WS OPS History Exact Gate Probe 2026-09-30

on:
  push:
    branches:
      - ops/ws-ops-preopen-closure-20260930
    paths:
      - '.github/workflows/rc6-ws-ops-history-exact-probe-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  history_exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Probe exact history gates
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          DB=data/paper_v17/observer_v17.db
          sudo -n timeout 60 docker exec porota_production_observer python - <<'PY'
          import json,sqlite3
          import bf_production_paper_observer as m
          from cg_paper_workspace import runtime_store
          store=runtime_store()
          out={}
          with store.connect() as c:
              c.execute("PRAGMA query_only=ON")
              tables={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type IN ('table','view')")}
              out["observer"]=dict(c.execute("SELECT mode,real_orders_sent,process_state,session_state,ppi_auth,heartbeat_at FROM observer_state WHERE id=1").fetchone())
              out["source_sync"]=[dict(r) for r in c.execute("SELECT * FROM source_sync WHERE source LIKE '%HISTORY%' ORDER BY source")]
              out["api_health"]=[dict(r) for r in c.execute("SELECT * FROM api_health WHERE component LIKE '%HISTORY%' ORDER BY component")]
              out["production_history_max"]=c.execute("SELECT MAX(downloaded_at) FROM production_history").fetchone()[0] if "production_history" in tables else None
              out["attempts_max"]=c.execute("SELECT MAX(attempted_at) FROM production_history_attempts").fetchone()[0] if "production_history_attempts" in tables else None
              out["candidate_universe_available"]=c.execute("SELECT COUNT(*) FROM candidate_universe WHERE status='AVAILABLE' AND can_simulate=1").fetchone()[0] if "candidate_universe" in tables else None
              out["candidate_v2_ready"]=c.execute("SELECT COUNT(*) FROM candidate_identity_v2 WHERE status='AVAILABLE' AND can_simulate=1").fetchone()[0] if "candidate_identity_v2" in tables else None
          out["cutoff_repair_complete"]=m._history_cutoff_repair_complete()
          out["history_end_date"]=str(m._history_end_date())
          out["background_ingest_due"]=m._background_ingest_due(store)
          targets=m._historical_targets(store)
          out["target_count"]=len(targets)
          by={}
          for _ticker,family,_settlement in targets: by[family]=by.get(family,0)+1
          out["targets_by_family"]=by
          out["target_sample"]=[list(x) for x in targets[:20]]
          print("HISTORY_EXACT_GATE="+json.dumps(out,ensure_ascii=False,sort_keys=True,separators=(",",":"),default=str))
          assert out["observer"]["mode"]=="PRODUCTION_PAPER"
          assert int(out["observer"]["real_orders_sent"] or 0)==0
          PY
          echo "HISTORY_OBSERVER_LOGS_BEGIN"
          sudo -n docker logs --since 48h porota_production_observer 2>&1 | grep -Ei 'HISTORY|históric|histor|cutoff|PPI_PRODUCTION_HISTORY|BACKGROUND_READONLY_INGEST' | tail -n 220 || true
          echo "HISTORY_OBSERVER_LOGS_END"
          echo "HISTORY_EXACT_PROBE=GREEN"
          REMOTE
          )"
          printf '%s\n' "$OUT"
          mkdir -p evidence
          { echo '# History exact gate probe'; echo; echo '~~~text'; printf '%s\n' "$OUT"; echo '~~~'; } > evidence/history-exact.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws-ops-history-exact
          path: evidence/history-exact.md
          if-no-files-found: error

      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/key"
