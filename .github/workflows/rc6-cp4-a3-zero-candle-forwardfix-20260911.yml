name: RC6 CP4 A3 Zero Candle Forward Fix 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths:
      - ew_a3_history_rc6.py
      - .github/workflows/rc6-cp4-a3-zero-candle-forwardfix-20260911.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  validate_promote:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Static safety and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile ew_a3_history_rc6.py
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          ! grep -Ei '\b(Order|Confirm|Cancel|MassCancel|Transfer)\b' ew_a3_history_rc6.py
          grep -q 'candle.validate()' ew_a3_history_rc6.py
          echo STATIC_SAFETY=GREEN
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stage candidate without changing active wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST")
          "${SSH[@]}" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          sudo -n install -d -m 0755 "$ROOT/data/rc6_a3_candidate"
          state="$(sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(json.dumps(dict(r) if r else {}))
          PY
          )"
          echo "$state"
          STATE="$state" python3 - <<'PY'
          import os,json
          d=json.loads(os.environ['STATE'])
          assert d.get('mode')=='PRODUCTION_PAPER'
          assert d.get('session_state')=='MARKET_CLOSED'
          assert int(d.get('real_orders_sent') or 0)==0
          PY
          echo CANDIDATE_PRESTATE=GREEN
          HOST
          base64 -w0 ew_a3_history_rc6.py | "${SSH[@]}" "base64 -d | sudo -n tee /opt/porota-trading/data/rc6_a3_candidate/ew_a3_history_rc6.py >/dev/null && sudo -n chmod 0644 /opt/porota-trading/data/rc6_a3_candidate/ew_a3_history_rc6.py"
      - name: Validate candidate on closed safe runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          sudo -n docker exec -i -w /tmp -e PYTHONPATH=/app/data/rc6_a3_candidate:/app/data/rc6_a3_overlay:/app porota_production_observer python - <<'PY'
          import json,sqlite3
          import ew_a3_history_rc6 as h
          class Store:
              def __init__(self,path): self.path=path
              def connect(self):
                  c=sqlite3.connect(self.path,timeout=30); c.row_factory=sqlite3.Row; return c
          print('CANDIDATE_FILE='+h.__file__)
          assert h.__file__.startswith('/app/data/rc6_a3_candidate/')
          r=h.run(Store('/app/data/paper_v17/observer_v17.db'),mode='DAILY_INCREMENTAL',batch_limit=40,throttle_seconds=0.0)
          print(json.dumps(r,ensure_ascii=False,sort_keys=True,default=str))
          assert r.get('ran') is True
          assert int(r.get('failed') or 0)==0
          assert int(r.get('complete') or 0)>=1
          print('CP4_CANDIDATE=GREEN')
          PY
          HOST
      - name: Promote candidate atomically and prove service
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          CAND="$ROOT/data/rc6_a3_candidate/ew_a3_history_rc6.py"
          ACTIVE="$ROOT/data/rc6_a3_overlay/ew_a3_history_rc6.py"
          sudo -n install -o root -g root -m 0644 "$CAND" "$ACTIVE.new"
          sudo -n mv -f "$ACTIVE.new" "$ACTIVE"
          echo OVERLAY_PROMOTED=YES
          set +e
          sudo -n systemctl start porota-a3-history-rc6@DAILY_INCREMENTAL.service
          rc=$?
          set -e
          echo A3_SERVICE_START_RC="$rc"
          sudo -n journalctl -u porota-a3-history-rc6@DAILY_INCREMENTAL.service --since '-5 min' --no-pager -l | tail -n 120
          test "$rc" -eq 0
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          runtime=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          rows=[dict(x) for x in c.execute("select symbol,status,last_complete_day,last_success_at,rows_last,last_error from a3_history_ingest_state_rc6 where instrument_type='FUTUROS' and symbol in ('DLR/JUN27','DLR/JUL27') order by symbol")]
          c.close()
          print(json.dumps({'runtime':dict(runtime) if runtime else None,'rows':rows},ensure_ascii=False,default=str))
          assert runtime and runtime['mode']=='PRODUCTION_PAPER' and runtime['session_state']=='MARKET_CLOSED' and int(runtime['real_orders_sent'] or 0)==0
          assert len(rows)==2
          assert all(x['status']=='COMPLETE' and int(x['rows_last'] or 0)>0 and not str(x['last_error'] or '') for x in rows)
          print('CP4_JUNJUL_PERSISTENCE=GREEN')
          print('CP4_SAFETY=GREEN')
          print('REAL_ORDERS_SENT=0')
          PY
          echo CP4_FORWARD_FIX=GREEN
          HOST
