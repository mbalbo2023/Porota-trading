name: RC6 readiness preflight (temporary)

on:
  push:
    branches:
      - work/rc6-operational-readiness-20260916

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile bg_paper_dashboard.py rc6_action4_audit.py rc6_validation_dynamic.py
      - run: python -m pip install --disable-pip-version-check "pytest>=8.3.0,<9"
      - run: >-
          python -m pytest -q tests/test_rc6_report_retention.py
          tests/test_rc6_action4_audit.py tests/test_rc6_validation_projection.py
          tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_operational_scope.py
          tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_deploy_readiness_contract.py
