name: RC6 readiness preflight (temporary)

on:
  push:
    branches: [work/rc6-operational-readiness-20260916]

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile touched runtime modules
        run: python -m py_compile bg_paper_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py de_scheduler_catalog_hf6.py rc6_validation_dynamic.py rc6_action4_audit.py bm_exit_supervisor.py be_paper_engine.py
      - name: Run focused RC6 regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest requests
          python -m pytest -q tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_rc6_legacy_history_scope.py tests/test_rc6_deploy_readiness_contract.py tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_history_operational_scope.py tests/test_rc6_introspection_scope.py tests/test_rc6_scheduler_operational_scope.py tests/test_rc6_take_profit_regression.py
          python -m pytest -q tests/test_exit_supervision_v17.py -k "max_hold_sin_datos_persiste_y_se_ejecuta_despues_de_reiniciar or 1655_sigue_dentro_de_rueda_y_un_stop_puede_cerrar or eod_no_aplica_a_cauciones_o_derivados_y_frena_entradas"
