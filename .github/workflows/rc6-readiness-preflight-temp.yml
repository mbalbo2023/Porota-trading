name: RC6 readiness preflight (temporary)

on:
  push:
    branches:
      - work/rc6-operational-readiness-20260916

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile touched runtime modules
        run: |
          python -m py_compile bg_paper_dashboard.py dd_history_metrics_hf6.py ek_history_freshness_metrics_rc5.py rc6_validation_dynamic.py rc6_action4_audit.py
      - name: Run focused RC6 regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_rc6_report_retention.py tests/test_rc6_action4_audit.py tests/test_rc6_macro_risk_shadow.py tests/test_rc6_operational_scope.py tests/test_rc6_data912_operational_scope.py tests/test_rc6_validation_projection.py tests/test_rc6_gdelt_shadow.py tests/test_rc6_legacy_history_scope.py tests/test_rc6_deploy_readiness_contract.py tests/test_rc6_validation_dynamic_evidence.py tests/test_rc6_live_scope_gate_fallback.py tests/test_rc6_history_operational_scope.py
