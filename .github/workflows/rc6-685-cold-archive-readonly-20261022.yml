name: RC6 685 COLD archive read-only diagnosis
on:
  push:
    branches:
      - diagnostic/rc6-685-cold-archive-20261022
permissions:
  contents: read
concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false
jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bound source and SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = 4331b70b817e575b89edf0f09d585984b64631ac
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_cold_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_cold_readonly" "$HOME/.ssh/known_hosts"
      - name: Bound read-only state after Deploy V2 failure
        timeout-minutes: 2
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75 ssh -i "$HOME/.ssh/rc6_cold_readonly" -o BatchMode=yes \
            -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" \
            "sudo -n python3 -" <<'PY'
          import importlib.util,json,subprocess,os
          from pathlib import Path
          root=Path('/opt/porota-trading')
          spec=importlib.util.spec_from_file_location('cold',str(root/'scripts/rc6_failed_cold_fix_forward.py'))
          cold=importlib.util.module_from_spec(spec);spec.loader.exec_module(cold)
          shadow=root/'data/paper_v17/artifacts/observer_v17.db/dynamic-shadow'
          deploy=root/'data/deploy'
          candidate='83855c3b08647243dcd706ca7ead929378c4c11d'
          q=json.loads((deploy/('quiescence-'+candidate+'.json')).read_text())
          live=cold.enveloped(shadow/'status.json')
          pointer=cold.enveloped(shadow/'CURRENT.json')
          cut=cold.enveloped_gzip(shadow/pointer['file'])
          snapshot=cut.get('report',{}).get('computed_report',{}).get('snapshot_id')
          prior=deploy/('quiescence-'+cold.PRIOR_CANCELLED_SHA+'.json')
          state=json.loads((deploy/'CURRENT_STATE_V2.json').read_text())
          containers={}
          for name in ('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6'):
              containers[name]=subprocess.check_output(['docker','inspect','--format','{{.State.Status}}|{{.State.ExitCode}}|{{.State.OOMKilled}}|{{.Image}}',name],text=True,timeout=5).strip()
          out={'schema':'RC6_696_FAILED_PROMOTION_READONLY_V1',
               'current':{key:state.get(key) for key in ('deploy_sha','candidate_sha','validation_status','mode','real_orders_sent','image_id')},
               'candidate_quiescence':{key:q.get(key) for key in ('status','candidate_sha','paused_postclose','intraday_caucion','market_open_suspended','open_paper_carryover','spot_carryover','real_orders_sent')},
               'live':{key:live.get(key) for key in ('status','error_class','error_module','error_line','as_of','real_routes','real_orders_sent')},
               'pointer_generation':pointer.get('generation_id'), 'current_snapshot':snapshot,
               'old_cut_exists':(shadow/('cut-'+cold.CUT+'.json.gz')).exists(),
               'archive_exists':(deploy/('rc6-failed-cold-'+cold.IDENT)).is_dir(),
               'current_snapshot_is_original':snapshot==cold.IDENT,
               'distinct_failed_successor':cold.proven_distinct_failed_successor(deploy/('rc6-failed-cold-'+cold.IDENT),pointer.get('generation_id'),snapshot),
               'stop_cancellation':cold.proven_stop_cancellation(live,q),
               'prior_stop_cancellation':cold.proven_prior_stop_cancellation(live,q,prior),
               'containers':containers,
               'free_root_bytes':os.statvfs('/').f_bavail*os.statvfs('/').f_frsize}
          proof=(q.get('stop_evidence') or {}).get('porota_production_observer') or {}
          before=proof.get('before') or {};after=proof.get('after') or {}
          out['observer_stop']={'classification':proof.get('classification'),'before_status':before.get('Status'),'started_at':before.get('StartedAt'),'after_status':after.get('Status'),'finished_at':after.get('FinishedAt'),'exit_code':after.get('ExitCode'),'oom_killed':after.get('OOMKilled')}
          out['caucion_carryover_is_none']=q.get('caucion_carryover') is None
          out['stop_evidence_names']=sorted((q.get('stop_evidence') or {}).keys())
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/rc6_cold_readonly"
