name: RC5 - aplicar accesibilidad global dashboard

on:
  push:
    branches:
      - candidate/rc5-dashboard-global-a11y-20260905
    paths:
      - .github/workflows/rc5-apply-global-dashboard-a11y.yml
      - scripts/rc5_apply_global_dashboard_a11y.py
      - ei_dashboard_table_accessibility_rc5.py

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/rc5-dashboard-global-a11y-20260905
          fetch-depth: 0

      - name: Aplicar parche exacto
        run: python scripts/rc5_apply_global_dashboard_a11y.py

      - name: Validar sintaxis y contratos estáticos
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bg_paper_dashboard.py ei_dashboard_table_accessibility_rc5.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('t','tests/test_dashboard_global_a11y_rc5.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.test_global_table_contract_is_accessible_and_progressive()
          mod.test_dashboard_wires_global_contract_and_non_disruptive_refresh()
          mod.test_named_heavy_pages_keep_canonical_tables_for_global_enhancement()
          print('CONTRATOS_GLOBALES_A11Y=OK')
          PY
          git diff --check

      - name: Commit del wiring probado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Porota RC5 Automation'
          git config user.email '151845499+mbalbo2023@users.noreply.github.com'
          git add bg_paper_dashboard.py tests/test_dashboard_global_a11y_rc5.py
          git commit -m 'feat(rc5): aplicar tarjetas y Mostrar más a tablas globales'
          git push origin HEAD:candidate/rc5-dashboard-global-a11y-20260905
