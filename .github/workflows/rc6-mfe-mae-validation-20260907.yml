name: RC6 MFE MAE provenance validation 2026-09-07
on:
  push:
    branches: [feature/rc6-mfe-mae-provenance-20260907]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_mfe_mae_provenance_rc6.py
      - run: python -m py_compile fc_mfe_mae_provenance_rc6.py
      - run: python -c "import fc_mfe_mae_provenance_rc6 as m; m.assert_offline_only(); print('MFE_MAE_OFFLINE=GREEN')"
