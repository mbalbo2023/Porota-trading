name: RC6 CP3 DOM Evidence Forward Fix 2026-09-11
on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths:
      - rc6_contract_dom_collector.py
      - rc6_contract_dom_importer.py
      - .github/workflows/rc6-cp3-dom-evidence-forwardfix-20260911.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e
jobs:
  deploy_and_prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Static safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile rc6_contract_dom_collector.py rc6_contract_dom_importer.py
          python - <<'PY'
          import rc6_contract_dom_collector as c
          assert all(x.startswith('/Cotizaciones/') for x in c.ROUTE_FAMILY)
          assert '/Operar' not in repr(c.ROUTE_FAMILY)
          assert c.SAFE_METHODS == {'GET','HEAD','OPTIONS'}
          print('CP3_DOM_STATIC_SAFETY_GATE=GREEN')
          PY
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stage extension source
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -cf /tmp/rc6_cp3_dom_extension.tar rc6_contract_dom_collector.py rc6_contract_dom_importer.py
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/rc6_cp3_dom_extension.tar "$DO_USER@$DO_HOST:/tmp/rc6_cp3_dom_extension.tar"
      - name: Install isolated CE extension and collect fresh proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          LIB=/usr/local/lib/porota-contract-evidence-rc6
          BASE=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          WRAP=/usr/local/sbin/porota-contract-evidence-rc6-with-dom.sh
          DROP=/etc/systemd/system/porota-contract-evidence-rc6.service.d/20-rc6-dom-extension.conf
          CONTAINER=porota_production_observer
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo HOST_HEAD="$TARGET"
          echo '--- SAFETY PRECHECK ---'
          sudo -n docker exec -i "$CONTAINER" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(json.dumps({'mode':r[0] if r else None,'session':r[1] if r else None,'orders':r[2] if r else None}))
          assert r and r[0]=='PRODUCTION_PAPER' and int(r[2] or 0)==0
          PY
          sudo -n docker exec -i "$CONTAINER" python - <<'PY'
          import cp_contract_evidence_v2_hf6 as ce
          assert 'PPI_AUTHENTICATED_WEB' in ce.SOURCE_RANK
          print('CE_WEB_SOURCE_CLASS=SUPPORTED')
          PY
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP" /tmp/rc6_cp3_dom_extension.tar' EXIT
          tar -xf /tmp/rc6_cp3_dom_extension.tar -C "$TMP"
          sudo -n install -m 0644 "$TMP/rc6_contract_dom_collector.py" "$LIB/rc6_contract_dom_collector.py"
          sudo -n install -m 0644 "$TMP/rc6_contract_dom_importer.py" "$LIB/rc6_contract_dom_importer.py"
          cat > "$TMP/wrapper.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="${POROTA_ROOT:-/opt/porota-trading}"
          CONTAINER="${POROTA_OBSERVER_CONTAINER:-porota_production_observer}"
          DOCKER_BIN="${POROTA_DOCKER_BIN:-/usr/bin/docker}"
          LIB="${POROTA_RC6_CE_LIB:-/usr/local/lib/porota-contract-evidence-rc6}"
          PROFILE="${POROTA_CHROME_PROFILE:-/home/porotaadmin/porota-browser-lab/chrome-profile}"
          CE_PYTHON="${POROTA_CE_PYTHON:-/opt/porota-contract-evidence-venv/bin/python}"
          BASE=/usr/local/sbin/porota-contract-evidence-rc6-runtime.sh
          "$BASE"
          safety="$($DOCKER_BIN exec -i "$CONTAINER" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(json.dumps({'mode':r[0] if r else None,'orders':r[2] if r else None}))
          PY
          )"
          SAFETY="$safety" python3 - <<'PY'
          import os,json,sys
          d=json.loads(os.environ['SAFETY'])
          if d.get('mode')!='PRODUCTION_PAPER' or int(d.get('orders') or 0)!=0: sys.exit(1)
          PY
          BROWSER_USER="$(stat -c '%U' "$PROFILE")"
          STAGE="$(mktemp -d /tmp/porota-ce-dom.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          chown "$BROWSER_USER" "$STAGE"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          STAGE_CAPTURE="$STAGE/dom_${stamp}.json"
          OUTDIR="$ROOT/data/contract_evidence_rc6_dom"
          CAPTURE="$OUTDIR/dom_${stamp}.json"
          install -d -m 0755 "$OUTDIR"
          runuser -u "$BROWSER_USER" -- env PYTHONPATH="$LIB:$ROOT" "$CE_PYTHON" "$LIB/rc6_contract_dom_collector.py" \
            --profile "$PROFILE" --output "$STAGE_CAPTURE" \
            --routes '/Cotizaciones/Cauciones,/Cotizaciones/Licitaciones,/Cotizaciones/Futuros,/Cotizaciones/Bonos,/Cotizaciones/Opciones'
          install -o root -g root -m 0644 "$STAGE_CAPTURE" "$CAPTURE"
          REL="${CAPTURE#"$ROOT/data/"}"
          IMPORT_OUT="$($DOCKER_BIN exec -i "$CONTAINER" python - "/app/data/$REL" < "$LIB/rc6_contract_dom_importer.py" 2>&1)"
          echo "$IMPORT_OUT"
          IMPORT_OUT="$IMPORT_OUT" python3 - <<'PY'
          import os,json,sys
          line=os.environ['IMPORT_OUT'].strip().splitlines()[-1]
          d=json.loads(line)
          if d.get('state')!='GREEN' or int(d.get('records') or 0)<1: sys.exit(1)
          PY
          post="$($DOCKER_BIN exec -i "$CONTAINER" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          ce=c.execute("select count(*) n,max(observed_at) mx from contract_evidence_v2_current where source_class='PPI_AUTHENTICATED_WEB'").fetchone()
          fam=[x[0] for x in c.execute("select distinct family from contract_evidence_v2_current where source_class='PPI_AUTHENTICATED_WEB' order by family")]
          c.close(); print(json.dumps({'mode':r['mode'] if r else None,'session':r['session_state'] if r else None,'orders':r['real_orders_sent'] if r else None,'web_rows':ce['n'] if ce else 0,'web_max_observed':ce['mx'] if ce else None,'families':fam}))
          PY
          )"
          echo "DOM_POST=$post"
          POST="$post" python3 - <<'PY'
          import os,json,sys
          d=json.loads(os.environ['POST'])
          if d.get('mode')!='PRODUCTION_PAPER' or int(d.get('orders') or 0)!=0 or int(d.get('web_rows') or 0)<1: sys.exit(1)
          PY
          echo STATUS=GREEN_DOM_EXTENSION
          echo REAL_ORDERS_SENT=0
          EOF
          sudo -n install -m 0755 "$TMP/wrapper.sh" "$WRAP"
          sudo -n install -d -m 0755 "$(dirname "$DROP")"
          cat > "$TMP/dropin.conf" <<EOF
          [Service]
          ExecStart=
          ExecStart=$WRAP
          EOF
          sudo -n install -m 0644 "$TMP/dropin.conf" "$DROP"
          sudo -n systemctl daemon-reload
          echo '--- EFFECTIVE CE UNIT ---'
          sudo -n systemctl cat porota-contract-evidence-rc6.service --no-pager
          echo '--- INSTALLED HASHES ---'
          sudo -n sha256sum "$LIB/rc6_contract_dom_collector.py" "$LIB/rc6_contract_dom_importer.py" "$WRAP"
          if sudo -n systemctl is-active --quiet porota-contract-evidence-rc6.service; then
            echo CP3_DOM_START=YELLOW_SERVICE_ALREADY_ACTIVE
            for i in $(seq 1 120); do sudo -n systemctl is-active --quiet porota-contract-evidence-rc6.service || break; sleep 5; done
          fi
          sudo -n systemctl start porota-contract-evidence-rc6.service
          echo '--- CE CURRENT ATTEMPT ---'
          sudo -n journalctl -u porota-contract-evidence-rc6.service --since '-12 min' --no-pager | tail -n 220
          echo '--- FINAL FRESHNESS/SAFETY PROOF ---'
          sudo -n docker exec -i "$CONTAINER" python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          ce=c.execute("select count(*) n,max(observed_at) mx from contract_evidence_v2_current where source_class='PPI_AUTHENTICATED_WEB'").fetchone()
          fam=[x[0] for x in c.execute("select distinct family from contract_evidence_v2_current where source_class='PPI_AUTHENTICATED_WEB' order by family")]
          print(json.dumps({'mode':r['mode'] if r else None,'session':r['session_state'] if r else None,'orders':r['real_orders_sent'] if r else None,'web_rows':ce['n'] if ce else 0,'web_max_observed':ce['mx'] if ce else None,'families':fam}))
          assert r and r['mode']=='PRODUCTION_PAPER' and int(r['real_orders_sent'] or 0)==0
          assert ce and int(ce['n'] or 0)>=1 and ce['mx']
          c.close()
          print('CP3_DOM_MATERIALIZATION_GATE=GREEN')
          print('CP3_WEB_FRESHNESS_GATE=GREEN')
          print('REAL_ORDERS_SENT=0')
          PY
          HOST