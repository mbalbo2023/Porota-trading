name: RC6 Paper Open Fixtures Binding Forward Fix 2026-09-10

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: ['.github/workflows/rc6-paper-open-fixtures-binding-forwardfix-20260910.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert immutable RC6 safety and binding identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          grep -q '"PAPER_ECONOMIC_GATE_MODE": "BINDING"' porota_mode_manager.py
          grep -q '"PAPER_SECTOR_CONCENTRATION_POLICY": "BINDING"' porota_mode_manager.py
      - name: Align only open-requiring historical fixtures with RC6 composition
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_production_paper_v1634.py')
          s=p.read_text(encoding='utf-8')
          old = (
              "def test_no_duplica_decision_ni_posicion_en_mismo_ciclo(tmp_path):\n"
              "    store = PaperStore(str(tmp_path / \"observer.db\"))\n"
              "    broker = PaperBroker(store)\n"
          )
          new = (
              "def test_no_duplica_decision_ni_posicion_en_mismo_ciclo(tmp_path):\n"
              "    store = PaperStore(str(tmp_path / \"observer.db\"))\n"
              "    # Esta prueba necesita una apertura; usa la composición RC6 BINDING real.\n"
              "    broker = PaperBroker(store, session_policy=PaperSessionPolicy(), target_gain_pct=\"0.05\")\n"
              "    assert broker.economics_mode == \"BINDING\"\n"
              "    assert broker.intraday_fee_rebate is True\n"
          )
          if s.count(old) != 1:
              raise SystemExit('DUPLICATE_FIXTURE_ANCHOR_DRIFT')
          s=s.replace(old,new,1)
          old = (
              "    broker = PaperBroker(store, initial_cash=\"1000000\", risk_pct=\"0.50\",\n"
              "                         max_position_pct=\"0.25\", max_total_exposure_pct=\"0.60\")\n"
          )
          new = (
              "    broker = PaperBroker(store, initial_cash=\"1000000\", risk_pct=\"0.50\",\n"
              "                         max_position_pct=\"0.25\", max_total_exposure_pct=\"0.60\",\n"
              "                         session_policy=PaperSessionPolicy(), target_gain_pct=\"0.05\")\n"
              "    assert broker.economics_mode == \"BINDING\"\n"
              "    assert broker.intraday_fee_rebate is True\n"
          )
          if s.count(old) != 1:
              raise SystemExit('PATRIMONIAL_FIXTURE_ANCHOR_DRIFT')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m compileall -q tests/test_production_paper_v1634.py
          git diff --check
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Prove same-cause fixtures and canonical gates
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_production_paper_v1634.py::test_no_duplica_decision_ni_posicion_en_mismo_ciclo \
            tests/test_production_paper_v1634.py::test_patrimonio_paper_limita_posicion_y_exposicion \
            tests/test_production_paper_v1634.py::test_sin_ask_size_no_hay_fill \
            tests/test_hotfix_rc3_hf4.py::test_configuracion_desplegada_no_es_un_noop \
            tests/test_rc6_wave10_sector_binding_default.py
          echo PAPER_OPEN_FIXTURES_BINDING=GREEN
          echo NEGATIVE_NO_FILL_UNCHANGED=GREEN
          echo REAL_ORDER_ROUTES=NOT_CALLED
      - name: Persist test alignment only after proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_production_paper_v1634.py
          if git diff --cached --quiet; then
            echo NO_TEST_DELTA
          else
            git commit -m 'test(rc6): align open-requiring paper fixtures with binding composition'
            git push origin HEAD:fix/rc6-w10-sector-map-binding-20260910
          fi
      - name: Continue full suite to next deterministic failure
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -x -vv --tb=short > /tmp/pytest-next.txt 2>&1
          rc=$?
          echo "PYTEST_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            grep -nE 'FAILED|ERROR|E   |AssertionError|NameError|TypeError|AttributeError|KeyError|ValueError' /tmp/pytest-next.txt | tail -n 120 || true
            tail -n 180 /tmp/pytest-next.txt || true
            exit "$rc"
          fi
          tail -n 120 /tmp/pytest-next.txt
          echo INTEGRATED_TESTS=GREEN
      - name: Reassert immutable safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo RC6_PAPER_SAFETY_FINAL=GREEN
          echo REAL_ORDER_TEST=NOT_PERFORMED
