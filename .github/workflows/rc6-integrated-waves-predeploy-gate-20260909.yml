name: RC6 Integrated Waves Predeploy Gate 2026-09-09
on:
  push:
    branches: [integration/rc6-waves-9-18-20260909]
    paths: ['.github/workflows/rc6-integrated-waves-predeploy-gate-20260909.yml']
permissions:
  contents: read
jobs:
  integrated-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile integrated RC6 source
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q -x '(^|/)(\.git|data|sre_vector_db)(/|$)' .
          grep -q 'VERSION = "17.0.0-rc6"' _version.py
          grep -q 'MODE = "PRODUCTION_PAPER"' _version.py
          grep -q 'REAL_ORDER_CAPABILITY = "BLOCKED"' _version.py
          echo 'INTEGRATED_COMPILE=GREEN'
      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run integrated suite
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. pytest -q
          echo 'INTEGRATED_TESTS=GREEN'
  live-readonly-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/intgate"
          chmod 600 "$HOME/.ssh/intgate"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify current PAPER runtime remains safe
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/intgate" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          HEAD=$(git rev-parse HEAD)
          echo "RUNTIME_HEAD=$HEAD"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0];m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone();c.close()
          print(f'DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|RESTARTS={{.RestartCount}}|READONLY={{.HostConfig.ReadonlyRootfs}}|IMAGE={{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|RESTARTS={{.RestartCount}}|IMAGE={{.Config.Image}}' porota_production_dashboard
          test "$(git rev-parse HEAD)" = "$HEAD"
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'RUNTIME_CHANGED=NO'
          echo 'INTEGRATED_LIVE_PREFLIGHT=GREEN'
          REMOTE
# current-head rerun marker: 2026-09-10 take-profit-audit-closure