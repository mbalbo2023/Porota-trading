name: RC6 Storage Headroom Policy Gate 2026-09-09

on:
  push:
    branches:
      - integration/rc6-waves-9-18-20260909
    paths:
      - rc6_storage_policy.py
      - scripts/rc6_storage_headroom_gate.sh
      - tests/test_rc6_storage_policy.py
      - .github/workflows/rc6-storage-headroom-policy-gate-20260909.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-storage-headroom-policy-gate-20260909
  cancel-in-progress: false

jobs:
  static-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Compile and policy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile rc6_storage_policy.py
          bash -n scripts/rc6_storage_headroom_gate.sh
          python -m pytest -q tests/test_rc6_storage_policy.py
          grep -q 'operational = max(4 \* GIB, ceil(total_bytes \* 0.20))' rc6_storage_policy.py
          grep -q 'build = max(3 \* GIB, 2 \* image_bytes)' rc6_storage_policy.py
          ! grep -q '8589934592' scripts/rc6_storage_headroom_gate.sh
          echo 'RC6_STORAGE_POLICY_STATIC=GREEN'

  live-readonly:
    needs: static-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stage policy calculator only
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            rc6_storage_policy.py scripts/rc6_storage_headroom_gate.sh "$DO_USER@$DO_HOST:/tmp/"
      - name: Live read-only gate proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_SHA=$(git rev-parse HEAD)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          TMP=$(mktemp -d /tmp/porota-storage-gate.XXXXXX)
          trap 'rm -rf "$TMP" /tmp/rc6_storage_policy.py /tmp/rc6_storage_headroom_gate.sh' EXIT
          cp /tmp/rc6_storage_policy.py "$TMP/rc6_storage_policy.py"
          cp /tmp/rc6_storage_headroom_gate.sh "$TMP/rc6_storage_headroom_gate.sh"
          chmod 700 "$TMP/rc6_storage_headroom_gate.sh"
          cd "$TMP"
          REPO=/opt/porota-trading ./rc6_storage_headroom_gate.sh report
          REPO=/opt/porota-trading ./rc6_storage_headroom_gate.sh deploy-pre
          REPO=/opt/porota-trading ./rc6_storage_headroom_gate.sh deploy-post
          REPO=/opt/porota-trading PROJECTED_WRITE_BYTES=536870912 ./rc6_storage_headroom_gate.sh ingest-start
          cd /opt/porota-trading
          test "$(git rev-parse HEAD)" = "$PRE_SHA"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'HOST_MUTATION=NO_EXCEPT_TMP_FILES'
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'RC6_STORAGE_POLICY_LIVE_READONLY=GREEN'
          REMOTE
