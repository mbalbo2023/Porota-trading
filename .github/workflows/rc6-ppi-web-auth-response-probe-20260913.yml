name: RC6 PPI Web sanitized auth response probe 2026-09-13

on:
  push:
    branches: [ops/rc6-ppi-web-residual-ready-20260913]
    paths: ['.github/workflows/rc6-ppi-web-auth-response-probe-20260913.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Execute helper and print only safe classifications
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -euo pipefail
          BIN=/opt/porota-ingest/ppi-web-residual/bin
          VENV=/opt/porota-contract-evidence-venv
          PROFILE=/home/porotaadmin/porota-browser-lab/chrome-profile
          SECRET=/etc/porota/contract-evidence-web.env
          set +e
          OUT="$(sudo -n runuser -u porotaadmin -- env HOME=/home/porotaadmin PYTHONPATH="$BIN:/opt/porota-trading" \
            "$VENV/bin/python" "$BIN/rc6_ppi_web_reauth.py" --profile "$PROFILE" --secret "$SECRET" 2>&1)"
          RC=$?
          set -e
          OUT="$OUT" RC="$RC" python3 - <<'PY'
          import json,os
          obj={}
          for line in reversed(os.environ.get('OUT','').splitlines()):
              try:
                  x=json.loads(line)
                  if isinstance(x,dict): obj=x; break
              except Exception: pass
          safe=('status','attempts','stage','page_url','blocked_post_path','auth_http_status','auth_json_object','auth_has_token_shape','auth_twofa_shape','auth_change_password_shape','auth_safe_keys','credentials_exposed','orders_visited','real_orders_sent','error_type')
          print('RC='+os.environ.get('RC',''))
          for k in safe:
              if k in obj: print(f'{k.upper()}={obj[k]}')
          assert obj.get('credentials_exposed') is False
          assert int(obj.get('real_orders_sent',0)) == 0
          PY
          HOST
