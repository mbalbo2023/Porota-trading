name: RC6 Wave3 Browser V3 Runtime Deploy 2026-09-08

on:
  push:
    branches: [deploy/rc6-wave3-browser-v3-20260908]
    paths:
      - 'rc6_trusted_browser_contract_collector.py'
      - 'rc6_ppi_contract_normalizer.py'
      - '.github/workflows/rc6-wave3-browser-v3-deploy-20260908.yml'

permissions:
  contents: read

concurrency:
  group: rc6-wave3-browser-v3-runtime-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact Wave2 baseline and scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=071e1b7ce92fa400defa2b9c858678942246c4b2
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          got=set(Path('/tmp/changed.txt').read_text().splitlines())
          allowed={
            'rc6_trusted_browser_contract_collector.py',
            'rc6_ppi_contract_normalizer.py',
            '.github/workflows/rc6-wave3-browser-v3-deploy-20260908.yml',
          }
          assert got <= allowed, sorted(got-allowed)
          assert {'rc6_trusted_browser_contract_collector.py','rc6_ppi_contract_normalizer.py'} <= got
          print('WAVE3_DIFF_SCOPE=GREEN')
          PY
      - name: Compile and Browser V3 safety invariants
        run: |
          set -euo pipefail
          python -m py_compile rc6_trusted_browser_contract_collector.py rc6_ppi_contract_normalizer.py
          python - <<'PY'
          import pathlib
          c=pathlib.Path('rc6_trusted_browser_contract_collector.py').read_text(encoding='utf-8')
          n=pathlib.Path('rc6_ppi_contract_normalizer.py').read_text(encoding='utf-8')
          assert '/Operar' not in c and '/Orden' not in c
          assert 'Budget' not in c and 'Confirm' not in c and 'Cancel' not in c
          assert 'ppi_client' not in c
          assert 'DECIMAL_PLACES_ARE_NOT_STEP_OR_TICK' in n
          assert 'real_orders_sent":0' in c or "'real_orders_sent':0" in c
          print('BROWSER_V3_SAFETY=GREEN')
          print('ORDER_ROUTES=NOT_CALLED')
          print('REAL_ORDER_TEST=NOT_PERFORMED')
          PY
      - name: Build exact candidate image
        run: |
          set -euo pipefail
          docker build --pull=false --label "porota.commit=$GITHUB_SHA" --label 'porota.wave=rc6-wave3-browser-v3' -t porota-wave3:${GITHUB_SHA} .
          docker run --rm --network none --entrypoint python porota-wave3:${GITHUB_SHA} - <<'PY'
          import importlib.metadata as m
          import _version
          import rc6_ppi_contract_normalizer, rc6_trusted_browser_contract_collector
          assert _version.VERSION=='17.0.0-rc6'
          assert _version.REAL_ORDER_CAPABILITY=='BLOCKED'
          assert m.version('ppi-client')=='1.3.0'
          print('IMAGE_INVARIANTS=GREEN')
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_wave3"
          chmod 600 "$HOME/.ssh/porota_wave3"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Preflight and deploy without automatic rollback
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: deploy/rc6-wave3-browser-v3-20260908
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/porota_wave3" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          EXPECTED_BASE=071e1b7ce92fa400defa2b9c858678942246c4b2
          TARGET_IMAGE=porota-trading-bot:17.0.0-rc6
          cd "$REPO"
          echo '=== WAVE3 PRECHECK ==='
          echo "UTC=$(date -u +%FT%TZ)"
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "CURRENT_SHA=$CURRENT_SHA"
          test "$CURRENT_SHA" = "$EXPECTED_BASE"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'PRE_DB={q}|{mode}|{real}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          PY
          FREE=$(df -PB1 "$REPO" | awk 'NR==2{print $4}')
          echo "DISK_FREE_PRE=$FREE"
          test "$FREE" -ge 6442450944

          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$TARGET_SHA"

          TMP=$(mktemp -d "$HOME/porota-wave3.XXXXXX")
          trap 'git -C "$REPO" worktree remove --force "$TMP/source" >/dev/null 2>&1 || true; rm -rf "$TMP"' EXIT
          git worktree add --detach "$TMP/source" "$TARGET_SHA" >/dev/null
          sudo -n docker build --pull=false --label "porota.commit=$TARGET_SHA" --label 'porota.wave=rc6-wave3-browser-v3' -t "$TARGET_IMAGE" "$TMP/source"
          test "$(sudo -n docker image inspect "$TARGET_IMAGE" --format '{{index .Config.Labels "porota.commit"}}')" = "$TARGET_SHA"

          echo '=== ACTIVATE — NO AUTOMATIC ROLLBACK ==='
          git checkout -f -B "$TARGET_BRANCH" "$TARGET_SHA"
          git branch --set-upstream-to="origin/$TARGET_BRANCH" "$TARGET_BRANCH" >/dev/null 2>&1 || true
          sudo -n python3 "$REPO/porota_mode_manager.py" simulation

          echo '=== POSTFLIGHT ==='
          sleep 10
          sudo -n docker inspect -f 'POST_OBSERVER={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer
          sudo -n docker inspect -f 'POST_DASHBOARD={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import importlib.metadata as m, sqlite3
          import rc6_ppi_contract_normalizer, rc6_trusted_browser_contract_collector
          assert m.version('ppi-client')=='1.3.0'
          p='/app/data/paper_v17/observer_v17.db'
          c=sqlite3.connect('file:'+p+'?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          mode,real=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone()
          c.close()
          print(f'POST_DB={q}|{mode}|{real}')
          assert q=='ok' and mode=='PRODUCTION_PAPER' and int(real)==0
          print('WAVE3_MODULES=GREEN')
          PY
          echo 'REAL_ORDER_TEST=NOT_PERFORMED'
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'ROLLBACK_AUTOMATICO=NO'
          echo 'WAVE3_BROWSER_V3_DEPLOY=GREEN'
          REMOTE
      - name: Failure diagnostics only — never rollback
        if: failure()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set +e
          ssh -i "$HOME/.ssh/porota_wave3" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          echo '=== WAVE3 FAILURE DIAGNOSTICS READ ONLY ==='
          date -u
          cd /opt/porota-trading 2>/dev/null || exit 0
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null)"
          sudo -n docker inspect -f 'OBSERVER={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_observer 2>/dev/null || true
          sudo -n docker inspect -f 'DASHBOARD={{.State.Running}}|{{.RestartCount}}|{{.Config.Image}}' porota_production_dashboard 2>/dev/null || true
          echo 'ROLLBACK_PERFORMED=NO'
          echo 'NEXT_ACTION=RCA_FIX_REVALIDATE_REDEPLOY_OR_REQUEST_USER_ROLLBACK_AUTHORIZATION'
          REMOTE
          exit 1
