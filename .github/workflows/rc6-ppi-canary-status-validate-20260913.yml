name: RC6 PPI canary + status validate 2026-09-13

on:
  push:
    branches: [ops/rc6-ppi-web-residual-scraper-20260912]
    paths:
      - 'ops/ppi_web_canary_selector_rc6.py'
      - 'ops/ppi_progress_status_rc6.py'
      - 'tests/test_ppi_canary_status_rc6.py'
      - '.github/workflows/rc6-ppi-canary-status-validate-20260913.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile
        run: python -m py_compile ops/ppi_web_canary_selector_rc6.py ops/ppi_progress_status_rc6.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Focused tests
        run: python -m pytest -q tests/test_ppi_canary_status_rc6.py
      - name: Static safety
        run: |
          set -euo pipefail
          ! grep -Eq 'playwright|requests|urllib|send_order|place_order|docker|systemctl' ops/ppi_web_canary_selector_rc6.py
          ! grep -Eq 'playwright|requests|urllib|send_order|place_order' ops/ppi_progress_status_rc6.py
          grep -q 'mode=ro' ops/ppi_progress_status_rc6.py
