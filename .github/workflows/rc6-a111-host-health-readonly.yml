name: RC6 A111 host health read only

on:
  push:
    branches: [audit/rc6-a111-host-health-20261026]
    paths:
      - .github/workflows/rc6-a111-host-health-readonly.yml

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Read bounded PAPER health without provider requests
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER"
          timeout --signal=TERM --kill-after=5s 70s \
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'PYHOST'
          import json
          import os
          import re
          import sqlite3
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          def code(value):
              value = str(value or '')
              return value if re.fullmatch(r'[A-Z][A-Z0-9_]{0,39}', value) else 'NO_VERIFICADO'
          def sha(value):
              value = str(value or '')
              return value if re.fullmatch(r'[0-9a-f]{40}', value) else 'NO_VERIFICADO'
          def stamp(value):
              value = str(value or '')
              try:
                  parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  return parsed.isoformat() if parsed.tzinfo else 'NO_VERIFICADO'
              except ValueError:
                  return 'NO_VERIFICADO'
          def command(args, seconds=5):
              try:
                  done = subprocess.run(args, text=True, capture_output=True,
                                        check=False, timeout=seconds)
                  return done.stdout if done.returncode == 0 else None
              except (OSError, subprocess.SubprocessError):
                  return None
          def docker(name):
              raw = command(['docker', 'inspect', '--format', '{{json .}}', name])
              try:
                  item = json.loads(raw or '')
                  state = item['State']
                  health = state.get('Health') or {}
                  image = str(item.get('Image') or '')
                  return {'state': code(str(state.get('Status', '')).upper()),
                          'running': state.get('Running') is True,
                          'restart_count': state.get('RestartCount', item.get('RestartCount')),
                          'oom_killed': state.get('OOMKilled') is True,
                          'health': code(str(health.get('Status', '')).upper()),
                          'image_id': image if re.fullmatch(r'sha256:[0-9a-f]{64}', image) else 'NO_VERIFICADO'}
              except (ValueError, TypeError, KeyError):
                  return {'state': 'NO_VERIFICADO'}

          containers = {name: docker(name) for name in (
              'porota_production_observer', 'porota_production_dashboard',
              'porota_critical_approval_rc6')}
          db_result = {'state': 'NO_VERIFICADO'}
          db_path = Path('/opt/porota-trading/data/paper_v17/observer_v17.db')
          try:
              if db_path.is_symlink() or not db_path.is_file():
                  raise ValueError('DB_PATH_INVALID')
              db = sqlite3.connect(db_path.as_uri() + '?mode=ro', uri=True, timeout=.3)
              try:
                  db.execute('PRAGMA query_only=ON')
                  db.execute('PRAGMA busy_timeout=300')
                  deadline = time.monotonic() + 4
                  db.set_progress_handler(lambda: int(time.monotonic() > deadline), 1000)
                  row = db.execute('''SELECT mode, process_state, session_state, ppi_auth,
                                            real_orders_sent, heartbeat_at
                                     FROM observer_state WHERE id=1 LIMIT 1''').fetchone()
                  auth = db.execute('''SELECT state, checked_at, last_success_at
                                      FROM api_health WHERE component=? LIMIT 1''',
                                    ('PPI_PRODUCTION_AUTH',)).fetchone()
                  if row is None:
                      raise ValueError('OBSERVER_STATE_MISSING')
                  heartbeat = stamp(row[5])
                  age = None
                  if heartbeat != 'NO_VERIFICADO':
                      age = round((now - datetime.fromisoformat(heartbeat).astimezone(timezone.utc)).total_seconds(), 1)
                  sqlite_meta = {key: db.execute('PRAGMA ' + key).fetchone()[0]
                                 for key in ('temp_store', 'page_size', 'page_count',
                                             'freelist_count', 'max_page_count')}
                  db_result = {'state': 'OK', 'mode': code(row[0]),
                               'process_state': code(row[1]),
                               'session_state': code(row[2]),
                               'ppi_auth': code(row[3]),
                               'real_orders_sent': row[4] if type(row[4]) is int else 'NO_VERIFICADO',
                               'heartbeat_at': heartbeat, 'heartbeat_age_seconds': age,
                               'sqlite_metadata': sqlite_meta,
                               'ppi_production_auth': {
                                   'state': code(auth[0]), 'checked_at': stamp(auth[1]),
                                   'last_success_at': stamp(auth[2])} if auth else {'state': 'NO_VERIFICADO'}}
              finally:
                  db.close()
          except (OSError, ValueError, sqlite3.Error) as exc:
              db_result = {'state': 'NO_VERIFICADO', 'error_type': type(exc).__name__}

          release = {'state': 'NO_VERIFICADO'}
          release_path = Path('/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json')
          try:
              if release_path.is_symlink() or release_path.stat().st_size > 65536:
                  raise ValueError('RELEASE_PATH_INVALID')
              item = json.loads(release_path.read_text(encoding='utf-8'))
              release = {'state': 'OK', 'candidate_sha': sha(item.get('candidate_sha')),
                         'deploy_sha': sha(item.get('deploy_sha')),
                         'validation_status': code(item.get('validation_status'))}
          except (OSError, ValueError, TypeError):
              pass

          child_health = {'state': 'NO_VERIFICADO'}
          child_path = db_path.parent / 'artifacts' / db_path.name / 'runtime-health.json'
          try:
              if child_path.is_symlink() or child_path.stat().st_size > 65536:
                  raise ValueError('CHILD_HEALTH_PATH_INVALID')
              item = json.loads(child_path.read_text(encoding='utf-8'))
              scanner = (item.get('children') or {}).get('scanner') or {}
              def count(value):
                  return value if type(value) is int and 0 <= value <= 1000000 else 'NO_VERIFICADO'
              child_health = {
                  'state': 'OK', 'recorded_at': stamp(item.get('recorded_at')),
                  'source_sha': sha(item.get('source_sha')),
                  'scanner': {'state': code(scanner.get('state')),
                              'restarts': count(scanner.get('restarts')),
                              'spawn_failures': count(scanner.get('spawn_failures')),
                              'started_at': stamp(scanner.get('started_at')),
                              'last_exit_at': stamp(scanner.get('last_exit_at')),
                              'last_error': code(scanner.get('last_error'))}}
          except (OSError, ValueError, TypeError):
              pass

          exception_events = {'state': 'NO_VERIFICADO'}
          try:
              logs = subprocess.run(['docker', 'logs', '--since=5m', '--tail=400', '--timestamps',
                                     'porota_production_observer'],
                                    text=True, capture_output=True, check=False, timeout=8)
              if logs.returncode == 0:
                  lines = (logs.stdout + logs.stderr)[-200000:].splitlines()
                  classes = {}
                  for line in lines:
                      match = re.search(r'\b((?:[A-Za-z_][A-Za-z0-9_]*\.){0,2}'
                                        r'[A-Za-z_][A-Za-z0-9_]*(?:Error|Exception))\s*:', line)
                      if match:
                          name = match.group(1)
                          classes[name] = classes.get(name, 0) + 1
                  exception_events = {'state': 'SANITIZED', 'lines_examined': len(lines),
                                      'exception_counts': dict(sorted(classes.items())[:12]),
                                      'child_exited_mentions': sum('CHILD_EXITED' in line
                                                                   for line in lines)}
                  starts = [n for n, line in enumerate(lines)
                            if 'Traceback (most recent call last):' in line]
                  if starts:
                      recent = lines[starts[-1]:]
                      allowed = {'bf_production_paper_observer.py',
                                 'bi_operational_services.py', 'bv_paper_runtime.py'}
                      frames = []
                      for line in recent[:50]:
                          match = re.search(r'File "[^"]*/([^/"]+)", line ([0-9]{1,6}), in ', line)
                          if match and match.group(1) in allowed:
                              frames.append(match.group(1) + ':' + match.group(2))
                      failure = next((line for line in reversed(recent[:80])
                                      if 'sqlite3.OperationalError:' in line), '')
                      message = failure.split('sqlite3.OperationalError:', 1)[-1].lower()
                      error_class = ('FULL' if 'database or disk is full' in message else
                                     'LOCKED' if 'database is locked' in message else
                                     'BUSY' if 'database is busy' in message else
                                     'READONLY' if 'readonly database' in message else
                                     'IO' if 'disk i/o error' in message else 'OTHER')
                      named = re.search(r'\bSQLITE_[A-Z0-9_]{2,40}\b', failure)
                      numbered = re.search(r'\bsqlite_errorcode[=: ]+([0-9]{1,5})\b', failure)
                      at = re.match(r'^([0-9TZ:.+-]{19,35})\s', failure)
                      exception_events['last_sqlite'] = {
                          'message_class': error_class if failure else 'NO_VERIFICADO',
                          'sqlite_error_name': named.group(0) if named else 'NO_VERIFICADO',
                          'sqlite_error_code': int(numbered.group(1)) if numbered else 'NO_VERIFICADO',
                          'at_utc': stamp(at.group(1)) if at else 'NO_VERIFICADO',
                          'frames_module_line': frames[-12:]}
          except (OSError, subprocess.SubprocessError):
              pass

          def statvfs(path):
              try:
                  fs = os.statvfs(path)
                  return {'state': 'OK', 'free_bytes': fs.f_bavail * fs.f_frsize,
                          'total_bytes': fs.f_blocks * fs.f_frsize,
                          'free_inodes': fs.f_favail, 'total_inodes': fs.f_files}
              except OSError:
                  return {'state': 'NO_VERIFICADO'}
          storage = {'host_db_parent': statvfs(db_path.parent),
                     'host_tmp': statvfs('/tmp')}
          inside = command(['docker', 'exec', '-e', 'PYTHONDONTWRITEBYTECODE=1',
              'porota_production_observer', 'python', '-c',
              'import json,os; '
              'p=("/tmp","/app/data/paper_v17"); '
              'r={q:{"free_bytes":os.statvfs(q).f_bavail*os.statvfs(q).f_frsize,'
              '"free_inodes":os.statvfs(q).f_favail} for q in p}; '
              'r["tmpdir"]=(os.environ.get("TMPDIR") if os.environ.get("TMPDIR") in '
              '("/tmp","/proof/tmp","/app/tmp") else "OTHER"); '
              'print(json.dumps(r))'], 5)
          try:
              storage['container'] = json.loads(inside or '')
          except (ValueError, TypeError):
              storage['container'] = {'state': 'NO_VERIFICADO'}
          raw = command(['docker', 'inspect', '--format', '{{json .}}',
                         'porota_production_observer'])
          try:
              inspected = json.loads(raw or '')
              mounts = inspected.get('Mounts') or []
              data_mount = next((m for m in mounts if m.get('Destination') == '/app/data'), {})
              storage['mount'] = {
                  'app_data_type': code(str(data_mount.get('Type', '')).upper()),
                  'app_data_source_expected': data_mount.get('Source') == '/opt/porota-trading/data',
                  'tmpfs_configured': '/tmp' in (inspected.get('HostConfig', {}).get('Tmpfs') or {})}
          except (ValueError, TypeError):
              storage['mount'] = {'state': 'NO_VERIFICADO'}

          critical_health = {'state': 'NO_VERIFICADO'}
          raw = command(['docker', 'exec', '-e', 'PYTHONDONTWRITEBYTECODE=1',
              'porota_critical_approval_rc6', 'python', '-c',
              'import json; from fm_critical_approval_unix_runtime_rc6 import UnixGithubIssuesClient; '
              'h=UnixGithubIssuesClient().health(); '
              'print(json.dumps({"status":h.get("status"),"capability":h.get("capability")}))'], 5)
          if raw is not None:
              try:
                  health = json.loads(raw)
                  critical_health = {'state': 'OK' if health.get('status') == 'ok' and
                                     health.get('capability') == 'issues_only' else 'RED',
                                     'status': code(str(health.get('status', '')).upper()),
                                     'capability': code(str(health.get('capability', '')).upper())}
              except (ValueError, TypeError):
                  pass
          result = {'schema': 'rc6-a111-host-health-readonly-v1',
                    'at_utc': now.isoformat(),
                    'at_ar': now.astimezone(ZoneInfo('America/Argentina/Buenos_Aires')).isoformat(),
                    'observer': db_result, 'release': release, 'containers': containers,
                    'critical_broker': critical_health,
                    'runtime_child_health': child_health,
                    'scanner_exception_events': exception_events,
                    'storage': storage,
                    'critical_units': {
                        name: code(str((command(['systemctl', 'is-active', name]) or '')).strip().upper())
                        for name in ('porota-critical-github-proxy-rc6.service',
                                     'porota-critical-approval-rc6.service')},
                    'read_only': True, 'provider_requests': 0,
                    'ppi_watch_accessed': False, 'mutation_attempted': False}
          print('RC6_A111_HOST_HEALTH=' + json.dumps(result, sort_keys=True))
          PYHOST

      - name: Remove SSH material
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
