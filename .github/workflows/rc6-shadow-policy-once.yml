name: RC6 SHADOW learning policy

on:
  push:
    branches:
      - candidate/v17.0.0-rc6-weekend-20260905
    paths:
      - 'es_shadow_binding_contract_rc6.py'
      - 'tests/test_shadow_binding_contract_rc6.py'
      - 'scripts/rc6_apply_shadow_policy_and_checkpoint.py'
      - '.github/workflows/rc6-shadow-policy-once.yml'

permissions:
  contents: write

concurrency:
  group: rc6-shadow-policy
  cancel-in-progress: false

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v17.0.0-rc6-weekend-20260905
          fetch-depth: 0

      - name: Verify exact RC5 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 852b812d610860b57b579212978443f7450e8855 HEAD

      - name: Apply SHADOW-first policy deterministically
        run: python scripts/rc6_apply_shadow_policy_and_checkpoint.py

      - name: Compile affected modules
        run: |
          python -m py_compile \
            es_shadow_binding_contract_rc6.py \
            porota_mode_manager.py \
            bg_paper_dashboard.py \
            ep_dashboard_truth_layer_rc6.py

      - name: Prove learning versus hard-safety contract
        run: pytest -q tests/test_shadow_binding_contract_rc6.py tests/test_dashboard_truth_layer_rc6.py

      - name: Static fail-closed assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"PAPER_ECONOMIC_GATE_MODE": "SHADOW"' porota_mode_manager.py
          ! grep -q '"PAPER_ECONOMIC_GATE_MODE": "BINDING"' porota_mode_manager.py
          grep -q 'PAPER_ECONOMIC_GATE_MODE = os.getenv("PAPER_ECONOMIC_GATE_MODE", "SHADOW")' bg_paper_dashboard.py
          grep -q 'P0-APRENDIZAJE — SHADOW' POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md
          grep -q 'REAL_ORDER_CAPABILITY_BLOCKED' es_shadow_binding_contract_rc6.py
          grep -q 'automatic_promotion=False' es_shadow_binding_contract_rc6.py

      - name: Commit patched sources/checkpoint only if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- porota_mode_manager.py bg_paper_dashboard.py ep_dashboard_truth_layer_rc6.py POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md; then
            echo 'RC6_SHADOW_POLICY_COMMIT=NOT_NEEDED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add porota_mode_manager.py bg_paper_dashboard.py ep_dashboard_truth_layer_rc6.py POROTA_TRADING_CHECKPOINT_CANONICO_RC6_2026-09-05.md
          git commit -m 'RC6: restore SHADOW-first PAPER learning [skip ci]'
          git push origin HEAD:candidate/v17.0.0-rc6-weekend-20260905
