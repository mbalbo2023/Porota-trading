name: RC6 Storage Capacity Recalibration 2026-09-09
on:
  push:
    branches: [integration/rc6-waves-9-18-20260909]
    paths: ['.github/workflows/rc6-storage-capacity-recalibration-20260909.yml']
permissions:
  contents: read
jobs:
  capacity-readonly:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/storagecap"
          chmod 600 "$HOME/.ssh/storagecap"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Measure live host capacity without mutation
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i "$HOME/.ssh/storagecap" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          PRE_SHA=$(git rev-parse HEAD)
          echo "RUNTIME_HEAD=$PRE_SHA"

          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'PRE_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY

          echo '=== FILESYSTEM_BYTES ==='
          df -PB1 / /opt/porota-trading | awk 'NR==1 || !seen[$1]++'
          echo '=== FILESYSTEM_INODES ==='
          df -Pi / /opt/porota-trading | awk 'NR==1 || !seen[$1]++'

          echo '=== TOP_LEVEL_BYTES ==='
          for p in /opt/porota-trading /opt/porota-staging /var/lib/docker /var/log /home/porotaadmin; do
            if [ -e "$p" ]; then
              KB=$(sudo -n du -skx "$p" 2>/dev/null | awk '{print $1}' || true)
              [ -n "$KB" ] && echo "$p|$((KB*1024))"
            fi
          done

          echo '=== POROTA_DATA_SUBTREES_BYTES ==='
          if [ -d /opt/porota-trading/data ]; then
            sudo -n du -skx /opt/porota-trading/data/* 2>/dev/null | sort -nr | head -40 | awk '{print $2"|"$1*1024}' || true
          fi

          echo '=== SQLITE_FILES_BYTES ==='
          sudo -n find /opt/porota-trading /opt/porota-staging -xdev -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.sqlite' -o -name '*.sqlite3' \) -printf '%s|%p\n' 2>/dev/null | sort -nr | head -80 || true

          echo '=== DOCKER_SYSTEM_DF ==='
          sudo -n docker system df || true
          echo '=== DOCKER_IMAGES_TOP ==='
          sudo -n docker images --format '{{.Repository}}:{{.Tag}}|{{.Size}}|{{.ID}}' | head -40 || true

          python3 - <<'PY'
          import os
          st=os.statvfs('/opt/porota-trading')
          total=st.f_frsize*st.f_blocks
          free=st.f_frsize*st.f_bavail
          used=total-free
          pct=(used/total*100.0) if total else 100.0
          print(f'CAPACITY_TOTAL_BYTES={total}')
          print(f'CAPACITY_FREE_BYTES={free}')
          print(f'CAPACITY_USED_PCT={pct:.2f}')
          print(f'LEGACY_8G_FLOOR_CURRENTLY_MET={"YES" if free >= 8*1024**3 else "NO"}')
          # These are observations only. Policy is recalculated after this run.
          assert total>0 and free>0
          PY

          test "$(git rev-parse HEAD)" = "$PRE_SHA"
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]
          m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'POST_DB={q}|MODE={m}|REAL_ORDERS={r}')
          assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          echo 'ORDER_ROUTE_CALLED=NO'
          echo 'HOST_MUTATION=NO'
          echo 'RC6_STORAGE_CAPACITY_PROBE=GREEN'
          REMOTE