name: RC6 Docker image reference audit 2026-09-20

on:
  push:
    branches:
      - audit/rc6-docker-image-refs-20260920
    paths:
      - .github/workflows/rc6-docker-image-refs-readonly-20260920.yml

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota-audit"
          chmod 600 "$HOME/.ssh/porota-audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect live container and image references (read-only)
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota-audit" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HOST_CHECKOUT_HEAD=$(git rev-parse HEAD)"
          echo '=== CONTAINERS: immutable image ID, configured ref, role labels, state, mounts ==='
          ids="$(sudo -n docker ps -aq --no-trunc)"
          if [ -n "$ids" ]; then
            sudo -n docker inspect --format 'CONTAINER={{.Name}}|ID={{.Id}}|IMAGE_ID={{.Image}}|CONFIG_REF={{.Config.Image}}|STATE={{.State.Status}}|EXIT={{.State.ExitCode}}|CREATED={{.Created}}|COMPOSE_PROJECT={{index .Config.Labels "com.docker.compose.project"}}|COMPOSE_SERVICE={{index .Config.Labels "com.docker.compose.service"}}|POROTA_COMMIT={{index .Config.Labels "porota.commit"}}|POROTA_VERSION={{index .Config.Labels "porota.version"}}|MOUNTS={{range .Mounts}}{{.Source}}>{{.Destination}}({{.Type}},rw={{.RW}});{{end}}' $ids
          else
            echo 'CONTAINERS=NONE'
          fi
          echo '=== IMAGE REFERENCES AND PROVENANCE ==='
          sudo -n docker image ls --no-trunc --digests --format 'IMAGE_REF={{.Repository}}:{{.Tag}}|DIGEST={{.Digest}}|ID={{.ID}}|CREATED={{.CreatedAt}}|SIZE={{.Size}}'
          echo '=== IMAGE IDS, POROTA LABELS AND ROOTFS LAYER COUNT ==='
          image_ids="$(sudo -n docker image ls -aq --no-trunc | sort -u)"
          if [ -n "$image_ids" ]; then
            sudo -n docker image inspect --format 'IMAGE={{.Id}}|TAGS={{json .RepoTags}}|CREATED={{.Created}}|BYTES={{.Size}}|ROOTFS_LAYERS={{len .RootFS.Layers}}' $image_ids
          fi
          echo '=== APPROVAL SERVICE UNIT (properties only; no secret values) ==='
          sudo -n systemctl show porota-critical-approval-rc6.service --property=Id,LoadState,ActiveState,SubState,FragmentPath,ExecStartPre,ExecStart,EnvironmentFiles
          echo '=== RUNNING APPROVAL CONTAINER EXECUTION CONFIG ==='
          sudo -n docker inspect --format 'GATEWAY_RUNTIME=IMAGE_ID={{.Image}}|CONFIG_REF={{.Config.Image}}|ENTRYPOINT={{json .Config.Entrypoint}}|CMD={{json .Config.Cmd}}|USER={{.Config.User}}|WORKDIR={{.Config.WorkingDir}}|RESTART={{.HostConfig.RestartPolicy.Name}}|HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' porota_critical_approval_rc6
          echo '=== APPROVAL SOURCE MOUNT REVISION ==='
          printf 'CONTROL_PLANE_CURRENT=%s\\n' "$(readlink -f /opt/porota-control-plane-rc6/current)"
          sha256sum /opt/porota-control-plane-rc6/current/fg_critical_approval_gateway_rc6.py /opt/porota-control-plane-rc6/current/fm_critical_approval_unix_runtime_rc6.py /opt/porota-control-plane-rc6/current/fn_critical_github_proxy_rc6.py
          echo '=== COMPOSE IMAGE OVERRIDE IN HOST ENV (redacted category only) ==='
          sudo -n python3 - <<'PY'
          from pathlib import Path
          matches=[]
          for line in Path('/opt/porota-trading/.env').read_text(encoding='utf-8').splitlines():
              if line.strip() and not line.lstrip().startswith('#') and line.split('=',1)[0].strip()=='POROTA_IMAGE':
                  matches.append(line.split('=',1)[1].strip().strip('"').strip("'"))
          if not matches:
              print('POROTA_IMAGE_OVERRIDE=UNSET')
          elif any(v=='porota-trading-bot:17.0.0-rc4-test-ready1' for v in matches):
              print(f'POROTA_IMAGE_OVERRIDE=LEGACY_RC4|DUPLICATE_KEYS={len(matches)}')
          elif all(v=='porota-trading-bot:17.0.0-rc6' for v in matches):
              print(f'POROTA_IMAGE_OVERRIDE=RC6_STABLE|DUPLICATE_KEYS={len(matches)}')
          elif all(not v for v in matches):
              print(f'POROTA_IMAGE_OVERRIDE=EMPTY|DUPLICATE_KEYS={len(matches)}')
          else:
              print(f'POROTA_IMAGE_OVERRIDE=OTHER_DEFINED|DUPLICATE_KEYS={len(matches)}')
          PY
          echo '=== COMPOSE IMAGE REFERENCES (resolved names only) ==='
          cd /opt/porota-trading
          sudo -n docker compose -f docker-compose.yml config --images
          echo '=== ROOTFS LAYER IDS BY IMAGE ==='
          image_ids="$(sudo -n docker image ls -aq --no-trunc | sort -u)"
          if [ -n "$image_ids" ]; then
            sudo -n docker image inspect --format 'ROOTFS={{.Id}}|TAGS={{json .RepoTags}}|LAYERS={{range .RootFS.Layers}}{{.}};{{end}}' $image_ids
          fi
          echo '=== STORAGE SUMMARY ==='
          sudo -n docker system df
          echo 'MUTATIONS=NONE'
          echo 'CONTAINER_RESTART=NOT_RUN'
          echo 'IMAGE_TAG_CHANGE=NOT_RUN'
          echo 'IMAGE_DELETE=NOT_RUN'
          echo 'PRUNE=NOT_RUN'
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE
