name: RC6 Docker image reference audit 2026-09-20

on:
  push:
    branches:
      - audit/rc6-docker-image-refs-20260920
    paths:
      - .github/workflows/rc6-docker-image-refs-readonly-20260920.yml

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota-audit"
          chmod 600 "$HOME/.ssh/porota-audit"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect live container and image references (read-only)
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/porota-audit" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          echo "UTC=$(date -u +%FT%TZ)"
          echo "HOST_CHECKOUT_HEAD=$(git rev-parse HEAD)"
          echo '=== CONTAINERS: immutable image ID, configured ref, role labels, state, mounts ==='
          ids="$(sudo -n docker ps -aq --no-trunc)"
          if [ -n "$ids" ]; then
            sudo -n docker inspect --format 'CONTAINER={{.Name}}|ID={{.Id}}|IMAGE_ID={{.Image}}|CONFIG_REF={{.Config.Image}}|STATE={{.State.Status}}|EXIT={{.State.ExitCode}}|CREATED={{.Created}}|COMPOSE_PROJECT={{index .Config.Labels "com.docker.compose.project"}}|COMPOSE_SERVICE={{index .Config.Labels "com.docker.compose.service"}}|POROTA_COMMIT={{index .Config.Labels "porota.commit"}}|POROTA_VERSION={{index .Config.Labels "porota.version"}}|MOUNTS={{range .Mounts}}{{.Source}}>{{.Destination}}({{.Type}},rw={{.RW}});{{end}}' $ids
          else
            echo 'CONTAINERS=NONE'
          fi
          echo '=== IMAGE REFERENCES AND PROVENANCE ==='
          sudo -n docker image ls --no-trunc --digests --format 'IMAGE_REF={{.Repository}}:{{.Tag}}|DIGEST={{.Digest}}|ID={{.ID}}|CREATED={{.CreatedAt}}|SIZE={{.Size}}'
          echo '=== IMAGE IDS, POROTA LABELS AND ROOTFS LAYER COUNT ==='
          image_ids="$(sudo -n docker image ls -aq --no-trunc | sort -u)"
          if [ -n "$image_ids" ]; then
            sudo -n docker image inspect --format 'IMAGE={{.Id}}|TAGS={{json .RepoTags}}|CREATED={{.Created}}|BYTES={{.Size}}|POROTA_COMMIT={{index .Config.Labels "porota.commit"}}|POROTA_VERSION={{index .Config.Labels "porota.version"}}|ROOTFS_LAYERS={{len .RootFS.Layers}}' $image_ids
          fi
          echo '=== STORAGE SUMMARY ==='
          sudo -n docker system df
          echo 'MUTATIONS=NONE'
          echo 'CONTAINER_RESTART=NOT_RUN'
          echo 'IMAGE_TAG_CHANGE=NOT_RUN'
          echo 'IMAGE_DELETE=NOT_RUN'
          echo 'PRUNE=NOT_RUN'
          echo 'ORDER_ROUTES=NOT_CALLED'
          REMOTE
