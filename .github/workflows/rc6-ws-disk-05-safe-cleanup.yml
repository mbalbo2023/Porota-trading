name: RC6 WS-DISK-05 safe cleanup phase 1

on:
  push:
    branches:
      - cleanup/ws-disk-05-safe-cleanup-20261001
    paths:
      - '.github/workflows/rc6-ws-disk-05-safe-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Prepare strict SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/porota_rc6_cleanup"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porota_rc6_cleanup" "$HOME/.ssh/known_hosts"

      - name: Safe cleanup on Droplet
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/rc6-disk-cleanup-phase1.txt"
          ssh -i "$HOME/.ssh/porota_rc6_cleanup" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE' | tee "$OUT"
          set -Eeuo pipefail
          REPO=/opt/porota-trading
          DB="$REPO/data/paper_v17/observer_v17.db"

          echo "POROTA_SAFE_CLEANUP=START"
          echo "WORKSTREAM_ID=WS-DISK-05-SAFE-CLEANUP"
          echo "DEPLOY_OWNER=ACQUIRED"
          date -u '+RECORDED_AT=%Y-%m-%dT%H:%M:%SZ'

          disk_before="$(df -PB1 / | awk 'NR==2 {print $4}')"
          journal_before="$(sudo -n journalctl --disk-usage 2>&1 | tr '\n' ' ')"
          apt_lists_before="$(sudo -n du -x -s -B1 /var/lib/apt/lists 2>/dev/null | awk '{print $1+0}')"
          apt_cache_before="$(sudo -n du -x -s -B1 /var/cache/apt 2>/dev/null | awk '{print $1+0}')"
          tmp_before="$(sudo -n du -x -s -B1 /tmp 2>/dev/null | awk '{print $1+0}')"

          echo "DISK_BEFORE=$disk_before"
          echo "JOURNAL_BEFORE=$journal_before"
          echo "APT_LISTS_BEFORE=$apt_lists_before"
          echo "APT_CACHE_BEFORE=$apt_cache_before"
          echo "TMP_BEFORE=$tmp_before"

          pre_state="$(sudo -n timeout 15 python3 - "$DB" <<'PY'
          import sqlite3,sys
          p=sys.argv[1]
          c=sqlite3.connect(f"file:{p}?mode=ro",uri=True,timeout=2)
          c.execute("PRAGMA query_only=ON")
          mode,orders=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()
          print(f"{mode}|{orders}")
          PY
          )"
          echo "PRE_STATE=$pre_state"
          test "$pre_state" = "PRODUCTION_PAPER|0"

          observer_before="$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}|{{.Image}}' porota_production_observer)"
          dashboard_before="$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}|{{.Image}}' porota_production_dashboard)"
          approval_before="$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}|{{.Image}}' porota_critical_approval_rc6)"
          echo "OBSERVER_BEFORE=$observer_before"
          echo "DASHBOARD_BEFORE=$dashboard_before"
          echo "APPROVAL_BEFORE=$approval_before"
          [[ "$observer_before" == running\|false\|* ]]
          [[ "$dashboard_before" == running\|false\|* ]]
          [[ "$approval_before" == running\|false\|* ]]

          ppi_before="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          printf 'PPI_WATCH_BEFORE=%s\n' "$ppi_before"

          echo "=== TMP_CANDIDATES_OLDER_7D ==="
          sudo -n python3 - <<'PY'
          import os,time
          from pathlib import Path
          now=time.time()
          root=Path("/tmp")
          rows=[]
          for p in root.iterdir():
              n=p.name
              if not (n.startswith("porota") or n.startswith("rc6")):
                  continue
              try:
                  st=p.stat()
              except OSError:
                  continue
              if now-st.st_mtime <= 7*86400:
                  continue
              total=0
              try:
                  if p.is_file():
                      total=st.st_size
                  elif p.is_dir():
                      for d,_,fs in os.walk(p,followlinks=False):
                          for f in fs:
                              q=Path(d)/f
                              try:
                                  if not q.is_symlink():
                                      total+=q.stat().st_size
                              except OSError:
                                  pass
              except OSError:
                  pass
              rows.append((total,st.st_mtime,str(p)))
          for sz,mt,p in sorted(rows,reverse=True):
              print(f"CANDIDATE|{sz}|{time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(mt))}|{p}")
          print(f"CANDIDATE_TOTAL_BYTES={sum(x[0] for x in rows)}")
          print(f"CANDIDATE_COUNT={len(rows)}")
          PY

          open_tmp="$(sudo -n lsof -nP 2>/dev/null | awk '$0 ~ /\/tmp\/(porota|rc6)/ {print}' || true)"
          if [ -n "$open_tmp" ]; then
            echo "TMP_OPEN_REFERENCES_DETECTED=YES"
            echo "$open_tmp"
            exit 41
          fi
          echo "TMP_OPEN_REFERENCES_DETECTED=NO"

          echo "=== DELETE_TMP_OLDER_7D ==="
          sudo -n python3 - <<'PY'
          import os,shutil,time
          from pathlib import Path
          now=time.time()
          deleted=[]
          for p in list(Path("/tmp").iterdir()):
              n=p.name
              if not (n.startswith("porota") or n.startswith("rc6")):
                  continue
              try:
                  st=p.stat()
              except OSError:
                  continue
              if now-st.st_mtime <= 7*86400:
                  continue
              try:
                  if p.is_dir() and not p.is_symlink():
                      shutil.rmtree(p)
                  else:
                      p.unlink()
                  deleted.append(str(p))
              except FileNotFoundError:
                  pass
          print(f"TMP_DELETED_COUNT={len(deleted)}")
          for p in deleted:
              print(f"TMP_DELETED={p}")
          PY

          echo "=== APT_CLEAN ==="
          sudo -n apt-get clean
          sudo -n find /var/lib/apt/lists -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo "APT_CLEAN=GREEN"

          echo "=== JOURNAL_VACUUM ==="
          sudo -n journalctl --vacuum-size=512M
          echo "JOURNAL_VACUUM=GREEN"

          tmp_after="$(sudo -n du -x -s -B1 /tmp 2>/dev/null | awk '{print $1+0}')"
          apt_lists_after="$(sudo -n du -x -s -B1 /var/lib/apt/lists 2>/dev/null | awk '{print $1+0}')"
          apt_cache_after="$(sudo -n du -x -s -B1 /var/cache/apt 2>/dev/null | awk '{print $1+0}')"
          journal_after="$(sudo -n journalctl --disk-usage 2>&1 | tr '\n' ' ')"
          disk_after="$(df -PB1 / | awk 'NR==2 {print $4}')"

          echo "TMP_AFTER=$tmp_after"
          echo "APT_LISTS_AFTER=$apt_lists_after"
          echo "APT_CACHE_AFTER=$apt_cache_after"
          echo "JOURNAL_AFTER=$journal_after"
          echo "DISK_AFTER=$disk_after"
          echo "SPACE_RECOVERED=$((disk_after-disk_before))"

          post_state="$(sudo -n timeout 15 python3 - "$DB" <<'PY'
          import sqlite3,sys
          p=sys.argv[1]
          c=sqlite3.connect(f"file:{p}?mode=ro",uri=True,timeout=2)
          c.execute("PRAGMA query_only=ON")
          mode,orders=c.execute("SELECT mode,real_orders_sent FROM observer_state WHERE id=1").fetchone()
          c.close()
          print(f"{mode}|{orders}")
          PY
          )"
          echo "POST_STATE=$post_state"
          test "$post_state" = "$pre_state"

          observer_after="$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}|{{.Image}}' porota_production_observer)"
          dashboard_after="$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}|{{.Image}}' porota_production_dashboard)"
          approval_after="$(sudo -n docker inspect -f '{{.State.Status}}|{{.State.OOMKilled}}|{{.RestartCount}}|{{.Image}}' porota_critical_approval_rc6)"
          echo "OBSERVER_AFTER=$observer_after"
          echo "DASHBOARD_AFTER=$dashboard_after"
          echo "APPROVAL_AFTER=$approval_after"
          test "$observer_after" = "$observer_before"
          test "$dashboard_after" = "$dashboard_before"
          test "$approval_after" = "$approval_before"

          ppi_after="$(
            for unit in $(systemctl list-unit-files --no-legend 2>/dev/null | awk 'tolower($1) ~ /ppi/ && tolower($1) ~ /watch/ {print $1}' | sort); do
              printf '%s|%s|%s\n' "$unit" "$(systemctl is-enabled "$unit" 2>/dev/null || true)" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
          )"
          test "$ppi_after" = "$ppi_before"
          echo "PPI_WATCH_UNTOUCHED=GREEN"

          test "$disk_after" -gt "$disk_before"
          test "$disk_after" -ge 6442450944

          echo "REAL_ORDERS_SENT=0"
          echo "REAL_ORDER_ROUTES=NOT_CALLED"
          echo "DEPLOY_OWNER=RELEASED"
          echo "POROTA_SAFE_CLEANUP=GREEN"
          REMOTE

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-disk-cleanup-phase1-${{ github.sha }}
          path: ${{ runner.temp }}/rc6-disk-cleanup-phase1.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup runner key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/porota_rc6_cleanup"
