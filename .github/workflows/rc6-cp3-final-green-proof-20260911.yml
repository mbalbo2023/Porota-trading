name: RC6 CP3 Final Green Proof 2026-09-11

on:
  push:
    branches: [fix/rc6-w10-sector-map-binding-20260910]
    paths: [.github/workflows/rc6-cp3-final-green-proof-20260911.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HOST_SHA: e47eeffcb94a9468ac7e7f610beee0869353a77e

jobs:
  cp3_final:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Prove CP3 materialization freshness and safety
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET='$TARGET_HOST_SHA' bash -s" <<'HOST'
          set -Eeuo pipefail
          ROOT=/opt/porota-trading
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET"
          echo HOST_HEAD="$TARGET"
          echo '--- EFFECTIVE CE WIRING ---'
          UNIT="$(sudo -n systemctl cat porota-contract-evidence-rc6.service --no-pager)"
          printf '%s\n' "$UNIT" | grep -F 'porota-contract-evidence-rc6-with-dom.sh'
          sudo -n systemctl is-enabled porota-contract-evidence-rc6.timer >/dev/null
          echo CP3_TIMER_ENABLED=YES
          echo '--- DB FRESHNESS/SAFETY ---'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3,json
          from datetime import datetime,timezone
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.row_factory=sqlite3.Row; c.execute('pragma query_only=on')
          r=c.execute('select mode,session_state,real_orders_sent from observer_state where id=1').fetchone()
          ce=c.execute("select count(*) n,max(observed_at) mx from contract_evidence_v2_current where source_class='PPI_AUTHENTICATED_WEB'").fetchone()
          fam=[x[0] for x in c.execute("select distinct family from contract_evidence_v2_current where source_class='PPI_AUTHENTICATED_WEB' order by family")]
          c.close()
          mx=ce['mx'] if ce else None
          age=None
          if mx:
              dt=datetime.fromisoformat(mx.replace('Z','+00:00'))
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()
          out={'mode':r['mode'] if r else None,'session':r['session_state'] if r else None,'orders':r['real_orders_sent'] if r else None,'web_rows':ce['n'] if ce else 0,'web_max_observed':mx,'freshness_age_seconds':age,'families':fam}
          print(json.dumps(out,default=str))
          assert r and r['mode']=='PRODUCTION_PAPER' and int(r['real_orders_sent'] or 0)==0
          assert ce and int(ce['n'] or 0)>=1 and mx
          assert age is not None and age <= 1800
          assert {'FUTUROS','LICITACIONES','OPCIONES'} & set(fam)
          print('CP3_MATERIALIZATION=GREEN')
          print('CP3_FRESHNESS=GREEN')
          print('CP3_SAFETY=GREEN')
          print('REAL_ORDERS_SENT=0')
          PY
          echo CP3_FINAL=GREEN
          HOST
