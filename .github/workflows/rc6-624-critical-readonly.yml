name: RC6 624 critical admission read-only RCA
on:
  push:
    branches:
      - diag/rc6-624-critical-readonly-20261020
    paths:
      - .github/workflows/rc6-624-critical-readonly.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_probe"
          chmod 600 "$HOME/.ssh/rc6_probe"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect only the three RC6 container admission predicates
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/rc6_probe" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" 'sudo -n python3 -' <<'REMOTE'
          import json, subprocess
          names=('porota_production_observer','porota_production_dashboard','porota_critical_approval_rc6')
          values={}
          for name in names:
              result=subprocess.run(['docker','inspect',name],capture_output=True,text=True,timeout=15,check=True)
              data=json.loads(result.stdout)[0]
              state=data['State']
              values[name]={'image':data['Image'],'status':state['Status'],
                            'health':state.get('Health',{}).get('Status'),
                            'oom':state['OOMKilled'],'exit_code':state['ExitCode'],
                            'restart_count':data['RestartCount']}
          critical=values[names[2]]
          print(json.dumps({'schema':'RC6_624_CRITICAL_ADMISSION_READONLY',
                            'containers':values,
                            'predicates':{'critical_running':critical['status']=='running',
                              'critical_healthy':critical['health']=='healthy',
                              'critical_no_oom':critical['oom'] is False,
                              'critical_same_image_as_observer':critical['image']==values[names[0]]['image']}},
                           sort_keys=True))
          REMOTE
      - name: Verify critical issues-only capability read-only
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/rc6_probe" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" "sudo -n docker exec porota_critical_approval_rc6 python -c 'from fm_critical_approval_unix_runtime_rc6 import UnixGithubIssuesClient; h=UnixGithubIssuesClient().health(); assert h.get(\"status\")==\"ok\" and h.get(\"capability\")==\"issues_only\"; print(\"RC6_CRITICAL_ISSUES_ONLY=GREEN\")'"
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/rc6_probe"
