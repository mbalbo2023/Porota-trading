name: Porota RC6 temporary read-only PPI YMCID probe
on:
  push:
    branches:
      - audit/rc6-iol-decision-demand-20260921
    paths:
      - 'ppi-ymcid-trigger-20260921.txt'
permissions:
  contents: read
jobs:
  ppi-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read PPI through production droplet observer guard
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/audit_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/audit_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/audit_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" 'bash -s' <<'HOST'
          set -Eeuo pipefail
          echo 'AUDIT=PPI_YMCID_READONLY'
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sys,time,json
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          sys.path.insert(0,"/app")
          from bf_production_paper_observer import _secret
          from bd_ppi_readonly_guard import ProductionMarketReader
          ALLOW={"ticker","symbol","type","instrument_type","instrumenttype","market","currency","currencycode","settlement","settlementtype","description","name","isin","price","last","date","datetime","tradetime","bid","ask","volume","nominal","minnominal","bidvolume","askvolume"}
          def pick(value):
              if isinstance(value,dict):
                  out={k:v for k,v in value.items() if str(k).lower() in ALLOW}
                  for name in ("bids","asks","buy","sell"):
                      v=value.get(name)
                      if isinstance(v,list): out[name]=[{k:x[k] for k in x if str(k).lower() in ALLOW} if isinstance(x,dict) else str(type(x).__name__) for x in v[:3]]
                  return out
              return {"type":type(value).__name__}
          def rows(value):
              return value if isinstance(value,list) else ([] if value is None else [value])
          at=datetime.now(ZoneInfo("America/Argentina/Buenos_Aires"))
          print("PPI_AUDIT_ART_AT="+at.isoformat())
          reader=None
          try:
              key,secret=_secret()
              reader=ProductionMarketReader(key,secret,audit=None)
              reader.login_once()
              print("PPI_LOGIN=OK")
              cfg=reader.market_configuration()
              types=cfg.get("instrument_types",[])
              settlements=cfg.get("settlements",[])
              print("PPI_TYPE_OPTIONS="+json.dumps([x for x in types if x.upper() in {"ON","BONOS","BONO"}]))
              print("PPI_SETTLEMENT_OPTIONS="+json.dumps([x for x in settlements if x.upper() in {"INMEDIATA","A-24HS","A-48HS","A-72HS"}]))
              query_types=[x for x in ("ON","BONOS","BONO") if x in types]
              found=[]
              for t in query_types:
                  try:
                      result=reader.search_instruments("YMCID",t,name="YMCID",market="BYMA")
                      data=rows(result)
                      print("PPI_SEARCH_"+t+"_COUNT="+str(len(data)))
                      if data: print("PPI_SEARCH_"+t+"_SAMPLE="+json.dumps(pick(data[0]),default=str,sort_keys=True))
                      found.extend((t,x) for x in data)
                  except Exception as e: print("PPI_SEARCH_"+t+"_ERROR="+type(e).__name__)
                  time.sleep(0.3)
              if not query_types: print("PPI_SEARCH=BLOCKED_NO_CONFIGURED_BOND_TYPE")
              selected=[x for x in ("A-24HS","A-48HS","INMEDIATA") if x in settlements]
              instrument_type=next((t for t,x in found),"ON" if "ON" in types else "BONOS" if "BONOS" in types else None)
              if instrument_type and selected:
                  for settle in selected[:2]:
                      for label,call in (("CURRENT",lambda:reader.current("YMCID",instrument_type,settle)),("BOOK",lambda:reader.book("YMCID",instrument_type,settle))):
                          try:
                              value=call(); data=rows(value)
                              print("PPI_"+label+"_"+settle.replace("-","_")+"_COUNT="+str(len(data)))
                              if data: print("PPI_"+label+"_"+settle.replace("-","_")+"_SAMPLE="+json.dumps(pick(data[0]),default=str,sort_keys=True))
                          except Exception as e: print("PPI_"+label+"_"+settle.replace("-","_")+"_ERROR="+type(e).__name__)
                          time.sleep(0.3)
                  if "A-24HS" in selected:
                      try:
                          end=datetime(2026,9,22)
                          hist=rows(reader.history("YMCID",instrument_type,"A-24HS",end-timedelta(days=365),end))
                          print("PPI_HISTORY_A_24HS_COUNT="+str(len(hist)))
                          if hist:
                              print("PPI_HISTORY_FIRST="+json.dumps(pick(hist[0]),default=str,sort_keys=True))
                              print("PPI_HISTORY_LAST="+json.dumps(pick(hist[-1]),default=str,sort_keys=True))
                      except Exception as e: print("PPI_HISTORY_ERROR="+type(e).__name__)
              else: print("PPI_MARKET_READS=BLOCKED_NO_VALID_TYPE_OR_SETTLEMENT")
              print("PPI_ESTIMATE=NOT_CALLED_READONLY_GUARD_HAS_NO_ESTIMATE_ROUTE")
              print("PPI_READER_METRICS="+json.dumps(reader.metrics,sort_keys=True))
          except Exception as e:
              print("PPI_PROBE_ERROR="+type(e).__name__)
              if reader is not None: print("PPI_READER_METRICS="+json.dumps(reader.metrics,sort_keys=True))
          finally:
              if reader is not None: reader.close()
          PY
          HOST
