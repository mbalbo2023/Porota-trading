name: RC6 MultiSource Evidence Runtime Readonly

on:
  push:
    branches:
      - audit/rc6-no-trades-source-cascade-20260925
    paths:
      - .github/workflows/rc6-multisource-evidence-runtime-readonly-20260925.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare strict SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Read multi-source evidence ledger
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST"             "sudo -n python3 - <<'PY'
import json
from pathlib import Path
p=Path('/opt/porota-trading/data/market/rc6_instrument_evidence_latest.json')
print('EVIDENCE_EXISTS='+str(p.exists()).upper())
if p.exists():
    x=json.loads(p.read_text())
    print('EVIDENCE_GENERATED_AT='+str(x.get('generated_at')))
    print('EVIDENCE_SOURCE_ORDER='+str(x.get('source_order')))
    print('EVIDENCE_UNIVERSE='+json.dumps(x.get('universe') or {},sort_keys=True))
    print('EVIDENCE_COUNTS='+json.dumps(x.get('counts') or {},sort_keys=True))
    print('EVIDENCE_FAMILIES='+json.dumps(x.get('families') or [],sort_keys=True))
    print('EVIDENCE_DECISION_EFFECT='+str(x.get('decision_effect')))
    print('EVIDENCE_PAPER_SHADOW_ONLY='+str(x.get('paper_shadow_only')))
    print('EVIDENCE_REAL_MONEY_AUTHORIZED='+str(x.get('real_money_authorized')))
PY"

      - name: PAPER safety
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -Eeuo pipefail
          STATE="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "sudo -n docker exec porota_production_observer python -c \"import sqlite3;c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True);c.execute('PRAGMA query_only=ON');print('|'.join(map(str,c.execute('SELECT mode,real_orders_sent FROM observer_state WHERE id=1').fetchone())));c.close()\"")"
          echo "POST_SAFETY=$STATE"
          test "$STATE" = "PRODUCTION_PAPER|0"
          echo "RC6_MULTISOURCE_EVIDENCE_AUDIT=GREEN"
