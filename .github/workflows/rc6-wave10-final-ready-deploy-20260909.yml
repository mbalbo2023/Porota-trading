name: RC6 Wave10 Final Ready Deploy 2026-09-09
on:
  push:
    branches: [deploy-prep/rc6-wave10-currentbase-20260909]
    paths: ['.github/workflows/rc6-wave10-final-ready-deploy-20260909.yml']
permissions:
  contents: read
jobs:
  ready-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Binding sector policy certification
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q pytest
          python -m py_compile ck_policy_gate_hf6.py porota_mode_manager.py
          PYTHONPATH=. pytest -q tests/test_rc6_wave10_sector_binding_default.py
          PYTHONPATH=. python - <<'PY'
          import ck_policy_gate_hf6 as g
          import porota_mode_manager as m
          assert g.active_policies()['sector_concentration']=='BINDING'
          assert m.paper_settings({})['PAPER_SECTOR_CONCENTRATION_POLICY']=='BINDING'
          at_limit=g.evaluate(sectors={'groups':[{'sector':'BANKS','open_positions':2}]},candidate_sector='BANKS',sector_limit=2)
          missing=g.evaluate(sectors=None,candidate_sector=None,sector_limit=2)
          below=g.evaluate(sectors={'groups':[{'sector':'ENERGY','open_positions':1}]},candidate_sector='ENERGY',sector_limit=2)
          assert at_limit['execute_block'] and at_limit['verdict']=='SECTOR_CONCENTRATION_LIMIT_BANKS'
          assert missing['execute_block'] and missing['evidence_block'] and missing['verdict']=='SECTOR_UNMAPPED_BINDING'
          assert not below['execute_block']
          print('SECTOR_BINDING=PROVEN_FAIL_CLOSED')
          PY
          ! grep -REn 'send_order|place_order|cancel_order|api/Orders|/Operar/' ck_policy_gate_hf6.py porota_mode_manager.py
          echo "CERTIFIED_SOURCE_SHA=${GITHUB_SHA}"
      - name: Prepare strict SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/w10ready"
          chmod 600 "$HOME/.ssh/w10ready"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only live exact-SHA proof
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/w10ready" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DO_USER@$DO_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/porota-trading
          LIVE=9197aedf35fe1739b594c742902e80df069c47c9
          test "$(git rev-parse HEAD)" = "$LIVE"
          OBS=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)
          DASH=$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)
          sudo -n docker exec -i porota_production_observer python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/data/paper_v17/observer_v17.db?mode=ro',uri=True); c.execute('pragma query_only=on')
          q=c.execute('pragma quick_check').fetchone()[0]; m,r=c.execute('select mode,real_orders_sent from observer_state where id=1').fetchone(); c.close()
          print(f'DB={q}|MODE={m}|REAL_ORDERS={r}'); assert q=='ok' and m=='PRODUCTION_PAPER' and int(r)==0
          PY
          git fetch --no-tags origin deploy-prep/rc6-wave10-currentbase-20260909
          test "$(git rev-parse origin/deploy-prep/rc6-wave10-currentbase-20260909)" = "$TARGET_SHA"
          test "$OBS" = "$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_observer)"
          test "$DASH" = "$(sudo -n docker inspect -f '{{.Id}}|{{.State.Running}}|{{.RestartCount}}' porota_production_dashboard)"
          test "$(git rev-parse HEAD)" = "$LIVE"
          echo "CERTIFIED_SOURCE_SHA=$TARGET_SHA"
          echo 'ORDER_ROUTES=NOT_CALLED'
          echo 'RUNTIME_CHANGED=NO'
          echo 'W10_READY_DEPLOY=YES'
          REMOTE
