name: RC5 - leer History Freshness V4

on:
  push:
    branches:
      - audit/rc5-history-v4-readonly-20260905

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
    steps:
      - name: Preparar SSH estricto
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_HOST"; test -n "$DO_USER"; test -n "$DO_SSH_KEY"; test -n "$DO_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Leer sólo resultado existente
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          REPO=/opt/porota-trading
          SRC="$HOME/POROTA_HISTORY_FRESHNESS_V4_NOHUP.out"
          PIDFILE="$HOME/POROTA_HISTORY_FRESHNESS_V4_NOHUP.pid"
          test "$(git -C "$REPO" branch --show-current)" = 'release/v17.0.0-rc4-hf2'
          test "$(git -C "$REPO" rev-parse HEAD)" = '7284fbb5c651ff548ab911e7829b740c42b4b71f'
          echo 'POROTA HISTORY FRESHNESS V4 RETRIEVAL'
          echo 'ACTION=READ_EXISTING_OUTPUT_ONLY'
          echo 'NETWORK_CALLS=0'
          echo 'RUNTIME_CHANGED=NO'
          [ -f "$SRC" ] || { echo 'STATUS=ERROR_OUTPUT_NOT_FOUND'; exit 20; }
          PID="$(cat "$PIDFILE" 2>/dev/null || true)"
          PSTAT="$(ps -p "$PID" -o stat= 2>/dev/null | tr -d ' ' || true)"
          echo "PID=${PID:-UNKNOWN}"
          echo "PROCESS_STATE=${PSTAT:-FINISHED_OR_UNKNOWN}"
          awk '
          /^STATUS=/ ||
          /^DB_QUICK_CHECK=/ ||
          /^HISTORY_DB_QUICK_CHECK=/ ||
          /^OBSERVER_STATE=/ ||
          /^CALENDAR_SOURCE=/ ||
          /^STORE_LATEST_DATE=/ ||
          /^WINDOW_CUTOFFS=/ ||
          /^TARGET_TOTAL=/ ||
          /^DEPTH_COUNTS=/ ||
          /^FRESHNESS_COUNTS=/ ||
          /^READINESS_COUNTS=/ ||
          /^DEPTH_X_FRESHNESS=/ ||
          /^HISTORY_FRESH_GE30=/ ||
          /^HISTORY_FRESH_GE90=/ ||
          /^HISTORY_FRESH_GE180=/ ||
          /^STALE_GE90_COUNT=/ ||
          /^ANOMALY_COUNT=/ {print; next}
          /^STALE_GE90_BEGIN$/ {p=1; print; next}
          p {print; if ($0=="STALE_GE90_END") p=0; next}
          /^ANOMALY_SUMMARY_BEGIN$/ {a=1; print; next}
          a {print; if ($0=="ANOMALY_SUMMARY_END") a=0}
          ' "$SRC"
          echo 'REAL_ORDERS_SENT=0'
          REMOTE
