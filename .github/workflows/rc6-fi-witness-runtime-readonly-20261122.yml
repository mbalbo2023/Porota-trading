name: RC6 verify installed PAPER sale authority without provider traffic
on:
  push:
    branches: [diagnostic/rc6-fi-witness-runtime-readonly-20261122]
    paths:
      - .github/workflows/rc6-fi-witness-runtime-readonly-20261122.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'mbalbo2023/Porota-trading' && github.actor == 'mbalbo2023'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223725e2860b295533d480d6ad24aee46f098b8e
          persist-credentials: false
      - name: Verify receipt-bound observer, policy pins and the read-only decision ledger
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.porota_actions_host import connection,ssh_run
          source="import json,os,re,subprocess\nfrom pathlib import Path\nuid=os.getuid()\nassert uid>0 and uid==os.geteuid()\nmarker=json.loads(Path(\"/opt/porota-trading/data/deploy/CURRENT_STATE_V2.json\").read_text())\nassert marker[\"deployment_sha\"]==\"223725e2860b295533d480d6ad24aee46f098b8e\" and marker[\"real_orders_sent\"]==0\nsocket=Path(f\"/run/user/{uid}/porota-rc6-docker.sock\")\nassert socket.is_socket() and not socket.is_symlink()\ncommand=[\"/usr/bin/docker\",\"--host\",f\"unix://{socket}\"]\nobserver=subprocess.run(command+[\"ps\",\"--no-trunc\",\"--filter\",\"label=io.porota.project=rc6\",\"--filter\",\n                                     \"label=io.porota.role=observer\",\"--format\",\"{{.ID}}\"],\n                        check=True,capture_output=True,text=True,timeout=8).stdout.splitlines()\nassert len(observer)==1 and re.fullmatch(r\"[0-9a-f]{64}\",observer[0])\noutput=subprocess.run(command+[\"exec\",\"-i\",observer[0],\"python\",\"-B\",\"-\"],\n                      input=\"import ast,datetime,hashlib,json,os\\nfrom pathlib import Path\\nimport re,sqlite3\\nassert os.getenv(\\\"POROTA_BUILD_SHA\\\")==\\\"f368d498d91e5cb542ef45e3511163b9de67a6c9\\\"\\nassert os.getenv(\\\"DASHBOARD_OPERATION_MODE\\\")==\\\"PRODUCTION_PAPER\\\"\\nassert os.getenv(\\\"REAL_ORDER_CAPABILITY\\\")==\\\"BLOCKED\\\" and os.getenv(\\\"EXECUTION_MODE\\\")==\\\"SIMULATION\\\"\\ndb=Path(\\\"/app/data/paper_v17/observer_v17.db\\\")\\nassert os.getenv(\\\"PAPER_V17_DB_PATH\\\")==str(db)\\nguard=ast.parse(Path(\\\"/app/rc6_paper_causal_decision_receipt.py\\\").read_text())\\nwanted={\\\"PINNED_DECISION_SIGNER_KEY_SHA256\\\",\\\"PINNED_RELEASE_SHA256\\\"}\\npins={}\\nfor node in guard.body:\\n    if isinstance(node,ast.AnnAssign) and isinstance(node.target,ast.Name) and node.target.id in wanted:\\n        pins[node.target.id]=isinstance(node.value,ast.Constant) and isinstance(node.value.value,str)\\nassert set(pins)==wanted\\nruntime=ast.parse(Path(\\\"/app/bv_paper_runtime.py\\\").read_text())\\nprovider=any(isinstance(node,ast.keyword) and node.arg==\\\"market_sale_witness\\\" for node in ast.walk(runtime))\\npolicy_path=Path(os.getenv(\\\"POROTA_FI_EVIDENCE_DIRECTORY\\\",str(db.parent/\\\"fixed-income-evidence\\\")))/\\\"market-sale-policy.json\\\"\\npin=os.getenv(\\\"POROTA_FI_MARKET_SALE_POLICY_SHA256\\\",\\\"\\\")\\npresent=policy_path.is_file() and not policy_path.is_symlink()\\ndigest_ok=False\\nif present and policy_path.stat().st_size<=131072 and re.fullmatch(r\\\"[a-f0-9]{64}\\\",pin):\\n    digest_ok=hashlib.sha256(policy_path.read_bytes()).hexdigest()==pin\\nwith sqlite3.connect(db.as_uri()+\\\"?mode=ro\\\",uri=True,timeout=.5) as sql:\\n    sql.execute(\\\"PRAGMA query_only=ON\\\")\\n    sql.set_progress_handler(lambda: int(__import__(\\\"time\\\").monotonic()>limit),1000)\\n    limit=__import__(\\\"time\\\").monotonic()+2\\n    assert sql.execute(\\\"SELECT real_orders_sent FROM observer_state\\\").fetchone()==(0,)\\n    intent=sql.execute(\\\"SELECT count(*) FROM (SELECT 1 FROM paper_causal_decision_freezes WHERE decision_key LIKE 'FI_SELL:%' LIMIT 1001)\\\").fetchone()[0]\\n    receipt=sql.execute(\\\"SELECT count(*) FROM (SELECT 1 FROM paper_causal_decision_receipts WHERE decision_key LIKE 'FI_SELL:%' LIMIT 1001)\\\").fetchone()[0]\\nprint(json.dumps({\\\"source_sha\\\":os.getenv(\\\"POROTA_BUILD_SHA\\\"),\\\"mode\\\":\\\"PRODUCTION_PAPER\\\",\\n    \\\"real_orders_sent\\\":0,\\\"provider_requests\\\":0,\\\"writes\\\":0,\\\"pins\\\":pins,\\\"broker_witness_injected\\\":provider,\\n    \\\"sale_policy_present\\\":present,\\\"sale_policy_pin_present\\\":bool(re.fullmatch(r\\\"[a-f0-9]{64}\\\",pin)),\\n    \\\"sale_policy_digest_valid\\\":digest_ok,\\\"bounded_fi_sell_intents\\\":intent,\\\"bounded_fi_sell_receipts\\\":receipt,\\n    \\\"observed_at\\\":datetime.datetime.now(datetime.timezone.utc).isoformat()},sort_keys=True))\\n\",check=True,capture_output=True,text=True,timeout=12)\nreport=json.loads(output.stdout)\nreport[\"deployment_sha\"]=marker[\"deployment_sha\"]\nprint(json.dumps(report,sort_keys=True))\n"
          with connection(os.environ) as (ssh,_,_):
              output=ssh_run(ssh,['/usr/bin/python3','-B','-'],data=source.encode(),timeout=30)
          if output.returncode:
              raise SystemExit("FI_SALE_RUNTIME_RECEIPT_UNVERIFIED")
          receipt=json.loads(output.stdout)
          print(json.dumps(receipt,sort_keys=True))
          Path(os.environ["RUNNER_TEMP"],"fi-sale-authority-runtime.json").write_text(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fi-sale-authority-runtime
          path: ${{ runner.temp }}/fi-sale-authority-runtime.json
          if-no-files-found: error
          retention-days: 14
