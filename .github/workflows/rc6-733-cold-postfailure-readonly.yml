name: RC6 733 COLD postfailure read-only diagnosis

on:
  push:
    branches:
      - diagnostic/rc6-733-cold-postfailure-20261025
    paths:
      - .github/workflows/rc6-733-cold-postfailure-readonly.yml

permissions:
  contents: read

concurrency:
  group: rc6-unified-paper-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
      CANDIDATE_SHA: 26a95f734cb9eece72e89a1d084c7006a1e05fa2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bounded COLD receipt and barrier read-only snapshot
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          python3 -m py_compile scripts/rc6_733_cold_postfailure_readonly.py
          test -n "$DO_HOST" && test -n "$DO_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/rc6_733_cold_readonly"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rc6_733_cold_readonly" "$HOME/.ssh/known_hosts"
          PROBE_B64="$(base64 -w0 scripts/rc6_733_cold_postfailure_readonly.py)"
          timeout 45 ssh -i "$HOME/.ssh/rc6_733_cold_readonly" \
            -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DO_USER@$DO_HOST" \
            "sudo -n env PYTHONDONTWRITEBYTECODE=1 timeout 20 python3 -c 'import base64;exec(base64.b64decode(\"$PROBE_B64\"))' '$CANDIDATE_SHA'"
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/rc6_733_cold_readonly"
