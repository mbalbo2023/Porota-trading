# ============================================================================
# docker-compose.yml - Legacy monolithic stack (stable RC6 default)
# ============================================================================
# Uso limitado a SANDBOX y tooling de compatibilidad. Este compose no es el
# contrato canónico de PRODUCTION_PAPER.
# PRODUCTION_PAPER usa el runtime split de porota_mode_manager.py:
#   porota_production_observer  -> bv_paper_runtime.py (read-only)
#   porota_production_dashboard -> o_dashboard.py (sin credenciales PPI)
# Por defecto usa la imagen estable RC6; POROTA_IMAGE permite un override
# explícito y acotado para tooling. No ejecutar ambos caminos simultáneamente.
#
# La configuracion NO se inyecta con `env_file:`. El proceso la lee con
# load_dotenv() desde /app/.env, que se monta como volumen desde el host: asi
# el editor del panel escribe sobre el archivo REAL del servidor y el proceso
# nuevo, al reiniciar, lee esos valores. (Compose sigue leyendo ./.env por su
# cuenta para resolver la interpolacion de ${DASHBOARD_PORT} de mas abajo.)
services:
  bot:
    init: true
    stop_grace_period: 45s
    build: .
    # Nombre explicito: permite auditar y promover exactamente la misma
    # imagen en CI, Sandbox y produccion, sin depender del nombre del directorio.
    image: ${POROTA_IMAGE:-porota-trading-bot:17.0.0-rc6}
    container_name: porota_trading_bot
    restart: unless-stopped
    # Todo el sistema de archivos de la imagen queda inmutable. Solo los
    # montajes declarados abajo y los tmpfs pueden recibir escrituras.
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /home/botuser/.cache
      MPLCONFIGDIR: /tmp/matplotlib
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/botuser/.config:rw,noexec,nosuid,size=16m
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ./sre_vector_db:/app/sre_vector_db
      # Modelos descargables sobreviven a cada recreación sin escribirse
      # dentro de la capa inmutable de la imagen.
      - ./model_cache:/home/botuser/.cache
    ports:
      # CORREGIDO EN v16.2 - dos problemas en una sola linea.
      #
      # 1) El puerto interno estaba fijo en 8000 mientras la aplicacion tomaba
      #    el suyo de DASHBOARD_PORT: cambiar esa variable desacoplaba el mapeo
      #    y el panel dejaba de ser alcanzable sin que nada avisara. Ahora los
      #    dos lados del mapeo salen de la misma variable.
      #
      # 2) Se publica SOLO en el loopback del host. El panel no queda expuesto
      #    a internet por el mapeo de Docker: quien lo publique hacia afuera
      #    tiene que hacerlo a proposito, por el reverse proxy con TLS. Ojo con
      #    esto: Docker escribe reglas de iptables por debajo de ufw, asi que
      #    un mapeo "0.0.0.0" abre el puerto AUNQUE ufw lo tenga cerrado. El
      #    prefijo 127.0.0.1 es la unica forma confiable de que no pase.
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:${DASHBOARD_PORT:-8000}"
    depends_on:
      init_permissions:
        # Los bind mounts nacen como root:root en un host nuevo. Este init
        # termina antes de arrancar el bot y cede solo los directorios de datos.
        condition: service_completed_successfully
    networks:
      - porota_bot_net
    # Endurecimiento del contenedor (v16.2).
    security_opt:
      # Impide que un proceso adentro gane privilegios via binarios setuid.
      - no-new-privileges:true
    cap_drop:
      # El bot no necesita ninguna capability del kernel: hace HTTP, escribe
      # archivos y habla SQLite.
      - ALL
    deploy:
      resources:
        limits:
          memory: 1536M
          # Evita que un bug o proceso comprometido agote la tabla de procesos
          # del Droplet. Se usa la forma canónica del bloque deploy para no
          # duplicar el mismo límite con pids_limit en Docker Compose 5.x.
          pids: 256
    logging:
      # Sin esto, el log que captura Docker crece sin techo hasta llenar el
      # disco del Droplet. Es una de las formas mas comunes de tumbar un
      # servidor chico, y no la cubre la rotacion de logs del propio bot, que
      # solo rota SUS archivos y no el stdout.
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  init_permissions:
    # Reutiliza la misma imagen: no agrega software ni una version paralela.
    image: ${POROTA_IMAGE:-porota-trading-bot:17.0.0-rc6}
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        test ! -L /app/data/paper_v17 &&
        mkdir -p /app/data/logs /app/data/backups /app/data/proposals
        /app/data/paper_v17
        /app/sre_vector_db /home/botuser/.cache &&
        test -d /app/data/paper_v17 &&
        test ! -L /app/data/paper_v17/observer_v17.db &&
        { test ! -e /app/data/paper_v17/observer_v17.db ||
        test -f /app/data/paper_v17/observer_v17.db; } &&
        chown 1000:1000 /app/data /app/data/paper_v17 &&
        chown -R 1000:1000 /app/data/logs /app/data/backups
        /app/data/proposals &&
        for f in /app/data/dashboard_sessions.json /app/data/trading_system.db
        /app/data/trading_system.db-wal /app/data/trading_system.db-shm
        /app/data/startup_state.json /app/data/config_presence.json
        /app/data/bot_runtime_state.json; do
        test ! -e "$$f" || chown 1000:1000 "$$f"; done &&
        chmod 750 /app/data/paper_v17 &&
        chown -R 1000:1000 /app/sre_vector_db /home/botuser/.cache &&
        chown 1000:1000 /app/.env &&
        chmod 600 /app/.env
    volumes:
      - ./data:/app/data
      - ./sre_vector_db:/app/sre_vector_db
      - ./model_cache:/home/botuser/.cache
      - ./.env:/app/.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

networks:
  porota_bot_net:
    driver: bridge
